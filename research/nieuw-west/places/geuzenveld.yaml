  nl:
    title: Slotermeerschool en de H-scholen van Slotermeer
    summary: Drie van de laatste Amsterdamse H-scholen, gangloze scholen waar van twee kanten licht en lucht binnenviel. Bij de Slotermeerschool een reliëf van Frits Sieger, bij De Kans een bronzen jongen met haan van Jan Wolkers.
    body: |
      Eén van de idealen van de naoorlogse scholenbouw was om een gangloze school te maken waar van twee kanten van het klaslokaal licht en lucht binnenvielen. De gemeente was ervan overtuigd dat de opgroeiende jeugd baat zou hebben bij 'gezonde' schoolgebouwen. De tuberculose maakte na de Tweede Wereldoorlog namelijk opnieuw veel slachtoffers. Deze H-scholen zijn de opvolgsters van de beroemde Eerste Openluchtschool voor het Gezonde Kind in de Cliostraat (1930) van Jan Duiker. De gebouwen verrezen volgens een door PW-architect J. Leupen ontwikkelde en door C. van der Wilk uitgewerkte opzet. Er zijn van dit type tien scholen gebouwd; daarna resteerden er nog vier.

      De voormalige Burgemeester Fockschool, nu de Slotermeerschool, is de gaafste van de reeks. De school valt op doordat ze naar achteren geschoven is ten opzichte van de rooilijn en midden in een brede, kindvriendelijke groenstrook ligt. De Burgemeester Röellschool aan de Thomas van Aquinostraat, nu SBO De Kans, is in 2011 uitgebreid met een nieuwe vleugel. De Burgemeester Rendorpschool aan de Herman de Manstraat is intern verbouwd voor onderwijs aan dove en slechthorende kinderen.

      Let op:
      - de ladderramen van de trappenhuizen, die van de grond tot aan de nok lopen;
      - bij de Slotermeerschool het reliëf van Frits Sieger: een jongen en een meisje die dansen, met duiven, vruchten, tarwe en zonnebloemen. "Drie duiven zijn 'uitgevlogen' en zijn als losse beelden tegen de wand geplaatst";
      - bij De Kans het bronzen beeld van een jongen met een haan op z'n hoofd, uit 1955, van Jan Wolkers. "Dit beeld leverde hem in 1956 de Sint-Lucas medaille op."
    attributes:
      original_use: Openbare lagere scholen
    sources:
      - Monumentenregister Amsterdam 225003, 200787 en 225005 (redengevende omschrijvingen)
      - https://nl.wikipedia.org/wiki/H-school
      - https://adambeeldenva1900.blogspot.com/2013/09/jan-wolkers-jongen-met-haan.html

- title: Nursery schools Het Waterhoentje and De Meerkoet
  summary: Two near-identical 1950s nursery schools named after water birds, with Limburg marl stone flowing from the porch into the hall. Light-and-air schools for toddlers, built just as the first Dutch nursery-school law came in.
  body: |
    Nursery schools were long the poor relation of Dutch education: the first law on them dates only from December 1955. In Slotermeer, kindergartens lagged behind the housing and children spent years in temporary buildings. In 1955–1956 Public Works finally built permanent ones, and these two, De Meerkoet (the coot) on the Jan de Louterstraat and Het Waterhoentje (the moorhen) on the Harry Koningsbergerstraat, went up at the same time to almost the same design. They were the first of a new series of permanent nursery schools; only three of the type were built.

    Like the H-schools for older children, they have no corridors: classrooms with big windows on both sides and a double play hall that a sliding wall can split in two. Rough Limburg marl stone runs from the porch into the hall, an early take on the idea, later championed by Aldo van Eyck and the magazine *Forum*, that inside and outside should flow into each other.

    Het Waterhoentje has housed the Islamic primary school Al Wafa since 2002; it stands on the axis of the Walraven van Hallweg, so you see it from far off. De Meerkoet now houses a school for young children who need extra care. Its neighbour, an H-school, was demolished in 2016–2017.

    Look for:
    - the pergola over the central entrance and the stepped wings either side;
    - the walls of rough marl stone;
    - the white window frames with blue-painted tilting panes, arranged like a Mondrian grid.
  category: schools
  lat: 52.380600
  lng: 4.836709
  address: Harry Koningsbergerstraat 30 (also Jan de Louterstraat 21)
  links:
