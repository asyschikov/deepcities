  nl:
    title: Boerderijwoningen van Dudok
    summary: "Zeven groene hofjes met witgekeimde ouderenwoningen van één laag, door W.M. Dudok neergelegd als een klein doolhof. Terwijl de modernisten het bejaardenhuisje vernieuwden, ging Dudok de andere kant op en liet het op een boerderij lijken."
    body: |
      Plat dak en strakke lijnen, zo hoorde een bejaardenwoning in de jaren vijftig eruit te zien. In Slotermeer hadden Aldo van Eyck en Jan Rietveld het oude huisje net tot moderne architectuur omgevormd, en hun versie werd overal in de naoorlogse wijken nagevolgd. Willem Marinus Dudok deed hier min of meer bewust het omgekeerde. Hij hield vast aan het traditionele type met een pannendak en gaf het met witgekeimde muren een bijna landelijk aanzien. Vandaar de bijnaam *boerderijwoningen*.

      Halverwege de jaren vijftig ontwierp Dudok een van de zes buurten van de nieuwe tuinstad Geuzenveld: flats, eengezinswoningen, winkels en 64 ouderenwoningen. De flats staan bekend als de Dudokhaken. De ouderenwoningen liggen midden in een groot veld eengezinshuizen aan de westrand van de wijk, in zeven hofjes met namen als Berlagehof, De Bazelhof en Michel de Klerkhof.

      Elk hofje bestaat uit twee lage stroken onder een flauw hellend dak van grijze Hollandse pannen. De noordkanten van de hofjes springen telkens tien meter ten opzichte van elkaar, dus nergens kijk je ver door, en het geheel voelt een beetje als een doolhof. Kunststof kozijnen hebben de details wat afgevlakt, maar het blijft heerlijk om door de hofjes te dwalen.

      Let op:
      - de bakstenen plint van zo'n 70 cm hoog, onder het witte keimwerk onbeschilderd gelaten;
      - de zeven hogere blokjes met een winkel op de hoek, een forse luifel en een vreemde deur met hijsbalk in de zuidgevel, omdat de verdieping als opslag voor de winkel diende;
      - huisnummers die van het ene hofje naar het volgende doorlopen;
      - *Stadsmuur West* (2010) van Rob Birza aan de Sam van Houtenstraat, een bakstenen 'stadsmuur' met nissen om uit te kijken, tussen de woningen en de voormalige kerk;
      - *Het Lover voor Dudok* (2010) van André Pielage, in roestvast staal, aan de Strackéstraat;
      - aan de Aalbersestraat bij de Ruys de Beerenbrouckstraat, naast sportpark De Eendracht, het bronzen *Eendracht* (1980) van Aart Lamberts: drie figuren als één, omdat één figuur hem te weinig krachtig leek.
    attributes:
      original_use: Ouderenwoningen, met winkels en bovenwoningen
    sources:
      - Monumentenregister Amsterdam 200792 (redengevende omschrijving)
      - https://dudok.org/alle-werken/woningen-in-geuzenveld-amsterdam-1953-1957/

- title: Van Tijen studio houses, Van Karnebeekstraat
  summary: "Six artists' studio homes behind a wall of glass on the polder edge. Willem van Tijen built a great many homes in Geuzenveld; ironically this small block for artists is the only one still recognisably his."
  body: |
    Willem van Tijen, a pioneer of Dutch modernism whose great passion was social housing, was brought in in 1953 to design one of the six neighbourhoods of Geuzenveld, now the Van Tijenbuurt. He built old people's homes, family houses and walk-up flats. The flats and old people's homes were demolished in the 2000s and the family houses renovated beyond recognition, so this little block of 1959, designed with M. Boom and J. Posno, is all that is left that you would recognise as his.

    It stands at the southwestern tip of Geuzenveld, by the Osdorper Binnenpolder, on a plot first meant for a school. The ground floor holds six studios that could be rented separately, each with its own door, toilet and kitchenette. Above them are six studio homes reached by a wide gallery at the back, with a double-height studio facing northwest, full of light and the bedrooms up an open stair. Studio homes were a rare type, born of the post-war idea that artists, too, deserved a proper place to live and work.

    Next door, on the Willem Mulierhof, are the linked villas of F.J.E. Dekeukeleire, who lived and kept his office there.

    Look for:
    - the northwest front: five slim brick piers between almost fully glazed timber frames;
    - the pale serrated concrete band separating studios from homes;
    - the concrete stairs against both blind side walls, leading to the gallery at the back.
