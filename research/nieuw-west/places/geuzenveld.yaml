  nl:
    title: Bejaardenwoningen van Van Eyck en Rietveld
    summary: Eenlaagse stroken bejaardenwoningen van 39 vierkante meter in de groenstrook naar de Sloterplas. Van Eyck en Rietveld maakten van de traditionele miniatuurhuisjes een toonbeeld van moderne architectuur.
    body: |
      Het complex bejaardenwoningen is bijzonder fraai gesitueerd in de brede groenstrook die vanaf brug 600 langs de Burgemeester Vening Meineszlaan naar de Burgemeester Eliasstraat voert, een wandelroute naar de Sloterplas. De woningen zijn losjes gerangschikt rond twee ruime hoven en in twee stroken langs de Bijleveldstraat. De Afdeling Stadsontwikkeling had een andere verkaveling getekend, maar het lukte Van Eyck met enige moeite om Van Eesteren te overtuigen.

      De bejaardenwoning werd in Amsterdam voor het eerst in 1926 gerealiseerd. Het waren traditioneel ogende miniatuurhuisjes onder een zadeldak met pannen, vandaar de naam Piggelmeewoningen. Van Eyck en Rietveld bouwden de eerste naoorlogse bejaardenwoningen en slaagden erin om deze kleine huisjes, 39 vierkante meter groot, te transformeren tot een toonbeeld van moderne architectuur met een mooie bijna vierkante plattegrond. Het geheel is zonder meer een hoogtepunt in de geschiedenis van de Nederlandse volkswoningbouw, dat zich zelfs kan meten met een mijlpaal als de minimumwoningen van Mart Stam in Frankfurt.

      Opeenvolgende onderhoudsbeurten hebben de oorspronkelijke detaillering schade toegebracht, maar het complex als geheel getuigt nog altijd van het humane gedachtegoed dat zo kenmerkend was voor de jaren vijftig.

      Let op:
      - de uitgebouwde bergingen, waarvan het dak uitkraagt en een luifel boven de voordeur vormt;
      - het kleine plaatsje voor de keuken, "door een metalen reling afgescheiden van de openbare weg";
      - de manshoge gemetselde muren tussen de achtertuinen.
    attributes:
      original_use: Bejaardenwoningen
    sources:
      - Monumentenregister Amsterdam 200788 (redengevende omschrijving)

- title: Sint Catharinakerk and the Catharina schools
  summary: A Catholic island of church, presbytery and three schools in the rare Bossche School style, with fortress-slit windows and limestone reliefs of saints, birds and fish. The church has been Syriac Orthodox since 1993.
  body: |
    In the 1950s each faith built its own world in the new garden suburbs. This one is Catholic: a church with presbytery, a nursery school and a double boys' and girls' school, grouped around a courtyard between the Burgemeester Vening Meineszlaan and the Haarlemmerweg. A convent planned for the courtyard was never built. The commission went to Aart Evers and Geert Sarlemijn after the death in 1953 of Jan van Hardeveld, who was to have designed it. Until the church was consecrated in 1956 the parish made do with a wooden emergency church.

    Evers and Sarlemijn were leading figures of the Bossche School, the post-war Catholic movement around the monk Dom Hans van der Laan: heavy brickwork with coarse joints, careful proportions, motifs from early Christian and Romanesque buildings. It is rare in Amsterdam. The church mixes a long basilica with a central plan, its aisles running all the way round the nave, under a broad hipped roof. The schools followed in 1961–1965.

    The parish closed in 1993 and the church became the Syriac Orthodox Mor Sharbil, though locals still call it the Catharinakerk. The schools are still schools.

    Look for:
    - the high slit windows in the aisle walls, like loopholes in a fort;
    - the low open bell tower on a sturdy porch, pushed forward towards the Vening Meineszlaan;
    - the octagonal play pavilion of the nursery school on the Louis Naarstigstraat, which recalls early Christian memorial chapels;
    - Arie Teeuwisse's limestone reliefs around the schoolyard: Henricus, Catharina and Lidwina, plus birds, fish and other emblems of the four elements.
  category: religious
  lat: 52.383423
  lng: 4.827362
  address: Burgemeester Eliasstraat 72-76, Louis Naarstigstraat 1-3
  links:
