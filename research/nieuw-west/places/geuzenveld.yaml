    artist: Frits Sieger (relief), Jan Wolkers (sculpture)
  photos:
    - commons:File:Burgemeester Fockstraat 85, Slotermeerschool (1).jpg
    - commons:File:Jongen, meisje, vogels (1).jpg
    - commons:File:H-school SBO De Kans, Th. van Aquinostraat 2, Platostraat 49, Amsterdam Nieuw-West Slotermeer.jpg
    - commons:File:Jongen met haan.jpg
