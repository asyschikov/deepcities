    - { label: Monumentenregister Amsterdam (225005), url: "https://data.amsterdam.nl/monumenten/90bac0b7-af6c-4c66-965a-f8b1d555ce17" }
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/H-school" }
    - { label: Amsterdam op de kaart (De Kans), url: "https://amsterdamopdekaart.nl/wederopbouw/Thomas_van_Aquinostraat/2" }
