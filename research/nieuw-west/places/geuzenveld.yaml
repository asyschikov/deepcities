  nl:
    title: Atelierwoningen Van Karnebeekstraat
    summary: Zes ateliers en atelierwoningen van W. van Tijen aan de rand van de polder. Ironisch genoeg resteert in Geuzenveld alleen dit blokje voor kunstenaars als herkenbaar ontwerp van Van Tijen.
    body: |
      Het blokje met ateliers en atelierwoningen is fraai gesitueerd in de zuidwesthoek van Geuzenveld, nabij de Osdorper Binnenpolder. Van Tijen werd in 1953 aangetrokken om invulling te geven aan een van de zes buurten die tezamen Geuzenveld zouden gaan vormen. Hij ontwierp een groot aantal bejaardenwoningen, eengezinshuizen en portieketageflats. De eengezinshuizen zijn onherkenbaar verbeterd, de overige woningen zijn gesloopt. Ironisch genoeg resteert zo tenslotte alleen het blokje voor kunstenaars als herkenbaar ontwerp van Van Tijen in Geuzenveld.

      Het blok telt drie bouwlagen onder een plat dak. Op de begane grond zijn zes afzonderlijk te verhuren ateliers ondergebracht, zonder woonruimte, maar wel voorzien van sanitair en een kitchenette. De atelierwoningen worden ontsloten via een galerij aan de achterzijde. De atelier- annex woonruimte op het noordwesten, uiteraard met vide, neemt ongeveer de helft van de woning in beslag. De cultuurhistorische waarde is gelegen in het naoorlogse streven om ook kunstenaars te voorzien van een passende woon- werkruimte. Atelierwoningen zijn een zeldzaam type.

      De geschakelde villa's van F.J.E. Dekeukeleire aan het Willem Mulierhof geven extra cachet aan deze bijzondere locatie.

      Let op:
      - de noordwestgevel, "helder geleed door de vijf bouwmuren" tussen de vrijwel geheel verglaasde houten puien;
      - de licht gekleurde en gekartelde betonnen band tussen ateliers en bovenwoningen;
      - de betonnen trappen tegen beide zijgevels naar de galerij.
    attributes:
      original_use: Ateliers en atelierwoningen voor kunstenaars
    sources:
      - Monumentenregister Amsterdam 225007 (redengevende omschrijving)
      - https://nl.wikipedia.org/wiki/Van_Karnebeekstraat

- title: Westereindflat
  summary: Jan Rietveld's white ten-storey slab of tiny flats for singles, lifted on columns beside the railway and the A10. For years it wore a giant Amstel beer sign and was known as the Amstelbierflat.
  body: |
    The only high-rise in low-rise Slotermeer, the Westereindflat was meant from the start as a landmark: the press in 1955 called it the "flag" of the new suburb. Jan Rietveld (1919–1986), son of Gerrit Rietveld and mostly a designer of private houses, drew it with P.R. Bloemsma for the builder Cornelis Balke, who sold the flats through a housing cooperative. It held 83 one-room and 44 two-room flats of 32 and about 50 m² for single people and couples without children. So many single people moved in that, as one of the first buyers remembers, the block soon got the nickname "de hunkerbunker" (the bunker of longing). A 4 × 4 m column grid sets every flat's size.

    South of the entrance the block is lifted a storey and a half on concrete piers, so you can walk underneath. Recessed balconies that bulge out in half-rounds give the long fronts their rhythm, and unlike most flats of its time it also has windows and balconies in the end walls. A glass pavilion with a shared restaurant and terrace by the water was planned underneath but never built.

    The Amstel letters on the roof came down in 2002. The building made national lists of post-war monuments and became a rijksmonument; the small studio houses Rietveld and Bloemsma built for the same developer stand just west of it on the Henk Hienschstraat. In October 2025 a fire killed one resident and made all the flats temporarily uninhabitable.

    Look for:
    - the underpass beneath the lifted southern half;
    - the corner windows and balconies on the end walls;
    - the entrance hall, white with accents in primary colours;
    - the four studio houses with garages on the Henk Hienschstraat, with their original steel terrace railings of concertina mesh.
  category: housing
  lat: 52.383796
