  nl:
    title: Atelierwoningen Van Karnebeekstraat
    summary: "Zes atelierwoningen voor kunstenaars achter een wand van glas, aan de rand van de polder. Willem van Tijen bouwde in Geuzenveld een groot aantal woningen; ironisch genoeg is juist dit blokje voor kunstenaars het enige dat nog herkenbaar van hem is."
    body: |
      Van alles wat Willem van Tijen in Geuzenveld bouwde, herken je alleen dit blokje voor kunstenaars nog als het zijne. Van Tijen, een pionier van het Nederlandse modernisme met de sociale woningbouw als grote liefde, kreeg in 1953 een van de zes buurten van Geuzenveld toegewezen, nu de Van Tijenbuurt. Hij tekende er bejaardenwoningen, eengezinshuizen en portiekflats. De flats en bejaardenwoningen gingen in de jaren 2000 tegen de vlakte, de eengezinshuizen zijn onherkenbaar opgeknapt. Over blijft dit blok uit 1959, dat hij samen met M. Boom en J. Posno ontwierp.

      Het staat in de zuidwestpunt van Geuzenveld, tegen de Osdorper Binnenpolder, op een kavel die eerst voor een school bestemd was. Beneden zitten zes ateliers die los te huur waren, elk met een eigen deur, een wc en een keukentje. Daarboven liggen zes atelierwoningen, bereikbaar via een brede galerij aan de achterkant. Elke woning heeft een atelier van twee verdiepingen hoog op het noordwesten, dat volloopt met licht, en boven aan een open trap liggen de slaapkamers. Atelierwoningen waren een zeldzaam type, geboren uit het naoorlogse idee dat ook kunstenaars recht hadden op een fatsoenlijke plek om te wonen en te werken.

      Ernaast, aan het Willem Mulierhof, staan de geschakelde villa's van F.J.E. Dekeukeleire, die er zelf woonde en ook zijn bureau had.

      Let op:
      - de noordwestgevel: vijf smalle bakstenen penanten tussen bijna geheel glazen houten puien
      - de lichte, gekartelde betonnen band tussen ateliers en woningen
      - de betonnen trappen tegen beide blinde zijgevels, die naar de galerij aan de achterkant leiden
    attributes:
      original_use: Ateliers en atelierwoningen voor kunstenaars
    sources:
      - Monumentenregister Amsterdam 225007 (redengevende omschrijving)
      - https://nl.wikipedia.org/wiki/Van_Karnebeekstraat

- title: Westereindflat
  summary: "Jan Rietveld's white ten-storey slab of tiny flats for singles, partly lifted on concrete piers beside the railway and the A10. For years it wore a giant Amstel beer sign and was known as the Amstelbierflat."
  body: |
    The only high-rise in low-rise Slotermeer, the Westereindflat was meant from the start as a landmark: the press in 1955 called it the "flag" of the new suburb. Jan Rietveld (1919–1986), son of Gerrit Rietveld and mostly a designer of private houses, drew it with P.R. Bloemsma for the builder Cornelis Balke, who sold the flats through a housing cooperative. It held 83 one-room and 44 two-room flats of 32 and about 50 m² for single people and couples without children. Many single people lived there, and one of the first buyers thinks that is when the block got the nickname "de hunkerbunker" (the bunker of longing). A 4 × 4 m column grid sets every flat's size.

    South of the entrance the block is lifted a storey and a half on concrete piers, so you can walk underneath. Recessed balconies that bulge out in half-rounds give the long fronts their rhythm, and unlike most flats of its time it also has windows and balconies in the end walls. A glass pavilion with a shared restaurant and terrace by the water was planned underneath but never built.

    The Amstel letters on the roof came down in 2002. The building made national lists of post-war monuments and became a rijksmonument; the small studio houses Rietveld and Bloemsma built for the same developer stand in the same enclave, on the Henk Hienschstraat. In October 2025 a fire killed one resident and made all the flats temporarily uninhabitable.

    Look for:
    - the underpass beneath the lifted southern half;
    - the corner windows and balconies on the end walls;
    - the entrance hall, white with accents in primary colours;
    - the four studio houses with garages on the Henk Hienschstraat, with their original steel terrace railings of concertina mesh.
  category: housing
  lat: 52.383796
