  nl:
    title: Twee-onder-een-kapwoningen van Timmers
    summary: "Vijf getrapte, kleurige twee-onder-een-kappers, schuin in de groenstrook van de Vening Meineszlaan. En de architect? Over G. Timmers is tot nu toe helemaal niets bekend."
    body: |
      Felgeel keramiek tussen grote ramen, tegen roodbruine baksteen: daaraan herken je deze vijf blokjes. Ze staan in de brede groenstrook aan de zuidkant van de Burgemeester Vening Meineszlaan. Die laan verscheen pas begin jaren vijftig op de plankaart van Slotermeer, met aan weerszijden particuliere woningbouw, en werd een ruimte met allure waarin alle stedenbouwkundige idealen van toen samenkomen. Het oostelijke deel van Slotermeer is inmiddels het gaafst bewaarde stuk van het Algemeen Uitbreidingsplan (AUP).

      Elk blokje telt twee smalle, hoge woningen onder een lessenaarsdak: drie lagen aan de oostkant, twee aan de westkant met een flink dakterras. Ze staan schuin op de laan en ruim uit elkaar, zodat het groen doorloopt tot de Professor Oranjestraat erachter. Opdrachtgever was een ontwikkelaar met de prachtige naam NV Bouw- en Handelmaatschappij Edupi XIII. Over de architect, G. Timmers, vonden de onderzoekers van de gemeente niets.

      Helemaal gaaf zijn ze niet meer: een aantal loggia's en kozijnen is vervangen.

      Let op:
      - het getrapte silhouet van elk blokje;
      - de felgele keramische vlakken tussen de ramen;
      - de portalen van granitine rond de voordeuren, soms bekleed met natuursteen of tegels.
    attributes:
      original_use: Twee-onder-een-kap eengezinswoningen
    sources:
      - Monumentenregister Amsterdam 200790 (redengevende omschrijving)

- title: Sape Kuiperplantsoen flats
  summary: "Four staggered strips of walk-up flats around small greens beside Plein '40-'45, by Th.J. Lammers. A deliberate mix of three- and five-room homes, for families that grow and shrink."
  body: |
    Next to the shopping centre on Plein '40-'45, four strips of walk-up flats from 1953 with six separate garages stand staggered around a string of small greens: the Sape Kuiperplantsoen, Arend Bontekoeplantsoen and Johan Schippersplantsoen. The staggering and the passage from public green to shared and private gardens give the ensemble a residential atmosphere all its own, tied to the Gerbrandypark and the Burgemeester van Tienhovengracht.

    The architect, Theodorus Johannes Lammers, had built before the war, and here he managed to modernise his handwriting: sober, businesslike blocks, given depth by recessed stairwells and balconies and by fine, almost delicate detailing. Mixing three- and five-room flats in one complex was deliberate, part of Slotermeer's aim to offer homes for growing and shrinking households. The landlord Rochdale has kept the original look through careful maintenance and is now preparing a renovation.

    Look for:
    - the recessed stairwells and balconies that set the rhythm of the fronts;
    - the free-standing garage boxes on the Hugo Floris Ruysstraat;
    - the Geef Straten een Gezicht plaque for Sape Kuiper, a Delft student shot by the occupiers in 1943, at the corner with the Jan de Jonghstraat.
  category: housing
