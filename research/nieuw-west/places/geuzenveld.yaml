  nl:
    title: Kleuterscholen Het Waterhoentje en De Meerkoet
    summary: "Twee bijna gelijke kleuterscholen uit de jaren vijftig, vernoemd naar watervogels, waar ruwe Limburgse mergel van het portiek de hal in loopt. Licht-luchtscholen voor kleuters, gebouwd net toen Nederland zijn eerste kleuterwet kreeg."
    body: |
      De kleuter was lang het kind van de rekening: pas in december 1955 kreeg Nederland een wet op het kleuteronderwijs. In Slotermeer liepen de kleuterscholen ook nog eens achter op de woningbouw, dus zaten de kinderen jaren in noodgebouwen. In 1955–1956 bouwde Publieke Werken eindelijk vaste scholen. Deze twee, De Meerkoet aan de Jan de Louterstraat en Het Waterhoentje aan de Harry Koningsbergerstraat, verrezen tegelijk en naar bijna hetzelfde ontwerp. Ze waren de eerste van een nieuwe reeks permanente kleuterscholen; van dit type zijn er maar drie gebouwd.

      Zoals het naoorlogse ideaal ook voor de lagere school wilde, hebben ze geen gangen. Elk lokaal heeft aan twee kanten grote ramen, en het dubbele speellokaal kun je met een schuifwand in tweeën delen. Ruwe Limburgse mergelsteen loopt door van het portiek tot in de hal. Daarmee waren de scholen vroeg met een gedachte die Aldo van Eyck en het tijdschrift *Forum* later uitdroegen: binnen en buiten horen in elkaar over te lopen.

      In Het Waterhoentje zit sinds 2002 de islamitische basisschool Al Wafa. Het gebouw ligt in de as van de Walraven van Hallweg en valt al van ver op. De Meerkoet is nu een school voor jonge kinderen die extra zorg nodig hebben. De H-school ernaast werd in 2016–2017 gesloopt.

      Let op:
      - de pergola boven de middeningang en de trapsgewijze uitbouwen aan weerszijden;
      - de muren van ruwe mergelsteen;
      - de witte kozijnen met blauw geschilderde tuimelramen, in een raster dat aan Mondriaan doet denken.
    attributes:
      original_use: Openbare kleuterscholen
    sources:
      - Monumentenregister Amsterdam 225008 en 200959 (redengevende omschrijvingen)
      - https://amsterdamopdekaart.nl/wederopbouw/Harry_Koningsbergerstraat/30
      - https://amsterdamopdekaart.nl/wederopbouw/Jan_de_Louterstraat/21

- title: Timmers houses, Burgemeester Vening Meineszlaan
  summary: "Five stepped, colourful semi-detached blocks set at a slant in the green strip of the Vening Meineszlaan, by an architect about whom nothing is known so far."
  body: |
    The Burgemeester Vening Meineszlaan only appeared on the plan for Slotermeer in the early 1950s, with private housing on both sides, and it became an urban space of real grandeur, in which all the planning ideals of the time come together. The eastern part of Slotermeer is now the most intact remnant of the General Expansion Plan (AUP).

    Along its southern green strip stand five compact blocks, each holding two narrow, tall houses under a lean-to roof: three storeys on the east side, two on the west with a big roof terrace. They stand at an angle to the avenue and far apart, so the greenery flows through to the Professor Oranjestraat behind. They were built for a developer with the splendid name NV Bouw- en Handelmaatschappij Edupi XIII. Of the architect, G. Timmers, the city's researchers could find nothing at all.

    The colourful panels are what make them: bright yellow ceramic in the parapets between the big windows, against red-brown brick. Several loggias and window frames have been replaced.

    Look for:
    - the stepped silhouette of each block;
    - the bright yellow ceramic panels between the windows;
    - the granitine porches around the front doors, some clad in stone or tiles.
  category: housing
  lat: 52.381851
