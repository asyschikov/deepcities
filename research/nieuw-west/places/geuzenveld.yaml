  nl:
    title: Bejaardenwoningen van Van Eyck en Rietveld
    summary: "Een bejaardenwoning van 39 m² onder een plat dak: zo zag het eruit toen Aldo van Eyck en Jan Rietveld het tuttige oudjeshuisje moderniseerden. Het hele Algemeen Uitbreidingsplan nam het over. De lage stroken liggen aan een groene wandelroute naar de Sloterplas."
    body: |
      Vóór de oorlog kregen oudere Amsterdammers vaak een minihuisje met een pannendak, in de volksmond een *Piggelmee*-woning. In 1953 bouwden Aldo van Eyck (1918–1999) en Jan Rietveld (1919–1986) hier de eerste bejaardenwoningen van na de oorlog, en ze gooiden het type om. Het werden lage bakstenen stroken van één bouwlaag met een plat dak. Elke woning telt maar 39 m², maar heeft een mooie, bijna vierkante plattegrond. Het idee werd overal in het Algemeen Uitbreidingsplan (AUP) nagevolgd.

      Makkelijk ging het niet. Stadsontwikkeling had een andere verkaveling op papier gezet, en Van Eyck moest moeite doen om Cornelis van Eesteren om te krijgen. Nu liggen de woningen losjes rond twee ruime hoven en langs de Bijleveldstraat, in de brede groenstrook die langs de Burgemeester Vening Meineszlaan naar de Sloterplas loopt. Samen met de Catharinakerk volgen ze de knik in die groene route. Het gemeentelijk register spreekt van een hoogtepunt in de Nederlandse volkshuisvesting, dat zich kan meten met de minimumwoningen van Mart Stam in Frankfurt.

      Door onderhoud is een deel van de oorspronkelijke details verloren gegaan, maar de menselijke maat van de jaren vijftig en van het tijdschrift *Forum* is nog goed te zien.

      Let op:
      - de lage bergingen die aan de voorkant uitsteken, met een dak dat tegelijk luifel boven de voordeur is;
      - het plaatsje voor elke keuken, achter een metalen hekwerk;
      - de tuinkant, met dubbele tuindeuren en lage borstweringen onder de ramen, en tussen de tuinen bakstenen muren van manshoogte.
    attributes:
      original_use: Bejaardenwoningen
    sources:
      - Monumentenregister Amsterdam 200788 (redengevende omschrijving)

- title: Sint Catharinakerk and the Catharina schools
  summary: A Catholic island of church, presbytery and three schools in the rare Bossche School style, with fortress-slit windows and limestone reliefs of saints, birds and fish. The church has been Syriac Orthodox since 1993.
  body: |
    The city register calls the complex representative of the last heyday of pillarisation, when each faith had its own institutions. This one is Catholic: a church with presbytery, a nursery school and a double boys' and girls' school, grouped around a courtyard between the Burgemeester Vening Meineszlaan and the Coronelstraat. A convent planned for the courtyard was never built. The commission went to Aart Evers and Geert Sarlemijn after the death in 1953 of Jan van Hardeveld, who was to have designed it. Until the church was consecrated in 1956 the parish made do with a wooden emergency church.

    Evers and Sarlemijn took part in the 1947 course in Den Bosch from which the Bossche School grew, the post-war Catholic movement around the monk Dom Hans van der Laan: sturdy brickwork with coarse joints, careful proportions, motifs from Roman and early Christian buildings. It is rare in Amsterdam. The church mixes a long basilica with a central plan, its aisles running all the way round the nave, under a broad hipped roof. The schools followed in 1961–1965.

    The parish closed in 1993 and the church became the Syriac Orthodox Mor Sharbil, though locals still call it the Catharinakerk. The schools are still schools.

    Look for:
    - the high slit windows in the aisle walls, like loopholes in a fort;
    - the low open bell tower on a sturdy porch, pushed forward towards the Vening Meineszlaan;
    - the octagonal play pavilion of the nursery school on the Louis Naarstigstraat, which recalls early Christian memorial chapels;
    - Arie Teeuwisse's limestone reliefs around the schoolyard: Henricus, Catharina and Lidwina, plus birds, fish and other emblems of the four elements.
  category: religious
  lat: 52.383423
