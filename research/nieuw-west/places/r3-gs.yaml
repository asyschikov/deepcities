  nl:
    title: Geuzenbos
    summary: "Zestig hectare bos en natte ruigte op wat tot 1875 IJ-water was, daarna bedolven onder havenzand en slib van de suikerfabriek; vandaar de hobbelige grond. Konikpaarden en Schotse hooglanders grazen er, je mag van de paden af en een toren van 15 meter kijkt over de haven."
    body: |
      Tot 1875 was dit een stuk van het IJ. De Groote IJpolder werd drooggelegd, en vanaf de jaren zestig verdween een deel onder vier meter ophoogzand voor het groeiende Westelijk Havengebied. Bij het gemaal stortte de suikerfabriek van de CSM in Halfweg jarenlang haar slib. Zo ontstond grond met hoogteverschillen van zo'n vijf meter, die binnen een paar passen van klei in kalkrijk zand overgaat.

      In 1991 werd een deel aangeplant als productiebos, met per vak één boomsoort. Wat kaal bleef groeide uit tot ruigte die veel rijker bleek. In 2001 liet de gemeente een plan maken voor struinnatuur, natuur waar je gewoon van het pad af mag, en in 2006 lag het er: holle wegen, bruggetjes, zeventien poelen voor de rugstreeppad, een helofytenfilter dat het regenwater van de havenstraten zuivert, een vogelkijkhut en een uitkijktoren van 15 meter. Intussen had de provincie het bos in een ontwerpstreekplan uit 2002 ingetekend voor te verplaatsen milieuhinderlijke bedrijven; diverse belangengroepen kwamen daartegen in verzet, en nu hoort het bij de hoofdgroenstructuur van de stad.

      Sinds 2007 laat stichting FREE Nature er het hele jaar konikpaarden en Schotse hooglanders grazen. De drukke Wethouder van Essenweg snijdt het bos in tweeën; sinds 2012 kan het vee die weg via een eigen oversteek passeren.

      Let op:
      - de uitkijktoren in het noordelijke deel, bereikbaar vanaf de Wethouder van Essenweg
      - de konikpaarden en hooglanders: houd afstand
      - de deels blootgelegde dijkmuur uit 1634 en de banpaal uit 1624 op de Spaarnwouderdijk (zie Banpaal Spaarnwouderdijk)
    attributes:
      built: 1991 (aanplant); ingericht 2006
      check_note: De uitkijktoren wordt beschreven in 2017 en op ongedateerde pagina's; een recente foto of melding is niet gevonden.
