    - PDOK locatieserver (pin: Jan Zijvertszstraat)
  nl:
    title: Bakemabuurt
    summary: "Het stuk Geuzenveld dat Jaap Bakema in de jaren vijftig ontwierp, een driedimensionale Mondriaan, stond op de slooplijst en ging in 2008 deels plat. Toen kwam de crisis en draaide Stadgenoot bij: twee portiekblokken werden hersteld, de galerijflats herbouwd naar zijn voorbeeld."
    body: |
      Geuzenveld werd in deelplannen verdeeld over architecten. De Rotterdammer Jaap Bakema hield zich, samen met Jan Stokla, niet aan de verkaveling van de gemeente en tekende zijn eigen buurt: lage en middelhoge blokken die net niet in elkaars verlengde staan, zodat geen ruimte eindeloos doorloopt, portiekflats en lange galerijflats met zware betonnen kaders en bakstenen vullingen, en tuinen van Mien Ruys. De commissie die over de tuinstad waakte vond het armoedig en goedkoop ogen en wilde zijn poorten en losse trappenhuizen niet betalen. Bakema hield voet bij stuk. In 1957 stonden er 570 woningen, met 20 winkels en 17 werkplaatsen. Docomomo noemt het een driedimensionale Mondriaan van blokken, trappenhuizen, hagen en vierkant gesnoeide struiken.

      Bakema wilde dat buren elkaar tegenkwamen. De voordeuren lagen achter in een portaaltje aan de galerij, en de bergingen aan de overkant van de binnenhof. Bewoners vonden het lastig om voor hun fiets over te steken of met natte was naar de droogzolder te lopen; die zolders werden al snel woningen. Later kwamen er hekken om de binnentuinen, tot verdriet van Ruys.

      In de jaren negentig kwam de buurt op de slooplijst, en in 2008 gingen de eerste blokken ten noorden van de Sam van Houtenstraat tegen de vlakte. De crisis hield de rest tegen. Vanaf 2014 koos Stadgenoot per gebouw. Han van Zwieten Architecten strippen twee portiekflats van elk 32 woningen tot het casco en gaven ze entrees die twee keer zo breed en veel doorzichtiger zijn. De galerijflats waren te duur om te redden; Vanschagen Architecten zetten er nieuwbouw voor in de plaats die Bakema's lange, ondiepe stroken, betonbanden en rode baksteen overneemt, tot en met de grote onderdoorgang. In december 2021 was de vernieuwing klaar. De woningen zijn privé; alles hieronder zie je vanaf de straat.

      Let op:
      - de dubbel brede portiekentrees aan de Jan Zijvertszstraat en de Bouwen Ewoutszstraat
      - de onderdoorgang door de nieuwbouw in de Dirk Sonoystraat
      - de herbouwde galerijblokken naast de portiekflats uit de jaren vijftig: wat is er overgenomen?
    attributes:
      built: 1953–1957; vernieuwd 2014–2021
      architect: "J.B. Bakema en J. Stokla (Van den Broek en Bakema); vernieuwing Han van Zwieten, Vanschagen Architecten"
      original_use: Sociale woningbouw, winkels en werkplaatsen
    sources:
      - https://gebouwdin.amsterdam.nl/projectdetail/1136
      - https://gebouwdin.amsterdam.nl/projectdetail/3303
      - https://www.nhnieuws.nl/nieuws/296271/renovatie-bakemabuurt-in-geuzenveld-eindelijk-klaar

- title: Parkrand (MVRDV)
  summary: "A giant black block on the Eendrachtspark with three holes punched through it, so the streets behind keep their view. In the holes Richard Hutten made outdoor living rooms for the residents: three-metre plant pots, giant lampshades and chandeliers hung from the flats above."
  body: |
    Parkrand, completed in 2007, was meant to kick-start the renewal of the northern part of the western garden cities, on the edge of the Eendrachtspark where three L-shaped slabs had stood. MVRDV put one huge block of about 225 homes there and then hollowed it out. You can also read it as five towers on a plinth, joined at the top by bridges of flats. The holes keep the park in view for the streets behind and let light deep into the block.

    The two sides are deliberately different. Outside, the facades are dark and rough, with balconies jutting out. Inside the holes everything is white: glazed brick made for the job, with a faint pattern of crosses in smooth and deliberately misfired bricks, like wallpaper on an outside wall.

    The three raised courts are the residents' shared outdoor rooms, furnished by the designer Richard Hutten with everything blown up to the scale of the building: three-metre plant pots, lampshades and chandeliers hanging from the bridges eight storeys up, elephant seats. MVRDV's Jacob van Rijs called it a big mansion with one front door. The courts are for residents only, but they are raised above the ground like one huge balcony over the park.

    Look for:
    - the chandeliers and giant lampshades in the holes, best from the park side
    - the crosses in the white brick
    - about 100 m west, the hidden sentence in the stairs of De Zilverling (see De sleutel ligt onder de deurmat)
