# Groote IJpolder. Scout items (SCOUT-3.md): 219 Bakemabuurt, 220 Parkrand, 221 Moskee Al-Ihsane,
# 222 Couperusbuurt and Nieuwenhuysenbuurt renewal, 236 A. Nouriplein, 245 Geuzenbos.
# Merges: 237 Noorderhof into "Grote man, kleine man (Stephan Balkenhol)" (r2-gs.yaml); outlook on
# "Adriaan van Oordthof" (slotermeer.yaml). Dutch texts written from Dutch sources: gebouwdin.amsterdam.nl,
