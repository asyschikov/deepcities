  nl:
    title: Moskee Al-Ihsane
    summary: "Toen deze gemeenschap haar moskee herbouwde in het Dudokdeel van Geuzenveld, stelde de gemeente eisen: familie van Dudok, toch herkenbaar als moskee, en geen koepel of minaret. Het antwoord: gele baksteen, Dudoks lijnenspel en ramen met een motief uit Fes."
    body: |
      Stichting Al-Ihsane, opgericht in 1993, bad in lage bedrijfsgebouwtjes aan de Mendes da Costahof, een groene hof met rondom alleen woningen naar ontwerp van Willem Marinus Dudok. Ook die oude gebouwtjes waren van Dudok. Toen de gemeenschap ze verving door een echte moskee (vergunning 2015, klaar in 2017), ging de gemeente akkoord onder voorwaarden: het gebouw moest familie zijn van de stijl van Dudok, duidelijk een bijzonder gebouw zijn, een moskee, zonder koepel en zonder minaret, en binnen een vaste plek en hoogte blijven. Voor zover de Dudokvereniging weet is het het enige bouwproject waarbij de gemeente Dudoks stijl eiste.

      Architect Gerard Rijnsdorp zag dat eerder als inspiratie dan als beperking. Hij koos een gele steen zoals Dudok die gebruikte, liet de uitstekende muurdammen van de oude gebouwtjes terugkomen en speelde horizontale tegen verticale lijnen uit, zoals Dudok altijd deed. Om het bijzondere te benadrukken lopen de raampartijen door over de verdiepingsvloer, en de ramen hebben een print met een motief van de Al Quaraouiyine-moskee in Fes. De hoeken zijn naar buiten getrokken, zodat het blok op een kasba lijkt, versterkt door glazen bouwstenen. Zonnepanelen op het hoogste dak maken de moskee bijna energieneutraal. De gemeenschap deed een groot deel van de afbouw zelf.

      Het is een moskee in gebruik, met een eigen ingang en gebedsruimte voor vrouwen aan de zijkant. Vanuit de hof zie je het hele gebouw.

      Let op:
      - de bedrukte ramen en de glazen bouwstenen in de hoeken
      - de gele Dudokblokken rond de hof, om te vergelijken
      - zo'n 120 meter westelijker het A. Nouriplein, en vlak ten noordwesten Dudoks boerderijwoningen voor ouderen
    attributes:
      built: "2017"
      original_use: Moskee
    sources:
      - https://gebouwdin.amsterdam.nl/projectdetail/1580
      - https://dudok.org/portfolio/al-ihsane-moskee-amsterdam-2017/
      - https://rijnsdorp.nl/moskee-al-ihsane-geuzenveld/
      - https://alihsane.nl/

- title: A. Nouriplein
  summary: "The asphalt football court where Ajax talent Abdelhak 'Appie' Nouri played whole days as a boy. It was named after another Ajax player from the street, Nigel de Jong, until he proposed giving the name to Nouri. His shirt number 34 is the centre spot."
  body: |
    The court lies in the Michel de Klerkhof, one of the courts of Dudok's farmhouse homes for older people (see Dudok's farmhouse homes), near the house where Abdelhak Nouri grew up. In 2005 it was opened as the Nigel de Jongplein, after the former Ajax midfielder, who also grew up here.

    In July 2017 Nouri, then 20 and a rising Ajax midfielder, collapsed with a cardiac arrest during a friendly against Werder Bremen in Austria. He suffered permanent brain damage, and his career was over. When the news broke, hundreds of supporters, called together by Ajax's hard core, the F-Side, gathered on this court, and the neighbourhood started calling it the Nouriplein. Nigel de Jong suggested handing his square over to Nouri.

    Designers worked out the new square after talking to the neighbours, Nouri's group of friends and the mosque. On 12 June 2022 it was officially renamed the A. Nouriplein, with the family, mayor Femke Halsema and Willem van Hanegem present, and a football tournament for the neighbourhood's children. The old court lines stayed; new benches and play and fitness equipment make it a place for all ages. At the opening his father said he had told Nouri the day before what was coming, and that they would tell him about the day that evening.

    It is a public neighbourhood court and a meeting place for the area.

    Look for:
    - the number 34 on the centre spot
    - Moskee Al-Ihsane, about 120 m east
  category: hidden-history
  lat: 52.376412
  lng: 4.797112
