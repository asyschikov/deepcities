  nl:
    title: Wereldgroentetuintjes, Osdorperweg 937
    summary: In een voormalige kwekerij aan het eind van de Osdorperweg huren Amsterdammers een stukje grond onder glas en kweken ze Surinaamse oker, sopropo en klimspinazie, die in de toko duur zijn of niet meer worden ingevoerd. Het werd een ontmoetingsplek die niemand had bedacht.
    body: |
      Op nummer 937 aan de Osdorperweg staat het kassencomplex van een voormalige kwekerij. Hier begonnen in 2024 de Wereldgroente Tuintjes, als eerste tastbare initiatief van het Stadslandgoed Nieuw-West. De koude kas is verdeeld in tuintjes van zo'n 25 tot 35 vierkante meter die met een jaarcontract voor een bedrag per maand worden verhuurd, met kranen, compost en bijen voor de bestuiving; in een kas ernaast doen zaadveredelaars, telers en studenten onderzoek in een Living Lab.

      De meeste huurders kweken groente uit Suriname en elders die in de winkel veel duurder is of niet meer wordt ingevoerd. Surinaamse oker gaat de pan in, en vermengd met water ook het haar in: door het slijm is het een soort shampoo waar mensen met dreadlocks graag mee wassen. Wekelijks komen tientallen Amsterdammers, en ook mensen uit omliggende gemeenten, en volgens de verhuurder had niemand bedacht dat het zo'n sociale plek zou worden, waar tuinders elkaar helpen.

      Het is een huurtuin, geen park. De kas is dagelijks open voor huurders; kijken kan op de open dagen (in het seizoen op zaterdagmiddag) of op afspraak.

      Let op:
      - de lange kassen langs de smalle Osdorperweg, het best per fiets te bereiken
      - in het seizoen oker, sopropo en klimspinazie die tegen het glas op klimmen
