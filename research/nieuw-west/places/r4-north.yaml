  nl:
    title: "'t Landje, huttenbouwen op een eiland (Rembrandtpark)"
    summary: "Een eiland in het Rembrandtpark waar kinderen van 6 tot 14 met echte hamers en spijkers hun eigen hut bouwen, pony rijden en kanoën. Vaders krijgen te horen dat ze niet te veel moeten helpen; velen speelden hier zelf."
    body: |
      Het Landje is een bouwspeelplaats: kinderen krijgen hout, spijkers en gereedschap en timmeren hun eigen hut op een beboomd eilandje midden in het Rembrandtpark. Een hut blijft staan zolang de bouwers er blijven komen. Rond de hutten zijn pony's, konijnen en cavia's om te verzorgen, kano's, waterfietsen en vlotten op de binnensloten, een knutsellokaal en een keuken.

      Het begon rond 1970; oprichter Piet de Bake, veertig jaar later nog altijd van de partij, heet de "burgemeester" van Het Landje. Veel medewerkers zijn vroegere Landje-gangers, en volwassenen komen terug om te vertellen dat ze gaan trouwen. Het Parool noemde het in 2009, na een onderzoek naar de speeltuinen van de stad, de leukste van Amsterdam. Documentairemaakster Susan Koenen volgde hier drie weken lang vier kinderen; haar film *Het Wilde Westen* ging in november 2010 in première op het IDFA en laat het paradijs zien, maar ook het stelen, vechten en pesten.

      Het stadsdeel knapte het in 2010 op, met een nieuwe aanlegsteiger, brug, ponybak en een luxe boomhut met glijpaal, en het werd gelukkig niet te netjes. Het is het hele jaar open, dinsdag tot en met vrijdag 's middags en op zaterdag, grotendeels gratis, met een eigen ponyclub.

      Let op:
      - de zelfgebouwde hutten;
      - de boomhut met de glijpaal;
      - de pony's in hun bak.
    attributes:
      built: begin jaren zeventig
      original_use: Bouwspeelplaats
    sources:
      - https://geheugenvanwest.amsterdam/page/11489/de-wilt-de-boom-in
      - https://geheugenvanwest.amsterdam/page/12757/kom-het-wilde-westen-bekijken
      - https://www.kidsproof.nl/amsterdam/uitje/huttenbouwspeelplaats-t-landje-bouwspeelplaats-het-landje-kinderen-hutten

- title: Westbeat and the dancers' Super Space (Lelylaan)
  summary: "A housing block by station Lelylaan that stands on 86 brick arches. Under its 150 flats lies one public hall of 65 by 50 metres and 8.5 metres high, and since 2021 a dance company rehearses in it."
  body: |
    Westbeat, by the Amsterdam architects Studioninedots (completed 2020), stands by a busy road but opens itself up at street level. Its ground floor is a single public hall of 65 by 50 metres and 8.5 metres high, carved into spaces of different sizes by a network of 86 arches. In the brick fronts the arches are so big that whatever happens inside is on show to the street, with the widest ones at the corners as an invitation. The architects call such undefined rooms "wandervoids": space left open for uses nobody planned.

    The arches also do structural work, carrying the 150 flats above, meant for young city dwellers, around a shared garden courtyard at height, and spanning the car park below. Facing the Cornelis Lelylaan, the block doubles as a noise screen, with sound-damping fronts and green galleries.

    Since September 2021 the dance company ICK Dans Amsterdam has its home here, called Space for Dance Art, with studios and a hall for performances. It celebrated its fifth year in September 2026 and holds weekly open programmes and open rehearsals.

    The flats are private; the arches and the dance programme are what a passer-by gets.

    Look for:
    - the wide corner arches;
    - dancers at work behind the glass;
    - the walkways that take the height difference through the building.
  category: culture
  lat: 52.357647
  lng: 4.840118
  address: Rijnlandlaan 3 / Delflandlaan 2
  links:
