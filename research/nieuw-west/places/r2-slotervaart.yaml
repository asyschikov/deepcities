  nl:
    title: Moeder en kind van Jan Wolkers (Sanquin)
    summary: Voordat hij Turks fruit schreef, was Jan Wolkers beeldhouwer. In 1959 kocht het bloedtransfusielab zijn bronzen moeder met kind voor het nieuwe gebouw aan de Plesmanlaan, en daarmee begon een kunstcollectie die nu meer dan 650 werken telt.
    body: |
      In 1959 betrok het Centraal Laboratorium van de Bloedtransfusiedienst van het Rode Kruis (het CLB, nu Sanquin) een nieuwe vleugel aan de Plesmanlaan. De eerste wetenschappelijk directeur, Joghem van Loghem, vond dat nieuwe kunst van jonge kunstenaars jonge onderzoekers op nieuwe ideeën kon brengen. Voor de tuin kocht hij een bronzen beeld van Jan Wolkers (1925–2007): een vrouw die voorover buigt met een kind in haar armen. Samen met een schilderij van Corneille was dat het begin van de kunstcollectie van Sanquin, die nu meer dan 650 werken omvat, van Appel en Lucebert tot Roy Lichtenstein.

      Model voor de vrouw was Wolkers' toenmalige echtgenote Annemarie Nauta, die later ook model stond voor Olga in zijn roman *Turks fruit*. Het beeld staat bij de ingang.

      Op de vleugel erachter zit het koperen reliëf van Piet Donk uit 1959, met het embleem van het laboratorium.

      Let op:
      - het embleemreliëf van Piet Donk op de gevel achter het beeld
      - het titelloze werk van Yvonne Kracht, een open kubus van houten ribben met spiegelstroken, langs de Plesmanlaan
    attributes:
      artist: Jan Wolkers; reliëf van Piet Donk
    sources:
      - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/756
