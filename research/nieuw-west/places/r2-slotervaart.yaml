  nl:
    title: Choreografie in staal en de schuilkelder aan het Bornhout
    summary: Een voormalige ballerina maakte deze rood-witte stalen dans van 16 meter voor langsrijdende automobilisten. Hij staat nu bij het fietsdepot van de stad, waar ook een nooit afgebouwde atoomschuilkelder uit 1984 en het archeologisch depot verborgen liggen.
    body: |
      Margot Zanstra (1919–2010) danste bij het Nationale Ballet voordat ze zich in 1966 op de beeldhouwkunst richtte; ze was getrouwd met architect Piet Zanstra. Rond 1983 maakte ze een maquette van *Choreografie in staal*, en de gemeente liet die zestien meter hoog uitvoeren. De rode en witte vlakken en de open ruimtes waren bedoeld voor automobilisten: rijdend langs het beeld lijken de vormen te verschuiven tot een nieuwe figuur. Het is een van de weinige werken waaraan ze een titel gaf.

      Oorspronkelijk stond het bij de Centrale Werkplaatsen aan het Noordzeekanaal; de komst van de Westrandweg dwong tot een verhuizing. Nu staat het aan het Bornhout 8, bij het Fietsdepot, waar Amsterdammers hun weggehaalde fiets ophalen.

      Op hetzelfde terrein zitten twee dingen die je niet zou verwachten. Onder de grond ligt een schuilplaats uit 1984 voor zo'n honderd medewerkers van de afdeling Werktuigen van de gemeente, voor het geval van een atoomoorlog; toen de dreiging afnam, is hij nooit afgebouwd, en de twee watertanks zijn er nog. En in het archeologisch depot van de stad staan ruim 5000 kratten met vondsten, van grote aardewerken potten tot houten speelgoed en wapens. Beide waren open op Open Monumentendag, 12 september 2026.

      Let op:
      - hoe het beeld van vorm verandert als je erlangs loopt of fietst
    attributes:
      built: rond 1983
      check_note: De nieuwste gedateerde foto's van het beeld zijn van september 2018.
    sources:
