  nl:
    title: Train Lodge, Sloterdijk
    summary: Een hostel in slaaprijtuigen die vroeger in de nachttrein van Zürich naar Rome reden, op een kort zijspoor naast station Sloterdijk. Gasten slapen in de originele coupés met drie bedden boven elkaar.
    body: |
      Sinds de jaarwisseling van 2015 op 2016 staan langs de Changiweg een paar oude Zwitserse slaaprijtuigen op een stuk spoor dat speciaal voor hen is aangelegd, buiten het gewone spoor, oostelijk van het station, aan de zuidkant van spoor 8. Ze kwamen via de Bergland Express van The Train Company en reden ooit in de nachttrein tussen Zürich en Rome. Er staat ook een vroeger Belgisch buffetrijtuig bij, en er is een restaurant met terras.

      De eigenaren hielden de oorspronkelijke inrichting aan: gasten slapen in coupés met drie stapelbedden, bereikbaar met een metalen trapje, en twee coupés kunnen samen een kamer voor zes vormen; een groep kan een heel rijtuig van elf coupés huren. Er zijn 132 bedden in 44 coupés. In 2022 had graffitikunstenaar Kenor een aantal rijtuigen beschilderd.

      Het is een gewoon hostel, maar je hoeft er niet te slapen: in de zomer kan iedereen aan de bar iets drinken, tussen de oude slaaprijtuigen. Buiten het seizoen is die misschien dicht, dus kijk even voor je gaat.

      Let op:
      - de beschilderde rijtuigen van Kenor
      - het spoor dat alleen voor deze rijtuigen is gelegd, los van de hoofdlijn
    attributes:
      original_use: Slaaprijtuigen van de nachttrein Zürich–Rome
    sources:
      - https://trainlodge.com/
      - https://nl.wikipedia.org/wiki/Station_Amsterdam_Sloterdijk

- title: Kapkar/GTO-B10 (Frank Havermans)
  summary: A bright red, angular shelter you can climb into, made from folded pieces of the floor plan of a 1970s Sloterdijk office. It sits on a leftover patch between slip roads and rail viaducts like a vehicle that has just landed.
  body: |
    In 2019 the art event Play Station Sloterdijk asked Frank Havermans for a work about the building frenzy around the station and the ring road. He wanted to make something for the former head office of the SFB, a structuralist office by Arnold Numan Oyevaar, finished in 1974 as one of the largest office buildings in the country. That building was just being rebuilt as Edge West and had no room for art, so the piece went up about fifty metres west, on a scrap of grass where the Basisweg crosses under metro and railway bridges.

    Havermans took part of the building's round floor plan, cut it into cardboard pieces and folded them until they became this: a red metal machine with angled parts jutting out, and a cabin that can be manned. Kees Keijer was reminded of a watchdog lying in the grass. Havermans calls his Kapkar works surveyors, instruments for exploring areas about to be developed. When everything works, a light by Koos Schaart burns in the cabin at night. Office workers walk and cycle past; the grass around it grows long.

    Look for:
    - the cabin, open to anyone passing
    - the bridges and slip roads boxing it in
  category: street-art
  lat: 52.391953
  lng: 4.838926
  address: Basisweg
