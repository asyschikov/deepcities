  nl:
    title: Station Sloterdijk en de Teleportkantoren
    summary: "Een spoorkruising van drie lagen onder één ruimtevakwerk als tafel: beneden de lijn naar Haarlem, in het midden de hal, bovenop de Schiphollijn onder een glazen boog. Gebouwd voor Teleport, een kantorenpark met vliegveldnamen als straatnamen, dat nooit echt van de grond kwam."
    body: |
      Station Sloterdijk ging vanaf 1983 in delen open en werd in 1986 een kruisingsstation, toen de lijn naar Schiphol op de bovenste verdieping aankwam. Architect Harry Reijnders zette een ruimtevakwerk als een tafel van 50 bij 65 meter over twee spoorlijnen die elkaar op verschillende hoogte kruisen: beneden de Oude Lijn naar Haarlem en de lijn naar Zaandam, daarboven de hal voor reizigers, bovenop de Schiphollijn onder een glazen boog van 150 meter. Voor treinen zijn er hier geen sporen 1 en 2: die nummers waren van het oude station, dat in 1985 dichtging. Nu dragen de metroperrons ze. Sporen 9 en 10, aan de Hemboog uit 2008, liggen een paar honderd meter verderop met een eigen ingang. Per dag stappen er zo'n 57.000 mensen in of uit (2024).

      Met zo'n 57.000 reizigers per dag is het een druk overstapstation, en berucht om hoe lastig je er de weg vindt. Treinen stoppen op drie niveaus, de spoornummers verspringen (geen 1 en 2, en 9 en 10 liggen apart), en de poortjes staan precies op de overstaproutes. Reizigersvereniging Rover sprak in 2018 van een poortjesdoolhof: wie zonder poortje van spoor 8 naar spoor 3/4 wilde, moest volgens NS zelf twee trappen op naar het hoge perron 11/12, daarover naar een andere trap lopen en weer twee verdiepingen af. Neem de tijd voor je overstap.

      Rond het station kwam Teleport, een bedrijvenpark met straten genoemd naar vliegvelden: Orly, Changi, Barajas, Narita, Arlanda. Door de snelle opkomst van ICT en de vastgoedcrisis kwam het nooit echt van de grond; in de crisis liepen kantoren leeg, en sommige nieuwe kregen nooit een huurder voordat er een hotel in kwam. Sinds 2012 maakt de gemeente er een gemengde wijk van, en nu is het de rand van Haven-Stad.

      Let op:
      - het Orlyplein voor het station: het oude busstation op het dak, na 2010 verlaten, werd een tuin van grassen, bollen en struiken op het verhoogde dek boven het spoor (2014–2015), met paden waar in de sneeuw de voetstappen liepen
      - VERTICAL (Barajasweg 70, 2023), 168 woningen van NL Architects en vijf andere bureaus, beplant voor "menselijke en niet-menselijke bewoners", en het met hout beklede Wasa Student Village (2017), gebouwd om na tien jaar weer uit elkaar te worden gehaald
      - het voormalige hoofdkantoor van KPN, ooit het grootste leegstaande kantoorgebouw van Amsterdam, verbouwd tot congreshotel
    sources:
      - https://www.architectuurgids.nl/project/item/prj_id/441
      - https://nl.wikipedia.org/wiki/Station_Amsterdam_Sloterdijk
      - https://nl.wikipedia.org/wiki/Orlyplein
      - https://gebouwdin.amsterdam.nl/projectdetail/3954
      - https://gebouwdin.amsterdam.nl/projectdetail/1663

- title: Rembrandtpark (western half)
  summary: "Planned in the 1930s and named in 1958, the park was left unbuilt for years, a wasteland of pools, mosquitoes, dumped rubbish and motorbike racing, until it was laid out as an English-style landscape in 1973. Now it is up for a two-year renovation."
  body: |
    Van Eesteren's 1935 expansion plan put a 50-hectare park here, a green buffer between the old closed city and the open garden cities. Market gardeners worked the land into the 1950s; the park got Rembrandt's name in 1958 and then nothing happened. A tidy plan of about 1961 was shelved for lack of money, so the site went wild: stagnant pools, plagues of mosquitoes, illegal dumping, and teenagers racing motorbikes. Meanwhile bits were nibbled off for tower flats, offices and, biggest bite of all, the Andreas hospital south of the Cornelis Lelylaan.

    Around 1970 landscape architect Janneke Willemsen drew it as an English landscape park, with active play in the north and quiet in the south, and bridges set so high that skaters on the ponds could crouch underneath. It was laid out by 1973; the children's farm De Uylenburg, named after Rembrandt's wife Saskia, opened on 27 October 1973 and is one of the oldest in the city. When a road to the new Andreas Ensemble was to cut through the park, with hundreds of trees, residents' groups fought it for years until the Slotervaart council struck it out.

    The city tendered a renovation of lawns, planting, paths, ponds and banks in February 2026, two years of work. A new playground opened in September 2026, and work on the city farm and the northern part was due to follow.

    Look for:
    - De Uylenburg on the Staalmeesterslaan
    - the two dogs and Rembo by the Postjesweg viaduct
    - the Duizendste brug, the city's thousandth bridge, just over the line in West
    - 't Landje, the children's hut-building island off the Staalmeesterslaan (its own place)
