  nl:
    title: Blauwe Moskee, Henri Dunantstraat
    summary: "Een moskee zonder minaretten of andere gebruikelijke moskeekenmerken, alleen een plint van blauw geglazuurde baksteen. Sinds 2019 ook de eerste moskee in Amsterdam met een versterkte vrijdagse gebedsoproep; de eerste keer bleek de kabel doorgeknipt."
    body: |
      De Blauwe Moskee werd in 2008 gebouwd als moskee en cultureel centrum in Slotervaart. Van de gebruikelijke moskeevormen is niets te zien: het gebouw van twee lagen is gewoon baksteen boven een plint van blauw geglazuurde steen. Binnen zijn een gebedsruimte, vijf klaslokalen, een collegezaal en vergaderzalen. De diensten zijn in het Nederlands.

      Het geld kwam uit Koeweit, via de stichting Europe Trust Nederland. Vanaf het begin plaatsten critici vraagtekens bij die band, bij banden van enkele oprichters met de Moslimbroederschap en bij sommige gastpredikers. De moskee noemt zichzelf gematigd en open voor iedereen.

      In november 2019 werd het de eerste moskee in Amsterdam die de oproep tot het vrijdaggebed via luidsprekers liet horen; het bestuur wilde de woorden daarmee gewoon maken. Het plan kwam in de gemeenteraad en in de Tweede Kamer. Op de eerste vrijdag, 8 november, bleef het stil: de kabel was doorgeknipt. De moskee beloofde de installatie te herstellen, te voorkomen dat het nog eens zou gebeuren en het de week erna bij het vrijdaggebed opnieuw te proberen. In oktober 2022 weigerde het bestuur een verzoek van de burgemeester om een verklaring tegen geweld tegen lhbti-mensen te tekenen, omdat het verzoek volgens de moskee moslims als groep verdacht maakte; de gemeente zag daarna van de verklaring af.

      Let op:
      - de plint van blauw geglazuurde steen
      - de woningbouw van Mecanoo in Park Haagseweg eromheen (1990–1991): 380 woningen in dichte, tuindorpachtige rijen achter een rand van flats en woontorens
    sources:
