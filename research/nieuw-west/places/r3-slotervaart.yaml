  nl:
    title: Kapkar/GTO-B10 (Frank Havermans)
    summary: Een knalrode, hoekige schuilplek waar je in kunt klimmen, gevouwen uit stukken plattegrond van een kantoor uit de jaren zeventig in Sloterdijk. Het staat op een restje gras tussen afritten en spoorviaducten, als een voertuig dat net geland is.
    body: |
      In 2019 vroeg de kunstmanifestatie Play Station Sloterdijk Frank Havermans om een werk over de bouwwoede rond het station en de ringweg. Hij wilde iets maken bij het voormalige hoofdkantoor van het SFB, een structuralistisch kantoor van Arnold Numan Oyevaar, dat bij de oplevering in 1974 tot de grootste kantoorpanden van het land behoorde. Dat gebouw werd net verbouwd tot Edge West en had geen plek voor kunst, dus kwam het werk zo'n vijftig meter westelijker, op een lapje gras waar de Basisweg onder metro- en spoorbruggen door gaat.

      Havermans nam een deel van de ronde plattegrond van het gebouw, knipte het in kartonnen stukken en vouwde net zo lang tot dit ontstond: een rode metalen machine met schuine delen die alle kanten op steken, en een cabine die bemand kan worden. Kees Keijer moest er bij denken aan een waakhond die in het gras ligt. Havermans noemt zijn Kapkars verkenners, instrumenten om gebieden te onderzoeken die op het punt staan ontwikkeld te worden. Als alles werkt, brandt er 's nachts een lamp van Koos Schaart in de cabine. Kantoorpersoneel loopt en fietst langs; het gras eromheen groeit hoog op.

      Let op:
      - de cabine, open voor iedereen die langskomt
      - de bruggen en afritten die het insluiten
    sources:
      - https://nl.wikipedia.org/wiki/Kapkar/GTO-B10
      - https://www.designboom.com/design/studio-frank-havermans-transit-shelter-amsterdam-07-09-2019/
