    - OSM: Cornelis Lelylaan bridge over Derkinderenstraat at 52.35805, 4.8406
  nl:
    title: Origin, de lichtramen van het Derkinderenviaduct
    summary: Veertien verlichte ramen vullen de ruimtes tussen de pijlers onder de Cornelis Lelylaan, elk gegraveerd met een variatie op één kleine vorm, als een cel of een stuifmeelkorrel. Sensoren laten het licht om je heen samenkomen als je stilstaat.
    body: |
      De onderdoorgang van de Derkinderenstraat onder de Cornelis Lelylaan is de route naar de tramhalte erboven, naar school en naar kantoor, en voelde onveilig: donker, vies, met pijlers breed genoeg om je achter te verstoppen. De opdracht was om het veiliger te laten voelen zonder er een plek vol toezicht van te maken. Het kunstenaarsduo Vendel & De Wolf sloot de ruimtes tussen de schuine betonpijlers met veertien trapeziumvormige frames van zwart staal, geplaatst in maart 2022.

      Het idee kwam van de naamgever van de straat, Antoon Derkinderen, die glas-in-loodramen ontwierp voor onder meer de Beurs van Berlage. Zonder daglicht erachter maken deze ramen hun eigen licht: gegraveerd acrylaat en een oplichtende plaat, vanaf de randen belicht door leds in wisselende kleuren, ook overdag en van twee kanten te zien. In elk raam staat een van veertien met de hand gegraveerde combinaties van één boonvormige figuur, door de kunstenaars Origin genoemd naar Darwins *The Origin of Species*; de tekeningen lijken op microben, stuifmeel, cellen of plattegronden. De trapeziumvorm herhaalt de opening van het viaduct zelf, zodat elk frame leest als een perspectieftekening van de tunnel, met licht aan het eind.

      Op zijn mooist in het donker.

      Let op:
      - hoe het licht met je meeloopt
      - dezelfde vorm die in elk raam terugkomt, steeds anders gerangschikt
    attributes:
      check_note: De speld staat midden onder het Lelylaanviaduct (brug 689); de ramen staan langs de pijlers, de beste kijkkant is niet vastgelegd.
    sources:
      - https://www.vendelendewolf.nl/origin.shtml

- title: Train Lodge, Sloterdijk
  summary: A hostel in sleeping cars that used to run on the night train from Zürich to Rome, parked on a short siding beside Sloterdijk station. Guests sleep in the original three-bunk compartments.
  body: |
    Since the turn of 2015 and 2016 a few old Swiss sleeping cars have stood on a stretch of track laid just for them along the Changiweg, outside the railway's own lines, east of the station and south of track 8. They came via the Bergland Express of The Train Company and once ran on the night train between Zürich and Rome. A former Belgian buffet car stands with them, and there is a restaurant with a terrace.

    The owners kept the original fittings: guests sleep in compartments with three stacked bunks, reached by a small metal ladder, and two compartments can be joined into a room for six; a whole car of eleven compartments can be booked by a group. There are 132 beds in 44 compartments. By 2022 the graffiti artist Kenor had painted several of the cars.

    It is a working hostel, but you don't have to stay the night: in summer anyone can have a drink at the bar, between the old sleeping cars. Out of season it may be closed, so check before you go.

    Look for:
    - Kenor's painted cars
    - the track laid just for these cars, off the main line
