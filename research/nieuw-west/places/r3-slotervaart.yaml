- title: Station Sloterdijk and the Teleport offices
  summary: "A three-storey railway crossing under one space-frame \"table\": the Haarlem line at the bottom, the hall in the middle, the Schiphol line under a glass arch on top. It was built for Teleport, an office park with streets named after airports, which never really got off the ground."
  body: |
    Station Sloterdijk opened in stages from 1983 and became a crossing station in 1986, when the line to Schiphol arrived on its top deck. Architect Harry Reijnders set a space-frame "table" of 50 by 65 metres over two railways that cross at different heights: the old Haarlem line and the Zaandam line at ground level, a hall above for passengers, and on top the Schiphol line under a 150-metre glass arch. There are no tracks 1 and 2 for trains: those numbers belonged to the old station, which closed in 1985. The metro platforms carry them now. Tracks 9 and 10, on the Hemboog curve of 2008, are a few hundred metres off with their own entrance. About 57,000 people get on or off here each day (2024).

    With some 57,000 people a day it is a busy place to change trains, and a notoriously hard one to find your way in. Trains stop on three levels, the track numbers jump (no 1 and 2, then 9 and 10 out on their own), and the ticket gates stand right on the transfer routes. In 2018 the passengers' association Rover called it a "poortjesdoolhof", a maze of gates: to change from track 8 to tracks 3 and 4 without passing one, NS's own advice was to climb two flights to the high platform 11/12, walk along it to another stair, and go two floors down again. Allow time for your connection.

    Around it came Teleport, a business park with streets named after airports: Orly, Changi, Barajas, Narita, Arlanda. Fast change in ICT and the property crisis meant it never really got off the ground; in the crisis offices emptied, and some new ones never had a tenant before turning into hotels. Since 2012 the city has been turning the area into a mixed neighbourhood, and it is now the edge of Haven-Stad.

    Look for:
    - the Orlyplein in front of the station: the old rooftop bus station, empty after 2010, turned into a garden of grasses, bulbs and shrubs on the raised deck over the tracks (2014–2015), its paths laid where people's footprints went in the snow
    - VERTICAL (Barajasweg 70, 2023), 168 homes by NL Architects and five other firms, planted for "human and non-human residents", and the wood-clad Wasa Student Village (2017), built to be taken apart after ten years
    - the former KPN head office, once Amsterdam's largest vacant office building, converted into a conference hotel
