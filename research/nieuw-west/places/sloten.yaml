  nl:
    title: Aker-Stein en het westelijk eind van de Sloterweg
    summary: "Vier vrijstaande negentiende-eeuwse huizen waar de dorpsstraat van Sloten uitloopt richting Akersluis, met voorop Aker-Stein: een wit gepleisterd huis dat scheef op de weg staat, met de schuur erachter."
    body: |
      Aker-Stein staat net niet recht. Het witte huis op Sloterweg 1289-1291, uit de tweede helft van de negentiende eeuw, wijkt iets terug van de rooilijn en draait een tikje weg van de weg. Het heeft één bouwlaag onder een afgeknot schilddak, wit pleisterwerk boven een donkere plint, op de hoekblokken getekende nepvoegen en achteraan een aangebouwde schuur.

      Ten westen van de Akerpolderstraat dunt het dorp uit. Vier beschermde huizen markeren het eind van de straat, voordat de weg de Ringvaart en de molen bereikt.

      Aan de overkant draagt nummer 1252 een steen met het jaartal 1893: een bakstenen huis met een gepleisterde westkant, gietijzeren roosters in de voordeur en twee vrij uitgegroeide linden achter een ijzeren hek. Het is een van de weinige laatnegentiende-eeuwse woonhuizen in Sloten die vrijwel gaaf bewaard zijn. Nummer 1301 is helemaal gepleisterd, met een driezijdige erker en raam- en deuromlijstingen met kleine 'oren'. Hier woonde de arts L.A. Faber, voordat hij verderop een villa liet bouwen (Sloterweg 745). Nummer 1309-1311 is een sober bakstenen huis met een gepleisterde plint en schuiframen onder gemetselde boogjes.

      Let op:
      - de jaartalsteen links van de voordeur van nummer 1252
      - de getekende voegen in het pleisterwerk van Aker-Stein
      - de driehoekige erker van nummer 1301
    attributes:
      original_use: Woonhuizen
    sources:
      - city register texts (200335, 200328, 200336, 200337)
      - https://amsterdamopdekaart.nl/1850-1940/Sloterweg/745

- title: Sloterkerk
  summary: The village church on its mound, rebuilt in 1861 on the site of the church Rembrandt drew, with a bell of 1516, a 1664 lectern, a 1851 organ and old cast-iron grave railings in the churchyard.
  body: |
    A church at Sloten is first mentioned in 1063. The medieval church on this mound was large for a village, because pilgrims passed on the *Heilige Weg* (holy road) to the Miracle of Amsterdam. Beggars (Protestant rebels) wrecked it during the siege of Haarlem in 1573; in 1664 the remains of the nave were patched up as a Protestant church. Rembrandt drew and etched that church; Sloten's third minister was married to a cousin of Saskia, and Rembrandt's granddaughter Titia married here in 1686.

    The present church replaced it in 1861. Designed by P.J. Hamer, it is a sober *Waterstaatskerk* (a state-subsidised church of the period) with a tall west tower and an octagonal open lantern; the tower was pulled down in a 1960 restoration and rebuilt in its old form in 1965. A lot came across from the old church: the carved oak pulpit, a lectern dated 1664, three 17th-century brass chandeliers with the arms of Amsterdam and Sloten, the 1851 Knipscheer organ. The tower holds a bell cast in 1516 by Willem and Jaspar Moer. The bell is called JERON (probably after St Jerome), a name only read off its rim in 2026; it is the second-oldest church bell in Amsterdam, after the Zuiderkerk's of 1511, and still strikes every half hour. A beech hedge encloses the churchyard. The parsonage next door (1909, Piet Heyn) housed the village's ministers until 1966 and is listed too. Concerts are held monthly.

    Look for:
    - the tower lantern on little columns with clocks on four sides
    - the wrought-iron churchyard gates on the Osdorperweg and graves with cast-iron railings
    - in the tower, a marble plaque in a gilt frame for two members of the Sloten Christian youth club: sailor Arie Oudshoorn, killed in the Battle of the Java Sea on 27 February 1942, and Jan Kars, killed in Zeeland in October 1944 (see Kars and Bierman memorial, Osdorperweg)
    - the eclectic parsonage villa next door
