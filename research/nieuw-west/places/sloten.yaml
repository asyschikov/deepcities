  nl:
    title: Sint-Pancratiuskerk (Sloten)
    summary: "De eerste kerk van Jan Stuyt (1899-1901), een sobere bakstenen basiliek uit de tijd dat de katholieken van Osdorp eindelijk weer een kerk in Sloten kregen. Met glas-in-lood uit Brugge en een torenspits die het dorp van ver aankondigt."
    body: |
      Na 1573 raakten de katholieken de dorpskerk kwijt aan de protestanten. Tientallen jaren kerkten ze in boerenschuren, daarna in een kerk in Osdorp. Die zakte weg toen het veen eromheen werd afgegraven, en moest in 1901 plat. De nieuwe parochie van Sint-Pancratius (opgericht in 1893) koos een plek aan de oostrand van Sloten, en bouwpastoor J.H. Haverman haalde Jan Stuyt erbij, een leerling van Cuypers. Het werd de eerste kerk die Stuyt zelfstandig in Nederland bouwde.

      Op 12 mei 1900, de feestdag van Pancratius, werd de eerste steen gelegd; in maart 1901 volgde de wijding. Stuyt hield het sober: een basiliek met lagen koppen en strekken om en om, een leien dak en in het zuidwesten een toren met een ingesnoerde spits. Hij keek naar de vroegchristelijke kerkbouw, niet naar de weelderige neogotiek van zijn tijd. De koorramen met de Kruisiging zijn van Julius Dobbelaere uit Brugge (1900); in de ronde ramen van de zijbeuken wisselen SP en SB elkaar af, voor Pancratius en Barbara. Het kerkhof erachter dateert van 1901. Sinds 2024 zijn er geen vaste vieringen meer, alleen nog bijzondere.

      Aan de overkant, op Sloterweg 1191-1193, staat het tolhuis. In 1815 leenden de grondeigenaren geld om de Sloterweg naar de stad te bestraten en met bomen te beplanten. Vanaf 1816 losten ze dat af met tol, geïnd bij een hek aan de Sloterkade en hier, aan de oostrand van het dorp. In de beginjaren van de KLM kwamen passagiers per paardentram op weg naar Schiphol hier langs. Het huidige huis is van kort na 1900. Amsterdam, dat Sloten in 1921 annexeerde, schafte de tol in 1923 na veel getouwtrek af; de tarievenlijst hangt nog in Café Kerkzicht ernaast. Precies een eeuw later, op 1 juli 2023, ging 75 meter verder naar het oosten een cameraknip de weg dicht voor doorgaand verkeer, met een boete van zo'n 110 euro. Een stuk op de website van de dorpsraad stelt met een knipoog dat de tol terug is.

      Let op:
      - het beeld van Pancratius onder een baldakijn op de hoek van de toren
      - de achtkantige traptoren tegen de toren
      - de SP- en SB-medaillons in de zijbeukramen
      - de pastorie die aan de oostkant aan de kerk vastzit
      - het tolhuis aan de overkant, nog grotendeels zoals op de oude ansichtkaarten, alleen zonder hek
    attributes:
      original_use: Rooms-katholieke parochiekerk met pastorie
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/526706
      - https://nl.wikipedia.org/wiki/Sint-Pancratiuskerk_(Sloten)
      - https://slotenoudosdorp.nl/geschiedenis-sint-pancratiuskerk-sloten/
      - https://slotenoudosdorp.nl/hoe-in-sloten-de-tol-kwam-verdween-en-weer-terugkwam/

- title: Boerderij Welgelegen and the Osdorperweg cottages
  summary: An 1876 dairy farm set askew to the road along the old field pattern, a hall-house with a North Holland stolp barn beside it, next to a rare row of partly back-to-back workers' cottages from 1902.
  body: |
    On the north edge of the village, the Osdorperweg still looks rural. *Welgelegen* (well situated) was built in 1876 for a Mr Van Haaren; a worn stone by the front door records that his son, then 12 or 13, laid the first stone. The farm sits at a slant to the road because it follows the direction of the old field strips, with the meadow and a remnant of the *Kerksloot* (church ditch, once Sloten's boat route to the Slotervaart) behind it.

    It mixes two traditions. The farmhouse is a hall-house of the type found south of the IJ, with a cellared front house holding the best room, a middle part for daily life and a cow stable behind. Beside it stands a pyramid-roofed *stolp* barn, the classic North Holland type. The front has a gable stone reading WELGELEGEN, yellow and red-brown brick arches over the windows and scalloped bargeboards.

    Just south, Osdorperweg 32-66 is a complex of workers' cottages from about 1902: two rows at right angles to the road and one parallel, partly back-to-back and reached through narrow alleys, with glimpses of the meadow between them. That layout is rare for rural workers' housing of the period.

    Look for:
    - the WELGELEGEN stone under the attic window
    - the cast-iron stable windows with geometric glazing bars
    - part of the old farm gate propped against the north wall
    - the alleys between the cottage rows
