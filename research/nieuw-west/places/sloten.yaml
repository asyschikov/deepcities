  nl:
    title: Landarbeiderswoningen Sloterweg 833-837
    summary: "Twee identieke blokjes met elk twee landarbeiderswoningen uit 1901, gebouwd door de veehouder aan de overkant om zijn knechten dichtbij te hebben. Sinds 2020 zijn het de laatste in hun soort aan de Sloterweg."
    body: |
      Vroeger stonden er langs de Sloterweg veel van zulke huisjes. Sinds 2020 zijn dit de laatste.

      In 1901 liet J.J. van der Veldt, eigenaar en bewoner van boerderij *Veldzicht* schuin aan de overkant (Sloterweg 824), twee gelijke blokjes bouwen met elk twee woningen voor zijn knechten. Een huis aanbieden was voor boeren een manier om personeel aan het bedrijf te binden. De blokjes hebben een begane grond en een zolder onder een zadeldak met de nok langs de weg, en zijn met meer zorg vormgegeven dan je voor arbeidershuisjes zou verwachten. Later werd elk blokje één woning en is de achterkant van nummer 833 flink verbouwd, maar vanaf de weg zien ze er nog vrijwel hetzelfde uit.

      In 2020 probeerde een buurtactie andere arbeidershuisjes aan de weg te redden. Sindsdien zijn deze twee de laatste van hun soort hier, en in december 2021 werden ze vanwege die zeldzaamheid gemeentelijk monument.

      Let op:
      - de twee gelijke voorgevels naast elkaar
      - de band met boerderij Veldzicht, aan de overkant op nummer 824
    attributes:
      original_use: Landarbeiderswoningen
    sources:
      - https://data.amsterdam.nl/monumenten/0f1b3097-7da6-4ae8-8bec-c74c22e9d386
      - https://slotenoudosdorp.nl/zeldzame-landarbeiderswoningen-worden-gemeentelijk-monument/

- title: Villa Maupertuus and Riecker State
  summary: Two 1930s villas on the old farm road, one named after the fox Reynard's castle by a professor of Middle Dutch, the other a doctor's house that merges with the Siegerpark behind it.
  body: |
    The Sloterweg was once a ribbon of farms; its 1930s villas mark the turn from farmland to housing. At no. 782 the architect Arnold Ingwersen built a house in 1932–1933 for Adriaan Goslinga, professor of history and Middle Dutch at the Vrije Universiteit, and his wife Johanna Huisken. They called it *Maupertuus*, after the castle of the fox in the medieval epic *Van den vos Reynaerde*. A newspaper of the day counted twenty rooms, with four reception rooms on the ground floor divided only by curtains and a gym in the cellar. It has barely changed since and now goes by Villa Sloten.

    No. 745 (1936) was designed by A. van der Vorst of the Kruyswijk office for the doctor L.A. Faber, who until then lived in the village at Sloterweg 1301. The traditionalist house has an attached garage and a concrete culvert with curved brick parapets over the roadside ditch. It stands on the edge of the Siegerpark, laid out at the same time; the city register calls its position prominent, visible from all sides, with the garden and the park reading as one. It has been called *Riecker State* since at least 1963.

    Look for:
    - the study window above the front door of Maupertuus
    - the little bridge with brick parapets in front of no. 745
    - the Siegerpark behind no. 745 (see Siegerpark and its Stedelijk sculptures)
