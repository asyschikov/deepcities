  nl:
    title: Akermolen (De Oude Molen)
    summary: "Waar deze molen vandaan kwam weet niemand: het polderbestuur schreef in de jaren 1870 alleen 'elders' op. In 1921 verloor hij zijn wieken en werd hij de woning van de poldermeester. Hij ontsnapte aan de sloop en is nu een theehuis op de Ringvaartdijk."
    body: |
      Op de Ringvaartdijk, precies waar de hoofdtocht van de Middelveldsche Akerpolder op de Ringvaart uitkomt, staat de bakstenen romp van een forse achtkante molen. In de jaren 1870 werd hij hier opnieuw opgetrokken, als vervanger van een oudere molen aan de rand van het drooggelegde Lutkemeer. Waar hij zelf vandaan kwam is een raadsel; het polderbestuur noteerde alleen 'elders'. Met wieken van 28 meter hoorde hij bij de grotere molens rond Amsterdam. Twee gevelstenen, uit 1876 en 1896, noemen de polderbestuurders van toen.

      Nadat de turf eruit was gestoken als brandstof, moest het peil van de polder ruim drie meter zakken. Het scheprad maakte daarom in 1896 plaats voor een vijzel, een schroef van Archimedes die nog steeds onder de molen ligt. In 1921 nam een elektrische pomp het over. Kap en wieken gingen eraf, en de romp kreeg een achtkantig pannendak en een getande lijst van baksteen. Sindsdien lijkt hij eerder een woonhuis van de Amsterdamse School. De poldermeester trok erin. In oorlogstijd kon de molen de polder ook juist laten onderlopen, als onderdeel van de oude Linie van Amsterdam. Wim Luimee (1933) wist nog dat Kroatische soldaten, die in 1944 het afweergeschut rond de molen bedienden, een tijd op de molenzolder sliepen.

      Vanaf 1999 stond de romp leeg, en omdat hij in de dijk in de weg zou zitten, dreigde de sloop. Buurtbewoners kwamen in actie, Stadsherstel restaureerde hem. Nu zit er Theehuis de Akermolen van Stichting De Vrije Geer, waar mensen met een verstandelijke beperking werken.

      Let op:
      - de twee gevelstenen met de namen van de polderbesturen
      - het achtkantige dak en de getande lijst
      - achter de molen het omheinde kanaal van de oude vijzel
      - het *Sisyfusgemaal* van Erick de Lyon, een gemaal dat ook kunstwerk is: net als Sisyphus met zijn steen voert het eindeloos water uit de Akerpolder af richting zee, en je voelt er het hoogteverschil tussen Ringvaart en polder
    attributes:
      built: 1874–1876 (op deze plek)
      original_use: Poldermolen, later gemaal en woning
    sources:
      - https://data.amsterdam.nl/monumenten/7bde00c4-6f99-4960-a12b-938585860e87
      - https://stadsherstel.nl/monumenten/de-akermolen/
      - https://slotenoudosdorp.nl/restauratie-oude-molen-in-osdorp-2/

- title: IBM headquarters, Johan Huizingalaan
  summary: "IBM's Dutch head office of 1976, a stack of white-and-black grids with 135-degree corners said to echo the punch card, listed in 2008 and on the city's top 100 of young monuments and now awaiting a makeover."
  body: |
    IBM had been in the Riekerpolder since the early 1960s, with a factory nearby that made its famous golfball typewriters. In 1973–1976 W.Th. (Wout) Ellerman of Lucas & Niemeijer designed its new Dutch headquarters on a green plot between the A4/A10 junction and the Johan Huizingalaan, with lawns and ponds hiding the car park.

    The building is assembled from blocks of three sizes on a rigid 9-metre grid: a two-storey base with reception, canteen, auditorium and print shop, and two set-back office tiers rising to ten storeys. The façades repeat the grid, with white panels in aluminium frames and a band of dark brown glass in each floor. Every right angle is cut into two angles of 135 degrees, so the whole reads as a cluster of rounded cubes. The city saw in the strict black-and-white pattern a link with the digital world of the computer, and the design is often said to be inspired by IBM's punch cards. Unchanged outside, it was listed in 2008.

    The area around it is being redeveloped. Office Winhov is to strip and renovate the 1976 block while keeping its shape and façade pattern.

    Two other IBM buildings nearby already have new lives. The former typewriter factory behind the headquarters had for eleven years seemed impossible to reuse before it reopened in 2015 as B. Amsterdam, a large hub for start-ups and creative firms, with a restaurant and vegetable garden on the roof. William McDonough's office for IBM, by one of the fathers of cradle-to-cradle design, became The David in 2020: 365 flats, the first office-to-housing conversion in this part of the city, with new storeys creeping over the old block as a white mass.

    Look for:
    - the cut corners repeated in plan and façade
    - the IBM letters on the roof, a landmark from the ring road
    - B. Amsterdam at Johan Huizingalaan 763a and The David on the David Ricardostraat
    - the street names of the office park, all economists: Adam Smithplein, John M. Keynesplein, Joseph Schumpeterstraat, Thomas R. Malthusstraat, David Ricardostraat and, through the offices, the Karl Marxpad, named in the city's register after the man who held that capitalism would bring about its own downfall
