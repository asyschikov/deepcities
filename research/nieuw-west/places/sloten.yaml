  nl:
    title: Sloterkerk
    summary: Op een terp gelegen Nederlands Hervormde kerk uit 1861 naar ontwerp van P.J. Hamer, op de plek van de kerk die Rembrandt tekende, met een klok uit 1516, een lezenaar uit 1664 en een Knipscheerorgel uit 1851.
    body: |
      De eerste Sloterkerk wordt voor het eerst vermeld in een oorkonde van bisschop Willem I uit 1063. Omstreeks 1200 is de tweede Sloterkerk gebouwd. Deze kerk was vrij groot voor een klein dorp: zij was namelijk een onderdeel van de pelgrimsroute van de katholieke gelovigen op weg naar het Mirakel van Amsterdam. De tweede Sloterkerk werd in 1573 door de Geuzen grotendeels verwoest tijdens het Beleg van Haarlem. In 1664 werden de restanten van het middenschip hersteld en geschikt gemaakt als protestantse kerk. Rembrandt heeft deze derde kerk in etsen en tekeningen vastgelegd, mede omdat de derde predikant van Sloten, Sylvius, getrouwd was met Aaltje van Uylenburgh, een nicht van Rembrandts vrouw Saskia. De kleindochter van Rembrandt, Titia van Rijn, is op 27 juni 1686 in deze kerk getrouwd.

      In 1861 werd de zaalkerk, een Waterstaatskerk naar ontwerp van P.J. Hamer, in gebruik genomen, gebouwd in een sobere op het neo-classicisme geïnspireerde bouwstijl. Bij de restauratie van 1960 is de toren gesloopt; deze werd in 1965 in de oorspronkelijke vorm herbouwd. Uit de oude kerk zijn het Knipscheerorgel uit 1851, de rijk gesneden eikenhouten kansel met klankbord en drie zeventiende-eeuwse koperen kaarsenkronen met de wapens van Amsterdam en Sloten bewaard gebleven, evenals een lezenaar met wapen gedateerd '1664'. De grote klok dateert uit 1516 en is gegoten door de gebroeders Willem en Jaspar Moer. Pas in 2026 werd de naam op de rand gelezen: JERON, waarschijnlijk naar kerkvader Hieronymus. Daarmee is het na die van de Zuiderkerk (1511) de op een na oudste kerkklok van Amsterdam; hij slaat nog elk half uur. De pastorie (1909) naar ontwerp van de architect Piet Heyn heeft van 1909 tot 1966 als onderkomen gediend van de Nederlands Hervormde predikanten van Sloten. Sinds de restauratie van 2003 worden er maandelijks concerten georganiseerd.

      Let op:
      - de achtzijdige open lantaarn op zuiltjes met aan vier zijden een uurwerk
      - de smeedijzeren hekwerken aan de Osdorperweg en de graven met gietijzeren hekwerken op het kerkhof
      - in de toren een marmeren plaquette in gouden lijst voor twee leden van de Christelijke Jongemannen Vereniging van Sloten: matroos Arie Oudshoorn, omgekomen in de Slag in de Javazee op 27 februari 1942, en Jan Kars, gesneuveld in Zeeuws-Vlaanderen op 20 oktober 1944 (zie Monument voor Kars en Bierman, Osdorperweg)
    attributes:
      built: 1861 (kerk); 1909 (pastorie)
      architect: P.J. Hamer (kerk); P. Heyn (pastorie)
      original_use: Nederlands Hervormde dorpskerk met pastorie
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/506238
      - https://data.amsterdam.nl/monumenten/46c21f22-3ddf-4a02-b275-99d08abe6850
      - https://nl.wikipedia.org/wiki/Sloterkerk
      - https://slotenoudosdorp.nl/de-klok-van-de-sloterkerk-is-510-jaar-oud/

- title: Sint-Pancratiuskerk (Sloten)
  summary: Jan Stuyt's first church (1899–1901), a sober brick basilica built when the Catholics of Osdorp finally got a church back in Sloten, with Bruges stained glass and a spired tower that marks the village from afar.
  body: |
    After 1573 the Catholics lost the village church to the Protestants and worshipped in barns for decades, then in a church at Osdorp. That one subsided as the surrounding peat was dug away and had to be pulled down in 1901. The new parish of St Pancras (founded 1893) chose a site at the eastern edge of Sloten, and the building priest J.H. Haverman brought in the young Jan Stuyt, a pupil of Cuypers. It was the first church Stuyt built on his own in the Netherlands, later followed by dozens.

    The first stone was laid on 12 May 1900, St Pancras' day, and the church was consecrated in March 1901. Stuyt kept it plain: a basilica with alternating header and stretcher courses, a slate roof and a southwest tower with a pinched spire, drawing on early Christian churches rather than the rich neo-Gothic of the day. The chancel windows of the Crucifixion are by Julius Dobbelaere of Bruges (1900); the round aisle windows alternate SP and SB, for Saints Pancras and Barbara. The parish cemetery behind dates from 1901. Since 2024 there have been no regular services, only special ones.

    Opposite, at Sloterweg 1191-1193, stands the *tolhuis* (toll house). In 1815 the landowners borrowed money to pave the Sloterweg to the city and plant trees along it, and from 1816 they paid it back with a toll, collected at a gate on the Sloterkade and here, at the eastern edge of the village. In the early days of KLM, passengers on their way to Schiphol by horse tram passed this way. The present house dates from shortly after 1900. Amsterdam, having annexed Sloten in 1921, scrapped the toll in 1923 after much haggling; the tariff board still hangs in Café Kerkzicht next door. Exactly a century later, on 1 July 2023, a camera "knip" 75 metres east closed the road to through traffic, with a fine of about 110 euros, and locals joke that the toll is back.

    Look for:
    - the statue of St Pancras under a canopy on the corner of the tower
    - the octagonal stair turret against the tower
    - the SP/SB roundels in the aisle windows
    - the parsonage linked to the church on the east side
    - the toll house across the road, still much as on the old postcards, minus its gate
