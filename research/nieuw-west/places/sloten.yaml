  nl:
    title: Winkel-woonhuis Sloterweg 1210-1212
    summary: "Boven de winkeldeur staat nog altijd de naam van kruidenier Joost in 't Veld, in glas-in-lood. Zijn winkel met woonhuis uit 1921-1922, van L.J. de Wolf, steekt boven de buren uit, met gebogen etalageruiten, glanzende tegels en een sierlijke hijsbalk. Monument sinds 2025."
    body: |
      Sloten was nog maar net Amsterdams, sinds januari 1921, toen kruidenier Joost in 't Veld vroeg of hij hier een winkel met pakhuis en een woonhuis mocht bouwen. De grond was kort daarvoor nog de tuin van de katholieke kerk. Als architect koos hij Lubertus Jacobus de Wolf. Het werd een dubbelpand van twee volwaardige verdiepingen, breder en hoger dan de oude huisjes eromheen: een klein teken dat het dorp begon te groeien.

      Nummer 1210 is de winkel. Onderin zit een plint van geglazuurde tegels in drie kleuren, in het midden de deur tussen twee etalages met gebogen glas, daarboven glas-in-lood en een balkonnetje, en helemaal bovenin, in de topgevel, betegelde nissen en een rijk versierde hijsbalk. Het woonhuis op 1212 is soberder: ook een tegelplint, met ruitvormige bovenlichten. Op de eerste tekening zaten winkel en woning precies andersom; in september 1921 kreeg het spiegelbeeld groen licht. In 1936 werden winkel en huis gesplitst. Binnen is nog veel uit de jaren twintig over, van trappen en tegels tot de wastafels, en zelfs afwerking uit de jaren zeventig. Ook dat hielp: in januari 2025 werd het gemeentelijk monument.

      Let op:
      - de naam van de eerste eigenaar in het glas-in-lood boven de winkeldeur
      - het gebogen glas van de etalageruiten
      - de betegelde nissen en het smeedwerk rond de hijsbalk
    attributes:
      original_use: Kruidenierswinkel met pakhuis en woonhuis
    sources:
      - https://data.amsterdam.nl/monumenten/d242da00-d3ea-41a4-879a-abbb561a6d90
      - https://nl.wikipedia.org/wiki/Sloterweg_1210-1212

- title: Aker-Stein and the west end of the Sloterweg
  summary: Four detached 19th-century houses where Sloten's main street runs out towards the Akersluis, led by Aker-Stein, a white plastered house set at a slant to the road with its barn behind.
  body: |
    West of the Akerpolderstraat the village thins out. Four listed houses mark the end of the street before the road reaches the Ringvaart and the mill.

    *Aker-Stein* (Sloterweg 1289-1291, second half of the 19th century) stands back from the building line and slightly askew to the road. It is one storey under a truncated hipped roof, plastered white above a dark plinth, with fake joints drawn on its corner blocks and a barn attached behind. Across the road, no. 1252 carries a stone dated 1893: a brick house with a plastered west end, cast-iron grilles in the front door and two untrained lime trees behind an iron fence, one of the few houses of the late 19th century in Sloten that survive almost intact. No. 1301 is fully plastered, with a three-sided bay and window surrounds with little "ears". The doctor L.A. Faber lived here before building his villa further east (Sloterweg 745). No. 1309-1311 is a plain brick house with a plastered plinth and sash windows under brick arches.

    Look for:
    - the dated stone left of the door of no. 1252
    - the drawn joints on the plaster of Aker-Stein
    - the triangular bay of no. 1301
