  nl:
    title: Woningbouwcomplex Calandlaan
    summary: "Rode bakstenen 'stempels' met flats en bejaardenwoningen, neergezet in het groen langs de Cornelis Lelylaan. Samen met Sloterhof aan de overkant is dit volgens de gemeente het meest exemplarische stuk AUP in Slotervaart."
    body: |
      Het Algemeen Uitbreidingsplan (AUP) bouwde zijn tuinsteden op met stempels: een vaste groep blokken met groen ertussen, die zich door een hele buurt herhaalt. Langs de Cornelis Lelylaan liggen er zes, drie aan elke kant van de Johan Huizingalaan. Elke stempel telt zes blokken: een strook van vijf hoog langs de Lelylaan, nog drie blokken van vijf lagen in noord-zuidrichting, een korter blok van drie lagen en een rijtje gelijkvloerse bejaardenwoningen aan de Pieter Calandlaan. De blokken staan in het groen, niet eromheen.

      De opzet is aan beide kanten gelijk, de architecten niet. De westelijke stempels zijn van Auke Komter en zijn assistent P. Christiaanse. De oostelijke helft, de beschermde, dateert van 1958 en komt van G.H. Kleinhout (1881-1958) en A.J. van der Steur (1895-1963), die eerder al samen woningen bouwden aan de Hagedoornweg in Amsterdam (1918-1923). Volgens het rapport van de gemeente is die oostkant beter uitgewerkt en is de buitenruimte er beter bewaard. Met Sloterhof aan de overkant en het viaduct bij de Huizingalaan vormt de strook een etalage van naoorlogse woningbouw aan de weg die de oude stad met Osdorp verbindt.

      Veel zijgevels zijn inmiddels gestuukt en de kozijnen zijn van kunststof, toch rekent de gemeente het complex tot de best bewaarde van het AUP.

      Let op:
      - de trappenhuizen aan de Lelylaan, die naar voren springen en boven het dak uitsteken;
      - de schuine balkons aan weerszijden van de portieken, gevat tussen betonnen schotten;
      - het lage rijtje bejaardenwoningen langs de Pieter Calandlaan;
      - rode baksteen, betonnen lateien en een uitkragende dakrand bij elk blok.
    attributes:
      original_use: Etagewoningen en bejaardenwoningen
    sources:
      - https://data.amsterdam.nl/monumenten/325ec14b-787d-442c-bab3-e836192f9b36

- title: Abraham Staalmanplein and the Staalman bear
  summary: "A 1950s shopping square with three kiosks, once mostly glass, set askew under one pergola, one of the last intact squares of its age in Nieuw-West. Nearby, a 10-metre concrete bear with a pillow under its arm guards the park."
  body: |
    The square honours Abraham Staalman (1871–1935), a pioneer of social housing and founder of the housing association Het Westen. Arthur Staal and Cornelis Keesman designed the complex around it in 1956–1958: at completion it counted 280 flats, 20 shops, 3 kiosks, 9 garages, two substations and a boiler house. The register guesses that the strict layout and facades are Keesman's, and that Staal, son of the architect J.F. Staal and later designer of the Shell tower on the IJ, added the playful parts: the staggered balconies and the three kiosks set at an angle between the Huizingalaan and the square. Some flats were built for families of thirteen, with three extra bedrooms in the semi-basement below.

    Urban renewal since 2010 replaced much of the surrounding neighbourhood, and the low strip of shops that closed the south side is gone, so the square now opens onto the court behind it. The city listed the remaining hook of flats, the square and the kiosks in 2019 after a request from the heritage society Heemschut. It counts it, with the square at the Pieter Calandlaan and Meervaart, as the only largely intact square of the 1950s and 1960s in Nieuw-West.

    The renewal also produced the neighbourhood's mascot. In 2011 Florentijn Hofman (of the giant Rubber Duck) built *Staalman* in the Staalmanpark, after working out the design with local young people: a bear of sprayed concrete over a steel frame, about ten metres tall. He looks tough, but carries a pillow. Hofman linked it to the advice that teenagers should go to bed on time instead of hanging around outside, and to the residents who had to pack up their belongings and move, sometimes twice, while their homes were rebuilt.

    Look for:
    - the pergola that ties the three kiosks together, resting on slender columns;
    - slanting, staggered balconies on the square side, with the concrete floor bands running through them;
    - the ground-floor brickwork: two courses of ordinary bricks alternating with one course of taller ones, and small square windows at different heights;
    - Leo de Vries's sculpture of three stone blocks on the square, which with a little imagination becomes a reclining figure;
    - the bear in the park, looking out over the neighbourhood like a gatekeeper.
  category: housing
  lat: 52.349830
  lng: 4.828608
  address: Abraham Staalmanplein 1-12
