  nl:
    title: Vliegbasis De Huygens (vm. RK Technische School Dominicus Savio)
    summary: 'De technische school die in 1968 werd geopend als RK Technische School Dominicus Savio, na een ingrijpende verbouwing in 2007 veranderd in een bedrijfsverzamelgebouw. De verrassing zit aan de achterkant, onder zeven sheddaken.'
    body: |
      De technische school die in 1968 werd geopend onder de naam RK Technische School Dominicus Savio is na een ingrijpende verbouwing in 2007 veranderd in een bedrijfsverzamelgebouw. Oorspronkelijk had de school aan de Jan Evertsenstraat een getrapte opbouw met drie bouwdelen: een groot haakvormig volume van vier bouwlagen, een kleiner rechthoekig volume van drie lagen en een aanbouw van twee lagen. De laatste twee bouwvolumes zijn gesloopt bij de herontwikkeling van de locatie. In 2007 is het gebouw heropend onder de naam Vliegbasis De Huygens: een bedrijfsverzamelgebouw voor kleine bedrijven met een gezamenlijke receptie en kantine.

      Het architectenbureau K.P. Tholens & L. van Steenhardt Carré ontstond in de jaren vijftig. Tholens had veelal katholieke opdrachtgevers, waarvoor hij voornamelijk kerken bouwde, onder andere de Sint Josephkerk in Bos en Lommer. In de nieuwe compositie aan de straat speelt het bewaard gebleven deel van de school een ondergeschikte rol. De verrassing zit aan de achterkant, waar de praktijklokalen bewaard zijn gebleven. Hier is de oude school het dominante element van het ensemble dat afsteekt tegen een decor van nieuwbouw.

      Let op:
      - het kader van gele gevelplaten om de gevel, dat ter hoogte van de entreepartij breder is;
      - de 21 vensters van verschillende afmetingen in de entreepartij, volgens een willekeurig patroon en zonder rekening te houden met het raster van de gevelplaten;
      - de praktijkruimte onder de zeven sheddaken met een glazen pui.
    attributes:
      original_use: Rooms-katholieke technische school
    sources:
      - https://data.amsterdam.nl/monumenten/b5df5235-85b4-4e2a-892a-3cf4281d38c6

- title: Knijtijzer blocks
  summary: 'A fan of 364 Rochdale homes on the Jan Evertsenstraat: walk-up flats topped with three storeys of gallery flats, brick lift towers that wink at Berlage''s Mercatorplein, and 1950s shop pavilions at their feet.'
  body: |
    Herman Knijtijzer designed this estate for the housing association Rochdale in 1955–1957, on the northern edge of the Overtoomse Veld garden city. Four identical L-shaped hooks fan out at angles of just over 100 degrees. The long legs are classic four-storey walk-up blocks; the short legs, facing the Jan Evertsenstraat, are seven-storey buildings that stack three storeys of small gallery flats for single people on top of four storeys of family walk-ups, a hybrid the register singles out. A lift in a brick shaft against the east end serves the galleries, rising out of a one-storey pavilion with a shop.

    Knijtijzer gave the estate a quiet, carefully detailed modernism with a Scandinavian touch: smooth red brick, crisp concrete lintels, entrance porches stepped slightly forward, and a grid of balconies. Even the railings sort the rooms: steel bars for the living-room balconies on the south and west, pine slats for the kitchen "work balconies" on the north and east. He later spent decades on the city's monument inventory, the Commissie Dooijes, that laid the groundwork for listing buildings like this one. The young Piet Blom interned with him and worked on flats in West, but found the style too dull.

    In the early 2000s the blocks were on the demolition list. Residents now complain of mould, draughts and leaks, and Rochdale started repairs in 2025 while working out a larger renovation.

    Look for:
    - the brick lift shafts, built like towers in a nod to Berlage's Mercatorplein nearby;
    - the galleries with screens of pine slats on teak rails;
    - on the west gable of a tall block, a concrete canopy with a hoisting hook, and a drainpipe that pops out of the wall halfway up.
  category: housing
  lat: 52.369126
  lng: 4.841227
  address: Jan Evertsenstraat 105-471, Jan Voermanstraat 2-120, Derkinderenstraat 105-143
