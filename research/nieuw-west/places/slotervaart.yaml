  nl:
    title: Voormalige Christelijke MTS (Lumion)
    summary: 'Betonnen technische school van J.B. Ingwersen uit 1973, een van de jongste monumenten van Nieuw-West, met een gymzaal die aan zijn betonnen spanten lijkt opgehangen. Sinds 2019 school Lumion.'
    body: |
      De school ligt in de strook met scholen en bedrijfsgebouwen die het woongebied van Slotervaart scheidt van het bedrijventerrein in de Riekerspolder, op een strategisch punt tussen de spoorlijn en de ringweg. Het complex bestaat uit een rechthoekig bouwvolume van drie bouwlagen en zes kleinere bouwvolumes van een enkele bouwlaag gelegen aan twee gangen: vijf met praktijkruimten voor de technische apparatuur en een met de gymzaal. Alle gevels zijn uitgevoerd in beton, onderbroken door stroken met stalen vensters.

      J.B. Ingwersen (1921-1996) ontwierp in zijn carrière een groot aantal scholen en kantoorgebouwen in Amsterdam en omgeving, waaronder meerdere scholen in Slotervaart. Het materiaalgebruik van de scholen komt overeen: betonnen gevels, platte daken en grote vensters. Een terugkerend element zijn de gymzalen, die allen uitgevoerd zijn in beton, met betonnen spanten. Bijzonder aan het hoge bouwdeel is de terugliggende entree met de verdiepingen erboven op kolommen, aan de laagbouw het overstekende dak en aan de gymzaal de betonnen spanten waar het gebouw aan lijkt opgehangen.

      Van 2015 tot 2019 verbouwde Atelier PRO het complex tot school Lumion (mavo, havo, vwo). De betonnen gevels werden gereinigd en hersteld, een deel van de praktijklokalen verdween, en een nieuwbouwdeel werd via een glazen centrale hal met het monument verbonden.

      Let op:
      - de drie horizontale betonnen banden van het hoofdgebouw, met daartussen betonnen kolommen en teruggelegde vensterstroken;
      - de hardstenen trap met bordes voor de hoofdentree, met aan weerszijden betonnen banken tussen de kolommen;
      - het vooruitspringende dak boven de vensters van de laagbouw, als een soort luifel op betonnen kolommen.
    attributes:
      original_use: Christelijke middelbare technische school
    sources:
      - https://data.amsterdam.nl/monumenten/a1c84e73-1fef-4205-a79d-db4f30836d12

- title: Former Pascal Lyceum (Broedplaats LELY)
  summary: 'Ben Ingwersen''s 1960s school by the Lelylaan: a slab of classrooms, a sculptural stair tower, an assembly hall under a vaulted roof and a gym that floats on concrete stilts. Now a home for artists and circus.'
  body: |
    The Christelijk Lyceum Pascal, later the Calvijn College, was built in 1963–1965 to a design by Ben Ingwersen, whom the city calls a leading Amsterdam architect of schools and churches. It is the last survivor of a whole zone of schools planned on this spot, and stands in the green between the Cornelis Lelylaan and the Schipluidenlaan like a small campus.

    The parts are clearly separated. A calm rectangular slab of classrooms is the backdrop for an expressive stair tower at the front, whose concrete core pushes through the roof, and an assembly hall with a spectacular curved roof at the back. The gyms and the caretaker's house sit in a separate block raised on concrete pilotis, the only one of Ingwersen's gyms lifted off the ground. Inside, the hall on the first floor flows into the lower assembly hall, so the stairs can double as an auditorium; original details survive, down to the study nooks with formica tables.

    The Calvijn College moved to the Pieter Calandlaan in 2015. The building became Broedplaats LELY, run by Urban Resort, which housed the art centre De Appel from 2017 to 2024 and offers about 4,000 m² for artists, makers and social enterprises, with dance and circus groups in the gym. It is part of a larger redevelopment called The Hive, due to be completed in 2027.

    Look for:
    - the school's original name in bronze letters on the blind south wall of the gym;
    - the cosmography classroom perched in the middle of the roof;
    - the wedge pattern in the concrete skin of the assembly hall, and the remains of a rock garden around it;
    - in the entrance hall, Jan de Baat's winged relief *Gevleugeld hart* (1967), with pupils' names scratched into it.
  category: schools
  lat: 52.357109
  lng: 4.837338
