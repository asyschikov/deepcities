  nl:
    title: Vliegbasis De Huygens (vm. RK Technische School Dominicus Savio)
    summary: "Het restant van een katholieke technische school uit 1968, deels gesloopt en nu een bedrijfsverzamelgebouw. Loop om naar de achterkant: daar liggen de oude praktijklokalen nog onder zeven sheddaken."
    body: |
      Aan de straatkant zie je er weinig van, dus loop even om. Achterin liggen de oude werkplaatsen van een technische school: een glazen pui met daarboven zeven sheddaken. Nergens anders zie je zo duidelijk wat hier ooit geleerd werd.

      De school ging in 1968 open als RK Technische School Dominicus Savio en heette later Huygensschool. K.P. Tholens, die eerder meetekende aan de Sint Josephkerk in Bos en Lommer, en zijn jongere compagnon L. van Steenhardt Carré bouwden haar trapsgewijs op uit drie delen langs de Jan Evertsenstraat: een L-vormig blok van vier lagen, een blok van drie lagen en een lagere aanbouw met twee lagen.

      Tussen 2005 en 2007 gingen de twee kleinere delen tegen de vlakte voor woningbouw. Daarbij kwam ook een woontoren van negentien verdiepingen, pal tegen de westgevel van de school. Het grootste blok bleef overeind, werd opgeknapt en ging in 2007 weer open als Vliegbasis De Huygens, een verzamelgebouw voor kleine bedrijven met één receptie en een gedeelde kantine. Aan de straat speelt het nu de tweede viool naast de nieuwe blokken.

      Let op:
      - het kader van gele platen rond de gevel, breder bij de entreepartij
      - de 21 ramen van allerlei maten, kriskras over de entreepartij verspreid, zonder zich iets aan te trekken van het raster van de platen
      - de lange raamstroken tussen betonnen borstweringen, één per verdieping
      - aan de achterkant de werkplaatsen onder de sheddaken
    attributes:
      original_use: Rooms-katholieke technische school
    sources:
      - https://data.amsterdam.nl/monumenten/b5df5235-85b4-4e2a-892a-3cf4281d38c6

- title: Knijtijzer blocks
  summary: 'A fan of 364 Rochdale homes on the Jan Evertsenstraat: walk-up flats topped with three storeys of gallery flats, brick lift towers that wink at Berlage''s Mercatorplein, and 1950s shop pavilions at their feet.'
  body: |
    Herman Knijtijzer designed this estate for the housing association Rochdale in 1955–1957, on the northern edge of the Overtoomse Veld garden city. Four identical L-shaped hooks fan out at angles of just over 100 degrees. The long legs are classic four-storey walk-up blocks; the short legs, facing the Jan Evertsenstraat, are seven-storey buildings that stack three storeys of small one- and two-room gallery flats on top of four storeys of family walk-ups, a hybrid the register singles out. A lift in a brick shaft against the east end serves the galleries, rising out of a one-storey pavilion with a shop.

    Knijtijzer gave the estate a quiet, carefully detailed modernism with a Scandinavian touch: smooth red brick, crisp concrete lintels, entrance porches stepped slightly forward, and a grid of balconies. Even the railings sort the rooms: steel bars for the living-room balconies on the south and west, pine slats for the kitchen "work balconies" on the north and east. He later spent decades on the Commissie Dooijes, which inventoried every monument in Amsterdam. The young Piet Blom interned with him and worked on flats in West, but found the style too dull.

    In the early 2000s the blocks were on the demolition list. Residents now complain of mould, draughts and leaks, and Rochdale started repairs in 2025 while engineers studied what a lasting fix would take.

    Look for:
    - the brick lift shafts, built like towers in a nod to Berlage's Mercatorplein nearby;
    - the galleries with screens of pine slats on teak rails;
    - on the west gable of a tall block, a concrete canopy with a hoisting hook, and a drainpipe that pops out of the wall halfway up.
  category: housing
  lat: 52.369126
  lng: 4.841227
  address: Jan Evertsenstraat 105-471, Jan Voermanstraat 2-120, Derkinderenstraat 105-143
