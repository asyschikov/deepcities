  nl:
    title: Voormalig Christelijk Lyceum Pascal (Broedplaats LELY)
    summary: "Een school van Ben Ingwersen uit de jaren zestig aan de Lelylaan: een rustige lokalenschijf, een beeldhouwerige traptoren, een aula onder een gewelfd dak en een gymzaal die op betonnen poten zweeft. Nu werken er kunstenaars en circusmensen."
    body: |
      De gymzalen staan op betonnen poten, alsof ze elk moment kunnen wegwandelen. Volgens het monumentenregister kom je dat bij dit soort gebouwen zelden tegen. Het Christelijk Lyceum Pascal, later het Calvijn College, verrees in 1963 tot 1965 naar ontwerp van Ben Ingwersen, door de gemeente een toonaangevend Amsterdams architect van scholen en kerken genoemd. Hier was ooit een hele strook scholen gepland; dit is het enige wat ervan over is. Het ligt als een kleine campus in het groen tussen de Cornelis Lelylaan en de Schipluidenlaan.

      Elk onderdeel staat op zichzelf. Een sobere rechthoekige lokalenschijf dient als achtergrond voor een uitbundige traptoren aan de voorkant, waarvan de betonnen kern door het dak prikt, en achteraan een aula met een spectaculair gebogen dak. Gymzalen en conciërgewoning zitten in het losse blok op pilotis. Binnen loopt de hal op de eerste verdieping over in de lager gelegen aula, zodat de trap ook als tribune werkt. Er is nog veel origineel, tot de studienisjes met formica tafeltjes aan toe.

      Ook kunst hoorde erbij: een groot werk van glas en kunststof van Joop van den Broek, die ook het Phoenix-raam aan Plein '40-'45 maakte. Het ging in delen aan de gevel en was in 1968 klaar. Vogels bouwden nesten in de beschutte holtes, en poep en weer vraten het aan tot er stukken afvielen. Geld voor herstel had de school niet. Vanaf eind jaren zeventig werd het stukje bij beetje weggehaald; in 1988 verdween de rest in een container. Het frame bleef aan de muur.

      In 2015 verhuisde het Calvijn College naar de Pieter Calandlaan. Urban Resort maakte er broedplaats LELY van, met van 2017 tot 2024 kunstcentrum De Appel en verder zo'n 4.000 m² voor kunstenaars, makers en sociale ondernemers; in de gymzaal oefenen dans- en circusgroepen. Het gebouw hoort bij een grotere herontwikkeling, The Hive, die in 2027 klaar moet zijn.

      Let op:
      - de oorspronkelijke schoolnaam in bronzen letters op de blinde zuidgevel van de gymzaal;
      - het kosmografielokaal dat midden op het dak staat;
      - het wigvormige patroon in de betonnen huid van de aula, en de restanten van een rotstuin eromheen;
      - in de entreehal het reliëf *Gevleugeld hart* (1967) van Jan de Baat, een gevleugeld reliëf met namen die leerlingen erin hebben gekrast;
      - het lege bevestigingsframe op de gevel waar het glaswerk van Van den Broek aan hing.
    attributes:
      original_use: Christelijke middelbare school
      artist: Jan de Baat (reliëf Gevleugeld hart, 1967)
      check_note: De constructie waaraan het gevelkunstwerk van Joop van den Broek hing, zat er in 2014 nog; sinds de verbouwing tot LELY niet bevestigd.
    sources:
      - https://data.amsterdam.nl/monumenten/caef185d-ead4-4fb1-b38d-b29d75d979a0
      - https://nl.wikipedia.org/wiki/Schipluidenlaan_10-12
      - https://geheugenvanwest.amsterdam/page/21144/kunstwerk-aan-gevel-scholengemeenschap-pascal

- title: Former Stibbe coat factory (Koningin Wilhelminaplein)
  summary: 'A glass box on a visible concrete frame, built in the early 1960s as a coat factory with showrooms and a roof terrace on top. It closes the row of fashion buildings that made the Wilhelminaplein Amsterdam''s garment district.'
  body: |
    In the 1960s the open ground between the railway and the A10 at the Koningin Wilhelminaplein filled up with buildings for the garment industry, led by the huge Confectiecentrum (now the World Fashion Centre). Marius Duintjer, architect of the Opstandingskerk ("De Kolenkit"), designed this coat factory for the Stibbe firm in 1961–1964. It stands at the western end of the row and served as the gateway from the Lelylaan into the fashion district.

    The load-bearing concrete frame is on show everywhere: the floor beams poke out between the storeys, and the walls between are glass in a regular square grid of slim steel frames. The plan reads from outside. The semi-basement held dispatch and storage, the ground floor reception, offices and a complete flat for the caretaker, the first floor design and production. The recessed top floor was for show: directors' rooms, showrooms and a canteen opening onto a roof terrace. The name STIBBE once stood in large letters on the roof between the lift and boiler housings. A planned extension to the north was never built.

    Look for:
    - the projecting floor beams and the steel window grid;
    - the red-painted brick volumes and blue balustrade on the top floor (nobody is sure these are the original colours);
    - the neighbours along the square, where the district now grows upwards: Berghaus (MVSA with Heyligers, 2024) sets two housing towers and an office tower on a 1964 fashion building at nos. 2-6, in black ceramics and bronze-gold aluminium meant to recall the Amsterdam School and Art Deco, and KCAP's OKU House (2024) perches 324 rental homes on W-shaped columns above The Fashion House (A.G. and J.D. Postma, 1964) at nos. 8-10, largely prefab and built to be taken apart;
    - Nico Onkenhout's Queen Wilhelmina in her fur coat (1968), across the square in front of the World Fashion Centre: the garment centre ordered her partly for what she had meant to the Jewish community, and Onkenhout made her "a bit of a general", with a hat modelled on a soldier's helmet. Alderman Wim Polak thought one more Wilhelmina was too many (an equestrian one was coming for the Rokin), so the 30,000-kilo dolomite queen went indoors and Onkenhout unveiled her himself on 4 July 1968. In 1993 the World Fashion Centre wanted rid of her and the Overloon war museum was considered; she ended up outside by one of the towers. A verse by Jan Campert is on the back.
