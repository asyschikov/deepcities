  nl:
    title: Telefooncentrale Plesmanlaan
    summary: "Een telefooncentrale uit 1960 als een doos van prefab betonnen cassetten, bedoeld om de zon weg te houden bij de schakelapparatuur; bij grote hitte konden er zandzakken in. Boven de deur worden twee bronzen figuren met elkaar doorverbonden."
    body: |
      Bij extreme hitte konden er zandzakken in de gevel. De betonnen cassetten aan de Plesmanlaan, met daarin zonwerend thermopaneglas, moesten de kabels en de apparatuur tegen warmte beschermen. Was dat niet genoeg, dan konden de vakken worden volgestapeld met zandzakken.

      De nieuwe westelijke tuinsteden hadden telefoonlijnen nodig. Publieke Werken bouwde er drie vergelijkbare centrales voor, in Slotervaart, Osdorp en Buitenveldert, elk met eigen kleuren en een eigen beeld. Deze, ontworpen door B.J. Odink en J.W. Kamerling, ging op 28 oktober 1960 open, met ruimte voor 20.000 aansluitingen. Door een tekort aan personeel kwamen er eerst maar 4.000; rond 2000 waren er nog zo'n 17.000 in gebruik.

      Alles aan het gebouw volgt uit wat het moest doen. Boven het platte dak steekt een opengewerkte betonnen schoorsteen uit, en aan de kant van de Ottho Heldringstraat zit een lagere, glazige dienstwoning tegen de centrale aan. In één moeite door werd ook een brug over een zijtak van de Slotervaart ontworpen.

      Boven de teruggelegen ingang hangt *Communicatie* van Lotti van der Gaag. De PTT wilde kunst in de stijl van het gebouw, en zij maakte twee figuren die door een telefoonverbinding aan elkaar hangen. Die verbinding overbrugt meteen de twee helften van het gebouw. De centrale is nu afgesloten en hoort bij Plesman Plaza, vijf nieuwe gebouwen rond een nieuw plein ernaast; binnen moeten een café en kantoren komen. De tweeling in Osdorp staat nog aan de Louis van Sonsbeekstraat, die in Buitenveldert werd in 2012 gesloopt.

      Let op:
      - de cassettegevel, en aan de achterkant de stalen luifels die vroeger boven de ramen hingen
      - het bronzen beeld boven de deur, met een oorschelp tussen de vormen
      - de opengewerkte betonnen schoorsteen
    attributes:
      original_use: Telefooncentrale met dienstwoning
    sources:
      - https://data.amsterdam.nl/monumenten/fc157672-3fda-4385-b20a-097ccad58a4d
      - https://nl.wikipedia.org/wiki/Telefooncentrale_Amsterdam-Slotervaart
      - https://nl.wikipedia.org/wiki/Communicatie_(Lotti_van_der_Gaag)

- title: Calvariekerk (Overtoomse Veld)
  summary: 'A sober 1950s church on the Postjesweg, built by the city for the Apostolisch Genootschap, with stained glass running from plinth to eaves along both long walls. Since 1982 a Pentecostal church.'
  body: |
    Where the Postjesweg leaves the A10 behind and enters the Overtoomse Veld, two churches mark the edges of the neighbourhood like beacons: this one at the Derkinderenstraat and the Herdenkingskerk further west. The city of Amsterdam built this one in 1956–1957 for the Apostolisch Genootschap, to a design by the Hilversum architect M.E. Hartman, who otherwise worked mostly in his home town.

    It is a traditional rectangular church in post-war dress: light brown brick, concrete frames, a shallow hipped roof. The hall seats 446, with a balcony for 166 more at the west end and a fixed organ at the east end. Unlike many post-war churches it had no community rooms; nearly everything served worship. A wide flight of steps leads up to a deep porch under a concrete canopy on four columns.

    The Apostolisch Genootschap left in 1982. The Pentecostal mission of the evangelist Johan Maasbach took over and gave the building its name, Calvariekerk (Calvary Church).

    Look for:
    - the central band of each long wall, divided into seven bays by concrete columns and filled with stained glass;
    - the small windows with broad concrete frames for the side rooms;
    - the raised entrance with its four-column canopy.
