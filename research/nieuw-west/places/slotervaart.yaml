  nl:
    title: De Ark (Slotervaart)
    summary: "Een kerk die oprijst uit een laag buurthuis, onder een golvend schaaldak. Piet Zanstra bouwde haar in 1961; zijn dochter ontwierp de bronzen deuren met het verhaal van Noach."
    body: |
      Een trouwe ploeg gemeenteleden ging elke maand met spaarzegels de deuren langs in Slotervaart. Zo kwam een flink deel van het geld bij elkaar, en op 12 april 1960 ging de eerste paal de grond in. Architect was Piet Zanstra, de man die later ook de Europarking en het Maupoleum zou ontwerpen.

      Zanstra maakte er een kerk met een buurthuis omheen van. De kerkzaal, voor 255 mensen, is twee verdiepingen hoog en heeft een organisch gebogen schaaldak. Daaromheen ligt alles gelijkvloers: een zaal die er nog 190 plaatsen bij geeft, lokalen om te knutselen, een kantoortje voor de wijkverpleging en de maatschappelijk werkster, en een 'huiskamer' voor de buurt.

      De hervormde gemeente vroeg twee dingen die nieuw waren in de protestantse kerkbouw: het gebouw moest ook doordeweeks open kunnen, en er moest een kleine bidkapel in. Waar die zit, zie je aan een bult in het dak. Zes ramen in de oostgevel vertellen het scheppingsverhaal. Die in de kerkzaal zijn vervangen, het raam in de kapel is nog het oude. Op de losse stalen klokkenstoel staat een kruis.

      In 2015 ging de westgevel eraf om ruimte te maken voor twaalf woningen, om de kerk extra inkomsten te bezorgen. De rest werd in 2015 en 2016 verbouwd, wat velen nog steeds omstreden vinden. De Ark is nog altijd protestantse kerk en buurthuis tegelijk.

      Let op:
      - de bronzen voordeuren van Irene Lopez-Zanstra, met vier taferelen uit het verhaal van Noach: de bouw van de ark, de dieren die naar binnen trekken, de duif met het takje en het dankoffer
      - de gebogen daken die oprijzen uit de platte, glazen onderbouw
      - de open stalen klokkentoren op vier poten, in de as van de ingang
    attributes:
      original_use: Nederlands Hervormde kerk met wijkcentrum
    sources:
      - https://data.amsterdam.nl/monumenten/67acf682-5ed2-4f05-a0b2-55a42cfe18f5
      - https://nl.wikipedia.org/wiki/De_Ark_(Slotervaart)
      - https://www.reliwiki.nl/index.php/Amsterdam,_Van_Ollefenstraat_9_-_De_Ark

- title: Verrijzeniskerk
  summary: "A low Catholic church hidden in the green along the Slotervaart canal, sometimes compared to Le Corbusier, with a bell tower made as a spiral of curved concrete shells standing on the axis of the street."
  body: |
    The Church of the Resurrection (*Verrijzenis van Onze Heer Jezus Christus*) was designed by Gerard Holt, the Haarlem architect and Delft professor who also built the Sint Josephkerk in Bos en Lommer. It was the heart of a Catholic cluster of church, presbytery, hall and school around a small square in the bend of the Louis Bouwmeesterstraat. The Mgr. Noletschool has been replaced by housing; the rest survives, linked by a glass corridor, with low walls, benches and planters that were part of the design.

    Instead of a traditional nave, the altar stands against the long wall. Above a band of concrete, the dark brown brick gives way to dark brown steel plates pierced by windows of different sizes, which hide the frames from view, and a light lantern sits in the middle of the shallow roof. The church is not meant to dominate: it hides among the trees by the water, and only from the southern Louis Bouwmeesterstraat does it appear head on, with its tower exactly on the axis of the road. The tower was not built as drawn; it seems to date from the same years as the church.

    Inside are pieces rescued from the demolished Pius X church, including its Mary statue and globe lamps. Since the 2020 merger of the Catholic parishes of Nieuw-West, the Pauluskerk in Osdorp is the main church; regular weekly masses here ended in 2023, and in the long term the parish plans to give the building up.

    Look for:
    - the bell tower: a spiral of concrete shell segments, with openings left at the height of the bells;
    - the steel facade plates with irregular window openings;
    - the presbytery's chunky concrete chimney and the balcony that doubles as an entrance canopy.
