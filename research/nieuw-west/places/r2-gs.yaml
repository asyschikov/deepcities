  nl:
    title: De Bouwvakarbeider (Jan Havermans)
    summary: "Het bedankje van de tuinstad aan de mannen die haar bouwden: een bronzen bouwvakker die niet werkt maar even zit, en tevreden kijkt naar de nieuwe wijk. Onthuld in 1962, op de zeventigste verjaardag van de beeldhouwer."
    body: |
      Jan Havermans koos niet voor een bouwvakker die volop aan het werk is, maar voor een die even pauzeert. Zijn bouwvakker zit op een bakstenen sokkel in de groenstrook op de hoek van de Burgemeester De Vlugtlaan en de Burgemeester Eliasstraat, uit te rusten, met zijn blik op de flats en straten die hij en zijn collega's net hadden neergezet. Het is een eerbetoon aan de bouwvakkers die in de jaren vijftig en zestig de Westelijke Tuinsteden uit de polder trokken.

      Het ontwerp is van omstreeks 1957 en het origineel stond in 1959 in het Stedelijk Museum, voordat de gemeente het in brons liet gieten. Havermans werd 70 op 26 januari 1962, en precies die dag werd het beeld onthuld; twee jaar later overleed hij. Havermans, die in 1933 met Paul Citroen en Charles Roelofsz de Nieuwe Kunstschool naar voorbeeld van het Bauhaus oprichtte, beeldde graag mensen in rust uit: zijn Rustende tuinder zit op het Jan van Galenplantsoen in West.

      Slotermeer zelf was tien jaar eerder geopend, op 7 oktober 1952. Bij de brug waar de laan de spoordijk passeert, opende koningin Juliana toen symbolisch een 'poort' die zes jongens en zes meisjes samen vormden.

      Let op:
      - de signatuur in het brons
      - zo'n 600 meter oostelijker, op de noordelijke leuning van de Hannie Schaftbrug (brug 601), de plaquette die eraan herinnert dat Juliana hier Tuinstad Slotermeer opende, als eerste tuinstad buiten de Ringspoordijk
    sources:
      - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/853
      - https://nl.wikipedia.org/wiki/De_bouwvakarbeider
      - https://nl.wikipedia.org/wiki/Hannie_Schaftbrug

- title: Entrance mosaics, Speelmanstraat and Freek Oxstraat
  summary: "In two early-1950s streets of Slotermeer the art comes right to the front door: Raymond Both's birds, sun, moon and a hand in the porch niches of the Speelmanstraat, Theo Forrer's musicians and farmers next door, and Both's phoenix on a gallery flat nearby."
  body: |
    Building here began around the turn of 1952 and 1953, on streets named in the summer of 1952 after resistance fighters such as Wim Speelman and Freek Ox. The portico flats on the even side of both streets, by the architects A. Evers and G.J.M. Sarlemijn, each have a row of entrances under brick relieving arches, and the niche of every arch holds a mosaic.

    In the Speelmanstraat Raymond Both made seven of them in a loose, painterly style: birds over the porch at 2-10, sun and moon at 38-46, a hand at 74-82, with fish among the others. Round the corner in the Freek Oxstraat, Theo Forrer, born in Batavia, filled the arches with everyday scenes: musicians, a mother and child, a bricklayer, a farmer threshing. It is not museum art; it is the post-war idea that ordinary tenants should find something beautiful on the way to their front door. When the Speelmanstraat block was renovated, lightly, the mosaics stayed.

    Both did more in the neighbourhood. In 1956 he made a phoenix for the north end wall of Piet Zanstra's flat at Burgemeester Cramergracht 1-98, one of the first two modern gallery flats in Amsterdam (Zanstra later designed the much-hated Maupoleum). The bird, in red, blue, black and white stoneware tiles, was the city's gift to the new flat, and is said to rise from the sand and mud dug out of the Sloterplas. The city's art database credits it to Zanstra; the national study of post-war monumental art gives it to Both.

    Look for:
    - the hand over the porch at Speelmanstraat 74-82 and the sun and moon at 38-46
    - Forrer's bricklayer and thresher in the Freek Oxstraat arches
    - the Phoenix, about 700 m south, on the end wall facing the Burgemeester Röellstraat
  category: street-art
  lat: 52.379559
  lng: 4.830912
  address: Speelmanstraat 2-82 and Freek Oxstraat 2-28
  links:
