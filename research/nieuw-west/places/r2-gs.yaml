    - { label: "Kunstwacht (O, Kora, dochter van Zeus)", url: "https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/871" }
    - { label: "Wikipedia (nl): Johan Limpers", url: "https://nl.wikipedia.org/wiki/Johan_Limpers" }
