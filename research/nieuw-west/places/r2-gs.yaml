  nl:
    title: Manna (Ram Katzir)
    summary: "Vijf sneden wit brood van wit marmer, twee plat als zitplek: een oorlogsmonument uit 2020 in een plantsoen in de verzetsheldenbuurt. De buurt noemt het 'Halfje gesneden wit'. Het brood dat in 1945 uit de lucht leek te vallen, was eigenlijk Zweeds."
    body: |
      De straten rond het Meerwaldtplantsoen zijn vernoemd naar verzetsstrijders, het plantsoen zelf naar Arthur 'Boems' Meerwaldt, een advocaat uit het studentenverzet die in augustus 1944 vijftien jaar tuchthuis kreeg en in januari 1945 in het Duitse Escherhausen overleed. Toen het plantsoen van Mien Ruys in 2018–2020 werd opgeknapt, kozen gemeente, Stadscuratorium en buurtbewoners uit de ontwerpen van drie kunstenaars een monument. Het werd Ram Katzir, die ook het monument met de lege stoelen bij de fusilladeplaats Rozenoord maakte.

      Zijn Manna bestaat uit vijf sneden Zweeds wittebrood, uitgehakt in wit marmer: twee liggend en laag genoeg om op te zitten, drie rechtop, waaronder het kapje. In de volksmond heet het 'Halfje gesneden wit'. Het brood staat voor overleven aan het eind van de Hongerwinter. Veel mensen herinneren zich wittebrood dat in april en mei 1945 aan parachuutjes naar beneden kwam, maar bij Operatie Manna werden voedselpakketten gedropt. Het witbrood was al in februari gebakken, van meel dat drie schepen van het Zweedse Rode Kruis hadden aangevoerd. Manna is het hemelbrood uit de Bijbel, en in het Arabisch een lekkernij met pistache.

      Het werk is ook bedoeld als ontmoetingsplek, bijvoorbeeld voor een vrijheidsmaaltijd op 5 mei waarbij buren eten uit hun eigen keuken meebrengen.

      Let op:
      - de opening tussen de derde en vierde snee, vrijgelaten voor spelende kinderen
      - de infotegel die de naam uitlegt
      - het kapje tussen de staande sneden
    sources:
      - https://stadscuratorium.nl/kunstwerk-manna-van-ram-katzir-onthuld/
      - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/1037
      - https://nl.wikipedia.org/wiki/Manna_(Ram_Katzir)
      - https://nl.wikipedia.org/wiki/Meerwaldtplantsoen

- title: "O, Kora, dochter van Zeus (Johan Limpers)"
  summary: "The bronze girl that won Johan Limpers the Prix de Rome in 1940. Four years later he was shot as a resistance fighter; in 1969 a committee in his memory had his prize piece cast, on a street named after a comrade from the same attack."
  body: |
    In 1940 Johan Limpers, after six years at the Rijksakademie, won the prestigious Prix de Rome with a *korè*: a standing, robed girl in the archaic Greek manner. Then came the occupation. Limpers refused to send work to exhibitions run by the German culture department and turned down an extra grant the occupiers offered him. With the sculptor and resistance leader Gerrit van der Veen he set up the illegal paper *De Vrije Kunstenaar* (the free artist), he forged identity cards and smuggled two Jewish children out of Germany, and on 27 March 1943 he took part in the attack on the Amsterdam population register. He was arrested in 1944 and shot in the dunes near Overveen on 10 June 1944, together with Van der Veen and the printer Frans Duwaer. He lies in the Eerebegraafplaats Bloemendaal.

    In 1969 a committee in his memory had the prize piece cast in bronze and set up here. It does not stand on the plinth Limpers designed, which had reliefs of plants sprouting and dying, but on a plain, column-shaped pedestal. The street is named after Willem Arondeus, another of the register attackers, executed in 1943, and the girl looks out over the street named after Limpers himself. Two streets further, Leo Braat's *De Antifascist* is by an editor of the same illegal paper.

    Look for:
    - the inscription "IN 1940 GEMAAKT DOOR JOHAN LIMPERS DIE IN 1944 ALS VERZETSSTRIJDER WERD GEFUSILLEERD"
    - the street signs of the Arondeusstraat and the Johan Limpersstraat
  category: hidden-history
  lat: 52.383561
  lng: 4.825878
  address: Arondeusstraat, opposite the Johan Limpersstraat
  links:
