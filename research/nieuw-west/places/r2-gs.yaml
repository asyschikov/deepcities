  nl:
    title: Portiekmozaïeken, Speelmanstraat en Freek Oxstraat
    summary: "In twee straten van Slotermeer uit de vroege jaren vijftig komt de kunst tot aan de voordeur: vogels, zon, maan en een hand van Raymond Both in de portieken van de Speelmanstraat, muzikanten en boeren van Theo Forrer om de hoek, en Boths feniks op een galerijflat verderop."
    body: |
      Rond de jaarwisseling van 1952 op 1953 begon hier de bouw, in straten die in de zomer van 1952 naar verzetsstrijders als Wim Speelman en Freek Ox waren vernoemd. De portiekflats aan de even kant van beide straten, van de architecten A. Evers en G.J.M. Sarlemijn, hebben een rij ingangen onder gemetselde ontlastingsbogen. In de nis van elke boog zit een mozaïek.

      In de Speelmanstraat maakte Raymond Both er zeven, los en schilderachtig van stijl: vogels boven portiek 2-10, zon en maan bij 38-46, een hand bij 74-82, en verder onder meer vissen. Om de hoek in de Freek Oxstraat vulde de in Batavia geboren Theo Forrer de bogen met alledaagse taferelen: muzikanten, een moeder met kind, een metselaar, een dorsende boer. Museumkunst is het niet. Het is het naoorlogse idee dat gewone huurders op weg naar hun voordeur iets moois moesten tegenkomen. Bij de lichte renovatie van het blok aan de Speelmanstraat bleven de mozaïeken zitten.

      Both deed meer in de buurt. In 1956 maakte hij een feniks voor de noordelijke kopgevel van de flat van Piet Zanstra aan de Burgemeester Cramergracht 1-98, een van de eerste twee moderne galerijflats van Amsterdam (Zanstra ontwierp later het verguisde Maupoleum). De vogel, van rode, blauwe, zwarte en witte grestegels, was een cadeau van de gemeente aan de nieuwe flat en zou oprijzen uit het zand en de modder van de afgraving van de Sloterplas. Kunstwacht schrijft het werk toe aan Zanstra, het rijksonderzoek naar monumentale kunst van de wederopbouw aan Both.

      Let op:
      - de hand boven portiek Speelmanstraat 74-82 en zon en maan bij 38-46
      - Forrers metselaar en dorser in de bogen van de Freek Oxstraat
      - de Phoenix, zo'n 700 meter zuidelijker, op de kopgevel aan de kant van de Burgemeester Röellstraat
    attributes:
      check_note: De nieuwste gedateerde foto's van de portiekmozaïeken en de Phoenix zijn van oktober en augustus 2018.
    sources:
      - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/841
      - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/840
      - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/888
      - https://nl.wikipedia.org/wiki/Speelmanstraat
      - https://nl.wikipedia.org/wiki/Freek_Oxstraat
      - https://nl.wikipedia.org/wiki/Phoenix_(Both)

- title: Manna (Ram Katzir)
  summary: "Five slices of white bread in white marble, two lying down as seats: a 2020 war memorial in a park of the resistance neighbourhood. Locals call it 'Halfje gesneden wit'. The bread people remember falling from the sky in 1945 was in fact Swedish."
  body: |
    The streets around the Meerwaldtplantsoen are named after resistance fighters, and the little park itself after Arthur "Boems" Meerwaldt, a lawyer in the student resistance who was sentenced in August 1944 to fifteen years' hard labour and died at Escherhausen in Germany in January 1945. When the park, laid out by Mien Ruys, was redone in 2018–2020, the city, the Stadscuratorium (the city's public-art advisers) and residents chose a memorial from three artists' proposals. They picked Ram Katzir, who also made the empty-chairs memorial at the Rozenoord execution site.

    His *Manna* is five slices of Swedish white bread carved in white marble: two lying flat, low enough to sit on, three standing upright, one of them the heel of the loaf. Locally it is known as *Halfje gesneden wit* (half a sliced white). The bread stands for survival at the end of the Hunger Winter. Many people remember white bread floating down on little parachutes in April and May 1945, but the drops of Operation Manna were food parcels; the white bread had been baked in February from flour brought in by three ships of the Swedish Red Cross. Manna is the bread from heaven of the Bible, and in Arabic a sweet made with pistachios.

    The work is also meant as a meeting place, for a neighbourhood freedom meal on 5 May, say, where people bring food from their own kitchens.

    Look for:
    - the gap between the third and fourth slice, left open for children to run through
    - the information tile that explains the name
    - the heel of the loaf among the standing slices
