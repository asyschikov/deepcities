  nl:
    title: De Antifascist (Leo Braat)
    summary: "Een bronzen kop van een onbekende strijder, waarschijnlijk uit de Spaanse Burgeroorlog, die Leo Braat in 1936 maakte. Dertig jaar later werd het het gedenkteken voor Willem Kraan, de stratenmaker die in 1941 de Februaristaking mee op gang bracht."
    body: |
      De buste op de hoek van de Willem Kraanstraat is geen portret van Willem Kraan. Leo Braat maakte hem in 1936, waarschijnlijk als een strijder uit de Spaanse Burgeroorlog; bij de rechterschouder lees je 'aan de onbekende soldaat'. Braat, beeldhouwer, dichter en criticus, zat in de oorlog zelf in het kunstenaarsverzet rond Gerrit van der Veen en was redacteur van het illegale blad De Vrije Kunstenaar. In 1966 werd de kop in brons gegoten en op een stenen voetstuk gezet, met een plaquette: 'De Antifascist, voor Willem Kraan'. Het beeld werd op 26 februari 1966 onthuld, 25 jaar na de staking.

      Kraan was stratenmaker bij Publieke Werken en lid van de CPN. Op zondag 23 februari 1941 zag hij bij zijn schoonouders aan de Nieuwmarkt hoe Duitse politie in de Jodenbuurt huishield. Ontdaan vertelde hij het aan zijn vriend, vuilnisman Piet Nak: daar moest iets aan gebeuren, de boel moest plat. Samen fietsten ze de stad door om collega's op te roepen, en op 25 februari legde Amsterdam het werk neer tegen de Jodenvervolging. Kraan werd in november 1941 opgepakt, in juli 1942 ter dood veroordeeld en op 19 november 1942 met 32 anderen bij Soesterberg gefusilleerd.

      Let op:
      - de woorden bij de rechterschouder
      - de bronzen plaquette in het voetstuk
      - Kora van Limpers twee straten noordelijker, het gedenkteken voor een beeldhouwer uit dezelfde kring
