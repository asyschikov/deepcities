  nl:
    title: De sleutel ligt onder de deurmat (Martijn Sandberg)
    summary: "In de trap naar woontoren De Zilverling zit onder de treden een zin van betonnen pixels: 'de sleutel ligt onder de deurmat'. Je kunt hem alleen lezen als je recht voor de trap staat, dus het werk is lastig te vinden."
    body: |
      Bij de vernieuwing van Geuzenveld rond 2010 vroeg woningcorporatie Stadgenoot aan Martijn Sandberg om een kunstwerk bij De Zilverling, een nieuwe woontoren van LEVS architecten op een talud langs de Dr. H. Colijnstraat. Je komt erin via een stenen trap op de hoek, en daar zit het werk. Onder de overstekjes van de treden zette Sandberg kleine betonnen blokjes, een soort pixels. Wie naar boven loopt, ziet alleen structuur. Wie recht voor de punt van de trap gaat staan en nog eens kijkt, leest: De sleutel ligt onder de deurmat.

      De zin verwijst naar de wederopbouwjaren, toen ook hier veel mensen een sleutel onder de mat legden om er altijd in te kunnen. Sandberg maakte een persoonlijke boodschap openbaar en verstopte haar meteen weer in de architectuur: net als bij de sleutel moet je weten waar je moet kijken. De trap werd in 2011–2012 gebouwd; het hele werk meet 12 bij 3 bij 23 meter.

      Sandberg werkt graag met taal op de grens van leesbaar en onleesbaar. Elders in Amsterdam verstopte hij Karel Appel was hier in de Dapperstraat en Morgen komt alles goed in de Hofmeyrstraat.

      Let op:
      - de juiste plek: recht voor de punt van de trap, een paar meter terug
      - de blokjes onder de neuzen van de treden, die van dichtbij gewone versiering lijken
      - zo'n 350 meter oostelijker in het Eendrachtspark de Love sphinx (1974) van Carel Kneulman, half figuur en half wapperend brons, door de maker van Het Lieverdje op het Spui een ode aan de vruchtbaarheid genoemd
    sources:
      - https://nl.wikipedia.org/wiki/De_sleutel_ligt_onder_de_deurmat
      - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/928
      - https://nl.wikipedia.org/wiki/Love_sphinx
