  nl:
    title: Pauluskerk
    summary: "Een tent van baksteen, beton en hout aan de Pieter Calandlaan (1966-1967), met een lichtkoepel in het kegeldak boven het altaar. Tot 1977 was de kerk ook theater; nu is het de enige kerk van de Nieuw-Westse parochie met vaste vieringen."
    body: |
      Een kerk in de vorm van een tent: zestien spanten dragen een kegelvormig dak, en een lichtkoepel boven het altaar zorgt voor bijzonder licht. De eerste plannen dateren van 1961. Het gebouw van Jos van Leeuwen verrees in 1966-1967, vlak na het Tweede Vaticaans Concilie, en de ruimte is zo opgezet dat de kerkgangers bij de dienst betrokken worden. Er konden eerst duizend mensen zitten.

      Alleen kerk was het nooit. Tot 1977 deed de zaal ook dienst als theater, en met het parochiehuis, de pastorie en de katholieke scholen erachter vormde de kerk één cluster. Ze kijkt niet naar de drukke straat maar naar het plein aan de Koos Vorrinkweg. Toch springt ze vanaf de Pieter Calandlaan in het oog, want aan beide kanten ligt open ruimte: aan de ene kant het plein, aan de andere de Hoekenesgracht.

      Toen de parochies van Nieuw-West in 2020 opgingen in De Vier Evangelisten, werd de gerenoveerde Pauluskerk de hoofdkerk. Inmiddels is het de enige kerk van die parochie waar nog geregeld diensten zijn. Ook een Poolse parochie komt hier samen.

      Let op:
      - het kegeldak, gezien vanaf de Hoekenesgracht
      - de hoofdingang aan het plein, met de toren erboven
      - de zorgvuldige mix van baksteen, beton en hout
    attributes:
      architect: J.J. (Jos) van Leeuwen
      original_use: Rooms-katholieke kerk, tevens theater
    sources:
      - https://data.amsterdam.nl/monumenten/ee16e23f-cb1a-423c-84b7-1d84c408ac2a
      - https://nl.wikipedia.org/wiki/Pauluskerk_(Amsterdam)
      - https://amsterdamopdekaart.nl/1966-1990/Pieter_Calandlaan/Pauluskerk

- title: Salomonson shopping square, Pieter Calandlaan
  summary: An open corner instead of a street corner. Hein Salomonson's little early-1960s shopping square, with low shop blocks, kiosks under a timber-lined canopy and a paving grid, is the last near-intact one of four such squares in Amsterdam.
  body: |
    Modernist planners hated closed street walls, and this square at Pieter Calandlaan and Meer en Vaart shows the alternative. Instead of building the corner, Hein Salomonson (one of the leading Dutch modernists of the 1950s and 60s, best known for his villas) left it open: two low strips of shops with flats above, set at right angles and loosely linked, frame a small square. Four small pavilions joined by a canopy, plus a fifth on the street line, complete the composition. The idea goes back to Cornelis van Eesteren's 1925 competition entry for Unter den Linden in Berlin; the Lijnbaan in Rotterdam is the famous cousin.

    Amsterdam had three siblings: the Gelderlandplein (modernised beyond recognition), the Confuciusplein (only Bodon's gallery flat over shops is left) and Plein '40-'45 (its composition broken by new buildings). The flats sit back from the shopfronts and have terraces on the shop roofs. The shopfronts have weathered better than the partly wooden upper floors. The register sums it up: here the modern city is scaled down by a master hand to a size where people feel at home.

    Look for:
    - the canopy linking shops and kiosks, its underside lined with varnished Oregon pine
    - the clerestory windows above the canopy, some with their horizontal glazing bars
    - the 30 x 30 cm paving, once divided into four fields by black bands
  category: housing
  lat: 52.354624
  lng: 4.811784
  address: Pieter Calandlaan 88-148, Louis Schottingstraat 1-61, C.K. Eloutstraat 4-38
  links:
    - { label: Monumentenregister Amsterdam (200793), url: "https://data.amsterdam.nl/monumenten/24326c19-1d57-4fd1-a61c-4db322d73be1" }
    - { label: Amsterdam op de kaart, url: "https://amsterdamopdekaart.nl/wederopbouw/Pieter_Calandlaan/88-148" }
