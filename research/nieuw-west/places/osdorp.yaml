  nl:
    title: Garage Notweg
    summary: "Garage met tankstation en showroom uit de jaren zestig, gebouwd voor Fina. Er werden DAF's, Volvo's, Opels en Renaults verkocht. Hellingbaan, kanteldeuren, vlaggenmasten en 'Fina'-putdeksels zijn er nog; nu zit er een broedplaats in."
    body: |
      In de stoep liggen nog putdeksels met 'Fina' erop. Oliemaatschappij Purfina liet deze garage tussen 1961 en 1965 bouwen naar een ontwerp van H.A.M. van den Berg: snelservice, benzinepompen, een showroom, een magazijn en kantoren, waar de Notweg begint, tegenover een strook park. Hij hoorde bij een cluster voorzieningen met scholen en winkels, en laat zien hoe planners toen de auto een vaste plek midden in de wijk gaven. Van den Berg tekende een vergelijkbare garage aan de Johan Huizingalaan.

      In de showroom stonden DAF's, eerst van dealer Minerva en vanaf 1972 van de fabriek zelf, die er tweedehands auto's verkocht. Nadat DAF in 1974 zijn personenauto's aan Volvo had overgedaan, stonden hier tot 1981 Volvo's. Ook garagebedrijf Riva (Opel en Bedford) zat in het pand, en het laatste merk dat hier over de toonbank ging was Renault. In 2006 kocht woningcorporatie Ymere het gebouw om het door woningen te vervangen. Dat liep anders: het werd een bedrijfsverzamelgebouw, in 2013 grondig opgeknapt. Al sinds 2009 is het een broedplaats voor kleine bedrijfjes en stichtingen. Binnen ligt de autohelling er nog.

      Let op:
      - de schokbetonnen puirasters aan voor- en achterkant
      - het siermetselwerk in de zijgevels
      - de originele kanteldeuren en vlaggenmasten
      - het 'Fina'-putdeksel in de stoep
    attributes:
      original_use: Garage, benzinestation en showroom
    sources:
      - https://data.amsterdam.nl/monumenten/4b9c1b90-94c1-4e6e-b2df-9fccb6ff8531
      - https://amsterdamopdekaart.nl/wederopbouw/Notweg/38
      - https://nl.wikipedia.org/wiki/Notweg_(Amsterdam)

- title: Former Heimansschool (Lucasschool), Notweg 32
  summary: "A prefab 'half H-school' of 1959: when The Hague cut school budgets in 1957, Amsterdam built seven of these classroom blocks without the planned hall and gym wing. This is the only one left in its original form."
  body: |
    After the war the H-school was a new and rather luxurious type of primary school: a block of twelve corridor-free classrooms linked by two glazed corridors to a wing with a gym, hall and craft rooms. The original plan for this part of Osdorp had one drawn here. In August 1957 national budget cuts made it impossible, and Publieke Werken designed seven cheap prefab schools instead (here working with the Hague firm A.N. & N. Schippers), built in 1958–1961: in effect half an H-school, only the classroom block, in the hope of adding the rest in better times. The gym came; the hall never did, and the gym here has since been demolished. Of the seven, five have been demolished and one rebuilt beyond recognition.

    Notweg 32 opened in 1959 as the Heimansschool, a public primary school. Three stairwells each served four classrooms, with no corridors at all. Later it housed an adult school and from about 1990 to 2011 the Catholic St. Lukas primary school. In 2012 a camp of rejected asylum seekers stood on the former schoolyard until the mayor ended it. Housing association Stadgenoot converted it in 2022–2023 into thirty flats for young people, with community rooms on the ground floor.

    Look for:
    - the three projecting concrete stairwells on the south side
    - the fully glazed stairwells on the north side, single glass set straight into a slim concrete grid
    - the blind end walls of narrow vertical concrete elements
  category: schools
  lat: 52.363647
  lng: 4.800671
  address: Notweg 32
  links:
    - { label: Monumentenregister Amsterdam (200786), url: "https://data.amsterdam.nl/monumenten/d4eda5d9-50e1-4732-9326-2903f4124e76" }
