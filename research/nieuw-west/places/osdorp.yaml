  nl:
    title: Dubbel woonhuis Dekeukeleire, Osdorperweg 658-660
    summary: "Twee geschakelde eengezinswoningen uit 1978-1980 van F.J.E. Dekeukeleire, de architect van horizontale kantoren in glas en beton. De gemeente wil er een monument van maken; een architectuurblog vindt het juist niet typerend voor zijn werk."
    body: |
      Is dit wel een echte Dekeukeleire? Daarover gaat de discussie rond Osdorperweg 658-660. De gemeente begon de procedure om de twee geschakelde woningen gemeentelijk monument te maken, met als argument dat ze zijn werk en de architectuur van de jaren tachtig vertegenwoordigen. In november 2025 sputterde het blog Love 80's Architecture tegen: geen betonbanden, geen ritme van glas, baksteen en beton en geen plek in een groter plan, dus eerder een gewone villa van eind jaren zeventig dan een typische Dekeukeleire. In het gemeentelijk register stond de aanwijzing bij het schrijven nog in procedure.

      Frits Dekeukeleire (1925-1985) staat vooral bekend om kantoren met brede horizontale stroken glas en beton, van het Wibauthuis (1964) tot het Delta Lloyd-complex aan de Spaklerweg (1977), en om laagbouw zoals de Geerdinkhof in de Bijlmer. Vanaf 1963 woonde hij in een eigen ontwerp aan het Willem Mulierhof in Geuzenveld, niet ver hiervandaan. Deze twee eengezinshuizen aan het landelijke deel van de Osdorperweg zijn een van de kleinere werken op zijn lijst van woningbouw. Het zijn particuliere woningen, alleen vanaf de weg te zien.
    attributes:
      original_use: Twee geschakelde eengezinswoningen
    sources:
      - https://amsterdamopdekaart.nl/p/98/FJE_Dekeukeleire
      - https://www.love80sarchitecture.nl/frontend/osdorperweg-658-660-in-perspectief/

- title: Rust en Vrede farm
  summary: A sober farmhouse of 1934 on the old Osdorperweg farm ribbon, kept almost untouched inside, with its cow stable, cast-iron stable windows, a concrete well and fruit trees that probably date from the build.
  body: |
    Until after the Second World War a dense ribbon of farms lined the Osdorperweg, a peat dike that once also held back the Haarlemmermeer. Most are gone. Rust en Vrede (Rest and Peace) is one of the younger survivors. In 1934 the tenant, dairy farmer Jacobus van Bodegraven, had the 19th-century farmhouse replaced by a plain new house parallel to the road, with a renewed brick cow stable behind it, linked by a short passage. Contractor H. van Steenwijk of Sloterdijk, a firm specialised in farms, also supplied the design. Van Bodegraven, a widower with children, died the next year at 48; the family carried on. The place is still used as a farm.

    The register praises the house for its high degree of intactness: original layout, doors in the Bruynzeel manner with yellow cathedral glass, plaster ceilings even in the attic, and two marble fireplaces that recall the former suite of rooms. The stable lost its original roof after the war but keeps its frame, manure gutters and feed passages.

    Look for:
    - the low house with its strongly projecting wooden gutter and central dormer
    - the five arched cast-iron stable windows along each side of the stable
    - the fruit trees and concrete well beside the stable
  category: green
  lat: 52.369040
  lng: 4.781115
  address: Osdorperweg 614
  links:
