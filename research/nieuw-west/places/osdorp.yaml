  nl:
    title: Hangbrugmaisonettes (Kloosflat)
    summary: "Bij deze flat van J.P. Kloos loop je niet langs andermans keukenraam: op elke vierde verdieping hangt een beglaasde stalen brug los van de gevel, met trapjes naar vier voordeuren. Een zeldzaam gaaf werk van een modernist die nooit water bij de wijn deed."
    body: |
      Volgens het uitbreidingsplan van 1935 moest er tussen het noorden en het zuiden van Osdorp een brede groenstrook komen. Die kwam er nooit; Tussen Meer werd een brede stadsstraat, en in 1962 kreeg tram 17 zijn eindhalte aan het westelijke eind, op het Dijkgraafplein, toen nog een kale vlakte. Datzelfde jaar volgde een prijsvraag voor experimentele woningbouw om het plein af te maken, en J.P. Kloos (1905-2001) won. Het complex, opgeleverd in 1970, telt 232 maisonnettes en 15 flats, verdeeld over een schijf van dertien verdiepingen in de as van Tussen Meer en drie lagere blokken.

      Het slimme zit in de ontsluiting. Geen galerij op elke verdieping, maar op elke vierde verdieping een overdekte, beglaasde stalen loopbrug die een stukje van de gevel af hangt. Van daaruit gaan korte trapjes op en neer naar vier voordeuren. Op de brug kom je de buren tegen, en niemand loopt langs je keukenraam. Kloos bleef zijn leven lang trouw aan de strenge Nieuwe Zakelijkheid; zijn tekenstijl veranderde in dertig jaar nauwelijks. Zijn andere woningbouw in Amsterdam is grondig gerenoveerd, en dus is dit het zeldzame gave voorbeeld. Het monumentenregister voegt eraan toe dat het Dijkgraafplein zonder Kloos weinig meer zou zijn dan een tramlus.

      Let op:
      - de glazen hangbruggen met hun trapjes omhoog en omlaag
      - de luchtbrug over de Akerwateringstraat tussen de schijf en het westelijke blok
      - de witte liftschacht en het noodtrappenhuis aan de noordkant
      - de heel andere zuidkant, een en al balkon
    attributes:
      original_use: Maisonnettes, flatwoningen en winkels
    sources:
      - https://data.amsterdam.nl/monumenten/b2924993-5ba9-42f3-bf70-271139108f39
      - https://nl.wikipedia.org/wiki/Hangbrugmaisonettes
      - https://arcam.nl/architectuur-gids/hangbrugmaisonettes/

- title: Sint-Lucaskerk (Ikeda Centrum)
  summary: "A closed brick box with a glass ridge, built in 1963–1965 around the play of daylight: a Catholic experiment shaped by the church-building debate of the 1950s. Since 2020 a Buddhist centre."
  body: |
    Osdorp was planned on a strict grid, and its three main churches were each given a set spot on the west side of the Hoekenesgracht, where the main roads cross it. The Lucaskerk by Th. Nix and Th. Taen took the Osdorper Ban crossing. Building started in November 1963 and the church was consecrated in May 1965.

    The plan reflects the 1950s Catholic debate about bringing the faithful closer to the altar. The long walls are almost blind bands of red and yellow brick; the roof tips up at both ends and a triangular glass rooflight runs over the middle. Inside, a route from the bright porch through a low gallery behind a screen of white columns slowly reveals the hall, where the choir and priests originally faced each other under the rooflight with the font between them. The church was even turned north-south to catch east and west light. Hubert van Lith's sculpture *Het Bruidspaar* (The Bridal Couple, 1976) was added on the facade.

    The last Mass was said in May 2019. In 2020 the Buddhist organisation SGI Nederland bought the complex and, after a rebuild, opened it as the *Ikeda Centrum voor Vriendschap en Vrede* in 2022.

    Look for:
    - the striped red-and-yellow south wall on the Osdorper Ban
    - the copper-clad sides of the glass ridge
    - the free-standing white concrete bell tower beside the entrance
  category: religious
  lat: 52.361608
  lng: 4.795574
  address: Osdorper Ban 130-132
  links:
