    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Pauluskerk_(Amsterdam)" }
    - { label: Amsterdam op de kaart, url: "https://amsterdamopdekaart.nl/1966-1990/Pieter_Calandlaan/Pauluskerk" }
