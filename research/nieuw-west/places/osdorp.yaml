    - { label: "Amsterdam op de kaart, Dekeukeleire", url: "https://amsterdamopdekaart.nl/p/98/FJE_Dekeukeleire" }
    - { label: Love 80's Architecture, url: "https://www.love80sarchitecture.nl/frontend/osdorperweg-658-660-in-perspectief/" }
