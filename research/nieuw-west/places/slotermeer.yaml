  nl:
    title: Brug 612
    summary: "Een wit betonnen viaduct uit 1955 op dunne wanden, zo hoog gelegd dat je er nog altijd onderdoor kijkt van de Sloterplas tot in het hart van Slotermeer. Het modernistische tegendeel van de bakstenen Brug 616 ernaast."
    body: |
      Hoog genoeg om eronderdoor te blijven kijken: daar draait het om bij deze brug. De Burgemeester Röellstraat ligt op een dijk, boven de woonwijken aan weerszijden. Waar de straat de groene strook met sierwater kruist die de Sloterplas met het hart van Slotermeer verbindt, bouwde de Dienst der Publieke Werken dit viaduct: aanbesteed in 1954, opgeleverd in november 1955. Het overspant het water en op elke oever een voetpad, en de lange blik door het landschap blijft vrij.

      Op de leuningen na is alles beton: ranke pendelwanden op een paalfundering, betonnen jukken en een dek dat naar beide randen dunner wordt. Bij de aanwijzing als monument wees de gemeente op viaduct 605, iets verderop in dezelfde straat. De twee bruggen ontstonden in dezelfde jaren, maar ogen totaal verschillend, en zo laten ze zien hoe de ideeën binnen de bruggenafdeling aan het schuiven waren. Brug 612 is nog vrijwel zoals hij werd opgeleverd.

      Let op:
      - het uitzicht onder het dek door, over het water richting Sloterplas
      - de dunne betonwanden waar het dek op rust
      - de ritmische balustrades met V-vormige voegen, in het klassieke Amsterdamse wit en blauw
    attributes:
      original_use: Verkeersviaduct over water en voetpaden
    sources:
      - https://data.amsterdam.nl/monumenten/b94a457c-0e23-4647-831b-cd0dd37667c8
      - https://nl.wikipedia.org/wiki/Brug_612

- title: Schip van Slebos
  summary: "From across the Sloterplas this white pavilion looks like a moored barge: the quay is the hull, the terrace the deck, the lamp posts the masts. It is really the base of a lookout tower that was never built."
  body: |
    The north-east shore of the Sloterplas was planned as the place where city dwellers would arrive for a day out, a bit like the Maschsee in Hannover. Dick Slebos, who designed bridges and waterworks for the Public Works department from 1954, drew the whole shore: quays, bridges, a boulevard, a kiosk and a pavilion on a terrace jutting into the lake. The pavilion was meant to carry a tall bell and lookout tower. The money ran out, the tower was never built, and what remained, its sturdy base, gave the ensemble its ship-like profile.

    The base was ready around 1961; the viewing platform and kiosk followed in 1966. Slebos worked in the spirit of the Nieuwe Bouwen, a break with the Amsterdam School style of his predecessor Piet Kramer. Black basalt quay walls with white concrete coping are his signature, repeated on bridges 606 and 607 nearby. A café moved onto the upper terrace in the late 1970s and closed in 2014; after years of wrangling over new tenants, a restaurant opened in 2021. The north shore became a protected cityscape in 2017, and the pavilion itself a municipal monument in May 2025.

    Look for:
    - the full ship profile, best seen from across the Sloterplas
    - the stippenterras (dot terrace) paved with round black-and-white tiles, with three triple-armed lamp posts
    - the stair up to the top terrace, with a second stair beneath it leading down to landing stages on the water
