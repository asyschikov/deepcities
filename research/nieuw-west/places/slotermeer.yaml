  nl:
    title: Winkelblokjes Lodewijk van Deysselstraat (J. Bot)
    summary: "Vijf lage blokjes waarin winkels en winkelierswoningen elkaar afwisselen, elke winkel verlicht door een hoog raam onder een schuin dak. Een communistisch raadslid ontwierp ze in 1952, en volgens de gemeente is er in de Westelijke Tuinsteden niets mee te vergelijken."
    body: |
      De architect zat voor de CPN in de gemeenteraad. Jacobus Bot (1892–1956) begon als leerling-timmerman, leerde via avondonderwijs verder en werd architect. Toen hij deze blokjes ontwierp voor woningstichting Patrimonium, was hij raadslid voor de communisten. Ze werden in 1954 gebouwd: vijf lage blokjes met om en om 17 winkels en 17 woningen, aan de zuidkant van de straat. De winkels hebben een dak dat oploopt naar een hoog raam op het noorden, zodat er binnen volop licht is. De woningen liggen iets terug, achter een veel geslotener gevel, en er woonden vooral winkeliers in, naast hun eigen zaak.

      Het gemeentelijk register prijst het speelse ontwerp met eenvoudige middelen en noemt de reeks zeldzaam: in de Westelijke Tuinsteden staat niets vergelijkbaars. Samen met de Verfdozen aan het begin van de straat zorgt ze voor het afwisselende straatbeeld van Slotermeer. Oorspronkelijk leek het rijtje een complete buurt uit de jaren vijftig: een meubelzaak, een fietsenwinkel, een schoenmaker, een bakker, een Spar, een melkboer met zijn eigen kar, een slager en een drogist, en in het westelijkste blokje een Indische toko.

      Rondom wordt de buurt vernieuwd. De portiekflats die haaks op de rij staan, gaan tegen de vlakte voor meer nieuwe woningen, en een deel verdween in 2026. De beschermde blokjes blijven. Corporatie Rochdale verbouwt ze voor kleine ondernemers en buurtfuncties, en één blokje wordt een buurtcentrum. In het vroegere consultatiebureau op nummer 91-93 zit sinds 2019 Theater Van Deyssel.

      Let op:
      - het ritme van open winkelpuien en gesloten woninggevels langs de stoep
      - de winkeldaken die oplopen naar een hoog raam
      - hoekwinkels met een extra raam in de zijgevel
    attributes:
      original_use: Winkels met winkelierswoningen
    sources:
      - https://data.amsterdam.nl/monumenten/58afa178-f4ed-41a7-8018-3cd655efb304

- title: De 1200 Roe
  summary: A thatched polder mill from 1632 that still turns its sails several times a week, though the polder it drained vanished under the sand of the garden cities in 1951. Neighbours stopped it being moved away.
  body: |
    The mill was built around 1632, right after the Haarlemmertrekvaart (the towing canal to Haarlem) was dug, to pump water out of the 595-hectare Osdorper Binnenpolder into the canal. Its name is a distance: 1200 Amsterdam rods (roeden) of about 3.77 metres, some 4.5 km from the old Haarlemmerpoort city gate. Other sites along the Haarlemmerweg were named the same way, such as the 400 Roe mill nearer the city and the old army depot known as 1800 Roe. It is an eight-sided smock mill with a thatched body and cap, turned to the wind from the ground with a tail pole. The scoop wheel was replaced by an Archimedes screw in 1871.

    In 1951 the polder was buried under sand for Slotermeer and Geuzenveld, and in 1954 the mill's feeder ditch was filled in. The sails were taken off in 1971 and there were plans to move it to Sloten, the Twiske or Westzaan, since it supposedly could never catch wind among the new flats. After a petition the city decided in 1973 to keep it; it was restored in 1977–1979. It is now the last mill of the western garden cities still on its original site, owned since 2018 by Stadsherstel. The miller lives inside and sets the sails turning regularly, sometimes almost daily.

    Look for:
    - the sails coming close to the ground (the mill is a grondzeiler, with no stage, so it is not open to visitors)
    - the tail used to turn the cap into the wind
    - "Anno 1632" painted on the beard under the cap
  category: industrial
  lat: 52.384219
  lng: 4.815146
  address: Haarlemmerweg 701
