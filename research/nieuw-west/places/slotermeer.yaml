  nl:
    title: De 1200 Roe
    summary: "Een rieten poldermolen uit 1632 waarvan de wieken nog meerdere keren per week draaien, terwijl de polder die hij droogmaalde al in 1951 onder het zand van de tuinsteden verdween. Buurtbewoners voorkwamen dat hij werd weggehaald."
    body: |
      Vier en een halve kilometer buiten de oude Haarlemmerpoort, en zo heet hij ook: 1200 Amsterdamse roeden van ongeveer 3,77 meter. Langs de Haarlemmerweg kregen meer plekken zo'n afstandsnaam, zoals molen de 400 Roe dichter bij de stad en het oude defensiedepot dat 1800 Roe heet. De molen kwam er rond 1632, vlak na het graven van de Haarlemmertrekvaart, om water uit de Osdorper Binnenpolder (595 hectare) op die vaart uit te slaan. Het is een achtkante bovenkruier met romp en kap van riet, die je vanaf de grond met een staart op de wind zet. In 1871 maakte het scheprad plaats voor een vijzel.

      In 1951 verdween de polder onder het zand voor Slotermeer en Geuzenveld, en in 1954 werd de sloot die de molen voedde gedempt. In 1971 gingen de wieken eraf. Er lagen plannen om hem te verhuizen naar Sloten, het Twiske of Westzaan, want tussen de nieuwe flats zou hij nooit meer wind vangen. Na een handtekeningenactie besloot de gemeente in 1973 hem te laten staan; in 1977-1979 volgde een restauratie. Het is nu de laatste molen van de Westelijke Tuinsteden die nog op zijn oorspronkelijke plek staat, sinds 2018 eigendom van Stadsherstel. De molenaar woont erin en laat de wieken geregeld draaien, soms bijna elke dag.

      Let op:
      - de wieken die tot vlak boven de grond komen (de molen is een grondzeiler zonder stelling en dus niet te bezoeken)
      - de staart waarmee de kap op de wind wordt gedraaid
      - 'Anno 1632' op de baard onder de kap
    attributes:
      built: ca. 1632 (gerestaureerd 1977–1979)
      original_use: Poldermolen
    sources:
      - https://nl.wikipedia.org/wiki/De_1200_Roe
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/1443

- title: Brug 604
  summary: "One of Piet Kramer's last bridges, a monumental gateway to the garden cities with pergolas, stone blocks, sculpted families by Jan Meefout and a public urinal built into the abutment, reached by a masterly brick stair."
  body: |
    Piet Kramer (1881–1961), a pioneer of the Amsterdam School, shaped a great many Amsterdam bridges as the aesthetic designer of the Public Works department. Number 604 (1953–1954), carrying the Burgemeester Röellstraat over the Burgemeester Cramergracht, was one of his last before retirement. With the four flats around it, it was designed as a monumental entrance to Nieuw-West, an unusual meeting of Van Eesteren's modernist town plan and Kramer's brick craftsmanship.

    Stairs take pedestrians up to the street and down again on their way to the Sloterplas, and small landings sit just above the water. Instead of Kramer's usual sculptor Hildo Krop, Jan Meefout carved the figures by the east stairs: a man and woman (north) and a family with a child (south). In 1987 Rob Schreefel added decorative stones. The pergolas earned the bridge the nickname Bananenbrug, which the city dropped in 2016 along with other unofficial bridge names.

    Look for:
    - three big natural-stone blocks on each corner, on which the deck seems to rest
    - Kramer's wrought-iron railings between the brick parapets, and a date stone on both sides
    - the two pergolas on brick columns, one meant to be overgrown with bridal veil
    - on the north-west abutment a urinal set into the bridge, reached by a beautifully bricked stair
    - two quarter-round benches on the west side, and a stone cone that was polished, though the bridge department never used polished stone
  category: infrastructure
  lat: 52.373448
  lng: 4.833435
  address: Burgemeester Röellstraat over the Burgemeester Cramergracht
  links:
