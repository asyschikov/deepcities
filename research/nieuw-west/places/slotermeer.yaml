  nl:
    title: Onze-Lieve-Vrouw-van-Lourdeskerk
    summary: "Granpré Molière bouwde in Amsterdam maar één kerk: een lage bakstenen doos in de zeldzame Bossche School, bedoeld om over honderd jaar mooier te zijn dan nieuw. De klokkentoren die erbij hoorde, kwam er nooit."
    body: |
      Een kerk die pas op leeftijd echt mooi moest worden: zo zag een criticus het in 1958. De makers wilden volgens hem een kerk die over honderd jaar mooier zou zijn dan op de dag van oplevering. Het is de enige Amsterdamse kerk van M.J. Granpré Molière, Delfts hoogleraar en een omstreden naam in de wederopbouwarchitectuur, die zweerde bij voortbouwen op de traditie. Hij ontwierp haar samen met het bureau van A. Evers en G.J.M. Sarlemijn; ze werd gebouwd in 1955 tot 1957. De stijl is die van de Bossche School, voortgekomen uit de cursus kerkelijke architectuur van Dom Hans van der Laan in Den Bosch, waarin eenvoudig materiaal het verhaal moest vertellen. In Amsterdam kom je die stijl weinig tegen. Van buiten zie je vooral een platte, rechthoekige bakstenen bak, met daarboven nauwelijks wat dak.

      Er hoorde een klokkentoren van 30 meter bij, naar Noord-Italiaans voorbeeld. Woningbouw ging na de oorlog voor, de bouw liep vertraging op, het geld raakte op en de toren werd geschrapt. Hij alsnog bouwen voor het Lourdesjubileum van 1958 lukte ook niet. Voor de architect was dat een gemis: een toren was voor hem een teken van de mens die opstijgt naar God.

      Vroeger stond de kerk tussen scholen, de meeste katholiek. Die gingen in de jaren negentig tegen de vlakte, en nu ligt Noorderhof van Rob Krier om de kerk heen als een dorp om zijn plein. Na een parochiefusie in 1993 heet de kerk Het Nieuwe Verbond. Sinds een nieuwe fusie in 2020 staat de hoofdkerk in Osdorp, en vanaf 2022 zijn hier geen vaste vieringen meer.

      Let op:
      - de lateien boven de ramen, gedragen door losse zuiltjes met kapitelen
      - het bakstenen portaal met een baldakijn op rondbogen en stenen kapitelen met figuren
      - het mozaiek van de patroonheilige boven de ingang
      - de drie ronde apsissen aan de achterkant, en aan de noordkant de lage doopkapel waar de toren had moeten komen
    attributes:
      architect: M.J. Granpré Molière, met A. Evers en G.J.M. Sarlemijn
      original_use: Rooms-katholieke kerk met pastorie
    sources:
      - https://data.amsterdam.nl/monumenten/a04f48fb-fd6a-47bc-8abb-28fa9e625e85
      - https://nl.wikipedia.org/wiki/Onze-Lieve-Vrouw-van-Lourdeskerk_(Amsterdam)

- title: De Olijftak (El Hijra mosque)
  summary: "A 1956 Mennonite church with a hexagonal hall lifted onto concrete piers and blade-like windows, later Reformed, since the late 1990s the El Hijra mosque. Its bronze bird by Wessel Couzijn now hangs on the Singel."
  body: |
    The Mennonite congregation (Doopsgezinden) held a competition among five architects for a building that would serve the neighbourhood's cultural life as well as worship. Karel Sijmons won with his first Amsterdam church. The hall, an irregular hexagon of yellow brick with a roof kinked upwards in the middle, sits on concrete piers above a ground floor of meeting rooms. A folding wall could split it into church and hall, and a stage for music and theatre made it, according to the city, the first church where plays could be performed. Tall windows with concrete fins keep out glare and outside views; their stained glass in warm flame colours is by Friso ten Holt. The name comes from Noah's dove returning with an olive branch.

    The Mennonites stayed only briefly. The building passed to the Reformed Church, which used it until 1993, and after years of standing empty the Moroccan El Hijra mosque moved in around 1998, named after the Prophet's journey from Mecca to Medina. In 2019 the old parsonage was demolished for a polygonal prayer hall facing Mecca by Gerard Rijnsdorp, with a modest minaret; the listed church hall was kept. Wessel Couzijn's sculpture of a primeval bird, unveiled on the façade in 1958, now hangs above the Herengracht entrance of the Mennonite Singelkerk.

    Look for:
    - the closed yellow-brick hall raised on piers, with glass between them
    - floor-to-roof windows with concrete fins in the bent side walls
    - the copper-clad bell cote above the entrance, now without a role
    - the 2019 extension, whose colours and columns echo the old building
