  nl:
    title: Schip van Slebos
    summary: "Vanaf de overkant van de Sloterplas lijkt dit witte paviljoen een afgemeerde schuit: de kade is de romp, het terras het dek, de lantaarnpalen zijn de masten. Eigenlijk is het de sokkel van een uitkijktoren die er nooit kwam."
    body: |
      Het schip is een ongeluk. Op dit paviljoen moest een hoge klokken- en uitzichttoren komen, maar het geld raakte op. De toren bleef weg, de zware onderbouw bleef staan, en juist daardoor kreeg het geheel zijn scheepssilhouet.

      De noordoostoever van de Sloterplas was bedacht als de plek waar stadsbewoners zouden aankomen voor een dagje uit, een beetje zoals bij de Maschsee in Hannover. Dick Slebos, die vanaf 1954 bruggen en waterwerken ontwierp voor Publieke Werken, tekende de hele oever: kades, bruggen, een boulevard, een kiosk en een paviljoen op een terras dat de plas in steekt.

      Rond 1961 was de onderbouw klaar; het uitzichtplateau en de kiosk volgden in 1966. Slebos werkte in de geest van het Nieuwe Bouwen en nam zo afstand van de Amsterdamse School van zijn voorganger Piet Kramer. Kademuren van zwart basalt met witte betonnen dekplaten zijn zijn handtekening; je ziet ze ook bij de bruggen 606 en 607 vlakbij. Eind jaren zeventig kwam er een café op het boventerras, dat in 2014 dichtging. Na jaren van getouwtrek over nieuwe uitbaters opende er in 2021 een restaurant. De noordoever werd in 2017 beschermd stadsgezicht, het paviljoen zelf in mei 2025 gemeentelijk monument.

      Let op:
      - het hele scheepsprofiel, het mooist vanaf de overkant van de Sloterplas
      - het stippenterras met ronde zwart-witte tegels en drie lichtmasten met elk drie armen
      - de trap naar het boventerras, met daaronder een tweede trap omlaag naar aanlegsteigers aan het water
    attributes:
      built: ca. 1961–1966
      original_use: Uitzichtterras met kiosk, sokkel voor een uitkijktoren
    sources:
      - https://nl.wikipedia.org/wiki/Oostoever_(Amsterdam)

- title: Onze-Lieve-Vrouw-van-Lourdeskerk
  summary: "Granpré Molière's only church in Amsterdam: a low brick box of a hall church in the rare Bossche School style, built to look better in a hundred years. Its planned campanile was never built."
  body: |
    M.J. Granpré Molière, Delft professor and a controversial figure in Dutch post-war architecture, believed in building on tradition. His only Amsterdam church (1955–1957, with the firm of A. Evers and G.J.M. Sarlemijn) follows the Bossche School, a movement born from Dom Hans van der Laan's church architecture course in Den Bosch, which stressed the expressive power of plain materials. It is rare in Amsterdam. Seen from outside, the gently pitched roofs barely rise above a flat, rectangular brick box. A critic wrote in 1958 that its makers wanted 'a church that will be more beautiful in a hundred years than it is now, fresh from the builder'.

    The design included a 30-metre campanile in the North Italian manner. Building was delayed by the post-war priority for housing, money ran short and the tower was dropped; hopes of adding it for the Lourdes centenary in 1958 came to nothing. That hurt: for Granpré Molière the tower was 'a sign, the sign of man's ascent to God'. The church once stood among schools, most of them Catholic. These were demolished in the 1990s, and Rob Krier's Noorderhof neighbourhood now wraps around the church like a village around its square.

    After a parish merger in 1993 it was renamed Het Nieuwe Verbond (The New Covenant). Since a further merger in 2020 the main church of the parish has been in Osdorp, and there have been no regular Masses here since 2022.

    Look for:
    - window lintels carried by little freestanding columns with capitals
    - the brick porch with a canopy on round arches and figurative stone capitals
    - the mosaic of the patron saint above the entrance
    - the three round apses at the back, and the low baptistery on the north side where the tower should have risen
