    - https://nl.wikipedia.org/wiki/Brug_604
    - "https://nl.wikipedia.org/wiki/Burgemeester_Cramergracht"
  nl:
    title: Brug 604
    summary: "Een van de laatste bruggen van Piet Kramer, bedoeld als statige poort naar de tuinsteden: pergola's, blokken natuursteen, beelden van Jan Meefout en een urinoir in het landhoofd, met een prachtig gemetseld trapje ernaartoe."
    body: |
      In het noordelijke landhoofd van deze brug zit een urinoir. Het trapje ernaartoe noemt de monumentenbeschrijving 'een schitterend staaltje vakmanschap' van de metselaars.

      Piet Kramer (1881-1961), een van de pioniers van de Amsterdamse School, gaf als esthetisch ontwerper bij Publieke Werken een hele reeks Amsterdamse bruggen hun gezicht. Brug 604 uit 1953-1954, die de Burgemeester Röellstraat over de Burgemeester Cramergracht voert, kwam vlak voor zijn pensioen, als een van de laatste. Samen met de vier flats eromheen moest hij een statige poort naar Nieuw-West vormen. Zo ontmoetten het modernistische stadsplan van Van Eesteren en het baksteenambacht van Kramer elkaar, een opmerkelijke combinatie.

      Wie te voet naar de Sloterplas loopt, gaat met een trap omhoog naar de straat en aan de overkant weer naar beneden. Aan beide kanten kun je ook afdalen naar een bordes vlak boven het water. De beelden kwamen dit keer niet van Hildo Krop, de vaste beeldhouwer bij Kramers bruggen, maar van Jan Meefout. Bij de oostelijke trappen staan een man en een vrouw (noord) en een gezin met kind (zuid). In 1987 voegde Rob Schreefel er sierstenen aan toe. Door de pergola's heette de brug in de volksmond Bananenbrug, tot de gemeente in 2016 die bijnaam schrapte, samen met andere onofficiële brugnamen.

      Let op:
      - de drie grote blokken natuursteen op elke hoek, waar het brugdek op lijkt te rusten
      - de smeedijzeren leuningen van Kramer tussen de bakstenen borstweringen, en aan beide kanten een jaartalsteen
      - de twee pergola's op bakstenen kolommen, waarvan er een bedoeld is om met bruidssluier te begroeien
      - in het noordwestelijke landhoofd het ingebouwde urinoir, met het fraai gemetselde trapje ernaartoe
      - twee kwartronde banken aan de westkant, en een stenen kegel die gepolijst werd, terwijl de afdeling Bruggen nooit gepolijste steen gebruikte
    attributes:
      architect: Piet Kramer (Dienst der Publieke Werken)
      original_use: Verkeersbrug met voetgangerstrappen
      artist: Jan Meefout (beelden), Rob Schreefel (siersteen, 1987)
    sources:
      - https://data.amsterdam.nl/monumenten/5af925d3-e003-43e5-8735-f387bc67e517
      - https://nl.wikipedia.org/wiki/Brug_604

- title: Brug 612
  summary: "A slender white 1955 viaduct on thin concrete walls that keeps the view open along the green-and-water axis from the Sloterplas into Slotermeer, the modernist opposite of the brick-and-granite Brug 616 next to it."
  body: |
    The Burgemeester Röellstraat runs on a raised embankment above the housing on both sides. Where it crosses the green strip with ornamental water that links the Sloterplas to the heart of Slotermeer, the Public Works department built this viaduct, tendered in 1954 and finished in November 1955. It spans the water and a footpath on each bank, and its height leaves the long view through the landscape uninterrupted.

    Apart from its railings it is all concrete: slim pendulum walls on a pile foundation, concrete yokes and a deck that tapers towards both edges. The city listed it together with the story of viaduct 605, a little further along the same street, because the two bridges, designed at the same time in sharply different styles, show how ideas were changing inside the bridge department. It survives almost unaltered.

    Look for:
    - the view under the deck along the water towards the Sloterplas
    - the thin concrete walls that carry the deck
    - the rhythmic balustrades with V-shaped expansion joints, in the city's classic white and blue
