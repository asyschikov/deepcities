# under the Oude Haagsebrug, 127 Ontmoeting, 140 Banpaal Spaarnwouderdijk, 152 the Verzetsheldenbuurt
# memorial. Merges (124, 126, 153) and pointers are in sloten.yaml. Dutch texts are written from Dutch
