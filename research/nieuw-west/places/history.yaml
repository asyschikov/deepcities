  nl:
    title: Gezichten van de Verzetsstrijdersbuurt
    summary: "Wie was Hannie Schaft, of Willem Arondeus, of Frieda Belinfante? Rond Plein '40-'45 hangt het antwoord vaak naast het straatnaambord: een klein paneel met een portret. Ruim tachtig verzetsmensen kregen zo een gezicht, de meesten veel minder bekend."
    body: |
      Toen Slotermeer in de jaren vijftig werd aangelegd, kregen de straten ten noordoosten van het centrale plein (dat in 1955 Plein '40-'45 ging heten) de namen van mannen en vrouwen uit het verzet. Tientallen jaren waren dat alleen namen op een bordje.

      Daar kwam verandering in met Geef Straten een Gezicht, het project van oud-docent en fotograaf-vormgever Paul Fennis. Zijn eerste paneel hing hij zo'n twaalf jaar geleden op aan het J.J. Cremerplein in West. Schoolkinderen moesten zien wat Cremers boek Fabriekskinderen uit 1863 was: een pleidooi tegen fabriekswerk door kinderen onder de twaalf. Daarna wilden bewoners elders er ook een. Elk paneel hangt bij het straatnaambord, met een portret en een paar regels uitleg. Van de zo'n 600 in de hele stad hangen er bijna 200 in Nieuw-West, meer dan in welk ander stadsdeel ook. De verzetsbuurt alleen telt er al ruim tachtig, en in 2026 kwamen er in Nieuw-West nog steeds nieuwe bij.

      Wie hier door het stratenpatroon loopt, krijgt geschiedenis in kleine porties: geen hoofdstukken, wel een gezicht, een handvol zinnen en een verhaal, gewoon onderweg naar huis.

      Let op:
      - Hannie Schaft, de verzetsvrouw die enkele weken voor de bevrijding werd doodgeschoten (hier staat de pin);
      - Willem Arondeus en Frieda Belinfante, allebei betrokken bij de aanslag op het Amsterdamse bevolkingsregister in 1943;
      - verderop in de buurt Johannes Post, Gerhard Badrian, Reina Prinsen Geerligs en Jan Verleun;
      - het Vrijheidscarillon op het plein zelf;
      - aan de Jan Postmahof het reliëf van Frits Sieger: gewapende mannen in een boot onder '1940 JAN POSTMA 1945', voor de communistische verzetsleider die in juli 1944 werd gefusilleerd;
      - de plaquette voor Reina Prinsen Geerligs met haar eigen gedicht 'Ik sta hier in het midden der ellende', in 1970 onthuld in het bijzijn van haar ouders. Als jonge schrijfster zat ze in de groep CS-6; op 24 november 1943 werd ze in Sachsenhausen gefusilleerd, 21 jaar oud.
    sources:
      - https://www.rodi.nl/amsterdam-nieuw-west/historie/508427/amsterdam-nieuw-west-koploper-in-straatportretten-over-naamgevers-in-de-stad
      - https://www.geefstrateneengezicht.nl/
      - https://nl.wikipedia.org/wiki/Plein_%2740-%2745

- title: Bevrijde vogel, Sierplein
  summary: 'A steel bird breaks out of its cage on a triangular plinth that recalls the camp badges. Since 2024 a rotating six-sided cube beside it shows the war from Moluccan, Surinamese, Moroccan and Sinti angles.'
  body: |
    In 2024 historian Pim Ligtvoet of the local committee added a rotating cube. Its six faces show, among others, Anton de Kom of the Surinamese-Dutch resistance, Moluccan fighter Coosje Ayal, Sinti girl Settela Steinbach and the Moroccan soldier El Achir ben Bouali, who washed up dead at Zandvoort. One face carries drawings and poems by pupils of the Louis Bouwmeesterschool, which has adopted the monument and holds its own remembrance here each spring.

    During the war Slotervaart was still meadows with a few farms. When the new neighbourhood had filled up, residents who wanted to attend the 4 May remembrance mostly went to the monument on the Amstelveenseweg. In 1978 the local 4 and 5 May committee started collecting money for a memorial of its own, and in May 1980 *Bevrijde vogel* (liberated bird) by sculptor Siep van den Berg was unveiled on the grass at the corner of the Pieter Calandlaan and Johan Huizingalaan. The square around it was laid out in 1994 and named Sierplein after its ornamental paving.

    The bird flies off from a steel cage on a black stone block, set on a triangular platform: a reference to the coloured triangles prisoners had to wear in the German camps. In 2017 a tile was added for two RAF airmen, observer William Barrett and gunner Peter Adams, both 23, killed on 23 June 1940 when their Blenheim bomber was shot down and crashed in the nearby Riekerpolder; the pilot survived by parachute.

    Look for:
    - the 2017 tile, "Zij vielen voor onze vrijheid" (they fell for our freedom);
    - the cube: turn it, and use the QR code for the stories;
    - nearby, the Louis Bouwmeesterschool that adopted the monument, built over a Cold War public shelter (see "Cold War shelter, Louis Bouwmeesterschool").
  category: hidden-history
  lat: 52.355494
  lng: 4.826790
  address: Sierplein
