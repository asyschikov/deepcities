  nl:
    title: Gezichten van de Verzetsstrijdersbuurt
    summary: 'In de verzetsstrijdersbuurt in Slotermeer tonen meer dan tachtig portretten bij de straatnaamborden de dappere mannen en vrouwen van toen: geschiedenisles op z''n kleinst, gewoon op weg naar huis.'
    body: |
      Plein '40-'45 is het centrale plein van de tuinstad Slotermeer. Het plein kreeg zijn naam in 1955 en herinnert aan de jaren van de Duitse bezetting van 1940 tot 1945. Het ligt aan de rand van de verzetsheldenbuurt.

      Naar wie jouw straat is genoemd, kun je uiteraard online opzoeken. Dankzij Geef Straten een Gezicht kun je dat op zo'n 600 plekken in heel Amsterdam op straat zien. Het project heeft als doel de herkomst van de straatnamen zichtbaar te maken; daarvoor komen er panelen dichtbij de straatnaamborden te hangen, voorzien van een beeld plus enkele regels tekst. Bedenker en uitvoerder Paul Fennis plaatste ruim twaalf jaar geleden zijn allereerste, op het J.J. Cremerplein in West. Met bijna 200 portretten is Nieuw-West koploper. Neem de verzetsstrijdersbuurt in Slotermeer, waar meer dan tachtig portretten de dappere mannen en vrouwen van toen tonen.

      Geef Straten een Gezicht is daarmee geschiedenisles op z'n kleinst: geen lange hoofdstukken, maar een gezicht, een paar regels en een bijzonder verhaal. Je hoeft er alleen maar langs te lopen om iets nieuws te leren.

      Let op:
      - het portret van Hannie Schaft;
      - de panelen van Willem Arondeus en Frieda Belinfante;
      - Johannes Post, Gerhard Badrian, Reina Prinsen Geerligs en Jan Verleun elders in de buurt;
      - het Vrijheidscarillon, sinds 1961 op het plein;
      - aan de Jan Postmahof het reliëf van Frits Sieger met gewapende mannen in een boot, '1940 JAN POSTMA 1945', voor de communistische verzetsleider die in juli 1944 werd gefusilleerd;
      - de plaquette voor Reina Prinsen Geerligs met haar eigen gedicht 'Ik sta hier in het midden der ellende', in 1970 onthuld in bijzijn van haar ouders: zij zat in de verzetsgroep CS-6 en werd op 24 november 1943 in Sachsenhausen gefusilleerd, 21 jaar oud.
    sources:
      - https://www.rodi.nl/amsterdam-nieuw-west/historie/508427/amsterdam-nieuw-west-koploper-in-straatportretten-over-naamgevers-in-de-stad
      - https://www.geefstrateneengezicht.nl/
      - https://nl.wikipedia.org/wiki/Plein_%2740-%2745

- title: Bevrijde vogel, Sierplein
  summary: 'A steel bird breaks out of its cage on a triangular plinth that recalls the camp badges. Since 2024 a rotating six-sided cube beside it shows the war from Moluccan, Surinamese, Moroccan and Sinti angles.'
  body: |
    During the war Slotervaart was still meadows with a few farms. When the new neighbourhood had filled up, residents who wanted to attend the 4 May remembrance had to go to the monument on the Amstelveenseweg. In 1978 the local 4 and 5 May committee started collecting money for a memorial of its own, and in May 1980 *Bevrijde vogel* (liberated bird) by sculptor Siep van den Berg was unveiled on the grass at the corner of the Pieter Calandlaan and Johan Huizingalaan. The square around it was laid out in 1994 and named Sierplein after its ornamental paving.

    The bird flies off from a steel cage on a black stone block, set on a triangular platform: a reference to the coloured triangles prisoners had to wear in the German camps. In 2017 a tile was added for two RAF airmen, observer William Barrett and gunner Peter Adams, both 23, killed on 23 June 1940 when their Blenheim bomber was shot down and crashed in the nearby Riekerpolder; the pilot survived by parachute.

    In February 2024 historian Pim Ligtvoet of the local committee added a rotating cube. Its six faces show, among others, Anton de Kom of the Surinamese-Dutch resistance, Moluccan fighter Coosje Ayal, Sinti girl Settela Steinbach and the Moroccan soldier El Achir ben Bouali, who washed up dead at Zandvoort. One face carries drawings and poems by pupils of the Louis Bouwmeesterschool, which has adopted the monument and holds its own remembrance here each spring.

    Look for:
    - the 2017 tile, "Zij vielen voor onze vrijheid" (they fell for our freedom);
    - the cube: turn it, and use the QR code for the stories.
