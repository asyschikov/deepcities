  nl:
    title: Allendemonument en President Allendelaan
    summary: "Een gebalde vuist van betonblokken, zonder specie gestapeld zoals de Inca's bouwden, voor de Chileense president Salvador Allende. De laan ernaast kreeg binnen zes maanden na de staatsgreep van 1973 zijn naam, en de plaquette zegt nog altijd dat hij vermoord is."
    body: |
      Op de tekstplaat staat dat Allende vermoord werd: als eerste van tienduizenden Chilenen die volgens de plaat vielen voor de vrijheid van Latijns-Amerika. Dat dacht men lang. In 2011 werd na grondig onderzoek officieel bekendgemaakt dat hij zichzelf van het leven had beroofd. Het bordje heeft het nieuws nooit gekregen.

      Op 11 september 1973 viel de Chileense president Salvador Allende bij een staatsgreep, en dezelfde dag stierf hij. Amsterdam reageerde snel. Op 27 februari 1974 werd de weg door het noordwesten van het Sloterpark, sinds 1948 Westoever geheten, omgedoopt tot President Allendelaan.

      Daarna kwam het monument. Kunstenaar Ton Blommerde keek naar de Inca's en bouwde een vereenvoudigde vuist uit betonnen elementen die zonder specie op elkaar liggen. Burgemeester Ivo Samkalden onthulde hem op 11 september 1975, precies twee jaar na de coup, met Chileense ballingen erbij en een afvaardiging van de Amsterdamse CPN. Op 11 september 1979 legde Allendes weduwe Hortensia Bussi er een krans. In 2013 trokken vandalen stenen uit de vuist en strooiden ze over het gras.

      Let op:
      - de vuist zelf, die je het best leest als je een paar passen terug het veld in loopt;
      - de plaquette met de tekst uit 1975;
      - *Groot Landschap* (1974) van Wessel Couzijn, in cortenstaal, op een heuvel in hetzelfde deel van het park;
      - de stalen hardlopers (*Trimmers*, Martie van der Loo) op de leuningen van brug 678 over dezelfde laan, een van de twee bruggen waartussen het monument staat.
    sources:
      - https://nl.wikipedia.org/wiki/Allendemonument
      - https://nl.wikipedia.org/wiki/President_Allendelaan
      - https://nl.wikipedia.org/wiki/Sloterpark
      - https://gefladder.nl/ellende-bij-allende/

- title: Resistance fighters' faces (Verzetsstrijdersbuurt)
  summary: 'Next to the street signs around Plein ''40-''45, more than 80 small portrait panels show who the streets are named after: Hannie Schaft, Willem Arondeus, Frieda Belinfante and dozens of less famous resistance men and women.'
  body: |
    When Slotermeer was laid out in the 1950s, the streets north-east of its central square, named Plein '40-'45 in 1955, were given the names of people from the Dutch resistance. For decades they were just names on street signs.

    That changed with *Geef Straten een Gezicht* (give streets a face), a project by retired teacher and photographer-designer Paul Fennis. His first panel went up about twelve years ago on the J.J. Cremerplein in West, so that schoolchildren would learn how Cremer's 1863 book *Fabriekskinderen* argued against factory work by children under twelve; residents elsewhere then asked for their own. Each panel hangs near the street sign and shows a portrait with a few lines of text. Of some 600 in the city, nearly 200 are in Nieuw-West, more than in any other district, and the resistance neighbourhood alone has more than 80; new panels were still going up in Nieuw-West in 2026.

    Walking the grid is a history lesson at the smallest scale: no long chapters, just a face, a few lines and a story, met on the way home.

    Look for:
    - Hannie Schaft, the resistance fighter executed weeks before the liberation (pinned here);
    - Willem Arondeus and Frieda Belinfante, both part of the 1943 attack on the Amsterdam population register;
    - Johannes Post, Gerhard Badrian, Reina Prinsen Geerligs and Jan Verleun elsewhere in the grid;
    - the Vrijheidscarillon (freedom carillon) on the square itself;
    - on the Jan Postmahof, Frits Sieger's relief of armed men in a boat, "1940 JAN POSTMA 1945", for the Communist resistance leader executed in July 1944;
    - the plaque for Reina Prinsen Geerligs with her own poem "Ik sta hier in het midden der ellende", unveiled in 1970 with her parents: a young writer in the CS-6 group, she was executed at Sachsenhausen on 24 November 1943, aged 21.
  category: hidden-history
  lat: 52.379147
