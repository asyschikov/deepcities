  nl:
    title: Van Eesteren Museum
    summary: "Een museum over het plan waar je middenin staat: de tuinsteden van Nieuw-West. Met een ingerichte jarenvijftigwoning in Slotermeer en een klimrek van Aldo van Eyck dat het museum met crowdfunding van de schroothoop haalde."
    body: |
      Op deze plek aan de Sloterplas had Cornelis van Eesteren al in 1939 een cultureel paviljoen bedacht, in zijn plan voor Tuinstad Slotermeer. Het kwam er niet: bijna tachtig jaar bleef de kavel leeg. Pas in 2017 trok het museum dat zijn naam draagt hier in, in een zwart paviljoen met veel glas van Korteknie Stuhlmacher.

      Van Eesteren stond aan de wieg van het Algemeen Uitbreidingsplan van Amsterdam (1934). In 2007 wees het stadsdeel zo'n halve vierkante kilometer hier in de buurt aan als beschermd stadsgezicht, om de gave stedenbouwkundige opzet: het 'Van Eesteren Buitenmuseum'. In 2009 kwamen woningcorporaties met plannen om honderden woningen in en rond dat gebied flink te verbouwen of te slopen. Erfgoedclubs en bewoners richtten in 2010 het museum op. Sinds 2012 hoort er ook een museumwoning bij, aan de Freek Oxstraat 27, ingericht volgens de jarenvijftigidealen van Stichting Goed Wonen.

      Buiten staat een fors speeltoestel van Aldo van Eyck: drie torens met duikelrekken ertussen. Het stond aan de Stoomgemaalstraat in Osdorp en moest daar weg; het museum haalde 6000 euro op om het te redden, en op 23 november 2018 werd het hier onthuld. Van Eyck tekende tussen 1947 en 1978 zo'n 700 openbare speelplekken voor Amsterdam, met bewust kale toestellen: de rest moesten kinderen er zelf bij verzinnen.

      Let op:
      - het Van Eyck-rek aan de oostkant van het paviljoen, met daarnaast *Played Rack* (2020) van Maze de Boer, een variatie op dezelfde ontwerpen;
      - de rondleiding door Slotermeer van het museum, donderdag tot en met zondag.
    sources:
      - https://nl.wikipedia.org/wiki/Van_Eesteren_Museum
      - https://nl.wikipedia.org/wiki/Speeltoestel_Van_Eesteren_Museum
      - https://www.rodi.nl/amsterdam-nieuw-west/nieuws/500028/glijbaan-2-0-bij-van-eesteren-museum-voor-de-deur

- title: Van Eyck playground, Witte Klok
  summary: 'Probably the last Aldo van Eyck playground in Amsterdam still as it was built: igloo, tumbling bars and a sandpit with a pentagon in the middle, set in a 1959 courtyard where parents could watch from their balconies.'
  body: |
    After the war Amsterdam had hardly any public playgrounds: children played in *speeltuinen* run by associations that families had to join. City planner Jakoba Mulder thought every neighbourhood should have a small open play space and gave the job to the architect Aldo van Eyck. Between 1947 and 1978 he designed around 700 of them, many in the new western garden cities, out of a handful of deliberately abstract pieces: a climbing dome that could be a hut, a spaceship or an igloo, tumbling bars, round stepping blocks, concrete sandpits.

    Most were cleared from the 1980s on, as the rules for play equipment changed. Witte Klok is the exception. The playground was designed in 1957 and built in 1965 in the green of a small courtyard of 1959 housing by Jaap Schipper. Around 2016 it was counted among only fifteen intact Van Eyck playgrounds, and the website Amsterdam op de kaart calls it probably the only one still in its original state; the rubber tiles laid against hard landings are the one later change.

    The street is named after a demolished farmstead of the old municipality of Sloten.

    Look for:
    - the sandpit with the pentagon in the middle;
    - the igloo climbing dome and the row of tumbling bars;
    - the L-shaped flat on the west side, placed so that parents could keep an eye on the playground from their balconies;
    - the cow sculpture in the same courtyard, a present from housing corporation Rochdale to the residents' association;
    - on the gable ends along the Blomwijckerpad, three brick reliefs of 1960 for the Christian housing association Patrimonium, each with its Bible verse below: Lex Horn's ladders (Proverbs 24:27), Dick Zwier's warrior (Proverbs 24:33-34) and Berend Hendriks's figures and fire (Psalm 128), cut into the brick in white, red and black;
    - about 1.2 km south-east in the Piet Wiedijkpark, a paddling pool of 1972–1973 built on Van Eyck's model, with his typical stepping stones in an arc but none of his climbing frames. It is filled from May to September on warm days; the city is preparing work on it as part of a renovation of the park.
