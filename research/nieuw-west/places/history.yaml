  nl:
    title: Van Eesteren Museum
    summary: 'Museum geheel gewijd aan stedenbouwkundige Cornelis van Eesteren, sinds 2017 in een paviljoen aan de Sloterplas, met een museumwoning uit de jaren vijftig en een echte Van Eyck die van de sloop werd gered.'
    body: |
      Het Van Eesteren Museum is een museum in Amsterdam Nieuw-West dat geheel gewijd is aan architect en stedenbouwkundige Cornelis van Eesteren, die aan de wieg stond van het Algemeen Uitbreidingsplan (AUP) van Amsterdam uit 1934. In 2007 bestempelde het stadsdeelbestuur van Geuzenveld-Slotermeer een gebied van ongeveer een halve vierkante kilometer tot beschermd stadsgezicht vanwege de architectuur en vooral de stedenbouwkundige opzet: het 'Van Eesteren Buitenmuseum'. Het museum werd opgericht op 1 mei 2010 door vertegenwoordigers van erfgoedverenigingen en bewoners.

      Op 12 oktober 2012 werd een museumwoning geopend aan de Freek Oxstraat 27, ingericht volgens de principes van de Stichting Goed Wonen uit de jaren vijftig. Sinds 22 oktober 2017 zit het museum in het Van Eesteren Paviljoen aan de Noordzijde 31. Architectenbureau Korteknie Stuhlmacher ontwierp het gebouw met het oorspronkelijke idee van Van Eesteren als basis: hij voorzag hier in zijn Plan Tuinstad Slotermeer (1939) een culturele bestemming annex paviljoen, dat er tot 2017 niet kwam; het bleef een lege plek.

      Eind 20ste eeuw verdwenen de speeltoestellen van Aldo van Eyck steeds meer uit het straatbeeld. Ook een van zijn grotere installaties aan de Stoomgemaalstraat in Osdorp moest weg. Dankzij de inspanningen van het museum werd 6000 euro bijeengebracht en werd deze echte Van Eyck gered van de sloop. De drie torens met daartussen varianten van duikelrekken hebben sinds 2018 een plekje naast het museum.

      Let op:
      - het speeltoestel van Van Eyck aan de oostzijde van het paviljoen, en Played rack van Maze de Boer (2020), mede geïnspireerd op de toestellen van Van Eyck;
      - de schetsen van speelplekplattegronden van Van Eyck in het museum;
      - de dagelijkse wandeling door Slotermeer.
    sources:
      - https://nl.wikipedia.org/wiki/Van_Eesteren_Museum
      - https://nl.wikipedia.org/wiki/Speeltoestel_Van_Eesteren_Museum
      - https://www.rodi.nl/amsterdam-nieuw-west/nieuws/500028/glijbaan-2-0-bij-van-eesteren-museum-voor-de-deur

- title: Van Eyck playground, Witte Klok
  summary: 'Probably the last Aldo van Eyck playground in Amsterdam still as it was built: igloo, tumbling bars and a sandpit with a pentagon in the middle, set in a 1959 courtyard where parents could watch from their balconies.'
  body: |
    After the war Amsterdam had hardly any public playgrounds: children played in fenced *speeltuinen* run by associations that families had to join. City planner Jakoba Mulder thought every neighbourhood should have a small open play space and gave the job to the young architect Aldo van Eyck. Between 1947 and 1978 he designed around 700 of them, many in the new western garden cities, out of a handful of deliberately abstract pieces: a climbing dome that could be a hut, a spaceship or an igloo, tumbling bars, round stepping blocks, concrete sandpits.

    Almost all were cleared from the 1980s on, as safety rules changed. Witte Klok is the exception. The playground was designed in 1957 and built in 1965 in the green of a small courtyard of 1959 housing by Jaap Schipper. Around 2016 it was counted among only fifteen intact Van Eyck playgrounds, and the city's heritage map calls it probably the only one still in its original state; the rubber tiles laid against hard landings are the one later change. When the city renewed the playgrounds of this part of Osdorp, the original equipment stayed.

    The street is named after a demolished farmstead of the old municipality of Sloten.

    Look for:
    - the sandpit with the pentagon in the middle;
    - the igloo climbing dome and the row of tumbling bars;
    - the L-shaped flat on the west side, placed so that parents could keep an eye on the playground from their balconies;
    - the cow sculpture in the same courtyard, a present from housing corporation Rochdale to the residents' association;
    - on the gable ends along the Blomwijckerpad, three brick reliefs of 1960 for the Christian housing association Patrimonium, each with its Bible verse below: Lex Horn's ladders (Proverbs 24:27), Dick Zwier's warrior (Proverbs 24:33-34) and Berend Hendriks's figures and fire (Psalm 128), cut into the brick in white, red and black.
