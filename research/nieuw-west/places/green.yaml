  nl:
    title: Tenerife-monument (Westgaarde)
    summary: "Een eenvoudige ronde tafel van wit graniet markeert het grafveld waar KLM de meeste slachtoffers uit haar toestel begroef na de ramp op Tenerife in 1977, het dodelijkste ongeluk in de geschiedenis van de luchtvaart."
    body: |
      Op 7 april 1977 schuifelden meer dan twintigduizend mensen langs een lange rij kisten op Westgaarde. Elf dagen eerder, op 27 maart, was op het vliegveld Los Rodeos op Tenerife een KLM-Boeing 747, de Rijn, in de mist aan de start begonnen. Hij ramde een jumbo van Pan Am die nog over de baan taxiede. Alle 248 mensen in het KLM-toestel kwamen om; met de doden van Pan Am erbij waren het er 583.

      KLM koos voor Westgaarde, toen een nieuwe begraafplaats met ruimte genoeg, omdat die centraal lag en dicht bij Schiphol. Die dag werden 140 slachtoffers in één grafveld bijgezet. Zeventig slachtoffers uit het KLM-toestel zijn nooit geïdentificeerd. KLM nam de rechten op het hele vak, zo'n 400 vierkante meter, en heeft die sindsdien steeds voor twintig jaar verlengd (in 1997 en 2017).

      Het monument is van A.Th. Molendijk. Hij hakte uit één blok wit graniet een grote ronde tafel, met op de voorkant 'Tenerife 27 maart 1977'. Een lage granieten rand om het geplaveide veld draagt de namen, en een taxushaag sluit het geheel af. Hier worden 123 mensen herdacht; anderen liggen elders op Westgaarde of verspreid over het land. Ook gezagvoerder Jacob Veldhuyzen van Zanten ligt op Westgaarde.

      Elk jaar op 27 maart leggen KLM en de stichting van nabestaanden hier bloemen. Er wordt nog gewoon begraven, dus gedraag je rustig.

      Let op:
      - de granieten tafel met de datum op de voorkant
      - de namen langs de lage granieten rand van het veld
      - de taxushaag rond het grafveld
      - Wachter (1977) van Eric Claus langs de toegangsweg bij de rotonde aan de Ookmeerweg: een grof uitgehakte ridder te paard in schelpkalk, die iedereen groet die binnenkomt
    sources:
      - https://www.pc.nl/blogs/tenerife-monument-westgaarde/
      - https://www.dodenakkers.nl/artikelen-overzicht/algemeen/rampen/tenerife-1977.html
      - https://nl.wikipedia.org/wiki/Westgaarde

- title: Lutkemeerpolder
  summary: The last stretch of farmland inside Amsterdam, organic sea clay farmed for more than fifty years, where a food-park movement has spent years fighting distribution halls one plot at a time.
  body: |
    The Lutkemeer (*lutke* means small) was a little lake on the edge of the old Haarlemmermeer. It was drained in 1864–1865, and the polder has been farmed ever since. When the city grew west, the Westgaarde cemetery took its eastern part in the 1960s, and from the 2000s a business park crept in from the other side.

    What was left by 2021 was some 43 hectares of fertile sea clay, most of it farmed organically by the organic farm De Boterbloem for more than half a century. The city had zoned it for logistics. Albert Heijn's plan for a distribution centre was dropped after protests, and the campaign Voedselpark Amsterdam (Food Park Amsterdam) began crowdfunding to buy the land and turn it into a farming and nature park. Some 25,000 people signed up in support.

    In May 2025 the food park won the city's tender for plot N5, 9.5 hectares on the polder's edge; in late 2025 it was still farmed conventionally while the food park took soil samples. The fight for the rest went on: on 2 September 2026 the council approved a zoning change that allows a large hall right behind De Boterbloem and the organic garden PLUK!. Building started at the end of October 2026: Vega Amsterdam, a logistics complex of over 35,000 square metres whose first tenant, Lamme Textile Management, is to run an industrial laundry there for Schiphol and hotels from early 2028. The food park calls it an ecological disaster for the last fertile farmland in the city, fearing for the groundwater. A separate appeal by the Stichting Behoud Lutkemeer was heard by the Raad van State, the highest administrative court, on 13 November 2026; its ruling is awaited.

    Look for:
    - the organic farm De Boterbloem
    - the cycle bridge from Westgaarde cemetery into the polder and the allotments of the Tuinen van West (see Tuinen van West)
    - the building site of the laundry behind the farm
  category: green
  lat: 52.360148
