    - https://tuinenvanwest.nl/tuinen-van-west/ (after nearly a century of discussion, a decision in 2007; Hoofdgroenstructuur; the four polders and their character)
    - https://www.nhnieuws.nl/nieuws/354970 (6 Dec 2025; ash avenue on the Nico Broekhuysenweg next to the Fluisterbos, tree expert Wouter van der Wulp, "de mooiste essenlaan van het land"; Fluisterbos planted with the A5, lookout hill overgrown)
