  nl:
    title: Animaris Rhinoceros Transport
    summary: "Een lopend strandbeest van Theo Jansen, 2,8 ton zwaar en 4,5 meter hoog, staat opgesloten in een kooi bij de ingang van een bedrijventerrein in Osdorp, zodat het er niet vandoor kan. Eén mens kan het in beweging krijgen."
    body: |
      Het weegt 2,8 ton, maar een mens alleen krijgt het met slim gebruik van de wind aan het lopen. En je kunt erin zitten. Theo Jansen studeerde natuurkunde en werd wereldberoemd met zijn strandbeesten: geraamtes van plastic buis die op de wind over het strand stappen. De *Animaris Rhinoceros Transport* is een zware zijtak van die familie. De half-Latijnse naam plakt dier (*ani*), zee (*maris*), neushoorn en vervoer aan elkaar; de meeste mensen zien er eerder een krab in. Het beest meet zo'n 4,5 meter in de hoogte en 6 in de breedte, en Jansen dacht het als vervoermiddel voor de toendra.

      Jansen kwam bij het ingenieursbureau Heijmerink Wagemakers aan met een kartonnen modelletje van 20 centimeter, waarin de loopbeweging al helemaal klopte. In 2004 bouwden zij het echte beest. Getest werd het niet op het strand, uit angst dat het in het zand zou wegzakken, maar op de landingsbaan van Vliegkamp Valkenburg. Op 18 september 2004 werd het naar zijn eerste plek getrokken, een fundering midden in de Albardagracht in Geuzenveld. De jongeren die het zouden trekken, kwamen niet opdagen, dus de genodigden pakten zelf het touw. Echt op zijn plek was het in die gracht nooit. Het stadsdeel liet het opknappen en zocht samen met Jansen iets beters: sinds 18 mei 2014 staat het in een speciaal gebouwde kooi bij de ingang van Business Park Amsterdam Osdorp. Dat werd gevierd met 'Het beest gaat los', waarbij het elk half uur een paar passen zette.

      Let op:
      - de poten van Jansens loopmechaniek, door de tralies heen
      - de ruimte in het lijf waar iemand kan zitten
    sources:
    - https://www.buitenkunstamsterdam.nl/Kunstwerken/912/animaris-rhinoceros-transport
    - https://nl.wikipedia.org/wiki/Animaris_rhinoceros_transport
    - https://hwva.nl/onze-projecten/animaris-rhinoceros-transport-3/
- title: Groot Landschap
  summary: Wessel Couzijn's 22-metre corten-steel "modern hunebed" on its own hill in the Sloterpark. Locals called it the "Big Plane Crash", it nearly slid off its hill, and a ten-year campaign saved it in 2006.
  body: |
    The city commissioned the sculptor Wessel Couzijn (1912–1984) in 1954, while the Sloterpark was still sand. Twenty years later, in 1974, *Groot Landschap* ("Large Landscape") was laid on a hill raised specially for it. The bronze founder Mart Joosten made it from corten steel; it measures 22 by 12 metres and stands 3.5 metres high. Couzijn gave the abstract form no meaning. Admirers see a body or a prehistoric *hunebed* (dolmen); his defender Geert Lebbing called it "a majestic gesture, a modern hunebed".

    Not everyone agreed. With its scattered steel plates it was soon nicknamed *Groot vliegtuigongeluk*, the "Big Plane Crash". By the 1990s rust had eaten holes in it, graffiti covered it and, lacking a foundation, the whole thing threatened to roll down the hill. Museum directors such as Edy de Wilde (Stedelijk), Jean Leering (Van Abbemuseum) and Rudi Oxenaar (Kröller-Müller) sounded the alarm while demolition was being discussed. Lebbing formed a committee with Couzijn's widow, the sculptor Pearl Perlmutter, and the designer Wim Crouwel, and found the roughly €80,000 needed. In mid-2006 the sculpture was given a foundation and repaired on the spot, with Perlmutter, then 90, climbing the hill with a stick to watch, and it was unveiled again on 15 September 2006.

    Look for:
    - the welded seams and ribbed plates, best seen by walking all the way round
    - the sign at the foot of the hill, which says the work "represents nothing but itself"
    - the purpose-built hill itself, part of the work, which a local columnist calls *de puist* (the pimple); a korfball coach from Osdorp used to make his team sprint up it ten times
  category: street-art
  lat: 52.365057
  lng: 4.813315
  address: Sloterpark, near President Allendelaan
  links:
