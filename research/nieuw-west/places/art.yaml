  nl:
    title: Groot Landschap
    summary: "Wessel Couzijns 22 meter lange 'hedendaagse hunebed' van cortenstaal, op een eigen heuvel in het Sloterpark. De volksmond doopte het 'Groot vliegtuigongeluk', het dreigde van zijn heuvel te glijden, en na tien jaar strijd werd het in 2006 gered."
    body: |
      'Groot vliegtuigongeluk': zo heette het al snel in de volksmond, vanwege die rondslingerende stalen platen. De gemeente gaf beeldhouwer Wessel Couzijn (1912-1984) de opdracht al in 1954, toen het Sloterpark nog zand was. Twintig jaar later, in 1974, kwam Groot Landschap op een heuvel te liggen die er speciaal voor was opgeworpen. Bronsgieter Mart Joosten voerde het uit in cortenstaal: 22 bij 12 meter, en 3,5 meter hoog. Couzijn gaf de abstracte vorm geen betekenis mee. Liefhebbers zien er een lichaam of een hunebed in; zijn verdediger Geert Lebbing sprak van 'een majestueus gebaar, een hedendaags hunnebed'.

      In de jaren negentig zaten er roestgaten in, stond het vol graffiti en dreigde het hele ding, zonder fundering, de heuvel af te rollen. Museumdirecteuren als Edy de Wilde (Stedelijk), Jean Leering (Van Abbemuseum) en Rudi Oxenaar (Kröller-Müller) sloegen alarm, terwijl er zelfs over sloop werd gepraat. Lebbing vormde een comité met Couzijns weduwe, beeldhouwster Pearl Perlmutter, en ontwerper Wim Crouwel, en vond de ruim 80.000 euro die nodig was. Medio 2006 kreeg het beeld ter plekke een fundering en werd het opgeknapt. Perlmutter, toen 90, klom met een wandelstok de heuvel op om te kijken. Op 15 september 2006 volgde de nieuwe onthulling.

      Let op:
      - de lasnaden en geribbelde platen, het best te zien als je er helemaal omheen loopt
      - het bordje aan de voet van de heuvel, dat zegt dat het werk 'niets anders dan zichzelf' voorstelt
      - de heuvel zelf, speciaal aangelegd en onderdeel van het werk, door een buurtcolumnist 'de puist' genoemd; een korfbaltrainer uit Osdorp liet zijn team er tien keer in sprint tegenop rennen
    sources:
    - https://nl.wikipedia.org/wiki/Groot_landschap
    - https://stadscuratorium.nl/collectie/groot-landschap-2/
    - https://geheugenvanwest.amsterdam/page/2275/groot-landschap-in-ere-hersteld
    - Buitenkunst Amsterdam 873
- title: Erotica
  summary: A five-metre "ode to eroticism" in polished aluminium by Erwin de Vries, maker of the national slavery monument, lying in a green strip behind low flats in Slotervaart. He had 500 kilos of aluminium shipped from Suriname for it.
  body: |
    Around 1971 the city asked the Surinamese-born sculptor Erwin de Vries (1929–2018) for a sculpture for the green strip between the Jan Tooropstraat and the backs of the low flats on the Jan Voermanstraat. He came back with *Erotica*: five metres long and two metres high, rounded and angular forms flowing into a stylised female figure. Eroticism was, for him, the force that drove him to make art, and the female figure recurs throughout his work.

    In June 1972 De Vries had 500 kilos of aluminium ingots shipped from Paranam in Suriname, a tangible link between his birthplace and Amsterdam. It was worked up from a model small enough for a dining table and had to be stiffened inside with steel, which, with the polishing, pushed the cost above the planned 30,000 guilders. The housing minister Hans Gruijters unveiled it on 27 November 1973. De Vries later made the National Slavery Monument (2002) in the Oosterpark.

    Look for:
    - "Erwin 1972" cut into the base
    - how the forms change from rounded to angular as you walk round it
    - the low-rise flats of the Jan Voermanstraat behind it
