  nl:
    title: Wegwerphuisje
    summary: "Een bakstenen huisje zonder deur en zonder ramen, waar de specie in cirkels en zigzags uit de voegen puilt, gedumpt in het talud van de Cornelis Lelylaan bij de Sloterplas. Herman Makkink knipoogt in 1989 naar de dichtgespijkerde schuren van vóór de tuinstad."
    body: |
      Geen metselaar zou het zo doen: de specie puilt uit de voegen en is nergens weggestreken. Zo werkte Herman Makkink (1937–2013), en in Amsterdam kennen ze hem vooral om dat eigenzinnige metselwerk. Als jongeman liftte hij de wereld rond. Hij verkocht kranten in Vietnam, gaf Engelse les in Japan en begon in de Verenigde Staten met beeldhouwen. Zijn porseleinen *Rocking Machine* heeft een glansrol in *A Clockwork Orange* van Stanley Kubrick.

      Het *Wegwerphuisje* (1989) zit in het talud van de Cornelis Lelylaan, klem tussen de weg en de Sloterplas. Je ziet er alle soorten voegen aan, horizontaal, verticaal, schuin en in zaagtanden, en verder gemetselde cirkels en overstekken. Alleen naar binnen kun je niet. Zoals het daar staat, lijkt het of iemand het gewoon heeft neergezet om ervan af te zijn. Anderen zien er een ruïne in die eindeloos is opgelapt, of een herinnering aan de dichtgespijkerde houten tuinbouwschuren die in Slotervaart stonden voordat de tuinstad kwam. Makkink kreeg niet altijd zijn zin. Zijn buisvormige beeld *Oude Grond* op het Roeterseiland werd in 1994 gesloopt, omdat de buren vonden dat het hun uitzicht wegnam.

      Let op:
      - de specie die in cirkels en zigzaglijnen tussen de stenen uitpuilt
      - de ontbrekende deur en ramen
      - de gebouwen aan de overkant, die het huisje in een ander licht zet
    sources:
    - https://nl.wikipedia.org/wiki/Wegwerphuisje
    - https://stadscuratorium.nl/collectie/wegwerphuisje/
    - https://publicart.amsterdam/projecten/wegwerphuisje/
    - Buitenkunst Amsterdam 626
- title: Vlindermolen ("de haas")
  summary: A leaning brick half-ball topped by a thatched tube and a bronze butterfly, on the roundabout where Nieuw-Sloten begins. Herman Makkink called it the Butterfly Mill; locals see a hare, an egg or a pear, and know they are nearly home.
  body: |
    When Nieuw-Sloten was built in the 1990s, Herman Makkink made a landmark for the roundabout where you enter the new district from the A4, the Sloterweg at the Anderlechtlaan (1998). On a brick half-ball, set slightly out of true, rises a tube clad in thatching reed, closed by a concrete cap with a bronze butterfly on top. The butterfly's wings sit where a windmill's sails would be, which gave the work its name, *Vlindermolen* ("butterfly mill"), and the mill shape recalls the many windmills of the old municipality of Sloten.

    Few people use that name. Seen from some angles the butterfly disappears and the whole thing becomes a sitting Easter hare, so it is *de haas* ("the hare") or the *Paashaas* to most; others call it the pear or the egg. Because it leans, it changes shape as you drive round. It doubles as a landmark, with no tall buildings around it, and residents describe it as the border between old Sloten village and Nieuw-Sloten: "When I see the hare, I'm nearly home."

    Look for:
    - the hare's "ears": circle the roundabout and watch the butterfly vanish
    - the reed-thatched mill body above the brick half-ball
    - Makkink's brickwork, a love also visible in his works by the Sloterplas
  category: street-art
  lat: 52.341605
  lng: 4.811539
  address: Roundabout Sloterweg / Anderlechtlaan
  links:
  - label: Buitenkunst Amsterdam
    url: https://www.buitenkunstamsterdam.nl/Kunstwerken/696/vlindermolen
