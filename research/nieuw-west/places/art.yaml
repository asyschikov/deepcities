  nl:
    title: Satéprikkers (Kubus-spiegel-palen)
    summary: "Twee lantaarnpalen schieten schuin omhoog naast het viaduct van de Cornelis Lelylaan, elk met een gekleurde kubus van acryl waarin een spiegel de paal in tweeën lijkt te knakken. Joost van Santen bedoelde een poort naar Slotervaart; de buurt zegt satéprikkers."
    body: |
      De kunstenaar bedoelde een poort naar Slotervaart, de buurt zag satéprikkers.

      Waar de Cornelis Lelylaan over een viaduct de Johan Huizingalaan kruist (brug 705, een gemeentelijk monument), zette Joost van Santen in 1981 een werk zonder titel neer. Meestal heet het gewoon *Kubus-spiegel-palen*, naar wat je ziet. Aan weerskanten van het viaduct steekt een gewone lantaarnpaal van ruim 20 meter schuin uit het gras. Over de noordelijke schoof hij een oranje kubus van acryl, over de zuidelijke een blauwe. In elke kubus staat schuin een spiegel, waardoor de paal lijkt te breken en een stukje opzij te verspringen.

      Licht staat centraal in het werk van Van Santen, die vaak gekleurd glas en weerspiegelingen gebruikt. Waar de opdracht precies vandaan kwam, wist hij later niet meer. Hij reed de Lelylaan af op zoek naar ruimte voor iets groots en koos deze kruising. Eind 2023 werd de blauwe kubus, die door storm beschadigd was, vervangen; de nieuwe is lichter van kleur dan de oude.

      Let op:
      - de 'breuk' in elke paal, het duidelijkst als je recht in de spiegel kijkt
      - de vervangen blauwe kubus, bleker dan op oudere foto's
      - het viaduct zelf (brug 705), sinds 2008 gemeentelijk monument
    sources:
    - https://stadscuratorium.nl/collectie/kubus-spiegel-palen/
    - https://nl.wikipedia.org/wiki/Zonder_titel_(Joost_van_Santen)
    - Buitenkunst Amsterdam 707
- title: Wegwerphuisje
  summary: A small brick house with no door and no windows, its mortar oozing out in circles and zigzags, dumped on the embankment of the Cornelis Lelylaan by the Sloterplas. Herman Makkink's 1989 nod to the nailed-up sheds that stood here before the garden city.
  body: |
    Herman Makkink (1937–2013) hitch-hiked round the world as a young man, selling newspapers in Vietnam and teaching English in Japan, and began sculpting in the United States. His porcelain *Rocking Machine* plays a starring role in Stanley Kubrick's *A Clockwork Orange*. In Amsterdam he is known for his brickwork, laid in ways no bricklayer would choose: the mortar is left bulging out instead of being struck off.

    The *Wegwerphuisje* ("throwaway house", 1989) sits in the embankment of the Cornelis Lelylaan, hemmed in between the road and the Sloterplas. It shows every kind of joint, horizontal, vertical, diagonal and sawtooth, plus brick circles and overhangs, but no way in. Placed where it is, it looks as if someone simply put it down to be rid of it. Others read it as an endlessly patched ruin, or as a memory of the boarded-up wooden market-garden sheds that stood in Slotervaart before the garden city was built. Makkink did not always get his way: his tube sculpture *Oude Grond* on the Roeterseiland was demolished in 1994 because neighbours said it blocked their view.

    Look for:
    - mortar squeezed out in circles and zigzag lines between the bricks
    - the missing door and windows
    - the buildings across the way, which the house pulls into another context
