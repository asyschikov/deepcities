- id: null
  title: Begijnhof
  access: Open daily
  today: Still a hofje
  hours:
    en: Every day 10:00 to 18:00, public holidays included; closed to tourists on King's Day (27 April).
    nl: Elke dag 10.00 tot 18.00 uur, ook op feestdagen; op Koningsdag (27 april) gesloten voor toeristen.
  rules:
    en: Private ground; quiet; only the open (orange, unhatched) part of the court; no bikes, dogs or wheeled suitcases; no eating or drinking (no bins); groups at most 12; follow the hosts at busy times. Guided groups need a municipal permit (Centrum, max 15).
    nl: Privéterrein; stil zijn; alleen het open (oranje, niet gearceerde) deel van het hof; geen fietsen, honden of rolkoffers; niet eten of drinken (geen afvalbakken); groepen hooguit 12; aanwijzingen van gastheren volgen. Rondleidingen hebben een gemeentelijke ontheffing nodig (Centrum, max 15).
  access_note:
    en: Walk in through the gate off the Spui (Gedempte Begijnensloot / Begijnensteeg) and leave the same way; hosts keep visitors to the open part of the court.
    nl: Je loopt naar binnen via de poort bij het Spui (Gedempte Begijnensloot / Begijnensteeg) en weer terug dezelfde weg; gastheren houden bezoekers in het open deel van het hof.
  checked: Nov 2026
  founded: before 1346 (first mention 1307)
  founder: Community of beguines; Beghynhuys given 1346
  homes: 106
  residents_now: Single women over 30
  entrance_address: Gedempte Begijnensloot / Begijnensteeg (address Nieuwezijds Voorburgwal 373)
  lat: 52.36942
  lng: 4.890456
  courtyard_lat: 52.369115
  courtyard_lng: 4.889711
  sources:
    - https://hetbegijnhof.nl/info/ (read Nov 2026; hours, rules, gate)
    - https://hetbegijnhof.nl/ (read Nov 2026; over 100 single women over 30)
    - https://www.hofjesberaad.nl/begijnhof (read Nov 2026; gives older hours 08:00-17:00, superseded by the official site)
    - https://hofjesinamsterdam.nl/begijnhof/ (2018; 106 units)
    - https://lokaleregelgeving.overheid.nl/CVDR637379/1 (tour permit policy, from 1 Apr 2020)
    - OSM node barrier=gate access=permissive at the gate (pin)

