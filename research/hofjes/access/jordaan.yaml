    nl: De eenvoudige deur op Egelantiersgracht 107 geeft toegang tot een betegelde gang en de tuin, waar twee informatiebordjes staan; over de precieze tijden zijn de bronnen het niet eens (zie notities).
  checked: 2026-10
  founded: 1614 (will), built 1617
  founder: Ivo Gerritsz. (bequest), on land given by Jan Jansz. Oly
