    - "https://amsterdamoudestad.nl/bezienswaardigheden/hofjes-jordaan (undated, read Nov 2026: dagelijks 10.00 tot 17.00)"
    - "https://xohotels.com/wp-content/uploads/2023/02/12-hofjes-EN.pdf (Feb 2023: Monday to Saturday 9:00 to 18:00)"
