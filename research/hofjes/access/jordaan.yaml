# Hofjes access, slice jordaan (Jordaan and Haarlemmerbuurt). One entry per hofje.
# "Open daily" with hours "by day" means: the gate is reported open in the daytime, but
# no hours are posted. Those entries are also listed as unsure in notes/jordaan.md.
# Sources: G = Google Maps (reviews and dated user photos, read 24 Nov 2026; "a month ago"
# is converted to a month); AOS = amsterdamoudestad.nl hofjes page (undated, read
# 24 Nov 2026); HIA = hofjesinamsterdam.nl (posts of July 2018); WJGR = Wijkkrant Jordaan &
# Gouden Reael; XO = XO Hotels "12 hofjes" walk PDF (Feb 2023).

- id: inre216aswcgsiueto25za5o
  title: Sint Andrieshofje
  today: Still a hofje
  access: Open at set times
  hours:
    en: Monday to Saturday 10:00 to 17:00; closed on Sunday
    nl: maandag tot en met zaterdag 10.00 tot 17.00 uur; zondag gesloten
  rules:
    en: Residents' homes; keep quiet
    nl: Bewoond hofje; wees stil
