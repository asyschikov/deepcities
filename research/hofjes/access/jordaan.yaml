- id: ju9b1flv3xggsmzq3728y1nl
  title: Claes Claesz. Hofje (Anslo's Hofje)
  today: Still a hofje
  access: Open daily
  hours:
    en: By day; no posted hours
    nl: Overdag; geen tijden aangegeven
  rules:
    en: Residents' homes; keep quiet
    nl: Bewoond hofje; wees stil
  access_note:
    en: Enter from the Eerste Egelantiersdwarsstraat; the complex has four small courts, including those of the former Anslo's Hofje and Zwaardvegershofje. The old Zwaardvegershofje door at Tuinstraat 35-37 stays shut.
    nl: Ingang aan de Eerste Egelantiersdwarsstraat; het complex telt vier binnenplaatsjes, waaronder die van het vroegere Anslo's Hofje en het Zwaardvegershofje. De oude deur van het Zwaardvegershofje op Tuinstraat 35-37 blijft dicht.
  checked: 2026-06
  founded: 1616 (will of 30 March 1616); present complex restored 1968 to 1973
  founder: Claes Claesz. and Griet Jans
  homes: null
  residents_now: artists and students
  entrance_address: Eerste Egelantiersdwarsstraat 1-5
  lat: 52.377144
  lng: 4.884055
  sources:
    - "https://www.google.com/maps/place/Claes+Claeszhofje (review about Jun 2026: 'Nice to walk through')"
    - "https://amsterdamoudestad.nl/bezienswaardigheden/hofjes-jordaan (undated, read Nov 2026: open, openingstijden onbekend; Tuinstraat 35-37 door shut)"
    - "https://hofjesinamsterdam.nl/claes-claesz-hofje/ (2018: four courts, artists and students)"

