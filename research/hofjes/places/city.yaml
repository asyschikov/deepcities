  nl:
    title: Elisabeth Otter-Knoll Stichting, een gesticht voor deftige dames
    summary: "Gebouwd in 1912 aan het Eikenplein voor onvermogende 'dames uit den deftigen stand', uit de nalatenschap van een tweemaal verweduwde erfgename. De stichting vertrok in 1982 naar Buitenveldert; de vleugels rond de tuin zijn nu huurwoningen."
    body: |
      Johanna Elisabeth Sophia Knoll trouwde in 1847 met makelaar Adolf Fortgens Otter. Hij stierf in 1858, haar schoonmoeder een jaar later. Als enige erfgename van haar man, haar schoonmoeder, haar vader en haar opa was ze rond haar veertigste een vermogende vrouw. Ze hertrouwde met een dominee en werd in 1887 voor de tweede keer weduwe.

      Toen ze in 1900 stierf, bleek haar testament heel precies. Voor vrouwen uit de 'mindere stand' waren er hofjes genoeg, vond ze; haar stichting moest fatsoenlijke dames die buiten eigen schuld arm waren geworden een onbezorgde oude dag geven. Een bewoonster moest zelf 500 gulden per jaar inkomen hebben, de stichting legde er 500 bij, en de entree kostte 500 gulden.

      Het Dames Gesticht aan het Eikenplein ging in 1912 open met zeventien dames, in vleugels rond een binnentuin. Een tweede tehuis, voor oude zeekapiteins en stuurlieden, zoals haar man had gewild, opende in 1916 en sloot al in 1923.

      In 1982 verhuisde de stichting naar een nieuw verzorgingshuis in Buitenveldert en verkocht dit gebouw voor een symbolisch bedrag. Nu verhuurt een corporatie het: losse wooneenheden in de ene vleugel, een woongroep in de andere. In de oude eet- en leeszaal zat van 1984 tot 2009 een artotheek.

      Let op:
      - de gevelsteen met de naam van de stichting
      - de as met het oude katholieke schoolblok aan de overkant van het Eikenplein
    attributes:
      built: "1912"
      original_use: Gesticht voor onvermogende dames
    sources:
      - https://hofjesinamsterdam.nl/elisabeth-otter-knoll-stichting/ (2018)
      - api.data.amsterdam.nl monument 200707

- title: Hofje De Kalverengang, beside the burnt-out theatre
  summary: "A Catholic hofje for single women in an old alley off the Prinsengracht, built in the late 19th century partly against a wall of the city theatre that burned down in 1772. It emptied during a restoration in the 1970s and has been offices since."
  body: |
    The alley is old, and its name has nothing to do with calves. It goes back to Kalkvaersgang: in 1624 the house on its corner, Prinsengracht 525, was bought by the "vaer", the overseer of the men who measured and carried lime for the city's builders. The alley once had thirteen small houses.

    Beside it, at Keizersgracht 384, Samuel Coster built the first Dutch theatre in 1617. Its stone successor by Jacob van Campen opened on 3 January 1638 with Vondel's Gijsbreght van Aemstel; a bigger one followed in 1665 and burned down on 11 May 1772, leaving only its stone gate. That August the Catholic poor relief office, the RCOAK, bought the site at auction for its headquarters, and its complex grew back to the Prinsengracht, taking in the alley.

    At the end of the 19th century hofje houses went up here, partly against the old theatre wall, for single Catholic women of fifty to sixty-five. In 1964 there was room for 28. A large restoration began in the late 1960s; by January 1974 only two women were left. New rules no longer allowed the small houses to be lived in, and the architect Gerard Prins, who led the restoration, moved his office into them.

    Look for:
    - the alley between the Prinsengracht houses
    - the sandstone theatre gate at Keizersgracht 384, now a hotel entrance
