    body: |
      De Herdersgang of het Herdershofje lag achter Tuinstraat 233-245, een paar deuren van het nog bestaande hofje De Zeven Keurvorsten. Het komt voor in een stuk uit 1804 en in de bevolkingsregisters van 1812 tot 1847, en staat op de kaarten van 1853 en 1876. Over het einde zijn de bronnen het oneens: volgens de een verdween het tussen 1876 en 1906, terwijl gangenlijsten de naam later nog geven. Een stichter is niet bekend. De panden op nr. 231-233 zijn van 1987.
