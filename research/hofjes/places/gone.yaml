- title: Hofje Hij is mijn Borg (gone)
  summary: Also called the Medemblikker Hofje, this court at Vinkenstraat 131-137 had the words "Hij is mijn borg" ("He is my surety") on a stone over the gate. Founded around 1755, gone after 1935; a 1989 block stands there now.
  body: |
    Over the entrance to this court in the Vinkenstraat was a gable stone reading "Hij is mijn borg" ("He is my surety"), and the hofje took the phrase as its name; it was also known as the Medemblikker Hofje. Loman's atlas of 1876 shows it at Vinkenstraat 131-137, and the house numbers of the street ran on into the court, so that Vinkenstraat 135 lay inside the hofje. J.M.A. Rieke drew it in the 19th century. It is dated from about 1755 and was still listed in 1935. The apartment block on the site dates from 1989.
