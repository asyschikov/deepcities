    title: Ockershofje (verdwenen)
    summary: Zes huisjes voor bejaarde gereformeerde vrouwen in de Kromme Palmstraat, de tweede plek van een familiehofje dat eerst achter de Heiligeweg lag. Boven de poort stond A.O., van stadstimmerman Adriaen Ockersz. Vóór 1853 verdwenen.
    body: |
      Adriaen Ockersz, stadstimmerman en landmeter met een grote rol bij de Tweede Uitleg, bouwde huisjes achter de Heiligeweg, in de Vrouwengang, waar zijn familie van eind 16de tot medio 17de eeuw een hofje voor oude gereformeerde vrouwen onderhield. Toen die grond te waardevol werd, verrees in de Kromme Palmstraat, op grond die vanaf 1648 werd verkocht, een nieuw Ockershofje: zes huisjes, met A.O. en het woord HOF op de sluitsteen boven de poort. Ockersz overleed rond 1608, dus hij kan het niet zelf gesticht hebben. Het hofje staat tot 1829 op de kaarten en ontbreekt in 1853; Kannegieter las bij Wagenaar dat de vrouwen er in de 18de eeuw al uitgezet waren.
    sources:
