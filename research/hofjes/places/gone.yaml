    body: |
      Het Brillenhofje, ook Brillenhof of Brillengang, lag aan de Goudsbloemgracht, die in 1875 werd gedempt tot Willemsstraat. Akten noemen het vanaf het begin van de 18de eeuw; een lijst geeft 1716 als beginjaar. Op de kaarten van 1853 tot 1869 ontbreekt het. Een lijst plaatst het op Willemsstraat 196; een buurthistoricus oppert dat het een van de binnenplaatsen achter het Constantiahofje (nr. 149-165) kan zijn geweest. De speld volgt de eerste en is onzeker.
