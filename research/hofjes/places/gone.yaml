    body: |
      Boven de ingang van dit hofje in de Vinkenstraat zat een gevelsteen met de tekst 'Hij is mijn borg', en die woorden werden de naam van het hofje; het heette ook Medemblikker Hofje. In de Loman-atlas van 1876 ligt het op Vinkenstraat 131-137, en de huisnummers van de straat liepen door in het hofje: Vinkenstraat 135 lag in Hofje Hij is mijn borg. J.M.A. Rieke tekende het in de 19de eeuw. Het wordt gedateerd vanaf omstreeks 1755 en stond in 1935 nog vermeld. Het appartementencomplex op de plek is van 1989.
