    summary: Naast het laatste gildehuis van de Amsterdamse turfdragers lag dit hofje, Prinsengracht 933-941, met de poort op nr. 943. Rieke tekende het in 1875, Misset in 1909; inmiddels is alles overbouwd.
    body: |
      Turf was de brandstof van de stad, en de turfdragers die hem sjouwden hadden hun eigen gilde. Het laatste verblijf van dat gilde was Prinsengracht 931, en ernaast lag het Turfdragershofje, Prinsengracht 933-941, met de ingang op nr. 943. Akten noemen het hofje vanaf 1712, de registers van 1812 tot 1837. J.M.A. Rieke tekende gildehuis en poort in 1875; Herman Misset maakte in 1909 een situatieschets van hofje en gildehuis. De nummers 935-943 bestaan niet meer: het pand op nr. 933 is van 1973.
