      - 'maps.amsterdam.nl/sloppen'
      - 'amsterdamhistorie.nl/hofjes'

- title: Herdershofje, Tuinstraat (gone)
  summary: A court behind Tuinstraat 233-245, near the Zeven Keurvorsten hofje, recorded from 1804. It disappeared around 1906; the site was rebuilt in 1987.
  body: |
    The Herdersgang or Herdershofje ("shepherds' court") lay behind Tuinstraat 233-245, a few doors from the surviving Zeven Keurvorsten hofje. It is named in a document of 1804 and in the population registers of 1812 to 1847, and appears on the maps of 1853 and 1876. Sources differ on its end: one has it gone between 1876 and 1906, while alley lists still give the name later. No founder is known. The buildings at nos. 231-233 date from 1987.
