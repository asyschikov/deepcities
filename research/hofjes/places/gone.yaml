    summary: Een hofje achter Lijnbaansgracht 212-214, nog niet in het register van 1796 en vóór 1927 verdwenen. Op de plek staat een pand uit 1940.
    body: |
      Het Emmenesserhofje (ook Emmenessehofje) lag achter Lijnbaansgracht 212-214, aan de rand van de Jordaan, aan de gracht die vroeger langs de binnenkant van de stadswal liep. In het straatregister van 1796 komt het nog niet voor, dus het is jonger dan de meeste Jordaanhofjes; tussen 1906 en 1927 verdween het. Over stichter of bewoners is niets bekend. Het pand op nr. 212-214 is van 1940.
