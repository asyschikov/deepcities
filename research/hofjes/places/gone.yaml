- title: Anjeliershofje (gone)
  summary: Four back houses behind Anjeliersstraat 136-142, named in a burial record of 1630 and still there in 1943. Gone after the war; a 1976 building stands on the site.
  body: |
    The Anjeliershof appears in burial records from 1630 ("int Angeliershoff") and, as "the old Anjeliers hof", in 1655. It was four small houses behind the Anjeliersstraat, reached by a passage between nos. 136 and 142. The historian Kannegieter still found it in 1943, but by 1946 it had gone. No founder is recorded; it seems to have been a court of rented houses. The building at nos. 138-142 dates from 1976. A modern housing court at nos. 39-59 has taken the name Anjeliershof.
