- title: Lutherse Diaconiehofje (Konijnenhofje) (gone)
  summary: The Lutheran deaconry built this hofje in the Konijnenstraat around 1670 and enlarged it in 1720, with a pelican painted over the gate. Its residents moved to the new Lutherhof in 1909; its gable stones went with them.
  body: |
    Around 1668-1670 the Evangelical Lutheran deaconry built a hofje for poor women on the west side of the Konijnenstraat, and in 1720 added eight more houses. Over the entrance a pelican was painted, Wagenaar noted. Herman Misset drew the row in 1905, with the hofje at nos. 16-46 tucked behind the street. In 1909 the deaconry opened its new Diaconiehof on the Staringplein (now the Lutherhof) and the women moved there; old gable stones from the Konijnenhofje were set into the new building. The old hofje was demolished when the Catholic home De Voorzienigheid next door expanded. The buildings at nos. 16-20 date from 1923 and 1952.
