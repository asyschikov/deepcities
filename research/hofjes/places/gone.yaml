- title: Ockershofje (gone)
  summary: Six houses for elderly Reformed women in the Kromme Palmstraat, the second home of a family hofje first kept behind the Heiligeweg. The gate bore A.O., for the city carpenter Adriaen Ockersz. Gone before the 1850s.
  body: |
    Adriaen Ockersz, city carpenter and surveyor who helped lay out the Second Extension, built houses behind the Heiligeweg (the Vrouwengang) where his family kept a hofje for old Reformed women from the late 16th to the mid-17th century. When that land grew too valuable, a new Ockershofje rose in the Kromme Palmstraat, on ground sold from 1648: six houses, with A.O. and the word HOF on the keystone over the gate. Ockersz had died around 1608, so he cannot have founded it himself. The hofje is on maps until 1829 and gone by 1853; Kannegieter read in Wagenaar that the women had already been turned out in the 18th century.
  category: hidden-history
  lat: 52.382432
  lng: 4.882718
  address: Kromme Palmstraat 5
