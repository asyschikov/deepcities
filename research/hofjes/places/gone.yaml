    summary: Het Tamboershofje achter Bloemstraat 171-173, genoemd naar het huis De Tamboer uit 1661. Bereikbaar via twee gangen, tot 1935 vermeld; de plek werd in 1989 herbouwd.
    body: |
      In 1661 heette een huis in de Bloemstraat, voorbij de laatste dwarsstraat, De Tamboer, en daarachter ontstond het Tamboershofje, bereikbaar via twee gangen tussen nr. 165 en 177. Een akte uit 1696 noemt het; het staat op de kaarten van 1853 en 1876 en in de lijsten tot 1935, daarna is het verdwenen. Over een stichter is niets bekend. De panden op nr. 171-173 zijn van 1989.
