- title: Trompettershofje (gone)
  summary: Founded in 1621, the Trompettershofje behind Anjeliersstraat 91-97 was one of the oldest in the Jordaan, with a spouted gable recorded in 1928. Still listed in 1935, gone by 1946.
  body: |
    The Trompettershofje (also Trompettenhofje) lay behind Anjeliersstraat 91-97. The national inventory of monuments of 1928 records it as founded in 1621 and later rebuilt, with a spouted gable with a crest. Kannegieter wondered whether the house sign De Trompet, mentioned in the street in 1625, belonged to it. It is on the maps of 1796 and 1829 and on the lists until 1935; by 1946 it had gone. The building at no. 91 now dates from 2005.
