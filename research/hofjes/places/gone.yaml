    body: |
      Door een poort tussen Anjeliersstraat 43 en 55 kwam je op het Bijbelshofje, ook Bijbelsgang genoemd. Het staat in 1703 in een begraafboek, en in 1753 werd drie vijfde deel verkocht van de poort 'zynde de in en doorgang naar het Bybels hoffje'. Aan de achterkant grensde het aan het Karseboomshofje in de Tuinstraat. Herman Schouten tekende in 1797 de blik vanuit de poort. Het begon als gang en werd later, zoals meer gangen, tot hofje gepromoveerd. In 1906 bestond het nog, in 1927 niet meer.
