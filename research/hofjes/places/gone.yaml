    body: |
      Het Groenehofje, ook Groenegang genoemd, komt voor in akten vanaf 1804 en in de registers van 1811 tot 1843. Volgens de Atlas van 1876 leidde de gang naar de woningen van het toen al vervallen Nieuwe Groenewoudshofje. Tussen 1906 en 1927 is het verdwenen. Waar het precies lag is onzeker: de ene lijst noemt nr. 33, de andere 'tusschen 88 en 90'; de speld volgt de tweede, die teruggaat op de atlas van 1876.
