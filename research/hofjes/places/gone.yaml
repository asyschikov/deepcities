- title: Emmenesserhofje (gone)
  summary: A court behind Lijnbaansgracht 212-214, not yet in the register of 1796 and gone by 1927. The site now has a 1940 building.
  body: |
    The Emmenesserhofje (also Emmenessehofje) lay behind Lijnbaansgracht 212-214, at the edge of the Jordaan, on the canal that once ran along the inside of the city rampart. It does not appear in the street register of 1796, so it is younger than most Jordaan courts, and it disappeared between 1906 and 1927. Nothing is known of a founder or residents. The building at nos. 212-214 dates from 1940.
