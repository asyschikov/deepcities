      - 'Margry, Reynaerts & Vis, Het verdwenen hofje (2017), flaptekst'
      - 'amsterdam-monumentenstad.nl (Herengracht 130)'

- title: Appelhofje, Lange Leidsedwarsstraat (gone)
  summary: A small court behind Lange Leidsedwarsstraat 192-196, on the city's maps from 1805 and gone by 1927.
  body: |
    The Appelhofje, also written Appelenhofje, lay behind nos. 192-196 of the Lange Leidsedwarsstraat. It is on the city map of 1805 and in the population registers from 1812 to 1831, and still on the maps of 1853 and 1876. No founder is known, and nothing shows it was more than a court of small rented houses. It disappeared between 1906 and 1927; the building on the site dates from 1926.
