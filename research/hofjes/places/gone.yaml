- title: Karseboomshofje (gone)
  summary: The Karseboomshofje ("cherry tree court") behind Tuinstraat 22-28 was drawn around 1800 and backed onto the Bijbelshofje. Demolished after 1935 and replaced by new building.
  body: |
    Behind Tuinstraat 20-30 lay the Karseboomshofje (also Karse- or Kerseboomhofje, "cherry tree court"), its back against the Bijbelshofje in the Anjeliersstraat. A drawing of about 1800 shows its inner court. It is in documents from 1807-1808, densely recorded in the registers of 1811 to 1855, and on the maps until 1935. Kannegieter found it gone by 1943; it was demolished after 1935 and replaced by new building. The house at no. 30 dates from 1919.
