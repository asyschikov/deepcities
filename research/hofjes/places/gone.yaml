    body: |
      De Mosterdpotsgang aan de Elandsstraat wordt vanaf 1784 genoemd. In 1873 ontstond hier het Mosterdpothofje door de herbouw van tien nieuwe huisjes, en uniek voor de Jordaan was dat ze een aansluiting op het riool kregen. Ernaast, op nr. 177, stond het katholieke Sint Aloysiusgesticht. Het hofje staat tot 1935 in de lijsten en verdwijnt dan. Een stichter noemen de bronnen niet. Het pand op nr. 169 is van 1930.
