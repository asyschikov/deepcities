- title: Brillenhofje (gone)
  summary: A court of about 1716 off the old Goudsbloemgracht, now the Willemsstraat, which had vanished by 1869. Where exactly it lay is not settled.
  body: |
    The Brillenhofje ("spectacles court"), also Brillenhof or Brillengang, lay off the Goudsbloemgracht, the canal filled in 1875 to make the Willemsstraat. Deeds name it from the early 18th century; one list gives 1716 as its start. It is missing from the maps of 1853 to 1869. One list places it at Willemsstraat 196; a local historian suggests it may have been one of the inner courts behind the Constantiahofje (nos. 149-165). The pin follows the first and is uncertain.
