- title: Turfdragershofje, Prinsengracht (gone)
  summary: Next door to the last guild house of Amsterdam's peat carriers, this hofje at Prinsengracht 933-941 had its gate at no. 943. Sketched by Rieke in 1875 and Misset in 1909, it has been built over since.
  body: |
    Peat was the city's fuel, and the turfdragers who carried it had their own guild. Its last home was at Prinsengracht 931, and beside it lay the Turfdragershofje, Prinsengracht 933-941, entered by a gate at no. 943. Deeds mention the hofje from 1712 and the registers from 1812 to 1837. J.M.A. Rieke drew the guild house and the gate in 1875; Herman Misset sketched the plan of hofje and guild house in 1909. The numbers 935-943 no longer exist: the building at no. 933 dates from 1973.
