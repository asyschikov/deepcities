    - 'uilenburgersjoel.nl: house synagogue 1724, new synagogue 1766, forecourt after demolition 1906, "stond niet meer op het Kokshofje"'
    - 'joodsamsterdam.nl: synagogue on the plot of a house in the Kokshofje'
