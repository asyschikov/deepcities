- title: Hoedenmakershofje (gone)
  summary: '"A grand name for this alley": the hatters'' court behind Laurierstraat 6-16, on record from 1691, was pulled down around 1911.'
  body: |
    The Hoedenmakersgang ("hatters' alley") behind Laurierstraat 6-16 appears in deeds from 1691 and in the registers of 1811 to 1852, which record dozens of residents. Deeds of 1720 to 1803 record houses changing hands in the alley. Maps from 1853 onward call it the Hoedenmakershofje, "a grand name for this alley", as a Jordaan historian put it. No foundation is known. It was demolished around 1911.
