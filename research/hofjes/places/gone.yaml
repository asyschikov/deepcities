- title: Turfdragershofje, Nieuwe Looiersstraat (gone)
  summary: A court behind Nieuwe Looiersstraat 106-108, named after the peat carriers and recorded from 1748. It had disappeared by about 1875.
  body: |
    One of two Turfdragershofjes ("peat carriers' courts") in this part of town lay behind Nieuwe Looiersstraat 106-108. Deeds mention it from 1748 and the population registers in 1818-1820; it is on the maps of 1853 and 1876, but it had gone soon after. No founder or residents are known. The houses now at nos. 100 and 112 date from 1905 and 1836.
