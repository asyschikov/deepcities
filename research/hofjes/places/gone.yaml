- title: Van Beeck's Hofje (gone)
  summary: A Mennonite hofje in the Schuiermakersgang, Anjeliersstraat 104-112, later named after Van Beeck. The city bought and demolished it in 1937-38.
  body: |
    The Schuiermakersgang ("brush makers' alley") behind Anjeliersstraat 102-114 is recorded from 1655. Deeds of 1715 and 1741 call it "the Mennonite hofje, or Schuiermakersgang"; the monuments list of 1928 gives Van Beeck's hofje as founded in 1735, and directors of the Van Beeckshofje are named from 1745. Herman Misset drew its entrance in 1901. By the 1930s its houses belonged to the Fonds-Heemskerck, which also owned the neighbouring Stoppersgang; the city bought the houses in 1937-38 and pulled them down, and the alley disappeared with them. The building at nos. 104-108 dates from 1976.
