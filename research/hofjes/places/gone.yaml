- title: Groenehofje, Nieuwe Looiersstraat (gone)
  summary: The Groenegang or Groenehofje led to the homes of the Nieuwe Groenewoudshofje off the Nieuwe Looiersstraat. Recorded from 1804, it disappeared between 1906 and 1927; sources disagree on its exact number.
  body: |
    The Groenehofje ("green court"), also called the Groenegang, is named in deeds from 1804 and in the registers of 1811 to 1843. According to the Atlas of 1876 the passage led to the homes of the Nieuwe Groenewoudshofje, by then already defunct. It disappeared between 1906 and 1927. Where exactly it lay is unclear: one list places it at no. 33, another between nos. 88 and 90; the pin follows the second, which goes back to the 1876 atlas.
