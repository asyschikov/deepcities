    summary: Het Moens- of Ottershofje in de Vinkenstraat, in 1636 gesticht bij testament van Hillebrand den Otter, telde negen huisjes, met een houten reliëf van 1766 en het wapen van de stichter boven de poort. In januari 1938 gefotografeerd, dat jaar afgebroken.
    body: |
      Hillebrand den Otter liet bij testament geld na voor dit hofje, in 1636 gesticht op Vinkenstraat 105-113 en bekend als Moenshofje of Ottershofje. Het bestond uit negen huisjes. In de 18de eeuw werd het vernieuwd en uitgebreid, en opnieuw in 1887; boven de ingang stonden het wapen van de stichter en de naam van de stichting, en een van de gevels aan de binnenplaats was bekroond met een houten reliëf met een opschrift over de vernieuwing van 1766. Monumentenzorg fotografeerde ingang en binnenplaats in januari 1938, en nog dat jaar werd het hofje afgebroken. Het pand op nr. 105 is van 1938.
