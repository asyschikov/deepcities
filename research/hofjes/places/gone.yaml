- title: Salamanderhofje (gone)
  summary: The Salamandersgang or Salamanderhofje behind Elandsstraat 34-36 is on record from 1673 and was listed until 1935.
  body: |
    The Salamandersgang or Salamanderhofje lay off the north side of the Elandsstraat, at nos. 34-36 by the old numbering of the registers. It is named in 1673 and in deeds of the 18th century, and the registers of 1811 to 1852 record its residents. It was still on the list of 1935 and then disappeared. Maps and drawings disagree about which of the alleys between nos. 34 and 60 led to it. The buildings at nos. 34-38 date from 1905.
