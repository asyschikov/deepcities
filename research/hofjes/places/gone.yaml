- title: Bijbelshofje (gone)
  summary: A court behind Anjeliersstraat 45-53 that took its name from the gilded bible over the gate, named from 1703. Drawn by Herman Schouten in 1797, gone by 1927.
  body: |
    Through a gate between Anjeliersstraat 43 and 55 lay the Bijbelshofje ("bible court"), also called the Bijbelsgang. It is named in a burial record of 1703, and a deed of 1753 sells three fifths of the gateway "being the way in to the Bybels hoffje". At the back it bordered the Karseboomshofje in the Tuinstraat. Herman Schouten drew the view from the gate in 1797. It began as an alley and was later "promoted" to hofje, as happened to more alleys. It was still there in 1906 and had gone by 1927.
