    summary: Een klein hofje achter Lange Leidsedwarsstraat 192-196, vanaf 1805 op de stadskaarten en vóór 1927 verdwenen.
    body: |
      Het Appelhofje, ook Appelenhofje genoemd, lag achter de nummers 192-196 van de Lange Leidsedwarsstraat. Het staat op de stadskaart van 1805 en in de bevolkingsregisters van 1812 tot 1831, en nog op de kaarten van 1853 en 1876. Een stichter is niet bekend en niets wijst erop dat het meer was dan een binnenplaats met kleine huurhuisjes. Het verdween tussen 1906 en 1927; het pand op de plek is van 1926.
    sources:
