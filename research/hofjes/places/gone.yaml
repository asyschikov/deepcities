  nl:
    title: Zonnehofje, Valkenburgerstraat (verdwenen)
    summary: Een van de zestien sloppen aan de Valkenburgerstraat, ondanks de zonnige naam bewoond door het Joodse proletariaat. De onteigening begon in 1901; in 2016 kwamen bij nieuwbouw de funderingen boven.
    body: |
      Het Zonnehofje was alleen in naam een hofje: een van de zestien sloppen die op de Valkenburgerstraat uitkwamen, grotendeels bewoond door het Joodse proletariaat. Het komt vanaf 1737 in akten voor en tot ver in de 19de eeuw in de registers. In juli 1901 kondigde de gemeente de eerste stap naar onteigening van de gemeentegrond van het Zonnehofje aan; in de jaren daarna werden de sloppen gesloopt, samen met een groot deel van de straat. Bij afgravingen voor een nieuw bouwproject kwamen in 2016 funderingen en bouwresten van deze huizen tevoorschijn. De huidige panden op nr. 11-37 zijn van 1998.
    sources:
      - 'joodsamsterdam.nl'
      - 'W. Blok, Alfabetische Lijst van Gangen in Amsterdam'

# ---------------------------------------------------------------- Grachtengordel and Weteringbuurt

- title: Hamershofje, Herengracht (gone)
  summary: A soap boiler's almshouse of about 1626 on the Herengracht, four houses on the canal and four behind, nicknamed the Verdriethuisjes ("misery houses"). It moved to the Marnixstraat in 1877.
  body: |
    Around 1626 a soap boiler named Bijsdorf, whose soap works on the Damrak was called De Hamer, founded a hofje so that the name would live on. It had four houses with upper floors on the Herengracht and four more round a court behind, and was known as the Verdriethuisjes. In 1822 it passed to the Roman Catholic Oude Armen Kantoor, which in 1877 merged it with the Bouwershuisjes into a new building at Marnixstraat 281, the Hamer- en Bouwershofje. The present houses on the site date from about 1880.

    Look for:
    - Herengracht 373, on the corner of the Wijde Heisteeg
