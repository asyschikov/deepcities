- title: Mosterdpothofje (gone)
  summary: In 1873 the old Mosterdpotsgang behind Elandsstraat 153-171 was rebuilt as ten new houses, unusually connected to the sewer. Listed until 1935, then gone.
  body: |
    The Mosterdpotsgang ("mustard pot alley") off the Elandsstraat is recorded from 1784. In 1873 it was rebuilt as ten new houses, the Mosterdpothofje, and unusually for the Jordaan these were connected to the sewer. Next door, at no. 177, stood the Catholic Sint Aloysius institution. The hofje is on the lists until 1935 and then disappears. No founder is named in the sources. The building at no. 169 dates from 1930.
