      Achter Tuinstraat 20-30 lag het Karseboomshofje (ook Karse- of Kerseboomhofje), met de achterkant tegen het Bijbelshofje in de Anjeliersstraat. Een tekening van rond 1800 toont de binnenplaats. Het komt voor in stukken uit 1807-1808, veel in de registers van 1811 tot 1855 en tot 1935 op de kaarten. Kannegieter vond het in 1943 niet meer; het werd na 1935 gesloopt en vervangen door nieuwbouw. Het pand op nr. 30 is van 1919.
