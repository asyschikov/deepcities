      Het Klaverbladshofje had zijn ingang aan de Lijnbaansgracht, nr. 351-353, terwijl de huisjes genummerd waren in wat later de Fokke Simonszstraat werd. Een akte uit 1736 noemt het al, en het was dicht bewoond: de bevolkingsregisters van 1811 tot 1836 hebben er ruim honderd vermeldingen van. Toen de Fokke Simonszstraat bestraat werd, verloren de gangen vanaf de Lijnbaansgracht hun functie en verdwenen ze; ook het Klaverbladshofje. Het pand op nr. 349-351 is van 1960.
