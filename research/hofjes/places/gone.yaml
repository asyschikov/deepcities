    body: |
      Het Anjeliershof komt vanaf 1630 voor in de begraafboeken ('int Angeliershoff') en in 1655 als 'het ouwe angeliers hof'. Het bestond uit vier achterhuisjes achter de Anjeliersstraat, te bereiken door een gang tussen nr. 136 en 142. Kannegieter trof het in 1943 nog aan, in 1946 was het weg. Een stichter is niet bekend; het lijkt een hofje van huurhuisjes te zijn geweest. Het pand op nr. 138-142 is van 1976. Een nieuwbouwhofje op nr. 39-59 draagt de naam Anjeliershof.
