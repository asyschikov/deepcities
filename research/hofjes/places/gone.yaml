- title: Klaverbladshofje (gone)
  summary: A court entered from Lijnbaansgracht 351-353 but numbered in the street behind, crowded enough to fill pages of 19th-century registers. It vanished when the Fokke Simonszstraat was laid out; a 1960 building stands there now.
  body: |
    The Klaverbladshofje ("cloverleaf court") had its entrance on the Lijnbaansgracht at nos. 351-353, while its houses were numbered in what became the Fokke Simonszstraat. It is named in a deed of 1736 and was densely lived in: the population registers of 1811 to 1836 record over a hundred entries. When the Fokke Simonszstraat was paved, the alleys off the Lijnbaansgracht lost their purpose and disappeared; local historians list the Klaverbladshofje as gone. The building at nos. 349-351 dates from 1960.
