    body: |
      Rond 1668-1670 bouwde de Evangelisch-Lutherse diaconie aan de westzijde van de Konijnenstraat een hofje voor arme vrouwen, dat in 1720 met acht huisjes werd uitgebreid. Boven de ingang was een pelikaan geschilderd, aldus Wagenaar. Herman Misset tekende de huizenrij in 1905, met het hofje inpandig op nr. 16-46. In 1909 opende de diaconie haar nieuwe Diaconiehof aan het Staringplein, het latere Lutherhof, en verhuisden de bewoonsters daarheen; oude gevelstenen uit het Konijnenhofje kregen er een plek. Het oude hofje werd afgebroken bij de uitbreiding van het R.K. Gesticht De Voorzienigheid ernaast. De panden op nr. 16-20 zijn van 1923 en 1952.
