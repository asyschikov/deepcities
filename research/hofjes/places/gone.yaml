- title: Moenshofje (gone)
  summary: Founded in 1636 by the will of Hillebrand den Otter, the Moens- or Ottershofje on the Vinkenstraat had nine houses, a carved relief of 1766 and the founder's arms over the gate. Photographed in January 1938, demolished that year.
  body: |
    Hillebrand den Otter left money in his will for this hofje, founded in 1636 at Vinkenstraat 105-113 and known as the Moenshofje or Ottershofje. It had nine small houses. It was renewed and enlarged in the 18th century and again in 1887; over the entrance were the founder's arms and the name of the foundation, and one of the gables in the court carried a carved wooden relief with an inscription about the renewal of 1766. The city's monuments bureau photographed the entrance and the court in January 1938, and the hofje was demolished that year. The building at no. 105 dates from 1938.
