- title: Erasmuspark
  summary: "A park that was never raised: Erasmuspark lies lower than the neighbourhoods around it, at about 2.70 m below NAP, so from every side you walk down into it."
  body: |
    Until the 1920s this was farmland of the municipality of Sloten, a peat-meadow landscape of long ditches. Amsterdam annexed it in 1921 and drew a park with a central pond on its first plans. Because of the economic crisis only 4 hectares in the south were laid out in 1927, entered over a bridge from the Jan van Galenstraat designed by Piet Kramer. The park was named in 1939 after the humanist Erasmus; during the war little happened apart from people cutting trees for firewood.

    The decisive point is that the park was never raised to the level of the surrounding streets. It is a small polder of its own inside a ring ditch, its water level kept by a pumping station, and today lies at about 2.70 m below NAP. In 1960–1961 the park got its present layout: straight paths at right angles around a large lawn, modelled on the paintings of Piet Mondrian. Three concrete bridges by Dick Slebos followed in 1970.

    Look for:
    - the drop as you enter from any side;
    - the Mondrian grid of paths and lawns;
    - sculptures including Han Rädecker's *Leda en de zwaan* (1970), Simona Vergani's marble bear *Orso* (1998) and *Monument voor een verzonken stad* by Berend Peter;
    - *The Miracle Garden* in the south-east corner (separate place on this map);
    - Renze Hettema's bronze resting on two boulders, which stood on the market square of the Gulden Winckelplantsoen until it moved here in 2001;
    - on the quay wall of the Erasmusgracht by the Mercatorstraat, Linda van Boven's small bronze dog;
    - across the Erasmusgracht, the Wachterliedplantsoen, named in 1939 after the wachterlied, a late-medieval love song in which a watchman warns a pair of lovers, and redone in 2010 as a "volcano landscape" with a pavilion, a children's farm and a playground;
    - the Wil de Graaffbrug (1970, rebuilt about 2000), the one bridge round the park not named after Erasmus or his books: it honours a communist, a painter by trade, who campaigned for tenants.
  category: green
  lat: 52.375300
  lng: 4.852400
  address: Jan van Galenstraat / Mercatorstraat
  links:
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Erasmuspark" }
  photos:
    - commons:File:Erasmuspark2.jpg
  sources:
    - https://nl.wikipedia.org/wiki/Erasmuspark
    - Kunstwacht API (sculptures in the park, coordinates)
    - "Kunstwacht API 2135 (Renze Hettema, bronze on two boulders, moved in 2001 from the market square at the Gulden Winckelplantsoen) and 2137 (Linda van Boven, bronze dog on the Erasmusgracht quay wall by the Mercatorstraat; not moved, contrary to the scout)"
    - "https://nl.wikipedia.org/wiki/Wachterliedplantsoen (named 26 July 1939; renovated 2010 as volcano landscape with pavilion, kinderboerderij, playground)"
    - "nl.wikipedia, Wil de Graaffbrug (1970, rebuilt about 2000, named 2002; communist house painter and tenants' campaigner; only bridge round the park not named after Erasmus)"
    - "https://nl.wikipedia.org/wiki/Wil_de_Graaffbrug"
    - "https://nl.wikipedia.org/wiki/Lijst_van_beelden_in_Amsterdam-West"
  nl:
    title: Erasmuspark
    summary: "Een park dat nooit is opgehoogd: het Erasmuspark ligt zo'n 2,70 meter onder NAP, lager dan de wijken eromheen. Van welke kant je ook komt, je loopt naar beneden."
    body: |
      Wie het Erasmuspark in wil, moet eerst omlaag. Het park is nooit opgehoogd tot de hoogte van de straten eromheen. Het is een poldertje op zich: een ringsloot eromheen, een gemaal dat het water op peil houdt, en de grond ligt nu zo'n 2,70 meter onder NAP.

      Tot de jaren twintig was dit boerenland van de gemeente Sloten, veenweide met lange sloten. Na de annexatie in 1921 tekende Amsterdam er een park met een vijver in. Toen kwam de crisis: in 1927 werd alleen een stuk van 4 hectare aan de zuidkant aangelegd, met een brug van Piet Kramer als ingang vanaf de Jan van Galenstraat. In 1939 kreeg het park de naam van de humanist Erasmus. In de oorlog gebeurde er weinig, behalve dat bomen in de kachel verdwenen.

      Het huidige park dateert van 1960-1961. Rechte paden die haaks op elkaar staan, rond een groot grasveld: Mondriaan stond model. In 1970 volgden drie betonnen bruggen van Dick Slebos.

      Let op:
      - de afdaling, bij elke ingang;
      - het Mondriaanraster van paden en gazons;
      - beelden als *Leda en de zwaan* (1970) van Han Rädecker, de marmeren beer *Orso* (1998) van Simona Vergani en van Berend Peter het *Monument voor een verzonken stad*;
      - *The Miracle Garden* in de zuidoosthoek (een aparte plek op deze kaart);
      - het brons van Renze Hettema op twee zwerfkeien; tot de verhuizing in 2001 stond het op het marktplein van het Gulden Winckelplantsoen;
      - het bronzen hondje van Linda van Boven op de kademuur van de Erasmusgracht, bij de Mercatorstraat;
      - aan de overkant van de Erasmusgracht het Wachterliedplantsoen, in 1939 vernoemd naar het wachterlied, een laatmiddeleeuws liefdeslied waarin een wachter twee geliefden waarschuwt, en in 2010 omgebouwd tot 'vulkaanlandschap' met paviljoen, kinderboerderij en speeltuin;
      - de Wil de Graaffbrug (1970, rond 2000 vernieuwd), als enige brug rond het park niet vernoemd naar Erasmus of zijn boeken: hij eert een communist, schilder van beroep, die opkwam voor huurders.
    sources:
      - https://nl.wikipedia.org/wiki/Erasmuspark
      - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/2135
      - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/2137
      - https://nl.wikipedia.org/wiki/Wachterliedplantsoen

- title: The Miracle Garden
  summary: "An 800 m² flower garden that is also an artwork: photographer Elspeth Diederix grows strange, photogenic plants in a corner of Erasmuspark, tended by neighbours and open to all."
  body: |
    The project grew out of *The Studio Garden*, a blog in which the artist and photographer Elspeth Diederix used the garden of her studio as a living laboratory for gardening and flower photography; she even trained as a gardener for it. She won a competition by the foundation Let it Grow that asked for an artwork bringing the world of flowers and plants closer to Amsterdammers.

    The result, laid out in 2017, is a garden of some 800 m² in the south-east corner of Erasmuspark, planted with the most remarkable flowers so that something is blooming all year round. It is the breeding ground for Diederix's *Miracle Series*, photographs that periodically appear on billboards in the city. A group of neighbours does the daily maintenance, and the diversity of plants has made it a haven for bees and butterflies. It was nominated for the Amsterdamprijs voor de Kunst in 2021.

    Look for:
    - whatever is flowering this week: the planting is designed not to have an off-season;
    - insects: the beds are a refuge for bees and butterflies.
