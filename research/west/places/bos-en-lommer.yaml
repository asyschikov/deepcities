  nl:
    title: Eenheid in diversiteit (Saïd Kinos)
    summary: "Een typografische muurschildering met een zorgvuldig kleurverloop op een kopgevel aan de Wiltzanghlaan. Saïd Kinos laat zien hoe sterk uiteenlopende buren toch één hechte buurt vormen."
    body: |
      Kijk goed, want in deze kleurvlakken zitten letters verstopt. Saïd Kinos is een zeer ervaren muralist die vaak abstract en met letters werkt, en hij staat bekend om bonte muren vol lettertypes.

      Dit is een van de vier muren van Muren van West die in 2020 langs de Wiltzanghlaan zijn beschilderd (zie *Tijgermoeders van de Kolenkit* voor het project). Voor de Kolenkitbuurt ging Kinos uit van hoe verschillend de bewoners zijn. Hij ziet er een bonte verzameling mensen in die, hoe ze ook van elkaar verschillen, samen een hechte gemeenschap vormen. Het kleurverloop over de gevel moet wijzen op al het goede dat zich hier onder de oppervlakte afspeelt.

      Let op:
      - de lettervormen die in de abstracte compositie zitten;
      - hoe het kleurverloop over de hele muur van 10 bij 12 meter loopt.
    sources:
      - https://nl.wikipedia.org/wiki/Eenheid_in_diversiteit
      - https://www.buitenkunstamsterdam.nl/Kunstwerken/2691/unity-in-diversity

- title: Stamboom van de buurt (Floor van het Nederend)
  summary: "A 'family tree' for the Kolenkit whose branches carry an Ajax shirt, a watering can, a tagine and an old coal scuttle, the object the whole neighbourhood is named after."
  body: |
    One of the four 2020 Muren van West walls on the Wiltzanghlaan. Illustrator Floor van het Nederend (also behind the murals at the Olympiaplein skatepark) turned residents' personal stories into a *stamboom* (family tree) of objects.

    Each object stands for someone's story: an Ajax shirt for the many footballers, a watering can for the vegetable planters in the garden, a tagine for the many meals residents cook, and an old-fashioned *kolenkit* (coal scuttle), the object the neighbourhood is named after.

    Look for:
    - the coal scuttle, the neighbourhood's emblem;
    - the microphone and headphones, and the basketball: there is a basketball court in front of the flat.
