    - { label: Waternet (2017), url: "https://www.waternet.nl/nieuws/2017/2/bewoners-nemen-initiatief-bij-gemaal-mercatorstraat/" }
    - { label: Het Parool (4 Feb 2017), url: "https://www.parool.nl/amsterdam/gemaal-mercatorstraat-opgeknapt-dankzij-betrokken-buurt~a4458190/" }
  attributes:
    built: "1927"
    architect: Dienst der Publieke Werken
    original_use: Sewage pumping station and electricity substation
  photos:
