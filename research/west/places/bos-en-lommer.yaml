  nl:
    title: Four Peas in a Pod (Iriée Zamblé)
    summary: "Vier reusachtige portretten van bewoners van de Kolenkitbuurt, elk in een eigen kleur. Het eerste werk in de openbare ruimte, en de eerste muur, van een jonge portretschilder die net was afgestudeerd met een doek van 50 bij 35 cm."
    body: |
      Net afgestudeerd, met een eindwerk van 50 bij 35 centimeter, en dan meteen een hele kopgevel. Voor Iriée Zamblé was dit haar eerste werk in de openbare ruimte.

      Het is een van de vier muren die in 2020 voor Muren van West aan de Wiltzanghlaan zijn beschilderd. Zamblé is opgegroeid in Amsterdam-Oost, helemaal aan de overkant van de stad, en kende de Kolenkitbuurt vooral van slecht nieuws, tot ze er ging kijken. Acht kunstenaars stuurden een ontwerp in; het hare werd gekozen.

      Ze zette vier portretten samen in één beeld: een vrouw met hoofddoek die haar arm opsteekt, een zwarte vrouw met haar arm om een witte man, en een jongen die in de Surinaamse vlag is gewikkeld. De kleuren staan voor de vele afkomsten van de bewoners. Op hoogte schilderen zag ze zelf niet zitten, dus dat liet ze aan specialisten over. Ze wilde een werk maken voor iedereen die zich erin herkent, en niet alleen voor wie naar musea en galeries gaat.

      Let op:
      - de vier gezichten en de felle, egale kleurvlakken die ze van elkaar scheiden
      - de Surinaamse vlag
    sources:
      - https://nl.wikipedia.org/wiki/Four_peas_in_a_pod
      - https://www.buitenkunstamsterdam.nl/Kunstwerken/2692/four-peas-in-a-pod

- title: Samen bij De Boeg (Richard Kofi)
  summary: "A 24-metre wall of elderly neighbours, hatched like a pen drawing, watched over by an all-seeing eye: possibly the first mural in the Netherlands with a rollator in it."
  body: |
    Care home De Boeg went up around 1992 on the edge of the Bos en Lommerplein, with an almost blind north wall, apparently in expectation of a neighbour that was never attached to it. When the next block was built in 2009 it kept its distance, leaving an opening to the Bos en Lommerplantsoen and a bare gable in full view.

    In 2022 Muren van West gave that wall to Richard Kofi, a former *Stadstekenaar* (city illustrator) of Amsterdam. He drew on the stories of De Boeg's residents and of the people who use the community centre in the same building, many of them older Amsterdammers. His aim was to give that generation the visibility he felt it lacked. The city's public-art curators think it may be the first mural in the Netherlands to feature a walker. Kofi, who is afraid of heights, left the painting itself to others; the mural was unveiled on 13 July 2022.

    Look for:
    - Kofi's trademark hatching in the people's clothes;
    - the rollator;
    - the "all-seeing eye" at the top, standing for residents' late relatives and friends who still keep an eye on things.
  category: street-art
  lat: 52.376539
  lng: 4.846489
  address: Hoofdweg 495
  links:
    - { label: Buitenkunst Amsterdam, url: "https://www.buitenkunstamsterdam.nl/Kunstwerken/2693/samen-bij-de-boeg" }
    - { label: Stadscuratorium Amsterdam, url: "https://stadscuratorium.nl/en/collectie/samen-bij-de-boe/" }
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Samen_bij_De_Boeg" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q115120631" }
    - { label: De Westkrant (4 Feb 2022), url: "https://www.dewestkrant.nl/bolo-krijgt-meer-regenboogkleuren-op-de-muren/" }
  attributes:
    built: "2022"
    artist: Richard Kofi
  photos:
    - commons:File:2022 Samen bij De Boeg, Asd (2).jpg
    - commons:File:2022 Samen bij De Boeg, Asd (1).jpg
  sources:
    - https://stadscuratorium.nl/en/collectie/samen-bij-de-boe/
