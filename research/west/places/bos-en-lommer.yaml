  nl:
    title: De dames en de muze
    summary: "Vijfhonderd vierkante meter tegels maken van de betonnen steunen onder de A10 een dierentuin: paradijsvogels, hazen en duizenden gouden en blauwe mussen."
    body: |
      Duizenden mussen zwermen hier onder de snelweg, volgens de kunstenaars zelf. Waar de Leeuwendalersweg onder de A10 door loopt, betegelde het duo Berkman en Janssens in 2003 de landhoofden en pijlers van de brug, samen zo'n 500 vierkante meter. Margot Berkman en Eline Janssens werkten van 2000 tot 2010 samen.

      Op de landhoofden staan grote paradijsvogels en hazen, een dier dat vaker opduikt in hun werk. Eromheen fladdert een zwerm kleine mussen in goud en blauw. De pijlers daartussen kregen tegelwerk met patronen naar oosterse ornamenten. Het werk heeft een broertje: in 2007 deed hetzelfde duo iets vergelijkbaars onder de brug van de Rijswijkstraat, ook in de A10, onder de titel Bloemenzee.

      Let op:
      - de zwerm kleine mussen rond de grote dieren
      - de versierde pijlers, die je beter ziet als je loopt dan als je fietst
    sources:
      - https://nl.wikipedia.org/wiki/De_dames_en_de_muze

- title: Les dames et la licorne (tiled entrance)
  summary: "A 16 × 40 m tiled floor and walls under the Bos en Lommerplein parking deck, where deer, swans, hares and leaves run underfoot: by Berkman en Janssens, the duo who also tiled the A10 viaduct."
  body: |
    In the early 2000s the Gulden Winckelplantsoen and the area around the old Bos en Lommerplein were almost entirely rebuilt, with a new complex of shops and a car park on top. For its covered entrance at street level, the duo Margot Berkman and Eline Janssens (*Berkman en Janssens*) designed a hard-wearing tiled floor that continues up the walls, along with the railings.

    The motifs are the duo's familiar repertoire: leaves, swans, deer and hares spread over many tiles, and small birds that each occupy a single tile. The floor alone measures about 16 by 40 metres. For years a daily market ran on the roof above.

    Look for:
    - the deer, swans and hares, each spread over several tiles;
    - the small birds that each fill a single tile;
    - the railings, also by the artists.
