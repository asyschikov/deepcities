    - { label: De Westkrant (14 Aug 2026), url: "https://www.dewestkrant.nl/bos-en-lommer-muurschildering-vrouwenveiligheid-komt-tot-leven/" }
  attributes:
    built: "2026"
    artist: Lucy Beukeboom and Layla Rademaker
  sources:
    - https://www.nhnieuws.nl/nieuws/362527/muurschildering-moord-lisa-amsterdam
    - https://www.dewestkrant.nl/bos-en-lommer-muurschildering-vrouwenveiligheid-komt-tot-leven/
  nl:
    title: Muurschildering vrouwenveiligheid, Admiraal de Ruijterweg
    summary: "Muurschildering (2026) van Lucy Beukeboom en Layla Rademaker op de Admiraal de Ruijterweg 412: een nagedachtenis aan de moord op Lisa en een oproep dat vrouwen 's nachts veilig over straat moeten kunnen fietsen."
    body: |
      "Een muurschildering maken in de straat waar je bent opgegroeid. Voor Lucy Beukeboom (18) is het een droom die uitkomt", schreef NH Nieuws in augustus 2026. Samen met Layla Rademaker (18) maakte ze er haar profielwerkstuk in 6 vwo van. Het idee ontstond na de moord op de 17-jarige Lisa uit Abcoude. "Met het schilderij willen ze uitdragen dat iedere vrouw 's nachts veilig over straat zou moeten kunnen fietsen."

      Drie maanden bleek te kort. "We kregen een mailtje van iemand van de gemeente met meerdere punten waarom het niet mogelijk was om een muurschildering te maken, maar dat mailtje hebben we gedeletet." De subsidie, de toestemming van het Stadscuratorium, groen licht van de VvE en een betaalbare steiger kwamen er uiteindelijk toch. Sinds 12 augustus stonden ze op de steigers op 14 meter hoogte; de eerste twee dagen hielp kunstenaar Sidney Waerts, bekend van de tijgers aan de Wiltzanghlaan, hen op weg (De Westkrant). De officiële opening was op 25 augustus 2026.

      Let op:
      - de fietsende vrouw: "De vrouw die we hier afbeelden, draagt de maan zelfverzekerd met zich mee", aldus Lucy;
      - het kunstwerk beslaat alleen het bovenste deel van de muur; het onderste deel is wit gemaakt.
    sources:
      - https://www.nhnieuws.nl/nieuws/362527/muurschildering-moord-lisa-amsterdam
      - https://www.dewestkrant.nl/bos-en-lommer-muurschildering-vrouwenveiligheid-komt-tot-leven/

- title: Leonardo da Vinci mural, Nieuwpoortkade
  summary: "A gable-high portrait of Leonardo da Vinci on the Leonardo Da Vinci business centre, a reworked Merkelbach & Karsten factory where an artists' collective now works – right next to the De Bloem windmill."
  body: |
    Nieuwpoortkade 1–2, at the corner with the Haarlemmerweg, is the Leonardo Da Vinci Bedrijvencentrum, a business centre in a building originally designed by Benjamin Merkelbach and Charles Karsten for the firm of Willem van Rijn. It has been altered many times, but the rectangular hand of the two Nieuwe Bouwen architects is still visible, including the bridge over the gateway to the inner yard.

    The artists' collective Hellingproof is among the tenants, and one of its members, Miguel Visser, painted a gable-high portrait of the building's namesake on its corner around 2019. Since 2025 the sculpture group *Morgenster* by Arjen Lancel (1995), moved here from the Admiraal Helfrichstraat, stands right in front of it.

    Look for:
    - the portrait, visible from the Haarlemmerweg;
    - the Morgenster group at the foot of the wall;
    - the De Bloem windmill (on this map) a few steps away.
  category: street-art
  lat: 52.384831
  lng: 4.859464
  address: Nieuwpoortkade 1-2
