    summary: "Een rioolgemaal en een gasverdeelstation in zwart-wit tapijt gehuld: tussen de oosterse tapijtmotieven in de tegels van Barbara Broekman op het Gulden Winckelplantsoen zitten een koe en een fiets verstopt."
    body: |
      Kijk goed, want ergens in dit tapijt van tegels staat een koe. En een fiets. Van een afstand lijkt het allemaal abstract, maar Barbara Broekman heeft ze er tussen gesmokkeld.

      Midden op het drukke Gulden Winckelplantsoen staan twee nutsgebouwtjes: een rioolgemaal en een gasverdeelstation. Rond 2020 vroeg stadsdeel West aan Broekman om ze een nieuwe jas te geven. Zij werkt normaal vooral met textiel, en dan vol kleur. Hier zette ze de eeuwenoude tapijttraditie van het Midden-Oosten en Centraal-Azië om in een raster van tegeltjes van tien bij tien centimeter. Klassieke tapijtpatronen staan er naast clichébeelden uit oost en west. Omdat er op het plein al zoveel gebeurt, hield ze het bewust bij wit, grijs en zwart, voor wat rust. De tegels zijn gemaakt bij Winckelmans in het Franse Lomme.

      Let op:
      - de koe en de fiets, verstopt in het ogenschijnlijk abstracte patroon
      - de signatuur 'BB'
    sources:
      - https://nl.wikipedia.org/wiki/Weefpatronen
      - https://www.buitenkunstamsterdam.nl/Kunstwerken/2683/barbara-broekman-bekleding-huisjes

- title: Zuiver (fish on a pumping hut)
  summary: "One fish wrapped around three walls of a grey utility hut on the Erasmusgracht: head on the north side, body on the west, tail on the south: only complete if you walk around it from the water."
  body: |
    A 28 m² concrete hut on the Joos Banckersweg, built in 1988 for the city's energy company and also housing a Waternet sewage pump, was a drab grey box on the Erasmusgracht. In 2020 neighbour and goldsmith Sandrine Diodati proposed brightening it up, and with money from the Bos en Lommer *buurtbudget* (neighbourhood budget) the hut got a mural in 2021, painted by the lettering firm Signpainters.

    The trick is that the hut carries a single fish across three walls: the head on the north side, its flank on the west and the tail on the south. From the Joos Banckersweg you see almost nothing of it; it is meant to be seen from the banks of the Erasmusgracht and from the reed-bed water filter (*helofytenfilter*) in the canal right in front of it.

    Look for:
    - the fish's head, flank and tail as you walk round the hut along the water;
    - the green door with the old energy-company logo.
  category: street-art
  lat: 52.376794
  lng: 4.856675
  address: Joos Banckersweg 41 (Erasmusgracht side)
  links:
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Zuiver_(muurschildering)" }
    - { label: Buurtbudget Bos en Lommer, url: "https://buurtbudget.amsterdam.nl/bos-en-lommer/aanvraag/237" }
    - { label: Signpainters & Co, url: "https://www.signpaintersandco.com/" }
  attributes:
    built: "2021"
    artist: Signpainters & Co (idea by Sandrine Diodati)
  photos:
    - commons:File:2023 Zuiver, Erasmusgracht, Asd (4).jpg
  sources:
    - https://nl.wikipedia.org/wiki/Zuiver_(muurschildering)
  nl:
    title: Zuiver (muurschildering Erasmusgracht)
    summary: "Eén vis om drie muren van een grijs nutshuisje aan de Erasmusgracht: de kop op de noordkant, het lijf op de westkant, de staart op de zuidkant. Compleet zie je hem pas als je er langs het water omheen loopt."
    body: |
      Deze vis zie je pas helemaal als je om het huisje heen loopt. De kop zit op de noordmuur, de flank op de westmuur en de staart op de zuidmuur van een betonnen huisje van 28 vierkante meter aan de Joos Banckersweg. Vanaf die straat zie je er bijna niets van; hij is bedoeld voor wie langs de oevers van de Erasmusgracht loopt, of vanaf het helofytenfilter kijkt, het rietveld dat vlak voor het huisje in de gracht het water zuivert.

      Het huisje werd in 1988 neergezet voor het gemeentelijke energiebedrijf, en er staat ook een rioolpomp van Waternet in. Het was een grauw blok, tot buurvrouw en edelsmid Sandrine Diodati in 2020 voorstelde het op te fleuren. Met geld uit het buurtbudget van Bos en Lommer kreeg het in 2021 een schildering, aangebracht door letterschildersbedrijf Signpainters.

      Let op:
      - kop, flank en staart van de vis als je langs het water om het huisje heen loopt;
      - de groene deur met het oude logo van het energiebedrijf.
    sources:
      - https://nl.wikipedia.org/wiki/Zuiver_(muurschildering)

- title: Colour Connection (Lidewijdepad tunnel)
  summary: "A dark pedestrian tunnel under the A10 lit up with glowing mandalas drawn by some 150 neighbours, linking the Gulden Winckel and Kolenkit neighbourhoods."
  body: |
    The Lidewijdepad tunnel runs under the A10 ring road between the Jephtastraat and the Sinjeur Semeynsstraat. Its regular users found it dark and unsafe. When the tunnel was due to be widened, the city asked three artists for sketch designs, and the people who use the tunnel every day chose *Colour Connection* by artist and designer Nina Rave.

    From June 2019 Rave ran a series of workshops in the neighbourhood in which about 150 residents, young and old, drew mandala-like designs: symmetrical round drawings with repeated motifs. Their drawings were built into the light work, which was finished in 2020. In the words of the city's art curators, it turned the underpass into an inviting, safe connection between the Gulden Winckelbuurt and the Kolenkitbuurt.

    Look for:
    - the individual residents' mandalas among the coloured light;
    - the tunnel after dark, when the work is at its strongest.
  category: street-art
  lat: 52.380878
  lng: 4.846658
  address: Lidewijdepad, under the A10
  links:
    - { label: Stadscuratorium Amsterdam, url: "https://stadscuratorium.nl/en/collectie/colour-connection/" }
    - { label: Buitenkunst Amsterdam, url: "https://www.buitenkunstamsterdam.nl/Kunstwerken/1040/colour-connection" }
  attributes:
    built: "2020"
    artist: Nina Rave
  sources:
    - https://stadscuratorium.nl/en/collectie/colour-connection/
    - Buitenkunst Amsterdam / Kunstwacht API, object 1040 (Dutch description, coordinates)
  nl:
    title: Colour Connection (Lidewijdepadtunnel)
    summary: "Een donkere voetgangerstunnel onder de A10 licht nu op met mandala's die zo'n 150 buurtbewoners tekenden. Het lichtkunstwerk van Nina Rave (2020) verbindt de Gulden Winckelbuurt met de Kolenkitbuurt."
    body: |
      De mensen die er elke dag doorheen moesten, vonden de tunnel donker en onveilig. Nu zitten hun eigen tekeningen in het licht.

      Het Lidewijdepad duikt onder de ringweg A10 door, van de Jephtastraat naar de Sinjeur Semeynsstraat. Toen de tunnel breder zou worden, vroeg de gemeente drie kunstenaars om een schetsontwerp. De vaste gebruikers mochten kiezen, en ze kozen voor *Colour Connection* van kunstenaar en ontwerper Nina Rave.

      Vanaf juni 2019 gaf Rave workshops in de buurt. Ongeveer 150 bewoners, van jong tot oud, tekenden daar mandala-achtige figuren: ronde, symmetrische tekeningen waarin steeds dezelfde motieven terugkomen. Die tekeningen verwerkte zij in het lichtkunstwerk, dat in 2020 klaar was. Volgens de kunstcuratoren van de stad werd de onderdoorgang daarmee een uitnodigende en veilige route tussen de Gulden Winckelbuurt en de Kolenkitbuurt.

      Let op:
      - de losse mandala's van bewoners tussen het gekleurde licht
      - de tunnel na donker, als het werk het sterkst is
    sources:
      - https://www.buitenkunstamsterdam.nl/Kunstwerken/1040/colour-connection

