  nl:
    title: De dames en de muze
    summary: "Tegelkunstwerk (2003) van Berkman en Janssens op de landhoofden en pijlers van de Leeuwendalerswegbrug in de A10: paradijsvogels, hazen en duizenden goudkleurige en blauwe mussen."
    body: |
      *De dames en de muze* is een creatie van Berkman en Janssens, bestaande uit Margot Berkman en Eline Janssens, destijds een kunstenaarsduo (2000-2010). Ze betegelden de landhoofden en brugpijlers van de Leeuwendalerswegbrug; er was een oppervlak van 500 m² te betegelen.

      Het bestaat uit twee delen. De landhoofden kregen afbeeldingen van paradijsvogels (aldus Berkman) en hazen; die laatste komen vaker in het werk van de kunstenaars voor. Ze worden omringd door een flink aantal goudkleurige en blauwe mussen (het duo noemt duizenden). De tussen de landhoofden staande brugpijlers werden eveneens opgevrolijkt door tegelwerk, in dit geval een weergave van oosterse versiermotieven. In 2007 werd een soortgelijk werk onder de titel *Bloemenzee* aangebracht in de Rijswijkstraatbrug, die net als de Leeuwendalerswegbrug in de Rijksweg 10 ligt.

      Let op:
      - de mussen, één vogel per tegel, tussen de grote dieren;
      - de pijlers met oosterse versiermotieven.
    sources:
      - https://nl.wikipedia.org/wiki/De_dames_en_de_muze

- title: Les dames et la licorne (tiled entrance)
  summary: "A 16 × 40 m tiled floor and walls under the Bos en Lommerplein parking deck, where deer, swans, hares and leaves run underfoot – Berkman en Janssens' companion to their A10 viaduct tiles."
  body: |
    In the early 2000s the Gulden Winckelplantsoen and the area around the old Bos en Lommerplein were almost entirely rebuilt, with a new complex of shops and a car park on top. For its covered entrance at street level, the duo Margot Berkman and Eline Janssens (*Berkman en Janssens*) designed a hard-wearing tiled floor that continues up the walls, along with the railings. The title nods to the medieval *Lady and the Unicorn* tapestries in Paris.

    The motifs are the duo's familiar repertoire: leaves, swans, deer and hares spread over many tiles, and small birds that each occupy a single tile. The floor alone measures about 16 by 40 metres. For years a daily market ran on the roof above.

    Look for:
    - the deer surrounded by birds;
    - the one-tile birds, the same trick as under the A10 viaduct (*De dames en de muze*);
    - the railings, also by the artists.
  category: street-art
  lat: 52.378869
  lng: 4.846531
  address: Gulden Winckelplantsoen
