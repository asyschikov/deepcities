    body: |
      Op de hoek van de Bos en Lommerweg en de Willem de Zwijgerlaan staat een vrijheidsboom, een herdenkingsboom en oorlogsmonument uit 1945, geplant op initiatief van de bewoners. Volgens de tekst op de steen werd hij op 27 juni 1945 geplant door R. Saunders, eerste luitenant van de Royal Air Force, ter herinnering aan 5 mei. De gedenksteen staat in het register van Buitenkunst Amsterdam als *Gedenkteken 40/45*.

      Let op:
      - het opschrift: "1940-1945 Vrijheidsboom ter herinnering 5 mei geplant door R. Saunders 1e Ltn. R.A.F. op 27 juni 1945. De buurtbewoners"
