  nl:
    title: Stamboom van de buurt (Floor van het Nederend)
    summary: "Een stamboom voor de Kolenkitbuurt met aan de takken een Ajax-shirt, een gieter, een tajine en een ouderwetse kolenkit, het voorwerp waar de hele buurt naar heet. Muurschildering van Floor van het Nederend uit 2020."
    body: |
      Aan deze stamboom hangen geen namen maar spullen: een Ajax-shirt, een gieter, een tajine en een ouderwetse kolenkit. Elk voorwerp staat voor het verhaal van iemand uit de buurt.

      Het is een van de vier muren die in 2020 voor Muren van West aan de Wiltzanghlaan werden beschilderd. Illustrator Floor van het Nederend, die ook de schilderingen bij het skatepark op het Olympiaplein maakte, verwerkte verhalen van bewoners tot een stamboom van dingen. Het shirt staat voor de vele voetballers, de gieter voor wie groente kweekt in de bakken in de tuin, de tajine voor de vele maaltijden die bewoners koken. En de kolenkit is het voorwerp waar de hele buurt zijn naam aan dankt.

      Let op:
      - de kolenkit, het embleem van de buurt;
      - de microfoon met koptelefoon, en de basketbal: voor de flat ligt een basketbalveldje.
