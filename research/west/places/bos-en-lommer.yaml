  nl:
    title: Gemaal Mercatorstraat
    summary: "Gemaal annex elektriciteitshuisje in Amsterdamse Schoolstijl uit 1927, op de hoek van Jan van Galenstraat en Mercatorstraat, in 2017 in overleg met buurtbewoners gerestaureerd."
    body: |
      Het gemaal annex elektriciteitshuisje is geplaatst op de hoek van de Jan van Galenstraat en de Mercatorstraat. Het ligt daarbij op de zuidwestelijke punt van het Erasmuspark, maar is van het park gescheiden door een ringvaart om het park. Het is gebouwd in 1927 en is afkomstig van de Dienst der Publieke Werken.

      Het uit bak- en natuurstenen legstenen opgetrokken gebouw staat er massief bij. Het is in 2017 in overleg met buurtbewoners gerestaureerd. Aan de voorzijde heeft het twee massieve deuren die nog verwijzen naar het Gemeentelijk Energie Bedrijf, tegenwoordig Liander; Waternet is verantwoordelijk voor het gemaal. De achtergevel bestaat geheel uit baksteen met zes ruimtes om posters op te hangen. Het achterliggende plateau (dak van de gemaalkelder) werd bij de renovatie omgebouwd tot tuintje. Het gemaal pompt nog iedere dag duizenden liters afwater naar de zuiveringsinstallatie van Westpoort, aldus Waternet.

      Let op:
      - de drie Andreaskruizen van Amsterdam in Amsterdamse Schoolstijl;
      - de deuren van het oude energiebedrijf;
      - de posterruimtes en het tuintje achter het gebouw.
    attributes:
      original_use: Rioolgemaal en elektriciteitshuisje
    sources:
      - https://nl.wikipedia.org/wiki/Gemaal_Mercatorstraat

- title: Kostwinner (Constance Wibaut)
  summary: "A stern 1950 sculpture of a breadwinner with his mother and daughter, hidden in a post-war courtyard – a monument to the male-breadwinner model that Amsterdam's own art academy now calls 'not very feminist'."
  body: |
    Between 1947 and 1950 the housing association De Dageraad built low walk-up flats with a shared inner garden here, between the Granidastraat and the Gulden Winckelstraat, to a design by Gerard Jan Rutgers. On the advice of professor Jan Bronner of the Rijksakademie, the association commissioned his former student Constance Wibaut to make a sculpture for the garden. Alderman De Roos unveiled it on 2 June 1950; architect Rutgers came by on 19 June to photograph his buildings and the statue.

    *Kostwinner* (breadwinner), also called *Drie generaties* (three generations), shows a strong, upright man with his right hand on the shoulder of the grandmother and his daughter at his other side. In the 1940s and 50s that was the norm: the man went out to work, the woman stayed home, and a woman who married had to give up her job. Later generations found it dated; the Rijksakademie's 2020 survey of its alumni's public works described it as "not very feminist".

    Look for:
    - the statue through the opening on the south side of the block, along the Leeuwendalerspad – the courtyard itself is closed;
    - how the man is literally placed above and in front of the two women.
  category: curiosities
  lat: 52.380131
  lng: 4.847567
  address: Leeuwendalerspad (courtyard between Granidastraat and Gulden Winckelstraat)
  links:
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Kostwinner_(Constance_Wibaut)" }
