  nl:
    title: Monument 1940-1945 Bos en Lommer (Zittende vrouw)
    summary: "Een vrouw in gedachten, de handen in haar schoot, op een granieten sokkel met regels van Jan Campert en het Wilhelmus. Het oorlogsmonument van Bos en Lommer, in 1957 betaald door de eigen buurtcentra en nog altijd de plek voor herdenkingen."
    body: |
      De buurt betaalde het zelf. De buurtcentra van Landlust en Bos en Lommer haalden het geld op, en op 4 mei 1957 onthulde burgemeester Gijs van Hall het monument in een plantsoentje aan de Hertspieghelweg. Er werden die dag gedichten van Jan Campert voorgedragen. In 1974 schoof het beeld zo'n 75 meter naar het zuiden op, in hetzelfde groen, tot aan de noordkant van de Bos en Lommerweg.

      Beeldhouwster Gerarda Rueter had haar *Zittende vrouw* al eens tentoongesteld, in 1949 op de beeldenexpositie in Sonsbeek: een peinzende figuur, handen in de schoot. Dat eerste beeld was van kalksteen. Het verweerde zo erg dat het in 1976 is vervangen door een gietsel in brons. In 1995 kwam er een betegeld plateau rond de sokkel, zodat de mensen die hier komen herdenken er beter bij kunnen.

      Let op:
      - links op de sokkel Camperts regels uit *Het lied der achttien doden*, beginnend met "Ik wist de taak die ik begon…"
      - rechts een couplet uit het Wilhelmus
      - de naam van de gieterij, Binder-Schmidt, in de grondplaat
    sources:
      - https://nl.wikipedia.org/wiki/Monument_1940-%2745_in_Bos_en_Lommer

- title: Liberty Tree, Bos en Lommerweg
  summary: "A liberty tree planted on 27 June 1945 by an RAF lieutenant, R. Saunders, in memory of 5 May, with a memorial stone at its foot from the local residents."
  body: |
    Seven weeks after the liberation, on 27 June 1945, a *vrijheidsboom* (liberty tree) was planted at the corner of the Bos en Lommerweg and the Willem de Zwijgerlaan, on the residents' initiative. According to the inscription it was planted by an Allied serviceman, R. Saunders, a first lieutenant of the Royal Air Force.

    It is registered as a war memorial and is easy to miss: a low stone among the street trees.

    Look for:
    - the inscription, in Dutch: "1940-1945 Vrijheidsboom ter herinnering 5 mei geplant door R. Saunders 1e Ltn. R.A.F. op 27 juni 1945. De buurtbewoners" (liberty tree in memory of 5 May, planted by R. Saunders, 1st Lt. RAF, on 27 June 1945; the local residents)
