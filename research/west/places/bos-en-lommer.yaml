  nl:
    title: Samen bij De Boeg (Richard Kofi)
    summary: "Een muur van 24 meter vol oudere buren, getekend in fijne arceerlijntjes, met bovenin een alziend oog. Misschien wel de eerste muurschildering in Nederland waar een rollator op staat."
    body: |
      Een rollator op een muurschildering: de kunstcuratoren van de stad denken dat dit weleens de eerste in Nederland kan zijn.

      De muur zelf was een restant. Woonzorgcentrum De Boeg verrees rond 1992 aan de rand van het Bos en Lommerplein, met een noordgevel waar vrijwel geen raam in zit, vermoedelijk omdat men rekende op een buurpand dat ertegenaan zou komen. Dat buurpand kwam er pas in 2009, en het hield afstand. Er bleef een doorgang naar het Bos en Lommerplantsoen open, met een kale gevel die iedereen kon zien.

      In 2022 kreeg Richard Kofi, ooit Stadstekenaar van Amsterdam, die muur toegewezen in het kader van Muren van West. Hij ging uit van de verhalen van bewoners van De Boeg en van mensen die het buurthuis in hetzelfde gebouw bezoeken, vaak Amsterdammers op leeftijd. Die generatie wilde hij de zichtbaarheid geven die ze volgens hem te weinig krijgt. Zelf de hoogte in ging Kofi niet: hij heeft hoogtevrees, dus anderen brachten het schilderwerk aan. Op 13 juli 2022 werd de muur onthuld.

      Let op:
      - de arcering waar Kofi om bekendstaat, in de kleren van de mensen;
      - de rollator;
      - het "alziend oog" bovenaan, dat staat voor overleden familie en vrienden van de bewoners die nog steeds over hen waken.
    sources:
      - https://nl.wikipedia.org/wiki/Samen_bij_De_Boeg
      - https://www.buitenkunstamsterdam.nl/Kunstwerken/2693/samen-bij-de-boeg

- title: Het Toverbos (Peim van der Sloot)
  summary: "9,750 sponged dots on a blank gable at the end of the Rijpgracht make an 'enchanted forest' full of hidden animals, a mural designed to be veiled and revealed by the alder tree in front of it."
  body: |
    When the street numbers were handed out here, De Rijpstraat was meant to start at the Willem de Zwijgerlaan. Plans changed: the first stretch became the wider De Rijpgracht, the building line had to jump, and De Rijpstraat 125 was left with a tall, plastered blind wall looking straight down the canal. Residents asked for a mural on it, and in summer 2022 it became part of Muren van West.

    Because the leaves of an alder planted in 2005 come and go in front of the wall, the district and the city's art curators chose more abstract painters for this site. Peim van der Sloot, who had his studio around the corner, won with a pointillist collage of nature and animals, symbols for local heroes. In his words, the trees and canal give the spot an "oasis feeling" in the middle of the city: in summer it is all green, and the further the year goes, the more of the painting is revealed. He applied some 9,750 dots with sponges dipped in paint. Characters from the area (the cat lady, a resident called Vos, the man shuffling behind his rollator) hide in the yellow ground, alongside the *Bremen Town Musicians*.

    Look for:
    - the animals that appear in the dots when you stand back;
    - the view of the wall from the Willem de Zwijgerlaan, straight along the Rijpgracht;
    - the alder's changing shadow on the painting.
