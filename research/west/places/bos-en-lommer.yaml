    - { label: Beeldbank Amsterdam (1950), url: "https://archief.amsterdam/beeldbank/detail/029b426b-5989-866a-fa20-a8641cd1ddff" }
  attributes:
    built: 1949–1950
    artist: Constance Wibaut
  photos:
    - commons:File:2020 Kostwinner (Constance Wibaut) (2).jpg
    - commons:File:2020 Kostwinner (Constance Wibaut) (7).jpg
  sources:
