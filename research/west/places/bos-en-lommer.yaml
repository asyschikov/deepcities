  nl:
    title: Zeeslagenkaart (Solebayplein)
    summary: "Een houten zeekaart, ingelaten in een ronde stenen bank, met de zeeslagen waarnaar de straten van de Gibraltarbuurt heten, compleet met wegduikende walvissen zoals op 17e-eeuwse kaarten."
    body: |
      Op dit pleintje kun je de straatnamen van de buurt op een zeekaart terugvinden. De straten van de Gibraltarbuurt in Landlust zijn vernoemd naar zeeslagen, waaronder Solebay en Kijkduin. De Solebaystraat kreeg haar naam in 1933, genoemd naar de zeeslag bij Solebay op 7 juni 1672.

      Het kleine plein zonder officiële naam, waar Solebaystraat en Bos en Lommerweg op de Haarlemmerweg uitkomen, was vroeger dichtgegroeid, en bewoners voelden zich er niet veilig. De gemeente vroeg architect en kunstenaar Lobke Alkemade, die eerder pleinen in Amsterdam-Oost had heringericht, het opnieuw aan te pakken. Ze maakte het open, met bankjes en in het midden een grote ronde stenen zitrand, met daarin een in hout gesneden kaart van de zeeslagen achter de straatnamen, getekend als een kaart uit de zeventiende eeuw.

      Let op:
      - de zeeslagen op de kaart (Solebay, Gibraltar, Doggersbank, Kijkduin, Livorno) en de straatnaambordjes om je heen;
      - de wegduikende walvissen, zoals op oude zeekaarten;
      - aan de zuidkant van het plein het Amsterdamse School-blok van Gerrit Jan Rutgers uit 1934-1935 (Haarlemmerweg 507-531).
    sources:
      - https://nl.wikipedia.org/wiki/Solebayplein

- title: Gemaal Mercatorstraat
  summary: "A 1927 Amsterdam School pumping station and electricity hut at the corner of Erasmuspark, restored in 2017 with its neighbours involved. It still pumps thousands of litres a day, and its roof is now a little garden."
  body: |
    The city's Public Works department built this squat brick-and-stone building in 1927 at the corner of the Jan van Galenstraat and the Mercatorstraat, on the south-western tip of Erasmuspark but separated from it by the park's ring ditch. It combines a sewage pumping station with an electricity substation, which explains the two heavy doors that still refer to the old municipal energy company.

    In 2017 Waternet and Liander restored it in consultation with local residents, who had taken the initiative for the surroundings. The back wall was given six frames for posters, and the flat top of the pump cellar behind the building was turned into a small garden. According to Waternet the pumps still move thousands of litres of waste water every day to the treatment plant in Westpoort.

    Look for:
    - the energy-company doors on the front;
    - the poster frames and the garden on the roof of the pump cellar at the back.
  category: curiosities
  lat: 52.373183
  lng: 4.850025
  address: Jan van Galenstraat / Mercatorstraat
  links:
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Gemaal_Mercatorstraat" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q39336788" }
    - { label: Waternet (2017), url: "https://www.waternet.nl/nieuws/2017/2/bewoners-nemen-initiatief-bij-gemaal-mercatorstraat/" }
    - { label: Het Parool (4 Feb 2017), url: "https://www.parool.nl/amsterdam/gemaal-mercatorstraat-opgeknapt-dankzij-betrokken-buurt~a4458190/" }
  attributes:
    built: "1927"
    architect: Dienst der Publieke Werken
    original_use: Sewage pumping station and electricity substation
  photos:
    - commons:File:Mercatorstraat, elektriciteitshuisje in de stijl van de Amsterdamse School foto 1.jpg
  sources:
    - https://nl.wikipedia.org/wiki/Gemaal_Mercatorstraat
    - "https://web.archive.org/web/20170811182811/https://www.parool.nl/amsterdam/gemaal-mercatorstraat-opgeknapt-dankzij-betrokken-buurt~a4458190/"
    - "https://web.archive.org/web/20220817185758/https://www.waternet.nl/nieuws/2017/2/bewoners-nemen-initiatief-bij-gemaal-mercatorstraat/"
  nl:
    title: Gemaal Mercatorstraat
    summary: "Een gemaal met elektriciteitshuisje in Amsterdamse School-stijl uit 1927, op de hoek van het Erasmuspark. In 2017 opgeknapt met de buren erbij. Het pompt nog elke dag duizenden liters weg, en op het dak van de kelder groeit nu een tuintje."
    body: |
      Elke dag gaan hier duizenden liters afvalwater doorheen, op weg naar de zuivering in Westpoort. Dat zegt Waternet, en je zou het niet zeggen van dit gedrongen gebouwtje.

      Publieke Werken zette het in 1927 neer, van baksteen en natuursteen, op de hoek van de Jan van Galenstraat en de Mercatorstraat. Het ligt op de zuidwestpunt van het Erasmuspark, maar hoort er eigenlijk niet bij: de ringsloot rond het park houdt het erbuiten. Binnen zitten twee dingen: een rioolgemaal en een elektriciteitshuisje. Vandaar de twee zware deuren aan de voorkant, die nog naar het oude gemeentelijke energiebedrijf verwijzen.

      In 2017 knapten Waternet en Liander het op, in overleg met buurtbewoners, die het initiatief voor de omgeving hadden genomen. De achtermuur kreeg zes lijsten voor posters, en het platte dak van de pompkelder achter het gebouw werd een klein tuintje.

      Let op:
      - de deuren van het energiebedrijf aan de voorkant
      - de posterlijsten en het tuintje op het dak van de pompkelder aan de achterkant
    attributes:
      original_use: Rioolgemaal en elektriciteitshuisje
    sources:
      - https://nl.wikipedia.org/wiki/Gemaal_Mercatorstraat

- title: Kostwinner (Constance Wibaut)
  summary: "A sturdy 1950 sculpture of a breadwinner with a grandmother and his daughter, hidden in a post-war courtyard: a statue from the male-breadwinner era that the Rijksakademie, where the sculptor trained, called 'not very feminist' in 2020."
  body: |
    Between 1947 and 1950 the housing association De Dageraad built low walk-up flats with a shared inner garden here, between the Granidastraat and the Gulden Winckelstraat, to a design by Gerard Jan Rutgers. On the advice of professor Jan Bronner of the Rijksakademie, the association commissioned his former student Constance Wibaut to make a sculpture for the garden. Alderman De Roos unveiled it on 2 June 1950; architect Rutgers came by on 19 June to photograph his buildings and the statue.

    *Kostwinner* (breadwinner), also called *Drie generaties* (three generations), shows a strong, upright man with his right hand on the shoulder of the grandmother and his daughter at his other side. In the 1940s and 50s that was the norm: the man went out to work, the woman stayed home, and a woman who married had to give up her job. Later generations found it dated; the Rijksakademie's 2020 project *Rijksakademie op de kaart* described it as "not very feminist".

    Look for:
    - the statue through the opening on the south side of the block, along the Leeuwendalerspad (the courtyard itself is closed);
    - how far forward the man is put, ahead of the two women.
  category: curiosities
  lat: 52.380131
  lng: 4.847567
  address: Leeuwendalerspad (courtyard between Granidastraat and Gulden Winckelstraat)
  links:
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Kostwinner_(Constance_Wibaut)" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q104758951" }
