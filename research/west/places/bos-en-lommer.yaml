  nl:
    title: Leonardo da Vinci (Nieuwpoortkade)
    summary: "Gevelhoge muurschildering van Miguel Visser met een portret van Leonardo da Vinci op het Leonardo Da Vinci Bedrijvencentrum, een basisontwerp van Merkelbach en Karsten, op de hoek van Nieuwpoortkade en Haarlemmerweg."
    body: |
      Nieuwpoortkade 1 en 2 is het Leonardo Da Vinci Bedrijvencentrum, een basisontwerp van Benjamin Merkelbach en Charles Karsten, gebouwd voor de "NV Maatschappij tot Voortzetting van de zaken der firma Willem van Rijn". Het werd in de loop van de jaren steeds aangepast, maar laat nog duidelijk de hand van de ontwerparchitecten zien (rechthoekig). Het gebouw heeft een binnenterrein; over de poort aan de Nieuwpoortkade is een luchtbrug gebouwd.

      In het bedrijvencentrum is onder meer Hellingproof gevestigd, een kunstenaarscollectief, waarvan Miguel Visser een gevelhoge muurschildering heeft gemaakt met een portret van Leonardo da Vinci. Vanaf 2025 staat voor diens neus het ensemble *Morgenster* van Arjen Lancel.

      Let op:
      - het portret, goed zichtbaar vanaf de Haarlemmerweg;
      - het beeldensemble *Morgenster* aan de voet van de gevel;
      - molen De Bloem, het enige monument aan de kade, op een paar stappen afstand.
    sources:
      - https://nl.wikipedia.org/wiki/Nieuwpoortkade

- title: De dames en de muze (A10 viaduct tiles)
  summary: "Five hundred square metres of tiles turn the concrete supports of the A10 into a menagerie of birds of paradise, hares and thousands of gold and blue sparrows."
  body: |
    Where the Leeuwendalersweg passes under the A10 ring road, the artist duo Berkman en Janssens – Margot Berkman and Eline Janssens, who worked together from 2000 to 2010 – tiled the bridge abutments and piers in 2003, about 500 m² in all.

    The abutments carry large birds of paradise and hares, a recurring motif in the duo's work, surrounded by a swarm of small golden and blue sparrows – "thousands", according to the artists. The piers between them got tiled patterns based on oriental ornament. It is one of a pair: in 2007 the same duo did a similar job, *Bloemenzee*, under the Rijswijkstraat viaduct further south on the A10, and in 2004 they tiled the shopping-centre entrance on the Gulden Winckelplantsoen (see *Les dames et la licorne*).

    Look for:
    - the single sparrows, one per tile, scattered between the big animals;
    - the ornamental piers, best seen walking through rather than cycling.
  category: street-art
  lat: 52.379417
  lng: 4.844444
  address: Leeuwendalersweg, under the A10
