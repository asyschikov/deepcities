  nl:
    title: Tijgermoeders van de Kolenkit (Sidney Waerts)
    summary: "Vier tijgers sluipen door een stadsgezicht in sepia, op een kopgevel in de Kolenkit. Sidney Waerts schilderde ze als eerbetoon aan de 'tijgermoeders': vier buurtvrouwen die een oogje in het zeil houden en helpen bij buurtinitiatieven."
    body: |
      Achter de tijgers staat een flat die er niet meer is. Waerts schilderde het gebouw dat aan de overkant van de laan stond, in spiegelbeeld; bij de vernieuwing van de wijk ging het tegen de grond.

      In 2020 streek het project Muren van West neer in de Kolenkitbuurt, een wijk uit de jaren veertig en vijftig vol portiekflats, die in de jaren 2000 flink is opgeknapt en deels gesloopt en herbouwd. Vier kunstenaars kregen elk een kopgevel aan de Wiltzanghlaan (deze meet 10 bij 12 meter). Hun ontwerpen kwamen voort uit verhalen van bewoners; Kallenbach Gallery werkte mee aan het project.

      De Haarlemse schilder Sidney Waerts haalde zijn idee bij de *Tijgermoeders van de Kolenkit*: vier vrouwen die zichzelf de ogen en oren van de wijk noemen en die sleutelfiguren zijn in het buurtwerk. Hij maakte er tijgers van, op weg door een deels stedelijk landschap. Zoals zo vaak bij Waerts zijn de kleuren nostalgisch sepia.

      In 2026 kwam Waerts terug naar Bos en Lommer, om twee jonge vrouwen op weg te helpen met hun muurschildering over de veiligheid van vrouwen aan de Admiraal de Ruijterweg.

      Let op:
      - de signatuur op de muur
      - het gespiegelde spookbeeld van de gesloopte flat op de achtergrond
    sources:
      - https://nl.wikipedia.org/wiki/Tijgervrouwen
      - https://www.buitenkunstamsterdam.nl/Kunstwerken/2689/tijgers-van-de-kolenkit

- title: Unity in Diversity (Saïd Kinos)
  summary: "A typographic mural in a careful colour gradient on a Wiltzanghlaan gable, by the veteran muralist Saïd Kinos, about how many different people still make one close community."
  body: |
    One of the four Muren van West walls painted along the Wiltzanghlaan in 2020 (see *Tiger Mothers of the Kolenkit* for the project). Saïd Kinos is a very experienced muralist who often works abstractly and with type, known for colourful walls full of letters and fonts.

    For the Kolenkitbuurt he worked from the sheer variety of its residents: in his words "a collection of very different individuals who, despite all their differences, form a close-knit community". The gradient of colour across the wall is meant to point at the many good things that happen below the surface of the neighbourhood.

    Look for:
    - the letterforms hidden in the abstract composition;
    - how the colour gradient runs across the whole 10 × 12 m wall.
