    summary: "Een tegelvloer van 16 bij 40 meter die de muren op loopt, onder het parkeerdek aan het Bos en Lommerplein: herten, zwanen, hazen en bladeren onder je voeten. Gemaakt door Berkman en Janssens, die ook het A10-viaduct betegelden."
    body: |
      Hier loop je over herten, zwanen en hazen. Rond het begin van deze eeuw werden het Gulden Winckelplantsoen en de omgeving van het oude Bos en Lommerplein bijna helemaal opnieuw gebouwd, met een nieuw complex van winkels en daarbovenop een parkeergarage. Voor de overdekte ingang op straatniveau ontwierp het duo Margot Berkman en Eline Janssens (Berkman en Janssens) een slijtvaste tegelvloer die gewoon tegen de muren omhoog loopt, en ook het hekwerk.

      De beelden komen uit hun bekende repertoire: bladeren, zwanen, herten en hazen die over een hele reeks tegels zijn uitgespreid, en kleine vogeltjes die ieder precies één tegel beslaan. Alleen de vloer al is zo'n 16 bij 40 meter. Op het dak erboven werd jarenlang dagelijks markt gehouden.

      Let op:
      - de herten, zwanen en hazen, elk verdeeld over meerdere tegels;
      - de vogeltjes die elk één tegel vullen;
      - het hekwerk, ook van de kunstenaars.
    sources:
      - https://nl.wikipedia.org/wiki/Les_dames_et_la_licorne

- title: Weefpatronen (tiled utility huts)
  summary: "A sewage pump and a gas station dressed as black-and-white carpets: Barbara Broekman's tiles on the Gulden Winckelplantsoen hide a cow and a bicycle among Middle Eastern rug patterns."
  body: |
    In the middle of the busy Gulden Winckelplantsoen stand two utility buildings: a sewage pumping station and a gas distribution station. Around 2020 stadsdeel West asked Barbara Broekman to give them a new skin.

    Broekman specialises in textile works full of colour. Here she translated the centuries-old carpet traditions of the Middle East and Central Asia into a grid of 10 × 10 cm tiles, mixing classic rug patterns with clichéd images from Eastern and Western culture. Because the square is already so busy, she deliberately kept to white, grey and black to bring calm. The tiles were made by Winckelmans in Lomme, France.

    Look for:
    - the cow and the bicycle hidden in the seemingly abstract pattern;
    - the "BB" signature.
