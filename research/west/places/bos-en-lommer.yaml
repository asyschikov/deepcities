    - { label: De Westkrant (14 Aug 2026), url: "https://www.dewestkrant.nl/bos-en-lommer-muurschildering-vrouwenveiligheid-komt-tot-leven/" }
  attributes:
    built: "2026"
    artist: Lucy Beukeboom and Layla Rademaker
  sources:
    - https://www.nhnieuws.nl/nieuws/362527/muurschildering-moord-lisa-amsterdam
    - https://www.dewestkrant.nl/bos-en-lommer-muurschildering-vrouwenveiligheid-komt-tot-leven/
  nl:
    title: Muurschildering vrouwenveiligheid, Admiraal de Ruijterweg
    summary: "Een vrouw op de fiets die zelfverzekerd de maan meedraagt, hoog op een muur aan de Admiraal de Ruijterweg. Twee achttienjarigen maakten haar in augustus 2026, na de moord op Lisa: vrouwen moeten 's nachts veilig naar huis kunnen fietsen."
    body: |
      Begin er niet aan, kregen ze te horen: zo'n muurschildering regelen duurt drie jaar. Lucy Beukeboom en Layla Rademaker deden het toch.

      Lucy groeide op op een steenworp afstand van deze muur. Zij en haar vriendin Layla waren allebei zeventien toen Lisa, een meisje van zeventien uit Abcoude, in 2025 werd vermoord. Volgens hen liet die zaak zien hoe absurd het is dat vrouwen nog altijd niet veilig door de stad kunnen fietsen. Ze ontwierpen een schildering over de veiligheid van vrouwen, en maakten van de vraag hoe je zoiets op een muur krijgt, en of dat binnen drie maanden lukt, hun profielwerkstuk.

      Drie maanden bleek te kort. De waarschuwingen legden ze naast zich neer, en ze kwamen thuis met subsidie, goedkeuring van het Stadscuratorium en van de VvE, en een steiger die ze konden betalen. Vanaf 12 augustus 2026 stonden ze op veertien meter hoogte te schilderen; de eerste twee dagen hielp Sidney Waerts, de maker van de tijgers aan de Wiltzanghlaan. Op 25 augustus 2026 was de opening.

      Let op:
      - de vrouw op de fiets, die de maan zelfverzekerd meedraagt: 'Zo zou het moeten zijn', aldus Lucy;
      - de schildering vult alleen het bovenste deel van de muur; de onderkant is helemaal wit gemaakt.
    sources:
      - https://www.nhnieuws.nl/nieuws/362527/muurschildering-moord-lisa-amsterdam
      - https://www.dewestkrant.nl/bos-en-lommer-muurschildering-vrouwenveiligheid-komt-tot-leven/

- title: Leonardo da Vinci mural, Nieuwpoortkade
  summary: "A gable-high portrait of Leonardo da Vinci on the Leonardo Da Vinci business centre, a reworked Merkelbach & Karsten factory where an artists' collective now works, right next to the De Bloem windmill."
  body: |
    Nieuwpoortkade 1–2, at the corner with the Haarlemmerweg, is the Leonardo Da Vinci Bedrijvencentrum, a business centre in a building originally designed by Benjamin Merkelbach and Charles Karsten for the firm of Willem van Rijn. It has been altered many times, but the rectangular hand of the two Nieuwe Bouwen architects is still visible, including the bridge over the gateway to the inner yard.

    The artists' collective Hellingproof is among the tenants, and one of its members, Miguel Visser, painted a gable-high portrait of the building's namesake on it around 2019. Since 2025 the sculpture group *Morgenster* by Arjen Lancel (1995), moved here from the Admiraal Helfrichstraat, stands right in front of it.

    Look for:
    - the portrait, visible from the Haarlemmerweg;
    - the Morgenster group at the foot of the wall;
    - the De Bloem windmill (on this map) a few steps away.
