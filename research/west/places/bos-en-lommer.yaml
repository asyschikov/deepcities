  nl:
    title: Four Peas in a Pod (Iriée Zamblé)
    summary: "Muurschildering op de hoek van de Majoor Fransweg en de Wiltzanghlaan (2020): Iriée Zamblé verbeeldde portretten van buurtbewoners uit de Kolenkitbuurt – haar eerste grote muurschildering ooit."
    body: |
      *Four peas in a pod* is een muurschildering van tien bij twaalf meter op de hoek van de Majoor Fransweg en de Wiltzanghlaan, een van de vier schilderingen die in 2020 in het kader van Muren van West aan de Wiltzanghlaan werden gezet.

      Voor Iriée Zamblé was dit totaal nieuw werk: ze was zojuist afgestudeerd met een werk van 50 bij 35 cm, en dit was haar eerste werk in de openbare ruimte. Ze heeft vier portretten bij elkaar gephotoshopt: een vrouw met hoofddoek met opgeheven arm, een zwarte vrouw die haar arm om een witte man heeft geslagen en een jongen gehuld in de Surinaamse vlag. Volgens Buitenkunst Amsterdam vertegenwoordigt het kleurgebruik "de diversiteit in verschillende afkomsten; representatie die Zamblé zichtbaar wil maken."

      Zamblé groeide op aan de andere kant van de stad (Amsterdam-Oost) en hoorde de negatieve berichtgeving aan. Ze maakte een werk voor iedereen die zich erin kan of wil herkennen, niet alleen voor museum- of galeriepubliek. Het werk kwam naar voren uit inzendingen van acht kunstenaars; het daadwerkelijk uitvoeren liet ze aan specialisten over.

      Let op:
      - de vier portretten en de vlakke kleuren die ze van elkaar scheiden;
      - de Surinaamse vlag.
    sources:
      - https://nl.wikipedia.org/wiki/Four_peas_in_a_pod
      - https://www.buitenkunstamsterdam.nl/Kunstwerken/2692/four-peas-in-a-pod

- title: Samen bij De Boeg (Richard Kofi)
  summary: "A 24-metre wall of elderly neighbours, hatched like a pen drawing, watched over by an all-seeing eye – possibly the first mural in the Netherlands with a rollator in it."
  body: |
    Care home De Boeg went up around 1992 on the edge of the Bos en Lommerplein, with an almost blind north wall – apparently in expectation of a neighbour that was never attached to it. When the next block was built in 2009 it kept its distance, leaving an opening to the Bos en Lommerplantsoen and a bare gable in full view.

    In 2022 Muren van West gave that wall to Richard Kofi, a former *Stadstekenaar* (city illustrator) of Amsterdam. He drew on the stories of De Boeg's residents and of the people who use the community centre in the same building, many of them older Amsterdammers. His aim was to give that generation the visibility it rarely gets in public art. The city's public-art curators think it may be the first mural in the Netherlands to feature a walker. Kofi, who is afraid of heights, left the painting itself to others; the mural was unveiled on 13 July 2022.

    Look for:
    - Kofi's trademark hatching in the people's clothes;
    - the rollator;
    - the "all-seeing eye" at the top, standing for residents' late relatives and friends who still keep an eye on things.
  category: street-art
  lat: 52.376539
  lng: 4.846489
  address: Hoofdweg 495
  links:
