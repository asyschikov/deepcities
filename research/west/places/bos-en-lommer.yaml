  nl:
    title: Leonardo da Vinci (Nieuwpoortkade)
    summary: "Een gevelhoge Leonardo da Vinci op het Leonardo Da Vinci Bedrijvencentrum, een vaak verbouwde fabriek van Merkelbach en Karsten waar nu onder meer een kunstenaarscollectief zit. Molen De Bloem staat om de hoek."
    body: |
      Een gebouw dat Leonardo Da Vinci heet, kreeg rond 2019 ook zijn gezicht: een portret van de meester zelf, zo hoog als de gevel. Het is geschilderd door Miguel Visser, lid van kunstenaarscollectief Hellingproof, dat een van de huurders is.

      Het gebouw zelf, Nieuwpoortkade 1–2 op de hoek met de Haarlemmerweg, heeft een eigen verhaal. Benjamin Merkelbach en Charles Karsten ontwierpen het voor de firma Willem van Rijn. Sindsdien is er telkens aan verbouwd, maar het rechthoekige handschrift van de twee architecten van het Nieuwe Bouwen is nog goed te zien. Kijk ook naar de luchtbrug boven de poort naar het binnenterrein. Tegenwoordig is het een bedrijvencentrum.

      Sinds 2025 heeft Leonardo gezelschap. Recht voor de muur staat Morgenster, een beeldengroep van Arjen Lancel uit 1995 die eerst aan de Admiraal Helfrichstraat stond.

      Let op:
      - het portret, te zien vanaf de Haarlemmerweg
      - de groep Morgenster aan de voet van de muur
      - molen De Bloem (ook op deze kaart), een paar stappen verderop
    sources:
      - https://nl.wikipedia.org/wiki/Nieuwpoortkade

- title: De dames en de muze (A10 viaduct tiles)
  summary: "Five hundred square metres of tiles turn the concrete supports of the A10 into a menagerie of birds of paradise, hares and thousands of gold and blue sparrows."
  body: |
    Where the Leeuwendalersweg passes under the A10 ring road, the artist duo Berkman en Janssens (Margot Berkman and Eline Janssens, who worked together from 2000 to 2010) tiled the bridge abutments and piers in 2003, about 500 m² in all.

    The abutments carry large birds of paradise and hares, a recurring motif in the duo's work, surrounded by a swarm of small golden and blue sparrows: "thousands", according to the artists. The piers between them got tiled patterns based on oriental ornament. It is one of a pair: in 2007 the same duo did a similar job, *Bloemenzee*, under the Rijswijkstraat viaduct, also on the A10.

    Look for:
    - the swarm of small sparrows around the big animals;
    - the ornamental piers, best seen walking through rather than cycling.
