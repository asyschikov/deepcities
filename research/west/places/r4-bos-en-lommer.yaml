  nl:
    title: Opstandingskerk (Kolenkit)
    summary: "De NH Opstandingskerk, bijgenaamd de 'Kolenkit', is een verdiepingskerk uit 1956 van Marius Duintjer: een kerkzaal met eronder een wijkcentrum. De bijnaam, omdat de toren daar sprekend op leek, kreeg landelijke bekendheid."
    body: |
      De Opstandingskerk, bijgenaamd de 'Kolenkit', is een verdiepingskerk uit 1956 en staat in de Amsterdamse wijk Bos en Lommer. Het is de tweede van zes naoorlogse Nederlandse Hervormde kerken van de bekende architect en latere hoogleraar bouwkunde ir. Marius Duintjer. Het was het eerste gebouw in dit deel van de wijk. Door de vrije ligging, de hoogteverschillen in en om het gebouw en vooral de bijzondere toren was de kerk prominent aanwezig en groeide zij uit tot het icoon van de wijk. De bijnaam 'Kolenkit', omdat de toren daar sprekend op leek, kreeg landelijke bekendheid. De naam werd zo doorgewinterd dat de omliggende buurt naar die bijnaam vernoemd werd: Kolenkitbuurt.

      De kerk wilde naast een religieuze ook een maatschappelijke rol vervullen, als ontmoetingsplek voor de vele jonge gezinnen uit de buurt. Duintjer hield nog vast aan de typologie van een traditionele kerk met toren, maar bouwde onder de kerkzaal een souterrain, waarin een wijkcentrum werd gevestigd. De kerk is opgetrokken uit beton en staal, met buitenmuren van rode baksteen in Vlaams metselverband. De hoofdvorm, gevelindeling en detaillering van de kerk zijn zeer gaaf bewaard.

      De goede zichtbaarheid ging steeds meer verloren, eerst door de bouw van het massieve GAK-gebouw, daarna door de verhoogde ongelijkvloerse kruising van de Bos en Lommerweg met de Rijksweg 10 en in de 21e eeuw door stadsverdichting rondom die kruising. In 2021 kwam de kerk door speciale verlichting weer in de spotlight te staan en kreeg ze een kunstzinnige Fontein Kolenkit voor de deur.

      Let op:

      - de karakteristieke kolenkitvormige klokkentoren op de zuidwesthoek, met de ver uitkragende dakgoot die als een waterspuwer functioneert;
      - de harmonicavormige, puntige buitengevels van de kerkzaal met verticale glasstroken;
      - de steile en hoge trap met bordes, die een zekere monumentaliteit verleent aan de hoofdentree;
      - de pastorie aan de noordzijde, twee verdiepingen hoog onder een plat dak, via een iets verlaagd tussenlid op beide niveaus met de kerk verbonden;
      - een paar minuten lopen westwaarts, op het Ernest Staesplein, de bronzen Waterbuffel van Fioen Blaisse, een buffel die je vanaf de bovenkant van de poten ziet. Blaisse kreeg in 1998 de Singerprijs voor haar hele werk; in Buitenveldert staan drie waterbuffels van haar.
    attributes:
      original_use: Kerk en pastorie
    sources:
      - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/1874

- title: Former ULO school, Erik de Roodestraat 18
  summary: A Bossche School secondary school by Evers & Sarlemijn with a Roman-style atrium hall, a courtyard fountain with a bronze by A. Teeuwisse and a painted ceiling by Caveto.
  body: |
    This former ULO school, commissioned by the Broeders van Maastricht, is part of the Catholic ensemble around the Sint-Josephkerk: church, old people's homes, kindergarten and the Franciscus- and Juliaschool. Together they form the centre of the neighbourhood. The ensemble's plans of 1934 and 1944 show the post-war shift towards the idea of a neighbourhood centre.

    A. Evers and G.J.M. Sarlemijn, among the leading architects of the Bossche School, designed it in 1954. The style looked to classical proportions, and here that goes further than usual. The entrance hall is laid out as an atrium and opens onto a courtyard with a fountain, which the city links directly to classical Roman architecture. Both the main form and the details are well preserved.

    The art was made for the building: a bronze sculpture by A. Teeuwisse in the courtyard fountain, and a ceiling in the school hall painted by Caveto (J.J.M. Dohmen). From the street you mainly see the sober, carefully proportioned brick volume. The atrium and courtyard are inside.

    Look for:
    - on the little square along the Erik de Roodestraat, Marieke Bolhuis's *Stoere Bloemen* (Tough Flowers, 2023): three children with flower buds for heads, in bright clothes and platform shoes, made with neighbours and children in workshops. Boy or girl is left open on purpose: everyone may be who they are.
  category: schools
  lat: 52.373429
  lng: 4.844772
  address: Erik de Roodestraat 18
