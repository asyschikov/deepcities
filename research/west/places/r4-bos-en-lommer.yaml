    rank: Okay
  photos:
    - commons:File:Solebaystraat 21-47, achtergevel (1).jpg
  sources:
    - "Live text (scripts/data/amsterdam-west-live-only-2026-11-24.json); link labels made distinct; last paragraph extended"
    - Kunstwacht API 1868 (Speelobjecten Zeeleeuw en Monster, two play objects on the corners of the paddling pool; hardstone and polyester; monster 140 x 200 x 350 cm)
