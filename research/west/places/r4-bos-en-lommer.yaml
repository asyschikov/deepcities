    - "City wall-art register (WANDKUNST) record 38: De Opstanding, Joop van den Broek (1928-1979), 1954, rated Waardevol; etched, sandblasted, cut and chipped glass window in the porch; originally two windows in the church hall, one broke during the conversion (per the artist's son Norbert van den Broek); title from a beeldbank caption; possibly his first commission; colourless, now in a vulnerable position in the porch"
    - "https://maps.amsterdam.nl/open_geodata/geojson_lnglat.php?KAARTLAAG=WANDKUNST&THEMA=wandkunst"
  nl:
    title: Pniëlkerk ('het Theelichtje')
    summary: "Een witte gereformeerde kerk uit de jaren vijftig. De betonnen muren zitten vol glastegels, zodat het gebouw, van binnenuit verlicht, gloeit als een waxinelichtje. Nu is het theater Podium Mozaïek."
    body: |
      Als het binnen licht is, gloeit de kerk als een waxinelichtje. Vandaar de bijnaam *het Theelichtje*. De muren bestaan uit vierkante betonnen elementen die op hun punt staan. Een deel is dicht. De rest is in een geometrisch patroon gevuld met glastegels, en die elementen vormen samen brede banen die als ramen dienen. Een andere bijnaam is De Witte Kerk.

      De architect was B.T. Boeyinga, die het gereformeerde kerkgebouw in Nederland een eigen gezicht gaf; dit was zijn laatste grote werk. Zijn eerste ontwerp uit 1945, in de traditionele stijl van de Delftse School, ging niet door. Wat er in 1954-1955 kwam, is bijna zakelijk: een vrijstaand gebouw dat goed past tussen de vroege strokenbouw eromheen, met twee ranke klokkentorens met een stalen bovenbouw als bescheiden accent. Binnen stond de preekstoel op het punt waar drie zichtlijnen elkaar kruisten, een type dat Boeyinga voor de gereformeerde eredienst bedacht. In de hal achterin zweeft een stalen trap omhoog naar een galerij op betonnen jukken die aan Jan Duiker doen denken.

      Sinds 2005 is dit theater Podium Mozaïek, met ook een huisartsenpraktijk erin, dus wie het interieur wil zien, gaat naar een voorstelling. In de kerkzaal kwam een nieuwe theaterzaal en de preekstoel verdween. Er hingen ooit twee ramen van geëtst en gezandstraald glas van Joop van den Broek, een van zijn eerste opdrachten; hij werd later een van de belangrijkste glazeniers van de wederopbouw. Eén raam sneuvelde bij de verbouwing. Het andere, *De Opstanding* (1954), staat nu kleurloos in het voorportaal. De buitenkant bleef zoals hij was. Kijk ook even rond op het stille pleintje aan de zuidkant.
    attributes:
      original_use: Kerk
    sources:
      - maps.amsterdam.nl/wandkunst (record 38)

- title: Kolenkit, “worst neighbourhood in the Netherlands” (Nannoplein)
  summary: In 2009 a government list named the Kolenkit the worst neighbourhood in the country. Twenty years of demolition and rebuilding later, the Nannostraat is a square and the homes are new, but residents still argue over who the renewal was for.
  body: |
    In February 2009 RTL Nieuws used a freedom-of-information request to obtain the housing ministry's ranking of run-down neighbourhoods. The Kolenkitbuurt, between the A10 and the ring railway, came top: the worst of the twenty worst in the Netherlands. Unemployment was 11.5%, one in six pupils left school without a diploma, and the walk-up flats of the late 1940s were small, draughty and mouldy. Large families lived in far too small homes, and eight in ten residents had at least one parent born abroad, most of them of Moroccan origin. Felix Rottenberg's much-discussed 2002 television series had already made this part of the neighbourhood known nationwide.

    A renewal plan existed since 2003, but the 2008 crisis froze much of it. Eigen Haard pressed on in the middle area. Its leaning 17-storey tower *New Kit*, named after the church, was completed in 2011. At a packed residents' meeting in April 2010 it announced that the old plan was being scrapped, and the hall erupted. Sjoerd Soeters then replaced the post-war rows with closed blocks, car-free streets and squares. New homes were built first, so residents had to move only once. In 2015 the 136 flats of the Nannostraat were demolished, and the street became the Nannoplein. By spring 2023, 361 old social-rent homes had become 705 new ones: social rent, mid-rent and owner-occupied.

    Alongside the bricks came the artists' collective Cascoland, working in the Kolenkit since about 2009 on gardening, cooking and waste with residents. In July 2018 King Willem-Alexander visited its BuurtMoesBinnenTuin, a vegetable garden run by neighbours with support from Rochdale. Next to the church, Stadgenoot's *De Houten Leeuw* (2024) is the first social housing block in Amsterdam built from cross-laminated timber: 53 studios, a third of them for young people from the Kolenkit itself.

    Was it worth it? Satisfaction rose to 6.3 out of 10, still well below the city's 7.3. Old and new residents mostly live "in their own bubble". Next door, in the Kolenkit-Midden, Rochdale is demolishing 220 homes, among them two blocks of social housing in the Sinjeur Semeynsstraat, whose tenants had to move out without a firm guarantee of return.

    Look for:
    - the Nannoplein, laid over the old Nannostraat, in front of the new Bos en Lommerschool;
    - the leaning New Kit tower;
    - De Houten Leeuw on the De Leeuw van Vlaanderenstraat, with its timber gallery and cascading stair at the back;
    - the contrast across the Akbarstraat between new blocks and Rochdale's renovated post-war flats.
