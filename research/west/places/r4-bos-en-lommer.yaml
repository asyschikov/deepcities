  nl:
    title: Pniëlkerk ('het Theelichtje')
    summary: De Pniëlkerk, bijgenaamd het Theelichtje of De Witte Kerk, is een gereformeerde kerk van B.T. Boeyinga uit 1954/55. De betonnen gevels, opengewerkt met glastegels, doen denken aan een theelichtje. Nu theater Podium Mozaïek.
    body: |
      De Pniëlkerk, bijgenaamd het Theelichtje of De Witte Kerk, is oorspronkelijk een gereformeerde kerk. Het witte kerkgebouw is ontworpen door de architect Berend Tobia Boeyinga en gebouwd in 1954/55. De ontwikkeling van het gereformeerde kerkgebouw voltrok zich snel gedurende de eerste decennia van de twintigste eeuw, en Boeyinga heeft daarbij een prominente rol gespeeld; men zou kunnen stellen dat hij de P.J.H. Cuypers van de gereformeerde emancipatie was. In zijn oeuvre vormt de Pniëlkerk een zeer bijzonder slotakkoord.

      In 1945 ontwierp Boeyinga een gebouw met alle stijlkenmerken van de Delftse School, als onderdeel van een gesloten bouwblok. In 1952 kwam een totaal ander ontwerp ter tafel: de kerk staat los van het bouwblok en is een bijna zakelijk gebouw geworden, dat een eenheid vormt met de vroegste strokenbouw in Bos en Lommer. De twee ijle klokkentorentjes vormen een bescheiden stedenbouwkundig accent.

      De betonnen gevels zijn opgebouwd uit gekantelde vierkante elementen, in een geheel gesloten variant en in een variant die middels glastegels is opengewerkt in een geometrisch patroon. Deze opengewerkte elementen, samengevoegd tot brede banen, vormen de kerkramen; zodoende doet het gebouw aan de buitenzijde denken aan een theelichtje. Boeyinga ontwikkelde een type met drie zichtlijnen die elkaar kruisen waar de preekstoel staat. In de hal achter de kerkzaal is de stalen trap naar de galerij geheel open en zweeft bijna omhoog; de galerij rust op betonnen jukken die, net als in het werk van Jan Duiker, de constructie een beeldende functie geven.

      Sinds najaar 2005 zitten theater Podium Mozaïek en een huisartsenpraktijk in het gebouw, dus wie een voorstelling bezoekt, ziet ook het interieur. In de kerkzaal kwam een nieuwe theaterzaal en de preekstoel verdween. De zaal had ooit twee ramen van geëtst en gezandstraald glas van Joop van den Broek, een van de eerste opdrachten van een glazenier die na de oorlog tot de grote namen ging behoren. Eén raam sneuvelde bij de verbouwing. Het andere, De Opstanding uit 1954, staat nu kleurloos in het voorportaal. De buitenkant bleef behouden.

      Let op:

      - de gevels van gekantelde betonnen vierkanten, deels opengewerkt met glastegels;
      - de twee klokkentorens met een vierkante onderbouw en een stalen bovenbouw met de luidklok en de wijzerplaten;
      - de eenvoudige betonnen luifels boven de toegangen;
      - het verstilde pleintje aan de zuidzijde van de kerk, met zijn volgroeide boombeplanting en speelgelegenheid voor kinderen;
      - in het voorportaal het glasraam De Opstanding van Joop van den Broek.
    attributes:
      original_use: Kerk
    sources:
      - maps.amsterdam.nl/wandkunst (record 38)

- title: Kolenkit, “worst neighbourhood in the Netherlands” (Nannoplein)
  summary: In 2009 a government list named the Kolenkit the worst neighbourhood in the country. Twenty years of demolition and rebuilding later, the Nannostraat is a square and the homes are new, but residents still argue over who the renewal was for.
  body: |
    In February 2009 RTL Nieuws used a freedom-of-information request to obtain the housing ministry's ranking of run-down neighbourhoods. The Kolenkitbuurt, between the A10 and the ring railway, came top: the worst of the twenty worst in the Netherlands. Unemployment was 11.5%, one in six pupils left school without a diploma, and the walk-up flats of the late 1940s were small, draughty and mouldy. The neighbourhood had been built for large Dutch families; by 1985 most residents came from Morocco and Turkey. Felix Rottenberg's 2002 documentary *De Akbarstraat* had already made one of its streets famous.

    A renewal plan existed since 2003, but the 2008 crisis froze much of it. Eigen Haard pressed on in the middle area. In 2008-2011 it built the leaning tower *New Kit* on Bos en Lommerweg, named after the church. At a packed residents' meeting in April 2010 it announced that the old plan was being scrapped, and the hall erupted. Sjoerd Soeters then replaced the post-war rows with closed blocks, car-free streets and squares. New homes were built first, so residents had to move only once. In 2015 the 136 flats of the Nannostraat were demolished, and the street became the Nannoplein. By April 2023, 361 old social-rent homes had become 705 new ones: social rent, mid-rent and owner-occupied.

    Alongside the bricks came the artists' collective Cascoland, working in the Kolenkit since about 2009 on gardening, cooking and waste with residents. In July 2018 King Willem-Alexander visited its BuurtMoesBinnenTuin, a vegetable garden run by neighbours with support from Rochdale. Next to the church, Stadgenoot's *De Houten Leeuw* (2024) is the first social housing block in Amsterdam built from cross-laminated timber: 53 studios, a third of them for young people from the Kolenkit itself.

    Was it worth it? Satisfaction rose to 6.3 out of 10, still well below the city's 7.3. Old and new residents mostly live "in their own bubble", and a man who grew up here said it was a pity "not everyone benefited". Next door, Rochdale is demolishing 222 homes in the Sinjeur Semeynsstraat, whose tenants were moved out in 2025 without a firm guarantee of return.

    Look for:
    - the Nannoplein, laid over the old Nannostraat, in front of the new Bos en Lommerschool;
    - the leaning New Kit tower on the Bos en Lommerweg;
    - De Houten Leeuw on the De Leeuw van Vlaanderenstraat, with its timber gallery and cascading stair at the back;
    - the contrast across the Akbarstraat between new blocks and Rochdale's renovated post-war flats.
