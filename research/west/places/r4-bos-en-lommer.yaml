  nl:
    title: Keesmanblokken en Gibraltarbadje
    summary: "Hoogbouw in drie stroken, laagbouw voor bejaarden, een kinderspeelbad en veel groen: een integraal ontwerp dat het hart van een woonwijk vormt en in de algehele opzet en uitwerking uniek is in Amsterdam."
    body: |
      Bij de bebouwing van deze buurt werd ruimte vrijgehouden voor een centraal gelegen scholencomplex. Door de economische crisis en de onderwijsbezuinigingen in 1933 werd de bouw van het aantal scholen echter drastisch verminderd en verviel dat plan. In plaats daarvan paste men in 1940 het plan aan voor de bouw van woningen in strokenbouw en een kinderspeelbad, alles omringd door veel groen. Het ontwerp is van architect Cornelis Keesman; de blokken werden van 1946 tot en met 1949 gebouwd.

      Het complex bestaat uit drie noord-zuid gelegen stroken hoogbouw van vijf bouwlagen, met op de zuidelijke koppen van de buitenste twee korte laagbouwblokjes van twee bouwlagen. De hoogbouw was bestemd voor eengezinswoningen, de laagbouw voor bejaarden. De twee buitenste hoogbouwblokken zijn licht gebogen, de bolle kant naar het middelste blok, dat op zijn beurt 20 meter naar het zuiden is opgeschoven. Het voor spelende kinderen veilige en besloten karakter werd verder versterkt doordat de twee straten tussen de drie blokken doodlopend zijn. De inrichting van de openbare ruimte van dit plan is van het hoogst denkbare niveau.

      Het Gibraltarbadje is een openbaar pierenbadje op de plaats waar de Gibraltarstraat de Keesmanblokken raakt. Het ontwerp is van architect en stedenbouwkundige Ko Mulder, destijds in dienst bij de Dienst der Publieke Werken. Het badje werd in de zomer van 1952 geopend; de vloer is betegeld met lichtblauwe, geglazuurde tegels. Het bronzen beeld van een vrouw met kruik stamt uit 1950 en is gemaakt door beeldhouwer Gerrit Bolhuis, die het een fonteinbeeld noemde. Later kwamen er een zeeleeuw met bal en een octopus bij, beide knalblauw, passend bij de blauwe tegels van het bad. Het kinderbad wordt in de zomermaanden volop gebruikt.

      Let op:

      - de inpandige galerijen op de begane grond, waar de gevel wordt gedragen door een reeks octogonale kolommen;
      - de deels inpandige, deels uitkragende balkons en de smalle asymmetrische erkers aan de westkant;
      - de markant uitkragende en opknikkende daklijst;
      - de trappenhuizen in graniet, dankzij de doorlopende raampartijen van buiten goed zichtbaar;
      - de spaarzaam aangewende ronde vormen, zoals de rondlopende kopgevel van het ketelhuis;
      - bij het badje de vrouw van Bolhuis, gehurkt op een grote schelp, en op twee hoeken de speelobjecten Zeeleeuw en Monster, de octopus met een glijbaantje.
    attributes:
      original_use: Woningen en pierenbad
    sources:
      - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/1868
      - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/1867

- title: Pniëlkerk ('het Theelichtje')
  summary: A white Reformed church of the 1950s whose concrete walls, pierced with glass tiles, glow like a tealight. It is now the Podium Mozaïek theatre.
  body: |
    B.T. Boeyinga, who shaped the Gereformeerd (Reformed) church building in the Netherlands, designed this church as his last major work. A 1945 design in the traditional Delft School style was dropped. The building that went up in 1954-1955 is almost businesslike, free-standing and sitting comfortably among the early strokenbouw around it. Two slender bell towers with steel tops give it a modest vertical accent.

    The walls are made of square concrete elements set on their points. Some are solid. Others are pierced with glass tiles in a geometric pattern and grouped into wide bands that act as the windows. Lit from inside, the church looks like a tealight, hence the nickname *het Theelichtje*. It is also called De Witte Kerk. Inside, the pulpit stood where three sightlines crossed, a type Boeyinga developed for Reformed worship. The hall at the back has a floating steel stair and a gallery on concrete yokes that recall Jan Duiker.

    Since 2005 the building has been the theatre Podium Mozaïek, together with a GP practice, so you can see the interior by going to a show. A new auditorium was built into the church hall, and the pulpit was lost. The church hall once had two windows of etched and sandblasted glass by Joop van den Broek, among the first commissions of a glass artist who became one of the leading names of the post-war years. One broke during the conversion. The other, *De Opstanding* (The Resurrection, 1954), now stands colourless in the entrance porch. The exterior was kept. The quiet square on the south side is worth a look.
