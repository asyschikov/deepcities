  nl:
    title: Opstandingskerk (Kolenkit)
    summary: "Een kerk uit 1956 met een schuine klokkentoren die zo op een kolenkit leek dat de hele Kolenkitbuurt naar die bijnaam heet. In het souterrain zit een buurtcentrum."
    body: |
      Eerst kwam de toren, toen de buurtnaam. Marius Duintjer ontwierp deze hervormde kerk in 1955-1956, als tweede van zijn zes naoorlogse kerken. Het was het eerste gebouw in dit stuk van Bos en Lommer. De schuine klokkentoren van 48 meter leek zo op een *kolenkit* dat die bijnaam in het hele land rondging, en ten slotte ging de omliggende buurt zo heten.

      Het is een *verdiepingskerk*: de ovale kerkzaal staat boven op een wijkcentrum in het souterrain. Na de oorlog vond men dat een kerk ook iets voor de buurt moest betekenen, en dat zie je hier terug. Het skelet van beton en staal is bekleed met rode baksteen in Vlaams verband.

      Let op, aan de buitenkant:

      - de zijwanden die als een harmonica zijn gevouwen, met lange glasstroken verstopt in de plooien, zodat het daglicht via een omweg het witte interieur binnenvalt;
      - de dakgoot van de toren, die ver naar buiten steekt en werkt als waterspuwer;
      - de steile trap met bordes naar de ingang aan de westkant;
      - de pastorie met plat dak (1956) aan de noordkant, op beide niveaus met de kerk verbonden.

      Kerk, trap en pastorie zijn samen als één complex beschermd. Latere hoogbouw en het knooppunt met de A10 nemen een groot deel van het vroegere wijde zicht op de toren weg. In 2021 kwam er een fontein voor de deur, *Fontein Kolenkit*.

      Een paar minuten westwaarts, op het Ernest Staesplein, staat de bronzen *Waterbuffel* van Fioen Blaisse: een buffel vanaf de bovenkant van zijn poten. Blaisse kreeg in 1998 de Singerprijs voor haar hele oeuvre; in Buitenveldert staan nog drie waterbuffels van haar hand.
    attributes:
      original_use: Kerk en pastorie
    sources:
      - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/1874

- title: Former ULO school, Erik de Roodestraat 18
  summary: A Bossche School secondary school by Evers & Sarlemijn with a Roman-style atrium hall, a courtyard fountain with a bronze by A. Teeuwisse and a painted ceiling by Caveto.
  body: |
    This former ULO school, commissioned by the Broeders van Maastricht, is part of the Catholic ensemble around the Sint-Josephkerk: church, old people's homes, kindergarten and the Franciscus- and Juliaschool. Together they form the centre of the neighbourhood. The ensemble's plans of 1934 and 1944 show the post-war shift towards the idea of a neighbourhood centre.

    A. Evers and G.J.M. Sarlemijn, among the leading architects of the Bossche School, designed it; it was built from 1954. The entrance hall is laid out as an atrium and opens onto a courtyard with a fountain, which the city links to classical Roman architecture and which, it says, makes the building all the more exemplary of the Bossche School. Both the main form and the details are well preserved.

    The art was made for the building: a bronze sculpture by A. Teeuwisse in the courtyard fountain, and a ceiling in the school hall painted by Caveto (J.J.M. Dohmen). The atrium and courtyard are inside.

    Look for:
    - on the little square along the Erik de Roodestraat, Marieke Bolhuis's *Stoere Bloemen* (Tough Flowers, 2023): three children with flower buds for heads, in bright clothes and platform shoes, made with neighbours and children in workshops. Boy or girl is left open on purpose: everyone may be who they are.
  category: schools
  lat: 52.373429
  lng: 4.844772
