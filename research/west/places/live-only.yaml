  nl:
    title: Hotel Not Hotel
    summary: 'Een hotel waarvan de kamers kunstwerken zijn: je slaapt er in een oude Amsterdamse tram met nummer 965, achter een geheime boekenkast of in een Volkswagenbusje, allemaal neergezet in één grote bakstenen hal naast de Westermoskee.'
    body: |
      Op het Piri Reïsplein zat in de 20e eeuw autobedrijf Opel Riva. Sinds 2011 staan er meer dan honderd woningen van Stadgenoot, met bedrijfsruimten op de begane grond. Het complex reikt tot aan de Witte de Withstraat, en door het gebouw loopt een doorgang tussen straat en plein. Marc en Nadia Breitman ontwierpen zowel deze woningen als de Westermoskee ernaast. In de grote hal op de begane grond openden Bruno Bont en Tijmen Receveur in 2014 Hotel Not Hotel.

      De kamers zijn door kunstenaars gemaakt als losse objecten in de hal, met bakstenen bogen en een stalen brug op de verdieping. De *Amsterdam Tram Cart* is een echte oude tram, nummer 965. Achter een draaiende boekenkast liggen de *Secret Bookcase*-kamers. Er is een Volkswagen T1-busje, een *Crisis Free Zone* van Arno Coenen, *Sin City* van Hans van Bentem, en kamers van Jelle Mastenbroek, Sander Wassink en de eigen 'HNH Concept Factory'. In totaal zijn er 23 kamers, de meeste klein en veel met een gedeelde badkamer. Er is ook een vestiging in Rotterdam.

      Een bar is er niet meer (de oorspronkelijke heette Kevin Bacon, naar de acteur); gasten gebruiken een selfservice 'Craving Station'. Kamers en lounges zijn alleen voor gasten.

      Let op:
      - de doorgang tussen het Piri Reïsplein en de Witte de Withstraat
      - de Westermoskee ernaast, van dezelfde architecten
