  nl:
    title: Brettensuite (Herbert Nouwens)
    summary: Twintig roestbruine reuzen van scheepswanden en schroot, als kralen aan een ketting langs het elf kilometer lange Brettenpad, van het Westerpark tot Halfweg. Ze zijn van een beeldhouwer die van het gasfabriekterrein weg moest toen het park er kwam, en die ermee terugkwam.
    body: |-
      Herbert Nouwens moest weg van de plek waar deze route begint, en kwam terug met twintig beelden. In de jaren negentig had de beeldhouwer (Oegstgeest, 1954) zijn atelier-smederij op het terrein van de Westergasfabriek. Toen de gasfabriek werd gesaneerd en er een park kwam, moest hij weg; in 2004 verhuisde hij naar een leegstaande zuivelfabriek in het Groningse Slochteren. Zijn buitenbeelden maakt hij van scheepswanden en ander zwaar restmateriaal.

      In de zomer van 2014 werd hij zestig en kwam hij terug naar het Westerpark met Angels' share, een overzicht van 25 monumentale beelden. Ambtenaren die het Brettenpad cultureel op de kaart wilden zetten, klopten daarop bij hem aan. Vanaf oktober 2014 stonden zo'n twintig cortenstalen beelden in bruikleen langs dit fiets- en wandelpad door landschapspark De Bretten, een van de groene 'vingers' van de stad. De meeste kwamen uit de tentoonstelling, een paar haalde hij terug uit Slochteren. Nouwens koos zelf plekken die om een markering vroegen. Hij noemde het geheel een suite, zoals in de muziek: losse stukken die elk apart te spelen zijn, maar samen een reis vormen, 'een rij kralen aan een ketting'.

      Nummer 1 staat hier, bij de Polonceaukade naast de Westergasfabriek. Nummer 2 is ouder: een torenachtig beeld uit 1998, gesmeed op het gasfabriekterrein en in 2002 neergezet bij de plek waar het pad langs het spoor onder de rails door gaat. De laatste staan richting Halfweg. In 2015 verscheen er een fietskaart van de route. Ze zijn altijd te zien, en de hele route is een mooie fietstocht.

      Let op:
      - nummer 1, het begin van de reeks, bij de Polonceaukade
      - het cortenstaal, en hoe de reeks verandert met seizoen, weer en tijdstip
      - de toren uit 1998 bij de spoortunnel, de voorloper van de reeks
