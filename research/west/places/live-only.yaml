  nl:
    title: Schuilkelder Postjeskade 36
    summary: Een bakstenen huisje aan de kade waar bijna niemand naar kijkt, is de deur naar een schuilkelder van twee lagen voor 80 mensen. Gebouwd in 1940 als rioolgemaal, in 2011 gekocht voor 15.000 euro, in 2022 te koop voor 1,1 miljoen en in 2026 voor 295.000 euro.
    body: |-
      Het gebouwtje op Postjeskade 36 verrees rond 1940 als rioolgemaal voor het groeiende westen van de stad: massief beton, diep de grond in. In de jaren vijftig had niemand de pomp meer nodig. Tijdens de Koude Oorlog wilde de stad openbare schuilplaatsen voor wie bij luchtalarm op straat werd overvallen, en een lege betonnen bak onder de kade kwam dan als geroepen. Op 14 juli 1959 besteedde Publieke Werken de verbouwing aan. Er kwamen muren van zo'n 30 centimeter dik, een luchtsluis, zware stalen deuren met grendels, een nooduitgang en een luchtfilterinstallatie, met het zandfilter weggestopt onder de schuilruimtes. De meeste Amsterdamse schuilkelders hadden één verdieping; deze heeft er twee, onder een piepklein entreehuisje.

      De dag waarvoor hij gebouwd was, brak nooit aan. De gemeente verhuurde hem als opslag aan de Bescherming Bevolking, verkocht hem later, en langzaam groeide de klimop eroverheen. In 2011 kocht een 22-jarige geschiedenisliefhebber hem voor 15.000 euro, omdat niemand anders hem wilde. In 2022 zette hij hem te koop voor 1,1 miljoen, als onbeschreven blad voor een studio of een villa. Dat haalde het landelijke nieuws, maar een koper kwam er niet. Een bunkerkenner die de kelder goed kent, zei dat 80 mensen het er een week moesten uithouden, maar dat je het er volgens hem nog geen dag zou uithouden. In 2026, de klimop weg en het interieur opgeknapt in de stijl van 1960, kwam hij via inschrijving opnieuw in de verkoop, voor 295.000 euro (wonen niet toegestaan).

      Het is privébezit; je ziet het alleen vanaf de kade.

      Let op:
      - het eenvoudige bakstenen entreehuisje met een groene deur, pal aan het water
      - het betonnen dak op straatniveau, dat ook dienstdoet als parkeerplek
    attributes:
      built: 1940; schuilkelder 1959–1960
      original_use: Rioolgemaal
