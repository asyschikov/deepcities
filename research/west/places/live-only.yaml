    summary: Een vuurtoren met sinaasappels aan de kade van de Postjeswetering, ver van zee. Van de maker van de reuzenkegels als koekoeksklokgewichten op de Weesperstraat.
    body: |
      Op de kade van de Postjeswetering staat een vuurtoren van beton, staal en koper, met sinaasappels erbij. Geen kust en geen vaargeul. Beeldhouwer Hans van den Ban (Zwanenburg, 1950) volgde de Gerrit Rietveld Academie in Amsterdam. Zijn vroege werk stond onder invloed van Fluxus; in de jaren tachtig en negentig legde hij zich toe op beeldhouwen. Zijn bekendste Amsterdamse werk is *Fête Galante* op de Weesperstraat: grote kegels die aan dennenappels of koekoeksklokgewichten doen denken. Het Stadscuratorium noemt de vuurtoren aan de Postjeskade zijn andere beeld met boomvruchten in Amsterdam.

      Over het jaar verschillen de bronnen: OpenStreetMap noemt 1991, de lijst van zijn werken op Wikipedia 1993.

      Let op:
      - de sinaasappels, de vreemde eend tussen de materialen
      - het koper van de lamp tegen het beton en staal
      - de Postjeswetering erachter
