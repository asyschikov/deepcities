  nl:
    title: Highlights of Holland (Magdalenakapel)
    summary: Een woonhuis in chaletstijl uit 1880 dat kantoor werd van de Westersuikerfabriek, daarna kapel van de Magdalenaparochie en sinds december 2025 een 'experience' met tulpen, fietsen en Van Gogh. Een aparte vergunning was volgens de gemeente niet nodig.
    body: |
      Het pand aan de Spaarndammerstraat 460 groeide in fases, van 1880 tot 1967, en mengt stijlen. Het middendeel, drie lagen hoog onder een zadeldak, liet uitgever en drukker M.C. de Grauw in 1880 bouwen naar ontwerp van Johann Stillmann. Die was in 1856 in Kopenhagen geboren en tekende onder meer de wintertuin van hotel Krasnapolsky. Lange tijd stond het huis in zijn eentje in een bouwblok van de nieuwe Spaarndammerbuurt. De voorgevel heeft een verdieping in chaletstijl met vakwerk, versierde windveren en een makelaar in de top.

      In 1897 kocht de Wester Suiker Raffinaderij het pand als kantoor. Willem Langhout en P.H. van Niftrik voegden in 1897 en 1907 aan weerszijden een vleugel toe, waarbij ze de onderste twee lagen van de oude voorgevel nabootsten. Vanaf 1923 gebruikte de Maria Magdalenaparochie het als verenigingsgebouw. Na de sloop van de Magdalenakerk werd het in 1967-1968 een kapel, met achteraan een bakstenen aanbouw. De kerk vertrok in 2011. Een plan voor 25 huurappartementen ging na bezwaar van buurtbewoners van tafel.

      Voor Highlights of Holland is de Magdalenakapel volledig gerestaureerd en aangepast. De attractie opende op 17 december 2025: tien themaruimtes, met onder meer een waterkamer met een virtuele rondvaartboot, een fietskamer waar al trappend een muziektrack ontstaat, een kunstkamer en een tulpenkamer met tulpen tot 3,5 meter hoog. Buurtbewoners reageerden verschillend. De gemeente liet weten dat geen aparte vergunning nodig was, omdat de plannen binnen het bestemmingsplan vallen als 'culturele voorziening'. Dagelijks open van 10.00 tot 19.00 uur.

      Let op:
      - de steile chaletgevel met rond venster en vakwerk
      - de twee lagere vleugels, kopieën van de voorgevel uit 1880
    attributes:
      built: 1880; vleugels 1897 en 1907; kapel 1967-1968
      architect: Johann Stillmann; vleugels Willem Langhout en P.H. van Niftrik
      original_use: Woonhuis; kantoor Wester Suiker Raffinaderij; verenigingsgebouw en kapel
