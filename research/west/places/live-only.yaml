  lat: 52.374367
  lng: 4.855528
  address: Jan van Galenstraat, over the Admiralengracht
  links:
  - label: Wikipedia (nl)
    url: https://nl.wikipedia.org/wiki/Vierwindstrekenbrug
  - label: Wikidata
    url: https://www.wikidata.org/wiki/Q2091523
