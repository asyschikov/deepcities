  nl:
    title: Pesthuis (verdwenen)
    summary: 'Zeventiende-eeuwse pestlijders gingen per schuit naar het pesthuis aan het eind van de huidige Tweede Constantijn Huygensstraat: een vierkant blok met een eigen gracht. Op de plek zelf is niets meer over; als Buitengasthuis werd het in de jaren dertig gesloopt.'
    body: |-
      In de pestjaren van de zeventiende eeuw kon één uitbraak tot een achtste van de Amsterdammers het leven kosten. In 1635 zette de stad een pesthuis neer, buiten de stadspoorten bij de Overtoomse Vaart. Het was een vierkant blok rond een binnenhof, met een gracht en een rij bomen eromheen die de kwalijke dampen binnen moesten houden. Dwars door de binnenhof liep water, zodat de zieken per boot tot binnen konden worden gebracht. Ze kwamen met de pestschuit over de Pestsloot, waar nu de Bosboom Toussaintstraat ligt, en liepen zo de gezonden nooit tegen het lijf. De brug over de Overtoomse Vaart ernaartoe heette de Pestbrug of Latjesbrug. Vandaar het Amsterdamse 'jij moet over de Latjesbrug': jij bent niet goed wijs.

      In 1732 brandde het gebouw af en werd het opnieuw opgetrokken. De pest was toen al verdwenen. Het Buitengasthuis, zoals het van begin af aan heette, kreeg nu ongeneeslijken, krankzinnigen en besmettelijke armen binnen. In de negentiende eeuw was het berucht: het personeel verkocht de medicijnen van de patiënten en at hun eten op. Vanaf 1883 bouwde Anna Reynvaan hier de eerste professionele verpleging van Nederland op, met een eigen opleiding voor verpleegsters. Toen in de jaren 1890 het Wilhelmina Gasthuis ernaast openging, werd het oude gebouw vanaf 1905 een onderdak voor daklozen. In de jaren dertig ging het tegen de vlakte.

      Niets herinnert ter plekke aan het pesthuis. Het toegangshek stond waar de Tweede Constantijn Huygensstraat bij het WG-terrein ophoudt, tussen het Huygens College en de vroegere oogkliniek van het Wilhelmina Gasthuis.

      Let op:
      - het doodlopende eind van de Tweede Constantijn Huygensstraat, waar het hek stond
      - de straatnaam Pesthuislaan op het WG-terrein
      - de Bosboom Toussaintstraat, de gedempte pestsloot
    attributes:
      built: 1635; gesloopt in de jaren dertig
      original_use: Pesthuis, later Buitengasthuis en tehuis voor daklozen
