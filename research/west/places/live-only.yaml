  nl:
    title: Voormalige Wereldbibliotheek
    summary: Hier drukte en bond de Wereldbibliotheek vanaf 1922 haar goede, goedkope boeken voor arbeiders. Een eigenzinnig bakstenen gebouw van L. Zwiers, dicht bij de Amsterdamse School, met een dakrand die in het midden en aan de uiteinden opbolt.
    body: |-
      Goede boeken voor weinig geld, zodat ook de arbeider kon lezen: dat was het idee achter de Wereldbibliotheek, in 1905 opgezet door Leo Simons. Het was volksverheffing voor arbeiders. Dezelfde Simons had Berlage zijn woonhuis laten ontwerpen. Dit gebouw is van L. Zwiers, ontwerper, tekenaar en schrijver uit de kring rond Berlage, en in 1922 trok de uitgeverij erin. Onder één dak zaten kantoren, een magazijn, een drukkerij en een binderij. De Wereldbibliotheek bleef tot 1976.

      De lange, symmetrische voorgevel is van roodgrijze baksteen, met afgeronde hoeken. Donkere banden van in teer gedrenkte steen lopen erdoorheen en kronkelen onder de bovenramen. De dakrand bolt op in het midden en aan beide uiteinden. De vooruitstekende ingang rust op twee gedrongen, zuilachtige pijlers; daarboven stond ooit in smeedijzer 'WERELD BIBLIOTHEEK'. Bij de deur is nog van alles origineel: de glazen deur, het blauwe tegelmozaïek, sieraden van gekleurd 'druipsteenglas' en een stenen brievenbus met 'post' erin gehakt.

      Tegenwoordig delen meerdere bedrijven het pand. De kanariegele kozijnen zijn verdwenen, en de fabriekshal achter is een lappendeken van aanbouwen. De gemeente pleit daarom voor een zorgvuldige restauratie. Het gebouw staat schuin op de Haarlemmerweg en sluit zo de Admiraal De Ruijterweg af.
    attributes:
      original_use: Uitgeverijkantoor en drukkerij
  sources:
  - https://api.data.amsterdam.nl/v1/monumenten/monumenten/1463ed3e-859d-4ca6-9dae-7e8bd8181b8b?_format=json
- title: Former post office, Admiraal De Ruijterweg
  summary: "A small village post office from 1915–1920, stranded among the big Amsterdam School blocks of Bos en Lommer: one of the last traces of old Sloterdijk south of the Haarlemmerweg, with a stone letterbox still carved 'brieven drukwerken'."
  body: |
    Before Amsterdam annexed the municipality of Sloten in 1921, the dike village of Sloterdijk was the only settlement among the polders here. Railways, new city blocks and the A10 ring road swallowed most of it. South of the Haarlemmerweg only three things are left: the former Wereldbibliotheek at no. 545, a row of houses at Willem Leevendstraat 6-16, and this corner building, which now stands alone because the plots on both sides are empty.

    It held a post office on the ground floor with a home above. Its exact history is unknown, because the building drawings are missing; the city's register dates it to 1915–1920. That makes its Amsterdam School touches early, and the register can't tell whether this is an early design or a toned-down version meant to suit a village. In 1951 a laboratory wing was added at the back for the firm Ronette (N.V. Ronette Piëzo Electrische Industrie). Since a renovation in the 1980s the building has been lived in, with studio homes in the former storage wing, so look from the street.

    Look for:
    - the stone letterbox on the Admiraal De Ruijterweg front, carved 'brieven drukwerken' (letters, printed matter), its slots bricked up
    - three small gables on the main road and two larger ones on the side street
    - top lights with lozenge-shaped (*wieber*) glazing bars
    - the bay-like timber windows on the first floor next to the corner
