    artist: Peter van der Heijden
    rank: Nice
  nl:
    title: Zes anamorphosen
    summary: 'Kijk omhoog in de gaanderij op de eerste verdieping van een woonblok aan de Kinkerstraat: zes uitgerekte, wat art-deco-achtige vormen op het plafond. Loop door, en er duiken gespiegelde dieren op, van pitbull tot bidsprinkhaan.'
    body: |-
      Recht van onderen zie je zes lange sierlijsten, een tikje art deco. Maar loop door de gaanderij en er verschijnen dieren in, steeds gespiegeld: een pitbull, een vink, een slang, een kameleon en een bidsprinkhaan.

      Het trucje heet anamorfose: een beeld dat zo vervormd is dat het pas klopt als je er vanuit één bepaalde hoek naar kijkt. Denk aan de schedel in De Ambassadeurs van Holbein. Peter van der Heijden kreeg de opdracht van de Bouw- en Woningdienst, Kunstzaken Amsterdam en Woningbedrijf West. Voor het blok op de hoek van de Kinkerstraat en de Ten Katestraat beschilderde hij het plafond van de gaanderij op de eerste verdieping. In 1988 was het klaar: Zes anamorphosen, acryl op multiplex.

      Let op:
      - de zes beschilderde plafondpanelen van de gaanderij op de eerste verdieping
      - hoe de vormen veranderen terwijl je door de gaanderij loopt
