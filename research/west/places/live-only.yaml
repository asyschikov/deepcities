    summary: 'De noordelijke helft van de ''stadspoort'' die H.Th. Wijdeveld in de jaren twintig bij de Hoofdweg en de Jan van Galenstraat bouwde: een torenblok van zes lagen met bovenin voormalige ateliers.'
    body: |-
      Een poort zonder deuren: op de kruising van de Hoofdweg en de Jan van Galenstraat zette architect H.Th. Wijdeveld twee hoekblokken neer die samen een *stadspoort* vormen. Ze horen bij de woningbouw aan de Hoofdweg in Plan-West. Dit rijksmonument is het noordelijke blok, gebouwd in 1925-1926, met arbeiderswoningen, winkels en bovenin woningen met ateliers.

      Kijk naar de iets teruggezette rechthoekige toren van zes lagen, die aan de achterkant nog hoger doorloopt. Hij heeft grote ramen in drie delen en, waar de ateliers zaten, een glasgevel met veel ruitjes. Aan de Jan van Galenstraat springen de begane grond en de eerste verdieping naar voren, en ze eindigen in een halfronde erker. Boven de winkels loopt een band siermetselwerk met verticale accenten, met daarboven een uitkragende reeks hoge ramen per drie. Bovenin, in de hoge blinde muur van de zolderverdieping, zitten vier hijsbalken met vierkante elementen erboven. Een smal, uitspringend stuk met slanke ramen vormt de overgang naar de huizen aan de Hoofdweg.

      Het register waardeert het blok om zijn typologie en om zijn rol in het ensemble. Je ziet het pas goed als je ook de overkant erbij neemt, want daar staat de andere helft van de poort.
    attributes:
      original_use: Woningen
  sources:
  - https://monumentenregister.cultureelerfgoed.nl/monumenten/531143
  - https://www.wikidata.org/wiki/Q18813211
- title: Windwijzen (Staringplein)
  summary: Twenty-three black human figures stand on the rooftops around the Staringplein, each pointing an arm wherever the wind blows. Rolf Engelen's 2006 artwork finished the square's makeover, above a car park so prone to breakdowns that locals nicknamed it Parkeergarage Storingplein.
  body: |-
    Look up from the hexagonal Staringplein, named in 1904 after the poet A.C.W. Staring. On the roofs around it stand some 23 black human figures. Each one is a weather vane with an outstretched arm and finger, and together they always point the way the wind blows. They look steadfast, but they are completely at the mercy of the wind. The work, *Windwijzen* (a play on *windwijzer*, weather vane, and *wijzen*, to point), is by Rolf Engelen. It was unveiled in June 2006 as the final part of the renewal of the square.

    That renewal was mostly about what lies underneath. In 2005 a €3.2 million mechanical car park was built under the square, which is why the lawn now bulges above street level. The garage broke down so often that the neighbourhood nicknamed it *Parkeergarage Storingplein* (Breakdown Square car park). In April 2024 the city announced it wanted to sell it. A time capsule is set into its roof.

    The figures are small against the sky and easiest to spot on a windy day, when they all turn together.

    Look for:
    - the figures on the roofs around the square
    - the raised lawn over the car park, and the time capsule in it
    - the Lutherhof almshouse at number 9
