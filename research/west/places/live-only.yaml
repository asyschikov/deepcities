  nl:
    title: What will the neighbours say? (Barend van Herpe)
    summary: 'Een naakte man die als fontein water spuit, tien meter hoog op een kale zijmuur. In 1988 bestond er nog geen fotokunstwerk van dit formaat. Het doelwit: staatsman Floris Adriaan van Hall, die de lege schatkist vulde met gedwongen leningen.'
    body: |-
      Fotograaf Barend van Herpe (geboren 1956) kreeg in 1988 van Kunst in Mokum (KIM), de kunstwerkgroep van de gemeente, een blinde muur in de Van Hallstraat, vlak bij de Kostverlorenkade. Een fotokunstwerk van die maat was nog nergens gemaakt. Het beeld werd met zeefdruk op panelen gezet en moest het even lang uithouden als een beeldhouwwerk.

      Van Herpe dook in de familie Van Hall en vond in het stadsarchief staaltjes van negentiende-eeuwse huichelarij. Hij koos Floris Adriaan van Hall (1791-1866), de minister die de lege schatkist spekte met verplichte staatsleningen, en diens hooghartige blik op het gewone volk. In die tijd bepaalden de buren hoe je leefde: zolang zij van niets wisten, was er niets aan de hand. Gaandeweg drong tot Van Herpe door dat zijn titel ook heel letterlijk opging. De buren van de muur zouden er vast iets van vinden.

      Op de geënsceneerde foto staat de kunstenaar zelf, spiernaakt, als onderdeel van een fontein die water spuit, tussen vogels. Hij leende beeldtaal van Jeroen Bosch en clichés uit reclame en kranten. De vogels staan voor Van Halls verheven positie; de naakte figuur drijft daar zo te zien de spot mee. Buiten werd het bewust zwart-wit, zodat het afstak tegen de kleurige reclameborden overal in de stad. Frans Haks, directeur van het Groninger Museum, onthulde het op 8 oktober 1988. Zijn museum kocht een kleurenafdruk en vernoemde later een fototentoonstelling naar het werk.

      Inmiddels hangt het niet meer in de Van Hallstraat, maar op een muur aan de Van Reenenstraat, op de hoek met De Kempenaerstraat.

      Let op:
      - de hoek van de Van Reenenstraat en De Kempenaerstraat, het tweede adres van het werk
      - de Van Hallstraat vlakbij, waar het eerst hing
    attributes: {}
