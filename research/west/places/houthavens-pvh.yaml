  nl:
    title: PVH Campus, Danzigerkade
    summary: Drie kantoorgebouwen van MVSA op de kop van de Danzigerkade, Europees hoofdkantoor van Tommy Hilfiger en Calvin Klein. Een wit schip, een grijze 'waterval' en zwarte golven, verbonden door loopbruggen, op de plek van de oude Houthaven.
    body: |
      De (Oude) Houthaven werd gegraven in 1876, gelijk met de aanleg van het Noordzeekanaal, voor het overslaan en opslaan van hout. Toen het vervoer van hout steeds meer over de weg plaatsvond, werden de insteekhavens na 1945 gedempt. De toen aangelegde straten kregen de namen van historische steden aan de Witte Zee, Oostzee en Noordzee: Archangelkade, Danzigerbocht en Danzigerkade, Haparandaweg, Rigakade. Sinds 2010 ontwikkelt de gemeente het gebied tot woon- en werkwijk.

      De Houthavens vormen het decor voor een architectonische drie-eenheid: de PVH Campus, een samenspel van drie gebouwen aan de Danzigerkade met elk een eigen architectuur, ontworpen door MVSA Architects en ontwikkeld door Heren 2 voor PVH Europe, het modehuis achter onder meer Calvin Klein en Tommy Hilfiger. Het Porcellis-gebouw (Danzigerkade 165) markeert als blikvanger het uiterste punt van de kade en werd in 2016 als eerste opgeleverd. Het exterieur verwijst naar de cruiseschepen en zeiljachten die over het IJ varen: wit aluminium en glas, en een gebouw dat licht overhelt als de boeg van een schip. De luifel steekt circa zeven meter uit richting het water. Met vijftig meter is het tweemaal hoger dan de andere gebouwen op de Danzigerkade.

      In 2019 volgden Danzigerkade 125 en 85, die de campus completeren. De voorgevel van DK 125 doet denken aan een waterval: meerkleurige gevelbanden die met tientallen verschillende radii vloeiend in elkaar overlopen, samengesteld uit meer dan 500 verschillende panelen. De gevels van DK 85 verwijzen naar de golven over het IJ, met verhoogde deklijsten die aan geen enkele gevelzijde hetzelfde zijn. In een van de ronde erkers zit een gebogen ruit van ruim 1.200 kilogram; slechts één fabriek in Europa had een oven van die grootte. De drie gebouwen zijn met elkaar verbonden door transparante loopbruggen.

      Let op:
      - de overhellende witte 'boeg' en de lange luifel boven het water
      - de glazen loopbruggen tussen de drie gebouwen
      - het verloop van wit via grijs naar zwart, het best te zien vanaf de overkant van de Minervahaven
      - de golvende deklijsten op de gevel van het zwarte gebouw

      Zie ook: Pontsteiger, Silodam en Zen Mast verderop langs de Houthavens.
