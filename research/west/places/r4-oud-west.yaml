    - "Scout's 'Amsterdam School' design claim and model date (Check: Facts) not settled; left out of the text. The Westkrant calls it a characteristic example of the Amsterdam School, which conflicts with the 1880 start; not used."
  nl:
    title: Plaskrul aan de Derde Kostverlorenkade
    summary: Amsterdam had ooit zo'n 175 plaskrullen, gekrulde schermen waarachter mannen buiten konden plassen. Er zijn er nog 37, twee in West, en dit is de enige daarvan waar je vrij naartoe kunt lopen; de andere staat binnen de muren van Museum Het Schip.
    body: |
      De plaskrul dankt zijn naam aan zijn gekrulde vorm. Zulke urinoirs kwamen vanaf 1880 in het Amsterdamse straatbeeld, zodat wie buiten werkte zijn behoefte niet langer tegen een muur, een boom of in het water hoefde te doen. Ze waren alleen voor mannen. In de jaren zeventig ketenden de Dolle Mina's zich eraan vast om ook voor vrouwen plasrecht te eisen.

      Van de ongeveer 175 krullen die de stad ooit had, zijn er 37 over, en de gemeente vervangt ze geleidelijk door toiletten waar ook vrouwen terechtkunnen. In West staan er nog twee: de ene in de tuin achter Museum Het Schip, de andere hier aan de Derde Kostverlorenkade, bij de Vosmaerstraat. Fotograaf Renzo Gerritsen bracht in 2024 een boek uit over de overgebleven exemplaren, *Gezeik in Amsterdam*. Kunstenaar Leendert Vooijce maakte ze alle 37 schoon, elke dag één, in blauwe overall en op plateauschoenen, gewapend met emmer, spons en blote handen; de film van acht uur draaide in 2026 in Het Schip.

      Hij is gewoon in gebruik: kijk gerust, maar kijk eerst even of er iemand staat.

      Let op:
      - de krul zelf
      - het uitzicht over de Kostverlorenvaart vanaf de hoek
    attributes:
      outlook_note: "De gemeente vervangt plaskrullen door toiletten voor iedereen; voor deze is geen datum bekend."
    sources:
      - https://www.dewestkrant.nl/met-opmerkelijk-kunstwerk-vraagt-museum-het-schip-aandacht-voor-de-amsterdamse-krul/

- title: Moederste
  summary: "A bright blue-green bronze mother with a child on her back, arms and legs reaching out like roots. Look longer and the child is crying and the mother is angry: a 2025 work for the 50th anniversary of the Oranje Huis, the Amsterdam shelter that began as a Blijf-van-m'n-Lijf-huis."
  body: |
    In the middle of the little park on the Bellamyplein, by the paddling pool, a creature in cheerful patinated bronze stands on the grass. At first glance it looks playful. Then you see that the small figure on the big one's back is in tears, and that the mother is angry, an emotion women are often not allowed to show. Their arms and feet stretch out like roots looking for ground. The work deliberately has no plinth: the women it is about rarely get the chance to put down roots anywhere.

    The artist, Susanne Khalil Yusef (born in Germany in 1984 to Palestinian refugees and trained at St. Joost School of Art & Design), made it for the 50th anniversary of the Oranje Huis, formerly the Blijf-van-m'n-Lijf-huis. In the 1970s the action group Blijf van m'n Lijf (Keep your hands off me) made the point that wife-beating was not a private matter, and in 1974 the first shelters opened, at secret addresses. Today's Oranje Huis helps victims, witnesses, children and perpetrators. Yusef spent time with the women living there; they drew and wrote together about memories and dreams, and for most of them the biggest dream was a safe place to start again with their children. Her own childhood, she says, was a search for exactly that.

    The statue was commissioned by Stadsdeel West as part of the *Vrouwen van West* (Women of West) art project and unveiled on International Women's Day, 8 March 2025. The spot was chosen because the playground and paddling pool stand for carefree moments, with the surrounding homes keeping an eye out. The pond already had company: Leo Braat's three bronzes on its rim, a vase-shaped woman with a jug and two playful fish, by a sculptor who drew on pre-Columbian and Mexican art.

    Look for:
    - the tears on the child's face
    - the dark spots on the mother's blue-green skin
    - the two information plates in the ground, one about the work and one about violence against women
    - Leo Braat's water carrier and two fish on the rim of the paddling pool
  category: street-art
  lat: 52.368156
  lng: 4.867539
  address: Bellamyplein (park)
