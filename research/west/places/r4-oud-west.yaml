    architect: VenhoevenCS (Ton Venhoeven, Richèl Lubbers)
    artist: Giny Vos (light work)
  photos: []
  sources:
    - "https://gebouwdin.amsterdam.nl/api/projectdetail/25 (year 2005; VenhoevenCS; green facades and roofs, more than fifty plant species; 'overwoekerd vestingwerk' flanking the entrance to the 19th-century city; society in miniature; airport-like hall; Giny Vos light work, ceiling becomes a starry sky over a lit sea; 7,100 m2)"
    - "https://www.architectuurgids.nl/project/item/prj_id/2072 (2001-2006; Venhoeven, Lubbers; garden architects Okra and Copijn; 2,000 m2 of black elastic material slit every 20 cm for planters; computer-controlled drip lines for 50,000 plants of 60 species; grass roofs)"
    - "https://nl.wikipedia.org/wiki/Sportplaza_Mercator (opened 2006, two years late; replaces Sportfondsenbad West (1938, Cornelis Dirkszstraat, closed June 2006) and the Jan van Galenbad (closed 2002); separate boys' and girls' pools, only the boys' heated; 50 m outdoor pool; DJK-ZAR water polo)"
    - "Commons File:Potkachel, J v Galenstr, Amsterdam.jpg (Potkachel between Sportplaza and Fridtjof Nansenhof)"
    - "No current news found on the state of the planting; VenhoevenCS reportedly looks at new greening (not confirmed, not used)."
  nl:
    title: Sportplaza Mercator
    summary: "Een zwem- en sportcomplex vermomd als overwoekerde vesting aan de kop van het Rembrandtpark. De zwarte, rubberachtige gevel heeft om de twintig centimeter een sleuf voor plantenbakken: zo'n 50.000 planten van ruim vijftig soorten, onder grasdaken."
    body: |
      West had twee versleten zwembaden: het Sportfondsenbad West uit 1938, ingeklemd tussen de huizen in de Cornelis Dirkszstraat, en het openluchtbad Jan van Galenbad, waar jongens en meisjes tot in de jaren zeventig door een hek gescheiden zwommen (alleen het jongensbad was verwarmd). Beide maakten plaats voor één complex op het terrein van het buitenbad, ontworpen door VenhoevenCS (Ton Venhoeven, Richèl Lubbers) en in 2006 geopend, twee jaar later dan gepland.

      Van ver lijkt het op een overgroeid bolwerk dat de toegang tot de negentiende-eeuwse stad bewaakt. Het getrapte gebouw zit in een zwarte, elastische huid met om de twintig centimeter een sleuf, elk met een plantenbak; een computer geeft zo'n 50.000 planten van ruim vijftig soorten water, en de daken zijn van gras. Door de glazen pui zie je een kleine samenleving in één gebouw: baantjeszwemmers, kinderen, reumapatiënten in het therapiebad, sporters en mensen die alleen voor het café komen. Binnen maakt een lichtwerk van Giny Vos van het plafond een sterrenhemel boven verlicht water zodra de grote lampen uitgaan.

      Het is gewoon een zwembad met sportschool, met ernaast een buitenbad van vijftig meter.

      Let op:
      - de begroeide gevels vanaf de Jan van Galenstraat, en hoeveel ervan dit seizoen groen is
      - de grasdaken op het getrapte gebouw
      - de *Potkachel* van Eveline van Duyl op de middenberm ervoor
    attributes:
      artist: Giny Vos (lichtwerk)
    sources:
