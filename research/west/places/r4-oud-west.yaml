    check_note: "The only photo of the stone is the city archive's of 1987."
  photos: []
  sources:
    - "Archief Amsterdam beeldbank 6a2c211d (Memorix API, Nov 2026): 'Admiraal De Ruijterweg 149. Gedenksteen bouw huis. N.V. Bouw en Exploit Mij. NOOIT GEDACHT en toch verkregen 31 maart 1912. J.W. Pennings Sr. C. Grootes, bouwkundige'; photographer Ino Roël, city photo service"
    - "https://nl.wikipedia.org/wiki/Admiraal_De_Ruijterweg (road laid out 1908 beside the ESM tram of 1904 through Sloten meadows, 280,000 m3 of sand; named after De Ruyter 1908; commuter housing from 1910, partly built by the ESM; Sloten wanted residents and to stand stronger against Amsterdam; annexed 1 Jan 1921; curved course follows the old ditch pattern)"
    - "Scout dated it 1987 photo; scout's 'some of the first houses of the road' kept as 'one of those early houses'. Pin PDOK 149."
  nl:
    title: Gedenksteen 'Nooit gedacht', Admiraal De Ruijterweg 149
    summary: "Een steen van 31 maart 1912 jubelt 'NOOIT GEDACHT en toch verkregen' op een van de vroege huizen langs de nieuwe weg, toen nog in de polder van de gemeente Sloten, waar vanaf 1910 forensenwoningen verrezen, een deel gebouwd door de trammaatschappij zelf."
    body: |
      De Admiraal De Ruijterweg begon in 1908 als zandbaan naast de tramlijn van Amsterdam naar Haarlem en Zandvoort, die in 1904 was geopend dwars door de lege weilanden van de gemeente Sloten. Vanaf 1910 verrezen er forensenwoningen. De trammaatschappij bouwde er zelf ook een deel van, want elke nieuwe bewoner was een mogelijke reiziger, en Sloten was blij met extra belastingbetalers, al was het maar om sterker te staan tegenover Amsterdam. Die stad annexeerde in 1921 toch het hele gebied.

      Nummer 149 is een van die vroege huizen. In de gevel zit een gedenksteen voor het begin van de bouw op 31 maart 1912 door de N.V. Bouw- en Exploitatie Maatschappij, met de namen J.W. Pennings Sr. en bouwkundige C. Grootes en het motto *NOOIT GEDACHT en toch verkregen*. Wat ze nooit hadden gedacht te krijgen, staat er niet bij.

      Het is een woonhuis: de steen is vanaf de straat te zien.

      Let op:
      - de steen in de gevel van nummer 149
      - de zachte bocht in de weg, die nog altijd het oude slotenpatroon van de polder volgt
    attributes:
      check_note: "De enige foto van de steen is die van het Stadsarchief uit 1987."
    sources:
      - https://archief.amsterdam/beeldbank/detail/6a2c211d-2438-7916-899d-939b0d64b3b8
      - https://nl.wikipedia.org/wiki/Admiraal_De_Ruijterweg

- title: Sportplaza Mercator
  summary: A pool and sports complex dressed as an overgrown fortress at the head of the Rembrandtpark. Its 2,000 m² of black rubbery walls are slit every 20 cm for planters, about 50,000 plants of more than 50 kinds kept alive by computer-controlled drip lines, under grass roofs.
  body: |
    The west of the city had two worn-out pools: the Sportfondsenbad West of 1938, wedged between houses in the Cornelis Dirkszstraat, and the open-air Jan van Galenbad, which until the 1970s kept boys and girls apart behind a fence (only the boys' pool was heated). Both were replaced by one complex on the site of the outdoor pool, designed by VenhoevenCS (Ton Venhoeven, Richèl Lubbers) and opened in 2006, two years late.

    From a distance it looks like an overgrown bastion guarding the entrance to the 19th-century city. The stepped building is wrapped in a black, elastic skin with a slit every twenty centimetres, each holding a planter; a computer waters some 50,000 plants of more than fifty species, and grass covers the roofs. Through the glass front you see a small society in one building: lap swimmers, children, rheumatism patients in the therapy pool, gym-goers and people who only came for the café. Inside, Giny Vos's light work turns the ceiling into a starry sky over lit water when the main lights go off.

    It is a working pool and gym, with a 50-metre outdoor pool beside it.

    Look for:
    - the planted walls from the Jan van Galenstraat, and how much of them is green this season
    - the grass roofs on the stepped building
    - Eveline van Duyl's *Potkachel* on the central reservation in front
  category: civic
  lat: 52.371745
  lng: 4.846099
  address: Jan van Galenstraat 315
  links:
