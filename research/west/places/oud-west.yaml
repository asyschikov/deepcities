  nl:
    title: Overtoomse Sluis
    summary: "Hier sleepten ze vanaf 1515 schuiten over een dam, op houten rollen: de overtoom die de straat haar naam gaf. In 1809 kwam er een sluis voor een hoogteverschil van zo'n 15 cm, tot 1942. Op Piet Kramers brug uit 1948 herinnert een beeld van Hildo Krop eraan."
    body: |
      Een sluis van 144 meter lang, voor een verschil in waterhoogte van ongeveer 15 centimeter. Zo ging het hier vanaf 1809; daarvoor trok men de schuiten over een dam.

      Een overtoom is een helling waarover je een schuit op houten rollen van het ene water naar het andere trekt. In 1515 mocht Amsterdam er van het graafschap Holland een aanleggen, tussen de Kostverlorenvaart en de Schinkel. Alleen kleine, plaatselijke boten mochten erover; grote schepen moesten gewoon de voorgeschreven route door Holland blijven varen. De dam hield het water van Rijnland en dat van Amstelland uit elkaar. De weg en de vaart die naar de stad liepen, kregen de naam die nu nog op de straatbordjes staat: Overtoom. In 1809, onder Napoleon, maakte de overtoom plaats voor een schutsluis.

      In de twintigste eeuw zat die sluis de scheepvaart steeds meer in de weg. Op 1 juli 1942 nam de Schinkelsluis bij de Nieuwe Meer het werk over. De brug die er nu ligt, nummer 199, is een basculebrug in Amsterdamse School-stijl van Piet Kramer, gebouwd in 1948. Sinds 1971 rijdt tram 1 eroverheen. Op de brug staat een beeld van Hildo Krop dat aan de overtoom en de sluis herinnert.

      Let op:
      - het beeld van Hildo Krop op de brug
      - Piet Kramers basculebrug in Amsterdamse School-stijl
      - de verbrede Kostverlorenvaart, waar vroeger de sluis lag
    attributes:
      architect: Piet Kramer (brug)
      artist: Hildo Krop
    sources:
