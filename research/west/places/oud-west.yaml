  nl:
    title: Woonblok Derde Helmersstraat van L. van der Tas
    summary: "Een heel bouwblok uit 1898-1900 dat eruitziet als een rij los van elkaar gebouwde grachtenhuizen, maar dat één aannemer-ontwerper samenstelde, met ornamenten uit de catalogus en een uitgekiende balans tussen herhaling en variatie."
    body: |
      Elk huis lijkt zijn eigen ontwerp te hebben, maar dat is schijn. Dit hele blok tussen de Alberdingk Thijmstraat en De Genestetstraat, plus de hoekhuizen van de blokken ertegenover, is het werk van aannemer-ontwerper L. van der Tas, die tussen 1898 en 1900 met verschillende bouwers samenwerkte. De hoeken kwamen als eerste klaar. Van der Tas bond de huizen aan elkaar met een symmetrieas en een berekend spel van herhalen en afwisselen. Veel van de versiering, zoals de neorenaissance-sluitstenen met mannenhoofden, kwam regelrecht uit een bouwcatalogus. Het register prijst het als levendig en gaaf voorbeeld van 'aannemerseclecticisme' in de negentiende-eeuwse ring rond 1900.

      De Helmersbuurt is aangelegd volgens een plan van N. Redeker Bisdom uit 1882. Het bouwen werd aan particuliere bouwers overgelaten, en die vulden de wijk met gesloten blokken van meestal vijf lagen, opgebouwd uit huizen van drie ramen breed: variaties op het grachtenhuis.

      Let op:
      - sluitstenen met mannenhoofden boven de ramen
      - de hoekhuizen bij de kruising met De Genestetstraat, met verwante huizen van Van der Tas aan de overkant
      - de afwisseling van baksteenkleuren en gevelbekroningen van huis tot huis
    attributes:
      original_use: Huurwoningen
    sources:
    - Gemeentelijk monumentenregister 224031
- title: Helmersstraat crossroads
  summary: Three late-19th-century blocks on the crossing of the Eerste Helmersstraat and the Tweede Constantijn Huygensstraat, a textbook street corner in polychrome brick, with a bay window aimed at the Rijksmuseum.
  body: |
    The crossing of the Eerste Helmersstraat and the Tweede Constantijn Huygensstraat was built up just before and after Amsterdam annexed this corner of Nieuwer-Amstel in 1896. The city register treats the corner blocks as one typical 19th-century ensemble and listed three of them.

    The row of six houses at Tweede Constantijn Huygensstraat 32-42 was built by H. Groenendijk Czn., who also acted as developer and probably drew it himself; its decorative brickwork, typical of the early 1880s, is above the usual standard. Opposite, at numbers 43-53, the contractor-architect L. Beirer built a block in 1892 whose brown, red and yellow brick bands tie eight houses together. Its corner bay window may have been placed for the view of the Rijksmuseum. On the Eerste Helmersstraat, numbers 69-83 (1896–1899) look like eight different houses but use only four designs, each built twice in mirror image, with a Flemish gable and keystones with small men's heads.

    Look for:
    - Beirer's corner bay window and the slits in the brickwork that light his porches
    - the mirrored pairs among the eight Helmersstraat houses
    - decorative brickwork on numbers 32-42
