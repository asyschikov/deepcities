  nl:
    title: Van der Palmschool en Allebéschool
    summary: "Kolenhokken en wc's aan de straat, de klaslokalen achter, aan de zon: met deze twee ULO-scholen uit 1912 en 1914 draaide Publieke Werken als een van de eersten de schoolgevel om. Samen lijken ze één gebouw."
    body: |
      Wie langs deze scholen aan de Kostverlorenkade loopt, kijkt eigenlijk naar de achterkant van het schoolleven: personeelskamers, toiletten, fietsenhokken en kolenbergingen. De klaslokalen liggen achter, aan de speelplaats op het zuidoosten. Dat was nieuw. Tot dan toe vormden de grote lokaalramen altijd de nette straatgevel, welke kant die ook op keek. Publieke Werken draaide het hier om, omdat de stad ervan overtuigd was dat zonlicht kinderen gezond hield. De wet verplichtte het niet.

      Saai werd die achterkant niet. De daklijn springt op en neer, en elk raam verraadt wat erachter zit: grote ramen voor het tekenlokaal, piepkleine voor de wc's.

      Eigenlijk zijn het twee scholen. De Allebéschool (1912, nummer 35) was een jongensschool der eerste klasse met ULO-klassen, de Van der Palmschool ernaast (1914, nummer 34) een gemengde ULO-school. Omdat de opzet gespiegeld is, lees je ze als één gebouw, precies in de zichtlijn van de Paramaribostraat aan de overkant van het water. In de Van der Palmschool zitten nu een kinderdagverblijf, ateliers en woningen.

      Let op:
      - de verdiepte ingang onder een boog, met een smeedijzeren hek en uitkragend metselwerk erboven
      - een hijsbalk hoog in de gevel, om kolen en turf naar de zolderbergingen te takelen
      - rijtjes kleine wc-raampjes naast de hoge ramen van het tekenlokaal
    attributes:
      original_use: ULO-scholen
    sources:
    - Gemeentelijk monumentenregister 224054
- title: Observatiehuis, Vosmaerstraat
  summary: A 1914 "observation home" for troubled boys by Jan de Meyer and E.P. Messer, meant to look like a home rather than a prison. It was later a state institution, squatted in 1970 and turned into youth housing.
  body: |
    The society Hulp voor Onbehuisden (Help for the Homeless) was founded in 1904 by the couple Jonker-Clauser and began with night shelters, at first in the old Pesthuis. It later opened re-education homes, and this was its observation home for boys aged ten to eighteen: runaways, boys awaiting trial or placed under state supervision. They stayed three or four months while staff studied their behaviour and character and decided what would set them straight. With room for eighty, it was the largest private observation home of its kind in the country. Amsterdammers still call the organisation "the Stichting van Jonker".

    Architects Jan de Meyer and E.P. Messer had to design a building that was a *tehuis* (home), not a prison, yet one the boys could not escape from. Their answer was a symmetrical, articulated block with rhythmically placed windows between concrete piers, influenced by German architecture and close in style to K.P.C. de Bazel. It later became a closed state institution, the "Lucifergesticht", was squatted in 1970 and was converted into youth housing.

    Look for:
    - red brick with horizontal bands and a plinth of pale Pouillenay stone
    - dull-glazed geometric decoration above the entrance
    - the walls of the former courtyard along the Derde Kostverlorenkade and Busken Huetstraat
  category: civic
  lat: 52.359068
  lng: 4.856882
  address: Vosmaerstraat 1
  links:
  - label: Monumentenregister Amsterdam
    url: https://data.amsterdam.nl/monumenten/3a753842-305e-4d0b-a8d3-a71ba1a67393
  attributes:
    heritage_status: Municipal monument
    monument_number: '224062'
