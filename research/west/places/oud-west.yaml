  nl:
    title: Onderstation GEB Eerste Helmersstraat
    summary: "Een klein onderstation uit 1924 met een steil dak dat nergens voor nodig was maar wel mooi staat. In 1931 kreeg het aan de straat een symmetrische voorkant met hijstoren, in een zakelijker stijl."
    body: |
      Het steile zadeldak van het eerste gebouw had technisch gezien geen enkel nut. Het staat er toch, sinds 1924, en het register noemt het met zoveel woorden nutteloos.

      De Gemeentelijke Energiewerken lieten dit onderstation van 10 kV bouwen naar een ontwerp van Publieke Werken, waarschijnlijk omdat in de nieuwe wijken het stroomverbruik hard steeg. Het eerste gebouw stond op een binnenterrein achter een rijtje negentiende-eeuwse huizen. In 1931, rond de tijd dat de buren van de GGD hun gebouw kregen, werd het station doorgetrokken tot aan de straat.

      De twee bouwfasen zijn makkelijk uit elkaar te houden. In de jaren twintig kregen transformatorhuisjes puntgevels in Amsterdamse Schoolstijl; in de jaren dertig werden ze zakelijker, met voor elk onderdeel van de installatie een eigen bouwvolume. De straatgevel is getrapt en symmetrisch: in het midden een hijstoren om de transformatoren op te takelen, met aan weerszijden twee lagere blokken waar die transformatoren stonden. Schoorsteenkanalen, ventilatiekokers en zelfs de hekken zijn in het ontwerp meegenomen. Stroom wordt hier niet meer verdeeld.

      Let op:
      - de hijstoren in het midden, tussen de voormalige transformatorruimtes
      - de schoorsteenkanalen tegen de achterkant van de toren
      - de hekken, versierd met geometrische figuren van plaatmetaal
    attributes:
      original_use: Elektriciteitsonderstation
    sources:
    - Gemeentelijk monumentenregister 224004
- title: Pieter Langendijkstraat 39-45
  summary: A 1909 corner block by J. Herman that turns eight ordinary houses into one symmetrical design, with highlighted stairwells and emphasised corners.
  body: |
    This block of 1909 has four houses on the Pieter Langendijkstraat, two corner houses and one house each on the Brederodestraat and the Eerste Helmersstraat, with four flats per house.

    Its architect J. Herman (1862–1937) showed clear Jugendstil influences in his commercial buildings in the city centre, such as Rokin 44 for the precious-metal dealers Drijfhout & Zoon (1900). In his housing he kept the decoration simple. His achievement here, according to the city register, is to make one architectural unit out of many dwellings: the stairwells are emphasised and placed with care and the corners accentuated, giving the long front a strong rhythm of a centre and two wings. Herman's own block further along the same street at 47-53 (1912), a rather monotonous repetition of identical units, shows how much that composition matters.

    Look for:
    - the emphasised stairwell bays that set the rhythm of the façade
    - the accentuated corner houses
    - the more monotonous 1912 block at 47-53 for comparison
