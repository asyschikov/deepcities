  nl:
    title: Kinkerstraat-hoeken aan de Da Costakade
    summary: "Twee hoekblokken in neorenaissance tegenover elkaar aan de Kinkerstraat: Vinkzicht (1890–1891) van eigenbouwer J.S. Driessen en zijn tegenhanger uit 1893. Massawoningbouw, vermomd als een rij losse herenhuizen."
    body: |
      Massawoningbouw die er niet zo uit wil zien: dat is de truc van Vinkzicht, het hoekblok op Da Costakade 166-170 / Kinkerstraat 56-74 uit 1890–1891. Elk smal perceel lijkt een eigen huis te dragen, met een eigen winkelpui, eigen versiering en een eigen geveltop.

      Het blok staat bij de brug waar de Kinkerstraat de Da Costagracht oversteekt. De bouwer was J.S. Driessen, en over hem weten we niets. Hij was een eigenbouwer: een aannemer die voor eigen rekening huizen neerzette, meestal naar eigen ontwerp. Hun werk heette smalend 'revolutiebouw', maar zij leverden wel de goedkope woningen waar de stad om zat te springen. Het monumentenregister noemt nog een reden om het blok te bewaren: bij de stadsvernieuwing in de jaren zeventig is zoveel van dit soort bebouwing verdwenen.

      Aan de overkant staat Kinkerstraat 49-53 / Da Costakade 172, uit 1893, van een onbekende architect. Daar werkt hetzelfde idee: vijf huizen in Hollandse neorenaissance, met trap-, schouder- en tuitgevels in een levendig ritme. Tussen de Singelgracht en de Bilderdijkgracht is de Kinkerstraat nog een redelijk gave negentiende-eeuwse radiaalstraat.

      Let op:
      - het jaartal 1893 in de geveltop aan de Da Costakade
      - tegelmozaïeken in de boogvelden van het hoekhuis en gepleisterde schelpmotieven aan de kant van de Kinkerstraat
      - een afwisselende daklijn van trap-, schouder- en tuitgevels
    attributes:
      architect: J.S. Driessen (200608)
      original_use: Woningen met winkels
    sources:
    - Gemeentelijk monumentenregister 200608, 224037
- title: Da Costakade 83-91
  summary: A 1903 row of fourteen houses by J.H. Lesmeister and J.B. Sellmeijer that plays six façade types in brown, yellow and red brick around a symmetrical centre, one of Lesmeister's better works.
  body: |
    Around 1900 builders in the 19th-century ring tried to avoid endless rows of identical units by mixing façade types within one block, to get a picturesque effect like the individually built canal houses. This block on the Da Costakade is a good example. Its fourteen houses use six façade variants, differing in brick colour, window size and dormer. Most are dark brown brick, but the second and third houses from the centre on each side are yellow (south) and red (north). The house widths alternate between two and three windows, and that rhythm is deliberately broken near the centre.

    Builder-architect J.H. Lesmeister signed the elevations; J.B. Sellmeijer, who mostly built in the 1920s–1940s ring, signed the plans. In the city centre Lesmeister designed lavishly decorated buildings, but outside the Singelgracht he usually built plainer ones. The register counts this as one of his better works. Many doors, all balconies and many windows are original.

    Look for:
    - the yellow and red houses among the brown ones
    - original wide sash windows with divided fanlights, flanked by narrow side windows
    - verandas on the backs of the canal houses, seen through the gap in the Allard Piersonstraat
