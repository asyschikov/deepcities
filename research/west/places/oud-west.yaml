  nl:
    title: De Savornin Lohmanschool
    summary: "Een gereformeerde school uit 1911 van H. Bonda: een sobere bakstenen gevel met twee daktorentjes, een tegeltableau waarop de architect trots zijn naam zette, en een aangebouwde dienstwoning."
    body: |
      Naast de hoofdingang zette architect H. Bonda zijn eigen naam op een tegeltableau, en volgens het monumentenregister deed hij dat vol trots.

      De school werd opgericht door een protestantse vereniging voor 'scholen met den Bijbel' op gereformeerde grondslag. Het werd een mulo, een school voor meer uitgebreid lager onderwijs, met een fröbelklas erbij. De naam kwam van de gereformeerde politicus jhr. A.F. de Savornin Lohman (1837-1924).

      Bonda's bekendste gebouw is de Valeriuskliniek in Zuid (1909-1913). In 1897 bouwde hij samen met Berlage winkels aan de Raadhuisstraat. Deze school gaf hij een sobere, rationalistische voorgevel van drie traveeën breed, met een opvallend middendeel waar twee daktorentjes bovenop staan, en een aangebouwde dienstwoning. De roodbruine baksteen steekt af tegen blokken hardsteen. In tegel- en mozaïektableaus staan de oorspronkelijke naam en functie van de school nog altijd te lezen. Op de begane grond zitten nu een peuterspeelzaal en een kinderdagverblijf.

      Let op:
      - de twee torentjes boven op het middendeel
      - het tegeltableau naast de hoofdingang met Bonda's naam
      - de mozaïekstroken met de oorspronkelijke schoolnaam
    attributes:
      original_use: Christelijke MULO-school met dienstwoning
    sources:
    - Gemeentelijk monumentenregister 224058
- title: Prinses Julianaschool, Brederodestraat
  summary: A stately 1910 school by C.B. Posthumus Meyjes for the society "De Vrije Christelijke School", a monument to the fight for equal funding of religious education.
  body: |
    The inscription over the door records that this school was founded by the society "De Vrije Christelijke School", set up in 1879, the same year Abraham Kuyper founded his Anti-Revolutionary Party. Both pushed for Christian schools to receive the same public money as state schools, which only happened for primary education with the School Act of 1917.

    The architect, C.B. Posthumus Meyjes sr. (1859–1922), was a leading figure in Amsterdam building around 1900, known for the neo-Renaissance offices of the Holland Railway Company on the Droogbak. Here he designed a symmetrical building with a monumental entrance inspired by Amsterdam's old patrician houses. Inside, a central hall with a chequerboard floor of light brown and black tiles leads to the staircase, and a 1929 plaque marks the society's golden jubilee. The building is now a neighbourhood centre with a day nursery.

    Look for:
    - the founding society's name above the main entrance
    - the monumental doorway modelled on patrician houses
    - original windows and doors in the symmetrical front
