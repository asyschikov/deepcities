  nl:
    title: Johannapark
    summary: "Door een poortje onder Overtoom 353 kom je in een straatje dat je vanaf de Overtoom niet ziet: zes arbeidershuizen uit 1877-1878, een overblijfsel van de dwarsstraatjes naar het Vondelpark uit de tijd voor de annexatie."
    body: |
      Je loopt er zo voorbij. Tegenover de Staringstraat staat aan de Overtoom een laag huis van twee verdiepingen, nummer 353, van rond 1850. Er loopt een doorgang onderdoor, en daarachter ligt een heel straatje: het Johannapark.

      Ten zuiden van de Overtoom is het oude patroon van sloten en paden in de polder nog terug te zien in een reeks smalle zijstraatjes. Dit is er een van. Aan de parkkant zit tegenwoordig een muur, al doet een kaart uit 1915 vermoeden dat je vroeger zo het Vondelpark in kon lopen.

      In 1877-1878 bouwde P.J. de Greeuw, een architect over wie verder niets bekend is, hier zes huizen. Elk had een benedenwoning en een bovenwoning, voor arbeiders of de lagere burgerij, en voor die tijd waren ze best ruim. Het blok laat zien hoe bouwers elke vierkante meter benutten in de strook tussen Overtoom en park, die toen nog bij Nieuwer-Amstel hoorde. Aan de Kattenlaan, het straatje ernaast, stond een vergelijkbaar blok; dat is gesloopt.

      Let op:
      - de doorgang onder Overtoom 353
      - voordeuren in paren boven aan een gedeelde stoep
      - bruine handvormsteen met de oorspronkelijke voegen en schuiframen, deels met zes ruitjes
    attributes:
      original_use: Arbeiderswoningen (beneden- en bovenwoningen)
    sources:
    - Gemeentelijk monumentenregister 224024
- title: Vondelpark manure sheds
  summary: A rare 1883 double shed built to store the manure of the Vondelpark's dairy cows, and one of the very few buildings designed by city engineer J.G. van Niftrik, the man who planned much of 19th-century Amsterdam.
  body: |
    The Vondelpark was a private venture in its early years, and its association earned money from a dairy: in 1874 it built a farm with stalls for 25 cows on its yard by the Kattenlaan, selling the milk by the glass in the park. When open dung heaps were banned in built-up areas in 1883, the association had this double shed built to keep the manure. It had mixed feelings: storing dung indoors was hygienic and kept it "better and stronger", but the shed came out expensive and, the association said, added nothing to the beauty of the park.

    The designer was J.G. van Niftrik (1833–1910), city engineer from 1864 to 1901 and author of most of Amsterdam's extension plans, who also took private jobs, against the rules. This is one of the few buildings he designed. Like Isaac Gosschalk at the Westergasfabriek at the same time, he dressed up a purely utilitarian structure. Inside are fine cast-iron Polonceau trusses. The sheds are hard to see, tucked behind a hedge and a gate on the park's works yard.

    Look for:
    - two parallel spout gables with brick rowlocks under cross-tiled roofs
    - pilasters, arched friezes and stepped dentil courses in red and yellow brick
    - the old iron gate on the little drive from the Vondelpark
  category: industrial
  lat: 52.359175
  lng: 4.864779
  address: Vondelpark 6 (works yard by the Kattenlaan)
