  nl:
    title: Overtoom 429-439
    summary: "Een paleisachtig blok winkels en woningen uit 1880-1881 van N.H. Blank. De gevel klimt in trappen op naar een middenpaviljoen met een poortachtige ingang, geflankeerd door wat houterig uitgevallen engelen."
    body: |
      Midden in de gevel zit een ingang als een poort, en in de hoeken van de boog daarboven zitten engelen, of overwinningsgodinnen. Erg soepel zijn ze niet uitgevallen: het register noemt ze min of meer houterig.

      Het blok kwam er in 1880-1881, toen de zuidkant van de Overtoom nog bij Nieuwer-Amstel hoorde. Het waren herenhuizen, deels verdeeld in boven- en benedenwoningen, met een paar winkels erbij. Over de ontwerper, N.H. Blank, is weinig bekend. Hij was een van de vele architecten, bouwers en aannemers die goed verdienden aan de bouwwoede van de negentiende eeuw. Mogelijk trad hij ook op als projectontwikkelaar van een paar percelen in de buurt.

      Blank zette het neer als een paleis. Een middenpaviljoen van vier lagen en zes ramen breed zit tussen vleugels van drie lagen, die de hoek omgaan de Saxenburgerstraat en de Reyer Anslostraat in. Gepleisterde lisenen, hoofdgestellen en vensterbanken met lambrekijns gaven het de weelderige aanblik die men toen passend vond voor de gegoede burgerij. De doorlopende rij winkels op de begane grond groeide stukje bij beetje, ruwweg tussen 1900 en 1930; alleen de pui van nummer 437 is nog origineel.

      Let op:
      - de poortachtige ingang in het midden, met wat houterige engelen of overwinningsgodinnen in de boogvelden
      - balkons die met zuilen aan elkaar vastzitten
      - winkelpuien uit verschillende decennia, met Jugendstil op 431 en bovenlichten in Amsterdamse School-stijl op 433 en 435
    attributes:
      original_use: Herenhuizen, bovenwoningen en winkels
    sources:
    - Gemeentelijk monumentenregister 224045
- title: Overtoom 447
  summary: Two 1880s houses by IJ.G. Bijvoets, a villa for F.W. Schröder and its neighbour, designed as one stately classical pair on the corner of the Vondelkerkstraat.
  body: |
    Two separate clients, one design. Around 1880–1885 the architect and estate agent IJme Gerardus Bijvoets (1837–1901), also known for Hotel Central, drew a corner villa for F.W. Schröder of Nieuwer-Amstel and, in 1884, an upper-and-lower house next door for one G. Scheeve. He detailed both alike, so they read as a single building. The drawings place the neighbour "next to the police station", a police post that stood at Reyer Anslostraat 6 until recently.

    Where most of Bijvoets's work is Dutch Renaissance revival, here he chose a restrained style rooted in 18th-century classicism. Bluestone plinths carry brick façades crowned by a heavy white plaster entablature, with pilasters banded in sandstone at the corners. Today the two houses together form one apartment building.

    Look for:
    - the heavy white entablature that runs across both houses
    - sandstone bands on the corner pilasters
    - the wider window bays and central entrance of the villa compared with its neighbour's side porch
