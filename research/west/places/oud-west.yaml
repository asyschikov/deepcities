    summary: "De garage met showroom die Pon in 1955-1961 aan de Overtoom liet bouwen: een brutalistisch 'auto-huis van glas en beton' van Ben Ingwersen, met een ronde voorkant, een zwevende etalage en bovenop een galerijflat."
    body: |
      Een 'auto-huis van glas en beton' noemde de Volkskrant dit gebouw in februari 1961, en ook een 'pittig stuk architectuur'. Autobedrijf Pon liet hier aan de Overtoom een showroom, een garage en woningen bouwen. Het ontwerp kwam van Ben Ingwersen (1921-1996), die toen nog bij Commer de Geus werkte en later naam maakte met meer dan 45 naoorlogse scholen. Het ruwe beton heeft veel te danken aan de Unité d'Habitation van Le Corbusier in Marseille.

      Aan de Overtoom is de gevel rond, met een etalage die lijkt te zweven. De achterkant aan de Zocherstraat is hetzelfde idee, maar dan rechthoekig. Toen Autopon vertrok, zat Sanders Meubelstad er lange tijd in; nu onder meer een sportschool. In 2008 werd het een gemeentelijk monument, daarna kwam het in het landelijke Beschermingsprogramma Wederopbouw 1959-1965, en in 2016 volgde de status van rijksmonument.

      Let op:
      - de gebogen voorgevel aan de Overtoom met de zwevende showroometalage
      - de galerijflat boven de garage
      - de rechthoekige achtergevel aan de Zocherstraat
    attributes:
      architect: J.B. Ingwersen (bureau Commer de Geus)
      original_use: Garage met showroom en galerijflat
    sources:
    - Rijksmonumentenregister 532201
    - https://nl.wikipedia.org/wiki/Zocherstraat_(Amsterdam)
    - https://nl.wikipedia.org/wiki/Ben_Ingwersen
- title: Da Costaplein
  summary: The only almost circular square in Amsterdam's 19th-century ring, enclosed by curved housing blocks of 1905–1906 by builder-architect C.H. Eldering, with glazed bands and intact corner shopfronts.
  body: |
    The 19th-century ring around the old city is a grid of long, straight streets that follow the old polder ditches. The Da Costaplein is the exception: a nearly round square cut into four quarters by the Da Costastraat and the Allard Piersonstraat. Three of the four blocks date from 1905–1906 and were designed by the builder-architect C.H. Eldering, who also built several blocks on the Bilderdijkkade and Da Costakade. The fourth, north-east block is by L. van der Tas and is not part of the monument.

    The curved façades close the square in, and each corner is marked by a shop on the ground floor and a gable at roof level. Each house has two front doors side by side, one to the ground-floor flat and one to the stairs for the flats above. Eldering repeated the same elements across the blocks but varied the detail, so the whole stays lively. The register calls it of high urban-design value as a unique, almost round square in the ring.

    Look for:
    - the curved walls of the three Eldering blocks
    - glazed bands at sill height: green in the two southern blocks, brown in the third
    - arched friezes under the eaves and the well-preserved corner shopfronts
