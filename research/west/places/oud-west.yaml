  nl:
    title: Wandschilderingen van Mozes Cohen
    summary: "De Stedenmaagd zwaait een beurtschip uit terwijl de vuilnismannen drijfvuil uit de gracht vissen: twee wandschilderingen uit 1940 van Mozes Cohen, die in 1942 in Auschwitz omkwam. Bij de sloop in 2003 uitgezaagd, nu weer te zien in De Hallen."
    body: |
      De Amsterdamse Stedenmaagd leunt op het stadswapen en wuift een vertrekkend beurtschip na. Om haar heen is de Stadsreiniging aan het werk: een veger, een man met een spuit, twee vuilnismannen die met een dreg afval uit de gracht halen, en een fabriek waar kranen en mechanische grijpers het vuil verwerken.

      Schilder Mozes Cohen, geboren in Tiel in 1901, maakte deze twee aaneensluitende schilderingen in 1940: 'De Schoone Stad aan het IJ' en 'Vuilopruimers in actie'. Ze sierden het trappenhuis van de kantine waar de mannen van de reinigingsdienst schaftten, aan de Bilderdijkkade. Dat deel van de oude tramremise was in 1938 overgegaan naar de Stadsreiniging.

      Toen het gebouw in 2003 tegen de vlakte ging, werden de schilderingen uit de muur gezaagd en bewaard tot er een nieuwe plek voor was. Nu hangen ze weer zichtbaar in De Hallen. In 2021 adopteerde het 4 Mei Comité Oud-West de schilderingen, met een plaquette, ter nagedachtenis aan de 165 Joodse bewoners van Oud-West die werden weggevoerd en vermoord. Cohen, zelf Joods, werd op weg naar Zwitserland gearresteerd en via Drancy naar Auschwitz gebracht, waar hij op 7 november 1942 werd vermoord. Op het Kwakersplein staat nog een eerbetoon aan dezelfde dienst: De Ratelaar, een beeld van Rob Cerneüs.

      Let op:
      - de Stedenmaagd die het schip uitzwaait
      - de twee vuilnismannen die afval uit de gracht vissen
      - de vuilverwerking met kranen en mechanische grijpers
    attributes:
      artist: Mozes Cohen
      original_use: Wandschilderingen in het schaftlokaal van de Stadsreiniging
    sources:
