    architect: Dienst Publieke Werken (attributed to G.J. Rutgers)
    listed: 2008
    original_use: Secondary school (HBS) with caretaker's house
    artist: Hildo Krop
  photos:
  - commons:File:Zocherstraat 23-25 (1).jpg
  - commons:File:Zocherstraat 23-25 (3).jpg
  sources:
