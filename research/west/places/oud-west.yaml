  nl:
    title: Overtoom 343
    summary: "Een klein huis uit 1912–1913 dat zich voordoet als zeventiende-eeuws grachtenpand, met halsgevel en fronton, tussen grotere buren aan de Overtoom. Ontworpen door J.W. Hanrath."
    body: |
      Klein zijn valt op aan de Overtoom. Nummer 343 heeft een begane grond, één verdieping en een zolder, en staat tussen buren die groter zijn. Het werd in 1912–1913 gebouwd voor A. Schakel jr., op de plek van een ouder huis.

      Architect Johan Wilhelm Hanrath (1867–1932) had in München en Berlijn gestudeerd en bouwde vooral landhuizen in het Gooi. Net als De Bazel en Berlage hechtte hij aan ambachtelijk detail. Hier zette hij een zeventiende-eeuws fronton op een halsgevel, gaf de ramen een achttiende-eeuwse roedenverdeling en combineerde dat met strak, eigentijds metselwerk en sluitstenen van natuursteen. Iets vergelijkbaars deed hij bij het kantoor van 'Liefdadigheid naar Vermogen' aan de Kloveniersburgwal, waar de opdracht uitdrukkelijk vroeg om een gebouw dat in de omgeving opging en er niet modern uitzag. Het gemeentelijk register haalt de Atlas van de 19e-eeuwse Ring aan, die vermoedt dat ook hier de opdrachtgever het historische uiterlijk wilde.

      De voorgevel is bijna onveranderd, tot de kozijnen aan toe. Binnen werd het in 1958 een dokterswoning met praktijk, met de wachtkamer aan de voorkant, tot de praktijk in 1996 sloot.

      Let op:
      - de bakstenen halsgevel met driehoekig fronton en een bol op elke schouder
      - de gietijzeren hijsbalk onder het fronton
      - de schuiframen met twaalf kleine ruitjes en licht blauwachtig glas
    attributes:
      original_use: Woonhuis
    sources:
    - Gemeentelijk monumentenregister 224029
- title: Horse-tram depot, Overtoom
  summary: One of the few horse-tram depots left in the Netherlands, built in 1877 by Dolf van Gendt for the Amsterdamsche Omnibus Maatschappij, with stables, a sick bay for horses and a smithy, hidden down an alley off the Overtoom.
  body: |
    Around 1877 the Amsterdamsche Omnibus Maatschappij (AOM) reached the Overtoom and needed stables, a depot and an office here. The engineer-architect A.L. (Dolf) van Gendt designed them; it is one of his early works. The office stands on the street, its best side facing the Vondelpark. Behind it an alley leads to the depot, which is almost invisible from the street, with a *ziekenstal* (sick bay for horses) on the Overtoom side and a smithy at the Vondelpark end. The lofts held hay and straw.

    The buildings became redundant when Amsterdam switched to electric trams between 1900 and 1906. From 1936 a car hire and coach company used the site for about fifty years, which earned it the nickname Spijkersterrein. Stadsherstel later converted it into homes and shops. It was listed in 1999 as one of the few surviving horse-tram depots in the country.

    Look for:
    - the three Flemish gables of the depot, each with a projecting timber roof over a hoisting beam
    - arched double carriage doors and paired round-arched windows
    - two tram rails set into the alley as a reminder (probably laid after the conversion)
