  nl:
    title: Chirurgische kliniek Wilhelmina Gasthuis
    summary: "Twee chirurgen, een boogschutter en een pijl in een roos: Hildo Krop hakte ze in 1929 voor de ingangen van deze dubbele chirurgische kliniek van het Wilhelmina Gasthuis (1932–1933), een zakelijk-expressionistisch blok baksteen."
    body: |
      Boven de ingangen staan ze in steen: een chirurg, een pijl die in een roos prikt, een boogschutter en nog een chirurg. Hildo Krop maakte de gevelstenen in 1929.

      In oktober 1925 besloot de gemeenteraad dat het Wilhelmina Gasthuis een volwaardig academisch ziekenhuis zou worden. Publieke Werken ging daarna op veel plekken op het terrein aan de slag. Deze grote chirurgische kliniek, getekend door E.P. Messer, kwam er in 1932–1933. Dat het gebouw zo symmetrisch is, heeft een reden: het waren twee klinieken naast elkaar, in het begin waarschijnlijk een voor mannen en een voor vrouwen. Later was de rechterhelft voor de algemene chirurgie en lagen in beide helften mannen en vrouwen door elkaar.

      De kliniek beslaat de noordkant van het WG-plein. De achterkant staat tegen de kademuur van het Jacob van Lennepkanaal, de zijkant aan de Tweede Constantijn Huygensstraat. Bakstenen blokken klimmen op tot vijf verdiepingen, met daarboven nog een tussenverdieping en een zolder onder pannen schilddaken. Tussen de vleugels hangen haakvormige balkons. De ingangen hebben omlijstingen van graniet.

      Let op:
      - de reliëfs van Hildo Krop met chirurgen en een boogschutter bij de ingangen
      - de twee gespiegelde helften van de lange gevel aan het WG-plein
      - de kanaalkant, het best te zien vanaf de overkant van het Jacob van Lennepkanaal
    attributes:
      original_use: Chirurgische kliniek
    sources:
    - Rijksmonumentenregister 524815, 526940, 527012
    - Gemeentelijk monumentenregister 224040
- title: Wilhelmina Gasthuis eye clinic
  summary: "The university eye clinic of 1936–1938, a robust flat-roofed brick block whose stiff symmetry is softened only by hanging bay windows and canted balconies, with two sculptures of a nude woman, a sun, an owl and deer."
  body: |
    The *oogheelkundige kliniek* (eye clinic) followed from the council decision of October 1925 that made the WG a full academic hospital. The building decision came in 1933, the national government provided a work-creation grant in 1934, and Public Works completed the clinic in 1936–1938. Who in the department drew it is not known.

    It is a heavy composition of block-shaped brick volumes under flat roofs, all straight lines. The north front is strictly symmetrical, with a ground floor treated as a plinth. Three hanging bays punctuate the first floor; the two outer ones are linked by a covered balcony with white-tiled piers, like boxes beside a stage. Original multi-paned windows, partly steel and partly wood, break up the brick. A fourth storey was added around the 1960s. Low walls at either end of the front carry sculptures that refer to sight: a nude woman, a sun, an owl and two deer or antelopes.

    Look for:
    - the sculptures on the walls at both ends of the front
    - the hanging bays and the balcony with white-tiled piers
    - original steel and timber windows side by side
