  nl:
    title: How to Meet an Angel
    summary: "Een man met een rugzak op een ladder die vanaf het dak van een ggz-gebouw over de straat helt, armen wijd naar de hemel. Van Ilja en Emilia Kabakov (2009). De een ziet er hoop in, de ander een waarschuwing."
    body: |
      Kijk omhoog langs de achttien meter hoge glazen gevel van het Mentrum-gebouw aan de Eerste Constantijn Huygensstraat. Twee ladders lopen in het verlengde van de gevel door, een derde helt over de straat. Daarop staat een klein mannetje met een rugzak, de armen gespreid naar de lucht. De Russisch-Amerikaanse kunstenaars Ilja en Emilia Kabakov bedoelden het als beeld van herstel: de patiënt klimt sport voor sport terug op de maatschappelijke ladder, laat de kliniek achter zich en zoekt zijn beschermengel op. De rugzak is de geestelijke bagage die hij meedraagt.

      Burgemeester Job Cohen onthulde het werk op 26 september 2009, en meteen barstte de discussie los. Critici, onder wie striptekenaar Theo van den Boogaard, zagen er een uitnodiging tot zelfmoord in. Mentrum vond die discussie juist goed, omdat er op zelfmoord nog een taboe rustte. In 2010 schreef dichter Wim Brands een gedicht over het mannetje, met daarin de regel 'En ik denk dat ben ik'. Een deur verder, op nummer 36, hangen in Crystal Growth van Hans van Bentem vijftien glas-in-loodkristallen in de stalen 'bomen' die een andere glazen gevel overeind houden.

      Let op:
      - het mannetje helemaal boven op de ladder, het best te zien vanaf de overkant
      - de tekening van patiënt Wim, die in 2021 op het glas achter de voet werd aangebracht
      - Crystal Growth hiernaast, dat 's avonds van kleur verandert
    attributes:
      artist: Ilja en Emilia Kabakov
    sources:
    - https://nl.wikipedia.org/wiki/How_to_meet_an_angel
    - Buitenkunst Amsterdam 2668, 2667
- title: Roosje
  summary: A giant 2004 mural by Rombout Oomen of a man stumbling at the sight of a naked woman, painted over lines from Jacob van Lennep's erotic poem "Aan een roosje" on the street named after him. It sparked a national debate.
  body: |
    Building from the Singelgracht inward around 1880 left Nassaukade 351 with a big blind side wall on the Jacob van Lennepstraat, broken only by three tall narrow windows. In 2004 a request came in, probably from the owner, to have it painted; the wall already suffered from graffiti, mostly near the bottom. The artist Rombout Oomen took lines from "Aan een roosje" ("To a little rose"), an erotic poem by the street's namesake, the writer Jacob van Lennep (1802–1869), published only after his death. Across them he painted a man stumbling at the sight of a huge naked woman.

    The planning committee had no objection to "functional nudity", though it wondered about the scale. The neighbours were less sure. Some found it offensive, it was pelted with paint bombs, and it set off a national discussion about nudity in public art. Oomen eventually chose a diplomatic solution and retouched the pubic area. Locals simply call her Roosje, and she is a stop on the "Vrouwen van West" (Women of West) art route about how women are depicted in public art.

    Look for:
    - the lines of Van Lennep's poem across the wall
    - the painted frieze naming "Jacob van Lennep 1802-1869" and the black-painted plinth
    - the three narrow windows worked into the painting
