  nl:
    title: Drukkerij Reiminger
    summary: "Een boek- en steendrukkerij voor de gebroeders Reiminger, in 1913 ontworpen door P. van Dijk en Nagelvoort: ingetogen Amsterdamse Nieuwe Kunst, met grote ramen op een betonskelet. Een herinnering aan de nijverheid van de Bellamybuurt."
    body: |
      Eerst werd hier gedrukt; volgens de bouwtekeningen was er plaats voor ruim 55 arbeiders. Na 1923 lagen er onder meer pianolarollen opgeslagen.

      Tot 1896 hoorde de Bellamybuurt bij Nieuwer-Amstel, en die gemeente keek nauwelijks naar wat er achter de rooilijn verrees. De westelijke 'dorpskant' liep vol met bedrijven, van smidses tot grote fabrieken, zoals de koninklijke Haustfabrieken in ditzelfde blok. De gebroeders Reiminger lieten deze drukkerij bouwen naar een ontwerp uit 1913 van P. van Dijk en Nagelvoort. Ze loopt dwars door het blok heen, met een brede vleugel aan de Wenslauerstraat en een smallere aan de Jan Hanzenstraat, op een betonskelet van de Amsterdamse firma De Kondor. Beneden stond de drukpers; verder waren er papieropslag, een 'plakkerij' en boven de zetterij.

      De verbouwing van 1923 was het werk van G.F. La Croix. Nu zitten er allerlei bedrijven in. De gevels laten een ingetogen Amsterdamse versie van de Art Nouveau zien: geen zwierige lijnen, wel tegels, natuursteen naast baksteen, kleur, detail en heel veel ramen.

      Let op:
      - de klassieke driedeling in basement, middenzone en hoofdgestel, die net niet samenvalt met de verdiepingen
      - de laaddeur midden in de gevel aan de Wenslauerstraat
      - tegelwerk in Nieuwe Kunst-stijl en natuurstenen vensterdorpels
    attributes:
      architect: P. van Dijk en Nagelvoort
      original_use: Boek- en steendrukkerij
    sources:
    - Gemeentelijk monumentenregister 224036
- title: Kinkerschool
  summary: An 1884 Public Works girls' school of the "third class", a fee-paying school given a decorated neo-Renaissance front on the Nassaukade to embellish the new district.
  body: |
    Amsterdam's primary schools were graded by class, from free schools for the poor (first class) up to the fourth class, the most expensive. The third- and fourth-class schools were almost all single-sex. In 1886 the city had just eleven girls' schools, and the Kinkerschool was the first third-class girls' school in Oud-West, built in 1884 when the district was brand new. Pupils' families paid relatively high fees, and the building showed it.

    Public Works gave the better schools more distinguished, detailed fronts than the poor schools, partly to beautify the city. In the 1880s the architects saw the Dutch Renaissance, the style of the Golden Age, as the fitting style for public buildings and especially schools. The Kinkerschool's symmetrical front on the Nassaukade mixes red brick with yellow brick and pale stone, early-Renaissance and Gothic motifs. It is now used by the ROC of Amsterdam.

    Look for:
    - the two projecting bays crowned by triangular gables with arched friezes
    - stone columns with Venetian capitals beside the elliptical entrance arch
    - Gothic trefoil reliefs over the small attic windows
