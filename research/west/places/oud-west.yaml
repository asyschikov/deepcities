  nl:
    title: Eerste Helmersstraat 115-119
    summary: "Drie huizen uit 1887 voor de betere middenstand, met boven- en benedenwoningen. Bouwer L. Beirer kleedde ze bijna uitbundig aan: gekleurde baksteen en tegelmozaïek in geel, groen en blauw in de bogen en portieken."
    body: |
      Wie hier langs de Eerste Helmersstraat loopt, ziet ineens kleur: geel, groen en blauw tegelmozaïek in de bogen boven de ramen. Ze staan er sinds 1887, bijna tien jaar voordat Amsterdam dit stuk Nieuwer-Amstel annexeerde.

      Op zich volgen ze een oud recept. Elk huis is drie ramen breed en heeft een topgevel, zoals een grachtenpand. Binnen zat telkens een benedenwoning en een bovenwoning, bedoeld voor de welgestelde middenstand.

      Ontwerp en bouw lagen in één hand: aannemer-architect L. Beirer, lid van het architectengenootschap Architectura et Amicitia. Zijn handelsmerk was baksteen in verschillende kleuren. Daarmee smeedde hij een rij huizen aaneen tot één ontwerp, terwijl elk huis toch zijn eigen topgevel hield. Hier zette hij er bovendien tegelmozaïeken in geel, groen en blauw bij, in de bogen en in de portieken. Volgens het monumentenregister is het een gaaf voorbeeld van hoogwaardige aannemersarchitectuur, van een architect die voor Amsterdam belangrijk was.

      Let op:
      - het tegelmozaïek in geel, groen en blauw in de bogen boven de ramen
      - de betegelde wanden van de twee buitenste portieken, en de rode en gele baksteen in het middelste
      - drie topgevels die net genoeg verschillen om elk huis zijn eigen gezicht te geven
    attributes:
      original_use: Boven- en benedenwoningen
    sources:
    - Gemeentelijk monumentenregister 224013
- title: GEB substation, Eerste Helmersstraat
  summary: A small electricity substation of 1924 with a useless but handsome steep roof, extended in 1931 with a symmetrical hoisting-tower front in a more functional style.
  body: |
    The municipal energy company had this 10 kV substation built by Public Works, probably because power use was rising fast in the new districts. The first building of 1924 stood on an inner plot behind a row of 19th-century houses, under a steep saddle roof that served no technical purpose at all. In 1931, around when the neighbouring health service (GGD) building went up, the station was extended to the street.

    The two phases are easy to tell apart. In the 1920s transformer houses were given Amsterdam School gables; by the 1930s they became more functional, with each part of the plant in its own volume. The street front is a symmetrical stepped composition: a hoisting tower for lifting transformers, flanked by two lower blocks that held them, with chimney flues, ventilation shafts and even the gates designed as part of the whole. The building is no longer a substation.

    Look for:
    - the central hoisting tower flanked by the former transformer rooms
    - the chimney flues against the back of the tower
    - the gates, decorated with geometric sheet-metal shapes
