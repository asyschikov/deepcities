  nl:
    title: Katholieke jongensscholen Kanaalstraat
    summary: "Twee katholieke jongensscholen van C.P.W. Dessing uit 1900 en 1906: een zeldzame neogotische schoolgevel en zijn opvolger in Nieuwe Kunst. De kerk waar ze bij hoorden is gesloopt; nu werken er kunstenaars."
    body: |
      Twee meter breed moesten schoolgangen zijn, zei de wet. In de school op nummer 102 is de gang maar iets meer dan de helft daarvan. Dat kon: tot het einde van de schoolstrijd in 1917 kregen katholieke scholen geen geld van het rijk, en dus konden ze ook om sommige regels heen.

      Beide scholen hoorden bij de parochie van de Heilige Vincentius a Paolo. Kerk en pastorie stonden tussen de Jacob van Lennepkade en de Kanaalstraat, maar zijn gesloopt. Jongens en meisjes kregen in aparte gebouwen les.

      De eerste school, nummer 102 uit 1900, heeft een van de weinige neogotische schoolgevels in Amsterdam. Katholieken zagen de gotiek toen als hun eigen stijl. Zes jaar later bouwde Dessing de Cornelisschool, op 147-149, met een dienstwoning ernaast en een ruimere plattegrond. Daar zie je de Nieuwe Kunst doorschemeren, onder meer in de ronde ramen van het trappenhuis. In beide scholen zitten nu ateliers van kunstenaars, en in de westelijke helft van de benedenverdieping van nummer 149 wordt geklaverjast, door club De Burcht.

      Let op:
      - de neogotische details van nummer 102
      - de ronde en halfronde ramen in het trappenhuis van nummer 149
      - de dienstwoning die tegen de tweede school is aangebouwd
    attributes:
      original_use: Katholieke jongensscholen met dienstwoning
    sources:
