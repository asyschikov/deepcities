  nl:
    title: Kinkerschool
    summary: "Een meisjesschool \"der derde klasse\" uit 1884 van Publieke Werken: je betaalde er schoolgeld, en dat mocht je aan de rijk versierde neorenaissancegevel aan de Nassaukade zien. Mooi gebouwd om de nieuwe wijk op te sieren."
    body: |
      Hoe meer schoolgeld, hoe mooier de gevel. Amsterdamse lagere scholen waren ingedeeld in klassen, van de gratis armenschool (eerste klasse) tot de duurste, de vierde. Scholen van de derde en vierde klasse waren bijna allemaal voor jongens of voor meisjes alleen. In 1886 telde de stad maar elf meisjesscholen. De Kinkerschool, gebouwd in 1884 toen Oud-West nog gloednieuw was, was in die wijk de allereerste derdeklasseschool voor meisjes. Ouders betaalden er relatief veel, en dat moest je kunnen zien.

      Publieke Werken gaf de betere scholen een voornamere, fijner uitgewerkte gevel dan de armenscholen, mede om de stad op te sieren. In de jaren 1880 gold de Hollandse renaissance, de stijl van de Gouden Eeuw, bij de architecten als de juiste stijl voor openbare gebouwen en vooral voor scholen. De symmetrische gevel aan de Nassaukade combineert rode baksteen met gele baksteen en lichte natuursteen, en vroegrenaissance met gotiek. Nu zit het ROC van Amsterdam erin.

      Let op:
      - de twee vooruitspringende delen met driehoekige topgevels en boogfriezen
      - stenen zuiltjes met Venetiaanse kapitelen naast de ellipsvormige ingangsboog
      - gotische drieklavers in reliëf boven de kleine zolderraampjes
    attributes:
      architect: Dienst der Publieke Werken
      original_use: Meisjesschool der derde klasse
    sources:
    - Gemeentelijk monumentenregister 224057
- title: Busken Huetschool
  summary: An 1885 free school for the poor that breaks the rule. Public Works gave it a refined, picturesque neo-Renaissance corner front of a type rare in Amsterdam. Now the Leonardo da Vincischool.
  body: |
    Public school no. 47 was built in 1885 on the corner of the Potgieterstraat and the Da Costakade as a "first class" school, which in Amsterdam's grading meant a free school for the poor. It was later named after Conrad Busken Huet, a writer on the Golden Age. Poor schools normally got plain buildings, while fee-paying schools got the decorated fronts. This one is the exception. It was built with great refinement in the picturesque manner, which paid attention to the colour, texture, light and shade of materials.

    It is also a rare type: a corner school, with an L-shaped plan whose entrance sits in the cut-off corner and a vestibule that runs diagonally through the building. Two of its seven classrooms were for infants. Bright red brick is set off by yellow brick and bluestone, and the rainwater pipes are cleverly hidden inside the pilasters. Today it is the Leonardo da Vincischool.

    Look for:
    - the narrow corner front with a triangular gable topped by finials
    - the entrance with an ogee arch, between twisted columns crowned by Gothic finials
    - a yellow-and-red sawtooth frieze under the eaves
    - on the opposite corner (Potgieterstraat 49, in the oriel on the Da Costakade side), a relief portrait of the writer E.J. Potgieter, co-founder of the magazine *De Gids*, between two cartouches with a four-line verse about steam clouds, industry and the city wall "waxing from a half to a full disc": most likely a nod to the city growing past its old walls after 1870
  category: schools
  lat: 52.369308
  lng: 4.871869
  address: Potgieterstraat 34 / Da Costakade
  links:
  - label: Monumentenregister Amsterdam
    url: https://data.amsterdam.nl/monumenten/76eabe9e-e7ec-4cfa-8c53-447f8aedc184
  attributes:
    heritage_status: Municipal monument
    monument_number: '224055'
    built: '1885'
    architect: Dienst Publieke Werken
    listed: 2009
    original_use: Free primary school for the poor (first class)
    check: Still there?
    check_note: "The Potgieter medallion on the opposite corner (Potgieterstraat 49): latest photos 2008 and 2009."
  photos:
  - commons:File:Potgieterstraat 34-38 (1).jpg
  - commons:File:De Potgieter, Potgieterstraat 34 hoek Da Costakade foto 1.jpg
  sources:
  - city:224055
  - "https://geheugenvanwest.amsterdam/page/13150 (Onno Boers, Vereniging Vrienden van Amsterdamse Gevelstenen, 3 Feb 2011: in the oriel of Da Costakade corner Potgieterstraat 49 a stone with a relief portrait of E.J. Potgieter 1808-1875, co-founder of De Gids 1837; cartouches with the verse 'Iedre stoomwolk spelt verrassen / Vlijt en kunst in nieuw bedrijf / En de muur der stad aan 't wassen / Wordt van halve volle schijf'; probably not by Potgieter; likely refers to the western expansion after 1870 and the demolition of the walls). PDOK: Potgieterstraat 49 at 52.369084, 4.872033, about 25 m from the school pin. Round 4 merge."
  - "https://geheugenvanwest.amsterdam/page/13150"
  nl:
    title: Busken Huetschool
    summary: "Een armenschool uit 1885 die de regel breekt: Publieke Werken gaf hem een verfijnde, schilderachtige hoekgevel in neorenaissancestijl, een schooltype dat in Amsterdam zelden voorkomt. Nu de Leonardo da Vincischool."
    body: |
      Arme kinderen kregen in Amsterdam meestal een kale school; de versierde gevels waren voor scholen waar schoolgeld werd betaald. Hier ging het anders. Openbare school nummer 47, in 1885 gebouwd op de hoek van de Potgieterstraat en de Da Costakade, was een school 'der eerste klasse'. In de Amsterdamse rangorde betekende dat: gratis, voor de armen. Toch werd hij met veel verfijning gebouwd, in de schilderachtige trant, die let op kleur, structuur, licht en schaduw van het materiaal. Later kreeg hij de naam van Conrad Busken Huet, schrijver over de Gouden Eeuw.

      Ook de vorm is zeldzaam. Het is een hoekschool met een L-vormige plattegrond: de ingang zit in de afgeschuinde hoek en de vestibule loopt schuin door het gebouw. Van de zeven lokalen waren er twee voor kleuters. Helderrode baksteen wordt afgewisseld met gele baksteen en hardsteen, en de regenpijpen zitten handig verstopt in de lisenen. Tegenwoordig is het de Leonardo da Vincischool.

      Let op:
      - de smalle hoekgevel met driehoekige top en sierbollen
      - de ingang met ezelsrugboog, tussen gedraaide zuilen met een gotische kruisbloem erop
      - het geel-rode zaagtandfries onder de daklijst
      - op de hoek ertegenover (Potgieterstraat 49, in de erker aan de kant van de Da Costakade) een reliëfportret van schrijver E.J. Potgieter, medeoprichter van *De Gids*, tussen twee cartouches met een vierregelig vers over stoomwolken, vlijt en een stadsmuur die 'van halve volle schijf' wordt: hoogstwaarschijnlijk over de stad die na 1870 over haar oude muren heen groeide
    attributes:
      architect: Dienst der Publieke Werken
      original_use: Armenschool (eerste klasse)
      check_note: "Het Potgieter-medaillon op de hoek tegenover (Potgieterstraat 49): laatste foto's uit 2008 en 2009."
    sources:
    - Gemeentelijk monumentenregister 224055
- title: Tweede Werk- en Leerschool
  summary: A 1913–1914 domestic-science school for girls by Public Works, on the corner where four canals meet, with a directress's flat and laundry, ironing and cooking classrooms behind a German-influenced front.
  body: |
    The Werk- en Leerschool ("work and learning school") trained girls in housekeeping. Public Works built this second one in 1913–1914 on the northern tip of a triangular block, overlooking the "water square" where the Kostverlorenvaart meets the Westelijk Marktkanaal, the Hugo de Grootgracht and the Bilderdijkgracht. The plans show the curriculum: ironing rooms, separate laundries for "flat wash" and "wet wash", a drying room, kitchen classrooms, needlework rooms, and a large hall for prize-givings. The directress lived in the building, with her own room and dressing room behind the bay window above the entrance.

    In the early 1950s it was called the Tweede Openbare Huishoudschool (second public domestic school); today the ROC uses it. The architecture is massive and influenced by German design, with a classical touch: a central bay crowned by a triangular form like a pediment.

    Look for:
    - the wrought-iron entrance gate with three St Andrew's crosses (Amsterdam's arms) and "ANNO 1914"
    - the bay window and balcony of the directress's rooms above the entrance
    - the lower corner wing, with its broken hipped roof, that housed the service flat
  category: schools
  lat: 52.371018
  lng: 4.866387
  address: Elisabeth Wolffstraat 2 / Tweede Kostverlorenkade 5
