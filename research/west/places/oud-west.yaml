  nl:
    title: Woningbouw Rochdale, Bellamybuurt
    summary: "Arbeiderswoningen voor bouwvereniging Rochdale uit 1913-1919, van twee heel verschillende handen: de ritmische blokken van W. Noorlander en één hoek van G.F. La Croix die al helemaal Amsterdamse School is."
    body: |
      Leg ze naast elkaar en je ziet twee manieren van denken. Noorlander zette huizen van drie ramen breed achter elkaar. La Croix behandelde zijn hoekblok als één brok metselwerk, een dichte muur waarin hier en daar een raam is uitgespaard. Aan die ramen lees je af wat erachter zit: smalle, hoge spleten voor de trappenhuizen, enkele schuiframen voor de zijkamers, grote driedelige ramen voor de woonkamers.

      De coöperatieve bouwvereniging Rochdale bouwde hier rond de Hasebroekstraat, de Van Effenstraat en de Jan Pieter Heijestraat een complex van boven- en benedenwoningen. Het grootste deel is van W. Noorlander, uit 1913-1915: vier lagen flats van ongeveer 50 m², met voorin een woonkamer en achterin kleine slaapkamers en een keuken die uitkomen op een balkon over de hele breedte. Uitspringende geveldelen en dakhuizen met hijsbalken breken de lange gevels.

      Het hoekblok aan de Bellamystraat 117-123 en de Van Effenstraat 1-5 kwam in 1919 af en is van G.F. La Croix, een van de architecten van de Amsterdamse School. Voor de plattegrond leende hij een idee van A.J. Tijmensen, met de gang evenwijdig aan de voorgevel.

      Let op:
      - de hoekerkers van La Croix, die boven de daklijst uitsteken en houten raamomlijstingen in potdekselwerk hebben
      - de houten bloembakken onder de woonkamerramen
      - de 'schijndaken' van rode baksteen met noppen tussen de dakhuizen, tegen de bruine baksteen
    attributes:
      original_use: Arbeiderswoningen
    sources:
    - Gemeentelijk monumentenregister 224012, 224006
- title: Diamond works and Flick chocolate factory, Bellamystraat
  summary: "An 1866 steam-powered diamond works that from about 1897 shared its building with the Caspar Flick cocoa and chocolate factory, founded in 1745. Possibly one of the oldest surviving steam-powered diamond works."
  body: |
    Before 1896 the Bellamybuurt belonged to Nieuwer-Amstel, and along the Kostverlorenvaart small industry gathered: diamond works, tanneries, an iron foundry, bakeries and cocoa makers. In 1866 Petrus de Voys built a diamond works here, in two almost identical brick halls on an iron column frame, with a boiler house and a chimney. A steam boiler licence followed in 1869. About 75 men worked here.

    Around 1897 the building was split. The southern hall remained a diamond works, now called "Kimberley II". The northern hall became the cocoa factory "De Erven Caspar Flick", founded in 1745 on the Nes and forced to move after a big fire at its premises on the Overtoom. Both businesses left in 1924, and the complex was converted for a bakery, a furniture factory and a lingerie maker, which gave it its present look. It is still a multi-tenant business building. The house at number 89, used as the office, probably predates the factory.

    Look for:
    - the long brick halls behind the street front
    - the old office house at number 89
    - the whole west side of the factory, seen from the Caspar Flickhof
