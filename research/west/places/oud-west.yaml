  nl:
    title: Coöperatieve broodbakkerij Vooruit
    summary: "Een broodfabriek uit 1906 met woningen erboven, door J.W.F. Hartkamp jr. gebouwd voor de verbruikerscoöperatie Vooruit, op een opvallend vroeg betonskelet volgens het Monier-systeem. Een voorloper van De Dageraad van Berlage."
    body: |
      Waar men in die jaren nog ijzeren kolommen en balken gebruikte, koos architect J.W.F. Hartkamp jr. hier voor een betonskelet volgens het systeem Monier. Dat was uitzonderlijk vroeg.

      Verbruikerscoöperaties wilden de groothandel en de winkelier ertussenuit halen, zodat hun leden goedkoper aan hun dagelijkse boodschappen kwamen. In het Amsterdam van begin twintigste eeuw waren ze een van de grote socialistische projecten. Coöperatie Vooruit liet deze bakkerij bouwen naar een ontwerp uit 1905. Op de begane grond zaten de bakkerij, een kantoor, een bestuurskamer, een opslag voor melk, wasruimtes, een stalling voor de karren en op de hoek de winkel. De ovens en de kolen stonden in een lage achterbouw. Boven lagen alkoofwoningen, waarvan de bewoners keuken en wc deelden.

      Waarschijnlijk vroeg de Arbeiders Coöperatie De Dageraad Hartkamp in 1907 vanwege dit ontwerp om ook hun nieuwe gebouw met bakkerij te tekenen. Uiteindelijk zette Berlage zijn handtekening onder de gevels en maakte Hartkamp de plattegronden. Vooruit is soberder dan het schilderachtige werk van Berlage, maar even zorgvuldig.

      Let op:
      - de inrijpoorten in de Elisabeth Wolffstraat en de Van Alphenstraat
      - het schoorsteenkanaal boven de winkeldeur op de hoek, op een versierde kraagsteen die dwars door de kroonlijst steekt
      - balkons die om en om links en rechts zitten in plaats van in de middelste travee
    attributes:
      original_use: Coöperatieve broodbakkerij met bovenwoningen
    sources:
    - Gemeentelijk monumentenregister 224014
- title: Reiminger printing works
  summary: "A printing works designed in 1913 for the Reiminger brothers by P. van Dijk and Nagelvoort, an austere Amsterdam take on Art Nouveau with large windows on a concrete frame, a reminder of the Bellamybuurt's industrial past."
  body: |
    Until 1896 the Bellamybuurt belonged to Nieuwer-Amstel, which hardly regulated what was built behind the building line. Its western, "village" side filled with industry, from smithies to large factories such as the royal Haust factories in this same block. The Reiminger brothers had this letterpress and lithographic printing works built to a 1913 design by P. van Dijk and Nagelvoort. It runs right through the block, with a wide wing on the Wenslauerstraat and a narrower one on the Jan Hanzenstraat, on a concrete frame by the Amsterdam firm De Kondor. The drawings show room for more than 55 workers: the press on the ground floor, paper stores, a "plakkerij" (pasting room) and the typesetting room upstairs.

    In 1923 G.F. La Croix adapted it to store pianola music rolls, among other things. It is now a multi-tenant business building. The fronts show a restrained Amsterdam version of Art Nouveau: no curving lines, but tiles, stone mixed with brick, colour and detail, and many windows.

    Look for:
    - the classical base–middle–cornice division, offset from the actual floors
    - the central loading door on the Wenslauerstraat
    - Nieuwe Kunst tile work and stone window sills
