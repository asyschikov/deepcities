  nl:
    title: Zusterhuis Wilhelmina Gasthuis
    summary: "Het huis van de verpleegsters van het Wilhelmina Gasthuis, waartoe in 1903 werd besloten en dat waarschijnlijk Leguyt tekende in de trant van de gebouwen uit de jaren 1890: een lang blok aan de Eerste Helmersstraat met één uitbundige topgevel."
    body: |
      Hier woonden de zusters, het verplegend personeel van het ziekenhuis. Het zusterhuis kwam ongeveer tien jaar na de eerste gebouwen van het WG: de gemeenteraad besloot er op 15 juli 1903 toe, en de bestektekeningen zijn van 1904. Het ontwerp wordt toegeschreven aan Hendrik Leguyt, en het volgt hetzelfde recept als het poortgebouw en de eerste paviljoens: bruine baksteen, banden en sluitstenen van natuursteen, en rode verblendsteen rond ramen en deuren. Tot minstens 1965 deed het dienst als zusterhuis.

      De lange gevel aan de Eerste Helmersstraat zet liggende lijnen tegen staande. Rijen ramen wisselen af met vooruitspringende delen en terugliggende stukken met smalle gekoppelde ramen. Die zitten tussen de verdiepingen in en verraden zo waar de trappen lopen. Dakkapellen van hout en van baksteen en één rijk bewerkte topgevel breken de daklijn. De stroken siermetselwerk zitten alleen aan de straatkanten, om die deftiger te maken. Een later isolatiegebouw dat erop aanhaakt, heeft de oorspronkelijke symmetrie bedorven.

      Let op:
      - de uitbundige topgevel tussen de dakkapellen aan de straatkant
      - de smalle gekoppelde ramen tussen de verdiepingen, waar de trappen zitten
      - de kroonlijst met houten lijst en natuurstenen hoekblokken
    attributes:
      architect: H. Leguyt (Dienst der Publieke Werken, toegeschreven)
      original_use: Zusterhuis
    sources:
    - Gemeentelijk monumentenregister 224041
- title: Wilhelmina Gasthuis women's clinic and X-ray building
  summary: Hector Treub's women's clinic grew in two steps, a sober brick rear wing of about 1912 and, in 1925, an Amsterdam School corner block for X-rays and lectures with a parabolic window.
  body: |
    The women's clinic opened in June 1898 just east of the WG's main building, built specifically for the professor Hector Treub. At first it was not part of the WG, but it was soon absorbed into the hospital and kept growing.

    After a decision in March 1911, Public Works added the long rear wing. It is a strikingly plain pavilion in brown brick: rows of tall windows under segmental arches, a few stepped-back sections and canted corners, and none of the stone bands of the 1890s buildings. At the north end a little stair tower with a zinc spire climbs in stepped windows. In 1925 the department set a corner building at an angle against the old clinic, containing an X-ray department and a lecture hall. The national register calls it Amsterdam School. It has no entrance on the street side, only on the WG-plein.

    Look for:
    - the parabolic window with curved iron glazing bars on the WG-plein front of the X-ray building
    - its corner canopy and bluestone lintels
    - the stair tower with stepped windows and zinc spire on the 1912 wing
