  nl:
    title: Prinses Julianaschool, Brederodestraat
    summary: "Een statige school uit 1910 van C.B. Posthumus Meyjes sr., gebouwd voor de vereniging De Vrije Christelijke School: een stenen herinnering aan de schoolstrijd om evenveel overheidsgeld voor christelijk onderwijs."
    body: |
      Het jaar 1879 was druk voor christelijk Nederland. Abraham Kuyper richtte zijn Anti-Revolutionaire Partij op, en de vereniging De Vrije Christelijke School zag het licht. Allebei wilden ze hetzelfde: dat christelijke scholen net zoveel geld van de overheid kregen als openbare. Voor het lager onderwijs werd dat pas geregeld met de Schoolwet van 1917. Deze school van de vereniging staat er sinds 1910, en de tekst boven de deur laat geen twijfel over wie haar stichtte.

      Architect C.B. Posthumus Meyjes sr. (1859–1922) was rond 1900 een van de grote namen in de Amsterdamse bouwwereld. Hij is vooral bekend van het neorenaissancekantoor van de Hollandsche IJzeren Spoorweg-Maatschappij aan de Droogbak. Hier koos hij een symmetrische gevel met een deftige ingang, naar het voorbeeld van de oude Amsterdamse patriciërshuizen. Binnen loop je via een hal met een schaakbordvloer van lichtbruine en zwarte tegels naar het trappenhuis. Een plaquette uit 1929 viert het gouden jubileum van de vereniging. Nu zitten er een buurtcentrum en een kinderdagverblijf in.

      Let op:
      - de naam van de stichtende vereniging boven de hoofdingang
      - de monumentale ingang naar het voorbeeld van patriciërshuizen
      - de oorspronkelijke ramen en deuren in de symmetrische voorgevel
    attributes:
      original_use: Christelijke lagere school
    sources:
    - Gemeentelijk monumentenregister 224051
- title: Catholic boys' schools, Kanaalstraat
  summary: Two Catholic boys' schools of 1900 and 1906 by C.P.W. Dessing, a rare neo-Gothic school front and its Art Nouveau successor, survivors of a vanished parish complex. Now artists' studios.
  body: |
    Both schools belonged to the Catholic parish of Saint Vincent de Paul, whose church and presbytery stood between the Jacob van Lennepkade and the Kanaalstraat until they were demolished. Catholic boys and girls were taught in separate buildings, and until the end of the *schoolstrijd* in 1917 such schools got no state money, so they could even flout rules such as minimum corridor widths: here the corridors are only a little over half the legal two metres.

    The first school, at number 102 (1900), has one of the few neo-Gothic school fronts in Amsterdam, a style Catholics then saw as their own. Six years later Dessing built the Cornelisschool at 147-149 with a caretaker's house, on a roomier plan. Its round stairwell windows and forms show the influence of the Nieuwe Kunst. Both now house artists' studios, and the west half of the ground floor of number 149 is used by klaverjas (card game) club De Burcht.

    Look for:
    - the neo-Gothic details of number 102
    - the round and half-round windows of number 149's stairwell
    - the caretaker's house built onto the second school
