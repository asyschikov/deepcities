  nl:
    title: Paviljoens I en II Wilhelmina Gasthuis
    summary: "Twee van Leguyts oorspronkelijke ziekenpaviljoens uit 1891-1893, los van elkaar gezet zodat de zalen van meer kanten licht kregen en beter werden gelucht. In paviljoen II zit nog de granieten eerste steen die Wilhelmina legde."
    body: |
      Op 28 mei 1891 legde Wilhelmina de eerste steen voor het ziekenhuis dat haar naam zou dragen. Die granieten steen zit nog altijd in de zuidelijke kopgevel van paviljoen II.

      Toen het Wilhelmina Gasthuis in 1893 openging, lagen de ziekenzalen niet in één groot gebouw met een gang door het midden, maar verspreid over losse paviljoens. Licht van meer kanten en een betere luchtverversing: zo hoopte men de gevreesde ziektekiemen buiten de deur te houden. Hendrik Leguyt van Publieke Werken koos hetzelfde systeem dat A.C. Bleys gebruikte voor het Sint Elisabethgesticht en het OLVG.

      Paviljoen I en II staan naast elkaar, ten noorden van het hoofdgebouw met zijn doorrit. Het zijn twee lange blokken bruine baksteen; de eindeloze rijen zaalramen worden onderbroken door uitspringende delen op de hoeken en in het midden. Natuurstenen banden en sluitstenen en rode verblendsteen rond de ramen geven wat kleur. Vanaf 1930 zat in paviljoen I de universiteitskliniek voor interne geneeskunde, later ook cardiologie. Beide kregen later een derde verdieping die niet bij de oorspronkelijke detaillering past. Het ziekenhuis vertrok tussen 1981 en 1983; op het WG-terrein wonen en werken nu mensen.

      Let op:
      - de granieten eerste steen van 28 mei 1891, aan de zuidkant van paviljoen II
      - het ritme van uitspringende delen tegen de lange rijen ramen
      - de latere bovenverdiepingen: gepleisterd op paviljoen I, van baksteen op paviljoen II
    attributes:
      original_use: Ziekenzaalpaviljoens
    sources:
    - Gemeentelijk monumentenregister 224043, 224044
    - https://nl.wikipedia.org/wiki/Wilhelmina_Gasthuis
- title: Wilhelmina Gasthuis nurses' home
  summary: The home of the hospital's nursing sisters, decided in 1903 and probably designed by Leguyt in the style of the 1890s buildings, a long block on the Eerste Helmersstraat with a richly worked gable.
  body: |
    The *zusterhuis* (nurses' home) housed the nursing staff, who lived on the hospital grounds. It came a decade after the first buildings: the city council decided to build it on 15 July 1903 and the contract drawings date from 1904. The design is attributed to Hendrik Leguyt, and it follows the recipe of the gatehouse and the first pavilions: brown brick, natural-stone bands and keystones, and red facing brick around the windows and doors. It served as a nurses' home until at least 1965.

    The long front on the Eerste Helmersstraat plays horizontals against verticals. Rows of windows alternate with projecting bays and recessed sections with narrow paired windows, which sit between floor levels and betray the stairwells. Timber and brick dormers and one richly detailed gable break the roofline. Bands of decorative brickwork appear only on the street sides, to make them look grander. A later isolation building that hooks into it has spoiled the original symmetry.

    Look for:
    - the elaborate gable among the dormers on the street front
    - narrow paired windows set between floor levels, marking the stairs
    - the cornice with a timber crown moulding and stone corner blocks
