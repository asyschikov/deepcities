  nl:
    title: Meststallen Vondelpark
    summary: "Een zeldzame dubbele loods uit 1883, gebouwd voor de mest van de melkkoeien in het Vondelpark. Een van de weinige gebouwen die stadsingenieur J.G. van Niftrik ontwierp, de man die een groot deel van het negentiende-eeuwse Amsterdam uittekende."
    body: |
      De man achter de meeste uitbreidingsplannen van Amsterdam ontwierp ook een mestschuur.

      In zijn eerste jaren was het Vondelpark een particuliere onderneming, en de vereniging erachter verdiende bij met een melkerij. In 1874 bouwde ze op haar werfterrein aan de Kattenlaan een boerderij met stallen voor 25 koeien; de melk ging in het park per glas over de toonbank. Toen in 1883 open mesthopen in de bebouwde kom verboden werden, liet de vereniging deze dubbele loods neerzetten om de mest in te bewaren. Onverdeeld blij was ze er niet mee. Mest binnen bewaren was hygiënisch en hield hem 'beter en krachtiger', maar de loods viel duur uit en voegde volgens de vereniging niets toe aan de schoonheid van het park.

      Ontwerper was J.G. van Niftrik (1833-1910), stadsingenieur van 1864 tot 1901 en bedenker van de meeste uitbreidingsplannen van Amsterdam. Naast zijn ambtelijke werk nam hij, tegen de voorschriften in, ook particuliere klussen aan. Dit is een van de weinige gebouwen van zijn hand. Net als Isaac Gosschalk in dezelfde jaren bij de Westergasfabriek, gaf hij een puur nuttig bouwsel een mooi jasje. Binnen zitten fraaie gietijzeren Polonceau-spanten. Makkelijk te vinden zijn de loodsen niet: ze verschuilen zich achter een haag en een hek op de werf van het park.

      Let op:
      - twee evenwijdige tuitgevels met rollagen, onder daken met kruispannen
      - lisenen, boogfriezen en getrapte tandlijsten in rode en gele baksteen
      - het oude ijzeren hek aan het oprijlaantje vanuit het Vondelpark
    attributes:
      original_use: Mestberging van de melkerij in het park
    sources:
    - Gemeentelijk monumentenregister 200465
- title: Van der Palmschool and Allebéschool
  summary: Two 1912–1914 Public Works schools on the Kostverlorenkade that look like one, among the first in Amsterdam to turn their classrooms to the sun and hide toilets and coal stores behind a picturesque street front.
  body: |
    The Allebéschool (1912, at number 35) was a boys' school of the "first class" with advanced primary (ULO) classes; the Van der Palmschool next to it (1914, number 34) was a mixed ULO school. Because their compositions mirror each other, they read as a single building, standing in the sightline of the Paramaribostraat across the water.

    They mark a turning point in school design. Until then, classroom windows always formed the handsome street front, whatever the orientation. Here Public Works put the classrooms at the back, facing the sunny playground to the south-east, because the city believed sunlight was good for children's health, even though the law did not require it. Staff rooms, toilets, bicycle and coal stores moved to the front. The architects still made a picturesque front out of them, with a stepped roofline and window sizes that follow the rooms behind: big ones for the drawing room, tiny ones for the toilets. The Van der Palmschool now houses a day nursery, studios and homes.

    Look for:
    - the recessed, arched entrance with a wrought-iron gate and corbelled brickwork above
    - a hoisting beam high up, used to lift coal and peat into the attic stores
    - rows of small toilet windows next to the tall drawing-room windows
  category: schools
  lat: 52.358812
  lng: 4.856107
  address: Derde Kostverlorenkade 34-35
  links:
