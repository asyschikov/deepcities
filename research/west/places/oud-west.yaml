  nl:
    title: Depot Zuid-Hollandsche Bierbrouwerij
    summary: "Een bierdepot uit 1900 met woningen erboven, dwars door het hele bouwblok van de Bilderdijkstraat tot de Da Costakade. Wit gepleisterd en met een Brits tintje, wat in Amsterdam zelden voorkomt, en met een tegeltableau aan de grachtkant."
    body: |
      De bierkelder van dit depot was helemaal geen kelder. Het was een gebouw van één laag met dubbele muren, en bij elke ingang zaten twee deuren achter elkaar, waarschijnlijk als een soort sluis.

      De Zuid-Hollandsche Bierbrouwerij uit Den Haag had in Amsterdam een verdeelpunt nodig. In 1900 bouwden W. Langhout Gzn. en P.A. van Niftrik dit depot, dat de volle breedte van het bouwblok beslaat. Aan de Bilderdijkstraat staat een gebouw van vijf lagen, aan de Da Costakade een smaller exemplaar, en daartussen lagen lage gebouwen rond een binnenplaats. Er waren kantoren en opslag, een bottelarij, een ijsmachine (die vermoedelijk draaide op winterijs, uit de bevroren gracht gehakt) en een stal met hooizolder voor zestien paarden. Boven dat alles woonden mensen, in woningen met alkoven.

      De stijl is zeldzaam voor Amsterdam. Britse invloeden zie je aan het wit geschilderde pleisterwerk op de verdiepingen boven de rode baksteen, en aan de zorgvuldig geplaatste topgevels. Aan de grachtkant is de oude benedenverdieping nog af te lezen aan twee grote bogen: de ene leidde naar het depot, de andere naar de binnenplaats.

      Let op:
      - het tegeltableau aan de Da Costakade, typisch voor rond 1900
      - het witte pleisterwerk op de tweede en derde verdieping
      - erkers die op de bovenste verdieping halfrond worden, onder een gebogen pannendak
    attributes:
      architect: W. Langhout Gzn. en P.A. van Niftrik
      original_use: Bierdepot met bovenwoningen
    sources:
    - Gemeentelijk monumentenregister 224008
- title: De Nieuwe Liefde
  summary: A 1904 wine warehouse with tasting rooms, one of the first reinforced-concrete buildings in the Netherlands. Since then it has been a Catholic parish hall and cinema, a theatre school, and, since 2011, a house for debate and poetry.
  body: |
    L.J. Neumeyer designed this warehouse in 1903 for the wine merchants Ferwerda & Tieman, with tasting rooms on the floor under the two gables. It is one of the first buildings in the country with a reinforced-concrete frame (Monier system), although its concrete trusses copy the form of a timber roof. The eclectic front mixes a neo-Renaissance spout gable with a semicircular pediment and Art Nouveau horseshoe arches over the entrances.

    In 1931 the Catholic parish De Liefde bought it as a parish hall. It became known for its cinema, De Liefde. From 1974 the Amsterdam Theatre School used it, then Theater De Liefde until 2006. Wiel Arets's office opened up the interior in 2010–2011, and on 12 February 2011 Queen Beatrix opened De Nieuwe Liefde, Huub Oosterhuis's centre for debate, poetry and reflection, by reading a poem by Henriette Roland Holst.

    Look for:
    - the two overhanging spout gables of the tasting rooms
    - horseshoe arches over the entrances
    - patterned tiles in both porches and a terrazzo floor curving into the pavement
