  nl:
    title: Observatiehuis Vosmaerstraat
    summary: "Een \"observatiehuis\" voor ontspoorde jongens uit 1914 van Jan de Meyer en E.P. Messer, bedoeld als tehuis en niet als gevangenis. Later een gesloten rijksinrichting, in 1970 gekraakt en verbouwd tot jongerenhuisvesting."
    body: |
      Het moest een tehuis zijn en geen gevangenis, maar weglopen mocht er ook niet bij. Met die tegenstrijdige opdracht gingen Jan de Meyer en E.P. Messer in 1914 aan de slag. Ze kwamen met een symmetrisch, geleed blok, de ramen in een vast ritme tussen betonnen penanten. Er zit invloed van de Duitse architectuur van die tijd in, en het lijkt sterk op het werk van K.P.C. de Bazel.

      Opdrachtgever was Hulp voor Onbehuisden, in 1904 opgericht door het echtpaar Jonker-Clauser. De vereniging begon met nachtasielen, eerst in het oude Pesthuis, en opende later tehuizen voor heropvoeding. Hier kwamen jongens van tien tot achttien: zwervers, jongens die op hun proces wachtten of die ter beschikking van de regering waren gesteld. Drie à vier maanden lang werden hun gedrag en karakter bekeken, waarna werd besloten wat hen weer op het goede spoor kon zetten. Met plaats voor tachtig jongens was dit het grootste particuliere observatiehuis in zijn soort in Nederland. In de volksmond heet de organisatie nog altijd "de Stichting van Jonker".

      Later werd het gebouw een gesloten rijksinrichting, het "Lucifergesticht". In 1970 werd het gekraakt, daarna verbouwd tot woonruimte voor jongeren.

      Let op:
      - rode baksteen met horizontale banden en een plint van lichte Pouillenay-steen
      - de dof geglazuurde geometrische versiering boven de ingang
      - de muren van de vroegere binnenplaats langs de Derde Kostverlorenkade en de Busken Huetstraat
    attributes:
      original_use: Observatiehuis voor jongens
    sources:
    - Gemeentelijk monumentenregister 224062
- title: Zocherstraat HBS
  summary: "A 1916 secondary school by the Vondelpark with some of Hildo Krop's earliest building sculpture: birds of prey on the roofline and serpents biting their own tails. Now the apartment building Klein Vondelpark."
  body: |
    The 1863 Secondary Education Act made cities found an HBS, a practical, science-based secondary school for the commercial and civil-service middle class. Amsterdam's fifth three-year HBS was designed in 1916 by Public Works; a colleague, A.A. Kok, named G.J. Rutgers as the actual architect. Wartime shortages of building materials delayed its opening until September 1918.

    The school sits almost hidden on an inner plot between the Zocherstraat and the Frederiksstraat, with only a narrow, angled entrance front facing the street and its classrooms looking south over the Vondelpark. That entrance front is richly decorated with sculpture by Hildo Krop, made at the very start of his career as the city's unofficial sculptor. The register calls it one of the first Amsterdam schools enriched with art of such quality. Krop also carved the stair newels into animals. Most of the school moved to Osdorp in the 1960s; around 2013 the building was converted into flats called Klein Vondelpark.

    Look for:
    - two large birds of prey that give the narrow entrance front its silhouette
    - a serpent biting its own tail on each side of the entrance
    - on the park side, more figures and stairs to the garden decorated with snakes (best seen in winter)
  category: schools
