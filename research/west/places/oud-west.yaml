  nl:
    title: Oogheelkundige kliniek Wilhelmina Gasthuis
    summary: "De universitaire oogkliniek van 1936-1938: een stoer bakstenen blok met platte daken en strenge symmetrie, alleen verzacht door hangende erkers en schuine balkons. Aan beide kanten beelden van een naakte vrouw, een zon, een uil en herten."
    body: |
      Een zon en een uil bewaken de voorgevel van deze oogkliniek. Het beeldhouwwerk staat op lage muren aan weerszijden en toont verder een naakte vrouw en twee reeën of antilopen. Alles verwijst naar het zien.

      De kliniek kwam er na het raadsbesluit van oktober 1925, waarmee het Wilhelmina Gasthuis een volwaardig academisch ziekenhuis werd. In 1933 viel het besluit om te bouwen, in 1934 schoof het Rijk geld toe uit de werkverruiming, en tussen 1936 en 1938 zette Publieke Werken het gebouw neer. Welke ontwerper van de dienst het tekende, is niet bekend.

      Het is een zware compositie van bakstenen blokken onder platte daken, alles in rechte lijnen. De noordgevel is streng symmetrisch, met een begane grond die als sokkel is behandeld. Op de eerste verdieping hangen drie erkers. De buitenste twee zijn verbonden door een overdekt balkon met wit betegelde penanten, als loges naast een toneel. Oorspronkelijke ramen met veel ruitjes, deels van staal en deels van hout, breken het metselwerk. Ergens rond de jaren zestig kwam er een vierde verdieping bij.

      Let op:
      - de beelden op de muren aan beide uiteinden van de voorgevel
      - de hangende erkers en het balkon met wit betegelde penanten
      - oorspronkelijke stalen en houten ramen naast elkaar
    attributes:
      original_use: Universitaire oogheelkundige kliniek
    sources:
    - Gemeentelijk monumentenregister 224040
- title: Derde Helmersstraat block by L. van der Tas
  summary: A whole 1898–1900 block that looks like a row of separately built canal houses, but was composed by one builder-designer with catalogue ornaments and a careful balance of repeats.
  body: |
    The Helmersbuurt was laid out to a plan by N. Redeker Bisdom of 1882. Building was left to private builders, who filled it with closed blocks, usually five storeys high, of houses three windows wide, variations on the canal house.

    This block between the Alberdingk Thijmstraat and De Genestetstraat, with the corner houses of the blocks opposite, was designed by the contractor-designer L. van der Tas, who worked with several builders between 1898 and 1900. The corners went up first. Each house seems to have its own design, but Van der Tas tied them together with an axis of symmetry and a calculated play of repetition and variation. Much of the ornament, such as the neo-Renaissance keystones with men's heads, came straight out of a builder's catalogue. The city register praises it as a lively, intact example of "contractor's eclecticism" in the 19th-century ring around 1900.

    Look for:
    - keystones with men's heads above the windows
    - the corner houses on the De Genestetstraat crossing, echoed by Van der Tas's houses on the other side
    - the alternation of brick colours and gable shapes from house to house
