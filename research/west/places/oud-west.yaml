  nl:
    title: Overtoom 447
    summary: "Twee opdrachtgevers, één gebouw: IJ.G. Bijvoets ontwierp in de jaren 1880 een villa voor F.W. Schröder en het huis ernaast zo gelijk dat ze samen één statig, klassiek paar vormen op de hoek van de Vondelkerkstraat."
    body: |
      Twee opdrachtgevers, één ontwerp. Rond 1880-1885 tekende architect en makelaar IJme Gerardus Bijvoets (1837-1901), ook de man van Hotel Central, een hoekvilla voor F.W. Schröder uit Nieuwer-Amstel. In 1884 volgde ernaast een huis met boven- en benedenwoning voor een zekere G. Scheeve. Bijvoets gaf beide dezelfde detaillering, zodat ze als één geheel ogen. Op de tekening van het buurpand staat dat het 'naast het politiebureau' lag: een politiepost op de Reyer Anslostraat 6 die er tot voor kort nog zat.

      Meestal bouwde Bijvoets in de trant van de Hollandse Renaissance. Hier koos hij voor een ingetogen stijl die teruggaat op het classicisme van de 18e eeuw. Op plinten van hardsteen staan bakstenen gevels, bovenaan afgesloten door een fors, wit gepleisterd hoofdgestel. Op de hoeken lopen lisenen met banden van zandsteen. Tegenwoordig vormen de twee huizen samen één appartementencomplex.

      Let op:
      - het zware witte hoofdgestel dat over beide huizen doorloopt
      - de zandstenen banden in de hoeklisenen
      - de bredere raamassen en de middeningang van de villa, tegenover de portiek opzij bij de buren
    attributes:
      original_use: Villa en beneden- en bovenwoning
    sources:
    - Gemeentelijk monumentenregister 224030
- title: Johannapark
  summary: A hidden lane of six 1877–1878 working-class houses, reached through a passage under an older house on the Overtoom, a relic of the alleys that ran down to the Vondelpark before annexation.
  body: |
    South of the Overtoom, the old ditch-and-path pattern of the polder still shows in a series of narrow side streets. The little street called Johannapark is one of them, and you would never guess it is there: it is reached through a passage in the two-storey house at Overtoom 353, built around 1850, opposite the Staringstraat. A wall now closes it off from the Vondelpark, though a 1915 map suggests it once ran through.

    In 1877–1878 the otherwise unknown architect P.J. de Greeuw built six houses here, each with an upper and a lower flat for working-class or lower-middle-class tenants, and fairly spacious for their time. The block shows how builders squeezed every square metre out of the strip between the Overtoom and the park, then still part of Nieuwer-Amstel. A similar block on the parallel Kattenlaan has been demolished.

    Look for:
    - the passage under Overtoom 353
    - paired front doors at the top of shared stoops
    - hand-made brown brick with original struck joints and sash windows, partly six-paned
