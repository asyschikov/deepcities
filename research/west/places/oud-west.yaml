  nl:
    title: Vrouwenkliniek en röntgengebouw Wilhelmina Gasthuis
    summary: "De vrouwenkliniek van Hector Treub groeide in twee stappen: een sobere bakstenen achtervleugel van rond 1912 en in 1925 een hoekgebouw in Amsterdamse School-stijl voor röntgen en colleges, met een paraboolvormig raam."
    body: |
      In de gevel van het röntgengebouw aan het WG-plein zit een raam in de vorm van een parabool, met gebogen ijzeren roeden. Het hoort bij de uitbreiding uit 1925 van een kliniek die ooit speciaal voor één hoogleraar werd gebouwd.

      In juni 1898 ging de vrouwenkliniek open, direct ten oosten van het hoofdgebouw van het Wilhelmina Gasthuis, speciaal gebouwd voor hoogleraar Hector Treub. Eerst viel ze buiten het ziekenhuis, maar al snel werd ze erbij getrokken, en daarna bleef ze groeien.

      Na een besluit uit maart 1911 bouwde Publieke Werken de lange achtervleugel. Een opvallend kaal paviljoen van bruine baksteen: rijen hoge ramen onder segmentbogen, wat delen die verspringen, een paar schuine hoeken, en niets van de natuurstenen banden die de gebouwen uit de jaren 1890 wel hebben. Aan de noordkant klimt een traptorentje omhoog met trapsgewijs geplaatste raampjes, tot aan een spits van zink.

      In 1925 zette de dienst er een hoekgebouw schuin tegenaan, met een röntgenafdeling en een collegezaal. Het rijksmonumentenregister rekent het tot de Amsterdamse School. Aan de straatkant zit geen ingang; die vind je alleen aan het WG-plein.

      Let op:
      - het paraboolraam met gebogen ijzeren roeden in de gevel aan het WG-plein van het röntgengebouw
      - de luifel op de hoek en de lateien van hardsteen
      - het traptorentje met trapsgewijze raampjes en zinken spits op de vleugel van 1912
    attributes:
      original_use: Vleugel vrouwenkliniek; röntgenafdeling en collegezaal
    sources:
    - Rijksmonumentenregister 524817
    - Gemeentelijk monumentenregister 224032
- title: Wilhelmina Gasthuis surgical clinic
  summary: A symmetrical double clinic of 1932–1933 on the canal side of the WG-plein, in the brick "businesslike expressionism" of Public Works, with stone reliefs of surgeons and an archer by Hildo Krop.
  body: |
    After the city council decided in 1925 that the Wilhelmina Gasthuis would be a full academic hospital, Public Works rebuilt much of the site. This large surgical clinic of 1932–1933 was designed by E.P. Messer. It is symmetrical because it was two clinics side by side, probably one for men and one for women at first; later the right-hand half served general surgery and both were mixed.

    The building fills the north side of the WG-plein, with its back against the quay wall of the Jacob van Lennepkanaal and a side front on the Tweede Constantijn Huygensstraat. Its brick volumes rise to five storeys plus a mezzanine and attic under tiled hipped roofs, with hook-shaped balconies between the wings. The entrances have granite surrounds and reliefs. Hildo Krop carved the figurative stones in 1929: two surgeons, an arrow piercing a rose, and an archer.

    Look for:
    - Hildo Krop's reliefs of surgeons and an archer at the entrances
    - the mirror-image halves of the long front on the WG-plein
    - the canal side, best seen from across the Jacob van Lennepkanaal
