  nl:
    title: Vondelkerk
    summary: "Pierre Cuypers zette deze kerk gewoon midden op de Vondelstraat, op een ovaal eiland waar de straat omheen moet: de eerste vrijstaande kerk van Amsterdam sinds de middeleeuwen. In 1904 ging de toren in vlammen op, in de nieuwjaarsnacht van 2026 nog een keer."
    body: |
      Rond 1870 bood Cuypers een kerk aan op grond waarover hij zelf de zeggenschap had. Zo kon hij niet alleen het gebouw maar ook de omgeving naar zijn hand zetten. De Vondelstraat splitst zich hier en buigt aan twee kanten om het eiland heen. In 1872 ging de eerste steen erin. Toen het koor stond, was het geld op; pas een nationale loterij bracht in 1875 45.000 gulden binnen. Koningin Sophia stelde twee salonlampen als prijs beschikbaar, paus Pius IX een camee. In 1880 ging de Heilig Hartkerk open.

      Op 8 november 1904 viel bij loodgieterswerk een vuurpot om. De houten toren van vijftig meter vatte vlam, en toren en dak kwamen naar beneden. Jos Cuypers gaf de kerk een iets lagere toren terug. In 1978 ging de deur dicht. De kerk werd verkocht voor één gulden, gekraakt, door een stichting gered en in 1986 heropend als plek voor cultuur. In de nieuwjaarsnacht van 2026 was het weer raak: opnieuw brand, en opnieuw stortten delen in, de hoofdtoren incluis.

      Ten noorden van de kerk, wat van de straat af, staat de pastorie uit 1882.

      Let op:
      - de achthoekige vieringtoren, het hart van de centraal opgezette plattegrond
      - het hek rond de kerk, uit 1884
      - het balkon van de pastorie, dat over de volle breedte van de gevel loopt en rust op vijf zware stenen consoles: zoiets zie je zelden aan een voorgevel
    attributes:
      architect: P.J.H. Cuypers; toren herbouwd door Jos Th.J. Cuypers
      original_use: R.K. Kerk van het Heilig Hart van Jezus en pastorie
    sources:
      - https://nl.wikipedia.org/wiki/Vondelkerk
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/5907
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/524833

- title: Hollandsche Manege
  summary: The oldest riding school in the Netherlands hides behind a row of Vondelstraat houses. A passage leads to an 1882 riding hall modelled on the Spanish Riding School in Vienna.
  body: |
    The riding school goes back to 1744, when it stood on the corner of the Lijnbaansgracht and Leidsegracht. Mozart and his sister Nannerl performed in the upstairs room of the riding master's house there in 1766. When the Leidsegracht was extended to the Singelgracht in 1881 the old building was demolished. A.L. van Gendt, known as the architect of the Concertgebouw, designed the new one, completed in 1882 near the park, which riders then used a lot.

    From the street you see almost nothing: the entrance is a passage under the houses of the Vondelstraat. Behind it lies the arena under an iron roof, surrounded by stables, a staircase, a foyer and balconies for spectators and an orchestra, all almost unchanged. A wing on the Overtoom side from 1889 was demolished in 1969.

    In the early 1970s the association's chairman wanted to demolish it and build a new riding school in the Amsterdamse Bos; protests stopped the plan. It was restored in 1986, and Stadsherstel has owned it since 2018. Since 2014 it has also housed a "living horse museum". Side-saddle riding in the Vondelcarrousel was added to the Dutch inventory of intangible heritage in 2015.

    Look for:
    - the iron-and-glass canopy over the passage from the vestibule to the hall
    - the iron roof trusses and balustrades of the arena
  category: civic
  lat: 52.360978
  lng: 4.872259
  address: Vondelstraat 140
  links:
    - { label: Rijksmonumentenregister (5908), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/5908" }
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Hollandsche_Manege" }
