    - research/ams-school/places/oud-west-baarsjes.yaml (sibling map)
  nl:
    title: Politiebureau Verkeerswezen (Overtoom 37-43)
    summary: "Rond 1932 zouden vanuit dit bureau de eerste verkeerslichten van Amsterdam zijn bediend. Het gebouw van de verkeerspolitie uit 1924, door P.L. Marnette, golft met zijn gevel naar voren en naar achteren, met beneden een ronde loge voor de brigadier."
    body: |
      Rond 1932 zouden de eerste verkeerslichten van de stad vanuit dit gebouw zijn bediend. Zo snel groeide het autoverkeer.

      P.L. Marnette van Publieke Werken ontwierp het Politiebureau voor het Verkeerswezen aan den Overtoom. Het werd gebouwd in 1923-1924 en ging op 1 oktober 1924 open. Hier zaten de brigades op motor en fiets, hier werden auto's gekeurd en vrachtwagens gewogen, en achterin stonden de paarden. Bij een verbouwing halverwege 1994 bleven alleen de voorgevel en de aansluitende delen over. Beneden zit nu een sportschool, boven wonen mensen.

      De gevel is levendige Amsterdamse School. Tussen de garagedeuren en de hoofdingang zit een afgeplatte, ronde loge waar de brigadier de wacht hield. Daarboven buigt de gevel achteruit, naar voren en weer terug, in holle en bolle lijnen, met twee raamstroken van elk tien gekoppelde vensters. Het bovenste deel heeft bijna geen ramen en eindigt in een getande rand met puntige hoeken.

      Let op:
      - de ronde brigadiersloge in de met natuursteen beklede benedenverdieping
      - de zware dubbele deuren met expressief smeedwerk en ovale ramen
      - de kleine raampjes om de vlaggenmasten te bedienen, met driedelige vlaggenmasthouders
    attributes:
      architect: P.L. Marnette (Publieke Werken)
      original_use: Politiebureau voor het verkeerswezen
    sources:
      - https://nl.wikipedia.org/wiki/Overtoom_39-41_(Amsterdam)
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/492082

- title: Atlanta (Stadhouderskade 5-6)
  summary: An American-minded 1929 office block for rent, with a concrete frame, a lift and a car dealer downstairs, then thought risky because it stood so far from the city centre.
  body: |
    In the 1920s a purpose-built office was still a fairly new type in Amsterdam; at first, larger canal houses had been converted into offices. Frans Warners, an architect strongly oriented towards America who was also known for luxury apartment buildings, designed Atlanta in 1929 as a speculative office block. It had a concrete frame and an automatic lift, with a car business on the ground floor. Building such an ambitious office for rent was a gamble, because by the ideas of the time this spot lay far from the real business district.

    The building is detailed in the Amsterdam School manner: red hand-moulded brick with deep joints, and two roughly half-round bays framing the front above the ground floor. The frames of the top lights sit just in front of the wall and the lower part of the windows just behind it, a typical Amsterdam School detail. With its neighbour, the AMVJ building, it is part of a row of large buildings just outside the old city moat.

    Look for:
    - the two half-round bays
    - the heavy recessed top floor with vertical strips of decorative brickwork
    - building sculpture by L.S.W. van der Noordaa
  category: industrial
  lat: 52.363156
  lng: 4.879325
  address: Stadhouderskade 5-6
  links:
    - { label: Gemeentelijk monument (224005), url: "https://data.amsterdam.nl/monumenten/1d93cfa2-3705-4f4e-8d6e-698ff1fa14e4" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "224005"
    built: "1929"
    architect: F.A. Warners
    listed: 2008
    original_use: Rental offices and car showroom
    artist: L.S.W. van der Noordaa
  photos:
    - commons:File:Amsterdam Stadhouderskade 5.jpg
  sources:
    - city:224005
  nl:
    title: Atlanta (Stadhouderskade 5-6)
    summary: Een op Amerika gericht verhuurkantoor uit 1929 met betonskelet, lift en autobedrijf beneden. Toen een riskante onderneming, omdat het zo ver van de eigenlijke 'city' lag.
    body: |
      In de jaren twintig was een gebouw dat speciaal als kantoor werd ontworpen nog een vrij nieuw type; eerder waren vooral grotere grachtenhuizen tot kantoor verbouwd. Frans Warners, een sterk op Amerika gerichte architect die ook bekend werd met luxe appartementengebouwen, ontwierp Atlanta in 1929 als modern verhuurkantoor met betonskelet en automatische lift, en een autobedrijf op de begane grond. Zo'n ambitieus kantoor voor de verhuur was een riskante onderneming, want volgens de opvattingen van toen lag de plek ver van de 'city'.

      Het gebouw is geheel in Amsterdamse Schoolstijl gedetailleerd: rode handvormsteen met diepliggende voegen en twee min of meer halfronde erkers die het gevelvlak omkaderen. De bovenlichten liggen iets vóór het gevelvlak en het onderste deel van de vensters juist erachter. Samen met het A.M.V.J.-gebouw ernaast hoort het bij een reeks grote gebouwen net buiten de oude vestinggracht.

      Let op:
      - de twee halfronde erkers
      - de robuuste, teruggelegen kapverdieping met verticale stroken siermetselwerk
      - het bouwbeeldhouwwerk van L.S.W. van der Noordaa
    attributes:
      original_use: Verhuurkantoren en autobedrijf
    sources:
      - https://data.amsterdam.nl/monumenten/1d93cfa2-3705-4f4e-8d6e-698ff1fa14e4

- title: AMVJ building
  summary: The 1928 home of the Amsterdam YMCA was an early high-rise in central Amsterdam, with a swimming pool inside. Granite reliefs by Louis van der Noordaa run along the first floor.
  body: |
    With eight storeys on the Stadhouderskade and seven on the Vondelstraat, it was an early high-rise in the city. The register calls it "American Style" with Amsterdam School influence: a concrete frame behind solid brick walls, with a bent façade line along the Vondelstraat.

    The *Amsterdamsche Maatschappij voor Jongemannen* (A.M.V.J.) began in 1909 as the Dutch branch of the YMCA, on a Reformed Christian basis, and aimed at "the spiritual, physical and social welfare of young men of all classes". Sport was central, so its headquarters, designed by Foeke Kuipers and completed in 1928, had a swimming pool, as well as a hall with an organ, a study room, a library and guest rooms. In July 1943 a WA (Dutch Nazi militia) paper reported that the building was now under National Socialist management. After the war the association was renamed *Algemene Maatschappij voor Jongeren*. The building is now part of a hotel.

    Look for:
    - Van der Noordaa's carved granite blocks with figurative reliefs along the first floor
    - the main entrance against the north wall on the Stadhouderskade
    - the bent façade along the Vondelstraat
  category: civic
  lat: 52.363085
  lng: 4.879458
  address: Vondelstraat 2-8, Stadhouderskade 7-9
  links:
    - { label: Gemeentelijk monument (224042), url: "https://data.amsterdam.nl/monumenten/581b09e1-6fd2-499f-8ae7-2ee0a198bc4f" }
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Stadhouderskade_7" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q21707612" }
    - { label: Joods Amsterdam – Vondelstraat, url: "https://www.joodsamsterdam.nl/vondelstraat/" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "224042"
    built: 1927–1928
    architect: Foeke Kuipers
    listed: 2008
    original_use: YMCA club house with swimming pool
    artist: Louis van der Noordaa
  photos:
    - commons:File:Exterieur AMVJ-gebouw, Amsterdam, 929-2079.jpg
  sources:
    - city:224042
    - https://www.joodsamsterdam.nl/vondelstraat/ (1943 WA report)
  nl:
    title: A.M.V.J.-gebouw
    summary: "Het gebouw van de Amsterdamse YMCA uit 1928 was vroege hoogbouw in de binnenstad, met een zwembad binnen. Langs de eerste verdieping lopen granieten reliëfs van Louis van der Noordaa."
    body: |
      Acht bouwlagen aan de Stadhouderskade, zeven aan de Vondelstraat: in 1928 was dat vroege hoogbouw voor deze stad. Het monumentenregister spreekt van 'American Style' met invloed van de Amsterdamse School. Achter stevige bakstenen muren zit een betonskelet, en langs de Vondelstraat maakt de gevel een knik.

      Opdrachtgever was de *Amsterdamsche Maatschappij voor Jongemannen* (A.M.V.J.), in 1909 begonnen als Nederlandse tak van de YMCA, op gereformeerde grondslag. Het doel was het geestelijk, lichamelijk en maatschappelijk welzijn van jonge mannen uit alle lagen van de bevolking. Sport stond voorop, dus het hoofdkwartier dat Foeke Kuipers ontwierp kreeg een zwembad, maar ook logeerkamers, een bibliotheek, een studiezaal en een zaal met een orgel. In juli 1943 meldde een blad van de WA dat het gebouw voortaan onder nationaalsocialistische leiding stond. Na de oorlog ging de vereniging verder als *Algemene Maatschappij voor Jongeren*. Het gebouw hoort nu bij een hotel.

      Let op:
      - de gebeeldhouwde granieten blokken van Van der Noordaa met figuratieve reliëfs langs de eerste verdieping
      - de hoofdingang tegen de noordmuur aan de Stadhouderskade
      - de geknikte gevel langs de Vondelstraat
    attributes:
      original_use: Verenigingsgebouw met zwembad
    sources:
      - https://data.amsterdam.nl/monumenten/581b09e1-6fd2-499f-8ae7-2ee0a198bc4f
      - https://www.joodsamsterdam.nl/vondelstraat/

- title: Start of the Vondelstraat (nos. 9–14)
  summary: The bend where the Vondelstraat leaves the Stadhouderskade is a relic of Cuypers' first plan, framed by some of the street's oldest houses, a black-brick façade and a villa dated 'ANNO 1880'.
  body: |
    The Vondelstraat was named in 1867. Its curved eastern end, where it joins the Stadhouderskade, is the only part that still follows the layout Pierre Cuypers originally intended.

    Three listed buildings frame the bend. Nicolaas Redeker Bisdom, architect and developer, who worked with Cuypers on the street, built the three town houses at nos. 10-14 in 1868–1869. They are among the very first buildings of the street and of the whole nineteenth-century ring, and almost a prototype of the eclectic middle-class house built until about 1885. During the occupation, no. 14 housed the Broederschap der Notarissen, which helped resell Jewish property and gave the Liro bank access to Jewish wills.

    Opposite, no. 9 (1881–1882) is by Willem Hamer, architect of the park pavilion. Its brickwork is painted black, so the white stucco details read almost like a grid. At the corner of the Tesselschadestraat stands a salmon-brick villa by A.L. van Gendt, architect of the Concertgebouw.

    Look for:
    - at no. 9, Corinthian columns between the windows on every floor and the original sash windows
    - at nos. 10-14, the wooden dormers with pediments and hoist beams
    - at no. 13, the balcony inscribed 'ANNO 1880', lion heads under the pilasters and a woman's portrait as a keystone
  category: housing
  lat: 52.362634
  lng: 4.879023
  address: Vondelstraat 9, 10-14 and 13
  links:
    - { label: Gemeentelijk monument (224007), url: "https://data.amsterdam.nl/monumenten/cb46f823-8497-45a2-8950-9afab0ca4faf" }
    - { label: Gemeentelijk monument (224023), url: "https://data.amsterdam.nl/monumenten/721d09d9-dfe2-4390-854b-6aef0ef0ec94" }
    - { label: Rijksmonumentenregister (492011), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/492011" }
    - { label: Joods Amsterdam – Vondelstraat, url: "https://www.joodsamsterdam.nl/vondelstraat/" }
  attributes:
    rank: "Okay"
    heritage_status: "National + municipal monument"
    monument_number: "224007, 224023, 492011"
    built: "1868–1882"
    architect: "N. Redeker Bisdom (10-14), W. Hamer (9), A.L. van Gendt (13)"
    original_use: "Town houses and villa"
  photos:
    - commons:File:2020 Vondelstraat 9.jpg
    - commons:File:2020 Vondelstraat 10-14 (1).jpg
    - commons:File:Vondelstraat 13.JPG
  sources:
    - city:224007, city:224023, rce:492011
    - https://www.joodsamsterdam.nl/vondelstraat/ (no. 14 in WWII, after Bianca Stigter, Atlas van een bezette stad)
    - "https://nl.wikipedia.org/wiki/Adolf_Leonard_van_Gendt"
  nl:
    title: Begin van de Vondelstraat (nrs. 9-14)
    summary: "De bocht waar de Vondelstraat van de Stadhouderskade afbuigt, is het enige dat over is van het eerste plan van Cuypers. Eromheen staan enkele van de oudste huizen van de straat, een zwart geschilderde gevel en een villa met 'ANNO 1880'."
    body: |
      Alleen deze bocht herinnert nog aan wat Pierre Cuypers oorspronkelijk met de straat voorhad. De Vondelstraat kreeg in 1867 haar naam, maar volgt verderop zijn plan niet meer; het gebogen begin bij de Stadhouderskade wel.

      Drie monumenten omlijsten de bocht. Nicolaas Redeker Bisdom, architect, projectontwikkelaar en Cuypers' partner in deze straat, bouwde in 1868–1869 de drie herenhuizen op nummer 10-14. Ze horen bij de allereerste bebouwing van de straat en van de hele negentiende-eeuwse ring, en zijn bijna een blauwdruk voor het eclectische burgerhuis zoals dat tot ongeveer 1885 werd gebouwd. In de bezetting zat op nummer 14 de Broederschap der Notarissen, die hielp Joods bezit door te verkopen en de Liro-bank inzage gaf in Joodse testamenten.

      Aan de overkant staat nummer 9 (1881–1882), van Willem Hamer, de architect van het paviljoen in het Vondelpark. Het metselwerk is zwart geverfd, waardoor de witte pleisterdetails haast een raster vormen. Op de hoek van de Tesselschadestraat staat een villa in zalmkleurige baksteen van A.L. van Gendt, de architect van het Concertgebouw.

      Let op:
      - bij nummer 9: Korinthische zuilen tussen de ramen op elke verdieping, en de oorspronkelijke schuiframen
      - bij 10-14: de houten dakkapellen met fronton en hijsbalk
      - bij 13: het balkon met 'ANNO 1880', leeuwenkopjes onder de pilasters en een vrouwenportret als sluitsteen
    attributes:
      architect: N. Redeker Bisdom (10-14), W. Hamer (9), A.L. van Gendt (13)
      original_use: Herenhuizen en villa
    sources:
      - https://data.amsterdam.nl/monumenten/cb46f823-8497-45a2-8950-9afab0ca4faf
      - https://data.amsterdam.nl/monumenten/721d09d9-dfe2-4390-854b-6aef0ef0ec94
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/492011
      - https://www.joodsamsterdam.nl/vondelstraat/

- title: Oud Leyerhoven (Tesselschadestraat 31)
  summary: "Jos Cuypers' first building, a corner villa for his own father, has a top floor clad in tiles, including Villeroy & Boch sgraffito panels of the Muses, and a little lookout perched on the corner."
  body: |
    Pierre Cuypers commissioned this large town villa on the corner of the Tesselschadestraat and Vondelstraat in 1884, and his son Jos Cuypers designed it as his very first work. The permit was an amended version of one granted in 1882 for a villa and four houses. Pierre lived here for some years, and Jos later did too. In 1922 it was converted into offices with a caretaker's flat for a company that managed trade-union buildings, with a meeting hall added.

    The villa mixes red and yellow brick with Italian influences. Three-storey oriels on slender brackets mark the corner and the Vondelstraat side. The whole top floor is a timber frame whose panels are filled with tiles, including sgraffito tile panels by Villeroy & Boch showing the Muses. The register calls it the largest late nineteenth-century town villa built purely as a home.

    Note: the name Oud Leyerhoven is also used for Cuypers' villa at Vondelstraat 77.

    Look for:
    - the tiled top floor, best seen from the street corner
    - the square corner tower with an arbour-like lookout under a tent roof
    - decorative tiles in the round-arched panels above the first-floor windows
  category: housing
  lat: 52.362306
  lng: 4.878058
  address: Tesselschadestraat 31, corner Vondelstraat
  links:
    - { label: Rijksmonumentenregister (492066), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/492066" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q17301237" }
  attributes:
    heritage_status: National monument
    monument_number: "492066"
    built: "1884"
    architect: Jos Th.J. Cuypers
    listed: 1995
    original_use: Town villa
  photos:
    - commons:File:2020 Tesselschadestraat 31 (1).jpg
    - commons:File:Sgrafitto-tegeltableaux.jpg
  sources:
    - rce:492066
    - "https://api.data.amsterdam.nl/v1/monumenten/monumenten/?monumentnummer=5905"
  nl:
    title: Oud Leyerhoven (Tesselschadestraat 31)
    summary: "Het allereerste gebouw van Jos Cuypers, een hoekvilla voor zijn eigen vader. De bovenste verdieping zit vol tegels, waaronder sgraffitotableaus van Villeroy & Boch met de Muzen, en op de hoek staat een uitkijkpostje."
    body: |
      Je eerste opdracht als architect, en de klant is je vader. Dat overkwam Jos Cuypers in 1884: Pierre Cuypers liet hem deze grote stadsvilla ontwerpen op de hoek van de Tesselschadestraat en de Vondelstraat. De bouwvergunning was een aangepaste versie van een vergunning uit 1882 voor één villa en vier woonhuizen. Pierre woonde er een paar jaar, later trok Jos er zelf in. In 1922 werd het een kantoor met conciërgewoning voor een maatschappij die vakbondsgebouwen beheerde, en er kwam een vergaderzaal bij.

      De villa combineert rode en gele baksteen met Italiaanse invloeden. Erkers van drie verdiepingen hoog, op smalle consoles, markeren de hoek en de kant van de Vondelstraat. De hele bovenste verdieping is vakwerk van houten stijlen en regels, en alle dichte vakken daartussen zijn met tegels bekleed, onder meer met sgraffitotableaus van Villeroy & Boch waarop de Muzen staan. Volgens het rijksmonumentenregister is dit de grootst opgezette laat-negentiende-eeuwse stadsvilla die alleen voor wonen bedoeld was.

      Overigens draagt ook de villa van Cuypers op Vondelstraat 77 de naam Oud Leyerhoven.

      Let op:
      - de betegelde bovenverdieping, het mooist vanaf de straathoek
      - de vierkante hoektoren met een prieelachtig uitkijkpostje onder een tentdak
      - de sierlijke tegels in de rondboogvelden boven de ramen van de eerste verdieping
    attributes:
      original_use: Stadsvilla
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/492066

- title: Betsy Repelius' house and studio (Vondelstraat 29)
  summary: A painter's house with a studio window in the gable, tile panels of the arts and a carved Rembrandt under the oriel. Young Piet Mondriaan painted its ceilings around 1905.
  body: |
    Johanna Elisabeth (Betsy) Repelius (1848–1921) came from an Amsterdam patrician family and had to fight for her choice to become a painter. She painted romantic scenes inspired by the Dutch Golden Age, exhibited in Amsterdam and at the Glaspalast in Munich, and was a close friend of Thérèse Schwartze. In 1889–1890 Jos Cuypers, then 28, built her this narrow town house with a studio in the attic. The tall north-facing round-arched window still shows where she worked.

    Around 1905 she asked Piet Mondriaan, then still painting in a traditional style, to decorate the ceilings of the main rooms. The paintings were identified as early Mondriaans in 1999, and the four ceiling pieces from the back room were sold at auction in 2000.

    The gable is a little manifesto about art. Tile panels on either side of the studio window show Painting, Poetry, Sculpture and Music in late-medieval dress, raised above everyday life on the floors below.

    Look for:
    - the carved painter's head in a beret with Rembrandt's features under the hanging oriel, and a second head that may be Repelius herself
    - top left, her entwined initials E R and her family arms: a deer fleeing from an arrow, a pun on *ree* (deer)
    - top right, the architect's initials and the arms of the Guild of St Luke
  category: housing
  lat: 52.362041
  lng: 4.877092
  address: Vondelstraat 29
  links:
    - { label: Gemeentelijk monument (224020), url: "https://data.amsterdam.nl/monumenten/379c578e-091b-4c08-93ba-796b32c22506" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "224020"
    built: 1889–1890
    architect: Jos Th.J. Cuypers
    listed: 2008
    original_use: Town house with painter's studio
  photos:
    - commons:File:2020 Vondelstraat 29 (1).jpg
  sources:
    - city:224020 (incl. Jaarboek Amstelodamum 98, 2006 on Repelius, Cuypers and Mondriaan)
  nl:
    title: Huis en atelier van Betsy Repelius (Vondelstraat 29)
    summary: "Een schildershuis met een atelierraam in de topgevel, tegeltableaus van de kunsten en een gebeeldhouwde Rembrandt onder de erker. Rond 1905 beschilderde de jonge Piet Mondriaan hier de plafonds."
    body: |
      Rond 1905 vroeg Betsy Repelius de jonge Piet Mondriaan om de plafonds van de belangrijkste kamers te beschilderen. Hij schilderde toen nog heel traditioneel. Pas in 1999 werden de stukken herkend als vroege Mondriaans, en in 2000 gingen de vier plafondstukken uit de achterkamer onder de hamer.

      Johanna Elisabeth (Betsy) Repelius (1848-1921) kwam uit een Amsterdamse patriciërsfamilie en moest knokken om schilder te mogen worden. Ze maakte romantische taferelen in de geest van de Gouden Eeuw, exposeerde in Amsterdam en in het Glaspalast in München, en was dik bevriend met Thérèse Schwartze. In 1889-1890 liet ze Jos Cuypers, toen 28, dit smalle herenhuis bouwen met een atelier onder het dak. Het hoge rondboograam op het noorden verraadt nog waar ze werkte.

      De gevel is een klein manifest over kunst. Naast het atelierraam tonen tegeltableaus de Schilderkunst, de Dichtkunst, de Beeldhouwkunst en de Muziek in laatmiddeleeuwse kleren, hoog verheven boven het gewone leven op de verdiepingen eronder.

      Let op:
      - onder de hangende erker een gebeeldhouwde schilderskop met baret en het gezicht van Rembrandt, en een tweede kop die misschien Repelius zelf voorstelt
      - linksboven haar verstrengelde initialen E R en het familiewapen: een ree die voor een pijl op de vlucht slaat, een woordgrap op 'ree'
      - rechtsboven de beginletters van de architect, naast het wapen van het Sint-Lucasgilde
    attributes:
      original_use: Herenhuis met schildersatelier
    sources:
      - https://data.amsterdam.nl/monumenten/379c578e-091b-4c08-93ba-796b32c22506

- title: Cuypers' first houses (Vondelstraat 36–48)
  summary: Pierre Cuypers' earliest houses on the street he laid out, from 1867–1870. Look up for the puzzling animals, among them an elephant-shaped hoist beam and a pelican-like bird.
  body: |
    Pierre Cuypers, architect of the Rijksmuseum and Centraal Station, shaped the Vondelstraat and lived on it himself. In 1867–1870 he built this strip of town houses in phases, with B.J. Sterck, a family friend, as financier. They are among the very first buildings of the street and of the nineteenth-century ring. Instead of the usual eclectic town house, Cuypers drew on late-medieval and Renaissance house building, as a basis for a rational, modern architecture. He combined it with the classic three-bay width of the Amsterdam canal house.

    Not everyone liked it. Around 1900 the stockbroker E. Boissevain, a tenant at no. 36, wanted to end his lease because of the house's "peculiar character". Once convinced of Cuypers' ideas, he stayed. Nos. 36-38 are now a hotel.

    Look for:
    - at no. 38, the dormer whose hoist beam is shaped like an elephant, with a pelican-like bird at its top
    - the elephant motif again in the attic windows of the gables of nos. 40-42
    - the portrait head right of the porch of no. 36, possibly Sterck himself
    - balcony brackets with carved heads at nos. 44-48, and yellow brick bands against red-brown walls at nos. 40-48
  category: housing
  lat: 52.362411
  lng: 4.87744
  address: Vondelstraat 36-48
  links:
    - { label: Gemeentelijk monument (224039), url: "https://data.amsterdam.nl/monumenten/6dedb282-df22-40c9-a0e3-eeff9eed7a4a" }
    - { label: Gemeentelijk monument (224002), url: "https://data.amsterdam.nl/monumenten/8f966a2b-ca14-46ac-8aef-0801a0005d48" }
    - { label: Gemeentelijk monument (224015), url: "https://data.amsterdam.nl/monumenten/65d7167a-d01b-4df6-ba04-53028eff585c" }
  attributes:
    heritage_status: Municipal monument
    monument_number: 224039, 224002, 224015
    built: 1867–1870
    architect: P.J.H. Cuypers
    listed: 2008
    original_use: Town houses
  photos:
    - commons:File:2020 Vondelstraat 36-38 (1).jpg
    - commons:File:2020 Vondelstraat 40-42 (1).jpg
    - commons:File:2020 Vondelstraat 44-48.jpg
  sources:
    - city:224039, city:224002, city:224015
  nl:
    title: Eerste huizen van Cuypers (Vondelstraat 36-48)
    summary: "De vroegste huizen van Pierre Cuypers aan de straat die hij zelf aanlegde, uit 1867–1870. Kijk omhoog naar de raadselachtige dieren, waaronder een hijsbalk in de vorm van een olifant met een pelikaanachtige vogel erop."
    body: |
      Rond 1900 wilde effectenmakelaar E. Boissevain van zijn huurcontract af. Hij woonde op nummer 36 en kon niet tegen het 'zonderlinge karakter' van het huis. Uiteindelijk raakte hij toch overtuigd van de ideeën van de architect, en bleef.

      Die architect was Pierre Cuypers, van het Rijksmuseum en het Centraal Station. Hij gaf de Vondelstraat haar vorm en woonde er zelf ook. Tussen 1867 en 1870 zette hij deze rij stadshuizen neer, in fasen, met huisvriend B.J. Sterck als geldschieter. Ze horen bij de allereerste gebouwen van de straat, en van de hele negentiende-eeuwse ring. Een gangbaar eclectisch herenhuis wilde Cuypers niet. Hij greep terug op de laatmiddeleeuwse huizenbouw en de renaissance, als vertrekpunt voor een rationele, moderne bouwkunst, en hield vast aan de drie traveeën van het Amsterdamse grachtenhuis. In 36-38 zit nu een hotel.

      Let op:
      - op nummer 38 de dakkapel met een hijsbalk in de vorm van een olifant, met bovenop een vogel die op een pelikaan lijkt
      - nog eens het olifantmotief, in de zolderramen van de topgevels van 40-42
      - de portretkop rechts van het portiek van nummer 36, mogelijk Sterck zelf
      - balkonconsoles met gebeeldhouwde koppen op 44-48, en banden van gele baksteen in de roodbruine gevels van 40-48
    attributes:
      original_use: Herenhuizen
    sources:
      - https://data.amsterdam.nl/monumenten/6dedb282-df22-40c9-a0e3-eeff9eed7a4a
      - https://data.amsterdam.nl/monumenten/8f966a2b-ca14-46ac-8aef-0801a0005d48
      - https://data.amsterdam.nl/monumenten/65d7167a-d01b-4df6-ba04-53028eff585c

- title: Freemasons' lodge (Vondelstraat 39-41)
  summary: Behind a stained-glass rose window of a polished diamond sit the Blue and Red Temples of Amsterdam's freemasons, built partly on the remains of a Heineken beer house designed by Cuypers.
  body: |
    In 1873 G.A. Heineken had Pierre Cuypers design a *bierhuis* (beer house) here, the Bierhuis Vondel; in 1891 it became the Café Restaurant Vondel. In 1903 it and the neighbouring Vondelhuis passed to the seven Amsterdam freemasons' lodges, who wanted a shared home. W. Kromhout first rebuilt the Vondelhuis with a front like a temple. In 1910–1911 P. Heyn gave both buildings their present look, demolishing the fronts by Kromhout and Cuypers and replacing them with one new rationalist façade. Only traces of the beer house's side and rear walls survive.

    The lodge building at no. 39 holds the Blue Temple on the ground floor and the Red Temple above, between two corner towers with open lanterns. No. 41 held a club room and the caretaker's flat.

    Look for:
    - the round-arched neo-Romanesque portal with the words PACI AC LUCI (to peace and light) in tiles above it
    - the large rose window with a polished diamond in stained glass, the highest stage a freemason strives for
    - a frieze of square stones painted with St Andrew's crosses
    - above the middle entrance, a shield with the square and compasses and the letter G
  category: civic
  lat: 52.361832
  lng: 4.87636
  address: Vondelstraat 39-41
  links:
    - { label: Rijksmonumentenregister (492004), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/492004" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q17301209" }
  attributes:
    heritage_status: National monument
    monument_number: "492004"
    built: 1873, 1904–1905, 1910–1911
    architect: P. Heyn (façade), W. Kromhout, P.J.H. Cuypers (beer house)
    listed: 1995
    original_use: Freemasons' lodge with club room and caretaker's flat
  photos:
    - commons:File:2020 Vondelstraat 39-41 (2).jpg
  sources:
    - rce:492004
  nl:
    title: Logegebouw der Vrijmetselaren (Vondelstraat 39-41)
    summary: "Een bierhuis van Cuypers voor Heineken werd een tempel van de vrijmetselaars. Achter een glas-in-loodroosvenster met een gepolijste diamant liggen nu de Blauwe en de Rode Tempel van de Amsterdamse loges."
    body: |
      Waar nu de vrijmetselaars bijeenkomen, werd eerst bier getapt. In 1873 liet G.A. Heineken Pierre Cuypers hier een bierhuis ontwerpen, Bierhuis Vondel, dat in 1891 verderging als Café Restaurant Vondel. In 1903 kwamen dit pand en het Vondelhuis ernaast in handen van de zeven Amsterdamse vrijmetselaarsloges, die samen een thuis zochten.

      W. Kromhout bouwde eerst het Vondelhuis om en gaf het een gevel als van een tempel. In 1910–1911 kregen beide panden van P. Heyn hun huidige gezicht: de gevels van Kromhout en Cuypers gingen tegen de grond, en er kwam één nieuwe rationalistische voorgevel voor in de plaats. Van het bierhuis zijn alleen sporen over in de zij- en achtermuren.

      Op nummer 39 ligt de Blauwe Tempel op de begane grond en de Rode Tempel daarboven, tussen twee hoektorens met open lantaarns. Op nummer 41 zaten een sociëteit en de woning van de conciërge.

      Let op:
      - het neoromaanse rondboogportaal met PACI AC LUCI (aan vrede en licht) in tegels erboven
      - het grote roosvenster met in glas-in-lood een gepolijste diamant, de hoogste trap waar een vrijmetselaar naar streeft
      - een fries van vierkante stenen met beschilderde Andreaskruisen
      - boven de middelste ingang een schild met winkelhaak, passer en de letter G
    attributes:
      architect: P. Heyn (gevel), W. Kromhout, P.J.H. Cuypers (bierhuis)
      original_use: Logegebouw met verenigingslokaal en conciërgewoning
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/492004

- title: Castle villa (Vondelstraat 47-49)
  summary: Two crenellated towers with corner turrets make this villa of about 1873 look like a toy castle. Its mix of Gothic and Renaissance forms is rare in Amsterdam.
  body: |
    J.H. Schmitz designed this villa around 1873 for H. Wille, in a Gothic Revival style with Renaissance details. Little is known about Schmitz except that he was the son of the director of the Amsterdam Omnibus Company; he also designed Vondelstraat 72. In 1882 Wille's widow added the right-hand tower and one window bay as an annexe (no. 49), designed by H.H.J. Hogeman; the two parts read as one building.

    Later owners kept altering it. In 1911 two floors were added over the corner basement, and in 1987 it was divided into apartments. When the Eerste Constantijn Huygensstraat was linked to the Van Baerlestraat in 1947, the villa suddenly found itself on a street corner.

    The register values it for its combination of Gothic and Renaissance features, rare in Amsterdam.

    Look for:
    - two identical towers with crenellations and turret-topped corner oriels
    - oriels on the ground and first floors of both towers
    - hood moulds on decorated brackets over every window
    - the stoop of eight steps with iron railings leading to the entrance between the towers
  category: housing
  lat: 52.361658
  lng: 4.87576
  address: Vondelstraat 47-49
  links:
    - { label: Rijksmonumentenregister (492018), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/492018" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q17301214" }
  attributes:
    heritage_status: National monument
    monument_number: "492018"
    built: c. 1873, 1882
    architect: J.H. Schmitz; annexe H.H.J. Hogeman
    listed: 1995
    original_use: Villa
  photos:
    - commons:File:2020 Vondelstraat 47-49.jpg
  sources:
