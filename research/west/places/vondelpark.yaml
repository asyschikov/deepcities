  nl:
    title: Politiebureau Verkeerswezen (Overtoom 37-43)
    summary: Het bureau van de verkeerspolitie uit 1924, met golvende vensterstroken die 'een nachtmerrie voor metselaars en glaszetters' waren. Vanhier werden rond 1932 de eerste verkeerslichten van Amsterdam bediend.
    body: |
      Omdat het verkeer in de hele stad toenam, besloot de gemeente in juni 1922 tot de bouw van een nieuw gebouw voor het Bureau Verkeerswezen aan de steeds drukker wordende Overtoom, voor de rijwiel- en motorrijwielbrigades, het onderzoek van motorrijtuigen en de weging van vrachtauto's. Het ontwerp kwam van Pieter Lucas Marnette van de Dienst der Publieke Werken. Het gebouw werd op 1 oktober 1924 in gebruik genomen. Hoe snel het verkeer toenam blijkt uit het feit dat vanuit dit gebouw rond 1932 de eerste verkeerslichten in Amsterdam werden bediend, onder andere voor Leidseplein, Spui en Koningsplein. In 1941 trok het bureau weg; bij de verbouwing van medio 1994 bleven alleen de karakteristieke voorgevel en aansluitende delen over. Nu zit er een fitnesscentrum, met appartementen op de bovenetages.

      De vensterstroken komen aan beide uiteinden in rondingen naar voren om daarna weer via een andere ronding aan te sluiten op de gevel, een nachtmerrie voor metselaars en glaszetters.

      Let op:
      - in het midden de afgeplatte, ronde uitbouw van de brigadiersloge
      - de zware dubbele deuren met expressief beslag en geheng en een groot ovaal venster
      - boven in de gevel twee kleine raampjes voor het bedienen van de vlaggenmasten
      - de getande dakrand met gepunte hoekaccenten
    attributes:
      architect: P.L. Marnette (Publieke Werken)
      original_use: Politiebureau voor het verkeerswezen
    sources:
      - https://nl.wikipedia.org/wiki/Overtoom_39-41_(Amsterdam)
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/492082

- title: Atlanta (Stadhouderskade 5-6)
  summary: An American-minded 1929 office block for rent, with a concrete frame, a lift and a car dealer downstairs, then thought risky because it stood so far from the city centre.
  body: |
    In the 1920s Amsterdam firms usually moved into old canal houses, and a purpose-built office was still a novelty. Frans Warners, an architect strongly oriented towards America who was also known for luxury apartment buildings, designed Atlanta in 1929 as a speculative office block. It had a concrete frame and an automatic lift, with a car business on the ground floor. Building such an ambitious office for rent was a gamble, because by the ideas of the time this spot lay far from the real business district.

    The building is detailed in the Amsterdam School manner: red hand-moulded brick with deep joints, and two roughly half-round bays framing the front above the ground floor. The window heads sit just in front of the wall and the lower lights just behind it, a typical Amsterdam School detail. With its neighbour, the AMVJ building, it forms a screen of large buildings where the old city meets the nineteenth-century extensions.

    Look for:
    - the two half-round bays
    - the heavy recessed top floor with vertical strips of decorative brickwork
    - building sculpture by L.S.W. van der Noordaa
  category: industrial
  lat: 52.363156
  lng: 4.879325
  address: Stadhouderskade 5-6
  links:
    - { label: Gemeentelijk monument (224005), url: "https://data.amsterdam.nl/monumenten/1d93cfa2-3705-4f4e-8d6e-698ff1fa14e4" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "224005"
    built: "1929"
    architect: F.A. Warners
    listed: 2008
    original_use: Rental offices and car showroom
    artist: L.S.W. van der Noordaa
  photos:
    - commons:File:Amsterdam Stadhouderskade 5.jpg
  sources:
    - city:224005
  nl:
    title: Atlanta (Stadhouderskade 5-6)
    summary: Een op Amerika gericht verhuurkantoor uit 1929 met betonskelet, lift en autobedrijf beneden. Toen een riskante onderneming, omdat het zo ver van de eigenlijke 'city' lag.
    body: |
      In de jaren twintig betrokken Amsterdamse bedrijven meestal oude grachtenhuizen; een gespecialiseerd kantoorgebouw was nog nieuw. Frans Warners, een sterk op Amerika gerichte architect die ook bekend werd met luxe appartementengebouwen, ontwierp Atlanta in 1929 als modern verhuurkantoor met betonskelet en automatische lift, en een autobedrijf op de begane grond. Zo'n ambitieus kantoor voor de verhuur was een riskante onderneming, want volgens de opvattingen van toen lag de plek ver van de 'city'.

      Het gebouw is geheel in Amsterdamse Schoolstijl gedetailleerd: rode handvormsteen met diepliggende voegen en twee min of meer halfronde erkers die het gevelvlak omkaderen. De bovenlichten liggen iets vóór het gevelvlak en het onderste deel van de vensters juist erachter. Samen met het A.M.V.J.-gebouw ernaast vormt het een scherm van grote gebouwen op de overgang van de oude binnenstad naar de negentiende-eeuwse uitbreidingen.

      Let op:
      - de twee halfronde erkers
      - de robuuste, teruggelegen kapverdieping met verticale stroken siermetselwerk
      - het bouwbeeldhouwwerk van L.S.W. van der Noordaa
    attributes:
      original_use: Verhuurkantoren en autobedrijf
    sources:
      - https://data.amsterdam.nl/monumenten/1d93cfa2-3705-4f4e-8d6e-698ff1fa14e4

- title: AMVJ building
  summary: The 1928 home of the Amsterdam YMCA was an early high-rise in central Amsterdam, with a swimming pool inside. Granite reliefs by Louis van der Noordaa run along the first floor.
  body: |
    The *Amsterdamsche Maatschappij voor Jongemannen* (A.M.V.J.) began in 1909 as the Dutch branch of the YMCA, on a Reformed Christian basis, and aimed at "the spiritual, physical and social welfare of young men of all classes". Sport was central, so its headquarters, designed by Foeke Kuipers and completed in 1928, had a swimming pool, as well as a hall with an organ, a study room, a library and guest rooms. In July 1943 a WA (Dutch Nazi militia) paper reported that the building was now under National Socialist management. After the war the association was renamed *Algemene Maatschappij voor Jongeren*. The building is now part of a hotel.

    With eight storeys on the Stadhouderskade and seven on the Vondelstraat, it was an early high-rise in the city. The register calls it "American Style" with Amsterdam School influence: a concrete frame behind solid brick walls, with a bent façade line along the Vondelstraat.

    Look for:
    - Van der Noordaa's carved granite blocks with figurative reliefs along the first floor
    - the main entrance against the north wall on the Stadhouderskade
    - the bent façade along the Vondelstraat
  category: civic
  lat: 52.363085
  lng: 4.879458
  address: Vondelstraat 2-8, Stadhouderskade 7-9
  links:
    - { label: Gemeentelijk monument (224042), url: "https://data.amsterdam.nl/monumenten/581b09e1-6fd2-499f-8ae7-2ee0a198bc4f" }
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Stadhouderskade_7" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q21707612" }
    - { label: Joods Amsterdam – Vondelstraat, url: "https://www.joodsamsterdam.nl/vondelstraat/" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "224042"
    built: 1927–1928
    architect: Foeke Kuipers
    listed: 2008
    original_use: YMCA club house with swimming pool
    artist: Louis van der Noordaa
  photos:
    - commons:File:Exterieur AMVJ-gebouw, Amsterdam, 929-2079.jpg
  sources:
    - city:224042
    - https://www.joodsamsterdam.nl/vondelstraat/ (1943 WA report)
  nl:
    title: A.M.V.J.-gebouw
    summary: Het gebouw van de Amsterdamse YMCA uit 1928 was een vroege hoogbouw in de binnenstad, met een zwembad binnen. Langs de eerste laag lopen granieten reliëfs van Louis van der Noordaa.
    body: |
      De Amsterdamsche Maatschappij voor Jongemannen (A.M.V.J.) ontstond in 1909 als Nederlandse tak van de YMCA, op gereformeerd-religieuze basis, en richtte zich op 'het geestelijk, lichamelijk en maatschappelijk welzijn van de jongemannen in Amsterdam onder alle klassen des volks'. Sport stond centraal, dus het hoofdgebouw van Foeke Kuipers, gereed in 1928, kreeg een zwembad, en verder een grote zaal met orgel, een studiezaal, een bibliotheek en logeerkamers. In juli 1943 meldde het WA-blad De zwarte soldaat dat de A.M.V.J. onder nationaalsocialistische leiding stond. Na de oorlog heette de vereniging Algemene Maatschappij voor Jongeren. Het gebouw is nu deel van een hotel.

      Met acht lagen aan de Stadhouderskade en zeven aan de Vondelstraat was het een vroeg voorbeeld van hoogbouw in de binnenstad. Het register spreekt van 'American Style' met invloed van de Amsterdamse School: een betonskelet met massieve bakstenen gevels en een geknikte gevel aan de Vondelstraat.

      Let op:
      - de granieten dekblokken met figuratieve reliëfs van Van der Noordaa langs de eerste laag
      - de hoofdingang tegen de noordelijke bouwmuur aan de Stadhouderskade
      - de geknikte gevellijn langs de Vondelstraat
    attributes:
      original_use: Verenigingsgebouw met zwembad
    sources:
      - https://data.amsterdam.nl/monumenten/581b09e1-6fd2-499f-8ae7-2ee0a198bc4f
      - https://www.joodsamsterdam.nl/vondelstraat/

- title: Start of the Vondelstraat (nos. 9–14)
  summary: The bend where the Vondelstraat leaves the Stadhouderskade is a relic of Cuypers' first plan, framed by some of the street's oldest houses, a black-brick façade and a villa dated 'ANNO 1880'.
  body: |
    The Vondelstraat was named in 1867 and was the first street of the new villa district beyond the Singelgracht. Its curved eastern end, where it joins the Stadhouderskade, is the only part that still follows the layout Pierre Cuypers originally intended.

    Three listed buildings frame the bend. Nicolaas Redeker Bisdom, architect and developer, who worked with Cuypers on the street, built the three town houses at nos. 10-14 in 1866–1867. They are among the very first buildings of the street and of the whole nineteenth-century ring, and almost a prototype of the eclectic middle-class house built until about 1885. During the occupation, no. 14 housed the Broederschap der Notarissen, which helped resell Jewish property and gave the Liro bank access to Jewish wills.

    Opposite, no. 9 (1881–1882) is by Willem Hamer, architect of the park pavilion. Its brickwork is painted black, so the white stucco details read almost like a grid. At the corner of the Tesselschadestraat stands a salmon-brick villa by A.L. van Gendt, architect of the Concertgebouw.

    Look for:
    - at no. 9, Corinthian columns between the windows on every floor and the original sash windows
    - at nos. 10-14, the wooden dormers with pediments and hoist beams
    - at no. 13, the balcony inscribed 'ANNO 1880', lion heads under the pilasters and a woman's portrait as a keystone
  category: housing
  lat: 52.362634
  lng: 4.879023
  address: Vondelstraat 9, 10-14 and 13
  links:
    - { label: Gemeentelijk monument (224007), url: "https://data.amsterdam.nl/monumenten/cb46f823-8497-45a2-8950-9afab0ca4faf" }
    - { label: Gemeentelijk monument (224023), url: "https://data.amsterdam.nl/monumenten/721d09d9-dfe2-4390-854b-6aef0ef0ec94" }
    - { label: Rijksmonumentenregister (492011), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/492011" }
    - { label: Joods Amsterdam – Vondelstraat, url: "https://www.joodsamsterdam.nl/vondelstraat/" }
  attributes:
    heritage_status: National + municipal monument
    monument_number: 224007, 224023, 492011
    built: 1866–1882
    architect: N. Redeker Bisdom (10-14), W. Hamer (9), A.L. van Gendt (13)
    original_use: Town houses and villa
  photos:
    - commons:File:2020 Vondelstraat 9.jpg
    - commons:File:2020 Vondelstraat 10-14 (1).jpg
    - commons:File:Vondelstraat 13.JPG
  sources:
    - city:224007, city:224023, rce:492011
    - https://www.joodsamsterdam.nl/vondelstraat/ (no. 14 in WWII, after Bianca Stigter, Atlas van een bezette stad)
  nl:
    title: Begin van de Vondelstraat (nrs. 9-14)
    summary: Het gebogen deel van de Vondelstraat bij de Stadhouderskade is een relict van de aanvankelijk door Cuypers beoogde aanleg, omkaderd door enkele van de vroegste huizen van de straat.
    body: |
      Het gebogen deel van de straat dat aansluit op de Stadhouderskade vormt door zijn tracé een relict van de aanvankelijk door P.J.H. Cuypers beoogde aanleg. Drie monumenten omkaderen het.

      Nicolaas Redeker Bisdom speelde tezamen met Cuypers een belangrijke rol bij de aanleg en ontwikkeling van de Vondelstraat; hij staat bekend als architect en projectontwikkelaar. Zijn drie herenhuizen op nr. 10-14 (1866-1867) behoren tot de vroegste bebouwing in de straat alsook in de negentiende-eeuwse ring. In hun opzet en detaillering vormen ze welhaast een prototype voor de woningen voor de gegoede burgerij zoals deze tot pakweg 1885 zijn gebouwd. Op nr. 14 zat in de oorlog de Broederschap der Notarissen, die meewerkte aan de doorverkoop van Joods bezit.

      Het herenhuis Vondelstraat 9 (1881-1882) is van W. Hamer, bekend van het Vondelparkpaviljoen. Doordat het bakstenen metselwerk zwart is geschilderd levert de detaillering een fraaie contrastwerking op en verhoudt deze zich welhaast als een raster tot de gevel. Op de hoek van de Tesselschadestraat staat een villa in neo-Hollandse renaissance van A.L. van Gendt, opgetrokken in zalmkleurige baksteen.

      Let op:
      - op nr. 9 de gecanneleerde zuilen met Korinthische kapitelen op alle verdiepingen en de oorspronkelijke schuiframen
      - op nr. 10-14 de houten dakkapellen met timpaan en hijsbalk
      - op nr. 13 het balkon met 'ANNO 1880', leeuwenkopjes onder de pilasters en een gebeeldhouwd vrouwenportret als sluitsteen
    attributes:
      architect: N. Redeker Bisdom (10-14), W. Hamer (9), A.L. van Gendt (13)
      original_use: Herenhuizen en villa
    sources:
      - https://data.amsterdam.nl/monumenten/cb46f823-8497-45a2-8950-9afab0ca4faf
      - https://data.amsterdam.nl/monumenten/721d09d9-dfe2-4390-854b-6aef0ef0ec94
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/492011
      - https://www.joodsamsterdam.nl/vondelstraat/

- title: Oud Leyerhoven (Tesselschadestraat 31)
  summary: Jos Cuypers' first building, a corner villa for his own father, has a top floor clad entirely in Villeroy & Boch sgraffito tiles of the Muses and a little lookout perched on the corner.
  body: |
    Pierre Cuypers commissioned this large town villa on the corner of the Tesselschadestraat and Vondelstraat in 1884, and his son Jos Cuypers designed it as his very first work. The permit was an amended version of one granted in 1882 for a villa and four houses. Pierre lived here for some years, and Jos later did too. In 1922 it was converted into offices with a caretaker's flat for a company that managed trade-union buildings, with a meeting hall added.

    The villa mixes red and yellow brick with Italian influences. Three-storey oriels on slender brackets mark the corner and the Vondelstraat side. The whole top floor is a timber frame whose panels are filled with tiles, including sgraffito tile panels by Villeroy & Boch showing the Muses. The register calls it the largest late nineteenth-century town villa built purely as a home.

    Note: the name Oud Leyerhoven is also used for Cuypers' villa at Vondelstraat 77-79.

    Look for:
    - the tiled top floor, best seen from the street corner
    - the square corner tower with an arbour-like lookout under a tent roof
    - decorative tiles in the round-arched panels above the first-floor windows
  category: housing
  lat: 52.362306
  lng: 4.878058
  address: Tesselschadestraat 31, corner Vondelstraat
  links:
    - { label: Rijksmonumentenregister (492066), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/492066" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q17301237" }
  attributes:
    heritage_status: National monument
    monument_number: "492066"
    built: "1884"
    architect: Jos Th.J. Cuypers
    listed: 1995
    original_use: Town villa
  photos:
    - commons:File:2020 Tesselschadestraat 31 (1).jpg
    - commons:File:Sgrafitto-tegeltableaux.jpg
  sources:
    - rce:492066
  nl:
    title: Oud Leyerhoven (Tesselschadestraat 31)
    summary: Het eerste werk van Jos Cuypers, een stadsvilla voor zijn vader, met een bovenverdieping vol sgraffito-tegeltableaux van Villeroy & Boch met de Muzen en een prieelachtige uitkijkpost op de hoek.
    body: |
      In 1884 op de hoek van de Tesselschadestraat en Vondelstraat nabij het Vondelpark tot stand gekomen stadsvilla, genaamd 'Oud Leyerhoven' en in opdracht van P.J.H. Cuypers ontworpen door zijn zoon Jos Th.J. Cuypers, als eerste werk, in eclectische bouwstijl waarbij onder meer invloeden van de Italiaanse bouwkunst zijn verwerkt. De villa diende een aantal jaren als woonhuis voor de opdrachtgever en werd later bewoond door Jos Cuypers. In 1922 werd ze verbouwd tot kantoor met conciërgewoning voor de 'Maatschappij tot Exploitatie en Administratie van Vakvereenigingsgebouwen'.

      De villa is in rode en gele baksteen gemetseld. De gehele bovenverdieping bestaat uit een vakwerkconstructie van houten stijlen en regels, waartussen alle gesloten vlakken met tegels zijn bekleed: sgraffito-tegeltableaux van de fabriek Villeroy & Boch, onder meer met voorstellingen van de Muzen. Het register noemt de villa van typologisch belang wegens de grootste opzet van een laatnegentiende-eeuwse stadsvilla geheel bestemd voor wonen.

      Let op:
      - de betegelde vakwerkverdieping
      - de rechthoekige torenopbouw op de hoek, met een prieelachtige uitkijkpost onder een tentdak
      - het decoratieve tegelwerk in de rondboog-spaarvelden boven de vensters van de eerste verdieping
    attributes:
      original_use: Stadsvilla
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/492066

- title: Betsy Repelius' house and studio (Vondelstraat 29)
  summary: A painter's house with a studio window in the gable, tile panels of the arts and a carved Rembrandt under the oriel. Young Piet Mondriaan painted its ceilings around 1905.
  body: |
    Johanna Elisabeth (Betsy) Repelius (1848–1921) came from an Amsterdam patrician family and had to fight for her choice to become a painter. She painted romantic scenes inspired by the Dutch Golden Age, exhibited in Amsterdam and at the Glaspalast in Munich, and was a close friend of Thérèse Schwartze. In 1889–1890 Jos Cuypers, then 28, built her this narrow town house with a studio in the attic. The tall north-facing round-arched window still shows where she worked.

    Around 1905 she asked Piet Mondriaan, then still painting in a traditional style, to decorate the ceilings of the main rooms. The paintings were identified as early Mondriaans in 1999, and the four ceiling pieces from the back room were sold at auction in 2000.

    The gable is a little manifesto about art. Tile panels on either side of the studio window show Painting, Poetry, Sculpture and Music in late-medieval dress, raised above everyday life on the floors below.

    Look for:
    - the carved painter's head in a beret with Rembrandt's features under the hanging oriel, and a second head that may be Repelius herself
    - top left, her entwined initials E R and her family arms: a deer fleeing from an arrow, a pun on *ree* (deer)
    - top right, the architect's initials and the arms of the Guild of St Luke
  category: housing
  lat: 52.362041
  lng: 4.877092
  address: Vondelstraat 29
  links:
    - { label: Gemeentelijk monument (224020), url: "https://data.amsterdam.nl/monumenten/379c578e-091b-4c08-93ba-796b32c22506" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "224020"
    built: 1889–1890
    architect: Jos Th.J. Cuypers
    listed: 2008
    original_use: Town house with painter's studio
  photos:
    - commons:File:2020 Vondelstraat 29 (1).jpg
  sources:
    - city:224020 (incl. Jaarboek Amstelodamum 98, 2006 on Repelius, Cuypers and Mondriaan)
  nl:
    title: Huis en atelier van Betsy Repelius (Vondelstraat 29)
    summary: Een herenhuis met atelier voor een kunstschilderes, met tegeltableaus van de kunsten in de topgevel en een gebeeldhouwde Rembrandt onder de erker. Piet Mondriaan schilderde rond 1905 de plafonds.
    body: |
      Johanna Elisabeth ofwel Betsy Repelius (1848-1921) is een min of meer in de vergetelheid geraakte kunstschilderes die zich onder meer toelegde op romantisch getinte werken met invloed van de Hollandse Gouden Eeuw. Ze was een telg uit een vooraanstaand Amsterdams patriciërsgeslacht waarin ze haar keuze voor het kunstenaarsbestaan met enige moeite had moeten bevechten. Ze was nauw bevriend met Thérèse Schwartze. Toen Jos Cuypers de opdracht kreeg om haar woonhuis met atelier te bouwen, was hij achtentwintig jaar oud. Nog altijd herinneren het hoge op het noorden gelegen rondboogvenster en het in het oostelijke schild van de kap uitgespaarde raam aan het atelier.

      Repelius koos rond 1905 de schilder Piet Mondriaan om de 'zaal' en eetkamer op de bel-étage van plafondschilderingen te voorzien. Nadat de schilderingen in 1999 waren geïdentificeerd als vroege werken van Mondriaan, zijn de vier plafondstukken uit de achterkamer in 2000 geveild en verkocht.

      De tegeltableaus in de topgevel tonen van links naar rechts de in laatmiddeleeuwse dracht gehulde personificaties van de schilderkunst, de dichtkunst, de beeldhouwkunst en de muziek.

      Let op:
      - de gebeeldhouwde schilderskop met baret onder de hangende erker, met de trekken van Rembrandt; de tweede kop is mogelijk Repelius zelf
      - linksboven Betsy's initialen, een verstrengelde E en R, en haar familiewapen: een voor een pijl vluchtende ree (Ree-pelius)
      - rechtsboven de initialen van de architect en het wapen van het Sint Lucasgilde
    attributes:
      original_use: Herenhuis met schildersatelier
    sources:
      - https://data.amsterdam.nl/monumenten/379c578e-091b-4c08-93ba-796b32c22506

- title: Cuypers' first houses (Vondelstraat 36–48)
  summary: Pierre Cuypers' earliest houses on the street he laid out, from 1867–1870. Look up for the puzzling animals, among them an elephant-shaped hoist beam and a pelican-like bird.
  body: |
    Pierre Cuypers, architect of the Rijksmuseum and Centraal Station, shaped the Vondelstraat and lived on it himself. In 1867–1870 he built this strip of town houses in phases, with B.J. Sterck, a family friend, as financier. They are among the very first buildings of the street and of the nineteenth-century ring. Instead of the usual eclectic town house, Cuypers drew on late-medieval and Renaissance house building, as a basis for a rational, modern architecture. He combined it with the classic three-bay width of the Amsterdam canal house.

    Not everyone liked it. Around 1900 the stockbroker E. Boissevain, a tenant at no. 36, wanted to end his lease because of the house's "peculiar character". Once convinced of Cuypers' ideas, he stayed. Nos. 36-38 are now a hotel.

    Look for:
    - at no. 38, the dormer whose hoist beam is shaped like an elephant, with a pelican-like bird at its top
    - the elephant motif again in the attic windows of the gables of nos. 40-42
    - the portrait head right of the porch of no. 36, possibly Sterck himself
    - balcony brackets with carved heads at nos. 44-48, and yellow brick bands against red-brown walls throughout
  category: housing
  lat: 52.362411
  lng: 4.87744
  address: Vondelstraat 36-48
  links:
    - { label: Gemeentelijk monument (224039), url: "https://data.amsterdam.nl/monumenten/6dedb282-df22-40c9-a0e3-eeff9eed7a4a" }
    - { label: Gemeentelijk monument (224002), url: "https://data.amsterdam.nl/monumenten/8f966a2b-ca14-46ac-8aef-0801a0005d48" }
    - { label: Gemeentelijk monument (224015), url: "https://data.amsterdam.nl/monumenten/65d7167a-d01b-4df6-ba04-53028eff585c" }
  attributes:
    heritage_status: Municipal monument
    monument_number: 224039, 224002, 224015
    built: 1867–1870
    architect: P.J.H. Cuypers
    listed: 2008
    original_use: Town houses
  photos:
    - commons:File:2020 Vondelstraat 36-38 (1).jpg
    - commons:File:2020 Vondelstraat 40-42 (1).jpg
    - commons:File:2020 Vondelstraat 44-48.jpg
  sources:
    - city:224039, city:224002, city:224015
  nl:
    title: Eerste huizen van Cuypers (Vondelstraat 36-48)
    summary: De vroegste huizen van P.J.H. Cuypers in de straat die hij aanlegde, uit 1867-1870. Kijk omhoog naar de welhaast raadselachtige diermotieven, zoals een hijsbalk in de vorm van een olifant.
    body: |
      Een belangrijk stempel drukte Cuypers op de aanleg en ontwikkeling van de Vondelstraat, waar hij zich ook zelf vestigde. P.J.H. Cuypers schiep deze huizen in 1867-1870 in fasen; B.J. Sterck verleende bij de realisering als financier zijn medewerking. Ze behoren tot de vroegste bebouwing in de Vondelstraat alsook in de negentiende-eeuwse ring. Het ontwerp laat zien hoe Cuypers zich liet inspireren door de laatmiddeleeuwse en renaissancistische huizenbouw, als het uitgangspunt voor vernieuwende en op rationele principes gebaseerde architectuur, en de kenmerken hiervan koppelde aan de klassieke opzet van het drie vensterassen brede Amsterdamse grachtenhuis.

      Van nr. 36 is bekend dat het 'zonderlinge karakter' voor de huurder die er rond 1900 woonde, de commissionair in effecten E. Boissevain, een reden was om de huurovereenkomst stop te zetten. Nadat hij overtuigd was geraakt van het belang van de vernieuwende opvattingen van Cuypers, besloot hij er toch te blijven wonen. De huizen 36-38 zijn samengevoegd tot een hotel.

      Let op:
      - op nr. 38 het centraal gelegen dakhuis, waarvan de hijsbalk de vorm heeft van een olifant, met in de top een pelikaanachtige vogel
      - in de topgevels van nr. 40-42 het zoldervenster met een welhaast raadselachtig olifantenmotief
      - de portretkop rechts van de portiek van nr. 36, mogelijk financier B.J. Sterck
      - op nr. 44-48 met koppen gedecoreerde balkonconsoles en siermetselwerk in geelgebakken steen
    attributes:
      original_use: Herenhuizen
    sources:
      - https://data.amsterdam.nl/monumenten/6dedb282-df22-40c9-a0e3-eeff9eed7a4a
      - https://data.amsterdam.nl/monumenten/8f966a2b-ca14-46ac-8aef-0801a0005d48
      - https://data.amsterdam.nl/monumenten/65d7167a-d01b-4df6-ba04-53028eff585c

- title: Freemasons' lodge (Vondelstraat 39-41)
  summary: Behind a stained-glass rose window of a polished diamond sit the Blue and Red Temples of Amsterdam's freemasons, built partly on the remains of a Heineken beer house designed by Cuypers.
  body: |
    In 1873 Gerard Adriaan Heineken had Pierre Cuypers design a *bierhuis* (beer house) here, the Bierhuis Vondel; in 1891 it became the Café Restaurant Vondel. In 1903 it and the neighbouring Vondelhuis passed to the seven Amsterdam freemasons' lodges, who wanted a shared home. W. Kromhout first rebuilt the Vondelhuis with a front like a temple. In 1910–1911 P. Heyn gave both buildings their present look, demolishing the fronts by Kromhout and Cuypers and replacing them with one new rationalist façade. Only traces of the beer house's side and rear walls survive.

    The lodge building at no. 39 holds the Blue Temple on the ground floor and the Red Temple above, between two corner towers with open lanterns. No. 41 held a club room and the caretaker's flat.

    Look for:
    - the round-arched neo-Romanesque portal with the words PACI AC LUCI (to peace and light) in tiles above it
    - the large rose window with a polished diamond in stained glass, the highest stage a freemason strives for
    - a frieze of square stones painted with St Andrew's crosses
    - above the middle entrance, a shield with the square and compasses and the letter G
  category: civic
  lat: 52.361832
  lng: 4.87636
  address: Vondelstraat 39-41
  links:
    - { label: Rijksmonumentenregister (492004), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/492004" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q17301209" }
  attributes:
    heritage_status: National monument
    monument_number: "492004"
    built: 1873, 1904–1905, 1910–1911
    architect: P. Heyn (façade), W. Kromhout, P.J.H. Cuypers (beer house)
    listed: 1995
    original_use: Freemasons' lodge with club room and caretaker's flat
  photos:
    - commons:File:2020 Vondelstraat 39-41 (2).jpg
  sources:
    - rce:492004
  nl:
    title: Logegebouw der Vrijmetselaren (Vondelstraat 39-41)
    summary: Achter een roosvenster met een gepolijste diamant liggen de Blauwe en de Rode Tempel van de Amsterdamse vrijmetselaars, deels op de plek van het Bierhuis 'Vondel' dat Cuypers voor Heineken ontwierp.
    body: |
      In verschillende bouwfasen tot stand gekomen logegebouw met verenigingslokaal en conciërgewoning, hoofdzetel van de Amsterdamse Vrijmetselaars, deels ter plaatse van het voormalige Bierhuis 'Vondel' (nr. 41) en het voormalige 'Vondelhuis' (nr. 39). Van het in 1873 in opdracht van G.A. Heineken naar ontwerp van P.J.H. Cuypers gebouwde Bierhuis resteren nog rudimenten van de linkerzij- en achtergevel. In 1891 werd het Bierhuis veranderd tot 'Café Restaurant Vondel'. In 1903 gingen beide panden over in handen van de zeven in Amsterdam gevestigde Vrijmetselarijloges, die een gezamenlijk onderkomen zochten. In 1904-1905 verbouwde W. Kromhout het Vondelhuis; in 1910-1911 verkregen beide panden hun huidig aanzicht dankzij een ingrijpende verbouwing naar ontwerp van P. Heyn, waarbij de gevels van Kromhout (refererend aan een tempelfront) en Cuypers werden afgebroken.

      Het logegebouw heeft op de beganegrond de Blauwe Tempel en op de verdieping de Rode Tempel, tussen twee flankerende hoektorens met elk een opengewerkte lantaarn.

      Let op:
      - het rondboogvormige portaal in neo-Romaanse trant met daarboven in ingelegd tegelwerk PACI AC LUCI
      - het grote roosvenster met in glas-in-lood een gepolijste diamant, het hoogst denkbare stadium waarnaar de vrijmetselaar streeft
      - een fries van natuurstenen tegels waarop een Andreaskruis is geschilderd
      - boven de middelste entree een schild met passer en winkelhaak en in het midden de letter G
    attributes:
      architect: P. Heyn (gevel), W. Kromhout, P.J.H. Cuypers (bierhuis)
      original_use: Logegebouw met verenigingslokaal en conciërgewoning
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/492004

- title: Castle villa (Vondelstraat 47-49)
  summary: Two crenellated towers with corner turrets make this villa of about 1873 look like a toy castle. Its mix of Gothic and Renaissance forms is rare in Amsterdam.
  body: |
    J.H. Schmitz designed this villa around 1873 for H. Wille, in a Gothic Revival style with Renaissance details. Little is known about Schmitz except that he was the son of the director of the Amsterdam Omnibus Company; he also designed Vondelstraat 72 across the street. In 1882 Wille's widow added the right-hand tower and one window bay as an annexe (no. 49), designed by H.H.J. Hogeman so that the two parts read as one building.

    Later owners kept altering it. In 1911 two floors were added over the corner basement, and in 1987 it was divided into apartments. When the Eerste Constantijn Huygensstraat was linked to the Van Baerlestraat in 1947, the villa suddenly found itself on a busy street corner.

    The register values it for its combination of Gothic and Renaissance features, rare in Amsterdam.

    Look for:
    - two identical towers with crenellations and turret-topped corner oriels
    - oriels on the ground and first floors of both towers
    - hood moulds on decorated brackets over every window
    - the stoop of eight steps with iron railings leading to the entrance between the towers
  category: housing
  lat: 52.361658
  lng: 4.87576
  address: Vondelstraat 47-49
  links:
    - { label: Rijksmonumentenregister (492018), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/492018" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q17301214" }
  attributes:
    heritage_status: National monument
    monument_number: "492018"
    built: c. 1873, 1882
    architect: J.H. Schmitz; annexe H.H.J. Hogeman
    listed: 1995
    original_use: Villa
  photos:
    - commons:File:2020 Vondelstraat 47-49.jpg
  sources:
    - rce:492018
    - city:224016 (on Schmitz)
  nl:
    title: Kasteelvilla (Vondelstraat 47-49)
    summary: Twee gekanteelde torens met arkels op de hoeken maken van deze villa uit omstreeks 1873 een klein kasteel. De combinatie van neogotiek en neorenaissance is in Amsterdam zeldzaam.
    body: |
      Vondelstraat 47 is een rond circa 1873 opgetrokken villa naar een ontwerp in neogotisch-renaissancistische stijl van J.H. Schmits in opdracht van H. Wille. Vondelstraat 49 bestaat uit de rechtertoren en de meest rechts gelegen vensteras en is oorspronkelijk gebouwd als 'bijbouw' naar een ontwerp van H.H.J. Hogeman uit 1882 in opdracht van de weduwe Wille, maar vormt stilistisch een onlosmakelijk geheel met nr. 47. Behalve het feit dat Schmitz de zoon was van F.J.W.H. Schmitz, directeur van de Amsterdamse Omnibus Maatschappij, is vooralsnog niets over hem bekend.

      In 1911 werd het souterrain op de hoek vergroot met twee daarboven gelegen verdiepingen; in 1987 is het pand verbouwd tot appartementen. Na de verbinding van de Eerste Constantijn Huygensstraat met de Van Baerlestraat in 1947 ligt het bouwblok op de hoek van die straat. Het register noemt de villa van belang vanwege de voor Amsterdam zeldzame combinatie van neogotische en neorenaissancistische stijlkenmerken.

      Let op:
      - de twee identieke torens met kantelen en arkels met torenvormige bekroningen
      - de erkers op de beganegrond en de eerste verdieping van beide torens
      - de gestileerde waterlijsten op sierconsoles boven alle vensters
      - de stoep van acht treden met sierijzeren leuningen naar de entree tussen de torens
    attributes:
      architect: J.H. Schmitz; bijbouw H.H.J. Hogeman
      original_use: Villa
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/492018
      - https://data.amsterdam.nl/monumenten/fee70a1a-e400-4fe1-954b-1b85136665e8

- title: Huize Johanna (Vondelstraat 51)
  summary: An 1899 house by Gerrit van Arkel whose top floor blooms with a bright Art Nouveau sgraffito of flowers on an ochre ground, above a doorway marked 'Johanna'.
  body: |
    Gerrit van Arkel drew this house with two homes in 1898; it was built in 1899. Van Arkel began with richly decorated neo-Gothic and neo-Renaissance houses, but from about 1894 he moved towards the sober Nieuwe Kunst (Dutch Art Nouveau) of Berlage and others, with oriels, loggias, asymmetric balconies and expressive roof lines. Forgotten for decades, his work was rediscovered from the 1970s. This house is almost unaltered and has a special place in his oeuvre.

    The plastered front is richly decorated, unlike the plain grey side gables. The left bay holds the raised entrance porch with two carved doors, one for the upper and one for the lower home. The top floor is the most striking part: a sgraffito of flowering plants in green, blue and pink on an ochre ground, lit by a row of three small windows.

    Look for:
    - the large plaque reading *Johanna* above the entrance porch
    - green glazed tiles lining the porch
    - the sgraffito on the top floor and the timber brackets under the overhanging eaves
    - the cast-iron front fence mixing Renaissance and Nieuwe Kunst ornament
  category: housing
  lat: 52.361576
  lng: 4.875467
  address: Vondelstraat 51
  links:
    - { label: Gemeentelijk monument (224021), url: "https://data.amsterdam.nl/monumenten/a4679def-0975-47bf-91b6-cab27b5da5de" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "224021"
    built: "1899"
    architect: Gerrit van Arkel
    listed: 2008
    original_use: House with two homes
  photos:
    - commons:File:2020 Vondelstraat 51 (1).jpg
  sources:
    - city:224021
  nl:
    title: Huize Johanna (Vondelstraat 51)
    summary: Een huis van Gerrit van Arkel uit 1899 met bovenin een felgekleurde Nieuwe Kunst-sgraffito van bloeiende planten op okergeel, boven een portaal met de naam 'Johanna'.
    body: |
      De eerste ontwerptekening dateert van 1898 en is van de hand van architect Gerrit A. van Arkel. In zijn beginjaren bouwde Van Arkel voornamelijk rijk gedecoreerde woon- en winkelhuizen in een mengeling van neogotiek en neorenaissance; vanaf omstreeks 1894 sloot hij zich steeds meer aan bij de sobere Nieuwe Kunst van Berlage en anderen. Na lange tijd in de vergetelheid geraakt te zijn, kwam vanaf de jaren 1970 een groeiende waardering voor zijn werk. Als vrijwel ongewijzigd bewaard gebleven ontwerp neemt dit pand binnen zijn oeuvre een bijzondere plaats in.

      De gepleisterde voorgevel is in tegenstelling tot de andere gevels rijk gedecoreerd. In de linker vensteras bevindt zich het verhoogde entreeportaal met twee deuren: de linker geeft toegang tot de bovenwoning, de rechter tot de benedenwoning. De derde verdieping is de meest opvallende van de gevel; een Nieuwe Kunst-sgraffito siert hier met felle kleuren het oppervlak. De basis is okergeel en de voorstelling van planten met bloemen is groen, blauw en roze.

      Let op:
      - boven het portaal een grote plaquette met de naam 'Johanna'
      - het portaal, aan de binnenzijde bekleed met groene geglazuurde tegels
      - de sgraffito en de houten korbelen onder de overhellende dakrand
      - het gietijzeren hek met ornamentiek ontleend aan de Renaissance en de Nieuwe Kunst
    attributes:
      original_use: Herenhuis met twee woningen
    sources:
      - https://data.amsterdam.nl/monumenten/a4679def-0975-47bf-91b6-cab27b5da5de

- title: Vondelstraat 72 (Vondelstraat riots)
  summary: In 1980 squatters barricaded this corner house and made the crossing a 'free state' for three days, until army tanks cleared the barricades two months before Beatrix's inauguration.
  body: |
    This rounded corner house of 1869 by J.H. Schmitz is one of the oldest buildings on the street, with white plaster, cast-iron balcony canopies and a carved stone of the Reformed minister J.C. Sikkel, who lived and worked here from 1908 to 1920. The city listed it partly as a 'monument' to the squatters' movement.

    In the late 1970s Amsterdam's housing shortage was acute. In February 1980 the empty building was squatted and evicted almost at once. On 29 February it was squatted again, with a demonstration in the centre to distract the police. Riot police sent to evict it that evening were driven off within ten minutes, and 53 officers were injured. Squatters then built barricades from the Overtoom to the bridge over the Vondelpark, using material from nearby building sites, and created a small 'free state' that blocked five tram lines. Radio Stad Amsterdam broadcast the events live. On the morning of 3 March police used two army armoured engineering vehicles to break through the barricades. The squatters hardly resisted. These were the first of the big squatter riots, two months before Queen Beatrix's inauguration.

    Look for:
    - the stone with Sikkel's portrait on the blind first-floor bay
    - the canopy on cast-iron columns over the first-floor corner balcony
    - the quarter-round corner itself, the centre of the 1980 barricades
  category: hidden-history
  lat: 52.361927
  lng: 4.875654
  address: Vondelstraat 72, corner Eerste Constantijn Huygensstraat
  links:
    - { label: Gemeentelijk monument (224016), url: "https://data.amsterdam.nl/monumenten/fee70a1a-e400-4fe1-954b-1b85136665e8" }
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Vondelstraatrellen" }
    - { label: Wikipedia (en), url: "https://en.wikipedia.org/wiki/Vondelstraat_Riots" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "224016"
    built: "1869"
    architect: J.H. Schmitz
    listed: 2008
    original_use: Apartment house
  photos:
    - commons:File:Vondelstraat 72 hoek Eerste constantijn Huygensstraat foto 1.JPG
    - commons:File:Barricaden rond kraakpand in Vondelstraat Amsterdam overzicht (vrijdagavond) in, Bestanddeelnr 934-6653.jpg
  sources:
    - city:224016
    - https://nl.wikipedia.org/wiki/Vondelstraatrellen
    - https://en.wikipedia.org/wiki/Vondelstraat_Riots
  nl:
    title: Vondelstraat 72 (Vondelstraatrellen)
    summary: In 1980 barricadeerden krakers dit hoekpand en werd de kruising drie dagen een vrijstaat, tot pantservoertuigen van het leger de barricaden opruimden, twee maanden voor de inhuldiging van Beatrix.
    body: |
      Het pand van J.H. Schmitz uit 1869, met een kwartronde hoek en wit geschilderde gepleisterde gevels, is een van de vroegste gebouwen aan de Vondelstraat. Het gebouw is volgens het register een 'monument' geworden voor de krakersrellen en hun protest tegen de woningnood.

      De Vondelstraatrellen waren de eerste grote krakersrellen in Amsterdam, die plaatsvonden van 29 februari t/m 3 maart 1980, twee maanden voor de inhuldiging van koningin Beatrix. Op 29 februari werd het eerder ontruimde pand opnieuw gekraakt; een grote demonstratie in de binnenstad moest de aandacht van de politie afleiden. De drie pelotons Mobiele Eenheid die erop af werden gestuurd, werden binnen tien minuten door een grote groep krakers verjaagd. Door de opbouw van barricaden tussen de Overtoom en de brug over het Vondelpark ontstond een vrijstaat waar politie en hulpdiensten geen toegang meer hadden. Het hele treffen was rechtstreeks te volgen via Radio Stad Amsterdam. Op de ochtend van 3 maart gebruikte de politie twee pantsergenievoertuigen van de Koninklijke Landmacht om een bres te slaan in de barricaden. De krakers boden nauwelijks verzet.

      Let op:
      - de natuurstenen gevelsteen in de blinde vensteras met een afbeelding van de gereformeerde predikant Johannes Cornelis Sikkel, die hier tussen 1908 en zijn dood in 1920 woonde en werkte
      - de als een baldakijn vormgegeven decoratie op gietijzeren zuiltjes bij het hoekbalkon
      - de kwartronde hoek zelf, het middelpunt van de barricaden
    attributes:
      original_use: Woongebouw
    sources:
      - https://data.amsterdam.nl/monumenten/fee70a1a-e400-4fe1-954b-1b85136665e8
      - https://nl.wikipedia.org/wiki/Vondelstraatrellen

- title: Vondelstraat 65-67
  summary: A double house of 1876 built for a famous Kalverstraat fishmonger, later a raided roulette club and a girls' school. Remco Campert wrote 'Het leven is vurrukkulluk' here.
  body: |
    Johannes Christiaan van Laar (1822–1895), owner of a well-known fish shop and restaurant in the Kalverstraat, had this neo-Renaissance double house built in 1876 and lived in the right half. The left half was probably first occupied by the colonial businessman C.A. Tol and his wife.

    The house's later history is colourful. In 1906 a gambling den with the fine name *Club de Bienfaisance* (charity club) operated at no. 67; the police raided it because roulette was banned, and the club was closed the next year. From 1909 to 1924 no. 67 housed the Peeters school, a Catholic school for girls up to 19 and boys up to 8, which still exists elsewhere in the city. Around 1960 the poet and novelist Remco Campert lived at no. 65, sharing the house with the journalist and director Jan Vrijman, and wrote *Het leven is vurrukkulluk* here, among other works. Today it houses the Moroccan consulate.

    Look for:
    - the symmetrical neo-Renaissance double front, one house mirroring the other
    - the separate entrances of the two halves
  category: housing
  lat: 52.361338
  lng: 4.874531
  address: Vondelstraat 65-67
  links:
    - { label: Gemeentelijk monument (200362), url: "https://data.amsterdam.nl/monumenten/64af697a-cdeb-470a-8a73-9e35d422e201" }
    - { label: Amsterdam op de kaart, url: "https://amsterdamopdekaart.nl/1850-1940/Vondelstraat/65-67" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "200362"
    built: "1876"
    architect: N. Vos (attributed)
    listed: 1991
    original_use: Double house
  photos:
    - commons:File:2020 Vondelstraat 65-67.jpg
  sources:
    - city:200362 (record has no description text)
    - https://amsterdamopdekaart.nl/1850-1940/Vondelstraat/65-67 (cites MIP, Algemeen Handelsblad 28-9-1906, Ons Amsterdam)
  nl:
    title: Vondelstraat 65-67
    summary: Een dubbel woonhuis uit 1876 voor een bekende viswinkelier uit de Kalverstraat, later een opgerolde roulettesociëteit en een meisjesschool. Remco Campert schreef hier Het leven is vurrukkulluk.
    body: |
      Dit dubbele woonhuis in neorenaissancestijl uit 1876 werd gebouwd in opdracht van Johannes Christiaan van Laar (1822-1895), eigenaar van een vermaarde viswinkel en -restaurant in de Kalverstraat. Hij woonde zelf in het rechterdeel; in het andere deel woonde aanvankelijk vermoedelijk de koloniaal ondernemer C.A. Tol met zijn vrouw.

      In 1906 zat op nummer 67 een gokgelegenheid met de naam Club de Bienfaisance ('club van liefdadigheid'). De politie deed er een inval, omdat roulette toen verboden was, en het jaar daarop werd de sociëteit gesloten. Van 1909 tot 1924 zat op nummer 67 de Peeters-school, een katholieke school voor meisjes tot 19 jaar en jongens tot 8 jaar. Rond 1960 woonde Remco Campert op nummer 65, samen met journalist en regisseur Jan Vrijman; hij schreef er onder meer Het leven is vurrukkulluk. Tegenwoordig is hier het consulaat van Marokko gevestigd.

      Let op:
      - de symmetrische neorenaissancegevel, waarin het ene huis het andere spiegelt
      - de afzonderlijke ingangen van beide helften
    attributes:
      architect: N. Vos (toegeschreven)
      original_use: Dubbel woonhuis
    sources:
      - https://amsterdamopdekaart.nl/1850-1940/Vondelstraat/65-67 (feiten; Nederlandse tekst zelf geschreven)

- title: Cuypers' own villas (Vondelstraat 73–79)
  summary: Pierre Cuypers built two double villas opposite his Vondelkerk and lived in both. A tile panel mocks his critics. 'Jan thinks it up, Piet builds it, Klaas finds fault with it.'
  body: |
    Cuypers was both client and architect of the double villa at nos. 73-75, built in 1876–1877 opposite the Vondelkerk, just west of a park entrance. He lived there until 1881. He then moved next door into a second double villa, nos. 77-79, built in 1881–1882, and stayed until he returned to Roermond in 1894. His son Jos later lived there too. The register calls the villas an early example of changing ideas about villas and home life, and typical of Cuypers' secular work.

    At 77-79 Cuypers put the living rooms at the back, on the sunny park side, with only secondary rooms on the north-facing street side, except in the rental half on the right. He chose red brick as suited to the greenery of park and gardens. The tiles came from the Van Hulst factory in Harlingen, after cartoons by Professor Sturm. One tile panel shows three men above the words *Jan bedenkt het, Piet volbrengt het, Klaas laakt het* (Jan thinks it up, Piet builds it, Klaas finds fault with it). By Klaas, Cuypers reportedly meant the city, which kept making him redraw his plans for the street.

    Look for:
    - the tile panel of the three men on nos. 77-79
    - the stair towers with stepped windows following the stairs and octagonal lanterns, at 73-75
    - corner oriels with tall roofs and glazed-brick bands
  category: housing
  lat: 52.360936
  lng: 4.873200
  address: Vondelstraat 73-79
  links:
    - { label: Rijksmonumentenregister (492043), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/492043" }
    - { label: Rijksmonumentenregister (492050), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/492050" }
    - { label: Rijksmonumentenregister (5905), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/5905" }
    - { label: Rijksmonumentenregister (5906), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/5906" }
