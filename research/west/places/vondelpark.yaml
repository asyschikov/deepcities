    - "https://data.amsterdam.nl/monumenten/a4679def-0975-47bf-91b6-cab27b5da5de"
  nl:
    title: Dubbele villa (Vondelstraat 89-91)
    summary: "Een dubbele villa uit 1884 van Wilkens en Van Arkel, met in het midden van de gevel één gedeelde regenpijp die uit een gestuct masker komt. De achtertuin loopt door tot in het Vondelpark."
    body: |
      Midden op de gevel, precies waar de twee huizen elkaar raken, kijkt een gezichtje van stucwerk naar buiten. Uit dat masker komt de regenpijp, ingemetseld op de middenas, voor beide huizen tegelijk.

      W. Wilkens en G. van Arkel zetten 3 november 1884 onder hun tekening voor 'een dubbele villa in het Vondelpark'. De villa staat aan de zuidkant van de Vondelstraat, schuin tegenover de Vondelkerk en naast een van de parkingangen; achter het huis begint het park. De plattegrond bestaat uit drie stroken: een brede aan de straat, een brede aan het park en daartussen een smallere zone, waar het trappenhuis de toon zet. Via een stoep kom je op een open bordes voor het portaal. Vanuit de hal gaan nog een paar treden omhoog naar de vestibule en de statige trap.

      De rechthoekige voorgevel staat op een brede plint en heeft vier traveeën die bijna gelijk zijn. Volgens het register is het pand gaaf gebleven in vorm, materiaal en detail, en typisch voor de eclectische smaak van zijn tijd. Van Arkel, door het register een belangrijk architect voor Amsterdam genoemd, stapte later over op een sobere Jugendstil. Zie zijn Huize Johanna op nummer 51.

      Let op:
      - de ingemetselde regenpijp op de middenas, die begint bij een stucmasker op de plek waar de twee huizen samenkomen
      - een stenen bol naast het fronton van de linker travee; op de tekening staan zulke bollen naast elk fronton
    attributes:
      original_use: Dubbele villa
    sources:
      - https://data.amsterdam.nl/monumenten/8723c705-db63-47e6-9a06-8528e986d669

- title: Theo Nieuwenhuis room (Vondelstraat 101-103)
  summary: A picturesque 1884 double villa on the park, where in 1929 one of the first Dutch women architects, Margaret Kropholler, rebuilt a room to hold a rare interior by Theo Nieuwenhuis.
  body: |
    H.J. Wigman designed this double villa in 1884–1885 in a picturesque mix of neo-Renaissance and chalet style. It belongs to the row of free-standing houses set in greenery along the northern edge of the Vondelpark, meant as an architectural frame for the park.

    In 1929 the front room on the main floor of no. 103 was rebuilt to hold panelling, doors and a fireplace designed by Theo Nieuwenhuis. The interior is a reminder of his collaboration with his patron Klaas Groesbeek. Much of Nieuwenhuis' work has been lost or moved into museums, so an interior still in its original setting is rare. The architect of the conversion was Margaret Kropholler, one of the first women architects in the Netherlands. She also changed the outside of no. 103, so no. 101 is now the more original half.

    Look for:
    - the difference between the two halves: no. 101 still close to Wigman's design, no. 103 straighter and more businesslike after 1929
    - the mix of neo-Renaissance and chalet style
  category: housing
  lat: 52.360232
  lng: 4.87011
  address: Vondelstraat 101-103
  links:
    - { label: Gemeentelijk monument (200971), url: "https://data.amsterdam.nl/monumenten/6f261d95-8bab-4e62-baa0-4e0228a14232" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "200971"
    built: 1884–1885
    architect: H.J. Wigman; 1929 alterations Margaret Kropholler
    listed: 2022
    original_use: Double villa
  photos:
    - commons:File:2021 Vondelstraat 101-103, Asd.jpg
  sources:
    - city:200971
  nl:
    title: Nieuwenhuis-kamer (Vondelstraat 101-103)
    summary: "Een schilderachtige dubbele villa uit 1884 aan het park, waar Margaret Kropholler, een van de eerste vrouwen die in Nederland architect werden, in 1929 een kamer ombouwde voor een zeldzaam interieur van Theo Nieuwenhuis."
    body: |
      Wie in Nederland werk van Theo Nieuwenhuis wil zien, belandt meestal in een museum: veel ervan is verdwenen of daarheen verhuisd. Hier zit een interieur van hem nog op zijn eigen plek. In 1929 werd de voorkamer op de bel-etage van nummer 103 verbouwd om lambriseringen, deuren en een schouw naar zijn ontwerp te kunnen plaatsen. Het interieur herinnert aan zijn samenwerking met zijn beschermheer Klaas Groesbeek. De verbouwing was het werk van Margaret Kropholler, een van de eerste vrouwen die in Nederland als architect werkten. Zij veranderde ook de buitenkant van nummer 103, waardoor nummer 101 nu de meest oorspronkelijke helft is.

      Het huis zelf is ouder. H.J. Wigman ontwierp de dubbele villa in 1884-1885 als schilderachtig mengsel van neorenaissance en chaletstijl. Ze hoort bij de rij vrijstaande huizen in het groen langs de noordrand van het Vondelpark, die als architectonische lijst rond het park bedoeld waren.

      Let op:
      - het verschil tussen de twee helften: nummer 101 nog dicht bij het ontwerp van Wigman, nummer 103 sinds 1929 strakker en zakelijker
      - de mengeling van neorenaissance en chaletstijl
    attributes:
      architect: H.J. Wigman; verbouwing 1929 Margaret Kropholler
      original_use: Dubbele villa
    sources:
      - https://data.amsterdam.nl/monumenten/6f261d95-8bab-4e62-baa0-4e0228a14232

- title: Garden buildings on the Zandpad
  summary: "A gardener's cottage with an 1853 weathervane and a chalet-style orangery survive from the pre-urban buildings on the Zandpad, one of only two pre-urban paths left in Amsterdam."
  body: |
    The Zandpad (sand path) is, with the Schapenburgerpad, the only path left in Amsterdam from before the city was built here. Two small buildings on it once stood in the garden of the house at Tesselschadestraat 9; they were built in two phases for the Scholten-Commelin family. The register protects them as a complex of garden buildings belonging to the original pre-urban buildings on the Zandpad.

    The brick gardener's cottage has a single storey under a hipped roof with a raised, partly plastered attic and diamond-paned windows. A cast-iron weathervane on the roof gives the building year as 1853; the city's records give 1885. Next to it stands an orangery of 1890 in wood and brick, in the Swiss chalet style, with a bent garden front almost entirely of glass. A gate between two stone piers topped with stone balls leads to the gardens.

    Look for:
    - the weathervane with the date 1853
    - three arched windows with wooden shutters and fork tracery on the Zandpad side of the cottage
    - richly carved bargeboards on the orangery gable
    - the gate piers with stone balls
  category: hidden-history
  lat: 52.361323
  lng: 4.879148
  address: Zandpad 2-3
  links:
    - { label: Rijksmonumentenregister (491941), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/491941" }
    - { label: Rijksmonumentenregister (491934), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/491934" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q17301184" }
  attributes:
    heritage_status: National monument
    monument_number: 491934, 491941
    built: 1853 (gardener's cottage), 1890 (orangery)
    listed: 1995
    original_use: Gardener's cottage and orangery
  photos:
    - commons:File:Zandpad 3.JPG
    - commons:File:Orangerie Zandpad 2c.JPG
  sources:
    - rce:491941, rce:491934
    - "https://monumentenregister.cultureelerfgoed.nl/complexen/491931"
    - "https://api.data.amsterdam.nl/v1/monumenten/monumenten/?monumentnummer=491941"
  nl:
    title: Tuingebouwen aan het Zandpad
    summary: "Een tuinmanshuisje met een windvaan uit 1853 en een oranjerie in chaletstijl, resten van de bebouwing van vóór de stad aan het Zandpad. Met het Schapenburgerpad is dit het enige pad dat Amsterdam nog over heeft uit die tijd."
    body: |
      Het Zandpad lag er al voordat hier stad was. Samen met het Schapenburgerpad is het het enige pre-stedelijke pad dat Amsterdam nog heeft. Twee tuingebouwtjes aan dit pad stonden ooit in de tuin van het huis Tesselschadestraat 9. De familie Scholten-Commelin liet ze in twee fasen bouwen. Het rijksmonumentenregister beschermt ze samen, als deel van de oorspronkelijke bebouwing van vóór de stad.

      Het tuinmanshuis is van baksteen: één bouwlaag onder een schilddak, met daarop een verhoogde, deels gepleisterde dakopbouw met ruitvormige raampjes. Bovenop draait een gietijzeren windvaan met het bouwjaar 1853. De gemeentelijke gegevens houden het op 1885. Ernaast staat een oranjerie uit 1890, van hout en baksteen, in Zwitserse chaletstijl. De geknikte tuingevel is bijna helemaal van glas. Een poort tussen twee stenen pijlers met stenen bollen erop geeft toegang tot de tuinen.

      Let op:
      - de windvaan met het jaartal 1853
      - aan de kant van het Zandpad drie boogvensters met houten luiken en vorktracering in de bovenlichten
      - de rijk bewerkte windveren aan de puntgevel van de oranjerie
      - de poortpijlers met de stenen bollen
    attributes:
      original_use: Tuinmanswoning en oranjerie
    sources:
