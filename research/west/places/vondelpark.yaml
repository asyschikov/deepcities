  nl:
    title: Vondelparkpaviljoen
    summary: "Het café-restaurant van het park uit 1881 werd cultureel centrum, Filmmuseum en medialab van een omroep. Twee gietijzeren riviergodinnen uit Frankrijk houden nog altijd de wacht bij de trappen naar het terras."
    body: |
      Dit gebouw heeft veel levens gehad. Het begon als horeca: het parkbestuur liet Willem Hamer in de noordwesthoek een café-restaurant met kasteleinswoning ontwerpen, gebouwd in 1879-1881 in Italiaanse renaissancestijl. Een gepleisterd middendeel met Ionische halfzuilen, lage vleugels, hoektorentjes met koepels, en een terras van vijf meter breed op een onderbouw van ruw bewerkte baksteen. Binnen waren drie zalen voor elk honderd gasten; daaronder lagen kelders voor wijn, bier en ijs. In 1890 kwam er een restaurantzaal bij.

      In de oorlog nam de Duitse bezetter het gebouw in beslag. In 1947 ging het weer open als internationaal cultureel centrum, en in de jaren vijftig was het de thuisbasis van het Holland Festival. Van 1972 tot 2012 zat hier het Nederlands Filmmuseum, dat het interieur van Jean Desmets bioscoop Parisien in een van zijn filmzalen liet inbouwen. Omroep AVROTROS gebruikte het pand van 2014 tot 2021 als VondelCS. In 2025 keerde café Vertigo terug, genoemd naar de film van Hitchcock.

      Let op:
      - de twee beelden van riviergodinnen, aan weerszijden van de perceelgrens
      - het sierlijke ijzeren traliewerk in de getoogde vensters
      - de balustrade van het terras, die aan de oostkant om het gebouw heen loopt
      - naast de trap de twee keramieken vrouwen van Leo Braat, deels beschilderd, met schalen op hun hoofd die als plantenbak dienen, een knipoog naar de precolumbiaanse kunst die hij bewonderde
    attributes:
      original_use: Café-restaurant met kasteleinswoning
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/504833
      - https://nl.wikipedia.org/wiki/Vondelparkpaviljoen

- title: Former pumping station (Vondelpark 4)
  summary: "A small neo-Renaissance house with a clock in its gable was built to pump water from the area by the Overtoom. When the Overtoom canal was filled in 1903 it became the park superintendent's home."
  body: |
    Around 1880 the park association built a free-standing pumping station in the north of the park, east of the Kattenlaan, to drain the area near the Overtoom and the Kattensloot ditch. The pumping machinery sat in the front part of the building. The architect is unknown; Willem Hamer, who designed the park pavilion, has been suggested.

    After the Overtoomse Vaart and the Kattensloot were filled in around 1903, the pumps were no longer needed. The building became the house of the park superintendent and gained a rear wing in a quite different style. It now houses an after-school childcare centre.

    The front is plain but carefully made: three bays, a raised middle bay with its own small gable, a door under a projecting cornice on brackets, and a row of blind windows under the eaves. The upper floor of the front house still has its original timber beams.

    Look for:
    - the round clock at the top of the middle bay
    - four plastered cast-iron rosette anchors under the string course
    - the culvert between the pond and the building, with lines from Anna Enquist's poem *Stuwmeer* cut out of the stone and maps of the park on the coping stones
  category: infrastructure
  lat: 52.358909
  lng: 4.865751
  address: Vondelpark 4
  links:
    - { label: Rijksmonumentenregister (504748), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/504748" }
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Vondelpark_4" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q17301737" }
