  nl:
    title: Houthandel Van de Vijsel (Overtoom 13-17)
    summary: "Achter een bakstenen gevel staan de houten loodsen van een houthandel uit 1890, een van de laatste sporen van de handel langs de oude Overtoomse Vaart. Nu is het een hotel dat veel van het oude hout heeft gehouden."
    body: |
      Van de straat zie je alleen baksteen. Daarachter staan vier houten draagconstructies van een houthandel, en waar de buren al muren hadden, werd het hout er gewoon tussen geklemd. Daar hoefden de loodsen geen eigen gevels.

      Houthandel Van de Vijsel bestond al sinds 1798 en verhuisde in 1875 naar deze plek, toen nog de Vondelkade aan de Overtoomse Vaart. In 1890 tekende de 25-jarige J.W.F. Hartkamp er een kantoor, een paardenstal en drie loodsen met een houten skelet achter een bakstenen straatgevel. Een spoorrail liep van de Overtoom tot achter op het perceel. Na de oorlog leverde de firma ook hout voor de bouw van de Westelijke Tuinsteden.

      Het monumentenregister noemt zulke houten opslagloodsen nu 'vreemde eenden in de bijt': een bijna verdwenen soort bedrijfsgebouw uit de late negentiende eeuw aan de rand van de stad. Begin deze eeuw hield de houthandel hier op. Een hotel liet lang op zich wachten, want buren vreesden lawaai en liefhebbers van industrieel erfgoed vreesden voor het gebouw. Uiteindelijk maakte architect Minke Wagenaar er Hotel Van de Vijsel van, met behoud van veel van het oorspronkelijke hout.

      Let op:
      - de belettering op de gevel, die uit 1964 stamt
      - de poort in het midden, die direct de houtloods in leidde
      - het voorste deel van het complex, dat vanaf de eerste verdieping boven de buren uitsteekt
    attributes:
      original_use: Houthandel met kantoor en paardenstal
    sources:
      - https://nl.wikipedia.org/wiki/Overtoom_13-17_(Amsterdam)
      - https://data.amsterdam.nl/monumenten/b2e87366-a621-4d1e-8a2f-7f1e9c4b41f4

- title: 1914 shops and workshop (Overtoom 21-25 and 45)
  summary: Two pre-war work buildings on the old exit road. One has curved shop windows and a tiled porch floor; the other was a contractor's workshop with tile panels at its roofline.
  body: |
    Around 1900 the Overtoom became a busy exit road, ideal for shops and trades. Two buildings from 1914 show the brick architecture of the years just before the First World War: a solid base, a vertical middle zone and a decorated roofline.

    Overtoom 21-25 has two shops under four floors of flats, with a narrower side wing and a storage hall with a sawtooth roof behind. An archive photo names "M. Muylwijk, bouwkundige", probably the designer, from a firm that sold complete building, office and home fittings. The shop windows behind the granite-clad piers bulge outward, gently leading passers-by into the porch.

    Overtoom 45 was built for the contractor H. Lesage, who designed it himself and had his workshop on the ground floor. His firm stayed until about 2006. A 1974 article mentions an Amsterdam School interior, but it is not known whether it survives.

    Look for:
    - at 21-25, the tile mosaic set in the granito floor of the central porch
    - at 21-25, the two oriels over the first and second floors
    - at 45, the granite shop front with chiselled line decoration
    - at 45, white, blue and yellow tile panels on the stone piers at the roof edge, and stained glass with flower patterns in the transoms
    - across the road at the start of the Overtoom (by no. 16), *Standing Stone* by PINK (Helen Scheerder, a former actress and performance artist): a huge stone on a granite plinth, its title and her name in gold letters
  category: industrial
  lat: 52.363258
  lng: 4.877841
  address: Overtoom 21-25 and Overtoom 45
  links:
    - { label: Gemeentelijk monument (224025), url: "https://data.amsterdam.nl/monumenten/b4956bab-696c-4648-9d40-b5643e4d8c5f" }
    - { label: Gemeentelijk monument (224027), url: "https://data.amsterdam.nl/monumenten/d68d29f9-43ac-4dfb-93b2-247a49db268e" }
  attributes:
    heritage_status: Municipal monument
    monument_number: 224025, 224027
    built: "1914"
    architect: M. Muylwijk (21-25), H. Lesage (45)
    listed: 2008
    original_use: Shops and contractor's workshop with flats
  photos:
    - commons:File:2021 Overtoom 21-25 (1).jpg
    - commons:File:2021 Overtoom 45, Asd (1).jpg
  sources:
    - city:224025, city:224027
    - "Kunstwacht 2155 'Standing Stone' (Overtoom 16; PINK = Helen Scheerder, b. 1943, drama at the Brussels conservatoire, actress, co-founder of the Mass-Moving collective, performance artist); OSM node 11007296655 gives 1989. Round 4 merge."
  nl:
    title: Winkels en werkplaats uit 1914 (Overtoom 21-25 en 45)
    summary: Twee bedrijfspanden van vlak voor de Eerste Wereldoorlog aan de oude uitvalsweg. Het ene heeft bollende etalages en een tegelmozaïek in het portiek, het andere was een aannemerswerkplaats met tegeltableaus bovenin.
    body: |
      Rond 1900 groeide de Overtoom uit tot drukke uitvalsweg, bij uitstek geschikt voor winkels en bedrijven. Twee panden uit 1914 tonen de baksteenarchitectuur van vlak voor de Eerste Wereldoorlog: een basement, een middenzone met verticale nadruk en een decoratieve dakrand.

      Overtoom 21-25 heeft twee winkels onder vier lagen bovenwoningen, met een smaller zijvolume en achter een opslaghal met sheddak. Op een foto in de beeldbank staat 'M. Muylwijk, bouwkundige' vermeld, waarschijnlijk de ontwerper, van een bedrijf in complete bouw-, kantoor- en woninginrichting. De etalages bollen achter de met graniet beklede pijlers op en leiden de voorbijganger als vanzelf het portiek in.

      Overtoom 45 werd gebouwd voor aannemer H. Lesage, die het zelf ontwierp en beneden zijn werkplaats had; het bedrijf zat er tot circa 2006. In Ons Amsterdam van 1974 is sprake van een interieur in Amsterdamse Schoolstijl; of dat er nog is, is onbekend.

      Let op:
      - bij 21-25 het tegelmozaïek in de granitovloer van het middenportiek
      - bij 21-25 de twee erkers over de eerste en tweede verdieping
      - bij 45 de granieten pui met uitgehakte lijndecoratie
      - bij 45 de wit-blauw-gele tegeltableaus op de natuurstenen lisenen bij de dakrand en het glas-in-lood met bloempatroon in de bovenlichten
      - aan de overkant, aan het begin van de Overtoom (bij nummer 16), *Standing Stone* van PINK, de kunstenaarsnaam van oud-actrice en performancekunstenaar Helen Scheerder: een reusachtige kei op een granieten sokkel, met titel en signatuur in gouden letters
    attributes:
      original_use: Winkels en aannemerswerkplaats met bovenwoningen
    sources:
      - https://data.amsterdam.nl/monumenten/b4956bab-696c-4648-9d40-b5643e4d8c5f
      - https://data.amsterdam.nl/monumenten/d68d29f9-43ac-4dfb-93b2-247a49db268e

- title: Traffic police station (Overtoom 37-43)
  summary: Amsterdam's 1924 traffic police station by P.L. Marnette swings in and out like a wave, with a round lodge for the duty sergeant. The city's first traffic lights were reportedly run from here.
  body: |
    P.L. Marnette of Public Works designed the *Politiebureau voor het Verkeerswezen aan den Overtoom*; it was built in 1923–1924 and opened on 1 October 1924. It housed motorcycle and bicycle police, vehicle inspection and a weighbridge for lorries, with stables for police horses at the back. Amsterdam's first traffic lights are said to have been operated from here around 1932, a sign of how quickly motor traffic grew. A conversion in mid-1994 kept only the street front and the parts next to it. There is now a gym on the ground floor with flats above.

    The front is lively Amsterdam School work. Between garage doors and the main entrance sits a flattened round lodge for the duty sergeant. Above it, the façade swings back, forward and back again in concave and convex curves, with two bands of ten coupled windows each. A nearly blind top wall ends in a toothed frieze with pointed corners.

    Look for:
    - the round sergeant's lodge in the stone-clad ground floor
    - heavy double doors with expressive ironwork and oval windows
    - small windows for working the flagpoles, with three-part flagpole holders
  category: civic
  lat: 52.363067
  lng: 4.877271
  address: Overtoom 37-43
  links:
    - { label: Rijksmonumentenregister (492082), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/492082" }
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Overtoom_39-41_(Amsterdam)" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q17301245" }
  attributes:
    heritage_status: National monument
    monument_number: "492082"
    built: 1923–1924
    architect: P.L. Marnette (Publieke Werken)
    listed: 1995
    original_use: Traffic police station
  photos:
    - commons:File:Overtoom 39.JPG
  sources:
    - rce:492082
