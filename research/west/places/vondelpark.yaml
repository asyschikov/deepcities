  nl:
    title: Villa Betty
    summary: "Honderd meter achter de Overtoom verstopt staat een villa in chaletstijl met Arabische, Chinese en Jugendstilkamers, genoemd naar de 'koningin van de Overtoom'. De tuinbrug is een rijksmonument op zich."
    body: |
      Betty von Hunteln werd in haar tijd de koningin van de Overtoom genoemd. Breitner, Isaac Israëls en Mesdag kwamen langs in het huis dat haar naam draagt, honderd meter van de straat.

      De villa werd in oktober 1877 begonnen voor de tabakshandelaren F.A. en P.H.F. Smithuijsen, toen dit land nog bij Nieuwer-Amstel hoorde en de Overtoom een vaart was. Volgens een eerste steen werd die gelegd door de tweejarige P.H.F.M. Smithuijsen. In 1896 kocht tabakshandelaar Eduard Lehmann het huis; in 1900 trouwde hij met Betty von Hunteln en vernoemde hij de villa naar haar. Hij liet er een reeks stijlkamers in maken: een Hollandse, een Louis XVI-, een Arabische, een Chinese en een Engelse kamer, een biljartkamer in Jugendstil en boven een Empire- en een Mechelse kamer. Betty overleed in 1980.

      Het complex heeft drie beschermde onderdelen: de villa vlak bij het park, een koetshuis in neorenaissancestijl met koetsierswoning en poort aan de Overtoom (1900), en in de tuin een voetbrug van kunststeen met een nep-boomstronk.

      Let op:
      - vanaf de Overtoom het koetshuis met trapgevels, en een tweede eerste steen met de naam Betty Lehmann-von Hunteln en de datum 7 juni 1900
      - vanuit het Vondelpark de achtergevel met de vijfhoekige toren en de glazen Jugendstilluifel
      - de naam VILLA BETTY in zwarte kapitalen boven de trap naar de ingang
    attributes:
      architect: P.F. Laarman of H.G. Koster (toeschrijving onzeker)
      original_use: Villa met koetshuis
    sources:
      - https://nl.wikipedia.org/wiki/Overtoom_241_(Amsterdam)
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/491951
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/491961
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/491971

- title: Notary's houses (Overtoom 247–253)
  summary: Behind a low polder-house front hides a canal-house interior; next door, the notary who lived there had Eduard Cuypers build three town houses with his office in 1884.
  body: |
    Overtoom 247 is one of the increasingly rare survivors of the low buildings that lined the Overtoom when it was still a canal in the municipality of Nieuwer-Amstel. There are records of a building here from 1750, and a farm once stood on the plot. Behind the plain brick front of two storeys lies a house with the layout of a canal house: front house, courtyard and rear house, with a generous staircase hall and a richly decorated garden room. The rear house was probably built in 1893.

    In 1878 the notary J.F. Herbschleb bought the house. In 1884 he had Eduard Cuypers, nephew of Pierre Cuypers, design three town houses on the land beside it, on the corner of what was then the Kosterstraat (now the Gerard Brandtstraat). The ground floor of number 249 became his office, with a passage to his own house. In 1908 a later owner, Eduard Lehmann, owner of Villa Betty, whose coach house stands next door, closed the passage and split number 247 in two.

    Look for:
    - the contrast between the modest front of 247 and its tall neighbours
    - at 249, the only two-light window on the ground floor, where the notary's clerks worked
    - the pedimented porches and original doors with wrought-iron grilles
    - the side façade on the Gerard Brandtstraat, with a stepped gable like the front
  category: housing
  lat: 52.360772
  lng: 4.868371
  address: Overtoom 247–253, Gerard Brandtstraat
  links:
    - { label: Gemeentelijk monument (224028), url: "https://data.amsterdam.nl/monumenten/c9871087-7c46-4ad3-ab9d-6549414cea3d" }
    - { label: Gemeentelijk monument (224061), url: "https://data.amsterdam.nl/monumenten/31aa1f9f-cd86-4932-a2e3-d9b2462f7b4b" }
  attributes:
    heritage_status: Municipal monument
    monument_number: 224028, 224061
    built: before 1832 (front house 247); 1884 (249–253); 1893 (rear house 247)
    architect: Eduard Cuypers (249–253)
    listed: 2008
    original_use: Houses and notary's office
  photos:
    - commons:File:2021 Overtoom 249-253, Asd (1) 01.jpg
  sources:
    - city:224028, city:224061
  nl:
    title: Notarishuizen (Overtoom 247-253)
    summary: "Achter een laag polderhuisgeveltje zit een huis met de allure van een grachtenpand. Ernaast liet de notaris die hier woonde in 1884 door Eduard Cuypers drie herenhuizen bouwen, met zijn kantoor erbij."
    body: |
      Overtoom 247 is een van de steeds zeldzamere overblijfselen van de lage bebouwing die langs de Overtoom stond toen die nog een vaart was in de gemeente Nieuwer-Amstel. Al in 1750 wordt hier een gebouw vermeld, en op de kavel stond ooit een boerderij. Achter de eenvoudige bakstenen gevel van twee lagen schuilt een huis dat is ingedeeld als een grachtenpand: voorhuis, binnenplaats en achterhuis, met een royaal trappenhuis en een rijk versierde tuinzaal. Het achterhuis is waarschijnlijk in 1893 gebouwd.

      In 1878 kocht notaris J.F. Herbschleb het huis. In 1884 liet hij Eduard Cuypers, een neef van Pierre Cuypers, op de grond ernaast drie herenhuizen ontwerpen, op de hoek van de toenmalige Kosterstraat (nu de Gerard Brandtstraat). Op de begane grond van nummer 249 kwam zijn kantoor, met een doorgang naar zijn eigen woning. In 1908 zette een latere eigenaar, Eduard Lehmann van Villa Betty, waarvan het koetshuis ernaast staat, die doorgang dicht en deelde hij nummer 247 op in twee woningen.

      Let op:
      - het verschil tussen het bescheiden geveltje van 247 en de hoge buren
      - op 249 het enige tweelichtsvenster van de begane grond, waarachter de klerken van de notaris zaten
      - de portieken met frontons en de oorspronkelijke voordeuren met smeedijzeren roosters
      - de zijgevel aan de Gerard Brandtstraat, met net als aan de voorkant een topgevel
    attributes:
      built: vóór 1832 (voorhuis 247); 1884 (249-253); 1893 (achterhuis 247)
      original_use: Woonhuizen en notariskantoor
    sources:
      - https://data.amsterdam.nl/monumenten/c9871087-7c46-4ad3-ab9d-6549414cea3d
      - https://data.amsterdam.nl/monumenten/31aa1f9f-cd86-4932-a2e3-d9b2462f7b4b

- title: Parkkerk (Orgelpark)
  summary: "A domed church on the park where a minister was suspended in 1923 for saying the talking serpent of Genesis might be a metaphor. It is now an arts centre built around the organ."
  body: |
    E.A.C. Roest designed this centrally planned church, built in 1916–1918 on the corner of the Gerard Brandtstraat and the Vondelpark, with an attached parsonage. In 1923 its minister, J.G. Geelkerken, caused a stir by preaching that the serpent in Genesis 3 need not be read literally. The synod suspended him, and the congregation followed him into a new denomination, the Gereformeerde Kerken in Hersteld Verband. After the war it merged into the Dutch Reformed Church. The church closed in 1994, was restored in 2005 and has been the Orgelpark, an arts centre built around the organ, since 2007.

    Inside, three barrel vaults over the galleries meet to form a star vault under a stained-glass dome. The galleries still have their original chairs with foot warmers. The Sauer organ of 1922 is still in place.

    Look for:
    - the slate tent roof with an open octagonal turret
    - the oak door at the top of eleven stone steps on the Gerard Brandtstraat
    - rose windows above the side doors
    - the brick fence with ball-topped piers
  category: religious
  lat: 52.359999
  lng: 4.868292
  address: Gerard Brandtstraat 26-28
  links:
    - { label: Rijksmonumentenregister (492090), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/492090" }
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Orgelpark" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q17301247" }
  attributes:
    heritage_status: National monument
    monument_number: "492090"
    built: 1916–1918
    architect: E.A.C. Roest
    listed: 1995
    original_use: Church and parsonage
  photos:
    - commons:File:Parkkerk, Amsterdam.JPG
  sources:
    - rce:492090
    - https://nl.wikipedia.org/wiki/Orgelpark
  nl:
    title: Parkkerk (Orgelpark)
    summary: "Een koepelkerk aan het park waar in 1923 een dominee werd geschorst omdat hij preekte dat de sprekende slang uit Genesis best beeldspraak kon zijn. Nu is het een kunstcentrum dat om het orgel draait."
    body: |
      E.A.C. Roest ontwierp deze kerk op een centrale plattegrond, gebouwd in 1916-1918 op de hoek van de Gerard Brandtstraat en het Vondelpark, met een pastorie eraan vast. In 1923 zorgde dominee J.G. Geelkerken hier voor ophef met een preek waarin de slang uit Genesis 3 niet letterlijk genomen hoefde te worden. De synode schorste hem, en de gemeente ging met hem mee naar een nieuw kerkverband, de Gereformeerde Kerken in Hersteld Verband. Na de oorlog werd de gemeente onderdeel van de Hervormde Kerk. In 1994 sloot de kerk, in 2005 werd ze gerestaureerd en sinds 2007 zit hier het Orgelpark, een kunstcentrum dat om het orgel draait.

      Binnen grijpen drie tongewelven boven de galerijen in elkaar tot een stergewelf, onder een koepel van glas in lood. Op de galerijen staan nog de oorspronkelijke stoelen met voetverwarming. Ook het Sauer-orgel uit 1922 is er nog.

      Let op:
      - het met leien gedekte tentdak met een opengewerkt achtkantig torentje
      - de eikenhouten deur boven aan elf hardstenen treden aan de Gerard Brandtstraat
      - de roosvensters boven de zijdeuren
      - het bakstenen hek met pijlers met stenen bollen erop
    attributes:
      original_use: Kerk en pastorie
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/492090
      - https://nl.wikipedia.org/wiki/Orgelpark

- title: Zevenlandenhuizen
  summary: Seven houses, seven countries. In 1894 Tjeerd Kuipers gave each house in this row the look of a European nation, from a Russian onion dome to a Spanish horseshoe arch.
  body: |
    Tjeerd Kuipers designed this row of seven town houses in 1894 probably for J.H. van Eeghen and J.K. Huijsinga. Inside they are almost identical, partly mirrored, but each façade borrows the building tradition of a different country, and each carries its country's name. The building line curves very slightly, with the end houses stepping forward. The register values the row as a rare sample card of European styles applied to houses.

    From east to west:
    - no. 20, Germany: pointed windows and a wooden oriel turret with an onion-shaped roof
    - no. 22, France: white plaster and French balconies, inspired by Loire châteaux
    - no. 24, Spain: Moorish horseshoe arches and pink and white plaster bands
    - no. 26, Italy: a pink stuccoed palazzo with vases and obelisks on the cornice
    - no. 28, Russia: an onion dome topped by an Orthodox cross with a moon and a radiant sun
    - no. 30, the Netherlands: a stepped gable with a sundial and 'Anno 1894'
    - no. 30A, England: a castellated oriel whose 'murder holes' have been filled in

    Look for the animal figure over the Russian doorway and the shell niches on the Dutch gable. The Dutch house was later adapted for offices and a hotel, with a passage through to the English one.
  category: housing
  lat: 52.361557
  lng: 4.8772
  address: Roemer Visscherstraat 20-30A
  links:
    - { label: Rijksmonumentenregister (complex 491876), url: "https://monumentenregister.cultureelerfgoed.nl/complexen/491876" }
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Zevenlandenhuizen" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q5014538" }
  attributes:
    heritage_status: National monument
    monument_number: 491879, 491886, 491894, 491901, 491909, 491917, 491924
    built: "1894"
    architect: Tjeerd Kuipers
    listed: 1995
    original_use: Seven town houses
  photos:
    - commons:File:Zevenlandenhuizen 3.jpg
    - commons:File:Amsterdamzevenlanden.jpg
    - commons:File:Zevenlandenhuizen 5.jpg
  sources:
    - rce:491876 and the seven object descriptions
    - https://nl.wikipedia.org/wiki/Zevenlandenhuizen
  nl:
    title: Zevenlandenhuizen
    summary: "Een Russische uikoepel met orthodox kruis, maan en zon. Tjeerd Kuipers gaf in 1894 elk van zeven herenhuizen het gezicht van een Europees land, van Duitse spitsbogen tot een Engelse erker met kantelen."
    body: |
      Boven op nummer 28 staat een uidak met een orthodox kruis, een maan en een stralende zon. Dat is Rusland. Ernaast liggen nog zes landen, allemaal in één rij herenhuizen uit 1894, getekend door Tjeerd Kuipers, vermoedelijk voor J.H. van Eeghen en J.K. Huijsinga.

      Achter de gevels is het veel minder exotisch. De huizen hebben vrijwel dezelfde indeling, een deel ervan in spiegelbeeld. Alleen de voorkant verschilt: elk huis leent de bouwtraditie van een ander land en draagt de naam van dat land op de gevel. De rij volgt een flauwe bocht, met de twee buitenste huizen een stukje naar voren. Het rijksregister noemt het geheel een zeldzame staalkaart van Europese bouwstijlen, toegepast op woonhuizen.

      Van oost naar west:
      - nr. 20, Duitsland: spitsboogvensters en een houten arkeltorentje met uivormig dak
      - nr. 22, Frankrijk: wit pleisterwerk en Franse balkons, met een Loire-kasteel als voorbeeld
      - nr. 24, Spanje: Moorse hoefijzerbogen en banden van roze en wit pleister
      - nr. 26, Italië: een roze gestuct palazzo met siervazen en obelisken op de kroonlijst
      - nr. 28, Rusland: de uikoepel met kruis, maan en zon
      - nr. 30, Nederland: een trapgevel met zonnewijzer en 'Anno 1894'
      - nr. 30A, Engeland: een erker met kantelen, waarvan de 'moordgaten' zijn dichtgemaakt

      Het Hollandse huis kreeg later kantoren en een hotel, met een doorgang naar het Engelse buurpand.

      Let op:
      - het dierfiguur boven de Russische voordeur
      - de schelpnissen in de Hollandse gevel
    attributes:
      original_use: Zeven herenhuizen
    sources:
      - https://nl.wikipedia.org/wiki/Zevenlandenhuizen
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/491909
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/491924

- title: Villas at the park end of Roemer Visscherstraat
  summary: "Round the corner from the Zevenlandenhuizen, the same developers had Tjeerd Kuipers design more villas by the park; between them stands a half-timbered 'English' house for the banker J.G. Wertheim."
  body: |
    When the Zevenlandenhuizen were permitted, the developers J.W. van Eeghen and J.K. Huizinga also got permits for two more of Tjeerd Kuipers' designs nearby. Number 42 (1893–1895) is a dark brick corner house with a bell-roofed corner oriel and stepped gables. Kuipers repeated one motif all over it, a half wheel or setting sun. Numbers 46-50 (1894) look like one large villa with towers, balconies and oriels facing the park, but were built as separate homes. Here Renaissance motifs mix with Art Nouveau plant ornament, a rare combination in Amsterdam. Kuipers himself lodged at number 48 for a while.

    Between them, number 44 (1894) is by Eduard Cuypers for the banker Johannes Gustaaf Wertheim, son of A.C. Wertheim. Cuypers gave the upper floor white-painted half-timbering, an English touch, and a cornice of red, yellow and blue brick mosaic. Across the street, number 47 is an earlier stuccoed villa of about 1885 with its original iron fence.

    These houses were built when the Eerste Constantijn Huygensstraat still ended here. It was only cut through to the Van Baerlestraat in 1947.

    Look for:
    - the setting-sun motif over the door and windows of number 42
    - the horseshoe arch in the tower top of number 46 and the plant-motif pilasters at number 50
    - the half-timbering and brick mosaic of number 44
  category: housing
  lat: 52.361237
  lng: 4.876117
  address: Roemer Visscherstraat 42-50 and 47
  links:
    - { label: Gemeentelijk monument (224017), url: "https://data.amsterdam.nl/monumenten/6e3db4c9-01ce-4f8e-b1f2-59b886ed59db" }
    - { label: Gemeentelijk monument (224019), url: "https://data.amsterdam.nl/monumenten/c7b4dee2-6d54-4c2c-98d9-e7a34d26d7ef" }
    - { label: Gemeentelijk monument (224018), url: "https://data.amsterdam.nl/monumenten/8dc897a4-c985-4a11-9639-7679838a18b2" }
    - { label: Rijksmonumentenregister (492074), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/492074" }
  attributes:
    heritage_status: National + municipal monument
    monument_number: 224017, 224018, 224019, 492074
    built: c. 1885–1895
    architect: Tjeerd Kuipers (42, 46-50), Eduard Cuypers (44), E. van der Eyk and J.A. de Waal (47)
    original_use: Villas and town houses
  photos:
    - commons:File:Amsterdam - Roemer Visscherstraat 44.JPG
    - commons:File:Roemer Visscherstraat 47.jpg
  sources:
    - city:224017, city:224018, city:224019, rce:492074
  nl:
    title: Villa's aan het parkeinde van de Roemer Visscherstraat
    summary: "Om de hoek van de Zevenlandenhuizen lieten dezelfde ontwikkelaars Tjeerd Kuipers nog meer villa's bij het park ontwerpen. Daartussen staat een huis met Engels vakwerk, door Eduard Cuypers gebouwd voor bankier J.G. Wertheim."
    body: |
      Een halve zon, of een half wiel: Tjeerd Kuipers kon er op nummer 42 geen genoeg van krijgen. Het motief zit boven de deur en boven de ramen. Het hoekhuis uit 1893-1895 is van donkere baksteen, met een hoekerker onder een klokdak en trapgevels.

      Toen J.W. van Eeghen en J.K. Huizinga vergunning kregen voor de Zevenlandenhuizen, kregen ze er meteen twee andere ontwerpen van Kuipers bij. Nummers 46-50 (1894) lijken één grote villa met torens, balkons en erkers naar het park, maar het zijn losse woningen. Renaissancemotieven gaan hier samen met plantornament uit de Nieuwe Kunst, iets wat je in Amsterdam zelden ziet. Kuipers woonde zelf een tijd in op nummer 48.

      Daartussen staat nummer 44 (1894), van Eduard Cuypers, voor bankier Johannes Gustaaf Wertheim, zoon van A.C. Wertheim. Cuypers gaf de bovenverdieping wit geschilderd vakwerk, een Engelse knipoog, en een kroonlijst met metselmozaïek in rood, geel en blauw. Aan de overkant staat op 47 een oudere, gepleisterde villa van rond 1885, met zijn oorspronkelijke ijzeren hek.

      Toen deze huizen verrezen, hield de Eerste Constantijn Huygensstraat hier nog op. Pas in 1947 werd hij doorgetrokken naar de Van Baerlestraat.

      Let op:
      - het zonsondergangmotief boven deur en ramen van nummer 42
      - de hoefijzerboog in de torenbekroning van nummer 46 en de pilasters met plantmotieven bij nummer 50
      - het vakwerk en het metselmozaïek van nummer 44
    attributes:
      architect: Tjeerd Kuipers (42, 46-50), Eduard Cuypers (44), E. van der Eyk en J.A. de Waal (47)
      original_use: Villa's en herenhuizen
    sources:
      - https://data.amsterdam.nl/monumenten/6e3db4c9-01ce-4f8e-b1f2-59b886ed59db
      - https://data.amsterdam.nl/monumenten/c7b4dee2-6d54-4c2c-98d9-e7a34d26d7ef
      - https://data.amsterdam.nl/monumenten/8dc897a4-c985-4a11-9639-7679838a18b2
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/492074

- title: Hidden nursery school (Overtoom 103-105)
  summary: Down an alley off the Overtoom lies a 1928 nursery school built like a small village, with mansard roofs, a caretaker's house and a little tower, for the children of the outer districts.
  body: |
    The alley halfway between the Eerste and Tweede Constantijn Huygensstraat leads to a small enclave of buildings behind the street front. Theo Kint designed it in 1928 as nursery school no. 3 of the *Vereeniging ter behartiging der Godsdienstige Belangen van de Bewoners van de Buitenwijken van Amsterdam*, a Protestant association for the outer districts. The complex has a school with six classrooms and two playrooms, a separate caretaker's house and a covered playground on the north side, where the toddlers had their sandpit. It is now an office.

    At the time, nursery education had no law of its own; the first act on nursery schooling only came in the 1950s. Private associations like this one built the first decent buildings for young children. The register praises how Amsterdam School features were used to give the ensemble a homely, village-like character. The site lies on land where cotton-printing works stood in the early nineteenth century.

    Look for:
    - the heavy red-tiled mansard roof that makes the school look like a country house
    - the three-storey flat-roofed tower at the entrance hall
    - the caretaker's house by the alley, with the same mansard roof
  category: schools
  lat: 52.362111
  lng: 4.874375
  address: Overtoom 103-105 (through the alley)
  links:
    - { label: Gemeentelijk monument (224059), url: "https://data.amsterdam.nl/monumenten/4f310951-ff7f-4427-8c6e-830a430071c3" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "224059"
    built: "1928"
    architect: Theo Kint
    listed: 2008
    original_use: Nursery school with caretaker's house
  sources:
    - city:224059
    - research/ams-school/places/oud-west-baarsjes.yaml (sibling map, used as cross-check)
  nl:
    title: Verscholen kleuterschool (Overtoom 103-105)
    summary: Via een steeg aan de Overtoom bereik je een kleuterschool uit 1928 die oogt als een dorpje, met mansardedaken, een dienstwoning en een torentje, gebouwd voor de kinderen van de buitenwijken.
    body: |
      Een steegje ongeveer halverwege de Eerste en Tweede Constantijn Huygensstraat leidt naar een kleine enclave achter de straatwand. Theo Kint ontwierp hier in 1928 school nr. 3 voor voorbereidend onderwijs van de Vereeniging ter behartiging der Godsdienstige Belangen van de Bewoners van de Buitenwijken van Amsterdam. Het geheel bestaat uit een school met zes lokalen en twee speellokalen, een aparte dienstwoning en aan de noordkant een overdekte speelplaats waar de kleuters in de zandbak speelden; die is nu kantoor.

      Het kleuteronderwijs was lang het kind van de rekening: pas in de jaren vijftig kwam er een eerste wet voor. Particuliere verenigingen zorgden voor de eerste fatsoenlijke huisvesting. Volgens het register zijn kenmerken van de Amsterdamse School hier goed benut om het ensemble een gemoedelijk, dorps karakter te geven. Op deze plek stonden in het begin van de negentiende eeuw katoendrukkerijen.

      Let op:
      - het zware rode mansardedak dat de school iets van een landhuis geeft
      - het torenachtige bouwdeel van drie lagen met plat dak bij de vestibule
      - de dienstwoning bij de steeg, met hetzelfde mansardedak
    attributes:
      original_use: Kleuterschool met dienstwoning
    sources:
      - https://data.amsterdam.nl/monumenten/4f310951-ff7f-4427-8c6e-830a430071c3

- title: Former car showroom (Overtoom 141-145)
  summary: An Amsterdam School architect's late turn to modernism. A.J. Westerman's 1959 showroom with offices and flats sets a white grid over a dark, asymmetric shop front.
  body: |
    In 1959 the contractor N. Worp got a permit for a showroom with storage, offices and two flats on the top floor, on the site of Huis Sollenburg, a house designed by Cornelis Springer around 1875 and demolished for the new building. The architect was A.J. Westerman (1884–1966), known for Amsterdam School housing in the 1920s and 1930s. A first design from 1958, for a garage with offices, still had brick panels with ornament between concrete piers, closer to his earlier work. The building as built is clearly modernist.

    It has a concrete frame with brick side walls. A lorry passage along the west wall led to a low hall with a sawtooth roof at the back. Since 2006 the ground floor and hall have been a youth centre, and the upper floors now seem to be homes.

    The register values the building for its careful use of materials, typical of the years just after the war, and as part of Westerman's oeuvre.

    Look for:
    - the grey-painted concrete frame with white bands around a grid of square window modules
    - the shop front treated as a separate, asymmetric part, set back and in dark materials
    - the black quartzite plinth and brown brick along the passage
  category: industrial
  lat: 52.36196
  lng: 4.872923
  address: Overtoom 141-145
  links:
    - { label: Gemeentelijk monument (224049), url: "https://data.amsterdam.nl/monumenten/2e787a7d-273d-4eab-82b3-b46081e52660" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "224049"
    built: "1959"
    architect: A.J. Westerman
    listed: 2008
    original_use: Showroom with warehouse, offices and flats
  sources:
    - city:224049
  nl:
    title: Voormalige showroom (Overtoom 141-145)
    summary: Een Amsterdamse School-architect gaat modern. A.J. Westermans showroom met kantoren en woningen uit 1959 legt een wit raster over een donkere, asymmetrische pui.
    body: |
      In 1959 mocht aannemer N. Worp er een pand neerzetten met showroom, opslagruimte, kantoren en bovenin twee woningen. Daarvoor werd Huis Sollenburg gesloopt, een woonhuis van Cornelis Springer van omstreeks 1875. Architect was A.J. Westerman (1884-1966), bekend van Amsterdamse School-woningbouw in de Gordel '20-'40. Een eerste ontwerp uit 1958, nog voor een garage met kantoren, had betonnen lisenen met bakstenen borstweringen vol siermotieven en sloot dichter aan bij zijn eerdere werk. Het uitgevoerde ontwerp is uitgesproken modernistisch.

      Het gebouw heeft een betonconstructie met bakstenen zijmuren. Langs de westelijke bouwmuur leidt een onderdoorgang voor vrachtauto's naar een lage hal met sheddak. Sinds 2006 zit er op de begane grond en in de hal een jongerencentrum; de verdiepingen zijn vermoedelijk allemaal woning.

      Het register prijst het zorgvuldige materiaalgebruik, kenmerkend voor de eerste jaren na de oorlog, en de plek die het inneemt in Westermans oeuvre.

      Let op:
      - het grijs geschilderde betonraster met witte banden rond vierkante vensterpartijen
      - de pui als zelfstandig, asymmetrisch en donker onderdeel, iets teruggelegd
      - de zwarte kwartsietplint en de bruine baksteen langs de onderdoorgang
    attributes:
      original_use: Showroom met bergplaats, kantoren en woningen
    sources:
      - https://data.amsterdam.nl/monumenten/2e787a7d-273d-4eab-82b3-b46081e52660

- title: R.I.V.A. garage (Overtoom 197-205)
  summary: Probably Amsterdam's first multi-storey car park, from 1926. Lifts carried the cars up to lockable boxes, and a turntable spun them round on the top floor. Albert Heijn held a majority stake.
  body: |
    In 1925 one in a hundred Amsterdammers owned a car, and early cars did not stand up well to rain. In 1926 C.L. de Groot's *Reparatie Inrichting voor Automobielen* (R.I.V.A.) applied to turn shops on the Overtoom into showrooms and to build a tall parking garage behind them, all designed by H. van Jaarsveld jr. The Overtoom, the old road out of the city, was an obvious place for it. There was no Dutch model for such a building yet, so designers looked abroad, especially to America.

    Two Schindler lifts took cars to the upper floors, where five or six lockable boxes per floor lined the walls. The fourth floor was an assembly hall with a turntable in the middle. At the back, a hall under a glass roof held over twenty box garages and room for eight lorries. Fords, DMCs and Chevrolets were sold here, and Albert Heijn held a majority stake in the company. According to the register Henry Ford himself probably opened the complex in 1927, though no source confirms it. The building later became an auction house; today it houses a car-rental firm and shops.

    Look for:
    - the taller eastern block, where the lifts and car park were
    - the eastern car gate; the western gate was later bricked up
    - restrained brickwork with small expressionist details
  category: industrial
  lat: 52.361265
  lng: 4.870186
  address: Overtoom 197-205
  links:
    - { label: Gemeentelijk monument (224038), url: "https://data.amsterdam.nl/monumenten/3e602d96-c488-46b2-b640-235b0957be57" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "224038"
    built: "1926"
    architect: H. van Jaarsveld jr.
    listed: 2008
    original_use: Multi-storey garage, showrooms and workshops with flats
  photos:
    - commons:File:2021 Overtoom 197, Asd (1).jpg
  sources:
    - city:224038
  nl:
    title: R.I.V.A.-garage (Overtoom 197-205)
    summary: Vermoedelijk de eerste parkeergarage met verdiepingen van Amsterdam, uit 1926. Liften brachten de auto's naar afsluitbare boxen en bovenin stond een draaiplateau. Albert Heijn had een meerderheidsbelang.
    body: |
      In 1925 had één op de honderd Amsterdammers een auto, en die kon nog slecht tegen regen. In 1926 vroeg de Reparatie Inrichting voor Automobielen (R.I.V.A.) van C.L. de Groot vergunning om winkels aan de Overtoom te verbouwen tot showrooms en erachter een hoge parkeergarage te bouwen; het ontwerp van het geheel kwam van H. van Jaarsveld jr. De Overtoom was als oude uitvalsweg een logische plek. Een Nederlandse typologie voor zulke garages bestond nog niet; men keek naar het buitenland, vooral Amerika.

      Twee liften van de firma Schindler brachten de auto's naar de verdiepingen, waar per laag vijf of zes met ijzeren luiken afsluitbare boxen lagen. De vierde verdieping was een montagehal met een draaiplateau in het midden. Achterin lag een hal onder een lichtkap met ruim twintig boxgarages en plaats voor acht vrachtwagens. Er werden Fords, DMC's en Chevrolets verkocht en Albert Heijn had een meerderheidsbelang in R.I.V.A. Volgens het register opende Henry Ford het complex in 1927 hoogstwaarschijnlijk zelf, al bevestigt geen bron dat. Later werd het een veilinggebouw; nu zitten er een autoverhuurder en winkels.

      Let op:
      - het hogere oostelijke bouwdeel met de vroegere liften en parkeergarage
      - de oostelijke poort; de westelijke is later dichtgezet
      - het terughoudende metselwerk met kleine expressionistische details
    attributes:
      original_use: Parkeergarage, showrooms en werkplaatsen met bovenwoningen
    sources:
      - https://data.amsterdam.nl/monumenten/3e602d96-c488-46b2-b640-235b0957be57

- title: Gemeentetram headquarters
  summary: "The municipal tram company's 1923 office palace rises straight out of the Singelgracht. Look for Hildo Krop's ceramic figures and the rounded porter's lodge to the north-west."
  body: |
    P.L. Marnette of the Public Works department designed this office for the Gemeentetram (municipal tramways), built in 1922–1923. It is the only building on this stretch of the Stadhouderskade that stands directly on the water: the back rises out of the Singelgracht from a basement storey. In the early years a siding on the west side let the money tram deliver the conductors' fare takings safely. The tram company left in 1983 and the city cleaning department in 1990. It is now a private office building.

    The U-shaped building has a central block between two corner pavilions under flat roofs. The lower floors have identical windows separated by brick piers, with figurative building ceramics by Hildo Krop at their tops. The top floor is almost blind, laid in a diamond pattern under a toothed cornice.

    A small utility building with a rounded porter's lodge and a transformer room, also listed, stands to the north-west.

    Look for:
    - Krop's ceramic figures on the piers and the ornament over the entrance
    - the tapering entrance porch with Amsterdam School lanterns
    - the rear façade in the water, best seen from across the Singelgracht
