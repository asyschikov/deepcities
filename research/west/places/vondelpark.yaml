  nl:
    title: Voormalig gemaal (Vondelpark 4)
    summary: "Een klein neorenaissancehuis met een klok in de top, ooit gebouwd om water weg te pompen bij de Overtoom. Toen de Overtoomse Vaart in 1903 werd gedempt, werd het de woning van de parkopzichter."
    body: |
      Het lijkt een keurig dienstwoninkje, maar dit was ooit een gemaal. Rond 1880 liet de vereniging die het park beheerde het vrijstaand bouwen in het noorden van het park, ten oosten van de Kattenlaan, om het water af te voeren in de buurt van de Overtoom en de Kattensloot. De pompen stonden in het voorste deel. Wie de architect was, weet niemand zeker; soms wordt Willem Hamer genoemd, die het Vondelparkpaviljoen ontwierp.

      Rond 1903 werden de Overtoomse Vaart en de Kattensloot gedempt, en daarmee was het gemaal overbodig. Het gebouw werd de woning van de parkopzichter en kreeg een achterhuis in een heel andere stijl. Tegenwoordig zit er een buitenschoolse opvang in.

      De voorgevel is eenvoudig, maar met zorg gemaakt. Er zijn drie traveeën; de middelste springt naar voren, steekt hoger op en heeft een eigen kleine topgevel. De voordeur zit onder een uitstekende lijst op consoles, en vlak onder de dakrand loopt een rij blinde vensters. Op de verdieping van het voorhuis liggen nog de originele houten balken.

      Let op:
      - de ronde klok bovenin de middelste travee
      - vier gepleisterde gietijzeren rozetankers onder de cordonband
      - de duiker tussen de vijver en het gebouw, met regels uit het gedicht Stuwmeer van Anna Enquist die uit de steen zijn gespaard, en plattegronden van het park op de dekplaten
    attributes:
      original_use: Gemaal, later parkopzichterswoning
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/504748
      - https://nl.wikipedia.org/wiki/Vondelpark_4
      - https://nl.wikipedia.org/wiki/Vondelpark

- title: Villa Betty
  summary: Hidden 100 metres behind the Overtoom stands a chalet-style villa with Arabic, Chinese and Jugendstil rooms, named after the 'queen of the Overtoom'. Its garden bridge is a monument of its own.
  body: |
    The villa was begun in October 1877 for the tobacco merchants F.A. and P.H.F. Smithuijsen, when this land still belonged to Nieuwer-Amstel and the Overtoom was a canal. A foundation stone records that it was laid by the two-year-old P.H.F.M. Smithuijsen. In 1896 the tobacco merchant Eduard Lehmann bought it; in 1900 he married Betty von Hunteln and named the house after her. He gave it a series of period rooms: Dutch, Louis XVI, Arabic, Chinese and English rooms, a Jugendstil billiard room and, upstairs, Empire and Mechelen rooms. Breitner, Isaac Israëls and Mesdag visited, and Betty was nicknamed the queen of the Overtoom. She died in 1980.

    The complex has three listed parts: the villa near the park, a neo-Renaissance coach house with coachman's flat and gate on the Overtoom (1900), and an artificial-stone footbridge with a fake tree stump in the garden.

    Look for:
    - from the Overtoom, the coach house with stepped gables, and a second foundation stone with Betty Lehmann-von Hunteln's name and the date 7 June 1900
    - from the Vondelpark, the rear façade with its five-sided tower and Jugendstil glass canopy
    - the name VILLA BETTY in black capitals over the entrance stair
  category: housing
  lat: 52.360164
  lng: 4.869113
  address: Overtoom 241-245
  links:
