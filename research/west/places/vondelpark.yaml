- title: Amsterdamsche Huishoudschool (Zandpad 5)
  summary: "A half-timbered chalet of 1895, built for a domestic science school founded by two women, still lettered 'Amsterdamsche Huishoudschool'. Since 1974 it has been a youth hostel facing a park gate."
  body: |
    In 1891 Jeltje de Bosch Kemper, a champion of women's rights who lived next door at Zandpad 6, and Hendrina Scholten-Commelin founded an association to run a domestic science school in Amsterdam. C.B. Posthumus Meyjes designed the building, completed in 1894–1895: a free-standing school in the chalet style with half-timbering, set back from the street.

    The base is light-brown brick; the top floor is timber, with vertical boarding painted in a Bentheim stone colour. A wooden balcony runs the full width of the first floor, with a loggia in the middle. The school was converted inside in 1933 and became a youth hostel in 1974. A 1952 extension with a gym and a so-called Norwegian kitchen is not protected.

    Look for:
    - two stones above the first-floor windows carved 'Amsterdamsche Huishoudschool'
    - the stone steps with iron railings up to the entrance under its lean-to roof
    - the covered balcony with pointed roof on the top floor
    - the pointed finial on the east gable
  category: schools
  lat: 52.361167
  lng: 4.878268
  address: Zandpad 5
  links:
    - { label: Rijksmonumentenregister (492059), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/492059" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q17301232" }
  attributes:
    heritage_status: National monument
    monument_number: "492059"
    built: 1894–1895
    architect: C.B. Posthumus Meyjes
    listed: 1996
    original_use: Domestic science school
  photos:
    - commons:File:Amsterdamse Huishoudschool.JPG
    - commons:File:Huishoudschool aan het Zandpad te Amsterdam, 1907, SFA001014943.jpg
  sources:
    - rce:492059
    - "https://nl.wikipedia.org/wiki/Jeltje_de_Bosch_Kemper"
  nl:
    title: Amsterdamsche Huishoudschool (Zandpad 5)
    summary: "Een vakwerkchalet uit 1895, gebouwd voor een huishoudschool die door twee vrouwen was opgericht. 'Amsterdamsche Huishoudschool' staat er nog in steen op. Sinds 1974 is het een jeugdherberg, recht tegenover een ingang van het park."
    body: |
      De vrouw achter deze school hoefde maar een deur verder te lopen: Jeltje de Bosch Kemper, voorvechter van vrouwenrechten, woonde zelf op Zandpad 6. In 1891 richtte zij samen met Hendrina Scholten-Commelin een vereniging op om in Amsterdam een huishoudschool te beginnen. C.B. Posthumus Meyjes ontwierp het gebouw, dat in 1894–1895 klaarkwam: een vrijstaand chalet met vakwerk, een stukje van de straat af.

      De onderbouw is van lichtbruine baksteen, de bovenste verdieping van hout, met verticale planken in een Bentheimer steenkleur geschilderd. Over de volle breedte van de eerste verdieping loopt een houten balkon, met in het midden een loggia. In 1933 werd de school van binnen verbouwd, en in 1974 werd het een jeugdherberg. De uitbreiding uit 1952, met een gymzaal en een zogenoemde Noorse keuken, valt niet onder de bescherming.

      Let op:
      - twee stenen boven de ramen van de eerste verdieping met de ingebeitelde tekst 'Amsterdamsche Huishoudschool'
      - de stenen trap met ijzeren leuningen naar de ingang onder het lessenaarsdak
      - het overdekte balkon met puntdak op de bovenste verdieping
      - de spitse makelaar op de oostgevel
    attributes:
      original_use: Huishoudschool
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/492059

- title: Leidsebosje
  summary: A strip of green by the Leidseplein holds what are probably the thickest trees in Amsterdam, two plane trees once moved with winches, and a lime planted for Princess Beatrix's birth.
  body: |
    A map of 1737 already shows greenery here along the city ramparts, at the start of the road to Leiden. The small park only received its official name in 2017. Two old plane trees, planted in 1850–1860, are probably the thickest trees in Amsterdam: each has a girth of more than seven metres, and they are 26 and 22 metres tall. When the Leidsebrug was widened in the 1920s, the city did not cut them down but moved them a little to the south, using wooden platforms and winches. Some branches, thicker than many young trees, are now held up by cables.

    The Beatrix lime was flown in from the former principality of Orange and planted on 1 February 1938, the day after Princess Beatrix was born. Dutch Nazis destroyed it in 1941; it was regrown at the Frankendael city nursery and replanted on 31 January 1946.

    Look for:
    - the two giant plane trees and their cable supports
    - busts of the writers Herman Heijermans (by Mendes da Costa, 1934) and Arthur van Schendel (by Jobs Wertheim, 1952)
    - an Amsterdam School junction box (type G) designed by P.L. Marnette
    - the Boomzagertje, a tiny statue on a branch of one of the plane trees
    - Henk Zweerus's *Horizontale compositie* (1958), stacked forms laid out flat; when De Telegraaf printed his design sketch it caused a row, and some saw an ape rock and swastikas in it
  category: green
  lat: 52.3636
  lng: 4.8806
  address: Leidsebosje, Stadhouderskade by the Leidseplein
  links:
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Leidsebosje" }
  attributes:
    built: c. 1850–1860 (plane trees)
  photos:
    - commons:File:2025 Leidsebosje, Asd, dikke plataan noord (A).jpg
  sources:
    - https://nl.wikipedia.org/wiki/Leidsebosje
    - "Kunstwacht 2152 'Horizontale compositie' (Henk Zweerus 1920-2005; commission for a lying sculpture for the Leidsebosje; publication of a sketch in De Telegraaf caused fierce debate, people saw an ape rock and swastikas; usually worked vertically); OSM node 8546865560, start_date 1958. Round 4 merge."
  nl:
    title: Leidsebosje
    summary: "Een strook groen bij het Leidseplein met waarschijnlijk de dikste bomen van Amsterdam: twee platanen die ooit met lieren zijn verplaatst. Plus een linde die werd geplant voor de geboorte van prinses Beatrix."
    body: |
      Toen de Leidsebrug in de jaren twintig breder moest, ging de zaag er niet in. De twee oude platanen werden een stukje naar het zuiden geschoven, op houten vlonders en met lieren. Ze zijn in 1850-1860 geplant en waarschijnlijk de dikste bomen van de stad: elk meet rondom ruim zeven meter, en ze zijn 26 en 22 meter hoog. Sommige takken zijn dikker dan menige jonge boom en hangen nu aan kabels.

      Groen lag hier al lang. Een kaart uit 1737 toont al beplanting langs de stadswallen, waar de weg naar Leiden begon. Een officiële naam kreeg het parkje pas in 2017.

      Dan de Beatrixlinde. Die werd ingevlogen uit het vroegere prinsdom Orange en op 1 februari 1938 geplant, een dag na de geboorte van prinses Beatrix. NSB'ers vernielden de boom in 1941. Stadskwekerij Frankendael kweekte hem opnieuw op, en op 31 januari 1946 kwam hij terug.

      Let op:
      - de twee reuzenplatanen en hun kabels
      - de bustes van schrijver Herman Heijermans (door Mendes da Costa, 1934) en schrijver Arthur van Schendel (door Jobs Wertheim, 1952)
      - een splitskast (type G) in Amsterdamse Schoolstijl, ontworpen door P.L. Marnette
      - het Boomzagertje, een piepklein beeldje op een tak van een van de platanen
      - *Horizontale compositie* (1958) van Henk Zweerus, opgestapelde vormen die plat liggen; toen De Telegraaf zijn schets afdrukte, ontstond er ophef, en sommigen zagen er een apenrots en hakenkruizen in
    sources:
      - https://nl.wikipedia.org/wiki/Leidsebosje

- title: Boomzagertje
  summary: Since 1989 a small iron man has been sawing off the very branch he stands on. Placed overnight by an anonymous sculptor, he has already had to move to another tree once.
  body: |
    In the night of 30 January 1989 a small iron figure appeared in a plane tree in the Leidsebosje: a man bending forward, sawing through the thick branch he stands on, between his own feet. He cannot finish the job without falling off himself. The maker is known only as *De Onbekende Beeldhouwer* (the Unknown Sculptor), to whom more anonymous works in Amsterdam are attributed, including the violinist rising out of the floor of the Stopera, placed around the same time. The city accepted the works on condition that the sculptor's identity is never revealed.

    The figure has had a rough life. His beret went missing once and his saw broke, and both were repaired by unknown hands. The tree seemed to grow around the saw. In October 2019 the branch, which had cracked between the trunk and the statue, had to be cut off. The little man went back to his anonymous maker for repair and in May 2020 returned on a branch of another tree.

    Look for:
    - the figure high up in a plane tree near the Leidseplein end of the park
    - his beret
    - the saw, cutting between his feet
  category: curiosities
  lat: 52.36333
  lng: 4.88083
  address: Leidsebosje
  links:
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Boomzagertje" }
  attributes:
    built: "1989"
    artist: De Onbekende Beeldhouwer
  photos:
    - commons:File:2020 Boomzagertje (1).jpg
    - commons:File:Boomzager.jpg
  sources:
    - https://nl.wikipedia.org/wiki/Boomzagertje
    - https://nl.wikipedia.org/wiki/Leidsebosje
  nl:
    title: Boomzagertje
    summary: "Sinds 1989 zaagt een ijzeren mannetje in het Leidsebosje de tak door waar hij zelf op staat. Een anonieme beeldhouwer zette hem er 's nachts neer, en één keer moest hij al verhuizen naar een andere boom."
    body: |
      Hij zaagt al sinds 1989 en komt nooit klaar. Want als hij klaar is, valt hij er zelf af.

      In de nacht van 30 januari 1989 stond hij er ineens: een klein ijzeren mannetje in een plataan in het Leidsebosje, voorovergebogen, zagend in de dikke tak onder zijn voeten, precies tussen zijn benen door. Wie hem maakte, weet de buitenwereld niet. De maker heet alleen De Onbekende Beeldhouwer. Aan die naam worden meer anonieme beelden in Amsterdam toegeschreven, zoals de violist die uit de vloer van de Stopera omhoogkomt en rond dezelfde tijd verscheen. De gemeente kreeg de beelden op één voorwaarde: wie de maker is, blijft geheim.

      Makkelijk heeft het mannetje het niet gehad. Zijn alpinopet raakte een keer zoek, zijn zaag brak af, en telkens werd het hersteld door onbekenden. De boom leek ondertussen om de zaag heen te groeien. De tak knakte tussen stam en beeld en moest in oktober 2019 worden afgezaagd. Het zagertje ging terug naar zijn anonieme maker voor een opknapbeurt en kwam in mei 2020 terug, op een tak van een andere boom.

      Let op:
      - het mannetje hoog in een plataan, aan de kant van het Leidseplein
      - zijn alpinopet
      - de zaag, die tussen zijn voeten door gaat
    sources:
      - https://nl.wikipedia.org/wiki/Boomzagertje

- title: OT301 (former Film Academy)
  summary: The old Dutch Film Academy was squatted by artists in 1999 and bought by them in 2006. It is now a collectively owned cultural centre with a cinema, concerts and a vegan kitchen.
  body: |
    Overtoom 301 housed the Nederlandse Filmacademie until the school moved out. On 14 November 1999 an international group of artists, evicted that spring from two squatted wings of the OLVG hospital, broke open the front door and moved in with mattresses, chairs and tables. They renamed it OT301 after the address. After years of squatting and then renting, their association Eerste Hulp Bij Kunst (EHBK, First Aid for Art) bought the building from the city in 2006 and turned it into collective property: no member can ever sell their space for private profit.

    Today it combines living, working and public use. It is open almost every day for cinema, concerts, workshops, exhibitions and performances, and the vegan kitchen De Peper, which joined the group in its OLVG days, moved in with it. At the end of 2006 the collective won the AFK's Amsterdamprijs voor de Kunst.

    Look for:
    - the entrance from the Overtoom, often covered in posters for the week's programme
    - the plain institutional building that still betrays the old school
  category: hidden-history
  lat: 52.36014
  lng: 4.865692
  address: Overtoom 301
  links:
    - { label: OT301, url: "https://www.ot301.nl/" }
    - { label: Amsterdam Alternative – 25 jaar OT301, url: "https://amsterdamalternative.nl/articles/17043/25-jaar-ot301" }
    - { label: Collectief Eigendom – OT301, url: "https://www.collectiefeigendom.nl/vrijplaatsen/ot301" }
    - { label: Wikipedia (en), url: "https://en.wikipedia.org/wiki/OT301" }
  photos:
    - commons:File:Overtoom 301, entrance.jpg
  sources:
    - https://amsterdamalternative.nl/articles/17043/25-jaar-ot301
    - https://www.collectiefeigendom.nl/vrijplaatsen/ot301
    - https://en.wikipedia.org/wiki/OT301
  nl:
    title: OT301 (voormalige Filmacademie)
    summary: "In 1999 braken kunstenaars de deur open van de oude Filmacademie aan de Overtoom. In 2006 kochten ze het pand van de gemeente. Sindsdien is OT301 een cultuurplek in collectief bezit, met film, concerten en een veganistische keuken."
    body: |
      Op 14 november 1999 braken ze de voordeur van Overtoom 301 open, en daarna sjouwden ze matrassen, stoelen en tafels naar binnen. De krakers waren een internationaal gezelschap kunstenaars dat dat voorjaar uit twee gekraakte vleugels van het OLVG was gezet. Het pand was van de Nederlandse Filmacademie geweest; de nieuwe bewoners noemden het naar het adres: OT301.

      Eerst kraakten ze, toen huurden ze. In 2006 kocht hun vereniging Eerste Hulp Bij Kunst (EHBK) het gebouw van de gemeente en maakte er collectief eigendom van. Niemand kan zijn eigen ruimte ooit met winst verkopen. Eind 2006 won het collectief de Amsterdamprijs voor de Kunst van het AFK.

      Wonen, werken en publiek lopen hier door elkaar. Het huis is bijna elke dag open, voor film, concerten, workshops, exposities en voorstellingen. De veganistische keuken De Peper, die zich al in de OLVG-tijd bij de groep had aangesloten, verhuisde mee naar de Overtoom.

      Let op:
      - de ingang aan de Overtoom, vaak volgeplakt met affiches voor het programma van de week
      - het nuchtere instellingsgebouw, waaraan je de vroegere school nog afleest
    sources:
      - https://amsterdamalternative.nl/articles/17043/25-jaar-ot301
      - https://www.collectiefeigendom.nl/vrijplaatsen/ot301

- title: Maria Austria's hiding place (Vondelstraat 110)
  summary: The photographer Maria Austria hid here from 1943, making passport photos for forged identity papers with Henk Jonker, a resistance man from the population register who later became her husband.
  body: |
    Maria Austria (Marie Karoline Oestreicher, 1915–1975) grew up in a Jewish artistic family in Karlsbad and trained as a photographer in Vienna. In 1937 she fled the anti-Jewish measures and joined her sister Lisbeth in Amsterdam. By November 1943 her husband, sister, mother and brother had all been taken to the Westerbork transit camp. From 30 September 1943 she was hiding at Vondelstraat 110, with Bob and Mirte de Boer-Wijnsouw.

    In this period she met Henk Jonker, a clerk at the Amsterdam population register who was active in the resistance, forging identity cards. Austria made the passport photos for them and taught Jonker to take pictures. From mid-July 1944 he too was hiding here. In 1945 they founded the photo agency Particam with Aart Klein and Wim Zilver Rupe, and they married in 1950. She went on to specialise in theatre and dance photography; the Maria Austria Instituut, founded after her death, now looks after the archives of more than fifty photographers.

    Look for:
    - the house itself, an ordinary Vondelstraat front with nothing to show what happened inside
  category: hidden-history
  lat: 52.361567
  lng: 4.873486
  address: Vondelstraat 110
  links:
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Maria_Austria" }
    - { label: Wikipedia (en), url: "https://en.wikipedia.org/wiki/Maria_Austria" }
    - { label: Joods Amsterdam – Vondelstraat, url: "https://www.joodsamsterdam.nl/vondelstraat/" }
  photos:
    - commons:File:Vondelstraat 110, Amsterdam.jpg
    - commons:File:Vondelstraat 110, Amsterdam 2.jpg
  sources:
    - https://nl.wikipedia.org/wiki/Maria_Austria
    - https://www.joodsamsterdam.nl/vondelstraat/ (after Bianca Stigter, Atlas van een bezette stad)
  nl:
    title: Onderduikadres van Maria Austria (Vondelstraat 110)
    summary: "Hier dook fotografe Maria Austria in 1943 onder. Met Henk Jonker, verzetsman bij het bevolkingsregister, maakte ze pasfoto's voor valse persoonsbewijzen. Ze leerde hem fotograferen en trouwde later met hem."
    body: |
      Achter deze gewone gevel ontstonden in de oorlog pasfoto's voor valse papieren. Vanaf 30 september 1943 zat Maria Austria hier ondergedoken, bij Bob en Mirte de Boer-Wijnsouw. In die tijd leerde ze Henk Jonker kennen. Hij werkte bij het Amsterdamse bevolkingsregister en vervalste voor het verzet persoonsbewijzen; zij leverde de pasfoto's erbij en bracht hem intussen het vak bij. Vanaf half juli 1944 zat ook Jonker op dit adres ondergedoken.

      Austria heette eigenlijk Marie Karoline Oestreicher (1915–1975). Ze kwam uit een Joods kunstenaarsgezin in Karlsbad en leerde fotograferen in Wenen. In 1937 week ze voor de anti-Joodse maatregelen uit naar Amsterdam, waar haar zus Lisbeth al woonde. In november 1943 zaten haar man, haar zus, haar moeder en haar broer alle vier in doorgangskamp Westerbork.

      In 1945 begon ze met Jonker, Aart Klein en Wim Zilver Rupe het fotobureau Particam, en in 1950 trouwde ze met Jonker. Ze legde zich toe op theater- en dansfotografie. Na haar dood kwam er het Maria Austria Instituut, dat nu de archieven van meer dan vijftig fotografen beheert.

      Let op:
      - het huis zelf, een doodgewone gevel in de Vondelstraat waaraan je niets ziet van wat er binnen gebeurde
    sources:
      - https://nl.wikipedia.org/wiki/Maria_Austria
      - https://www.joodsamsterdam.nl/vondelstraat/

- title: Reade murals (Overtoom 283)
  summary: A 14-metre woman pulls herself upward on the side of a rehabilitation centre, and along the street runs an 80-metre wall of hopeful slogans, some written by patients themselves.
  body: |
    For years the bare side wall of the Reade rehabilitation centre and the 80-metre street wall in front of it were covered in graffiti, often not very friendly. Each year Reade painted over it, and each year new slogans appeared. In 2026, looking for a lasting solution, Reade worked with the STRAAT museum to paint both walls itself. "In the war on graffiti we actually embraced graffiti," said Joris van der Poel of the Reade Foundation.

    For the side wall the Rotterdam artist Marije Maria designed *Veerkracht in de stad* (resilience in the city), a 14-metre-high painting of a woman pulling herself up, a symbol of rehabilitation: climbing towards a new life and a new reality. The graffiti artist OPZICH covered the long street wall with positive slogans. Before the unveiling by former culture minister Hedy d'Ancona in September 2026, staff, patients and neighbours added their own messages, such as an 11-year-old patient's "Growth begins with one step".

    Look for:
    - the climbing woman on the side wall
    - the handwritten messages among OPZICH's slogans on the street wall
  category: street-art
  lat: 52.360379
  lng: 4.866849
  address: Overtoom 283
  links:
    - { label: De Westkrant, url: "https://www.dewestkrant.nl/kleurrijke-muurschilderingen-op-overtoom-laten-zien-wat-revalideren-betekent/" }
  attributes:
    built: "2026"
    artist: Marije Maria, OPZICH
  sources:
    - https://www.dewestkrant.nl/kleurrijke-muurschilderingen-op-overtoom-laten-zien-wat-revalideren-betekent/
  nl:
    title: Muurschilderingen Reade (Overtoom 283)
    summary: "Op de zijgevel van revalidatiecentrum Reade trekt een vrouw van 14 meter zich omhoog, en langs de stoep loopt een muur van 80 meter vol hoopvolle leuzen, een deel ervan door revalidanten zelf geschreven."
    body: |
      Jarenlang zaten de kale zijgevel van revalidatiecentrum Reade en de 80 meter lange muur ervoor onder de graffiti, en aardig was die vaak niet. Elk jaar liet Reade alles overschilderen, en elk jaar stonden er weer nieuwe teksten op. In 2026 zocht het centrum een oplossing die zou blijven, en liet het samen met het STRAAT museum beide muren zelf beschilderen. Joris van der Poel van de Reade Foundation vatte het zo samen: in de strijd tegen graffiti kozen ze juist vóór graffiti.

      Voor de zijgevel ontwierp de Rotterdamse kunstenaar Marije Maria *Veerkracht in de stad*: een vrouw van 14 meter hoog die zich omhoogtrekt. Ze staat voor revalidatie, voor het klimmen naar een nieuw leven en een nieuwe werkelijkheid. Graffitikunstenaar OPZICH vulde de lange straatmuur met positieve leuzen. Voordat oud-minister van Cultuur Hedy d'Ancona de werken in september 2026 onthulde, schreven medewerkers, revalidanten en buren er hun eigen boodschappen tussen, zoals die van een revalidant van elf: "Groei begint met één stap".

      Let op:
      - de klimmende vrouw op de zijgevel
      - de handgeschreven boodschappen tussen de leuzen van OPZICH op de straatmuur
    sources:
      - https://www.dewestkrant.nl/kleurrijke-muurschilderingen-op-overtoom-laten-zien-wat-revalideren-betekent/
