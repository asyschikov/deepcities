    - { label: Amsterdam op de kaart, url: "https://amsterdamopdekaart.nl/1850-1940/Vondelstraat/Oud_Leyerhoven" }
  attributes:
    heritage_status: National monument
    monument_number: 492043, 492050, 5905, 5906
    built: 1876–1882
    architect: P.J.H. Cuypers
    original_use: Double villas, architect's own home
  photos:
    - commons:File:Vondelstraat 77.jpg
    - commons:File:Vondelstraat 75.JPG
    - commons:File:Vondelstraat 79.jpg
  sources:
    - rce:492043, rce:492050, rce:5905, rce:5906
