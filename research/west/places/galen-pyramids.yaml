    - "Soeters Van Eldonk architecten, project page De Piramides, Amsterdam 2000>2006 (EN and NL, archived 2015/2016): Marcanti island triangular, built up late 1970s by Sier van Rhijn, unfinished due to temporary school and sports halls; first design one 75 m pyramidal tower, city found it too high, so two lower interlocking triangular towers with stepped sides on a raised plaza with parking under; pyramid shape mirrors the island's triangle; refers to the Berlage-style urban design nearby where a tall building interrupts 4-5 storeys at crucial points; different on every side; stepped sides give terraces; shoulders same height as existing buildings; 82 apartments, 11,513 m2 housing, 4,341 m2 garage; client AM Wonen"
