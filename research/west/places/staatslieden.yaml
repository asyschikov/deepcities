    - city:200758 (redengevende omschrijving)
    - "Round 4 correction (SCOUT-4): the turret was lost when Lockheed Ventura AE780 of 487 Sqn RNZAF crashed here on 3 May 1943 during Ramrod 16 (raid on the Hemweg power station), not to a stray bomb. https://en.wikipedia.org/wiki/Operation_Ramrod_16 (12 Venturas; one turned back, one returned damaged, ten shot down; AE780 'shot down at Bornstrasse, Amsterdam; three killed, one PoW', after Bowyer 1979); https://geheugenvanwest.amsterdam/page/13794 and /page/4024 (three of four crew killed, one POW; seven residents killed; in one family at no. 34 only a six-year-old girl survived; a witness, seven at the time, saw the little turret on the roof lying on its side; plaque unveiled in 2006 by the New Zealand ambassador). Which numbers were destroyed (32/34) is disputed in reader comments, so left out."
    - "https://api.data.amsterdam.nl/v1/monumenten/monumenten/?monumentnummer=200758"
  nl:
    title: Van Bossestraat 8-54
    summary: "Arbeiderswoningen uit 1916 die zich voordoen als statig instituut, met middenpaviljoen, vleugels en hoekpaviljoens. In mei 1943 stortte een RAF-bommenwerper met Nieuw-Zeelandse bemanning erop neer; zeven burgers kwamen om. Het verloren torentje keerde in 2005 terug."
    body: |
      Het torentje op het dak heeft een tijd ontbroken. Op 3 mei 1943 vertrokken twaalf Ventura-bommenwerpers van 487 Squadron, een Nieuw-Zeelandse eenheid van de RAF, om de elektriciteitscentrale aan de Hemweg te bombarderen. Eén keerde vroeg om, Duitse jagers lagen op de loer, en van de rest kwam er maar één thuis. Tien werden neergeschoten; een daarvan stortte op dit blok. Drie van de vier bemanningsleden kwamen om, de vierde werd krijgsgevangene, en zeven burgers lieten het leven. Van één gezin bleef alleen een meisje van zes over. Een buurjongen, toen zeven, wist nog dat het torentje op zijn kant lag. Geen verdwaalde bom dus, maar een neergestort vliegtuig. Bij een renovatie in 2005 ging het torentje terug, en in 2006 onthulde de Nieuw-Zeelandse ambassadeur een plaquette voor de vliegers.

      R.A.M. de Heer Kloots ontwierp het complex in 1916 en was zelf ook ontwikkelaar en aannemer. Achter de gevel zijn het gewone woningen zoals in de negentiende-eeuwse ring, elk met eigen voordeur, twee aan twee in ondiepe portieken. Maar aan de straat is het één groot symmetrisch geheel: een 'hoofdpaviljoen' in het midden, 'vleugels' en 'hoekpaviljoens' met iets hogere daken en naar voren springende gevels. Eerder een flink instituut dan een rij woningen.

      Het middenpaviljoen ligt exact op de lijn van de korte Rochussenstraat, en dat was de bedoeling. Volgens het register zocht De Heer Kloots hetzelfde als De Bazel vlakbij: de afzonderlijke woningen gaan op in één geheel.

      Let op:
      - het middenpaviljoen met dakruiter, recht aan het eind van de Rochussenstraat
      - de iets hogere daken en vooruitspringende gevels van de paviljoens
      - voordeuren twee aan twee in ondiepe portieken
      - de plaquette uit 2006 voor de bemanning van de neergestorte Ventura
    attributes:
      original_use: Etagewoningen
      check_note: "De plaquette uit 2006 voor de bemanning van de Ventura: geen recente foto gevonden, en de precieze plek op de gevel is onbekend."
    sources:
      - city:200758 (redengevende omschrijving)
      - https://geheugenvanwest.amsterdam/page/13794
      - https://geheugenvanwest.amsterdam/page/4024

- title: Remonstrant almshouse, Van Hallstraat 51
  summary: A low 1910 hofje for single and elderly people, paid for by Everdina de Lanoy's bequest to the Remonstrant church and wrapped around a garden at the head of its block. A rare almshouse in the 19th-century ring.
  body: |
    The money came from Everdina de Lanoy, who in 1882 left a bequest to the Remonstrantse Gemeente (Remonstrant church), and the hofje (almshouse) bears her name: the Everdina de Lanoyhof. The congregation had it built in 1910 to house single and elderly people, to a design by P.A. Timmers, of whom nothing else is known. A few such charitable courtyards exist elsewhere in the 19th-century ring, but on the whole they are rare in these districts. The U-shaped building has a broad front on the Van Hallstraat and two shorter wings on the Cliffordstraat and Bentinckstraat, around an inner garden reached through a central entrance. Restored around 2000 and sold in 2001 to the housing association Het Oosten (now Stadgenoot), it is still lived in, now by students and starters rather than the elderly.

    The building is only two storeys high, and the design stresses its horizontal lines: a stone plinth, three plastered bands across red-brown brick, a plastered frieze and a wooden eave on wooden brackets. Only in the middle of the front does a square bay rise half a storey higher.

    Look for:
    - the little gateway around the central entrance, in a sober Dutch Renaissance style
    - the plastered bands and the wooden eave on brackets
    - the raised square bay in the middle of the front
