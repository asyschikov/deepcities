  nl:
    title: Blauwe poort (Dicky Brand)
    summary: "Een reusachtige blauwe boog op een driehoekig pleintje, precies waar twee stratenpatronen op elkaar stoten. Onder de grond loopt een riool dat bereikbaar moest blijven, dus kreeg elke poot een eigen fundering. De maakster, de gemeente en de buurt gaven hem elk een andere naam."
    body: |
      Deze poort staat op twee losse funderingen, één per poot. Dat komt door een riool: precies op de gekozen plek lag een buis die altijd bereikbaar moest blijven, en de Dienst Water en Riolering maakte bezwaar. Dus werd de fundering in tweeën gedeeld.

      De plek zelf is een naad in de stad. Waar de Van Beuningenstraat en de Van Boetzelaerstraat bij elkaar komen, lag vroeger een driehoekig plein waar twee stratenrasters botsen: het ene volgt ruwweg de Haarlemmervaart, het andere de Kostverlorenvaart. Stukje bij beetje ging het plein naar de kinderen uit de buurt, en Aldo van Eyck zette er duikelrekken neer, een klimkoepel in de vorm van een iglo en bouwsels van betonnen heipalen.

      Bij de stadsvernieuwing werden straten autoluw en verdween de doorgang naar de Fannius Scholtenstraat. De gemeente vroeg kunstenares Dicky Brand de plek op te vrolijken met iets opvallends. Zij bedacht een enorme blauwe boog van gelakt, verzinkt staal en beton. Zelf noemde ze hem de Mariaboog, de gemeente sprak van de Staatsliedenpoort, maar in de buurt heet hij gewoon de Blauwe Poort. Een deel van Van Eycks speeltoestellen sneuvelde bij de herinrichting; de klimkoepel bleef staan.

      Let op:
      - de twee poten van de boog, elk op een eigen fundering
      - de klimkoepel van Aldo van Eyck vlakbij
      - de plek waar de twee stratenpatronen elkaar raken
    sources:
      - https://nl.wikipedia.org/wiki/Blauwe_poort_(Amsterdam)

- title: Frederik Hendrikplantsoen
  summary: A green roundabout on the site of the old sawmill quarter, where Johnny Jordaan lived among the plane trees and children climb on art, from Aldo van Eyck's play frames to De Stam by Atelier Van Lieshout.
  body: |
    Before 1886 this was the Middenweg in the Zaagmolenbuurt (sawmill quarter), lined with sawmills: De Windhond, De Bijl, De Kop, De Jager and Het Luipaard, the last of them demolished in June 1931. In 1886 the square was named after Prince Frederik Hendrik of Orange, and from 1890 it was the Frederik Hendrikplantsoen, a little park and a roundabout. The folk singer Johnny Jordaan lived for many years in one of the late-19th-century houses on the roundabout with its old plane trees. A road with tram tracks splits the park in two, and the Zaagpoortbrug links it to the Marnixplein across the Singelgracht.

    The park has a long line of art you can play on. In the 1950s there was a playground with Aldo van Eyck's climbing frames, sandpit and tunnel; they gradually disappeared, as elsewhere in the city. In 1965 Cephas Stauthamer's Droombeeld (dream image) arrived and became a favourite climbing object. After a redesign in 2012–2015 led by Buurt Sand & Co, the park got Joep van Lieshout's five-part De Stam (the tribe), to sit and play on, and Carve's climbing bridge.

    Look for:
    - De Stam by Atelier Van Lieshout
    - Stauthamer's Droombeeld
    - the old trees, including a maple from 1947 and two plane trees from 1910
