- title: Frederik Hendrikstraat 2-6 (half-timbered flats)
  summary: "Twelve middle-class flats of 1909 on the Frederik Hendrikplantsoen, with cottage-style gables, balconies and timber framing. By an unknown architect, playful, and it stands out in its street wall."
  body: |
    The Frederik Hendrikbuurt was only fully built up around 1925, and it mixed homes for workers with homes for the middle class. Many of the latter are on the Frederik Hendrikstraat. This complex of twelve upper and lower flats for the middle class was built in 1909; who designed it is not known. It forms part of a continuous four-storey street wall, half on the street and half facing the gardens of the Frederik Hendrikplantsoen.

    The thirteen-bay front has a balanced rhythm of projecting bays, marked by bay windows, balconies and gables, and recessed bays with paired entrances. The register sees it as typical of the picturesque, often playful architecture of around 1900: broad overhanging eaves, decorative trusses and half-timbering, descended from Swiss and South German chalets and from the English cottage style.

    Look for:
    - gables with timber framing under broad overhanging roofs
    - paired front doors leading to shared stairs, with small leaded-glass windows above
    - double bands of red facing brick against the brown brickwork, and stone plinths
  category: housing
  lat: 52.378561
  lng: 4.874992
  address: Frederik Hendrikstraat 2-6 and Frederik Hendrikplantsoen
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/e1f0631d-a554-49b4-8de9-43d4f926fd56" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "223002"
    built: "1909"
    listed: 2008
    original_use: Middle-class flats
  sources:
    - city:223002 (redengevende omschrijving)
  nl:
    title: Frederik Hendrikstraat 2-6 e.o.
    summary: "Twaalf middenstandswoningen uit 1909 aan het Frederik Hendrikplantsoen, met topgevels in vakwerk, erkers en balkons in cottagestijl. Wie ze ontwierp is onbekend; in hun gevelwand vallen ze speels op."
    body: |
      Niemand weet wie deze twaalf boven- en benedenwoningen uit 1909 heeft getekend. Ze waren bedoeld voor de middenstand. De Frederik Hendrikbuurt, die pas rond 1925 helemaal volgebouwd was, kreeg huizen voor arbeiders en voor de middenklasse door elkaar, en die laatste staan voor een flink deel aan de Frederik Hendrikstraat. Het blok hoort bij een doorlopende gevelwand van vier lagen hoog. De ene helft staat aan de straat, de andere kijkt uit op de tuinen van het Frederik Hendrikplantsoen.

      De gevel is dertien ramen breed en heeft een rustig, regelmatig ritme. Delen die naar voren springen, met erkers, balkons en topgevels, wisselen af met terugliggende delen waar telkens twee voordeuren naast elkaar zitten. Het monumentenregister ziet er een typisch staaltje in van de schilderachtige, vaak speelse bouwkunst van rond 1900, met brede overstekende daken, sierspanten en vakwerk. Die vormen stammen af van Zwitserse en Zuid-Duitse chalets en van de Engelse cottagestijl.

      Let op:
      - topgevels in vakwerk onder breed overstekende daken
      - voordeuren in paren naar een gedeeld trappenhuis, met kleine glas-in-loodramen erboven
      - dubbele banden rode verblendsteen tegen het bruine metselwerk, en stenen plinten
    attributes:
      original_use: Middenstandswoningen
    sources:
      - city:223002 (redengevende omschrijving)

- title: Vredenhof cemetery and Westervilla
  summary: An 1897 cemetery below sea level on the Haarlemmerweg, resting place of Johnny Jordaan and Cor van Hout, whose white chalet-style lodge by Abraham Salm is now a café.
  body: |
    Vredenhof opened in 1897 on land annexed from the municipality of Sloten, replacing a remote cemetery near the harbours. The landscape architect Leonard Springer, who also designed the Nieuwe Ooster, laid it out with curving paths on the old polder plots, which meet the Haarlemmerweg at an angle. The ground lies at 1.80 m below sea level (NAP), more than a metre below the surrounding city. When the Centrale Markt was built next door in 1934, the cemetery gave up part of its land in exchange for a strip on its east side.

    Abraham Salm designed the reception building with the staff flats above it, in a chalet style that makes it look like a picturesque villa: two waiting rooms at the front and the funeral hall at the back, under a hipped roof with a roof turret. In 1933–1934 J.H. van der Veen remodelled the entrances and the hall and added the present stained glass. Since 2019 the building houses the Westervilla café, open to visitors of the cemetery. Many people from the Jordaan and boatmen without a fixed address were buried here, as were the singers Johnny Jordaan and Leo Fuld, the accordionist Johnny Meijer and the criminal Cor van Hout.

    Look for:
    - the symmetrical white-plastered lodge with its roof turret
    - stained-glass windows of 1933–1934 in the former funeral hall
    - the long, narrow forecourt from the Haarlemmerweg to the cemetery
  category: religious
  lat: 52.384602
  lng: 4.861774
  address: Haarlemmerweg 357-369
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/a0a6dae2-0807-4aab-83a7-4e762c08a255" }
