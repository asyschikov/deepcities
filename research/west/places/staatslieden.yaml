  nl:
    title: Abri en peperbus
    summary: Een tramhokje als huiskamer, met bronzen sansevieria's in de vensterbank, en een geredde peperbus met spreekgestoelte, volgens de kunstenaar een plek waar de "volgende revolutie kan uitbreken".
    body: |
      Het kunstwerk van Frank Halmans bestaat uit twee onderdelen, een tramhokje en een peperbus. Het kwam na een opdracht van het Amsterdamse Fonds voor de Kunst en Stadsdeel Westerpark, na een uitgebreide renovatie- en saneringsgolf door de Staatsliedenbuurt. De twee kunstwerken worden van elkaar gescheiden door een goot waarin de tramrails liggen.

      Aan de zuidoostkant van de tramrails staat op een cirkelvormig oppervlak een open wachthokje voor de tram van beton, staal, glas en tegelwerk, met een dak in schotelvorm. In het tramhokje zelf zijn geen zitplaatsen; op de vensterbanken staan sansevieria's van brons. De abri past in het thema van het werk van de kunstenaar: wachten. Het wachten begint al thuis, aldus de kunstenaar; bij de tramhalte zet je het wachten elders voort. Dit wordt weergegeven door het huiskamerachtige karakter van de abri.

      De peperbus die op het plein stond, stond op de nominatie om weggehaald te worden. Dankzij de kunstenaar bleef hij behouden. Halmans plaatste hem op een sokkel met een zitbankje rondom, onderbroken door twee trapjes die leiden naar een spreekgestoelte met lessenaar en leeslamp. Die spreekplaats refereert aan de roerige tijden in de Staatsliedenbuurt met actiegroepen. De kunstenaar omschreef het als plaats waar de "volgende revolutie kan uitbreken".

      Let op:
      - de bronzen sansevieria's in de vensterbanken
      - het spreekgestoelte met lessenaar en leeslamp op de peperbus
      - de betegelde ronde zitbankjes
    sources:
      - https://nl.wikipedia.org/wiki/Abri_en_peperbus

- title: Blauwe Poort (Dicky Brand)
  summary: A giant blue arch on a little triangular square where two street grids meet. The artist called it the Mary Arch, the city the Statesmen's Gate; it stands on a split foundation over a sewer pipe.
  body: |
    The point where the Van Beuningenstraat and Van Boetzelaerstraat meet was once a triangular square where two street grids collide: one roughly parallel to the Haarlemmervaart, the other to the Kostverlorenvaart. Over the years parts of it were given to the neighbourhood children, and Aldo van Eyck furnished it with climbing frames, an igloo-shaped climbing dome and structures made of concrete piles.

    During the urban renewal of the area, streets were calmed and the link to the Fannius Scholtenstraat disappeared. The city asked the artist Dicky Brand to brighten up the spot with a striking work, and she came up with a huge blue arch of lacquered galvanised steel and concrete. She called it the Mariaboog (Mary Arch) and the city called it the Staatsliedenpoort (Statesmen's Gate), but locals named it the Blauwe Poort (Blue Gate). The water and sewerage department objected, because a sewer pipe that had to stay accessible ran exactly where it was to stand, so the arch was given a split foundation, one under each leg. Some of Van Eyck's play objects were lost in the redesign, but the climbing dome survived.

    Look for:
    - the two legs of the arch, each on its own foundation
    - Aldo van Eyck's climbing dome nearby
    - the meeting of the two street grids
  category: curiosities
  lat: 52.382792
  lng: 4.874969
  address: Van Beuningenstraat / Van Boetzelaerstraat
  links:
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Blauwe_poort_(Amsterdam)" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q92771468" }
  attributes:
    built: "1988"
    artist: Dicky Brand
  photos:
    - commons:File:2020 Blauwe boog (Brand) (1).jpg
  sources:
    - https://nl.wikipedia.org/wiki/Blauwe_poort_(Amsterdam)
  nl:
    title: Blauwe poort (Dicky Brand)
    summary: Een reusachtige blauwe poort op een driehoekig pleintje waar twee stratenpatronen elkaar ontmoeten. De kunstenares noemde hem Mariaboog, de gemeente Staatsliedenpoort, de buurt de Blauwe poort.
    body: |
      Het punt waarop de Van Beuningenstraat en Van Boetzelaerstraat samenkwamen was ooit een driehoekig plein waar twee stratenpatronen elkaar ontmoetten. Het noordelijke deel loopt daarbij enigszins parallel aan de Haarlemmertrekvaart, het zuidelijke aan de Kostverlorenvaart. In de loop der jaren werden delen van het plein afgesnoept ter faveure van de hier opgroeiende jeugd. Door Aldo van Eyck werd het pleintje bebouwd met onder andere duikelrekken, een iglo/klimkoepel en een tweetal stellingen van betonnen heipalen.

      Na een grondige sanering werd een deel van de straten autoluw gemaakt en verdween de verbinding met de Fannius Scholtenstraat. De gemeente Amsterdam verzocht kunstenares Dicky Brand de plek op te fleuren middels een markant kunstwerk. Zij kwam met een reusachtige blauwe poort, die zijzelf Mariaboog noemde en de gemeente Staatsliedenpoort; bij buurtbewoners werd het de Blauwe poort. Plaatsing van de boog stuitte op verzet van de Dienst Water en Riolering, omdat er een rioleringsbuis op de beoogde plek lag die altijd bereikbaar moest zijn. De boog kreeg daarom een gespleten fundering, onder elke staander een. Het object is van gelakt verzinkt staal en beton.

      Let op:
      - de gespleten fundering onder de twee staanders
      - de iglo/klimkoepel van Aldo van Eyck, die bleef staan
      - de ontmoeting van de twee stratenpatronen
    sources:
      - https://nl.wikipedia.org/wiki/Blauwe_poort_(Amsterdam)

- title: Frederik Hendrikplantsoen
  summary: A green roundabout on the site of the old sawmill quarter, where Johnny Jordaan lived among the plane trees and children climb on art, from Aldo van Eyck's play frames to De Stam by Atelier Van Lieshout.
  body: |
    Before 1886 this was the Middenweg in the Zaagmolenbuurt (sawmill quarter), lined with sawmills: De Windhond, De Bijl, De Kop, De Jager and Het Luipaard, the last of them demolished in June 1931. In 1886 the square was named after Prince Frederik Hendrik of Orange, and from 1890 it was the Frederik Hendrikplantsoen, a little park and a roundabout. The folk singer Johnny Jordaan lived for many years in one of the late-19th-century houses on the roundabout with its old plane trees. A road with tram tracks splits the park in two, and the Zaagpoortbrug links it to the Marnixplein across the Singelgracht.

    The park has a long line of art you can play on. In the 1950s there was a playground with Aldo van Eyck's climbing frames, sandpit and tunnel; they gradually disappeared, as elsewhere in the city. In 1965 Cephas Stauthamer's Droombeeld (dream image) arrived and became a favourite climbing object. After a redesign in 2012–2015 led by Buurt Sand & Co, the park got Joep van Lieshout's five-part De Stam (the tribe), to sit and play on, and Carve's climbing bridge.

    Look for:
    - De Stam by Atelier Van Lieshout
    - Stauthamer's Droombeeld
    - the old trees, including a maple from 1947 and two plane trees from 1910
  category: green
  lat: 52.379113
  lng: 4.876985
  address: Frederik Hendrikplantsoen
  links:
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Frederik_Hendrikplantsoen" }
    - { label: Wikipedia (en), url: "https://en.wikipedia.org/wiki/Frederik_Hendrikplantsoen" }
  attributes:
    built: 1886–1890 (redesigned 2015)
  photos:
    - commons:File:2024 Frederik Hendrikplantsoen-noordelijk deel, Asd (A).jpg
    - commons:File:2024 Beeldengroep De Stam (A)-Asd (1).jpg
  sources:
    - https://nl.wikipedia.org/wiki/Frederik_Hendrikplantsoen
  nl:
    title: Frederik Hendrikplantsoen
    summary: Plantsoen met rotonde op de plek van de oude Zaagmolenbuurt, waar Johnny Jordaan woonde en waar kinderen spelen op kunst, van Aldo van Eyck tot De Stam van Joep van Lieshout.
    body: |
      Aan de Middenweg in de Zaagmolenbuurt, zoals men deze plek voor 1886 noemde, lag een groep zaagmolens, onder meer De Windhond (afgebroken tussen 1890-1900), De Bijl (verdwenen in 1897), De Kop (afgebroken in 1900), De Jager (afgebroken in 1907) en Het Luipaard (afgebroken juni 1931). In 1886 werd het plein vernoemd naar Prins Frederik Hendrik van Oranje. In 1890 werd de naam Frederik Hendrikplantsoen; het bestond toen uit een parkje en een rotonde. De volkszanger Johnny Jordaan woonde jarenlang in een van de laat-19e-eeuwse huizen aan de rotonde met oude platanen. In 2015 is het plantsoen opnieuw ingericht onder leiding van Buurt Sand & Co.

      In de jaren vijftig had het plantsoen een speelplaats met speelobjecten van Aldo van Eyck: duikelrekken, een zandbak en een tunnel. In 1965 werd het beeld Droombeeld van Cephas Stauthamer geplaatst; het werd een geliefd speelobject. Na de herindeling kreeg het plantsoen twee nieuwe beelden annex speeltoestellen: het vijfdelige De stam van Joep van Lieshout, waarop gespeeld en gezeten kan worden, en de Speelslinger van Carve, een loop- en klauterbrug.

      Let op:
      - De stam van Joep van Lieshout
      - Droombeeld van Cephas Stauthamer
      - de oude bomen, zoals een esdoorn uit 1947 en twee platanen uit 1910
    sources:
      - https://nl.wikipedia.org/wiki/Frederik_Hendrikplantsoen

- title: Raampoort bridge (brug 165)
  summary: A broad 1969 bridge over the Singelgracht, built for a traffic breakthrough into the Jordaan that protests stopped. It has Amsterdam School echoes by Dirk Sterenberg and sheet-metal railings by Herman van der Heide.
  body: |
    The Raampoort was a city gate, named, like the Raamgracht, after the wooden frames on which cloth was stretched and dried. The gate was demolished in 1844 and an iron bridge followed. The city's 1931 traffic plan foresaw a through road from the Tweede Hugo de Grootstraat over this bridge and on through a breakthrough in the Jordaan. The plan was shelved, then revived in 1969, when a new concrete bridge was built just north of the old one. The city end of the old bridge was kept as a terrace.

    The design came from Public Works, where Dirk Sterenberg then worked. He took his cue from Piet Kramer: brick with natural stone, stepped brick parapets and keep-like corners, with modern iron railings. He also designed the name plate and a hexagonal seat. The artist Herman van der Heide made the sheet-metal railings. In 1972 protests stopped the breakthrough in the Jordaan, and traffic was routed elsewhere, leaving a wide bridge for modest traffic.

    Look for:
    - Herman van der Heide's sheet-metal railings
    - the stepped brick parapets and the hexagonal seat
    - the terrace on the old bridgehead, with Hanna Mobach's statue Nieuwe Naatje (since 2005)
  category: infrastructure
  lat: 52.374078
  lng: 4.875441
  address: Tweede Hugo de Grootstraat over the Singelgracht
  links:
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Brug_165" }
  attributes:
    built: "1969"
    architect: Dirk Sterenberg (Dienst der Publieke Werken)
    artist: Herman van der Heide
  photos:
    - commons:File:Brug 165 Raampoort, in de Tweede Hugo de Grootstraat over de Singelgracht foto 1.jpg
  sources:
    - https://nl.wikipedia.org/wiki/Brug_165
  nl:
    title: Raampoort (brug 165)
    summary: Brede brug uit 1969 over de Singelgracht, gebouwd voor een doorbraak in de Jordaan die er na protestacties nooit kwam. Ontwerp van Dirk Sterenberg, leuningen van Herman van der Heide.
    body: |
      De Raampoort is in de recente geschiedenis de naam van brug 165, in de oude geschiedenis een stadspoort. De naam verwijst net als de Raamgracht naar de lakenindustrie en de houten raamwerken waarop men geverfde lakense stoffen droogde en oprekte. In 1844 werd de poort afgebroken. De brug werd slachtoffer van het verkeersplan uit 1931, met een doorvoerweg vanuit de Tweede Hugo de Grootstraat via een (nog te maken) doorbraak in de Jordaan. Het plan werd op de lange baan geschoven. In 1969 wordt de draad opgepakt: ten noorden van de oude brug wordt een nieuwe betonnen brug aangelegd. Het zuidelijk landhoofd aan de stadszijde blijft daarbij bewaard en wordt terras.

      Het ontwerp is afkomstig van de PW, waar dan Dirk Sterenberg werkt. Sterenberg liet zich inspireren door Piet Kramer: de combinatie baksteen/natuursteen, gemetselde balustrades die verspringen, donjonachtige hoeken en ijzeren leuningen, die laatste dan wel met een moderne vormgeving. Hij was ook verantwoordelijk voor het ontwerp van de naamplaat en het zeshoekige zitelement. Van kunstenaar Herman van der Heide zijn de metalen leuningen van metaalplaat. In 1972 weerhielden protestacties de gemeente ervan de doorbraak in de Jordaan te realiseren, met als gevolg een relatief brede brug voor een bescheiden verkeersaanbod.

      Let op:
      - de leuningen van metaalplaat van Herman van der Heide
      - de verspringende gemetselde balustrades en het zeshoekige zitelement
      - op het terras sinds 2005 het beeld Nieuwe Naatje van Hanna Mobach
    sources:
      - https://nl.wikipedia.org/wiki/Brug_165

- title: Gerard Reve memorial
  summary: A bench, a black lamp-post with three little hatches, and a brick path pointing at the house where Gerard Reve was born in 1923. A deliberately inconspicuous memorial that annoyed the arts fund.
  body: |
    Gerard Reve, author of De Avonden (The Evenings), was born on 14 December 1923 on the second floor of Van Hallstraat 25, across the road. For the Waterspiegelplein, Margriet Kemper made a three-part memorial (2006) that blends into its surroundings. A wooden bench faces east, inviting you to read or stare into space. In front of it stands a lamp-post, black where the city's are mostly grey, with three hatches you can open: a text from Reve's book Nader tot U, a portrait by Rineke Dijkstra taken near the end of his life, and a photo of his birthplace. From the bench a brick path in a different colour narrows to a long point aimed straight at that house.

    The memorial was not uncontroversial. Some missed any reference to Reve's homosexuality; others replied that he had lived here only for a year, as a baby. The Amsterdam arts fund refused to contribute because the work was too inconspicuous; it would have preferred a national monument. It was unveiled on Reve's birthday in 2006 by his partner Joop Schafthuizen.

    Look for:
    - the three hatches in the black lamp-post
    - the brick path pointing to Van Hallstraat 25
    - the bench facing east
