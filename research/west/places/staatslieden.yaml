  nl:
    title: Schutsluis Haarlemmervaart
    summary: "Een schutsluis uit 1884 in de oude trekvaart naar Haarlem. De deuren zwaaien open met kwartcirkelvormige heugelstangen, aangedreven vanuit tandwielkasten die onder ijzeren deksels in de kade verstopt zitten."
    body: |
      Kijk bij deze sluis eens naar de grond. Onder ijzeren platen zit een gleuf, en daarin zwaait een kromme heugelstang, een kwart cirkel lang. Die hangt aan een tandwielkast onder de grond in het landhoofd en duwt zo de sluisdeuren open en dicht.

      De Haarlemmervaart, de trekvaart naar Haarlem, is de noordgrens van de Staatsliedenbuurt. Deze sluis bij de Van Slingelandtstraat ligt op de overgang tussen het water van de stad en het peil van Rijnland. Hij werd in 1884 voor het eerst gebouwd; de deuren zelf zijn later vervangen, in 1954, 1991 en 1997. Het rijksmonumentenregister ziet de sluis als een laat-negentiende-eeuws voorbeeld van traditioneel waterbeheer op een historisch belangrijke vaarroute.

      De sluiskolk ligt tussen vier bakstenen landhoofden met ronde, met natuursteen afgedekte hoeken. Daartussen zijn de oevers gewoon schuine taluds, zonder kademuur. Elk paar puntdeuren wordt bewogen door zo'n liggende heugelstang. Naast de sluis staat de sluiswachterswoning met gemaal, die bij hetzelfde beschermde complex hoort.

      Let op:
      - de kromme heugelstangen en de ijzeren dekplaten in de bestrating
      - de twee paar deuren aan de oostkant, waarvan één met een verhoogde loopplank erop
      - de ijzeren voetgangersbrug naast de westelijke deuren
      - de sluiswachterswoning met gemaal op de oever
    attributes:
      original_use: Schutsluis
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/526737

- title: School Amaliastraat 5
  summary: A 1923 Christian school by Groenendijk & Lammers with a half-round entrance bay, Bavarian granite trim and wave-patterned Amsterdam School railings, slotted into a much older street plan.
  body: |
    The Frederik Hendrikbuurt was laid out on paper in Plan Kalff of 1875, but this corner was only built up between the wars, so a street pattern almost half a century older received interwar housing blocks. As usual in the 19th-century ring, the school was built into the street wall rather than standing free. Th. Groenendijk and Th.J. Lammers designed it in 1923: three storeys under a flat roof, a variant of the corridor type, with on every floor a central hall that is really a widened corridor, classrooms around it, and a gym in the left wing.

    The façade is symmetrical and stepped: the two middle classrooms are set back, so the central entrance block and stair tower stand out in an otherwise flat street front. The walls are yellow-grey brick, the plinth and stair tower red Groningen clinker, the details Bavarian granite.

    Look for:
    - the half-round projecting entrance bay with inward-curving porch walls
    - the wrought-iron railings with wave motifs on granite copings
    - in the porch, a bronze relief of Christ among the lambs and the architects' signature stone
  category: schools
  lat: 52.379358
  lng: 4.874322
  address: Amaliastraat 5
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/b420eeba-7408-4f74-8cf0-e0718d0d1e5c" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "223030"
    built: "1923"
    architect: Th. Groenendijk and Th.J. Lammers
    listed: 2008
    original_use: Christian primary school
  photos:
    - commons:File:2020 Amaliastraat 5 (01).jpg
  sources:
