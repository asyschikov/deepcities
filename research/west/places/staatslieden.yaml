  nl:
    title: Standbeeld van Domela Nieuwenhuis
    summary: "Domela Nieuwenhuis in brons, midden in een vurige toespraak, boven een geketende Prometheus. Arbeiders uit het hele land betaalden mee, als antwoord op het Van Heutszmonument. Bij de onthulling in 1931 stonden er tienduizenden."
    body: |
      Het begon met een monument voor iemand anders: Amsterdam besloot generaal Van Heutsz, de koloniale legeraanvoerder, te eren. Een vereniging van werklieden bij de elektriciteitsbedrijven van de stad bracht het ter sprake bij een syndicalistische bond van overheidspersoneel, en in juni 1928 kwam er een comité voor een beeld van Ferdinand Domela Nieuwenhuis (1846-1919). Hij was eerst predikant, werd een van de oprichters van de socialistische beweging in Nederland en later anarchist.

      Beeldhouwer Johan Polet had nog datzelfde jaar een eerste ontwerp klaar. Te tam, vonden de vereerders: van Domela's strijdlust was niets te zien. Een commissie met onder anderen Berlage en Roland Holst liet hem een strijdbaarder versie maken.

      Op 29 augustus 1931 onthulde de weduwe het beeld, voor tienduizenden arbeiders uit het hele land die er zelf aan hadden meebetaald. Er was te weinig ruimte, dus een deel keek toe vanaf de overkant van de Singelgracht. In het beeld komen twee kanten van Polet samen. Op de sokkel een expressionistische Prometheus in basalt, geketend en met een toorts: hij stal het vuur van de goden voor de mensen. Daarboven een klassieke bronzen Domela die een vlammend betoog houdt. Een broer van Domela merkte op dat die zo'n werkmansjasje nooit zou hebben gedragen.

      Iets verderop op hetzelfde plein staat een boom uit een heel ander kamp: een linde waarvan de tekststeen hem de Koningin Wilhelmina Linde noemt, van 'de kinderen van Christelijke bewaarscholen', 31 augustus tot 30 november 1898.

      Let op:
      - de geketende Prometheus met zijn toorts, in basalt op de sokkel
      - de plaquette aan de achterkant met Domela's leuze 'Recht voor allen'
      - de plek op de kademuur tussen de Willemsbrug en de Mirakelbrug
      - de Wilhelminalinde met haar tekststeen uit 1898, vlakbij op het Nassauplein
    attributes:
      check_note: "De Wilhelminalinde met tekststeen uit 1898 aan het Nassauplein: registratie zonder datum, geen recente foto gevonden."
    sources:
      - https://nl.wikipedia.org/wiki/Standbeeld_van_Domela_Nieuwenhuis
      - "https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/2613"

- title: Abri en peperbus (tram-stop living room)
  summary: A tram shelter furnished like a living room, with bronze mother-in-law's tongues on the window sills, facing a rescued advertising column turned into a soapbox "where the next revolution can break out".
  body: |
    After the urban renewal of the Staatsliedenbuurt, the Amsterdam arts fund and the district commissioned Frank Halmans to make an artwork for the Van Limburg Stirumplein, where the tram crosses the square. He made two everyday objects, one on each side of the tram tracks.

    The abri (shelter) is a round, open tram shelter of concrete, steel, glass and tiles under a saucer-shaped roof. There are no seats inside: you stand, as you would at the window at home. Halmans's theme is waiting. Waiting for the tram, he said, begins at home, pacing and looking outside, and you simply carry it on at the stop. So the shelter feels like a living room, with the same houseplants on the sills as at home, cast in bronze. The peperbus (pepper-pot advertising column) was about to be removed; Halmans saved it, set it on a tiled plinth with a bench around it, and added two little stairs to a lectern with a reading lamp. The steering committee wanted a nod to the neighbourhood's turbulent years of action groups, and Halmans called it a place "where the next revolution can break out".

    A hundred metres north, three bronze figures by Peter Erftemeijer stride off the square along the path to the former district office. The sculptor has made many figures of ordinary people doing everyday things, walking for one.

    Look for:
    - the bronze sansevierias on the window sills of the shelter
    - the steps and lectern on the old advertising column
    - the tiled round benches, white inside and ecru outside
    - Erftemeijer's three bronze walkers heading for the old district office
