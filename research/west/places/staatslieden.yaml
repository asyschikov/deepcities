  nl:
    title: Remonstrants hofje, Van Hallstraat 51
    summary: "Een laag hofje uit 1910 voor alleenstaanden en ouderen, betaald uit het legaat van Everdina de Lanoy aan de Remonstrantse Gemeente, rond een tuin aan de kop van het bouwblok. In de negentiende-eeuwse ring is zo'n hofje een zeldzaamheid."
    body: |
      Een hofje van maar twee verdiepingen, midden in de negentiende-eeuwse ring. Het geld kwam van Everdina de Lanoy, die in 1882 een legaat naliet aan de Remonstrantse Gemeente; het hofje draagt haar naam, de Everdina de Lanoyhof. In 1910 liet de gemeente het bouwen als onderdak voor alleenstaanden en ouderen. De architect was P.A. Timmers, over wie verder niets bekend is. Elders in de negentiende-eeuwse ring zijn nog een paar van zulke liefdadige hofjes te vinden, maar in deze wijken zijn ze bij elkaar genomen zeldzaam.

      Het gebouw is U-vormig: de brede voorkant ligt aan de Van Hallstraat, de twee kortere zijvleugels lopen langs de Cliffordstraat en de Bentinckstraat. Daarbinnen ligt een tuin, die je bereikt via de ingang in het midden. Rond 2000 is het hofje gerestaureerd en in 2001 verkocht aan woningcorporatie Het Oosten, nu Stadgenoot. Er wordt nog steeds gewoond, nu door studenten en starters en niet meer door ouderen.

      Alles aan de gevel benadrukt de lengte. Op een plint van hardsteen ligt roodbruine baksteen met drie gepleisterde banden erdoor, en bovenaan een gepleisterde fries met een overstekende houten goot, gedragen door klossen. Alleen in het midden van de voorgevel steekt een vierkant bouwdeel een halve verdieping boven de rest uit.

      Let op:
      - het poortje rond de middelste ingang, in een sobere Hollandse renaissancestijl
      - de gepleisterde banden en de houten dakoverstek op klossen
      - het hogere vierkante middendeel van de voorgevel
    attributes:
      original_use: Hofje voor alleenstaanden en bejaarden
    sources:
      - city:200757 (redengevende omschrijving)

- title: Zaagmolenschool and Filmhuis Cavia
  summary: "A 1913–1914 school hidden inside De Bazel's housing block, reached only through gateways. Now artists' studios and Filmhuis Cavia, a small film house left over from the neighbourhood's squatting years."
  body: |
    Public Works designed this twelve-class school, once known as the Zaagmolenschool, in 1913–1914, for the courtyard of the northern block of De Bazel's housing complex. It cannot be seen from the street; you reach it through gateways. It shares the scale of the surrounding flats but has its own character: where De Bazel used bands of decorative brickwork, the school has plain bands and sandstone springers and keystones, and it lacks the notched corners and pitched roofs of the homes. The almost square plan of two to three storeys wraps around an inner courtyard.

    Today the building is mostly used by the Muzenis foundation, which lets the rooms as artists' and theatre workshops. On the first floor at Van Hallstraat 52 is Filmhuis Cavia, a film house that works with volunteers and opened in 1983 and is one of the cultural places that survived from the neighbourhood's squatting years.

    Look for:
    - the gateways through De Bazel's blocks that lead to the school
    - sandstone springers and keystones over the windows
    - the Filmhuis Cavia entrance at Van Hallstraat 52
