  nl:
    title: Zaagmolenschool en Filmhuis Cavia
    summary: "Van de straat zie je deze school uit 1913–1914 niet: ze zit verstopt binnen het woonblok van De Bazel, alleen bereikbaar via poorten. Nu zitten er ateliers en Filmhuis Cavia, een filmhuis dat overbleef uit de kraakjaren van de buurt."
    body: |
      Om deze school te vinden moet je door een poort. Publieke Werken ontwierp haar in 1913–1914 als twaalfklassige school, ooit bekend als de Zaagmolenschool, en zette haar midden op het binnenterrein van het noordelijke woonblok van K.P.C. de Bazel. Vanaf de straat is ze onzichtbaar.

      Qua maat past ze bij de woningen eromheen, maar ze heeft een eigen gezicht. De Bazel versierde zijn blokken met stroken siermetselwerk; de school houdt het bij eenvoudige speklagen en aanzet- en sluitstenen van zandsteen. De afgeschuinde hoeken en schilddaken van de woonblokken ontbreken. De plattegrond is bijna vierkant, twee tot drie verdiepingen hoog, en sluit zelf weer een binnenplaats in.

      Tegenwoordig gebruikt vooral stichting Muzenis het gebouw; die verhuurt de ruimtes als werkplaatsen aan kunstenaars en theatermakers. Op de eerste verdieping van Van Hallstraat 52 zit Filmhuis Cavia, een filmhuis met vrijwilligers dat in 1983 openging. Het is een van de culturele plekken die zijn overgebleven uit de jaren dat de Staatsliedenbuurt een krakersbuurt was.

      Let op:
      - de poorten door de blokken van De Bazel die naar de school leiden
      - de zandstenen aanzet- en sluitstenen boven de ramen
      - de ingang van Filmhuis Cavia op Van Hallstraat 52
    attributes:
      original_use: Lagere school
    sources:
      - city:200769 (redengevende omschrijving)
      - https://www.filmhuiscavia.nl

- title: Kraakliedenbuurt and Hans Kok (Schaepmanstraat)
  summary: In the 1980s some 800 squatters made the Staatsliedenbuurt the "Kraakliedenbuurt". An eviction at Schaepmanstraat 59 in October 1985 ended with the squatter Hans Kok dead in a police cell.
  body: |
    In the 1960s and 70s working families left the Staatsliedenbuurt, and squatters moved into the empty flats scattered through the neighbourhood. Because the area was tucked away, the authorities long left it alone, and it grew to about 800 squatters, the largest concentration in the city, earning the nickname Kraakliedenbuurt (squatters' quarter, a pun on staatslieden, statesmen). Because they squatted single flats rather than whole buildings, they were hard to evict, and they built strong neighbourhood organisations: the squat café De Rioolrat as the centre, street papers, the Staatsradio and StaatsTV, open kitchens, and the Blauwe Duim tool-lending shop. When mayor Ed van Thijn tried to visit, angry squatters chased him off.

    On 24 October 1985 a squatted flat in the Schaepmanstraat was evicted over alleged rent arrears and immediately reoccupied. That evening it was evicted again, and the re-squatters were arrested. Among them was Hans Kok, 23, bass player in the punk bands Terreur and Lol en de Ellendelingen. The next afternoon he was found dead in his cell. Three inquiries concluded he died of a mix of alcohol, medication, pneumonia and neglect, not police violence, but arson attacks and unrest followed. The neighbourhood's squat-born places, such as Zaal 100 and Filmhuis Cavia, still exist.

    Times change. The mayor was chased out in 1984, after years in which the city had left the area to rot until hardly any official dared to set foot in it. In November 2026 the same city posted a video calling the Staatsliedenbuurt perhaps one of the most romantic neighbourhoods in Amsterdam.

    Look for:
    - the Schaepmanstraat, scene of the October 1985 evictions
    - Filmhuis Cavia in the Van Hallstraat and Zaal 100, both born in the squatting years
