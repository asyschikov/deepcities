  nl:
    title: Scheepstimmerwerf Boekel (De Wittenstraat 174)
    summary: "Een huisje met werkplaats uit de tijd dat hier loodsen en werven tot aan de Kostverlorenvaart doorliepen. Er zaten een scheepstimmerman, een sleepdienst en een rederij met veerboten die IJ-tunnel I tot en met IV heetten."
    body: |
      Zo'n dertig jaar voordat er een tunnel onder het IJ kwam, voeren er al veerboten rond die IJ-tunnel I, II, III en IV heetten. Ze hoorden bij het bedrijf dat hier aan de De Wittenstraat begon.

      Voor de stadsvernieuwing stond dit eind van de straat vol schuren en werkplaatsen, met erven die tot aan de Kostverlorenvaart liepen. In 1893 vestigde scheepstimmerman Cornelis Boekel zich hier; het huis met werkplaats is uit die tijd over. Boekel en zijn nakomelingen verhuurden ook schuiten en deden sleepwerk. In de jaren dertig kwam er een rederij bij, met passagiersdiensten tussen de Willemspoort en Disteldorp. Voor die tunnel bestonden toen alleen nog plannen. In de jaren vijftig werden de veerdienst en de rondvaarten verkocht aan rederij Kooij, en in de jaren zeventig gingen huis en werf over naar timmerbedrijf Bouwman.

      Toen de bedrijven in de jaren negentig voor de stadsvernieuwing moesten vertrekken, mocht het huis blijven, al werd het een klein stukje verplaatst. Al in 1995 werd het gemeentelijk monument.

      Let op:
      - een klein ouderwets huis tussen woningbouw uit de jaren negentig, een overblijfsel van de bedrijvigheid aan het water
      - de Kostverlorenvaart erachter, waar de werf vroeger tot aan het water liep
    attributes:
      original_use: Woonhuis met werkplaats (scheepstimmerwerf)
    sources:
      - https://amsterdamopdekaart.nl/1850-1940/De_Wittenstraat/174

- title: Former double school, De Wittenstraat 27-45
  summary: An 1892 school for 800 poor children with entrances like Mannerist triumphal arches. Later a chapel, it hides Lucebert's first monumental painting, now inside a private flat.
  body: |
    Public Works built this school in 1892 for two free "first-class" primary schools, the schools for the poorest children. It was designed as a mirror image, one school per half, with eight double-size classrooms and two gyms for eight hundred pupils in all. Behind the classrooms ran a corridor. The double classrooms followed from the education law of 1878 and the building rules of 1883, which limited class sizes.

    Architects had more freedom with schools than with housing, and the design was also meant to help "civilise" the population. The symmetrical red-and-yellow brick façade under a mansard roof is inspired by the Dutch Renaissance, then seen as the national style of the Golden Age. The two corner entrances are the showpieces, with sandstone plant reliefs and reliefs that probably show Zephyrus, the west wind.

    The building later served as the chapel of the Sint Franciscushuis, and in 1947 the poet-painter Lucebert painted a religious mural there, his first monumental commission and his only monumental work in Amsterdam. It survives, incomplete, inside what is now a private apartment.

    Look for:
    - the two richly decorated entrances, with plaques reading "Anno" and "1892" under small pediments
    - sandstone bands, cornices and corner blocks against red and yellow brick
    - the dark blue tiles of the mansard roof
  category: schools
  lat: 52.383731
  lng: 4.879677
  address: De Wittenstraat 27-45
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/0ba3b80f-08c2-46c8-a241-6182a9b9aa39" }
    - { label: Wandkunst Amsterdam, url: "https://maps.amsterdam.nl/wandkunst/" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "200767"
    built: "1892"
    architect: Dienst der Publieke Werken
    listed: 2016
    original_use: Two free primary schools
  sources:
    - city:200767 (redengevende omschrijving)
    - maps.amsterdam.nl wandkunst dataset (Lucebert, De Wittenstraat 29; gives build year 1889, school no. 57)
    - "https://maps.amsterdam.nl/open_geodata/geojson_lnglat.php?KAARTLAAG=WANDKUNST&THEMA=wandkunst"
  nl:
    title: Voormalige dubbele school De Wittenstraat 27-45
    summary: "Een school uit 1892 voor achthonderd arme kinderen, met ingangen als maniëristische triomfpoorten. Later was het een kapel, en binnen zit nog Luceberts eerste monumentale schildering, nu in een privéwoning."
    body: |
      In een privéwoning in deze oude school zit het enige monumentale werk dat Lucebert in Amsterdam maakte. Het gebouw diende later als kapel van het Sint Franciscushuis, en daar schilderde de dichter-schilder in 1947 een religieuze voorstelling op de muur: zijn eerste monumentale opdracht. Het werk is er nog, maar niet compleet.

      Publieke Werken bouwde de school in 1892 voor twee gratis lagere scholen 'der eerste klasse', de scholen voor de armste kinderen. Het ontwerp is gespiegeld: elke helft één school, samen acht dubbele lokalen en twee gymzalen voor achthonderd leerlingen. Achter de lokalen liep een gang. De dubbele lokalen waren een gevolg van de onderwijswet van 1878 en de bouwregels van 1883, die de klassen begrensden.

      Met een school had een architect meer vrijheid dan met woningen, en het ontwerp moest ook bijdragen aan het 'beschaven' van de bevolking. De symmetrische gevel van rode en gele baksteen onder een mansardedak is geïnspireerd op de Hollandse renaissance, die toen gold als de nationale stijl van de Gouden Eeuw. De pronkstukken zijn de twee hoekingangen, met zandstenen plantreliëfs en reliëfs die waarschijnlijk Zephyrus voorstellen, de westenwind.

      Let op:
      - de twee rijk versierde ingangen, met de plaquettes 'Anno' en '1892' onder kleine frontons
      - banden, lijsten en hoekblokken van zandsteen tegen rode en gele baksteen
      - de donkerblauwe pannen van het mansardedak
    attributes:
      architect: Dienst der Publieke Werken
      original_use: Twee openbare lagere scholen der eerste klasse
    sources:
      - city:200767 (redengevende omschrijving)
      - maps.amsterdam.nl wandkunst (Lucebert)

- title: Wodan paint factory
  summary: "A crisp 1941 paint and varnish works by Lau Peters, all yellow brick, bare concrete frame and dark red-brown steel windows, with a staff flat on top."
  body: |
    Lau Peters designed this building in 1940 for Jacob Martens, director of the Wodan paint and varnish factory, and it was built in 1941. A concrete frame cast in one piece carries the whole complex. At the front, on the Donker Curtiusstraat, an office block of three storeys has offices below and a staff flat on top, with a single-storey garage beside it. Directly behind stands the two-aisled factory hall, with a three-storey section slotted into one aisle.

    The design uses only a few materials: yellow brick in a stacked bond, natural or pale-painted concrete, artificial granite, glass, and steel doors, frames and glazing bars all painted dark red-brown. Office, flat, garage and factory can each be read from the outside, yet they belong together. The register links it to modernists of the Groep '32 such as Albert Boeken's Apollohal. It stands among the industry along the Kostverlorenvaart and is remarkably intact.

    Look for:
    - the visible concrete frame against yellow brick
    - small round windows and slender canopies
    - the glazed ends of the garage
    - inside the stair hall (not public), a tile tableau the factory staff gave at the opening in 1941
  category: industrial
  lat: 52.378617
  lng: 4.871394
  address: Donker Curtiusstraat 21-25
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/9697cc0a-a8d4-43f6-9153-91e3c21232fb" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "200773"
    built: 1940–1941
    architect: Lau Peters
    listed: 2016
    original_use: Paint and varnish factory with offices and staff flat
  sources:
    - city:200773 (redengevende omschrijving; register fields 1939–1941)
  nl:
    title: Voormalige Wodan-verffabriek
    summary: "Een verffabriek uit 1941 die je van buiten kunt lezen: kantoor, dienstwoning, garage en fabriekshal, in gele baksteen, een kaal betonskelet en stalen ramen in donker roodbruin. Ontwerp van Lau Peters, en opvallend gaaf gebleven."
    body: |
      Een handvol materialen, meer had Lau Peters niet nodig. Gele baksteen, in staand klezorenverband. Beton, kaal of licht geverfd. Kunstgraniet, glas, en stalen deuren, kozijnen en roeden, allemaal in hetzelfde donkere roodbruin. Daarmee bouwde hij een verffabriek waarvan je van buitenaf kunt aflezen wat waar gebeurde, en die toch één geheel blijft.

      Peters tekende het gebouw in 1940 voor Jacob Martens, directeur van de Wodan Verf- en Lakfabriek; in 1941 stond het er. Alles rust op één doorlopend gegoten betonskelet. Aan de Donker Curtiusstraat staat het kantoorgebouw van drie lagen, met kantoren onderin en een dienstwoning bovenop, en ernaast een garage van één laag. Pal daarachter ligt de fabriekshal met twee beuken; in een ervan zit als het ware een deel van drie lagen ingeschoven.

      De gemeente plaatst het ontwerp in het rijtje van de modernisten van de Groep '32, met de Apollohal van Albert Boeken als voorbeeld. Het staat tussen de oude industrie langs de Kostverlorenvaart en is buitengewoon gaaf gebleven.

      Let op:
      - het zichtbare betonskelet tegen de gele baksteen
      - de kleine ronde raampjes en de ranke luifels
      - de glazen kopse kanten van de garage
      - binnen in de trappenhal (niet openbaar) een tegeltableau dat het personeel bij de opening in 1941 schonk
    attributes:
      original_use: Verf- en lakfabriek met kantoor en dienstwoning
    sources:
      - city:200773 (redengevende omschrijving)

- title: Hugo de Groothof (former widows' foundation)
  summary: An 1882–1883 neo-Renaissance home for widows of the Dutch Reformed diaconate, with its first stone laid twice and its original six-pane sash windows still in place.
  body: |
    Caring for widows, the elderly, orphans and the sick was a central task of the diaconate of the Nederduitsch Hervormde Gemeente (Dutch Reformed congregation), and it led to many buildings. The diaconate built this Weduwen Stichting (widows' foundation) in 1882–1883 to a design by W. Langhout Gzn., an architect and estate agent who also built the brewery on the Bilderdijkstraat. The L-shaped building wraps around the street corner with a chamfered corner gable, and inside it is laid out along central corridors with stairs at each entrance.

    It was thoroughly renovated in 1982 and is now called the Hugo de Groothof. It still belongs to the diaconate and houses, among others, young people who work on diaconal projects. Remarkably, the original windows, frames and doors survived the renovation, which makes it rare in the 19th-century ring.

    The foundation's rules were strict: gentlemen had to be out of the building by eleven at night, the house master kept watch, and a woman caught breaking the rule had to leave the foundation. Widows on the ground floor found a way round it by sliding up the window so their sweetheart could climb in, which is why bars later appeared in front of those windows.

    Look for:
    - stone plaques naming the foundation above the entrances, and a white marble one on the chamfered corner
    - two first stones in cartouches in the plinth: the first stone was laid twice, in April 1882
    - the original six-pane sash windows and double panelled doors
    - gabled bays, grey sand-lime bands and wrought-iron wall anchors
  category: housing
  lat: 52.37588
  lng: 4.87448
  address: Eerste Hugo de Grootstraat 13
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/aca9ab4b-e8c6-4095-920b-9206f794e186" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "223011"
    built: 1882–1883
    architect: W. Langhout Gzn.
    listed: 2008
    original_use: Widows' housing of the Dutch Reformed diaconate
    check: Facts
    check_note: "Read the date on the first stones in the plinth: sources give 11 April or 18 April 1882."
  photos:
    - commons:File:Eerste Hugo de Grootstraat 13 (1).jpg
  sources:
    - city:223011 (redengevende omschrijving)
    - "hofjesberaad.nl/hugo-de-grootstraat and hofjesinamsterdam.nl/hugo-de-groothof (11 April 1882, N.J. van Limmik jr.) vs city register 223011 (18 April) (checked Nov 2026)"
    - "https://geheugenvanwest.amsterdam/page/10740 (from the diaconate's centenary booklet 1882 to 1982: men out by 11 pm, watched by the house master, eviction if caught; ground-floor women opened the window for their lovers; section 'Hartstocht en tralies')"
  nl:
    title: Hugo de Groothof (voormalige Weduwenstichting)
    summary: "Een neorenaissancistisch weduwenhuis van de hervormde diaconie uit 1882-1883. De eerste steen werd er twee keer gelegd, en de originele zesruits schuiframen zitten er nog in."
    body: |
      Om elf uur 's avonds moesten de heren de deur uit, en de huismeester hield dat scherp in de gaten. Wie betrapt werd, kon vertrekken. De weduwen op de begane grond hadden er iets op gevonden: ze schoven het raam omhoog, en hun liefje klom zo naar binnen. Daarom kwamen er later tralies voor die ramen.

      Zorgen voor weduwen, ouderen, wezen en zieken was een kerntaak van de diaconie van de Nederduitsch Hervormde Gemeente, en dat leverde heel wat gebouwen op. Deze Weduwen Stichting liet ze in 1882-1883 neerzetten naar een ontwerp van W. Langhout Gzn., architect en makelaar, die ook de brouwerij aan de Bilderdijkstraat bouwde. Het gebouw heeft de vorm van een L en buigt om de straathoek, met een afgeschuinde hoek onder een topgevel. Binnen lopen middengangen, met bij elke ingang een trappenhuis.

      In 1982 werd het grondig opgeknapt; sindsdien heet het Hugo de Groothof. Het is nog altijd van de diaconie en er wonen onder meer jongeren die zich inzetten voor diaconale projecten. Opvallend genoeg overleefden de oude ramen, kozijnen en deuren de renovatie. Dat maakt het gebouw zeldzaam in de 19e-eeuwse ring.

      Let op:
      - de stenen plaquettes met de naam van de stichting boven de ingangen, en een van wit marmer op de afgeschuinde hoek
      - twee eerste stenen in cartouches in de plint: de eerste steen is twee keer gelegd, in april 1882
      - de originele zesruits schuiframen en dubbele paneeldeuren
      - risalieten met topgevels, banden van grijze kalkzandsteen en smeedijzeren muurankers
    attributes:
      original_use: Weduwenhuisvesting van de diaconie der Nederduitsch Hervormde Gemeente
      check_note: "Lees de datum op de eerste stenen in de plint: de bronnen noemen 11 april of 18 april 1882."
    sources:
      - city:223011 (redengevende omschrijving)
      - "https://geheugenvanwest.amsterdam/page/10740"

- title: Former double school, Eerste Nassaustraat 5-7
  summary: Two free "schools for the poor" of 1884 under one roof, built to a standard Public Works design that once stood three times in this neighbourhood.
  body: |
    In 1884 Public Works built two free "first-class" primary schools here side by side, school no. 43 at number 5 and no. 42 at number 7, with seven classes each and two gyms. Until 1880 such schools were simply called armenscholen, schools for the poor. The building was mirrored, with an entrance at each end of the façade and a shared H-shaped corridor divided in the middle. The same design was built three times: at the Van Oldenbarneveldtplein 12-14, here, and on the Van Oldenbarneveldtstraat, where it has since been demolished.

    In 1915 the building was enlarged with an extra storey under a flat roof, and the two schools were merged with a single entrance at number 5. The façade is sober: red brick with bands of yellow and grey brick and stone cornices. According to the register that plainness reflects that this was a school for the children of the lowest income groups, and the search for a suitable form for the corridor school in the 1880s.

    Look for:
    - the former corner bays that once held the two separate entrances
    - the bands of yellow and grey brick in the red façade
    - the extra storey of 1915 under its flat roof
  category: schools
  lat: 52.383038
  lng: 4.879509
  address: Eerste Nassaustraat 5-7
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/16b851b1-97cc-4ded-b956-19ba019381cf" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "200768"
    built: 1884 (extra storey 1915)
    architect: Dienst der Publieke Werken
    listed: 2016
    original_use: Two free primary schools
  sources:
    - city:200768 (redengevende omschrijving)
  nl:
    title: Voormalige dubbele school Eerste Nassaustraat 5-7
    summary: "Twee gratis scholen voor de armsten uit 1884 onder één dak, naar een standaardontwerp van Publieke Werken dat ooit drie keer in deze buurt stond."
    body: |
      In 1884 bouwde Publieke Werken hier twee kosteloze lagere scholen 'der eerste klasse' naast elkaar: school 43 op nummer 5 en school 42 op nummer 7, elk met zeven klassen, plus twee gymlokalen. Tot 1880 heetten zulke scholen gewoon armenscholen. Het gebouw was in spiegelbeeld opgezet, met aan elk eind van de gevel een ingang en een gezamenlijke H-vormige gang die in het midden was afgesloten. Hetzelfde ontwerp verrees drie keer: aan het Van Oldenbarneveldtplein 12-14, hier, en aan de Van Oldenbarneveldtstraat, waar het intussen is gesloopt.

      In 1915 kwam er een verdieping met plat dak bovenop en gingen de twee scholen samen, met nog maar één ingang, op nummer 5. De gevel is eenvoudig: rode baksteen met banden van gele en grijze steen en lijsten van natuursteen. Volgens het register zegt die soberheid iets over de leerlingen, kinderen uit de armste gezinnen, en over het zoeken naar een goede vorm voor de corridorschool in de jaren tachtig van de negentiende eeuw.

      Let op:
      - de vroegere hoekpartijen waar eens de twee aparte ingangen zaten
      - de banden van gele en grijze baksteen in de rode gevel
      - de extra verdieping uit 1915 onder het platte dak
    attributes:
      architect: Dienst der Publieke Werken
      original_use: Twee openbare lagere scholen der eerste klasse
    sources:
      - city:200768 (redengevende omschrijving)

- title: Rochdale's first block (Van Beuningenstraat)
  summary: "\"Hier begon Rochdale anno 1908\": the first housing in Amsterdam built under the 1901 Housing Act, designed by J.E. van der Pek with flats that, unusually, had no alcoves."
  body: |
    The Housing Act (Woningwet) of 1901 let municipalities ask the state for advances to build workers' homes, and after it more and more housing associations were founded. Rochdale, founded in 1903, had many municipal tramway workers among its founders, and its first project was this block. J.E. van der Pek designed it in 1908 and 1910; 28 homes were finished in 1909 and another 20 in 1912. It was the first housing in Amsterdam realised under the new act, and its plans were innovative because they had no alcoves. Because so many tram conductors, police officers and other uniformed workers came to live here, the area was nicknamed the koperen knopenbuurt (brass buttons neighbourhood).

    The style is transitional: Berlage-like square towers and cut-off corners combined with neo-Renaissance bands of yellow brick. Five tall bays rise above the eaves on the Van Beuningenstraat, most of them projecting over the entrances, with hoist beams at the top.

    Look for:
    - the gable stone "HIER BEGON / ROCHDALE / ANNO 1908" in the one tall bay that stays flush with the façade
    - the rounded and chamfered corner with Fannius Scholtenstraat, resting on stone blocks and a console
    - number 97, which keeps the original T-shaped sash windows
    - the yellow brick diamonds and bands connecting the window sills
  category: housing
  lat: 52.382967
  lng: 4.875441
  address: Van Beuningenstraat 97-115 / Fannius Scholtenstraat 97-99
  links:
    - { label: Rijksmonumentenregister (526742), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/526742" }
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/6793530b-c970-4b40-8ea9-652d30a2cc29" }
    - { label: Wikipedia (nl) Staatsliedenbuurt, url: "https://nl.wikipedia.org/wiki/Staatsliedenbuurt_(Amsterdam)" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q17291951" }
  attributes:
    heritage_status: National monument
    monument_number: "526742"
    built: 1908–1912
    architect: J.E. van der Pek
    listed: 2003
    original_use: Social housing (Woningbouwvereniging Rochdale)
  photos:
    - commons:File:Amsterdam - Beuningenstraat Rochdale.JPG
    - commons:File:VanBeuningenstraatAmsterdam.jpg
  sources:
    - rce:526742 (omschrijving)
    - https://nl.wikipedia.org/wiki/Staatsliedenbuurt_(Amsterdam) (koperen knopenbuurt; claims the first Woningwet homes "of the Netherlands")
    - city:200769 (Rochdale founded 1903)
    - "https://api.data.amsterdam.nl/v1/monumenten/monumenten/?monumentnummer=200769"
  nl:
    title: Eerste complex van Rochdale (Van Beuningenstraat)
    summary: "\"Hier begon Rochdale anno 1908\": de eerste woningwetwoningen van Amsterdam, getekend door J.E. van der Pek, met plattegronden zonder alkoven, toen nog een vernieuwing."
    body: |
      Een gevelsteen zegt het zonder omhaal: HIER BEGON ROCHDALE ANNO 1908. Dit blok was het eerste project van woningbouwvereniging Rochdale, en de eerste woningbouw in Amsterdam die er kwam dankzij de nieuwe Woningwet van 1901. Die wet gaf gemeenten het recht om bij het Rijk voorschotten te vragen voor arbeiderswoningen, en daarna kwamen er steeds meer woningbouwverenigingen bij. Rochdale ontstond in 1903; onder de oprichters zaten veel werklieden van de Gemeentetram.

      J.E. van der Pek maakte de ontwerpen in 1908 en 1910. In 1909 waren 28 woningen klaar, in 1912 volgden er nog 20. Nieuw was dat de plattegronden geen alkoven hadden. In de buurt kwamen zoveel tramconducteurs, agenten en andere mensen in uniform wonen dat ze de bijnaam koperen knopenbuurt kreeg.

      De stijl hangt tussen twee tijden in: Berlage-achtige vierkante torens en afgesneden hoeken, gecombineerd met neorenaissancistische banden van gele steen. Aan de Van Beuningenstraat steken vijf hoge traveeën boven de dakrand uit, de meeste naar voren gebouwd boven de voordeuren, met hijsbalken in de top.

      Let op:
      - de gevelsteen "HIER BEGON / ROCHDALE / ANNO 1908" in de enige hoge travee die niet uit de gevel springt
      - de hoek met de Fannius Scholtenstraat: rond en afgeschuind, rustend op stenen blokken en een console
      - nummer 97, dat de oorspronkelijke T-schuiframen nog heeft
      - de ruiten en banden van gele steen die de vensterbanken met elkaar verbinden
    attributes:
      original_use: Arbeiderswoningen (woningbouwvereniging Rochdale)
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/526742
      - https://nl.wikipedia.org/wiki/Staatsliedenbuurt_(Amsterdam)

- title: Schoolkinderbad (children's bathhouse)
  summary: A half-timbered 1901 bathhouse where whole classes of schoolchildren were marched in forty at a time, on command, for their weekly free shower.
  body: |
    Around 1900 Amsterdam worried about hygiene and contagious disease, and in 1890 the council started a trial with baths at two schools. This Schoolkinderbad (school children's bath), built in 1901 to a design by the assistant city architect H. Leguyt, was one of the first bathhouses in the city. Children came once a week to shower for free. At the front were rooms for the administration and for the bath master and bath mistress, with the manager's flat upstairs. Behind were a waiting and play room, a changing room, and at the very back an octagonal hall with about forty showers.

    The Algemeen Handelsblad described Leguyt's routine: groups of forty boys or forty girls undressed facing the wall, filed to the showers on command, and the attendant slowly turned the mixing taps from warm to cold and back to warm. Leguyt, who mostly designed hospitals and civic buildings, gave this little building an unusually whimsical front with timber framing, rare in the 19th-century ring.

    Look for:
    - the half-timbered brick front with a dormer house carried on a decorated truss
    - the Jugendstil tile panel reading SCHOOL KINDERBAD above the canopy
    - a second tile panel with the year "Ao 1901"
    - the wooden porch canopy with its own little gable
  category: civic
  lat: 52.375021
  lng: 4.873256
  address: Frederik Hendrikstraat 105
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/029e29a1-3757-4e2c-8d99-f2017a75b1cf" }
    - { label: Amsterdam op de kaart, url: "https://amsterdamopdekaart.nl/1850-1940/Frederik_Hendrikstraat/105" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "223005"
    built: "1901"
    architect: H. Leguyt (Dienst der Publieke Werken)
    listed: 2008
    original_use: Shower bath for schoolchildren
  photos:
    - commons:File:Voorgevel in vakwerkstijl - Amsterdam - 20409030 - RCE.jpg
  sources:
    - city:223005 (redengevende omschrijving)
    - https://amsterdamopdekaart.nl/1850-1940/Frederik_Hendrikstraat/105 (quotes Algemeen Handelsblad)
  nl:
    title: Schoolkinderbad
    summary: "Veertig kinderen tegelijk, gezicht naar de muur, uitkleden op commando: in dit badhuis uit 1901 met een vakwerkgevel kwamen schoolklassen eens per week gratis douchen."
    body: |
      Gezicht naar de muur, uitkleden op commando, in de rij naar de douches. Het Algemeen Handelsblad beschreef hoe architect H. Leguyt het in dit badhuis had bedacht. Groepen van veertig jongens of veertig meisjes kleedden zich uit met de neus naar de muur en liepen op een teken naar de douchezaal. Daar draaide de begeleider langzaam aan de mengkranen: eerst warm, dan geleidelijk koud, en dan weer warm.

      Rond 1900 maakte Amsterdam zich zorgen over hygiëne en besmettelijke ziekten. In 1890 begon de gemeenteraad al een proef met baden bij twee scholen. Dit Schoolkinderbad, in 1901 gebouwd naar ontwerp van assistent-stadsarchitect Leguyt, was een van de eerste badhuizen van de stad. Kinderen kwamen hier een keer per week gratis onder de douche. Voorin zaten kamertjes voor de administratie en voor de badmeester en badvrouw, met boven de woning van de beheerder. Daarachter lagen een wacht- en speellokaal en een kleedlokaal, en helemaal achterin een achthoekige zaal met zo'n veertig douches.

      Leguyt bouwde vooral ziekenhuizen en andere gemeentelijke gebouwen. Dit kleine gebouw kreeg van hem een opvallend speelse gevel met houten vakwerk, iets wat je in de negentiende-eeuwse ring zelden ziet.

      Let op:
      - de bakstenen gevel met vakwerk en een dakhuis op een versierd sierspant
      - het jugendstiltegeltableau met SCHOOL KINDERBAD boven de luifel
      - een tweede tegeltableau met het jaartal 'Ao 1901'
      - de houten luifel boven de deur met een eigen geveltje
    attributes:
      architect: H. Leguyt (Dienst der Publieke Werken)
      original_use: Douchebad voor schoolkinderen
    sources:
      - city:223005 (redengevende omschrijving)
      - https://amsterdamopdekaart.nl/1850-1940/Frederik_Hendrikstraat/105

- title: De Otter
  summary: Amsterdam's last wind-powered sawmill, built in 1631 and the oldest surviving paltrok mill anywhere. It still saws tree trunks on windy Tuesday afternoons beside its tarred timber sheds.
  body: |
    From the 17th century until the late 19th, the bank of the Kostverlorenvaart was lined with dozens of wind-driven sawmills. De Otter was one of a series of thirteen built from 1630 for the Amsterdam Houtzaagmolencompagnie, the sawmill company, and dates from 1631. It is a paltrok (a mill whose whole body turns on a ring of rollers at ground level), a type that survives in only five places in the Netherlands; De Otter is the oldest of them.

    From 1816 the site belonged to the timber merchant G.T. van der Bijl. When the city swallowed the area around 1900 and the Frederik Hendrikbuurt was built, the timber business stayed, switching to electric saws in 1921, and the mill stood idle without sails. After its neighbour Het Luipaard was demolished in 1931, De Otter was the last of Amsterdam's many sawmills. It was restored in 1996, survived a long fight over moving it to Uitgeest (settled by a court in 2017), and has turned again since May 2017.

    Look for:
    - the mill turning, with logs being sawn, on Tuesday afternoons when there is enough wind
    - the open timber sheds along the water, with red-tiled roofs on rows of timber trusses and tarred plank walls
    - the slipway where logs were hauled up from the water
  category: industrial
  lat: 52.376161
  lng: 4.870938
  address: Gillis van Ledenberchstraat 78
  links:
