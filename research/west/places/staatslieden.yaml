  nl:
    title: Frederik Hendrikplantsoen
    summary: "Een groene rotonde op de plek van de oude Zaagmolenbuurt. Johnny Jordaan woonde hier tussen de platanen, en kinderen klimmen er op kunst, van de speelrekken van Aldo van Eyck tot De Stam van Atelier Van Lieshout."
    body: |
      Hier woonde Johnny Jordaan, jarenlang, in een van de laat-negentiende-eeuwse huizen aan de rotonde met de oude platanen.

      Vóór 1886 heette deze plek de Middenweg, in de Zaagmolenbuurt. Er stonden zaagmolens met namen als De Windhond, De Bijl, De Kop, De Jager en Het Luipaard; die laatste ging in juni 1931 tegen de vlakte. In 1886 kreeg het plein de naam van prins Frederik Hendrik van Oranje, en vanaf 1890 was het het Frederik Hendrikplantsoen: een parkje met een rotonde. Een weg met tramrails snijdt het park in tweeën, en de Zaagpoortbrug brengt je over de Singelgracht naar het Marnixplein.

      Op kunst klimmen heeft hier een lange traditie. In de jaren vijftig lag er een speelplaats met duikelrekken, een zandbak en een tunnel van Aldo van Eyck. Die verdwenen langzaam, zoals overal in de stad. In 1965 kwam het Droombeeld van Cephas Stauthamer, en kinderen klommen er al snel graag op. Na een herinrichting in 2012-2015 onder leiding van Buurt Sand & Co kreeg het park De Stam van Joep van Lieshout, vijf delen om op te zitten en te spelen, en een klauterbrug van Carve.

      Let op:
      - De Stam van Atelier Van Lieshout
      - het Droombeeld van Stauthamer
      - de oude bomen, zoals twee platanen uit 1910 en een esdoorn uit 1947
    sources:
      - https://nl.wikipedia.org/wiki/Frederik_Hendrikplantsoen

- title: Raampoort bridge (brug 165)
  summary: A broad 1969 bridge over the Singelgracht, built for a traffic breakthrough into the Jordaan that protests stopped. It has Amsterdam School echoes by Dirk Sterenberg and sheet-metal railings by Herman van der Heide.
  body: |
    The Raampoort was a city gate, named, like the Raamgracht, after the wooden frames on which cloth was stretched and dried. The gate was demolished in 1844 and an iron bridge followed. The city's 1931 traffic plan foresaw a through road from the Tweede Hugo de Grootstraat over this bridge and on through a breakthrough in the Jordaan. The plan was shelved, then revived in 1969, when a new concrete bridge was built just north of the old one. The city end of the old bridge was kept as a terrace.

    The design came from Public Works, where Dirk Sterenberg then worked. He took his cue from Piet Kramer: brick with natural stone, stepped brick parapets and keep-like corners, with modern iron railings. He also designed the name plate and a hexagonal seat. The artist Herman van der Heide made the sheet-metal railings. In 1972 protests stopped the breakthrough in the Jordaan, and traffic was routed elsewhere, leaving a wide bridge for modest traffic.

    Look for:
    - Herman van der Heide's sheet-metal railings
    - the stepped brick parapets and the hexagonal seat
    - the terrace on the old bridgehead, with Hanna Mobach's statue Nieuwe Naatje (since 2005)
  category: infrastructure
  lat: 52.374078
  lng: 4.875441
  address: Tweede Hugo de Grootstraat over the Singelgracht
  links:
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Brug_165" }
  attributes:
    built: "1969"
    architect: Dirk Sterenberg (Dienst der Publieke Werken)
    artist: Herman van der Heide
  photos:
    - commons:File:Brug 165 Raampoort, in de Tweede Hugo de Grootstraat over de Singelgracht foto 1.jpg
  sources:
    - https://nl.wikipedia.org/wiki/Brug_165
  nl:
    title: Raampoort (brug 165)
    summary: "Een brede brug voor een verkeersweg die nooit kwam: in 1969 lag hij klaar voor een doorbraak dwars door de Jordaan, die na protesten werd geschrapt. Dirk Sterenberg gaf hem trekjes van de Amsterdamse School, Herman van der Heide de leuningen van metaalplaat."
    body: |
      Hier stond ooit de Raampoort, een stadspoort die net als de Raamgracht haar naam dankt aan de houten ramen waarop laken werd gespannen om te drogen. In 1844 ging de poort tegen de vlakte en kwam er een ijzeren brug. Het verkeersplan van 1931 tekende hier een doorgaande route: vanuit de Tweede Hugo de Grootstraat over de brug en dan via een nog te slaan bres door de Jordaan. Dat plan verdween in een la, tot het in 1969 weer opdook. Toen kwam er even ten noorden van de oude brug een nieuwe van beton. Van de oude bleef alleen het bruggenhoofd aan de stadskant over, nu een terras.

      Het ontwerp kwam van Publieke Werken, waar Dirk Sterenberg toen werkte. Hij keek goed naar Piet Kramer: baksteen met natuursteen, verspringende gemetselde borstweringen, hoeken als kleine burchttorens, en daarbij moderne ijzeren leuningen. Ook het naambord en een zeshoekige zitplek zijn van hem. De leuningen van metaalplaat maakte kunstenaar Herman van der Heide. In 1972 hielden protesten de doorbraak in de Jordaan tegen en ging het verkeer een andere kant op. Over bleef een royale brug voor bescheiden verkeer.

      Let op:
      - de leuningen van metaalplaat van Herman van der Heide
      - de verspringende bakstenen borstweringen en de zeshoekige zitplek
      - het terras op het oude bruggenhoofd, met sinds 2005 Nieuwe Naatje, het beeld van Hanna Mobach
    sources:
      - https://nl.wikipedia.org/wiki/Brug_165

- title: Gerard Reve memorial
  summary: "A bench, a black lamp-post with three little hatches, and a brick path pointing at the house where Gerard Reve was born in 1923. An inconspicuous memorial, too inconspicuous for the arts fund, which refused to pay towards it."
  body: |
    The writer Gerard Reve was born on 14 December 1923 on the second floor of Van Hallstraat 25, across the road. For the Waterspiegelplein, Margriet Kemper made a three-part memorial (2006) that blends into its surroundings. A wooden bench faces east, inviting you to read or stare into space. In front of it stands a lamp-post, black where the city's are mostly grey, with three hatches you can open: a text from Reve's book Nader tot U, a portrait by Rineke Dijkstra taken near the end of his life, and a photo of his birthplace. From the bench a brick path in a different colour narrows to a long point aimed straight at that house.

    The memorial was not uncontroversial. Some missed any reference to Reve's homosexuality; others replied that he had lived here for only a year, long before his homosexuality was an issue. The Amsterdam arts fund refused to contribute because the work was too inconspicuous; it would have preferred a national monument. It was unveiled on Reve's birthday in 2006 by his partner Joop Schafthuizen.

    Look for:
    - the three hatches in the black lamp-post
    - the brick path pointing to Van Hallstraat 25
    - the bench facing east
  category: curiosities
  lat: 52.38444
  lng: 4.869406
  address: Waterspiegelplein
  links:
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Gedenkteken_Gerard_Reve" }
  attributes:
    built: "2006"
    artist: Margriet Kemper
  photos:
    - commons:File:2021 Gedenkteken Gerard Reve-lantaarn (1).jpg
    - commons:File:2021 Gedenkteken Gerard Reve-bank.jpg
    - commons:File:2021 Van Hallstraat 25, Asd-Reve.jpg
  sources:
    - https://nl.wikipedia.org/wiki/Gedenkteken_Gerard_Reve
  nl:
    title: Gedenkteken Gerard Reve
    summary: "Een bank, een zwarte lantaarnpaal met drie luikjes en een klinkerpad dat wijst naar het huis waar Gerard Reve in 1923 werd geboren. Zo onopvallend dat het Amsterdams Fonds voor de Kunst er niet aan wilde meebetalen."
    body: |
      Het Amsterdams Fonds voor de Kunst vond het te bescheiden en gaf geen geld; het had liever een nationaal monument voor Reve gezien. Margriet Kemper maakte voor het Waterspiegelplein namelijk geen standbeeld maar een gedenkteken in drie delen (2006) dat je makkelijk over het hoofd ziet.

      Eerst een houten bank met uitzicht op het oosten, om te lezen of wat voor je uit te kijken. Dan een lantaarnpaal, zwart, terwijl de meeste palen in de stad grijs zijn. Er zitten drie luikjes in die je kunt openklappen: achter het ene een tekst uit Nader tot U, achter het andere een portret dat Rineke Dijkstra kort voor zijn dood van hem maakte, en achter het derde een foto van zijn geboortehuis. Volg vanaf de bank het klinkerpad, in een afwijkende kleur: het loopt uit in een lange punt die recht naar dat huis wijst. Op de tweede verdieping van Van Hallstraat 25, aan de overkant, werd de schrijver op 14 december 1923 geboren.

      Niet iedereen was tevreden. Sommigen misten een verwijzing naar Reves homoseksualiteit. Anderen wierpen tegen dat hij hier maar een jaar had gewoond, lang voordat die ter sprake kwam. Op zijn verjaardag in 2006 onthulde zijn vriend Joop Schafthuizen het monument.

      Let op:
      - de drie luikjes in de zwarte lantaarnpaal
      - het klinkerpad dat naar Van Hallstraat 25 wijst
      - de bank met uitzicht op het oosten
    sources:
      - https://nl.wikipedia.org/wiki/Gedenkteken_Gerard_Reve
