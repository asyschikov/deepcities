    monument_number: "1198, 408758, 408759"
    built: 1631 (sheds c. 1932)
    listed: 1980
    original_use: Wind-powered sawmill with timber sheds
  photos:
    - commons:File:DeOtterWinter2012 (1).JPG
    - commons:File:Paltrokmolen "De Otter" - Amsterdam - 20021976 - RCE.jpg
    - commons:File:Houtopslag molen de Otter..jpg
  sources:
    - rce:1198, rce:408758, rce:408759 (complex 408840)
