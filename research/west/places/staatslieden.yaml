    - "https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/2573"
  nl:
    title: Abri en peperbus
    summary: "Een tramhokje ingericht als huiskamer, met bronzen vrouwentongen in de vensterbank. Ertegenover een geredde peperbus, nu een zeepkist \"waar de volgende revolutie kan uitbreken\"."
    body: |
      Wachten op de tram begint thuis, vond Frank Halmans. Je ijsbeert wat, je kijkt naar buiten, en op de halte ga je daar gewoon mee verder. Dus is zijn tramhokje een huiskamer geworden, met in de vensterbank dezelfde planten als thuis, alleen dan in brons.

      Na de stadsvernieuwing van de Staatsliedenbuurt kreeg Halmans van het Amsterdams Fonds voor de Kunst en het stadsdeel de opdracht voor een kunstwerk op het Van Limburg Stirumplein, waar de tram het plein doorkruist. Hij maakte twee alledaagse dingen, aan weerszijden van de rails.

      De abri is een rond, open wachthuisje van beton, staal, glas en tegels onder een dak in de vorm van een schotel. Zitten kan er niet: je staat, zoals je thuis bij het raam staat. De peperbus op het plein zou net worden weggehaald. Halmans redde hem en zette hem op een betegelde sokkel met een bank eromheen. Twee trapjes leiden naar een spreekgestoelte met een lessenaar en een leeslamp. De begeleidingscommissie wilde iets terugzien van de woelige jaren met actiegroepen in de buurt, en Halmans noemde het een plek "waar de volgende revolutie kan uitbreken".

      Honderd meter naar het noorden lopen drie bronzen figuren van Peter Erftemeijer het plein af, over het pad naar het vroegere stadsdeelkantoor. Erftemeijer maakte veel beelden van gewone mensen die gewone dingen doen. Lopen, bijvoorbeeld.

      Let op:
      - de bronzen sansevieria's in de vensterbanken van het wachthuisje
      - de trapjes en de lessenaar aan de oude peperbus
      - de ronde betegelde banken, wit aan de binnenkant en ecru aan de buitenkant
      - de drie bronzen wandelaars van Erftemeijer, op weg naar het oude stadsdeelkantoor
    sources:
      - https://nl.wikipedia.org/wiki/Abri_en_peperbus
      - "https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/2573"

- title: Blauwe Poort (Dicky Brand)
  summary: A giant blue arch on a little triangular square where two street grids meet. The artist called it the Mary Arch, the city the Statesmen's Gate; it stands on a split foundation over a sewer pipe.
  body: |
    The point where the Van Beuningenstraat and Van Boetzelaerstraat meet was once a triangular square where two street grids collide: one roughly parallel to the Haarlemmervaart, the other to the Kostverlorenvaart. Over the years parts of it were given to the neighbourhood children, and Aldo van Eyck furnished it with climbing frames, an igloo-shaped climbing dome and structures made of concrete piles.

    During the urban renewal of the area, streets were calmed and the link to the Fannius Scholtenstraat disappeared. The city asked the artist Dicky Brand to brighten up the spot with a striking work, and she came up with a huge blue arch of lacquered galvanised steel and concrete. She called it the Mariaboog (Mary Arch) and the city called it the Staatsliedenpoort (Statesmen's Gate), but locals named it the Blauwe Poort (Blue Gate). The water and sewerage department objected, because a sewer pipe that had to stay accessible ran exactly where it was to stand, so the arch was given a split foundation, one under each leg. Some of Van Eyck's play objects were lost in the redesign, but the climbing dome survived.

    Look for:
    - the two legs of the arch, each on its own foundation
    - Aldo van Eyck's climbing dome nearby
    - the meeting of the two street grids
