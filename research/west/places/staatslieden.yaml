    - research/ams-school/places/north-west.yaml (Nassaukerk)
  nl:
    title: Nassaukerk
    summary: "Meedoen aan de prijsvraag mocht alleen wie zelf gereformeerd was. Uit 53 ontwerpen won H.G. Krijgsman, al vond de jury zijn torentje nog niet af. Een kerk uit 1925-1926 aan de De Wittenkade: Grieks kruis, vier hoge topgevels en een koperen toren."
    body: |
      Voor deze kerk gold een strenge toegangseis: alleen architecten die belijdend lid waren van de Gereformeerde Kerk mochten een ontwerp insturen. Tjeerd Kuipers zat de jury voor. Er kwamen 53 inzendingen binnen, en H.G. Krijgsman uit Zeist ging er met de winst vandoor, onder het motto 'Vrede'. Helemaal tevreden was de jury niet: dat torentje kon beter. In juli 1925 ging de eerste steen erin, op 18 juni 1926 werd de kerk in gebruik genomen, met 924 zitplaatsen. De gereformeerden konden daarna drie oudere kerken in de stad sluiten.

      De plattegrond is een rechthoek met daarin een Grieks kruis, en in de hoeken trappenhuizen: een vorm met een lange geschiedenis in de protestantse kerkbouw. Elke kruisarm eindigt in een hoge topgevel van siermetselwerk, en boven de kruising rijst een met koper beklede toren op. Baksteen en raamvormen zijn Amsterdamse School, maar dan in een strakke, versoberde versie. Bij het complex horen ook een los gebouw aan de De Wittenstraat, met dienstruimten en zes woningen, en de kosterij aan de kade, met nog eens zes woningen. Binnen is veel bewaard gebleven, en de kerk wordt nog altijd gebruikt.

      Let op:
      - de vier topgevels in siermetselwerk
      - de koperen vieringtoren met zijn klok
      - de ramen met ellipsbogen laag in de muren
      - het pleintje tussen de kade en de kerk
    attributes:
      original_use: Gereformeerde kerk met kosterij en woningen
    sources:
      - city:223028 (redengevende omschrijving)
      - https://nl.wikipedia.org/wiki/Nassaukerk_(Amsterdam)

- title: Boekel's boatyard house (De Wittenstraat 174)
  summary: "A surviving little house-with-workshop from the days when this strip was all sheds and yards running down to the Kostverlorenvaart. A shipwright, a towing firm and a ferry line called IJ-tunnel I-IV."
  body: |
    Before urban renewal this end of the De Wittenstraat was full of sheds and workshops, with yards running back to the Kostverlorenvaart. In 1893 the shipwright Cornelis Boekel set up here, and the house with its workshop is a survivor of that time. Boekel and his descendants also hired out barges and ran a towing service. In the 1930s a shipping line followed, with passenger services between the Willemspoort and Disteldorp. The ferries were remarkably named IJ-tunnel I to IV: plans for a tunnel under the IJ already existed, though it opened only some thirty years later. In the 1950s the ferry and canal-tour business was sold to the Kooij line, and in the 1970s house and yard passed to the carpentry firm Bouwman.

    When the businesses had to leave during the urban renewal of the 1990s, the house was kept, but moved a short distance. It was listed as early as 1995.

    Look for:
    - a small traditional house among 1990s housing, a remnant of the neighbourhood's waterside trades
    - the Kostverlorenvaart behind it, where the yard once ran down to the water
  category: industrial
  lat: 52.381892
  lng: 4.876349
  address: De Wittenstraat 174
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/c6796aae-bde3-47b1-bc16-bb70b973fd71" }
    - { label: Amsterdam op de kaart, url: "https://amsterdamopdekaart.nl/1850-1940/De_Wittenstraat/174" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "200394"
    built: "1893"
    listed: 1995
    original_use: House with workshop (shipwright's yard)
  sources:
