  nl:
    title: Centrale Markthal
    summary: "De groothandelsmarkthal van Amsterdam uit 1934, een bakstenen loods van 70 bij 100 meter zonder één kolom binnen. In de oorlog zaten veel Joden hier in de kelders ondergedoken."
    body: |
      Onder deze markthal zaten in de oorlog veel Joden ondergedoken, tot na de bevrijding, en ze werden nooit gevonden. Tegelijk gebruikte de bezetter de markt juist om Joodse handelaren in de gaten te houden: een deel werd de 'Joodse Markt', en Joodse bezoekers hadden een rode J op hun marktpas. Maar de markt was ook een verzetsnest. Met valse papieren werden mensen onmisbaar verklaard voor de voedselvoorziening. In 1959 kwam binnen een bronzen reliëf van Hildo Krop voor de vermoorde Joodse handelaren, met een regel van Victor van Vriesland: 'Gedenkt het leed, maar niet om stil te staan.'

      Tot 1934 was de groentegroothandel een openluchtmarkt achter de Marnixstraat. Toen bouwde de stad op een oude vuilnisstort tussen de twee marktgrachten de Centrale Markt: tien insteekhavens, pakhuizen, een spooraansluiting en in het midden deze hal. Nicolaas Lansdorp van Publieke Werken ontwierp hem in 1932, zakelijk en expressionistisch: gele baksteen in Noors verband om staal en beton. Zestien stalen spanten overspannen de hele vloer zonder één kolom. Tot eind jaren vijftig kwamen tuinders nog per boot; de havens gingen dicht in 1969 en 1978. Sinds 1998 heet het terrein Food Center Amsterdam.

      Er hangt nu een nieuwe oogst. Sinds het voorjaar van 2025 hangen vijf reusachtige glinsterende trossen druiven van Titia Ex onder het stalen dak; eerst schommelden ze boven de Ten Katemarkt. Overdag vangen ze zon, en 's avonds maken sensoren licht van de bewegingen van bezoekers, zodat de druiven lijken te druppen. Ex haalde het idee uit een gedicht van J.J.L. ten Kate uit 1866; naar hem heet de Ten Katestraat, waar de markt staat. Een ander kunstwerk uit de buurt is voorlopig weg: het dansende paar van het Marcantigebouw ernaast ging in 2023 van de gevel en moet terugkomen op een gebouw in het nieuwe Marktkwartier.

      **Bezoeken:** de hal ligt verstopt midden in het Food Center, een werkende groothandelsmarkt die niet open is voor publiek. Bij publieksevenementen kun je wel naar binnen (in het najaar van 2026 bijvoorbeeld de designmarkt CABINET en de Pure Markt): kijk op de eigen website van de hal en ga dan. Anders kom je niet verder dan de ingang van het Food Center aan de Jan van Galenstraat.

      Let op:
      - de vijftien deuren van de vroegere koelcellen op de overstekende eerste verdieping, elk met een betonnen hijsbalk
      - de brede topgevels aan de korte kanten en de stomp van de gesloopte klokkentoren op de noordoosthoek
      - binnen, tijdens evenementen: het stalen dak zonder kolommen en de originele houten paternosterliften
      - de vijf druiventrossen van Titia Ex, het mooist in het donker
    attributes:
      architect: Nicolaas Lansdorp (Dienst der Publieke Werken)
      original_use: Groothandelsmarkthal
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/526739
      - https://nl.wikipedia.org/wiki/Centrale_Markthallen
      - "https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/5668"

- title: Keith Haring mural (Koelhuis)
  summary: A 12-by-15-metre sea creature Keith Haring sprayed on a market cold store in 1986, hidden behind cladding for thirty years and uncovered in 2018.
  body: |
    In 1986 Keith Haring had his first solo show at the Stedelijk Museum, which then used part of this cold store on the Centrale Markt as a depot. He painted the whole wall: a fabulous fish-tailed beast ridden by a figure with a St Andrew's cross on its chest, signed with the three crosses of the Amsterdam coat of arms. Around 1988 the damp building was clad in aluminium panels and the mural disappeared from view. After a lobby started in 2014 by the artist Mick La Rock, with the Keith Haring Foundation and the Stedelijk, the panels came off on 20 June 2018. The mural was restored in 2020 and is one of very few surviving outdoor works by Haring, and among his largest in Europe.

    The building itself is worth a look. Nicolaas Lansdorp designed the Koelhuis (cold store) in 1933–1935 alongside his market hall, modelled on the wholesale market in Frankfurt. Inside is a monolithic concrete frame of mushroom columns, insulated with cork, some of which survives. The boiler house on the south side has been demolished. Building and mural became a municipal monument in 2021.

    **Seeing it:** the Koelhuis stands inside the Food Center, a working wholesale market whose grounds are closed to the public. You can't walk up to the wall, but it can be seen in part from a car park on the Willem de Zwijgerlaan near the Karel Doormanstraat.

    Look for:
    - the mural, best seen from the car park on the Willem de Zwijgerlaan near the Karel Doormanstraat
    - Haring's signature and the three Amsterdam crosses at the bottom right
    - the symmetrical brick and concrete block
  category: street-art
  lat: 52.380541
  lng: 4.864898
  address: Centrale Groothandelsmarkt 192
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/285572de-07f2-4ca9-828a-dac939669126" }
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Muurschildering_van_Keith_Haring" }
    - { label: Wikipedia (nl) Centrale Markthallen, url: "https://nl.wikipedia.org/wiki/Centrale_Markthallen" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q55372120" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "200954"
    built: 1933–1935 (mural 1986)
    architect: Nicolaas Lansdorp
    listed: 2021
    original_use: Cold store
    artist: Keith Haring
  photos:
    - commons:File:Keith Haring Muurschildering, Amsterdam.jpg
    - commons:File:Keith Haring op de Centrale Markthallen te Amsterdam (1).jpg
  sources:
    - city:200954 (waardestelling)
    - https://nl.wikipedia.org/wiki/Muurschildering_van_Keith_Haring
    - https://nl.wikipedia.org/wiki/Centrale_Markthallen
  nl:
    title: Muurschildering Keith Haring (Koelhuis)
    summary: "Een fabeldier van 12 bij 15 meter dat Keith Haring in 1986 op een koelhuis van de Centrale Markt spoot. Dertig jaar zat het achter gevelplaten verstopt; in 2018 kwam het weer tevoorschijn."
    body: |
      In 1986 had Keith Haring zijn eerste solotentoonstelling in het Stedelijk Museum, dat een deel van dit koelhuis op de Centrale Markt toen als depot gebruikte. Hij beschilderde de hele muur: een fantastisch beest met een vissenstaart, bereden door een figuur met een andreaskruis op de borst, en ondertekend met de drie kruisen uit het Amsterdamse wapen. Omdat het gebouw vochtig was, kreeg het rond 1988 een jas van aluminium platen, en de schildering verdween uit beeld. In 2014 begon kunstenares Mick La Rock een lobby; met steun van de Keith Haring Foundation en het Stedelijk gingen op 20 juni 2018 de platen eraf. In 2020 werd het werk gerestaureerd. Het is een van de weinige buitenwerken van Haring die nog bestaan, en een van zijn grootste in Europa.

      Ook het gebouw zelf is het bekijken waard. Nicolaas Lansdorp ontwierp het Koelhuis in 1933-1935, samen met zijn markthal, naar het voorbeeld van de groothandelsmarkt in Frankfurt. Binnen staat een in één stuk gegoten betonskelet van paddenstoelkolommen, geïsoleerd met kurk, waarvan een deel er nog zit. Het ketelhuis aan de zuidkant is gesloopt. Sinds 2021 zijn gebouw en schildering samen gemeentelijk monument.

      Zo zie je het: het Koelhuis staat op het terrein van het Food Center, een werkende groothandelsmarkt die niet vrij toegankelijk is. Tot aan de muur lopen kan dus niet, maar een deel van de schildering zie je vanaf het parkeerterrein aan de Willem de Zwijgerlaan, bij de Karel Doormanstraat.

      Let op:
      - de schildering, het best te zien vanaf de parkeerplaats aan de Willem de Zwijgerlaan bij de Karel Doormanstraat
      - Harings handtekening en de drie Amsterdamse kruisen rechtsonder
      - het symmetrische blok van baksteen en beton
    attributes:
      architect: Nicolaas Lansdorp
      original_use: Koelhuis
    sources:
      - city:200954 (waardestelling)
      - https://nl.wikipedia.org/wiki/Muurschildering_van_Keith_Haring

- title: De Wittenkade 31-35 (Salm)
  summary: "Three double-width canal-side houses of 1885 by father and son Salm, the father best known for Artis, given central doorways and a mansard roof to look grander than ordinary housing."
  body: |
    G.B. Salm (1831–1897), best known for his buildings at Artis zoo, and his Paris-trained son Abraham Salm designed this row of three identical buildings in 1885. Each follows the usual Amsterdam type of a flat-fronted house with flats stacked over four storeys, but at twice the normal width, with a central entrance and two flats side by side on every floor. That simple change gives them a stately look that stands out on the quay. The design borrows from the Dutch Renaissance: little gate-like doorways, cornices, white plastered bands in the brick, and window arches with stone springers and keystones. The row has had no notable alterations since it was built.

    Look for:
    - the three central doorways, each crowned by a dormer
    - the wider piers and pilasters that mark the boundaries between the three buildings, with square zinc downpipes
    - the strong horizontal lines of the cornices and plastered bands
    - the chimneys on the break of the mansard roof
  category: housing
  lat: 52.384522
  lng: 4.879727
  address: De Wittenkade 31-35
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/976f95a9-14a0-4fff-90af-6c9bcf3e1a1a" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "223003"
    built: "1885"
    architect: G.B. Salm and A. Salm
    listed: 2008
    original_use: Rental flats
  sources:
    - city:223003 (redengevende omschrijving)
  nl:
    title: De Wittenkade 31-35 (Salm)
    summary: "Drie panden uit 1885 van vader en zoon Salm, elk twee keer zo breed als gewoonlijk, met een deur in het midden en een mansardekap. Gewone woningbouw, maar met een voornaam gezicht aan de kade."
    body: |
      Neem het standaard Amsterdamse huis met lijstgevel, maak het twee keer zo breed, zet de deur in het midden en leg op elke verdieping twee woningen naast elkaar. Meer is er niet nodig om gewone woningbouw een deftig uiterlijk te geven. G.B. Salm en zijn zoon Abraham deden het hier in 1885, drie keer naast elkaar.

      Vader Salm (1831–1897) is vooral bekend van zijn gebouwen voor Artis; Abraham had zijn opleiding in Parijs gekregen. Voor deze rij van drie gelijke panden, met vier woonlagen, leenden ze uit de Hollandse renaissance: poortjes rond de voordeuren, kroonlijsten, witgepleisterde banden door het baksteen en raambogen met aanzet- en sluitstenen. Aan de kade valt het geheel op tussen de buren. Sinds de bouw is er weinig aan veranderd.

      Let op:
      - de drie deuren in het midden, elk met een dakkapel erboven
      - de bredere penanten en lisenen op de grens tussen de drie panden, met rechthoekige zinken regenpijpen
      - de sterke horizontale lijnen van de kroonlijsten en gepleisterde banden
      - de schoorstenen op de knik van de mansardekap
    attributes:
      architect: G.B. Salm en A. Salm
      original_use: Huurwoningen
    sources:
      - city:223003 (redengevende omschrijving)

- title: Nassaukerk
  summary: "A Reformed church on the De Wittenkade (1925–1926) whose design won a competition open only to Reformed architects. Four tall gables and a copper tower over a Greek-cross plan."
  body: |
    Building the Nassaukerk allowed the Reformed Church (Gereformeerde Kerk) to close three older churches in the city. The design was chosen in a closed competition open only to architects who were confessing members of the church; Tjeerd Kuipers chaired the jury. Of 53 entries, H.G. Krijgsman of Zeist won with the motto "Vrede" (peace), although the jury thought the little tower could be better. The first stone was laid in July 1925 and the church opened on 18 June 1926 with 924 seats.

    The plan is a rectangle with an inscribed Greek cross and stair porches in the corners, a type with a long Protestant tradition. Four high gables in decorative brickwork mark the arms of the cross, and a copper-clad tower rises over the crossing. The brickwork and window shapes are a pared-down Amsterdam School. A separate building on the De Wittenstraat (service rooms and six homes) and the sexton's house on the quay (six more homes) belong to the complex. The interior is well preserved; the church is still in use.

    Look for:
    - the four gables in decorative brickwork
    - the copper crossing tower with its clock
    - the elliptical-arched windows low in the walls
    - the small forecourt between the quay and the church
  category: religious
  lat: 52.382571
  lng: 4.877458
  address: De Wittenkade 109-111 / De Wittenstraat 114-116
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/748300b6-9938-4e08-972b-de98bc3bc917" }
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Nassaukerk_(Amsterdam)" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "223028"
    built: 1925–1926
    architect: H.G. Krijgsman
    listed: 2008
    original_use: Reformed church with sexton's house and homes
  photos:
    - commons:File:Amsterdam, Nassaukerk Exterior 8719.jpg
    - commons:File:Amsterdam, Nassaukerk Exterior top 8724.jpg
  sources:
