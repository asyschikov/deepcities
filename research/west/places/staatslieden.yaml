    - "https://nl.wikipedia.org/wiki/Filmhuis_Cavia"
  nl:
    title: Kraakliedenbuurt en Hans Kok (Schaepmanstraat)
    summary: "In de jaren tachtig maakten zo'n 800 krakers van de Staatsliedenbuurt de \"Kraakliedenbuurt\". Een ontruiming op Schaepmanstraat 59 in oktober 1985 eindigde met de dood van kraker Hans Kok in een politiecel."
    body: |
      In 1984 joegen krakers burgemeester Ed van Thijn de buurt uit. In november 2026 zette diezelfde gemeente een filmpje online waarin de Staatsliedenbuurt misschien wel een van de meest romantische buurten van Amsterdam heet. Daartussen ligt een flink stuk geschiedenis.

      In de jaren zestig en zeventig trokken arbeidersgezinnen weg, en in de leeggekomen woningen, verspreid over de buurt, trokken krakers. De buurt lag wat uit de loop, dus de overheid liet haar lang links liggen. Zo groeide het aantal krakers tot ongeveer 800, meer dan waar ook in de stad, en kreeg de buurt de bijnaam Kraakliedenbuurt. Omdat ze losse woningen kraakten en geen hele panden, waren ze lastig te ontruimen. Ze bouwden sterke buurtorganisaties op: kraakcafé De Rioolrat als middelpunt, straatkranten, de Staatsradio en StaatsTV, open keukens en de Blauwe Duim, waar je gereedschap kon lenen. De gemeente had de buurt toen al jaren laten verloederen, tot er nauwelijks nog een ambtenaar durfde te komen.

      Op 24 oktober 1985 werd een gekraakte woning in de Schaepmanstraat ontruimd vanwege een vermeende huurschuld. Krakers namen haar meteen weer in. 's Avonds volgde een tweede ontruiming en werden de herbezetters opgepakt, onder wie Hans Kok, 23 jaar, bassist van de punkbands Terreur en Lol en de Ellendelingen. De volgende middag lag hij dood in zijn cel. Volgens drie onderzoeken stierf hij aan alcohol, medicijnen, longontsteking en verwaarlozing samen, en niet aan politiegeweld. Toch volgden brandstichtingen en onrust. Plekken die uit het kraken voortkwamen, zoals Zaal 100 en Filmhuis Cavia, bestaan nog steeds.

      Let op:
      - de Schaepmanstraat, waar in oktober 1985 de ontruimingen waren
      - Filmhuis Cavia in de Van Hallstraat en Zaal 100, allebei ontstaan in de kraakjaren
    sources:
      - https://nl.wikipedia.org/wiki/Hans_Kok_(kraker)
      - https://nl.wikipedia.org/wiki/Staatsliedenbuurt_(Amsterdam)
      - "https://www.dewestkrant.nl/gemeente-houdt-tegenwoordig-van-romantische-staatsliedenbuurt/"

- title: Domela Nieuwenhuis statue
  summary: "A bronze of the socialist pioneer in mid-speech above a chained Prometheus, partly paid for by workers from across the country as an answer to the Van Heutsz monument and unveiled in 1931 before tens of thousands."
  body: |
    When Amsterdam decided to build a monument to General Van Heutsz, the colonial commander, a union of workers at the city's electricity works raised the matter with a syndicalist federation of public employees, and in June 1928 a committee was formed for a statue of Ferdinand Domela Nieuwenhuis (1846–1919), the former preacher who was one of the founders of the Dutch socialist movement and later turned anarchist. The sculptor Johan Polet made a first model the same year, but admirers found it too tame and missing Domela's fighting spirit, and a committee including Berlage and Roland Holst had him make a more active design.

    On 29 August 1931 Domela's widow unveiled the statue before tens of thousands of workers from all over the country, who had helped pay for it. There was not enough room, so some watched from the opposite bank of the Singelgracht. The statue combines two sides of Polet's work: an expressionist basalt Prometheus, who stole fire from the gods for humanity, chained with a torch on the pedestal, and a classical bronze of Domela delivering a fiery speech. A brother of Domela remarked that he would never have worn such a workman's jacket.

    Nearby on the same square grows a tree from the other end of the political spectrum: a lime whose text stone calls it the Koningin Wilhelmina Linde, from the children of the Christian nursery schools, dated 31 August to 30 November 1898.

    Look for:
    - the chained Prometheus with his torch, carved in basalt on the pedestal
    - the plaque at the back with Domela's motto "Recht voor allen" (justice for all)
    - the setting on the quay wall between the Willemsbrug and the Mirakelbrug
    - the Wilhelmina lime and its 1898 text stone, nearby on the Nassauplein
