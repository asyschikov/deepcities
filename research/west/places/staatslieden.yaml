    monument_number: "526739"
    built: 1932–1934
    architect: Nicolaas Lansdorp (Dienst der Publieke Werken)
    listed: 2007
    original_use: Wholesale market hall
  photos:
    - commons:File:Amsterdam Centrale-Markthal 2011 09 11 2.JPG
    - commons:File:Centrale Markthallen interieur.JPG
  sources:
    - rce:526739 (omschrijving)
