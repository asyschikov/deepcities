    - rce:526744 (omschrijving)
  nl:
    title: Voormalige fabriek A.N.E.M.
    summary: "Een elektrotechnische fabriek uit 1919-1920 aan de Haarlemmerweg, met trekjes van de Amsterdamse School, opgetilde hoektorens en banden van gesinterde baksteen. Boven het trappenhuis prijkte ooit de naam van de firma."
    body: |
      De Algemeene Nederlandsche Electriciteitsmaatschappij (A.N.E.M.), voorheen Ruempol & Co, liet deze fabriek in 1919-1920 bouwen naar ontwerp van Th. Groenendijk en Th.J. Lammers. Onder één dak zaten een fabriek, een magazijn, kantoren en twee bovenwoningen. Het pand is het hoekstuk van een rij bedrijfsgebouwen aan de zuidkant van de Haarlemmerweg, langs de Haarlemmervaart, en bepaalt daar het beeld.

      In de basis is het een nuchter, rationeel ontwerp, maar de voorgevel leent van de Amsterdamse School: siermetselwerk, verspringende bogen en een spel met verschillende materialen. De gevel is elf traveeën breed en op beide hoeken over twee raamassen een verdieping hoger. Het rijksregister waardeert het om de motieven van de Amsterdamse School en om zijn plek in de geschiedenis van de stroomvoorziening van de stad.

      Let op:
      - de hoektraveeën die boven de kroonlijst uitsteken, met erkers onder een ver overkragende dakrand
      - de gesinterde baksteen, in vooruitspringende lagen op de eerste verdieping en rond het middelste trappenhuisraam
      - het opzetstuk boven het trappenhuis, waar vroeger de naam van het gebouw stond
      - de twee elliptische bogen op straatniveau: links de ingang, rechts een poort met schampstenen
    attributes:
      architect: Th. Groenendijk en Th.J. Lammers
      original_use: Fabriek met magazijn, kantoren en twee bovenwoningen
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/526744

- title: Graficolor printing-ink factory
  summary: A crisp Nieuwe Bouwen factory of 1938–1939 by Merkelbach and Karsten on the Kostverlorenvaart, with steel windows in long rows and two staff flats on the roof behind a three-quarter-round balcony.
  body: |
    The graphic industry was an important trade in Amsterdam, and the ink maker Gebr. Hartmann's Graficolor N.V. commissioned this factory from Ben Merkelbach and Charles Karsten, who worked in the Nieuwe Bouwen (Dutch modernism) and whom the register calls leading architects of utility buildings. The first stone was laid on Saturday 25 March 1939. Offices and a showroom were on the ground floor with dispatch behind them, the ink was made on the first floor, and on a smaller set-back top floor were two flats for staff. A lower building by the gate held the bicycle shed, transformer room and varnish boilery.

    The building is a composition of cubic volumes under flat, slightly overhanging roofs. The concrete frame is picked out with plaster and paint, and the panels between are filled with yellow brick. The steel windows, delivered by De Vries Robbé, run the full width of each bay. The chimney of the varnish boilery, rebuilt after a fire in 1941, has since disappeared. The national register calls it an outwardly largely intact example of a functionalist factory for the graphic industry.

    Look for:
    - the three-quarter-round balcony in the middle of the roof floor, and the tall lift shaft
    - the round six-pane window by the north entrance, and the memorial stone in the porch
    - loading doors under hoist beams on the east and west sides
  category: industrial
  lat: 52.379017
  lng: 4.872461
  address: Van Hallstraat 290-294
  links:
    - { label: Rijksmonumentenregister (526738), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/526738" }
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/54a90904-1e48-4c1c-9b23-3735bffb93f8" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q17291946" }
  attributes:
    heritage_status: National monument
    monument_number: "526738"
    built: 1938–1939
    architect: B. Merkelbach and Ch.J.F. Karsten
    listed: 2003
    original_use: Printing-ink factory with two staff flats
  photos:
    - commons:File:Voormalige fabriek Graficolor N.V., Amsterdam.JPG
    - commons:File:Van-Hallstraat-290.jpg
  sources:
    - rce:526738 (omschrijving)
  nl:
    title: Voormalige drukinktfabriek Graficolor
    summary: "Drukinkt maken op de eerste verdieping, wonen op het dak: een strakke fabriek van Merkelbach en Karsten uit 1938-1939 aan de Kostverlorenvaart, met lange rijen stalen ramen en twee dienstwoningen achter een driekwartrond balkon."
    body: |
      Op het dak van deze fabriek woonde personeel. Twee dienstwoningen lagen op een kleinere, terugliggende bovenverdieping, met in het midden een balkon in de vorm van driekwart cirkel. Daaronder werd gewerkt: beneden zaten de kantoren en een toonkamer, met de expeditie erachter, en op de eerste verdieping maakte men de inkt. Bij de poort stond een lager gebouwtje voor de fietsen, de transformator en de vernisstokerij.

      Opdrachtgever was inktmaker Gebr. Hartmann's Graficolor N.V. De grafische industrie was voor Amsterdam een belangrijke bedrijfstak. Ben Merkelbach en Charles Karsten, architecten van het Nieuwe Bouwen, kregen de opdracht; het rijksregister rekent hen tot de toonaangevende bouwers van bedrijfspanden. Op zaterdag 25 maart 1939 werd de eerste steen gelegd.

      Het gebouw is opgebouwd uit kubussen onder platte daken die net iets uitsteken. Het betonskelet is aan de buitenkant aangezet met pleister en verf, de vakken ertussen zijn dichtgemetseld met gele baksteen. De stalen ramen, van De Vries Robbé, vullen telkens de hele breedte van een travee. De schoorsteen van de vernisstokerij werd na een brand in 1941 vervangen, maar is inmiddels ook weg. Volgens het rijksregister is dit van buiten een grotendeels gaaf voorbeeld van een functionalistische fabriek voor de grafische sector.

      Let op:
      - het driekwartronde balkon midden op de dakverdieping, en de hoge liftschacht
      - het ronde raam met zes ruitjes bij de noordingang, en de gedenksteen in het portiek
      - de laaddeuren onder hijsbalken aan de oost- en westkant
    attributes:
      original_use: Drukinktfabriek met twee dienstwoningen
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/526738

- title: AWV housing, Schaepmanstraat (Berlage and Van Epen)
  summary: "Three blocks of workers' flats designed by H.P. Berlage and J.C. van Epen in 1913–1914, with rows of bay windows on concrete brackets and roofs of orange pantiles. Large-scale workers' housing in the style of Rationalism."
  body: |
    Block A, the long one on the Van Hallstraat (nos. 501 to 609), turned a hundred in December 2018. A tenant who went looking for everyone who had lived in her flat found that the very first residents of this workers' palace with its yellow-green window frames were, sure enough, all workers: a corn porter, a bricklayer, a tinker and a bookbinder, whose wives worked as maids.

    The Algemeene Woningbouw Vereeniging (AWV), a housing association, had this complex built around the Schaepmanstraat in 1917–1918, to designs drawn in 1913–1914 by H.P. Berlage and J.C. van Epen. It consists of three blocks: block A, a long row on the Van Hallstraat; block B, a U-shaped block with a double kink on the Schaepmanstraat and De Kempenaerstraat; and block C, a Z-shaped block facing it. The national register lists them as an example of large-scale workers' housing from the early 20th century and as a characteristic part of the joint work of Berlage and Van Epen.

    The style is Rationalism: brick in Flemish bond, four storeys under orange pantiles, and façades with a strict rhythm of three-sided bay windows, stair bays and window bays. The dormers follow the same rhythm. At the back, recessed balconies with wooden balustrades are set between the projecting parts.

    Look for:
    - the bay windows resting on concrete brackets carried by narrow piers
    - the gables at the start and end of block B, with a three-light window whose middle light is round-topped
    - five-sided wrap-around bays on the corners
    - the long, unbroken rhythm of block A on the Van Hallstraat
  category: housing
  lat: 52.380179
  lng: 4.870891
  address: Schaepmanstraat 17-95 and 88-170, Van Hallstraat 501-609, De Kempenaerstraat 117-163
  links:
    - { label: Rijksmonumentenregister (526726), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/526726" }
    - { label: Rijksmonumentenregister (526727), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/526727" }
    - { label: Rijksmonumentenregister (526728), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/526728" }
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/feedf1df-e80a-4e82-883a-f8c72398e391" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q17291927" }
  attributes:
    heritage_status: National monument
    monument_number: "526726, 526727, 526728"
    built: 1917–1918
    architect: H.P. Berlage and J.C. van Epen
