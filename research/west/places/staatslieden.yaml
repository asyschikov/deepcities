  nl:
    title: Begraafplaats Vredenhof en Westervilla
    summary: "Johnny Jordaan, Leo Fuld en Cor van Hout liggen hier, op een begraafplaats uit 1897 die 1,80 meter onder NAP ligt. In het witte ontvangstgebouw in chaletstijl van Abraham Salm zit nu café Westervilla."
    body: |
      Wie hier begraven wordt, ligt lager dan de rest van de stad. Het terrein zit op 1,80 meter onder NAP, ruim een meter onder de wijken eromheen.

      Vredenhof ging in 1897 open, op grond die Amsterdam van de gemeente Sloten had geannexeerd. De oude begraafplaats bij de havens lag te ver weg. Leonard Springer, die ook de Nieuwe Ooster ontwierp, legde slingerende paden aan op de oude polderkavels, en die liggen scheef ten opzichte van de Haarlemmerweg. Toen in 1934 de Centrale Markt ernaast verrees, ruilde de begraafplaats een stuk grond in tegen een strook aan de oostkant.

      Het ontvangstgebouw is van Abraham Salm. Met zijn chaletstijl lijkt het meer een schilderachtige villa dan een gebouw voor uitvaarten: voorin twee wachtkamers, achterin de aula, boven de woningen van het personeel en op het schilddak een dakruiter. J.H. van der Veen paste in 1933–1934 de ingangen en de aula aan; uit die jaren stamt ook het glas-in-lood. Sinds 2019 zit er café Westervilla, waar bezoekers van de begraafplaats terechtkunnen.

      Veel Jordaners kregen hier hun laatste plek, net als schippers die aan wal geen vast adres hadden. Ook de zangers Johnny Jordaan en Leo Fuld liggen er, en accordeonist Johnny Meijer en crimineel Cor van Hout.

      Let op:
      - het symmetrische, wit gepleisterde gebouw met zijn dakruiter
      - de glas-in-loodramen uit 1933–1934 in de voormalige aula
      - het lange, smalle voorterrein tussen de Haarlemmerweg en de begraafplaats
    attributes:
      architect: A. Salm; begraafplaats van L.A. Springer
      original_use: Ontvangstgebouw en aula met dienstwoningen
    sources:
      - city:200889 (redengevende omschrijving)
      - https://nl.wikipedia.org/wiki/Begraafplaats_Vredenhof

- title: Maatschappij voor Volkswoningen complex (Hugo de Grootkade)
  summary: A whole block of 1899 workers' flats by Jan van Looy, architect of Metz & Co, with Dutch Renaissance gables, lion-head corbels and a Jugendstil tile panel naming the housing company's head office.
  body: |
    The Maatschappij voor Volkswoningen, a company that built housing for working people, commissioned this block in 1899 from Jan van Looy (1852–1911), who also designed the well-known Metz & Co building on the Keizersgracht. The block fills the space between the Hugo de Grootkade, the Derde Hugo de Grootstraat, the Van Houweningenstraat and the Van Reigersbergenstraat. It has four storeys of flats reached by staircases from the street, and an arched gateway on the Van Houweningenstraat leads to the inner courtyard. The register sees it as an example of the growing concern for decent working-class housing before the Housing Act.

    Van Looy's style bridges exuberant neo-Renaissance and modern design with a hint of Jugendstil. The red-brown brick fronts are enlivened with yellow bands and corner blocks, pilasters, and gabled bays. A pavilion on the Van Reigersbergenstraat, now the community centre De Reiger, was the company's head office. In a recent renovation most windows were replaced and the gables were cut down.

    Look for:
    - the multicoloured Jugendstil tile panel over the entrance of the pavilion, naming the Hoofdgebouw der Maatschappij voor Volkswoningen
    - a second tile panel naming the company
    - carved corbels with lions' heads under the gables
    - the basket-arched gateway on the Van Houweningenstraat
  category: housing
  lat: 52.372617
  lng: 4.870215
  address: Hugo de Grootkade 76-86, Van Reigersbergenstraat, Van Houweningenstraat
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/8287d58c-d6f0-48e2-b09e-f466506582a6" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "200759"
    built: "1899"
    architect: J. van Looy
    listed: 2016
    original_use: Workers' flats and company head office
  photos:
    - commons:File:VanReigersbergenstraat-Hoofdgebouwdermaatschappijvoorvolkswoningen.jpg
  sources:
    - city:200759 (redengevende omschrijving)
  nl:
    title: Complex Maatschappij voor Volkswoningen (Hugo de Grootkade)
    summary: "Een heel bouwblok arbeiderswoningen uit 1899 van Jan van Looy, ook de architect van Metz & Co. Met Hollandse renaissancegevels, kraagstenen met leeuwenkoppen en een Jugendstil-tableau dat het hoofdkantoor van de woningmaatschappij aankondigt."
    body: |
      Boven de deur van buurthuis De Reiger staat het in bonte Jugendstiltegels: hier zat het hoofdgebouw van de Maatschappij voor Volkswoningen. Dat bedrijf bouwde woningen voor arbeiders, en liet in 1899 dit hele blok neerzetten door Jan van Looy (1852-1911), die ook het bekende gebouw van Metz & Co aan de Keizersgracht ontwierp.

      Het blok vult de ruimte tussen de Hugo de Grootkade, de Derde Hugo de Grootstraat, de Van Houweningenstraat en de Van Reigersbergenstraat. Vier woonlagen, met trappenhuizen die rechtstreeks vanaf de straat bereikbaar zijn. Aan de Van Houweningenstraat geeft een poort met een boog toegang tot de binnenplaats. Volgens het monumentenregister laat het zien hoe de zorg om fatsoenlijke arbeiderswoningen groeide, nog voor de Woningwet er was.

      Van Looy staat met één been in de uitbundige neorenaissance en met het andere in de moderne vormgeving, met een vleugje Jugendstil. De roodbruine gevels krijgen leven van gele banden en hoekblokken, pilasters en vooruitspringende delen met een topgevel. Het paviljoen aan de Van Reigersbergenstraat was het hoofdkantoor van de maatschappij. Bij een renovatie van niet zo lang geleden zijn de meeste ramen vervangen en de topgevels ingekort.

      Let op:
      - het veelkleurige Jugendstiltableau boven de ingang van het paviljoen, met 'Hoofdgebouw der Maatschappij voor Volkswoningen'
      - een tweede tegeltableau met de naam van de maatschappij
      - gebeeldhouwde kraagstenen met leeuwenkoppen onder de topgevels
      - de korfboogpoort aan de Van Houweningenstraat
    attributes:
      original_use: Arbeiderswoningen en hoofdgebouw van de maatschappij
    sources:
      - city:200759 (redengevende omschrijving)

- title: Nassaukade 112-115 (palace front)
  summary: A quadruple townhouse of 1881 whose two middle houses step back behind a small forecourt, giving the block the look of a palace with a cour d'honneur. Caryatid brackets and cast-iron columns hold up the balconies.
  body: |
    From 1880 the Nassaukade, facing the old city across the Singelgracht, was built up with tall houses for the well-to-do, with workers' flats and schools behind them. This block of four townhouses, each split into lower and upper flats with its own front steps, was built in 1881 for C. Hellingman, a mid-sized developer and contractor who may also have designed it.

    Fourteen windows wide and symmetrical, the front is rich in detail. The basement and ground floor form a base of stone and plaster, with narrow hand-made brick above. Because the two middle houses step back and the outer ones step forward, with chamfered corners to the forecourt, the block looks like a palace façade with a cour d'honneur, a forecourt of honour. The ornaments come from the catalogues and pattern books that circulated in the building trade, and the register calls it a good example of the richly decorated housing for the upper class of the late 19th century.

    Look for:
    - the stepped front around the shallow forecourt
    - the caryatid brackets, perhaps terracotta or cast iron, under the balconies
    - the cast-iron decorative columns of the balconies
    - separate front steps for every flat
  category: housing
  lat: 52.374849
  lng: 4.875123
  address: Nassaukade 112-115
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/1a824c37-5877-41a2-b710-df6dec35fd27" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "200604, 223008"
    built: "1881"
    architect: C. Hellingman (attributed)
    listed: 2008
    original_use: Upper-class flats
  sources:
    - city:200604, city:223008 (redengevende omschrijving)
  nl:
    title: Nassaukade 112-115 (paleisgevel)
    summary: "Vier herenhuizen uit 1881 die zich als paleis voordoen: de middelste twee wijken terug achter een ondiep voorplein, een cour d'honneur in zakformaat. Onder de balkons consoles met kariatiden en gietijzeren zuiltjes."
    body: |
      Een paleisgevel aan de Singelgracht, maar dan opgedeeld in woningen. De twee middelste panden van dit blok liggen naar achteren, de buitenste schuiven trapsgewijs naar voren en hun hoeken zijn schuin afgesneden. Zo ontstaat een klein voorplein, het soort erehof dat je kent van echte paleizen.

      Vanaf 1880 kwamen langs de Nassaukade, met de oude stad aan de overkant van het water, hoge huizen voor de gegoede burgerij. Daarachter bouwde men etagewoningen voor arbeiders en een paar scholen. Dit blok van vier herenhuizen verrees in 1881 in opdracht van C. Hellingman, een middelgrote ontwikkelaar en aannemer die het mogelijk ook zelf heeft getekend. Elk huis is gesplitst in een beneden- en een bovenwoning, en elke woning heeft een eigen stoep.

      De gevel is veertien ramen breed, symmetrisch en rijk aan details. Souterrain en begane grond vormen samen een sokkel van natuursteen en pleisterwerk; daarboven zit smalle, met de hand gevormde baksteen. Veel ornamenten kwamen uit catalogi en voorbeeldboeken die toen onder bouwers rondgingen. Het gemeentelijke register ziet er een goed voorbeeld in van rijk aangeklede woningbouw voor de welgestelden van de late negentiende eeuw.

      Let op:
      - de getrapte gevel rond het ondiepe voorplein
      - de consoles met kariatiden onder de balkons, misschien van terracotta, misschien van gietijzer
      - de gietijzeren sierzuiltjes van de balkons
      - de eigen stoep voor elke woning
    attributes:
      architect: C. Hellingman (toegeschreven)
      original_use: Herenhuizen met beneden- en bovenwoningen
    sources:
      - city:200604, city:223008 (redengevende omschrijving)

- title: Nassaukade 116-119 (Leguyt)
  summary: "A quadruple townhouse of 1881 by assistant city architect Hendrik Leguyt, a rare private job in his career. Its first stone was laid by the client's six-year-old son, and one porch got an Art Deco makeover around 1920."
  body: |
    Hendrik Leguyt (1840–1907), assistant city architect at Public Works, designed almost only municipal buildings: hospitals and schools. This block of four townhouses for A. Paans is a rather exceptional private commission. The first stone was laid on 15 November 1880 by six-year-old Wilhelmus Johannes Paans, presumably the client's son.

    Each house holds lower and upper flats, reached from a porch with three doors: one down to the basement and two up a flight of steps. The building drawings show that the basement originally held mangle rooms on the street side, with storerooms for provisions and fuel. The twelve-bay front is symmetrical, with a stone basement as its base and plastered pilasters dividing the bays; the houses are mirrored in pairs and the outer two project slightly. Leguyt's designs show a careful shift from historical styles towards newer forms.

    Look for:
    - the porch of number 116, refinished around 1920 in Art Deco style with tiles and doors
    - the first stone of 1880
    - the high stone basement in block bond
  category: housing
  lat: 52.374597
  lng: 4.87498
  address: Nassaukade 116-119
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/d9966bbb-1472-474f-8b2c-4a50c6f847df" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "223009"
    built: 1880–1881
    architect: H. Leguyt
    listed: 2008
    original_use: Townhouses with lower and upper flats
  photos:
    - commons:File:Nassaukade 116 foto 3.JPG
  sources:
    - city:223009 (redengevende omschrijving)
  nl:
    title: Nassaukade 116-119 (Leguyt)
    summary: "Vier herenhuizen onder één kap uit 1881 van Hendrik Leguyt, die als assistent-stadsarchitect bijna alleen voor de gemeente bouwde. De eerste steen legde het zesjarige zoontje van de opdrachtgever; één portiek kreeg rond 1920 een art-decojasje."
    body: |
      Hendrik Leguyt (1840-1907), assistent-stadsarchitect bij Publieke Werken, ontwierp bijna uitsluitend gebouwen voor de gemeente, zoals ziekenhuizen en scholen. Dit blok van vier herenhuizen voor A. Paans is dus een tamelijk uitzonderlijke particuliere klus. De eerste steen werd op 15 november 1880 gelegd door de zesjarige Wilhelmus Johannes Paans, vermoedelijk de zoon van de opdrachtgever.

      Elk huis telt een beneden- en een bovenwoning, die je bereikt via een portiek met drie deuren: één naar het souterrain en twee bovenaan een trap. Uit de bouwtekeningen blijkt dat in het souterrain aan de straatkant oorspronkelijk mangelkamers lagen, met daarachter bergruimte voor proviand en brandstof. De gevel is twaalf vensterassen breed en symmetrisch: het hardstenen souterrain vormt de sokkel, gepleisterde pilasters verdelen de vlakken, de huizen zijn per twee gespiegeld en de buitenste twee springen een tikje naar voren. In het werk van Leguyt zie je hoe hij voorzichtig van de historische stijlen naar nieuwere vormen opschoof.

      Let op:
      - de portiek van nummer 116, rond 1920 in art-decostijl afgewerkt met tegels en deuren
      - de eerste steen van 1880
      - het hoge hardstenen souterrain in blokverband
    attributes:
      original_use: Herenhuizen met beneden- en bovenwoningen
    sources:
      - city:223009 (redengevende omschrijving)

- title: Nassaukade 123 and the school gateway
  summary: A sober 1910 shop and house by Tjeerd Kuipers with a wide gateway and double turnstile that still leads to a school hidden behind it.
  body: |
    Tjeerd Kuipers (1857–1942), best known for his Reformed churches, designed this shop with flats above in 1910 for a plot that had long stood mostly empty. Behind it stood an older two-storey house from before the city arrived, possibly already a school. Kuipers built a wide passage with a double turnstile into his design, and the Dr. Rijk Kramerschool on the back plot is still reached through it.

    The four-storey building is asymmetrical: a shopfront with its own porch on the north side, a central porch and staircase to the flats, and the broad passage on the left. Its brown brick front is restrained, in line with the soberer direction Kuipers' work took in these years.

    Look for:
    - the wide gateway with its double turnstile, the entrance to the school behind
    - the asymmetrical shopfront with a corner porch
  category: schools
  lat: 52.373877
  lng: 4.874812
  address: Nassaukade 123
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/16d6d398-d6c0-403a-9c70-45e0646647d6" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "223015"
    built: "1910"
    architect: Tj. Kuipers
    listed: 2008
    original_use: Shop with flats and school entrance
  sources:
    - city:223015 (redengevende omschrijving)
  nl:
    title: Nassaukade 123 en de schoolpoort
    summary: "Een sober winkel- en woonhuis uit 1910 van Tjeerd Kuipers, met een brede poort en een dubbel draaihek waardoor je nog altijd bij de school erachter komt."
    body: |
      Wie naar school moet, gaat hier door een winkelpand. Tjeerd Kuipers (1857-1942), vooral bekend van zijn gereformeerde kerken, ontwierp in 1910 een winkel met bovenwoningen op een kavel die al lang grotendeels leeg lag. Achterop stond nog een huis van twee lagen uit de tijd dat hier nog geen stad was, en daar zat misschien toen al een school in. Kuipers nam in zijn ontwerp een brede doorgang op, met een dubbel draaihek. De Dr. Rijk Kramerschool op het achterterrein bereik je nog steeds via die doorgang.

      Het pand telt vier bouwlagen en is niet symmetrisch: rechts, aan de noordkant, de winkelpui met een eigen portiek, in het midden een portiek met trap naar de woningen, links de brede doorgang. De gevel van bruine baksteen is ingetogen, zoals Kuipers in die jaren steeds soberder ging bouwen.

      Let op:
      - de brede poort met het dubbele draaihek, de ingang naar de school erachter
      - de asymmetrische winkelpui met een hoekportiek
    attributes:
      original_use: Winkel/woonhuis met schooltoegang
    sources:
      - city:223015 (redengevende omschrijving)

- title: Widows' homes, Tweede Hugo de Grootstraat
  summary: Two facing rows of 1880s homes for widows, built by a Protestant widows' and orphans' fund, one with a little nursery school. They form a gateway into the 19th-century district from the city.
  body: |
    Before the state provided for widows, orphans and the sick, religious and other charitable bodies did. The Protestantsch Weduwen- en Weezenfonds (Protestant widows' and orphans' fund) built these homes for widows on both sides of the street, just over the bridge from the Bloemgracht. Two stones on number 2 name the fund and record that J.H. Cordes and M.H. van Doorn laid the first stone on 23 August 1880. The designer is not known, although the specification drawings survive.

    Each side is a row of three-storey sections separated by plastered pilasters. On the north side, the former bewaarschool (nursery school), probably for orphans, is only two storeys high and differently detailed, so it catches the eye. Its ground floor was one large classroom with a room for the headmistress and a kitchen behind, with a meeting room and a caretaker's room upstairs. Around 1925 the ground-floor homes became shops.

    Look for:
    - the two memorial stones on number 2, naming the fund and the first-stone laying
    - the lower former nursery school with its different detailing
    - the matching rows on both sides of the street, like a gateway
  category: housing
  lat: 52.374083
  lng: 4.874648
  address: Tweede Hugo de Grootstraat 2-18
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/b7d4e1c2-b1c9-4fe2-8472-4a335c41b79d" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "223038"
    built: "1880"
    listed: 2008
    original_use: Widows' homes with a nursery school
  photos:
    - commons:File:Tweede Hugo de Grootstraat 2-18.jpg
    - commons:File:Gedenksteen Tweede Hugo de Grootstraat, woningen.jpg
  sources:
    - city:223038 (redengevende omschrijving)
  nl:
    title: Weduwenwoningen Tweede Hugo de Grootstraat
    summary: "Twee rijen weduwenhuizen uit de jaren 1880, tegenover elkaar, gebouwd door een protestants fonds voor weduwen en wezen; in één rij zat een bewaarschooltje. Samen vormen ze de toegangspoort van de 19de-eeuwse wijk."
    body: |
      Wie vanaf de Bloemgracht de brug over gaat, komt tussen twee bijna gelijke gevelrijen door, als door een poort. Achter die gevels woonden weduwen. Het Protestantsch Weduwen- en Weezenfonds liet ze bouwen aan beide kanten van de straat, in een tijd dat de overheid nog niet voor weduwen, wezen en zieken zorgde en kerkelijke en andere liefdadige instellingen dat gat vulden. Op nummer 2 vertellen twee gevelstenen wie de opdrachtgever was en dat J.H. Cordes en M.H. van Doorn op 23 augustus 1880 de eerste steen legden. Wie het ontwerp maakte, weet niemand, al zijn de bestektekeningen er nog.

      Iedere rij bestaat uit bouwdelen van drie lagen, telkens gescheiden door gepleisterde lisenen. Eén stuk aan de noordkant springt eruit: de vroegere bewaarschool, vermoedelijk voor weeskinderen, is maar twee lagen hoog en anders gedetailleerd. Beneden lag één groot lokaal, met daarachter een keuken en de kamer van de directrice; boven waren onder meer een vergaderkamer en een kamer voor de conciërge. Rond 1925 werden de woningen op de begane grond winkels.

      Let op:
      - de twee gevelstenen op nummer 2, met het fonds en de eerste steenlegging
      - het lagere vroegere schooltje met zijn afwijkende details
      - de gelijke rijen aan weerszijden van de straat, als een poort
    attributes:
      original_use: Weduwenwoningen met bewaarschool
    sources:
      - city:223038 (redengevende omschrijving)

- title: Nassaukade 17-18 (De Distel tiles)
  summary: A stately double townhouse of 1881 whose porch at number 17 is lined with Jugendstil tile panels of flamingos and geese from the Amsterdam pottery De Distel.
  body: |
    J. Engelfriet jr., probably a contractor-architect who also built houses on the Eerste Nassaustraat, designed and developed this double townhouse in 1881. The two houses are mirror images, each with a central projecting bay that starts above a ground floor treated as a base, under a heavy stone ledge. Plastered ornaments and iron balcony railings give the sober brick fronts an air of distinction, in the eclectic manner of around 1880. The entrances sit at the sides, as in a classic townhouse.

    The porches were modernised later: at number 17 around 1900–1910, at number 18 around 1925. The porch walls of number 17 are lined with multicoloured tiled dados and two animal panels from De Distel, a leading Amsterdam art-pottery works that took over the Amstelhoek factory in 1910 and was itself absorbed by Goedewaagen in 1923. The register values them as a well-preserved example of its Jugendstil ceramics.

    Look for:
    - the tile panels in the porch of number 17: flamingos on one side, a pair of geese on the other
    - the iron decorative balcony railings
    - the cellar lights in the stone plinth under the ground-floor windows
  category: housing
  lat: 52.383528
  lng: 4.880561
  address: Nassaukade 17-18
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/fce37483-6a65-44fe-ba9a-d41da70a6dec" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "223004, 200603"
    built: 1881 (porches c. 1900–1925)
    architect: J. Engelfriet jr.
    listed: 2008
    original_use: Double townhouse
  photos:
    - commons:File:2020 Amsterdam, Nassaukade 17 (5).jpg
  sources:
    - city:223004, city:200603 (redengevende omschrijving)
  nl:
    title: Nassaukade 17-18 (tegeltableaus De Distel)
    summary: "Een statig dubbel herenhuis uit 1881, met in de portiek van nummer 17 Jugendstil-tegeltableaus van flamingo's en ganzen, gebakken door de Amsterdamse plateelbakkerij De Distel."
    body: |
      J. Engelfriet jr., waarschijnlijk een aannemer die ook zelf ontwierp en die ook huizen aan de Eerste Nassaustraat neerzette, tekende en bouwde dit dubbele herenhuis in 1881 voor eigen rekening. De twee huizen zijn elkaars spiegelbeeld. Elk heeft een middenrisaliet dat pas boven de begane grond begint; die benedenverdieping, afgedekt met een zware hardstenen waterlijst, dient als sokkel. Pleisterwerk en ijzeren balkonhekken geven de verder sobere bakstenen gevels iets deftigs, in de eclectische trant van rond 1880. De voordeuren zitten opzij, zoals bij een klassiek herenhuis hoort.

      De portieken zijn later bijgewerkt: die van nummer 17 rond 1900-1910, die van nummer 18 rond 1925. In nummer 17 zijn de wanden bekleed met kleurige tegellambriseringen en twee dierentableaus van De Distel. Dat was een toonaangevende Amsterdamse kunstaardewerkfabriek, die in 1910 de fabriek Amstelhoek inlijfde en in 1923 zelf werd opgeslokt door Goedewaagen. Volgens het monumentenregister is de betegeling een goed en gaaf bewaard voorbeeld van hun Jugendstil-keramiek.

      Let op:
      - de tegeltableaus in de portiek van nummer 17: aan de ene kant flamingo's, aan de andere een paar ganzen
      - de ijzeren sierhekken van de balkons
      - de kelderlichten in de hardstenen plint onder de ramen van de begane grond
    attributes:
      original_use: Dubbel herenhuis
    sources:
      - city:223004, city:200603 (redengevende omschrijving)

- title: Former school, Rombout Hogerbeetsstraat 109
  summary: A free "first-class" primary school of 1902 by Public Works, with fifteen classrooms, a gym and a big playroom for toddlers, from the years before Amsterdam built separate nursery schools.
  body: |
    Public Works designed this school in 1902 as a lagere school der eerste klasse, a free primary school; schools of the higher classes charged fees, and until 1880 the first class was simply called the armenschool, the school for the poor. It had fifteen classrooms, a gym and a 13-metre playroom for toddlers. Until about 1909 the city did not build separate nursery schools and housed the youngest children in ordinary primary schools like this one.

    It is a corridor school, with classrooms on one side of the corridor, most facing the street to the west and a few at the back facing east over the covered and open playgrounds. The front block of three storeys has a hipped roof; the back wings are flat-roofed. The entrance sits off-centre at the north end of the façade.

    Look for:
    - the off-centre entrance at the north end of the front
    - the long row of classroom windows facing the street
    - the hipped roof over the front block
  category: schools
  lat: 52.376007
  lng: 4.872658
  address: Rombout Hogerbeetsstraat 109
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/cbb830a4-71b3-4c33-b0db-6111ce23fc94" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "200766"
    built: "1902"
    architect: Dienst der Publieke Werken
    listed: 2016
    original_use: Free primary school with toddlers' playroom
  sources:
    - city:200766 (redengevende omschrijving)
  nl:
    title: Voormalige school Rombout Hogerbeetsstraat 109
    summary: "Een gratis lagere school \"der eerste klasse\" uit 1902 van Publieke Werken, met vijftien lokalen, een gymzaal en een grote speelzaal voor kleuters, uit de jaren dat de stad nog geen aparte kleuterscholen bouwde."
    body: |
      Tot 1880 heette dit soort school gewoon de armenschool. Daarna werd het netjes de lagere school der eerste klasse: gratis, terwijl je op scholen van een hogere klasse schoolgeld betaalde. Publieke Werken tekende deze in 1902, met vijftien lokalen, een gymnastieklokaal en een speelzaal van dertien meter voor de kleuters. Aparte kleuterscholen bouwde Amsterdam pas vanaf ongeveer 1909; tot die tijd zaten de jongsten gewoon in lagere scholen als deze.

      Het is een corridorschool: de lokalen liggen aan één kant van de gang. De meeste kijken naar het westen, de straat op; een paar achterin kijken naar het oosten, over de overdekte en de open speelplaats. Het voorste deel telt drie bouwlagen onder een schilddak, de vleugels erachter hebben platte daken. De ingang zit niet in het midden maar aan de noordkant van de gevel.

      Let op:
      - de ingang uit het midden, aan de noordkant van de gevel
      - de lange reeks lokaalramen aan de straat
      - het schilddak boven het voorste bouwdeel
    attributes:
      architect: Dienst der Publieke Werken
      original_use: Openbare lagere school der eerste klasse met kleuterspeelzaal
    sources:
      - city:200766 (redengevende omschrijving)

- title: De Arbeiderswoning, Van Beuningenplein (De Bazel)
  summary: 228 workers' homes of 1914–1918 by K.P.C. de Bazel, with notched corners and gateways to schools hidden in the courtyards. The tenants mocked its plainness as a "Lutheran old men's home".
  body: |
    The architect K.P.C. de Bazel, better known for the head office of the Nederlandsche Handel-Maatschappij, designed this complex for the housing association Vereeniging De Arbeiderswoning. It was built between 1914 and 1918, and a few years later the municipal housing department bought it. The 228 homes fill one and a half closed blocks. In the courtyard of the northern block stand two schools; in the southern one, a former bath and wash house and a parsonage. De Bazel gave the façades on the Van Beuningenplein, De Kempenaerstraat and Van Hallstraat a gateway in the middle so they could be reached.

    The slightly projecting corners are notched, a simple device that gives the street a landmark and improves the corner flats. Every stair door gives access to eight small homes of three or four rooms. Not everyone was grateful: De Bazel's restraint contrasted strongly with the far more exuberant interiors the tenants wanted, and they called it a "Luthers oudemannenhuis" (Lutheran old men's home).

    One of the gateways on the Van Beuningenplein once led to Ons Huis, a club and community house that settled behind it in 1919. Neighbourhood children went there for music, theatre, dance, Sunday-afternoon films and summer camps, until it disappeared during the big renovation after 1984.

    Look for:
    - the notched corners of the blocks
    - the central gateways to the courtyards and the buildings inside
    - De Bazel's bands of decorative brickwork
    - the gateway on the Van Beuningenplein that led to Ons Huis
  category: housing
  lat: 52.382056
  lng: 4.870605
  address: Van Beuningenplein 2-131, Van Hallstraat 12-162
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/d3d93264-8d4f-4b20-813f-09c97af6572e" }
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Van_Beuningenplein" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "200763"
    built: 1914–1918
    architect: K.P.C. de Bazel
    listed: 2016
    original_use: Workers' housing (Vereeniging De Arbeiderswoning)
  photos:
    - commons:File:Amsterdam - Arbeiderswoning Beuningenplein.jpg
    - commons:File:Van Beuningenplein.jpg
  sources:
    - city:200763 (redengevende omschrijving)
    - "https://geheugenvanwest.amsterdam/page/13735 (photo and comments: entrance to the community house Ons Huis, vereniging voor club- en buurthuiswerk, on the Van Beuningenplein from 1919, gone after 1984 with the renovation; activities music, theatre, dance, summer camps, Sunday film). The scout's 'Turks Fruit location' rests only on reader memories that disagree about which gate (left or right), so left out. Scout gave Van Beuningenplein 103 for the gate, not confirmed."
  nl:
    title: De Arbeiderswoning, Van Beuningenplein (De Bazel)
    summary: "228 arbeiderswoningen uit 1914-1918 van K.P.C. de Bazel, met ingesneden hoeken en poorten naar scholen die verstopt liggen op de binnenterreinen. De bewoners vonden het zo kaal dat ze het een \"Luthers oudemannenhuis\" noemden."
    body: |
      Dank je wel zeiden de eerste bewoners niet. Zij wilden het thuis een stuk uitbundiger dan De Bazel met zijn soberheid voor ogen had, en dus spraken ze smalend van een "Luthers oudemannenhuis".

      K.P.C. de Bazel, vooral bekend van het hoofdkantoor van de Nederlandsche Handel-Maatschappij, ontwierp dit complex voor de Vereeniging De Arbeiderswoning. Het werd tussen 1914 en 1918 gebouwd; een paar jaar later nam de Gemeentelijke Woningdienst het over. De 228 woningen vullen anderhalf gesloten bouwblok. Op het binnenterrein van het noordelijke blok staan twee scholen, op dat van het zuidelijke een voormalig badhuis met wasserij en een pastorie. Om daar te kunnen komen, kregen de gevels aan het Van Beuningenplein, de De Kempenaerstraat en de Van Hallstraat elk een poort in het midden.

      De hoeken springen iets naar voren en zijn ingesneden. Zo'n eenvoudige ingreep geeft de straat een herkenningspunt en levert betere hoekwoningen op. Achter elke voordeur aan de straat zit een trap naar acht kleine woningen van drie of vier kamers.

      Door een van de poorten aan het Van Beuningenplein liep je vroeger naar Ons Huis, een club- en buurthuis dat zich er in 1919 vestigde. Kinderen uit de buurt kwamen er voor muziek, toneel, dans, de film op zondagmiddag en zomerkampen. Bij de grote renovatie na 1984 verdween het.

      Let op:
      - de ingesneden hoeken van de blokken
      - de poorten in het midden naar de binnenterreinen en de gebouwen daar
      - de banden siermetselwerk van De Bazel
      - de poort aan het Van Beuningenplein die naar Ons Huis leidde
    attributes:
      original_use: Arbeiderswoningen (Vereeniging De Arbeiderswoning)
    sources:
      - city:200763 (redengevende omschrijving)
      - "https://geheugenvanwest.amsterdam/page/13735"

- title: Huis Wartburg (Lutheran parish hall)
  summary: "A Lutheran parish hall, designed in 1911, with flats above, its doors framed by a stone relief of Wartburg castle and the head of Luther."
  body: |
    As the city grew in the late 19th century, more and more Lutherans lived outside the old centre, while the congregation's two big churches stood on the Singel. To keep them connected, the Evangelisch-Luthersche Wijkvereeniging, a neighbourhood association, had this parish hall built to a 1911 design by Johannes Pelser. On the ground floor were a draught lobby and vestibule, a catechism room at the front and a hall across the full width at the back, with three flats on the floors above. Much of the original layout survives.

    The narrow five-storey front has a stone door frame in a sober classicist style, with uprights beside the doors rising into a triangular crown. At its peak is a relief of the head of Luther, with a cross on top. A sandstone panel in the crown shows Wartburg castle, where Luther hid after he was outlawed in 1521, with the name "Het huis Wartburg" carved below.

    Look for:
    - the relief of Wartburg castle and the carved name above the doors
    - Luther's head and the cross at the top of the door frame
    - the text LUTHERSCH WIJKGEBOUW
    - a small marble plaque with a Bible verse from Timothy
  category: religious
  lat: 52.382188
  lng: 4.872057
  address: Van Boetzelaerstraat 49-51
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/3109ed07-32da-4094-8e40-3c64430155c3" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "200770"
    built: 1911–1912
    architect: Johannes Pelser
    listed: 2016
    original_use: Lutheran parish hall with flats
  sources:
    - city:200770 (redengevende omschrijving)
  nl:
    title: Huis Wartburg (Luthers wijkgebouw)
    summary: "Een luthers wijkgebouw met woningen erboven, ontworpen in 1911. Boven de deur kijkt Luther zelf naar buiten, met daaronder kasteel Wartburg in zandsteen."
    body: |
      Wie twijfelt over welke kerk hier de dienst uitmaakte, hoeft alleen omhoog te kijken. In de top van de stenen deuromlijsting zit het hoofd van Maarten Luther in reliëf, met een kruis erbovenop. Daaronder toont een zandstenen plaat kasteel Wartburg, waar Luther onderdook nadat hij in 1521 vogelvrij was verklaard, en eronder is de naam 'Het huis Wartburg' uitgehakt.

      De aanleiding was de groei van de stad aan het eind van de negentiende eeuw. Steeds meer lutheranen woonden buiten de binnenstad, terwijl de twee grote kerken van hun gemeente aan het Singel stonden. Om die gelovigen bij de kerk te houden, liet de Evangelisch-Luthersche Wijkvereeniging dit wijkgebouw neerzetten, naar een ontwerp uit 1911 van Johannes Pelser. Beneden kwamen een tochtportaal en vestibule, een catechisatielokaal aan de straatkant en achterin een zaal over de volle breedte. Op de verdiepingen kwamen drie woningen. Van die indeling is nog veel over.

      De smalle gevel telt vijf bouwlagen. De omlijsting rond de deuren is sober classicistisch: twee stijlen naast de ingang lopen uit in een driehoekige bekroning, waarin Luther en het kasteel hun plek hebben.

      Let op:
      - het reliëf van kasteel Wartburg en de ingehakte naam boven de deuren
      - het hoofd van Luther en het kruis in de top van de omlijsting
      - de tekst LUTHERSCH WIJKGEBOUW
      - een klein marmeren plaatje met een bijbeltekst uit Timotheüs
    attributes:
      original_use: Luthers wijkgebouw met woningen
    sources:
      - city:200770 (redengevende omschrijving)

- title: Van Bossestraat 8-54
  summary: "A 1916 row of workers' flats dressed up as a stately institution, with a central pavilion, wings and corner pavilions. In May 1943 an RAF bomber with a New Zealand crew crashed into it and seven civilians died; the lost roof turret came back in 2005."
  body: |
    The missing turret was not the work of a stray bomb. On 3 May 1943 twelve Ventura bombers of 487 Squadron, a New Zealand unit of the RAF, set out to hit the power station on the Hemweg; one turned back early, German fighters were waiting, and only one of the others made it home. Ten were shot down, and one of them came down on this block. Three of its four crew were killed and the fourth was taken prisoner, and seven civilians died; in one family only a six-year-old girl survived. A neighbour, a boy of seven then, remembered the little turret lying on its side. It was put back during a renovation in 2005, and in 2006 the New Zealand ambassador unveiled a plaque for the airmen.

    R.A.M. de Heer Kloots designed, developed and built this complex himself in 1916. Behind the front, the flats follow the traditional type of the 19th-century ring, each with its own front door, in pairs in shallow porches. But the street side was composed as one great symmetrical volume: a central "main pavilion" with "wings" and "corner pavilions" marked by slightly higher roofs and projecting fronts. The result looks more like a large institution than a block of flats.

    The prominent centre stands exactly on the axis of the short Rochussenstraat, an explicit part of the design. According to the register, De Heer Kloots was after the same thing as De Bazel nearby: individual homes subordinated to one unified whole.

    Look for:
    - the view of the central pavilion and its roof turret straight down the Rochussenstraat
    - the slightly higher roofs and projecting fronts of the pavilions
    - paired front doors in shallow porches
    - the 2006 plaque for the crew of the crashed Ventura
