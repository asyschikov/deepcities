  nl:
    title: Voormalig onderstation Westerpark (Volta)
    summary: "Een onderstation uit 1915 op een eigen eilandje tussen spoor, wegen en water, met een ingenieurswoning die zich voordoet als landhuis. In 1994 werden de transformatorhallen jongerencentrum Volta."
    body: |
      Onderstation B van het gemeentelijk elektriciteitsbedrijf verrees in 1915 naar ontwerp van Publieke Werken. Hier werd de draaistroom van 10.000 volt uit de stedelijke centrale omgezet: in gelijkstroom voor het tramnet, in 3000 volt voor industriële grootverbruikers en in 220 volt voor bedrijven en huishoudens. Omdat een storing meteen verholpen moest worden, woonde er een ingenieur naast de deur, in een groot huis in de stijl van een buitenplaats, met remises voor rijtuigen op de begane grond. In 1922 maakten die plaats voor een dienstwoning.

      Het station groeide mee met het net. In 1926 perste Albert Boeken, toen in dienst van Publieke Werken, er een smalle bakstenen hal tussen voor drie cascade-omvormers uit een gesloopt transformatorhuisje bij het Leidsebosje. In 1928 en 1939 kwamen er nog stukken bij. Sinds 1994 zitten in de transformatorhallen het buurthuis en jongerencentrum Volta; de woningen werden in 2012-2013 kantoren. Volgens het register geeft het complex een zeldzaam compleet beeld van hoe snel de gemeentelijke stroomvoorziening groeide.

      Let op:
      - de ingenieurswoning met haar verspringende gevels richting Singelgracht
      - banden van blauw geglazuurde steen en dambordmozaïek in baksteen op het schakelgebouw uit 1915
      - de gebogen gevel van het gelijkrichtersgebouw, die met de vorm van het perceel meedraait
    attributes:
      architect: Dienst der Publieke Werken; uitbreiding 1926 Albert Boeken
      original_use: Onderstation met ingenieurs- en dienstwoning
    sources:
    - Gemeentelijk monumentenregister 200771
- title: Westergasfabriek
  summary: Amsterdam's biggest coal-gas works, built in 1883–1885 for a British company and dressed up like a Dutch Renaissance town. The gas stopped in 1967; the poisoned site became a cultural park.
  body: |
    The Westergasfabriek (western gasworks) was built from 1883 along the Haarlemmertrekvaart for the British Imperial Continental Gas Association. Coal arrived by boat and by a railway siding, and the gas lit the city's streets and later its kitchens. It was the largest coal-gas plant in the Netherlands. The architect Isaac Gosschalk gave even the purifier halls and meter houses round-arched windows and decorative brickwork in a rich Dutch neo-Renaissance; the city later added a water-gas plant, a second regulator house and an ammonia boiler house between 1901 and 1905.

    Gas production stopped in 1967 and left a soil full of tar and cyanide. The city bus and energy companies used the site for storage, some buildings (including the water tower) were demolished, and the old office became the Westerpark district office in 1990. Around 2000 the ground was capped and landscaped, and the restored halls now house a cinema (Het Ketelhuis), event spaces, restaurants and TV studios. Seventeen buildings are protected together as one complex.

    Look for:
    - the office building on the Haarlemmerweg with "ANNO 1885" and "ICGA" in its gables
    - the long, mirrored purifier building (Zuiveringshal) along the canal
    - the twin foremen's houses in red brick with white plaster bands, in the middle of the site
    - the "ladder house" and former water-gas plant added in 1904
