  nl:
    title: Volksbadhuis Polanenstraat
    summary: "Een volksbadhuis uit 1916, in 1919 uitgebreid met een kinderbad, gebouwd toen de meeste arbeiderswoningen nog geen badkamer hadden. Een vroeg gebouw waarin Publieke Werken naar de Amsterdamse School lonkte."
    body: |
      De meeste mensen hier hadden geen badkamer. Rondom verrezen net de eerste grote woningbouwcomplexen die met geld uit de Woningwet tot stand kwamen, zoals de blokken van De Klerk en het Zaanhof, maar ook in die nieuwe woningen zat meestal geen bad. Dus bouwde de Dienst der Publieke Werken op de hoek van de Zaanstraat en de Polanenstraat een volksbadhuis. In 1916 ging het open, in 1919 kwam er een apart kinderbad bij. Volgens het gemeentelijke register markeert het gebouw een fase in de geschiedenis van de volksgezondheid: het kwam er uit zorg om de hygiëne en sloot toen betere woningen het overbodig maakten.

      Boven een plint van donkere, ruwe baksteen springen de vlakke bakstenen gevels hier en daar een stukje voor- of achteruit. Er zitten ramen in allerlei maten in, het metselwerk wisselt, en verder zijn er ingangen in natuursteen, blokjes van granietbeton en smeedijzeren details. Het register ziet er een vroeg voorbeeld in van hoe Publieke Werken de Amsterdamse School oppikte, al betreurt het dat veel oorspronkelijke deuren en ramen zijn vervangen.

      Let op:
      - de donkere plint van ruwe baksteen die rondom loopt
      - de natuurstenen ingangen en het smeedwerk
      - de ramen in allerlei maten, zoals de rij van tien bovenramen aan de Zaanstraat waarachter de douchecellen lagen
    attributes:
      architect: Dienst der Publieke Werken
      original_use: Volksbadhuis met kinderbadinrichting
    sources:
    - Gemeentelijk monumentenregister 200765
- title: Zaanhof
  summary: A hidden green courtyard ringed by low white-gabled houses and towered gateways, built in 1916–1919 for the socialist association Het Westen. Look for the red rooster of rising socialism on a tile.
  body: |
    Herman Walenkamp designed the Zaanhof in 1916 for the socialist housing association Het Westen. Instead of the usual long, deep blocks, he set a double ring of housing around a large inner garden: low two-storey houses with attics around the green, taller blocks on the outside. Gateway buildings with towers and bay windows lead into the court, and above the porches runs a rhythm of white-plastered gables, always in pairs.

    The west gate has decorated stone columns and tile panels reading "Woningbouwvereniging Het Westen anno 1919". Two tile panels from the Amsterdam pottery De Distel carry a message: at Zaanhof 57 a red rooster and a rising sun, a reference to rising socialism; at Zaanhof 62 two white birds and a setting sun, a reference to the First World War. The small west block, which differs from the rest, is recorded as a 1934 design by M. Oesterman. Since 1979 a brightly coloured *Woezel*, a climbing and water toy by Marijke Ouëndag-van Lis, has stood in the court.

    A stone in the court records that while all the schoolchildren of the Spaarndammerbuurt sang national songs, the Dutch flag was hoisted here again, with the dates 10 May 1940 and 5 May 1945. It was unveiled on 31 August 1945, and every year on 4 May a commemoration is held here at eight in the evening.

    Look for:
    - the towered gateways with their tile name plaques
    - the De Distel tiles at Zaanhof 57 and 62
    - the paired white gables over the porches around the garden
    - the polyester Woezel in the court
    - the 1945 flag memorial stone, the focus of the 4 May commemoration
  category: housing
