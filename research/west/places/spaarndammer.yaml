  nl:
    title: Blokken van De Klerk, Spaarndammerplantsoen
    summary: "Twee bakstenen burchten tegenover elkaar aan het Spaarndammerplantsoen: woonblokken van Michel de Klerk uit 1913 en 1914-1918, ontworpen vóór Het Schip."
    body: |
      Voordat Michel de Klerk Het Schip ontwierp, tekende hij aan hetzelfde plantsoen al twee andere blokken met arbeiderswoningen.

      Het eerste, uit 1913, staat aan de even kant, bij de Oostzaanstraat en de Krommeniestraat, gebouwd voor K. Hille. Het register ziet een gesloten burcht met tamelijk rustige architectuur. De voorgevel is symmetrisch, met vier ingangspartijen die tot boven doorlopen en eindigen in een paraboolvorm. In het midden is de bovenste verdieping met hout bekleed, en de bovenzone van de buitengevels draagt terracottategels.

      Het blok aan de overkant, tussen de Zaanstraat en de Wormerveerstraat, volgde daarna (het register zegt 1914, Wikipedia 1918). Ook dit begon als opdracht van Hille, maar woningbouwvereniging Eigen Haard nam het tijdens het ontwerpen over. Het register noemt het rode en gele metselwerk 'hier en daar duidelijk onconstructief' toegepast. De ingangspartijen zijn tot het dak met terracotta bekleed, er zijn ronde uitbouwen, en de daken trekken zich weinig aan van de constructie, zeker op de hoek van de Wormerveerstraat. Samen met Het Schip zijn dit de drie blokken die De Klerk aan dit plantsoen ontwierp.

      In het plantsoen tussen de twee blokken staat een bronzen haan van Peer Veneman, op een opvallende sokkel van baksteen. Het beeld mengt geometrische en organische vormen; volgens het kunstregister van de stad past het juist daardoor zo goed tussen de Amsterdamse School.

      Let op:
      - de paraboolvormige toppen van de ingangspartijen aan het blok bij de Oostzaanstraat
      - de met terracotta beklede ronde uitbouwen op Spaarndammerplantsoen 31 en Zaanstraat 49
      - de onrustige daken op de hoek met de Wormerveerstraat
      - de oorspronkelijke voordeuren met beplanking
      - de bronzen haan van Veneman op zijn bakstenen sokkel in het plantsoen
    attributes:
      original_use: Arbeiderswoningen
    sources:
    - https://nl.wikipedia.org/wiki/Spaarndammerplantsoen
    - Rijksmonumentenregister 5500 en 5499
    - "https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/2601"
- title: Het Schip
  summary: "Michel de Klerk's brick \"ship\" of workers' flats with its own post office, and its own school, crowned by a little tower on the low entrance wing. Now the Amsterdam School museum."
  body: |
    The third and most striking of Michel de Klerk's housing blocks around the Spaarndammerplantsoen was built in 1917–1920 for the socialist housing association Eigen Haard (Our Own Hearth) around a roughly triangular courtyard. Workers got homes with real rooms, light and air, and the block had its own post office, something the poor had previously had little access to. A primary school was part of the block too, and in the tip of the courtyard stands a small meeting hall, finished in 1920 and tied to the block by two low walls.

    The national register praises it as one of the "most irrational high points" of the Amsterdam School: a little tower on the low entrance wing, barrel-shaped corner bays and superb bright-red brickwork. The block's shape earned it its nickname. Museum Het Schip has occupied the old post office since 2001 and shows the restored counter hall, a furnished workers' flat and exhibitions; tours also take you into the courtyard.

    Look for:
    - the tower above the entrance wing on the Hembrugstraat side
    - the former post office on the corner of the Zaanstraat and the Spaarndammerplantsoen
    - the Amsterdam School street furniture in the former schoolyard, including a urinal
