  nl:
    title: Gebroken Cirkel
    summary: "Een betonnen ring van twaalf meter die net niet sluit: het grootste beeld van Ad Dekkers, in 2003 in één stuk van 165 ton van de Mauritskade naar hier verhuisd. Amsterdammers doopten hem Het Gat van Duisenberg."
    body: |
      Deze ring kreeg al snel een politieke bijnaam: Het Gat van Duisenberg, naar het begrotingstekort van 1976, toen Wim Duisenberg minister van Financiën was. Anderen hadden het over De Ring, zagen er een reuzenveerring in, of opgerolde rails van het verdwenen station Weesperpoort.

      De minimalistische beeldhouwer Ad Dekkers ontwierp *Gebroken Cirkel* aan het eind van zijn loopbaan, toen hij werkte met vierkanten, driehoeken, cirkels en lijnen. Het werd in 1976 gebouwd, na zijn dood, naast een gebouw aan de Mauritskade, betaald uit de regeling die een procent van de bouwsom voor kunst opzijzette. Een volmaakte cirkel, zoals eerst bedacht, bleek technisch en financieel niet te doen. Dus bestaan binnen- en buitenring uit rechte stukken, zo gedraaid dat begin en eind elkaar onderaan net missen. Met twaalf meter is het zijn grootste beeld.

      Na vijfentwintig jaar moest het wijken voor een rioolgemaal en een hogeschoolcampus. In 2003 ging de ring van 165 ton in zijn geheel naar deze verhoging op de splitsing van Spaarndammerdijk, Transformatorweg en Nieuwe Hemweg. Een kleinere versie staat bij Kasteel Wijlre in Limburg.

      Let op:
      - de opening onderaan, waar de uiteinden elkaar missen
      - de rechte stukken waaruit de 'cirkel' is opgebouwd
      - de koeien Batman en Robin bij het hotel aan de overkant (Stef Vedder, 2017)
    attributes: {}
    sources:
    - https://nl.wikipedia.org/wiki/Gebroken_Cirkel_(Amsterdam)
- title: Petruskerk (Sloterdijk)
  summary: "The village church of Sloterdijk, rebuilt in 1664 around a 15th-century tower, with grand tombs built in between its buttresses. Saved by a foundation after it closed, it is now a quiet island amid motorways and railways."
  body: |
    A church in Sloterdijk is first mentioned in 1405–1406. The Sint-Petruskerk was wrecked by the Sea Beggars in 1572, after their failed attack on Amsterdam, and became Protestant after 1578. In 1663 the church warden Jan Claesz van Dijk, strongly backed by Cornelis de Graeff, lord of Sloterdijk, had it rebuilt; it reopened on 19 July 1664 with the lower part of the old tower incorporated. The national register describes a rectangular church with clipped gables, divided by heavy buttresses between which monumental tombs were built in an original way, and a timber bell chamber and pyramid spire on the tower. The tower clock dates from 1839. Vincent van Gogh's grandparents married here in 1811.

    The station, the Coentunnel road and the port estates of the 1950s and 1960s nearly wiped out the village. The church closed in 1968 and was sold in 1978 to a foundation to save it; it was listed in 1979 and restored between 1980 and 1992. Around the churchyard stand the parsonage (18th century or older), a little timber consistory room with chamfered corners, and the early 19th-century sexton's and gravedigger's house, whose west door opened straight onto the graves.

    Look for:
    - tombs built between the buttresses
    - the timber bell chamber and pyramid spire
    - the wooden consistory room with its chamfered corners
    - the sexton's house with its door to the churchyard
