  nl:
    title: Spitsbergenschool
    summary: "Een ingetogen lagere school in Amsterdamse School-stijl uit 1923 dat naar voren stapt op het Zaandammerplein, met paraboolvormige portieken onder bakstenen kammen en afwerking in Beiers graniet."
    body: |
      De school springt een stukje naar voren ten opzichte van de woonblokken eromheen, en eist zo het omsloten plein voor zich op. Publieke Werken zette haar in 1923 neer, voor jongens en meisjes, in de sobere variant van de Amsterdamse School. De achterkant kijkt uit op een pleintje tussen woonblokken.

      Het gebouw telt drie lagen, is gemetseld in Vlaams verband en heeft een schilddak met rode pannen en in het midden een steekkap. De voorgevel is symmetrisch. Middenin zit op de verdieping een breed raam voor de gymzaal. Aan weerszijden ligt een portiek met een paraboolboog onder een getrapte bakstenen kam, afgezet met Beiers graniet en afgesloten met smeedijzeren hekken.

      Het register waardeert de school als gaaf voorbeeld van een Amsterdamse School-schoolgebouw en als bepalend stuk van de pleinwand.

      Let op:
      - de twee paraboolportieken met granieten randen en ijzeren hekken
      - de houten deuren met Amsterdamse School-details
      - de blokvormige schoorstenen, met een holle uitsparing op de hoeken
    attributes:
      architect: Dienst der Publieke Werken
      original_use: Openbare lagere school
    sources:
    - Rijksmonumentenregister 526743
- title: Hembrugstraat block (Rutgers)
  summary: "Two Amsterdam School housing blocks by Gerrit Jan Rutgers, the most prolific architect of the movement, on the Hembrugstraat between blocks by De Bazel."
  body: |
    Gerrit Jan Rutgers (1877–1962) is counted as the most productive architect of the Amsterdam School, with some 7,000 homes to his name, most of them in housing blocks like these. His two blocks on the Hembrugstraat sit between blocks by De Bazel, with a small square between them that leads to the back entrance of a school of 1923, the former Willem Barentszschool. The list of municipal monuments says they were built for the housing association Eigen Haard; the Amsterdam School platform Wendingen calls that attribution wrong. They became a municipal monument in 1980.

    The municipal register gives 1920 as the year; the published list of municipal monuments and Wikidata give 1925, and Wendingen gives 1926. Around 1920 Rutgers moved from Berlage-inspired work to the full Amsterdam School style.

    Look for:
    - the staircases that seem to hold up the projecting attic storey, like columns
    - the small square between the two blocks, leading to the back of the old school
