  nl:
    title: Pakhuis Koningin Emma
    summary: "Een massief havenpakhuis van rode baksteen uit 1914 aan het IJ, met KONINGIN-EMMA op de borstwering geschilderd en binnen een betonskelet dat voor die tijd vroeg was. Nu zitten er bedrijven in."
    body: |
      Op de borstwering van het middelste dakhuis aan de straatkant staat het nog in verf: KONINGIN-EMMA. Onder die naam ontwierp G. van Arkel, een architect die in heel Amsterdam gebouwen achterliet, dit pakhuis in 1914.

      Het staat met de rug naar het water van de Oude Houthaven. Aan de kadekant is de onderste verdieping open, met brede laaddeuren. Aan de Van Diemenstraat, die over de oude dijk loopt, zit diezelfde verdieping half onder de grond. De noord- en zuidgevel van rode baksteen zijn met zorg opgebouwd: dertien vakken, van elkaar gescheiden door ronde ijzeren regenpijpen die in de muur verzonken liggen, en in het midden een breder vak onder een groter dakhuis. In de zijgevels zitten nog hijsbalken. Binnen zit een betonskelet; volgens het monumentenregister een betrekkelijk vroeg voorbeeld.

      In het derde kwart van de vorige eeuw werden schepen groter en kwam de container. Voor overslag was dit stuk haven niet meer interessant, en het pakhuis raakte zijn functie kwijt. Na een grondige verbouwing ging het weer open als bedrijfsverzamelgebouw: het Y-tech business centre.

      Let op:
      - KONINGIN-EMMA op de borstwering van het middelste dakhuis aan de straatkant
      - de regenpijpen die in de gevel zijn verzonken en hem in vakken delen
      - de blinde oostgevel, vermoedelijk omdat er ooit een ander pakhuis tegenaan stond
    attributes:
      original_use: Havenpakhuis
    sources:
