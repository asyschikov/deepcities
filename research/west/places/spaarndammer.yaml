  nl:
    title: Polanenstraatblok en Polanentheater
    summary: "Een woonblok van Patrimonium dat eruitziet als een burcht, met in het midden een gereformeerde school. De granieten ingang van die school, in de vorm van een Egyptische tempel, leidt nu het Polanentheater in."
    body: |
      Een Egyptische tempel als schoolingang: forse granieten lijsten met het silhouet van een tempelfront rond de ingang van een gereformeerde lagere school. Ernaast lopen groen geglazuurde banden.

      Tjeerd Kuipers en Arnold Ingwersen, die vooral voor protestantse opdrachtgevers bouwden, ontwierpen het middendeel van het lange blok tussen Polanenstraat en Houtrijkstraat voor woningbouwvereniging Patrimonium (1921-1922). Tegelijk kwam er een lagere school "op gereformeerde grondslag" (1920-1922). Van boven gezien vormen de woningen een uitgerekte H, met de school als dwarsbalk. Aan de Polanenstraat zit een brede opening in de gevelwand, geflankeerd door lagere vleugels met torentjes op de hoeken. Zo keek je vanaf de straat de binnenplaats op, die dienstdeed als schoolplein. Het register ziet daarin iets van de tuindorpen uit 1920-1940. De trappenhuizen eindigen in topgevels die in het mansardedak steken, en het geheel oogt eerder als een kasteelenclave dan als een rij arbeiderswoningen.

      Boven de zijdeur aan de Polanenstraat staat nog altijd op een zandstenen gevelsteen: SCHOOL VOOR LO OP GEREF GRONDSLAG. Rond 1966 ging de school dicht. Het gebouw werd Wijkcentrum Spaarndam en heet sinds 1971 Polanentheater.

      Op de hoeken van het theaterterras staan twee zilverkleurige kegels met een blauwe streep van Bouke IJlstra. Ze zijn in 1984 gemaakt als markering van de poort in de Houtrijkstraat en verhuisden in 1997 naar dit binnenpleintje.

      Let op:
      - de hoektorentjes naast de opening naar de binnenplaats aan de Polanenstraat
      - de Egyptische tempelpoort en de groen geglazuurde banden van de school
      - de gevelsteen van de school boven de rondboogingang aan de zijkant
      - de zilveren kegels van IJlstra op het theaterterras
    attributes:
      original_use: Arbeiderswoningen en gereformeerde lagere school
    sources:
    - Gemeentelijk monumentenregister 223037 en 223019
    - https://nl.wikipedia.org/wiki/Polanentheater
    - "https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/2610"
- title: Volksbadhuis Polanenstraat
  summary: "A public bathhouse of 1916, with a children's bath added in 1919, built when most workers' homes had no bathroom. An early Public Works building to flirt with the Amsterdam School."
  body: |
    The city's Public Works department built this *volksbadhuis* (public bathhouse) on the corner of the Zaanstraat and Polanenstraat; it opened in 1916, and a separate children's bath was added in 1919. It went up just as the first large housing schemes funded under the Housing Act were rising around it, such as De Klerk's blocks and the Zaanhof; most of those homes had no bath. The register sees the building as a marker in the history of public health: founded out of concern for hygiene, closed once better housing made it unnecessary.

    The flat brick façades step back and forth slightly above a plinth of dark, rough brick, with windows of many sizes, varied brickwork, natural-stone entrances, small granite-concrete blocks and wrought-iron details. The register calls it an early example of Public Works taking up the Amsterdam School, while regretting that many original doors and windows have been replaced.

    Look for:
    - the dark rough-brick plinth running all around
    - the stone-framed entrances and wrought-iron details
    - the mix of window sizes, such as the row of ten upstairs windows on the Zaanstraat that lit the shower rooms
