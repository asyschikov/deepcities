  nl:
    title: Blokken van De Greef, Dirk Hartoghstraat
    summary: "Twee blokken arbeiderswoningen uit 1879 en 1883 van stadsarchitect Bastiaan de Greef, vrij vroege voorbeelden van volkshuisvesting op grote schaal door een filantropische vereniging, met de kop aan het Westerkanaal."
    body: |
      Meestal een woonkamer, daarachter een paar piepkleine bedstedes, en een trap die je met de buren deelde: zo woonde je hier na 1879. Stadsarchitect Bastiaan de Greef tekende de twee blokken in 1879 (het zuidelijke) en 1883 (het noordelijke) voor de filantropische Amsterdamsche Vereeniging tot het bouwen van Arbeiderswoningen. Samen ging het om zo'n 160 woningen, met winkels op de hoeken. Omdat de blokken smal zijn, zijn de binnenplaatsen vermoedelijk behoorlijk krap.

      De stijl is een nuchtere versie van de Hollandse neorenaissance. Tegen het rode metselwerk lopen banden van gele baksteen, boven de ramen zitten korfbogen en strekse bogen met gele namaak-sluitstenen, en de muren worden bijeengehouden door smeedijzeren sierankers. Elke gevel spiegelt rond een licht naar voren springend middendeel met een topgevel. De gemeente waardeert de blokken als vrij vroege voorbeelden van grootschalige volkshuisvesting voor een filantropische vereniging, en als stukje van een buurtje uit de late 19e eeuw, waar ook de scholen aan de Roggeveenstraat bij horen.

      Let op:
      - de banden van gele baksteen, de speklagen, over de rode gevels
      - de middentopgevels en de hogere kopse kanten van het noordelijke blok
      - de westelijke koppen van beide blokken aan de Houtmankade, langs het Westerkanaal
    attributes:
      original_use: Arbeiderswoningen en winkels
    sources:
    - Gemeentelijk monumentenregister 200756 en 200762
- title: Zoutkeetsplein block
  summary: "An 1881 block of houses and corner shops in late-19th-century eclectic style, with a classical cornice running round the Zoutkeetsplein and fairly intact stucco details."
  body: |
    A.W. Kramer designed the northern half of this block in 1881; the southern half went up around the same time. It consists of nine separate buildings, subdivided into flats of one or two floors, with four shops on the Zoutkeetsplein. The two halves look almost identical but differ in detail: the façades combine red brick with plastered parts and follow a monumental order of base, middle and crown under a continuous classical entablature that runs on along the Barentszstraat. The roofs are a medley of hipped roofs along the canal, a flattened hip at the corner, mansard roofs and a tent roof on the corner house.

    The register values it as an integral part of the late-19th-century fill-in of the neighbourhood, with houses, shops, schools and warehouses, and for its prominent site on the square and canal.

    Look for:
    - the continuous classical cornice tying all the houses together
    - the stucco detailing, finer on the square than on the Barentszstraat
    - the mansard and tent roofs at the north corner
