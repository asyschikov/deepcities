  nl:
    title: Spaarndammercarré
    summary: "Vier hoekblokken van Gulden & Geldmaker die naast De Klerk niet uit de toon mochten vallen. Verspringende gevels, afgeschuinde hoeken en daken naar Berlijns voorbeeld, gerestaureerd tot en met de belettering."
    body: |
      Hoe bouw je naast De Klerk? Over die vraag bogen de Schoonheidscommissie en de architecten zich destijds uitgebreid. Twee van deze blokken staan aan het Spaarndammerplantsoen, waar ook De Klerks woningbouw uit 1914 staat. Zeger Gulden en Melle Geldmaker ontwierpen ze in 1916-1917 voor woningbouwvereniging Amsterdam-Zuid, als vier blokken arbeiderswoningen aan de uiteinden van de Knollendamstraat; tot 1921 werd eraan gebouwd.

      De strook aan de Knollendamstraat 56-78 is het vlakst gehouden, misschien om aan te sluiten bij het uitbundiger werk van De Klerk. De andere drie springen voor- en achteruit, over de hele hoogte of boven een strakke plint. Bij twee ervan zijn de hoeken afgeschuind, zodat de kruising met de Polanenstraat een pleintje wordt.

      In de daken, de verspringende rooilijn en de schuine hoeken ziet het gemeentelijke register de Berlijnse blokbouw terug. De interieurs zijn in 1974 en vanaf 2006 opnieuw verbouwd; één blok werd volledig uitgehold en kreeg een binnentuin op een kelder. De gevels werden juist zorgvuldig hersteld, tot de letters aan toe. Gulden & Geldmaker werd later een van de bureaus die in de gordel 20-40 het meest bouwden.

      Let op:
      - het pleintje dat de afgeschuinde hoeken vormen bij Knollendamstraat en Polanenstraat
      - de platte wieberramen en de uitgerekte topgevels van blok 1, naast De Klerk
      - sierbanden van baksteen onder de dakrand
    attributes:
      original_use: Arbeiderswoningen
    sources:
    - Gemeentelijk monumentenregister 200764 (redengevende omschrijving)
- title: Polanenstraat block and Polanentheater
  summary: A castle-like Patrimonium housing block with a Calvinist school built into its middle. The school's Egyptian-style granite doorway now leads into the Polanentheater.
  body: |
    Tjeerd Kuipers and Arnold Ingwersen, architects mainly working for Protestant clients, designed the middle part of the long block between the Polanenstraat and Houtrijkstraat for the housing association Patrimonium (1921–1922), together with a primary school "on Reformed principles" (1920–1922). In plan the housing forms a stretched H, and the school is its crossbar. A wide opening in the Polanenstraat, flanked by low wings with little corner towers, gave a view of the courtyard that served as the school playground, a gesture the register links to the garden villages of 1920–1940. Stair towers end in gables cut into the mansard roof, and the whole block reads like a castle enclave rather than a row of workers' flats.

    The school's courtyard front has a granite frame in the outline of an Egyptian temple and green glazed bands. A sandstone tablet over the side door on the Polanenstraat still reads SCHOOL VOOR LO OP GEREF GRONDSLAG. The school closed around 1966, became the Wijkcentrum Spaarndam and has been known since 1971 as the Polanentheater.

    Two silver cones with a blue stripe by Bouke IJlstra stand at the corners of the theatre's terrace. They were made in 1984 to mark the gateway in the Houtrijkstraat and moved to this inner square in 1997.

    Look for:
    - the corner turrets beside the courtyard opening on the Polanenstraat
    - the Egyptian-temple doorway and green glazed bands on the school
    - the school tablet above the round-arched side entrance
    - IJlstra's silver cones on the theatre terrace
