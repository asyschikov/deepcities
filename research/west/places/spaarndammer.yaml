  nl:
    title: Walenkampblokken, Nova Zemblastraat
    summary: "Zo'n 800 eenvoudige arbeiderswoningen uit 1913–1916 waarmee Herman Walenkamp, zo ziet het monumentenregister het, vooruitliep op zijn beroemde Zaanhof. Sober, maar met zorg gecomponeerd."
    body: |
      Wie het Zaanhof kent, ziet hier de generale repetitie. Dit was het eerste grote woningbouwplan dat Herman Walenkamp ook echt gebouwd kreeg, en het gemeentelijk monumentenregister ziet het als de voorloper van dat internationaal bekende complex, ook in de Spaarndammerbuurt. Woningbouwvereniging Het Westen liet hier tussen 1913 en 1916 zo'n 800 eenvoudige etagewoningen voor arbeidersgezinnen bouwen, in fasen, te beginnen aan de oostkant. In 1986 is het geheel gerestaureerd.

      Eenvoudig is hier niet hetzelfde als saai. De blokken tellen vijf bouwlagen in roodbruine handvormsteen en zijn streng symmetrisch. Per woning springt de gevel een stukje naar voren of wijkt hij juist terug. De vooruitspringende delen lopen door in een topgevel, steeds als paar, met de kap in het dak gestoken, en midden in elke lange straatwand staat één grotere en hogere top. Langs de lange straten zijn die toppen eenvoudig; in de korte zijstraten koos Walenkamp een landelijker variant met een wolfsdak.

      Het register herkent er de Engelse Arts and Crafts-beweging in, en Walenkamps idee dat ook 'de gewone arbeider' tussen kwaliteit en schoonheid hoort te wonen. Dat lukte hem hier met opvallend weinig versiering.

      Let op:
      - de topgevels die per twee naast elkaar staan, en de grotere middentop op elke lange gevel
      - de wolfsdaken in de korte zijstraten
      - de portieken met vier deuren op een rij: twee voor de benedenwoningen, twee voor de trappen naar boven
    attributes:
      original_use: Arbeiderswoningen
    sources:
    - Gemeentelijk monumentenregister 223020
- title: Volkskoffiehuis block, Tasmanstraat
  summary: A workers' housing block of 1914 with a "people's coffee house" in its pointed western corner, its name still painted on the wall, and white-plastered top floors with round windows in the gables.
  body: |
    The contractor-architect J.H. Lesmeister, who built a great deal in the 19th-century ring, designed this block of about 120 sober flats in 1914, probably for the housing association Het Westen. At its western point is a *volkskoffiehuis* (people's coffee house), which may have been there from the start; at the southern point were two shops, one now a café. The design follows Walenkamp's slightly older blocks next door almost seamlessly, and together they read as one whole.

    Red-brown brick is topped by a white-plastered fourth floor and gables, each with a round iron-framed window. Brown glazed bricks line door and window reveals and decorative bands, details the register links to the English Arts and Crafts movement. A renovation in the 1980s replaced windows and balconies, but the main form and many details survive.

    Look for:
    - "KOFFIEHUIS" painted on the Tasmanstraat façade near the corner
    - the slanted corner entrances to the coffee house and shop
    - round windows in the white gables
    - brown glazed bricks around doors and big windows
