    title: Gemaal Overbraker Binnenpolder
    summary: "Een gemaal in neorenaissancestijl uit 1884, met op de bovenverdieping de woning van de sluiswachter. Ontworpen door de architect van de Westergasfabriek, en nog altijd aan het werk: het pompt water uit de polder erachter."
    body: |
      Al sinds 1884 pompt dit gebouw water uit de Overbraker Binnenpolder, het lage land ten noorden van de Haarlemmervaart, en loost het in de vaart. Het nam het werk over van een molen. De polder ligt op zo'n 2,15 meter onder NAP.

      Isaac Gosschalk, die ook de gebouwen van de Westergasfabriek ernaast ontwierp, gaf het een neorenaissancegevel: rondboogramen, sierbanden van baksteen, een lijst met andreaskruizen tussen de verdiepingen en in het midden een tuitgevel met muizentandfriezen. Boven woonde de sluiswachter van de sluis in de Haarlemmervaart, die er vlak naast ligt.

      Het begon als stoomgemaal en werd later elektrisch. Een schroefpomp met een machine van Werkspoor doet nog steeds het werk; sinds 2008 valt het gemaal onder het Waterschap Amstel, Gooi en Vecht. Gemaal en sluis zijn samen beschermd als rijksmonument, en in 2016 is het gebouw van onder tot boven opgeknapt.

      Let op:
      - de symmetrische voorgevel aan de vaart, met rondboogramen en een gevormde middengevel
      - de band met andreaskruizen tussen de twee verdiepingen
      - de sluis ernaast, met zijn voetbrug
    attributes:
      original_use: Stoomgemaal annex sluiswachterswoning
    sources:
    - https://nl.wikipedia.org/wiki/Gemaal_van_de_Overbraker_Binnenpolder
    - Rijksmonumentenregister 526736
- title: Begraafplaats Sint Barbara
  summary: A Catholic cemetery of 1893 tucked between railways, with a half-timbered chapel that had separate waiting rooms for five classes of mourners. Manke Nelis, Simon Vinkenoog and Erwin Olaf rest here.
  body: |
    The parish of De Liefde, whose cemetery opposite its church in the Bilderdijkstraat was full, bought this 12-hectare plot of farmland in 1888; it then lay in the municipality of Sloten. The architect Adrianus Bleys designed the layout and, in 1892–1893, a picturesque house for the cemetery keeper and two gravediggers under one roof, with pointed-arch windows, timber trusses and a half-timbered barn behind. The cemetery was consecrated on 27 September 1893.

    Bleys' temporary chapel soon became unsafe and was replaced in 1902 by a new one by J.J.L. Moolenschot, reusing as much old material as possible. Its asymmetric plan groups rooms around the central hall, including waiting rooms for first and second class on one side and third, fourth and fifth class on the other. White timber framing against orange-red brick and a bell tower give it a friendly, small-scale look; a new box-like hall was slotted inside in 1958. Among those buried here are the writer Joseph Alberdingk Thijm (reburied), singer Manke Nelis, poet Simon Vinkenoog, photographer Erwin Olaf and the last Begijnhof beguines.

    One path is called the Degenkamplaantje, after a man who worked at the cemetery for 56 years. His son Johan, who worked here too, lived on the grounds from the age of three, in what were then three houses and is now the office.

    Look for:
    - the half-timbered chapel with its little bell tower
    - the gravediggers' houses with pointed arches and carved trusses
    - the three angel statues by Henk Spreeuwenberg (2009)
    - the Degenkamplaantje
