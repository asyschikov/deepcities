  nl:
    title: Spaarndammerdijk (dijkrestant)
    summary: "Een beschermd stukje van de zeedijk die vanaf de 13e eeuw van de Amstel naar het Spaarne liep. Eeuwenlang kon je hierover als enige weg over land van Amsterdam naar Haarlem."
    body: |
      Wie in de 16e eeuw over land van Amsterdam naar Haarlem wilde, had maar één keus: deze smalle, kronkelige dijk. Het Haarlemmermeer had de route via Sloten toen al opgeslokt. Pas de Haarlemmertrekvaart (1632) en de Haarlemmerweg (1762) boden een alternatief.

      De aanleg van de Spaarndammerdijk begon in de eerste helft van de 13e eeuw. Hij moest de veenweiden ten zuiden van het IJ beschermen, dat toen nog een open zeearm was. Hij liep van de Amstel tot het Spaarne en vormde de noordgrens van het Hoogheemraadschap van Rijnland. Aan de uiteinden lagen de dammen waaraan Amsterdam en Spaarndam hun naam danken.

      Toen de Spaarndammerbuurt werd gebouwd, werd het eerste stuk dijk de Spaarndammerstraat. Verder naar het westen verdween het meeste in de jaren zestig onder bedrijventerreinen, zonder dat er archeologen naar keken. Hier, bij begraafplaats Sint Barbara en boerderij Ons Genoegen, ligt nog een klein echt stuk, beschermd als gemeentelijk monument.

      Meer naar het oosten is de dijk weggegraven voor het Houthavenpark; van het hoogteverschil bleef alleen een lage betonnen rand over. Studio Wessels Boer legde daar een bank van 170 meter overheen, in vier delen, golvend in gele en blauwe strepen zoals zonlicht op het IJ. De naam, *Voortdurend*, verwijst naar de Zuiderzee die de dijk ooit tegenhield.

      Let op:
      - het hoger gelegen weggetje met het lage polderland ernaast
      - de boerderij en de begraafplaats die nog tegen de dijk aan liggen
      - Voortdurend, de gestreepte golfbank in het Houthavenpark, zo'n 1,2 km naar het oosten
    attributes:
      built: 13e eeuw
      original_use: Zeedijk
    sources:
    - https://nl.wikipedia.org/wiki/Spaarndammerdijk
    - "https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/2684"
- title: Gebroken Cirkel
  summary: Ad Dekkers' biggest sculpture, a 12-metre, 165-tonne concrete ring that does not quite close, moved in one piece from the Mauritskade in 2003. Amsterdammers nicknamed it "Duisenberg's Hole".
  body: |
    The minimalist sculptor Ad Dekkers designed *Gebroken Cirkel* (broken circle) late in his career, when he worked with squares, triangles, circles and lines; it was built in 1976, after his death, beside a building on the Mauritskade, paid for under the percentage-for-art rule. The perfect circle he first planned proved technically and financially impossible, so both inner and outer rings are made of straight segments, twisted so that start and end do not meet at the bottom. Locals soon called it "De Ring" and "Het Gat van Duisenberg" (Duisenberg's hole), after the 1976 budget deficit under finance minister Wim Duisenberg; others saw a giant spring washer or rolled-up rails from the vanished Weesperpoort station.

    After 25 years it had to make way for a sewage pumping station and a university campus. In 2003 the 165-tonne ring was moved in one piece to this raised spot at the fork of the Spaarndammerdijk, Transformatorweg and Nieuwe Hemweg. A smaller version stands at Kasteel Wijlre in Limburg.

    Look for:
    - the gap at the bottom where the ends miss each other
    - the straight segments that make up the "circle"
    - the cows Batman and Robin at the hotel opposite (Stef Vedder, 2017)
