  nl:
    title: Het Schip
    summary: "Arbeiderswoningen met een eigen postkantoor en een eigen school: Michel de Klerks bakstenen 'schip' voor Eigen Haard, met een torentje op de lage toegangsvleugel. In het oude postkantoor zit nu het museum van de Amsterdamse School."
    body: |
      Het rijksmonumentenregister noemt dit blok "een der irrationeelste hoogtepunten" van de Amsterdamse School. Kijk naar het torentje op de lage toegangsvleugel, de tonronde hoekerkers en het felrode metselwerk, en je snapt waarom.

      Michel de Klerk tekende drie woonblokken rond het Spaarndammerplantsoen. Dit is het derde en het meest opvallende, gebouwd van 1917 tot 1920 voor Eigen Haard, de socialistische woningbouwvereniging. Het ligt rond een binnenterrein dat ruwweg een driehoek is. De arbeiders kregen er woningen met echte kamers, licht en frisse lucht. Het blok had ook een eigen postkantoor, en dat was voor arme mensen tot dan toe geen vanzelfsprekendheid. Een lagere school hoorde er eveneens bij. In de punt van de binnenplaats staat een vergadergebouwtje, in 1920 opgeleverd en met twee lage muurtjes aan het blok vastgemaakt.

      De bijnaam Het Schip dankt het blok aan zijn vorm. Sinds 2001 zit Museum Het Schip in het voormalige postkantoor. Je ziet er de gerestaureerde lokettenhal, een ingerichte arbeiderswoning en tentoonstellingen, en met een rondleiding kom je ook op de binnenplaats.

      Let op:
      - het torentje boven de toegangsvleugel aan de kant van de Hembrugstraat
      - het vroegere postkantoor op de hoek van de Zaanstraat en het Spaarndammerplantsoen
      - het straatmeubilair in Amsterdamse School-stijl op het oude schoolplein, met een plaskrul
    attributes:
      original_use: Sociale woningbouw, postkantoor, school, vergadergebouw
    sources:
    - https://nl.wikipedia.org/wiki/Spaarndammerbuurt
    - https://nl.wikipedia.org/wiki/Spaarndammerplantsoen
    - Rijksmonumentenregister 3961
- title: Spaarndammercarré
  summary: "Four corner blocks by Gulden & Geldmaker that had to fit in next to De Klerk. Stepped façades, cut-off corners and Berlin-style roofs, restored with their original lettering."
  body: |
    Zeger Gulden and Melle Geldmaker built these four blocks of workers' flats at the ends of the Knollendamstraat for the housing association Amsterdam-Zuid (designs 1916–1917, built up to 1921). Two of the blocks share the Spaarndammerplantsoen with De Klerk's housing of 1914, and the city's beauty committee and the architects argued at length about how to fit in. The strip at Knollendamstraat 56-78 is the flattest, perhaps to fit in with De Klerk's more expressive work; the other three step forward and back over their full height or above a straight plinth, and two have cut-off corners that turn the junction with the Polanenstraat into a small square.

    The register sees the influence of Berlin block building in the roofs, the jumps in the building line and the chamfered corners. The interiors were rebuilt in 1974 and again from 2006; one block was gutted and given a courtyard garden on a basement, but the façades were restored with care, down to the lettering. Gulden & Geldmaker later became one of the most productive offices of the 1920–1940 ring.

    Look for:
    - the mini-square formed by the cut-off corners at Knollendamstraat/Polanenstraat
    - the flat "wieber" windows and stretched gables of block 1 next to De Klerk
    - decorative brick bands under the eaves
