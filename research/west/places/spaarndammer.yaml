  nl:
    title: Petruskerk (Sloterdijk)
    summary: "De dorpskerk van Sloterdijk, in 1664 herbouwd rond een toren uit de vijftiende eeuw, met statige grafmonumenten tussen de steunberen. Een stichting redde hem nadat hij dichtging; nu ligt hij als een stil eiland tussen snelwegen en spoor."
    body: |
      Het dorp Sloterdijk is bijna helemaal verdwenen, maar de kerk staat er nog. Het station en de Coentunnelweg, en in de jaren vijftig en zestig de bedrijventerreinen van de haven, slokten het dorp vrijwel op. De kerk ging in 1968 dicht en werd in 1978 verkocht aan een stichting die hem wilde behouden. Een jaar later werd hij beschermd monument, en tussen 1980 en 1992 volgde de restauratie.

      Al in 1405–1406 is hier sprake van een kerk. De Sint-Petruskerk werd in 1572 vernield door de Geuzen, na hun mislukte aanval op Amsterdam, en na 1578 werd hij protestants. In 1663 nam kerkmeester Jan Claesz van Dijk het initiatief tot herbouw, met stevige steun van Cornelis de Graeff, ambachtsheer van Sloterdijk. Op 19 juli 1664 ging de kerk weer open, met het onderste stuk van de oude toren erin verwerkt. Het rijksmonumentenregister beschrijft een rechthoekig gebouw met afgeknotte gevels en zware steunberen, waartussen op originele wijze grafmonumenten zijn gebouwd. Op de toren staan een houten klokkenkamer en een piramidespits; het uurwerk is uit 1839. In 1811 trouwden hier de grootouders van Vincent van Gogh.

      Rond het kerkhof staan nog de pastorie (achttiende eeuw of ouder), een houten consistoriekamertje met afgeschuinde hoeken en de kosters- en doodgraverswoning van begin negentiende eeuw. Via de deur in de westgevel stapte je zo tussen de graven.

      Let op:
      - de grafmonumenten tussen de steunberen
      - de houten klokkenkamer en de piramidespits
      - de houten consistoriekamer met afgeschuinde hoeken
      - de kosterswoning met haar deur naar het kerkhof
    attributes:
      built: 1663–1664 (onderbouw toren 15e eeuw)
      original_use: Kerk, pastorie, consistoriekamer, kosters- en doodgraverswoning
    sources:
    - https://nl.wikipedia.org/wiki/Petruskerk_(Sloterdijk)
    - https://nl.wikipedia.org/wiki/Sloterdijk_(Amsterdam)
    - Rijksmonumentenregister 6775, 6773, 511489
- title: Dike houses of Oud-Sloterdijk
  summary: "Three surviving village houses of Sloterdijk on the old dike: one partly thatched and perhaps 17th-century at its core, two long 18th-century houses with nine-pane windows."
  body: |
    Sloterdijk grew up where the little river Slooter met the Spaarndammerdijk; a "Sloterdam" is mentioned in 1395–1396 and the name Sloterdijck appears in 1450. Until 1921 it belonged to the municipality of Sloten, whose town hall stood here. After the station of 1956, the Coentunnel road and the port estates, little more than the church and a handful of houses survived. These three were listed in 1970: a partly thatched house that may be 17th-century at its core, and two long houses set crosswise to the dike, from the 18th century, with nine-pane windows. The dike under them is itself protected as a municipal monument.

    Nearby on the Molenwerf stands *De verdwenen boer* (the vanished farmer), a bronze by Karel Gomes of 2005 remembering the farmers who had to make way for the city.

    Look for:
    - the thatched roof of number 657
    - nine-pane windows on numbers 663-667
    - the dike itself, a protected monument in its own right
