    - "https://monumentenregister.cultureelerfgoed.nl/monumenten/527133"
  nl:
    title: Woningbouw Vespuccistraat (Roodenburgh)
    summary: Vier woonblokken van J. Roodenburgh aan de Vespuccistraat, in oranjerode baksteen op donkere klinker, met paraboolvormige zeszijdige portieken en banden siermetselwerk.
    body: |
      J. Roodenburgh ontwierp aan de Vespuccistraat een complex van vier woonblokken met etagewoningen, en op de hoeken winkels. Het oostelijke blok aan de Vespuccistraat 44-134 is lang en vrijwel rechthoekig, met naar voren en naar achteren springende delen. Boven de begane grond tellen de blokken drie verdiepingen onder een plat dak. De gevels zijn gemetseld in (oranje)rode baksteen in Noors verband op een voet van donkere klinker, met accenten in natuursteen en siermetselwerk.

      De ingangen op straatniveau zijn zeszijdige portieken in de vorm van een parabool. Samen met de kleine, diep in de muur gezette vensters en de donkere klinkers lezen ze als één doorlopende band. Op de bovenste verdieping verbinden horizontale banden siermetselwerk de vensters halverwege; daarboven krijgt het metselwerk een verticale richting.

      Let op:
      - de uitkragende blokken natuursteen boven de portieken
      - de korte gedrongen gemetselde schoorstenen boven de portieken
      - de winkels op de hoek met de Jan van Galenstraat
    attributes:
      original_use: Etagewoningen en winkels
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/527130
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/527132

- title: Jan Maijenschool
  summary: "Four elementary schools in one 1926 building, with wavy brickwork, long window bands and yellow corner pavilions whose corners are rounded into half-cylinders, facing the Jeruzalemkerk across a small square."
  body: |
    J.W. Frantzen of the Public Works department designed this "quadruple" corridor school in 1926. It held four elementary schools (the Vespucci-, Mercator-, Jan Evertsen- and Jan Maijenschool), whose names eventually merged into the last. Toilets and workrooms face the street and classrooms look out over the playground at the back. After the schools closed, the building was restored; the old playground behind it is now a quiet garden, the Tuin van Jan.

    The front is a late Amsterdam School showpiece. A long, symmetrical centre of red-grey brick is held between yellow-brick corner pavilions. The outer corners of the pavilions are rounded into half-cylinders, and the inner ones repeat the shape, set back and turned 90 degrees. The yellow brick wraps around the ground-floor window band and over the crenellated parapet that links the two pavilions.

    Look for:
    - the half-cylindrical corners of the yellow pavilions
    - the crenellated parapet between them
    - the base of sintered brick, raised around the three porches
  category: schools
  lat: 52.370947
  lng: 4.852291
  address: Jan Maijenstraat 11-17
  links:
    - { label: Rijksmonumentenregister (527156), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/527156" }
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/d24ad2d1-244c-4650-a3ed-22a92d918704" }
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Jan_Maijenstraat_11-17" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q17292067" }
  attributes:
    heritage_status: National monument
    monument_number: "527156"
    built: "1926"
    architect: J.W. Frantzen (Dienst Publieke Werken)
    listed: 2003
    original_use: Four elementary schools
  photos:
    - commons:File:Jan Maijenschool (3).JPG
    - commons:File:Jan Maijenschool.jpg
  sources:
    - rce:527156 (register text)
    - wd:Q17292067
    - https://nl.wikipedia.org/wiki/Jan_Maijenstraat_11-17
  nl:
    title: Jan Maijenschool
    summary: "Vier lagere scholen in één gebouw uit 1926, met golvend metselwerk, lange vensterstroken en gele hoekpaviljoens waarvan de hoeken tot halve cilinders zijn gerond. Recht tegenover, aan een pleintje, staat de Jeruzalemkerk."
    body: |
      Vier scholen onder één dak: de Vespucci-, Mercator-, Jan Evertsen- en Jan Maijenschool. Op den duur smolten hun namen samen tot die laatste. J.W. Frantzen van de Dienst Publieke Werken ontwierp deze 'vierdubbele' gangschool in 1926. De toiletten en werkruimten liggen aan de straatkant, de klaslokalen kijken achter uit op het schoolplein. Toen de scholen dichtgingen, werd het gebouw gerestaureerd, en het oude schoolplein is nu een stiltetuin: de Tuin van Jan.

      De voorgevel is een pronkstuk van de late Amsterdamse School. Een lange, symmetrische middenpartij in roodgrauwe baksteen wordt ingeklemd door hoekpaviljoens van gele steen. Aan de buitenkant zijn de hoeken van die paviljoens gerond tot halve cilinders. Aan de binnenkant komt dezelfde vorm terug, maar dan teruggelegd en een kwartslag gedraaid. De gele steen loopt ook om de raamstrook beneden heen, en over de gekanteelde borstwering die beide paviljoens verbindt.

      Let op:
      - de halfronde hoeken van de gele paviljoens
      - de borstwering met kantelen daartussen
      - de plint van gesinterde baksteen, die rond de drie portieken hoger oploopt
    attributes:
      architect: J.W. Frantzen (Dienst Publieke Werken)
      original_use: Vier lagere scholen
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/527156
      - https://nl.wikipedia.org/wiki/Jan_Maijenstraat_11-17

- title: Jeruzalemkerk
  summary: Ferdinand Jantzen's 1929 Reformed church, built into the flats around it and composed with number symbolism, temple-like terraces and his own stained glass of the seven days of Creation.
  body: |
    The Dutch Reformed congregation of Sloterdijk built this church for the new Plan West district in 1928–1929. Ferdinand Jantzen attached the church to seven flats and a consistory on its corners: church and housing form one design. He worked in the sober "streamlined" Amsterdam School with influences from Frank Lloyd Wright.

    Symbolism runs through the design. The stepped, cubic volumes and terraces refer to temple architecture, the dimensions follow numerical schemes, and the stone colours, lamps, woodwork and railings all carry meaning. Inside, Jantzen's own stained-glass windows show the seven days of Creation, and the organ by Furtwängler & Hammer dates from 1930. It is still a Protestant church.

    Look for:
    - three identical doors in a base of purple clinker, under the name JERUZALEMKERK in metal letters
    - three tall, narrow triple windows below a short, stocky bell tower
    - orange-red and dark-brown brick with Bavarian granite accents
    - the fence on a brick base that encloses the church on three sides
  category: religious
  lat: 52.371437
  lng: 4.851956
  address: Jan Maijenstraat 14, Torresstraat 2-4, James Cookstraat 1-3
  links:
    - { label: Rijksmonumentenregister (527155), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/527155" }
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/6549e46e-0e87-47a9-8a19-e9fb638da0be" }
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Jeruzalemkerk_(Amsterdam)" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q7476474" }
  attributes:
    heritage_status: National monument
    monument_number: "527155"
    built: 1928–1929
    architect: F.B. Jantzen
    listed: 2003
    original_use: Church with flats and consistory
  photos:
    - commons:File:Jeruzalemkerk.jpg
    - commons:File:Amsterdam, Jeruzalemkerk Exterior 8752.jpg
  sources:
    - rce:527155 (register text)
    - wd:Q7476474
    - https://nl.wikipedia.org/wiki/Jeruzalemkerk_(Amsterdam)
  nl:
    title: Jeruzalemkerk
    summary: "Een kerk die vastzit aan de flats ernaast: Ferdinand Jantzen ontwierp kerk en woningen in 1928-1929 als één geheel, vol getallensymboliek en tempelterrassen, met eigen glas-in-lood van de zeven scheppingsdagen."
    body: |
      Een vrijstaande kerk is dit niet. Aan de Jan Maijenstraat loopt het godshuis op twee hoeken gewoon door in woonhuizen: zeven etagewoningen en een consistorie, door architect Ferdinand Jantzen aan de kerk vastgebouwd. Kerk en huizen vormen samen één ontwerp. De hervormde gemeente van Sloterdijk liet het geheel in 1928-1929 neerzetten voor de nieuwe wijk van Plan West. Jantzen tekende in de strakke, sobere richting van de Amsterdamse School, en liet zich daarbij ook door Frank Lloyd Wright inspireren.

      Het ontwerp zit vol symboliek. De getrapte, blokvormige massa's en de terrassen moeten aan een tempel doen denken, de maten zijn afgeleid van getallenreeksen, en ook de kleur van de steen, de lampen, het houtwerk en de leuningen betekenen iets. Binnen hangt glas-in-lood van Jantzen zelf: zeven ramen, één voor elke dag van de schepping. Het orgel is in 1930 gebouwd door Furtwängler & Hammer. Er komt nog altijd een protestantse gemeente samen.

      Let op:
      - drie gelijke deuren in een voet van paarse klinkers, met erboven JERUZALEMKERK in metalen letters
      - drie hoge, smalle ramen van drie delen, onder een korte, gedrongen klokkentoren
      - oranjerode en donkerbruine baksteen, afgezet met Beiers graniet
      - het hek op een gemetselde voet dat de kerk aan drie kanten omsluit
    attributes:
      original_use: Kerk met woningen en consistorie
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/527155
      - https://nl.wikipedia.org/wiki/Jeruzalemkerk_(Amsterdam)

- title: Gijsbert Bakker hofje (Reinier Claeszenplein)
  summary: "A 1933 almshouse for the elderly, paid for by the charity of an 18th-century Catholic seed merchant: a \"modern hofje\" with floating galleries at the back, halfway between the old courtyard almshouse and the old people's flat."
  body: |
    Gijsbert Bakker (1755–1819) was a wealthy Catholic seed merchant who bought houses in the Jordaan for the poor, the so-called *Bakkershuisjes*. His capital went into a foundation for the care of the poor and elderly, which kept building long after his death. In 1933 the Stichting Gijsbert Bakker commissioned this U-shaped building from the architect H. Peters as a *modern hofje*: the 20th-century version of the charitable almshouses that Amsterdam had known since the 17th century. The foundation owned it until recently; the flats are now open to other residents too.

    The register values it as a milestone in the history of housing for the elderly: a gallery block, reached from the inner court, between the traditional *hofje* and the post-war old people's flat. The galleries at the back hang free of the wall on steel beams and seem to float. The traditional, businesslike brick front faces the square and closes off the north end of its block.

    Look for:
    - the name of the Stichting Gijsbert Bakker in iron letters above the entrance
    - the stepped round arch and stepped reveals that draw you to the original front door, between granite strips and small leaded windows
    - grey granite courses along the base and a band of black-tarred brick at the top
    - the gables of the side wings, with small round-arched attic windows
  category: housing
  lat: 52.374151
  lng: 4.861357
  address: Reinier Claeszenplein 1-59, Lumeijstraat 54-62
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/d592b564-b6ac-4133-ba95-f61a42c5b675" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "200685"
    built: "1933"
    architect: H. Peters
    listed: 2013
    original_use: Almshouse (hofje) for the elderly
  photos:
    - commons:File:R. Claeszenplein 1-61 (2).jpg
  sources:
    - city:200685 (register text; text says architect H. Peters, metadata says L. Peters)
  nl:
    title: Hofje Gijsbert Bakker (Reinier Claeszenplein)
    summary: "Een \"modern hofje\" voor ouderen uit 1933, betaald uit de nalatenschap van een katholieke zaadhandelaar uit de achttiende eeuw. Achter hangen de galerijen los van de gevel: half hofje, half bejaardenflat."
    body: |
      Aan de achterkant lijken de galerijen te zweven. Ze hangen op stalen balken, vrij van de muur. Wie aan de voorkant staat, ziet daar niets van: een zakelijk-traditionele bakstenen gevel aan het plein, die het bouwblok aan de noordkant afsluit.

      Het geld kwam van Gijsbert Bakker (1755-1819), een rijke katholieke zaadhandelaar. Hij kocht in de Jordaan huisjes op voor armen, de Bakkershuisjes. Zijn vermogen ging naar een stichting voor armen- en ouderenzorg, en die bleef lang na zijn dood bouwen. In 1933 liet de Stichting Gijsbert Bakker architect H. Peters dit U-vormige gebouw neerzetten als "modern hofje": de twintigste-eeuwse opvolger van de liefdadigheidshofjes die Amsterdam al sinds de zeventiende eeuw kende. Tot voor kort was het nog van de stichting; nu kunnen ook anderen er wonen.

      Het gemeentelijke register ziet er een ijkpunt in, ergens tussen het klassieke hofje en de bejaardenflat van na de oorlog: een galerijgebouw dat je via de binnentuin bereikt.

      Let op:
      - de naam van de Stichting Gijsbert Bakker in ijzeren letters boven de ingang
      - de getrapte rondboog en de getrapte neggen die je naar de oorspronkelijke voordeur leiden, tussen granieten stroken en smalle glas-in-loodraampjes
      - grijze granieten banden langs de voet en bovenaan een strook zwartgeteerde baksteen
      - de topgevels van de zijvleugels, met kleine rondboogvensters op zolder
    attributes:
      original_use: Hofje voor ouderen
    sources:
      - https://data.amsterdam.nl/monumenten/d592b564-b6ac-4133-ba95-f61a42c5b675

- title: Pieter Oosterleeschool (Orteliusstraat)
  summary: Cornelis Kruyswijk's 1931 Christian school, with one of the most colourful and best-preserved 1930s school interiors in Amsterdam behind a front of red brick striped with pale stone.
  body: |
    Cornelis Kruyswijk designed this school in 1930 for the Society for Christian Schools in Sloterdijk. It is named after Pieter Oosterlee (1863–1930), an educationalist and writer who championed Christian education; after the "school struggle" ended in 1920, denominational schools received equal state funding and built in large numbers, mostly with private architects. Kruyswijk received 21 school commissions, 12 in Amsterdam, and the register counts this one and his Titiaanstraat school among his most refined. It now houses De Kleine Prins, a school for children with severe behavioural problems.

    The front fits seamlessly into the street wall yet stands out through its materials, and it sits in the sightline of the Van Middellandtstraat. Inside, tiled floors in red-brown and grey, ochre wall tiles with blue-red block patterns, original cupboards and two large abstract leaded-glass windows over the stairs survive.

    Look for:
    - stripes of pale stone alternating with red brick in the broad base and around the gym windows
    - the recessed entrance flanked by block-shaped sculptures, with a weathered inscription mentioning P. Oosterlee
    - granite reliefs of a bird and a flower by the entrance
    - the bay on the north end, once the head teacher's room
  category: schools
  lat: 52.365263
  lng: 4.851464
  address: Orteliusstraat 28
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/c5f4b509-656b-40da-b25b-6a49297bf5cc" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "200683"
    built: 1930–1932
    architect: C. Kruyswijk
    listed: 2013
    original_use: Christian elementary school
  photos: []
  sources:
    - city:200683 (register text)
  nl:
    title: Pieter Oosterleeschool (Orteliusstraat)
    summary: "Christelijke school uit 1931 van Cornelis Kruyswijk. Achter een gevel van rode baksteen met banden lichte natuursteen zit een van de kleurrijkste en gaafste Amsterdamse schoolinterieurs uit de jaren dertig."
    body: |
      Van buiten valt hij op door zijn strepen, maar het echte feest is binnen. Het gemeentelijk monumentenregister rekent het interieur tot de kleurrijkste en best bewaarde van Amsterdamse scholen uit de jaren dertig. Op de vloeren liggen roodbruine en grijze tegels, de wanden zijn okergeel betegeld met blauwrode blokmotieven, de originele kasten zijn er nog, en boven de trap hangen twee grote abstracte glas-in-loodramen.

      Cornelis Kruyswijk ontwierp de school in 1930 voor de Vereeniging tot Stichting en Instandhouding van Christelijke Scholen te Sloterdijk. Ze is vernoemd naar Pieter Oosterlee (1863–1930), pedagoog, schrijver en pleitbezorger van christelijk onderwijs. Toen in 1920 de schoolstrijd voorbij was, kregen bijzondere scholen evenveel geld van de overheid als openbare, en er werd volop gebouwd, meestal door particuliere architecten. Kruyswijk kreeg 21 schoolopdrachten, waarvan 12 in Amsterdam, en het register zet deze school samen met die aan de Titiaanstraat bij zijn meest verfijnde werk. Nu zit hier De Kleine Prins, een school voor zeer moeilijk opvoedbare kinderen.

      De voorgevel sluit naadloos aan op de straatwand en springt er toch uit door het materiaal. De school staat precies in de zichtlijn van de Van Middellandtstraat.

      Let op:
      - banden lichte natuursteen tussen de rode baksteen in de brede plint en rond de ramen van de gymzaal
      - de verdiepte ingang met blokvormige beelden aan weerszijden en een verweerde inscriptie waarin P. Oosterlee genoemd wordt
      - granieten reliëfs van een vogel en een bloem bij de ingang
      - de erker aan de noordkant, ooit de kamer van het schoolhoofd
    attributes:
      original_use: Christelijke lagere school
    sources:
      - https://data.amsterdam.nl/monumenten/c5f4b509-656b-40da-b25b-6a49297bf5cc

- title: Paramaribostraat housing by Piet Kramer
  summary: "A 1924 Piet Kramer housing ensemble in the Westindische Buurt, north of the Surinameplein, listed as a municipal monument on 30 June 1992, the same day as Plan West blocks by Wijdeveld, Roodenburgh and Staal."
  body: |
    In Plan West, in the streets named after places in Suriname and the Antilles (the city called the area the Westindische Buurt; today it is known as the Postjesbuurt), Piet Kramer designed the blocks along the Paramaribostraat and the Marowijnestraat (1924). The city dates his housing on the Hoofdweg to 1923-1925. The city listed the ensemble on 30 June 1992, the same day as Wijdeveld's Hoofdweg blocks, Roodenburgh's Vespuccistraat and Staal's Jan Evertsenstraat.

    The city has not published a description for this monument, so there is little written about it. It is worth comparing with Kramer's Hoofdweg blocks.

    Look for:
    - the corner of the Paramaribostraat and the Marowijnestraat, where the blocks turn
    - grouped porch entrances between brick piers
  category: housing
  lat: 52.362102
  lng: 4.854145
  address: Paramaribostraat 40-133, Marowijnestraat 1-11
  links:
