  nl:
    title: Mercatorplein
    summary: "Het plein van Berlage in het hart van Plan West: vier bij elkaar passende bakstenen wanden, winkelgalerijen en een hoge toren bij de poort. De noordwand werd in de jaren negentig gesloopt en naar het oorspronkelijke ontwerp herbouwd."
    body: |
      Wat je aan de noordkant ziet, is grotendeels een kopie uit de jaren negentig, zo trouw mogelijk nagebouwd. De noordelijke toren werd in 1961 al afgebroken omdat hij te bouwvallig was. Na jaren van verval ging vanaf 1995 de hele noordwand plat, en die werd met toren en al opnieuw opgetrokken. In 1998 ging het vernieuwde plein weer open.

      H.P. Berlage ontwierp het Mercatorplein als middelpunt van Plan West. Van hem zijn alle vier de pleinwanden (1925–1927), maar niet de woningen erachter. De naam kreeg het plein in 1924, naar de cartograaf Gerardus Mercator. De noord- en zuidwand zijn van rode baksteen, de oost- en westwand grotendeels geelbruin, en alles staat op een plint van ruw natuursteen. De Hoofdweg steekt het plein over met een verspringing, en de zijstraten komen binnen via poortgebouwen.

      Er gebeurde hier meer. In 1948 werd een melkzaak aan het plein de eerste zelfbedieningswinkel van Amsterdam, het begin van de supermarktketen van Dirk van den Broek. En sinds 2019 prijkt op de liftschacht van de parkeergarage een portret van wijlen burgemeester Eberhard van der Laan.

      Let op:
      - de toren van acht lagen naast de poort naar de Van Spilbergenstraat, en zijn herbouwde tweelingbroer in het noorden
      - winkelgalerijen op zware bakstenen pijlers, met meanderbanden en figuratief beeldhouwwerk op de hoeken
      - de kleurwissel tussen de rode en de geelbruine wanden
    attributes:
      built: 1925–1927 (noordwand herbouwd 1995–1998)
      original_use: Arbeiderswoningen en winkels
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/527135
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/527136
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/527137
      - https://nl.wikipedia.org/wiki/Mercatorplein_(Amsterdam)

- title: Hoofdweg housing by Wijdeveld
  summary: "Hendrik Wijdeveld's long blocks north of the Mercatorplein: unbroken window bands, rounded cantilevered bays and a \"city gate\" of towers at the Jan van Galenstraat."
  body: |
    Hendrik Wijdeveld, editor of the Amsterdam School magazine *Wendingen*, designed the street walls on both sides of the Hoofdweg between the Mercatorplein and the Jan van Galenstraat (1925–1926). The floor plans came from the office of Gulden & Geldmaker and the developer was Heere van der Schaar; Wijdeveld only drew the façades. In 1927 *Wendingen* devoted an issue to Amsterdam West.

    The four-storey walk-up blocks are emphatically horizontal. A continuous window band runs the full length of each block, the top floor is treated differently from those below, and the floor cantilevers out into a round bay at each end. At the Jan van Galenstraat the blocks rise into corner towers that form a *stadspoort* (city gate). The northern half of that gate lies across the street in Bos en Lommer and is on this map separately.

    Look for:
    - the unbroken window strips and the projecting vertical brick bands
    - round, cantilevered bays at the block ends
    - hoist beams poking just above the roofline
  category: housing
  lat: 52.371347
  lng: 4.849305
  address: Hoofdweg 308-386 and 321-403, Jan van Galenstraat 283-293
