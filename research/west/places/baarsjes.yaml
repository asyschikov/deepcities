  nl:
    title: Woongebouwen Hoofdweg (Wijdeveld)
    summary: "Hendrik Wijdeveld, hoofdredacteur van Wendingen, tekende hier alleen de gevels. Hij maakte er lange blokken van met ononderbroken raamstroken, ronde erkers die naar voren kragen en bij de Jan van Galenstraat een 'stadspoort' van torens."
    body: |
      De plattegronden waren niet van hem. Die kwamen van het bureau Gulden & Geldmaker, en Heere van der Schaar was de opdrachtgever. Hendrik Wijdeveld, de hoofdredacteur van het Amsterdamse School-blad *Wendingen*, kreeg in 1925–1926 alleen de buitenkant: de straatwanden aan weerszijden van de Hoofdweg, van het Mercatorplein tot de Jan van Galenstraat. In 1927 wijdde *Wendingen* een heel nummer aan Amsterdam West.

      Het zijn portiekwoningen van vier hoog, maar wat je ziet zijn lijnen. Elk blok heeft over de hele lengte één doorgaande band van ramen. De bovenste verdieping is anders behandeld dan de lagen eronder, en aan de koppen schuift de verdieping naar voren in een ronde erker. Bij de Jan van Galenstraat lopen de blokken op tot hoektorens die samen een *stadspoort* vormen. De noordelijke helft van die poort staat aan de overkant, in Bos en Lommer, en heeft op deze kaart een eigen plek.

      Let op:
      - de ononderbroken raamstroken en de verticale banden van baksteen die naar voren steken
      - de ronde erkers aan de uiteinden, die uit de gevel kragen
      - de hijsbalken die net boven de daklijn uitkomen
    attributes:
      architect: H.Th. Wijdeveld (gevels); Gulden en Geldmaker (plattegronden)
      original_use: Arbeiderswoningen en winkels
    sources:
      - https://www.architectuur.org/bouwwerk/530/Woongebouwen.html
      - https://data.amsterdam.nl/monumenten/f084083e-7ad5-4ee0-9f30-dd260ec27f06

- title: Hoofdweg housing by Piet Kramer
  summary: Piet Kramer's long street walls on the southern Hoofdweg, rising to six-storey gate blocks at the Postjesweg and punctuated by stairwell strips that end in wavy brick pylons.
  body: |
    Piet Kramer, co-author of the Scheepvaarthuis and of De Dageraad, designed the blocks on both sides of the southern Hoofdweg in 1923. They hold downstairs and upstairs flats for working-class tenants, with small shops on the corners and a cluster of shops at the Postjesweg crossing. Giving both sides of the street to one architect was deliberate: the Hoofdweg was meant to read as a single avenue leading to the Mercatorplein.

    Kramer is more restrained here than in his Spaarndammerbuurt work. The register speaks of "seemingly endless rows of windows" in long, flat walls of red or brownish-grey brick. The sculpture is saved for the entrances, the projecting stairwell strips and the corners, where the walls rise and curve. Renovation took away much original detail, but the character is still clear.

    Look for:
    - the six-storey corner blocks at the Postjesweg, acting as a gateway
    - doorways grouped under shared canopies between sculpted brick piers
    - stairwell strips rising to pylon-like tops with wavy bands
    - the kink in the façades where the road bends near the Davisstraat
  category: housing
  lat: 52.365613
  lng: 4.853486
  address: Hoofdweg 54-241, Davisstraat 54-171
  links:
