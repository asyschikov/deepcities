# De Baarsjes (Chassébuurt, Geuzenbuurt, Hoofdweg e.o., Van Galenbuurt, Westindische Buurt).
# Part 1: 29 monument places (every monument in the slice, merged into ensembles; see notes/baarsjes.md).
# Part 2: 12 non-monument C-list places. Dutch texts are spliced from the Dutch sources listed per place.

# ================================================================ Part 1: monuments

- title: Westerwijk
  summary: "One of Ferdinand Jantzen's first buildings, a 1926 Reformed community house with flats above, a library in the basement and a Frank Lloyd Wright-style hall hidden in the garden."
  body: |
    Three years before his Jeruzalemkerk, the young architect Ferdinand Jantzen designed this *wijkgebouw* (neighbourhood house) for the Dutch Reformed congregation of Sloterdijk, whose membership grew with the building boom in the brand-new Baarsjes. The street block held a meeting hall, rooms for Sunday school and youth clubs, a doctor's room and a lending library in the basement, with flats on the upper floors. Jantzen lived at no. 152 himself.

    Behind the front, half sunk into the garden, is an auditorium for about 350 people. The city register sees two architectures in one building: Amsterdam School on the street, and the low, horizontal manner of Frank Lloyd Wright in the garden hall. Original window frames, colourful leaded glass and an electric wall clock survive inside. A Christian community, still called Westerwijk, uses the building, and its halls are also rented out to others, such as the food bank.

    Look for:
    - the brown-brick front with a stepped-back middle section and taller side bays
    - the dark stone base that meanders around the triple entrance
    - WESTERWIJK in bronze-coloured wrought letters above the middle door
  category: religious
  lat: 52.37405
  lng: 4.858979
  address: Admiraal de Ruijterweg 148-152
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/ffe7a1ac-16ea-4dee-bece-cadb1256ee56" }
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Westerwijk_(Amsterdam)" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q24073966" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "200676"
    built: 1925–1926
    architect: F.B. Jantzen
    listed: 2013
    original_use: Church community centre with flats
  photos:
    - commons:File:Westerwijk, overzicht.jpg
    - commons:File:Admiraal de Ruijterweg 148-152 (1).jpg
  sources:
    - city:200676 (register text)
    - research/ams-school/places/oud-west-baarsjes.yaml (Westerwijk)
    - https://nl.wikipedia.org/wiki/Westerwijk_(Amsterdam)
  nl:
    title: Westerwijk
    summary: "Een van de eerste gebouwen van Ferdinand Jantzen: een hervormd wijkgebouw uit 1926 met woningen erboven, een bibliotheek in de kelder en, verstopt in de tuin, een zaal in de trant van Frank Lloyd Wright."
    body: |
      Van de straat zie je het niet, maar achter deze gevel ligt een zaal voor zo'n 350 mensen, half weggezakt in de tuin. Het gemeentelijk monumentenregister ziet twee bouwstijlen in één gebouw: Amsterdamse School aan de straat, en in de tuinzaal de lage, liggende vormen van Frank Lloyd Wright.

      Drie jaar voor zijn Jeruzalemkerk ontwierp de jonge architect Ferdinand Jantzen dit wijkgebouw voor de Nederlands Hervormde Gemeente van Sloterdijk. Die groeide flink mee met de bouwgolf in de gloednieuwe Baarsjes. In het blok zaten een zaal voor bijeenkomsten, lokalen voor zondagsschool en jeugdclubs, een dokterskamer en in de kelder een uitleenbibliotheek, met woningen op de verdiepingen. Jantzen woonde zelf op nummer 152.

      Binnen zijn nog originele kozijnen, kleurig glas in lood en een elektrische wandklok te vinden. Het gebouw wordt gebruikt door een christelijke leefgemeenschap die nog altijd Westerwijk heet, en de zalen worden ook verhuurd, onder meer aan de Voedselbank.

      Let op:
      - de gevel van bruine baksteen met een teruggezet middendeel en hogere zijtraveeën
      - de donkere stenen plint die rond de drievoudige ingang meandert
      - WESTERWIJK in bronskleurige smeedletters boven de middelste deur
    attributes:
      original_use: Kerkelijk wijkgebouw met bovenwoningen
    sources:
      - https://data.amsterdam.nl/monumenten/ffe7a1ac-16ea-4dee-bece-cadb1256ee56
      - https://nl.wikipedia.org/wiki/Westerwijk_(Amsterdam)

- title: Geuzenhof
  summary: "A 1930s block of 580 flats around a shared garden that was Mien Ruys's very first design for a housing estate, with storage on the ground floor, a shower in every flat and a war-year plaque on the corner."
  body: |
    The builder-developer H. van Saane wanted good homes at fair rents and looked to Frankfurt and Vienna for ideas. On the Willem de Zwijgerlaan he built the Geuzenhof in two phases: the northern block by J. Dunnebier (1933–1935, 484 flats and four shops) and, after a pause for lack of money, the southern block by J.F. Berghoef with Dunnebier (1939–1940). It followed Cornelis van Eesteren's 1930 street plan for this corner of the city.

    Van Saane experimented. The storerooms went to the ground floor instead of the attic, every flat had its own shower, and central heating came from one boiler house. A clever double staircase in each porch saved space. Behind the walls lies a communal garden, the first housing project by the landscape architect Mien Ruys (1935). It had lawns, rose beds, a pond, play areas and even an aviary. Wide galleries along the back gave children a dry place to play. The residents founded their own club, *Wonen en Werken* (Living and Working), with a monthly magazine.

    Look for:
    - Dunnebier's yellow-brick walls with chimneys set diagonally on the façade, and GEUZENHOF in bronze letters on the west side
    - Berghoef's taller, more monumental southern part with white-framed bays and diamond-cut brackets under the cornice
    - the plaque on the Admiraal de Ruijterweg corner: a mother nursing a child, sailing ships, an archer and "Gebouwd in het Oorlogsjaar 1940"
    - the gates in the short ends, with a glimpse of the Ruys garden
  category: housing
  lat: 52.372563
  lng: 4.864137
  address: Willem de Zwijgerlaan, Adriaan van Bergenstraat 1-8, Admiraal de Ruijterweg 28-36, Korte Geuzenstraat 5-11
  links:
    - { label: Monumentenregister Amsterdam (200722), url: "https://data.amsterdam.nl/monumenten/4c8db1fa-ecb4-4405-8e91-e2624afa04ee" }
    - { label: Monumentenregister Amsterdam (200723), url: "https://data.amsterdam.nl/monumenten/65f3c4a2-bd2b-4500-ac8f-55a2ca7500ca" }
  attributes:
    heritage_status: Municipal monument
    monument_number: 200722, 200723
    built: 1933–1935, 1939–1940
    architect: J. Dunnebier; J.F. Berghoef (southern part); garden by Mien Ruys
    listed: 2014
    original_use: Housing with shops and a residents' club house
  photos:
    - commons:File:Geuzenhof, Amsterdam, 2024.jpg
    - commons:File:Geuzenhof, Amsterdam, 1935.jpg
    - commons:File:Geuzenhof, Treppeneingang, 2024.jpg
    - commons:File:Admiraal de Ruijterweg 28-36 (1).jpg
  sources:
    - city:200722, city:200723 (register texts)
  nl:
    title: Geuzenhof
    summary: "Een blok uit de jaren dertig met 580 woningen rond een gedeelde tuin, het allereerste woningbouwontwerp van Mien Ruys. Bergingen beneden, een douche in elke woning en op de hoek een plaquette uit het oorlogsjaar 1940."
    body: |
      Aannemer-ontwikkelaar H. van Saane wilde goede woningen voor een redelijke huur en haalde zijn ideeën uit Frankfurt en Wenen. Aan de Willem de Zwijgerlaan bouwde hij de Geuzenhof in twee etappes: eerst het noordelijke blok van J. Dunnebier (1933-1935, 484 woningen en vier winkels), daarna, na een pauze omdat het geld op was, het zuidelijke blok van J.F. Berghoef samen met Dunnebier (1939-1940). Het geheel volgt het stratenplan dat Cornelis van Eesteren in 1930 voor dit stuk stad tekende.

      Van Saane probeerde dingen uit. De bergingen kwamen niet op zolder maar beneden, elke woning kreeg een eigen douche en de warmte kwam uit één centrale installatie. Een slimme dubbele trap in elk portiek scheelde ruimte. Achter de gevels ligt een gemeenschappelijke tuin, het eerste woningbouwproject van tuinarchitect Mien Ruys (1935). Er waren grasvelden, rozenperken, een vijver, speelplekken en zelfs een volière. Brede galerijen aan de achterkant gaven kinderen een droge plek om te spelen. De bewoners richtten hun eigen vereniging op, Wonen en Werken, met een maandblad.

      Let op:
      - de gele bakstenen gevels van Dunnebier met schuin op de gevel gezette schoorstenen, en GEUZENHOF in bronzen letters aan de westkant
      - het hogere, monumentalere zuidelijke deel van Berghoef, met wit omlijste erkers en klossen met diamantkop onder de daklijst
      - de plaquette op de hoek met de Admiraal de Ruijterweg: een moeder die een kind de borst geeft, zeilschepen, een boogschutter en 'Gebouwd in het Oorlogsjaar 1940'
      - de poorten in de korte zijden, met een doorkijk naar de tuin van Ruys
    attributes:
      architect: J. Dunnebier; J.F. Berghoef (zuidelijk deel); tuin Mien Ruys
      original_use: Etagewoningen met winkels en een verenigingsgebouw
    sources:
      - https://data.amsterdam.nl/monumenten/4c8db1fa-ecb4-4405-8e91-e2624afa04ee
      - https://data.amsterdam.nl/monumenten/65f3c4a2-bd2b-4500-ac8f-55a2ca7500ca

- title: Oranjehof
  summary: "An eight-storey block of small flats for single women, built in the middle of the war, with a name that pointed to the war years and \"Dum spiro spero\" (while I breathe, I hope) carved into the façade."
  body: |
    The developer H. van Saane, who had earlier built the nearby Geuzenhof (1933), commissioned this tower for *alleenstaande vrouwen* (single women) in 1941. It held 108 small one- and two-room flats plus 28 boarding rooms and guest rooms, with a dining room, a lounge, a shop, a laundry, a bicycle store, lifts, a rubbish chute and telephone and radio connections. Right after the war it was held up, also abroad, as a model for housing single women. Today it contains owner-occupied flats.

    It was the first building by the architect couple Joop Pot and Koos Pot-Keegstra. She was the first woman to graduate from the Amsterdam architecture school (Hooger Bouwkunst Onderricht), and the pair went on to become important housing architects in post-war Amsterdam. The design joins the ideals of the Nieuwe Bouwen (Dutch modernism) to a historical building type and a little ornament. The name and the Latin mottos on the front and back, *Domum parvam sed meam* (a small house, but mine) and *Dum spiro spero* (while I breathe, I hope), referred, the register says, to the war years.

    Look for:
    - the tall, symmetrical slab of pale yellow brick laid in staand verband, with the top floor set back
    - the low entrance building with ORANJEHOF in small bronze letters, an old lantern and the year 1942 in relief above the cornice
    - access galleries on a visible concrete frame on the north-west side, with some original steel windows
  category: housing
  lat: 52.370581
  lng: 4.864938
  address: Korte Geuzenstraat 98-700, Admiraal de Ruijterweg 26
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/c10c6d70-e7c0-42a4-acf0-90d10d467b2f" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "200728"
    built: 1941–1942
    architect: J.W.H.C. Pot and J.F. Pot-Keegstra
    listed: 2013
    original_use: Flats and boarding rooms for single women
  photos:
    - commons:File:2022 Oranjehof, Asd.jpg
    - commons:File:Admiraal de Ruijterweg 26 (1).jpg
  sources:
    - city:200728 (register text; text gives 1941–1942, register metadata 1943–1945)
  nl:
    title: Oranjehof
    summary: "Een woontoren van acht lagen met kleine flats voor alleenstaande vrouwen, midden in de oorlog gebouwd. De naam verwees naar die oorlogsjaren, net als het 'Dum spiro spero' (zolang ik adem, hoop ik) dat in de gevel staat."
    body: |
      Midden in de bezetting kreeg een nieuw flatgebouw op voor- en achtergevel twee Latijnse spreuken: 'Dum spiro spero', zolang ik adem, hoop ik, en 'Domum parvam sed meam', klein, maar mijn eigen huis. Volgens het gemeentelijk monumentenregister verwezen die spreuken en de naam Oranjehof naar de oorlogsjaren.

      Opdrachtgever was ontwikkelaar H. van Saane, die eerder het nabije Geuzenhof (1933) had gebouwd. In 1941 bestelde hij deze toren voor alleenstaande vrouwen. Er kwamen 108 kleine flats van één of twee kamers, plus 28 pensionkamers en logeerkamers, met eetzaal, conversatiezaal, winkeltje, wasserij, fietsenstalling, liften, een vuilstortkoker en aansluitingen voor telefoon en radio. Vlak na de oorlog gold het gebouw, ook in het buitenland, als voorbeeld van hoe je alleenstaande vrouwen huisvest. Tegenwoordig zijn het koopappartementen.

      Het was het eerste gebouw van het architectenechtpaar Joop Pot en Koos Pot-Keegstra. Zij was de eerste vrouw die afstudeerde aan het Hooger Bouwkunst Onderricht in Amsterdam, en samen werden ze belangrijke woningbouwarchitecten in het naoorlogse Amsterdam. Het ontwerp koppelt de idealen van het Nieuwe Bouwen aan een historisch gebouwtype en een beetje ornament.

      Let op:
      - de hoge, symmetrische schijf van lichtgele baksteen in staand verband, met de bovenste verdieping teruggelegd
      - het lage entreegebouw met ORANJEHOF in kleine bronzen letters, een oude lantaarn en het jaartal 1942 in reliëf boven de daklijst
      - galerijen op een zichtbaar betonskelet aan de noordwestkant, met hier en daar nog originele stalen ramen
    attributes:
      architect: J.F. Pot-Keegstra en J.W.H.C. Pot
      original_use: Woongebouw voor alleenstaande vrouwen
    sources:
      - https://data.amsterdam.nl/monumenten/c10c6d70-e7c0-42a4-acf0-90d10d467b2f

- title: Drukkerij Senefelder
  summary: "A 1910 printing works with a statue of Aloys Senefelder, the Bavarian who invented lithography, standing under a granite canopy above the door, and the firm's name still cut out in iron on the roof."
  body: |
    In 1910 the Amsterdam printing firm Senefelder left its premises on the Looiersgracht because the switch from lithographic presses to offset presses needed a bigger building. The architects J.W.F. Hartkamp jr. and P.H. van Niftrik built it this factory on the Admiraal de Ruijterweg, then still in the municipality of Sloten. The firm was not named after its founder but after Aloys Senefelder, who invented lithography in Bavaria in 1796. The printing works stayed here until well into the second half of the 20th century and later merged into Henkes Senefelder in Purmerend.

    Hartkamp was a pupil of Berlage, and it shows: plain brown brick, heavy granite lintels and sills, and a façade that looks symmetrical at first but follows the different rooms behind it. Small corner towers give the industrial building an almost medieval air. A supermarket now fills part of the ground floor, and people live in the rest.

    Look for:
    - the statue of Senefelder under a granite canopy above the arched main entrance, with ALOYS SENEFELDER beneath it
    - the iron plates with the cut-out words DRUKKERIJ and SENEFELDER between the pinnacles on the south corner
    - double bands of yellow brick and big wooden dormers in the steep slate roof
  category: industrial
  lat: 52.371224
  lng: 4.862038
  address: Admiraal de Ruijterweg 56
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/3f2b12a1-42cc-4855-b501-95dc0a4e967a" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "200675"
    built: "1910"
    architect: J.W.F. Hartkamp jr. and P.H. van Niftrik
    listed: 2013
    original_use: Printing works with offices
  photos:
    - commons:File:Admiraal de Ruijterweg 56, Aloys Senefelder, Drukkerij pic1.JPG
    - commons:File:Aloys Senefelder (beeld).jpg
    - commons:File:Admiraal de Ruijterweg 56, Aloys Senefelder, Drukkerij pic3.JPG
  sources:
    - city:200675 (register text)
  nl:
    title: Drukkerij Senefelder
    summary: "Een drukkerij uit 1910 met boven de deur, onder een granieten afdak, een beeld van Aloys Senefelder, de Beier die de steendruk uitvond. Op het dak staat de bedrijfsnaam nog in ijzer uitgezaagd."
    body: |
      De man boven de deur heeft het bedrijf niet opgericht. Drukkerij Senefelder noemde zich naar Aloys Senefelder, die in 1796 in Beieren de lithografie bedacht, en zette hem als beeld op de gevel. In 1910 verliet de Amsterdamse drukkerij de Looiersgracht: de steendrukpers maakte plaats voor de offsetpers, en daarvoor was een groter gebouw nodig. Architecten J.W.F. Hartkamp jr. en P.H. van Niftrik bouwden deze fabriek aan de Admiraal de Ruijterweg, toen nog grondgebied van de gemeente Sloten. Tot ver na 1950 werd hier gedrukt; later ging het bedrijf op in Henkes Senefelder in Purmerend.

      Hartkamp had bij Berlage in de leer gezeten, en dat zie je: sobere bruine baksteen, zware granieten lateien en dorpels, en een gevel die op het eerste gezicht symmetrisch lijkt maar zich voegt naar de verschillende ruimtes erachter. Torentjes op de hoeken geven het fabrieksgebouw iets middeleeuws. In een deel van de begane grond zit nu een supermarkt, in de rest wordt gewoond.

      Let op:
      - het beeld van Senefelder onder een granieten afdak boven de rondboogingang, met ALOYS SENEFELDER eronder
      - de ijzeren platen met de uitgezaagde woorden DRUKKERIJ en SENEFELDER tussen de pinakels op de zuidhoek
      - dubbele banden van gele steen en forse houten dakkapellen in het steile leien dak
    attributes:
      original_use: Drukkerij met opslag- en kantoorruimtes
    sources:
      - https://data.amsterdam.nl/monumenten/3f2b12a1-42cc-4855-b501-95dc0a4e967a

- title: Former police post and fire station, Baarsjesweg
  summary: "The little village police post of Sloten, with a cell, a constable's flat and a fire-engine shed: a step-gabled survivor from the days when the Baarsjes was a hamlet outside Amsterdam."
  body: |
    Until 1921 this side of the Kostverlorenvaart belonged to the rural municipality of Sloten. Around 1910 Sloten's public works department built this combined police post and *brandspuitbergplaats* (fire-engine shed) for the hamlet of De Baarsjes, right on the border with Amsterdam. It had a cell and a flat for the *veldwachter* (village constable) upstairs. The fire engine left after the annexation, but the police stayed for some time. It is now a house.

    The anonymous designer chose Dutch neo-Renaissance, a style that looked back to the Golden Age and was already old-fashioned by then. With the low workers' houses of the Slatuinenweg around the corner, it is one of the last traces of the old hamlet. Its twin in spirit is the tiny police post on the village square of Sloten, said to be the smallest in the Netherlands.

    Look for:
    - two step gables with stone copings and a brick pinnacle
    - the large round-arched double door where the fire engine came out
    - bars in front of the window on the garden side, a reminder of the cell
    - an iron electricity cabinet from the 1920s or 1930s by the west door
  category: civic
  lat: 52.369155
  lng: 4.863648
  address: Baarsjesweg 136
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/c8a47078-4267-4d0c-8365-de0a65bd5c7d" }
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/De_Baarsjes_(buurtschap)" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "200678"
    built: c. 1910
    architect: Gemeentewerken Sloten
    listed: 2013
    original_use: Police post, constable's house and fire-engine shed
  photos:
    - commons:File:2022 Baarsjesweg 136, Asd (1).jpg
    - commons:File:Baarsjesweg, hoek Slatuinenweg.JPG
  sources:
    - city:200678 (register text says c. 1910; register metadata gives 1928)
    - https://nl.wikipedia.org/wiki/De_Baarsjes_(buurtschap)
  nl:
    title: Voormalige politiepost en brandspuitbergplaats Baarsjesweg
    summary: "Het politiepostje van de dorpsgemeente Sloten, met een cel, een woning voor de veldwachter en een hok voor de brandspuit. Een gebouwtje met trapgevels uit de tijd dat De Baarsjes nog een buurtschap was, net buiten Amsterdam."
    body: |
      Tot 1921 hoorde deze kant van de Kostverlorenvaart bij Sloten, een plattelandsgemeente. Rond 1910 liet de dienst Gemeentewerken van Sloten hier, pal op de grens met Amsterdam, een politiepost met brandspuitbergplaats neerzetten voor de buurtschap De Baarsjes. Er zat een cel in, en boven woonde de veldwachter. Na de annexatie verdween de brandspuit, maar de politie bleef nog een poos. Nu woont er gewoon iemand.

      Wie het ontwierp, is niet bekend. Wel koos die onbekende ontwerper voor Hollandse neorenaissance, een stijl die terugblikte op de Gouden Eeuw en rond 1910 eigenlijk al uit de mode was. Samen met de lage arbeidershuisjes van de Slatuinenweg om de hoek is het een van de laatste sporen van de oude buurtschap. Een broertje in geest staat op het dorpsplein van Sloten: daar zit een politiepost die de kleinste van Nederland zou zijn.

      Let op:
      - twee trapgevels met natuurstenen dekstukken en een gemetselde pinakel
      - de grote dubbele deur onder een rondboog, waar de brandspuit naar buiten reed
      - de tralies voor het raam aan de tuinkant, een herinnering aan de cel
      - bij de westelijke deur een ijzeren elektriciteitskast, ergens uit de jaren twintig of dertig
    attributes:
      architect: Gemeentewerken Sloten
      original_use: Politiepost met veldwachterswoning en brandspuitbergplaats
    sources:
      - https://data.amsterdam.nl/monumenten/c8a47078-4267-4d0c-8365-de0a65bd5c7d
      - https://nl.wikipedia.org/wiki/De_Baarsjes_(buurtschap)

- title: Bethelkerk and Magalhaensplein
  summary: "A \"little town\" on the Magalhaensplein: a 1929 Reformed church with a steep tent roof, its church hall, a former police post and health centre, and a school, stepping up towards one roof turret."
  body: |
    Each denomination claimed its corner of Plan West: the Dutch Reformed built the Jeruzalemkerk, the Catholics the Chassékerk, and the stricter *Gereformeerden* (Reformed) this Bethelkerk. Architect E.A.C. Roest first built a church hall on the Cabotstraat (1925–1926) and then the church itself (1928–1929). Around it the city's Public Works department added a police post with an office of the GG&GD (municipal health service) on the Magalhaensplein (1928), and J.H. van der Veen a Christian school on the Willem Schoutenstraat (1931–1933).

    The register calls the result a *klein stadje* (little town) or intimate *hofje*. Seen from the square, the one-storey gabled buildings step up to the two-storey church hall with its mansard roof and then to the church, whose steep tent roof and 12-metre turret are expressive in the manner of Michel de Klerk. The church is now used by an evangelical congregation.

    Look for:
    - the tent roof and roof turret rising above the red-tiled roofscape
    - square dormers cutting through the church's eaves
    - the symmetrical former police and health-centre front closing off the Magalhaensplein
    - Van der Veen's school with projecting iron-framed upper windows
  category: religious
  lat: 52.367974
  lng: 4.854867
  address: Vasco da Gamastraat 35, Cabotstraat 33-37, Magalhaensplein 2, Willem Schoutenstraat 6-12
  links:
    - { label: Monumentenregister Amsterdam (200679), url: "https://data.amsterdam.nl/monumenten/baa97141-dc98-44fe-a5aa-9269db133df8" }
    - { label: Monumentenregister Amsterdam (200680), url: "https://data.amsterdam.nl/monumenten/efcfa2f6-303b-42c7-bd7b-6a3b438f2f6f" }
    - { label: Monumentenregister Amsterdam (200686), url: "https://data.amsterdam.nl/monumenten/e88b8cf4-d1f9-4dbb-8a46-93607575ff02" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q118170598" }
  attributes:
    heritage_status: Municipal monument
    monument_number: 200679, 200680, 200686
