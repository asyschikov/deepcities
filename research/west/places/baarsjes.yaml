  photos:
    - commons:File:Cabralstraat - De Wissel lagere school.jpg
  sources:
    - city:200681 (register text)
    - research/ams-school/places/oud-west-baarsjes.yaml (Cabralschool)
    - "Round 4 merge: https://www.dewestkrant.nl/eerste-gifvrije-tuincentrum-van-de-stad-in-midwest/ (10 Apr 2026: De Inheemse Plantenwinkel opens in MidWest, organic, pesticide-free, mostly native plants; tour of the two special inner gardens with wild plants, frogs, bees, salamanders and birds; open Wed to Sat 12.00 to 17.00; Cabralstraat 1); https://www.dewestkrant.nl/verborgen-tuinen-weer-te-bezichtigen-tijdens-open-tuinen-west/ (Open Tuinen West 13 June 2026, MidWest gardens open). Scout's compost greenhouse, honey and canteen not confirmed, left out."
    - "https://www.dewestkrant.nl/verborgen-tuinen-weer-te-bezichtigen-tijdens-open-tuinen-west/"
  nl:
    title: Cabralschool
    summary: "Een dubbele school uit 1924 die dwars door een woonblok loopt, van straat tot straat, met bijna blinde bakstenen koppen en twee slanke torens. Volgens de gemeente is die inpassing uniek in Amsterdam."
    body: |
      Deze school staat niet aan de straat, maar ertussen. Publieke Werken tekende in 1924 een dubbele *gangschool* en legde die dwars in een bouwblok, zodat hij de Cabralstraat met de Marco Polostraat verbindt en het blok aan beide kanten openbreekt. Elke school had een eigen ingang aan een van de koppen; de gymzaal deelden ze, en branddeuren hielden de twee helften gescheiden. Het gemeentelijke monumentenregister noemt deze manier om een blok te doorsnijden uniek in Amsterdam.

      Later kwam het gebouw bij een katholieke parochie, die er meerdere scholen in onderbracht. Daarna stond het jaren leeg en trokken er krakers in. In 2013 ging de buurt zelf op zoek naar een nieuwe bestemming; na een verbouwing werd het bedrijfsverzamelgebouw MidWest. De stijl is Amsterdamse School met een kubistische inslag: rode baksteen voor de plint en rond de deuren, gele erboven, en grote vlakken metselwerk met nauwelijks een raam.

      Let op:
      - de twee hoge, slanke torens aan de westkant, bakens in de buurt
      - de ladderramen boven de deuren, tussen bolle muurdelen
      - de kleine golvende muurdammen op de hoeken van de zuidgevel
      - de originele deur aan de kant van de Marco Polostraat
      - de twee binnentuinen van MidWest, waar wilde planten, kikkers, salamanders, bijen en vogels een plek hebben, open tijdens Open Tuinen West (juni 2026); sinds april 2026 zit er ook een klein gifvrij winkeltje met tuinplanten, waarvan veel inheems (woensdag tot en met zaterdag, 12 tot 17 uur)
    attributes:
      original_use: Twee lagere scholen
    sources:
      - https://data.amsterdam.nl/monumenten/2d0d009f-719a-4aac-b35d-c0c8e979ab8e
      - https://nl.wikipedia.org/wiki/Cabralstraat_1
      - https://www.dewestkrant.nl/eerste-gifvrije-tuincentrum-van-de-stad-in-midwest/

- title: Columbusplein housing (Noorlander)
  summary: "The housing walls around the Columbusplein, designed by Willem Noorlander in 1923–1925 in De Baarsjes and now being added to the city's monument list."
  body: |
    The Columbusplein, like the Mercatorplein, Magalhaensplein and Balboaplein, was already in the expansion plans of the old municipality of Sloten: an open space in a mostly right-angled street grid. The working-class housing around it was designed by Willem Noorlander and built in 1923–1925. Noorlander's varied Amsterdam work includes two villas on the Meeuwenlaan (1912), the Theater Ceintuurbaan (1921) and a housing complex for the Rochdale housing association in Oud-West (1913–1915), which the city's description of that monument links to this one.

    The city has started the procedure to make the ensemble a municipal monument; at the time of writing it is "in procedure" and no official description has been published yet. The square is also the setting of the Visserschool by Commer de Geus and of the De Baarsjes 4 May memorial.

    Look for:
    - how the housing walls frame the square, with the Visserschool on its north side
  category: housing
  lat: 52.365768
  lng: 4.855848
  address: Columbusplein 1-41 and surroundings
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/932cedff-6bf8-4907-a50f-1831828db318" }
    - { label: "Monumentenregister Amsterdam (Noorlander, Oud-West)", url: "https://data.amsterdam.nl/monumenten/9bf25d7d-47e8-4a97-8c34-341392f8f53c" }
  attributes:
    built: 1923–1925
    architect: W. Noorlander
    original_use: Housing
  photos: []
  sources:
    - city register record 932cedff (status "In procedure Gemeentelijk Monument", no text)
    - city:224012 (register text of Noorlander's Oud-West complex, which names the Columbusplein complex, 1923–1925)
    - "https://data.amsterdam.nl/monumenten/3ec5bc91-e345-4a22-befd-19099100903b"
    - "https://stadscuratorium.nl/?p=3504"
  nl:
    title: Woningbouw Columbusplein (Noorlander)
    summary: "Arbeiderswoningen rond het Columbusplein in De Baarsjes, in 1923-1925 ontworpen door Willem Noorlander. De gemeente is bezig ze tot gemeentelijk monument te maken, maar een officiële beschrijving is er nog niet."
    body: |
      Het Columbusplein bestond al op papier toen dit nog de gemeente Sloten was. Samen met het Mercatorplein, het Magalhaensplein en het Balboaplein stond het in de uitbreidingsplannen van die gemeente: een open plek in een verder vrij haaks stratenpatroon.

      De arbeiderswoningen eromheen zijn van Willem Noorlander en kwamen in 1923-1925 tot stand. Noorlander had een veelzijdig Amsterdams oeuvre: twee villa's aan de Meeuwenlaan (1912), het Theater Ceintuurbaan (1921) en een complex voor bouwvereniging Rochdale in Oud-West (1913-1915). In de gemeentelijke beschrijving van dat laatste monument wordt het Columbusplein er expliciet bij genoemd.

      De gemeente is de procedure gestart om het geheel tot gemeentelijk monument aan te wijzen. Op dit moment staat het 'in procedure' en is er nog geen officiële beschrijving gepubliceerd. Aan hetzelfde plein staan ook de Visserschool van Commer de Geus en het 4 mei-monument van De Baarsjes.

      Let op:
      - hoe de woonblokken het plein omlijsten, met de Visserschool aan de noordkant
    attributes:
      original_use: Arbeiderswoningen
    sources:
      - https://data.amsterdam.nl/monumenten/932cedff-6bf8-4907-a50f-1831828db318
      - https://data.amsterdam.nl/monumenten/9bf25d7d-47e8-4a97-8c34-341392f8f53c

- title: Visserschool (Columbusplein)
  summary: "A 1927 double school by Commer de Geus, built for Reformed education and named after J.Th. de Visser, the first Dutch minister of education, whose primary education act completed the settlement over religious schools. Parabolic porches face the Columbusplein."
  body: |
    In 1917 the *Schoolstrijd*, the political fight over religious schools, came to an end, after which such schools received public subsidy. In 1918 Johannes Theodoor de Visser, a Dutch Reformed clergyman and Christian-Historical politician, became the country's first minister of education; his primary education act completed the settlement. This double school for Reformed (*gereformeerd*) education, opened in 1927, was named after him, and a bronze relief portrait of him dated 2 May 1930 hangs in the entrance hall.

    Commer de Geus, later known mainly for his post-war work with Jacob Ben Ingwersen, designed it as one of his early buildings: sober red-brown brick under wide tiled eaves, with Amsterdam School details. It closes off a block whose other side is the curved front of the Magalhaensstraat, which makes it the eye-catcher of the square. Colourful tiled floors and granito wainscots survive inside, but it is a working primary school, the ecumenical De Visserschool, so look from the square. The school adopted the neighbourhood's 4 May memorial, placed in front of it in 2018.

    Look for:
    - the parabolic entrance porches and the doors with a ladder pattern
    - the broad overhanging gutter and the five chimneys on the ridge
    - the rows of classroom windows with their original many-paned top lights
  category: schools
  lat: 52.366808
  lng: 4.855263
  address: Columbusplein 34
  links:
    - { label: Monumentenregister Amsterdam (200682), url: "https://data.amsterdam.nl/monumenten/3ec5bc91-e345-4a22-befd-19099100903b" }
    - { label: Wikipedia (nl) J.Th. de Visser, url: "https://nl.wikipedia.org/wiki/Johannes_Theodoor_de_Visser" }
