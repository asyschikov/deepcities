  nl:
    title: Bouwblokken Surinameplein (Roodenburgh)
    summary: "Twee kwartcirkels van rode baksteen die van het Surinameplein een poort maken, met winkelgalerijen, hoektorens en hoge bakstenen schermen. Jordanus Roodenburgh begon eraan in 1927; pas in 1956 was het af."
    body: |
      Het duurde bijna dertig jaar voor deze twee kwartcirkels rond waren. Jordanus Roodenburgh, die voor De Bazel had gewerkt en ook het oude Ajax-stadion tekende, ontwierp de blokken die het Surinameplein aan het zuideinde van de Hoofdweg omsluiten. Ze kwamen er in stukken: de Hoofdweggevel en de oostelijke kwartcirkel in 1927, het deel aan de Baarsjesweg in 1928, de tegenoverliggende kwartcirkel en de Sloterkade-kant in 1929, en twee verbindingsstukken pas na de oorlog, in 1955 en 1956. Die naoorlogse delen volgen het schema, maar zijn duidelijk kaler.

      Later nam Cornelis van Eesteren het halfronde plein op in zijn verkeersplan voor het Surinameplein. Zo vormen de blokken een scharnier tussen de gesloten straatwanden in de lijn van Berlage en het moderne Algemeen Uitbreidingsplan. Aan beide kanten van de Surinamestraat lopen winkelgalerijen, en torens op de hoeken zetten de straat neer als een poort.

      Let op:
      - hoge bakstenen schermen haaks op de gebogen gevels, waar het ene blok overgaat in het volgende
      - veelhoekige portieken met schuine dagkanten, en driezijdige erkers onder brede houten goten
      - ruitvormige openingen naar de winkelgalerijen aan de Surinamestraat
      - het verschil in detail tussen de torens uit de jaren twintig en die uit de jaren vijftig
    attributes:
      original_use: Etagewoningen en winkels
    sources:
      - https://data.amsterdam.nl/monumenten/18e2dbe8-776a-4dfe-97f8-ee12ef88a282
      - https://nl.wikipedia.org/wiki/Surinameplein

- title: Mercatorplein
  summary: "Berlage's square at the heart of Plan West (four matching brick walls, arcades of shops and a tall gateway tower), whose north side was demolished and rebuilt to the original design in the 1990s."
  body: |
    H.P. Berlage laid out the Mercatorplein as the centrepiece of Plan West and designed all four of its walls (1925–1927), though not the flats behind them. The square was named in 1924 after the cartographer Gerardus Mercator. The north and south walls are red brick, the east and west walls largely yellow-brown, all standing on rough-hewn natural stone. The Hoofdweg crosses the square with a sideways jog, and the side streets enter through gateway buildings.

    Of the towers Berlage planned, the one on the north side was demolished in 1961 as unsafe. After years of decline the whole north wall was taken down from 1995 and rebuilt as faithfully as possible, tower included; the renewed square opened in 1998. In 1948 a dairy shop here became Amsterdam's first self-service store, the seed of the Dirk van den Broek supermarket chain. Since 2019 the lift shaft of the underground car park has carried a portrait of the late mayor Eberhard van der Laan.

    Look for:
    - the eight-storey tower beside the gateway into the Van Spilbergenstraat, and its rebuilt twin to the north
    - shop arcades on heavy brick piers with meander bands and figurative sculpture on the corners
    - the colour change between the red and the yellow-brown walls
  category: housing
  lat: 52.368926
  lng: 4.851121
  address: Mercatorplein 1-121, Hoofdweg 303-319, Jan Evertsenstraat 133-144
  links:
