    heritage_status: National monument
    monument_number: "527153"
    built: 1921–1923
    architect: A.J. Westerman (Dienst Publieke Werken)
    listed: 2003
    original_use: Trade school (ambachtsschool)
    artist: Hildo Krop
  photos:
    - commons:File:Postjesweg 1 (2).JPG
    - commons:File:Ambachtsschool, voorgevel - Amsterdam - 20015887 - RCE.jpg
  sources:
    - rce:527153 (register text)
    - wd:Q1996061
