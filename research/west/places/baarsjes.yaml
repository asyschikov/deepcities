  nl:
    title: Woningbouw Jan Evertsenstraat (J.F. Staal)
    summary: "J.F. Staals winkelstraat: zes bouwblokdelen met etagewoningen boven winkels, vlakke luifels, banden van glazen bouwstenen en een poortgebouw over de Hudsonstraat."
    body: |
      J.F. Staal ontwierp in 1925-1926 beide wanden van de Jan Evertsenstraat, in een strakke variant van de Amsterdamse School. Het Rijk beschermt het complex als zes delen, blok A tot en met F, met elk tientallen woningen boven winkels. Aan de oostkant vormen twee tegenover elkaar liggende blokken samen de entree van deze hoofdas van Plan West. In de noordwand verbindt een poortgebouw naar de John Franklinstraat twee blokken tot één lang volume; in de zuidwand overspant een poortgebouw de Hudsonstraat. De gemeente beschermde de straatwanden al in 1992.

      De wanden tellen vijf lagen. Onderin zitten winkels onder een vlakke betonnen luifel, met daarboven stroken van vier tot zeven lagen glazen bouwstenen. De bovenste verdieping is blind; onder de betonnen dakrand op klossen steken op regelmatige afstand hijsbalken uit.

      Let op:
      - het poortgebouw over de Hudsonstraat
      - de lagen glazen bouwstenen boven de winkelluifels
      - de vensters met lekgoten met waterspuwertjes
      - de houten voordeuren met alleen een horizontale lichtspleet
    attributes:
      original_use: Etagewoningen en winkels
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/527144
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/527146

- title: Jan Evertsenstraat housing by Van der Mey
  summary: "Joan van der Mey's red-brick \"twin brothers\" at the Admiralengracht: corner towers that stand like gatekeepers at the Molenslootbrug, with shop arcades running down the Jan Evertsenstraat."
  body: |
    J.M. van der Mey, architect of the Scheepvaarthuis, designed the two blocks where the Jan Evertsenstraat crosses the Admiralengracht (1926–1927). The city register calls them *tweelingbroers* (twin brothers): symmetrical blocks of working-class flats in red brick, each with a shop gallery along the Jan Evertsenstraat. Seen from the Molenslootbrug, the higher corner blocks act as gatekeepers, and the four-storey walls along the canal fan out from them like wings.

    This is the late, more businesslike Amsterdam School: horizontal window strips under projecting lintels set against tower-like volumes. The floors in the corner towers sit higher than in the wings, which pushes the eye upward towards the street. The northern block was renovated with some loss of original material.

    Look for:
    - the stepped corner towers on both sides of the bridge
    - shop galleries along the Jan Evertsenstraat
    - the gateway into the Krommertstraat
  category: housing
  lat: 52.370718
  lng: 4.85736
  address: Jan Evertsenstraat 9-44, Krommertstraat 1-5, Admiralengracht
  links:
