- title: Arminiuskerk
  summary: "The only post-war church the Remonstrants ever built in Amsterdam (1957), rising from the Postjeswetering with a concrete bell frame and a wall of glass cast in a meander pattern. Now a neighbourhood centre with a sports hall in the nave."
  body: |
    When the Remonstrants left their old church on the Keizersgracht (later the cultural venue De Rode Hoed), they built this new one in De Baarsjes: the first and only post-war Remonstrant church in Amsterdam. The first stone was laid on 13 May 1956 and it opened on 3 May 1957, at a cost of 400,000 guilders. The architect K.L. Sijmons was known for renewing Protestant church architecture; in Amsterdam he also built the Mennonite Olijftak and the Thomaskerk.

    Sijmons wanted a balanced room rather than a conventional preaching church with a centre aisle. The side wall facing the water is a continuous wall of glass set in white concrete in a meander pattern; the street side is closed. For him that contrast expressed the relation between the human and the divine. A tall concrete bell frame rises over the junction of the low front building and the hall. The Postjeswetering was later widened, so the church now partly rises straight from the water. The Remonstrants left in the early 1980s; it became a neighbourhood centre and the nave a sports hall.

    Look for:
    - the meander-patterned concrete-and-glass wall along the water
    - the open concrete tower above the hall's front wall
    - rows of small square light slits in the brick front
    - the pergola between the front building and the canal
  category: religious
  lat: 52.360104
  lng: 4.849574
  address: Postjeskade 200
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/c198296a-a0ce-49d2-a12a-39662f6a701b" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "200684"
    built: 1956–1957
    architect: K.L. Sijmons Dzn
    listed: 2013
    original_use: Remonstrant church with church hall
  photos:
    - commons:File:Arminiuskerk aan de Postjeskade te Amsterdam in gebruik genomen, Bestanddeelnr 908-5583.jpg
  sources:
    - city:200684 (register text)
  nl:
    title: Arminiuskerk
    summary: "De enige kerk die de remonstranten na de oorlog in Amsterdam bouwden (1957): aan de Postjeswetering, met een betonnen klokkenstoel en een glaswand in een meanderpatroon. Nu een buurtcentrum, met een sportzaal waar de kerkzaal was."
    body: |
      Waar ooit de remonstranten zaten te luisteren, wordt nu gesport: de kerkzaal is een sportzaal. Toch is de Arminiuskerk bijzonder. Het is de eerste en enige kerk die de Remonstrantse Broederschap na de oorlog in Amsterdam neerzette, en ze ging open toen de oude kerk aan de Keizersgracht dichtging, het latere cultuurhuis De Rode Hoed. De eerste steen ging erin op 13 mei 1956, op 3 mei 1957 was de opening, en de rekening kwam op 400.000 gulden. Architect K.L. Sijmons stond bekend als vernieuwer van de protestantse kerkbouw. Hij tekende in Amsterdam ook de doopsgezinde Olijftak en de Thomaskerk.

      Sijmons wilde geen gewone preekkerk met een middenpad, maar een ruimte in balans. Aan de waterkant zette hij een doorlopende glaswand, gegoten in wit beton met een meanderpatroon; de straatkant hield hij dicht. Volgens hem liet dat verschil zien hoe het menselijke en het goddelijke zich tot elkaar verhouden. Boven de plek waar de lage voorbouw en de zaal elkaar raken, staat een hoge betonnen klokkenstoel. Later is de Postjeswetering breder gegraven, en sindsdien staat de kerk deels in het water. Begin jaren tachtig vertrokken de remonstranten; het werd een buurtcentrum.

      Let op:
      - de wand van beton en glas in een meanderpatroon langs het water
      - de open betonnen toren boven de voorgevel van de zaal
      - rijen kleine vierkante lichtspleten in de bakstenen voorgevel
      - de pergola tussen de voorbouw en de gracht
    attributes:
      original_use: Remonstrantse kerk met nevenruimten
    sources:
      - https://data.amsterdam.nl/monumenten/c198296a-a0ce-49d2-a12a-39662f6a701b

- title: Het Sieraad
  summary: "The former Fourth Trade School on its kite-shaped plot at the Postjesweg, almost surrounded by water, with Hildo Krop's sculpture of sea voyages and trades and the motto \"zonder moeite niets\" (nothing without effort)."
  body: |
    The Public Works architect A.J. Westerman designed this school for the Vierde Ambachtsschool (Fourth Trade School), built in 1921–1923 on a five-sided plot almost surrounded by water. Classrooms ring an inner courtyard off a corridor that runs all the way round, and a former museum hall forms an extra storey at the front. Later it housed the vocational school for goldsmiths and watchmakers. After the school left in 2002 the building was restored, the courtyard got a glass roof, and it now holds an events venue, workspaces and a restaurant.

    The national register calls it a richly executed municipal school for vocational education. Hildo Krop's tufa sculptures around the main door refer to the trades taught here and to the sea voyages of the admirals after whom the surrounding streets are named; a man and a woman hold the city arms and the motto *zonder moeite niets*.

    Inside hangs a bronze Star of David made in the early 1990s by pupils of the trade school, for four Jewish pupils who were "removed from school" in the war and deported: Wolf Heinz Fischer, Hans Rosenstein, Jonas Swaab and Johan Cornelis Syes. Two of them died in the camps; what became of the other two is not known. It was unveiled on 4 May 2008.

    Look for:
    - Krop's sculpture around the entrance and the wrought-iron grilles with wave motifs
    - half-round brick oriels on carved consoles above the side entrances
    - the long horizontal window bands and the concave front
    - inside, when the building is open, the pupils' Star of David with the four names
  category: schools
  lat: 52.364534
  lng: 4.859298
  address: Postjesweg 1
  links:
    - { label: Rijksmonumentenregister (527153), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/527153" }
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/06e7f235-9317-4918-b513-0c642d9d6894" }
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Het_Sieraad" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q1996061" }
