    - "https://monumentenregister.cultureelerfgoed.nl/monumenten/527142"
  nl:
    title: Scholencomplex Admiralengracht/Cabotstraat
    summary: "Drie parallelle scholen van Publieke Werken uit 1928, verbonden door een hoge schoolmuur: een zeldzaam 'school-eiland' in strokenbouw tussen Admiralengracht en Cabotstraat."
    body: |
      Publieke Werken ontwierp in 1928 drie evenwijdig naast elkaar gelegen scholen in late Amsterdamse School-stijl. Van noord naar zuid: de Admiralengrachtschool en Columbusschool, een kleuterschool en de Cabotschool en Vasco da Gamaschool. De noordelijke en de middelste school zijn gangscholen; bij de noordelijke liggen de lokalen achter, aan het schoolplein. Alle drie zijn bakstenen gebouwen van drie lagen onder een rood pannendak. De noordelijke en zuidelijke school hebben aan beide korte kanten blokvormige, trapsgewijs hoger wordende uitbouwen met de ingangen.

      Een hoge schoolmuur, ook uit 1928, hoort architectonisch bij de scholen. Hij schermt de twee speelplaatsen tussen de gebouwen af van de straat en loopt in de Cabotstraat verder als lage borstwering. Het Rijk ziet in het geheel een zeldzame aanleg van scholen in strokenbouw, en in de muur de grens van een 'school-eiland'.

      Let op:
      - de schoolmuur, die hoger wordt waar hij een deel van de eindgevels vormt, bij twee scholen met een kwartronde zwaai
      - de rijen kleine vierkante vensters boven de hogere tweeruitsvensters
      - de deuren onder een rollaag op hardstenen neuten
    attributes:
      original_use: "Lagere scholen en kleuterschool"
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/527139
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/527142

# ================================================================ Part 2: other C-list places

- title: Slatuinenweg
  summary: "A narrow lane of one- and two-storey cottages that dips below the city around it: the last remnant of the hamlet of De Baarsjes and of a 1675 church path through the lettuce gardens."
  body: |
    Before Amsterdam spread west, this was the hamlet of De Baarsjes in the municipality of Sloten, named after an inn called De Drie Baarsjes (The Three Little Perch) by the toll bridge over the Kostverlorenvaart. From 1675 a church path, the Slatuinenpad, ran from here across the polder to the church in Sloterdijk, between market gardens growing lettuce (*sla*) and other greens. Into the 1920s it was a favourite walk for city dwellers.

    The tramline of 1904 was laid on a raised bed of sand and the city that followed also stands higher, but the path stayed at the old polder level. What is left is this short stretch between the Baarsjesweg and the Admiraal de Ruijterweg, renamed Slatuinenweg in 1924. It is still the width of a path, and coming from the Admiraal de Ruijterweg it seems to dive into a hollow. The Willem de Zwijgerlaan further north largely follows the old route.

    Look for:
    - the drop in level where the lane leaves the Admiraal de Ruijterweg
    - the row of workers' cottages at nos. 29–39, with a foundation stone dated 4 September 1895 laid by three-and-a-half-year-old Hendrik Klomp
    - the old Sloten police post on the sharp corner with the Baarsjesweg
    - the Natuurtuin Slatuinen
  category: hidden-history
  lat: 52.369873
  lng: 4.863361
  address: Slatuinenweg, between Baarsjesweg and Admiraal de Ruijterweg
  links:
    - { label: Wikipedia (nl) Slatuinenweg, url: "https://nl.wikipedia.org/wiki/Slatuinenweg" }
    - { label: Wikipedia (nl) De Baarsjes (buurtschap), url: "https://nl.wikipedia.org/wiki/De_Baarsjes_(buurtschap)" }
  photos:
    - commons:File:Slatuinenweg.JPG
    - commons:File:2022 Slatuinenweg 29-65, Asd.jpg
    - commons:File:Slatuinenweg pic1.JPG
  sources:
    - https://nl.wikipedia.org/wiki/Slatuinenweg
    - https://nl.wikipedia.org/wiki/De_Baarsjes_(buurtschap)
  nl:
    title: Slatuinenweg
    summary: "Een smal straatje met huisjes van één of twee lagen, dat wegzakt onder de stad eromheen. Het laatste stukje van de buurtschap De Baarsjes en van een kerkpad uit 1675 dat tussen de slatuinen door liep."
    body: |
      Kom je vanaf de Admiraal de Ruijterweg, dan lijkt de straat een kuil in te duiken. Dat klopt ook: de Slatuinenweg ligt nog op de hoogte van de oude polder, en de stad eromheen staat hoger.

      Voordat Amsterdam naar het westen opschoof, lag hier de buurtschap De Baarsjes, in de gemeente Sloten. De naam komt van herberg De Drie Baarsjes bij de tolbrug over de Kostverlorenvaart. Vanaf 1675 liep er een kerkpad, het Slatuinenpad, dwars door de polder naar de kerk in Sloterdijk, langs tuinderijen waar sla en ander groen groeide. Tot in de jaren twintig wandelden de stedelingen er graag.

      De tram van 1904 kwam op een opgehoogd zandbed te liggen, en ook de stad die volgde ligt hoger, maar het pad bleef op polderniveau. Over is alleen dit korte eind tussen de Baarsjesweg en de Admiraal de Ruijterweg, dat in 1924 de naam Slatuinenweg kreeg. Breder dan een pad is het nog altijd niet. Verder naar het noorden volgt de Willem de Zwijgerlaan grotendeels de oude route.

      Let op:
      - het hoogteverschil waar het straatje van de Admiraal de Ruijterweg afdaalt
      - de rij arbeidershuisjes op nr. 29-39, met een eerste steen van 4 september 1895, gelegd door de toen drieënhalfjarige Hendrik Klomp
      - de oude politiepost van Sloten op de scherpe hoek met de Baarsjesweg
      - de Natuurtuin Slatuinen
    sources:
      - https://nl.wikipedia.org/wiki/Slatuinenweg
      - https://nl.wikipedia.org/wiki/De_Baarsjes_(buurtschap)

- title: Natuurtuin Slatuinen
  summary: "A hidden nature garden inside a 1920s housing block, reached through a narrow gate between the cottages of the Slatuinenweg: a former park and nursery that residents saved and have run since 1991."
  body: |
    The ground behind the Slatuinenweg cottages was never built on. It was polder land, then from 1912 a small park (first the Julianapark, later the Wilhelminapark), and from the 1930s until 1984 a plant nursery run by the Hendriksen family. Only when the Chassébuurt was built in the 1920s did it become an enclosed inner court.

    After the nursery closed the plot ran wild, until the council felled the trees in 1986. Angry neighbours drew up a plan for a nature garden with a social and educational purpose, and since 1991 the Stichting Natuurtuin Slatuinen has managed it with volunteers. The idea is to let nature partly go its own way, with mainly native trees and plants. The garden is open on Sunday afternoons and on Thursdays (check the foundation's website), and on Thursdays volunteers give advice on wild and native plants.

    Look for:
    - the gate between the houses at Slatuinenweg 45 and the path to the small garden building
    - snake's head fritillaries (*wilde kievitsbloem*) in spring
    - the backs of the 1920s blocks of the Chasséstraat and Jacob van Wassenaer Obdamstraat closing it in
  category: green
  lat: 52.370501
  lng: 4.862278
  address: Slatuinenweg 45
  links:
    - { label: Natuurtuin Slatuinen – visit, url: "https://www.natuurtuinslatuinen.nl/bezoek-contact" }
    - { label: Natuurtuin Slatuinen – history, url: "https://www.natuurtuinslatuinen.nl/historie" }
    - { label: Wikipedia (nl) Slatuinenweg, url: "https://nl.wikipedia.org/wiki/Slatuinenweg" }
  photos:
    - commons:File:Natuurtuin Slatuinen.jpg
    - commons:File:Ingang Natuurtuin Slatuinen.JPG
  sources:
