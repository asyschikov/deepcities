  nl:
    title: Levensboom, Monument van Besef
    summary: "Een levensboom op het Surinameplein, waar sinds 1993 elk jaar op 30 juni de afschaffing van de Nederlandse slavernij wordt herdacht. Het eigen monument van de gemeenschap, onthuld in 2003."
    body: |
      Toen in 2002 in het Oosterpark het nationale slavernijmonument werd onthuld, vond het Comité 30 juni/1 juli dat het op de verkeerde plek stond. De herdenking vond al tien jaar op het Surinameplein plaats, dus moest daar een eigen monument komen. Dat werd de Levensboom van Henry Renfurm, onthuld op 30 juni 2003. In het Sranantongo heet hij Bon fu Gron Prakseri.

      De achtergrond: op 1 juli 1863 werd de slavernij afgeschaft in Suriname en op de Caribische eilanden van het koninkrijk. Sinds 1993 komen mensen elk jaar op 30 juni op dit plein samen voor de Nationale Dag van Besef. Journalist en programmamaker Roy Ristie en het comité hoorden bij de initiatiefnemers. Ze namen 4 en 5 mei als voorbeeld: op 30 juni stilstaan en nadenken, op 1 juli feestvieren met Keti Koti.

      De boom zit vol betekenis. De stam staat voor de etnische verscheidenheid van de gemeenschap, het bladerdak voor de landen van het vroegere koninkrijk en wat hen verbindt.

      Let op:
      - het bladerdak, dat staat voor de landen en hun onderlinge band
      - kransen van de herdenking op 30 juni, met twee minuten stilte en toespraken
    sources:
      - https://nl.wikipedia.org/wiki/Levensboom,_Monument_van_Besef

- title: De Wending 666/999 (Hans van Houwelingen)
  summary: "A huge iron plate that seems to float above a small square, with a tree growing through it and a number that reads 666 or 999 depending on where you stand."
  body: |
    When the district cut a square into the long Witte de Withstraat in the Chassébuurt renewal, the artist Hans van Houwelingen was asked for an artwork, and ended up designing the whole Witte de Withplein (2012). He found the architect's sunny artist's impression a lie about a tough neighbourhood, photoshopped it to match reality, and to his surprise still got the commission. When the architect had his own design laid out anyway, Van Houwelingen insisted; it was torn up and the square rebuilt to his plan, keeping only the little tree.

    The work is a stage that lifts a piece of everyday reality into theatre. Its title nods to *Wendingen*, the Amsterdam School magazine, and plays on turns and contrasts: heavy iron that floats, a tree locked in irons, and the former church opposite that became a mosque. A number taken from that building's address is engraved at the top. Read one way it is 666, the number of the devil; the other way 999, the ultimate beauty of metal.

    Look for:
    - the gap that lets the tree grow through the plate
    - the 666/999 engraving at the top
    - the former Apostolic church, now a mosque, across the street
  category: curiosities
  lat: 52.368859
  lng: 4.858776
  address: Witte de Withplein
  links:
    - { label: Public Art Amsterdam, url: "https://publicart.amsterdam/projecten/de-wending-666-999-2" }
    - { label: Wikipedia (nl) Witte de Withstraat, url: "https://nl.wikipedia.org/wiki/Witte_de_Withstraat_(Amsterdam)" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q116198724" }
  attributes:
    built: "2012"
    artist: Hans van Houwelingen
  photos:
    - commons:File:Witte de Withplein, object.jpg
  sources:
    - https://publicart.amsterdam/projecten/de-wending-666-999-2
    - wd:Q116198724
  nl:
    title: De Wending 666/999 (Hans van Houwelingen)
    summary: "Een enorme ijzeren plaat die boven een pleintje lijkt te zweven, met een boom die er dwars doorheen groeit en een getal dat 666 of 999 is, afhankelijk van waar je staat."
    body: |
      De kunstenaar vond de mooie plaatjes van de architect gelogen. Op die zonnige artist impression was niets te zien van de ruige buurt die hij ter plekke aantrof. Dus photoshopte Hans van Houwelingen de tekening tot ze wel klopte met de werkelijkheid, en tot zijn eigen verbazing kreeg hij de opdracht toch.

      Bij de vernieuwing van de Chassébuurt brak het stadsdeel een plein uit de lange Witte de Withstraat. Van Houwelingen werd gevraagd voor een kunstwerk en ontwierp uiteindelijk het hele Witte de Withplein (2012). Toen de architect zijn eigen ontwerp toch liet aanleggen, hield de kunstenaar voet bij stuk: alles ging er weer uit en het plein werd opnieuw aangelegd volgens zijn plan. Alleen het boompje mocht blijven.

      Het werk is een podium dat een stukje alledaagse werkelijkheid optilt tot theater. De titel knipoogt naar *Wendingen*, het tijdschrift van de Amsterdamse School, en draait om wendingen en tegenstellingen: zwaar ijzer dat zweeft, een boom in de boeien, en tegenover het plein een voormalige kerk die een moskee werd. Bovenin is een getal gegraveerd dat uit het huisnummer van die kerk komt. Van de ene kant lees je 666, het getal van de duivel. Van de andere kant 999, de ultieme schoonheid van het metaal.

      Let op:
      - de uitsparing waardoor de boom door de plaat heen groeit
      - het gegraveerde getal 666/999 bovenin
      - aan de overkant de voormalige Apostolische kerk, nu een moskee
    sources:
      - https://publicart.amsterdam/projecten/de-wending-666-999-2

- title: Tuin van Jan
  summary: "A former schoolyard behind the 1926 Jan Maijenschool, turned by neighbours into a quiet garden with ponds that catch the rain from the school roof, in a quarter particularly short of green space."
  body: |
    The playground of the four schools in the Jan Maijenschool building lay hidden inside the block, overlooked by the backs of the housing on the Jan Evertsenstraat. When the schools closed it stood empty. From 2011 the initiator Arnoud Hekkens, with the art and research collective FoAM during the Pop-Up Park festival, ran workshops with residents and experts: the urban ecologist Martin Melchers, garden designer Sanne Horn and others. Horn's final design was inspired by the riad, the Middle Eastern palace or paradise garden.

    The garden opened in 2013 as a stiltetuin (garden of silence). It is named after both the Jan Maijenstraat and the Jan Evertsenstraat. Because this crowded area often floods in heavy rain, the ponds were designed as a buffer: water from the school roof runs straight into them. Neighbours maintain the garden.

    Look for:
    - the ponds fed by the school's roof
    - the backs of the Jan Maijenschool and of the Jan Evertsenstraat housing
    - the planting, from a design worked out in workshops with residents
  category: green
  lat: 52.37079
  lng: 4.852311
  address: Behind Jan Maijenstraat 11-17
  links:
    - { label: Wikipedia (nl) Jan Maijenstraat 11-17, url: "https://nl.wikipedia.org/wiki/Jan_Maijenstraat_11-17" }
    - { label: FoAM, url: "https://lib.fo.am/tuin_van_jan" }
  photos: []
  sources:
    - https://nl.wikipedia.org/wiki/Jan_Maijenstraat_11-17
    - https://lib.fo.am/tuin_van_jan
  nl:
    title: Tuin van Jan
    summary: "Een oud schoolplein achter de Jan Maijenschool uit 1926, door de buurt omgetoverd tot stille tuin met vijvers die het regenwater van het schooldak opvangen. Groen is schaars in deze stenige wijk."
    body: |
      Het speelplein van de vier scholen in het gebouw van de Jan Maijenschool lag verstopt binnen het bouwblok, met uitzicht op de achtergevels van de woningen aan de Jan Evertsenstraat. Toen de scholen dichtgingen, raakte het in onbruik. Vanaf 2011 organiseerde initiatiefnemer Arnoud Hekkens met het kunst- en onderzoekscollectief FoAM, tijdens het festival Pop-Up Park, werksessies met buurtbewoners en deskundigen, onder wie stadsecoloog Martin Melchers en tuinontwerper Sanne Horn. Het uiteindelijke ontwerp van Horn haalde zijn inspiratie bij de riad, de paleis- of paradijstuin uit het Midden-Oosten.

      In 2013 ging de tuin open als stiltetuin. De naam slaat zowel op de Jan Maijenstraat als op de Jan Evertsenstraat. Omdat het in deze dichtbebouwde buurt bij een flinke bui vaak blank staat, zijn de vijvers bedoeld als buffer: het water van het schooldak loopt er rechtstreeks in. Buurtbewoners houden de tuin bij.

      Let op:
      - de vijvers die gevoed worden door het schooldak
      - de achterkant van de Jan Maijenschool en van de woningen aan de Jan Evertsenstraat
      - de beplanting, uit een ontwerp dat in werksessies met bewoners tot stand kwam
    sources:
      - https://nl.wikipedia.org/wiki/Jan_Maijenstraat_11-17
