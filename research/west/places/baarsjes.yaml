  nl:
    title: Woningbouw Paramaribostraat (Piet Kramer)
    summary: "Woningbouw van Piet Kramer uit 1924 in de Westindische buurt ten noorden van het Surinameplein, op 30 juni 1992 gemeentelijk monument geworden, op dezelfde dag als blokken van Wijdeveld, Roodenburgh en Staal in Plan West."
    body: |
      De straten ten noorden van het Surinameplein dragen namen uit Suriname en de (voormalige) Nederlandse Antillen. De gemeente sprak daarom van de Westindische buurt; tegenwoordig kent men de wijk als de Postjesbuurt. P.L. Kramer ontwierp in 1924 de woonblokken aan de Paramaribostraat en de Marowijnestraat. Zijn woningbouw aan de Hoofdweg dateert de gemeente op 1923-1925. Op 30 juni 1992 werden de blokken aan de Paramaribostraat gemeentelijk monument, op dezelfde dag als de blokken van Wijdeveld aan de Hoofdweg, Roodenburgh aan de Vespuccistraat en Staal aan de Jan Evertsenstraat.

      Voor dit monument is geen redengevende omschrijving gepubliceerd. De blokken zijn goed te vergelijken met Kramers woonblokken aan de Hoofdweg uit dezelfde jaren.

      Let op:
      - de hoek van de Paramaribostraat en de Marowijnestraat
      - de gekoppelde portiekingangen tussen gemetselde dammen
    attributes:
      original_use: Woningen
    sources:
