    - { label: Wikipedia (nl) Surinameplein, url: "https://nl.wikipedia.org/wiki/Surinameplein" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q27139393" }
  attributes:
    built: "2003"
    artist: Henry Renfurm
  photos:
    - commons:File:Monument van besef.JPG
    - commons:File:Surinameplein, Monument van besef1.jpg
