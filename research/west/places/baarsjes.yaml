  nl:
    title: Bethelkerk en Magalhaensplein
    summary: "Een 'klein stadje' aan het Magalhaensplein: een gereformeerde kerk uit 1929 met een steil tentdak, het bijbehorende wijkgebouw, een voormalige politiepost met GG en GD-post en een school, trapsgewijs oplopend naar één dakruiter."
    body: |
      Plan West werd netjes verdeeld over de zuilen. De hervormden kregen de Jeruzalemkerk, de katholieken de Chassékerk en de gereformeerden deze Bethelkerk. Architect E.A.C. Roest bouwde eerst een kerkelijk wijkgebouw aan de Cabotstraat (1925–1926) en daarna de kerk zelf (1928–1929). Publieke Werken zette er aan het Magalhaensplein een politiepost naast met een vestiging van de GG en GD (1928), en J.H. van der Veen een christelijke school aan de Willem Schoutenstraat (1931–1933).

      Het gemeentelijk monumentenregister noemt het resultaat een 'klein stadje' of een intiem hofje, en dat klopt. Vanaf het plein zie je eerst gebouwtjes van één laag onder zadeldaken. Daarachter komt het wijkgebouw van twee lagen met een mansardekap, en helemaal bovenaan de kerk. Het steile tentdak en de twaalf meter hoge dakruiter zijn expressief, zoals bij Michel de Klerk. Tegenwoordig kerkt hier een evangelische gemeente.

      Let op:
      - het tentdak en de dakruiter boven het rode pannendak uit
      - vierkante dakkapellen die dwars door de dakgoot van de kerk steken
      - de symmetrische gevel van de oude politiepost en GG en GD, die het Magalhaensplein afsluit
      - de school van Van der Veen, met naar voren springende bovenlichten in ijzeren kozijnen
    attributes:
      architect: E.A.C. Roest (kerk, wijkgebouw); Dienst Publieke Werken (politiepost); J.H. van der Veen (school)
      original_use: Kerk, kerkelijk wijkgebouw, politiepost met GG en GD, school
    sources:
      - https://data.amsterdam.nl/monumenten/baa97141-dc98-44fe-a5aa-9269db133df8
      - https://data.amsterdam.nl/monumenten/efcfa2f6-303b-42c7-bd7b-6a3b438f2f6f
      - https://data.amsterdam.nl/monumenten/e88b8cf4-d1f9-4dbb-8a46-93607575ff02

- title: Cabralschool
  summary: "A 1924 double school that runs right through a housing block from street to street, with blind brick ends and two slender towers: the city calls the arrangement unique in Amsterdam."
  body: |
    The Public Works department designed this double *gangschool* (corridor school) in 1924 and placed it across a housing block, so that it links the Cabralstraat with the Marco Polostraat and opens up both ends of the block. Each school had its own entrance at one end, they shared a gym, and fire doors separated the two halves. The city register calls this way of piercing a block unique in Amsterdam.

    The building later went to a Catholic parish and was split into several schools. After years of vacancy and squatting, the neighbourhood began pushing for a new use in 2013, and after a renovation it became a business centre called MidWest. Its style mixes Amsterdam School with cubist touches: red brick for the base and door surrounds, yellow brick above, and large, almost closed brick surfaces.

    Look for:
    - the two tall, slender towers at the west end, local landmarks
    - ladder-shaped windows above the doors, between bulging brick panels
    - small wavy piers on the corners of the south façade
    - the original door on the Marco Polostraat side
    - MidWest's two inner gardens, home to wild plants, frogs, salamanders, bees and birds, open on Open Tuinen West (June 2026); since April 2026 a small pesticide-free shop for garden plants, many of them native, is in the building (Wednesday to Saturday, 12 to 5)
  category: schools
  lat: 52.369672
  lng: 4.854714
  address: Cabralstraat 1, Marco Polostraat 191
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/2d0d009f-719a-4aac-b35d-c0c8e979ab8e" }
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Cabralstraat_1" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q29108161" }
