  nl:
    title: Woonblokken Hoofdweg (Piet Kramer)
    summary: "De lange straatwanden van Piet Kramer aan het zuidelijke deel van de Hoofdweg, met poortgebouwen van zes lagen bij de Postjesweg en trappenhuisstroken die bovenaan uitlopen in pylonen met golvende baksteenbanden."
    body: |
      Wie het werk van Piet Kramer in de Spaarndammerbuurt kent, moet hier even schakelen. Kramer, die meewerkte aan het Scheepvaarthuis en aan De Dageraad, ontwierp in 1923 de blokken aan weerszijden van de zuidelijke Hoofdweg, en hield zich deze keer in. Het gemeentelijk monumentenregister spreekt van 'schier eindeloze vensterreeksen' in lange, vlakke gevels van rode of bruingrijze baksteen. De beeldhouwerij bewaarde hij voor de ingangen, de vooruitspringende trappenhuisstroken en de hoeken, waar de gevels hoger worden en gaan krullen.

      Achter die gevels zitten beneden- en bovenwoningen voor arbeidersgezinnen, met winkeltjes op de hoeken en een hele groep winkels op de kruising met de Postjesweg. Dat beide straatkanten naar één architect gingen, was bewust beleid: de Hoofdweg moest lezen als één laan die je naar het Mercatorplein voert. Bij een renovatie ging veel oorspronkelijke detaillering verloren, maar het karakter is nog altijd goed te zien.

      Let op:
      - de hoekblokken van zes lagen bij de Postjesweg, die samen een poort vormen
      - voordeuren die gegroepeerd onder een gezamenlijke luifel zitten, tussen gebeeldhouwde bakstenen penanten
      - trappenhuisstroken die uitlopen in pylonen met golvende banden
      - de knik in de gevels waar de weg bij de Davisstraat afbuigt
    attributes:
      original_use: Arbeiderswoningen en winkels
    sources:
      - https://data.amsterdam.nl/monumenten/37ce335d-2af4-49d5-b4cd-8f10bf2ebab7

- title: Hoofdweg housing by G.J. Rutgers
  summary: Gerrit Jan Rutgers' blocks on the Hoofdweg between the Willem Schoutenstraat and the Mercatorplein, with white-painted piers on the top floor and rounded corner towers forming a gateway.
  body: |
    Between the Willem Schoutenstraat and the Mercatorplein the Hoofdweg is lined by two blocks of working-class flats with corner shops, built in 1924–1925 by the building company N.V. Bouwmij. "De Berk". Gulden & Geldmaker had made earlier designs, but G.J. Rutgers, one of the most productive housing architects of the interwar ring, delivered the final façades.

    These are long, calm walls. White-painted piers between the top-floor windows make that floor read almost as a mezzanine and push the eye towards the Mercatorplein. Every third porch has a bay window above it, its corners hollowed into quarter-rounds and topped with decorative balls on the balcony. At the Willem Schoutenstraat the two blocks meet in a symmetrical gateway with rounded corners, towers and stepped-back upper floors.

    Look for:
    - the rounded corner towers with built-in corner shops at the Willem Schoutenstraat
    - porches with small granito floors and touches of ornamental brickwork
    - bay windows with quarter-round hollows where they meet the wall
  category: housing
  lat: 52.367234
  lng: 4.852189
  address: Hoofdweg 43-302 (part), Willem Schoutenstraat 20-32
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/759780db-c2b5-4d87-9185-58c27c80207b" }
  attributes:
    heritage_status: Municipal monument
