  nl:
    title: Visserschool (Columbusplein)
    summary: "Dubbele school uit 1927 van Commer de Geus, gebouwd voor gereformeerd onderwijs en genoemd naar J.Th. de Visser, de eerste minister van Onderwijs, die met zijn Lager-Onderwijswet de pacificatie rond het bijzonder onderwijs afmaakte. Paraboolportieken aan het Columbusplein."
    body: |
      In 1917 kwam er een eind aan de Schoolstrijd, de politieke strijd over het bijzonder onderwijs; daarna kregen christelijke scholen subsidie van de overheid. In 1918 werd de hervormde predikant en CHU-politicus Johannes Theodoor de Visser de eerste minister van Onderwijs; met zijn Lager-Onderwijswet maakte hij de pacificatie af. Deze dubbele school voor gereformeerd onderwijs uit 1927 werd naar hem genoemd, en in de toegangshal hangt een bronzen plaquette met zijn portret in reliëf, gedateerd 2 mei 1930.

      Commer de Geus, later vooral bekend van naoorlogs werk met Jacob Ben Ingwersen, ontwierp het als een van zijn vroege gebouwen: sober roodbruin metselwerk onder brede pannendaken, met details van de Amsterdamse School. De school sluit een bouwblok af waarvan de andere kant de gebogen gevelwand van de Magalhaensstraat is, en is zo de blikvanger van het plein. Binnen zijn kleurige tegelvloeren en granito lambriseringen bewaard, maar het is een gewone basisschool, de oecumenische De Visserschool; kijk dus vanaf het plein. De school adopteerde het 4 meimonument van de buurt, dat er sinds 2018 voor staat.

      Let op:
      - de paraboolvormige portieken en de deuren met laddermotief
      - de breed overstekende bakgoot en de vijf schoorstenen op de nok
      - de rijen lokaalramen met de oorspronkelijke veelruits bovenlichten
    attributes:
      original_use: Dubbele lagere school op gereformeerde grondslag
    sources:
      - https://data.amsterdam.nl/monumenten/3ec5bc91-e345-4a22-befd-19099100903b
      - https://nl.wikipedia.org/wiki/Johannes_Theodoor_de_Visser
      - https://stadscuratorium.nl/?p=3504

- title: Corantijnschool
  summary: "A pale-brick double school of 1922–1923 on the corner of the Hoofdweg, with half-round bays and angled towers that the German army used as barracks during the war."
  body: |
    The municipality of Sloten had already planned a school here in 1921. After the annexation, Amsterdam's Public Works department designed a double elementary school, finished in 1923 and shared by the Corantijnschool and the Hoofdwegschool, each with its own entrance. During the Second World War the German occupiers used it as barracks. It is still a school, basisschool Corantijn.

    The national register labels it *verstrakte* (streamlined) Amsterdam School, but its brickwork is still quite sculptural. The walls are light yellow-brown brick on a dark base. Symmetrical fronts have half-round bays either side of the centre and tall, angled, tower-like corners that catch the eye on the corner of the Hoofdweg. Pupils added tiles with their own texts in 2013.

    Look for:
    - the recessed top floor with a balcony behind a concave parapet of vertical brickwork
    - pairs of brick half-cylinders on the side walls
    - the big nine-pane classroom windows
  category: schools
  lat: 52.362005
  lng: 4.852575
  address: Corantijnstraat 2
  links:
    - { label: Rijksmonumentenregister (527154), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/527154" }
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/1da046c4-bc42-43d5-8b66-7302052a531e" }
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Corantijnschool" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q17292061" }
  attributes:
    heritage_status: National monument
    monument_number: "527154"
    built: 1922–1923
    architect: Dienst Publieke Werken
    listed: 2003
    original_use: Two elementary schools
  photos:
    - commons:File:School Corantijnstraat.JPG
    - commons:File:Corantijnschool, Hoofdweg pic1.JPG
  sources:
    - rce:527154 (register text)
    - wd:Q17292061
    - research/ams-school/places/oud-west-baarsjes.yaml (Corantijnschool)
  nl:
    title: Corantijnschool
    summary: "In de oorlog maakten de Duitse bezetters er een kazerne van; nu is het weer gewoon een school: een dubbele lagere school uit 1922-1923 op de hoek van de Hoofdweg, van lichte baksteen, met halfronde uitbouwen en schuin geplaatste torens."
    body: |
      Tijdens de Tweede Wereldoorlog gebruikten de Duitse bezetters dit gebouw als kazerne. Nu is het weer gewoon een school: basisschool Corantijn.

      Het plan kwam nog van de gemeente Sloten, die hier in 1921 een school wilde. Na de annexatie door Amsterdam tekende Publieke Werken een dubbele lagere school, die in 1923 klaar was. De Corantijnschool en de Hoofdwegschool deelden het pand, elk met een eigen ingang.

      In het rijksregister staat het als verstrakte Amsterdamse School, maar de baksteen is nog behoorlijk beeldhouwerig gemetseld. De muren zijn van licht geelbruine steen op een sokkel van donkere. Voor- en zijgevels zijn symmetrisch: midden voor twee halfronde uitbouwen, en op de hoeken hoge, schuin gezette torens die op de hoek van de Hoofdweg meteen de aandacht trekken. In 2013 kregen leerlingen hun eigen teksten op tegels in het gebouw.

      Let op:
      - de terugliggende bovenste verdieping met een balkon achter een holle borstwering van verticaal gemetselde steen
      - de paren bakstenen halve cilinders op de zijgevels
      - de grote klaslokaalramen met negen ruiten
    attributes:
      original_use: Twee lagere scholen
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/527154
      - https://nl.wikipedia.org/wiki/Corantijnschool


- title: Telefooncentrale West
  summary: A 1927 telephone exchange disguised as a housing block, with staff flats at the front, a big switching hall hidden in the courtyard and a carved G and T above the porch. Since 2024 the hidden hall holds twenty homes.
  body: |
    Amsterdam ran its own telephone service from 1896, after alderman M.W.F. Treub forced the private Bell company to hand back its concession; in 1922 the city opened the first automatic exchange in the Netherlands. As the city grew westwards, the Public Works department built this exchange for the new district (1926–1927). To the street it is simply part of the housing wall: rooms for the exchange on the ground floor and flats for live-in staff above. The real work happened in a large steel-framed hall in the middle of the block, reached through a round stair tower.

    The German occupiers transferred the municipal telephone services to the state PTT, and the exchange stayed in telecoms use for decades. Alterations and extensions in the 1960s changed its outside a great deal, but much of the original interior survived, including a spiral staircase with tiled and wrought-iron balustrades and beige tiled corridors. The hall is the only building in the city put up inside an existing housing block. In 2024 the architects Rijnboutt converted it into twenty homes, called De Centrale; they also advised turning the car park around it into a shared garden.

    Look for:
    - the deep porch with a rounded window corner and the carved G and T (Gemeentelijke Telefoon) between two blocks with the St Andrew's crosses of the city arms
    - the original house numbers in the porch
    - the continuous concrete canopy and wide overhanging eaves that stress the horizontal
    - the iron-clad vehicle gate on the Lodewijk Boisotstraat side
  category: civic
  lat: 52.369967
  lng: 4.85825
  address: Filips van Almondestraat 13-17, Lodewijk Boisotstraat 12
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/1db676d4-6fe0-452e-9aac-63a96eb321bb" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "200721"
    built: 1926–1927
    architect: Dienst Publieke Werken
    listed: 2014
    original_use: Telephone exchange with staff flats
  photos:
    - commons:File:Telefooncentrale-Amsterdam-West.jpg
    - commons:File:Telefooncentrale-Amsterdam-West-ingang.jpg
    - commons:File:2020 Filips van Almondestraat 13-17 (1).jpg
  sources:
    - city:200721 (register text)
    - "https://gebouwdin.amsterdam.nl/api/projectdetail/4076 ('De Centrale', Filips van Almondestraat 13-17, 2024, 20 homes: former PTT exchange on an abandoned car park inside a closed block; municipal monument since 2009; studied by Rijnboutt from 2017; parking area became a collective garden; the only building in the city realised inside an existing block; two-storey exchange designed 1926 by Alfred Boeken, altered and extended several times in the 1960s; interior largely intact, facade much changed). Round 4 correction: removed 'now belongs to KPN', 'still full of cables', 'hub for fibre'. Listing year conflict: draft 2014, gebouwdin 2009; left as is. Boeken attribution not used (register says Dienst Publieke Werken)."
    - "https://gebouwdin.amsterdam.nl/api/projectdetail/4076"
  nl:
    title: Telefooncentrale West
    summary: "Een telefooncentrale uit 1926-1927 die zich voordoet als woonblok: personeelswoningen aan de straat, een grote hal verstopt op het binnenterrein en een G en T in het beeldhouwwerk. Sinds 2024 zijn er twintig woningen in die hal."
    body: |
      Vanaf de Filips van Almondestraat zie je een gewone gevel in een rij woningen. Alleen een gebeeldhouwde G en T bij de portiek verraden dat hier de Gemeentelijke Telefoon zat. Het eigenlijke werk gebeurde verderop, in een grote hal met stalen spanten midden in het bouwblok, bereikbaar via een ronde traptoren. Aan de straat lagen beneden de ruimtes van de centrale, daarboven woonde het personeel.

      Amsterdam had sinds 1896 een eigen telefoondienst. Wethouder M.W.F. Treub had de particuliere Bell-maatschappij gedwongen haar concessie in te leveren, en in 1922 opende de stad de eerste automatische centrale van het land. Toen de stad naar het westen groeide, bouwde Publieke Werken deze centrale voor de nieuwe wijk (1926-1927).

      De Duitse bezetter bracht de gemeentelijke telefoon onder bij de PTT, en het gebouw bleef tientallen jaren in gebruik voor de telefonie. Verbouwingen in de jaren zestig veranderden de buitenkant flink, maar binnen bleef veel bewaard: een wenteltrap met leuningen van tegelwerk en smeedijzer, en gangen met beige tegels. Nergens anders in de stad staat een gebouw dat binnen een al bestaand woonblok is neergezet. In 2024 maakte bureau Rijnboutt er twintig woningen van, De Centrale; het bureau stelde ook voor het parkeerterrein eromheen een gedeelde tuin te maken.

      Let op:
      - de diepe portiek met de afgeronde raamhoek, en de gebeeldhouwde G en T (Gemeentelijke Telefoon) tussen twee blokken met de Andreaskruizen van het stadswapen
      - de oorspronkelijke huisnummers in de portiek
      - de doorlopende betonnen luifel en de ver overstekende goot, die de lengte benadrukken
      - de met ijzer beslagen inrit aan de kant van de Lodewijk Boisotstraat
    attributes:
      original_use: Telefooncentrale met personeelswoningen
    sources:
      - https://data.amsterdam.nl/monumenten/1db676d4-6fe0-452e-9aac-63a96eb321bb

- title: Surinameplein housing by Roodenburgh
  summary: "Two quarter-circles of red brick that turn the Surinameplein into a gateway, with shop arcades, corner towers and tall brick fins. Begun by Jordanus Roodenburgh in 1927 and only completed in 1956."
  body: |
    Jordanus Roodenburgh, who had worked for De Bazel and designed the old Ajax stadium, designed the blocks that enclose the Surinameplein at the southern end of the Hoofdweg. They went up in phases: the Hoofdweg front and the eastern quarter-circle in 1927, the opposite quarter-circle and the Sloterkade side in 1929, the Baarsjesweg part in 1928, and two links only after the war, in 1955 and 1956. The post-war parts follow the scheme but are noticeably plainer.

    The half-round square was later absorbed into Cornelis van Eesteren's traffic plan for the Surinameplein, so the blocks mark a hinge between Berlage-style closed street walls and the modern General Extension Plan. Shop galleries line both sides of the Surinamestraat, and towers at the corners frame it like a gate.

    Look for:
    - tall brick fins set at right angles to the curved façades, marking where one block meets the next
    - many-sided porches with angled reveals and three-sided bay windows under wide wooden gutters
    - diamond-shaped openings into the shop arcades on the Surinamestraat
    - the difference in detail between the 1920s and the 1950s towers
  category: housing
  lat: 52.359076
  lng: 4.853688
  address: Surinameplein, Hoofdweg 2-8, Surinamestraat, Baarsjesweg 310-313, Sloterkade
  links:
