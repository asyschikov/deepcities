    - "Round 4 merge: https://www.4en5mei.nl/oorlogsmonumenten/zoeken/3285 (in Het Sieraad, Postjesweg 1: bronze plaque in the shape of a Star of David with two plates, 'Van school verwijderd:' and the four names with birth dates; made in the early 1990s by pupils of the Ambachtsschool; two died in a camp, nothing known of the other two; unveiled 4 May 2008 by Bloeme Evers of Synagoge West and rabbi Menachem Evers)"
    - "https://www.4en5mei.nl/oorlogsmonumenten/zoeken/3285"
  nl:
    title: Het Sieraad
    summary: "Een ambachtsschool uit 1921-1923 op een vliegervormig stuk grond dat bijna rondom aan het water ligt. Beeldhouwwerk van Hildo Krop toont de vakken en de zeereizen van de admiraals, met het motto 'zonder moeite niets'."
    body: |
      Wat je hier leerde, stond op de gevel. Rond de hoofdingang verwijst tufsteenwerk van Hildo Krop naar de vakken van de school en naar de zeereizen van de admiraals die de straten in de buurt hun naam gaven. Een man en een vrouw houden het stadswapen vast en de spreuk *zonder moeite niets*.

      A.J. Westerman van Publieke Werken ontwierp het gebouw voor de Vierde Ambachtsschool; het kwam in 1921-1923 af, op een vijfhoekig perceel dat bijna helemaal aan het water ligt. Binnen loopt een gang rondom een binnenplaats, met de lokalen eraan. Voorop zit een extra verdieping met wat vroeger de museumzaal was. Het rijksregister noemt het een rijk uitgevoerde gemeentelijke school voor beroepsonderwijs. Later zat hier de vakschool voor edelsmeden en uurwerkmakers. Na het vertrek van de school in 2002 volgde een restauratie, kreeg de binnenplaats een glazen dak en kwamen er een evenementenlocatie, werkplekken en een restaurant.

      Binnen hangt een bronzen davidster, begin jaren negentig gemaakt door leerlingen van de ambachtsschool. Hij is er voor vier Joodse leerlingen die in de oorlog 'van school verwijderd' werden en gedeporteerd: Wolf Heinz Fischer, Hans Rosenstein, Jonas Swaab en Johan Cornelis Syes. Twee van hen kwamen om in de kampen, van de andere twee weet niemand wat er gebeurde. De onthulling was op 4 mei 2008.

      Let op:
      - Krops beeldhouwwerk rond de ingang en het smeedijzeren traliewerk met golfmotieven
      - de halfronde bakstenen erkers op gebeeldhouwde consoles boven de zij-ingangen
      - de lange horizontale raambanden en de holle voorgevel
      - binnen, als het gebouw open is, de davidster van de leerlingen met de vier namen
    attributes:
      architect: A.J. Westerman (Dienst Publieke Werken)
      original_use: Ambachtsschool
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/527153
      - https://nl.wikipedia.org/wiki/Het_Sieraad

- title: Former Apostolic church, Witte de Withstraat (now a mosque)
  summary: "A small Greek-cross church of 1920–1921 that looks like Frank Lloyd Wright came to De Baarsjes: built for an Apostolic congregation and since 1997 a mosque."
  body: |
    The plan for this "meeting hall with minister's house" was submitted to the municipality of Sloten, which still governed the area: the permit dates from April 1920 and the building was in use by May 1921. It was built for an Apostolic congregation, a movement that grew out of a 19th-century English revival and favoured the Greek cross for its churches. The design is signed by Th.W. Rueter, known for country houses in the Gooi, and H.F. Sijmons; the register suspects Sijmons, who had already built an Apostolic church on the Henri Polaklaan, set the tone.

    In 1996–1997 the Stichting Moskee Nour converted the church into a mosque and community centre, with a basement prayer room planned inside the old foundations of brick arches on wooden piles. The cubic masses, strong horizontals and deep overhangs show the influence of Frank Lloyd Wright.

    Look for:
    - the raised square centre of the Greek cross above the lower arms
    - the corner entrance, cut off at an angle, with two empty niches above it where statues once stood
    - the stair tower on the Witte de Withstraat side, crowned with a cap
    - the attached minister's house on the Van Kinsbergenstraat
  category: religious
  lat: 52.368524
  lng: 4.859251
  address: Witte de Withstraat 96, Van Kinsbergenstraat 55
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/bfbe8d93-986f-4efc-8cd0-d747efd67a18" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "200687"
    built: 1920–1921
    architect: Th.W. Rueter and H.F. Sijmons
    listed: 2013
    original_use: Apostolic church with minister's house
  photos:
    - commons:File:Witte de Withstr 96, Amsterdam.jpg
  sources:
    - city:200687 (register text; text gives permit 1920 and use from 1921, metadata says 1923–1925; record is named "Nieuw Apostolische Kerk", text speaks of "Apostolische kerk" / Gemeente van Apostolische Christenen)
  nl:
    title: Voormalige Apostolische kerk Witte de Withstraat (nu moskee)
    summary: "Een kerkje op een Grieks kruis uit 1920–1921 dat eruitziet alsof Frank Lloyd Wright in De Baarsjes langs is geweest. Gebouwd voor een Apostolische gemeente, sinds 1997 een moskee."
    body: |
      Kubussen op elkaar gestapeld, sterke horizontale lijnen en diepe overstekken: wie op deze straathoek in De Baarsjes staat, ziet de invloed van Frank Lloyd Wright.

      Het plan voor deze 'vergaderzaal met ambtswoning' ging naar de gemeente Sloten, die hier toen nog de baas was. De bouwvergunning kwam in april 1920, en in mei 1921 was het gebouw in gebruik. Het was bedoeld voor een Apostolische gemeente. Die beweging kwam voort uit een Engelse opwekking uit de negentiende eeuw en bouwde haar kerken het liefst op een Grieks kruis. Op de tekening staan twee namen. Th.W. Rueter maakte vooral landhuizen in het Gooi; H.F. Sijmons had al een Apostolische kerk aan de Henri Polaklaan gebouwd. Het monumentenregister vermoedt dat Sijmons de toon zette.

      In 1996–1997 verbouwde de Stichting Moskee Nour de kerk tot moskee en ontmoetingsruimte. Het plan voorzag in een gebedsruimte in de kelder, binnen de oude fundering van gemetselde bogen op houten palen.

      Let op:
      - het verhoogde vierkante middendeel van het Griekse kruis boven de lagere armen
      - de schuin afgesneden hoekingang, met daarboven twee lege nissen waar ooit beelden stonden
      - de traptoren aan de kant van de Witte de Withstraat, met een helm erop
      - de aangebouwde ambtswoning aan de Van Kinsbergenstraat
    attributes:
      original_use: Apostolische kerk met ambtswoning
    sources:
      - https://data.amsterdam.nl/monumenten/bfbe8d93-986f-4efc-8cd0-d747efd67a18

- title: De Klimop (Admiralengracht 301)
  summary: "A 1930 nursery school by Public Works, three red-roofed volumes and a low curved wing that wraps around the playground by the Admiralengracht."
  body: |
    The Public Works department built this school for *voorbereidend onderwijs* (nursery education) in 1928–1930, at a time when the city first took the building of good schools for young children seriously. From 1935 until the 1980s it was the Klimop (Ivy) nursery school. In 1994 it became a day-care centre for babies and toddlers, keeping the main layout.

    The building shows its inside on the outside: two big playrooms under a cross gable at the west end, then six classrooms along a corridor, and a two-storey stair wing at the east end. A long, low wing under a flat roof, once a covered play area, encloses the playground on the canal side. The register praises it as a successful example of Public Works Amsterdam School architecture of the 1930s.

    Look for:
    - the three volumes under red pitched roofs of different heights
    - the low wing along the playground
    - the brick niches in the playground fence on the Vancouverstraat side (1996)
  category: schools
  lat: 52.373629
  lng: 4.855284
  address: Admiralengracht 301, Vancouverstraat
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/63648e7f-f55b-42f1-a631-63a426cbf52a" }
  attributes:
    heritage_status: Municipal monument
    monument_number: "200677"
    built: 1928–1930
    architect: Dienst Publieke Werken
    listed: 2013
    original_use: Nursery school
  photos: []
  sources:
    - city:200677 (register text)
  nl:
    title: De Klimop (Admiralengracht 301)
    summary: "Een kleuterschool uit 1930 van Publieke Werken: drie bouwdelen onder rode daken van verschillende hoogte, en een lage, gebogen vleugel die het speelplein aan de Admiralengracht als een arm omsluit."
    body: |
      Publieke Werken bouwde deze school voor voorbereidend onderwijs, de kleuterschool van toen, in 1928-1930. Het was de tijd waarin de stad voor het eerst echt werk maakte van degelijke schoolgebouwen, ook voor de allerkleinsten. Van 1935 tot in de jaren tachtig was dit kleuterschool De Klimop. In 1994 trok er een kinderdagverblijf voor baby's en peuters in, en de hoofdindeling bleef daarbij overeind.

      Wat binnen gebeurt, lees je buiten af. Aan de westkant liggen twee grote speellokalen onder een dwarskap, dan volgen zes klaslokalen aan een gang, en aan de oostkant staat een vleugel van twee lagen met het trappenhuis. Een lange, lage vleugel met plat dak, vroeger een overdekte speelplaats, sluit het plein aan de grachtkant af. Het register noemt het gebouw een geslaagd staaltje Amsterdamse School zoals Publieke Werken die in de jaren dertig bouwde.

      Let op:
      - de drie bouwdelen onder rode zadeldaken van verschillende hoogte
      - de lage vleugel langs het speelplein
      - de gemetselde nissen in het hek van het speelplein aan de kant van de Vancouverstraat (1996)
    attributes:
      original_use: Kleuterschool
    sources:
      - https://data.amsterdam.nl/monumenten/63648e7f-f55b-42f1-a631-63a426cbf52a

- title: Cabotstraat school island
  summary: "Three parallel Public Works schools of 1928, joined by a tall curving schoolyard wall: a rare \"school island\" laid out in strips between the Admiralengracht and the Cabotstraat."
  body: |
    In 1928 the Public Works department laid out three school buildings side by side in parallel strips, with playgrounds between them screened from the street by a high brick wall. From north to south they held the Admiralengrachtschool and Columbusschool, a nursery school, and the Cabotschool and Vasco da Gamaschool. The northern and middle schools are corridor schools, and at the northern one the classrooms face the playground. The three schools and the wall are protected together as national monuments; the register calls the strip layout a rare arrangement.

    The schools are three storeys high under red-tiled roofs; the northern and southern ones have blocky, stepped entrance wings at both ends and rows of small square windows above taller ones. The wall is architecture in its own right: it rises where it meets the end walls of the schools, with a quarter-round sweep at two of them, contains doors under a course of upright bricks, and continues along the Cabotstraat as a low parapet.

    Look for:
    - the high schoolyard wall with its quarter-round sweeps
    - the long rows of identical small windows under the roof
    - the stepped entrance blocks at the ends of the northern and southern schools
  category: schools
  lat: 52.369284
  lng: 4.856364
  address: Admiralengracht / Cabotstraat, between Jan Evertsenstraat and Willem Schoutenstraat
  links:
    - { label: Rijksmonumentenregister (527139), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/527139" }
    - { label: Rijksmonumentenregister (527140), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/527140" }
    - { label: Rijksmonumentenregister (527141), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/527141" }
    - { label: Rijksmonumentenregister (527142), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/527142" }
  attributes:
    heritage_status: National monument
    monument_number: 527139, 527140, 527141, 527142
