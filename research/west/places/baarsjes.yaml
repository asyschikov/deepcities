    - { label: Rijksmonumentenregister (527152), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/527152" }
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/b271be0d-fb4c-4be4-889a-bc802a80243d" }
  attributes:
    heritage_status: National + municipal monument
    monument_number: 527151, 527152, 200727
    built: 1926–1927
    architect: J.M. van der Mey
    original_use: Workers' housing and shops
  photos:
    - commons:File:2023 Jan Evertsenstraat 18-Krommertstraat, Asd (1).jpg
    - commons:File:Jan Evertsenstraat, toegangspoort Krommertstraat.jpg
  sources:
