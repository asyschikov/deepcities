  nl:
    title: Woonblokken Hoofdweg (G.J. Rutgers)
    summary: "Aan de Hoofdweg tussen de Willem Schoutenstraat en het Mercatorplein staan twee woonblokken van Gerrit Jan Rutgers, met witte penanten op de bovenste verdieping en afgeronde hoektorens die samen een poort vormen."
    body: |
      Wie vanaf de Willem Schoutenstraat de Hoofdweg in loopt, gaat door een poort. Daar komen de twee blokken samen in een symmetrisch geheel van afgeronde hoeken, torens en bovenverdiepingen die naar achteren wijken.

      Het zijn arbeidersflats met winkeltjes op de hoeken, in 1924-1925 neergezet door bouwmaatschappij N.V. Bouwmij. "De Berk". Z.D.J.W. Gulden en M. Geldmaker hadden al eerder ontwerpen gemaakt, maar de gevels zoals ze er nu staan zijn van G.J. Rutgers, een van de meest productieve woningbouwarchitecten van de Gordel 20-40.

      Langs de Hoofdweg zijn het lange, rustige wanden. Tussen de ramen van de bovenste verdieping staan witgeschilderde penanten, waardoor die laag haast als een tussenverdieping leest en je blik vanzelf naar het Mercatorplein wordt getrokken. Boven elk derde portiek zit een erker; waar die op de muur aansluit is hij hol afgerond in een kwartcirkel, en het balkon erop draagt sierbollen.

      Let op:
      - de afgeronde hoektorens met de ingebouwde hoekwinkeltjes aan de Willem Schoutenstraat
      - de portieken met kleine granitovloertjes en wat siermetselwerk
      - de erkers met hun kwartronde holle aansluiting op de gevel
    attributes:
      original_use: Arbeiderswoningen en winkels
    sources:
      - https://data.amsterdam.nl/monumenten/759780db-c2b5-4d87-9185-58c27c80207b

- title: Jan Evertsenstraat housing by J.F. Staal
  summary: "Jan Frederik Staal's shopping street: six long blocks with several hundred flats above more than 60 shops, flat concrete canopies, bands of glass blocks and a gateway over the Hudsonstraat."
  body: |
    J.F. Staal designed both sides of the Jan Evertsenstraat between the Admiralengracht and the Mercatorplein (1925–1926), one of the main axes of Plan West. The national register splits the complex into six blocks, A to F, each with dozens of flats over a row of shops. At the east end two matching blocks form the "visual entrance" to the street. In the north wall a gateway to the John Franklinstraat joins two blocks into one long volume, and in the south wall a gateway building spans the Hudsonstraat. The city had already protected the street walls in 1992; the state later listed them as national monuments too.

    Staal gives the five-storey walls a strong rhythm with projecting brick piers. A flat concrete canopy runs above the shops, with bands of four to seven courses of glass blocks above it. The top floor is almost blind, with hoist beams under the concrete roof edge. At the corner with the Vespuccistraat a rounded brick pier rises above the roofline.

    Look for:
    - the tall gateway over the Hudsonstraat
    - the bands of glass building blocks above the shop canopies
    - small water spouts under the window sills
    - original doors with only a narrow horizontal glass slit
  category: housing
  lat: 52.370641
