    - https://www.natuurtuinslatuinen.nl/bezoek-contact
    - https://nl.wikipedia.org/wiki/Slatuinenweg
  nl:
    title: Natuurtuin Slatuinen
    summary: "Een verborgen natuurtuin midden in een bouwblok uit de jaren twintig, bereikbaar via een smalle poort tussen de huisjes van de Slatuinenweg. Ooit park en kwekerij, sinds 1991 gered en beheerd door buurtbewoners."
    body: |
      In 1986 ging de gemeente er met de zaag doorheen, en daar begon het. Het terrein achter de huisjes van de Slatuinenweg is nooit bebouwd geweest. Eerst was het polder, vanaf 1912 een parkje (eerst Julianapark, later Wilhelminapark), en van de jaren dertig tot 1984 een kwekerij van de familie Hendriksen. Pas toen in de jaren twintig de Chassébuurt verrees, raakte het helemaal ingesloten als binnenterrein.

      Na de kwekerij verwilderde de grond, tot de gemeente in 1986 de bomen kapte. De buurt was woedend en diende een plan in: een natuurtuin die ook een sociale en educatieve taak zou krijgen. Sinds 1991 beheert de Stichting Natuurtuin Slatuinen de tuin, met vrijwilligers. De natuur mag er voor een deel haar eigen gang gaan, met vooral inheemse bomen en planten. Open is de tuin op zondagmiddag en op donderdag (kijk op de website van de stichting), en op donderdag kun je er terecht met vragen over wilde en inheemse planten.

      Let op:
      - de poort tussen de huizen bij Slatuinenweg 45 en het pad naar het tuingebouwtje
      - de wilde kievitsbloem in het voorjaar
      - de achterkanten van de blokken uit de jaren twintig aan de Chasséstraat en de Jacob van Wassenaer Obdamstraat, die de tuin insluiten
    sources:
      - https://www.natuurtuinslatuinen.nl/historie
      - https://www.natuurtuinslatuinen.nl/bezoek-contact

- title: Chassékerk
  summary: A 1926 Catholic church for 1,200 people under a huge mansard roof, saved from demolition by its neighbours, squatted for a few days in 2004 and now a dance centre.
  body: |
    The parish priest Johannes Huibers, later Bishop of Haarlem, set out to serve the Catholics moving into the new western districts. Karel Petrus Tholens designed the church and presbytery (1924–1926), and it was consecrated in November 1926 to Our Lady of Perpetual Help. It was part of a complex with a convent, a girls' school and a nursery school. A wide nave with narrow aisles and no pillars gave all 1,200 worshippers a clear view of the altar, which faces east.

    Declining attendance closed the church in 1998. The parish wanted to demolish it and build housing; the district first put it on the municipal monument list in 2003, then withdrew the listing after the parish objected. Squatters took it in September 2004 and were evicted by riot police a few days later. Neighbours fought off a second demolition plan by the housing corporation Ymere, and in 2011 a businessman bought it and turned it into a cultural centre focused on dance.

    Look for:
    - the two surviving towers
    - the vast mansard roof that covers the whole building
    - sculpture by Kees Smout near the entrances and in the gable
  category: religious
  lat: 52.369783
  lng: 4.861748
  address: Chasséstraat 62
  links:
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Chass%C3%A9kerk" }
  photos:
    - commons:File:Amsterdam Chassékerk (01).jpg
  sources:
    - https://nl.wikipedia.org/wiki/Chassékerk
    - rce:527107 (RCE linked data marks it "geen rijksmonument")
  nl:
    title: Chassékerk
    summary: "Een katholieke kerk uit 1926 voor 1200 gelovigen onder een enorm mansardedak. De buurt hield de sloop tegen, krakers zaten er in 2004 een paar dagen in en nu wordt er gedanst."
    body: |
      Deze kerk zou twee keer tegen de vlakte gaan. Ze staat er nog, en tegenwoordig wordt er gedanst.

      Bouwpastoor Johannes Huibers, die later bisschop van Haarlem werd, wilde een kerk voor de katholieken die in de nieuwe westelijke wijken kwamen wonen. Karel Petrus Tholens tekende kerk en pastorie (1924-1926), en in november 1926 werd de kerk gewijd aan Onze-Lieve-Vrouw van Altijddurende Bijstand. Er hoorden ook een zusterhuis, een meisjesschool en een kleuterschool bij. Een breed middenschip met smalle zijbeuken en geen enkele pilaar: zo konden alle 1200 kerkgangers het altaar zien, dat op het oosten ligt.

      Omdat steeds minder mensen kwamen, sloot de kerk in 1998. De parochie wilde slopen en er woningen bouwen. Het stadsdeel zette de kerk in 2003 op de gemeentelijke monumentenlijst, maar draaide dat terug na bezwaar van de parochie. In september 2004 trokken krakers erin; een paar dagen later zette de ME ze eruit. Daarna kwam woningcorporatie Ymere met een nieuw sloopplan, en weer kwam de buurt in verzet, met succes. In 2011 kocht een zakenman het gebouw en maakte er een cultureel centrum van, met de nadruk op dans.

      Let op:
      - de twee torens die bewaard zijn gebleven
      - het enorme mansardedak dat het hele gebouw overkapt
      - beeldhouwwerk van Kees Smout bij de ingangen en in de topgevel
    sources:
      - https://nl.wikipedia.org/wiki/Chassékerk

- title: Westermoskee
  summary: "A Turkish mosque that took 22 years and many fights to get from site purchase to opening, designed by French architects to echo the Amsterdam School brickwork around it, with a 43-metre minaret and a square named after the Turkish explorer Piri Reis."
  body: |
    In 1994 the Turkish association Milli Görüş bought the derelict Riva site by the Kostverlorenvaart to build a mosque. The district council found the plan too big and wanted it folded into its own renewal of the Chassébuurt, and years of bitter conflict followed. A deal in 2000 combined a smaller mosque with 111 homes, offices, community space and an underground car park, all by the French architect couple Breitman. Neighbours' objections over the demolition of older buildings and the height of the minaret delayed it another six years, and construction of the mosque itself only began in April 2013. It opened on 1 April 2016.

    The Breitmans designed the housing and the mosque to relate to the Amsterdam School buildings around them, with careful brickwork details, so that the mosque and its minaret sit inside a recognisably Amsterdam ensemble. The mosque got a Dutch name, Westermoskee.

    Look for:
    - Amsterdam School-style brick housing wrapped around the mosque
    - the minaret, at the height an arbitration committee insisted on to keep the composition intact
    - the Piri Reisplein in front, named after the Turkish explorer Piri Reis
    - the Piri Reïs apartments (2011) on the same site, also by the Breitmans, with an arched passage to the Witte de Withstraat: they borrow the look of the first, unbuilt design for the mosque, which took the Ottoman master builder Sinan as its model
  category: religious
  lat: 52.3663
  lng: 4.860448
  address: Piri Reisplein 101
  links:
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Westermoskee" }
  photos:
    - commons:File:Westermoskee - Amsterdam (26579109769).jpg
    - commons:File:Westermoskee Aya Sofya (Amsterdam, The Netherlands 2017).jpg
    - commons:File:Westermoskee in aanbouw.JPG
  sources:
    - https://nl.wikipedia.org/wiki/Westermoskee
    - "Round 4 merge: https://gebouwdin.amsterdam.nl/api/projectdetail/865 (Piri Reïs, 2011, Breitman - Breitman, 111 homes for Stadgenoot on the former RIVA site; architecture refers to the unbuilt Westermoskee design, for which the Breitmans took Sinan's ideas as a starting point; brickwork details to fit the Amsterdam School surroundings; high arched passage to the Witte de Withstraat)"
    - "https://gebouwdin.amsterdam.nl/project/865"
  nl:
    title: Westermoskee
    summary: "Een Turkse moskee die 22 jaar en veel ruzie nodig had van grondaankoop tot opening. Franse architecten pasten haar in het metselwerk van de Amsterdamse School eromheen. Met een minaret van 43 meter en een plein vernoemd naar ontdekkingsreiziger Piri Reis."
    body: |
      Een arbitragecommissie moest eraan te pas komen om de minaret op hoogte te houden. Dat zegt iets over de weg ernaartoe. In 1994 kocht de Turkse vereniging Milli Görüş het verlaten Riva-terrein aan de Kostverlorenvaart om er een moskee te bouwen. Het stadsdeel vond het plan te groot en wilde het onderbrengen in de eigen vernieuwing van de Chassébuurt. Er volgde een jarenlange, felle strijd.

      In 2000 kwam er een akkoord: een kleinere moskee, samen met 111 woningen, kantoren, ruimte voor buurtvoorzieningen en een parkeergarage onder de grond, alles ontworpen door het Franse architectenpaar Breitman. Bezwaren van buren, over de sloop van oudere panden en de hoogte van de minaret, kostten nog eens zes jaar. Aan de moskee zelf werd pas in april 2013 begonnen, en op 1 april 2016 ging ze open.

      De Breitmans ontwierpen woningen en moskee zo dat ze aansluiten op de Amsterdamse Schoolbouw in de buurt, met veel zorg voor het metselwerk. Zo staan moskee en minaret midden in een ensemble dat onmiskenbaar Amsterdams is. De moskee kreeg een Nederlandse naam: Westermoskee.

      Let op:
      - de bakstenen woningen in Amsterdamse Schoolstijl die om de moskee heen liggen
      - de minaret, op de hoogte waar een arbitragecommissie op stond om de compositie heel te houden
      - het Piri Reisplein ervoor, vernoemd naar de Turkse ontdekkingsreiziger Piri Reis
      - het appartementengebouw Piri Reïs (2011) op hetzelfde terrein, ook van de Breitmans, met een doorgang onder bogen naar de Witte de Withstraat: het leent het uiterlijk van het eerste, nooit gebouwde moskeeontwerp, dat de Ottomaanse bouwmeester Sinan als voorbeeld nam
    sources:
      - https://nl.wikipedia.org/wiki/Westermoskee
      - https://gebouwdin.amsterdam.nl/project/865

- title: Machineslootbrug
  summary: "Piet Kramer's 1929–1930 bridge carrying the Postjesweg over the Admiralengracht, built after residents campaigned against the narrow emergency bridges. Its railings end in sea anemones."
  body: |
    When Amsterdam annexed Sloten in 1921 and grew westward, it reached the new district over two narrow wooden emergency bridges (1923) at the Jan Evertsenstraat and the Postjesweg. With some 35,000 people moving into the Mercator area they could not cope, and shopkeepers and residents kept demanding proper bridges. When the council finally released 330,000 guilders in 1928, the neighbourhood held a festival week. Piet Kramer designed this bridge and its twin, the Molenslootbrug; both date from 1929–1930.

    The bridge matches the Amsterdam School style of the former trade school, Het Sieraad, right next to it. Brick alternates with granite, which carries carving probably by Hildo Krop. The name refers to the Machinesloot, an old name for the waterway roughly where the Admiralengracht now runs; locals also called it the Ambachtsbrug, after the school. The water was much lower then, at the level of the Sloterpolder, and was only raised to canal level in 1952.

    Look for:
    - the wrought-iron railings that end at the abutments in the shape of a sea anemone
    - carved granite blocks among the brickwork
    - the railings broken into sections; on the twin bridge they run through
  category: infrastructure
  lat: 52.364739
  lng: 4.858181
  address: Postjesweg over the Admiralengracht (bridge 358)
  links:
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Machineslootbrug" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q18434287" }
  attributes:
    built: 1929–1930
    architect: Piet Kramer
  photos:
    - commons:File:2019 Brug 358, overzicht (1).jpg
    - commons:File:Machineslootbrug1930.jpg
  sources:
    - https://nl.wikipedia.org/wiki/Machineslootbrug
    - research/ams-school/places/oud-west-baarsjes.yaml (Machineslootbrug)
  nl:
    title: Machineslootbrug (brug 358)
    summary: "Piet Kramers brug uit 1929-1930 waarover de Postjesweg de Admiralengracht oversteekt. De buurt had erop aangedrongen, want de houten noodbruggen waren veel te smal. De hekken lopen uit in zeeanemonen."
    body: |
      Toen het geld er eindelijk kwam, vierde de buurt dat met een feestweek. Na de annexatie van Sloten in 1921 groeide Amsterdam naar het westen, en vanaf 1923 kon je de nieuwe wijk alleen bereiken via twee smalle houten noodbruggen, bij de Jan Evertsenstraat en bij de Postjesweg. In de Mercatorbuurt woonden zo'n 35.000 mensen, en dat trokken die bruggetjes niet. Winkeliers en bewoners bleven aandringen op echte bruggen. In 1928 kwam er 330.000 gulden beschikbaar. Piet Kramer ontwierp deze brug en haar zusje, de Molenslootbrug; ze zijn allebei van 1929-1930.

      De brug past bij de oude ambachtsschool ernaast, het huidige Sieraad, die ook in Amsterdamse Schoolstijl is gebouwd. Baksteen en graniet wisselen elkaar af, en in het graniet zit beeldhouwwerk, vermoedelijk van Hildo Krop. De Machinesloot, waar de naam vandaan komt, was een oude waterweg die ongeveer de loop van de Admiralengracht volgde. In de buurt zei men ook Ambachtsbrug, naar de school. Het water lag toen een stuk lager, op het peil van de Sloterpolder; pas in 1952 is het opgezet tot grachtenpeil.

      Let op:
      - de smeedijzeren hekken, die bij de landhoofden uitlopen in een zeeanemoon
      - blokken bewerkt graniet tussen het metselwerk
      - de hekken zijn hier in stukken opgedeeld; op de zusterbrug lopen ze door
    sources:
      - https://nl.wikipedia.org/wiki/Machineslootbrug

- title: Molenslootbrug
  summary: "The twin of the Machineslootbrug, carrying the Jan Evertsenstraat over the Admiralengracht between Van der Mey's gatekeeper towers, with an unusual zebra crossing in the middle of the bridge."
  body: |
    The emergency bridge that stood here from 1923 let trams 7 and 17 reach the Mercatorplein in July 1927. It was narrow, on the north side of the street only, and traffic had to swerve right and then left to cross it. Piet Kramer's permanent bridge, built in 1929–1930 together with the Machineslootbrug, replaced it. It has the same mix of brick, granite with carving probably by Hildo Krop, and wrought-iron railings. The name comes from the Molensloot, an old name for this part of the Admiralengracht.

    Unusually for Amsterdam, the zebra crossing lies in the middle of the bridge instead of on the quays. After the jeweller Fred Hund was shot dead in a robbery in 2010, residents made a mosaic *social sofa* bench in his memory at the south-west corner. Locals called the bridge the Hundbrug. The bench disappeared during works in 2022, and work to renew the bridge itself began in 2021.

    Look for:
    - the railings ending in sea anemones at the abutments, running through without a break
    - the zebra crossing on the bridge deck
    - Van der Mey's corner towers framing the bridge on both sides
  category: infrastructure
  lat: 52.371122
  lng: 4.856569
  address: Jan Evertsenstraat over the Admiralengracht (bridge 359)
  links:
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Molenslootbrug_(Amsterdam)" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q15943544" }
  attributes:
    built: 1929–1930
    architect: Piet Kramer
  photos:
    - commons:File:Molenslootbrug.jpg
    - commons:File:2019 Brug 359, overzicht.jpg
    - commons:File:2019 Brug 359, siersmeedwerk.jpg
  sources:
    - https://nl.wikipedia.org/wiki/Molenslootbrug_(Amsterdam)
    - research/ams-school/places/oud-west-baarsjes.yaml (Molenslootbrug)
    - "https://data.amsterdam.nl/monumenten/b271be0d-fb4c-4be4-889a-bc802a80243d"
    - "https://nl.wikipedia.org/wiki/Machineslootbrug"
  nl:
    title: Molenslootbrug (brug 359)
    summary: "Het zusje van de Machineslootbrug: hier steekt de Jan Evertsenstraat de Admiralengracht over, tussen de hoektorens van Van der Mey die als poortwachters staan. Met een zebrapad op een vreemde plek, midden op de brug."
    body: |
      Normaal ligt het zebrapad bij een Amsterdamse brug op de kade. Hier niet: wie oversteekt, doet dat midden op het brugdek.

      Eerst stond hier een noodbrug, vanaf 1923. In juli 1927 konden trams 7 en 17 daaroverheen doorrijden naar het Mercatorplein. Veel stelde hij niet voor: hij lag alleen aan de noordkant van de straat, en het verkeer maakte eerst een slinger naar rechts en daarna weer naar links. Piet Kramer bouwde in 1929-1930 de vaste brug, in één moeite door met de Machineslootbrug. Zelfde recept: baksteen, graniet met beeldhouwwerk dat waarschijnlijk van Hildo Krop is, en hekken van siersmeedijzer. De naam komt van de Molensloot, zoals dit stuk van de Admiralengracht vroeger heette.

      In 2010 werd juwelier Fred Hund bij een overval doodgeschoten. Buurtbewoners legden daarna op de zuidwesthoek een bank met mozaïek voor hem aan, een social sofa, en in de buurt heette de brug voortaan de Hundbrug. Bij werkzaamheden in 2022 is de bank verdwenen. Aan de vernieuwing van de brug zelf is in 2021 begonnen.

      Let op:
      - de hekken die bij de landhoofden in zeeanemonen eindigen en hier ononderbroken doorlopen
      - het zebrapad op het brugdek
      - de hoektorens van Van der Mey, aan weerszijden van de brug
    sources:
      - https://nl.wikipedia.org/wiki/Molenslootbrug_(Amsterdam)

- title: 4 May memorial, Columbusplein (Nina Rave)
  summary: "The neighbourhood's war memorial since 2018: a dark block balancing on a dented golden sphere, its surface cut with more than eighty fingerprints of local children and residents."
  body: |
    De Baarsjes holds its annual 4 May Remembrance Day ceremony here. From 2006 it gathered at a simple white cross in front of the Visserschool: *Aan hen die vielen* (to those who fell), the neighbourhood's own memorial to residents killed in the war, put up by local people on the Van Speijkstraat and moved to the square when that street was redone. In 2018 the artist Nina Rave gave the square this new memorial, made in close collaboration with the neighbourhood, and the school adopted it. The white cross has since moved to the Baarsjesweg near the Van Speijkstraat.

    A large dark block, standing for evil, balances on a golden sphere that stands for resistance, hope, self-respect and humanity. The sphere is dented: those values are under pressure but do not give way. Children, young people and residents cut more than eighty fingerprints into the surface of the block. The sphere mirrors the square around it, and with it, as the city's public-art curators put it, the presence of those who are no longer there.

    Look for:
    - the fingerprints on the block
    - your own reflection in the golden sphere
    - the granite inscription on the base: "Wij gedenken hen die leden, hen die stierven, hen die streden" (we remember those who suffered, those who died, those who fought)
    - the paving and street lamps of the square, designed by the artists Carolina Agelink and Germa Huijbers: the lamps are shaped like standard lamps, with little fantasy figures in the shades
    - a short walk south, on the corner of the Postjesweg and the Marco Polostraat, a white stone with a relief for Jan Frederik Dalemans and Johannes Geerbertus Gerritze, executed by the occupiers; the tenants of the housing association Amsterdam-Zuid gave it in 1946
  category: hidden-history
  lat: 52.365358
  lng: 4.855483
  address: Columbusplein
  links:
    - { label: Stadscuratorium Amsterdam, url: "https://stadscuratorium.nl/?p=3504" }
    - { label: 4en5mei.nl (monument 1491), url: "https://www.4en5mei.nl/oorlogsmonumenten/zoeken/1491" }
    - { label: 4en5mei.nl (monument 1498), url: "https://www.4en5mei.nl/oorlogsmonumenten/zoeken/1498" }
    - { label: Buitenkunst Amsterdam (Columbusplein), url: "https://www.buitenkunstamsterdam.nl/Kunstwerken/2545/zonder-titel" }
  attributes:
    built: "2018"
    artist: Nina Rave
    check: Location
    check_note: "Where the white cross Aan hen die vielen stands now: the national memorial register says the Baarsjesweg by the Van Speijkstraat, OSM still maps it in front of the Visserschool."
  photos:
    - commons:File:Nieuw monument Columbusplein, onthulling april 2018.jpg
    - commons:File:Monument Columbusplein, 2018, informatiebord.jpg
  sources:
    - https://stadscuratorium.nl/?p=3504
    - OSM node at 52.365358,4.855483 (artist Nina Rave, war_memorial, 2018)
    - "Round 4 merges: https://www.4en5mei.nl/oorlogsmonumenten/zoeken/1491 (white cross 'Aan hen die vielen', for all Baarsjes residents killed by acts of war, residents' initiative; originally on the Van Speijkstraat, moved to the Columbusplein in January 2006 because of street works, later to the Baarsjesweg at the Van Speijkstraat); OSM node 3771893605 still at Columbusplein 34 (Visserschool). https://www.4en5mei.nl/oorlogsmonumenten/zoeken/1498 (white natural-stone plaque with relief, corner Postjesweg/Marco Polostraat; Dalemans b. 21-9-1908, Gerritze b. 30-6-1913, executed; gift of the residents of woningbouwvereeniging Amsterdam-Zuid afd. West; unveiled Saturday 12 October 1946); OSM node 4455502733 at Marco Polostraat 1. Kunstwacht 2545 (Agelink and Huijbers, commissioned by stadsdeel De Baarsjes: paving and lamp posts shaped as standard lamps with fantasy figures in the shades). Correction: 'for decades' at the cross was wrong, it stood here only from 2006."
    - "https://www.buitenkunstamsterdam.nl/Kunstwerken/2545/zonder-titel"
  nl:
    title: 4 mei-monument Columbusplein (Nina Rave)
    summary: "Sinds 2018 het oorlogsmonument van de buurt: een donker blok dat balanceert op een gedeukte gouden bol, met in het oppervlak ruim tachtig vingerafdrukken van kinderen en bewoners uit De Baarsjes."
    body: |
      Een groot donker blok rust op een gouden bol, en die bol heeft deuken. Het blok staat voor het kwaad. De gouden bol betekent verzet, hoop, eigenwaarde en menselijkheid: waarden die onder druk staan maar het niet opgeven. Kinderen, jongeren en buurtbewoners sneden samen meer dan tachtig vingerafdrukken in het blok. In de glanzende bol spiegelt het plein, en daarmee, zoals het Stadscuratorium het zegt, ook de mensen die er niet meer zijn.

      Hier houdt De Baarsjes elk jaar de herdenking op 4 mei. Vanaf 2006 gebeurde dat bij een eenvoudig wit kruis voor de Visserschool: *Aan hen die vielen*, het eigen monument van de buurt voor bewoners die in de oorlog omkwamen. Buurtbewoners hadden het ooit aan de Van Speijkstraat neergezet, en toen die straat op de schop ging, verhuisde het naar het plein. In 2018 kreeg het plein dit nieuwe monument van kunstenaar Nina Rave, gemaakt in nauw overleg met de buurt; de school adopteerde het. Het witte kruis staat inmiddels aan de Baarsjesweg, bij de Van Speijkstraat.

      Let op:
      - de vingerafdrukken op het blok
      - je eigen spiegelbeeld in de gouden bol
      - de tekst in graniet op de sokkel: "Wij gedenken hen die leden, hen die stierven, hen die streden"
      - de bestrating en lantaarns van het plein, ontworpen door de kunstenaars Carolina Agelink en Germa Huijbers: de lantaarns hebben de vorm van schemerlampen, met kleine fantasiefiguurtjes in de kappen
      - een eindje naar het zuiden, op de hoek van Postjesweg en Marco Polostraat, een witte steen met reliëf voor Jan Frederik Dalemans en Johannes Geerbertus Gerritze, door de bezetter gefusilleerd; de huurders van woningbouwvereniging Amsterdam-Zuid schonken hem in 1946
    attributes:
      check_note: "Waar het witte kruis Aan hen die vielen nu staat: het register van oorlogsmonumenten zegt aan de Baarsjesweg bij de Van Speijkstraat, OSM tekent het nog voor de Visserschool."
    sources:
      - https://stadscuratorium.nl/?p=3504
      - https://www.4en5mei.nl/oorlogsmonumenten/zoeken/1491
      - https://www.4en5mei.nl/oorlogsmonumenten/zoeken/1498

- title: War memorial, Witte de Withstraat
  summary: "A small gravestone-like stone set into a house front in June 1945, for a chemist and a father and son from this street who were executed in reprisal in April 1945, as the war was ending."
  body: |
    A resistance group from Langedijk blew up a German van near Den Helder, thinking it was an ammunition transport; five people died. In reprisal the Germans executed eight prisoners at Zijpersluis on 11 April 1945. Three of them came from this street and had been arrested earlier for resistance work: Jacob Miedema, who ran a chemist's shop at no. 80, and Dirk Bons and his son Ton (Antonie Pieter), who lived upstairs at no. 82.

    On 25 June 1945, Joke Bons, herself a courier, unveiled this stone before a large crowd, though the press barely noticed. Flowers are still laid here every 4 May.

    Look for:
    - the stone in the façade between nos. 78 and 80
    - the inscription "Zij vielen voor het vaderland" (they fell for the fatherland)
  category: hidden-history
  lat: 52.367832
  lng: 4.859265
  address: Witte de Withstraat 78-80
  links:
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Oorlogsmonument_Witte_de_Withstraat" }
  attributes:
    built: "1945"
  photos:
    - commons:File:2024 Oorlogsmonument Witte de Withstraat, Asd (A).jpg
  sources:
    - https://nl.wikipedia.org/wiki/Oorlogsmonument_Witte_de_Withstraat
    - https://nl.wikipedia.org/wiki/Witte_de_Withstraat_(Amsterdam)
  nl:
    title: Oorlogsmonument Witte de Withstraat
    summary: "Een steentje in de vorm van een grafsteen, in juni 1945 in een gevel gezet voor een drogist en een vader en zoon uit deze straat. Ze werden in april 1945, met het einde van de oorlog in zicht, als represaille gefusilleerd."
    body: |
      De verzetsgroep uit Langedijk dacht bij Den Helder een munitietransport te raken. Wat ze opbliezen was een Duits busje, en vijf mensen kwamen om. De Duitsers namen wraak: op 11 april 1945 fusilleerden ze acht gevangenen bij Zijpersluis. Drie van hen woonden of werkten in deze straat en zaten al vast voor verzetswerk. Jacob Miedema had een drogisterij op nummer 80. Dirk Bons en zijn zoon Ton (Antonie Pieter) woonden een hoog op nummer 82. Het einde van de oorlog was toen al in zicht.

      Op 25 juni 1945 onthulde Joke Bons, die zelf koerier was geweest, de steen. Er stond veel publiek bij; de kranten besteedden er nauwelijks aandacht aan. Elk jaar op 4 mei worden hier nog bloemen gelegd.

      Let op:
      - de steen in de gevel tussen nummer 78 en 80
      - de tekst "Zij vielen voor het vaderland"
    sources:
      - https://nl.wikipedia.org/wiki/Oorlogsmonument_Witte_de_Withstraat

- title: Damsko Strijder (Eberhard van der Laan portrait)
  summary: "A portrait of the late mayor Eberhard van der Laan on the car-park lift shaft of the Mercatorplein, with the line that closed his letter to Amsterdam: \"Take good care of our city and of each other\"."
  body: |
    Shortly before his death, Eberhard van der Laan, who had lung cancer, wrote a letter to all Amsterdammers. It ended with *Zorg goed voor onze stad en voor elkaar*: take good care of our city and of each other.

    In February 2017, just after his illness became known, the graffiti collective Kamp Seedorf (known for Ajax-related pieces around the city) put up a portrait of him, *Damsko Strijder* (roughly "Amsterdam fighter"), on the Wibautstraat. A month later a GVB cleaner removed it. In a public vote for a memorial artwork in January 2019 the design won by far, with more than 4,000 votes out of 59 entries. It went onto the lift shaft of the underground car park at the Mercatorplein, long considered an eyesore, and Van der Laan's widow, Femke van der Laan, unveiled it on 1 July 2019.

    Look for:
    - the farewell sentence painted with the portrait
    - the lift shaft's spot among Berlage's square walls
  category: street-art
  lat: 52.369428
  lng: 4.851367
  address: Mercatorplein
  links:
    - { label: Wikipedia (nl) Mercatorplein, url: "https://nl.wikipedia.org/wiki/Mercatorplein_(Amsterdam)" }
    - { label: NH Nieuws, url: "https://www.nhnieuws.nl/nieuws/238021" }
    - { label: Wikidata, url: "https://www.wikidata.org/wiki/Q111514256" }
  attributes:
    built: "2019"
    artist: Kamp Seedorf
  photos:
    - commons:File:Van der Laan, Mercatorplein (1).jpg
  sources:
    - https://nl.wikipedia.org/wiki/Mercatorplein_(Amsterdam)
    - wd:Q111514256 (coordinates)
    - https://www.nhnieuws.nl/nieuws/238021
  nl:
    title: Damsko Strijder (portret Eberhard van der Laan)
    summary: "Burgemeester Eberhard van der Laan op de liftschacht van de parkeergarage onder het Mercatorplein, en de slotzin van zijn brief aan de stad, die vraagt om goed te zorgen voor Amsterdam en voor elkaar."
    body: |
      Het portret is al eens weggepoetst. In februari 2017, kort nadat bekend was geworden dat Eberhard van der Laan longkanker had, zette het graffiticollectief Kamp Seedorf hem op de Wibautstraat: Damsko Strijder. De stad kende het collectief vooral van zijn Ajax-graffiti. Een maand later haalde een schoonmaker van het GVB de tekening weg.

      Vlak voor zijn dood schreef Van der Laan een brief aan alle Amsterdammers. Die eindigde met de oproep om goed te zorgen voor onze stad en voor elkaar.

      Toen er in januari 2019 een publieksstemming kwam voor een kunstwerk ter nagedachtenis, ging Damsko Strijder er met afstand vandoor: ruim 4000 stemmen, uit 59 inzendingen. Het portret kreeg een plek op de liftschacht van de ondergrondse garage aan het Mercatorplein, een ding dat al jaren als lelijk gold. Weduwe Femke van der Laan onthulde het op 1 juli 2019.

      Let op:
      - de afscheidszin die bij het portret is geschilderd
      - waar de liftschacht staat, tussen de pleinwanden van Berlage
    sources:
      - https://nl.wikipedia.org/wiki/Mercatorplein_(Amsterdam)
      - https://www.nhnieuws.nl/nieuws/238021

- title: Levensboom, Monument van Besef
  summary: "A tree-of-life sculpture on the Surinameplein where Amsterdam has marked the abolition of Dutch slavery every 30 June since 1993: the community's own memorial, unveiled in 2003."
  body: |
    On 1 July 1863 slavery was abolished in Suriname and the Dutch Caribbean islands. From 1993 people have gathered on the Surinameplein every 30 June for the *Nationale Dag van Besef* (National Day of Awareness). The journalist and broadcaster Roy Ristie and the 30 June/1 July Committee were among the initiators, and modelled it on the 4 and 5 May remembrance: a day of reflection on 30 June, a day of celebration (Keti Koti) on 1 July.

    When the national slavery monument was unveiled in the Oosterpark in 2002, the committee felt that location was wrong and pressed for a memorial on the square where the ceremony had already been held for ten years. Henry Renfurm's Levensboom (tree of life) was unveiled here on 30 June 2003. Its trunk stands for the ethnic diversity of the community, its foliage for the countries of the former Kingdom and their bond. The Sranan name is *Bon fu Gron Prakseri*.

    Look for:
    - the foliage, which stands for the countries and their bond
    - wreaths from the 30 June ceremony, with two minutes of silence and speeches
  category: hidden-history
  lat: 52.358642
  lng: 4.852373
  address: Surinameplein
  links:
