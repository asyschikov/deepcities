    title: Een houten armenpost en een brandweerkazerne aan de stadsrand
    summary: "Waar de Rozengracht de Singelgracht raakt, zette de gemeente twee voorzieningen voor de volle Jordaan neer: een houten gebouw in vakwerkstijl uit 1888 voor geneeskundige armenzorg, zeldzaam in stenen Amsterdam, en ernaast een brandweerkazerne uit 1893 aan een kruispunt van wegen."
    body: |
      Na de demping in 1889 werd de Rozengracht de uitvalsweg naar de nieuwe wijken in het westen, en het verre eind, aan de oude stadsrand, was een handige plek voor gemeentelijke diensten. In 1888 bouwde Publieke Werken hier een gebouw voor de Geneeskundige Armenverzorging, de stedelijke zorg van dokters voor armen. Het is helemaal van hout, in vakwerkstijl met ver overstekende daken; het rijksmonumentenregister noemt het zeldzaam, om het type en om het materiaal. In 1902 kwam er aan de kant van de Singelgracht een spreekkamer voor de Gemeentelijke Geneeskundige Dienst bij, in 1916 aangevuld met een slaapkamer. Het staat wat achteraf en is het best te zien vanaf de Singelgracht.

      Ernaast verrees vanaf 1893 de brandweerkazerne, op een driehoekig stukje grond tussen straat en gracht, zodat de brandweer snel verschillende kanten op kon. Achter de grote dubbele deuren stond de spuitwagen, met daarachter de paardenstal; boven waren een wachtruimte en een slaapkamer voor de brandweerlieden. Nu is het een woonhuis.

      Let op:
      - het vakwerk met Andreaskruisen en de houten fries onder de dakgoot van nummer 226
      - op de kazerne het wapen van Amsterdam in een steen boven de begane grond en de ijzeren roosters in de dubbele deuren
      - op de brugleuning ernaast een brandweerman die een draak bevecht, van Frans Werner
