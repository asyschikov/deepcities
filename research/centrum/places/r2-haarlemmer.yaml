  sources:
    - "VVAG bickersgracht-22-amsterdam-in-vreelant (Theunis Dircksz Vreelandt, beurtschipper, built two houses 1664; stone with view of Vreeland on the Vecht, maybe his birthplace; saneringsplannen stopped by neighbourhood protest; during restoration the stone was taken out; a resident of Vreeland had acquired it but it disappeared before transport; copy by Joop Huisstede in Vreeland; 2020 a dentist in Reeuwijk offered a stone the previous owner had bought from an antique dealer and bricked into the house; replaced August 2022)"
    - "VVAG bickersgracht-14-amsterdam-smalschip (stone 60 x 55 cm, sailing ship; bought April 2002 at Sotheby's by a private collector; after VVAG mediation replaced August 2022 on the Bickersgracht; smalschip narrower than 16 voet 16 duim, 4.68 m, to pass the Donkere Sluis at Gouda); straat-bickersgracht (sleper stone at no. 44)"
    - "Wijkkrant JGR 2022 (00000198 p3) (both stones replaced; restoration of no. 22 after neighbourhood resistance to clearance plans in the 1970s; stone disappeared through carelessness; in 2020 a dentist from Moordrecht offered it; 'De stenen zijn thuisgekomen'). Moordrecht (Wijkkrant) and Reeuwijk (VVAG) disagree; both lie by Gouda, so 'near Gouda'"
  nl:
    title: Stenen die thuiskwamen, Bickersgracht 14 en 22
    summary: "Twee gevelstenen verdwenen van de Bickersgracht en kwamen in augustus 2022 terug: de ene door een verzamelaar gekocht op een veiling bij Sotheby's, de andere gevonden in de muur van een tandartsenhuis bij Gouda."
    body: |
      In 1664 bouwde beurtschipper Theunis Dircksz Vreelandt een huis aan de Bickersgracht 22, met een steen die het dorp Vreeland aan de Vecht toont, waarschijnlijk zijn geboortedorp. Bij de restauratie in de jaren zeventig, nadat de buurt de sloopplannen voor het eiland had tegengehouden, ging de steen uit de gevel en verdween. Een inwoner van Vreeland die hem had verworven, vond hem weg voordat hij hem kon ophalen; zijn dorp kreeg een kopie. In 2020 bood een tandarts bij Gouda, die ging verbouwen, de Vereniging Vrienden van Amsterdamse Gevelstenen een steen aan die de vorige eigenaar bij een antiquair had gekocht en in de muur had gemetseld: het was In Vreelant.

      De steen 't Smalschip op nummer 14 toont een smal binnenvaartschip, gebouwd op de sluis van Gouda van 4,68 meter breed. Een particuliere verzamelaar kocht hem in 2002 bij Sotheby's. Na bemiddeling door de gevelstenenvereniging kwamen beide in augustus 2022 terug in de Bickersgracht. "De stenen zijn thuisgekomen," schreef de wijkkrant.

      Let op:
      - In Vreelant op nummer 22
      - 't Smalschip op nummer 14
      - de steen met slee en paard op nummer 44
    attributes:
      built: 1664; stenen teruggeplaatst 2022
    sources:
      - https://www.gevelstenenvanamsterdam.nl/bickersgracht-22-amsterdam-in-vreelant/
      - https://www.gevelstenenvanamsterdam.nl/bickersgracht-14-amsterdam-smalschip/
