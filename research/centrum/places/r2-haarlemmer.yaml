  sources:
    - "CBH Actualiseringsadvies Centrum, 24 April 2024, p. 30 (\"De vijgenboom op het Prinseneiland vertelt een verhaal\"; photo Oct 2022; oldest wild fig of Amsterdam at the Drieharingenbrug; among the very first spontaneous settlements in NL; tells the story of the changing climate; steel sheet piling solid, keeping it in a renovation looks possible; advice to place it on the list of protected trees); list p. 85 area: Prinseneiland N5664, 1985, Ficus carica, \"Geen status\""
