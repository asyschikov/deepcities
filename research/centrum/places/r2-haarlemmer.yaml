    - Wijkkrant JGR 2011 nr 4 (00000047 p6) (Van der Laan unveiled the restored giant on 29 June; Schrama plinth with a fragment of a poem by neighbour Jan Witte; timeline 1850 Fock, 1950 replica by D. Rijnsdorp, 2 August 1951 d'Ailly, 1972 Alicante, 2000 search by former Jonker worker with neighbours lasting nearly ten years, found 2006 with grandson in Canada, wild-freight shipping to the Canary Islands, flown to Amsterdam 2009)
