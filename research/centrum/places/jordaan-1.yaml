  lat: 52.376279
  lng: 4.883522
  address: Egelantiersgracht 17
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/70f92a64-4cb3-4699-857a-c8953a427cf5" }
