  nl:
    title: Joes Kloppenburgbrug, een brug tegen zinloos geweld
    summary: "In 1996 werd de 26-jarige Joes Kloppenburg in de Voetboogstraat doodgeschopt, nadat hij een groep mannen had toegeroepen op te houden met het mishandelen van een jongen. Twintig jaar later kreeg deze oude brug over het Singel zijn naam."
    body: |
      Tussen de Raamsteeg en de Oude Spiegelstraat ligt al zeker sinds ongeveer 1599 een brug over het Singel; Pieter Bast tekende hier toen een ophaalbrug. De huidige lage brug, met drie doorvaarten en granieten consoles, stamt uit 1910–1911, toen hij samen met de brug verderop over de Herengracht werd vernieuwd. Een officiële naam had hij nooit; men sprak van de Raambrug, of van de Appelmarktbrug naar de appelmarkt die vroeger in de buurt werd gehouden. In 2013 werd de brug grondig opgeknapt.

      Op 17 augustus 1996 kwam Joes Kloppenburg uit een café in de Voetboogstraat, een paar minuten lopen hiervandaan, en zag hoe dronken mannen een jongen in elkaar schopten. Hij riep "Kappen nou!", waarop ze zich tegen hem keerden. Een paar uur later overleed hij in het ziekenhuis; hij was 26. Zijn dood werd een symbool voor zinloos geweld. Een jaar later werd in de Voetboogstraat een gedenkteken onthuld, en zijn vader en vrienden richtten de stichting Kappen Nou! op. Op 5 juli 2016 gaf de gemeente brug 5 zijn naam, als teken tegen zinloos geweld; in september 2017 kwam het naambord.

      Let op:
      - het naambord
      - de granieten consoles onder het brugdek
      - het gedenkteken in de Voetboogstraat, vlakbij
