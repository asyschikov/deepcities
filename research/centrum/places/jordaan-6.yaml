    - https://pianolamuseum.online/nl/museum/ (fetched 2026-11-24; open Friday and Saturday 13-17, Sunday 13-16, continuous tours with instruments played; more than 40,000 rolls; weekly concerts)
    - https://pianolamuseum.online/nl/over-ons/ (2018 threatened sale by the city, tens of thousands of signatures, solution found; use of the building still limited)
    - https://pianolamuseum.online/nl/concerten/ (concerts listed for 27 November to 13 December 2026: vintage jazz, piano recital, tango, stride and boogie)
