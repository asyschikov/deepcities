  lat: 52.374124
  lng: 4.899068
  address: Oudezijds Voorburgwal 61
  links:
    - { label: Stadsherstel, url: "https://stadsherstel.nl/monumenten/oudezijds-voorburgwal-61/" }
  attributes:
    rank: Okay
    heritage_status: National monument
    monument_number: "6044"
    built: 1590s, front second half 17th century
    original_use: Merchant's house
  sources:
