    - https://nl.wikipedia.org/wiki/Sarphatistraat_470 (stables, German soldiers in WWII, horses replaced by tanks, army left 1988, Rijksakademie came from Stadhouderskade 86, exhibition space and library, skybridges of steel and glass)
