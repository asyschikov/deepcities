    - commons:File:Muiderpoort amsterdam 5.jpg
  sources:
    - rce:5139 (1770 by city architect Cornelis Rauws, domed tower, passages framed like a triumphal arch with pediments)
    - https://nl.wikipedia.org/wiki/Muiderpoort_(Amsterdam) (only surviving gate of the 17th and 18th-century walls; first gate 1663 slid off its foundations in the night of 29 to 30 January 1769 and sank sixteen feet, demolition days later; Rauws, Ziesenis; Napoleon 9 October 1811 with eight white horses and a triumphal arch; outer gate removed 1898, rebuilt 1938 at the Flevopark; new bridge 1903; old arms with a hulk on the city side, new arms with three St Andrew's crosses outside; toll and salt excise; Nederlandse Orde van Belastingadviseurs since 2002; sold to Stadsherstel July 2019)
    - https://www.stadsherstel.nl/monumenten/muiderpoort (octagonal wooden dome, bell cast in 1664 by F. and P. Hemony)
  nl:
    title: Muiderpoort, de poort van Napoleon
    summary: "De enige stadspoort die over is van de wallen uit de 17de en 18de eeuw. De eerste zakte in een januarinacht van 1769 van zijn fundering; door de opvolger reed Napoleon achter acht witte paarden de stad in. Er wordt weer over belasting gepraat."
    body: |
      In de nacht van 29 op 30 januari 1769 gleed de oude Muiderpoort uit 1663 van zijn fundering en zakte zestien voet weg. Een paar dagen later begon de sloop. Stadsbouwmeester Cornelis Rauws ontwierp de nieuwe poort, die in 1770 klaar was, met beeldhouwwerk van Anthonie Ziesenis. Van alle poorten in de stadswallen uit de 17de en 18de eeuw is dit de enige die nog staat.

      Op 9 oktober 1811 reed keizer Napoleon hierdoor de stad binnen, in een koets met acht witte paarden, onder een ereboog die voor de gelegenheid was opgetrokken. In 1898 ging de buitenpoort op de brug weg omdat de doorgang te smal werd gevonden; in 1938 werd die herbouwd bij de ingang van het Flevopark. Vanaf 1903 ging het verkeer over een nieuwe brug naast de poort, en daarmee had hij zijn functie verloren.

      Vroeger werden hier tol en zoutaccijns geheven. Sinds 2002 zit de Nederlandse Orde van Belastingadviseurs in de poort, dus het gaat er nog steeds over belasting. In 2019 verkocht de gemeente het gebouw aan Stadsherstel.

      Let op:
      - aan de stadskant het oude stadswapen met een middeleeuws schip (een hulk, geen kogge)
      - aan de buitenkant het nieuwere wapen met de drie Andreaskruisen
      - de achtkantige koepeltoren, met een klok die de gebroeders Hemony in 1664 goten
    attributes:
      original_use: Stadspoort
      artist: Anthonie Ziesenis (beeldhouwwerk)
