  sources:
    - "city register 202032 (client director P. de Gruyter of Koninklijke Industrie en Handelsmaatschappij P. de Gruyter en Zoon, Den Bosch; objections of the Schoonheidscommissie incl. mixed materials Labrador granite and Cannstatter travertine; argument: all shops in a house style, representative; objections withdrawn for economic importance; architect W.G. Welsing of Arnhem, house architect; piers as columns, lintel as frieze, travertine with vertical layers suggesting a pediment; three bronze (?) statues of ploughing, sowing and harvesting; four window slots, tall windows with white leaded glass, three-sided bays within the front plane; lobed granite corner piers, wavy-cut consoles; shopfront modernised; small shopkeepers growing into chains with corporate identity)"
