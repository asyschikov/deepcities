    - https://nl.wikipedia.org/wiki/Lippmann,_Rosenthal_%26_Co._(Sarphatistraat) (set up by Flesche, presented as branch under the same name to win trust; Jews forced to deposit money, valuables, art; est. 300-400 million guilders; funded Westerbork (11 million) and Vught (26 million))
