    - https://nl.wikipedia.org/wiki/Keizersgrachtkerk (Doleantie 1886; bought double house and coach house on Kerkstraat 1887; keur of 1663 forbade building on inner plots; opened 4 Nov 1888; Salms not gereformeerd; 1600 seats; 12-13 Sept 1944 sexton Sieberen van der Baan and minister Taeke Ferwerda shot in the Kerkstraat by German occupiers, five days after weapons were found in an annexe; memorial stones on Kerkstraat and Keizersgracht; now open ecumenical congregation, Sunday service, PKN; Pride church service on the Sunday after the canal parade)
