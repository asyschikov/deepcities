    - https://amsterdamopdekaart.nl/1850-1940/Singel/126-130 (Centrale Werkgevers Risico-Bank carried out the Ongevallenwet for employers; came from the Damrak in 1905 into Singel 130; from 1909 with the Centrale Landbouw-Onderlinge and Tuinbouw-Onderlinge as Centraal Beheer; 1916 merged with 126 and 128, these demolished and rebuilt in concrete, new brick front; moved to Apeldoorn in the 1970s)
  nl:
    title: Het eerste kantoor van Centraal Beheer, een oud huis achter een nieuwe gevel
    summary: "In 1916 voegde de verzekeraar die Centraal Beheer werd een grachtenhuis uit 1769 samen met twee nieuwgebouwde buren, achter één bakstenen gevel. De deur, het souterrain en het ritme van de ramen van het oude huis bepaalden het hele ontwerp."
    body: |
      De verzekeraar achter deze gevel begon als de Centrale Werkgevers Risico-Bank, die voor werkgevers de Ongevallenwet uitvoerde. In 1905 trok die van het Damrak naar een oud grachtenhuis hier, nummer 130, en in 1909 ging hij samen met twee onderlinge verzekeraars uit land- en tuinbouw verder als Centraal Beheer. In 1916 kwamen 126 en 128 erbij; die werden gesloopt en in beton herbouwd, en over alle drie kwam één nieuwe bakstenen gevel. In de jaren zeventig vertrok het bedrijf naar Apeldoorn.

      Architect H.J.M. Walenkamp hoorde bij de jonge vernieuwers van de Architectura-groep, die de neostijlen van de negentiende eeuw bestreden, al bouwde hij zelf weinig. Hier hield hij delen van het huis uit 1769 aan en liet hij dat de maat aangeven: de plaats van de deur, de hoogte van het souterrain en de breedte van de vensterassen. Rechts zette hij er gewoon drie vensterassen bij. Het register noemt die combinatie van achttiende-eeuwse interieurs en zijn werk uniek. De interieurs zijn niet te bezichtigen; de gevel zie je vanaf het Singel.

      Let op:
      - de drie vensterassen van het oude huis links van de deur en de drie nieuwe rechts
      - het hoge souterrain en de stoep
    attributes:
      architect: H.J.M. Walenkamp
      original_use: Verzekeringskantoor
    sources:
      - city:203061
      - https://amsterdamopdekaart.nl/1850-1940/Singel/126-130

- title: The one-of-a-kind cable box in the Langestraat
  summary: "A cast-iron electricity cable box from shortly after 1913, when the city took over the power company. It carries the logo of the municipal electricity works, and no other box of this model is known."
  body: |
    Around sixty historic cable boxes survive in Amsterdam, from the years when the city was wired for electricity. The best known are the Amsterdam School ones with three ribs over the top and front. This one is different. It probably dates from just after 1913, the year the city took over the private N.V. Electra, and it carries the logo of the Gemeente Electriciteitswerken, the municipal electricity works. It was cast by the Amsterdam iron foundry Zimmer.

    As far as the city register knows, no other box of this model exists. That is why it was listed as a municipal monument in 2013: an early reminder that electricity became a city service. It stands on the pavement and is still in use.

    Look for:
    - the logo of the municipal electricity works
    - the founder's name, Zimmer
