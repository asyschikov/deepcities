    - { label: Amsterdam op de kaart, url: "https://amsterdamopdekaart.nl/1850-1940/Singel/46-48" }
    - { label: Rijksmonumentenregister (5269), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/5269" }
