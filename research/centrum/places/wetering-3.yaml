    - commons:File:RM3648 Amsterdam - Lijnbaansgracht 287.jpg
  sources:
    - rce:3648 (hofje De Notenboomenuitkijk, founded 1778, plastered building under hipped roof on the sharp corner of the Tweede Weteringdwarsstraat and the Lijnbaansgracht; ring of bollards)
    - https://web.archive.org/web/20170820200936/http://archief.amstelodamum.nl/resources/1950_jb_44.pdf (A.W. Wichers Hoeth, Jaarboek Amstelodamum 1949; plot bought 1722 by Jan and Fikko van Mekeren, father and son, for their timmermans- en schrijnwerkersbedrijf, warehouse ready 1724; inherited until grandson Jan owned it all; name Nooteboome Uytkijk first in 1752; joint will of 6 June 1774 with second wife Johanna Margaretha Okhuysen; for members of the Nederduitsche gereformeerde gemeente, families Van Mekeren, Okhuysen, Van Liesvelt first; peat, firewood, butter, coffee, tea, beer, meat, candles, groceries, potatoes, cash; subletting forbidden; Jan died 1791, conversion at the end of the 18th century; sister foundation De Eendracht on the Overtoom; 1835 regulations, no quarrelling, fighting, swearing, drunkenness, no light after ten, no dogs, one or two birds, no more than one cat per floor, no living from baking waffles, oblies or oliebollen; residents were always women)
