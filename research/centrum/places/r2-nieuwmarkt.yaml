  sources:
    - OpNieuw 1986-3 (Bewonersraad meetings every fourteen days in De Smederij, Nieuwe Jonkerstraat 8); OpNieuw 1987-3 (children's show and party in the Smederij; advert "Marionettentheater van Hendrik Bonneur: Mozart & marionetten in de Smederij"); OpNieuw 1993-4 ("daar werden vroeger de Bewonersraadvergaderingen gehouden")
