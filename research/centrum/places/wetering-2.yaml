  nl:
    title: Nicolaas Witsenkade, de huizen op de oude gasfabriek
    summary: "Tot in de jaren 1880 losten hier kolenschepen voor de Hollandsche Gasfabriek. Op de plek kwamen enkele van de laatste nieuwe straten binnen de grachtengordel, met twee zeldzame neo-Venetiaanse huizen: een voor een diamantair, een met tegels die de bouwers verraden."
    body: |
      De kade tussen de Pieter Pauwstraat en het Weteringplantsoen was ooit het terrein van de Hollandsche Gasfabriek, met kolenschepen aan de wal, een gashouder, een kolenloods en een brandspuithuisje. Rond 1885 koos de gemeente voor een andere gasleverancier, en vanaf 1891 bebouwde een maatschappij voor bouwterreinen het terrein met drie lange blokken: een van de laatste stukjes nieuwe stad binnen de grachtengordel.

      De huizen aan de Singelgracht kregen de rijkste gevels. Op de hoek van de Pieter Pauwstraat bouwde Eduard Cuypers in 1889–1890 een huis voor diamantair David Sanders, in een neo-Venetiaanse stijl die je in Nederland zelden ziet; fotograaf Jacob Olie legde de bouw toevallig vast toen hij schippers aan het fotograferen was. Een paar deuren verder ontwierp H.G. Jansen, medearchitect van het American Hotel, in 1895 nummer 32 voor een makelaar en een bouwondernemer, in gele baksteen met roze steen; de tegels onder de goot tonen beroepen, met onder meer een hamer en passers. Op 33–36 verrezen datzelfde jaar etagewoningen voor de middenklasse, en de Pieter Pauwstraat kreeg een soberder rij met drie winkels.

      Het zijn woonhuizen en kantoren, te zien vanaf de kade.

      Let op:
      - de gouden sjabloonornamenten op pastelgroen op de bovenste verdieping van nummer 38
      - het tegelfries met gereedschap onder de goot van nummer 32
      - de groen geglazuurde randen rond de ramen van 33–36, en de topgevel links die rechts nooit een tweelingbroer kreeg
    attributes:
      architect: Eduard Cuypers (38), H.G. Jansen (32), H.H. Baanders (33-36), G.J. Venemans (19-21), W. Langhout (22), W.J. Nijman (Pieter Pauwstraat)
      original_use: Herenhuizen en etagewoningen
