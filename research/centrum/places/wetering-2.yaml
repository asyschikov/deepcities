  nl:
    title: Het huis van de Ancient Order of Foresters, Sarphatistraat 8–10
    summary: "Twee herenhuizen uit 1878 die een onderlinge hulporde van Britse afkomst, de Ancient Order of Foresters, in 1936 samenvoegde tot haar Nederlandse hoofdkwartier, achter een gevel zo degelijk dat de orde zich erin kon herkennen. In 1976 vertrokken de Foresters."
    body: |
      De Ancient Order of Foresters, een vereniging voor onderlinge hulp van Britse oorsprong, kocht in 1927 nummer 8, een herenhuis uit 1878 dat tegelijk met buurpand nummer 6 was gebouwd, en liet het door S. Vieyra verbouwen tot verenigingsgebouw. Toen ook nummer 10 in handen kwam, de rechtervleugel van een blok van drie woningen van T. Sanders uit hetzelfde jaar, voegde Vieyra de twee in 1936 samen en gaf ze de huidige gevel: vijf ramen breed, solide en conventioneel, zo dicht bij de huizen van 1878 eromheen dat je er nauwelijks een ontwerp uit de jaren dertig in ziet. Het gemeentelijke register vermoedt dat de orde die uitstraling bewust koos.

      Binnen kwamen een hal, een bestuurskamer, een grote garderobe, een conversatiezaal over de hele breedte van de eerste verdieping, kleinere zalen daarboven en op zolder een conciërgewoning. Eén kamer uit het huis van 1878, een tuinkamer met neorenaissance-aankleding, bleef vrijwel helemaal bewaard.

      In 1976 was het pand het hoofdkantoor van de orde, en dat jaar besloot zij te vertrekken. Later werd het verbouwd tot kliniek. Het is niet te bezoeken; de gevel zie je vanaf de straat.

      Let op:
      - de gevel van vijf traveeën uit 1936, die opgaat in de huizen van 1878 ernaast
      - de ingang in de middelste travee, waar de hal van het verenigingsgebouw begon
    attributes:
      original_use: Verenigingsgebouw van de Ancient Order of Foresters
      check_note: Het huidige gebruik is niet bevestigd; het gemeentelijke register (2004) beschrijft een kliniek.
    sources:
      - city:203049
