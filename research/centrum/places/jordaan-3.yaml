  nl:
    title: Raepenhofje en Bossche Hofje, twee hofjes op één dag gekocht
    summary: "In 1648 kochten een thesaurier van de stad en een doopsgezinde koopman op dezelfde dag grond aan de Palmgracht en bouwden er twee hofjes naast elkaar. Nu delen ze één tuin. In het Raepenhofje wonen studentes, die na hun studie mogen blijven maar weg moeten als ze gaan samenwonen."
    body: |
      Pieter Adriaanszoon Raep was 24 jaar thesaurier extraordinaris van de stad. In 1648 stichtte hij uit de erfenis van zijn vader een hofje voor protestantse vrouwen, betaald uit de huur van een huis dat zijn vader naast het huidige Krasnapolsky had laten bouwen. Vondel schreef er een gedichtje van vier regels op. Twee eeuwen lang stond er een L op de deurkozijnen geschilderd: de bewoonsters waren lidmaat van de gereformeerde kerk. Nazaten van de regenten besturen het nog steeds. De negen woningen gaan naar studentes, die per brief solliciteren. Na hun studie mogen ze blijven, maar wie wil samenwonen moet vertrekken.

      Ernaast stichtte de doopsgezinde koopman Arend Dirckszoon Bosch een kleiner hofje voor acht oude doopsgezinde vrouwen. De grond voor beide werd op dezelfde dag gekocht. Na de oorlog werd het Bossche Hofje onbewoonbaar verklaard en in 1952–1953 hersteld; sinds 1997 is het van Vereniging Hendrick de Keyser en er wonen vier vrouwen. Vroeger liep er een heg door de tuin, nu onderhouden de bewoonsters hem samen. Beide hofjes zijn privé en de poort gaat 's nachts op slot.

      Let op:
      - boven de poort van het Raepenhofje een steen met een raap en de letters P.A., met daarboven het wapen van de stichter en 1648
      - een kruiskozijn met tralies in de straatvleugel van het Raepenhofje
      - de trapgevel van het Bossche Hofje met vijf lelievormige muurankers
    attributes:
      original_use: Hofjes voor oude protestantse en doopsgezinde vrouwen
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/4073
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/4072
