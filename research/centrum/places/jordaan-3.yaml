  nl:
    title: Het eerste gebouw van de Tooneelschool, Marnixstraat 150
    summary: "In 1878 trok de vier jaar eerder opgerichte Tooneelschool in dit lage gebouw op de oude wallen: drie leslokalen en een toneeltje van 4,9 bij 5,7 meter, gebouwd voor nog geen 19.000 gulden. Bijna een eeuw werden hier acteurs opgeleid; nu werken er kunstenaars."
    body: |
      De Tooneelschool, opgericht in 1874, zocht een eigen gebouw en vond een plek op een smalle strook tussen de pas aangelegde Marnixstraat en de Singelgracht. Dolf van Gendt ontwierp het; in november 1878 ging het open. Boven lagen drie leslokalen en een klein toneel van 4,9 bij 5,7 meter; met verplaatsbare wanden konden de vier ruimten één zaal worden. Beneden woonde de conciërge. Een krant vroeg zich af hoe het voor nog geen 19.000 gulden gebouwd kon worden, en vond het jammer dat het niet in de binnenstad stond.

      Het bleef laag, twee lagen onder een schilddak, terwijl de blokken eromheen hoger werden. Beeldhouwwerk boven de ramen beneden verwijst naar het toneel, en boven de deur stond ooit Tooneel school. Later werd de kant aan de Singelgracht verbouwd naar ontwerp van Lau Peters, en in de jaren zeventig vertrok de school, toen een voorloper van de Academie voor Theater en Dans, omdat het gebouw te verouderd was. In het rijksregister staat het als eclectisch gebouw met neorenaissance-invloeden, beschermd om de architectuur en om het gebruik als toneelschool. In 2023 zat er Het Witte Huis, een broedplaats voor kunstenaars.

      Let op:
      - het beeldhouwwerk over het toneel boven de ramen van de begane grond
      - het lege tableau boven de deur waar Tooneel school stond
      - het spitsboograampje in de stenen dakkapel tussen alle rondboogramen
    attributes:
      original_use: Toneelschool
      check_note: Het gebruik als broedplaats (Het Witte Huis) is alleen voor 2023 bevestigd.
    sources:
      - https://nl.wikipedia.org/wiki/Marnixstraat_150
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/518501
