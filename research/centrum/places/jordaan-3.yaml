  nl:
    title: Suyckerhoff-hofje, achter een diepe gang
    summary: "Een gereformeerde burger liet in 1667 zijn vermogen na voor een hofje voor oude protestantse vrouwen. Het ligt achter een gang aan de Lindengracht, de bewoonsters kregen vanaf 1752 hun turf zonder belasting en een late gevelsteen spelt de naam van de stichter eindelijk goed."
    body: |
      Pieter Janszoon Suyckerhoff, lidmaat van de gereformeerde kerk, stichtte dit hofje bij testament van 4 januari 1667, voor oude protestantse vrouwen en weduwen. Je komt er via een diepe gang vanaf de Lindengracht; daarachter staan de huisjes in een L om een tuin, twee lagen hoog met gekoppelde vensters boven. Als protestants godshuis hoefde het hofje vanaf 1752 geen landsbelasting en stedelijke accijns op turf te betalen, de brandstof van de bewoonsters. Tot in de jaren veertig kregen de vrouwen nog een deel van hun onderhoud in natura, en van hen werd verwacht dat ze elkaar zo nodig hielpen.

      Na een reeks restauraties aan het eind van de 20e eeuw telt het hofje 19 woningen, nog steeds alleen voor vrouwen. Uit die tijd stamt een nieuwe gevelsteen met de juiste spelling van de naam van de stichter. Eigenaar is de Stichting De Drie Hofjes, die ook Hofje Venetiae aan de Elandsstraat beheert. De binnenplaats is privé.

      Let op:
      - de gevelsteen boven de ingang van de gang
      - aan het eind van de gang de twee vleugels uit 1678, met gekoppelde vensters boven
    attributes:
      original_use: Hofje voor oude protestantse vrouwen
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/3549
      - https://hofjesinamsterdam.nl/suyckerhoff-hofje/
