    - https://www.kidsproof.nl/amsterdam/uitje/theater-de-krakeling-jeugdtheater-de-krakeling (via search result, De Krakeling moved to Cultuurpark Westergas, Pazzanistraat 15)
  nl:
    title: Turnzaal uit 1887, met Rust Roest in de gevel
    summary: "Een maatschappij voor turngebouwen opende deze zaal in 1887 voor vier turnverenigingen, met woningen en een bierkelder eromheen. Hoog in de gevel staat Rust Roest. Van 1978 tot 2020 speelde hier jeugdtheater De Krakeling."
    body: |
      In de jaren 1880, toen een gezonde geest in een gezond lichaam het parool was, liet de net opgerichte Maatschappij voor Turngebouwen dit complex bouwen op de hoek van de Marnixstraat en de Leidsekade. Jonas Ingenohl en Karel Muller ontwierpen het in neo-Hollandse renaissance: een turnzaal die terugligt van de Nieuwe Passeerdersstraat, aan beide straten geflankeerd door woonblokken, met een conciërge- en een kasteleinswoning en een bierkelder in het souterrain. Het geld was krap en de bouw liep door vorst uit, maar op 19 november 1887 ging de zaal open. Vier verenigingen deelden haar, waaronder Olympia.

      Toen het turnen aan populariteit verloor, trok in 1978 jeugdtheater De Krakeling erin en werd de zaal verdeeld in een theaterzaal, garderobe en foyer. Het is een van de weinige vrijstaande turnzalen uit die tijd die het land nog heeft, en het interieur met houten vloer, lambrisering en open kapconstructie was bij de aanwijzing nog grotendeels gaaf. In 2020 bleek de paalfundering verrot en vertrok De Krakeling naar het Westergasterrein. De woningen zijn gewoon bewoond.

      Let op:
      - TURNZAAL in de friezen boven de deuren en Rust Roest hoog in de middengevel
      - het betegelde portiek aan de Marnixstraat
      - de bronzen plaquette uit 1952 van Henk Dannenburg: Aan onze gevallen makkers 1940–1945
    attributes:
      architect: Jonas Ingenohl en Karel Muller
      original_use: Turnzaal met woningen
      check_note: De Krakeling vertrok in 2020 vanwege de fundering; het huidige gebruik van de zaal is onbekend.
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/518465
      - https://nl.wikipedia.org/wiki/Nieuwe_Passeerdersstraat_1

- title: The lost fruit market's last blocks, Marnixstraat 200–220
  summary: "From the 1890s to 1934 Amsterdam's vegetable and fruit market ran 400 metres along the Singelgracht, with seven little harbours dug into the canal and quays lettered Wal A to Wal W. Three blocks with low storerooms and slanted corners are all that is left."
  body: |
    In 1890 and 1895 the city council decided to move the vegetable and fruit markets from the Prinsengracht and the Singel to the strip along the Marnixstraat. The new market was over 400 metres long. To get enough quay for unloading, seven narrow harbours were dug into the partly filled Singelgracht. The tongues of land between them had quays lettered from Wal A in the south to Wal W in the north; the Lijnbaansgracht served as the growers' market. Along the street stood short blocks of shop-houses, with gaps between them so that produce could be carried from the boats to the road.

    The market soon proved to be in the wrong place: no room to grow, and traffic jams. In 1934 it moved to the new market halls in Amsterdam-West, and from then to the 1970s the site was rebuilt beyond recognition. Only between the passage to the Lauriergracht and the Groenmarktkade do three blocks survive. Their ground floors are unusually low, storerooms rather than shops, with large doors front and back, and the corner houses are bevelled towards the back to let the crates through. The name Groenmarktkade (green market quay) is what became of Wal W. The blocks are homes now.

    Look for:
    - the low ground floors with wide doors and the bevelled corners of nos. 202, 210 and 214
    - the surviving water passage, once between Wal P and Wal Q
    - on the back of no. 200, a faint painted sign for a vegetable and fruit trader, sales round the corner
  category: industrial
  lat: 52.371357
  lng: 4.876001
  address: Marnixstraat 200-220
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/0f44893a-3528-44f5-b7b6-37a3742338b9" }
  attributes:
