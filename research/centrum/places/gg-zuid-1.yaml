    - city register 202013 (Incassobank 1923 by H.G. Jansen on the site of four houses; cut corner, entrance in the corner; stone-clad, Doric colonnade, balconies all round, bulging roof, like Paris boulevards, rare French Belle Epoque in NL; later population register, then hotel; dormer over the corner with outlandish scrolls)
