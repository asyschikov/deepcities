  nl:
    title: Kantoren die de Keizersgracht opaten
    summary: "Tussen 1912 en 1955 sloopten vijf bedrijven op dit stuk grachtenhuizen voor kantoren, en elke architect stond voor dezelfde vraag: hoe pas je een modern kantoor in een zeventiende-eeuwse gracht? Twee antwoorden uit 1955 staan tegenover elkaar aan het water."
    body: |
      Rond 1900 raakten de grachtenhuizen vol kantoren, en al snel wilden bedrijven er een dat speciaal gebouwd was. Op Keizersgracht 307 (1912) bouwde P.H. van Niftrik er een op de hoek van de Wolvenstraat dat nog net voor grachtenhuis kan doorgaan. Ernaast, op 313, liet de Rotterdamse firma R.S. Stokvis in 1913 twee oude huizen slopen voor een dertien meter breed magazijn met monsterzalen, voor sanitair en voor kronen, ontworpen door J. Verheul, bekend van het Witte Huis aan de Raadhuisstraat. Op 369-371 verdween in 1938 een hele rij, eerder in gebruik bij het Hervormd Weeshuis, voor het kantoor van de ANIEM, een elektriciteitsbedrijf in Nederlands-Indië; architect A.J. van der Steur schreef er een uitvoerige verdediging bij.

      In 1955 verrezen bijna tegelijk twee kantoren tegenover elkaar. Op 271-275 sloopte de Nederlandse Crediet Maatschappij drie huizen voor een ingetogen bakstenen kantoor van A.J. Westerman; in de decennia daarna groeide de rij tot vijf gebouwen, die zeventien huizen opslokten, onder een storm van kritiek. Aan de overkant, op 298-300, kozen C. de Geus en J.B. Ingwersen voor een openlijk moderne gevel die toch het oude ritme van de ramen en de hoge stoep aanhoudt.

      Het zijn allemaal kantoren; je bekijkt ze vanaf de kades.

      Let op:
      - het paar uit 1955, 271-275 en 298-300, tegenover elkaar aan de gracht
      - de eerste stenen in de rij van de NCM, uit 1955, 1967, 1974, 1980 en 1983
