    - https://www.4en5mei.nl/oorlogsmonumenten/zoeken/1610/amsterdam-bevrijdingslinde-van-de-jordaankinderen (Marnixplein; tree with memorial stone on a pedestal; deep in the ground an urn with the names of the children who raised the money; text BEVRIJDINGSLINDE VAN DE JORDAANKINDEREN 4 MEI 1946; when the GEB built a transformer house beside the tree in 1984 the memorial was narrowly saved by residents; money raised in 1946 by Jordaan schoolchildren; planted 4 May 1946, stone unveiled 4 May 1949; 4 May 2026 Dodenherdenking Jordaan gathers at the Bevrijdingslinde for the silent march to the Noordermarkt)
    - https://jordaangoudenreael.nl/documenten/00000191.pdf (April-May 2021, Dienie Meijs; corner Westerstraat and Marnixstraat; stone text; planted 4 May 1946 for the liberation and for the children who did not survive; money collected by pupils of thirteen Jordaan schools; urn with the names of those children under the tree; stone 1949; 1984 an electricity house was to replace the green and tree; protest supported by Eibert Draisma, storm in the media; 1987 the building beside the green, stone on a column, tree spared after three years; De Waarheid 4 May 1949, hundreds of children of thirteen schools filed past, stone unveiled by J. Roskam, former head of the Theo Thijssenschool, sang Wij willen Holland houden, walked past in silence; Parool letter by a former pupil, one leaf was hers, sang the Wilhelmus; north side of the Marnixplein: Henk Henriët's volksvrouw, sculptor and resistance man killed in the war; 2021 dog toilet, wildplassen, the base het pispaaltje; residents want it restored)
