  sources:
    - "https://www.4en5mei.nl/oorlogsmonumenten/zoeken/1611 (naked bronze male figure with angry face raising his left arm in indignation, on a white stone pilaster; text: 'Op deze plek zijn op 6 januari 1945 vijf Nederlanders aan het Duitsche schrikbewind ten offer gevallen uit wraak voor een daad van voorbeeldige vaderlandsliefde welke op dezelfde plaats was volbracht'; Spieghelschool winter 1944-45 registration office of the Arbeitseinsatz, all men 16 to 40; only NSB members worked there because the other officials of the municipal labour office refused; 5 Jan 1945 resistance (seven KP members) set it on fire; next day 26 Dutchmen executed in reprisal including five resistance men; Sept 1967 statue broken off and taken, Krop cast a new one in the old mould, unveiled 4 May 1968; 1970 original found in Vondelpark bushes after anonymous tip; removed 17 Nov 2006 for the DeLaMar renovation, back by 2010)"
    - "https://nl.wikipedia.org/wiki/Oorlogsmonument_Marnixstraat (makeshift memorial with canopy, drapes, plaque and wreaths; fire 5 Jan 1945 to disrupt the Arbeitseinsatz administration; reprisal: five random political prisoners and 20 officials shot; remains of the building demolished after the war for the De La Mar theatre; Krop 1947 despite material shortage; name of sculptor on the small base; inscription with 'zyn' and 'Duitsche'; unveiled 3 April 1947 by mayor d'Ailly; around 13 Sept 1967 torn off and taken (De Waarheid 23 Oct 1967); new cast from the original plaster mould placed 4 May 1968; August 1970 original found in Vondelpark bushes; Nov 1971 taken again; Nov 2006 to 2010 removed for rebuilding)"
    - OSM node 2730045848 (Hildo Krop, 1947, memorial; position used for the pin)
  nl:
    title: Krops boze man voor de brand in de Spieghelschool, Marnixstraat
    summary: "In januari 1945 stak het verzet het bureau voor de Arbeitseinsatz in de Spieghelschool hier in brand, en de bezetter nam wraak met executies. Het brons van Hildo Krop uit 1947 werd in 1967 gestolen en opnieuw gegoten; het origineel dook op in de bosjes van het Vondelpark."
    body: |
      Tegen de gevel van het DeLaMar staat op een zuil een klein naakt bronzen mannetje met een boze blik, de linkerarm geheven in protest. Het theater kwam in de plaats van de Spieghelschool, waar in de winter van 1944-1945 het aanmeldingsbureau van de Arbeitseinsatz zat: alle mannen van 16 tot 40 moesten zich hier melden om in Duitsland te gaan werken. Er werkten alleen NSB'ers; de ambtenaren van het gemeentelijk arbeidsbureau hadden het geweigerd.

      Op de avond van 5 januari 1945 stak een knokploeg de school in brand om de administratie te vernietigen. De bezetter nam de dag erna wraak. Op de sokkel staat dat op deze plek op 6 januari 1945 vijf Nederlanders 'aan het Duitsche schrikbewind ten offer gevallen' zijn, 'uit wraak voor een daad van voorbeeldige vaderlandsliefde'.

      Vlak na de oorlog stond hier alleen een noodmonument: een afdakje met draperieën, een plaquette en kransen. Stadsbeeldhouwer Hildo Krop maakte ondanks het gebrek aan materiaal dit brons, en burgemeester d'Ailly onthulde het op 3 april 1947. Rond 13 september 1967 rukten vandalen het beeldje van zijn sokkel en namen het mee; Krop goot een nieuw exemplaar in zijn oude gipsen mal, dat op 4 mei 1968 werd geplaatst. In 1970 werd het origineel na een anonieme tip teruggevonden in de bosjes van het Vondelpark. Voor de verbouwing van het theater ging het monument in 2006 weg; in 2010 kwam het terug.

      Let op:
      - de naam van Krop op het voetstukje onder de figuur
      - de oude spelling 'zyn' en 'Duitsche' in de tekst
