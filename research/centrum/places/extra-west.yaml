    - https://amsterdamopdekaart.nl/1850-1940/Spuistraat/172-174 (sculpture by Lambertus Zijl; 1250 piles; Kas-Vereeniging took over the Associatie Cassa in 1952, name Kas-Associatie, 2002 KasBank; sold in 2013 to a hotel chain, bank moved to the Telegraaf building; now part of the W hotel with restaurant The Duchess in the hall)
