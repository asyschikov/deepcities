  sources:
    - rce:518345 (house of 1618, new front in the 18th century; 1884 new neoclassical front by J.W. Meyer for W. Hovy, director of the Vereeniging voor Hooger Onderwijs op Gereformeerden Grondslag Vrije Universiteit, as a hospitium for students; 18th-century house behind left intact; 160, 164, 166 added; senate room with 18th-century painted ceiling of the four seasons; sold 1968; 1969 Salvation Army; 1985 eight apartments; former hospitium and mother house of the VU; lion-head keystones over door and window; pediment with iron weathervane)
