  sources:
    - city:200613 (one of the last examples of 19th-century renewal in the then narrow Valkenburgerstraat; built 1877 for a Jewish owner; Marken a Jewish neighbourhood; clearance 1926 and IJ tunnel 1968 when the Markengracht was filled; in the Valkenburgerstraat the last remaining monument; shops below, homes on three floors, three in the middle bay and six in each side wing; front and back room with box beds, cupboard wall and kitchen extension; good by 1877 standards; post-war renovation with little change to layout; tall pilasters above the cornice removed in the second half of the 20th century; ground floor heavily altered; wide passage on the south side to the back yard)
    - https://nl.wikipedia.org/wiki/Valkenburgerstraat (all original buildings gone; 202-210 of 1877 the remaining ensemble, municipal monument 2009; Roode Leeuwengang near no. 195, more than 300 Jews in 39 one-room homes without running water or sewers; 1926 called a disgrace, 532 homes to be declared unfit; from 1952 sacrificed as IJ tunnel approach, about 18 m wide)
  nl:
    title: Valkenburgerstraat 202–210
    summary: "De Valkenburgerstraat was een volle Joodse straat van krotten en gangen, tot de sanering van de jaren twintig en de IJtunnel van de jaren zestig alles wegvaagden. Dit ene woonblok uit 1877, gebouwd voor een Joodse eigenaar, is wat er van de oude straat over is."
    body: |
      De Valkenburgerstraat liep midden over het eiland Marken, in het hart van de Jodenbuurt. In 1926 noemde de gemeente de straat een schandvlek en wilde ze 532 woningen onbewoonbaar verklaren; bij huisnummer 195 woonden ruim driehonderd mensen in één gang, verdeeld over 39 eenkamerwoningen, zonder stromend water of riolering. Eerst kwam de sanering. Daarna, vanaf de jaren vijftig, werd de straat opgeofferd voor een achttien meter brede toegangsweg naar de IJtunnel, en in 1968 werd de Markengracht erachter gedempt.

      Dit blok uit 1877 overleefde het allebei. Het werd gebouwd voor een Joodse eigenaar, met winkels beneden en woningen erboven: drie in het middendeel en zes in elke zijvleugel, elk met een voor- en achterkamer, bedsteden, een kastenwand en een keukentje achter. Voor 1877 waren dat goede woningen. Na de oorlog werden ze weer bewoonbaar gemaakt, zonder veel aan de indeling te veranderen. Volgens het gemeentelijk register is het het laatste monument in de straat.

      De gevel heeft rijk metselwerk in de neostijlen van die tijd. Hoge lisenen die ver boven de kroonlijst uitstaken, zijn in de tweede helft van de twintigste eeuw weggehaald, en de puien zijn flink veranderd. De woningen zijn privé.

      Let op:
      - de symmetrische bakstenen gevel met licht vooruitspringende zijvleugels
      - de brede doorgang aan de zuidkant naar het achterterrein
    attributes:
      original_use: Winkels met bovenwoningen
    sources:
      - city:200613
      - https://nl.wikipedia.org/wiki/Valkenburgerstraat
