    - { label: Joods Monument Regina Turfkruier-Hangjas, url: "https://www.joodsmonument.nl/en/page/201868/regina-turfkruier-hangjas" }
    - { label: "Buurtkrant Zeven 150 (2026)", url: "https://oudestadt.nl/wp-content/uploads/Zeven150.pdf" }
