    - https://nl.wikipedia.org/wiki/Gebouw_Industria (club founded 1913, Kuipers pupil of Berlage, building and interior; site of the old Beurspoortje to De Keyser's exchange, new wider passage; medieval lock found in 1913; merger 1976 with De Groote Club; royal 2013; hotel TwentySeven since 2017; jeweller Gassan)
