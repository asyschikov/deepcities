  nl:
    title: Begijnhof
    summary: Een middeleeuws hof bijna een meter onder de stad eromheen, dat na 1578 katholiek bleef omdat de vrouwen hun huizen zelf bezaten. Eén begijn, Cornelia Arens, weigerde te liggen in de kapel die de protestanten innamen; haar kist dook volgens de legende steeds in de goot op.
    body: |
      Begijnen waren geen nonnen: ze beloofden kuisheid, maar mochten vertrekken om te trouwen. Hun hof is het enige dat in middeleeuws Amsterdam werd gesticht, en het ligt nog op het oude straatpeil, bijna een meter onder de straten eromheen. Vroeger was het helemaal door water omgeven; je kwam alleen binnen over een brug bij de Begijnensteeg. De 47 huizen hebben het hof zelf als adres, en achttien hebben nog een gotisch houtskelet. Nummer 34, Het Houten Huys, heeft nog een houten gevel met een overstekende zolder.

      Na de Alteratie van 1578 mocht het hof als enige katholieke instelling blijven bestaan, want de huizen waren eigendom van de begijnen. De kapel was dat niet: die ging naar Engelse presbyterianen en heet nog altijd de Engelse Kerk. Tegenover bouwde Philips Vingboons later een katholieke kerk in twee woonhuizen, op voorwaarde van de stad dat je van buiten geen kerk zag. Cornelia Arens, gestorven in 1654, wilde liever in de goot liggen dan in de 'ontheiligde' kapel. De legende vertelt dat ze toch binnen werd begraven en dat haar kist drie keer de volgende ochtend in de goot lag. De laatste begijn overleed in 1971. Nu wonen er zo'n 105 vrouwen.

      Bezoek: gratis, dagelijks 9.30 tot 18.00 uur, door de poort aan de Gedempte Begijnensloot.

      Let op:
      - Het Houten Huys op nummer 34
      - het poortje uit 1574 met Sint Ursula, de patrones van de begijnen
      - de woonhuisgevels met de katholieke kapel erachter, tegenover de Engelse Kerk
