  nl:
    title: Westerkerk en Westertoren
    summary: Rembrandt werd hier op 8 oktober 1669 begraven, in een graf dat niemand meer kan aanwijzen; zijn zoon Titus en Hendrickje Stoffels liggen hier ook. Toegang is gratis. Bij de opening in 1631 had de kerk geen orgel, want de calvinisten vonden muziekinstrumenten in de kerk paaps.
    body: |
      Hendrick de Keyser maakte het ontwerp en overleed in 1621; zoon Pieter bouwde de kerk af, die op Eerste Pinksterdag 1631 in gebruik ging. Met de haan erbij is de Westertoren 87 meter, de hoogste kerktoren van de stad. Hij was in 1638 klaar en draagt de keizerskroon van Maximiliaan I.

      Rembrandt woonde zijn laatste jaren vlakbij op de Rozengracht en werd hier op 8 oktober 1669 begraven. Waar precies weet niemand. Het was een kerkgraf, en na twintig jaar werden de resten geruimd, zoals toen gebruikelijk was bij armen. Een gedenkplaat aan de noordmuur herinnert aan hem. Ook zijn zoon Titus ligt hier, en Hendrickje Stoffels; voor haar begrafenis had Rembrandt het graf van Saskia in de Oude Kerk verkocht.

      Bij de ingebruikname was er geen orgel, want muziekinstrumenten in de kerk golden als paaps. Pas in 1681 kwam de opdracht; de luiken werden beschilderd door Gerard de Lairesse.

      Bezoek: gratis (een gift is welkom), maandag tot en met vrijdag 11.00 tot 15.00 uur, in juli en augustus ook op zaterdag. De toren is de komende jaren wegens restauratie niet te beklimmen. Beiaardier Boudewijn Zwart speelt meestal op dinsdag van 12.00 tot 13.00 uur.

      Let op:
      - het Burgemeesterspoortje aan de kant van de Westermarkt
      - de blauwe kroon op de spits
      - de gedenkplaat voor Rembrandt aan de noordmuur
    attributes:
      built: 1620–1631; toren voltooid 1638
      original_use: Protestantse kerk
    sources:
      - https://westerkerk.nl/bezoek-de-westerkerk-amsterdam/
      - https://nl.wikipedia.org/wiki/Westerkerk_(Amsterdam)

- title: Begijnhof
  summary: A medieval court almost a metre below the rest of the city, which stayed Catholic after 1578 because the women owned their houses. One beguine, Cornelia Arens, refused to lie in the chapel the Protestants took, and by legend her coffin kept turning up in the gutter.
  body: |
    Beguines were not nuns: they vowed chastity but were free to leave and marry. Their court is the only one founded in medieval Amsterdam, and it still lies at medieval street level, almost a metre below the streets around it. It was once ringed by water, with a bridge at the Begijnensteeg as the only way in. Its 47 houses have their own addresses in the court, and eighteen still have a Gothic timber frame; no. 34, Het Houten Huys, keeps a wooden front with an overhanging top floor.

    After the Alteration of 1578 it was the only Catholic institution allowed to carry on, because the houses were the women's own property. Their chapel was not, and went to English Presbyterians: it is still the English Church. Opposite, Philips Vingboons later fitted a Catholic church into two houses, on the city's condition that it should not look like a church from outside. Cornelia Arens, who died in 1654, wanted to be buried in the gutter rather than in the "desecrated" chapel; legend says she was buried inside and her coffin turned up in the gutter three times. The last beguine died in 1971. Today about 105 women live here.

    Visiting: free, daily 9:30 to 18:00, through the gate on the Gedempte Begijnensloot.

    Look for:
    - Het Houten Huys at no. 34
    - the gate of 1574 with Saint Ursula, patron of the beguines
    - the house fronts that hide the Catholic chapel, opposite the English Church
