  nl:
    title: De Bijenkorf op de Dam
    summary: Het warenhuis dat begon als fourniturenwinkel op de Nieuwendijk en in een houten noodgebouw naar het Damrak kwam, met het plan terug te gaan. De architect werd ontslagen voor het gebouw af was. Het eeuwfeest in 1970 eindigde in een veldslag.
    body: |
      In 1870 opende Simon Philip Goudsmit een fourniturenwinkel op Nieuwendijk 132. In 1912 verhuisde de zaak naar een tijdelijk houten pand aan het Damrak, op de lege plek waar de Beurs van Zocher had gestaan; het idee was terug te keren zodra er op de Nieuwendijk nieuw gebouwd was. Maar aan het Damrak liepen de zaken zo goed dat men bleef. Het ontwerp in Um 1800-trant was van J.A. van Straaten jr.; na onenigheid met de directie werd hij ontslagen en maakte B.A. Lubbers het werk af. Het Rijk noemt het in de waardering het eerst gebouwde warenhuis van Nederland. Het blok erachter, dat De Bijenkorf wilde opkopen en slopen, heeft een eigen plek.

      Op 13 maart 1970 hield het warenhuis een Open Huis voor het eeuwfeest. Op de Dam stonden tienduizenden mensen. Jongeren gooiden met straatstenen, die er door wegwerkzaamheden lagen, naar de deuren aan de Damzijde. De etalageruiten sneuvelden, het baldakijn werd in brand gestoken, op het Rokin gingen barricades omhoog en de politie zette het waterkanon in.

      Bezoek: gratis binnen te lopen tijdens winkeltijden.

      Let op:
      - aan het Damrak het ovale ijzeren plaquette MAGAZIJN DE BYENKORF met een bijenkorf en de letters S.P.G.
      - het centrale trappenhuis met wanden van bruin Napoleonmarmer en treden van travertin
    attributes:
      architect: J.A. van Straaten jr., afgemaakt door B.A. Lubbers
      original_use: Warenhuis
    sources:
