- title: De Bijenkorf on the Dam
  summary: The department store that began as a haberdashery on the Nieuwendijk and moved to the Damrak in a wooden stopgap, meaning to go back. Its architect was fired before the building was done. Its hundredth birthday party in 1970 ended in a riot.
  body: |
    Simon Philip Goudsmit opened a haberdashery at Nieuwendijk 132 in 1870. In 1912 it moved into a wooden stopgap on the empty site of Zocher's exchange on the Damrak, meaning to return once a new shop stood on the Nieuwendijk. Trade on the Damrak went so well that it stayed. J.A. van Straaten jr. designed the store in an Um 1800 style; after a dispute with the management he was dismissed and B.A. Lubbers finished the work. The national register values it as the "eerst gebouwde warenhuis in Nederland", the first department store built in the country. The block behind it that De Bijenkorf tried to buy up has its own place.

    On 13 March 1970 the store held an open house for its hundredth year. Tens of thousands came to the Dam. Young people threw paving stones, left lying from roadworks, at the doors on the Dam side, the shop windows went, the canopy was set alight, barricades rose on the Rokin and the police used a water cannon.

    Visiting: free to walk in during shop hours.

    Look for:
    - on the Damrak front, the oval iron plaque MAGAZIJN DE BYENKORF with a beehive and the letters S.P.G.
    - the central staircase, walls of brown Napoleon marble and steps of travertine
