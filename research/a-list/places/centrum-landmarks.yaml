  nl:
    title: OBA Oosterdok, de bibliotheek met gratis uitzicht
    summary: De centrale bibliotheek van Amsterdam, open sinds 7 juli 2007. Iedereen mag zonder pasje naar binnen en naar de zevende verdieping, waar het dakterras van restaurant Babel uitkijkt over het Oosterdok. Van november tot maart is het terras dicht, het restaurant niet.
    body: |
      Het hoofdgebouw van de OBA is van architect Jo Coenen en ging open op 7 juli 2007 (7/7/7). Het staat op het Oosterdokseiland, dat in 1832 ontstond toen de Oosterdoksdam dit stuk van het IJ afsneed, en dat lang vooral spoorwegemplacement was. Volgens de OBA zelf is het de grootste bibliotheek van Nederland. Tot 2007 zat de centrale bibliotheek aan de Prinsengracht; dat pand heeft een eigen plek.

      Het gaat om de bovenste verdieping. Een lidmaatschap heb je niet nodig: de bibliotheek is vrij toegankelijk, en op de zevende verdieping ligt restaurant Babel met een dakterras op het zuiden, over het Oosterdok naar NEMO, het Scheepvaartmuseum en de binnenstad. Van november tot maart is het terras gesloten, maar ook vanuit het restaurant kijk je uit over de stad. In het gebouw zit ook IHLIA, bibliotheek en archief over homoseksualiteit en seksuele diversiteit, en onder de grond een bewaakte fietsenstalling waar je fiets gratis staat.

      Bezoek: gratis. De bibliotheek is elke dag open (doordeweeks vanaf 8.00 uur, in het weekend vanaf 10.00 uur), Babel vanaf 10.00 uur.

      Let op:
      - het uitzicht vanaf het terras op de zevende verdieping (april tot en met oktober)
      - de pagode van Sea Palace aan dezelfde kade, zo'n 100 meter naar het westen
    attributes:
      original_use: Centrale openbare bibliotheek
