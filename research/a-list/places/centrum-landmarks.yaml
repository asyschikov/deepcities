  nl:
    title: Sea Palace, de drijvende pagode in het Oosterdok
    summary: "Een Chinees paleis van drie verdiepingen op een betonnen bak, sinds 1984 afgemeerd bij het Centraal Station. Het postkantoor ernaast zag de bouw volgens de krant met afgrijzen aan. Naar binnen hoeft niet: je bekijkt het vanaf de overkant van het water."
    body: |
      Initiatiefnemer was Cheung Sing Wong, een 31-jarige Amsterdamse Chinees en zoon van een restauranthouder. Zijn voorbeeld waren de drijvende eetpaleizen van Hongkong, vooral Tai Pak. De pagode werd in Alphen gebouwd op een betonnen drijfbak, zoals bij woonschepen, met een architect uit Hongkong en veertien containers bouwmaterialen en versieringen uit China en Taiwan. In oktober 1984 ging het open, met plaats voor 900 eters en 12.000 witte lampjes. "Als die 's avonds branden is Sea Palace een prachtig verlengstuk van de verlichte Amsterdamse grachten," zei Wong in Het Parool. Het districtspostkantoor aan de kade keek volgens Het Vrije Volk met afgrijzen toe, en het gerucht ging dat de PTT naar de rechter zou stappen. De gemeente gaf geen krimp.

      Wong rekende op een toeristische trekpleister. Nu zijn er 600 zitplaatsen op drie verdiepingen en heeft het restaurant een Bib Gourmand, maar eten hoeft niet: het gebouw zelf is de bezienswaardigheid.

      Bezoek: gratis te bekijken vanaf de kades; een maaltijd kost geld.

      Let op:
      - de groen geglazuurde daken, elke verdieping een stukje kleiner dan die eronder, en de rode pilaren
      - voor het hele gebouw: kijk over het water vanaf de Prins Hendrikkade bij het Scheepvaarthuis, zo'n 200 meter naar het zuidwesten
    attributes:
      original_use: Drijvend Chinees restaurant
