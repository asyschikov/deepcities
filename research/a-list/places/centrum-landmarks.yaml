- title: OBA Oosterdok, the library with a free view
  summary: Amsterdam's central library, opened on 7 July 2007. Anyone may walk in without a card and go up to the seventh floor, where a restaurant terrace looks south over the Oosterdok. The terrace is shut from November to March; the restaurant is not.
  body: |
    Jo Coenen designed the central building of the Openbare Bibliotheek Amsterdam (Amsterdam Public Library), which opened on 7 July 2007 (7/7/7) on the Oosterdokseiland, an island made in 1832 when a dam cut this stretch off from the IJ and long used as a railway yard. The library calls it the largest in the Netherlands. Until 2007 the central library sat on the Prinsengracht; that building has its own place.

    The draw is the top floor. You need no membership to come in, and on the seventh floor restaurant Babel has a roof terrace facing south, over the Oosterdok to NEMO, the Scheepvaartmuseum and the old centre. From November to March the terrace is closed, but the restaurant keeps its view over the city. The building also houses IHLIA, the library and archive on homosexuality and sexual diversity, and beside it a guarded underground bike park is free to use.

    Visiting: free. The library is open daily (weekdays from 8:00, weekends from 10:00), Babel from 10:00.

    Look for:
    - the view from the seventh-floor terrace (April to October)
    - the Sea Palace pagoda on the same quay, about 100 metres west
