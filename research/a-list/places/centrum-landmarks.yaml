  nl:
    title: Koninklijk Theater Carré
    summary: Het stenen circus van Oscar Carré uit 1887 aan de Amstel, gebouwd nadat de gemeente zijn houten circus wegens brandgevaar liet slopen. In 1968 moest het wijken voor een hotel. De stalen dakbogen worden vaak aan Eiffel toegeschreven, maar komen van een Amsterdamse bruggenbouwer.
    body: |
      Circusdirecteur Oscar Carré gaf zijn wintervoorstellingen in een houten gebouw. Omdat het brandgevaarlijk was, moest het in 1880 van de gemeente tegen de grond. Na jaren touwtrekken met de ambtenaren kreeg hij in 1886 een vergunning voor een stenen gebouw. Het geld haalde hij op met obligaties; in april 1887 begon het heien en op 3 december ging het open.

      In 1956 beleefde de musical hier zijn Nederlandse première, met Porgy and Bess. In 1968 dreigde de sloop: op de plek moest een hotel komen, of een badhuis, een autopaleis, ja zelfs een huis van bewaring. Artiesten kwamen in actie, Heintje Davids bracht het lied "Er is maar één Carré" uit, de gemeente weigerde de sloop en kocht het pand in 1977.

      Sinds de verbouwing van 2004 zie je binnen de stalen bogen van de dakconstructie. Ze worden vaak aan Gustave Eiffel toegeschreven, maar zijn gemaakt door de Koninklijke Fabriek voor Stoom- en andere Werktuigen, een Amsterdamse bruggenbouwer. De Amstelsluizen ervoor hebben een eigen plek.

      Bezoek: naar binnen alleen met een kaartje voor een voorstelling; de gevel zie je gratis vanaf de overkant van de Amstel.

      Let op:
      - het gebogen dak, te zien vanaf de overkant van de Amstel
      - "A° 1887" vlak onder het fronton en lager op de gevel de naam CARRE
      - met een kaartje: de stalen dakbogen
    attributes:
      architect: J.P.F. van Rossem en W.J. Vuyk
      original_use: Circus
