- title: Koninklijk Theater Carré
  summary: Oscar Carré's stone circus of 1887 on the Amstel, built after the city made him pull down his wooden one for fear of fire. In 1968 it was meant to make way for a hotel. Its steel roof arches are often credited to Eiffel; they were made by an Amsterdam bridge builder.
  body: |
    The German circus director Oscar Carré gave winter shows in Amsterdam in a wooden building, which the city had demolished in 1880 because of the fire risk. After years of wrangling he got a permit for a stone circus in 1886, paid for it with bonds, and opened it on 3 December 1887, eight months after the piling began.

    In 1956 the musical had its Dutch premiere here, with Porgy and Bess. In 1968 demolition loomed: the theatre was to make way for a hotel, a bathhouse, a car showroom or even a remand prison. Artists protested, Heintje Davids released the song "Er is maar één Carré" (there is only one Carré), the city refused demolition and bought the building in 1977.

    Inside, the steel roof arches have been on show since the 2004 rebuilding. They are often said to be by Gustave Eiffel; they were made by the Koninklijke Fabriek voor Stoom- en andere Werktuigen, an Amsterdam bridge builder. Hudde's locks in front have their own place.

    Visiting: inside only with a ticket for a show; the front is free to see from across the Amstel.

    Look for:
    - the curved roof, seen from the far bank of the Amstel
    - "A° 1887" just below the pediment and, lower on the front, the name CARRE
    - with a ticket: the steel roof arches
