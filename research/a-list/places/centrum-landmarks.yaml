- title: Sea Palace, the floating pagoda on the Oosterdok
  summary: "A three-storey Chinese palace on a concrete float, moored by Centraal Station since 1984. The neighbouring post office was said to watch it go up with horror. You do not need to go in: it is a sight to see from across the water."
  body: |
    Cheung Sing Wong, a 31-year-old Amsterdam Chinese, took the floating restaurants of Hong Kong as his model, Tai Pak in particular. The pagoda was built in Alphen on a concrete float of the kind used for houseboats, with an architect from Hong Kong and fourteen containers of building materials and decoration shipped from China and Taiwan. It opened in October 1984 with seats for 900 and 12,000 white bulbs that Wong said would make it an extension of the lit canals at night. While it went up, the district post office on the quay was said to look on with horror, and rumours had it that the PTT would sue. The city said the restaurant was coming anyway.

    Wong meant it to be a tourist attraction. Today it has 600 seats on three floors and a Michelin Bib Gourmand, but eating there is optional: the sight is the building.

    Visiting: free to see from the quays; a meal is extra.

    Look for:
    - the green-glazed roofs, each storey a little smaller than the one below, and the red pillars
    - for the whole building, look across the water from the Prins Hendrikkade by the Scheepvaarthuis, about 200 metres to the south-west
