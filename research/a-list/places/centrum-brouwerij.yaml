- title: Brouwerij 't IJ, the brewery in the Funen bathhouse
  summary: "Since 1985 beer has been brewed in the Funen public bathhouse of 1911, right beside De Gooyer windmill. The signs for the men's and the women's entrance still hang over the tasting-room door, and the terrace sits at the foot of the mill."
  body: |
    A brewery and tasting room in the former municipal bathhouse Funen, which opened in 1911 next to De Gooyer windmill. Kaspar Peterson, a musician from the band Door Mekaar, wanted a building with plenty of water pipes and drains. He signed the lease in February 1985 and brewed his first batch on 7 November that year; the tasting room opened the following year.

    The bathhouse shows through: original tiles and soap holders behind a fermentation tank, the men's and women's signs over the door, and a board with the old bathing hours. In 2015 co-owner Patrick Hendrikse told AT5 they would keep closing at eight; the tasting room now stays open until ten.

    The Belgian brewer Duvel Moortgat bought 51 percent in 2015. The beer on tap is brewed in this building. Since 2013 bottles and kegs have come from a second brewery on the Zeeburgerpad. A full rebuild of that brewery began in October 2025, planned to take about a year, with production moved meanwhile to other Duvel Moortgat breweries.

    Short tours (€2.50) run Friday to Sunday. The windmill has its own place on this map.

    Look for:
    - the two turrets on the bathhouse
    - the men's and women's signs over the door
    - the long tables of the terrace at the foot of the mill
    - the brewery's logo: an ostrich with an egg, and the mill in the distance
