  nl:
    title: Brouwerij 't IJ, de brouwerij in badhuis Funen
    summary: "Sinds 1985 wordt er bier gebrouwen in badhuis Funen uit 1911, pal naast molen De Gooyer. Boven de deur van het proeflokaal hangen nog de bordjes voor de ingang van mannen en vrouwen, en het terras ligt aan de voet van de molen."
    body: |
      Brouwerij en proeflokaal in het vroegere gemeentelijke badhuis Funen, dat in 1911 openging naast molen De Gooyer. Kaspar Peterson, eerder muzikant bij Door Mekaar, zocht een pand met genoeg waterleidingen en afvoer. In februari 1985 tekende hij het huurcontract en op 7 november van dat jaar stond het eerste brouwsel klaar; het jaar daarop ging het proeflokaal open.

      Het badhuis is nog te zien: achter een van de gistingstanks zitten oude tegels en zeephouders, boven de deur hangen de bordjes voor mannen en vrouwen, en ergens hangt nog een bord met de oude badtijden. In 2015 beloofde mede-eigenaar Patrick Hendrikse op AT5 om acht uur te blijven sluiten; nu is het lokaal tot tien uur open.

      Het Belgische Duvel Moortgat kocht in 2015 51 procent van de aandelen. Het tapbier wordt hier in het pand gebrouwen. Flessen en fusten komen sinds 2013 uit een tweede brouwerij aan het Zeeburgerpad. In oktober 2025 begon daar een volledige verbouwing, die ongeveer een jaar zou duren; zolang brouwen andere brouwerijen van Duvel Moortgat het bier.

      Van vrijdag tot en met zondag is er een korte rondleiding (€2,50). De molen zelf heeft een eigen plek op deze kaart.

      Let op:
      - de twee torentjes op het badhuis
      - de bordjes voor mannen en vrouwen boven de deur
      - de lange tafels van het terras aan de voet van de molen
      - het logo van de brouwerij: een struisvogel met een ei, en in de verte de molen
    attributes:
      built: 1911 (badhuis); brouwerij sinds 1985
      original_use: Gemeentelijk badhuis
