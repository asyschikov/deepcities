- title: Binnenhaven, the Marineterrein's swimming harbour and water lab
  summary: The navy's old inner harbour became the first official swimming spot of the Centrum district in 2025. You swim among experiments, two tumbling oloids named Kriek and Maria stirring the water and floating gardens of cork, willow and reed along the quay.
  body: |
    For years this was an unofficial swimming spot. In April 2025 the province of Noord-Holland designated the Binnenhaven (inner harbour) the first official swimming spot in the Centrum district, after years of good water readings, a survey of the bottom and the sealing of gaps under the quay walls. There are no lifeguards: you swim at your own risk, all year round. A floating boardwalk closes the basin off from boats. Screens on the site show the water quality live and warn swimmers when it is less suitable, for example after heavy rain, when sewers can overflow; when the quality threatens to fall short, the floating jetty closes for 72 hours.

    The harbour is also a test bed. Since 2024 the Dobbernatuur project has floated small gardens of cork, willow, reed and bamboo along the quay and round the mooring posts. After a year there was more life round the bigger ones than along the bare quay walls, but no measurable change in the water yet. On 2 April 2026 two oloids, Kriek and Maria, were launched: geometric bodies, a shape found by Paul Schatz, whose tumbling motion circulates the water and adds oxygen. The idea came from a group of regular swimmers around Maria Blaisse. ReefSystems made the harbour one of the test sites for its artificial reef and placed 30 modules here, and The Great Bubble Barrier runs a test bubble curtain in the eastern corner, outside the swimming area.

    Look for:
    - the two oloids turning in the water
    - the floating gardens along the quay, among them DobberWeelde, Willoasis and the Vogelwoonboot for sand martins
    - the screens with the day's water quality
    - the boardwalk across the harbour
