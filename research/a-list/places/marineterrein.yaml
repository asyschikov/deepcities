  nl:
    title: Beta berlayar jauh, monument voor de Molukse mariniers
    summary: Onthuld op 29 april 2026, 75 jaar na het eerste schip met Molukse KNIL-militairen aan de Javakade. Het werk van Yopi Abraham eert veertien Molukse mariniers die hier in 1951 gelegerd werden. De stalen spijlen tonen een marineman of een Molukse krijger, naargelang je standpunt.
    body: |
      Toen Indonesië onafhankelijk was geworden en het KNIL, het koloniale leger, werd opgeheven, kwamen in 1951 ruim 3.500 Molukse militairen naar Nederland. Ze dachten dat het tijdelijk was, tot hun politieke toekomst geregeld zou zijn. Op 29 april 1951 legde het eerste schip aan de Amsterdamse Javakade aan; vier schepen brachten er ruim duizend KNIL-militairen met hun gezinnen. Veertien van de mannen waren mariniers en kwamen in de kazerne op Kattenburg, op dit terrein.

      Op 29 april 2026, precies 75 jaar later, onthulden de commandant van de marine en familieleden van de mannen het monument, bij een herdenking die de nazaten samen met Defensie organiseerden. De Molukse kunstenaar Yopi Abraham maakte het van cortenstalen spijlen: vanuit de ene hoek zie je een marineman, vanuit de andere een Molukse krijger. Het staal verwijst naar de schepen van 1951. De titel, Beta berlayar jauh ("Ik vaar ver heen"), is de eerste regel van een Moluks lied dat in Molukse marinekringen veel betekent, en die woorden staan op het monument. Volgens het programma van de onthulling werden de namen van de veertien een voor een voorgelezen en legden familieleden, vaak van meerdere generaties, bij elke naam een roos.

      Bezoek: gratis; de Voorwerf is het open deel van het Marineterrein, net achter de poort.

      Let op:
      - de marineman en de krijger, door om de spijlen heen te lopen
      - de woorden Beta berlayar jauh
    attributes:
      check_note: Volgens de bronnen staat het op de Voorwerf; de pin is geschat, een precieze plek of foto is niet gevonden.
    sources:
