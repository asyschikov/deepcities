  nl:
    title: Scheepstimmerwerkplaats en de Scheepskameel
    summary: Een van de weinige gebouwen uit de tijd van 's Lands Werf, deze bakstenen scheepstimmerwerkplaats op de noordwestpunt, is nu restaurant Scheepskameel. De naam komt van de uitvinding uit 1690 waarmee diepe schepen over de ondiepten bij Pampus werden getild.
    body: |
      De werkplaats van twee lagen onder een schilddak stond ooit evenwijdig aan de oude kade van de werf, voordat de herbouw van de jaren zestig alles eromheen veranderde. Het gemeentelijk register houdt 1878 aan, de verkenning van 2018 rond 1860. Later zat de technische opleiding van de marine (TOKM) erin, en in juli 2025 werd het gemeentelijk monument.

      Sinds mei 2016 zit er een restaurant in, en de naam gaat verder terug dan het gebouw. Schepen naar Amsterdam moesten over de ondiepten bij Pampus in de Zuiderzee, waar diepe schepen vastliepen; "voor Pampus liggen" betekent nog altijd dat je niets kunt doen. Stadstimmerman Meeuwis Meindertsz. Bakker bedacht de scheepskameel: houten bakken die aan weerszijden van de romp werden vastgemaakt en leeggepompt, zodat ze het schip over het lage water tilden. In april 1690 probeerde hij het uit met het oorlogsschip Princes Maria, en de Admiraliteit gaf hem daarna een jaargeld.

      De Schietbaan hiernaast heeft een eigen plek.

      Bezoek: het restaurant is open van dinsdag tot en met zaterdag vanaf 18.00 uur; het gebouw zie je altijd van buiten.

      Let op:
      - de bakstenen muren en het schilddak tussen het beton van de jaren zestig
      - het bord van Scheepskameel
