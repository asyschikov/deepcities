  nl:
    title: "De marinecampus van De Weger: officierstoren, seinvlaglokaal en scholen op poten"
    summary: Toen de IJtunnel het westen van de werf opslokte, bouwde de marine in 1962 tot 1966 een nieuwe campus. Een officiersgebouw met glazen toren, een verbindingsschool met op het dak een seinvlaglokaal in de vorm van een scheepsbrug, en twee lesgebouwen op betonnen poten.
    body: |
      Voor de IJtunnel ging in 1962 het westelijke deel van de oude werf tegen de vlakte en werd een stuk van het dok gedempt. De herbouw was in 1961 opgedragen aan het Rotterdamse ingenieurs- en architectenbureau van ir. F.C. (Frans) de Weger. In 1966 stond er rond een nieuwe, kleinere insteekhaven een campus in de stijl van die jaren: gevels van gestraalde grindbetonplaten met stalen ramen.

      Drie gebouwen springen eruit. Het Officiersgebouw (006) ligt in de oksel van de haven. De officieren woonden er als in een pension, met eigen kamers en een longroom (bar en lounge). Op de lange, lage onderbouw staat, iets naar achteren, een toren met glazen gevelplaten. De gemeentelijke verkenning van 2018 vond het buiten en binnen opvallend gaaf; nu zit er hotel-restaurant Pension Homeland in. Op de kop van de haven staat de Verbindingsschool (028); uit het midden op het dak staat een lokaaltje voor seinvlaglessen dat op een scheepsbrug lijkt. Langs het Oosterdok staan de twee lesgebouwen van de Technische Opleidingen Koninklijke Marine (027), drie lagen hoog en op betonnen kolommen gezet, naar het idee van Le Corbusier. Eerst waren ze gelijk, daarna is elk op zijn eigen manier verbouwd. Bureau SLA gaf 027E in 2016 een houten zonwering met lamellen die Europese vlaggen vormen, voor het Nederlandse EU-voorzitterschap dat hier vergaderde.

      Op verzoek van Heemschut werden het officiersgebouw, het commandementsgebouw en de commandantswoning (die bij de plek Marineterrein hoort) in juli 2025 gemeentelijk monument. AT5 kopte: "Beetje brutalistische architectuur". Ze staan aan de westrand, waar de plannen een stadspark tekenen.

      Bezoek: Pension Homeland is een hotel-restaurant; de andere gebouwen bekijk je van buiten.

      Let op:
      - de toren met glazen gevelplaten van Pension Homeland
      - het seinvlaglokaal op het dak van 028
      - de Europese vlaggen in de lamellen van 027E
      - de betonnen kolommen onder 027
    attributes:
      architect: F.C. de Weger; gevel van 027E door SLA (2016)
      original_use: Officiersgebouw, verbindingsschool en technische school van de marine
