- title: The marechaussee's black box
  summary: At the north end of the Marineterrein stands a dark cube with 1,750 identical windows, built to the same dimensions as the Scheepvaartmuseum at the other end. It is the office of the Koninklijke Marechaussee, designed so the staff can look out while nobody can see in.
  body: |
    From the train, or cycling down the Jan Schaeferbrug, it reads as a black box. The Koninklijke Marechaussee, the military police, has its office here: a building for Defence's property service by the Cologne architect Norbert Wansleben (Wansleben Architekten), completed in 2008. He took the old naval storehouse at the southern tip of the yard, now the Scheepvaartmuseum, as his model: a square block of five storeys round a courtyard, like a fort. His cube repeats it at the northern tip with exactly the same dimensions.

    The facade is a strict grid of 1,750 identical small windows, set deep in a skin of small dark stones. From outside you cannot tell where the five floors are, and on the street side a corridor keeps the offices away from the facade: the staff get a view, but nobody sees them. Archined thought of a riot shield with eye slits. The courtyard inside is the opposite, with much glass and coloured wooden shutters. After dark, with the lights on, you can see that more than a third of the facade is glass.

    Visiting: a Defence building, no entry; look from the street, the Jan Schaeferbrug or the train.

    Look for:
    - the window grid, as seen from the Jan Schaeferbrug
    - how the stones shine in the sun
    - the extra-lit bottom row of windows
