- title: "De Weger's navy campus: officers' tower, signal-flag classroom and schools on stilts"
  summary: When the IJ tunnel took the west of the yard, the navy rebuilt it in 1962 to 1966 as a new campus. An officers' block with a glass tower, a signals school crowned by a classroom shaped like a ship's bridge, and two teaching blocks on concrete stilts.
  body: |
    The tunnel works of 1962 cleared the old western yard and filled in part of the dock. The commission to rebuild had gone in 1961 to the Rotterdam office of the engineer and architect F.C. (Frans) de Weger, and by 1966 a new campus stood round a new, smaller inner harbour, faced with the shot-blasted gravel-concrete panels and steel window frames of the period.

    Three buildings tell the story best. The Officiersgebouw (006), in the crook of the harbour, housed the officers like a guesthouse, with their own rooms and a longroom (bar and lounge): a long, low base with, set back on top, a tower clad in glass panels. The city's 2018 survey found it remarkably intact, inside and out; it is now the hotel and restaurant Pension Homeland. At the head of the harbour, the Verbindingsschool (028), the navy's signals school, carries an off-centre rooftop classroom for signal-flag lessons, shaped like a ship's bridge. Along the Oosterdok, the two three-storey teaching blocks of the Technische Opleidingen Koninklijke Marine (027) stand on concrete columns, after Le Corbusier's pilotis. Once identical, they were renovated separately; in 2016 SLA gave 027E wooden slats in the shape of European flags, for the Dutch EU presidency, which met on this site.

    At Heemschut's request the city listed the officers' building, the command building and the commander's house (part of the Marineterrein place) in July 2025. AT5's headline quoted "a bit of brutalist architecture". They stand on the west edge, where the plans draw a city park.

    Visiting: Pension Homeland is a hotel and restaurant; see the other buildings from outside.

    Look for:
    - the glass-clad tower of Pension Homeland
    - the signal-flag classroom on the roof of 028
    - the European flags in the slats of 027E
    - the concrete stilts under 027
