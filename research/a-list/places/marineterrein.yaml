  nl:
    title: Binnenhaven van het Marineterrein, zwemplek en waterlab
    summary: De oude binnenhaven van de marine is sinds 2025 de eerste officiële zwemplek van stadsdeel Centrum. Je zwemt tussen de proeven door, met twee tuimelende oloïdes, Kriek en Maria, die het water roeren en drijvende tuintjes van kurk, wilg en riet langs de kade.
    body: |
      De Binnenhaven was al jaren een geliefde wildzwemplek. Sinds april 2025 is het officieel: de provincie Noord-Holland wees het bassin aan als eerste officiële zwemlocatie van stadsdeel Centrum. Daar gingen jaren van metingen aan vooraf, waarin het water steeds goed bleek. Ook werd de bodem onderzocht en werden de holtes onder de kademuren dichtgemaakt. Toezicht is er niet; je zwemt op eigen risico, het hele jaar door. Een drijvende boardwalk houdt de boten buiten. Schermen op het terrein tonen live de waterkwaliteit en waarschuwen als het water minder geschikt is, bijvoorbeeld na een flinke bui waarbij het riool kan overstorten. Dreigt de waterkwaliteit onvoldoende te worden, dan gaat de drijvende steiger 72 uur dicht.

      Intussen is de haven een proeftuin. Bij Dobbernatuur drijven sinds 2024 tuintjes van kurk, wilg, riet en bamboe langs de kade en rond de meerpalen. Na een jaar zat er rond de grote installaties meer leven dan langs de kale kademuur, maar een meetbaar effect op het water was er nog niet. Op 2 april 2026 gingen twee oloïdes te water, Kriek en Maria. Hun tuimelende beweging, een vorm die Paul Schatz vond, zet het water in beweging en voegt zuurstof toe. Het plan kwam van een groep vaste zwemmers rond Maria Blaisse. ReefSystems maakte de haven tot een van de testlocaties voor zijn kunstrif en zette hier 30 modules in het water, en The Great Bubble Barrier heeft in de oostelijke hoek, buiten het zwemgebied, een proefopstelling met een bellenscherm.

      Let op:
      - de twee oloïdes die in het water draaien
      - de drijvende tuintjes langs de kade, zoals DobberWeelde, Willoasis en de Vogelwoonboot voor oeverzwaluwen
      - de schermen met de waterkwaliteit van vandaag
      - de boardwalk dwars over de haven
