  nl:
    title: De zwarte doos van de marechaussee
    summary: Aan de noordkant van het Marineterrein staat een donkere kubus met 1.750 dezelfde raampjes, even groot als het Scheepvaartmuseum aan de andere kant. Het is het kantoor van de Koninklijke Marechaussee, zo ontworpen dat het personeel naar buiten kijkt en niemand naar binnen.
    body: |
      Vanuit de trein, of als je de Jan Schaeferbrug af fietst, lijkt het een zwarte doos. Hier zit de Koninklijke Marechaussee: een kantoor dat de Keulse architect Norbert Wansleben (Wansleben Architekten) ontwierp voor de vastgoeddienst van Defensie, in 2008 klaar. Zijn voorbeeld was het oude Zeemagazijn aan de zuidpunt van de werf, nu het Scheepvaartmuseum: een vierkant blok van vijf lagen rond een binnenplaats, als een fort. Aan de noordpunt herhaalt zijn kubus dat blok, met letterlijk dezelfde maten.

      De gevel is een strak raster van 1.750 gelijke raampjes, diep in een huid van zwarte steentjes. Van buiten zie je niet waar de vijf verdiepingen zitten, en aan de straatkant ligt een gang tussen de kantoren en de gevel: het personeel heeft uitzicht, maar wordt zelf niet gezien. Archined dacht aan een oproerschild met kijkgaten. Binnen is de hof juist open, met veel glas en gekleurde houten luiken. Als 's avonds het licht brandt, zie je dat ruim een derde van de gevel glas is.

      Bezoek: een gebouw van Defensie, geen toegang; bekijk het vanaf de straat, de Jan Schaeferbrug of de trein.

      Let op:
      - het raster van raampjes, zoals je het ziet vanaf de Jan Schaeferbrug
      - hoe de steentjes glanzen in de zon
      - de extra verlichte onderste rij ramen
    attributes:
      original_use: Kantoor van de Koninklijke Marechaussee
    sources:
      - https://arcam.nl/architectuur-gids/marinekazerne-amsterdam/
      - https://www.archined.nl/2010/02/kmar/

- title: The ship carpenters' workshop and the Scheepskameel
  summary: One of the few buildings left from the days of 's Lands Werf, this brick ship carpenters' workshop at the north-west tip is now restaurant Scheepskameel. The name comes from the 1690 invention that lifted deep ships over the shallows at Pampus.
  body: |
    The two-storey brick workshop under a hipped roof once stood parallel to the yard's old quay, before the rebuilding of the 1960s changed everything round it. The city register dates it to 1878; the 2018 survey put it at around 1860. Later the navy's technical training school (TOKM) used it, and in July 2025 it became a municipal monument.

    Since May 2016 it has housed a restaurant, and the name reaches back further than the building. Ships bound for Amsterdam had to cross the shallows off Pampus in the Zuiderzee, where deep ones got stuck; "voor Pampus liggen" (lying off Pampus) still means being out of action. The city carpenter Meeuwis Meindertsz. Bakker came up with the scheepskameel (ship camel): floats fixed on either side of a hull and pumped empty, so that they lifted the ship over the shallow water. He tested it in April 1690 on the warship Princes Maria, and the Admiralty granted him a yearly pension.

    The Schietbaan next door has its own place.

    Visiting: the restaurant opens Tuesday to Saturday from 18:00; the building can be seen from outside at any time.

    Look for:
    - the brick walls and hipped roof among the 1960s concrete
    - the Scheepskameel sign
