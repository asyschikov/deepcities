- title: Beta berlayar jauh, the Moluccan marines' monument
  summary: Unveiled on 29 April 2026, 75 years after the first ship of Moluccan KNIL soldiers reached the Javakade, Yopi Abraham's work honours fourteen Moluccan marines stationed here in 1951. Its steel slats show a navy man or a Moluccan warrior, depending on where you stand.
  body: |
    After Indonesian independence and the disbanding of the KNIL, the Dutch colonial army, more than 3,500 Moluccan soldiers were brought to the Netherlands in 1951. They expected the stay to be temporary, until their political future was settled. The first ship moored at Amsterdam's Javakade on 29 April 1951; four ships brought more than a thousand KNIL soldiers and their families. Fourteen of the men were marines, posted to the Kattenburg barracks on this site.

    On 29 April 2026, 75 years to the day, the navy's commander and relatives of the men unveiled the monument, at a ceremony their descendants organised with Defence. The Moluccan artist Yopi Abraham made it of corten-steel slats: from one angle you see a navy man, from another a Moluccan warrior. The steel refers to the ships of 1951. Its title, Beta berlayar jauh ("I sail far away"), is the opening line of a Moluccan song that matters greatly among Moluccan navy men, and the words are on the monument. The programme for the unveiling had the names of the fourteen read out one by one, with relatives, often of several generations, laying a rose for each.

    Visiting: free; the Voorwerf is the open part of the Marineterrein, just inside the gate.

    Look for:
    - the navy man and the warrior, by walking round the slats
    - the words Beta berlayar jauh
