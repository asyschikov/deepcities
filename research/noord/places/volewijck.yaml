  nl:
    title: Politiepost bij de Willemssluis
    summary: "Een politiepostje uit 1915-1916 bij de Willemssluis, Amsterdamse School in dorpse uitvoering: groen en gebroken wit houten beschot, en tussen de twee schoorstenen een loden bruggetje met luchtkanalen voor de twee cellen."
    body: |
      Kijk eerst naar het dak. De twee schoorstenen zijn met elkaar verbonden door een met lood bekleed tussenstuk, en daarin lopen de luchtkanalen die de twee cellen van verse lucht voorzagen.

      Publieke Werken zette de post in 1915-1916 neer op de westoever van de voorhaven van het Noordhollandsch Kanaal, bij de sluis. Binnen was plaats voor een kamer voor de agenten, een kamer voor de commandant, een stalling voor fietsen en, in het hart van het gebouwtje, twee cellen.

      Het is de Amsterdamse School op zijn landelijkst. De plattegrond bestaat uit twee vierkanten die in elkaar grijpen. Op een stenen voet staat liggend houten beschot, groen aan de boven- en onderkant en daartussen gebroken wit. De planken lopen uit in een punt en rond de ramen is de bovenrand gekarteld. De ramen hebben een verdeling in negen ruitjes en luiken. De voordeur zit op de schuin afgesneden zuidhoek. De ingang aan de achterkant en de aanbouw zijn van later.
    attributes:
      original_use: Politiepost met twee arrestantenlokalen
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/508529

- title: Lock-keeper's house, Willemssluis
  summary: "A sturdy 1839 lock-keeper's house by King William I's showpiece lock, with a Philibert-type arched roof truss, a progressive technique then mostly used for army buildings."
  body: |
    The Noordhollandsch Kanaal, dug from the IJ to Den Helder and opened in 1824 to Jan Blanken's design, was one of the great engineering works of King William I, and the Willemssluis at its mouth was admired worldwide. The first lock-keeper's house, thrown up with the canal, was not grand enough: in 1839 the state built new homes for the harbour master and the lock hands, reusing bricks and timber from the old house. The lock hands' cottages still stand at Buiksloterweg 13-19, the harbour master's house across the water.

    This house was built of hard grey Vecht bricks on Amsterdam pile foundations, with a half-hipped roof and a cellar tiled in costly yellow glazed tiles. Its rarity is in the attic: a Philibert truss (an arch built up from short planks), invented in France in 1561 and revived in the 19th century mainly for military buildings, and, as far as is known, uncommon in a house. The house was split in two in 1938. Private homes: look from the Buiksloterweg.
  category: infrastructure
  lat: 52.384119
  lng: 4.907598
  address: Buiksloterweg 9-11
  links:
    - { label: Monumentenregister Amsterdam (200470), url: "https://data.amsterdam.nl/monumenten/a47dac15-af80-43f8-b39c-040ce1bd548f" }
  attributes:
    rank: Okay
    heritage_status: Municipal monument
    monument_number: "200470"
    built: "1839"
    listed: 2002
    original_use: Lock-keeper's house
  photos:
    - commons:File:Sluiswachterswoning, Amsterdam-Noord 1.jpeg
  sources:
    - city:200470 (register text)
  nl:
    title: Sluiswachterswoning Willemssluis
    summary: "Een stevig sluiswachtershuis uit 1839 naast de Willemssluis, het paradepaardje van koning Willem I. Op zolder zit een Philibertspant, een boogspant van korte planken dat toen vooruitstrevend was en vooral in militaire gebouwen werd gebruikt."
    body: |
      Het meest bijzondere van dit huis zie je niet: het zit op zolder. Daar staat de kap op Philibertspanten, bogen die uit korte planken zijn opgebouwd. De Fransman Philibert de l'Orme bedacht de techniek in 1561. In de negentiende eeuw werd ze herontdekt, vooral voor militaire gebouwen. In een woonhuis kwam je zo'n kap, voor zover bekend, weinig tegen.

      Dat het rijk hier zoveel moeite deed, past bij de plek. Het Noordhollandsch Kanaal van het IJ naar Den Helder ging in 1824 open, naar ontwerp van Jan Blanken. Het was een van de grote waterwerken van koning Willem I, en het kanaal en de Willemssluis bij de monding golden toen over de hele wereld als hoogtepunten. Het eerste wachtershuis, haastig neergezet bij de aanleg, was niet deftig genoeg. In 1839 bouwde de staat daarom nieuwe huizen voor de havenmeester en de sluisknechten, deels met stenen en hout uit het oude huis. De knechtswoningen staan nog op Buiksloterweg 13-19, het havenmeestershuis aan de overkant.

      Dit huis is gemetseld van hardgrauwe Vechtse moppen op een Amsterdamse paalfundering en heeft een dak met wolfseinden. De kelder kreeg geel geglazuurde plavuizen, een dure keuze. In 1938 werd het in tweeën gedeeld. Het zijn particuliere woningen: kijk vanaf de Buiksloterweg.
    attributes:
      original_use: Sluiswachterswoning
    sources:
      - https://data.amsterdam.nl/monumenten/a47dac15-af80-43f8-b39c-040ce1bd548f

- title: Sint Rita complex (BUNK)
  summary: "Kropholler's brick Catholic enclave of church, presbytery, convent, cloister and school. A bomb fell into the full church in July 1943; the church is now a hotel with pods."
  body: |
    Between 1921 and 1931 A.J. Kropholler built a whole Catholic world around a triangular green on the Hagedoornplein: the church of *Sint Rita over 't Y* (1921–1922), its presbytery, the Sint Rosa convent of the Dominican sisters of Voorschoten with its chapel (1926–1927), a cloister with a walled vegetable garden, the Sint Rosa school (1929–1930) and a pair of houses on the Buiksloterweg (1930). It is his typical traditionalism: dark brown brick, red roofs, natural-stone details, pointed arches.

    On 17 July 1943 the parish was celebrating its 25th anniversary with a mass for local children when the American raid on the Fokker factory went astray. A heavy bomb crashed through the roof; eleven churchgoers died, two of them 13-year-old altar boys, and seven nuns died in the convent. C.M. van Moorsel restored everything after the war and in 1947 gave the church its present squat tower instead of the planned spire. The buildings lost their religious use from 1995; the west half of the church held a library from 1973, and the church is now BUNK, a hotel with rooms and pods. The convent and school are homes.

    Look for:
    - the marker about the 1943 bomb to the left of the hotel entrance
    - a memorial manhole cover on the Hagedoornplein, opposite the church
    - the tile panel with a rose on the double house, Buiksloterweg 97-99, and the stone saint under a little roof
    - Catharina of Siena and the dove on the tile panels of the school
    - the 1948 stained-glass window of Saint Rita in the presbytery stairwell (Buiksloterweg 95), given by the sisters
