    - { label: Wikipedia (nl) Begoniastraat 6, url: "https://nl.wikipedia.org/wiki/Begoniastraat_6_(Amsterdam)" }
    - { label: Historisch Centrum Amsterdam-Noord, url: "https://hcan.nl/locaties/begoniastraat-6-huis-gemeentelijk-monument/" }
