  nl:
    title: Café Modern
    summary: "Sinds 2012 een vaste waarde in Noord, in het bijkantoor van de Twentsche Bank uit 1931. De bank werd in 1987 overvallen; de oude kluis in de kelder is nu een ruimte voor besloten diners."
    body: |
      In augustus 1931 opende de Twentsche Bank, een van de voorlopers van ABN AMRO, een bijkantoor op de hoek van de Meidoornweg in de Van der Pekbuurt, ontworpen door de Gebroeders Van Gendt, met natuursteen in de pui en bijzonder metselwerk in de geveltop. Op de tweede verdieping woonde een medewerker met zijn gezin; in de kelder lag een kluis. Na de fusie van 1964, waaruit de Algemene Bank Nederland ontstond, bleef de bank hier open; in 1987 volgde een overval. In 1999 stond het pand leeg.

      In 2012 opende hier Café Modern. Het restaurant is sindsdien stevig verankerd in de wijk; buurtbewoners ontmoeten elkaar op het royale terras. In het interieur is de bank nog altijd terug te zien, de voormalige dienstwoning is een klein hotel en de kluis is nu een wijnkelder en een ruimte voor besloten diners.
    attributes:
      original_use: Bijkantoor van de Twentsche Bank
    sources:
      - https://amsterdamopdekaart.nl/1850-1940/Meidoornweg/2-4
