  nl:
    title: GG&GD-wijkpost Wingerdweg
    summary: "Gebouwtje uit 1938 van de Amsterdamse gezondheidsdienst, de oudste van het land, waarschijnlijk een wijkpost. Met patrijspoortramen, een portiek met ronde hoek en een zandstenen barmhartige Samaritaan uit 1955."
    body: |
      Amsterdam had de eerste gemeentelijke gezondheidsdienst van Nederland: de GG&GD, opgericht in 1901 en tegenwoordig GGD Amsterdam. Hier, aan de rand van het Florapark, liet Publieke Werken in 1938 een klein gebouw neerzetten, waarschijnlijk een wijkpost voor de nieuwe buurten in Noord. Wat er precies binnen gebeurde is niet zeker, vermoedelijk een consultatiebureau, spreekkamers en een kantoor. In de garage stond misschien een ziekenwagen, of anders de wagen van de arts. Het ontwerp is waarschijnlijk van J. Leupen.

      Het gebouw zit tussen zakelijk en traditioneel in, zoals de architecten van Groep '32 dat graag deden. Roodbruine baksteen, flauwe daken, volumes die langs elkaar schuiven, ronde ramen, en een diepe portiek met één afgeronde hoek onder een zware houten luifel op ijzeren zuilen. Boven het trappenhuis steekt een hoge schoorsteen uit die bovenaan breder wordt. Op de dichte muur bij de ingang zit een reliëf in zandsteen van de barmhartige Samaritaan (Lucas 10:30), waarschijnlijk van 1955 en gesigneerd HR, van H. Richters.

      Het gebouw doet nog steeds waar het voor gemaakt is: er zit een ouder- en kindcentrum van de GGD. De twee woningen uit 1955 op nummer 54-56 zijn geen monument.
    attributes:
      architect: Dienst der Publieke Werken (waarschijnlijk J. Leupen)
      original_use: Wijkpost van de gemeentelijke gezondheidsdienst
      built: 1938, uitgebreid 1955
    sources:
      - https://data.amsterdam.nl/monumenten/916bf8dc-4a9d-42d5-93e0-2d7665cf8da1

- title: Johanna Margaretha nursery
  summary: A yellow-brick day nursery of 1930 set like a villa at the edge of the Florapark, probably the first Amsterdam building for babies and toddlers designed around fresh air and greenery.
  body: |
    Care for the very young was long nobody's job: the education laws ignored them, and 19th-century reports describe toddlers crammed into miserable rooms. Private societies filled the gap, among them the Vereeniging tot Verbetering der Kleine Kinderen Bewaarplaatsen, founded in 1872 by Femina Muller. In 1930 Th.J. Roetering designed this *kinderbewaarplaats* (day nursery) for it, for children from birth to six.

    It stands where two streets of the garden village meet the Florapark, closing both views like a country villa, with its back to the park. A two-storey yellow-brick main block with a red roof and two low wings enclose a sheltered playground closed off by a gallery, the "safe children's world". Upstairs lived the director and staff, and washing dried on the flat roofs. Inside, the ochre tiles edged in black, the panelled doors and an extra-low children's handrail survive. As far as is known it is the first Amsterdam building for babies and toddlers that met the ideals of healthy, green school siting, and it is still a day nursery.

    Look for:
    - the geometric glazing bars in the fanlight over the entrance
    - the openwork brickwork above it
    - the spot where wrought-iron letters once read KLEINE KINDEREN BEWAARPLAATS
  category: civic
  lat: 52.392867
  lng: 4.917434
  address: Wingerdweg 98
  links:
    - { label: Monumentenregister Amsterdam (200706), url: "https://data.amsterdam.nl/monumenten/838e6abc-aff2-4067-95b4-c8f794165d73" }
  attributes:
    rank: Okay
    heritage_status: Municipal monument
    monument_number: "200706"
    built: 1929–1930
    architect: Th.J. Roetering
    listed: 2013
    original_use: Day nursery
  photos:
    - commons:File:Amsterdam - Johanna Margaretha.JPG
