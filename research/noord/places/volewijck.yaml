  nl:
    title: Tuindersloods Florapark
    summary: "Een houten huisje met rieten dak uit 1930, door Publieke Werken neergezet als loods voor de tuinders en de beplanting van het Florapark. Even schilderachtig als het park zelf en de tuindorpen eromheen."
    body: |
      Wie hier een gereedschapsschuur verwacht, ziet een Engels cottage. De gemeentedienst Publieke Werken tekende het gebouwtje in 1930 voor de mensen die het Florapark bijhielden.

      Het park zelf is ook een verhaal. Het ontwerp is van 1920, waarschijnlijk van H.C. Zwart, destijds het hoofd van de gemeentelijke beplanting, en vanaf 1921 werd het in Engelse landschapsstijl aangelegd. Het hoorde bij de socialistische parken van Noord: ruimte, licht en groen voor de gezinnen in de nieuwe tuindorpen, met een opvoedende kant die zijn inspiratie haalde bij natuurliefhebber Jac. P. Thijsse.

      De loods staat op een gemetselde voet. Daarboven horizontale houten delen, in de lijn van de oude landelijke houtbouw ten noorden van het IJ. Verder kleine ruitjes met luiken, opgeklampte deuren onder een doorlopende luifel, en een diep rieten dak met wolfeinden. Het is opvallend gaaf gebleven, en het lijkt eerder een sieraad in het park dan een werkplaats.
    attributes:
      original_use: Tuinders- en beplantingsloods
    sources:
      - https://data.amsterdam.nl/monumenten/8a4d73eb-1b9a-4d68-8d01-d4d89e49f5a9

- title: Former Wingerdschool and Resedaschool
  summary: "A long brick double primary school of 1925–1926 that bends with the street, decorated with fairy-tale figures by Hildo Krop. The only survivor of a cluster of six schools."
  body: |
    Noord's population grew so fast in the 1920s that a whole cluster of schools rose between the Wingerdweg and the Buiksloterweg: a public double primary school, Catholic girls' and boys' schools, a special school, a nursery school and a secondary school. Only this one made it into the 21st century.

    Nicolaas Lansdorp of Public Works designed it in brick, working under city architect W.A. de Graaf. From 1926 it housed two public primary schools for twelve classes, the Wingerdschool (nos. 28-30) and the Resedaschool (nos. 32-34). The building follows the curve of the Wingerdweg, and its facades carry small sculptures of fairy-tale characters by Hildo Krop, Amsterdam's city sculptor. Stadsherstel bought it in 2002, restored it and lets it as a building for small businesses.

    On the roof edge at the back sit two brass girls by Elisabet Stienstra (1995), commissioned by the city when the first businesses moved in, in the Amsterdam School habit of putting sculpture on buildings. One rubs her knee, both gaze into the distance and look bored stiff; the one above the right-hand stair entrance may be a quiet nod to Rodin's Thinker.

    Look for:
    - Krop's fairy-tale figures in the facades
    - Stienstra's two girls on the roof at the back
  category: civic
