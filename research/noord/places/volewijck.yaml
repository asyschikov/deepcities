    summary: "Vier eeuwen lang, tot 1795, hingen hier de lijken van terechtgestelden als waarschuwing voor elk schip dat Amsterdam binnenvoer. Rembrandt tekende er een van: Elsje Christiaens. Niets markeert de plek."
    body: |
      Amsterdamse kinderen kregen te horen dat baby's op de Volewijck aan een boom groeiden, de kindertjesboom. Op dezelfde landtong tegenover de stad hing ondertussen het gerecht te vergaan. Van ongeveer 1360 tot 1795 was de punt van de Volewijck het galgenveld van Amsterdam. Wie op de Dam was terechtgesteld, werd in een veeschuit overgeroeid en bleef hier hangen, vaak met het werktuig van de misdaad boven het hoofd, tot lucht en vogels er niets meer van hadden overgelaten. Zo'n duizend lichamen eindigden hier. Het moest indruk maken op elk binnenkomend schip, en het deed meer dan dat: Amsterdammers wandelden er met hun kinderen heen vanuit de Tolhuistuin, en 's winters schaatsten ze ernaartoe. Dat je niet begraven werd, hoorde bij de straf. Het oudste geschreven spoor van de kindertjesboom staat in Hoofts toneelstuk Warenar (1617). Daar krijgt de moeder van een zwangere vrouw te horen dat de schuit naar de Volewijck vertrekt en dat ze moet komen helpen roeien, zodat meeluisterende kinderen niet snapten dat er een bevalling werd bedoeld.

      In mei 1664 werd Elsje Christiaens, een Deense dienstmeid van 18 die bij een ruzie over de huur haar hospita met een bijl had gedood, op de Dam gewurgd en hier met haar bijl opgehangen. Rembrandt tekende haar twee keer. De Bataafse Republiek schafte de galgenvelden in 1795 af.

      De kuil met drie zuilen waarin de resten belandden is nooit geruimd, alleen onder zand gestopt; toen de industrie kwam, kwamen er botten boven. Stadsarcheologen denken dat hij onder de A'DAM Toren ligt, waar ook deze speld staat. Niets wijst erop, ondanks een petitie voor een monument. De verkeersbrug over het Buiksloterkanaal vlakbij heet sinds 2016 de Elsje Christiaensbrug.
    sources:
      - https://nl.wikipedia.org/wiki/Elsje_Christiaens
      - https://nl.wikipedia.org/wiki/Volewijck
      - https://onsamsterdam.nl/artikelen/overhoeks-gebouwd-op-knekels
      - https://hcan.nl/geschiedenis/1617-de-kindertjesboom-op-de-volewijck/

- title: Mosveld's stone floodlights
  summary: Two kinked brick towers on the Mosveld shopping centre quietly echo the floodlights of the stadium where De Volewijckers, 1944 national champions, played in the middle of the neighbourhood.
  body: |
    From 1927 to 1964 De Volewijckers played on the Mosveld, in a small stadium for some 15,000 people set right among the houses: residents could follow matches from their windows, and plenty slipped in without paying. The club was the biggest in Amsterdam in 1942, won the national title in 1944 (playing its home games at Ajax's ground after the 1943 bombing hit the Mosveld) and reached the Eredivisie in 1961 with the "Mosveld babies". In 1964 the club had to leave: the Johan van Hasseltweg, the approach road to the IJ tunnel, was built straight through the goals of the main pitch. The crowds did not follow to the new ground, and the professional side folded into FC Amsterdam in 1974.

    The Mosveld shopping centre opened on the old ground in 2016. Its two kinked brick towers, with round and oval openings near the top, were presented as a nod to Noord's industry, but the shopping centre itself and sports historian Jurryt van de Vooren say they also refer to the old floodlights. "Hardly anyone knows", he says. Look up from the square.

    Look for:
    - Mosplein 18 on the corner of the Mosveld: from 1929 to 1966 the Astoria, Noord's only official cinema, in sober Amsterdam School brick by Willem Noorlander, with a stage for live acts in its early years; then a supermarket, which it still is at street level; in 2012 the upper part became twelve flats
    - De Bult ("the hump"), the raised T-junction of 1967 where the Johan van Hasseltweg meets the Mosplein, built over the square where Piet de Vroome had called on people to join the February Strike of 1941; it was protested at the time
  category: curiosities
