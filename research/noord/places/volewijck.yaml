  nl:
    title: Players and Supporters
    summary: Vier bronzen voetballers op blote voeten van Hartmut Wilkening, elk balancerend op één voet in het gras bij de pont, niet ver van de weilanden in de Buiksloterham waar Ajax zijn eerste wedstrijden speelde.
    body: |
      Ajax begon niet in Oost. Vanaf 1900 speelde de club op twee velden tussen de weilanden van de Buiksloterham, hier vlakbij. Toen de gemeente daar woningen wilde bouwen, moest Ajax weg, en in 1907 verhuisde de club naar het Houten Stadion aan de Middenweg.

      Ook de bronzen beeldengroep van Hartmut Wilkening uit 2005, in het gras bij de pont, gaat over voetbal, voor hem behalve een spel ook een symbool van de massacultuur. Vier figuren trappen een balletje: ieder raakt met één blote voet de grond, terwijl de rest van het lichaam schuin door de lucht helt, alsof alleen de beweging ze overeind houdt. De bewegingen zijn die van profs, de kleren niet: een trui, een lange broek en geen voetbalschoenen.

      De groep staat op het grasveld naast de koffiekiosk Pont Neuf aan de Buiksloterweg, een paar stappen van de aanlegplaats van de pont van Centraal Station. Wie het IJ oversteekt, loopt er dus langs.

      Let op:
      - de ene voet waarop elke speler balanceert, op een klein stenen voetstuk
      - de blote voeten onder de lange broeken
      - de ponten die een paar stappen verderop aan- en afvaren
    sources:
      - https://geheugenvanoost.amsterdam/page/8368/ajax-doet-harten-sneller-kloppen

- title: Café Modern
  summary: "A Noord fixture since 2012, in the 1931 branch of the Twentsche Bank. The bank was robbed of 40,000 guilders in 1987; its old basement vault is now a room for private dinners."
  body: |
    In August 1931 the Twentsche Bank, a forerunner of ABN AMRO, opened a branch on the corner of the Meidoornweg in the Van der Pekbuurt, designed by the Van Gendt brothers with stone in the shopfront and decorative brickwork in the gable. A bank employee lived upstairs with his family, and there was a vault in the basement. The branch carried on after the 1964 merger into the Algemene Bank Nederland and was robbed in 1987 after a bomb alert, for 40,000 guilders. By 1999 it stood empty.

    In 2012 Café Modern opened here, and it has been a fixture of the neighbourhood ever since, with a big terrace that locals use for lunch and drinks. The bank is still legible in the interior, the old staff flat became a small hotel, and the vault is now a wine cellar and a room for private dinners.
