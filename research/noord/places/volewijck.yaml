  nl:
    title: Standbeeld voor de Halsbandparkiet
    summary: "Een zeven meter hoge keramische halsbandparkiet van Teun Castelein, in 2026 geplaatst: een ode aan alle vreemde vogels, en aan een vogel die de meningen verdeelt."
    body: |
      In de jaren zeventig werd de eerste halsbandparkiet in Amsterdam gespot; inmiddels zijn het er duizenden. Weinig vogels roepen zulke gemengde reacties op: de een geniet van de groene flitsen in het park, de ander noemt ze lawaaiig en lastig.

      Kunstenaar Teun Castelein werkte drie jaar aan het standbeeld van keramiek. Het staat zeven meter hoog in het Wilhelmina Druckerpark achter de A'DAM Toren en zou op 28 augustus 2026 officieel worden onthuld. Castelein ziet het als een ode aan "alle vreemde vogels", en aan Amsterdam als plek waar mensen heen trekken om zichzelf te worden, of om te vluchten. Voorbijgangers zijn verdeeld.

      Het is niet de eerste vreemde vogel hier. Zo'n 150 meter zuidelijker, op het Overhoeksplein, staat sinds 2020 *Vreemde vogels* van Fredie Beckmans: een enorme vogelkast van PUR-schuim in glasvezelversterkt polyester, die met een hijskraan op zijn plek werd gezet. Het is een monument voor verdraagzaamheid, mede op initiatief van de Stichting ter Verfraaiing van de Wereld: verschillen in afkomst, religie, seksualiteit of leefwijze horen er niet toe te doen.

      Let op:
      - zo'n 150 meter zuidelijker, op het Overhoeksplein: de reuzenvogelkast Vreemde vogels van Beckmans
    sources:
      - https://www.at5.nl/artikelen/239163/metershoge-halsbandparkiet-kijkt-uit-over-overhoeks-ode-aan-alle-vreemde-vogels
      - https://nl.wikipedia.org/wiki/Vreemde_vogels_(beeld)

- title: Players and Supporters
  summary: Four barefoot bronze footballers by Hartmut Wilkening, each balancing on one foot on the lawn by the ferry, not far from the Buiksloterham meadows where Ajax played its first matches.
  body: |
    Ajax did not start out in Amsterdam-Oost. From 1900 the club played on two pitches among the meadows of the Buiksloterham, close to here. When the city wanted that land for housing, Ajax had to leave, and in 1907 it moved to a wooden stadium on the Middenweg.

    Hartmut Wilkening's bronze group of 2005 on the grass by the ferry is about football too, which he sees as an icon of mass culture as well as a game. Four figures play a kickabout: each touches the ground with one bare foot while the rest of the body tilts through the air, as if only the movement keeps it upright. The moves are a professional's, the clothes are not: a sweater, long trousers and no boots.

    The group stands on the lawn beside the Pont Neuf coffee kiosk on the Buiksloterweg, a few steps from where the ferry from Centraal Station lands, so you walk past it when you cross the IJ.

    Look for:
    - the single foot each player balances on, on a small stone base
    - the bare feet under the long trousers
    - the ferries coming and going a few steps away
