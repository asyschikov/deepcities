  nl:
    title: Villa Abspoel (portierswoning Shell)
    summary: "Wit, blokkig en modernistisch: de portierswoning die Shell in 1938 bij de oude poort van zijn laboratoriumterrein liet bouwen. Het huis is gaaf tot aan het hang- en sluitwerk toe en hoort nu bij de Tolhuistuin."
    body: |
      Het hek waarvoor dit huis bestond, is allang weg. Toch is er aan de portierswoning van Shell weinig veranderd, tot de scharnieren en sloten aan toe.

      Shells eigen architect, C.A. Abspoel, tekende in 1937 een woning met portiersloge voor de hoofdpoort van het laboratoriumterrein, aan de zuidoostkant van de brug over het Buiksloterkanaal. Tegelijk ontwierp hij aan de overkant van de Tolhuisweg de kantine voor het personeel, het huidige Poortgebouw. Abspoel hoorde bij De 8, de club van Amsterdamse modernisten, en dat zie je meteen. Witgepleisterde muren, rechte blokken die ongelijk tegen elkaar aan staan, stalen ramen op bruine tegeldorpels en smalle daklijsten, vermoedelijk ook van bruine tegels.

      Later verhuisde de poort een eind naar het zuidoosten. De loge had geen functie meer en het huis werd een bankkantoor. Het hek dat bij de brug op de loge aansloot, verdween, en de garagedeur werd veranderd. Maar verder bleef bijna alles zoals Abspoel het bedacht, ook de voordeur met het gesmede koperen traliewerk voor het raampje. Tegenwoordig is het een van de gebouwen van de Tolhuistuin en heet het Villa Abspoel.
    attributes:
      original_use: Portierswoning en portiersloge van het Shell-terrein
    sources:
      - https://data.amsterdam.nl/monumenten/3ead06b2-6237-4944-94ed-2a34ede09b1a

- title: A Lab (Shell's Groot Laboratorium)
  summary: "The 1929 laboratory where Shell researched fuels and chemicals until it sold the building in 2005, now a breeding ground for start-ups. The A'DAM Toren was placed exactly on its axis."
  body: |
    In 1905 the Dordtsche Petroleum Maatschappij settled on the oil-storage ground by the IJ, and in 1911 it became part of Royal Dutch Shell, which built its research laboratories here. Shell's house architect C.A. Abspoel designed the Groot Laboratorium in 1929: four wings in warm red brick round a light court, with accented entrances to the IJ and the Buiksloterkanaal and grand stairwells. A newer wing followed; its stairwell has stained-glass windows of 1947 by Max Nauta.

    Arthur Staal set his Shell tower (now the A'DAM Toren) exactly on the lab's centre line. Since 2013 it is A Lab, a breeding ground with workspace for around a hundred organisations, events and a café. The register is frank about why it matters: as a reminder of an industry it calls "(now controversial)".

    Nauta's windows are more than decoration. One, of 1939, marks the laboratory's 25 years and the directorship of G.J.L. Caviët; the memorial windows, unveiled on 4 July 1947 at the staff's initiative, carry the names of 17 lab workers who died in the war. They read like an allegory of the occupation: a crowned phoenix holding a chalice of blood, a pelican feeding its young (sacrifice), a crane (vigilance) trampling a dragon in flames (the Nazi party), the stone tablets with a Star of David, a pentagram with an all-seeing eye (the chemist's sign), and the words "Gij zijt tot vrijheid geroepen" (you have been called to freedom). Squatters of the Occupy movement damaged them in 2011; they were repaired in 2012–2013. They are in the stairwell of the rear wing, now Clink hostel.
