  nl:
    title: Ponthuys (voormalig kantoor gemeenteveren)
    summary: "Het kantoor van de gemeenteveren uit 1929, met twee steile topgevels en schoorstenen die half scheef lopen. Wie met de pont vanaf Centraal aan de Buiksloterweg aankomt, ziet dit gebouw als eerste."
    body: |
      Stap je aan de Buiksloterweg van de pont, dan kijk je recht tegen dit gebouw aan: een enorm donker dak boven lage muren.

      Al eeuwen varen er veren over het IJ naar de Volewijck. Na 1921, toen Amsterdam Noord had ingelijfd en er tuindorpen en werven verrezen, moesten er steeds meer bewoners en arbeiders heen en weer. Publieke Werken legde daarom in 1929 nieuwe steigers aan, zette een wachthuisje neer en bouwde dit kantoor voor de gemeenteveren. Welke architect van de dienst het ontwierp, is niet bekend.

      Het is laag en symmetrisch, van gele baksteen, met een groot donker dak met steile schilden. Aan de voorkant staan twee puntgevels met speelse ronde raampjes, en twee hoge schoorstenen waarvan de schacht deels schuin loopt. Omdat de muren zo laag blijven en de witte goten ver uitsteken, is het dak de hoofdrolspeler. Binnen laten terrazzovloeren nog zien waar vroeger de gangen van het kantoor liepen. Het bijpassende wachthuisje iets zuidelijker verdween in de jaren negentig.

      Nu zit er een café-restaurant in. Met het oude Tolhuis ernaast vormt het voor wie met de pont naar de Buiksloterweg komt de voordeur van Noord.
    attributes:
      architect: Dienst der Publieke Werken
      original_use: Kantoor van de gemeenteveren
    sources:
      - https://data.amsterdam.nl/monumenten/50b0baa9-692e-4dba-a5a6-9b862dd75cdf

- title: "'t Tolhuis"
  summary: "Successor of the 1660s toll house and inn where travellers waited for the ferry. Willem Springer's 1859 café and its garden drew Amsterdammers across the IJ a few years before the Vondelpark opened."
  body: |
    In 1660 the Buiksloot ferry was moved to the Volewijck, and a toll collector's house and inn were built here, the first Tolhuis; tolls paid for the upkeep of the new towing canal north to Buiksloot, Monnickendam, Edam and Hoorn. A tea dome followed in 1770. Once the steam ferry ran from 1842, the Tolhuis became a favourite day out.

    The present building dates from 1859, an eclectic café-restaurant by assistant city architect Willem Springer, with a garden by city engineer P. van der Sterr. Its two rooms looked west over the IJ. The garden made it a favourite outing for Amsterdammers, who only got the Vondelpark a few years later, in 1865. Open-air concerts in the garden began around 1870, and a playground, bandstand and archery range followed in 1878. It survived the 1913 shipping exhibition (ENTOS) held around it, was the subject of a 1919 city plan to make it a *volkskoffiehuis* (people's coffee house), gave Noord's Jews a rented room for their services before they had a synagogue of their own, and lost most of its garden to Shell in 1938. Architect Theo Bosch added a wedding room on the garden side in 1989. It is still a café-restaurant.

    Look for:
    - the entrance porch on the short south side, with carved bargeboards and a fanlight with star tracery
    - the five double doors with round fanlights along the west front
    - the wide, low-pitched roofs with carved cornices
  category: civic
  lat: 52.383092
