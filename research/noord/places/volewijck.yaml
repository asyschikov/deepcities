    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/f180f66a-8b40-4e11-85ac-a4d70b9dce25" }
  attributes:
    rank: Nice
    heritage_status: National monument
    monument_number: "508529"
    built: 1915–1916
