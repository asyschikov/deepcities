  nl:
    title: Hyperion Lyceum
    summary: "Een middelbare school gebouwd als dubbele helix: een atrium en een keten van buitenterrassen slingeren omhoog in plaats van een schoolplein, met binnen een glijbaan van twee verdiepingen. Het kunstwerk verdween bijna meteen achter een toren."
    body: |
      Het Hyperion Lyceum begon in 2011 aan de Tolhuiskade, in een tijdelijk gebouw dat binnen zes maanden was ontworpen en neergezet. Sinds de zomer van 2018 zit de school in dit gebouw aan de Badhuiskade van Ector Hoogstad Architecten, met zo'n 850 leerlingen. Het is ongewoon hoog voor een middelbare school, dus stapelden de architecten het als een dubbele helix: binnen een atrium, buiten een route van aan elkaar geschakelde terrassen die langs het gebouw omhoog klimmen. Die terrassen vervangen het schoolplein; elk heeft een eigen thema, van stadstuin en sportterras tot een terras voor de leraren. Geen verdieping heeft dezelfde vorm, en elk vak heeft een eigen, vaak eigenaardig gevormd lokaal. Het buitenschild, van deels doorzichtige aluminium platen, is grijs; het binnenschild geel. De materialen zijn bewust eenvoudig en goedkoop; het paradepaardje is een glijbaan van twee verdiepingen in het atrium.

      Op de noordgevel schilderde de Spaanse kunstenaar Lara Almarcegui een alternatief 'boodschappenlijstje' van de bouwmaterialen achter de nieuwe wijk: 46.753 ton, van grond tot kalk. Het werd op 26 september 2018 onthuld en verdween vrijwel direct achter de toren Bold van 25 verdiepingen die ernaast verrees: tussen de twee gebouwen zit 10 centimeter.

      Het is een werkende school, dus binnen kun je niet komen. De terrassen en de schuine, licht gebogen gevel zie je vanaf de Badhuiskade.

      Let op:
      - de terrassen die langs de gevel omhoog trappen
      - het grijze, deels doorzichtige aluminium buitenschild
      - de kier van 10 centimeter met de toren erachter, waar het kunstwerk zit
    attributes:
      original_use: Middelbare school
    sources:
