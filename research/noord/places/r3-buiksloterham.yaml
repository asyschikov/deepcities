    - PDOK BAG geocoder (Papaverhof 63)
  nl:
    title: Republica, Papaverhof
    summary: "Een gesloten fabrieksterrein van 80 bij 80 meter opengebroken tot zes gebouwen rond autovrije pleintjes en stegen, opgetild op een halfverdiepte garage. In het zachtgroene torentje kregen kopers een kale casco om zelf af te bouwen."
    body: |
      Republica was een van de pioniersprojecten op het oude bedrijventerrein van de Buiksloterham, en het wil nadrukkelijk een dorp zijn. Marc Koehler Architects brak een gesloten fabrieksterrein van 80 bij 80 meter open tot zes gebouwen in verschillende vormen en materialen, met autovrije pleintjes en stegen ertussen, die via twee bruggetjes en een brede trap aansluiten op de looproutes door de buurt. Alles staat op een halfverdiepte garage: auto's, fietsen, installaties en afval blijven uit het zicht en de pleinen liggen een verdieping boven de straat.

      Elk gebouw heeft een eigen huid: een zachtgroen betonnen torentje, een witte getrapte toren, een appartementenhotel met een houten gevel, een werkgebouw van cortenstaal en een café met een gevel van gerecyclede baksteen. Voor het café, op het zuiden, liggen brede zittreden: de 'Spaanse trappen' van Buiksloterham. In het groene torentje zitten tien Superlofts, verkocht als lege casco die de eigenaren zelf hebben afgebouwd; de witte toren is op dezelfde manier afgemaakt. Er zijn 55 woningen, kantoren, horeca en een hotel voor langer verblijf, en het complex heeft een eigen energiecoöperatie met zonnepanelen en een lokaal net. In 2023 was het klaar.

      De woningen zijn particulier; de pleintjes en trappen zijn ontworpen om doorheen te lopen.

      Let op:
      - de natuurstenen pleintjes en de trap omhoog vanaf de straat
      - het groene torentje met zijn verschillende ramen
      - de zittreden voor het bakstenen café
      - het werkgebouw van cortenstaal
    attributes:
      built: opgeleverd 2024
      architect: Marc Koehler Architects; Loer Architecten (één huurblok)
    sources:
      - https://www.v2com-newswire.com/fr/salle-de-presse/post_files/6922/download

- title: Cityplot and the Tolhuiskade beacon
  summary: "A circular neighbourhood of small plots, where the streets are named after cabaret artists and the ground floors hold a laundry bar and a repair barn. On the canal bend, a roof spells BAK, STUUR, NOORD or ZUID depending on where you stand."
  body: |
    Between the Tolhuiskanaal and the Johan van Hasseltkanaal, Studioninedots and the landscape architects DELVA dropped the idea of one big master plan during the last crisis and divided the land into small plots that different architects could fill over time. The housing corporation de Alliantie built 138 two- and three-room flats here as a "circular" experiment: on the ground floors there is a wasbar (laundry bar) for washing and mending clothes, a buurtschuur (neighbourhood barn) for fixing bikes, and a shared meeting room, run with Philadelphia, a care organisation for people with a mild intellectual disability; residents also share cars and cargo bikes. De Alliantie admitted in 2022 that at first only about one in five residents seemed interested in the circular idea, though the laundry, the repairs and the shared cars have since caught on.

    In 2016 the city chose kleinkunstenaars (cabaret and musical performers) as the theme for the street names, so you walk along the Conny Stuartstraat, the Lia Doranastraat and the Leen Jongewaardkade.

    On the bend of the Tolhuiskanaal, Civic Architects' small block of ten homes (2024) is meant as a beacon for the district. A double fin runs over its roof, hiding the flues, and its zigzag folds show different words from different sides: BAK and STUUR (port and starboard), NOORD and ZUID. The facade is angled to turn away the noise of the harbour.

    All homes are private; the quays and streets are public.

    Look for:
    - the lettered roof fin on the canal bend
    - the street signs with the performers' names
    - the wasbar and buurtschuur in the plinths
