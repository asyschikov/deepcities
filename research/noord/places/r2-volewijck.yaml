# Noord round A, slice "volewijck": public art and war memory in Volewijck, the Vogelbuurt
# and the Noorderpark. Scout items (SCOUT-2.md): 103+136 Noorderpark station, 104 Noorderklankpark,
# 107 arms with shopping bags, 111 Frieling's light cabinets, 113 Van Gerwen's word plates,
# 134 Spanjemonument, 135 Friendly Fire (with 140 as a Look for line), 139 Gerben Wagenaar plaque.
# Merges (108, 109, 112, 114, 115, 138, 141, 146) are in volewijck.yaml and ndsm.yaml.
# Dutch texts are written from Dutch sources: 4en5mei.nl, nl.wikipedia, Kunstwacht
