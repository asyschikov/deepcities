    title: Lichtkasten van Gijs Frieling, De Albatros
    summary: Negen vitrinekasten naast de deuren van De Albatros, van binnen beschilderd met bloemen en planten en 's avonds zo verlicht dat de kleuren lijken te bewegen. Het jeugdcentrum dat hier stond werd gesloopt; het betonreliëf ging in opslag.
    body: |
      De Albatros, op de hoek van de Johan van Hasseltweg en de Meeuwenlaan, is een woongebouw dat in 2006 werd opgeleverd. Op de begane grond staan aan weerszijden van de entreedeuren negen vitrinekasten van schilder Gijs Frieling. De achter- en zijwanden zijn beschilderd met bloemen en planten. 's Avonds valt er licht op volgens een ontwerp van Rob en Brenda Clemens, waardoor de kleuren gaan bewegen; overdag een stilleven, 's nachts steeds een ander beeld.

      De naam verwijst naar wat hier eerder stond: Jeugdcentrum Albatros van Frank van Klingeren. Dat werd met interieurschilderingen en al gesloopt. Het kleurloze betonreliëf van Pierre van Soest uit 1964, dat op een klonterige rotswand leek en door de gemeente als 'top' wordt gewaardeerd, het hoogste oordeel in het register van wandkunst, bleef bewaard. Het staat in opslag en wacht nog altijd op herplaatsing.

      Let op:
      - de beschilderde kasten naast de deuren
      - de kasten na zonsondergang, als het licht aangaat
