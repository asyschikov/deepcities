    title: Armen met boodschappentassen, Van der Pekstraat
    summary: Negen koperkleurige armen steken uit de gevels van de Van der Pekstraat, elke hand met een boodschappentas met een tekst erop. 'Mag het iets meer zijn? / vriendschap weegt niet.'
    body: |
      De Van der Pekstraat is de winkel- en marktstraat van de Van der Pekbuurt, een van de vroege tuindorpen van Noord. Architect J.E. van der Pek zag de Jordaan verkrotten en bedacht samen met ambtenaar Arie Keppler een buurt met goede woningen voor arbeiders. In 2011 verschenen negen koperkleurige armen aan de gevels van huizen en winkels. Elke arm steekt de straat in en houdt een boodschappentas vast.

      De armen en handen zijn van Ellen Klijzing; het idee en de teksten op de tassen komen van Sylvia Fennis. Die spelen met de taal van de winkel: op de ene tas staat de vraag van achter de toonbank, 'mag het iets meer zijn?', met als antwoord 'vriendschap weegt niet'. Een andere zegt 'kijk naar verschillen / en zie geen overeenkomst'. Negen kleine gedichten, door niemand de straat in gedragen.

      Let op:
      - de armen hoog aan de gevels, tussen de uithangborden
      - de teksten op de tassen, ze zijn allemaal anders
      - de gele banden van Van der Pek in de oorspronkelijke gevels
      - Café Keppler aan het Van der Pekplein, genoemd naar de initiatiefnemer van de buurt
