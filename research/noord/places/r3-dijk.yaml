  nl:
    title: Tuinpark Tuinwijck, de volkstuinen die steeds moesten verhuizen
    summary: Het eerste volkstuincomplex van Amsterdam opende rond 1910 bij de gasfabriek in Oost, verhuisde in 1939 en 1974 en belandde bij Schellingwoude als eerste volkstuinpark dat als openbaar park is aangelegd. In 1939 rolden de tuinders hun huisjes over planken.
    body: |
      Op 31 maart 1909 werd in Amsterdam het Comité voor volkstuinen opgericht, met een renteloze lening van 2000 gulden van het Amsterdamse departement van de Maatschappij tot Nut van 't Algemeen. Nog geen jaar later opende het het eerste volkstuincomplex van de stad, Tuinwijck, aan de Polderweg vlak bij de gasfabriek in Oost. De tuinen waren tien bij tien meter, de huur vier gulden per jaar, en minstens een tiende moest met bloemen beplant zijn. Tuinwijck is ouder dan de Amsterdamse Bond van Volkstuinders, die pas uit de voedselschaarste van de Eerste Wereldoorlog voortkwam.

      In 1939 had de gemeente de grond nodig. Na flink onderhandelen betaalde ze ruim 100.000 gulden voor de verhuizing naar de Oosterringdijk. De huisjes werden op een speelweide neergezet, en de tuinders moesten ze zelf op rollen onder planken naar hun nieuwe tuin rollen. Tuinwijck had een eigen muziekkorps met muziektent; die overleefde de verhuizing niet, want tuinders die om hout verlegen zaten namen de planken mee. In 1979 zat er nog een stukje van in een wringerblok bij iemands wasmachine.

      Begin jaren zeventig kwamen de ringwegplannen, en in 1974 gingen de spades opnieuw de grond in, nu aan de Liergouw tussen Schellingwoude en Ransdorp, op een steenworp van de weg die hen had verdreven. Deze keer werd het complex als park aangelegd, met openbaar groen en ruimte voor mensen zonder tuin, als eerste in Amsterdam.

      De paden horen bij de Volkstuinroute Boven Y langs zes volkstuinparken (open van april tot oktober); het thema van Tuinwijck is vlinders en oerbomen. De tuinen zijn privé.

      Let op:
      - de paaltjes van de Volkstuinroute
      - het groen tussen de tuinen, voor iedereen
      - de achteruitgang naar de Zwarte Gouw en de weilanden
    attributes:
      built: rond 1910; hier sinds 1974
      original_use: Volkstuinen
    sources:
      - https://www.tuinparktuinwijck.nl/de-bibliotheek/geschiedenis
      - https://www.tuinparktuinwijck.nl/de-bibliotheek/wandelroutes

- title: KiMu, the children's art museum
  summary: A museum where the art on show is made by children. Opened in 2026 by the mayor and the children's mayor, it gives visitors from 0 to 18 ateliers and materials but no assignments, plus a free-to-roam light studio and a net to lounge in above the hall.
  body: |
    KiMu (Kinderkunstmuseum) grew out of Kleinlab, a creative children's centre in Noord since 2012, and its founder and director Suzanne Huis. Mayor Femke Halsema opened it officially in March 2026, together with Amsterdam's children's mayor, Kiyaro. The idea is the opposite of a craft class: children get a richly laid-out "prepared environment" of tools and materials and decide for themselves what to make, try, fail at and start again.

    WE architecten turned the empty concrete shell of a new building on the water into a double-height hall with two wooden stairs, a triangular balcony like a crow's nest, and a net slung across for resting under a mirror that throws back the light off the water. The shop counter is clad in second-hand 1930s tiles that children printed with the KiMu logo.

    There are three ateliers. A one-hour session in one of the two making studios is included in the ticket for ages 2 to 18; the Atelier of Light is open to wander in. The opening show, Parallelle Processen, puts the work of nearly seventy children aged 4 to 15 beside that of Brian Elstak, Willem Harbers and Roos van Haaften, who worked from the same starting point without seeing each other's work (until mid-February 2027).

    Open Wednesday, Saturday and Sunday. Tickets 17.50 euros for children, 12.50 for adults; not yet on the Museumkaart.

    Look for:
    - the net and the crow's-nest balcony in the main hall
    - the tiled counter printed by children
    - the Atelier of Light
