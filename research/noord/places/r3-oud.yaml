  nl:
    title: Norderney, het zendschip van Radio Veronica
    summary: Tien jaar lag deze oude trawler voor de kust als thuishaven van zeezender Radio Veronica, tot de wet er op 31 augustus 1974 een einde aan maakte. Na jaren als discoschip ligt hij sinds 2013 aan de NDSM, met de naam nog altijd groot op de romp.
    body: |
      De *Norderney* werd in 1949 in Hamburg gebouwd als trawler voor de visgronden bij IJsland. In 1960 ging het schip naar een Nederlandse sloper, die de motor er al uit had gehaald toen de gebroeders Verweij van Radio Veronica het in 1964 kochten. Op een werf in Zaandam kwamen er een studio en een zenderruimte in de plaats van de machinekamer, en twee houten masten voor de antenne. Vanaf november 1964 lag het voor de kust, net buiten de Nederlandse wateren. De reusachtige naam op de romp was afgekeken van de voorganger, een oud lichtschip.

      Bij een storm op 2 april 1973 sloeg het schip van zijn ankers en liep het vast op het strand van Scheveningen. De bemanning gooide eerst de zendkristallen overboord, zodat het juridisch geen zendschip meer was. Op 18 april werd het vlotgetrokken, precies op de dag van een grote demonstratie voor Veronica in Den Haag. Het mocht niet baten: een nieuwe wet verbood uitzenden vanaf zee, en op 31 augustus 1974 om zes uur 's avonds viel Veronica stil.

      Van een museum kwam niets. Het schip werd een drijvende discotheek in havens door het hele land, kwam op 17 november 2013 naar de NDSM-pier en is sinds 2018 club en restaurant. In februari 2023 zond Radio Veronica er een week lang vandaan uit, en op 31 augustus 2024 kwamen oud-medewerkers aan boord bijeen voor het vijftigjarig afscheid.

      Vanaf de kade is het schip altijd te zien; naar binnen kan tijdens openingstijden en evenementen.

      Let op:
      - VERONICA in grote letters op de romp
      - het zicht langs de NDSM-pier, waar het schip tussen andere oude schepen ligt
    attributes:
      original_use: Trawler, daarna zendschip (1964–1974)
    sources:
      - https://nl.wikipedia.org/wiki/Norderney_(schip,_1949)
      - https://www.radiofreak.nl/radio-veronica-week-lang-live-vanaf-oude-veronicaschip/
      - https://www.spreekbuis.nl/radio-veronica-reunie-op-31-augustus-2024/

- title: Iepenarboretum (elm arboretum), Oeverpark
  summary: Amsterdam has some 75,000 elms, more than almost any city. On new land along the IJ it planted a park of them in 2009–2010, about 70 trees of 32 kinds, from disease-proof clones to old cultivars that hardly grow anywhere else.
  body: |
    Despite elm disease, Amsterdam kept planting and caring for elms, and now has about 75,000: it likes to call itself the elm capital of the world. The Oeverpark, a strip 650 metres long on land won from the IJ in front of the old Shell site, was laid out as a tribute: every tree is an elm. They were planted in the autumn of 2009, the first elm arboretum in the country.

    Resistant varieties stand next to ones known to be vulnerable, far enough apart that their roots do not touch, so the collection doubles as a test. There is the narrow 'Columella', "the Italian poplar among elms"; 'Lutescens' with yellow leaves; the crinkly 'Crispa'; American clones; and 'Christine Buisman', named after the researcher who pioneered elm breeding, which here has a front-row view of Centraal Station. Three big old field elms were moved here from the Eerste Constantijn Huygenstraat in Oud-West when that street was redone.

    The park slopes down to a promenade and the quay, so it is also one of the best free benches facing the old city. In 2023 Het Parool counted 70 trees of 32 kinds; each kind is marked on the spot.

    Look for:
    - the word IEPENARBORETUM set in metal letters in the path, with galvanised elm leaves
    - the three transplanted old field elms from Oud-West
    - the name tags at the foot of the trees
  category: green
  lat: 52.387254
