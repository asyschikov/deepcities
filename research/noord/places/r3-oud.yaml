  nl:
    title: Johan van Hasseltkanaal, het kanaal dat nergens heen ging
    summary: Een kanaal dat vanaf 1908 dwars door Noord werd gegraven, zodat het IJ ooit een vaste oeververbinding kon krijgen. Het Rijk betaalde het ontbrekende stuk nooit. Het loopt nog altijd dood, en een weg, een voetbalveld en een ziekenhuis namen het tracé over.
    body: |
      Johan van Hasselt, directeur van Publieke Werken, bedacht rond 1905 een kanaal dwars door Noord dat de bocht van het IJ bij het Centraal Station zou afsnijden. Als de scheepvaart door Noord omvoer, kon er over het IJ een vaste verbinding met de binnenstad komen. Het probleem was de Willem I-sluis in het Noordhollandsch Kanaal: die was van het Rijk en had op kosten van het Rijk verplaatst moeten worden. Amsterdam ging ervan uit dat dat wel goed zou komen en begon in 1908 aan beide uiteinden te graven. Den Haag betaalde nooit.

      Zo bleven beide stukken doodlopende insteekhavens, in 1919 naar Van Hasselt vernoemd. De strook ertussen werd tientallen jaren vrijgehouden voor het kanaal. De Volewijckers kregen er hun sportpark, op het Mosveld. In de jaren dertig waren de schepen toch al te groot geworden voor zo'n smal kanaal en verdween het plan in een la. In 1966 kwam het ziekenhuis van Noord op het westelijke deel van de strook, en in 1968 werd over het middendeel de Johan van Hasseltweg aangelegd, de aanvoerweg naar de nieuwe IJtunnel, dwars door het oude voetbalveld. Het oostelijke deel van het kanaal werd in de jaren negentig grotendeels gedempt.

      De pin staat bij het doodlopende eind van het westelijke deel, naast Disteldorp. Verderop aan hetzelfde water liggen de drijvende woningen van Schoonschip en De Ceuvel. De brug in de Ridderspoorweg uit 2009 kan niet open: het middenstuk wordt er met een kraan uit getild als er een woonboot door moet.

      Let op:
      - het water dat gewoon ophoudt, met het tracé van het nooit gegraven kanaal dat zuidoostwaarts doorloopt naar het Mosveld
      - de Ridderspoorwegbrug met het uitneembare middenstuk
      - de verhoogde Johan van Hasseltweg op het tracé van het kanaal
    attributes:
      built: vanaf 1908
    sources:
      - https://nl.wikipedia.org/wiki/Johan_van_Hasseltkanaal
      - https://nl.wikipedia.org/wiki/Johan_van_Hasseltweg_(straat)

- title: Van der Pekbuurt, the garden village that was not demolished
  summary: "Around 2010 all 1,476 homes of Van der Pek's 1920s workers' village were down for demolition. Residents fought back, and the village is being restored block by block. The long wait left its own scars: a 2025 documentary is called 'De verkrotte droom'."
  body: |
    Between 1919 and 1926 the city built 1,468 homes here, almost all designed by Jan Ernst van der Pek, one of the first garden villages meant to keep shipyard and factory workers out of the slums across the IJ. Van der Pek died in 1919, during building, and the village took his name. Unlike the Amsterdam School blocks across the water, it is low and village-like, with bands of yellow brick in the facades. Houses rebuilt after the bombing of July 1943 lack those bands.

    Around 2010 the worn-out village was set for demolition. Residents fought it, the area became a protected townscape, and owner Ymere switched to renovation, with a new mix of 60% social rent and 40% sale or private rent. The southern part, nearest the ferry, was restored by Hoogeveen architecten from 2015 after research into the original colours, and won the Geurt Brinkgreve Bokaal (2017) and the Amsterdamse Nieuwbouwprijs (2018). Its new owner-occupiers signed an anti-speculation clause for ten years.

    For the roughly 1,100 social rented homes to the north, the work was postponed again and again. Tenants lived with damp, leaks and mould, and in 2021 they protested with posters on Ymere's window. Renovation began in 2023; Ymere, which has apologised, aims to finish around 2030. In 2025 Femke and Ilse van der Velzen's documentary "De verkrotte droom" ("the dream left to rot") followed tenants through the wait. These are people's homes: look from the street.

    Look for:
    - yellow brick bands, and the gaps where bombed houses were rebuilt
    - restored doors, dormers and brick garden walls in the southern part
    - the blocks under scaffolding to the north
  category: housing
  lat: 52.387878
