  nl:
    title: Schooltje De Wegwijzer, Ransdorp
    summary: "Een houten onderwijzerswoning uit 1897 met geschilderde zonnestralen in de top, en daarachter de bakstenen christelijke school van 1922. Een klein ensemble aan de Dorpsweg waar het dorp trots op mag zijn."
    body: |
      Boven het raam van de bovenverdieping straalt een zon, in rood en oranje geschilderd op de houten top. Daar woonde de meester. Aan de Dorpsweg bouwde de christelijke schoolvereniging haar eigen dorpsschool. Eerst kwam in 1897 een houten onderwijzerswoning, met een lager gebouw met lokalen erachter. In 1921 en 1922 volgde een bakstenen uitbreiding met twee klaslokalen voor de Vereeniging voor Christelijk Schoolonderwijs op Gereformeerden Grondslag, gebouwd door aannemer J. Kaker uit Zaandam. De oude lokalen in het midden maakten in 1985 en 1986 plaats voor nieuwbouw. Beschermd zijn de onderwijzerswoning (nr. 21) en de school van 1922 (nr. 19).

      De woning trekt alle aandacht. De liggende planken zijn beurtelings breed wit en smal lichtgroen geschilderd. Boven een tweelichtvenster met het bordje Chr. Nat. School De Wegwijzer staan de zonnestralen in de top, en helemaal bovenin een gesneden makelaar met een ruitvormig oog. De luiken dragen een rood-wit zandlopermotief.

      Let op:
      - de rood-oranje zonnestralen in de top van nr. 21
      - het bordje Chr. Nat. School De Wegwijzer
      - de zandloperluiken en het gekartelde lattenfries onder de dakrand
      - de hoge schoolramen en de schoorsteen van de school uit 1922 (nr. 19)
    attributes:
      original_use: Christelijke dorpsschool met onderwijzerswoning
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/508433

- title: Ransdorp bandstand
  summary: An octagonal wooden bandstand on the village green, built around 1920 by unemployed shipbuilders in a job-creation scheme. One of three survivors of a set of four in the Waterland villages.
  body: |
    On a strip of grass parallel to the Dorpsweg stands a small eight-sided *muziektent* (bandstand), built entirely of wood: clapboarded parapet, posts on the parapet, a shallow eight-sided roof and a little projecting entrance with a gate and flagpole on the north side. It was put up around 1920 by unemployed shipbuilders as a work-relief project.

    It had three identical siblings, in Durgerdam, Schellingwoude and Zunderdorp. The Zunderdorp one was pulled down; the other three are the only bandstands of this type left in Amsterdam. They are a simpler, smaller cousin of the ornate older bandstands in the Vondelpark and Oosterpark, built in the same timber-frame tradition as Waterland's houses and farms. The concerts have largely gone, but the bandstand still marks the green. The city's public-art register tells the origin differently: members of the local fanfare Wilhelmina built this one under the Ransdorp village carpenter Cornelis Schreuder, with timber supplied by Amsterdam, which had just annexed the Waterland villages.

    Look for:
    - the geometric boarding under the roof
    - the clapboarded parapet with the posts set on top
    - the entrance porch with its wooden gate and flagpole
