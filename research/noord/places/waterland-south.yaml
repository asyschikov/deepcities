    - 'https://onsamsterdam.nl/artikelen/hier-gebeurde-het-het-ij-begin-mei-1573 (Ons Amsterdam: at least sixteen wrecks sunk early May 1573 just west of Schellingwoude, after a first blockade of October 1572 was cleared; Velius on ballast of sand and stone broken from cloisters and towers in Waterland; De Fremery, Jaarboek Amstelodamum 1925: mostly gravestones and stone blocks from the church of Schellingwoude; Bossu''s fleet stopped at low water on 12 September, passed the next day when the wind raised the water; rebels watched from the Schellingwouder Schans; wrecks cleared October 1578 to spring 1580)'
