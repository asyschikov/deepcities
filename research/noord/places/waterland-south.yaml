    - { label: Staatsbosbeheer (Waterland-Oost), url: "https://www.staatsbosbeheer.nl/-/media/waterland/brochure-natuurherstel-waterland-oost-240722.pdf" }
    - { label: Wikipedia (nl) Ransdorp, url: "https://nl.wikipedia.org/wiki/Ransdorp" }
