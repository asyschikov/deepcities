  nl:
    title: Muziektent Ransdorp
    summary: "Een achtkantige houten muziektent op het dorpsveld, rond 1920 gebouwd door werkloze scheepsbouwers in een werkverschaffingsproject. Van de vier gelijke tenten in de Waterlandse dorpen zijn er nog drie over."
    body: |
      Wie bouwde deze muziektent? Daarover zijn de bronnen het niet eens. Het monumentenregister zegt: werkloze scheepsbouwers, rond 1920, als werkverschaffing. Het Amsterdamse register van kunst in de openbare ruimte vertelt iets anders. Daar waren het de leden van de plaatselijke fanfare Wilhelmina, onder leiding van dorpstimmerman Cornelis Schreuder uit Ransdorp, en kwam het hout van Amsterdam, dat de Waterlandse dorpen kort daarvoor had ingelijfd.

      De tent staat op een grasstrook evenwijdig aan de Dorpsweg en is helemaal van hout: een gepotdekselde borstwering met daarop de staanders, een vlak achtkantig dak en op het noorden een klein uitgebouwd portaal met een hekje en een vlaggenmast.

      Er waren vier precies dezelfde, ook in Durgerdam, Schellingwoude en Zunderdorp. Die van Zunderdorp is gesloopt. De andere drie zijn de laatste muziektenten van dit type in Amsterdam. Je kunt ze zien als het eenvoudige, kleinere neefje van de rijk versierde, oudere muziektenten in het Vondelpark en het Oosterpark, getimmerd in dezelfde houtbouwtraditie als de huizen en boerderijen van Waterland. Concerten zijn er nauwelijks meer, maar het veld heeft nog altijd zijn tent.

      Let op:
      - het geometrische beschot onder het dak
      - de gepotdekselde borstwering met de staanders erop
      - het portaaltje met het houten hekje en de vlaggenmast
    attributes:
      original_use: Muziektent
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/508435
      - https://data.amsterdam.nl/monumenten/c8640b17-b04a-4d0d-b861-b2ad7c42461f
      - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/447

- title: Dorpsweg Ransdorp, around the church (nos. 17–66)
  summary: "Low wooden houses with pointed gables to the road, lined up along the Dorpsweg near the church. Many are national monuments, and the mayor's brick villa of 1907 stands among them."
  body: |
    The Dorpsweg links the village core to two old Waterland roads, the Durgerdammergouw and the Bloemendalergouw. Between 1300 and 1600 the scattered farms of Waterland gathered into villages, and the ribbon of houses along the Bloemendalergouw and the Liergouw moved here, around the church. Because the houses stay so low, the tower dominates the village silhouette. They are mostly detached wooden houses of one storey under a roof, with a pointed timber gable (*puntvormig voorschot*) to the road; many look 19th-century, and several probably hide older frames. Behind some stand tall *kaakbergen*, Waterland hay barns. Ransdorp has been a protected village view since 1976. Nos. 54 to 62 form a row of wooden houses with pointed gables; with the churchyard, the trees and the drawbridge over the Weersloot they make what the register calls a remarkably intact whole. This ensemble is pinned on no. 66, a wooden house thought to date from the 17th or 18th century, with a good front.

    No. 17 breaks the pattern. In 1907 Amsterdam architects J. de Meijer and C.P. Messer built a brick villa for mayor J. Kastelein, reportedly paid for by his father-in-law and costing 4,000 guilders, with red glazed tiles, leaded windows and red-and-white hourglass shutters. The previous mayor had refused to live in the official house. The farm at Durgerdammergouw 2A, on the road out to Durgerdam, closes the stretch.

    Look for:
    - no. 17: the mayor's villa of 1907, its hourglass shutters and pleached limes
    - no. 23: a broadside wooden house with nine-pane windows
    - no. 24: a wooden house with a side aisle and pointed gable
    - nos. 39 and 51: wooden houses with side aisles, older frames behind 19th-century fronts
    - nos. 54–62: the row of pointed gables
    - no. 60-62: a tall hay barn behind the house
    - no. 63: an L-shaped wooden house of the 18th century or older
    - no. 64: a two-aisled wooden house
    - no. 66: the pinned house, a good front
    - Durgerdammergouw 2A: a stolp farm with partly wooden walls
