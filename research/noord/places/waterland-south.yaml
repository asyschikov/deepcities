  nl:
    title: Dorpsschool uit 1868, Ransdorp
    summary: "Eén lokaal voor zes klassen, in 1868 gebouwd naar een standaardontwerp, met de meesterswoning eraan vast. Het plafond zat op vijf meter, want men dacht dat kiemen van hoestende kinderen dan veilig naar boven zouden zweven."
    body: |
      Vijf meter hoog was dit klaslokaal ooit, en dat had een reden. Scholen golden in de negentiende eeuw als broeinesten van ziekte, en dat klopte ook. Vooral Amsterdamse artsen noemden de schoolgebouwen ongezond. Men was ervan overtuigd dat de kiemen die hoestende kinderen verspreidden naar het plafond zouden stijgen, en in een hoog lokaal zo onschadelijk werden.

      De school staat tegenover de kerk van Ransdorp. Publieke Werken van de toenmalige gemeente Ransdorp ontwierp haar in 1868, in één keer met de meesterswoning ernaast. Samen vormen ze een L: het lokaal ligt langs de weg, het huis staat er haaks op, met de topgevel naar de Dorpsweg en de voordeur aan het kerkplein. Het ontwerp volgt de voorbeeldschooltjes voor 50 leerlingen die al vroeg in de negentiende eeuw verschenen, na de eerste Nederlandse wetten op het lager onderwijs. In dat ene lokaal zaten alle zes klassen, kinderen van zes tot twaalf.

      Aan de ramen zie je het bouwjaar: groot, met een lage vensterbank. Oudere modellen zetten de ramen juist hoog, zodat kinderen niet naar buiten zaten te kijken. Volgens de gemeente is de school als dorpsschool bijzonder voor Amsterdam, en samen met die van Holysloot zeldzaam. Binnen is veel veranderd, maar het gebouw laat zich nog goed lezen.

      Let op:
      - de gevelsteen met naam en het jaar van de eerste steen, 1868
      - de versierde muurankers onder de dakrand
      - het portaal onder een platte luifel
      - de houders voor de vlaggenstok tussen de lokaalramen
      - de schoorsteen op de plek waar de kachel stond
    attributes:
      original_use: Openbare lagere school met onderwijzerswoning
    sources:
      - https://data.amsterdam.nl/monumenten/17a56a17-5837-4c8b-8ba0-1556bf0e56f9

- title: De Wegwijzer school, Ransdorp
  summary: "A wooden teacher's house of 1897 with painted sun rays in its gable, and the brick Christian school of 1922 behind it. A little ensemble of village pride on the Dorpsweg."
  body: |
    On the Dorpsweg the Christian school society built its own village school: first, in 1897, a wooden teacher's house with a low classroom block behind it; then, in 1921 and 1922, a brick extension with two classrooms for the *Vereeniging voor Christelijk Schoolonderwijs op Gereformeerden Grondslag*, built by J. Kaker of Zaandam. The old classrooms in the middle were replaced in 1985 and 1986; the listing protects the teacher's house (no. 21) and the 1922 school (no. 19).

    The teacher's house is the eye-catcher. Its boards are painted in alternating wide white and narrow light-green bands. Above a two-light window with the plaque *Chr. Nat. School De Wegwijzer* the gable carries sun rays painted red and orange, a carved finial with a diamond eye, and shutters with a red-and-white hourglass pattern.

    Look for:
    - the red and orange sun rays in the gable of no. 21
    - the plaque Chr. Nat. School De Wegwijzer
    - the hourglass shutters and the serrated lath frieze under the eaves
    - the tall classroom windows and the chimney of the 1922 school (no. 19)
