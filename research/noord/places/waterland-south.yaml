  nl:
    title: Finse school, Durgerdam
    summary: "Een vierklassig houten schoolgebouw uit 1949, een zogeheten Finse school. Tussen 1948 en 1950 kwamen er zo'n 115 van in Nederland, gebouwd met hout uit Finland. Nu wordt er gewoond."
    body: |
      Na de Tweede Wereldoorlog kampte Nederland met een groot tekort aan schoolgebouwen, terwijl Finland een grote industrie voor geprefabriceerde houten gebouwen had opgezet. Tussen 1948 en 1950 verrezen in Nederland zo'n 115 houten scholen, gebouwd met Fins hout dat via een handelsakkoord tussen beide landen kwam. Naar dat hout heten ze 'Finse scholen', en ze lijken vrijwel allemaal op elkaar.

      In Durgerdam staat zo'n Finse school: een vierklassig houten gebouw uit 1949, tegenover de voormalige openbare lagere school (Durgerdammerdijk 67), een tweeklassig schoolgebouw uit circa 1910. Het gebouw is geen school meer; het houten gebouw is met behoud van karakteristieke elementen verbouwd tot woningen. Het is geen beschermd monument.

      Let op:
      - het lange, lage houten gebouw met de rijen lokaalramen
      - de oudere school aan de overkant, nummer 67
    attributes:
      original_use: Lagere school
    sources:
      - https://dbnl.org/tekst/sten009monu11_01/sten009monu11_01_0059.php
