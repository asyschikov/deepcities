  nl:
    title: Durgerdammerdijk, oostkant (133–206)
    summary: "De oostelijke rij van Durgerdam loopt uit richting het Kinselmeer. Houten huizen met gepotdekselde zijwanden, een empire deur bij nummer 137 en een 17e-eeuws skelet achter een gevel uit het begin van de 20e eeuw."
    body: |
      De houten huizen zijn van dezelfde soort als verder naar het westen: vaak met 17e-eeuws skelet, puntvormig voorschot of als dwarshuis, met gepotdekselde zijwanden en een voornamelijk 19e-eeuws uitwendig aspect. Voorbij nummer 175 wordt de bebouwing dunner; de laatste twee monumenten, 195 en 206, staan waar de dijk naar het noorden afbuigt, richting het Kinselmeer.

      De speld staat bij nummer 137, een houten huis op een 17e-eeuws skelet. Het voorschot zwenkt uit en weer in (vroeg 19e-eeuws), de pui is goed bewaard, de empire deur heeft een bovenlicht in een omlijsting en de rechterzijwand is gepotdekseld.

      Let op:
      - nrs. 135 en 136: 17e-eeuws skelet, voorschot, gepotdekselde zijwanden
      - nr. 137: de empire deur en het uit- en ingezwenkte voorschot
      - nr. 144: 17e-eeuws skelet, puntvormig voorschot, goede pui en puilijst
      - nr. 150: 17e-eeuws houtskelet, puntvormig voorschot, in hoofdzaak 19e-eeuws
      - nr. 175: een deels versierd houtskelet uit de 17e eeuw achter een voorgevel uit het eerste kwart van de 20e eeuw
      - nr. 195: houten huis met puntvormig voorschot, uitwendig 19e-eeuws
      - nr. 206: houten dwarshuis (constructie 18e-eeuws?)
