  nl:
    title: Durgerdammerdijk, oostelijk van de Kapel (105–129)
    summary: "Een dichte rij houten huizen voorbij de Kapel, een aantal met 17e-eeuws houtskelet, gepotdekselde zijwanden en puntvormig voorschot, en een laat 17e-eeuws dwars achterhuis van na de dorpsbrand."
    body: |
      Oostelijk van de Kapel staan de houten huizen dicht op elkaar. Nummer 105 ziet er nu 19e-eeuws uit, maar begon na de dorpsbrand als dwars achterhuis uit de late 17e eeuw; binnen zitten nog zwanehals-korbelen. Meerdere buren hebben een 17e-eeuws houtskelet, bij andere is de constructie vermoedelijk 18e-eeuws en het uitwendig aspect voornamelijk 19e-eeuws.

      De speld staat bij nummer 117 (116–117), een houten huis dat op een 17e-eeuws skelet rust. Het heeft een puntvormig voorschot, een goed bewaarde pui met puilijst, oude roedenverdeling in de ramen en gepotdekselde zijwanden.

      Let op:
      - nr. 105: het laat 17e-eeuwse dwarse achterhuis van na de brand
      - nrs. 107–108: puntvormig voorschot, goede pui, gepotdekselde achtergevel met een deurtje uit de 18e eeuw
      - nr. 110: houten dwarshuis met 17e-eeuws houtskelet en 9-ruitsvensters
      - nr. 117: puntvormig voorschot, goede pui en puilijst, gepotdekselde zijwanden
      - nrs. 123 en 124: 17e-eeuws houtskelet, puntvormig voorschot
      - nr. 126: houten huis met 17e-eeuws houtskelet
