  nl:
    title: Dorpskerk Durgerdam
    summary: "Een witte waterstaatskerk uit 1840, net onder de dijk, opgemetseld met stenen van de stormschade-kerk uit 1642. Uit die oude kerk kwamen ook de preekstoel, koperen kronen en een klok van Pieter Hemony uit 1672 mee."
    body: |
      Dat de klok van Hemony hier nog hangt, komt door een vel papier. Op 20 april 1940 liet Jan Kalf, inspecteur kunstbescherming namens de regering, naast de klok een bord ophangen in vier talen: Nederlands, Duits, Frans en Engels. De klok was een historisch gedenkstuk en mocht niet worden gevorderd. Er kwam een grote M op, van monument. Het hielp: de klok bleef.

      Anders dan de rest van het dorp staat de kerk niet op de dijk maar wat lager, erachter, met het kerkhof eromheen. In 1642 kwam hier de eerste kerk. Stormen, en vooral de vloed van 1825, richtten zoveel schade aan dat het kerkbestuur besloot tot nieuwbouw. Zo ontstond in 1840 deze waterstaatskerk, een van de sobere kerken die in die jaren onder toezicht van de staat werden gebouwd. Hij is kleiner dan zijn voorganger en met veel van diens stenen opgetrokken.

      Veel verhuisde mee: de eiken preekstoel van 1646 met ebbenhouten knoppen en een koperen doopbekken, het 17e-eeuwse eiken doophek (ingekort, want het schip is smaller), drie koperen kronen gekocht in 1666 en 1667, en de klok die Pieter Hemony in 1672 goot. Een gedenkbord eert Gerrit Frederickszoon, een van de kapiteins in de Slag bij Duins van 1639. Het kabinetorgel van Jan Jacob Vool, van omstreeks 1815, stond van 1923 tot 1991 in Drunen en kwam toen hierheen. Sinds 1829 is het kerkhof een algemene begraafplaats, bewaard voor wie een band heeft met Durgerdam. De kerkgemeenschap hoort bij de Protestantse Kerk in Nederland.

      Let op:
      - de witgepleisterde voorgevel met twee steunberen
      - het vierkante torentje op het dak met de klok van Hemony
      - de zijmuren, verdeeld door lisenen
      - het kerkhof rondom de kerk
    attributes:
      original_use: Nederlands Hervormde kerk
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/6636
      - https://nl.wikipedia.org/wiki/Kerk_van_Durgerdam
      - https://nl.wikipedia.org/wiki/Durgerdam
      - https://onsamsterdam.nl/artikelen/getuigen-van-bewogen-dorpsgeschiedenis

- title: Durgerdam bandstand
  summary: A small octagonal wooden bandstand on the dike, built around 1910 to 1925 by unemployed shipbuilders. Turned a quarter so the houses behind stay reachable, it is one of only three of its kind left in Amsterdam.
  body: |
    Between the houses on the dike stands a little open *muziekkoepel* (bandstand) on an eight-sided plan, built entirely of wood. Eight posts set into a clapboarded parapet carry a shallow, slightly kinked roof; the floor and the ceiling are boarded in a spider-web pattern, with the octagonal king post poking through the middle of the ceiling. It was turned a quarter so that the houses behind it stay reachable, which put its open side toward the road. An iron railing with arrow-point bars fences off the small space around it.

    It is one of four identical bandstands built as a work-relief project for unemployed shipbuilders, in Durgerdam, Schellingwoude, Ransdorp and Zunderdorp. The Zunderdorp one was pulled down; the other three are the only ones of this type left in Amsterdam, a plainer, smaller cousin of the bandstands in the Vondelpark and Oosterpark. The exact date is unknown, around 1910 or a decade later. Squeezed into the row of houses it is less of a village centrepiece than its siblings, but the open space around it makes it a landmark on the dike. The city's public-art register tells the origin differently: members of the local fanfare 'Hou en Trou' built this one in the early 1920s; it was renovated in 1998.

    Look for:
    - the spider-web boarding of floor and ceiling
    - the posts boxed in diagonally, so they are diamond-shaped in section
    - the iron flagpole bracket on the roof edge
    - the arrow-point railing around it
