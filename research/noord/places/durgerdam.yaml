  nl:
    title: Muziekkoepel Durgerdam
    summary: "Een kleine achtkantige houten muziekkoepel op de dijk, ergens tussen 1910 en 1925 gebouwd door werkloze scheepsbouwers. Hij staat een kwartslag gedraaid, zodat de huizen erachter bereikbaar blijven, en is een van de laatste drie van zijn soort in Amsterdam."
    body: |
      Deze muziekkoepel staat een kwartslag gedraaid, zodat de huizen erachter bereikbaar bleven. Daardoor kijkt de open kant naar de weg. Tussen de huizen op de dijk staat hij, open en achtkantig en helemaal van hout. Acht staanders, ingelaten in een gepotdekselde borstwering, dragen een vlak dak met een lichte knik. Vloer en plafond zijn als een spinnenweb belegd, en midden uit het plafond steekt de achtkantige middenstijl van de kap. Een ijzeren hek met pijlpunten zet het pleintje eromheen af.

      Er werden vier gelijke koepels gebouwd, in Durgerdam, Schellingwoude, Ransdorp en Zunderdorp, als werkverschaffing voor werkloze scheepsbouwers. Die van Zunderdorp is afgebroken. De andere drie zijn de enige van dit type in Amsterdam: een soberder en kleiner familielid van de muziekkoepels in het Vondelpark en het Oosterpark. Wanneer precies is onbekend, rond 1910 of tien jaar later. Ingeklemd in het lint van huizen is deze minder een dorpsmiddelpunt dan zijn broertjes, maar dankzij de open ruimte eromheen valt hij op de dijk meteen op. Het Amsterdamse register van buitenkunst vertelt het anders: daar staat dat deze koepel begin jaren twintig door leden van fanfare Hou en Trou uit het dorp zelf is gebouwd. In 1998 werd hij opgeknapt.

      Let op:
      - het spinnenwebpatroon in vloer en plafond
      - de schuin omtimmerde staanders, met een ruitvormige doorsnede
      - de ijzeren beugel voor de vlaggenmast aan de dakrand
      - het hek met pijlpunten eromheen
    attributes:
      original_use: Muziektent
    sources:
      - https://data.amsterdam.nl/monumenten/3a205363-c00b-498e-bfa1-9ecd57b08356
      - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/448

# ================================================================ Dike ensembles

- title: Durgerdammerdijk, west end (nos. 37–63)
  summary: The row of wooden dike houses where Durgerdam begins, coming from Schellingwoude. Pointed timber gables on 17th-century frames, a hidden pair of broadside cottages at no. 48 and a gable that swings in and out.
  body: |
    Coming from Schellingwoude, the village starts here: one row of houses against the inner slope of the dike, fronts to the road and the water beyond. Most are wooden houses on a *houtskelet* (timber frame) of the 17th or 18th century, many from soon after the village fire of 1687, with a pointed wooden gable front (*voorschot*) and a good shopfront-style lower front. Some are *dwarshuizen*, broadside houses with the ridge along the dike. Many fronts and gables were renewed later, often in the 19th century, but the frames inside are older.

    The ensemble is pinned on no. 38, a wooden house on a 17th-century frame with a pointed gable and a fine lower front. A few steps on, the old inn of Durgerdam (nos. 72–73) and the bandstand have places of their own.

    Look for:
    - no. 37: a broad 19th-century wooden house under a hipped roof
    - no. 38: 17th-century frame, pointed gable, good lower front
    - no. 43: the frame of an old loading door with windows linked to it, in the pointed gable
    - no. 44: 17th-century frame and pointed gable
    - no. 48: two broadside houses, one set back with a diamond-patterned fanlight
    - no. 61: a gable swinging out and in, 19th century
