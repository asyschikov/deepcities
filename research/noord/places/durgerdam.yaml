- title: Durgerdammerdijk, east of the Kapel (nos. 105–129)
  summary: "A tight row of wooden houses just past the Kapel, several on 17th-century frames, with clapboarded side walls, pointed gables and a late 17th-century back house from after the village fire."
  body: |
    East of the Kapel the row closes up: one narrow wooden house after another, gable to the road. No. 105 was originally a late 17th-century back house from after the village fire, with curved *zwanenhals* (swan-neck) braces still inside. Several neighbours stand on 17th-century frames too, and nos. 107–108 still have a clapboarded back wall with old glazing bars and a small 18th-century door. Others probably date from the 18th century and mostly show a 19th-century face.

    The ensemble is pinned on no. 117 (116–117 on the door), a wooden house on a 17th-century frame with a pointed gable, a good lower front with a cornice, old glazing bars and clapboarded side walls.

    Look for:
    - no. 105: the late 17th-century back house from after the fire
    - nos. 107–108: pointed gable, good lower front, the clapboarded back wall with an 18th-century door
    - no. 110: a broadside house on a 17th-century frame, with nine-pane windows
    - no. 117: pointed gable, lower front and cornice, clapboarded side walls
    - nos. 123 and 124: 17th-century frames with pointed gables
    - no. 126: 17th-century frame
