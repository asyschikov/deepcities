  nl:
    title: De Kapel, voormalig raadhuis van Durgerdam
    summary: "Het herkenningsteken van Durgerdam: een vierkant houten gebouw onder een tentdak met een koepeltorentje, herbouwd in 1687 na de dorpsbrand. Iedereen noemt het de Kapel, maar het was raadhuis, school en visafslag."
    body: |
      Durgerdam noemt het de Kapel, maar het gebouw is juist bekend om alles behalve kerkdiensten. Halverwege de dijk staat een vierkant houten gebouw onder een tentdak, met daarop een houten torentje met koepeldak en uurwerk. Een gevelsteen dateert het op 1687, het jaar waarin een brand door het dorp trok. Het was het raadhuis van het dorp en de dorpsschool, en op een foto uit 1922 staat het als visafslag van het vissersdorp. Rond 1900 stond het achter de scheepswerf van Cornelis Kleijn. Die had een lange helling langs de dijk voor tjalken en nog twee voor botters.

      De klok in het torentje werd eind 1689 gegoten door de Amsterdamse klokkengieter Gerard Koster en, net als de herbouw, betaald uit een loterij van 1687. Hij ontsnapte ternauwernood: op 13 januari 1943 haalden de Duitsers hem weg om te laten omsmelten. Na de oorlog dook hij op in Groningen, en na een kleine reparatie hing hij weer in de toren.

      Het geraamte is van hout, net als bij de huizen eromheen, en de voorkant heeft een empiredeur met snijraam. In 1951 werd het gebouw gerestaureerd en in 2012 volgde een ontwerpvergunning voor een nieuwe restauratie. Het is nu een woonhuis, dus bekijk het vanaf de dijk.

      Let op:
      - het houten koepeltorentje met wijzerplaat en de klok van 1689
      - de gevelsteen met het jaartal 1687
      - de empiredeur met snijraam en de ramen met kleine ruitjes
      - het zicht op de Kapel vanaf de waterkant
    attributes:
      original_use: Raadhuis, later school en visafslag
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/6648
      - https://nl.wikipedia.org/wiki/Durgerdam
      - https://beeldarchief.hcan.nl/landelijk_noord/ca-1900-de-werf-aan-het-oosteinde-met-daarachter-de-kapel/
      - https://onsamsterdam.nl/artikelen/getuigen-van-bewogen-dorpsgeschiedenis

- title: Dorpskerk Durgerdam
  summary: A small white church of 1840 tucked below the dike, built from the bricks of its storm-wrecked predecessor of 1642, with that church's pulpit, brass chandeliers and a bell by Pieter Hemony of 1672.
  body: |
    The church does not stand on the dike like the rest of the village but a little lower, behind it, with its churchyard around it. A first church was built here in 1642. Storms, and above all the flood of 1825, damaged it so badly that the church council decided on a new one: the present *waterstaatskerk* of 1840, one of the plain churches built under the state's supervision in those years. It is smaller than the old church and was built with many of its bricks.

    A lot came along from the old church: the oak pulpit of 1646 with ebony knobs and a brass baptismal bowl, the 17th-century oak baptismal screen (shortened to fit the narrower nave), three brass chandeliers bought in 1666 and 1667, and the bell cast by Pieter Hemony in 1672. That bell came through the war thanks to a piece of paper: on 20 April 1940 the government's inspector of art protection, Jan Kalf, had a notice hung beside it in Dutch, German, French and English declaring it a historic monument exempt from requisition, and a large M (for monument) was put on the bell. It was spared. A memorial recalls Gerrit Frederickszoon, one of the captains in the Battle of the Downs in 1639. The cabinet organ by Jan Jacob Vool of about 1815 came here from Drunen, where it stood from 1923 to 1991. The churchyard has been a public cemetery since 1829 and is kept for people with a tie to Durgerdam. The church's community belongs to the Protestant Church in the Netherlands.

    Look for:
    - the white plastered front with two buttresses
    - the square roof turret that holds the Hemony bell
    - the side walls divided by pilaster strips
    - the churchyard around the church
