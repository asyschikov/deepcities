  nl:
    title: IJdoornlaanbrug, de 'Brug der Zuchten'
    summary: Een ophaalbrug die scheef over het Noordhollandsch Kanaal ligt, waardoor brugdek, hameipoort en contragewicht allemaal asymmetrisch zijn. Na acht jaar bouwen en gedoe over fouten ging hij in 1983 open, als Brug der Zuchten. Het brugwachtershuisje is nu een hotelkamer.
    body: |
      Brug 970 brengt de IJdoornlaan over het Noordhollandsch Kanaal, tussen het BovenIJ Ziekenhuis en Elzenhagen. Het is de laatste grote beweegbare brug van Dirk Sterenberg (1921–1996), de vaste architect van de afdeling Bruggen van Publieke Werken, die bij minstens 173 Amsterdamse bruggen betrokken was, meer dan wie ook na de oorlog. Zijn definitieve ontwerp lag er in de zomer van 1975.

      Het bijzondere is de hoek. De weg kruist het kanaal onder 68 graden, en in plaats van de weg om te leggen betaalde de gemeente liever een ingewikkelder brug. Het val is daardoor een parallellogram, de pijlers staan verspringend (de westelijke zo'n 26 meter noordelijker dan de oostelijke) en de hameipoort, het kleine contragewicht en de rode hameipriemen hangen maar aan één kant. Erfgoedvereniging Heemschut noemt de brug anders dan alle andere beweegbare bruggen in Amsterdam en het hoogtepunt in Sterenbergs werk. Ook de kleuren zijn bewust gekozen: blauwe leuningen, rode priemen, een gele balk op bruinzwarte hameistijlen.

      De bouw begon in 1975 en zou in 1978 klaar zijn. In 1981 moesten eerst nog fouten in ontwerp of constructie worden hersteld, en Het Parool sprak van de Brug der Zuchten. Op 18 september 1983 ging de brug open; gemeente en constructeur beschuldigden elkaar tot 1986 voor de rechter, en de kosten liepen op tot 22 miljoen gulden.

      Het brugwachtershuisje staat op de oostelijke middenpijler, ook met een parallellogram als plattegrond en lange panoramavensters. De bruggen worden nu centraal bediend, en het huisje is een hotelkamer van SWEETS geworden, met uitzicht over het kanaal op molen d'Admiraal. Steek over via de stoep: het is een drukke weg.

      Let op:
      - de verspringende betonnen pijlers met afgeschuinde hoeken, het best te zien vanaf de kanaaloevers
      - de eenzijdige hameipoort en het contragewicht boven de zuidelijke rijbaan
      - het parallellogramvormige brugwachtershuisje en de betonnen spiltrap aan de overkant
    attributes:
      architect: Dirk Sterenberg (Publieke Werken)
      original_use: Ophaalbrug met brugwachtershuisje
    sources:
      - https://arcam.nl/architectuur-gids/ijdoornlaanbrug/
      - https://nl.wikipedia.org/wiki/Brug_970

- title: Pontje Holysloot, the ring-the-bell ferry
  summary: Every road into Holysloot is a dead end, except when the little ferry runs. Ring the bell on the far bank and the ferryman comes out of his house. Four generations of one family ran it for a century; new neighbours took over in 2025.
  body: |
    Holysloot sits on the south bank of the Holysloter Die, a broad old creek. Across it an old farm path leads over meadows and plank bridges to the Poppendammergouw and on to Broek in Waterland and Zuiderwoude, and for over a hundred years a ferry has made that link. Villagers took it to church on Sundays and to the Broek market on Wednesdays; the doctor, the vet and the schoolmistress depended on it.

    Four generations of the Fockens family ran it from Dorpsstraat 6–8. Cornelis Fockens rowed people over for 2.5 cents and from 1925 got 250 guilders a year from Amsterdam. His son Willem and daughter-in-law Zwaantje rowed all year from seven in the morning to ten at night, until 1960, when the city refused to raise his grant from 2,000 to 3,000 guilders and he stopped. For years villagers faced a detour of at least eight kilometres. State forestry Staatsbosbeheer restarted it in the late 1960s on summer weekends only; a motorboat replaced the rowing boat in 1976, and the present steel ferry with its blue deck dates from 1994. In 1985 it went back to the family, and Bart John, Cornelis's great-grandson, was ferryman from the age of 16 in 1986. On 14 June 1991 he carried Queen Beatrix across and did not charge her the quarter.

    After forty years he retired, and in April 2025 his new neighbours at no. 6, Cees Smit and Mariëtte Wolf, took over for the Twiske-Waterland recreation board. They are restoring the old *overhaal* (ferry crossing) sign seen on a photo of 1922. About 8,000 people a year cross.

    It runs from April to the end of September, 9:00 to 17:00 on weekends and holidays and daily in July and August. In 2026 it cost 1 euro on foot and 2 euros with a bike; children and Stadspas holders go free. Pay by card if you can.

    Look for:
    - the bell on a rope at the landing across the water
    - the ferry house at Dorpsstraat 6 and its overhaal sign
    - the plank bridges and bike gutter on the meadow path beyond
  category: curiosities
  lat: 52.413936
  lng: 5.022095
  address: Dorpsstraat Holysloot 6 (ferry landing)
  links:
