  nl:
    title: Goudriaankanaal, het onvoltooide kanaal van de koning
    summary: Een lange, licht gebogen sloot door de weilanden boven Durgerdam is wat rest van een zeekanaal dat koning Willem I uit geheime fondsen liet graven toen de Kamer weigerde te betalen. Amsterdam bracht het in 1828 ten val met de ondiepte bij Marken.
    body: |
      In de jaren 1820 slibde de Amsterdamse haven dicht en bleven grote schepen steken op de ondiepte bij Pampus, voor de monding van het IJ. In 1823 won inspecteur-generaal van de Waterstaat A.F. Goudriaan een prijsvraag die op initiatief van de koning was uitgeschreven, met een gedurfd plan: het IJ afdammen tussen Durgerdam en Diemen en ten noorden van Pampus een brede nieuwe vaarweg graven, dwars door Waterland, de Gouwzee en het eiland Marken. Na de stormvloed van 1825, waarbij ook de dijk bij Durgerdam bezweek, gaf koning Willem I groen licht. In 1826 begon het graven.

      De Tweede Kamer zag het nut er niet van in en stemde de begroting bijna unaniem weg. De koning liet het werk toch beginnen, betaald uit zijn geheime fondsen zoals het Amortisatiesyndicaat, en toen in 1827 bleek hoeveel geld er al in zat, volgde een zware vertrouwenscrisis tussen koning en parlement. Amsterdam, dat niets moest hebben van een afgesloten IJ, deelde in januari 1828 de genadeslag uit: de gemeenteraad wees de koning erop dat de Zuiderzee bij de kanaalmond ten oosten van Marken maar 3,30 meter diep was, even ondiep als bij Pampus. De stad bood bovendien aan het Westerdok en Oosterdok aan te leggen, die de koning graag wilde. Op 10 maart 1828 legde een koninklijk besluit kanaal en dam stil.

      Op luchtfoto's is het tracé haarscherp te zien; in het landschap is het een lange sloot met een rietkraag geworden. Er loopt geen pad langs. Over de kanaaldijk werd later de Bloemendalergouw aangelegd, de eerste weg tussen Ransdorp en Holysloot, en vanaf die weg, vanaf de Durgerdammergouw en vanaf de Dorpsstraat in Holysloot kun je over het water kijken. Op Marken duikt dezelfde lijn weer op als de Zuidervaart en de Oostervaart.

      Let op:
      - de rechte sloot die naar het noordoosten loopt, los van de kronkelende sloten van de oude polder
      - de Bloemendalergouw ernaast, op de vroegere kanaaldijk
      - de rietkraag langs het water, het enige dat het kanaal in het weiland verraadt
    attributes:
      built: 1826–1828 (onvoltooid)
      original_use: Zeekanaal van het IJ naar de Zuiderzee via Marken
    sources:
      - https://nl.wikipedia.org/wiki/Goudriaankanaal
      - https://onsamsterdam.nl/artikelen/een-onzichtbaar-kanaal-door-landelijk-noord
      - https://holysloot.nl/verkeer-en-vervoer/
      - https://020apps.nl/mip/beschrijvingen/Wijk%2015%20Amsterdam.pdf

- title: IJdoornlaanbrug, the 'Bridge of Sighs'
  summary: A drawbridge that crosses the Noordhollandsch Kanaal at a slant, so its deck, portal and counterweight are all lopsided. It took eight years and a fight over design faults to open in 1983, earning it the name Brug der Zuchten. The bridge-keeper's house is now a hotel suite.
  body: |
    Bridge 970 carries the IJdoornlaan over the Noordhollandsch Kanaal between the BovenIJ hospital and Elzenhagen. It was the last big moving bridge of Dirk Sterenberg (1921–1996), the staff architect of the city's Public Works bridge department who had a hand in at least 173 Amsterdam bridges, more than anyone else after the war. He finished the design in the summer of 1975.

    What makes it odd is the angle. The road meets the canal at 68 degrees, and rather than bend the road, the city paid for a harder bridge. So the lifting deck is a parallelogram, the piers are staggered (the west one about 26 metres further north than the east one), and the portal, the small counterweight and the red lifting arms hang over one side only. The heritage society Heemschut calls it unlike any other moving bridge in Amsterdam and the high point of Sterenberg's work. The colours are deliberate too: blue railings, red lifting arms, a yellow beam on brown-black posts.

    Building began in 1975 and was meant to finish in 1978. By 1981 faults in the design or construction had to be put right first, and Het Parool dubbed it the *Brug der Zuchten* (Bridge of Sighs). It opened on 18 September 1983; the city and the builder blamed each other in court until 1986, and the bill rose to 22 million guilders.

    The bridge-keeper's house sits on the east middle pier, its plan a parallelogram too, with long panoramic windows. Bridges are now run from a central post, and the house has become a SWEETS hotel suite looking out over the canal towards the windmill d'Admiraal. Walk over on the pavement: the road is busy.

    Look for:
    - the staggered concrete piers with their bevelled corners, best seen from the canal banks
    - the one-sided portal and counterweight above the south lane
    - the parallelogram bridge-keeper's house and its outdoor spiral stair on the other side
  category: infrastructure
  lat: 52.404839
  lng: 4.925074
  address: IJdoornlaan over the Noordhollandsch Kanaal
  links:
