  nl:
    title: Termieterweg, de oude trambaan
    summary: "Een kaarsrecht fietspad door de weilanden ten noordwesten van Zunderdorp, dat pas in 1992 een naam kreeg. Het ligt op de baan van de Waterlandse tram, die tot 1956 van Amsterdam-Noord naar Edam en Volendam reed."
    body: |
      Vanaf 1888 reed de Waterlandse tram vanaf de noordoever van het IJ, waar een bootje de reizigers van het Centraal Station overzette, door de polders naar Broek in Waterland, Edam en Volendam, met een zijlijn naar Purmerend. Tot 1932 was het een stoomtram, daarna een elektrische. De gemeente zegde de erfpacht van het tramstation aan het IJ op, de steiger van het pontveer moest daarheen wijken voor de bouw van de IJtunnel, en op 30 september 1956 reed de laatste tram. De bus nam het over.

      Ten noorden van de Buikslotermeerdijk liet de tram weinig meer na dan zijn eigen lijn. Het fietspad dat erop ligt is de Termieterweg, pas in 1992 zo genoemd, liniaalrecht tussen de sloten. Waar het pad de Termietergouw kruist, op nummer 12, lag de halte Zunderdorp, al ligt het dorp zelf een halve kilometer oostelijker; het huidige gebouw daar is van 1996. Met termieten heeft de naam niets te maken: een *miede* is hooiland. Toch noemde de gemeente de weg in 1957 de Termietengouw, en pas in 1973 werd dat rechtgezet.

      Het pad begint bij een houten bruggetje over de ringvaart, rond 1985 gebouwd en in 2018 op voorstel van de Centrale Dorpenraad van Landelijk Noord Oude Tramwegbrug genoemd. De pin staat op die brug.

      Let op:
      - de witte houten leuningen van de brug, waar de tram vroeger de ringvaart overstak
      - de rechte lijn van het pad tussen de kronkelende gouwen eromheen
      - de kruising met de Termietergouw, waar de halte Zunderdorp lag
    attributes:
      built: tram 1888–1956; pad vernoemd 1992
      original_use: Tramlijn Amsterdam-Noord naar Edam en Volendam
    sources:
      - https://nl.wikipedia.org/wiki/Waterlandse_tram
      - https://nl.wikipedia.org/wiki/Termietergouw
      - https://nl.wikipedia.org/wiki/Oude_Tramwegbrug

- title: Adcock station, Durgerdammergouw
  summary: "A small brick hut in a meadow near Ransdorp. It was probably a German radio direction-finding station, and in August 1944 the resistance counted its masts and guessed it was a beacon for Schiphol."
  body: |
    In the meadow just east of the Durgerdammergouw, the road from Durgerdam to Ransdorp, stands a low brick building. During the occupation it was most likely an Adcock station: a hut in the middle of a square plot, with an upright aerial at each corner. Comparing the signal on the aerials gives the bearing of a radio transmitter, and the Germans used such stations to guide and track aircraft. This one was possibly linked to the seaplane base at Schellingwoude, a few kilometres south-west.

    On 20 August 1944 the resistance group Albrecht reported on it: five radio masts, but no aerial wires, and a single *Wachmann* standing guard. Someone added by hand: "Beacon Schiphol airfield?" By September 1944 the station was probably no longer in use. The masts are gone; the hut stayed, alone in the polder meadow.

    It stands in the meadow and can be seen from the Durgerdammergouw, about 150 metres away.

    Look for:
    - a small brick building on its own in the meadow, away from the farmyards
    - the square plot around it where the four aerials stood
  category: hidden-history
  lat: 52.390151
  lng: 5.003470
