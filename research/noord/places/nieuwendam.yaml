  nl:
    title: Nieuwendammerkerk
    summary: "De dorpskerk van Nieuwendam uit 1849, iets van de dijk af tussen haar eigen graven. Met een houten kapconstructie in Engelse 'hammerbeam'-trant, een klok uit 1644 en het enige kerkorgel dat Hoffmeijer ooit bouwde."
    body: |
      Orgelbouwer J. Hoffmeijer maakte in zijn leven precies één kerkorgel, en dat staat hier: twee klavieren, opgeleverd in 1849 en in 2009-2010 teruggebracht naar die oorspronkelijke staat.

      De kerk staat niet op de Nieuwendammerdijk maar wat lager, aan het eind van het Brede Kerkepad, met het kerkhof eromheen. Nieuwendam kreeg in 1635 een eigen gemeente, en in 1643 werd er een stuk grond geschonken voor een kerk en een begraafplaats. Die eerste kerk, van 1644, was in 1847 zo bouwvallig dat ze tegen de vlakte ging. Voor de hervormde gemeente verrees in 1848-1849 deze zaalkerk, die op 18 februari 1849 openging. Het dorpsbestuur legde 3000 gulden bij voor de toren. De letters op de eerste steen zijn van de zoon van de dominee, die hem legde.

      Het gebouw is sober en eclectisch, van gele IJsselsteen en rode baksteen. Op de vierkante toren staat een achtkantige spits met leien en een gesmede ijzeren bekroning. Binnen draagt een houten kap het dak, verwant aan het Engelse hammerbeamtype. Uit de oude kerk kwamen de grafzerken mee, de eiken preekstoel uit de zeventiende eeuw met gesneden figuren van de deugden, en de torenklok, in 1644 in Kampen gegoten. Een steen in de kerk wijst aan hoe hoog het water stond bij de overstroming van 1916. De kerk is nog in gebruik, en in 2022-2023 knapte de gemeente de toren op.

      Let op:
      - de eerste steen met de initialen
      - het ijzeren hek op een gemetselde voet rond het kerkhof
      - de oude grafstenen op het kerkhof
      - de vier wijzerplaten in het smallere bovenste deel van de toren
    attributes:
      architect: G. Bronke en L.J. Immink
      original_use: Hervormde kerk met kerkhof
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/508536
      - https://nl.wikipedia.org/wiki/Nieuwendammerkerk

- title: Wooden houses, Brede Kerkepad
  summary: "Two wooden houses on the path down to the village church, one hiding a 17th-century timber frame and one with a brick front dated 1768."
  body: |
    Two wooden houses line the Brede Kerkepad, the path that runs down from the Nieuwendammerdijk to the Nieuwendammerkerk. In Nieuwendam people built wooden houses along the dike, and these two are listed national monuments.

    Brede Kerkepad 1 is a wooden house on an L-shaped plan that was given a brick front in 1768, with a door surround and a cornice over the ground floor; its bell-shaped gable top is a reconstruction. This ensemble is pinned on it. Brede Kerkepad 6, near the church, has a 17th-century timber frame: a sturdy front part and a long, low back house. Its outside dates from the early 19th century, with an outward and inward curving front gable, a carved cornice, door surround, door and fanlight, and clapboarded side walls.

    On the path itself, the former health clinic at Purmerweg 46 (Brede Kerkepad 5), designed by Henk 't Hoen of Public Works and finished in 1968, carries a tile mosaic of that year by Lex Horn, one of the most important monumental artists. Rectangular tiles in white, greys and black seem abstract, but seen from a distance they become two seated, waiting people, a nod to the GGD clinic inside. The city rates it "top", its highest grade, partly because some of Horn's work has been demolished. A second mosaic is inside. The building now houses a neighbourhood second-hand shop.

    Look for:
    - Purmerweg 46: Lex Horn's tile mosaic on the canopy over the front
    - Brede Kerkepad 1: the date 1768 in the brick front and the bell gable
    - Brede Kerkepad 1: the L-shaped wooden house behind the stone front
    - Brede Kerkepad 6: the curving wooden front gable and carved cornice
    - Brede Kerkepad 6: the door with its fanlight
    - Brede Kerkepad 6: the overlapping weatherboards on the side walls and the long, low back house
