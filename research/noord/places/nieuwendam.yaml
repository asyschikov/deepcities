    summary: "Een klein eiland van 56 huisjes voor ouderen, in 1931-1933 door de gemeente gebouwd rond een groen plein, met poorten naar de gezamenlijke tuinen en een gemetselde bank in een van de poortgebouwen."
    body: |
      In een van de poortgebouwen kun je gaan zitten: tussen Monnikendammerplantsoen 13-20 en Oosthuizenstraat 2-18 is een bakstenen bank met een stenen blad in de muur gemetseld.

      In 1931 voegde de Gemeentelijke Woningdienst iets nieuws toe aan Tuindorp Nieuwendam: een compleet buurtje voor ouderen. J.H. Mulder ontwierp zeven lage blokken met samen 56 woningen van één laag met een kamer onder het dak, die een heel eiland van het tuindorp beslaan. Drie blokken staan in een hoefijzer rond het Monnikendammerplantsoen, de andere langs de rechte straten eromheen. De eerste zes blokken werden in 1931 opgeleverd, het oostelijkste in 1933.

      De voordeuren zitten steeds per twee in een klein vooruitspringend portaal onder een eigen schilddakje, en elke woning heeft een breed raam met zij- en bovenlichten. Poortgebouwen tussen de blokken leiden naar de achtertuinen en geven de zuidkant het gevoel van een besloten hofje, terwijl het plein zelf open blijft. Het rijksmonumentenregister waardeert het complex als stukje tuinstad en als stap in de ontwikkeling van de bejaardenwoning. De speld staat op het middelste blok van het hoefijzer, Monnikendammerplantsoen 21-28.

      Let op:
      - Monnikendammerplantsoen 21-28: het midden van het hoefijzer
      - de voordeuren per twee onder kleine schilddakjes
      - het poortgebouw bij Monnikendammerplantsoen 13: de ingebouwde bank en de dichtgezette halfronde ramen
      - Volendammerweg 10-24: de groen geschilderde houten gevelpunt en de getoogde poort met een halfrond ijzeren raam
      - aan de Volendammerweg achter Monnikendammerplantsoen 21-28: de muur met hek die de achtertuinen van dat blok afschermt
      - Monnikendammerplantsoen 37-45: het blok van 1933
    attributes:
      original_use: Bejaardenwoningen
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/complexen/508382
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/508387
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/508383

- title: Boterenbrood's village, Ilpendammerstraat
  summary: "Jan Boterenbrood's corner of Tuindorp Nieuwendam, a scatter of brick blocks under big red roofs that feels like an old Holland village, with a U-shaped court of old people's houses where recesses in the fronts hold timber benches."
  body: |
    Jan Boterenbrood (1886–1932) was an Amsterdam School architect on the editorial board of the magazine Wendingen, best known for Huize Lydia in Amsterdam. In 1926–1927 he built this wedge of Tuindorp Nieuwendam, between the Purmerweg, the Nieuwendammerstraat and the Watergangseweg, at the same time as the other architects of the garden village.

    Instead of closed blocks around inner courts, as in the older garden villages in the south of Noord, the houses stand loose in gardens and along small greens, so you also see their backs. Mansard roofs, hipped roofs and saddle roofs alternate; there are round-arched porches, French balconies, timber gables cutting into the roof, and small brick sheds dotted between the houses. The register calls the effect almost Old Dutch: plain brick and closed red roofs that echo the rural houses on the dike, with Amsterdam School proportions.

    At the eastern tip, along Ilpendammerstraat, single-storey houses for the elderly are grouped around a U-shaped court, an echo of the almshouse courts (hofjes) of Dutch towns. Recesses in the fronts, by the entrances, hold wooden benches, and in the angled corners a round-arched passage leads to the back gardens. This place is pinned on that court.

    Look for:
    - Ilpendammerstraat: the old people's court with its bench recesses
    - the round-arched passage in a corner of the court
    - mansard roofs alternating with saddle and hipped roofs
    - timber-clad bays with a gable, breaking through the eaves
    - small porch extensions with round-arched doors on the ends of blocks
    - Middeliestraat 1-8 and Edammerstraat 2-12: the blocks along the edge that screen the village
  category: housing
