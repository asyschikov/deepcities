  nl:
    title: Purmerplein en de poortgebouwen aan de Purmerweg
    summary: "Het dorpsplein van Tuindorp Nieuwendam: een ovaal van winkels onder één lange luifel, bewaakt door acht poortgebouwen van hout en baksteen waar je zo onderdoor loopt of fietst. Tuinstad-Amsterdamse School op zijn landelijkst."
    body: |
      Aan de Purmerweg fiets je zo onder een huis door. Acht poortgebouwen staan elk over de monding van een zijstraat: een hoge doorgang voor het verkeer op bundels van vier zware houten palen op stenen voeten, aan weerskanten een lager voetpad, links en rechts een winkelruit, en daarboven balkons en wit geschilderd beschot. De Avenhornstraat, Wijdenesserstraat en Oudorperstraat hebben het gewone type. De Beemsterstraat, een doorgaande noord-zuidroute, kreeg een bredere versie met een extra steunpunt in het midden.

      Nieuwendam ging in 1921 op in Amsterdam. De watersnood van 1916 had het bouwen hier stilgelegd, en de stad begon nu aan de lege polder ten noorden van het oude dijkdorp. Berend Boeyinga van de Gemeentelijke Woningdienst tekende het plan: één weg van west naar oost, de Purmerweg, die halverwege uitdijt tot het ovale Purmerplein, met korte zijstraten en lage huizen erachter. Tuindorp Nieuwendam gold als een van de mooiste tuindorpen van Amsterdam, en het hart ervan ontwierp Boeyinga zelf. Het was de tweede poging. Vanaf 1915 bouwde de plaatselijke woningbouwvereniging Nieuwendams Belang aan een plan van Eduard Cuypers voor 179 kleine huizen, de meeste voor bootwerkers van de Hollandsche Stoomboot Maatschappij. De watersnood maakte daar na 56 huizen een eind aan, Amsterdam gaf de rest van de grond aan Boeyinga, en de Cuypers-huizen aan de Nieuwendammerstraat maakten in 1979 plaats voor nieuwbouw.

      Rond het plein staan zes blokken winkels met woningen erboven, drie aan de noordkant en drie aan de zuidkant, volmaakt symmetrisch: 34 winkels in zes vaste plattegronden. Een doorlopende luifel houdt het winkelend publiek droog, en erkers op de hoeken laten de korte blokken op poorten lijken. Midden op het plein lag een tuin met een prieel; het prieel is weg, het gras is gebleven. In 2015 kwam er de bronzen Visvrouw van Karin Beek bij, een herinnering aan de tijd dat Noord van het water leefde. De speld staat op het middelste noordblok, Purmerplein 15-19.

      Let op:
      - Purmerplein 15-19 en 16-20: de korte blokken met aan beide kanten een erker, die poort spelen
      - de lange luifel die ononderbroken langs de winkelpuien loopt
      - Beemsterstraat 33-36 / Purmerweg 92: het brede poortgebouw met de extra middenpaal
      - Avenhornstraat 17-18 / Purmerweg 86: een gewoon poortgebouw, met de houten palen van dichtbij
      - Oudorperstraat 17-18 en Wijdenesserstraat 17-18: hetzelfde ontwerp verderop herhaald
      - de bronzen Visvrouw op het plein
    attributes:
      original_use: Winkels met bovenwoningen, poortgebouwen met winkels en woningen
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/complexen/508390
      - https://nl.wikipedia.org/wiki/Purmerplein
      - https://nl.wikipedia.org/wiki/Tuindorp_Nieuwendam
      - https://nl.wikipedia.org/wiki/Bouwvereeniging_Nieuwendams_Belang

- title: Kitchen houses north of the Purmerweg
  summary: Rows of low cottages with the kitchen at the front, by J.H. Mulder, tucked behind Boeyinga's gatehouses. Steep tiled roofs swoop down to the front doors, and side gables end in a wavy timber band.
  body: |
    Behind each gatehouse on the Purmerweg lies a short side street of so-called kitchen houses (keukenwoningen), designed by J.H. Mulder for the municipal housing department as part of the first phase of Tuindorp Nieuwendam. The kitchen sat at the front, behind a row of linked windows between the front doors. Each house has a ground floor and a room in the roof; the roof on the street side is pulled down so low that windows and doors sit right under the gutter. The small window beside each front door was the toilet.

    The blocks were built with as much rationalised method as traditional brick and tile allowed, and they are joined to the gatehouses by low brick links, so that from the Purmerweg each side street reads as a half-open court. North of the road the side streets end at the Edammerstraat, where five shorter blocks close the courts. This ensemble covers the northern half; it is pinned on Beemsterstraat 41-55, beside the wide Beemsterstraat gatehouse.

    A short walk west, the former school at Schermerstraat 3-19 (1924-1925) carries figures by Hildo Krop. On the gate pier Saint George fights not a dragon but a snake: on this socialist Amsterdam School building the saint defeats capitalism, not the infidel. On the facade sit a flute-playing faun with frogs and a small snake's head. Further north, at the Molengouw, the post-war blocks of 1949 got small figurative gable stones: Wim van Hoorn's reclining woman with a sash reading VREDE (peace) in front of a little house, unveiled on 30 December 1949 and also counted as a war memorial, and four reliefs by Ben Guntenaar, from before he turned to abstract work.

    Look for:
    - Schermerstraat 15: Krop's Saint George with the snake on the gate pier, and the faun beside it
    - Schermerstraat 47: Van Hoorn's VREDE stone; his second stone at Andijkstraat 1-2
    - Hoornsestraat 58-59 and Nibbixwoudstraat 9-10: Guntenaar's four gable stones
    - Beemsterstraat 41-55 and 44-58: the full eight-house blocks, roofs dropping to the doors
    - Avenhornstraat 25-39: the low brick link to the gatehouse at the Purmerweg end
    - Wijdenesserstraat 25-39 and Oudorperstraat 25-39: the four broad dormers in each roof
    - the side gables: a wooden band with a wavy edge and dark boarding above
    - Edammerstraat 14-16: the shortest block of the group, just two houses
    - Edammerstraat 26-32 and 42-48: the blocks that close the courts on the north side
