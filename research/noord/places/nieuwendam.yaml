  nl:
    title: Keukenwoningen ten noorden van de Purmerweg
    summary: Reeksen eengezinswoningen met de keuken aan de voorzijde, naar ontwerp van J.H. Mulder, achter de poortgebouwen van Boeyinga. Het dakschild loopt laag door tot boven de voordeuren.
    body: |
      De zogenaamde keukenwoningen ontworpen door de architect J.H. Mulder bevinden zich achter de poortwoningen, aan de haaks op de Purmerweg gelegen zijstraten, alsmede aan de verbindende Edammerstraat. Het geheel maakte destijds deel uit van Groep M van het bebouwingsplan Nieuwendam I. Bij de bouw, uitgevoerd in baksteen en hout met hoge pangedekte kappen, is zoveel mogelijk gebruik gemaakt van gerationaliseerde methoden.

      Het zijn vrijstaande bouwblokken met een begane grond en een kapverdieping onder een met pannen gedekt zadeldak. Het dakschild aan de straatzijde loopt lager door; vensters en toegangen zitten hierdoor onmiddellijk onder de gootlijst. Tussen de toegangspartijen liggen teruggezette geveldelen met in serie gekoppelde vensters; hierachter de keuken. Het kleine venster naast de toegangspartij was oorspronkelijk het venster van het toilet. Het bouwblok is middels eenvoudige gemetselde laagbouw verbonden met de poortwoningen aan de Purmerweg. Beschouwd vanaf de Purmerweg ontstaan zo halfopen of U-vormige hoven. De speld staat op Beemsterstraat 41-55, naast het brede poortgebouw.

      Let op:
      - Beemsterstraat 41-55 en 44-58: blokken van acht keukenwoningen
      - Avenhornstraat 25-39: de gemetselde laagbouw die het blok met de poortwoning verbindt
      - Wijdenesserstraat 25-39 en Oudorperstraat 25-39: een viertal brede dakkapellen met in serie geplaatste vensters
      - de zijgevels: een houten cordonlijst met golflijn, met daarboven donkere rabatdelen
      - Edammerstraat 14-16: het blok aan de westzijde van de Edammerstraat, met slechts twee keukenwoningen
      - Edammerstraat 26-32 en 42-48: afsluitende blokken van vier keukenwoningen
    attributes:
      original_use: Arbeiderswoningen
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/complexen/508390
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/508428

- title: Kitchen houses south of the Purmerweg
  summary: The southern half of Mulder's kitchen-house streets, closed off by a string of short blocks on the Wognumerstraat. Each side street turns into a half-open court framed by a gatehouse.
  body: |
    South of the Purmerweg the pattern of Tuindorp Nieuwendam repeats: a gatehouse on the main road, a short side street of J.H. Mulder's kitchen houses (keukenwoningen) behind it, and a row of shorter blocks on the parallel Wognumerstraat that closes the end. Seen from the Purmerweg, each street becomes a half-open, U-shaped court. The houses have the kitchen at the front behind linked windows, a toilet window beside the door, the living room and garden at the back, and a deep tiled roof that comes down almost to head height.

    The early residents were not the poorest Amsterdammers: rents here were somewhat higher than in other garden villages, and the houses were larger and better insulated. Many were civil servants, teachers and nurses. Most homes are still social rented housing. This ensemble is pinned on Avenhornstraat 1-15, the first block behind the Avenhornstraat gatehouse.

    Look for:
    - Avenhornstraat 1-15 and 2-16: the blocks closest to the square, with the brick link to the gatehouse
    - Beemsterstraat 17-31 and 20-34: the court behind the wide Beemsterstraat gate
    - Oudorperstraat 1-15 and 2-16: the court behind the westernmost gatehouse
    - Wijdenesserstraat 1-15: the deep roof and dormers seen end-on
    - Wognumerstraat 56-62 and 64-70: short blocks of four that close the courts
    - Wognumerstraat 104-114: the westernmost block, linking to the shops of the Purmerplein
