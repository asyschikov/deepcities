  nl:
    title: Keukenwoningen ten noorden van de Purmerweg
    summary: "Rijtjes lage huizen met de keuken aan de voorkant, door J.H. Mulder, verstopt achter de poortgebouwen van Boeyinga. Steile pannendaken zakken tot vlak boven de voordeuren, en de zijgevels eindigen in een houten band met een golfrand."
    body: |
      Wie hier langsloopt, loopt langs de keukens. In deze keukenwoningen lag de keuken aan de voorkant, achter een rij gekoppelde ramen tussen de voordeuren. J.H. Mulder ontwierp ze voor de Gemeentelijke Woningdienst, als deel van de eerste fase van Tuindorp Nieuwendam. Achter elk poortgebouw aan de Purmerweg ligt zo'n kort zijstraatje vol. Elk huis heeft een benedenverdieping en een kamer in de kap, en aan de straatkant is het dak zo ver omlaag getrokken dat ramen en deuren pal onder de goot zitten. Het raampje naast elke voordeur hoorde bij de wc.

      De bouw was zo rationeel als baksteen en dakpan toelieten. Lage bakstenen tussenstukken koppelen de blokken aan de poortgebouwen, zodat elk zijstraatje vanaf de Purmerweg een half open hof lijkt. Ten noorden van de weg lopen de straatjes dood op de Edammerstraat, waar vijf kortere blokken de hoven dichtmaken. Dit ensemble is de noordelijke helft; de speld staat op Beemsterstraat 41-55, naast het brede poortgebouw van de Beemsterstraat.

      Een stukje naar het westen staat de voormalige school Schermerstraat 3-19 (1924-1925), met beeldhouwwerk van Hildo Krop. Op de hekpijler vecht Sint-Joris niet tegen een draak maar tegen een slang: op dit socialistische gebouw in Amsterdamse Schoolstijl overwint de heilige het kapitalisme, niet de ongelovige. Op de gevel zitten een faun die fluit speelt, met kikkers, en een kleine slangenkop. Noordelijker, bij de Molengouw, kregen de naoorlogse blokken van 1949 kleine figuratieve gevelstenen. Wim van Hoorn maakte een liggende vrouw voor een huisje, met een lint waarop VREDE staat; die steen werd op 30 december 1949 onthuld en telt ook als oorlogsmonument. Ben Guntenaar maakte er vier reliëfs, nog voordat hij abstract ging werken.

      Let op:
      - Schermerstraat 15: Krops Sint-Joris met de slang op de hekpijler, en de faun ernaast
      - Schermerstraat 47: de VREDE-steen van Van Hoorn; zijn tweede steen zit op Andijkstraat 1-2
      - Hoornsestraat 58-59 en Nibbixwoudstraat 9-10: de vier gevelstenen van Guntenaar
      - Beemsterstraat 41-55 en 44-58: de complete blokken van acht huizen, met daken die tot op de deuren zakken
      - Avenhornstraat 25-39: het lage bakstenen tussenstuk naar het poortgebouw aan de kant van de Purmerweg
      - Wijdenesserstraat 25-39 en Oudorperstraat 25-39: de vier brede dakkapellen in elk dak
      - de zijgevels: een houten band met golvende rand en donkere beschieting erboven
      - Edammerstraat 14-16: het kortste blok van de groep, maar twee huizen
      - Edammerstraat 26-32 en 42-48: de blokken die de hoven aan de noordkant afsluiten
    attributes:
      original_use: Arbeiderswoningen
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/complexen/508390
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/508428
      - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/378
      - https://www.4en5mei.nl/oorlogsmonumenten/zoeken/1477/amsterdam-monument-aan-de-schermerstraat

- title: Kitchen houses south of the Purmerweg
  summary: Low cottages with the kitchen at the street and the living room on the garden, by J.H. Mulder. South of the Purmerweg each side street ends at short blocks on the Wognumerstraat, so it reads as a half-open court behind its gatehouse.
  body: |
    The name tells you what is odd about them. In the kitchen houses (keukenwoningen) that J.H. Mulder designed for the city's housing department in 1923–1927, the kitchen sits at the front, behind a band of linked windows between the front doors; the small window beside each door was the toilet. The living room is at the back, on the garden. On the street side the tiled roof is pulled down so low that doors and windows sit right under the gutter, which makes the rows look like country cottages.

    For workers' housing they were very modern: the houses had a bathroom. The Woningdienst let and managed every home in the garden village; today housing association Ymere still lets most of them as social housing, and a few have been sold.

    South of the Purmerweg each side street runs from one of B.T. Boeyinga's gatehouses to the Wognumerstraat, where short blocks close it off, so that from the main road every street reads as a half-open court. North of the Purmerweg the pattern repeats.

    Look for:
    - the roofs dropping to the front doors, as at Wijdenesserstraat 1-15
    - the low brick link between Avenhornstraat 1-15 and its gatehouse
    - the short closing blocks on the Wognumerstraat
