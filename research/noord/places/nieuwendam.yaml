  nl:
    title: Voormalige school, Wognumerplantsoen
    summary: "Een dubbele school uit 1925 van gestapelde bakstenen blokken, die op en neer springen, met uitstekende luifels en schoorstenen met stenen kap boven de ingangen. Hij steekt af tegen het tuindorp met schuine daken eromheen."
    body: |
      In de zuidoostpunt van Tuindorp Nieuwendam heeft alles een steil pannendak, behalve dit: een plat afgedekt gebouw van opgestapelde bakstenen dozen. Het kwam er in 1925–1926 als dubbele christelijke lagere school, naar tekeningen van Publieke Werken, in een kubistisch-expressionistische trant. Plaatselijke gidsen zien er ook de invloed in van de Amerikaanse architect Lloyd Wright. Een lang, lager middendeel ligt tussen twee rechtopstaande dwarsvleugels van ongelijke hoogte, waarin de twee ingangen zitten. Boven elke ingang steekt een bakstenen schoorsteen met een stenen luifel op, en ook andere bouwdelen hebben scherp uitstekende luifels.

      De lokalen kijken naar achteren, naar het zuiden, met regelmatige ramen van negen ruitjes. Trappen en gangen liggen aan de straatkant, op de verdieping verlicht door een lint van kleine ramen in Amsterdamse Schoolstijl. Later kregen de twee helften elk een ander leven: toen het gebouw in 1997 monument werd, oefende in de ene helft een drumband en zat in de andere een vakschool voor slagers, daar sinds 1979. Nu is het weer een school, de Vrije School Kairos.

      Let op:
      - de twee ingangsvleugels met hun schoorstenen met stenen luifel
      - het lint van kleine ramen op de verdieping van het middendeel
      - de rij van vijf hoge gekoppelde ramen op de begane grond
      - het smalle, ladderachtige raam in de westelijke kopgevel
      - het siermetselwerk op de hoeken
    attributes:
      architect: Publieke Werken
      original_use: Christelijke lagere school
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/508535
      - https://nl.wikipedia.org/wiki/Tuindorp_Nieuwendam

- title: Nieuwendammerkerk
  summary: Nieuwendam's village church of 1849, set back from the dike in its own churchyard, with a hammerbeam-style timber roof, a bell cast in 1644 and the only church organ Hoffmeijer ever built.
  body: |
    The church does not stand on the Nieuwendammerdijk but a little below it, at the end of the Brede Kerkepad (broad church path), surrounded by its graveyard. Nieuwendam got its own congregation in 1635, and in 1643 a plot was donated to build a church and lay out a burial ground. That first church of 1644 had become unsafe by 1847 and was pulled down; the present hall church was built in 1848–1849 for the Reformed congregation, opening on 18 February 1849. The village council paid 3,000 guilders towards the tower. The initials on the foundation stone are those of the minister's son, who laid it.

    It is a sober eclectic building in yellow IJssel brick and red brick, with a square tower carrying a slate-covered octagonal spire and a wrought-iron finial. Inside, the roof rests on timber trusses related to the English hammerbeam type. The tombstones came from the old church, as did the 17th-century oak pulpit, carved with figures of the virtues, and the bell in the tower, cast in Kampen in 1644. The two-manual organ was made in 1849 by J. Hoffmeijer, his only church organ, and was restored to its original state in 2009–2010. A stone inside marks how high the water rose in the flood of 1916. The church is still in use, and the city restored the tower in 2022–2023.

    Look for:
    - the foundation stone with the initials
    - the iron railing on a brick base around the churchyard
    - old gravestones in the churchyard
    - the four clock faces in the narrow upper stage of the tower
