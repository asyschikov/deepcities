  nl:
    title: Boterenbroodcomplex, Ilpendammerstraat
    summary: "Jan Boterenbrood maakte van zijn hoek van Tuindorp Nieuwendam een dorpje: losse bakstenen blokken onder grote rode daken, bijna Oudhollands. Aan de punt staan bejaardenwoningen om een hofje in U-vorm, met houten zitbanken in nissen in de gevel."
    body: |
      Wie de Ilpendammerstraat in loopt, staat ineens op een hofje. Lage bejaardenhuisjes van één verdieping liggen in een U om een binnenplein, een knipoog naar de hofjes van de Hollandse steden. Naast de voordeuren springen de gevels terug, en in die nissen staan houten zitbanken. In de schuine hoeken van de U leidt een doorgang met een ronde boog naar de achtertuinen.

      Het hofje is de oostpunt van een wig die Jan Boterenbrood (1886-1932) in 1926-1927 bouwde, tegelijk met de andere architecten van Tuindorp Nieuwendam. Hij hoorde bij de Amsterdamse School, zat in de redactie van het tijdschrift Wendingen en is vooral bekend van Huize Lydia in Amsterdam. Zijn stuk ligt tussen de Purmerweg, de Nieuwendammerstraat en de Watergangseweg.

      Het opvallende is hoe open het is. In de oudere tuindorpen in het zuiden van Noord staan de blokken dicht om een binnenterrein. Hier staan ze los in tuinen en aan plantsoentjes, zodat je ook de achterkanten ziet. Mansardedaken, schilddaken en zadeldaken wisselen elkaar af, met deuren onder rondbogen, Franse balkons, houten topgevels die door het dak steken en hier en daar een bakstenen schuurtje. Het monumentenregister noemt het effect welhaast Oudhollands: sobere baksteen en dichte rode daken, net als de landelijke huizen op de dijk, maar met de maten van de Amsterdamse School.

      Let op:
      - het bejaardenhofje aan de Ilpendammerstraat, met zijn banknissen
      - de rondboogdoorgang in een hoek van het hofje
      - mansardedaken naast zadel- en schilddaken
      - houten erkers met een topgevel die door de dakrand breken
      - kleine portaaltjes met rondboogdeuren aan de kop van de blokken
      - Middeliestraat 1-8 en Edammerstraat 2-12: de randblokken die het dorpje afschermen
    attributes:
      original_use: Eengezinswoningen en bejaardenwoningen
    sources:
      - https://data.amsterdam.nl/monumenten/d89b76c4-d741-478b-8934-fd5267ed2676

- title: Former school, Wognumerplantsoen
  summary: "A 1925 double school in brick cubes, stepping up and down with jutting canopies and stone-capped chimneys over the entrances. It stands apart from the pitched-roof garden village around it."
  body: |
    In the south-eastern tip of Tuindorp Nieuwendam, where everything else wears a steep tiled roof, stands a flat-roofed building made of stacked brick boxes. It was built in 1925–1926 as a double Christian primary school, to drawings from the municipal Public Works department (Publieke Werken), in a cubist-expressionist manner; local guides also see the influence of the American architect Lloyd Wright. A long, lower middle section runs between two upright cross wings of different heights, where the two entrances are. Above each entrance rises a brick chimney with a stone canopy, and other volumes carry sharply projecting canopies too.

    The classrooms face the back (south) with regular nine-pane windows; the stairs and corridors are on the street side, lit by a ribbon of small Amsterdam School windows on the upper floor. Later the two halves had other lives: when the building was listed in 1997, a drum band rehearsed in one and a butchers' training school, there since 1979, used the other. Today it is a school again, now the Vrije School Kairos.

    Look for:
    - the two entrance wings and their chimneys with stone canopies
    - the ribbon of small windows on the upper floor of the middle section
    - the row of five tall linked windows on the ground floor
    - the narrow ladder-like window in the west end wall
    - decorative brickwork at the corners
