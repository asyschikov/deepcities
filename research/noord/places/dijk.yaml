      - Nieuwendammerdijk 311: een klokgevel voor en een puntgevel achter
      - Nieuwendammerdijk 317: een afgeronde pui met gesneden lijst en deuromlijsting
      - Nieuwendammerdijk 323: een koopmanshuis met graanzolder en een fraaie achtergevel
      - Nieuwendammerdijk 359: de empire puilijst, deuromlijsting, deur en het snijraam
      - Nieuwendammerdijk 383: een houten huis onder aan de dijk, met smalle zijlichtjes naast de deur
      - Nieuwendammerdijk 387: een gesneden deur uit de late 18e eeuw, en een empiredeurtje in de achterbouw
