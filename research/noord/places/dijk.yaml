  nl:
    title: Dokterswoning, Nieuwendammerdijk 335
    summary: "Een dokterswoning met leien dak uit 1912-1913; wachtkamer en apotheek zaten in het souterrain. De dokter telde in 1920 onder zijn 3000 patiënten 709 gevallen van malaria en promoveerde op die ziekte."
    body: |
      Malaria, in Nieuwendam. In 1920 telde de huisarts die hier woonde 709 gevallen onder de 3000 mensen in zijn praktijk. Het verhaal gaat dat hij de oevers waar de muggen hun eitjes legden met petroleum insmeerde of bespoot.

      Tussen de gevarieerde oude huizen op de dijk valt deze vrijstaande stenen villa meteen op. Vier schoorstenen op de hoeken, een afgeknot leien dak met een houten hekje tussen de schoorstenen, en een driezijdige erker met glas-in-lood en luiken. De Utrechtse architect J.C. Wentink tekende het huis in augustus 1912 als dokterswoning voor het toenmalige dorp Nieuwendam, in een stijl die teruggrijpt op vroeger. Achter op het perceel staat een apart schuurtje voor onder meer de brandstof.

      De praktijk zat onderin: wachtkamer, spreekkamer en apotheek in het souterrain, en daarboven, op de verhoogde begane grond, het woongedeelte. De opdrachtgever was hoogstwaarschijnlijk huisarts Pieter Jacobus Johannes Honig. Hij woonde sinds 1904 in Nieuwendam met zijn vrouw Adriana Cleijndert, dochter van een graanhandelaar uit de buurt. Malaria rukte in die jaren op in Nederland, vooral waar veel water was. Honig promoveerde er in 1922 op, met een studie naar de ziekte in Nieuwendam en omstreken.

      Het is een woonhuis: kijk vanaf de dijk.

      Let op:
      - de vier bakstenen schoorstenen met hun pironnen
      - de driezijdige erker met glas-in-lood in de bovenlichten en luiken, waarvan het dak op houten schoren rust
      - de afgeschuinde hoek en de erker met ojiefvormige top aan de oostkant
    attributes:
      original_use: Dokterswoning met praktijk
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/508537
      - https://amsterdamopdekaart.nl/1850-1940/Nieuwendammerdijk/335

- title: Café Noord-Holland 1907
  summary: "The name Café Noord-Holland and the year 1907 still read on the front of this corner by the canal bridge in Buiksloot, where ferry passengers from Amsterdam once changed to tow barges for Purmerend, Monnickendam and Edam."
  body: |
    For centuries this corner of the Buiksloterdijk was a transfer point. Ferry boats from Amsterdam landed in front of the dike, and passengers changed here to the flat tow barges (trekschuiten) that ran north to Purmerend, Monnickendam and Edam. Before the café, the site held the ferry inn De Vergulde Wagen and the inn Het Rode Hart. The council of Buiksloot, which had no town hall of its own, met in Het Rode Hart until it moved into a converted old school building at no. 228 in 1863.

    A "koffiehuis Noord-Holland" in Buiksloot appears in the papers as early as 1873. The present building dates from 1907, when Johannes Groot ran a busy café here on the road north; a gate to the right led to a playground. Its corner position is newer: nos. 242 and 244 were pulled down in early 1940 to widen the road to the Buikslotermeerdijk. A renovation in 2012–2013 restored many lost original details. In 2017 it was no longer a café but partly offices and partly a meeting room for hire, so enjoy the front from the street.

    Look for:
    - the café's name and the year 1907 on the front
    - the movable bridge over the Noordhollandsch Kanaal right beside it; the canal has cut through Buiksloot since 1824
  category: hidden-history
  lat: 52.398307
  lng: 4.922387
  address: Buiksloterdijk 240-242
