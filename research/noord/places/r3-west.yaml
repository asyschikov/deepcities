  nl:
    title: Trommelwoningen Twiske-West
    summary: "Twaalf ronde blokken op een eiland in Twiske-West, elk met zeven woningen rond een binnenplaats, zo gedraaid dat elke verdieping een zevende opschuift: geen woning op het noorden, ramen die verspringen en cederhout dat schuin om de gevel loopt."
    body: |
      Twiske-West verrees begin jaren negentig voor mensen die een tuin aan het water wilden, en daarom verdeelde Liesbeth van der Pol (Dok Architecten, later Rijksbouwmeester) de woningen over twee eilanden. Op het noordelijke eiland staan lange stroken terraswoningen van drie lagen, om de paar huizen onderbroken door dwars geplaatste woningen voor ouderen, waardoor er een reeks hoven ontstaat. Hun gebogen daken zijn afgekeken van de geluidsschermen langs de snelweg vlakbij.

      Het eigenaardige staat op het zuidelijke eiland: twaalf trommels, elk met zeven woningen rond een ronde, open binnenplaats. Elke woning beslaat drie verdiepingen, en elke verdieping is een zevende van de cirkel gedraaid ten opzichte van de vorige, zodat geen enkele woning alleen op het noorden ligt: elke woning krijgt een taartpunt van 154 graden, met zon en een rondom uitzicht. De kamers bestaan uit drie even grote ruimten die elk in tweeën kunnen, en zelfs de keuken kan naar boven. Van buiten lees je de spiraal af aan de gevel: ramen die nergens op één lijn liggen en red cedar-delen die schuin om de trommel lopen, in vijf tinten rood en geel, op een stervormige betonnen voet met grote schuifpuien naar de tuin. Alles bij elkaar gaat het om 212 huurwoningen.

      Het zijn woningen; kijk vanaf de paden en bruggetjes langs het water. In dezelfde vaart drijft het Drijfbeeld van Atelier Van Lieshout.

      Let op:
      - de verspringende ramen rond elke trommel
      - de schuine houten gevelbekleding
      - de ronde binnenplaatsen, zichtbaar door de ingangen
      - de gebogen daken van de terraswoningen op het noordelijke eiland
    attributes:
      architect: Liesbeth van der Pol (Dok Architecten)
      original_use: Huurwoningen
    sources:
      - https://arcam.nl/architectuur-gids/trommel-en-hofwoningen-twiske-west/
      - https://www.architectuurgids.nl/project/item/prj_id/480
      - https://dokarchitecten.nl/project/twiske-west-amsterdam

- title: NoordOogst
  summary: "Five hectares of former football pitches by the A10, turned since 2013 into a city farm with a 750-vine shared vineyard, pigs, a food forest, a butterfly garden and Noord's biggest nature playground. From 2027 half of it is meant to become sports fields."
  body: |
    When football club TOB left its ground on the Meteorenweg in 2013, the land filled up with some twenty small green enterprises instead. Today it is a public city-farm park: an organic market garden with a vegetable subscription and a food forest, pigs rooting in the fields on leftovers from the garden and the on-site brewery, a mushroom grower, a coffee roaster, beekeepers and a farm lodge in a former asylum seekers' centre. The free nature playground (2018), crowdfunded by neighbours, has a water run fed by a reed-bed filter that cleans the ditch water.

    Two corners are odd even by Noord's standards. No Château is a city vineyard of about 750 vines in 76 plots, each tended by an Amsterdammer who helps make the wine and takes most of it home. Mot in Mokum is a hidden public butterfly garden of 800 square metres, laid out for native butterflies and their caterpillars and used for courses.

    The site was always temporary. In December 2025 the borough announced a plan: from 2027 about half the land will become sports fields for the many new homes nearby, while NoordOogst may stay on the other half for at least five years. A petition of 4,552 signatures was handed in in February 2026, and NoordOogst has drawn up its own plan for a park where sport and food growing share the ground.

    The grounds and the playground are open by day; the childcare and the lodge are not for visitors.

    Look for:
    - the rows of vines of No Château
    - the lookout tower in the nature playground
    - the pigs in their field
