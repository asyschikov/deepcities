  nl:
    title: Gentiaanbuurt, het tuindorp van de rederij
    summary: "Een tuindorp van gesloten bouwblokken rond een verscholen plein, ingeklemd tussen de Van der Pekbuurt en het Mosveld en in de jaren twintig gebouwd voor een rederij. De woningen grijpen als een puzzel in elkaar, en dat maakte de renovatie van 2019–2023 zo lastig."
    body: |
      De meeste mensen lopen erlangs op weg naar de bekendere Van der Pekbuurt. De Gentiaanbuurt bestaat uit een stuk of tien gesloten bouwblokken met zo'n 340 woningen rond een groot plein in het midden, dat je bereikt door poorten onder de huizen. De zes zuidelijke blokken zijn ontworpen door A.D.N. van Gendt en G.H. Kleinhout voor de Stoomvaartmaatschappij Nederland, de Amsterdamse rederij op Indië (blok 5 is van 1928); woningmaatschappij Tuindorp, nu Ymere, nam het plan over.

      Het vreemde zit binnen. Omdat de blokken gesloten zijn en vol hoeken zitten, liggen de woningen niet netjes boven elkaar maar verschuiven en verspringen ze. Meestal is het een benedenwoning met daarboven een woning over twee verdiepingen, tot 100 vierkante meter groot, maar zonder badkamer, vaak zonder berging en soms zonder buitenruimte. Door sommige woningen lopen wel drie trappenhuizen. Dat brandgevaar was een van de redenen om te gaan renoveren.

      Eerst was blok 5 aan de beurt (Hooyschuur architecten, 2018–2019), daarna de blokken 6 tot en met 10 (Ibelings van Tilburg, klaar in 2023). Omdat de buitenkant beschermd stadsgezicht is, kwam de isolatie aan de binnenkant, en kleuronderzoek bracht het groen terug op de deuren en het houtwerk. Twee winkels op de hoeken werden weer woningen, zoals ze ooit bedoeld waren. Beide ontwerpteams noemen hun deel het eerste aardgasvrije blok in de bestaande bouw van Amsterdam, en de meeste huurders zijn teruggekomen.

      Het zijn woningen; kijk vanaf de straat en het plein.

      Let op:
      - de poort vanaf de Gentiaanstraat, met de getrapte erker erboven
      - de groene deuren en kozijnen, weer in de kleur van de jaren twintig
      - de torentjes, dakkapellen en boogportieken van de opgeknapte blokken
      - de picknicktafel met een tegelmozaïek van vlinders op het plein
    attributes:
      built: jaren twintig; gerenoveerd 2018–2019 (blok 5) en 2023 (blokken 6–10)
      architect: A.D.N. van Gendt en G.H. Kleinhout; Hooyschuur (2019), Ibelings van Tilburg (2023)
      original_use: Woningen voor personeel van de Stoomvaartmaatschappij Nederland
    sources:
      - https://arcam.nl/architectuur-gids/gentiaanbuurt-blok-6-10/
      - https://gebouwdin.amsterdam.nl/projectdetail/3366
      - https://gebouwdin.amsterdam.nl/projectdetail/3981

- title: Noorderparkkamer, the Swiss pavilion and the Marktplaats bar
  summary: "A red timber pavilion by the Zurich architects Meili and Peter, first a design for a craftsman's shed, then a community hut in Rotterdam, now a café in the Noorderpark. Next to it, a tiny bar built in 2012 entirely from things bought second-hand online."
  body: |
    The wooden pavilion near the middle of the Noorderpark has travelled. Marcel Meili and Markus Peter designed it around 1990 as a workshop for a young craftsman in Switzerland: seven big timber panels leaning on each other like a house of cards, with holes for windows, a roof that slides out and walls that slide aside, turning the inside into a yard. Ten years later they showed it at the Dutch "Parasite" exhibition, about temporary and subversive building, and it was built as an information and community pavilion in Hoogvliet, a Rotterdam satellite town that was being torn down and rebuilt. After about five years there the borough of Noord set it up in the Florapark, for what was meant to be a stay until 2012. From 2007 it was the Noorderparkkamer, the park's "cultural living room": choirs, brass bands, children's operas, and neighbours who got married in it. Open the sliding wall and it becomes a stage.

    In 2012 Overtreders W and bureau SLA added a bar billed as the first building in the Netherlands made entirely from Marktplaats purchases (Marktplaats is the Dutch eBay), paid for by crowdfunding: three stripped units from a temporary hospital, 42 second-hand windows, leftover tiles and paint from about a hundred sellers, and wooden shutters charred the Japanese way so they last. It is 18 square metres.

    The foundation stopped in 2017 for lack of money; the pavilion was repaired, as it had subsided when the new bridge was built, and has since been let to café operators. In July 2026 it was licensed as Noorderpark Café.

    Look for:
    - the sliding wall of the pavilion
    - the charred black shutters and mismatched windows of the bar
    - the stacked hospital units framing the terrace
