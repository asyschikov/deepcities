  nl:
    title: Melktap Zunderdorp
    summary: "Bij een biologisch melkveebedrijf tap je zelf rauwe, gekoelde melk in je eigen fles, direct van de boerderij. Eeuwenlang bracht Zunderdorp zijn melk naar Amsterdam; nu komt Amsterdam hem zelf halen."
    body: |
      Vroeger voer de melk naar de stad, nu fietst de stad naar de melk. Zunderdorp leeft al eeuwen van de koe. De verse melk ging per melkschuit rechtstreeks naar de melkmarkt aan de Prins Hendrikkade, waar Amsterdamse melkboeren met hun karren klaarstonden om hem langs de deuren te venten. De schuiten zijn allang verdwenen, maar binnen de stadsgrens is Zunderdorp nog altijd een melkdorp.

      Aan de Broekergouw heeft biologisch melkveebedrijf Disseldorp een melktap. De boer verkoopt de melk zelf: rauw en gekoeld. Je tapt hem zelf in een fles, jerrycan of beker. Neem dus iets mee om de melk in te doen, en munten om te betalen. De tap staat op hetzelfde erf als manege Stal Gouwzicht. Een mooie stop als je door Landelijk Noord fietst.

      Volgens de boerderij is de tap elke dag open van 8.00 tot 21.00 uur.
    sources:
      - https://nl.wikipedia.org/wiki/Zunderdorp
      - https://www.gouwzicht.nl/melktap
      - https://www.boerenroute.nl/winkel/de-melktap-broekergouw-65

- title: Farm, Zunderdorpergouw 29
  summary: "A dairy farm of 1861 in the last stretch of open meadow inside Amsterdam. Built entirely of wood, it got a brick front in the 1920s."
  body: |
    This farm on the Zunderdorpergouw stands in what the city's register calls the last remaining meadowland within the municipality of Amsterdam, on a yard edged by ditches, with trees and planting on the traditional front and side yards.

    It is a *stolp* (a farmhouse under one big pyramid roof) with a cowshed and a *kaakberg* (an open hay barrack), built around 1861 as a dairy farm. It was originally all timber; in the 1920s the front was rebuilt in brick and the front house got details of that time. That brick front is typical of the building history of this once all-timber stolp. The city listed it in 2021 for its rarity and its place in the landscape.

    Look for:
    - the brick front of the 1920s on the old wooden *stolp*
    - the yard ringed by ditches, with its trees
