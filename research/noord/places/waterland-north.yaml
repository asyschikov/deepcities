  nl:
    title: Houten huizen in Zunderdorp
    summary: "Drie houten rijksmonumenten in het melkdorp van Amsterdam, een kluwen laantjes omringd door sloten en bruggetjes. Van buiten zijn ze 19de-eeuws; de boerderij is van binnen vermoedelijk veel ouder."
    body: |
      De naam verraadt het water. Het dorp heette vroeger Sundeldorp, naar de sundels: smalle vaarten die van het dorp naar het IJ liepen. Zunderdorp was het hoofddorp van een eigen banne, maar vanaf de 17de eeuw stak het dijkdorp Nieuwendam het naar de kroon. Vanaf 1811 hoorde het bij de gemeente Nieuwendam, en in 1921 ging het samen met Nieuwendam naar Amsterdam. Eeuwenlang leefde het dorp van de melkveehouderij: verse melk ging per schuit regelrecht naar de melkmarkt aan de Prins Hendrikkade.

      Het dorp is een knoop van laantjes (Kerklaan, Middenlaan, Achterlaan), helemaal omringd door sloten, dus er zijn veel bruggetjes, sommige privé. Een handvol huizen is nog van hout, en drie daarvan zijn rijksmonument. De speld staat op Kerklaan 16, de verfijndste van de drie.

      Let op:
      - Kerklaan 16: houten huis uit het begin van de 19de eeuw met een uit- en ingezwenkt voorschot, een fraaie pui, oorspronkelijke roedenverdeling en een deur en bovenlicht in empirestijl
      - Middenlaan 17: houten boerderij met vooreind; van buiten 19de-eeuws, van binnen vermoedelijk veel ouder
      - Middenlaan 19: houten huis met puntgevel, grotendeels 19de-eeuws
    attributes:
      built: 19e eeuw of ouder
      original_use: Woonhuizen en boerderij
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/6792
      - https://nl.wikipedia.org/wiki/Zunderdorp

- title: Farms of 't Nopeind and 't Voorwerf
  summary: "A hamlet \"at the end\" north of Zunderdorp, with three listed wooden farmhouses. From 1974 to 2018 the city bus turned on a farmyard here, because turning in Zunderdorp was awkward."
  body: |
    't Nopeind is a hamlet of a few farms and houses just north of Zunderdorp, between the Kleine and Groote Blauwe Polder. The name is probably a contraction of *op het einde* ("at the end"); Amsterdam's council made the centuries-old name official on 10 July 1957. Its three lanes are Het Nopeind, Het Voorwerf and the Termietergouw.

    From 1974 to 2018 the hamlet was the end of the line for GVB bus 30 (later 31). Turning at the Kerklaan in Zunderdorp was too awkward, so the bus turned on a farmyard instead: first on the Voorwerf, from 1975 on the Nopeind.

    Three wooden farmhouses here are national monuments. Their outsides are mostly 19th century; the timber frames of at least two are probably older. This ensemble is pinned on 't Voorwerf 1.

    Look for:
    - 't Voorwerf 1: a wooden farmhouse with a long front section of three aisles
    - 't Voorwerf 13: a wooden *stolp* (pyramid-roofed farmhouse) with a short ridge, partly early 19th century outside
    - 't Nopeind 14: a long wooden *stolp*, 19th century outside
