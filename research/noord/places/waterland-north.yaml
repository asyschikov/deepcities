    summary: "Twee 19e-eeuwse stolpboerderijen, waarvan één helemaal van hout, aan de enige weg naar Holysloot. Met hun piramidedaken vormen ze het klassieke silhouet van de Waterlandse weilanden."
    body: |
      Wie met de auto naar Holysloot wil, heeft geen keus: het is de Bloemendalergouw of niets. Die weg loopt vanaf Ransdorp naar het noorden door de open weilanden. Langs de weg staan twee boerderijen van het type stolp, typisch voor Noord-Holland: een vierkant blok onder één reusachtig piramidedak.

      Beide zijn rijksmonument. Nummer 26 is een houten stolp, met een 19e-eeuwse buitenkant. Nummer 13 heeft deels houten wanden en oogt eveneens 19e-eeuws. De speld van dit ensemble staat bij nummer 26, de houten.

