  nl:
    title: Boerderijen van 't Nopeind en 't Voorwerf
    summary: "Een gehucht \"op het einde\", net boven Zunderdorp, met drie houten boerderijen die rijksmonument zijn. Van 1974 tot 2018 keerde de stadsbus hier op een boerenerf, omdat keren in Zunderdorp lastig was."
    body: |
      Jarenlang draaide de GVB-bus hier rond op het erf van een boer. Van 1974 tot 2018 was 't Nopeind de eindhalte van lijn 30, later 31. In Zunderdorp keren, bij de Kerklaan, ging moeizaam, dus week de bus uit naar een boerenerf: eerst aan het Voorwerf, vanaf 1975 aan het Nopeind.

      't Nopeind is een handvol boerderijen en huizen net ten noorden van Zunderdorp, ingeklemd tussen de Kleine en de Groote Blauwe Polder. De naam is vermoedelijk een samentrekking van "op het einde". Eeuwenlang heette het al zo, maar pas op 10 juli 1957 maakte de Amsterdamse gemeenteraad het officieel. Er lopen drie wegen: Het Nopeind, Het Voorwerf en de Termietergouw.

      Drie houten boerderijen zijn rijksmonument. Van buiten zijn ze grotendeels 19e-eeuws; het houtskelet van minstens twee is waarschijnlijk ouder. De speld staat op 't Voorwerf 1.

      Let op:
      - 't Voorwerf 1: een houten boerderij met een lang, driebeukig vooreind
      - 't Voorwerf 13: een houten stolp met een korte nok, vanbuiten deels vroeg 19e-eeuws
      - 't Nopeind 14: een langgerekte houten stolp, vanbuiten 19e-eeuws
    attributes:
      built: Uitwendig 19e eeuw, constructie ouder
      original_use: Boerderijen
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/6797
      - https://nl.wikipedia.org/wiki/%27t_Nopeind

- title: Zunderdorp milk tap
  summary: "A self-service tap on an organic dairy farm where you fill your own bottle with chilled raw milk straight from the farm. Zunderdorp has sent its milk to Amsterdam for centuries; now Amsterdam comes to fetch it."
  body: |
    For centuries Zunderdorp lived from its cows. Fresh milk went by *melkschuit* (milk barge) straight to the city, to the milk market on the Prins Hendrikkade, where Amsterdam's milk sellers waited with their carts to sell it door to door. The barges are long gone, but the village is still a dairy village inside the city limits.

    On the Broekergouw, the Disseldorp organic dairy farm runs a milk tap: chilled raw farm milk sold direct by the producer, which you tap yourself into a bottle, jerrycan or cup. Bring your own container and coins. The tap shares the yard with Stal Gouwzicht, a riding stable. It makes a good stop on a bike ride through Landelijk Noord.

    The farm gives the opening hours as every day from 8:00 to 21:00.
  category: food-drink
  lat: 52.413184
  lng: 4.972142
  address: Broekergouw 5, Zunderdorp
  links:
