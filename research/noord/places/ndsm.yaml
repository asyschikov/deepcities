  nl:
    title: Lasloods (STRAAT Museum)
    summary: "De lasloods van de NDSM uit 1952, met enorme blauwe deuren en binnen een stalen hal met twee beuken, waar scheepsbouwer Aarding als laatste werkte. Nu zit hier STRAAT, een museum voor straatkunst."
    body: |
      Zelfs het monumentenregister wordt er warm van en roemt de industriële schoonheid van de binnenkant. Binnen deelt een woud van samengestelde stalen kolommen de hal in twee beuken. Ze dragen de kraanbanen, en kleinere kolommen daarbovenop houden het dak.

      De lasloods werd in 1952 gebouwd naar ontwerp van de architecten J.D. en A.E.G. Postma. Van buiten is hij gesloten en streng: kale bakstenen muren, zeer grote blauwe deuren, vierkante kruisvensters met daarboven luiken, en een strook glas onder de dakrand. Vier lage zadeldaken dwars over het platte dak laten daglicht binnen.

      Scheepsbouwer Aarding was de laatste die hier bouwde. Nu zit in de hal STRAAT, een museum voor straatkunst en graffiti. Eduardo Kobra's Anne Frank staat op de buitenkant van de deuren, en ook de muren rond het plein dragen muurschilderingen, waarvan een deel door STRAAT is uitgekozen.

      Let op:
      - de blauwe deuren en de strook ramen onder de dakrand
      - de vier dwarse daken die als lichtstraat dienen
      - de oorspronkelijke kantooraanbouw aan de kopse kant richting IJ
      - binnen de twee rijen gelaste en geboute stalen kolommen met de kraanbaanliggers
      - muurschilderingen rond het plein: Leon Keers 3D-werk 'Shards of Memories' op de muur van STRAAT zelf, Telmo Miels portret van burgemeester Eberhard van der Laan (T.T. Neveritaweg 9), Karski's Johan Cruijff tussen de Nederlandse en de Catalaanse vlag, met de drie kruizen van Amsterdam (Scheepsbouwkade 72), en Accepts Kurt Cobain (NDSM-plein 90)
    attributes:
      original_use: Lasloods van de NDSM-werf
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/528252
      - https://nl.wikipedia.org/wiki/NDSM-werf

- title: Smederij and Timmerwerkplaats, NDSM
  summary: "One shipyard building, put up on the Conradstraat in 1909, was taken apart and rebuilt in Noord in 1927 as two sheds: the forge and the carpentry shop. Their English trusses still span the halls."
  body: |
    When the Nederlandsche Scheepsbouw Maatschappij (NSM) left its old yard on the Conradstraat, it did not leave everything behind. A workshop built there in 1909 was dismantled and, in 1927, re-erected on the new yard in Noord as two separate sheds to a design by G.J. Langhout: the forge (*smederij*) in the heart of the yard and the carpentry shop (*timmerwerkplaats*) on its west side. Both are steel-framed boxes filled in with brick and long runs of small-paned steel windows, under very low-pitched roofs with skylights. Inside, lattice columns carry English trusses (a classic triangulated roof truss) and, in the forge, crane rails.

    In 2007 the carpentry shop became the Benelux headquarters of MTV Networks (later Paramount), after a restoration by architect Max van Aerschot that kept the facades and roof and built a new office inside. Paramount moved out in early 2026. The forge is still a two-aisled hall, now with a modern wall down the middle.

    Look for:
    - the steel frame visible in the facades, with brick and glass panels of different sizes
    - the blue-painted doors of the forge
    - the glazed office annex on the south side of the carpentry shop
    - the skylights set across the shallow roofs
