  nl:
    title: Containerboog NDSM
    summary: "Een poort van opgestapelde zeecontainers, ooit festivaldecor, heet nu iedereen welkom die de werf op loopt. Om het jaar of zo schilderen kunstenaars hem opnieuw, dus hij ziet er nooit twee keer hetzelfde uit."
    body: |
      Een decorstuk dat niet meer weg mocht. De boog werd ooit neergezet als podiumdecor voor DGTL, het festival voor elektronische muziek op de NDSM. Hij viel zo in de smaak dat hij bleef staan, en ook andere festivals gingen hem gebruiken. Toen de coronajaren de werf leegveegden, besloot de NDSM-stichting de boog regelmatig een nieuw jasje te geven, om het wisselende gevoel van het festivalseizoen vast te houden. Daarvoor vraagt ze kunstenaars.

      Het uiterlijk liep flink uiteen: emoji-achtige iconen en reusachtige opblaasdieren in 2018, zwart, blauw en wit in 2021, in 2022 een versie van graffitiduo Karski & Beyond (in opdracht van DGTL, STRAAT en de stichting), en in 2025 The Only Way Is Up van muurschildersduo VAAF: een zon die ook een oog is, met vrouwen die omhoogkijken naar een nieuwe horizon. Voor 2026 ging er opnieuw een open oproep uit. Het herkenningspunt is niet één schildering maar de boog zelf: een tijdelijk bouwsel dat uitgroeide tot een van de symbolen van de werf.

      Let op:
      - de opgestapelde containers die samen de poort vormen
      - het huidige ontwerp, dat kan afwijken van de foto's
    sources:
      - https://www.ndsm.nl/kunst/containerboog-karski-beyond
      - https://www.ndsm.nl/magazine/de-verschillende-jasjes-van-de-icoontainerboog

- title: De Ceuvel
  summary: "Old houseboats hauled onto the poisoned ground of a former shipyard, where plants slowly clean the soil and a café built from salvage serves the neighbourhood. It has to leave in early 2028."
  body: |
    From 1919 a shipyard stood on this bank of the Van Hasseltkanaal, next to the Fokker aircraft factory; it was lightly damaged in the war by bombs aimed at Fokker. In the 1970s the Ceuvel firm took it over, but the yard closed in 2000 and was demolished in 2002, leaving soil heavily polluted with metals. In 2012 a team of architects and landscape designers won a ten-year lease with a plan for a sustainable workplace. From 2013 they lifted fifteen old houseboats out of the water and set them on land as offices and studios. Since nobody was allowed to dig more than 50 cm into the poisoned ground, every pipe and cable runs over the surface, and a winding boardwalk links the boats. Plants chosen to draw metals out of the soil (*phytoremediation*) grow all around.

    The boats use solar heat, compost toilets, rainwater and plant-based wastewater treatment. At the centre is a café-restaurant designed by Wouter Valkenier from reused materials, including an old lifeguard post and 80-year-old mooring posts. In 2023 De Ceuvel became a *zoöp*, an organisation in which the interests of non-human life have a voice in decisions. Its permit has been extended three times, but the city says it must hand the site back empty in early 2028, for soil clean-up, housing and a new creative workspace. De Ceuvel may bid in the tender for the site.

    Look for:
    - the houseboats standing on dry land
    - the boardwalk and the pipes running above ground
    - the soil-cleaning plants between the boats
