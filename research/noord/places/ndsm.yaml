  nl:
    title: Afbramerij, NDSM
    summary: "Een sobere loods uit 1955 waar ruwe randen met vijl en beitel van het gesneden staal werden gehaald. Een van de weinige gebouwen uit de naoorlogse bloeitijd van de NDSM, met binnen nog de oude kraancabine en de hijshaak."
    body: |
      Afbramen betekent: met vijl en beitel de scherpe randen van gesneden staal afhalen. Voor dat klusje zette de NDSM in 1955 deze loods neer, ontworpen door J.D. Postma. Waar hij staat is geen toeval; de werf was rationeel ingericht rond het productieproces, en van hieruit kijk je nog altijd recht op de lasloods aan de overkant van het terrein.

      De gemeente maakte er in 2021 een monument van. Samen met de lasloods en het opgeknapte Kraanspoor is de afbramerij een van de heel weinige gebouwen die nog over zijn uit de naoorlogse hoogtijdagen van de werf. Van buiten is hij zakelijk en praktisch, en in de loop der jaren veranderd. Zijn stalen skelet laat wel zien hoe de loodsen van de NDSM zich in de twintigste eeuw ontwikkelden. De oorspronkelijke kraancabine en de hijshaak staan nu binnen uitgestald, als deel van het gebouw. De loods doet inmiddels dienst als hightech opleidingscentrum voor de on- en offshore.

      Let op:
      - de zakelijke buitenkant van staal en gevelbeplating
      - de zichtlijn van hier naar de lasloods
      - het Kraanspoor
    attributes:
      original_use: Afbramerij van de NDSM-werf
    sources:
      - https://data.amsterdam.nl/monumenten/05619844-66cf-4ccc-9451-816dd68ad51e
      - https://nl.wikipedia.org/wiki/NDSM-werf

- title: Former Papaverschool and Lavendelschool
  summary: "Two 1920s primary schools in one brick block, in a sober, stripped-down Amsterdam School style. Restored in 2019–2021, the classrooms are now homes shared by young starters and refugees with a residence permit."
  body: |
    On the Papaverhoek ("poppy corner") two primary schools went up side by side to designs by the city's Public Works department (*Publieke Werken*), commissioned by the Christian school association Aeneas Mackay. The left-hand school, with eight classrooms and a gym, dates from 1924; work on the right-hand one, with six classrooms, began that year. One gave ordinary primary education, the other the more advanced *uitgebreid lager onderwijs*. They became the Papaver and Lavendel schools.

    The style is a sober, businesslike take on the Amsterdam School, in brick. After the schools closed the building served as a community centre and a school for house painters. The city listed it in 2018 and had it turned into 16 homes for young starters and status holders (refugees with a residence permit). The shell was carefully restored, with about 6,000 bricks specially made to rebuild the flower boxes in the facades. Two flats now fill the old gym, and in 2023 the residents kept chickens in the shared garden.

    Look for:
    - the brick flower boxes on the facades, rebuilt in 2019–2021
    - the characteristic stairwells, kept in the conversion
