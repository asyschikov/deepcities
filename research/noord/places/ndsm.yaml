  nl:
    title: NDSM Giants
    summary: "Drie acht meter hoge betonnen basketballers, twee mannen en een vrouw, gevangen in een beweging, kijken uit over de straatbasketbalvelden op de NDSM-werf. De beelden van Gabriel Lester staan er sinds april 2026."
    body: |
      Stichting NDSM-werf en 3X3 Unites, een stichting die 3x3-straatbasketbal inzet om jongeren vaardigheden en kansen te geven, hadden op de werf een populair straatbasketbalprogramma. Kunstenaar Gabriel Lester (PolyLester) won de open oproep voor een ontwerp. De kleurrijke 3x3 Legacy Courts, met felle oranje en blauwe strepen die aansluiten bij de lijnen en vormen van de omliggende gebouwen, geven de NDSM-werf sinds 2024 een herkenbaar gezicht.

      Met de NDSM Giants is het ontwerp sinds april 2026 compleet: drie acht meter hoge betonnen sculpturen van basketballers, twee mannen en een vrouw, elk opgebouwd uit twee in elkaar grijpende delen. Het zijn reuzen die midden in een beweging lijken te zijn stilgezet, ergens tussen stilstaan en bewegen, tussen herkenbare figuur en abstractie. Volgens Lester markeren ze de plek en scheppen ze tegelijk een beschutte hoek waar jongeren kunnen basketballen en zich thuis kunnen voelen. Bij de opening gaven speelsters van het Nederlandse 3x3-damesteam een clinic. De velden zijn vrij toegankelijk.

      Let op:
      - de openingen die door de betonnen lichamen zijn gesneden
      - hoe elke figuur uit twee in elkaar grijpende delen bestaat
