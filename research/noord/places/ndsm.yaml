  nl:
    title: Noorderlicht
    summary: "Het café dat in 2004 als pionier op de lege NDSM-werf begon en jarenlang op tijdelijke vergunningen draaide. In 2024 mocht het definitief blijven; na een faillissement in december 2025 volgde in 2026 een doorstart."
    body: |
      Noorderlicht begon in het voorjaar van 2004 als tijdelijk paviljoen op de NDSM-werf, toen nog een kaal terrein waar ooit een grote scheepswerf draaide en dat langzaam een van de creatiefste plekken van de stad werd. Jarenlang draaide het café op tijdelijke vergunningen, en als pionier hielp het de verandering van de werf op gang. Het werd café, festivalplek en ontmoetingsplaats voor kunstenaars en buurt tegelijk, met muziek, film, poëzie en een vuur aan de oever. In maart 2024 kwam eindelijk groen licht om definitief te blijven, eerst met een tijdelijk paviljoen en daarna met nieuwbouw.

      Op 16 december 2025 vroeg Noorderlicht faillissement aan. Mede-eigenaar Krijn van Santen wees naar problemen in de interne structuren, na jaren van ondernemen in grote onzekerheid. Begin 2026 werd een doorstart aangekondigd, met een heropening in het voorjaar. De website gebruikt nog altijd de naam Noorderlicht en noemt muziek, poëzie, beeldende kunst en dansavonden naast de keuken.

      Let op:
      - het terras aan het IJ met de zonsondergang boven de westelijke havens
      - het programma met muziek- en kunstavonden
