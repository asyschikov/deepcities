  nl:
    title: Kraanspoor
    summary: "Een betonnen kraanspoor van 270 meter uit de jaren vijftig had al een sloopvergunning, tot een architect er een sokkel in zag. Nu lijkt een lang glazen kantoor boven het oude werfskelet te zweven."
    body: |
      De sloopvergunning lag er al. Toch zag architect Trude Hooykaas in dit betonnen restant van de werf een fundament. Het brutalistische skelet, waarin je de nerf van de houten bekisting nog ziet, kon best een nieuw gebouw dragen. De vergunning werd ingetrokken en er kwam een nieuw bestemmingsplan.

      Het kraanspoor zelf stamt van rond 1952 en is ontworpen door het bureau Postma. Het is een verhoogde betonnen stellage aan het water bij de NDSM, waarover twee kranen heen en weer reden, en van waaraf schepen langszij werden afgebouwd. Nadat de werf in 1978 sloot, werd de omgeving steeds troostelozer.

      Het onderstel bestaat uit twee liggers van 270 meter op vier pijlers in de vorm van portalen, waarin nu de trappen en liften zitten. Beton kan niet alles hebben, dus kwam er bovenop een lichte doos van staal en glas: drie verdiepingen, zo'n 270 bij 14 meter en ongeveer 10.000 m². Die staat op eigen pootjes, waardoor hij boven het oude spoor lijkt te zweven. Voor noodgevallen hangen er aan de waterkant loopbruggen aan de pijlers. In oktober 2007 was het klaar, en in 2008 volgde de Nationale Staalprijs. 's Avonds licht de glazen huid op boven het IJ; overdag spiegelt het water erin.

      Let op:
      - het patroon van de bekistingsplanken in het beton van het oude kraanspoor
      - de kier tussen het betonnen onderstel en de glazen doos, waardoor die lijkt te zweven
      - de vluchtbruggen die aan de waterkant aan de pijlers hangen
    attributes:
      built: ca. 1952 (kraanspoor); 2007 (kantoren)
      architect: Architectenbureau Postma (kraanspoor); Ontwerpgroep Trude Hooykaas (kantoren)
      original_use: Kraanspoor van de NDSM-werf
    sources:
      - https://nl.wikipedia.org/wiki/Kraanspoor

- title: Let Me Be Myself (Kobra's Anne Frank)
  summary: "Brazilian artist Eduardo Kobra painted a 240 m² Anne Frank across the doors of the old welding hall in 2016, in his trademark kaleidoscope colours. In 2017 someone scrawled a protest slogan over it."
  body: |
    Eduardo Kobra, a Brazilian street artist known for huge colourful portraits of historical figures, had long wanted to paint Anne Frank, and Amsterdam was the obvious place. In 2016 he covered the doors of the NDSM welding hall (*lasloods*), on the corner of the Neveritaweg and the MS. van Riemsdijkweg, with a 240 m² portrait in his geometric patchwork style. More than 450 spray cans and 35 litres of lacquer paint went into it. The title, *Let me be myself*, points to Anne Frank's wish to be accepted as she was, and to respect for everyone's identity.

    The project was organised by Peter Coolen of StreetArt.Today, the group behind what became the STRAAT museum; he says it was made without any subsidy. In 2017 someone painted the text "We can party. But... we have to be very quiet" across the portrait in white, apparently in protest at new rules on the NDSM site. "The wall is over 900 square metres and one big free zone for graffiti, and you pick exactly this bit", Coolen told AT5. Street Art Today started a crowdfunding campaign to have it restored, and the mural is now part of the STRAAT collection, on the outside of the museum.

    Look for:
    - the portrait painted across the hall's big doors
    - the coloured triangles and stripes of Kobra's style
    - the title written into the work
  category: street-art
  lat: 52.401996
  lng: 4.893563
  address: Lasloods, corner tt. Neveritaweg and MS. van Riemsdijkweg
  links:
