  nl:
    title: Voormalige leeszaal, Kometensingel
    summary: Houten openbare leeszaal van omstreeks 1924 onder een fors overkragend rieten dak met koekoeken, de eigen bibliotheek van het tuindorp. Delen van het interieur zijn nog in oorspronkelijke staat.
    body: |
      Voormalige, omstreeks 1924 noordwestelijk in het Tuindorp Oostzaan gesitueerde leeszaal, in een combinatie van landelijke en Amsterdamse School-stijl, vermoedelijk ontworpen door de dienst Publieke Werken in opdracht van de gemeente Amsterdam. Volgens een krantenbericht bij de opening is het gebouw ontworpen door de Gemeentelijke Woningdienst, in overleg met de directie van de openbare leeszaal en bibliotheek.

      Het is een houten leeszaal op een gemetselde, bepleisterde en zwartgebeitste plint, bestaande uit een begane grond en een kapverdieping onder een fors overkragend rieten schilddak met aan beide langszijden een gewelfde koekoek. De rietkap is aan de lange zijden opgelicht boven de erkers en aan de korte zijden in het midden ingekort voor een vensterstrook. De houten buitenwanden zijn gepotdekseld. In de zijgevels en de achtergevel een driezijdige erker met door roeden horizontaal onderverdeelde vensters. Aan de voorzijde een door twee zwartgebeitste muurtjes geflankeerd portiek met verticale groeven, met een houten paneeldeur met een keperboogvormig venster. Delen van het interieur zijn nog in oorspronkelijke staat. De leeszaal is tevens van belang wegens de beeldbepalende ligging aan de Kometensingel.

      Let op:
      - het rieten dak met de twee gewelfde koekoeken
      - de driezijdige erkers
      - het gegroefde portiek en het keperboogvormige deurvenster
    attributes:
      built: ca. 1924
      original_use: Openbare leeszaal
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/508540
      - https://amsterdamopdekaart.nl/1850-1940/Kometensingel/211

- title: Parks department canteen, Orionplantsoen
  summary: A wooden staff canteen and tool store of 1925 for the city's park gardeners, with an open lattice "air room" for plants below and a lunchroom with a wrap-around window band above.
  body: |
    Even the gardeners got architecture in Tuindorp Oostzaan. This small building of 1925, designed by the Public Works service (the plan was submitted on 11 August 1924), served as a canteen and store for the city's parks department. The lower part was an "air room" for plants and tools, with walls made entirely of an open timber grid of square openings, originally without glass, plus storage for paving materials and a clay bin. The lunchroom and toilets were upstairs.

    It is built in the pared-down Amsterdam School style and is strongly horizontal: brick below, western red cedar boards above, a folded cornice running round, and on the upper floor boxy volumes joined by a white window band on three sides. In 1992 it was converted into two office units and the lattice walls were glazed in, but the grid is still there to read.

    Look for:
    - the square lattice of the former air room
    - the white window band around the upper floor
    - the folded cornice that runs round the building
  category: civic
  lat: 52.413225
  lng: 4.886852
  address: Orionplantsoen 1
  links:
    - { label: Rijksmonumentenregister (508541), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/508541" }
  attributes:
    rank: Okay
    heritage_status: National monument
    monument_number: "508541"
    built: "1925"
    architect: Dienst der Publieke Werken
    listed: 1997
    original_use: Parks department canteen and store
  photos:
    - commons:File:Orionplantsoen 1A;B.JPG
  sources:
    - rce:508541 (register description)
  nl:
    title: Schaftlokaal plantsoenendienst, Orionplantsoen
    summary: Houten schaft- en bergplaatsgebouw uit 1925 voor de Afdeling Plantsoenen, met beneden een open houten 'luchtruimte' voor planten en gereedschap en boven een schaftlokaal met omlopende vensterpartij.
    body: |
      In 1925 tot stand gekomen voormalig kantine- en opslaggebouw, ontworpen in opdracht van de gemeente Amsterdam door de Dienst der Publieke Werken. Het plan werd op 11 augustus 1924 door de directeur PW ingediend. Oorspronkelijk deed het gebouwtje dienst als schaft- en bergplaatsgebouw voor de Afdeling Plantsoenen van de gemeente. In het lager gelegen gedeelte bevonden zich een functionele 'luchtruimte' voor planten en gereedschap van de plantsoenendienst, en opslagruimte voor bestratingsmateriaal en een kleikist. Het schaftlokaal en de toiletten bevonden zich op de verdieping.

      Het is een geheel vrijstaand houten dienstgebouw in de stijl van de verstrakte Amsterdamse School, met één en deels twee sterk horizontaal gelede bouwlagen. De wanden van het lagere deel bestaan geheel uit een houten raster met vierkante openingen, in oorsprong zonder glas. Boven de bakstenen gevels zijn de wanden gepotdekseld met 'western red cedar'-delen. Een aan drie zijden omlopende en wit gekleurde vensterpartij verbindt de samenstellende elementen. In 1992 is het verbouwd tot een tweetal kantoor- en werkruimte-units; de wanden zijn toen gedicht.

      Let op:
      - het vierkante houten raster van de voormalige luchtruimte
      - de witte, omlopende vensterpartij op de verdieping
      - de geknikte lijst rondom
    attributes:
      original_use: Schaft- en bergplaatsgebouw plantsoenendienst
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/508541

- title: Former bathhouse, Meteorenweg
  summary: The 1927 public bathhouse of Tuindorp Oostzaan, with separate wings for adults and children and the entrance for mothers on the quiet garden side. It closed in 1985; blue tiles and the old ventilation survive.
  body: |
    Houses in the garden village had no bathroom, so in 1927 Public Works built a bathhouse on the corner of the Meteorenweg and the Maanstraat, a typologically rare building that the register describes as quite intact. Two wings form a hook around a former little park. One wing held the bath hall for men and women: waiting rooms, a cash desk, a boiler room and a corridor with five shower cubicles on each side and a room with a tub. The other was a separate children's bathhouse, with front rooms, changing rooms and a children's bath. Mothers and children came in from the sheltered park side, not from the busy road.

    The steep roofs over the bath halls hid ventilation systems that are still there and partly still work. The style mixes the Amsterdam School with rural touches, as usual in the Noord garden villages, and the building marks the point where the Meteorenweg narrows. After the council decided in 1984 to close the municipal bathhouses, this one shut on 1 June 1985. The building was split into two business premises; the cobalt-blue wall tiles at the front, the pale yellow tiling of the bath hall and the heavy steel boiler-room door survive inside.

    Look for:
    - the two tall roofs over the former bath halls
    - the hook-shaped plan around the garden
    - the narrowing of the Meteorenweg at the corner
  category: civic
  lat: 52.412372
  lng: 4.88695
  address: Meteorenweg 158-160
