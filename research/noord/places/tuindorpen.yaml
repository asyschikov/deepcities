  nl:
    title: Bethlehemkerk, Zwanenplein
    summary: Kerk in de stijl van de Amsterdamse School uit 1923-1924, laag gehouden om niet boven de arbeiderswoningen uit te steken. Koningin Wilhelmina was bij de opening en schonk een kanselbijbel.
    body: |
      Een in 1923-1924 tot stand gekomen kerkgebouw met westelijk aangebouwde kosterij, gebouwd voor de Nederlands Hervormde Gemeente: de zogenaamde Bethlehemkerk. De opdrachtgever, de in 1916 opgerichte 'Vereeniging voor Hervormde Wijkbelangen benoorden het IJ', trok in januari 1919 de architect A. Moen aan. De kerk werd gebouwd in de stijl van de Amsterdamse School. Moen diende bij de bouwhoogte rekening te houden met de omringende woningbouw. De kerk kwam in de plaats van een gebedsruimte in een gymnastieklokaal aan de Havikslaan; ter plaatse werd ze eerst Zwanenkerk genoemd.

      Op 13 september 1924 werd de kerk geopend in aanwezigheid van koningin Wilhelmina, die de kerk een kanselbijbel schonk. De twee grote glas-in-loodramen zijn ontworpen door H.J. Winkelman en geven De verkondiging aan de herders en De wijzen uit het oosten weer. Opvallend binnen de bouwstijl is de klokkenstoel, uitgevoerd met horizontale lijnen. In de top van de oostelijke puntgevel een natuurstenen plaquette met pentagram waarin de letters alpha en omega en het Chi-Rho-teken. Gedenksteen in de westelijke gevel.

      In 1993 raakte de kerk buiten gebruik als Nederlands Hervormde kerk; later was er de Volle Evangelie Gemeente De Bazuin en een Hindoestaans-Surinaamse geloofsgemeenschap. In 2015 verloor het gebouw zijn functie als kerk.

      Let op:
      - de klokkenstoel met horizontale accenten
      - de plaquette met alpha, omega en Chi-Rho in de oostgevel
      - de gedenksteen in de westgevel
    attributes:
      architect: A. Moen
      original_use: Nederlands Hervormde kerk
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/508434
