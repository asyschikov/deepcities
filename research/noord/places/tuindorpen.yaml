  nl:
    title: Vogelbuurt rond het Spreeuwenpark
    summary: "Het oudste stuk van de Vogelbuurt, waar Berlage, Van Epen en Leliman in 1915-1920 arbeiderswoningen bouwden voor de AWV en Eigen Haard. Noord als proeftuin voor de sociale woningbouw."
    body: |
      Het gemeentelijk register noemt Noord een proeftuin "met internationale allure", en hier, rond het Spreeuwenpark aan de zuidkant van de Vogelbuurt, begon het in 1909. Het stratenplan is een legpuzzel van scheve, soms "opengeknipte" blokken, die naar het noorden toe steeds ordelijker worden. In de jaren tien zetten wethouders Wibaut en Vliegen en woningdirecteur Keppler de bouw van arbeiderswoningen ten noorden van het IJ in gang; het register spreekt van een "sociaal-democratisch" uitbreidingsgebied.

      Drie beschermde complexen vormen samen dit ensemble. In 1915 bouwden H.P. Berlage en J.C. van Epen voor de Algemeene Woningbouwvereniging de blokken aan de Nachtegaalstraat en het Kraaienplein. Bruine baksteen, bakstenen erkers met een gebogen onderkant, en topgevels op de straathoeken. Aan de overkant van de Leeuwerikstraat zette J.H.W. Leliman datzelfde jaar voor Eigen Haard een symmetrisch complex in U-vorm neer, met winkeltjes met schuine hoeken aan de Havikslaan. In 1920 voegde Van Epen in zijn eentje twee blokken toe aan de Zwaluwstraat en de Sijsjesstraat, voor de AWV. Daar lopen de erkers over de hele gevelhoogte door, en veelhoekige torens op de hoeken markeren de poorten naar de binnenhoven. In alle drie heeft elke boven- en benedenwoning een eigen voordeur aan de straat. De speld staat op het Berlageblok aan de Nachtegaalstraat. De drie scholen op het binnenterrein hebben hun eigen plek.

      Let op:
      - de hoeken met topgevels van de blokken van Berlage en Van Epen, Nachtegaalstraat en Kraaienplein
      - de schuine hoekwinkels van Leliman, Havikslaan 42-46
      - de hoektorens van Van Epen aan de Leeuwerikstraat en de Sijsjesstraat
      - de erkers over de volle hoogte aan de Zwaluwstraat
      - de winkel in de afgeschuinde hoek van de Eksterstraat en de Havikslaan
    attributes:
      original_use: Arbeiderswoningen en winkels
    sources:
      - https://data.amsterdam.nl/monumenten/fe2eef1b-8fce-4c0e-ba58-abdb610d242a
      - https://data.amsterdam.nl/monumenten/b3ff52be-00a1-4bef-97ce-393a99a514b0
      - https://data.amsterdam.nl/monumenten/b21f01bd-54fd-4ee6-a4d5-f24b69f233b9

- title: Vogelbuurt blocks on the Fazantenweg, Kievitstraat and Meeuwenlaan
  summary: Three listed estates of 1918–1922 in the north of the Vogelbuurt, by Gratama, Leliman and Walenkamp. Shipping-line housing for KNSM workers, an early half-open block, and gables pushed up into the roof.
  body: |
    Towards the north the Vogelbuurt grows more formal: blocks are grouped in deliberate patterns, with three-storey edges closing off quieter streets behind. Three listed estates sit side by side here.

    Jan Gratama built the blocks on the Kievitstraat and Spechtstraat (1918–1920) for Eigen Haard. Beige brick, stepped brick lines framing the doors, two-by-two front doors, and front gardens where the blocks step back; the ends of the inner courts are closed by brick walls and small shared sheds. The register values it as a transition from the closed to the open block, with large back gardens and good light. J.H.W. Leliman's estate on the Fazantenweg and Koekoeksstraat (1920) was built for the shipping company KNSM to house its workers; ceramic tiles reading "Dr. Schaepman" point to the Catholic housing society of that name. Two storeys inside, three-storey edges and corner pavilions under wide hipped roofs outside. H.J.M. Walenkamp's two closed blocks on the Meeuwenlaan and Mezenstraat (1921) were flats for workers' families; he let gables run up halfway into the roof as dormers with wooden boarding and hoisting beams, in line with the housing he built a few years earlier in the Spaarndammerbuurt.

    This ensemble is pinned on Gratama's block on the Kievitstraat.

    Look for:
    - the stepped brick door frames on the Kievitstraat and Spechtstraat
    - the "Dr. Schaepman" tiles on Leliman's KNSM blocks
    - the corner pavilions with tent roofs on the Fazantenweg
    - Walenkamp's dormer gables with hoisting beams on the Meeuwenlaan
    - the corner shops at the Ganzenweg and Meeuwenlaan
  category: housing
  lat: 52.386506
  lng: 4.920204
  address: Kievitstraat 5-21, Fazantenweg 58-72, Meeuwenlaan 147-225 and around
  links:
    - { label: Monumentenregister Amsterdam (200714), url: "https://data.amsterdam.nl/monumenten/55edfc76-b4b4-4f38-8021-da1c602db80c" }
    - { label: Monumentenregister Amsterdam (200718), url: "https://data.amsterdam.nl/monumenten/61783b49-bf7a-49e6-83e8-38ce61592f86" }
    - { label: Monumentenregister Amsterdam (200713), url: "https://data.amsterdam.nl/monumenten/b8c78a58-bd5d-4484-9599-5e03aa870552" }
  attributes:
    rank: Okay
    heritage_status: Municipal monument
    monument_number: 200714, 200718, 200713
    built: 1918–1922
