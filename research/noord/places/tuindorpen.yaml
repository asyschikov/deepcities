  nl:
    title: Bethlehemkerk, Zwanenplein
    summary: Een lage kerk in de stijl van de Amsterdamse School uit 1924, midden op het grasveld van het Zwanenplein, geopend in bijzijn van koningin Wilhelmina, die er nog geen uur voor had. Sinds 2017 is het Studio 150, een opnamestudio met concerten.
    body: |
      In 1924 kreeg de Vogelbuurt een eigen hervormde kerk; tot dan kerkte men in een gymnastieklokaal aan de Havikslaan. Adriaan Moen moest de kerk laag houden, zodat ze niet boven de arbeiderswoningen eromheen uitstak. Hij zette een hoog middendak tussen twee lagere vleugels, vrijstaand midden op het grasveld van het Zwanenplein. In de buurt heette ze eerst de Zwanenkerk, maar dat vond men te gewoontjes; in april 1924 werd de naam Bethlehemkerk vastgelegd.

      Koningin Wilhelmina was bij de inwijding op 13 september 1924, al kwam ze niet speciaal: het bezoek was ingepast in een rondrit door het havengebied, en er was nog geen uur voor uitgetrokken, want daarna wachtte een brandweerdemonstratie. Ze schonk een kanselbijbel. Binnen, onder een paraboolvormige kap, tonen twee grote glas-in-loodramen van Winkelman de wijzen uit het oosten en de verkondiging aan de herders.

      In 1993 vertrok de hervormde gemeente, daarna kwamen andere geloofsgemeenschappen, en in 2015 was het gebouw geen kerk meer. In 2017 kocht en verbouwde Studio 150 het, een opnamestudio die in 1979 begon aan de Lauriergracht 150. Er wordt muziek opgenomen en er zijn geregeld concerten, vaak live uitgezonden: een concert is de manier om binnen te kijken.

      Let op:
      - de klokkenstoel met horizontale banden, ongewoon in deze stijl
      - de plaquette met pentagram, alfa, omega en het Chi-Rho-teken hoog in de oostgevel
      - de gedenksteen in de westgevel
    attributes:
      architect: A. Moen
      original_use: Nederlands Hervormde kerk
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/508434
      - https://nl.wikipedia.org/wiki/Bethlehemkerk_(Amsterdam)
      - https://www.studio150.nl/

- title: Zwanenplein (Patrimonium housing)
  summary: A castle-like workers' estate of 1919–1920 by Kuipers & Ingwersen for the Protestant housing society Patrimonium, with raised centre blocks, bird reliefs and plaques carrying war poems by David Ingwersen.
  body: |
    The blocks around the Zwanenplein stand out in the Vogelbuurt. Tjeerd Kuipers and Arnoldus Ingwersen built them in 1919–1920 for their regular client, the Protestant housing society Patrimonium, and gave them a picturesque, almost castle-like character, comparable to their blocks in the Spaarndammerbuurt and with clear English influences. Where a street axis ends, the blocks rise to three storeys under a hipped roof, and these raised centre parts give the ensemble its prominent place in this part of the Vogelbuurt.

    The Protestant and political signature of the client shows in plaques in the Putterstraat with poems about the war by David Ingwersen, and in relief panels of birds. The estate mixed many house types, including early maisonette-like homes, an experiment typical of Noord at the time; there were small shops on the corners of the Ganzenweg and the Zwanenplein. Verandas were added at the back in 1939, and the interiors and windows were renewed in 1979. The former Bethlehemkerk stands in the middle of the square (its own place). Pinned on the register point on the Zwanenplein.

    The most charming relief is on the south side, at the corner of the Koekoekstraat and the Spechtstraat: Driekus Jansen van Galen's sandstone pair of parakeets bent over a nest of chicks, with a monkey on the next pier. They were here about a century before the ring-necked parakeet, not welcome to everyone, became one of the city's commonest birds and Noord gave one a 7-metre statue at Overhoeks.

    Look for:
    - the raised three-storey blocks at the ends of the sight lines
    - the poem plaques in the Putterstraat
    - the bird reliefs and the Patrimonium stone at Zwanenplein 41
    - the gable stone "In de vogelwijkslanden" at Zwanenplein 91-97
    - the parakeets with their chicks, and the monkey, on the corner of the Koekoekstraat and Spechtstraat
  category: housing
  lat: 52.386445
  lng: 4.918486
  address: Eendenstraat 1-15, Zwanenplein 1-121 and around
  links:
