  nl:
    title: Voormalig badhuis, Meteorenweg
    summary: Het badhuis van Tuindorp Oostzaan uit 1927, met een mannen- en vrouwenbad en een apart kinderbadhuis, de ingang voor moeders aan de beschutte plantsoenzijde. Gesloten in 1985; blauwe tegels en ventilatie zijn bewaard.
    body: |
      Het voormalige badhuis aan de Meteorenweg is een bijzonder en typologisch zeldzaam gebouw dat nog in behoorlijk gave staat verkeert. In de vormentaal zijn karakteristieken van de Amsterdamse School gecombineerd met landelijke elementen, hetgeen in de tuindorpen van Noord gebruikelijk was. Het badhuisgebouw is een herinnering aan een inmiddels verdwenen sociaal en cultuurhistorisch fenomeen en een inherent onderdeel van de tuindorpstructuur.

      Twee bouwvolumes vormen samen een haak die het voormalige plantsoen aan twee zijden omsluit. Het ene volume deed oorspronkelijk dienst als het mannen- en vrouwenbadgedeelte, met entrees, wachtkamers, verwarmingsruimte en een badzaal met aan weerszijden van de gang een vijftal doucheruimtes en een ruimte met kuipbad. Het andere was het kinderbadhuis. Het lag voor de hand dat juist bij het beschut gelegen plantsoen de entree voor vrouwen en kinderen gelegen was en niet bij de drukke Meteorenweg. Boven de badzalen zijn ventilatiesystemen in de hoge kappen verwerkt, die nog aanwezig zijn.

      De gemeenteraad besloot op 28 november 1984 tot de geleidelijke sluiting van de gemeentelijke badhuizen; het badhuis aan de Meteorenweg is op 1 juni 1985 definitief gesloten. Zeer bijzonder is dat de oude kobaltblauwe betegeling van de wanden in de voorste helft nog intact is, evenals de zachtgele betegeling in de badzaal en de zware stalen deur van de verwarmingsruimte.

      Let op:
      - de twee hoge kappen boven de voormalige badzalen
      - de haakvormige opzet rond de tuin
      - de versmalling van de Meteorenweg bij de kruising
    attributes:
      original_use: Openbaar badhuis
    sources:
      - https://data.amsterdam.nl/monumenten/a87d9ad8-d0f3-4b7d-a9c8-25f56e0d668f

- title: Museumwoning Tuindorp Oostzaan
  summary: A garden-village house of 1922 that never got hot water, gas or a bathroom, found untouched during a renovation and kept as it was, with furniture of the 1920s and 1930s. Open on the second Sunday of the month.
  body: |
    The municipal housing department built about 1,350 houses in Tuindorp Oostzaan as a temporary village for shipbuilding workers, to types by B.T. Boeyinga and J.H. Mulder. When housing association Ymere renovated the houses, it found by chance that Meteorenweg 174 was still entirely in its original state. It never had hot water, gas or a bathroom.

    Ymere meant to open it for a year; the local history foundation Historisch Archief Tuindorp Oostzaan (HATO, founded 1983) persuaded the district and Ymere to keep it as a museum for good. It has been open to the public since 2002, furnished with furniture and household goods from 1920–1940. A small presentation room shows films and hosts talks about life in the village, including the flood of 14 January 1960, when a dike along Zijkanaal H burst and 15,000 people had to leave their homes for a week. Volunteers, some of them former residents, lead walks through the village on request.

    The house is open on the second Sunday of the month, 11:00–16:30, for a small entrance fee.
