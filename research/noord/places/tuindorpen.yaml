    - { label: Historisch Archief Tuindorp Oostzaan, url: "https://www.historischarchief-toz.nl/2022-onthulling-stenen-monument/" }
    - { label: Waterschap AGV, url: "https://www.agv.nl/nieuws/2022/december/oostzanerdijk-heeft-weer-noorse-keien/" }
    - { label: AT5, url: "https://www.at5.nl/artikelen/218075/de-dijk-in-tuindorp-oostzaan-hield-niet-alleen-water-tegen-hier-kon-en-mocht-echt-alles" }
