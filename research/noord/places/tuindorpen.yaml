    - { label: Monumentenregister Amsterdam (200718), url: "https://data.amsterdam.nl/monumenten/61783b49-bf7a-49e6-83e8-38ce61592f86" }
    - { label: Monumentenregister Amsterdam (200713), url: "https://data.amsterdam.nl/monumenten/b8c78a58-bd5d-4484-9599-5e03aa870552" }
