  nl:
    title: Zwanenplein (Patrimonium)
    summary: "Burchtachtig arbeidersdorp uit 1919-1920 van Kuipers & Ingwersen voor de protestantse vereniging Patrimonium: hogere blokken waar de zichtlijnen eindigen, vogels in zandsteen en plaquettes met oorlogsverzen van David Ingwersen."
    body: |
      Op de hoek van de Koekoekstraat en de Spechtstraat buigen twee zandstenen parkieten zich over hun jongen, werk van Driekus Jansen van Galen. Op de pijler ernaast zit een aapje. Ze waren er al zo'n honderd jaar voordat de halsbandparkiet, niet bij iedereen geliefd, een van de gewoonste vogels van de stad werd en Noord er bij Overhoeks een van zeven meter hoog neerzette.

      Het blok eromheen kwam er in 1919-1920. Tjeerd Kuipers en Arnoldus Ingwersen tekenden het voor Patrimonium, de protestantse woningbouwvereniging die steeds bij hen terugkwam. Ze maakten er iets van dat op een burcht lijkt, net als hun blokken in de Spaarndammerbuurt, met een Engelse inslag, en dat valt op tussen de rest van het tuindorp. Waar een straat op het blok uitkijkt, gaat het omhoog naar drie verdiepingen onder een schilddak. Juist die hogere middenstukken geven het complex zijn plek in dit deel van de Vogelbuurt.

      De opdrachtgever droeg geloof en politiek op de gevel uit. In de Putterstraat hangen plaquettes met gedichten over de oorlog van David Ingwersen, en er zijn reliëfs met vogels. Achter de gevels zat een bonte mengeling van woningtypen, met vroege voorlopers van de maisonnette: in Noord werd daar toen druk mee geproefd. Op de hoeken bij de Ganzenweg en het plein zaten kleine winkels. In 1939 kregen de achterkanten veranda's, in 1979 werden de woningen vanbinnen vernieuwd en kwamen er nieuwe ramen in. Midden op het plein staat de voormalige Bethlehemkerk (een eigen plek op de kaart). De speld staat op het registerpunt aan het Zwanenplein.

      Let op:
      - de hogere blokken aan het eind van de zichtlijnen
      - de plaquettes met gedichten in de Putterstraat
      - de vogelreliëfs en de steen van Patrimonium op Zwanenplein 41
      - de gevelsteen 'In de vogelwijkslanden' op Zwanenplein 91-97
      - de parkieten met hun jongen, en het aapje, op de hoek van de Koekoekstraat en de Spechtstraat
    attributes:
      architect: Tj. Kuipers en D. Ingwersen
      original_use: Arbeiderswoningen en winkels
    sources:
      - https://data.amsterdam.nl/monumenten/0dc0556f-1d30-4e34-be43-3c4f29e51e52
      - https://nl.wikipedia.org/wiki/Lijst_van_beelden_in_Amsterdam-Noord

- title: Three hidden schools, Havikslaan
  summary: Three school buildings of 1914, 1915 and 1916 stand side by side in a closed inner court of the Vogelbuurt, reached through two narrow passages and invisible from the surrounding streets.
  body: |
    Walk into the passage from the Nachtegaalstraat or the Havikslaan and a surprise opens up: inside the housing blocks by Berlage and Van Epen lie three large school buildings, built one after the other from east to west in 1914, 1915 and 1916. They are much bigger than the two-storey houses around them, but thanks to their flat roofs you cannot see them from the streets.

    The first school (Havikslaan 22) was a primary school, the second (Havikslaan 20) an extended primary school (ULO), and the third (Nachtegaalstraat 157) a preparatory school for the youngest children. All three came from the buildings department of the Public Works service, with nearly identical plans: two storeys and a central corridor. In the two Havikslaan schools the gym is on the ground floor with a blind north wall, and the drawing room upstairs has three windows facing north for the north light.

    The first two are sober. The third, of 1916, is clearly finer and comes closest to the Amsterdam School type; that was the year Hulshoff became head of the department. Inside, arches, floors, doors and above all the staircases show the familiar Public Works repertoire, subtly applied.

    Look for:
    - the two narrow entrances to the inner court
    - the north walls with the tall drawing-room windows
    - the more refined front of Nachtegaalstraat 157
  category: schools
  lat: 52.385319
  lng: 4.915531
  address: Havikslaan 20-22, Nachtegaalstraat 157
  links:
    - { label: Monumentenregister Amsterdam (200497), url: "https://data.amsterdam.nl/monumenten/15e6a272-ec16-4770-bf23-8936d0d7b729" }
  attributes:
    rank: Nice
    heritage_status: Municipal monument
    monument_number: "200497"
    built: 1914–1916
    architect: Dienst der Publieke Werken
    listed: 2003
    original_use: Three primary schools
  sources:
    - city:200497 (register text)
  nl:
    title: Drie verborgen scholen, Havikslaan
    summary: "Drie schoolgebouwen uit 1914, 1915 en 1916 staan naast elkaar op een dichtgebouwd binnenterrein in de Vogelbuurt. Je komt er alleen door twee smalle doorgangen, en vanaf de straten eromheen zie je er niets van."
    body: |
      Vanaf de stoep zou je nooit raden dat hier drie scholen staan. Loop vanaf de Nachtegaalstraat of de Havikslaan een smalle doorgang in, en achter de woonblokken van Berlage en Van Epen liggen ineens drie grote schoolgebouwen naast elkaar. Ze zijn van oost naar west gebouwd, in 1914, 1915 en 1916. Ze zijn veel groter dan de huizen van twee lagen eromheen, maar omdat ze platte daken hebben, steken ze er vanaf de straat niet bovenuit.

      De eerste (Havikslaan 22) was een gewone lagere school, de tweede (Havikslaan 20) een ulo, en de derde (Nachtegaalstraat 157) een school voor de allerkleinsten, als voorbereiding op het lager onderwijs. Alle drie zijn ontworpen door de afdeling Gebouwen van Publieke Werken, met bijna dezelfde plattegrond: twee lagen en een gang door het midden. Bij de twee scholen aan de Havikslaan ligt de gymzaal beneden, met een blinde noordgevel, en het tekenlokaal erboven, met drie ramen op het noorden voor het noorderlicht.

      De eerste twee zijn sober gehouden. De derde, uit 1916, is duidelijk verfijnder en lijkt het meest op het schooltype van de Amsterdamse School. In datzelfde jaar werd Hulshoff hoofd van de afdeling. Binnen tonen bogen, vloeren, deuren en vooral de trappenhuizen het bekende repertoire van Publieke Werken, hier met lichte hand toegepast.

      Let op:
      - de twee smalle toegangen tot het binnenterrein
      - de noordgevels met de hoge ramen van de tekenlokalen
      - de fijnere voorgevel van Nachtegaalstraat 157
    attributes:
      architect: Dienst der Publieke Werken
      original_use: Drie lagere scholen
    sources:
      - https://data.amsterdam.nl/monumenten/15e6a272-ec16-4770-bf23-8936d0d7b729

- title: Vogelbuurt blocks around the Spreeuwenpark
  summary: The oldest part of the Vogelbuurt, where Berlage, Van Epen and Leliman built workers' housing in 1915–1920 for the AWV and Eigen Haard. Noord as a testing ground for social housing.
  body: |
    House building in Noord began in 1909 around the Spreeuwenpark, at the south end of the Vogelbuurt. The plan here is a puzzle of irregular, sometimes "cut-open" blocks, growing more orderly further north. In the 1910s aldermen Wibaut and Vliegen and housing director Keppler drove the building of workers' homes north of the IJ, in what the register calls a "social-democratic" extension; the register calls Noord a testing ground "with international allure".

    Three listed complexes make up this ensemble. In 1915 H.P. Berlage and J.C. van Epen built the blocks on the Nachtegaalstraat and Kraaienplein for the Algemeene Woningbouwvereniging: brown brick, brick bay windows with arched undersides, and gables marking the street corners. Facing them across the Leeuwerikstraat, J.H.W. Leliman built a symmetrical U-shaped complex for Eigen Haard in the same year, with small corner shops cut off at an angle on the Havikslaan. In 1920 Van Epen alone added two blocks on the Zwaluwstraat and Sijsjesstraat for the AWV, with bays running the full height of the front and many-sided corner towers marking the entrances to the inner courts. All three have their own front door for each upper and lower flat. This ensemble is pinned on the Berlage block on the Nachtegaalstraat. The three schools in the inner court have their own place.

    Look for:
    - the gabled corners of the Berlage and Van Epen blocks, Nachtegaalstraat and Kraaienplein
    - the angled corner shops of Leliman's block, Havikslaan 42-46
    - Van Epen's corner towers on the Leeuwerikstraat and Sijsjesstraat
    - the full-height bays on the Zwaluwstraat
    - the shop in the cut-off corner of the Eksterstraat and Havikslaan
  category: housing
  lat: 52.384722
  lng: 4.914436
  address: Nachtegaalstraat 116-197, Havikslaan 42-46, Zwaluwstraat 1-44 and around
  links:
    - { label: Monumentenregister Amsterdam (200719), url: "https://data.amsterdam.nl/monumenten/fe2eef1b-8fce-4c0e-ba58-abdb610d242a" }
    - { label: Monumentenregister Amsterdam (200720), url: "https://data.amsterdam.nl/monumenten/b3ff52be-00a1-4bef-97ce-393a99a514b0" }
    - { label: Monumentenregister Amsterdam (200715), url: "https://data.amsterdam.nl/monumenten/b21f01bd-54fd-4ee6-a4d5-f24b69f233b9" }
  attributes:
    rank: Okay
    heritage_status: Municipal monument
    monument_number: 200719, 200720, 200715
    built: 1915–1920
    architect: H.P. Berlage, J.C. van Epen, J.H.W. Leliman
    listed: 2013
    original_use: Workers' housing and shops
  photos:
    - commons:File:Nachtegaalstraat hoek Leeuwerikstraat pic.jpg
    - commons:File:2020 Kraaienplein 8-14.jpg
    - commons:File:Leeuwerikstraat hoek Havikslaan pic2.JPG
  sources:
