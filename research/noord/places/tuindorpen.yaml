    - "Interior tiles and steel door dropped from the text: inside private homes"
  nl:
    title: Voormalig badhuis, Meteorenweg
    summary: "Het badhuis van Tuindorp Oostzaan uit 1927. Vanaf de Meteorenweg lijkt het op twee boerderijtjes; in de hoge kappen met hun uitvergrote nokken zit nog de ventilatie van de badzalen. Nu woningen."
    body: |
      Tot na de oorlog elke nieuwe woning een badkamer kreeg, ging je in Amsterdam naar het badhuis. De gemeente bouwde er vanaf het begin van de twintigste eeuw een hele reeks, te beginnen met schoolbadhuizen waar kinderen onder strak regime douchten: jongens hadden twintig minuten om zich uit te kleden, te wassen en weer aan te kleden, meisjes dertig. Dat heette niet voor niets 'commandobaden'. Dit badhuis van Publieke Werken uit 1927 was voor volwassenen en kinderen. In 1984 besloot de gemeenteraad de badhuizen te sluiten; dat aan de Meteorenweg ging op 1 juni 1985 dicht.

      Hoe het werkte, zie je nog aan de buitenkant. Twee vleugels vormen een haak om het voormalige plantsoen: in de ene zat het mannen- en vrouwenbad, in de andere een apart kinderbadhuis. Moeders en kinderen gingen naar binnen in de beschutte hoek bij het plantsoen, niet aan de drukke weg. Langs de Meteorenweg lijken de twee vleugels op twee Noord-Hollandse boerderijtjes. De hoge kappen boven de badzalen hebben grote rechthoekige ramen in de kopgevels en uitvergrote nokken; de ventilatie is in die kappen verwerkt, en in het voormalige mannen- en vrouwenbad werkt die ventilatie nog.

      Beide helften zijn nu woningen (het oude kinderbad deels bedrijfsruimte) en het plantsoen is een privétuin achter een schutting. Kijk dus vanaf de straat.

      Let op:
      - het grote raam in de kopgevel van het kinderbad aan de Maanstraat
      - de uitvergrote nokken op de twee hoge kappen
      - de schoorsteen van de stookruimte: twee verspringende blokken, met een knipoog naar Frank Lloyd Wright
    attributes:
      original_use: Openbaar badhuis
    sources:
      - https://data.amsterdam.nl/monumenten/a87d9ad8-d0f3-4b7d-a9c8-25f56e0d668f

- title: Museumwoning Tuindorp Oostzaan
  summary: A garden-village house of 1922 that never got hot water, gas or a bathroom, found untouched during a renovation and kept as it was, with furniture of the 1920s and 1930s. Open on the second Sunday of the month.
  body: |
    The municipal housing department built about 1,350 houses in Tuindorp Oostzaan as a temporary village for shipbuilding workers, to types by B.T. Boeyinga and J.H. Mulder. When housing association Ymere renovated the houses, it found by chance that Meteorenweg 174 was still entirely in its original state. It never had hot water, gas or a bathroom.

    Ymere meant to open it for a year; the local history foundation Historisch Archief Tuindorp Oostzaan (HATO, founded 1983) persuaded the district and Ymere to keep it as a museum for good. It has been open to the public since 2002, furnished with furniture and household goods from 1920–1940. A small presentation room shows films and hosts talks about life in the village. HATO also keeps records of the flood of 14 January 1960, when a dike along Zijkanaal H burst and 15,000 people had to leave their homes for a week. The foundation also organises walks through the village.

    The house is open on the second Sunday of the month, 11:00–16:30, for a small entrance fee.
  category: odd-museums
  lat: 52.413686
  lng: 4.884117
  address: Meteorenweg 174
  links:
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Museumwoning_Tuindorp_Oostzaan" }
    - { label: Historisch Archief Tuindorp Oostzaan, url: "https://www.historischarchief-toz.nl/museumwoning/" }
  attributes:
    rank: Nice
    built: "1922"
    architect: B.T. Boeyinga and J.H. Mulder (house type)
    original_use: Workers' house
  photos:
    - commons:File:Hatomuseum.jpg
  sources:
    - https://nl.wikipedia.org/wiki/Museumwoning_Tuindorp_Oostzaan
    - https://nl.wikipedia.org/wiki/Tuindorp_Oostzaan
    - https://www.historischarchief-toz.nl/museumwoning/ (opening times)
  nl:
    title: Museumwoning Tuindorp Oostzaan
    summary: "Een tuindorphuis uit 1922 waar nooit warm water, gas of een badkamer in kwam. Bij een renovatie werd het ongerept teruggevonden en zo gelaten, met meubels uit de jaren twintig en dertig. Open op de tweede zondag van de maand."
    body: |
      Warm water, gas, een badkamer: dit huis heeft het allemaal nooit gehad. Toen woningcorporatie Ymere de huizen in Tuindorp Oostzaan renoveerde, bleek bij toeval dat Meteorenweg 174 nog precies zo was als in het begin.

      De Gemeentelijke Woningdienst zette hier zo'n 1350 woningen neer, als tijdelijke woonplek voor wie op de scheepswerven werkte. De woningtypes zijn van B.T. Boeyinga en J.H. Mulder. Dit exemplaar is van 1922.

      Ymere wilde het huis een jaar lang openstellen. Het Historisch Archief Tuindorp Oostzaan (HATO), een stichting uit 1983, wist het stadsdeel en Ymere over te halen er voorgoed een museum van te maken. Sinds 2002 kan iedereen binnenkijken, in een interieur met meubels en huisraad uit 1920 tot 1940. In een kleine voorlichtingsruimte draaien films en worden lezingen gegeven over het dagelijks leven in het tuindorp van vroeger. HATO bewaart ook materiaal over de overstroming van 14 januari 1960: de dijk langs Zijkanaal H brak door en 15.000 mensen moesten een week lang hun huis uit. Verder organiseert de stichting wandelingen door de wijk.

      Open: op de tweede zondag van elke maand, tussen 11.00 en 16.30 uur, voor een kleine entreeprijs.
    attributes:
      architect: B.T. Boeyinga en J.H. Mulder (woningtype)
      original_use: Arbeiderswoning
