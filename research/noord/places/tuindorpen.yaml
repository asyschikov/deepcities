  nl:
    title: Voormalige kleuterschool, Mariëndaal
    summary: "Een van vijf kleuterscholen naar één ontwerp in de nieuwe Buikslotermeer; deze dateert van 1968 en is het best bewaard. Drie zusjes gaan tegen de vlakte, dus dit lage paviljoen is straks een van de laatste twee."
    body: |
      Toen in de jaren zestig de Buikslotermeer werd gebouwd, een van de naoorlogse tuinsteden van Noord, hoorden de scholen bij het plan. Voor de Stichting Rooms Katholiek Onderwijs in Amsterdam-Noord ontwierpen A. Evers en G.J.M. Sarlemijn vijf kleuterschooltjes volgens één opzet: een lesvleugel en een schoolzaal aan een schoolplein, in een rechte lijn of in een L. Mariëndaal 13 dateert van 1968.

      Dat het in 2020 gemeentelijk monument werd, heeft ook met de andere vier te maken. Voor drie ervan (Botterstraat 185, Volendammerweg 51 en IJdoornlaan 34) is een sloopbesluit genomen, en Spelderholt 167 is door de eigenaar verbouwd. Mariëndaal 13, binnen en buiten het minst veranderd, blijft dus behouden, mogelijk samen met het verbouwde Spelderholt 167.

      Het is een bescheiden paviljoen, maar zorgvuldig getekend: strakke lijnen, een evenwichtige gevel en een functionalistische vorm die in het werk van de twee architecten opvalt. Het laat ook het denken van die tijd zien. In het onderwijs kwam het kind centraal te staan, en de schoolzaal was ook bedoeld voor activiteiten uit de buurt. De beschutte plek in het groen aan de rand van de wijk is het tuinstadidee in het klein.

      Er zit nu een kinderdagverblijf in; bekijk het dus vanaf de straat.

      Let op:
      - de lesvleugel en de schoolzaal aan het schoolplein
      - de strak belijnde, functionalistische gevels
      - de groene ligging aan de rand van de wijk
    attributes:
      architect: A. Evers en G.J.M. Sarlemijn
      original_use: Kleuterschool
    sources:
      - https://data.amsterdam.nl/monumenten/376f0dd9-3708-4b92-a942-12dc9d531c9d

- title: Patio houses, Bosplaat
  summary: A snug cluster of fifteen 1970s bungalows, each built around its own little patio, with garages and railway-sleeper gardens. Evers and Sarlemijn's 1975 courtyard houses are on their way to becoming a municipal monument.
  body: |
    In the Buikslotermeer lies an unexpected little enclave: fifteen single-storey "bungalows" and some twenty garages, developed in 1974–1975 by the building firm De Waal to a design by Adriaan Evers and Geert Sarlemijn. Each house is built around a small inner courtyard, a patio. There were two types, five with six rooms and ten with four; the four-room houses had a large living room with an open kitchen. All had a void with a "balcony room" above the living room, which shows outside as the higher parts of the roofline. No. 8 was later raised above the void.

    Typical of the outdoor design is the generous use of railway sleepers, a popular garden material in the 1970s. The city rates the cluster as worthy of monument status, heritage society Heemschut put it on its list of post-1965 architecture, and the municipality started the procedure to list it as a municipal monument in 2024; the advisory committee recommended protection, including the surrounding layout and garages, in 2024.

    These are private homes; look from the street.

    Look for:
    - the raised roofs over the balcony rooms
    - the railway sleepers in the front gardens
    - the row of garages
