  nl:
    title: Schaftlokaal plantsoenendienst, Orionplantsoen
    summary: "Houten schaftlokaal en bergplaats uit 1925 voor de plantsoenendienst. Beneden een 'luchtruimte' voor planten achter een open houten raster, boven een kantine met een witte raampartij die om het gebouw heen loopt."
    body: |
      In Tuindorp Oostzaan kregen zelfs de plantsoenmedewerkers architectuur. Dit gebouwtje uit 1925 is een ontwerp van Publieke Werken; de directeur diende het plan in op 11 augustus 1924. De Afdeling Plantsoenen van de gemeente gebruikte het om te schaften en spullen op te bergen.

      Beneden lag de 'luchtruimte', voor planten en gereedschap. De muren daar waren niets dan een houten raster vol vierkante gaten, aanvankelijk zonder ruiten. Verder was er plek voor bestratingsmateriaal en een kist met klei. Boven zaten de kantine en de wc's.

      De stijl is een strakke versie van de Amsterdamse School, en alles wijst horizontaal. Onderin baksteen, daarboven overlappende planken van western red cedar, en rondom een geknikte lijst. Op de verdieping staan blokvormige volumes, aan drie kanten verbonden door een band van witte ramen. In 1992 werden er twee kantoorunits van gemaakt en gingen de rasterwanden dicht, maar het raster zelf kun je nog gewoon zien.

      Let op:
      - het vierkante raster van de vroegere luchtruimte
      - de witte raamband rond de verdieping
      - de geknikte lijst die rondom loopt
    attributes:
      original_use: Schaft- en bergplaatsgebouw plantsoenendienst
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/508541

- title: Former bathhouse, Meteorenweg
  summary: "Tuindorp Oostzaan's 1927 bathhouse. From the Meteorenweg it looks like two little farmhouses; its tall roofs, with their oversized ridges, still hold the bath halls' ventilation. Now private homes."
  body: |
    Until a bathroom came with every new home after the war, Amsterdammers washed at the municipal bathhouse. The city built a string of them from the early 20th century, starting with school baths where children showered under a strict regime: boys had 20 minutes to undress, wash and dress again, girls 30, hence the name *commandobaden* (baths by command). This one, built by Public Works in 1927, served adults and children. The council decided to close the city's bathhouses in 1984, and this one shut on 1 June 1985.

    How it worked still shows outside. Two wings form a hook around a former little park: one held the men's and women's baths, the other a separate children's bath. Mothers and children went in at the sheltered corner by the park, away from the busy road. Along the Meteorenweg the two wings look like two separate North Holland farmhouses. The tall roofs over the bath halls end in big rectangular windows and have oversized ridges; the ventilation was built into these roofs, and in the former men's and women's bath the ventilation still works.

    Both halves are homes now (the old children's bath partly business space), and the former park is a private garden behind a fence, so look from the street.

    Look for:
    - the big gable window of the children's bath, facing the Maanstraat
    - the oversized ridges of the two tall roofs
    - the boiler-room chimney, two offset brick blocks with a nod to Frank Lloyd Wright
  category: civic
  lat: 52.412372
  lng: 4.886950
  address: Meteorenweg 158-160
  links:
    - { label: Monumentenregister Amsterdam (200896), url: "https://data.amsterdam.nl/monumenten/a87d9ad8-d0f3-4b7d-a9c8-25f56e0d668f" }
