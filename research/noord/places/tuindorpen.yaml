  nl:
    title: Salvatorkerk
    summary: "Een van de laatste katholieke kerken die in Nederland werden gebouwd (1966-1969): een laag wit vierkant waarvan het platte dak op een vensterstrook lijkt te zweven, op het niveau van de verhoogde weg, met de pastorale ruimten eronder."
    body: |
      Het kerkgebouw staat in de Buikslotermeerpolder. De doorgaande wegen in deze diep gelegen polder zijn verhoogd aangelegd. In tegenstelling tot de omringende woonbebouwing is de kerkruimte op dit hoger gelegen niveau gesitueerd, aan de IJdoornlaan. Door het niveauverschil konden de ruimten voor pastoraal werk op het maaiveld van de polder onder de kerkruimte geschoven worden. G.J. van der Grinten en L.J. Heijdenrijk bouwden de kerk in de periode 1966-1969 in opdracht van De Katholieke Stichting Opbouw Amsterdam Noord.

      De kerkruimte met 400 zitplaatsen is een laag vierkant volume, met gevels die zowel van binnen als van buiten zijn afgewerkt met witte kwartsverf. Het ver overstekende platte dak, met een zeer brede dakrand, wordt gedragen door acht betonnen kolommen en lijkt door de rondom doorlopende vensterstrook te zweven. De architecten hebben de gevels van de pastorie een meer frivool karakter gegeven, met eigenzinnige raamopeningen die aangeven dat hier gewoond wordt. Op de gevels is in simpele belettering de naam 'Salvator' aangebracht. Het Savelsbos loopt min of meer dood bij de IJdoornlaan, waardoor bij de kerk een mooi, verkeersluw voorplein is ontstaan.

      De ingetogen kerkzaal waarin iedere verwijzing naar hiërarchie ontbreekt, laat zien hoezeer de behoefte aan herbezinning na het Tweede Vaticaans Concilie is vertaald in het ontwerp. Het gebouw geldt als een vertegenwoordiging van de laatste katholieke kerkgebouwen die in Nederland gebouwd werden; binnen Amsterdam is de Salvatorkerk een zeldzaam en uniek gegeven. De laatste eucharistieviering was op zondag 24 juni 2012.

      Let op:
      - de vensterstrook onder het zwevende dak
      - de belettering 'Salvator'
      - de trap naar het poldermaaiveld
    attributes:
      architect: G.J. van der Grinten en L.J. Heijdenrijk
      original_use: Rooms-katholieke kerk en pastorie
    sources:
      - https://data.amsterdam.nl/monumenten/9b52ab79-dadb-4866-a030-3bdb9154919a
      - https://reliwiki.nl/index.php?title=Amsterdam,_Savelsbos_1_-_Salvator

- title: Former kindergarten, Mariëndaal
  summary: The best-kept of five identical pavilion kindergartens of 1968 by Evers and Sarlemijn in the Buikslotermeer, a classroom wing and a hall on a schoolyard, built when "the child at the centre" was the new idea. Three of the others face demolition.
  body: |
    The new post-war neighbourhoods of Noord got schools as part of the plan. In the Buikslotermeer, Adriaan Evers and Geert Sarlemijn designed a series of five kindergartens, identical except for a straight or an L-shaped plan, each with a classroom wing and a school hall on a schoolyard. Mariëndaal 13 dates from 1968. It is simple but carefully set out, with clear lines and a well-balanced front, and its functionalist look is unusual in the work of the two architects, who are better known for traditional churches.

    The building reflects the ideas of its time about education, with more attention to the child, and about the neighbourhood: the school hall was also used for local activities. Its sheltered, pavilion-like spot at the edge of the estate, among greenery, is typical of the garden-city character of this part of Noord. Of the five, Mariëndaal 13 is the most intact, outside and inside. Demolition was decided for three others (Botterstraat 185, Volendammerweg 51 and IJdoornlaan 34), and the fourth was altered, so this may become the only one left. It was listed in 2020 and is now a children's day-care centre.
  category: schools
  lat: 52.402583
  lng: 4.941994
  address: Mariëndaal 13
  links:
    - { label: Monumentenregister Amsterdam (200926), url: "https://data.amsterdam.nl/monumenten/376f0dd9-3708-4b92-a942-12dc9d531c9d" }
