  nl:
    title: Keienmonument, Oostzanerdijk
    summary: "Op de helling van de oude zeedijk liggen weer keien, neergelegd in 2022 toen Tuindorp Oostzaan honderd werd. Vanaf ongeveer 1735 beschermden zulke stenen de dijk, nadat de paalworm de houten palen had opgevreten. Tot in de jaren vijftig haalden kinderen er hun knieën aan open."
    body: |
      Een houtetende worm bracht deze dijk in de problemen. De Oostzanerdijk achter Tuindorp Oostzaan is een stuk eeuwenoude zeedijk die het IJ buiten Oostzaan hield. Eerst lag er rietland voor de dijk als buffer, later een rij houten palen. Rond 1731 vrat de paalworm die palen op. Tussen 1735 en 1745 kreeg de dijk daarom een nieuwe helling, bekleed met zware stenen die de golven moesten breken. Alles wat zwaar genoeg was ging erin: zwerfkeien die het ijs uit Scandinavië had meegenomen, stukken van hunebedden, bouwpuin, oude stoepstenen en zelfs grafzerken. De polder was er 35.000 gulden aan kwijt.

      In 1872 werd het IJ afgesloten en daarna werd het land voor de dijk drooggelegd. De dijk had geen werk meer en werd het speelterrein van het dorp. Families lieten er hun foto maken, en ook verliefde stelletjes wisten de plek te vinden. In de jaren vijftig waren de keien ineens weg; waarheen weet niemand precies. Vanaf toen gleden kinderen 's winters met de slee van het gras, en 's zomers op een stuk karton.

      Voor het honderdjarig bestaan van Tuindorp Oostzaan zorgden het Historisch Archief en buurtorganisaties dat er weer een stuk keien kwam. Op 9 december 2022 werd het Keienmonument onthuld. De stenen komen van de Markermeerdijk bij Hoorn. Steenzetter Serge Ligthart ontwierp het monument en legde het ook zelf.
    sources:
      - https://nl.wikipedia.org/wiki/Keienmonument
      - https://www.historischarchief-toz.nl/2022-onthulling-stenen-monument/
      - https://www.agv.nl/nieuws/2022/december/oostzanerdijk-heeft-weer-noorse-keien/

# ================================================================ Oostzanerwerf and Kadoelen

- title: Zuideinde, Oostzanerwerf
  summary: "Three old houses on the Zuideinde in the former Oostzaner Overtoom, once a whaling port: a wooden aisled farmhouse, an 18th-century house of wood and stone, and a house listed for the smoke hood inside."
  body: |
    Before Amsterdam annexed it in 1966, Oostzanerwerf was the hamlet of Oostzaner Overtoom in the municipality of Oostzaan. In the Middle Ages it lay right on the IJ, with an overtoom (a ramp where barges were hauled over the dike) and a harbour that sent ships to the Baltic from the 16th century. In the 17th and 18th centuries it was a whaling port, the fifth in Holland by number of whalers, with ten to twelve try-works on the southern Twiske boiling blubber into lamp oil, plus shipyards and a sail loft. The overtoom was demolished in 1946. The Zuideinde runs through what was that hamlet.

    Three listed houses remain along it. Zuideinde 428-430 is an 18th-century house of two aisles under saddle roofs that end in pointed gables at the front, built partly in stone and partly in wood; this ensemble is pinned on it. Zuideinde 286 is a wooden farmhouse with three aisles, perhaps early 19th century or older, with a square cowshed under a high tiled saddle roof behind the living part. Zuideinde 335 was listed because of a smuiger inside, an old open hearth with a smoke hood.

    The Zuideinde also sheltered refugees. Between 1933 and 1939 about 75 Jews who had fled Germany, Poland and Eastern Europe found a temporary home in this neighbourhood and in Oostzaan, thirty of them at Zuideinde 443. Some left the country in time; 46 survived the war. Fajga Rozenszajn and her son Leo, born in Duisburg in 1935, hid in the house; Leo was murdered in Auschwitz on 7 July 1944, and when and where his mother died is not known. A bronze plaque on the side wall, at the corner of the Jacob Honigstraat, was unveiled on 28 April 2005.

    These are private homes; look from the road.

    Look for:
    - Zuideinde 428-430: the twin pointed gables, half stone, half wood
    - Zuideinde 286: the high tiled roof of the cowshed behind the wooden house
    - Zuideinde 335: the house itself (the smoke hood is inside)
    - Zuideinde 443: the plaque for the refugees on the side wall, by the Jacob Honigstraat
