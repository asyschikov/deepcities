  nl:
    title: Museum Amsterdam Noord
    summary: Het cultuurhistorisch museum van Noord, in het badhuis van Vogeldorp uit 1919, waar de bewoners van een dorp zonder badkamers om beurten douchten. Exposities over Noord, lezingen, films en rondleidingen.
    body: |
      Museum Amsterdam Noord is een cultuurhistorisch museum op de hoek van de Zamenhofstraat en de Meeuwenlaan. Het museum is sinds april 2009 gevestigd in het in 1919 gebouwde badhuis van Vogeldorp. De woningen in dit tuindorp hadden geen badkamer en dus was een badhuis noodzakelijk; vrouwen en mannen konden er afwisselend douchen.

      Het museum toont in twee vaste tentoonstellingen de geschiedenis van Amsterdam-Noord en de geschiedenis van Vogeldorp en het badhuis. Via wisselende tentoonstellingen worden onderwerpen uit heden, verleden en toekomst van Amsterdam-Noord uitgediept. Hier worden ook lezingen gehouden en films vertoond. Tevens organiseert het museum regelmatig rondleidingen door Amsterdam-Noord. Het Parool noemde het oude badhuis een van de vijf parels van Amsterdam-Noord tijdens de Open Monumentendag.

      Het museum is meestal van donderdag tot en met zondag 's middags open; kijk vooraf op de website.
    attributes:
      original_use: Badhuis van Vogeldorp
    sources:
      - https://nl.wikipedia.org/wiki/Museum_Amsterdam_Noord
      - https://nl.wikipedia.org/wiki/Vogeldorp
      - https://museumamsterdamnoord.nl/plan/

- title: Bethlehemkerk, Zwanenplein
  summary: An Amsterdam School church of 1923–1924, kept low so as not to tower over the workers' houses around it. Queen Wilhelmina came to the opening and gave a pulpit Bible.
  body: |
    The Reformed church came to the Vogelbuurt in 1924, replacing services held in a gym on the Havikslaan. The client, a society for Reformed interests north of the IJ, hired Adriaan Moen in 1919, and he had to keep the building's height in line with the surrounding housing. The answer is a small, free-standing brick church in the middle of the Zwanenplein lawn, with a tall central roof between two lower wings. Locally it was first called the Zwanenkerk; the name Bethlehemkerk was fixed only in April 1924.

    Queen Wilhelmina attended the opening on 13 September 1924 (squeezed into a tour of the harbour, with a fire brigade demonstration waiting) and presented a pulpit Bible. Two large stained-glass windows by H.J. Winkelman show the Annunciation to the Shepherds and the Magi. The bell cote on the roof ridge is drawn in horizontal lines, unusual in this style, and the east gable carries a stone plaque with a pentagram, Alpha, Omega and the Chi-Rho.

    The church closed as a Reformed church in 1993; a Full Gospel congregation and later a Hindustani-Surinamese community used it, and it lost its church function in 2015.

    Look for:
    - the bell cote with its horizontal bands
    - the plaque with Alpha, Omega and Chi-Rho in the east gable
    - the memorial stone in the west front
  category: religious
  lat: 52.387146
  lng: 4.918273
  address: Zwanenplein 34-36
  links:
