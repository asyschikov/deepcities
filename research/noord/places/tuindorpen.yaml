  nl:
    title: Voormalige kleuterschool De Wilde Wingerd
    summary: "Een flinke kleuterschool in Amsterdamse School-stijl uit 1926 aan de Kometensingel. De lokalen liggen op de zon, en boven de kapstokjes hangen nog de oorspronkelijke kleutertegeltjes."
    body: |
      Boven de kapstokjes hangen ze nog: de oorspronkelijke kleutertegeltjes.

      De Wilde Wingerd was een voorbereidende school, door Publieke Werken in 1926 getekend voor de allerkleinsten van Tuindorp Oostzaan. Het type heet corridorschool. Het gebouw heeft een L-vorm, twee verdiepingen en een hoog schilddak, en telde zes klaslokalen en twee grote speellokalen. De klassen liggen naast elkaar aan één kant van de gang en kijken op het zuiden. Ook de overdekte en de open speelplaats aan de voorkant liggen in de zon. Je gaat naar binnen op de hoek aan de Kometensingel, via een vestibule.

      In het monumentenregister krijgt de zorgvuldige Amsterdamse School-architectuur, buiten en binnen, alle lof. Dat ontwerp moest ook de arbeidersgezinnen een beetje verheffen. Bovendien is er veel origineels bewaard, zoals die kleutertegeltjes. In 1985 ging de kleuterschool dicht. Sindsdien gebruikt Buurtwerk Noord het pand, en beneden spelen weer peuters.

      Let op:
      - de hoekingang aan de Kometensingel
      - de ramen van de lokalen aan de kant van de speelplaats
      - het hoge schilddak
    attributes:
      original_use: Kleuterschool
    sources:
      - https://data.amsterdam.nl/monumenten/9bb8d0a2-0ca1-4a53-94c5-32b04cc88e82

- title: Former reading room, Kometensingel
  summary: A wooden public reading room of about 1924 under a big thatched roof with eyebrow windows, the garden village's own library. Part of its original interior survives.
  body: |
    Tuindorp Oostzaan got its own public reading room. The little building of about 1924 was designed by the housing department in consultation with the public library, and the Public Works service probably drew it.

    It is a wooden hall on a plastered, black-stained base, with walls of overlapping boards and a heavily overhanging thatched hipped roof. The thatch lifts over the bay windows on the long sides and is cut short at the ends for a band of windows; two vaulted "cuckoo" dormers sit in the roof. Three-sided bays with horizontally divided windows project from three sides. The entrance is a porch flanked by two short, black-stained brick walls with vertical grooves, with a simple panelled door and a pointed window. Parts of the interior are still original. The register values its prominent spot on the Kometensingel, where it shapes the street.

    Look for:
    - the thatched roof with its two curved dormers
    - the three-sided bays on the sides and back
    - the grooved porch walls and pointed door window
