  nl:
    title: Voormalige kleuterschool, Mariëndaal
    summary: "De gaafste van vijf identieke paviljoenkleuterscholen uit 1968 van Evers en Sarlemijn in de Buikslotermeer: een lesvleugel en een schoolzaal aan een schoolplein, uit de tijd dat het kind centraal kwam te staan."
    body: |
      Mariëndaal 13 is van hoge architectuurhistorische waarde vanwege de periodekarakteristieke vormgeving, de kwaliteit van het ontwerp en de bijzondere typologie. Het is een eenvoudig gebouw dat uitgekiend is opgezet, met een heldere vormgeving, een krachtige belijning en een zorgvuldige gevelcompositie. De oorspronkelijke opzet (een lesvleugel met schoolzaal aan een schoolplein) is nog gaaf intact en goed afleesbaar. Vanwege de afwijkende, functionalistische vormgeving neemt het ontwerp binnen het oeuvre van Evers en Sarlemijn een bijzondere plaats in.

      De beschutte ligging van het paviljoenachtige schoolgebouw aan de rand van de wijk en het groen rondom zijn kenmerkend voor het tuinstedelijke karakter van de wijk. Het gebouw is van cultuurhistorische waarde als onderdeel van het scholencluster in de Buikslotermeer en vanwege de toenmalige ideeën over onderwijs, waarbij het kind meer centraal gesteld werd. Het gebruik van de schoolzaal voor activiteiten uit de buurt paste in de wijkgedachte uit die tijd.

      Mariëndaal 13 maakt deel uit van een serie van vijf in oorsprong identieke schoolgebouwen, waarvan het het meest gaaf bewaard is gebleven. Voor drie van de vijf kleuterschooltjes (Botterstraat 185, Volendammerweg 51 en IJdoornlaan 34) ligt er een sloopbesluit; de vierde, Spelderholt 167, is verbouwd. Mariëndaal 13 zal op termijn dus mogelijk als enige behouden blijven. Het gebouw is nu een kinderdagverblijf.
    attributes:
      architect: A. Evers en G.J.M. Sarlemijn
