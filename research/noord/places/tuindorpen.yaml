  nl:
    title: Brandspuithuisje, Kometensingel
    summary: "Een piepkleine betonnen garage uit 1922 voor de brandspuitkar van het tuindorp, met een stalput voor het paard dat hem trok. Echt nodig was hij niet: in 1925 werd hij al verhuurd aan de Reinigingsdienst."
    body: |
      Een brandspuithuisje dat al na drie jaar werd verhuurd aan de vuilnisdienst: zo hard was het kennelijk niet nodig. De tuindorpen in Noord werden opgezet als half zelfstandige enclaves met eigen voorzieningen. Tuindorp Oostzaan kreeg een badhuis, een bibliotheek, een verenigingsgebouw, een wijkpost voor de beplanting en dit brandspuitgebouw. Het monumentenregister noemt het een wonderlijk bouwwerkje. Binnen stonden de brandspuitkar en een klein werkplaatsje. Halverwege de zijmuur zat een stalput voor het paard dat de kar trok. Al in 1925 nam de gemeentelijke Reinigingsdienst het gebouw in huur.

      Publieke Werken tekende het in 1922, met een landelijk uiterlijk: een groot dak, zwaar aangezette hoeken en naast de ramen en deuren een reliëf van groeven. Het is ook een van de vroege proeven met beton van de Woningdienst. De muren zijn van donkergrijs geverfd beton, en het meeste is nog zoals het was. Het huisje staat schuin op de kronkelende Kometensingel, maar precies in de lijn van het straatje naar het Plejadenplein. Zo verbindt het ongemerkt de rijtjeshuizen aan de ene kant met de drie villa's aan de andere, de enige die het tuindorp heeft.

      Let op:
      - het grote dak op het kleine betonnen doosje
      - de groeven naast de deuren en ramen
      - de schuine stand ten opzichte van de straat
    attributes:
      original_use: Brandspuitgebouw
    sources:
      - https://data.amsterdam.nl/monumenten/a45cc7e7-6e43-439b-bdae-708805f61994

- title: Doctor's house and teachers' villas, Kometensingel
  summary: "Villa-like houses in Tuindorp Oostzaan, at the foot of the old Oostzaner dike: a free-standing doctor's house with its own surgery entrance and two semi-detached pairs for the middle class, known as the teachers' houses, all of 1924–1925."
  body: |
    Where the garden village meets the old rural dike, the housing department placed something other than workers' homes: a free-standing doctor's house (no. 187) and, next to it, four middle-class homes in two semi-detached pairs (nos. 179-185) by B.T. Boeyinga, an important architect for Noord. Together they mark the transition from the old buildings on the Oostzanerdijk to the new village.

    The doctor's house of 1924–1925 has a high hipped roof, a three-sided wooden bay with garden doors on the west side, a balcony under a wide overhanging canopy, and, on the east side, a separate entrance to the practice, with the consulting room on one side and the waiting room on the other. Brick below and wooden boarding above combine a pared-down Amsterdam School with rural touches. The four villas next door follow almost the same design. Today the houses lie hidden in greenery; the long school that once separated the Plejadenplein and the Orionplantsoen has gone. This ensemble is pinned on the doctor's house.

    These are private homes; look from the Kometensingel.

    Look for:
    - the separate practice entrance on the east side of no. 187
    - the balcony with its green and white balustrade
    - the tall chimneys built into the corners
