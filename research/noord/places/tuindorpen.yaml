# Oostzanerwerf, Kadoelen, Buikslotermeer and Banne Buiksloot (Buiksloterkerk, d'Admiraal).
# All 43 records in slices/tuindorpen.json are used exactly once (see notes/tuindorpen.md),
# plus six scouted non-monument places (see notes/tuindorpen.md).
