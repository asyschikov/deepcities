  nl:
    title: Poort van Nieuwendam
    summary: "Rond 1999 liet Marcel Smink honderd meter oude Zuiderzeeweg uit de jaren dertig opkrullen tot een gedraaide poort van zes meter waar de weg ophoudt. Pas later werd hij gezien als stadspoort, de eerste van Noord. BMX'ers gebruiken hem als schans."
    body: |
      Wie bij de Zuiderzeeweg van de ring A10 afkomt, ziet een beklinkerde weg die via een talud omhoogloopt naar een gedraaide betonnen poort en daar ophoudt. Kunstenaar Marcel Smink (1967) vond naast de nieuwe weg asfaltresten van de oude Zuiderzeeweg, aangelegd in de jaren dertig, en liet zo'n honderd meter daarvan bestraten en opkrullen tot de poort: de weg krult op zodat je met de auto niet verder kunt, en als voetganger word je gedwongen om je heen te kijken. Smink dacht in die tijd veel na over hoe het verkeer de openbare ruimte bepaalt; hier kom je net de ring af geracet en sta je aan het begin van een woonwijk.

      Buurtbewoners van Markengouw en Werengouw waren er eerst niet blij mee, maar toen het eenmaal stond, verstomde bijna alle kritiek. Het heette eerst *Poort van Noord* en kreeg later de naam van Tuindorp Nieuwendam; de uitleg als stadspoort, met een knipoog naar de oude Amsterdamse poorten en de poortgebouwen van de tuindorpen, is er pas later aan toegevoegd. Noord, een relatief jong stadsdeel, heeft nooit een echte gehad.

      Rond 2011 werd de kruising omgebouwd tot rotonde en wilde de gemeente het werk weghalen. Smink liet zien dat het anders kon worden ingepast, en nu staat het nog dichter tegen de weg, tussen rijbaan en fietspad, als een oprit naar een nooit gebouwd viaduct. Door de dubbele draaiing lijkt de poort aan één kant te verzakken. BMX'ers gebruiken hem als schans voor salto's, iets waar Smink naar eigen zeggen nooit op had gerekend.

      Let op:
      - de klinkers die over het talud de poort in lopen
      - de dubbele draaiing waardoor de poort lijkt te verzakken
      - het abrupte einde bovenaan
    attributes:
      built: "ca. 1999; verplaatst ca. 2011"
    sources:
      - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/352
      - https://nl.wikipedia.org/wiki/Poort_van_Nieuwendam

- title: Flyways (Harmen Liemburg), metro station Noord
  summary: The platform floor of metro station Noord is a 130-metre bird encyclopedia cut into tiles. Geese from Scandinavia land at the north end, Africa-bound migrants leave from the south end, and a godwit chick sits in a ditch in between.
  body: |
    Thousands of people cross the platform of the Noord-Zuidlijn's northern terminus every day, and few look down. Under their feet, white lines on anthracite tiles draw a whole story of migrating birds over 130 by 13 metres. Artist Harmen Liemburg, a graphic designer with a background in cartography, thought of his bike rides into Waterland and Het Twiske, where migrants return from the south in spring and Scandinavian geese graze the polders in winter. He saw a parallel with the passengers: commuters changing from bus to metro, Noorderlingen, tourists.

    So the floor reads like a comic strip from north to south: geese arriving at the north end, resident birds of the reeds and polders in the middle, birds heading for Africa at the south end. Swift, great crested grebe, mute swan, heron and pigeon are there, and in places where he had room Liemburg zooms in, to a goose's head or a huge godwit chick in a farm ditch, seen through the sharp eyes of a bird of prey. Every white shape was cut with a water jet and inlaid by hand into its dark tile; no line could be thinner than 20 mm. The station opened with the line in July 2018.

    The station around it is by Benthem Crouwel: a 132-metre island platform on a viaduct in the middle of the Nieuwe Leeuwarderweg, cut through by five voids and covered by a roof 16 metres high. Together with the line's six other stations by the same architects, it won both the BNA Best Building of the Year and the Golden AAP, the Amsterdam architecture prize, in 2019.

    Look for:
    - the geese at the north end of the platform
    - the godwit chick in the ditch
    - the swift and the grebe, and the openings to the bus station below
    - the long roof over the platform, seen from the bus station
