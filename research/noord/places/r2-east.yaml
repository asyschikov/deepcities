  nl:
    title: Observatorium (Marinus Boezem)
    summary: Op een heuvel acht meter boven het Buikslotermeerpark ligt een granieten chaise longue naar Le Corbusier, met in de sokkel de Melkweg en de noordelijke sterrenhemel. Achteroverleunen en omhoogkijken, als je koude steen niet erg vindt.
    body: |
      Een klinkerpad loopt omhoog naar de top van een heuvel in het Buikslotermeerpark, zo'n acht meter boven de grasvelden. Daar staat een ligstoel van graniet, naar de beroemde *chaise longue* van Le Corbusier, de grondlegger van de moderne architectuur waarop deze wijk is geïnspireerd. In de sokkel staat een kaart van de Melkweg en de noordelijke sterrenhemel, voor wie vergeten is waar de sterren staan. Het werk nodigt uit om achterover te liggen en naar de hemel te kijken, al ligt graniet niet bepaald zacht.

      Marinus Boezem (1934) wordt met Jan Dibbets en Ger van Elk gezien als een van de kunstenaars die de conceptuele kunst in Nederland op gang brachten. In 1960 stelde hij een stuk polder tentoon als readymade; zijn bekendste werk is de Groene Kathedraal bij Almere, 178 populieren op de plattegrond van de kathedraal van Reims. Hemel, licht, lucht en gotische kathedralen keren steeds terug in zijn werk, en komen hier samen in één stoel op een heuvel. Het Observatorium is uit 1992.

      De heuvel is een herkenningspunt op alle drie de wandelroutes vanaf metrostation Noord.

      Let op:
      - de Melkweg en de noordelijke sterrenbeelden in de sokkel
      - de plaquette aan de voet van het werk
    sources:
      - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/331
      - https://nl.wikipedia.org/wiki/Marinus_Boezem
      - https://www.wandelnetwerknoordholland.nl/startpunten/metro-noord/2365

- title: Tajiri's Ontmoetingsplaats and Van Kruiningen's mosaics, Het Breed
  summary: A white concrete amphitheatre by Shinkichi Tajiri, meant as a meeting place for the 1960s high-rise, that neighbours threatened to tear down and that never became a social heart. Nearby, in a tower's entrance hall, mosaics by a communist forger of the war.
  body: |
    On the Breedveld, among Frans van Gool's long slabs of the 1960s, lies Shinkichi Tajiri's *Ontmoetingsplaats* (Meeting place): broad white concrete steps with a few patches of red asphalt, a curved back and a sunken seating pit behind. Tajiri, a child of Japanese immigrants who lived through parts of the Second World War and settled in the Netherlands in 1956, meant it as a small amphitheatre where neighbours would sit, talk and understand one another, and as proof that art is for ordinary people.

    The neighbours saw it otherwise. Commissioned in 1971, it was held up by protest: unfriendly to children, too expensive, and why not a local artist? Some threatened to break it down themselves. It finally went up in 1976, was used mainly by teenagers who lit fires in the pit, was renovated in 2013–2014 and now lies mostly empty, a symbol of lost ideals. The estate around it, Plan Van Gool, has its own place.

    Some 250 metres east, the entrance hall of the tower Het Breed 701–939 has two abstract mosaics in Venetian glass of 1982 by Harry van Kruiningen (pseudonym of Henri Janssen), who lived on Het Breed. A communist, he forged identity papers for the resistance on his litho press. He made only a few monumental works, which is why the city rates these as valuable.

    Look for:
    - the stepped white terraces and the half-moon backrest
    - the sunken pit behind the steps
    - Van Kruiningen's mosaics, seen through the entrance of Het Breed 701 (residents' hall)
  category: street-art
