  nl:
    title: Lloyd Hotel en het Lloyd-complex
    summary: "Gebouwd voor landverhuizers op weg naar Zuid-Amerika, veelal Joden op de vlucht uit Oost-Europa, die eerst hiernaast werden ontluisd voor ze een bed kregen. Daarna vluchtelingenopvang, oorlogs- en jeugdgevangenis, ateliers en weer hotel."
    body: |
      Voor je hier mocht slapen, ging je eerst onder de douche en je kleren door de ontluizing. Het Lloyd Hotel was geen hotel voor toeristen, maar een wachtkamer voor emigranten.

      De Koninklijke Hollandsche Lloyd (KHL) voer van Amsterdam naar de oostkust van Zuid-Amerika. In 1915 trok de rederij naar de Oostelijke Handelskade en liet daar door Evert Breman een eigen bedrijfswijk bouwen, in expressionistische baksteen met Duitse inslag: een kantoor (1915-1917), blokken dienstwoningen netjes naar rang (vier huizen voor chefs, twaalf voor onderchefs, twaalf etagewoningen voor vaste werklieden), een koffiehuis (1916) met aparte ruimten voor kantoorpersoneel en voor bootwerkers en lager scheepsvolk, en als pronkstuk een hotel voor landverhuizers.

      Het hotel, voor maximaal 900 mensen, werd op 1 juni 1921 opgeleverd. Het had acht keer zoveel gekost als begroot, wat waarschijnlijk meehielp aan de ondergang van de rederij. Van 1921 tot 1936 wachtten hier duizenden emigranten, veel van hen arme Oost-Europese Joden die voor pogroms waren gevlucht, op de boot naar Zuid-Amerika, die eens in de drie weken ging. Gemeentelijke artsen en verpleegsters keken ze na op ziektes en luizen; in het ontsmettingsgebouw (1920-1923) achter het hotel, via gangen ermee verbonden, douchten ze terwijl hun kleren en bagage werden ontluisd, in ruimtes streng gescheiden in "vuil" en "schoon".

      In 1936 ging de KHL failliet. Vanaf 1938 ving de staat er Joodse vluchtelingen uit nazi-Duitsland op. In de oorlog werd het Huis van Bewaring III; zo'n 150 mannen die na de Februaristaking van 1941 waren opgepakt, zaten hier vast. Ook na de oorlog bleef het een gevangenis, vanaf 1963 voor jongeren, tot 1989. Na jaren van verval en ateliers leidde een prijsvraag in 1996 tot een hotel als "culturele ambassade", in schetsen uitgewerkt door MVRDV, open van 2004 tot 2021. Sinds september 2023 heet het The Hoxton, Lloyd Amsterdam.

      Let op:
      - de achtkantige toren met keramische wijzerplaten boven de ingang
      - de diepe luifel op gebeeldhouwde consoles, afgezet met lood
      - de stompen van de verbindingsgangen aan de westkant van het ontsmettingsgebouw (Rietlandpark 371-401)
      - het koffiehuis op nummer 44, met erker en vlaggenmasten
      - het ritme van traveeën en topgevels van de dienstwoningen op 14-32 en 36-42
    attributes:
      original_use: Landverhuizershotel, ontsmettingsgebouw, kantoor, dienstwoningen en koffiehuis
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/523289
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/523292
      - https://nl.wikipedia.org/wiki/Lloyd_Hotel_(hotel)
      - https://nl.wikipedia.org/wiki/Koninklijke_Hollandsche_Lloyd

- title: KNSM staff houses, Oostelijke Handelskade
  summary: "A quiet row of 1912 company houses with shutters and little bay windows, built by the KNSM shipping line, probably for workers who had to be on call, designed by housing reformer J.H.W. Leliman in an English Arts and Crafts spirit."
  body: |
    The docklands were not meant for housing, which is why the register thinks these homes were for men the KNSM needed close by. In 1912–1913 the Koninklijke Nederlandsche Stoomboot Maatschappij (KNSM), which had moved to the KNSM-eiland in 1903, built this symmetrical row at the eastern end of the Oostelijke Handelskade, probably for workers or foremen who could be called in at short notice.

    The architect, J.H.W. Leliman (1878–1921), co-founded the heritage society Bond Heemschut, founded the magazine De Bouwwereld and was a reformer of workers' housing who disliked empty monumentality. The row is three blocks, the outer two pushed forward as pavilions, with two storeys and an attic under hipped roofs. Every home has its own front door, paired with a neighbour's. The English influence shows in the shutters, the small-paned fanlights, the dormer gables, the little ground-floor bays and the half-timbered corner bays. The front survives almost intact; the back was altered in a 1990s renovation.

    Look for:
    - the wooden shutters on the lower window sashes
    - the half-timbered corner bays on the inner corners of the pavilions
    - the four small bay windows with tiny hipped roofs
    - the paired front doors under segmental arches
  category: housing
  lat: 52.373906
  lng: 4.936637
  address: Oostelijke Handelskade 46-66
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/c233ea73-9bf6-459d-9f87-a1cf895aa69a" }
    - { label: Wikipedia (nl) KNSM-eiland, url: "https://nl.wikipedia.org/wiki/KNSM-eiland" }
