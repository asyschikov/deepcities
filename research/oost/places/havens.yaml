  nl:
    title: Kraan 2868
    summary: "De enige kraan die buurtbewoners redden toen de KNSM-kades werden leeggeruimd: een Figee-wipkraan uit 1957 met een scharnierend contragewicht. In Friesland omgebouwd tot gastenverblijf staat hij op een restant kraanspoor."
    body: |
      Je kunt slapen in een havenkraan. Kraan 2868 is de laatste van een hele rij en wordt nu verhuurd als appartement.

      Vroeger stond de Surinamekade vol kranen en loodsen. In 1944 vernielden de Duitsers de kranen, zodat ze na de oorlog allemaal vervangen moesten worden. Kraan 2868 werd in 1957-1958 voor de KNSM gebouwd door de Haarlemsche Machinefabriek van de gebroeders Figee, een bedrijf dat in 1836 begon als timmerwerkplaats voor pakkisten en in 1871 zijn eerste stoomkraan maakte. Het is een wipkraan: de giek gaat op en neer terwijl de last op dezelfde hoogte blijft, en het handelsmerk van Figee is het scharnierende contragewicht. Hij werkte tot 1979, toen de KNSM ermee stopte.

      Toen het gebied vanaf 1989 werd vrijgemaakt voor woningbouw, gingen alle kranen naar de sloop, op deze na: buurtbewoners overtuigden de gemeente er één te bewaren als "lieu de mémoire". In 2011 werd hij gemeentelijk monument, mede op verzoek van Heemschut en het Cuypersgenootschap. Tussen 2016 en 2017 werd hij in Franeker omgebouwd tot gastenverblijf, ontworpen door Edward van Vliet, in de twee machinehuizen en de cabine van de kraandrijver. Er kwamen extra trappen en verlichting bij, maar verder is hij zo origineel mogelijk gebleven. Hij wordt verhuurd voor korte verblijven.

      Let op:
      - het scharnierende contragewicht achter de cabine
      - de gestapelde houten machinehuizen
      - het stuk kraanspoor waar hij op staat, en het scheepsanker ernaast
    attributes:
      original_use: Havenkraan van de KNSM
    sources:
      - city register text 200634
      - https://nl.wikipedia.org/wiki/Kraan_2868

- title: Former KNSM canteen, Levantplein
  summary: "A glass box floating on steel stilts over the Levantplein, where KNSM staff ate and watched plays. Probably the only known building by a founder of the famous architects' group De 8, it now holds live-work studios."
  body: |
    This was the staff restaurant of the KNSM: one long, glazed room held up on a grid of steel columns and wedged between two brick blocks, the larger of which held the entrance stair, the cloakroom and the kitchen. The canteen was also used for plays and other performances, very much in the spirit of the 1950s. The register text dates it to 1959–1960 (the register's summary says 1954).

    The architect, P.J. Verschuyl of Hilversum, is a mystery. A P.J. Verschuyl was one of the founders of the famous architects' group De 8 in 1927, but left a year later to join his father's villa practice. If he is the same man, this canteen, with its transparent walls and visible structure straight out of the pre-war modernist book, is the only known building of a De 8 founder who stayed out of sight for a quarter of a century.

    In 1991 the canteen was split into eight studios, formally live-work spaces since 2001, reached by new open iron stairs from below. The interior of the canteen is gone, but the exterior is largely intact.

    Look for:
    - the light-blue steel window frames along both long sides
    - the steel H-columns on hexagonal concrete bases, the open space underneath
    - the orange-red extruded brick and gravel-concrete panels
    - the floor tiles with dark diamond borders at the old main entrance
