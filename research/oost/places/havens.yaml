  nl:
    title: Hydraulische centrale, Oostelijke Handelskade
    summary: "De kranen op deze kade draaiden ooit op water. Vanuit deze centrale uit 1885 werd water onder 50 atmosfeer druk door buizen naar de kranen, kaapstanders en de grote mastbok gepompt. Tot 1951 deed het gebouw dienst voor de haven."
    body: |
      Toen de Oostelijke Handelskade openging, werkten de kranen nog niet op stroom. Publieke Werken bouwde daarom in 1885 voor het Gemeentelijk Havenbedrijf deze krachtcentrale, onder leiding van stadsarchitect B. de Greef en zijn assistent W. Springer; P.W.C. de Graaf ontwierp de machines. Twee stoommachines en zes ketels persten water op tot 50 atmosfeer en joegen het door een stelsel van buizen naar de loop- en wandkranen, de kaapstanders, de verrijdbare hijstoestellen en de vaste mastbok op de kade. Die waterdruk zette de cilinders van kranen en lieren in beweging.

      Het gebouw bestaat uit een lang ketelhuis met dwars daarop een machinehal, allebei met een verhoogde lichtkap op de nok. De stijl is zakelijk en eclectisch: banden van natuursteen, boogfriezen van gele baksteen en hier en daar een kleuraccent. In 1899, toen de centrale al elektrisch was, kwam er een vleugel bij in dezelfde stijl. In 1951 werd het een gelijkrichterstation, Havencentrale Oost. De opzichterswoning en het accumulatorgebouw zijn gesloopt. Later trok er een nachtclub in, Club Panama.

      Let op:
      - de roosvensters hoog in de kopgevels van de machinehal
      - de boogfriezen die in de zijvleugels naar het midden toe oplopen
      - de traceringen met visblaasmotief in de vensters aan de noordkant
      - de lichtkap over de nok
    attributes:
      architect: B. de Greef en W. Springer (Publieke Werken)
      original_use: Hydraulische centrale voor de havenkranen
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/523311
      - https://amsterdamopdekaart.nl/1850-1940/Oostelijke_Handelskade/Krachtcentrale

- title: Lloyd Hotel and the Lloyd complex
  summary: Built for emigrants bound for South America, mostly Jews fleeing Eastern Europe, who were deloused next door before they could check in. Since then a refugee shelter, a wartime and youth prison, artists' studios and a hotel again.
  body: |
    The Koninklijke Hollandsche Lloyd (KHL) ran ships from Amsterdam to the east coast of South America. In 1915 it moved to the Oostelijke Handelskade and built a whole company quarter there to designs by Evert Breman, in a German-influenced expressionist brick style: an office building (1915–1917), blocks of staff houses ranked by status (four houses for chiefs and twelve for sub-chiefs; twelve flats for permanent workers), a coffee house (1916) with separate rooms for clerks and for dockers and lower crew, and, as its showpiece, a hotel for emigrants.

    The Lloyd Hotel, for up to 900 people, was completed on 1 June 1921. It had cost eight times the estimate, which probably helped sink the company. From 1921 to 1936 thousands of emigrants, many of them poor Eastern European Jews who had fled pogroms, waited here for the ship to South America that left every three weeks. Municipal doctors and nurses checked them for disease and lice; in the disinfection building (ontsmettingsgebouw, 1920–1923) behind the hotel, linked to it by corridors, they showered while their clothes and luggage were deloused, in rooms strictly divided into "dirty" and "clean".

    The KHL went bankrupt in 1936. From 1938 the state used the hotel to house Jewish refugees from Nazi Germany. In the war it became a prison, Huis van Bewaring III; about 150 men arrested after the February Strike of 1941 were held here. It stayed a prison after the war, for juveniles from 1963 until 1989. After years of neglect and artists' studios, a 1996 competition led to a "cultural embassy" hotel, sketched out by MVRDV, open 2004–2021. Since September 2023 it has been The Hoxton, Lloyd Amsterdam.

    Look for:
    - the octagonal tower with ceramic clock faces above the entrance
    - the deep entrance canopy on carved brackets, edged in lead
    - the stubs of the connecting corridors on the west side of the disinfection building (Rietlandpark 371-401)
    - the coffee house at number 44, with its bay window and flagpoles
    - the rhythm of bays and gables of the staff houses at numbers 14-32 and 36-42
