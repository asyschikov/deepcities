  nl:
    title: Wachtlokaal, koffiehuis en brug 352 bij het entrepot
    summary: "Drie kleine overblijvers van het gemeentelijke handelsentrepot van rond 1900, bij de sluis aan de Cruquiusweg: een wachtlokaal met veranda, een koffiehuis van de drankbestrijders en een brug met het bouwjaar in een lantaarn gegoten."
    body: |
      Bier was hier niet de bedoeling. Het koffiehuis op Cruquiusweg 9 (1902) werd gerund door de Volksbond tegen Drankmisbruik, net als het koffiehuis bij het oude entrepot aan het Kadijksplein. Op de schuine hoek zat een café, daarachter een koffiekamer, en boven woonde de beheerder.

      In 1899 groef de stad een kort kanaal van de Nieuwe Vaart naar haar nieuwe entrepotdok, het Nieuwe Entrepotdok (nu Entrepothaven), met een sluis waar het kanaal de Cruquiusweg kruist. In een entrepot konden goederen zonder invoerrechten liggen tot ze verder verkocht werden; langs de Cruquiusweg stonden zeven pakhuizen met de namen van de weekdagen. Publieke Werken zette bij de ingang een groepje gebouwtjes neer, met vakwerk en een vleugje chaletstijl, volgens nl.wikipedia van de hand van Hendrik Leguyt.

      Cruquiusweg 3 (1901) was het wachtlokaal: twee afrekenlokalen, een wachtruimte en aan de oostkant een veranda om nog meer mensen te laten wachten. Een paar meter verderop stond een politiepost, die is gesloopt. Het koffiehuis ligt aan de andere kant van de vroegere ingang. In beide panden kun je nu eten en drinken.

      Brug 352 (1899) brengt de Cruquiusweg over de noordelijke deuren van de sluis. Het is een liggerbrug, toen modern, met negentiende-eeuwse lantaarns en leuningen van giet- en smeedijzer, geleverd door F. Rincker. In 2014 kreeg de brug een nieuw dek, en kwamen de oude leuningen en vier lantaarns terug. Tot 2016 heette ze onofficieel Jaap Hannesbrug, naar een verdwenen buurtschap en bolwerk.

      Let op:
      - het bouwjaar in een van de lantaarns van de brug
      - de sluisdeuren onder de brug
      - de veranda aan de oostkant van nummer 3
      - de caféingang op de afgeschuinde hoek van nummer 9
    attributes:
      original_use: Wachtlokaal, volkskoffiehuis en sluisbrug van het handelsentrepot
    sources:
      - https://amsterdamopdekaart.nl/1850-1940/Cruquiusweg/3
      - https://amsterdamopdekaart.nl/1850-1940/Cruquiusweg/9
      - https://nl.wikipedia.org/wiki/Brug_352

- title: Vettewinkel paint factory
  summary: A 1958 paint works whose exposed concrete frame swells into fat knots where columns meet beams, an early, slightly stubborn hint of brutalism. Paint was made on the site until 2008; now it holds workspaces, with two floors of homes on top.
  body: |
    The Vettewinkels were house painters in the 19th century. In 1918 the family firm became a varnish and paint maker, the N.V. Vernis en Verffabriek voorheen Vettewinkel en Zonen, and in 1934 it moved to this spot on the Cruquius island, where G.J. Langhout designed its first buildings. In 1955 the office of the brothers G.J. and A.J. Langhout, architects and structural engineers (G.J. designed the Telegraaf building on the Nieuwezijds Voorburgwal with J.F. Staal), drew this production block; it was built in 1958, one storey taller than planned.

    The concrete is the point. The cream-painted frame is left in full view, filled in with brick parapets and wide steel windows of twenty panes, and where columns meet floor beams it thickens into heavy, projecting knots. That expressive touch pulls the building away from plain functionalism towards the brutalism that was only just appearing, rare for its time, the city judged when it listed it in 2012.

    The firm became part of Sigma Coatings, and paint was made here until 2008. Around 2020 the factory was restored and given two extra storeys of homes on a steel frame; the floors below are workspaces for creative firms again. You see it best from the Cruquiusweg, which bends around it.

    Look for:
    - the swollen concrete knots at every column and beam
    - the two new storeys of homes on top
    - the vertical strip of loading doors in the north and south fronts
  category: industrial
  lat: 52.367889
  lng: 4.952663
  address: Cruquiusweg 102A
  links:
