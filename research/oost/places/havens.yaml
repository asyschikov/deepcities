    rank: Nice
    heritage_status: Municipal monument
    monument_number: "200635"
    built: c. 1920–1925; hall 1956, entrance 1960
    architect: J.G. and A.D. van Gendt (shed); Johan van Tienhoven (hall)
    listed: 2012
    original_use: Harbour shed and passenger terminal of the KNSM
  photos:
    - commons:File:2023 Amsterdam, KNSM-eiland, Loods 6 (04).jpg
    - commons:File:2024 KNSM-eiland, Loods 6, entree Kompaszaal (01).jpg
  sources:
