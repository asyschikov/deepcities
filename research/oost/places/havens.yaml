  nl:
    title: Pakhuis de Zwijger
    summary: "Een koelhuis uit 1934 voor bederfelijke waren, waar in 2001 een brug dwars door de derde en vierde verdieping werd gelegd. De sloop bleef uit; nu is het een debathuis met zo'n 600 programma's per jaar over de toekomst van het dagelijks leven."
    body: |
      Auto's en fietsers rijden hier dwars door een pakhuis heen. Toen de Jan Schaeferbrug naar het Java-eiland werd gepland, lag De Zwijger precies in de weg, en sloop dreigde. Uiteindelijk ging de brug door een gat in de derde en vierde verdieping, in 2001 open, en bleef het pakhuis staan.

      De Oostelijke Handelskade stond vol vemen. De Zwijger is een koelhuis, gebouwd in 1933–1934 voor de N.V. Blauwhoedenveem-Vriesseveem, getekend door J. de Bie Leuveling Tjeenk en K. Bakker in een zakelijke, expressionistische stijl. Binnen staat een betonskelet met achtkantige kolommen die naar boven smaller worden, en paddenstoelvloeren. De betonnen buitenmuren hebben een baksteenhuid van elf centimeter, die bij de bouw dienstdeed als buitenbekisting. Het blokverband moest de massa lichter laten lijken. De bovenste verdiepingen kragen uit op zware consoles die je gewoon ziet.

      Na de brug restaureerde Stadsherstel Amsterdam het gebouw. In september 2006 ging het weer open, door André van Stigt verbouwd tot huis voor culturele organisaties. De stichting Pakhuis de Zwijger maakt er, en op andere plekken, zo'n 600 programma's per jaar over hoe we in de toekomst leven, in de stad en daarbuiten.

      Let op:
      - de weg en het fietspad dwars door het gebouw
      - de zandstenen plaquettes met blauw mozaïek op de blinde oostgevel, met de steden waar het Blauwhoedenveem zat: Amsterdam, Rotterdam, Londen, Hamburg, Bremen, Bazel, New-York en Batavia
      - de naam "De Zwijger" op beide laadkanten
      - de gestapelde laaddeuren met valbruggen aan de waterkant
      - het zaagtanddak dat de monsterzolders licht gaf
    attributes:
      original_use: Koelhuis
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/523312
      - https://nl.wikipedia.org/wiki/Pakhuis_de_Zwijger

- title: Het Licht van Jan
  summary: A light work in the rail underpass opposite Pakhuis de Zwijger that throws cold white grids, shadows and moiré patterns at passers-by after dark, based on alderman Jan Schaefer's famous question about whether a policy had actually been thought through.
  body: |
    Jan Schaefer (1940–1994) was an Amsterdam politician and alderman; the bridge from the Piet Heinkade to the Java-eiland is named after him. One of his lines is still quoted: "Is dit beleid of is hier over nagedacht?" ("Is this policy, or has someone actually thought about it?").

    The media artist Matthias Oostrik turned that question into light in the railway underpass of the Kattenburgerstraat, opposite Pakhuis de Zwijger. Projectors throw grids, shadows and moiré patterns on the walls and floor in cold white light, sharp against the orange street lamps, and the patterns react to the people walking through. Oostrik designs installations that respond to passers-by, add to a feeling of safety and are made to last. It is only worth seeing in the evening.

    The underpass lies right on the borough line: the pin, under the tracks, is in Oost, and the southern exit leads into Centrum.

    Look for:
    - patterns that shift when you walk through
    - the contrast of white light with the orange street lighting
    - the Jan Schaeferbrug passing through Pakhuis de Zwijger just to the north
  category: street-art
  lat: 52.375760
  lng: 4.921480
  address: Kattenburgerstraat, rail underpass at the Piet Heinkade
  links:
    - { label: Stadscuratorium, url: "https://stadscuratorium.nl/collectie/het-licht-van-jan/" }
    - { label: Wikipedia (nl) Jan Schaeferbrug, url: "https://nl.wikipedia.org/wiki/Jan_Schaeferbrug" }
  attributes:
    rank: Okay
    built: "2021"
    artist: Matthias Oostrik
  sources:
    - https://stadscuratorium.nl/collectie/het-licht-van-jan/
    - https://nl.wikipedia.org/wiki/Jan_Schaeferbrug
    - OSM ways 7046237 / 678935238 (Kattenburgerstraat under the railway) and the city's stadsdelen layer for the borough check
  nl:
    title: Het Licht van Jan
    summary: "Een lichtkunstwerk in de spooronderdoorgang tegenover Pakhuis de Zwijger dat na het donker koude witte rasters, schaduwen en moirépatronen over voorbijgangers werpt, gebaseerd op de beroemde vraag van wethouder Jan Schaefer of er over een beleid wel was nagedacht."
    body: |
      "Is dit beleid of is hier over nagedacht?", vroeg wethouder Jan Schaefer (1940-1994) ooit, en de zin wordt nog steeds aangehaald. Onder het spoor bij Pakhuis de Zwijger is hij licht geworden. De brug van de Piet Heinkade naar het Java-eiland draagt zijn naam.

      Mediakunstenaar Matthias Oostrik maakte van die vraag een lichtwerk in de spooronderdoorgang van de Kattenburgerstraat, tegenover Pakhuis de Zwijger. Projectoren zetten rasters, schaduwen en moirépatronen op muren en vloer, in koud wit licht dat scherp afsteekt tegen de oranje straatlantaarns, en de patronen reageren op wie erdoorheen loopt. Oostrik ontwerpt installaties die inspelen op voorbijgangers, het gevoel van veiligheid vergroten en lang mee moeten gaan. Alleen 's avonds is het de moeite.

      De onderdoorgang ligt precies op de stadsdeelgrens: de pin, onder het spoor, valt in Oost, en de zuidelijke uitgang komt uit in Centrum.

      Let op:
      - de patronen die verschuiven als je erdoor loopt
      - het contrast tussen het witte licht en de oranje straatverlichting
      - de Jan Schaeferbrug die er net ten noorden dwars door Pakhuis de Zwijger loopt
    sources:
      - https://stadscuratorium.nl/collectie/het-licht-van-jan/
      - https://nl.wikipedia.org/wiki/Jan_Schaeferbrug

- title: Pakhuis Azië and Pakhuis Afrika
  summary: Two warehouses of the "continents" row on the Oostelijke Handelskade, Azië of 1883 (one of the first on the quay, with its founding stone) and Afrika of 1915, an early mushroom-floor concrete frame that still has its fold-down loading balconies on chains.
  body: |
    The N.V. Handelskade built a row of warehouses on the new Oostelijke Handelskade, wedged between the railway yard and the IJhaven, and named them after the continents. The quay was laid in 1883 but only came into full use around 1900, once the Merwedekanaal route to the Rhine opened. Europa, Amerika and Australië have since been replaced by new buildings that carry their names; Azië, Afrika and De Zwijger survive.

    Pakhuis Azië (1883) was one of the first warehouses on the quay: four storeys of brick with yellow and black bands, a stepped block frieze along the eaves and round cast-iron columns inside. It was converted for a wholesaler and is now called Pakhuis Amsterdam; the south side has changed a lot. Pakhuis Afrika (1915), by A.J. Joling, is an early Dutch example of a monolithic "mushroom" concrete frame. In 1935 J. de Bie Leuveling Tjeenk, who also designed De Zwijger, gave it a new, functionalist-tinged front. On the water side a loading platform runs the full width, with fold-down loading balconies hanging from steel chains in front of the hatches.

    Look for:
    - the niche on Azië with the stone "NAAMLOOZE VENNOOTSCHAP HANDELSKADE ANNO 1883" under a little canopy
    - the metal letters "Afrika" on the corners of the upper floor, front and back
    - Afrika's loading balconies on chains and its original slatted doors
    - the exposed concrete frame of Afrika, its floors cantilevering forward
  category: industrial
  lat: 52.376616
  lng: 4.921498
  address: Jollemanhof 9-37, Veemkade 228
  links:
    - { label: Rijksmonumentenregister (523313), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/523313" }
    - { label: Rijksmonumentenregister (523314), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/523314" }
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/f9b25350-c4bd-45b3-9b69-007e0372e9ba" }
    - { label: Wikipedia (nl) Pakhuis de Zwijger, url: "https://nl.wikipedia.org/wiki/Pakhuis_de_Zwijger" }
  attributes:
