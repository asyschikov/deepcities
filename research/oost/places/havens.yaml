  nl:
    title: Drijvende Tuinen
    summary: "Vijf wilde tuinen op vlotten van piepschuim, gebouwd door Robert Jasper Grootveld, wiens antirookhappenings Provo voorgingen, als reddingsvlot voor als Amsterdam onderloopt. Er groeien bomen op; sinds zijn dood in 2009 houden buurtbewoners ze drijvend."
    body: |
      Elke Amsterdammer zou er een moeten hebben, vond Robert Jasper Grootveld: een drijvende tuin, als reddingsvlot voor de dag dat de stad onderloopt.

      Grootveld (1932-2009) werd in de jaren zestig beroemd met zijn nachtelijke happenings rond Het Lieverdje op het Spui. Dat beeldje was een cadeau van een tabaksfabrikant, en Grootveld danste er in een wolk rook omheen, met bezweringen tegen de verslaafde consument. Die happenings waren een voorloper van Provo. Vanaf de jaren zeventig bouwde hij ook vlotten: blokken piepschuim met een laag aarde erop, en daarin plantte hij van alles. Een bijkomend voordeel: piepschuim dat nauwelijks vergaat, kon zo maar beter in een vlot zitten dan op de afvalberg liggen.

      In 1999 legde hij in het Oostelijk Havengebied vijf drijvende tuinen aan, als werkgelegenheidsproject met Stichting De Omslag. Elke tuin is ongeveer 200 m², met grassen, struiken en bomen. Het waterbeheer van de stad zag ze lang als vervuiling, en één tuin moest daaraan geloven voordat hij weer werd hersteld. Na Grootvelds dood namen buurtbewoners het onderhoud over, samen met het stadsdeel en het IISG. Een groep die zich De Vlottenbouwers noemt, bouwt in zijn geest door, onder meer drie eilandjes in de Wittenburgervaart (2020) met de namen Robert, Jasper en Grootveld. Rond 2026 kregen de tuinen namen: De Oceaan, Yuppie-Management, De Wilde Tuin (ook De Voedseltuin) en Tuintje van de Tuinman bij de Douanesteiger, en De Panamatuin (ook Theatuin) aan de Panamakade. In augustus 2026 dreven ze nog, en groen.

      Let op:
      - bomen die uit het water lijken te groeien, afgemeerd langs de kade
      - de Douanesteiger in de Entrepothaven
    sources:
      - https://nl.wikipedia.org/wiki/Drijvende_Tuinen
      - https://stadscuratorium.nl/collectie/drijvende-tuinen/

- title: Graft 1–5 (James Beckett)
  summary: Five 12-metre reed stalks, unveiled in March 2026 across the Cruquius island, where reed beds grew before the warehouses came. Grafted onto them are coconuts, tea leaves, fire hoses and sea knots from the island's trade.
  body: |
    The Cruquius island was reclaimed from marshland and then filled with warehouses, oil mills and industry; in the 21st century it was rebuilt with housing. In 2020 the city opened a public art commission, and residents, developers and the city chose the artist James Beckett, who works from the history of the places where his art stands.

    His answer is five giant reed stalks, each twelve metres tall and made of light, strong new materials including recycled PET bottles. The title Graft refers to grafting: onto the stalks of the old marsh Beckett grafted things from the island's later life, such as coconuts (the coconut oil of the Insulinde oil mills), tea leaves, fire hoses and seafaring knots, and also stickers, chewing gum and bottles from today. He calls them "a kind of noticeboard where past, present and future come together, with references to industry and trade, but also to climate change and the rise of Smart Cities". They were unveiled on 19 March 2026.

    The five stand at the inlet harbour on the Zeeburgerkade (Graft 1), the Archiefstraat (2), the Cruquiusweg (3), the Locomotiefstraat (4) and the Brandslangstraat (5). The pin marks the point nl.wikipedia gives for the group.

    Look for:
    - Graft 1 by the water on the Zeeburgerkade
    - Graft 3 on the Cruquiusweg
    - the small objects "grafted" onto each stalk
  category: street-art
  lat: 52.369064
  lng: 4.953236
  address: Cruquius island (Zeeburgerkade, Archiefstraat, Cruquiusweg, Locomotiefstraat, Brandslangstraat)
  links:
    - { label: Stadscuratorium, url: "https://stadscuratorium.nl/collectie/graft-1-t-m-graft-5/" }
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Graft_(beeld)" }
