  nl:
    title: Voormalige KNSM-kantine, Levantplein
    summary: "Een glazen doos op stalen poten boven het Levantplein, waar het personeel van de KNSM at en naar toneel keek. Waarschijnlijk het enige bekende gebouw van een van de oprichters van de beroemde architectengroep De 8. Nu zitten er woon-werkateliers in."
    body: |
      Wie ontwierp dit? Volgens het register een zekere P.J. Verschuyl uit Hilversum, en verder is hij een raadsel. In 1927 hoorde een P.J. Verschuyl bij de oprichters van de beroemde architectengroep De 8. Een jaar later stapte hij alweer op, om te gaan werken in het villabureau van zijn vader. Als het dezelfde man is, dan is deze kantine het enige bekende werk van een De 8-oprichter die een kwart eeuw lang onzichtbaar bleef. De glazen gevels en de zichtbare constructie komen dan ook rechtstreeks uit het vooroorlogse Nieuwe Bouwen.

      Het was het personeelsrestaurant van de KNSM: één lange glazen zaal op een raster van stalen kolommen, ingeklemd tussen twee gemetselde blokken. In het grootste zaten de hoofdingang met de trap, de garderobe en de keuken. Er werd niet alleen gegeten; de zaal diende ook voor toneel en andere voorstellingen, heel jaren vijftig. Volgens de registertekst is het gebouw van 1959-1960 (in de samenvatting van het register staat 1954).

      In 1991 werd de kantine opgedeeld in acht ateliers, sinds 2001 officieel woon-werkruimtes, die je van onderaf bereikt via nieuwe open ijzeren trappen. Van het interieur van de kantine is niets meer over, maar de buitenkant is grotendeels gaaf.

      Let op:
      - de lichtblauwe stalen kozijnen langs beide lange zijden
      - de stalen H-kolommen op zeshoekige betonvoeten, met de open ruimte eronder
      - de oranjerode strengperssteen en de platen van grindbeton
      - de vloertegels met donkere ruitbiezen bij de vroegere hoofdingang
    attributes:
      original_use: Personeelskantine en zaal van de KNSM
    sources:
      - city register text 200745

# ================================================================ Sporenburg and Borneo

- title: Python Bridge (Hoge brug)
  summary: "West 8's red footbridge writhes over the Spoorwegbassin like a snake, rising 9.5 metres so boats can pass beneath. Pedestrians only, so cyclists and anyone who dislikes heights take the low bridge next door."
  body: |
    When Sporenburg and Borneo, two former railway and harbour peninsulas, were rebuilt as dense low-rise housing to a plan by West 8, the landscape architects also designed the tallest of the footbridges across the Spoorwegbassin between them, officially the Hoge brug (bridge 1998). It opened in 2001. Its wriggling shape soon earned it nicknames: Anaconda, Salamander, Dinosaur, and the one that stuck, Python Bridge.

    The bright red truss bridge by Adriaan Geuze spans the 93-metre basin, but its curves make it longer, and its highest point gives 9.5 metres of clearance. The railings lean inwards, then outwards, then inwards again, and the lamps are meant to look like long-legged birds perched on the rail. The Piet Hein tunnel runs under the water below. It won the International Footbridge Award in 2002, and Architectural Digest put it among the world's most beautiful bridges in 2019. The parkour team Storror used it for a hanging stunt, and local youngsters jump from the top into the water.

    Look for:
    - the bird-like lamps along the railings
    - the view from the top along the basin and over the canal houses of Borneo
    - the Lage brug (bridge 1997) 400 m west, its flatter sibling
  category: infrastructure
  lat: 52.373010
  lng: 4.948894
  address: Panamakade, Sporenburg, to the Stuurmankade, Borneo
  links:
