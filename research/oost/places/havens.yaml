  nl:
    title: Museum Perron Oost
    summary: "\"Het kleinste museum ter wereld\": een opzichtershuisje op het oude spoorperron van de veemarkt, dat Joep van Lieshout in 1993 redde met kasseien, platanen en een lege wagon. De tentoonstellingen bekijk je door de ramen."
    body: |
      Naar binnen hoeft niet. Het museum is zo klein dat de ramen volstaan, dag en nacht.

      Langs de noordkant van de Cruquiusweg liep een spoor met een laad- en losperron, tegenover de veemarkt en het slachthuis. Het spoor is weg, het perron uit de late negentiende eeuw ligt er nog, met betonnen zijkanten en een dek van zware granieten klinkers. In 1993 redde de Rotterdamse kunstenaar en ontwerper Joep van Lieshout het, als eerbetoon aan het industriële verleden van het havengebied. Hij legde kasseien, plantte twee rijen parasolplatanen voor de allure van een statige oude laan, en liet een lege wagon achter op zo'n honderd meter oorspronkelijk spoor, naast een opzichtershuisje.

      Sinds april 2013 is dat huisje Museum Perron Oost. Wisselende tentoonstellingen vertellen over wie er in het Oostelijk Havengebied woonde en woont. Er zijn ook online interviews (Radio Perron Oost) en een gratis audiotour op izi.travel, "Het verdwenen spoor", die op het perron begint en de geschiedenis van het eiland vertelt. Van 31 oktober tot 28 december 2026 hangen er schilderijen van Wim Janssen van het fietstochtje door Oost dat Nescio in 1952 maakte.

      Vlakbij knipogen nog twee werken naar haven en markt. Op het oude veemarktterrein legde Bastienne Kramer een bakstenen 'tuinlandschap' met een vijvertje van blauwe klinkers en dierfiguren. En op het dak van het voormalige stadsdeelkantoor van Zeeburg draait Jos Kokkes Gyroscoop (1995): twee in elkaar gedraaide kegels binnen twee ringen. Het is een gyroscoop, zoals in het gyrokompas van een schip, voor een haven waar een eeuw lang schepen kwamen en gingen. De buurt doopte hem al snel De Tol.

      Let op:
      - de wagon op het stuk oud spoor
      - de granieten klinkers en betonnen randen van het perron
      - de tentoonstelling achter de ramen van het huisje
      - de hoofdpoort van de veemarkt aan de overkant van de Cruquiusweg
      - het blauw bestrate 'vijvertje' op het oude marktterrein
      - de Gyroscoop op het dak van het oude stadsdeelkantoor
    sources:
      - https://www.museumperronoost.nl/perron-oost/
      - https://www.museumperronoost.nl/
      - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/1744
      - https://nl.wikipedia.org/wiki/Gyroscoop_(Jos_Kokke)

- title: Entrepot waiting room, coffee house and bridge 352
  summary: "Three small survivors of the city's bonded warehouse dock of 1900, at its lock on the Cruquiusweg: a waiting room with a veranda, a temperance coffee house, and a bridge with its building year cast into a lamp."
  body: |
    In 1899 the city dug a short canal from the Nieuwe Vaart to its new bonded warehouse dock, the Nieuwe Entrepotdok (now the Entrepothaven), with a lock where the canal meets the Cruquiusweg. Goods could be stored here duty-free until they were sold on; seven entrepot warehouses along the Cruquiusweg were named after the days of the week. The Public Works department (Publieke Werken) built a small group of buildings at the gate, with timber framing and chalet touches that nl.wikipedia attributes to Hendrik Leguyt.

    Cruquiusweg 3 (1901) was the waiting room (wachtlokaal) of the entrepot, with two pay offices (afrekenlokalen) and a waiting area, plus a veranda on the east side as extra waiting space. A police post stood a few metres east; it has been demolished. Cruquiusweg 9 (1902), on the other side of the old entrance, was a people's coffee house (volkskoffiehuis): a café on the corner, a coffee room behind and a flat upstairs for the manager. Like the coffee house at the old entrepot on the Kadijksplein, it was run by the Volksbond tegen Drankmisbruik, a temperance league. Both buildings are cafés or restaurants today.

    Bridge 352 (1899) carries the Cruquiusweg over the northern gates of the Nieuwe Entrepotdok lock. It mixes a then-modern beam bridge with 19th-century lamps and railings of cast and wrought iron, supplied by F. Rincker. The deck was renewed in 2014 with the old railings and four lamps put back. Until 2016 it was unofficially called the Jaap Hannesbrug, after a vanished hamlet and bastion.

    Look for:
    - the building year cast into one of the bridge lamps
    - the lock gates under the bridge
    - the veranda along the east side of number 3
    - the café entrance on the cut-off corner of number 9
