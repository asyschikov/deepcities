  nl:
    title: Pythonbrug (Hoge brug)
    summary: "De felrode voetbrug van West 8 kronkelt als een slang over het Spoorwegbassin en klimt tot 9,5 meter, zodat er boten onderdoor kunnen. Alleen voor voetgangers: fietsers en wie niet van hoogte houdt nemen de lage brug verderop."
    body: |
      Officieel heet hij gewoon de Hoge brug (brug 1998). Maar met die kronkels kreeg hij al snel bijnamen: Anaconda, Salamander, Dinosaurus. De naam die bleef hangen is Pythonbrug.

      Toen Sporenburg en Borneo, twee oude spoor- en havenschiereilanden, opnieuw werden bebouwd met dichte laagbouw naar een plan van West 8, ontwierpen die landschapsarchitecten ook de hoogste van de voetbruggen over het Spoorwegbassin ertussen. In 2001 ging hij open.

      Adriaan Geuze tekende een knalrode vakwerkbrug. Het bassin is 93 meter breed, maar door de bochten is de brug langer, en op het hoogste punt is er 9,5 meter ruimte voor de scheepvaart. De leuningen hellen eerst naar binnen, dan naar buiten en dan weer naar binnen. De lantaarns moeten je doen denken aan langpotige vogels die op de reling staan. Onder het water loopt de Piet Heintunnel. In 2002 won de brug de International Footbridge Award, en in 2019 zette Architectural Digest hem op een lijst van de mooiste bruggen ter wereld. Het parkourteam Storror deed er een hangstunt, en jongeren uit de buurt springen vanaf de top het water in.

      Let op:
      - de lantaarns die als vogels op de leuning staan
      - het uitzicht vanaf de top over het bassin en de grachtenhuizen van Borneo
      - de Lage brug (brug 1997), 400 meter westelijk, het vlakkere broertje
    sources:
      - https://nl.wikipedia.org/wiki/Pythonbrug
      - https://nl.wikipedia.org/wiki/Sporenburg_(Amsterdam)

- title: Fragment van een huiskamer (Mark Manders)
  summary: A cast-iron table, chair and bucket with two small figures on top, set into the paving at the tip of Sporenburg and looking out over the water. Everything is shrunk to 88%, which you feel more than see.
  body: |
    Since 1986 Mark Manders has worked without a break on one piece, "Self-portrait as a Building": an imaginary building, always changing, whose rooms are filled with his sculptures. In 2001 he set a fragment of it into the street on the P.E. Tegelbergplein, the square at the eastern tip of Sporenburg, in a strip of grey-blue paving between the street and the water.

    The fragment is a work table with a chair and a bucket. On the table stand two genderless figures that look identical at first sight but are two moments of the same figure, about a second apart, like film stills, with a small change in the face and arms. The bucket is also two moments, woven into each other. The figures look out over the water; the chair is for anyone who wants to stare out with them.

    Because the square slopes up and a retaining wall runs behind it, Manders reduced the whole thing to 88%, a scale he had used since 1993. The reduction is not obvious, but you sense it, and it makes the scene quietly strange. Since 2023 a temporary ferry has sailed from the square to the new Sluisbuurt on Zeeburgereiland.

    Look for:
    - the two figures and the small differences between them
    - the doubled bucket
    - the chair, set for you
  category: street-art
  lat: 52.373822
  lng: 4.949255
  address: P.E. Tegelbergplein, opposite no. 16
  links:
    - { label: Stadscuratorium, url: "https://stadscuratorium.nl/collectie/fragment-van-een-huiskamer-verkleind-naar-88/" }
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Fragment_van_een_huiskamer" }
  attributes:
    rank: Nice
    built: "2001"
    artist: Mark Manders
  photos:
    - commons:File:Fragment van een huiskamer.JPG
  sources:
    - https://stadscuratorium.nl/collectie/fragment-van-een-huiskamer-verkleind-naar-88/
    - https://nl.wikipedia.org/wiki/Fragment_van_een_huiskamer
    - https://nl.wikipedia.org/wiki/Sporenburg_(Amsterdam) (ferry since 2023)
    - OSM node 5238675596 and the Commons caption "P.E. Tegelbergplein, t.o. 16" (pin)
  nl:
    title: Fragment van een huiskamer, verkleind naar 88% (Mark Manders)
    summary: "Een gietijzeren tafel, stoel en emmer met twee figuurtjes erop, verzonken in de bestrating op de kop van Sporenburg en uitkijkend over het water. Alles is verkleind tot 88 procent, en dat voel je eerder dan dat je het ziet."
    body: |
      Kijk goed naar de twee figuren op de tafel. Ze lijken een tweeling, maar het is één en dezelfde, vastgelegd op twee momenten die ongeveer een seconde uit elkaar liggen, als opeenvolgende beeldjes uit een film. Gezicht en armen zijn net een tikje anders. De emmer ernaast is ook twee momenten tegelijk, in elkaar geschoven.

      Mark Manders werkt sinds 1986 zonder onderbreking aan één groot project, Zelfportret als gebouw: een verzonnen gebouw dat steeds verandert en waarvan de kamers gevuld zijn met zijn beelden. In 2001 legde hij er een stukje van op straat, op het P.E. Tegelbergplein op de kop van Sporenburg. Het staat in een strook grijsblauwe klinkers tussen de rijweg en het water: een werktafel, een stoel en een emmer, met daarop de twee figuren zonder geslacht. Die kijken uit over het water, en de stoel is voor wie mee wil staren.

      Omdat het plein omhoogloopt en er een keermuur achter staat, bracht Manders het geheel terug tot 88 procent, een maat die hij al sinds 1993 gebruikte. Je ziet het niet meteen, maar je merkt dat er iets niet klopt, en dat maakt het tafereel stilletjes vreemd. Sinds 2023 vertrekt vanaf dit plein een tijdelijke pont naar de nieuwe Sluisbuurt op het Zeeburgereiland.

      Let op:
      - de twee figuren en de kleine verschillen tussen hen
      - de verdubbelde emmer
      - de stoel, klaar voor jou
