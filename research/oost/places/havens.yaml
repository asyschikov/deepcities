  nl:
    title: KNSM-woningen, Oostelijke Handelskade
    summary: "Een stil rijtje bedrijfswoningen uit 1912 met luiken en kleine erkers, gebouwd door rederij KNSM, vermoedelijk voor personeel dat snel oproepbaar moest zijn. Ontwerp van woningbouwvernieuwer J.H.W. Leliman, in de geest van de Engelse Arts and Crafts."
    body: |
      Wonen was in het havengebied niet de bedoeling. Dat is voor het monumentenregister de reden om te denken dat in dit rijtje mannen woonden die de KNSM snel kon optrommelen, arbeiders of voormannen. Zeker is dat niet. De Koninklijke Nederlandsche Stoomboot Maatschappij zat sinds 1903 op het KNSM-eiland en liet de symmetrische rij in 1912-1913 bouwen, aan het oostelijke uiteinde van de Oostelijke Handelskade.

      Architect J.H.W. Leliman (1878-1921) richtte mee Bond Heemschut op, begon het blad De Bouwwereld en wilde de arbeiderswoning verbeteren; holle monumentaliteit vond hij niks. De rij bestaat uit drie blokken, waarvan de buitenste twee als paviljoens naar voren steken, met twee woonlagen en een zolder onder schilddaken. Elke woning heeft een eigen voordeur, steeds naast die van de buren. Het Engelse zie je aan de luiken, de kleine roedes in de bovenlichten, de dakhuizen met topgevels, de erkertjes beneden en de hoekerkers in een soort vakwerk. De voorkant is nog vrijwel zoals hij was; de achterkant is bij een renovatie in de jaren negentig veranderd.

      Let op:
      - de houten luiken voor de onderramen
      - de vakwerkerkers in de binnenhoeken van de paviljoens
      - de vier erkertjes met hun mini-schilddakjes
      - de gekoppelde voordeuren onder een segmentboog
    attributes:
      original_use: Personeelswoningen van de KNSM
    sources:
      - city register text 200666

- title: Voor de bijen (Bee tables)
  summary: "Four giant tables stacked over a traffic junction, with beehives hung under the top one so the bees could join the traffic as a fifth stream. The bees would not be steered, but the hives still hang there, and people still bump their heads on the legs."
  body: |
    Frank Mandersloot made this work in 2004 for the junction of the Piet Heinkade, the Piet Hein tunnel and the Panamalaan, paid for from the art budget of the IJtram. Four tables climb over one another, two of concrete below and two of wood above. The top of the lowest table is level with the street; its two visible legs go down to the sunken tram line and stand for the piles the city is built on. The stacking echoes the layers of traffic here, and the four tables the four streams of traffic that meet at the crossing.

    Mandersloot added a fifth stream: bees. Under the top table hangs a platform with hives, and with the city ecologist he drew up a planting plan for the area so the bees would have food. A thriving colony was to be a gauge of the city's health: if the bees do well, so do the people. It soon turned out that bees cannot be steered. There was too little green, and up at the height of the hives it was too windy. The beekeepers' association of Waterland stopped tending the hives in 2013, but the hives were never removed.

    In the early years pedestrians walked into the table legs despite warning tiles. Mandersloot would not shorten them; instead he laid a square of cobbles around the work, reasoning that people walk around tiles. People still hit their heads now and then.

    Look for:
    - the hives under the top table
    - the two legs plunging down to the tram line
    - the square of cobbles around the base
  category: curiosities
  lat: 52.372849
  lng: 4.933829
  address: Piet Heinkade / Panamalaan (Rietlandpark)
  links:
    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Voor_de_bijen" }
    - { label: Stadscuratorium, url: "https://stadscuratorium.nl/collectie/voor-de-bijen/" }
  attributes:
    rank: Okay
    built: "2004"
    artist: Frank Mandersloot
  photos:
    - commons:File:Voor de Bijen.jpg
    - commons:File:Kunst aan het Rietlandpark Amsterdam (5634936727).jpg
  sources:
    - https://nl.wikipedia.org/wiki/Voor_de_bijen (bees never settled, beekeepers stopped 2013, head-bumping)
    - https://stadscuratorium.nl/collectie/voor-de-bijen/ (landscape plan with city ecologist, gauge of the city)
    - OSM node 4743986694 (pin)
  nl:
    title: Voor de bijen (Bijentafels)
    summary: "Vier reusachtige tafels op elkaar gestapeld boven een verkeersknooppunt, met onder de bovenste bijenkorven, zodat de bijen als vijfde stroom aan het verkeer meededen. De bijen lieten zich niet sturen, de korven hangen er nog, en mensen stoten nog steeds hun hoofd."
    body: |
      Frank Mandersloot wilde de bijen inzetten als meetlat voor de stad: als de bij gezond is, is de mens het ook.

      Hij maakte het werk in 2004 voor de kruising van de Piet Heinkade, de Piet Heintunnel en de Panamalaan, betaald uit het kunstbudget van de IJtram. Vier tafels klimmen over elkaar heen, twee van beton onderaan en twee van hout erboven. Het blad van de onderste tafel ligt gelijk met de straat; de twee poten die je ziet, zakken af naar de verdiepte trambaan en staan voor de palen waarop de stad rust. De stapeling verwijst naar de lagen verkeer hier, de vier tafels naar de vier stromen die op het kruispunt samenkomen.

      Als vijfde stroom koos Mandersloot de bijen. Onder de bovenste tafel hangt een plateau met korven, en met de stadsecoloog maakte hij een beplantingsplan voor de omgeving, zodat er voedsel was. Al snel bleek dat bijen niet te sturen zijn. Er was te weinig groen, en op die hoogte waaide het te hard. Imkervereniging Waterland stopte in 2013 met de verzorging, maar de korven bleven hangen.

      In de eerste jaren liepen voetgangers ondanks waarschuwingstegels tegen de tafelpoten aan. Inkorten wilde Mandersloot niet. Hij legde een vierkant van keien rond het werk, want om tegels lopen mensen heen. Af en toe stoot nog iemand zijn hoofd.

      Let op:
      - de korven onder de bovenste tafel
      - de twee poten die naar de trambaan duiken
      - het vierkant van keien rond de voet
    sources:
      - https://nl.wikipedia.org/wiki/Voor_de_bijen
      - https://stadscuratorium.nl/collectie/voor-de-bijen/

# ================================================================ KNSM-eiland

- title: Loods 6 and the Kompaszaal
  summary: "The last harbour shed built on the KNSM island, where passengers once left for Suriname and the Caribbean. Its 1950s departure hall survives like a ship's lounge, with compass stars in the lino, mosaics of a family leaving and a farewell on the quay."
  body: |
    The Koninklijke Nederlandsche Stoomboot Maatschappij (KNSM) settled on what is now the KNSM-eiland in 1903, sailing to the Baltic, Suriname, the Antilles and the Levant. Shed 6 on the Surinamekade was rebuilt around 1920–1925, 180 metres long, with storage below and, on the upper floor, offices and rooms for travellers and emigrants. Its east end (KNSM-laan 311) held the passenger terminal; passengers boarded from the roof terrace over a gangway to the ships.

    For the line's centenary in 1956, the ship interior designer Johan van Tienhoven, who did the lounges of liners like the Oranje Nassau, turned the plain hall into something like a ship's lounge, and in 1960 he modernised the entrance. It survives almost intact: travertine walls, star-shaped clock by Dick ten Hoedt, his grey mosaics "Het Gezin" (a family planning to emigrate) and "Het Afscheid" (a couple saying goodbye on the quay), and upstairs the Kompaszaal with compass stars in the linoleum, columns clad in green mosaic, a mural by Cuno van den Steene of a woman and six children who may stand for the Antilles, and an engraved window of the harbour by Lex Horn. In the porch hangs the KNSM war memorial (1947, Pieter Starreveld, moved here in 2005), with 247 names of seamen who did not return.

    The KNSM stopped in 1979. Squatters and artists saved the shed: the Open Haven Museum opened in the old hall in 1987, and after a 1994–1997 conversion by Villanova it became a building for the creative sector with some 120 tenants. The Kompaszaal is a café and lounge.

    The memorial in the porch is a white stone relief of a lying nude man above five plates with the names of the 247 KNSM staff who did not return; 49 of the company's ships were sunk by mines, torpedoes or bombs. It was unveiled on 4 May 1947 in the KNSM head office, the Scheepvaarthuis, then moved to a home for old seamen in Egmond aan Zee and in 1992 back to the Oosterdok; a poem by Arne Zuidhoek about the ships that never came back up the IJ was added in 1995. The island has a harder war story too. In 1944 the Germans used the bombed sheds as a camp for Dutch men rounded up for forced labour, and from 1 June 1945 to July 1946 the same sheds held the Interneringskamp Levantkade for NSB members and suspected collaborators, up to 6,000 at a time, on straw in barbed-wire pens: men mostly in KNSM shed 4 on the Surinamekade, women in shed 3 on the Levantkade. There were revolts, a fire and dysentery. Among the guards was the later football referee Leo Horn, among the internees the wartime mayor Edward Voûte. Loods 6 was the last shed built on the island.

    Look for:
    - the sculptures of harbour workers, a ship and a train at the entrance, of unknown origin
    - the sandblasted harbour window by Lex Horn above the entrance
    - the raised loading platform and original quay on the Surinamekade
    - crane 2868 right behind the shed
    - in the porch of the Kompaszaal, Starreveld's lying man above the plates of names, and Zuidhoek's poem
