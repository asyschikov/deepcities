  photos:
    - commons:File:2026 Graft 1, Zeeburgerkade, Asd (A).jpg
    - commons:File:2026 Graft 3, Cruquiusweg, Asd (A).jpg
  sources:
    - https://stadscuratorium.nl/collectie/graft-1-t-m-graft-5/ (unveiled 19 March 2026, 12 m, PET, quote)
    - https://nl.wikipedia.org/wiki/Graft_(beeld) (commission 2020, grafted motifs, coordinates)
  nl:
    title: Graft 1 t/m Graft 5 (James Beckett)
    summary: "Vijf rietstengels van twaalf meter, in maart 2026 onthuld verspreid over het Cruquiuseiland, waar riet groeide voordat de pakhuizen kwamen. Erop geënt: kokosnoten, theebladen, brandslangen en zeemansknopen uit de handelsgeschiedenis van het eiland."
    body: |
      Op de stengels zitten kokosnoten, theebladen, brandslangen en zeemansknopen, maar ook stickers, kauwgom en flessen. Voor James Beckett is zijn reuzenriet een prikbord: oud, nieuw en wat nog komt hangen er door elkaar, van handel en fabrieken tot de opwarming van de aarde en de slimme stad.

      Het Cruquiuseiland werd gewonnen op een moerasgebied en raakte daarna vol met pakhuizen, oliefabrieken en industrie. In de 21e eeuw verrezen er woningen. In 2020 schreef de stad een opdracht voor kunst in de openbare ruimte uit; bewoners, ontwikkelaars en gemeente kozen Beckett, een kunstenaar die vertrekt vanuit de geschiedenis van de plek waar zijn werk komt te staan.

      Hij maakte vijf enorme rietstengels, elk twaalf meter hoog, van lichte en sterke nieuwe materialen, waaronder gerecyclede petflessen. Graft betekent enten. Op de stengels uit het oude moeras zette Beckett dingen uit het latere leven van het eiland: kokosnoten (voor de kokosolie van de oliefabrieken van Insulinde), theebladen, brandslangen, zeevaartknopen, en daarbij stickers, kauwgom en flessen van nu. Op 19 maart 2026 werden ze onthuld.

      Ze staan bij de insteekhaven aan de Zeeburgerkade (Graft 1), in de Archiefstraat (2), aan de Cruquiusweg (3), in de Locomotiefstraat (4) en in de Brandslangstraat (5). De pin staat op het punt dat nl.wikipedia voor de hele groep opgeeft.

      Let op:
      - Graft 1 aan het water bij de Zeeburgerkade
      - Graft 3 aan de Cruquiusweg
      - de kleine voorwerpen die op elke stengel zijn "geënt"
    sources:
      - https://stadscuratorium.nl/collectie/graft-1-t-m-graft-5/
      - https://nl.wikipedia.org/wiki/Graft_(beeld)

# ================================================================ Oostelijke Handelskade

- title: Pakhuis de Zwijger
  summary: "A 1934 cold store for perishable goods, with a road bridge driven right through its third and fourth floors in 2001. Saved from demolition, it is now a debating house, with some 600 programmes a year about the future of daily life in city and country."
  body: |
    The Oostelijke Handelskade was lined with warehouses (vemen). De Zwijger is a cold store built in 1933–1934 for the N.V. Blauwhoedenveem-Vriesseveem, designed by J. de Bie Leuveling Tjeenk and K. Bakker in a businesslike, expressionist style. Inside is a concrete frame with tapering octagonal columns and mushroom floors. The concrete walls are faced with an 11 cm brick skin that served as the outer formwork, laid in a block bond to make the mass look lighter. The upper floors cantilever on heavy, exposed brackets.

    When the cold store lost its function it stood empty and was nearly demolished, because the new Jan Schaeferbrug to the Java-eiland was planned straight through it. In the end the bridge was built through a gap in the third and fourth floors, opening in 2001, and the warehouse was kept. Stadsherstel Amsterdam restored it, and in September 2006 it reopened, reworked by André van Stigt, as a home for cultural organisations. The Pakhuis de Zwijger foundation makes some 600 programmes a year there and elsewhere on the future of daily life in city and country.

    Look for:
    - the road and cycle path passing through the building
    - sandstone plaques in blue mosaic on the blind east side with the cities where the Blauwhoedenveem had branches: Amsterdam, Rotterdam, Londen, Hamburg, Bremen, Bazel, New-York and Batavia
    - the name letters "De Zwijger" on both loading sides
    - the stacked loading doors with drop-bridges on the water side
    - the sawtooth roof that lit the sampling floors
