  nl:
    title: Rotsvast (Rob Ligtvoet), Flevopark
    summary: "Een bronzen 'keukentrapje' op het grasveld bij het Nieuwe Diep dat 25 jaar lang niemand kon verklaren. De maker had het rond 1982 met vrienden 's nachts ingegraven, omdat hij er geen plek meer voor had."
    body: |
      Het stond er gewoon, maar van wie was het? Op het gazon bij het water van het Nieuwe Diep in het Flevopark staat een klein bronzen ding dat eruitziet als twee platen die naar boven toe smaller worden en tegen elkaar leunen. Aan één kant zit halverwege een trede. Mensen gaan erop zitten met hun voeten op die trede, als op een keukentrapje, en zo noemde de buurt het ook. Zo'n 25 jaar wist niemand wie het had gemaakt, wat het moest voorstellen of hoe het daar kwam; in de archieven van het stadsdeel stond niets.

      Een oproep op de website van het oude stadsdeel Zeeburg, opgepikt door Het Parool en RTV Noord-Holland, bracht de maker eindelijk boven water: Rob Ligtvoet (1939–2017), een Amsterdamse beeldhouwer die geloofde in kunst die je kunt aanraken. Hij had het in de jaren zeventig gemaakt en in zijn atelier gehouden, maar na een verhuizing was er geen ruimte meer. Rond 1982 groef hij het met een paar vrienden 's nachts hier in, zonder het iemand te vragen. Hij vond het intrigerend dat het al die tijd anoniem en onopgemerkt was gebleven.

      Wat op twee delen lijkt, is één bronzen plaat. De golfjes erop zijn niet die van het meer ernaast, al passen ze er mooi bij. Ligtvoet ving de ribbels van het strand bij IJmuiden in gips en bracht ze met een mal over op het brons: natuur en kunst in één. Over de titel zei hij niet meer dan dat het is wat het is, rotsvast in het landschap.

      Let op:
      - het ribbelpatroon van het strand van IJmuiden in het brons
      - de ene trede aan één kant, die er een zitje van maakt
    sources:
      - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/1726
      - https://nl.wikipedia.org/wiki/Rotsvast
      - https://oost-online.nl/oostommetje-flevopark/

- title: Fata Morgana, dromedaries on the railway by the Wibautstraat
  summary: "Three steel dromedary silhouettes plod east along the railway embankment above the Pauwenpad cycle tunnel, a slow desert caravan beside the racing traffic of the Wibautstraat. Best against a sunset."
  body: |
    Where the Wibautstraat runs past a small green strip just north of Amstel station, a brick retaining wall carries the railway to Utrecht over the Ringvaart of the Watergraafsmeer. On top of it, above the cycle tunnel of the Pauwenpad, three dromedaries walk towards the east: one on its own and a pair. They are flat cut-outs of sheet steel, about 2.75 metres high and spread over 15 metres, and from the street they read as black silhouettes against the sky.

    Iris Le Rütte made them in 2005 for a commission from the borough and the Amsterdams Fonds voor de Kunst when the surroundings of the Wibautstraat were redesigned; they were unveiled on 9 September 2005. Ten artists were invited to propose a work. Le Rütte, a sculptor of recognisable animal and human figures, sent in a photo of the spot with nothing but three dromedaries drawn on it. She chose them for a place that feels uncomfortable: traffic races down the Wibautstraat, sometimes called the city's stone desert, while trains and the east metro line run alongside. The slow gait of the animals is the opposite of all that hurry, and when the silhouettes appear against a good sunset you could be in another country.

    Look for:
    - the lone dromedary and the pair walking behind it
    - the view from the Wibautstraat at dusk, when they turn into shadows
