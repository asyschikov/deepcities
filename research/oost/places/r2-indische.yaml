  nl:
    title: Baksteenreliëf van Aart Roos, Zeeburgerdijk 112
    summary: "Een metershoog abstract reliëf van zwierige bogen en groeven, uitgehakt in de bakstenen kopgevel van een modeschool uit 1969: het laatste monumentale werk dat Aart Roos ontwierp en, voor zover bekend, het enige bakstenen reliëf van dit formaat in Amsterdam."
    body: |
      Voor zover iemand weet heeft Amsterdam geen tweede bakstenen reliëf van dit formaat. Het zit op de hoge kopgevel van de vleugel van beton en baksteen op de hoek van de Zeeburgerdijk en de Djambistraat, in 1969 gebouwd voor de Technische School voor Mode en Kleding. Aart Roos werkte er lange, zwaaiende bogen en bosjes korte groeven in het metselwerk, metershoog en abstract; volgens het register heeft het te maken met het onderwijs dat binnen gegeven werd.

      Het gemeentelijke register van naoorlogse wandkunst geeft het de waardering ‘Top’. Het is het enige baksteenreliëf in het werk van Roos en het laatste monumentale kunstwerk dat hij ontwierp. Roos (1919-2009) studeerde aan de Rijksakademie, in dezelfde klas als Karel Appel, werkte expressionistisch en voerde veel monumentale opdrachten uit in Amsterdam en Noord-Holland, waarvan veel inmiddels verdwenen is. Zijn grote muurschildering in de oude ambachtsschool aan het Timorplein ligt een paar straten verderop.

      Later werd de school een designschool, die uiteindelijk dichtging. Vanaf 2017 werden de gebouwen uit 1914 en 1969 verbouwd tot woningen voor een groep van zo'n 25 bewoners; daarom zitten er nu nieuwe balkons naast het reliëf. Het reliëf zelf heeft de verbouwing doorstaan.

      Let op:
      - de lange bogen die over de volle hoogte van de muur lopen
      - de bosjes korte verticale groeven bovenin
    sources:
      - https://maps.amsterdam.nl/wandkunst/

- title: The London Police mural, Zeeburgerdijk 49
  summary: The British street-art duo whose grinning black-and-white "Lads" took over Amsterdam's walls around 2000 painted this dead corner by the railway bridge in 2018, at the residents' request, with a local woman holding the city flag.
  body: |
    The row of houses on the north side of the Zeeburgerdijk, numbers 27 to 49, dates from about 1914 and stops abruptly at the railway bridge of 1901. Between the last house and the embankment was a dead corner, long used by a small firm with a garage shed. When the shed went, the residents of no. 49 were left with a big grey wall that drew rough sleepers and drug users. To give the corner a friendlier face, they asked The London Police to paint it.

    The London Police are Chaz Barrison and Bob Gibson, two Englishmen who moved to Amsterdam in 1998 and in a few years, until about 2003, put more than a thousand of their round-headed, cheerful black-and-white characters, the "Lads", on the city's streets. Their first big Amsterdam wall, on Prinsengracht 70, was painted without permission. This one, finished in 2018, is legal and in colour: Lads, a canal boat, canal houses (one of them Prinsengracht 70, quoting their own earlier work), and a woman of the neighbourhood holding the Amsterdam flag, unveiled just after it was announced that the city would get its first woman mayor, Femke Halsema. The resident who started the project stands among the Lads with his walking stick in front of his door; the boat carries the initials of their friend, street artist Hugo Mulder.

    Since 2022 a utility cabinet in front of the wall hides part of the mural.

    Look for:
    - the woman with the city flag
    - Prinsengracht 70 among the painted canal houses
    - the Lad with a walking stick, the neighbour who asked for the mural
