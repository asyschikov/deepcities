  nl:
    title: Schuilplaats in de fietstunnel van de Torontobrug
    summary: "Achter het tegelwerk van een fietstunneltje aan de Weesperzijde bevinden zich vijf atoomdeuren naar een schuilplaats voor 1200 personen, in 1968-1970 gelijk met de brug gebouwd. In 1983 wisselden de ontvoerders van Freddy Heineken hier van auto."
    body: |
      De wens voor een brug in het verlengde van de Stadhouderskade dateert al uit het begin van de jaren vijftig. In januari 1965 kwam het verlossende woord, maar er kwam weer uitstel: men wilde in de oostkant ook nog een schuilkelder inbouwen, het is dan nog de Koude Oorlog met haar dreiging van een kernoorlog. Het bruggencomplex kwam van de tekentafel van de Publieke Werken, de ontwerpers waren Gerrit Feiko Janssonius (techniek) en Dick Slebos (vormgeving). Op 23 oktober 1969 werd de brug geopend; pas op 2 oktober 1974 kreeg zij van de burgemeester van Toronto haar naam Torontobrug.

      Aan de kant van de Weesperzijde op de hoek van de Mauritsstraat bevindt zich een fietstunneltje (brug 325) van circa 33,5 meter. Achter het tegelwerk van de fietstunnel bevinden zich nu vijf atoomdeuren, die toegang geven tot de schuilplaats die zich daar nog steeds bevindt. Deze schuilplaats (Project 68) is gelijktijdig met de brug gebouwd in 1968-1970, voor 1200 personen. Ze had uitgebreide voorzieningen voor luchtfiltering en een kleine generator voor elektriciteit. Om de schuilplaats in vredestijd te kunnen gebruiken is er een garage-ingang in de Mauritsstraat; om de schuilplaats functioneel te maken wordt deze garage-ingang dichtgemetseld. Hier zie je in de muur ook de drie luchtuitlaten van de schuilplaats. In 1971 kwam de Civiele Verdediging met een nieuw schuilkelderbeleid: de bevolking diende haar bescherming bij voorkeur in de eigen woning te vinden.

      Op 9 november 1983 speelde het tunneltje een rol in de ontvoering van Freddy Heineken en Ab Doderer; zij moesten hier onder dwang overstappen in andere vluchtauto's. Ook toen was de doorgang niet bereikbaar voor autoverkeer, maar de Amsterdammertjes waren voor de ontvoering weggehaald, zodat de ontvoerders via het tunneltje konden ontsnappen. De schuilplaats zelf is niet toegankelijk; alles is vanaf de straat te zien. De speld staat bij benadering op de tunnel.

      Let op:
      - het tegelwerk van de fietstunnel, met de atoomdeuren erachter
      - de garage-ingang, die in oorlogstijd dichtgemetseld zou worden
      - de drie luchtuitlaten in de muur
    attributes:
      architect: Dienst der Publieke Werken (G.F. Janssonius, Dick Slebos)
      original_use: Openbare atoomschuilplaats in een brughoofd
    sources:
      - https://arcam.nl/wp-content/uploads/2022/10/Fietsroute-langs-de-Openbare-Schuilplaatsen-van-Amsterdam-1.2.pdf
      - https://nl.wikipedia.org/wiki/Brug_325
      - https://nl.wikipedia.org/wiki/Torontobrug

- title: Horse-tram depot, Linnaeusstraat
  summary: "A turreted corner building of red and cream brick, now a yoga studio, is what is left of the depot of the horse tram from the Dam. When line 9 went electric, 250 tram horses were auctioned here on 4 January 1904."
  body: |
    In 1884 the Amsterdamsche Omnibus Maatschappij (AOM) opened a horse-tram line from the Dam to the Linnaeusstraat, known as the DL, with its terminus close by. Abraham Salm, who also designed the AOM's depot on the Amstelveenseweg and later the Amstel brewery's stables on the Mauritskade, built the stabling for its horses and cars here, on the corner of the Derde Oosterparkstraat. In 1903 the line was replaced by the electric tram line 9, and the horses were no longer needed: on 4 January 1904 the depot held a big horse sale at which 250 tram horses went under the hammer, fetching between 100 and 250 guilders each.

    The depot lived on as a shed for the old horse trams, which now ran as trailers behind the electric motor cars, until the 1930s. Then it stored retired tram stock until 1952, and later served as a warehouse and garage. In 1986 most of the complex was pulled down for housing; the low blocks and the school behind the corner date from the years after. The main building on the Linnaeusstraat survived. It is not a listed monument. Sources differ on its date (1884 in most accounts, 1893 in a list of Salm's works, 1886 in the building register). Unlike the protected horse-tram depot on the Overtoom in West, it never got a second life as a monument, only as shops and now a heated yoga studio.

    Look for:
    - the corner turret with its slate spire and the gabled dormers
    - the bands of red brick against cream render on both street fronts
    - the newer housing along the Derde Oosterparkstraat, on the site of the demolished sheds
