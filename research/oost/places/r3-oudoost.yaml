  nl:
    title: Schuilplaats in de fietstunnel van de Torontobrug
    summary: "Achter de tegels van een fietstunnel van 33 meter aan de Weesperzijde zitten vijf atoomdeuren naar een schuilkelder voor 1200 mensen, in 1968-1970 samen met de brug gebouwd. In 1983 wisselden de ontvoerders van Freddy Heineken hier van auto."
    body: |
      Je fietst er zo doorheen zonder het te merken. Het tunneltje (brug 325) dat fietsers van het Professor Tulpplein naar de Weesperzijde brengt, zo'n 33,5 meter lang, is de voorkant van een schuilkelder. Achter de tegels zitten vijf atoomdeuren, en de kelder erachter bestaat nog. In vredestijd moest je er binnenkomen via een garagedeur aan de kant van de Mauritsstraat; in oorlogstijd zou die worden dichtgemetseld. In de muur ernaast zie je de drie luchtuitlaten.

      De Torontobrug over de Amstel, op 23 oktober 1969 geopend als deel van een bruggencomplex van Publieke Werken (techniek G.F. Janssonius, vormgeving Dick Slebos), werd bedacht tijdens de Koude Oorlog. In 1965 kon de bouw beginnen, maar de stad hield hem nog eens op om in de oostkant een openbare schuilplaats te stoppen. Die kwam er samen met de brug, in 1968-1970, onder de codenaam Project 68: een bunker voor 1200 mensen met flinke luchtfilters en een eigen kleine generator. Een naam kreeg de brug pas in 1974, toen de burgemeester van Toronto, de nieuwe zusterstad, hem doopte. De kelder is van dezelfde lichting als de Vondelbunker onder de brug in het Vondelpark. Vanaf 1971 veranderde het landelijke beleid: mensen moesten voortaan thuis schuilen, en nieuwe openbare schuilplaatsen werden gekoppeld aan metrostations en parkeergarages.

      Op 9 november 1983 speelde de tunnel mee in de ontvoering van Freddy Heineken en zijn chauffeur Ab Doderer. Auto's mochten er niet door, maar een van de bende had vooraf de paaltjes weggehaald. Zo konden de ontvoerders erdoor rijden en hun gevangenen hier overzetten in andere vluchtauto's. De kelder zelf is dicht; alles wat hier staat zie je vanaf de straat. De speld staat ongeveer op de tunnel.

      Let op:
      - de betegelde wanden van de fietstunnel, met de atoomdeuren erachter
      - de garagedeur aan de kant van de Mauritsstraat, die in oorlogstijd dichtgemetseld zou worden
      - de drie luchtuitlaten in de muur
    attributes:
      architect: Dienst der Publieke Werken (G.F. Janssonius, Dick Slebos)
      original_use: Openbare atoomschuilplaats in een brughoofd
    sources:
      - https://arcam.nl/wp-content/uploads/2022/10/Fietsroute-langs-de-Openbare-Schuilplaatsen-van-Amsterdam-1.2.pdf
      - https://nl.wikipedia.org/wiki/Brug_325
      - https://nl.wikipedia.org/wiki/Torontobrug

- title: Horse-tram depot, Linnaeusstraat
  summary: "A turreted corner building of red and cream brick, now a yoga studio, is what is left of the depot of the horse tram from the Dam. When line 9 went electric, 250 tram horses were auctioned here on 4 January 1904."
  body: |
    In 1884 the Amsterdamsche Omnibus Maatschappij (AOM) opened a horse-tram line from the Dam to the Linnaeusstraat, with its terminus close by. Abraham Salm, who also designed the AOM's depot on the Amstelveenseweg, built the stabling for its horses and cars here. In 1903 the line was replaced by the electric tram line 9, and the horses were no longer needed: on 4 January 1904 the depot held a big horse sale at which 250 tram horses went under the hammer, fetching between 100 and 250 guilders each.

    The depot lived on as a shed for the old horse trams, which now ran as trailers behind the electric motor cars, until the 1930s. Then it stored retired tram stock until 1952, and later served as a warehouse and garage. In 1986 most of the complex was pulled down for housing. The main building on the Linnaeusstraat survived. It is not a listed monument. Sources differ on its date (1884 in most accounts, 1893 in a list of Salm's works, 1886 in the building register). It never got a second life as a monument; today it is a yoga studio.

    Look for:
    - the corner turret with its slate spire and the gabled dormers
    - the bands of red brick against cream render on both street fronts
    - the newer housing beside it, on the site of the demolished sheds
