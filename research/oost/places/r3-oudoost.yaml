  nl:
    title: Paardentramremise Linnaeusstraat
    summary: "Een hoekgebouw met torentje in rode en crèmekleurige steen, nu een yogastudio, is wat rest van de stalling van de paardentram vanaf de Dam. Toen lijn 9 elektrisch ging, kwamen hier op 4 januari 1904 250 trampaarden onder de hamer."
    body: |
      Op 4 januari 1904 stonden hier 250 paarden te wachten op een koper. Ze hadden jaren de tram getrokken, maar sinds lijn 9 elektrisch reed waren ze overbodig. Op de grote paardenveiling in de remise brachten ze elk tussen de 100 en 250 gulden op.

      De Amsterdamsche Omnibus Maatschappij (AOM) begon in 1884 met een paardentram van de Dam naar de Linnaeusstraat, met het eindpunt vlak in de buurt. Voor de paarden en de wagens liet de AOM hier een stalling bouwen door Abraham Salm, die ook haar remise aan de Amstelveenseweg tekende. In 1903 nam de elektrische lijn 9 het over.

      Het gebouw bleef nog lang tramremise. De oude paardentrams reden voortaan als bijwagen achter de elektrische motorwagens en werden hier gestald, tot in de jaren dertig. Daarna stond er afgedankt trammaterieel tot 1952, en later diende het als opslagloods en garage. In 1986 ging het grootste deel tegen de vlakte voor woningbouw, maar het hoofdgebouw aan de Linnaeusstraat bleef staan. Monument is het niet. Over het bouwjaar zijn de bronnen het oneens: meestal 1884, in een lijst van Salms werk 1893, in het gebouwenregister 1886. Een tweede leven als monument kreeg het nooit; tegenwoordig zit er een yogastudio in.

      Let op:
      - het hoektorentje met leien spits en de dakkapellen met puntgevel
      - de banden rode baksteen tegen crèmekleurig pleisterwerk aan beide straatkanten
      - de nieuwere woningen ernaast, waar de gesloopte loodsen stonden
    attributes:
      built: jaren 1880
      original_use: Paardentramremise met stallen
    sources:
      - https://nl.wikipedia.org/wiki/Remise_Linnaeusstraat
      - https://nl.wikipedia.org/wiki/Abraham_Salm

- title: Hertzberger's Montessori College Oost
  summary: "Herman Hertzberger built this school for teenagers from more than fifty countries as a city: no corridors, one big hall where stairs double as grandstands, and balconies from which everyone can see everyone. Now the Montessori Lyceum Oostpoort."
  body: |
    Montessori College Oost opened on the Polderweg in 2000 as a secondary school for 1,200 to 1,600 pupils from no fewer than 56 nationalities, many with little Dutch. Herman Hertzberger, the architect of Centraal Beheer in Apeldoorn and the Apollo schools in Zuid, started from a blunt observation: teenagers would rather hang out on the street than at school. So he designed the school as a city. Almost all the space outside the classrooms is merged into one big "urban" hall, a square open to the void of the classroom block. The half flights of stairs between the floors are deliberately wide, like grandstands, so that lessons can be held there and pupils are encouraged to sit and meet; stairs, landings, voids and open corners are arranged so that the presence of others is felt everywhere.

    It is a bet that openness and being seen make for a better school, and it is the opposite of the corridor school of classrooms off a hallway. The hall also holds a tapestry woven after designs by the Cobra painter Anton Rooskens, who had painted a mural in the canteen of the old school across the road where he worked; when that building was demolished the wall was too damaged to move. Since 24 May 2006 the school also has an Auschwitz plaque with a text by the singer and poet Huub van der Lubbe. A sports hall by the same firm followed in 2016–2019, and the school is now called Montessori Lyceum Oostpoort, a vmbo school that also has a havo/vwo stream.

    This is a working school: the hall, the plaque and the tapestry are inside and not open to visitors. From the Polderweg you see the long glazed fronts with their balcony bands under a low, overhanging roof.

    Look for:
    - the stacked balconies and glazed fronts that hint at the open hall inside
    - the mosaic sitting wall at the front, designed by pupils, with texts along its length
    - the newer sports hall beside the school
