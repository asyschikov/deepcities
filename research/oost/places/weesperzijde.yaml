  nl:
    title: Voormalig belastingkantoor, Wibautstraat 2 (Kohnstammhuis)
    summary: "Het belastingkantoor van het Rijk uit 1954-1958, bij oplevering het hoogste kantoorgebouw van Amsterdam, moest het gezag van de staat uitstralen: een zuilengalerij, hoekpaviljoens en grote wapens. Nu een hogeschoolgebouw aan de kop van de Wibautstraat."
    body: |
      Bij de oplevering was dit het hoogste kantoorgebouw van Amsterdam, en het moest ook het gezag van de staat uitstralen. Rijksbouwmeester Gijsbert Friedhoff, in functie van 1946 tot 1958, wilde dat rijksgebouwen de waardigheid van het openbaar gezag uitdrukten: een prominente plek, symmetrie, klassieke en Italiaans aandoende details en flinke wapenschilden. Samen met M. Bolten zette hij dit belastingkantoor neer op de plek van het oude Weesperpoortstation. Later kwam er kritiek op die aanpak, en de Wibautstraat, met haar rij zware kantoorkolossen, kreeg de bijnaam "de Stalinallee van Amsterdam".

      Het gebouw telt tien verdiepingen, met op de hoeken vier paviljoens van zeven. Langs bijna de hele gevel aan de Wibautstraat loopt een hoge entreehal, verdeeld door halfzuilen, zodat de hoge ramen samen een zuilengalerij lijken. Daarboven ligt een schuin dak met een fries van abstract reliëf. Boven de deuren aan beide uiteinden hangen de wapens van Amsterdam (rechts) en Nederland (links), gemaakt door de Utrechtse edelsmeden J. en E. Brom. In 1970 kwam er een soberder vleugel van zeven lagen bij. In de jaren negentig vertrok de Belastingdienst; sindsdien gebruikt de Hogeschool van Amsterdam het pand als Philip Kohnstammhuis, in 2008-2009 van binnen verbouwd. Met het voormalige gebouw van de Raad van Arbeid aan de overkant vormt het de poort naar de Wibautstraat. De derde toren, het Wibauthuis, ging in 2007 tegen de vlakte.

      Let op:
      - de entreehal aan de Wibautstraat die op een zuilengalerij lijkt
      - de twee wapens van J. en E. Brom boven de deuren
      - het reliëffries onder het overstekende dak van de hal
      - de vier hoge hoekpaviljoens
    attributes:
      original_use: Belastingkantoor
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/530868
      - https://nl.wikipedia.org/wiki/Wibautstraat_(Amsterdam)

- title: De IJsbreker, Weesperzijde 23
  summary: "Named after the icebreaker that kept the Amstel open from 1702, this 1885 café building by the Concertgebouw's architect hosted SDAP socialists, a national chess title match, a billiards temple and, from 1979 to 2005, Amsterdam's pioneering centre for new music."
  body: |
    From 1702 to about 1860 an icebreaker was moored here to keep the Amstel open in frost, so that boats could still bring fresh water in from the Vecht. The inn beside it took its name. In 1884-1885 A.L. van Gendt, who also designed the Concertgebouw, replaced the old coffee house with a café with flats above, a stable and a coach house, for the IJsbreker building company founded by the hotelier A.W. Krasnapolsky. The company built several of the houses on this stretch of the Weesperzijde.

    In the early twentieth century the café was a meeting place for artists and for leading figures of the SDAP (the social democratic party). In 1913 the Dutch chess championship between Rudolf Loman and Johannes Esser was played in an upstairs room, the moves telephoned down to a demonstration board in the café. It then became one of the country's best-known billiards halls. Many regulars were Jewish; when cafés were closed to Jews in November 1941 the café had to shut, and its furniture was auctioned. It closed for good in 1953 and became a clothing shop and later a warehouse.

    In 1979 the horn player Jan Wolff and the dancer Maureen Kramer rented the building. The first five concerts in 1980 grew to some three hundred a year, and De IJsbreker became the home of contemporary music in Amsterdam; the talk show Hier is... Adriaan van Dis was recorded here too. Wolff spent decades campaigning for a proper hall, and in 2005 the centre moved into the new Muziekgebouw aan 't IJ. Since 2010 the building has been a café-restaurant again, De Ysbreeker, which kept the arches and a heavy five-legged Wilhelmina billiard table.

    Look for:
    - the three big round arches of the café between the two tall corner bays
    - the porches on either side, with Doric columns and curved pediments
    - the spout gables at both ends, breaking through the cornice
    - the view of the Amstel where the icebreaker lay
  category: hidden-history
  lat: 52.357539
  lng: 4.906755
  address: Weesperzijde 23
