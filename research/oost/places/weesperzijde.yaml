  nl:
    title: Voormalige lingeriefabriek Veerkamp, Marcusstraat
    summary: "Een fabriek voor blouses en lingerie uit 1897-1898 waar naaimachines en liften op stoom draaiden, in 1914 verdubbeld met een voor die tijd vroeg betonskelet en later een vakschool voor industrienaaisters. Twee gevelhelften vol boogvensters van vader en zoon Langhout."
    body: |
      De naaimachines draaiden op stoom, en de liften ook. Ferdinand Veerkamp begon in 1888 met lingerie en blouses aan de Oudezijds Voorburgwal; in 1897 had hij al 110 mensen in dienst en zat hij krap. Willem Langhout tekende daarom deze fabriek in de Marcusstraat: voorin kantoren, een woning voor de conciërge en kamers om te pakken en monsters te bewaren, boven de werkplaatsen. In 1914 ging de fabriek aan de linkerkant twee keer zo groot. Dat deel is van zoon G.J. Langhout en rust op een betonskelet, voor dat jaar een vroege toepassing. De hoofdingang verhuisde mee naar de nieuwbouw. Naast de deur stond toen nog de mosterd-, azijn- en zuurfabriek van J.A. Luycks.

      In de jaren twintig liep het bedrijf vast en ging het dicht. Vanaf 1930 zat hier de tweede vakschool voor industrienaaisters, na de oorlog een school voor meisjes. Nu wonen er mensen, deels begeleid, en zit er een restaurant. De gemeente maakte het een monument omdat het zo groot is tussen de lagere woonhuizen eromheen, en als goed voorbeeld van het werk van W. en G.J. Langhout, die in Amsterdam vooraan stonden in de bouw van fabrieken.

      Let op:
      - de twee helften van de gevel: rechts het deel uit 1898, links het hogere deel uit 1914
      - de lange rijen ramen met ontlastingsbogen erboven
      - de ingang van de uitbreiding uit 1914
    attributes:
      original_use: Lingerie- en blousefabriek
    sources:
      - https://data.amsterdam.nl/monumenten/786cd3d2-26d0-44d3-9d89-78ede35a7e99
      - https://amsterdamopdekaart.nl/1850-1940/Marcusstraat/46-52

- title: De Buurtoptimist (Sarah van Sonsbeeck)
  summary: A bronze folded newspaper on a waterside bench, for Diana Gemert, the "queen of the neighbourhood" who told neighbours she worked undercover for The New York Times. She died in 2022 in a fire in a flat cut off from gas and power.
  body: |
    Diana Gemert, born in Paramaribo, was a well-known and much-loved figure in her neighbourhood. In NRC's obituary Leonie van Nierop called her the queen of the neighbourhood. She once told neighbours she worked for The New York Times investigating fraud, and had come to the Netherlands undercover, founding a newspaper as her cover; she also spoke of a son who was sometimes an astronaut, sometimes the director of Google. "Reality and fantasy got mixed up now and then," the writer and neighbour Karina Schaapman said at her funeral, "but that doesn't matter, because her warm greeting was always real."

    On the night of 10 October 2022 she died in a fire in her flat in Oost, probably caused by burning candles: her home had been cut off from gas and electricity. Neighbours made sure she did not get a lonely funeral and started a collection, which grew into the idea of a bench for Diana. With them, the artist Sarah van Sonsbeeck designed the memorial as the little newspaper Diana had wanted to publish herself: De Buurtoptimist (The Neighbourhood Optimist), a bronze plaque in the shape of a folded paper, lying on a bench by the water. Van Sonsbeeck has said she made it partly because Amsterdam has so few memorials to women. The pin is on the waterside opposite Weesperzijde 12.

    Look for:
    - the bronze newspaper lying on the bench, as if someone just put it down
    - the view over the Amstel
  category: street-art
  lat: 52.35822
  lng: 4.906
  address: Waterside, opposite Weesperzijde 12
  links:
    - { label: Stadscuratorium, url: "https://stadscuratorium.nl/collectie/de-buurtoptimist/" }
    - { label: Annet Gelink Gallery, url: "https://annetgelink.com/news/557" }
  attributes:
    rank: Nice
    built: "2023"
    artist: Sarah van Sonsbeeck
  sources:
    - https://stadscuratorium.nl/collectie/de-buurtoptimist/
    - https://annetgelink.com/news/557 (location Weesperzijde 12, women's memorials)
    - "https://annetgelink.com/news/557 (search snippet: Weesperzijde 12; few memorials to women)"
  nl:
    title: De Buurtoptimist (Sarah van Sonsbeeck)
    summary: "Een bronzen krantje ligt op een bank aan de Amstel, voor Diana Gemert: de 'koningin van de buurt', die haar buren vertelde dat ze undercover voor The New York Times werkte. In 2022 stierf ze bij een brand in haar woning, waar gas en stroom waren afgesloten."
    body: |
      Volgens haar eigen verhaal was Diana Gemert geen gewone buurvrouw. Ze werkte voor The New York Times, zei ze, als fraudeonderzoeker, en was undercover naar Nederland gekomen. De krant die ze hier zou oprichten was alleen een dekmantel. Ze had ook een zoon, die de ene keer astronaut was en de andere keer directeur van Google. Schrijver en buurvrouw Karina Schaapman zei bij haar begrafenis dat feit en verzinsel bij Diana weleens door elkaar liepen. Maakte niet uit, want haar hartelijke groet was altijd echt.

      Gemert kwam uit Paramaribo en was in de buurt bekend en geliefd. Leonie van Nierop noemde haar in een NRC-necrologie de koningin van de buurt. In de nacht van 10 oktober 2022 kwam ze om bij een brand in haar flat in Oost, vermoedelijk door brandende kaarsen: gas en stroom waren afgesloten.

      De buren lieten haar niet eenzaam begraven. Ze haalden geld op, en uit die actie groeide het plan voor een bankje voor Diana. Kunstenaar Sarah van Sonsbeeck bedacht samen met hen wat erop moest komen: het krantje dat Diana zelf had willen maken, De Buurtoptimist. Het is een opgevouwen krant van brons, neergelegd op een bank aan het water. Van Sonsbeeck heeft gezegd dat ze het mede maakte omdat Amsterdam zo weinig gedenktekens voor vrouwen heeft. De speld staat aan de waterkant tegenover Weesperzijde 12.

      Let op:
      - de bronzen krant op de bank, alsof iemand hem daar net heeft laten liggen
      - het uitzicht over de Amstel
    sources:
      - https://stadscuratorium.nl/collectie/de-buurtoptimist/

- title: Wibautstraat, the newspaper street
  summary: "For decades three national dailies, de Volkskrant, Het Parool and Trouw, were made on this wide post-war road. The papers left in 2003-2007; their offices became a club, a student hotel and the Volkshotel."
  body: |
    The Wibautstraat was laid out from 1939 on the bed of the railway that had run from the Weesperpoort station towards Utrecht since 1843, and named after the socialist alderman Floor Wibaut (the occupiers renamed it Weesperpoortstraat from 1942 to 1945). Its big office blocks, from the tax office to the newspaper buildings, earned it nicknames like "the Stalinallee of Amsterdam" and the ugliest street in town.

    The newspapers made it Amsterdam's Fleet Street. De Volkskrant moved into a new head office at no. 150 in 1965. Het Parool followed in 1970 in a building by Van den Broek en Bakema at no. 131, and Trouw on 21 February 1976 in an office tower added to it; the triangle of land around them is still called the Parooldriehoek. Het Parool left in 2003, de Volkskrant and Trouw in 2007. What happened next helped turn the street around: from 2009 to 2015 the Trouw building housed the nightclub Trouw, while the Volkskrant building got the restaurant Canvas in the old staff canteen on the seventh floor (2007), studios for artists and, from 2014, the Volkshotel. Instead of the demolition once planned, the Parool tower and the Trouw building were kept and renovated, with a student hotel among the new uses. The pin is on the Volkshotel.

    Underground, the metro station turned the street's trade into art. While the station was being finished in 1974–1977, the political cartoonist Opland (Rob Wout, of de Volkskrant and De Groene Amsterdammer) got the brief "make it something journalistic" and took it literally. His five works tell the whole story of a newspaper: printer's letters tumbling down the platform walls on their way to the page, a 19th-century street photo repeated over the south stairs, drawings of printing presses seen through small peepholes in the south hall, a wall of jumbled 1977 headlines (some about building the metro) above the stairs, and in the middle of the platform a concrete hut whose walls carry the faint front pages of papers, cast from the moulds used to print them. You need a metro ticket to see it.

    The station was also built for a war that never came. When the East Line was dug, Wibautstraat, Weesperplein and Nieuwmarkt were fitted out as public nuclear shelters; Wibautstraat could hold up to 3,000 people. Nothing of this is signposted here. The clearest view of the system is one stop on, at Weesperplein (finished in 1979 for 12,000 people), where a sliding door and an air lock sit just inside the entrance at the corner of the Rhijnspoorplein and the Sarphatistraat, before the ticket gates.

    Look for:
    - the former Volkskrant building at no. 150, now the Volkshotel, with Canvas on top
    - the Parool and Trouw buildings across the road at nos. 125-131
    - the green central reservation that replaced the four-lane road's service lanes
    - in Wibautstraat metro station, Opland's falling letters, the headline wall and the concrete hut with ghost front pages
    - the shelter's sliding door and air lock at the Rhijnspoorplein entrance of Weesperplein station, one stop towards the centre (no ticket needed)
  category: hidden-history
  lat: 52.353753
  lng: 4.911791
  address: Wibautstraat 125-131 and 150
  links:
