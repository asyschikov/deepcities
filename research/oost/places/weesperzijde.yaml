    - { label: Wikipedia (nl) Volkshotel, url: "https://nl.wikipedia.org/wiki/Volkshotel" }
    - { label: Volkshotel history (press kit), url: "https://www.volkshotel.nl/media/uploads/2019/09/VH_perskit_001_geschiedenis_ENG-DEF.pdf" }
