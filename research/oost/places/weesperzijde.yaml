  nl:
    title: De IJsbreker, Weesperzijde 23
    summary: "Hier lag vanaf 1702 een ijsbreker die de Amstel bij vorst openhield, en de herberg ernaast nam zijn naam over. In het pand uit 1885, van de architect van het Concertgebouw, kwamen SDAP'ers samen en klonk van 1979 tot 2005 de nieuwste muziek van Amsterdam."
    body: |
      Van 1702 tot ongeveer 1860 lag hier een ijsbreker. Als het vroor, hield hij de Amstel open, zodat schepen vers water uit de Vecht konden blijven aanvoeren. De herberg ernaast noemde zich ernaar. In 1884-1885 maakte het oude koffiehuis plaats voor een café met woningen erboven, een stal en een koetshuis, ontworpen door A.L. van Gendt, die ook het Concertgebouw tekende. Opdrachtgever was bouwmaatschappij De IJsbreker van hotelier A.W. Krasnapolsky, die meer huizen aan dit stuk Weesperzijde neerzette.

      Begin twintigste eeuw zaten hier kunstenaars en kopstukken van de SDAP, de sociaaldemocratische partij. In 1913 speelden Rudolf Loman en Johannes Esser in een zaal boven om het Nederlands kampioenschap schaken. Hun zetten gingen per huistelefoon naar beneden, waar het publiek ze op een groot demonstratiebord volgde. Daarna groeide het café uit tot een van de bekendste biljartzalen van het land. Veel vaste gasten waren Joods; toen cafés in november 1941 verboden terrein werden voor Joden, moest de zaak dicht en ging het meubilair onder de hamer. In 1953 sloot het café voorgoed. Er kwam een kledingzaak in, later een magazijn.

      In 1979 huurden hoornist Jan Wolff en danseres Maureen Kramer het pand. Uit vijf concerten in 1980 groeiden er zo'n driehonderd per jaar, en De IJsbreker werd de thuisbasis van de eigentijdse muziek in Amsterdam. Ook de talkshow Hier is... Adriaan van Dis werd hier opgenomen. Wolff ijverde tientallen jaren voor een echte concertzaal, en in 2005 trok het centrum naar het nieuwe Muziekgebouw aan 't IJ. Sinds 2010 is het weer een café-restaurant, De Ysbreeker, met de oude bogen en een loodzwaar Wilhelminabiljart op vijf poten.

      Let op:
      - de drie grote rondbogen van het café tussen de twee hoge hoekpartijen
      - de portieken aan weerszijden, met Dorische zuilen en gebogen frontons
      - de tuitgevels aan beide uiteinden, die door de kroonlijst steken
      - het uitzicht op de Amstel, waar de ijsbreker lag
    attributes:
      original_use: Café met bovenwoningen
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/526992
      - https://nl.wikipedia.org/wiki/De_Ysbreeker
      - https://amsterdamopdekaart.nl/1850-1940/Weesperzijde/De_IJsbreker

- title: Weesperzijde 4-15, riverfront villas
  summary: The northern end of the Weesperzijde, where the city's well-to-do moved to the Amstel from 1879. Rich stucco pilasters, balconies on scrolled brackets and the chocolate maker Blooker's town house with its stable in the back.
  body: |
    The Weesperzijde follows the old road along the east bank of the Amstel towards Weesp. From about 1880 private developers lined it with spacious houses for well-off families, turning it into a monumental avenue facing the river. This stretch, ending at the corner of the Eerste Boerhaavestraat, was built in 1879-1888 house by house, by a handful of builders and architects, so the row reads as a catalogue of nineteenth-century tastes, from sober classicism to exuberant plaster. Houses such as nos. 4-5 and 8 had a narrow bay for stairs and service rooms and a wide bay with rooms en suite, a kitchen in the back extension and steps down to a garden.

    The pin is on Weesperzijde 11, built in 1882 for C.F.J. Blooker, a director of the Blooker cocoa and chocolate factory, which moved to a large site at the Omval in 1886. Blooker had a stable for four horses built behind the house, reached from Swammerdamstraat 20, where the gateway can still be seen. From 1940 into the 1980s the Salvation Army used no. 11 to house single women. The interior of the basement and bel-étage is largely intact.

    Look for:
    - Weesperzijde 4-5 (J.W. Hoffmann, 1880): white plaster ornament, Ionic and composite pilasters, vases between the top windows
    - Weesperzijde 6-7 (H.H. Saager, 1881): stacked pilasters and a mansard roof
    - Weesperzijde 8 (J. van Oostveen, 1881): balcony on scrolled brackets under a curved pediment
    - Weesperzijde 9-10 (Saager, 1881): a mirrored pair with garlands under the eaves and round roof windows
    - Weesperzijde 11: stone-clad lower floors with Ionic capitals hung with festoons
    - Weesperzijde 13-14 (W.J. Zielschat, 1888): an eighteenth-century look with a projecting centre bay
    - Weesperzijde 15 (H. Keijser, 1879-1880): the lower corner house with tall flat pilasters
  category: housing
  lat: 52.358301
  lng: 4.906409
  address: Weesperzijde 4-15
  links:
