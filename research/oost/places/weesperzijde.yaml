  nl:
    title: Villa Weesperzijde 70
    summary: "Een vrijstaande villa uit 1883-1885 met een hoekerker die zich als torentje gedraagt, op de plek van buitenplaats Spoor- en Amstelzicht tussen rivier en spoor. Vanaf 1923 was het een tehuis van het Leger des Heils voor vrouwen, en het Leger zit er nog steeds."
    body: |
      De naam zei alles: Spoor- en Amstelzicht. Die buitenplaats lag ingeklemd tussen de Amstel en de spoorlijn, die toen liep waar nu de Wibautstraat ligt. J.A. Zaal kocht het buitenhuis in 1882, liet het afbreken en gaf architect Willem Langhout opdracht voor deze stadsvilla op de Grensstraathoek, plus een royale tuin. In 1901 werd het te koop aangeboden: rijk beschilderd, grote tuin, vier koepelkamers en twee salons met parket. Een telg uit de familie Mendes da Costa kocht het; in 1918 trok textielfabrikant Jacques Kattenburg erin.

      Vijf jaar later, in 1923, werd het Leger des Heils eigenaar. Het begon er een tehuis voor vrouwen en meisjes, en het Leger gebruikt het pand nog altijd. Kijk naar de voorkant: twee driezijdige erkers van twee verdiepingen hoog, met daartussen een smalle, iets terugliggende strook met de voordeur. Je komt er via een gebogen stenen trap. De linker erker draait de hoek om en loopt uit in een soort toren, met een sierhek als kroon. Gepleisterde banden, lijsten en raamomlijstingen met balusters, pilasters en arabesken steken af tegen de bruine baksteen.

      Let op:
      - de torenachtige hoekerker aan de Grensstraat, met het hekwerk erbovenop
      - de gebogen stenen trap en de rijk gesneden entree
      - de gepleisterde raamomlijstingen met balusters en arabesken
      - de getraliede, getoogde kelderramen in de stenen plint
    attributes:
      original_use: Villa
    sources:
      - https://data.amsterdam.nl/monumenten/26023556-7a6b-4c59-b2a3-a3d12e93dfff
      - https://amsterdamopdekaart.nl/1850-1940/Weesperzijde/70

- title: Swammerdambuurt and its four-cornered square
  summary: "A small 1880s quarter behind the Weesperzijde whose crossing was designed as a square, each corner a different take on Dutch Renaissance. Look for Van Gendt's matching blocks, a 1921 bakery front and a 1950s garage that fits right in."
  body: |
    The Swammerdambuurt grew in the 1880s between the Amstel and the railway line to the Weesperpoort station (now the Wibautstraat). In 1881 the architect A.L. van Gendt drew a plan for the developers that extended the Swammerdamstraat past the Ruyschstraat and made their crossing the heart of the quarter: the four corner blocks were cut off at an angle so that the crossing became a small square. In the middle stood a traffic island with a gas lamp and a drinking fountain, a gift from the industrialist Wilhelm Hibbeln, whose lamp works lay nearby and whose workers rented many of the flats. The fountain had to go in the late 1930s when the tram came through. The wide Ruyschstraat and the square give the quarter an intimacy and allure the city register compares with the Helmersbuurt in Oud-West, and unlike much of Oost it escaped urban renewal almost intact.

    Each corner is a different variant of Dutch Renaissance, now baroque, now early. Van Gendt himself designed houses here for the IJsbreker building company, among them the two matching blocks facing each other at Ruyschstraat 3-9 and 4-10. The pin is on the Ruyschstraat 11-13 corner. The ensemble also takes in a corner block of 1880 on the Eerste Boerhaavestraat and a 1954 garage with sixteen flats above in the Blasiusstraat, a modern infill that still answers the vertical rhythm of its nineteenth-century neighbours.

    Look for:
    - the four cut-off corners of the Ruyschstraat and Swammerdamstraat crossing
    - Ruyschstraat 3-9 and 4-10: Van Gendt's matching blocks facing each other
    - Ruyschstraat 11-13: red brick with white plastered bands
    - Swammerdamstraat 71-73 / Blasiusstraat 31-35 (Van Gendt, 1884), restored in 2001
    - Eerste Boerhaavestraat 5-7: an Amsterdam School shopfront, converted to a bakery in 1921
    - Blasiusstraat 13-19 (J. van Amstel jr., 1954): four wide garage doors under brick and concrete flats
  category: housing
  lat: 52.357013
  lng: 4.907744
  address: Ruyschstraat and Swammerdamstraat crossing, Eerste Boerhaavestraat 1-9, Blasiusstraat 13-19
