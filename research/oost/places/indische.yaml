  nl:
    title: Spoorwegwoningen, Sumatrastraat
    summary: "Een blok uit 1914 van W. Greve voor de woningbouwvereniging van de Hollandsche IJzeren Spoorweg-Maatschappij. De gevel wijkt drie keer diep terug, zodat hij zigzaggend langs de Bankastraat en de Madurastraat loopt."
    body: |
      Drie keer hapt de gevel aan de Bankastraat en de Madurastraat diep in de rooilijn, zodat de voorkant meandert.

      Het eerste stuk van de Indische Buurt kreeg in 1897 een stratenplan dat de licht gebogen lijnen van oude poldersloten volgde. Particuliere bouwers vulden het grotendeels met de gebruikelijke gesloten blokken. Op deze hoek ging het anders. In 1914 liet de woningbouwvereniging van de Hollandsche IJzeren Spoorweg-Maatschappij (HIJSM) hier woningen voor haar personeel bouwen, naar ontwerp van W. Greve.

      Greve brak de gebruikelijke vlakke straatwand open. Op de ene hoek wijkt het blok terug, op de andere steekt het juist naar voren. De voordeuren liggen per twee of per vier in portieken van wisselende diepte, onder korfbogen met stevige kunststenen aanzetstenen. Topgevels, schuine erkers met bakstenen balkons erop en ramen die keurig boven elkaar staan geven het geheel een staand ritme. Sinds 2014 is het gemeentelijk monument.

      Let op:
      - de drie diepe insnijdingen in de lange gevels
      - de portiekbogen met hun zware aanzetstenen en dunne, vloeiende profiellijst
      - de ovale raampjes in de deuren aan de Sumatrastraat
      - de erkers met bakstenen balkons op de hoeken
    attributes:
      original_use: Etagewoningen voor spoorwegpersoneel (H.IJ.S.M.)
    sources:
      - city:200750 (registertekst)

- title: Eigen Haard's "Indië I" and the Zeeburgerdijk row
  summary: Leliman's low-rise courtyard blocks of 1912–1914 for the housing society Eigen Haard, and his 1916 row on the dike opposite, its height stepped down to match. A tiled panel names the builder.
  body: |
    Ensemble of three municipal monuments by J.H.W. Leliman for the housing association Eigen Haard. They are pinned on the eastern block of Indië I at the Lampongstraat and Zeeburgerdijk.

    Indië I, built 1912–1914, is two closed courtyard blocks (A, east, and B, west) of only two storeys with roofs, upper and lower flats and originally shops on the corners. They have paired gables, big dormers and windows set out of line between the floors. A name stone on block A records "Woningbouw Vereeniging Eigen Haard 1913" and a stone on block B marks the society's tenth anniversary in 1919.

    In 1916 Leliman added the long row Zeeburgerdijk 59-109 on the narrow strip between the dike and the Lozingskanaal. It reads as one composition with Indië I: in its western half it rises to three and four storeys plus roof, but in the eastern half, opposite the low blocks, it steps down to two or three. A colourful tile panel between nos. 97 and 99 names Eigen Haard and the year 1916. A 1980s renovation replaced doors, windows and balconies, but the play of gables, decorated chimneys and roof shapes survives.

    Look for:
    - the tile panel of 1916 between Zeeburgerdijk 97 and 99
    - the Eigen Haard name stones on Indië I
    - the paired gables and the windows that do not line up
    - the height of the dike row dropping where it faces the low blocks
  category: housing
  lat: 52.365912
  lng: 4.937864
  address: Zeeburgerdijk 88-110 and 59-109, Lampongstraat 1-23
  links:
    - { label: Monumentenregister Amsterdam (200606), url: "https://data.amsterdam.nl/monumenten/febaf56c-c50f-4fa4-aa50-fe99331678f9" }
    - { label: Monumentenregister Amsterdam (200875), url: "https://data.amsterdam.nl/monumenten/3e6e1785-879d-474e-acb8-02a83b0efda5" }
    - { label: Monumentenregister Amsterdam (200668), url: "https://data.amsterdam.nl/monumenten/973f8954-47b9-4bb6-8e83-bcd5aaabec47" }
  attributes:
    rank: Okay
    heritage_status: Municipal monument
    monument_number: "200606, 200875, 200668"
    built: 1912–1916
    architect: J.H.W. Leliman
    original_use: Workers' housing for Eigen Haard
  photos:
    - commons:File:Zeeburgerdijk 104.JPG
  sources:
    - city:200606, 200875, 200668 (register texts)
  nl:
    title: Indië I van Eigen Haard en de Zeeburgerdijk
    summary: "Twee lage hofblokken van Leliman uit 1912–1914 voor woningbouwvereniging Eigen Haard, en tegenover op de dijk zijn lange rij uit 1916, die precies daar lager wordt. Een bont tegeltableau noemt de opdrachtgever."
    body: |
      Loop de Zeeburgerdijk af en kijk naar de daklijn: halverwege wordt de rij huizen ineens lager. Dat is geen toeval. Architect J.H.W. Leliman paste de hoogte aan zijn eigen lage blokken aan de overkant aan.

      Die blokken, Indië I, bouwde hij in 1912–1914 voor Eigen Haard. Het zijn twee gesloten hoven, A in het oosten en B in het westen, van maar twee bouwlagen met een kap, met boven- en benedenwoningen en oorspronkelijk winkeltjes op de hoeken. Ze hebben dubbele topgevels, flinke dakkapellen en ramen die per verdieping verspringen. Een steen op blok A meldt "Woningbouw Vereeniging Eigen Haard 1913"; een steen op blok B viert het tienjarig bestaan van de vereniging in 1919.

      In 1916 volgde de lange rij Zeeburgerdijk 59-109, op de smalle strook tussen de dijk en het Lozingskanaal. Die hoort er als één ontwerp bij. De westelijke helft telt drie en vier lagen plus kap; in de oostelijke helft, tegenover de lage hoven, blijft het bij twee of drie. Tussen nummer 97 en 99 zit een kleurig tegeltableau met de naam Eigen Haard en het jaartal 1916. Bij een renovatie in de jaren tachtig verdwenen de oude deuren, ramen en balkons, maar het spel van topgevels, versierde schoorstenen en dakvormen bleef.

      Alle drie zijn gemeentelijk monument. De pin staat op het oostelijke blok van Indië I, bij de Lampongstraat en de Zeeburgerdijk.

      Let op:
      - het tegeltableau uit 1916 tussen Zeeburgerdijk 97 en 99
      - de stenen van Eigen Haard op Indië I
      - de dubbele topgevels en de ramen die niet boven elkaar liggen
      - de dijkrij die lager wordt waar hij tegenover de lage blokken staat
    attributes:
      original_use: Arbeiderswoningen voor Eigen Haard
    sources:
      - city:200606, 200875, 200668 (registerteksten)

- title: Main sewage pumping station, Zeeburgerdijk
  summary: From 1913 to 1982 this pumping station pushed the city's untreated sewage through the "smeerpijp" (filth pipe) into the IJ. Three pumps still run in the basement; upstairs is now a restaurant.
  body: |
    Where the Borneostraat meets the Zeeburgerdijk at a sharp angle, right by the railway viaduct, stands a handsome brick pair: a supervisor's house with a squat stair tower and a tall machine hall, joined by a low link. Public Works built it in 1912, architect unknown, in a carefully detailed early 20th-century style with classical touches.

    It was opened on 2 September 1913 as the main sewage pumping station. It pumped waste water from as far as the Stadhouderskade to a jetty in the Buiten-IJ, where it was simply discharged. Until 1982 the sewage went into the IJ untreated, through a pressure main nicknamed the *smeerpijp*, the filth pipe. That only ended when the treatment plant on the Zeeburgereiland opened.

    The machines have gone from the hall, but deep below the building three pumps still work as an auxiliary station, driven from a small newer building to the east. The machine hall is a restaurant, the supervisor's house is an office. It became a municipal monument in 2012.

    Look for:
    - the squat stair tower with its zinc finial on the supervisor's house
    - the dark grey brick plinth with granite caps and drainpipe feet
    - the tall windows of the machine hall
    - the iron railings along the Borneostraat
  category: industrial
  lat: 52.365947
  lng: 4.933047
  address: Zeeburgerdijk 50-52
  links:
