  nl:
    title: Krugerhof
    summary: "Een hofblok uit 1929-1930 waarin elk trappenhuis twee trappen heeft die om elkaar heen draaien: een ruimtebesparende vondst van ontwikkelaar Van Saane, waarvoor een ontheffing van de bouwverordening nodig was. Sinds juni 2026 monument."
    body: |
      Stap een portiek in en je ziet twee trappen die om elkaar heen wentelen. Ontwikkelaar Van Saane bedacht dat om ruimte te sparen, en hij moest er speciaal toestemming voor krijgen. De Amsterdamse bouwverordening wilde namelijk dat elk trappenhuis op iedere verdieping een raam aan de straatkant had.

      Van buiten lijkt de Krugerhof een keurig blok in late Amsterdamse School rond een binnentuin. Het is gebouwd door de Maatschappij voor Moderne Woningbouw van Van Saane, in vier kleuren baksteen. A.J. Westerman tekende de gevels, J. Dunnebier de plattegronden. Per verdieping liggen twee woningen als een bajonetsluiting in elkaar, met het trappenhuis ertussen: de een is breed aan de straatkant, de ander achteraan. De bergingen kwamen niet op zolder, zoals toen gewoon was, maar op de begane grond. De tuin in het midden is alleen voor bewoners; in het tuinhuis staan gedeelde wasmachines en drogers.

      In juni 2026 werd het blok gemeentelijk monument.

      Let op:
      - de poort aan de Maritzstraat naar de binnentuin
      - het metselwerk in verschillende kleuren
      - even een blik in een portiek aan de Christiaan de Wetstraat, voor de dubbele trap
    attributes:
      original_use: Etagewoningen
    sources:
      - https://amsterdamopdekaart.nl/1850-1940/Tugelaweg/Krugerhof

- title: Kraaipanbuurt council housing and the Afrikanerplein
  summary: "About 650 council homes of 1920–1924 by Jan Gratama for the city's housing department, with two three-quarter-enclosed courtyards in the Kraaipanstraat, and a curved 1928 block on the Afrikanerplein."
  body: |
    Ensemble of ten city register records that are still in procedure to become municipal monuments, pinned on Kraaipanstraat 2-38, at the heart of the scheme.

    Right after the First World War the city's housing department (Gemeentelijke Woningdienst) commissioned Jan Gratama and G. Versteeg to design about 650 council homes in the Transvaalbuurt, in the area between the De la Reijstraat, Krugerstraat, Hofmeyrstraat and Transvaalkade. They chose a traditional style with Amsterdam School touches, with low-rise at the centre. In the middle are the two little courtyards of the Kraaipanstraat; Gratama wrote that these "three-quarter enclosed inner courts" came from the need to use the site for as many homes as possible. Shops were added too: eight in the Schalk Burgerstraat and one on the corner of the De la Reijstraat and the Albert Luthulistraat (then still the Louis Bothastraat). In the tight years after the war the money ran out halfway; the rest of the plan was only built ten years later, much more soberly and probably without Gratama.

    On the Afrikanerplein, J. Roodenburgh designed a block of mostly four-room flats for a private developer in 1928. According to the rental advertisement each had a bathroom, kitchen, veranda and attic room; its facade curves inward along the square.

    The records cover Kraaipanstraat 1-51 and 2-38, Schalk Burgerstraat 2-140 and 45-131, Albert Luthulistraat 1-41, De la Reijstraat 25-39, Transvaalkade 84-102, Colensostraat, Cronjéstraat and Transvaalstraat 131-143, the Vaalrivierstraat corner, and Afrikanerplein 1-23.

    Look for:
    - the two courtyards opening off the Kraaipanstraat
    - the former shop fronts on the Schalk Burgerstraat
    - the concave curved front of the Afrikanerplein block
  category: housing
