  nl:
    title: Oostenrijkse houten noodschool, Kraaipanstraat
    summary: Een houten bouwpakketschool uit Oostenrijk, geleverd met de Marshallhulp en naar verluidt betaald met Hollandse vis. Mogelijk de laatste van veertig in Nederland; nu drie woningen, verscholen achter de Kraaipanstraat.
    body: |
      Na de oorlog was er in Nederland een groot tekort aan klaslokalen. Tot 1952 werd dat om de kosten opgevangen met honderden tijdelijke, meestal houten noodgebouwen, waarvan er veel tot ver in de jaren zestig dienst deden. Alleen al Amsterdam had 140 houten noodscholen, waar twee generaties kinderen naar de kleuterschool of de lagere school gingen.

      Deze kwam tussen 1949 en 1951 uit Oostenrijk, als pakket van volledig voorbewerkt Oostenrijks hout dat plaatselijke aannemers in elkaar schroefden; in Nederland werden er veertig van zulke scholen opgebouwd. Volgens de architect die het gebouw later verbouwde, hoorde het bij de Marshallhulp en betaalde Nederland met een paar ton verse vis. De opzet lijkt op de ideeën van de Studiecommissie Amsterdamse scholen, die in 1949 de bekende H-school bedacht. Het is mogelijk de laatste Oostenrijkse noodschool, en een van maar drie Amsterdamse houten noodscholen die er nog staan, alle drie van een ander type: een Finse, een semipermanente H-school en deze.

      In 2016 werd het gemeentelijk monument en datzelfde jaar verbouwd tot drie middeldure huurwoningen (54A tot en met C). De oude lambrisering en prikborden zitten achter nieuwe wanden, maar de grote lokaalramen aan de kant van het schoolplein bleven. Het staat verscholen achter de straatwand; vanaf de Kraaipanstraat zie je er weinig van.

      Let op:
      - het lage houten gebouw achter de straatwand
      - de rij grote lokaalramen aan de schoolpleinkant
    attributes:
      original_use: Noodschool
      check_note: Hoeveel er van de school te zien is vanaf de Kraaipanstraat of het schoolplein.
    sources:
      - https://data.amsterdam.nl/monumenten/b958f67c-96dd-4362-8b71-9dbecb09ac0a
      - https://harveyotten.nl/2016/07/14/3-woningen-in-oostenrijkse-noodschool/

- title: Former Buurthuis Transvaal, Danie Theronstraat
  summary: Pi de Bruijn's first building (1973–1975), a concrete neighbourhood centre that bridges the street with a hall and a steel footbridge. Prize-winning in 1977, listed in 2025, now home to BOOST for newcomers.
  body: |
    Long before he designed the new Dutch parliament complex, Pi de Bruijn (born 1942) worked for the city's housing department. This neighbourhood centre, with his colleague Ruud Snikkenburg, was his first design; De Bruijn says he drew it "himself, down to the details". It replaced housing that had also been built as a gateway over the street and was pulled down because it was unsafe.

    The centre consists of two concrete volumes on either side of the Danie Theronstraat, linked by a bridge over the street that holds a large hall on its south side. A steel footbridge runs some three metres above the pavement, and on the Ben Viljoenstraat side a semi-transparent screen of corrugated sheeting closes off an empty space. In 1977 the architects won the Merkelbach Prize, the city's triennial architecture award. The building housed kindergarten, youth and teenage work and a public library branch.

    The neighbourhood centre closed in 2016. Since 2017 BOOST, an organisation that helps refugees and other newcomers settle in, with language classes and activities, uses it. Heritage society Heemschut nominated it as a monument in 2017 to prevent demolition, and in December 2025 it was listed.

    Look for:
    - the concrete bridge with the hall spanning the street
    - the steel footbridge above the pavement
    - the corrugated screen on the Ben Viljoenstraat side
