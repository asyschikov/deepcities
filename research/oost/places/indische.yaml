  sources:
    - "city:200691 (register text: 1903 plan, Gordel '20-'40 and Plan Zuid, 1905, 'two of the first buildings', setback around a small square as gateway, 'Bouwkunst en Impressionisme' 1893 and 'gescharrel met de vroegere vormen', functional decoration, quarter-round stairwells with zinc tent roofs and partly leaded glass, corner bays on consoles, gable with hoisting hook, 'het merendeel van de woningingangen' original, shops along the Pretoriusstraat still important for the neighbourhood)"
  nl:
    title: Poortblokken van Berlage, Pretoriusstraat
    summary: "De toegangspoort van de Transvaalbuurt: twee spiegelbeeldige blokken met winkels en bovenwoningen die H.P. Berlage in 1905 bouwde waar de Pretoriusstraat van de Linnaeusstraat aftakt, nog voor de rest van zijn wijk er stond. De meeste oorspronkelijke voordeuren zijn er nog."
    body: |
      Berlage tekende vanaf 1903 het stratenplan van de Transvaalbuurt, een eerste aanzet voor de Gordel '20-'40 en een voorloper van zijn beroemde Plan Zuid. Bij de ingang van de wijk ontwierp hij ook zelf de gebouwen: twee bijna gelijke blokken met winkels en bovenwoningen voor arbeiders en de lagere middenstand, in 1905 als een van de eerste neergezet.

      Het zijn zijn ideeën in baksteen. In zijn spraakmakende lezing *Bouwkunst en Impressionisme* uit 1893 riep Berlage architecten op te stoppen met het "gescharrel met de vroegere vormen", in grote lijnen en massa's te denken en uit te gaan van hoe een voorbijganger een gebouw beleeft. Hier wijken de twee blokken terug van de Linnaeusstraat rond een pleintje en leiden ze je de Pretoriusstraat in, met topgevels, hoekerkers en gebogen trappenhuizen als enige accenten. De versiering heeft een functie: hardstenen aanzetstenen bij de vensters, plastische consoles onder de erkers, ijzeren balkonhekjes.

      Op de begane grond zitten nog altijd winkels, net als verder langs de Pretoriusstraat, de winkelstraat van de buurt. Bij een renovatie zijn de meeste ramen vervangen, maar het merendeel van de woningingangen heeft nog de oorspronkelijke paneeldeuren met raampjes.

      Let op:
      - de kwartronde trappenhuizen met zinken tentdakjes, deels nog met glas-in-lood
      - de hoekerkers op sierconsoles, onder een topgevel met hijshaak
      - de oorspronkelijke paneeldeuren naar de bovenwoningen
    attributes:
      original_use: Winkels met bovenwoningen
    sources:
      - https://data.amsterdam.nl/monumenten/3f4485dc-31ac-47b7-97b6-eb9a7e6931ed

- title: Nieuw Uilenburg, Handwerkers Vriendenkring blocks
  summary: Leliman's sober blocks of 1917–1922 for a Jewish workers' building fund, home to families from the cleared Uilenburg slums. Most residents were deported in 1943; the HwV monogram is still in the gables.
  body: |
    Between the Tugelaweg, Maritzstraat, Retiefstraat and Cilliersstraat, J.H.W. Leliman designed five blocks of flats for the building fund of the Handwerkers Vriendenkring (HwV), a Jewish workers' association. Mayor Tellegen unveiled the foundation stone in July 1917 on the freshly raised building site; when the first block on the Maritzstraat was finished in April 1919, the fifty-year-old association received the city's gold medal for its housing work. Many of the first residents were Jewish families from the cleared Uilenburgerstraat in the old Jewish quarter, so the blocks became known as Nieuw Uilenburg.

    The shopkeepers on the Maritzstraat show who lived here: butcher Isaac Frank at no. 7, baker Isaac Meijer at 13, greengrocer Samuel Rimini at 21, grocer David Degen on the corner of the Retiefstraat. All of them were murdered in Auschwitz. After the residents had been deported, most of the wood was stripped from the empty homes for fuel in the last winter of the war, and the houses on the Spitskopstraat collapsed. The city, which took over the HwV property, rebuilt them low after the war.

    Two of the five blocks were replaced by new buildings in 2013–2015. Block 2 on the Tugelaweg is the most striking: its stepped-back fronts form a small square on both sides and close the view down the Smitstraat; it lost its roof turret in the 1950s. In November 2025 block 2, block 5 and the Maritzstraat side of block 1 became municipal monuments; the wider group of blocks is still in procedure. Owner Ymere plans to renovate the Maritzstraat homes and replace the postwar low-rise on the Spitskopstraat.

    Look for:
    - the HwV monogram high in the gables
    - the stepped-back fronts of block 2 at the end of the Smitstraat
    - the low postwar houses on the Spitskopstraat, a scar of the Hunger Winter
