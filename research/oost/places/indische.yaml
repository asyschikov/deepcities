  nl:
    title: Dubbele school van Publieke Werken, Batjanstraat
    summary: "Een dubbele lagere school uit 1924 van Publieke Werken: een vlakke bakstenen gevel waarvan de hoeken bij de ingangen opbollen als papier en door de daklijn heen steken. Nog altijd twee scholen."
    body: |
      Het gemeentelijk register zoekt naar woorden en vindt ze: de hoeken van deze school zijn vormgegeven "welhaast als bollend papier". Wie ervoor staat, ziet wat er bedoeld wordt.

      Tegenover een katholiek eiland in de buurt bouwde de gemeente in 1924 een dubbele school voor gewoon lager onderwijs, ontworpen door de afdeling Gebouwen van Publieke Werken. De indeling is eenvoudig: lokalen aan de achterkant, gangen en toiletten aan de voorkant, een gymzaal die achter uitsteekt, en twee aparte ingangen, één per school, tegen de zijmuren.

      Het mooie zit in die ingangen. De hoektraveeën buigen en vouwen naar voren, lopen boven het portiek uit in een scherpe punt, ronden op de bovenste verdieping af en eindigen boven de daklijn in een ronde bekroning. Daartussen geven lange rijen ramen met originele houten kozijnen een liggend tegenwicht aan de staande hoeken, op de manier van de Amsterdamse School.

      De lokalen zijn gemoderniseerd, maar het karakter is gebleven. Er zitten nog steeds twee scholen in: een vestiging van de katholieke basisschool De Waaier (nummer 82) en de islamitische basisschool El Faroeq (nummer 84). Sinds 2012 is het een gemeentelijk monument.

      Let op:
      - de twee gebeeldhouwde hoeken bij de ingangen en hun ronde bekroning boven de dakrand
      - de lange rijen ramen met liggende roeden ertussen
      - de originele dubbele deuren in de portieken
    attributes:
      original_use: Dubbele school voor Gewoon Lager Onderwijs
    sources:
      - city:200636 (registertekst)

- title: Berlage blocks on the Javaplein
  summary: Three closed blocks of 1911–1915 by H.P. Berlage for the housing society De Arbeiderswoning, with communal inner gardens and two extra cross streets Berlage added to get more sun into the flats.
  body: |
    Around 1910 the city invited housing associations, several of them newly founded under the influence of the Housing Act of 1901, to build in the unfinished part of the Indische Buurt. H.P. Berlage, the architect of the Beurs, designed three blocks here for De Arbeiderswoning (The Workers' Dwelling) between 1911 and 1915. He changed the street plan to do it: he introduced the two cross streets around the middle block, the Benkoelenstraat and the Langkatstraat, so that more sunlight reached the homes.

    Blocks II and III are almost identical closed blocks of 40 flats each, four storeys high around a shared inner garden, with stepped-in corners. Block I to the west is U-shaped. The long fronts of 24 window bays are calm and rational, livened up by stair-tower bays that rest on stepped brick corbels above segment-arched windows, and by sober decorative brickwork at the doors. They are national monuments, and they frame the Javaplein together with the former bathhouse and the library in the Borneohof.

    Look for:
    - the stair-tower bays on their stepped brick brackets
    - the inset corners where the blocks meet the side streets
    - block III on the Javaplein, which it shares with the 1942 bathhouse
  category: housing
  lat: 52.363579
  lng: 4.938988
  address: Javaplein 24-38, Langkatstraat, Benkoelenstraat, Balistraat
  links:
