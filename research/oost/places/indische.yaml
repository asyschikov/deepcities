  nl:
    title: Tuinblokken van Van der Pek, Balistraat
    summary: "Twee keer twee lange, platte woonblokken van J.E. van der Pek uit 1911-1912. Tussen het Rochdale-paar ligt volgens het rijksregister de eerste semi-openbare gemeenschappelijke tuin van Amsterdam, met een hek en twee poorthuisjes aan de Molukkenstraat."
    body: |
      Geen dicht bouwblok met ieder zijn eigen plaatsje, maar twee lange stroken woningen met één gedeelde tuin ertussen: dat was het experiment van J.E. van der Pek. Aan de korte kant, op de Molukkenstraat, liet hij het blok open. Een tuinhek en twee kleine poorthuisjes sluiten het daar af. Het rijksmonumentenregister noemt het de eerste semi-openbare gemeenschappelijke binnentuin van de stad.

      Het oostelijke paar (Balistraat 128-144 en Eerste Atjehstraat 135-151) verrees in 1911-1912 voor bouwvereniging Rochdale. Het telde 88 etagewoningen, elk met woonkamer, keuken en twee slaapkamers. De stijl is sober, maar de details kloppen tot in de kroonlijst, met tandlijst en trigliefen. Omdat je de achterkanten vanaf straat en tuin ziet, kregen ook die veel aandacht. Dit paar is rijksmonument.

      Het westelijke paar (Balistraat 106-126 en Eerste Atjehstraat 115-133) bouwde Van der Pek in 1911 voor de Vereeniging Amsterdamsche Bouwfonds: vijf lagen kleine flats in zeven typen, rode baksteen met banden geel geglazuurde steen en erkers met schuine kanten. Boven de kroonlijst zit nog een strook metselwerk die je amper ziet; alleen de ijzeren hijsbalken die eruit steken verraden hem. Sinds 2013 is dit paar gemeentelijk monument.

      In de tuin staat ook een oorlogsmonument. In juni 1945 kwam hier een steen voor drie jonge verzetsmannen, gefusilleerd in maart 1945: Johannes (Jan) Friederich en de broers Antonius en Gerardus Engelen. Friederich, meubelrestaurateur uit de Balistraat, verstopte wapens in zijn huis. Op 8 maart 1945 werd hij bij Rozenoord doodgeschoten, als represaille voor de aanslag op Hanns Rauter. Ook de broers Engelen zaten in het verzet. Op de steen staan hun namen en data, met daaronder: "Zij gaven hun jonge leven voor onze vrijheid". Later vond men de steen terug in de tuin; hij kreeg een vaste plek en een bordje met uitleg. Op 4 mei houden bewoners er een herdenking waar iedereen welkom is, met de ingang op Molukkenstraat 68-70.

      Let op:
      - het tuinhek en de twee poorthuisjes aan de Molukkenstraat
      - de tuin zelf, omlijst door de zorgvuldig afgewerkte achtergevels
      - de banden geel geglazuurde baksteen en de schuine erkers van het westelijke paar
      - de hijsbalken die boven de kroonlijst uitsteken
      - de gedenksteen uit 1945 in de tuin, voor iedereen open bij de bijeenkomst op 4 mei
    attributes:
      original_use: Etagewoningen voor Rochdale en de Amsterdamsche Bouwfonds
    sources:
      - rce:523310 (registertekst)
      - city:200665 (registertekst)
      - https://www.4en5mei.nl/oorlogsmonumenten/zoeken/4921/amsterdam-gedenksteen-in-de-binnentuin-van-het-van-der-pekblok
      - https://oost-online.nl/van-der-pekblok-gedenkt-op-4-mei-drie-mannen-die-in-tweede-wereldoorlog-zijn-geexecuteerd/

- title: Railwaymen's housing, Sumatrastraat
  summary: A 1914 block by W. Greve for the housing society of the Hollandsche IJzeren Spoorweg-Maatschappij, its fronts cut back three times so the facade meanders down the Bankastraat and Madurastraat.
  body: |
    The first part of the Indische Buurt, laid out in 1897 along the curving lines of old polder ditches, was mostly filled by private builders with standard closed blocks. This corner is different. In 1914 the housing association of the Hollandsche IJzeren Spoorweg-Maatschappij (HIJSM), the railway company, built flats for its staff here to a design by W. Greve.

    Greve broke up the usual flat street wall. Along the Bankastraat and the Madurastraat the facade is cut back deeply three times, so the front meanders; at one corner the block steps back, at the other it juts forward. The entrances sit in pairs or fours in porches of different depths, under basket arches with chunky artificial stone blocks. Gables, angled bays with brick balconies on top and windows stacked straight above each other give the block a vertical rhythm. It became a municipal monument in 2014.

    Look for:
    - the three deep recesses in the long fronts
    - the porch arches with their heavy imposts and thin flowing moulding
    - the oval windows in the doors on the Sumatrastraat
    - the bays with brick balconies at the corners
  category: housing
  lat: 52.364703
  lng: 4.934352
  address: Sumatrastraat 8-12, Bankastraat 52-68, Madurastraat 63-79
  links:
    - { label: Monumentenregister Amsterdam (200750), url: "https://data.amsterdam.nl/monumenten/f709d100-c8a2-4b00-a327-c6b13533b621" }
