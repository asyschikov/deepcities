  nl:
    title: Zeeburgerdorp (verdwenen)
    summary: "Een 'woonschool' van zo'n vijftig betonnen huisjes (1926–1944) waar de stad gezinnen onderbracht die nog niet klaar werden geacht voor een gewone nieuwbouwwoning, onder het oog van een opzichter. Alleen een plaquette op een brug herinnert eraan."
    body: |
      Douchen deed je in het kantoor, de was ook. Wie in Zeeburgerdorp woonde, moest voor allebei de deur uit.

      In 1926 bouwde de gemeente aan het eind van het Zeeburgerpad, met uitzicht op Gemaal Zeeburg, een dorp van zo'n vijftig betonnen huisjes van één laag. Het was een woonschool, zusje van Asterdorp in Noord. Gezinnen uit vochtige kelders en krotten, vaak groot, arm en soms zonder kostwinner, golden als te 'ontwricht' om meteen een nieuwe woning te krijgen. Hier moesten ze het leren, onder toezicht van een opzichter en onder het motto "Tijdelijk verblijf van gezinnen". Alleen waren de betonnen huisjes net zo vochtig als waar ze vandaan kwamen.

      Rond 1933 onderzocht psychiater Arie Querido de bewoners. Hij deelde ze in groepen in, van gezinnen die gewoon in armoede waren geraakt tot wie hij hopeloos vond. Maar erfelijkheid, concludeerde hij, was niet nodig om hun problemen te verklaren. Daarmee ging hij recht in tegen de eugenetici van zijn tijd.

      Rond de jaarwisseling 1943–1944 ontruimde de Duitse bezetter het dorp en verhuisde de gezinnen naar de binnenstad, deels naar woningen die leeg waren na de deportatie van Joden. In 1944 ging Zeeburgerdorp plat. Oud-bewoners bleven verdeeld: de een vond het vreselijk, de ander had er een fijne jeugd. Rond 1990 dook de naam weer op, als naam van een protest tegen twee nieuwe bruggen voor de doorgetrokken Panamalaan. De bruggen kwamen er toch, en op een ervan, de John Rädeckerbrug over het Lozingskanaal (1991), herinnert een plaquette aan het dorp.

      Let op:
      - de plaquette over Zeeburgerdorp op de John Rädeckerbrug
      - het Zeeburgerpad, aan het eind waarvan het dorp lag
    attributes:
      original_use: Woonschool
    sources:
      - https://nl.wikipedia.org/wiki/Zeeburgerdorp

# ================================================================ Transvaalbuurt

- title: Steve Bikoplein and the Smitstraat
  summary: "A square of 1909–1915 workers' flats, renamed in 1978 from Pretoriusplein after the South African civil rights campaigner who died in police custody. Author Theo Thijssen lived on the corner, and a stone marks the outbreak of World War I."
  body: |
    Ensemble of eight municipal monument records around the square and in the Smitstraat, pinned on Steve Bikoplein 18-24, the teachers' block on the southwest side.

    Berlage's plan for the Transvaalbuurt made the square a break in the Pretoriusstraat, a meeting point for the new workers' district. A church or schools were expected in the middle but never came, and the four sides were built up between 1909 and 1915 by different hands. The northwest side (2-12) is by H. van der Schaar with a striking central porch; the northeast side (3-11) by J.B. Sellmeijer, who built it for his own building firm; the southeast side (13-21) by Donker, with a corner turret toward the Laing's Nekstraat. The southwest side (18-24) was built in 1912–1914 by J.C. van Epen for the teachers' housing cooperative ACOB, with obtuse corners, five-sided bays and a plaque naming the ACOB. The attic rooms were reputedly meant for teachers to mark tests in peace. Theo Thijssen, teacher, union leader and author of *Kees de jongen*, lived in the ground-floor corner flat from 1913 to 1937. A stone at 18-20 records the outbreak of the First World War in July 1914: civilisation being shot to pieces by cannons from both sides. Round the corner, Laing's Nekstraat 29 (Sellmeijer) and 36-52 (Kuipers and Ingwersen, with a gateway) complete the picture.

    The square was the Pretoriusplein until 1 February 1978, when it was renamed after Steve Biko, who died in South African police custody in 1977; the new signs went up on 21 August 1978. The kiosk was covered in a mosaic in 2003 by Carmen Vossen with children from the neighbourhood. A short walk south, Smitstraat 29-49 (1915, Lippits, Scholte and Moolenschot) was part of the first project of the Catholic housing association Het Oosten, with round-arched doors, oculus windows and a gateway in the axis of the Majubastraat.

    Look for:
    - the World War I stone at Steve Bikoplein 18-20
    - the ACOB plaque and the five-sided bays on stone brackets
    - the corner turret of 13-21
    - Carmen Vossen's mosaic kiosk
    - the round arches and oculus windows of Smitstraat 29-49
