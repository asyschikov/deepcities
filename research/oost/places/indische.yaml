  nl:
    title: Hekkepoort, Flevopark
    summary: "Een smeedijzeren hek tussen twee zandstenen pijlers: ooit de buitenpoort van de Muiderpoort. In 1898 stond het het verkeer in de weg en werd bewaard; en in 1938 kwam het terug als ingang van het Flevopark. Van de oude stadspoorten is dit de enige voorpoort die nog bestaat."
    body: |
      Van de oude stadspoorten van Amsterdam heeft maar één voorpoort het overleefd, en die staat nu een flink eind van huis.

      In januari 1769 zakte de oude Muiderpoort van zijn fundering. Stadsbouwmeester Cornelis Rauws tekende een nieuwe, die nog altijd op het Alexanderplein staat. Aan het eind van de brug over de Singelgracht zette hij er een buitenpoort voor: twee zware pijlers van zandsteen met een dubbel hek van smeedijzer ertussen, met beeldhouwwerk van stadsbeeldhouwer Anthonie Ziesenis. Vanwege dat ijzeren hek heette het geheel de hekkepoort.

      In 1898 was de doorgang te krap voor het verkeer en moest de poort weg toen de brug werd veranderd. Slopen deed de stad niet: de stukken gingen de opslag in. Veertig jaar later, in 1938, ging de poort weer overeind bij de hoofdingang van het nieuwe Zuiderzee- of Nieuwe Diep-park, sinds 1943 het Flevopark. Dat park was aangelegd naar ideeën van Jac. P. Thijsse, deels door mannen uit de werkverschaffing. De opstelling bootst de oude toestand na: de brug aan de westkant (hier over de sloten van de Joodse begraafplaats), het groen aan de oostkant, zoals vroeger het open land buiten de wallen. De lage voetmuren die uit het water rijzen zijn van 1938. Sinds 2012 is de poort gemeentelijk monument.

      Er zwerft nog iets door dit park. Zo'n halve kilometer verderop, in het bos aan de zuidkant, staat een ruw zuiltje van zandsteenblokken met een plaatje: "Ter nagedachtenis aan Willem Anthonie Froger 1812–1883 die Amsterdam de weg naar zee wees". Fröger was de ingenieur van een vroeg plan voor een kanaal door de duinen, waar het Noordzeekanaal uiteindelijk op voortbouwde. Het zuiltje stond vanaf 1953 aan de kop van de Spaarndammerdijk bij de Nieuwe Hemweg, verhuisde naar de Oostelijke Handelskade bij de oude passagiersterminal en raakte daarna vergeten bij een opslagterrein van het park. Rond 2016 zette iemand het rechtop tussen pas geplante struikjes. In 2025 liep er een smal paadje van houtsnippers naartoe.

      Let op:
      - "ANNO" op de ene pijler en "1770" op de andere
      - de vazen met ijzeren ringen als hengsels boven op de pijlers
      - de krullende steunstukken die de pijlers lijken te stutten
      - de kleine stukjes nieuwe steen, ingezet om schade te herstellen
      - het zuiltje voor Fröger, verstopt in het bos aan de zuidkant van het park
    attributes:
      built: 1770, hier herbouwd 1938
      original_use: Voorpoort van de Muiderpoort
    sources:
      - city:200637 (registertekst)
      - https://nl.wikipedia.org/wiki/Muiderpoort_(Amsterdam)
      - https://geheugenvanoost.amsterdam/page/80207
      - https://nl.wikipedia.org/wiki/Willem_Anthonie_Froger

- title: Flevopark pumping station and the polder cottages
  summary: The chalet-style steam pumping station of 1880–1881 that kept the Overamstel polder dry until 1984, next to three wooden cottages of about 1885. A small gin distillery works in the old pump hall.
  body: |
    On the old quay along the Nieuwe Diep, in the Flevopark, stand a little chalet with a tall roof and three low wooden houses. Together they are what is left of the Overamstel polder, the land between the Singelgracht, Nieuwe Diep, Watergraafsmeer and Amstel that was drained in 1630.

    For two and a half centuries a wind-driven scoop-wheel mill lifted the polder water into the Nieuwe Diep here. In 1880–1881 the polder board replaced it with the *Overamstelsch Poldergemaal*, a steam pumping station designed by W.F.A. Beijerinck, a water engineer who had started his career on the Cruquius pumping station. It had a home for the engine driver and a tall chimney next door. It was electrified in 1916 and kept pumping until 1984; the last three keepers, father and son De Jong and then Jaap de Heus, ran it for almost sixty years between them. Stadsherstel restored it in 2009, and since 2010 the distillery 't Nieuwe Diep makes gin and liqueurs inside.

    The three wooden cottages next door (Flevopark 11-12) date from about 1885: former fishermen's houses, or homes from a vanished market garden. From 1896 the Pape family of market gardeners lived at no. 11; their grandson lived there until 1967. They also belong to Stadsherstel. Both are municipal monuments, listed in 1992.

    The park around them lies on a vanished hamlet. Outersdorp (also Houtersdorp or Ottersdorp), already named in a deed of Count William III in 1328, stood along the Sint Anthonisdijk, the sea dike on the IJ from the mouth of the Amstel to Muiden. In 1578 Protestants, who were not yet allowed to worship in Catholic Amsterdam, briefly held services there. It belonged to Diemen until Amsterdam annexed it in 1896, and it disappeared when the Indische Buurt was built. In December 1631 the States of Holland allowed the landowners of Outerwael and Outersdorp to embank the Overamstel polder; a ditch was dug through it, and at its end stood the Oetewaler mill, the scoop-wheel mill that lifted the water into the Nieuwe Diep. In 1866 it got an Archimedes screw instead, but the wooden screw broke in 1879, and in 1880 the mill was pulled down and the steam pumping station built on its foundations. Its date stones were spared at the demolition.

    Look for:
    - the overhanging chalet roof of the pumping station
    - the outflow on the Nieuwe Diep side
    - the three wooden cottages on the old quay
    - the Flevopark around you, laid out over Outersdorp; a stretch of its polder road survives in the park
