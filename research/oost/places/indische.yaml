    - { label: Wikipedia (nl) Gerardus Majellakerk, url: "https://nl.wikipedia.org/wiki/Gerardus_Majellakerk_(Amsterdam)" }
    - { label: Stadsherstel (archived), url: "https://web.archive.org/web/20240517110044/https://stadsherstel.nl/monumenten/nedpho-majellakerk/" }
