  nl:
    title: Gerardus Majellakerk en het katholieke complex (NedPhO-Koepel)
    summary: "De neobyzantijnse kerk van Jan Stuyt (1923-1926), geïnspireerd op de Aya Sophia, met pastorie, zusterhuis en scholen eromheen: een compleet katholiek bouwblok. Sinds 2012 de concertzaal van het Nederlands Philharmonisch Orkest."
    body: |
      In 1930 werd boven op deze koepel een moord gepleegd. Leidekker Joseph Maring bracht daar zijn compagnon Leendert Arkenbout om het leven en streek daarna het verzekeringsgeld op. Het 'Amsterdamse torendrama' leverde hem levenslang op.

      De kerk zelf is van een paar jaar eerder. In de jaren twintig nam de katholieke kerk een heel rechthoekig blok in beslag tussen Ambonplein, Obiplein, Batjanstraat en Halmaheirastraat. Jan Stuyt maakte er één enclave van: in het midden een kerk voor 1400 mensen, daaromheen een pastorie, een zusterhuis, een kinderbewaarplaats en drie scholen. Alle zeven gebouwen zijn rijksmonument.

      Stuyt had in 1903 op bedevaart de Byzantijnse kerken van het Heilig Land en Istanbul gezien. Net als een aantal van zijn andere kerken is dit een centraalbouw, met bovenop een enorm twaalfzijdig tentdak over een koepel binnen: een groet aan de Aya Sophia. Een westtoren stond op tekening maar kwam er nooit. Binnen waren de pendentieven ooit beschilderd met bijbelse taferelen, waarschijnlijk door Jan Oosterman; die zijn later overgeverfd.

      Toen de beter gesitueerden de buurt verlieten en de kerken leegliepen, kon de parochie het gebouw niet meer houden. Op 20 september 1992 was de laatste mis. Stadsherstel nam het over en André van Stigt maakte er verhuurbare ruimte van; van 1994 tot 2011 zaten hier het Clara Wichmann Instituut en vrouwenarchief Aletta (nu Atria). Sinds 2012 is het de NedPhO-Koepel, waar het Nederlands Philharmonisch Orkest en het Nederlands Kamerorkest repeteren en waar onder de koepel publieksconcerten zijn.

      De onderdelen: de kerk (Batjanstraat 3-11), de pastorie (Ambonplein 55, het vrijstaande hoekhuis met een zigzagfries van blauwe tegels), zusterhuis St. Theresia (Obiplein 14-16), de Pastoor Hesseveldschool voor meisjes (Obiplein 18), de kinderbewaarplaats (Halmaheirastraat 28, één laag met kleurige tegels), de St. Vincentius-ULO voor jongens (Halmaheirastraat 30, hoek Batjanstraat) en de meisjesschool op Batjanstraat 13, nu Kleuterschool Miriam.

      Let op:
      - het twaalfzijdige tentdak, het best te zien vanaf het Ambonplein
      - de stompe westgevel, waar de toren had moeten komen
      - de kleurige friezen van baksteen en tegels onder de dakranden van de scholen en de kinderbewaarplaats
      - het restje tuinmuur bij de pastorie
    attributes:
      built: 1923–1926
      original_use: Rooms-katholieke kerk met pastorie, zusterhuis, kinderbewaarplaats en scholen
    sources:
      - rce:523303-523309 (registerteksten)
      - https://nl.wikipedia.org/wiki/Gerardus_Majellakerk_(Amsterdam)

- title: Public Works double school, Batjanstraat
  summary: A 1924 double primary school by the city's Public Works department, a flat brick front whose entrance corners bulge out "like swelling paper" and break through the roofline. Still two schools today.
  body: |
    Across the street from a Catholic enclave, the city built in 1924 a double school for ordinary primary education (Gewoon Lager Onderwijs), designed by the buildings section of Public Works. The plan is simple: classrooms along the back, corridors and toilets along the front, a gym hall sticking out at the rear, and two separate entrances, one for each school, against the side walls.

    What makes it worth a look is the way those two entrances are dressed. The city register describes them as shaped "almost like swelling paper": the corner bays curve and fold forward, end in a sharp point above the porch, round off at the top floor and finish in a circular crown above the roofline. Between them, long horizontal bands of windows with original wooden frames set a horizontal contrast against the vertical corner bays, in the manner of the Amsterdam School.

    Despite modernised classrooms the building kept its character. It still serves two schools: a branch of the Catholic primary school De Waaier (no. 82) and the Islamic primary school El Faroeq (no. 84). It became a municipal monument in 2012.

    Look for:
    - the two sculpted entrance corners and their round crowns above the roof edge
    - the long rows of horizontally barred windows in between
    - the original double doors in the porches
  category: schools
  lat: 52.359318
  lng: 4.938650
  address: Batjanstraat 56-84
  links:
    - { label: Monumentenregister Amsterdam (200636), url: "https://data.amsterdam.nl/monumenten/8034ed77-e586-4d24-8c94-ca72bcd26819" }
