  nl:
    title: Berlageblokken aan het Javaplein
    summary: "Drie gesloten bouwblokken uit 1911-1915 van H.P. Berlage voor woningbouwvereniging De Arbeiderswoning, met gemeenschappelijke binnentuinen en twee extra dwarsstraten die Berlage erbij bedacht om meer zon in de woningen te krijgen."
    body: |
      Berlage paste het stratenplan aan om meer zon binnen te krijgen. Rond het middelste van zijn drie blokken legde hij twee extra dwarsstraten aan, de Benkoelenstraat en de Langkatstraat, zodat er meer zon in de woningen kwam. Rond 1910 had de gemeente woningbouwverenigingen, deels pas opgericht onder invloed van de Woningwet van 1901, uitgenodigd om plannen te maken voor het nog onvoltooide deel van de Indische Buurt. Zo tekende de architect van de Beurs tussen 1911 en 1915 hier drie blokken voor De Arbeiderswoning.

      Blok II en blok III zijn bijna tweelingen: gesloten blokken van vier lagen met elk 40 etagewoningen rond een gezamenlijke binnentuin, met inspringende hoeken. Blok I aan de westkant heeft een U-vorm. De lange gevels van 24 vensterassen zijn rustig en rationeel. Leven brengen de uitgebouwde trappenhuizen, die op getrapte bakstenen consoles boven een venster met segmentboog rusten, en het sobere siermetselwerk bij de voordeuren. De blokken zijn rijksmonument en omlijsten samen met het voormalige badhuis en de bibliotheek in het Borneohof het Javaplein.

      Let op:
      - de trappenhuiserkers op hun getrapte bakstenen consoles
      - de inspringende hoeken waar de blokken de zijstraten raken
      - blok III aan het Javaplein, dat het plein deelt met het badhuis uit 1942
    attributes:
      original_use: Etagewoningen voor De Arbeiderswoning
    sources:
      - rce:523296, 523297, 523298 (registerteksten)
      - https://nl.wikipedia.org/wiki/Javaplein

- title: Van der Pek's garden blocks, Balistraat
  summary: Two pairs of long flat blocks of 1911–1912 by J.E. van der Pek. The Rochdale pair encloses the first semi-public communal garden in Amsterdam, entered from the Molukkenstraat between two little gatehouses.
  body: |
    Here J.E. van der Pek tried something new. Instead of a closed block with private backyards, he built two parallel strips of flats with a shared garden between them, left open at the short end on the Molukkenstraat. A garden fence and two small gatehouses close it off from the street. The national register calls it the first semi-public communal inner garden in Amsterdam.

    The eastern pair (Balistraat 128-144 and Eerste Atjehstraat 135-151) was built in 1911–1912 for the cooperative building society Rochdale: 88 flats, each with a living room, kitchen and two bedrooms, in a sober rational style but carefully detailed, down to a cornice with dentils and triglyphs. Because the backs are visible from the garden and the street, Van der Pek finished them with great care. This pair is a national monument.

    The western pair (Balistraat 106-126 and Eerste Atjehstraat 115-133) was built in 1911 for the Vereeniging Amsterdamsche Bouwfonds: five storeys of small flats in seven types, red brick with bands of yellow glazed brick, angled bays and a hidden brick strip above the cornice that you only notice from the iron hoisting beams sticking out of it. It became a municipal monument in 2013.

    The garden also holds a war memorial. In June 1945 a stone was placed here for three young resistance men, executed in March 1945: Johannes (Jan) Friederich and the brothers Antonius and Gerardus Engelen. Friederich, a furniture restorer who lived on the Balistraat, used his home to store weapons; he was shot at Rozenoord on 8 March 1945, one of the reprisals for the attack on Hanns Rauter. The Engelen brothers had also been in the resistance. Under the line "Zij gaven hun jonge leven voor onze vrijheid" (They gave their young lives for our freedom) are their names and dates. The stone was later rediscovered in the garden and given a fixed place, with a plaque explaining it, and on 4 May residents hold an open commemoration there, entered from Molukkenstraat 68-70.

    Look for:
    - the garden fence and the two gatehouses on the Molukkenstraat
    - the garden itself, framed by the carefully finished rear facades
    - the yellow glazed brick bands and angled bays of the western pair
    - hoisting beams poking out above the cornice
    - the 1945 memorial stone in the garden, open to all at the 4 May gathering
  category: housing
  lat: 52.362750
  lng: 4.938453
  address: Balistraat 106-144, Eerste Atjehstraat 115-151
  links:
    - { label: Rijksmonumentenregister (523310), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/523310" }
    - { label: Monumentenregister Amsterdam (200665), url: "https://data.amsterdam.nl/monumenten/b81ec825-06c6-46e1-a95a-e590b7dba232" }
    - { label: 4en5mei (garden memorial stone), url: "https://www.4en5mei.nl/oorlogsmonumenten/zoeken/4921/amsterdam-gedenksteen-in-de-binnentuin-van-het-van-der-pekblok" }
    - { label: oost-online (May 2025), url: "https://oost-online.nl/van-der-pekblok-gedenkt-op-4-mei-drie-mannen-die-in-tweede-wereldoorlog-zijn-geexecuteerd/" }
