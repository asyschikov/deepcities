  nl:
    title: Nijlpaard van Tom Claassen
    summary: "Een levensgroot nijlpaard van rubber, 6 bij 3 meter, ingebouwd in de wand van een sluis op IJburg. Het lijkt een aan elkaar gestikte knuffel, vangt boten op als stootkussen en zakt of komt boven met het water. In de buurt heet het de neushoorn."
    body: |
      Het is een nijlpaard, maar de buurt noemt het de 'rhino'. Die verwarring bracht Tom Claassen later op zijn mengdieren, die het midden houden tussen een paar soorten.

      Claassen maakte het beest in 2005 in opdracht van het Amsterdams Fonds voor de Kunst. Volgens het bordje bij het hek was het het eerste kunstwerk op IJburg. Het is 6 meter lang en 3 meter hoog, van hard rubber, en ziet eruit als een reuzenknuffel die uit lappen is genaaid. Dat rubber heeft ook een taak: het vangt stoten van boten op, dus het nijlpaard is tegelijk stootkussen. Een nijlpaard hoort volgens Claassen thuis in het grensgebied tussen land en water, en dit exemplaar staat in feite op de bodem van het IJmeer, vast in de muur van de sluiskolk. Bij laag water staat het op een richel met de poten net nat; bij hoog water verdwijnt het half.

      Claassen ontwierp er eerst drie, alleen dit werd gemaakt. De sluis naast de Kors van Bennekombrug heet dan ook de Nijlpaardenschutsluis. Veel beweging zit er niet in het water: in 2015 werd de sluiswachter wegbezuinigd en lag de sluis stil, tot Waternet hem in mei 2017 op afstand vanaf kantoor kon bedienen. Er bestaan kleine bronzen versies; het Kröller-Müller Museum heeft er een. Je loopt hem makkelijk voorbij: hij staat laag in een inham van de kade, achter een parkje.

      Let op:
      - de gestikte naden in het rubber
      - de waterlijn op zijn lijf, die verraadt hoe hoog de sluis staat
      - het bordje bij het hek (erop zitten mag niet)
    sources:
      - https://stadscuratorium.nl/collectie/nijlpaard/
      - https://nl.wikipedia.org/wiki/Nijlpaard_(beeld)
      - https://oost-online.nl/ontdek-oost-een-nijlpaard-bij-de-sluis/

- title: Floating Poetry Room
  summary: A small floating square off the Paul Hufkade, designed by the American artist Siah Armajani, with a poem by Frank Starik in its railings about water and the longing to leave and return. You can climb down to it and sit on the water.
  body: |
    The American artist Siah Armajani designed this pontoon as a meeting place for IJburg's new floating-home neighbourhood; the Dutch artist Ben Raaijman built it. It was paid for from the art budget of the IJtram (tram 26) and unveiled on 17 December 2005, first moored in the inner water by Steigereiland. That did not work out: the pontoon was damaged in a collision and put into storage at a yard. After a study of what had gone wrong, it was renovated and moored at the Paul Hufkade, where it was unveiled again on 13 July 2012.

    A stair leads down from the quay to the steel pontoon, which carries a bench looking out over the water, a shelter like a bus stop, some play equipment and, on the short railing at the end, a scale model of the 1938 ocean liner Nieuw Amsterdam by the model maker Henk Brandwijk. The choice annoyed some online critics, since that ship sailed from Rotterdam; Raaijman answered that the work was not a shipping monument but about the feelings of travel, departure and arrival. The railings carry a poem by the Amsterdam poet Frank Starik, limited to 667 characters, which ends: "Blijf hier en denk jezelf een zee" (stay here and imagine yourself a sea).

    Look for:
    - the poem running along the railings
    - the model of the Nieuw Amsterdam at the far end
    - the stair down from the quay
