  nl:
    title: Space to Take Place
    summary: "Een rode stalen bank van honderd meter, door Buitenlandse Zaken in stukjes weggegeven. Zo'n duizend buitenlandse relaties van Nederlandse ambassades hebben een akte voor hun eigen stuk, dus de bank is overal ter wereld in bezit en iedereen mag erop zitten."
    body: |
      Zo'n duizend mensen in het buitenland hebben een akte: zij bezitten een stukje van deze bank. Zitten mag u er toch op, want de bank is van iedereen.

      In 2006 vroeg het ministerie van Buitenlandse Zaken aan ontwerplabel Droog om een nieuw relatiegeschenk voor de belangrijkste contacten van de Nederlandse ambassades. Droog maakte er een wedstrijd van: zestig ontwerpen, tien finalisten, en op 30 november 2006 koos een jury onder leiding van de secretaris-generaal van het ministerie unaniem voor het idee van Claudia Linders. Geen cadeau dat in een kast belandt, vond zij, maar een stukje Nederland zelf.

      Het werd een bank van honderd meter, van rood geschilderd staal, aan de rand van het IJmeer. Met zogeheten 'daden van donatie' gaven Nederlandse ambassadeurs in meer dan honderd landen ongeveer duizend buitenlandse relaties een akte voor hun eigen stuk, met een klein monster van het staal. Omdat zulke geschenken met gemeenschapsgeld worden betaald, wilde Linders dat het cadeau uiteindelijk bij het publiek terechtkwam. Daarom hoort de bank bij de openbare ruimte van IJburg en kan iedereen er plaatsnemen. Burgemeester Job Cohen en staatssecretaris Frans Timmermans presenteerden haar op 6 oktober 2008; Timmermans sprak van een vorm van collectief bezit. De nieuwe mede-eigenaren mochten na een bezoek een foto op de website van het project zetten. Na een paar jaar keek daar bijna niemand meer naar, en inmiddels is de site verdwenen. De bank staat er nog.

      Let op:
      - de volle lengte van de bank langs de kade, het mooist vanaf een van de uiteinden
      - het uitzicht over het IJmeer, waar de bank op uitkijkt
      - de woningen van Bert Haanstrakade 2–144 erachter, uit 2009
    sources:
      - https://www.amsterdamhv.nl/wiki/bert-haanstrakade.html
      - https://stadscuratorium.nl/collectie/space-to-take-place/
      - https://www.tribar.nl/portfolio-item/space-to-take-place-ijburg-amsterdam/

- title: Nijlpaard, Tom Claassen's hippo in the lock
  summary: A life-size rubber hippo, 6 by 3 metres, standing in the wall of a lock on IJburg. It looks like a stitched-up cuddly toy, works as a fender for boats, and sinks or surfaces with the water. Locals call it the rhino.
  body: |
    Tom Claassen made this hippopotamus for the Amsterdams Fonds voor de Kunst in 2005; a plaque at the fence says it was the first artwork on IJburg. It is 6 metres long and 3 metres high, made of hard rubber, and looks like a giant soft toy sewn together from pieces. The rubber is not just for show: it absorbs knocks from boats, so the hippo doubles as a fender (stootkussen). For Claassen a hippo belongs in the amphibious zone between land and water, and this one in effect stands on the bed of the IJmeer, fixed in the wall of the lock chamber. At low water it stands on a ledge with its feet just wet; at high water it is partly submerged.

    Claassen first designed three hippos; this is the only one that was made. The lock, next to the Kors van Bennekom bridge, is known as the Nijlpaardenschutsluis (Hippo Lock). In practice the water rarely moves: the lock keeper was cut in 2015 and the lock was out of use until it could be worked remotely from Waternet's office in May 2017. The untitled work became known locally as the 'rhino', a mix-up that inspired Claassen's later hybrid animals. Small bronze versions exist; the Kröller-Müller Museum has one. It is easy to miss, low in an inlet of the quay behind a little park.

    Look for:
    - the stitched seams in the rubber
    - the waterline on its body, which tells you the lock level
    - the plaque on the fence (sitting on it is not allowed)
  category: street-art
  lat: 52.357356
  lng: 4.989803
  address: Nijlpaardenschutsluis, Paul Hufkade by the Vennepluimstraat
