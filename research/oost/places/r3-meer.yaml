  nl:
    title: Jaap Edenbaan
    summary: De oudste nog in gebruik zijnde kunstijsbaan buiten ter wereld, geopend in 1961. Hierna waren de Nederlanders niet meer afhankelijk van natuurijs en begon hun opmars in de schaatssport; het eerste seizoen kwamen er al bijna driehonderdduizend bezoekers.
    body: |
      De Jaap Edenbaan was de als vijfde kunstijsbaan en derde 400 m baan ter wereld die werd aangelegd. Ze werd op 9 december 1961 geopend door Jaap Eden, de kleinzoon van de legendarische schaatskampioen Jaap Eden. Hierna waren de Nederlanders niet meer afhankelijk van natuurijs en begon hun opmars in de schaatssport. In het eerste seizoen werden er al bijna driehonderdduizend bezoekers geteld. De ijsbaan was vijf keer gastheer voor het NK allround en eenmaal van het NK sprint. Daarnaast vindt hier elk jaar in oktober de openingswedstrijd van de KNSB Cup plaats, de competitie van het marathonschaatsen.

      De kunstijsbaan is de oudste nog in gebruik zijnde buitenbaan ter wereld. In 1989 en 2023 werd de baan gerenoveerd. Bij de renovatie vanaf 2023 werd gekozen om de buitenbaan niet te overkappen. Door de baan in vier koelsectoren op te delen, kan de ijsmeester de koeling lager zetten op beschaduwde delen en hoger op de delen die in de zon liggen.

      Op 31 oktober 1973 werd aan de buitenbaan een indoorcomplex toegevoegd, de Edenhal, voor ijshockey, shorttrack en kunstrijden. In de ijshal traden muzikale grootheden op als Bob Marley, ABBA, Marvin Gaye, Frank Zappa en AC/DC. Door achterstallig onderhoud was de hal toe aan vernieuwing; vanaf 2026 wordt in fasen gebouwd, met oplevering aan het begin van seizoen 2028–2029. Tussentijds kan er gewoon worden geschaatst.

      Op de 400-meterbaan schaats je in de winter van 2026–2027 van 10 oktober tot en met 21 maart; vanaf de Radioweg zie je de lange ovaal achter het hek.

      Let op:
      - de 400-meterbaan onder de open hemel, met de lichtmasten
      - de houten "Finse school" bij de ingang, hier in 1961–1962 herbouwd
      - de bouwkranen en steigers van de nieuwe hal
    attributes:
      built: 1961; hal 1973, gerenoveerd 1989 en 2023–2025
      original_use: Kunstijsbaan en ijshal
    sources:
      - https://nl.wikipedia.org/wiki/Jaap_Edenbaan
      - https://www.jaapeden.nl/

# ================================================================ Science Park

- title: Anna's Tuin & Ruigte
  summary: Five metres below sea level, on a leftover scrap of polder between university labs, students planted a permaculture garden, a food forest and a dye garden and left the rest to grow wild. Free to walk in every day.
  body: |
    The Science Park was polder pasture until the university bought it in 1963. One corner beside the old Anna Hoeve farm was never built on. Students of the University of Amsterdam took it up: three biology students, commissioned by the city, drew a plan for laying out and managing it, and after graduating they set up a foundation with one of their lecturers. The garden opened to the public on 20 May 2017 and is named after Anna, who inherited the farm next door around 1850 and gave it its name.

    It is about a hectare, run by some 50 volunteers on a permaculture design: a vegetable garden with no digging and no poison, a layered food forest, a bee and butterfly garden, a living hedge of 20 native shrubs and trees where brambles once grew, a bamboo greenhouse dome, and a dye garden with the old plant sources of red, yellow and blue (dyer's bugloss, safflower, woad). A large part is "ruigte", deliberately left wild; foxes, hedgehogs, kingfishers and swallowtail butterflies have been seen. Researchers and students of the UvA and Amsterdam University College use it as an outdoor lab.

    On 20 October 2025 the clubhouse shed and the pizza oven were burnt down by arsonists; after years of vandalism the entrances now have gates. The garden stays open daily, 7:00–20:00 from April to September and 7:00–17:00 from October to March. The entrance is to the right of café-restaurant Polder, under the willow arch.

    Look for:
    - the willow arch at the entrance
    - the history sign by the path: "you are standing five metres below sea level"
    - the dye garden and the bamboo geodome
    - the wild ruigte against the backdrop of the university buildings
