  nl:
    title: Jaap Edenbaan
    summary: "De oudste kunstijsbaan in de buitenlucht die nog in gebruik is, geopend in 1961. Vanaf toen hoefden Nederlandse schaatsers niet meer op vorst te wachten en begon hun opmars; in het eerste seizoen kwamen er bijna 300.000 bezoekers."
    body: |
      Tot de jaren zestig hingen Nederlandse hardrijders af van het weer. Op 9 december 1961 ging aan de Radioweg de Jaap Edenbaan open, de vijfde kunstijsbaan ter wereld en de derde met een baan van 400 meter. De kleinzoon van Jaap Eden opende hem; de baan heet naar zijn grootvader, de legendarische schaatskampioen. Het eerste seizoen kwamen er bijna 300.000 bezoekers, en het NK werd hier vijf keer verreden. Vanaf toen kon er op betrouwbaar ijs getraind worden, en de klim naar de wereldtop begon. Op 13 maart 1966 werd de ploeg met Kees Verkerk en Ard Schenk hier op het ijs gehuldigd.

      Het is nog steeds de oorspronkelijke buitenbaan. Hij werd in 1989 vernieuwd en opnieuw vanaf 2023, toen de gemeente eigenaar werd. Een dak werd overwogen en afgewezen. Wel is de baan opgedeeld in vier koelvakken, zodat de ijsmeester de zonnige bochten harder kan koelen dan de schaduwkant. Het is nu de oudste kunstijsbaan ter wereld die nog in gebruik is, en elk jaar in oktober opent hier de KNSB Cup, de marathoncompetitie.

      In 1973 kwam de Jaap Edenhal erbij, voor ijshockey, shorttrack en kunstrijden. Tot in de jaren negentig was het ook een concertzaal: Bob Marley, ABBA, Marvin Gaye, Frank Zappa en AC/DC stonden er. De versleten hal wordt vanaf 2026 in fases vernieuwd en moet klaar zijn voor het seizoen 2028–2029, terwijl er gewoon geschaatst wordt.

      De publieksbaan is 's winters open, in 2026–2027 van 10 oktober tot 21 maart.

      Let op:
      - de 400-meterbaan onder de blote hemel
      - het houten gebouw van de 'Finse school' bij de baan, hier in 1961–1962 neergezet
      - de ijshal die in fases wordt vernieuwd
    attributes:
      built: 1961; hal 1973, gerenoveerd 1989 en 2023–2025
      original_use: Kunstijsbaan en ijshal
    sources:
      - https://nl.wikipedia.org/wiki/Jaap_Edenbaan
      - https://www.jaapeden.nl/

# ================================================================ Science Park

- title: Anna's Tuin & Ruigte
  summary: Five metres below sea level, on a leftover scrap of polder between university labs, students planted a permaculture garden, a food forest and a dye garden and left the rest to grow wild. Free to walk in every day.
  body: |
    This was polder farmland until 1963, when the land and the farm passed to the city, which gradually turned it into the Science Park. One corner beside the old Anna Hoeve farm was never built on. Students of the University of Amsterdam took it up: three biology students, commissioned by the city, drew a plan for laying out and managing it, and after graduating they set up a foundation with one of their lecturers. The garden opened to the public on 20 May 2017 and is named after Anna, who inherited the farm next door around 1850 and gave it its name.

    It is about a hectare, run by some 50 volunteers on a permaculture design: a vegetable garden with no digging and no poison, a layered food forest, a bee and butterfly garden, a living hedge of 20 native shrubs and trees where brambles once grew, a bamboo greenhouse dome, and a dye garden with the old plant sources of red, yellow and blue (dyer's bugloss, safflower, woad). A large part is "ruigte", deliberately left wild; foxes, hedgehogs, kingfishers and swallowtail butterflies have been seen. Researchers and students of the UvA and Amsterdam University College use it as an outdoor lab.

    On 20 October 2025 the clubhouse shed and the pizza oven were burnt down by arsonists; after years of vandalism the entrances now have gates. The garden stays open daily, 7:00–20:00 from April to September and 7:00–17:00 from October to March. The entrance is to the right of café-restaurant Polder, under the willow arch.

    Look for:
    - the willow arch at the entrance
    - the history sign by the path: "you are standing five metres below sea level"
    - the dye garden and the bamboo geodome
    - the wild ruigte against the backdrop of the university buildings
