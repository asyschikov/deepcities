  nl:
    title: Anna's Tuin & Ruigte
    summary: Vijf meter onder zeeniveau, op een overgebleven stukje polder tussen de universiteitsgebouwen, legden studenten een permacultuurtuin, een voedselbos en een verftuin aan en lieten de rest verwilderen. Dagelijks vrij toegankelijk.
    body: |
      Je staat hier vijf meter onder zeeniveau. Tot 1963 was dit boerenland in de polder; toen kwamen de grond en de boerderij in handen van de gemeente, die er geleidelijk het Science Park van maakte. Eén hoek naast de oude Annahoeve bleef onbebouwd. Studenten van de Universiteit van Amsterdam namen hem onder handen: drie biologiestudenten maakten in opdracht van de gemeente een plan voor inrichting en beheer, en na hun afstuderen richtten ze met een van hun docenten een stichting op. Op 20 mei 2017 ging de tuin open voor publiek. Hij is genoemd naar Anna, die rond 1850 de boerderij ernaast erfde en er haar naam aan gaf.

      De tuin is ongeveer een hectare groot en wordt door zo'n 50 vrijwilligers beheerd volgens permacultuur: een moestuin zonder spitten en zonder gif, een voedselbos in lagen, een bijen- en vlindertuin, een levende haag van 20 inheemse struiken en bomen op een plek waar eerst braam groeide, een kas in de vorm van een bamboe koepel en een verftuin met de oude plantaardige bronnen van rood, geel en blauw (ossentong, saffloer, wede). Een groot deel is ruigte, bewust wild gelaten; er zijn vossen, egels, ijsvogels en koninginnenpages gezien. Onderzoekers en studenten van de UvA en het Amsterdam University College gebruiken de tuin als buitenlab.

      Op 20 oktober 2025 is er brand gesticht; daarbij zijn het clubhuis en de pizza-oven volledig verloren gegaan. Na jaren van overlast en vandalisme staan er hekken bij de ingangen. De tuin blijft dagelijks open: april tot en met september 7.00–20.00 uur, oktober tot en met maart 7.00–17.00 uur. De ingang is rechts naast café-restaurant Polder, onder de wilgenboog.

      Let op:
      - de wilgenboog bij de ingang
      - het informatiebord over de geschiedenis: "Je staat hier vijf meter onder zeeniveau"
      - de verftuin en de bamboe geodome
      - de ruigte met de universiteitsgebouwen erachter
