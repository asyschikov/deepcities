  nl:
    title: Schuilkelder onder Middenweg 325
    summary: Op de hoek tegenover De Nieuwe Ooster leidt een gebogen trapje achter een zwart ijzeren hekje naar een grote betonnen kelder met pilaren, gebouwd als schuilkelder. Een jongen schroefde in 1945 het bordje met de pijl ernaartoe van de muur; nu zitten er werkplaatsen.
    body: |
      Onder het hoekpand Middenweg 325, waar de Kruislaan op de Middenweg uitkomt, ligt een betonnen kelder die helemaal doorloopt tot de Finsenstraat. Het was een schuilkelder: twee grote ruimtes met zeer dikke muren en om de zoveel meter een pilaar. Vanaf de stoep op de hoek van de Kruislaan loopt een trapje naar beneden, en op de hoek van de Finsenstraat nog een.

      Een bordje bracht het aan het licht. In de oorlog hing op de hoek van de Röntgenstraat een bord met een pijl in de richting van de Middenweg, naar een schuilkelder waarvan een gezin in de Röntgenstraat wist dat hij bestond, maar niet waar. In 1945 schroefde een jongen van twaalf het bord van de muur en bewaarde het. Tientallen jaren later hoorde zijn broer, die het bord had geërfd, van een makelaar waar de schuilkelder echt zat. Volgens de eigenaar is de kelder nooit als schuilkelder gebruikt (de Watergraafsmeer is nooit gebombardeerd), maar hebben er wel Duitsers in gezeten. Later had een bakkerij er haar centrale magazijn en was een deel rijwielbergplaats. Waarschijnlijk door de dikke muren is het er droog, anders dan in de meeste kelders in de polder. Nu worden de ruimtes verhuurd als werkplaats en atelier.

      Het is privé: vanaf de straat zie je het trapje met zijn hekje.

      Let op:
      - het zwarte ijzeren hekje met een cirkel en een kruis en het gebogen trapje naar beneden, op de hoek van de Kruislaan
      - het tweede trapje op de hoek van de Finsenstraat
      - aan de overkant de poort van De Nieuwe Ooster
    attributes:
      check_note: "Gebouwd als schuilkelder in de oorlog (lokale geschiedbronnen) of in de Koude Oorlog (één wandelgids)? Het bordje uit 1945 wijst op de oorlog."
    sources:
      - https://geheugenvanoost.amsterdam/page/83534
      - https://www.vriendenvanwatergraafsmeer.nl/middenweg-325/
      - https://www.ommetjemettom.nl/editorial/schuilkelder-middenweg

- title: Nooit Gedacht pull ferry and the dike-break pool
  summary: At the dead end of the Kruislaan, one family has pulled a little cable ferry across the Ringvaart by hand since 1914, from a steel pontoon that was once the Wehrmacht's. Beside it, a reedy pool marks a breach in the polder dike already drawn on a map of 1725.
  body: |
    Ride the Kruislaan past Science Park station to the end, turn up onto the Ooster Ringdijk, and you reach a boatyard that feels a long way from the city. Here a cable ferry, the overhaal, crosses the Ringvaart to the dike of the Amsterdam-Rijnkanaal. In 1914 Gerrit van den Brink bought it from a Mr Versanen and started a boat store beside it, called Nooitgedacht ("never thought"); his descendants still run both, always passed down on the women's side. The ferry was wooden until 1953, when the family bought the present steel pontoon, a former Wehrmacht one. You pull it across on the cable by hand.

    In its heyday people queued for it, paying 5 cents on foot and 10 with a bike, to reach the open-air swimming spots along the canal dike. According to the family, Jews were hidden in the ferry house during the war and taken across at night to Frisian apple boats on the canal. Drs. P promoted his ferry song "Heen en weer" here. A cycle path built nearby for a triathlon in 1990 took most of the trade, but in 2024 the great-granddaughter was still pulling the ferry and planned to renew the boat store.

    Just north of the landing, in the reeds, a map of 1725 shows a wiel, the scour pool a dike break leaves behind. The polder flooded twice in its first half-century: in the St Peter's flood of 1651, and on purpose in 1672, when the Dutch let water in to stop the army of Louis XIV. Jan Dijk, who writes about the area's history, guesses 1672.

    It is a private family ferry, not a GVB service.

    Look for:
    - the steel pontoon and its pull cable across the Ringvaart
    - the house called Nooit-Gedacht opposite, with the arms of the Watergraafsmeer and Amsterdam in its front
    - the reedbed north of the landing, where the 1725 map shows the breach
  category: curiosities
  lat: 52.356849
  lng: 4.962131
  address: Ooster Ringdijk 49
