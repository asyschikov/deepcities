# New places: 401 the Kruislaan flood doors, 403 Leeuwenburg, 404 the thermometer streets.
# 402 (rooftop observatory) and 406 (IKO in the old gasworks) went into "CWI and the Science Park
# internet hub"; 407 into "Rechthuis Watergraafsmeer"; 408 into "Piet Zanstra's flats on the
# Radioweg" (all frankendael.yaml); 405 (Kijker) into "Bloementuin van Darwin (Darwinplantsoen)"
