  nl:
    title: Ceramplein, "Hun leven, onze vrijheid" en de vrijheidsboom
    summary: "Een klein oorlogsmonument op een scheef vijfhoekig plein, waar de Indische Buurt jarenlang rond een vrijheidsboom de bevrijding vierde. Een bronzen feniks, een roodachtige steen met \"Hun leven, onze vrijheid\" en een linde uit 1945."
    body: |
      Niemand weet precies wat hier oud is: of de steen de tegel van 1957 is, of de linde de vrijheidsboom, en wanneer de feniks kwam.

      Het Ceramplein kreeg in 1924 zijn naam, naar het Molukse eiland Ceram (Seram), en is een onregelmatige vijfhoek waar de Eerste en Tweede Ceramstraat op elkaar aansluiten. Na de oorlog vierde de Indische Buurt hier jarenlang de bevrijding, rond een vrijheidsboom op het plein. In 1957 kwam bij die boom een tegel te liggen.

      Aan de westkant staat nu een gedenkteken in twee delen. In een laag muurtje van baksteen en graniet zit een roodachtige steen met alleen "Hun leven, onze vrijheid 1940-1945"; of dat de tegel van 1957 is, is niet bekend. Ernaast staat op een betonnen sokkel een bronzen feniks van Arend Soerink (1924-1999), een weinig bekende beeldhouwer die les had van Luigi de Lerma en Gijs Jacobs van den Hof. Ook wanneer de vogel kwam, weet niemand zeker: het Stadsarchief heeft een foto van rond 1988 waarop een stratenmaker de klinkers ervoor legt. In het monument groeit een linde uit 1945, maar of dat de vrijheidsboom is, valt niet te zeggen. Tijdens de Dodenherdenking van 2003 werd het geheel door baldadige jongeren beschadigd, in 2008 kreeg de vogel een lik groene verf.

      Het is nog altijd de herdenkingsplek van de buurt zelf: op 4 mei komen bewoners van de Indische Buurt hier samen, op initiatief van buurtorganisaties, om de doden te herdenken.

      Bij de stadsvernieuwing van de jaren tachtig verdween het meeste van de oude arbeidersbebouwing rond het plein, maar aan de zuidkant staat nog een rijtje huisjes van J.M. van Hardeveld van rond 1925.

      Let op:
      - de feniks die aan de westkant van zijn sokkel opstijgt
      - de roodachtige steen met de tekst
      - de linde die in het monument groeit
      - de huisjes van Van Hardeveld uit 1925 aan de zuidkant
      - het poortgebouw naar de Tweede Ceramstraat
    attributes:
      artist: Arend Soerink (feniks)
    sources:
      - https://nl.wikipedia.org/wiki/Monument_leven_en_vrijheid
      - https://nl.wikipedia.org/wiki/Ceramplein

# ================================================================ Mouth of the Amsterdam-Rijnkanaal

- title: Leeuwen van Zeeburg
  summary: Four identical lions guard the mouth of the Amsterdam-Rijnkanaal, two on each bank. They are 2015 casts of Bart van Hove's lions of the old Merwede canal lock, which spent half a century in storage and in the Noordoostpolder.
  body: |
    Around 1888 Bart van Hove made four lions for the mouth of the new Merwedekanaal (now the Amsterdam-Rijnkanaal), to stand at the lock by the siphon at Zeeburg. He made them in two variants: two with the left forepaw crossed over the right, two the other way round. About half a century later, around 1942, the canal was widened and the lions went into storage. They later found a new home in Emmeloord in the Noordoostpolder, where they did not stay put either; in 2010 they sat at the foot of its Poldertoren.

    In the 2010s the last remains of the old lock complex were demolished and Rijkswaterstaat wanted its lions back. The Noordoostpolder had grown attached to them, but offered a cast made in 2010 at the suggestion of the artist Marieke van Diemen. From that one cast, four identical lions were made in 2015, so where Van Hove made two pairs, Amsterdam now has four lions that all cross the right paw over the left, as on his original plaster model of about 1888, which the Amsterdam Museum keeps. They sit on plinths just north of the Amsterdamsebrug, a pair on each bank. The pose will look familiar from Artis: Van Hove's monument to Gerardus Frederik Westerman (1890–1891) has a lion crossing its paws the same way.

    Between the lions the canal hides a less visible guard. In dry spells, salt water from the North Sea Canal creeps inland along the bottom of the Amsterdam-Rijnkanaal, which is bad for farmland and nature. Since November 2018 a heavy perforated pipe across the six-metre-deep canal bed, just north of the Amsterdamsebrug, blows a curtain of air bubbles that pushes the salt water back up; the air comes from a small white compressor house on the west bank. The shallow edges are left free so fish can get through. The idea goes back to the engineer Johan van Veen around 1940; it had been used in locks for decades, but this was its first use in open water. When it runs, a stripe of foam shows across the surface.

    Look for:
    - the crossed paws, right over left on all four
    - the second pair facing them across the water on the Zuider IJdijk side
    - the view from the Amsterdamsebrug over the canal mouth and its guards
    - the white compressor house on the west bank and, when the bubble screen runs, the stripe of foam across the canal
  category: street-art
  lat: 52.367280
  lng: 4.956349
  address: Westelijke Merwedekanaaldijk and Zuider IJdijk, north of the Amsterdamsebrug
