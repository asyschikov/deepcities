  nl:
    title: Leeuwen van Zeeburg
    summary: "Vier gelijke leeuwen bewaken de monding van het Amsterdam-Rijnkanaal, twee op elke oever. Het zijn afgietsels uit 2015 van de leeuwen die Bart van Hove maakte voor de oude sluis van het Merwedekanaal, die een halve eeuw in opslag en in de Noordoostpolder doorbrachten."
    body: |
      Bart van Hove maakte twee paar leeuwen: het ene paar met de linkervoorpoot over de rechter, het andere andersom. Amsterdam heeft er nu vier die allemaal precies hetzelfde doen.

      Rond 1888 beeldhouwde Van Hove vier leeuwen voor de monding van het nieuwe Merwedekanaal (nu het Amsterdam-Rijnkanaal), bij de schutsluis aan de sifon van Zeeburg. Twee legden de linkervoorpoot over de rechter, twee juist omgekeerd. Zo'n halve eeuw later, rond 1942, werd het kanaal breder gemaakt en verdwenen de leeuwen in een depot. Daarna kwamen ze in Emmeloord terecht, waar ze ook al niet bleven liggen; in 2010 zaten ze aan de voet van de Poldertoren.

      In de jaren tien van deze eeuw ging het laatste stuk van het sluizencomplex tegen de vlakte en wilde Rijkswaterstaat zijn leeuwen terug. De Noordoostpolder was aan ze gehecht, maar bood wel een afgietsel aan dat in 2010 op voorstel van kunstenaar Marieke van Diemen was gemaakt. Uit die ene mal kwamen in 2015 vier gelijke leeuwen, allemaal met de rechterpoot over de linker, net als op Van Hoves gipsmodel van rond 1888 dat het Amsterdam Museum bewaart. Ze zitten op sokkels vlak ten noorden van de Amsterdamsebrug, een paar op elke oever. Wie in Artis komt, kent de houding: Van Hoves monument voor Gerardus Frederik Westerman (1890-1891) heeft een leeuw die zijn poten op dezelfde manier kruist.

      Tussen de leeuwen ligt een minder zichtbare wachter. Bij droogte kruipt zout water uit het Noordzeekanaal over de bodem het Amsterdam-Rijnkanaal in, slecht voor boerenland en natuur. Sinds november 2018 ligt vlak ten noorden van de brug een zware buis met gaatjes dwars over de zes meter diepe bodem. Een compressor in een wit huisje op de westoever perst er lucht doorheen, en het bellengordijn duwt het zoute water omhoog. De ondiepe randen blijven vrij, zodat vissen erlangs kunnen. Ingenieur Johan van Veen bedacht het rond 1940; in sluizen werd het al tientallen jaren gebruikt, maar dit was de eerste keer in open water. Staat het aan, dan zie je een streep schuim over het kanaal.

      Let op:
      - de gekruiste poten, bij alle vier rechts over links
      - het tweede paar aan de overkant, aan de kant van de Zuider IJdijk
      - het uitzicht vanaf de Amsterdamsebrug over de kanaalmonding en zijn wachters
      - het witte compressorhuisje op de westoever en, als het bellenscherm aanstaat, de streep schuim over het kanaal
    attributes:
      artist: Bart van Hove (ontwerp, ca. 1888); gegoten op initiatief van Marieke van Diemen
    sources:
      - https://nl.wikipedia.org/wiki/Leeuwen_van_Zeeburg
      - https://geheugenvanoost.amsterdam/page/85848
      - https://nl.wikipedia.org/wiki/Bellenscherm

# ================================================================ Zeeburgereiland

- title: Guardhouse and Fliegerhorst bunkers, Zuider IJdijk
  summary: "A little guardhouse of the army's shooting range, built from 1907 at what was the island's only land access, and near it the three biggest German bunkers left in Amsterdam, from the seaplane base the Luftwaffe ran here."
  body: |
    Zeeburgereiland grew out of dredging spoil dumped behind a breakwater around 1900. Because of its position the new island partly went to the army. From 1907 a shooting range and drill ground for the Amsterdam garrison was built on its southwest side, in use from 1910 by infantry from the Oranje-Nassau barracks. At Zuider IJdijk 24, beside what was then the only land access to the island, the War Department built a guard's house, with a shelter for the troops right next to it, a privy and a shed for targets.

    In 1916 the navy opened a seaplane base, Marinevliegkamp Schellingwoude, on the north side of the island. During the occupation the Luftwaffe turned it into Fliegerhorst Schellingwoude, the largest seaplane base in the Netherlands. Dozens of concrete works went up across the island. After the war Defence stayed until the 1960s; the sheds were cleared, and their outlines still show in the ground behind the house.

    What is left is a small ensemble. The guardhouse, renovated in recent years but with its original mass, symmetrical front, cornice and hipped roof, is still a family home; the city's heritage office advised in 2018 that it be kept. The soldiers' old drinking-water store serves as a wine cellar. Nearby, in the southwest corner of the island, stand three German bunkers, stripped of the earth that once covered and hid them: the biggest bunkers still in Amsterdam. One was the command post for the base commander, one a store and one, under the trees, a shelter. The house is a private home.

    Look for:
    - the symmetrical front and hipped roof of the house at no. 24
    - the three bunkers near the house, stripped of their earth cover
