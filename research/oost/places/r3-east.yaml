  nl:
    title: Leeuwen van Zeeburg
    summary: Vier identieke leeuwen aan weerszijden van de monding van het Amsterdam-Rijnkanaal, in 2015 gegoten naar de leeuwen die Bart van Hove rond 1888 maakte voor de schutsluis bij Zeeburg.
    body: |
      Leeuwen van Zeeburg is een beeldengroep aan weerszijden van het Amsterdam-Rijnkanaal. De groep bestaat uit vier identieke leeuwen, die bij de ingang van het kanaal staan. Deze leeuwen stammen uit 2015, maar kennen een historie die terugvoert tot eind 19e eeuw. Bart van Hove maakte voor de monding van het Amsterdam-Rijnkanaal, toen nog Merwedekanaal geheten, vier leeuwen voor plaatsing bij de schutsluis bij Zeeburg bij de sifon. Een gipsmodel van het origineel uit circa 1888 is in het bezit van het Amsterdam Museum.

      Een halve eeuw later, rond 1942, verdwenen ze weer: het Amsterdam-Rijnkanaal werd verbreed en ze verdwenen in opslag. Ze vonden later een nieuwe plaats in Emmeloord, waar ze ook geen rust kregen. In de jaren tien van de 21e eeuw werden de restanten van het sluizencomplex gesloopt en wilde Rijkswaterstaat de leeuwen terug. De Noordoostpolder was echter gehecht aan zijn exemplaren, maar men wilde wel een op voorstel van Marieke van Diemen gemaakt afgietsel uit 2010 ter beschikking stellen. Van dat ene afgietsel werden vier identieke leeuwen gegoten. Waar Van Hove twee varianten maakte (twee keer linker over rechter voorpoot en twee keer rechter over linker voorpoot), kent Amsterdam nu dus vier identieke met de rechter over de linker voorpoot, zoals ook op het oorspronkelijke gipsmodel. De leeuwen staan op sokkels even ten noorden van de Amsterdamsebrug.

      De leeuw vertoont gelijkenis met de leeuw die Van Hove verwerkte in zijn monument voor Gerardus Frederik Westerman dat in Artis staat en uit 1890/1891 stamt (ook rechter over linker poot).

      Tussen de leeuwen ligt nog een wachter, onder water. Bij droogte kruipt zout water uit het Noordzeekanaal over de bodem van het Amsterdam-Rijnkanaal het land in, slecht voor boeren en voor het drinkwater. Sinds november 2018 ligt daarom even ten noorden van de Amsterdamsebrug een zware buis met gaatjes dwars over de zes meter diepe kanaalbodem. Er wordt lucht doorheen geperst, en het gordijn van luchtbellen duwt het zoute water omhoog. De lucht komt uit een wit gebouwtje op de westoever. Aan de ondiepe zijkanten zitten geen bellen, zodat vissen erlangs kunnen. Het idee is van ingenieur Johan van Veen, rond 1940; in sluizen werd het al tientallen jaren gebruikt, maar hier werd het in Nederland voor het eerst in open water toegepast. Als het scherm aanstaat, zie je een strook schuim dwars over het water.

      Let op:
      - de gekruiste poten, bij alle vier rechts over links
      - het tweede paar aan de overkant, aan de kant van de Zuider IJdijk
      - het zicht vanaf de Amsterdamsebrug op de kanaalmonding en haar wachters
      - het witte compressorhuisje op de westoever en, als het bellenscherm aanstaat, de strook schuim over het kanaal
    attributes:
      artist: Bart van Hove (ontwerp, ca. 1888); gegoten op initiatief van Marieke van Diemen
    sources:
      - https://nl.wikipedia.org/wiki/Leeuwen_van_Zeeburg
      - https://geheugenvanoost.amsterdam/page/85848
      - https://nl.wikipedia.org/wiki/Bellenscherm

# ================================================================ Zeeburgereiland

- title: Guardhouse and Fliegerhorst bunkers, Zuider IJdijk
  summary: A little 1907–1909 guardhouse at what was the island's only land access, last building of the army's shooting range, and behind it the three biggest German bunkers left in Amsterdam, from the seaplane base the Luftwaffe ran here.
  body: |
    Zeeburgereiland grew out of dredging spoil dumped behind a breakwater around 1900. Because of its position the new island partly went to the army. From 1907 a shooting range and drill ground for the Amsterdam garrison was built on its southwest side, in use from 1910 by infantry from the Oranje-Nassau barracks. At Zuider IJdijk 24, beside what was then the only land access to the island along the canal dike, the War Department built a guard's house, with a shelter for the troops right next to it, a privy and a shed for targets, all fenced with barbed wire.

    In 1916 the navy opened a seaplane base, Marinevliegkamp Schellingwoude, on the north side of the island. In May 1940 the Luftwaffe took it over and turned it into the largest seaplane base in the Netherlands, home to the Kriegsmarine's sea rescue service with Heinkel He 59 and Dornier Do 24 aircraft, and also used for minelaying, reconnaissance over the North Sea and raids on Britain. Dozens of concrete works went up across the island. After the war Defence stayed until the 1960s; the sheds were cleared, and their outlines still show in the ground behind the house.

    What is left is a small ensemble. The guardhouse, renovated in recent years but with its original mass, symmetrical front, cornice and hipped roof, is still a family home; the city's heritage office advised in 2018 that it be kept. The soldiers' old drinking-water store serves as a wine cellar. Nearby, around Zuider IJdijk 30, stand three German bunkers, stripped of the earth that once covered and hid them: the biggest bunkers still in Amsterdam. One is a command post (Kleines Gefechtsstand) of 14.8 by 8 metres with walls and roof 1.5 metres thick, a radio room and observation slits facing north and south; another is a shelter of about 7 by 7 metres. Everything stands on private ground, among small workshops and sheds; you see it from the dike.

    Look for:
    - the symmetrical front and hipped roof of the house at no. 24
    - grey concrete blocks among the yards behind the dike
    - the Leeuwen van Zeeburg at the canal mouth, about 150 m along the dike
