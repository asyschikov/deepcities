  nl:
    title: Sluishuis
    summary: "Het woonblok van BIG en Barcode bij de entree van IJburg tilt één hoek op uit het water, zodat boten de binnenplaats in kunnen varen, en loopt aan de andere kant in terrassen af naar de buurt. Openbare trappen gaan langs die terrassen naar een dakwandeling, maar niet elke dag."
    body: |
      Je kunt over het dak van het Sluishuis lopen, maar alleen als de bewoners het openzetten. Twee trappen in de gevel klimmen langs de terrassen omhoog naar een pad bovenop, met zicht over de stad. De toegang ligt bij de VvE, die het dak ook dicht had kunnen houden. Daarom heeft de gemeente vastgelegd dat iedereen minstens tachtig dagen per jaar die trappen op mag. Openbaar dus, maar op rantsoen.

      Het gebouw zelf kwam uit een prijsvraag van 2016 voor een 'beeldbepalend' blok op de Haringbuisdijk, waar je het Steigereiland op komt, tegenover woningen van Marlies Rohmer. Het Deense bureau BIG van Bjarke Ingels won, samen met Barcode Architects uit Rotterdam. Hun ontwerp is een dicht, vierkant bouwblok dat in het water van het Buiten-IJ staat, met schuin weggesneden gevels. Eén hoek is omhooggetrokken, zodat de binnenplaats openligt naar het IJ en boten 'in' het gebouw kunnen aanleggen. Aan de overkant trapt het blok af naar de buurt op het Steigereiland. BIG had die opgetilde hoek al eens gedaan, bij VIA 57 West in Manhattan.

      Bouwen was puzzelen. De aannemers zetten twee betonnen 'ruggengraten' neer, muren van bijna een halve meter dik, en hingen de woningen daaraan. Gewerkt werd vanaf een tijdelijk zandeiland; de palen gaan zestig meter diep en de gevels zijn met aluminium bekleed. Op 18 december 2018 begon de bouw, op 13 juli 2022 ging het Sluishuis open. Er zijn 442 woningen, voor het merendeel huur in het middensegment, en een steiger om het hele gebouw met ligplaatsen voor 34 woonboten.

      Let op:
      - de opgetilde hoek met de boten eronder, vanaf de Enneüs Heermabrug
      - de steiger die helemaal om het gebouw heen loopt
      - de getrapte terrassen aan de kant van het Steigereiland en de trappen die erlangs klimmen
    attributes:
      architect: BIG (Bjarke Ingels Group) met Barcode Architects
    sources:
      - https://nl.wikipedia.org/wiki/Sluishuis_(Amsterdam)

- title: De Warren, Amsterdam's first housing co-op
  summary: "A timber building on Centrumeiland put up by a group of Amsterdammers who won a city pilot in 2018 and now own and run it together. Rents stay out of the market, and 30 percent of the floor space is shared."
  body: |
    In a housing cooperative the residents own their building collectively and in effect rent from themselves. In April 2018 a group of Amsterdammers won the city's tender for a pilot cooperative, and De Warren became the first self-built housing cooperative in the city to be finished. It was designed by Natrufied Architecture of Bergen and built in 2021–2023 on the Nydia Ecurystraat, on Centrumeiland, the new island where most homes are self-build projects. It opened in April 2023 and is home to more than fifty people.

    The building has 36 social and mid-rent homes. About 800 square metres, 30 percent of the floor space, is set aside for shared rooms: an auditorium, a dance hall, a music studio, offices, a workshop and a children's playroom, strung along a big stepped stair inside. The cooperative takes out one collective mortgage, develops and manages the building itself and works without profit, so the rents only cover the costs. The structure is a timber hybrid; the facade is made of reused wood from old mooring posts and sheet piling, planted with shrubs, climbers and trees, and the building produces more energy than it uses. Its success helped persuade the city to scale up its cooperative policy, even as rising interest rates in 2023 left other groups struggling to finance their plans. It won the public jury prize of the Amsterdam Architecture Prize in 2023 and the Amsterdam Nieuwbouwprijs in 2024.

    It is the residents' home: look at it from the street.

    Look for:
    - the weathered timber of the facade, recycled from the waterfront
    - the planted facade and balconies
    - the self-built houses all around, Centrumeiland's way of building
