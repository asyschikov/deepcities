  nl:
    title: Sluishuis
    summary: Het woongebouw van BIG en Barcode Architects bij de entree van IJburg tilt één hoek uit het IJmeer op, zodat boten de binnenplaats in kunnen varen. Openbare trappen langs de terrassen leiden naar een wandelpad op het dak, maar niet elke dag.
    body: |
      Begin 2016 schreef de gemeente Amsterdam een prijsvraag uit voor een 'beeldbepalend' gebouw op de Haringbuisdijk, bij de entree van het Steigereiland, tegenover de woningen van Marlies Rohmer. Het winnende ontwerp kwam van een samenwerking tussen het Deense BIG (Bjarke Ingels Group) en het Rotterdamse Barcode Architects. Zij ontwierpen een gebouw met schuin afgesneden gevels en een grote opening aan de voorkant, waar boten onderdoor kunnen varen. De vorm van een gesloten bouwblok waarvan hoeken worden 'opgetrokken' gebruikte BIG eerder bij het gebouw VIA 57 West in Manhattan.

      De vreemde vorm zorgde voor een hoop uitdagingen bij de bouw. De bouwcombinatie besloot twee 'ruggengraten' te bouwen in de vorm van betonnen muren van bijna een halve meter dik, waaraan de woningen zijn opgehangen. Tijdens de bouw werd er gewerkt met een tijdelijk opgespoten eiland. De heipalen gingen zestig meter de grond in en de buitenkant is bekleed met platen van aluminium. Op 18 december 2018 werd begonnen met de bouw; het gebouw werd geopend op 13 juli 2022. Het Sluishuis heeft 442 appartementen, waarvan 369 huur (voornamelijk in het middensegment) en 73 koop. Rondom het gebouw ligt een steiger met plek voor 34 woonboten. Omdat het over het water van het Buiten-IJ is gebouwd, kunnen boten 'in' het gebouw aanmeren, en door de aparte vorm lijkt het te 'zweven' boven het water.

      In de gevel zijn twee trappen aanwezig die langs de terrassen naar het dak leiden, waar een wandelpad is met uitzicht over de stad. De situatie rondom de toegang tot dit wandelpad was een tijd onduidelijk. Die toegang is namelijk in beheer bij de VvE van het gebouw, en die zou ervoor kunnen kiezen om de daktuin maar beperkt open te stellen. De gemeente Amsterdam heeft bedongen dat de trappen minimaal tachtig dagen per jaar open moeten zijn voor het algemeen publiek.

      Let op:
      - de opgetilde hoek met de boten eronder, gezien vanaf de Enneüs Heermabrug
      - de steiger die rondom het hele gebouw loopt
      - de getrapte terrassen aan de stadskant en de trappen die erlangs klimmen
      - de drijvende woningen van Waterbuurt West aan de overkant
    attributes:
      architect: BIG (Bjarke Ingels Group) met Barcode Architects
    sources:
      - https://nl.wikipedia.org/wiki/Sluishuis_(Amsterdam)

- title: De Warren, Amsterdam's first housing co-op
  summary: A timber building on Centrumeiland put up by a group of young Amsterdammers who won a city pilot in 2018 and now own and run it together. Rents stay out of the market, and 30 percent of the floor space is shared.
  body: |
    In a housing cooperative the residents own their building collectively and in effect rent from themselves. In April 2018 a group of about fifty young Amsterdammers won the city's tender for a pilot cooperative, and De Warren became the first self-built housing cooperative in the city to be finished. It was designed by Natrufied Architecture of Bergen and built in 2021–2023 on the Nydia Ecurystraat, on Centrumeiland, the new island where most homes are self-build projects. It opened in April 2023.

    The building has 36 social and mid-rent homes. About 800 square metres, 30 percent of the floor space, is set aside for shared rooms: an auditorium, a dance hall, a music studio, offices, a workshop and a children's playroom, strung along a big stepped stair inside. The cooperative takes out one collective mortgage, develops and manages the building itself and works without profit, so the rents only cover the costs. The structure is a timber hybrid; the facade is made of reused wood from old mooring posts and sheet piling, planted with shrubs, climbers and trees, and the building produces more energy than it uses. Its success helped persuade the city to scale up its cooperative policy, even as rising interest rates in 2023 left other groups struggling to finance their plans. It won the public jury prize of the Amsterdam Architecture Prize in 2023 and the Amsterdam Nieuwbouwprijs in 2024.

    It is the residents' home: look at it from the street.

    Look for:
    - the weathered timber of the facade, recycled from the waterfront
    - the planted facade and balconies
    - the self-built houses all around, Centrumeiland's way of building
