  nl:
    title: Wachtershuis en Fliegerhorst-bunkers, Zuider IJdijk
    summary: Een wachterswoning uit 1907–1909 bij wat toen de enige toegang over land tot het Zeeburgereiland was, met daarachter de drie grootste Duitse bunkers die Amsterdam nog heeft, van de watervliegtuigbasis van de Luftwaffe.
    body: |
      Het Zeeburgereiland is rond 1900 ontstaan. Vanwege de strategische ligging kreeg het nieuwe eiland gedeeltelijk een militaire functie. Aan de zuidwestzijde werd vanaf 1907 het schiet- en exercitieterrein voor het garnizoen te Amsterdam gebouwd, dat vanaf 1910 in gebruik is genomen. Aan de Zuider IJdijk op nummer 24, vlakbij de destijds enige toegang over land tot het eiland, bouwde het Departement van Oorlog een wachterswoning en direct hiernaast een schuilloods voor de manschappen, een toiletgebouw en een opslagplaats voor schietschijven.

      In 1916 werd ter plaatse van de tegenwoordige Sportheldenbuurt, aan de noordkant van het eiland, het Marine Vliegkamp Schellingwoude aangelegd, met een hangar en hellingbaan voor watervliegtuigen. Tijdens de Duitse bezetting in 1940-1945 bouwde de Luftwaffe het bestaande vliegkamp om tot Fliegerhorst Schellingwoude, de grootste vliegbasis voor watervliegtuigen van Nederland. Verspreid over het eiland verrezen ook tientallen bouwwerken, variërend van zware bunkers tot luchtafweergeschut. Na de oorlog, in de loop van de jaren 50 en 60, verdwenen de militaire functies van het eiland. Ook de schijven- en schuilloods werden overbodig en zijn gesloopt; hun contouren zijn nog in het maaiveld te zien, wat erop duidt dat de fundering nog aanwezig is.

      De wachterswoning is bewoond gebleven. De woning is weliswaar in recente jaren gerenoveerd, maar heeft haar oorspronkelijke bouwmassa, vorm en detaillering behouden, met een voor die periode karakteristieke architectonische opzet met symmetrische voorgevel, kroonlijst en schilddak. De oorspronkelijke opslag voor drinkwater voor soldaten is tegenwoordig in gebruik als wijnkelder. Verder resteren nog slechts drie Duitse bunkers, zonder hun oorspronkelijke aanaarding ter bescherming en camouflage. Het zijn de grootste nog in Amsterdam aanwezige bunkers, alle in de zuidwesthoek van het eiland, in de nabijheid van de wachterswoning; een ervan is de 'Gefechtsstand für Fliegerhorst-kommandant'. Samen vormen de wachterswoning, de fundamenten van de loodsen en de drie resterende bunkers een cultuurhistorisch ensemble dat de geschiedenis van het militaire erfgoed op het Zeeburgereiland afleesbaar houdt. Alles staat op particulier terrein en is vanaf de dijk te zien.

      Let op:
      - de symmetrische voorgevel en het schilddak van nummer 24
      - grijze betonblokken tussen de erven achter de dijk
      - de Leeuwen van Zeeburg bij de kanaalmonding, zo'n 150 meter verderop langs de dijk
    attributes:
      built: 1907–1909 (wachterswoning); 1940–1945 (bunkers)
      original_use: Wachterswoning van een militair schietterrein; bunkers van een Duitse watervliegtuigbasis
      check_note: "TracesOfWar beschrijft de bunkers als nog aanwezig (pagina's zonder datum); het gebied Baaibuurt-West eromheen wordt bebouwd."
    sources:
      - https://ruimtelijkeplannen.nl/documents/NL.IMRO.0363.M1801BPGST-VG01/b_NL.IMRO.0363.M1801BPGST-VG01_6.pdf
      - https://nl.wikipedia.org/wiki/Zeeburgereiland

# ================================================================ IJburg

- title: Sluishuis
  summary: "BIG and Barcode's housing block at the gate of IJburg lifts one corner out of the IJmeer so boats can sail into its courtyard, and steps down to the water on the other side. Public stairs lead up its terraces to a roof walk, but not every day."
  body: |
    In 2016 the city held a competition for a "landmark" building on the Haringbuisdijk, at the entrance to Steigereiland, opposite Marlies Rohmer's floating homes. The winners were the Danish firm BIG of Bjarke Ingels and Rotterdam's Barcode Architects. Their design is a closed square block standing in the open water of the Buiten-IJ, with its facades sliced off at an angle: one corner is lifted high, so that the courtyard opens to the IJ and boats can moor "inside" the building, while the opposite side steps down in terraces towards the city. BIG had tried the trick of pulling up the corner of a closed block before, at VIA 57 West in Manhattan.

    The odd shape was hard to build. The contractors put up two concrete "spines", walls almost half a metre thick, and hung the homes from them; work was done from a temporary sand island, with piles driven sixty metres into the ground, and the outside is clad in aluminium panels. Building began on 18 December 2018 and the Sluishuis opened on 13 July 2022. It has 442 apartments, most of them mid-market rentals, and a jetty that runs all the way round the building with berths for 34 houseboats.

    The contested part is the roof. Two stairs in the facade climb past the residents' terraces to a walkway on top, with a view over the city. Access is controlled by the owners' association, which could have kept it closed; the city stipulated that the stairs must be open to the public on at least eighty days a year. So it is a public route, but a rationed one.

    Look for:
    - the lifted corner and the boats moored underneath it, from the Enneüs Heermabrug
    - the jetty that runs round the whole building
    - the stepped terraces on the city side and the stairs that climb them
    - Waterbuurt West's floating houses across the water
  category: housing
  lat: 52.364329
  lng: 4.981450
  address: Haringbuisdijk, Steigereiland-Noord
  links:
