  nl:
    title: Het grafsteentje in de Tropentuin
    summary: "Achterin een buurtkruidentuin achter het Wereldmuseum ligt tussen de selderij een steentje: 'Mijn Zoon 3-augustus-1877 27-mei-1886 RIP'. Het komt van de verdwenen Oosterbegraafplaats, ligt ongeveer waar het graf was en hoorde bij een jongetje dat op Borneo werd geboren."
    body: |
      Het Wereldmuseum (het vroegere Tropenmuseum) en de noordkant van het Oosterpark liggen op de oude Oosterbegraafplaats, in de jaren zestig van de negentiende eeuw net buiten de Muiderpoort aangelegd en in 1894 al vol en gesloten. Bij de ruimingen, rond 1910 en in de jaren vijftig, konden families die voor een eigen graf hadden betaald het laten overbrengen naar De Nieuwe Ooster. Er werd gesjoemeld: toen in 2017 bij het Metis Lyceum een fietsenkelder werd uitgegraven, kwamen er nog tientallen graven tevoorschijn, en de archeologen schatten dat er onder het basketbalveld nog zo'n 600 mensen liggen.

      In 2001 kwam bij het rooien van oude bomen aan de parkkant van het museum een steentje boven de grond. Het is klein, zonder naam en pas leesbaar als je het wat nat maakt: "Mijn Zoon 3-augustus-1877 27-mei-1886 RIP". In 2023 legde het podcastteam van Geheugen van Oost de data voor aan het Stadsarchief, dat er een naam bij vond: Johannes Christiaan Karel Kesler. Hij werd geboren in Bandjermasin op Borneo, waar zijn vader kapitein was in het Oost-Indisch Leger, kort na de inlijving van het sultanaat daar. Via Haarlem kwam het gezin in 1882 in de nieuwe Van Swindenstraat 47 terecht. De vader stierf in 1883 aan pleuris en werd op deze begraafplaats begraven. Drie jaar later kreeg het jongetje difterie; hij overleed in het kinderziekenhuis aan de Sarphatistraat en kreeg een tweedeklas kindergraf vlak bij de ingang, ongeveer waar het steentje nu ligt. Zijn zusje overleed in 1960 ongehuwd, de laatste van de familie.

      Sinds 2018 is hier de Tropentuin, een buurttuin van De Gezonde Stad met moestuinbakken, een kas en een pluktuin met inheemse kruiden waar iedereen mag plukken. Het steentje ligt helemaal achterin, vaak half onder blad en aarde. De speld staat op de tuin.

      Let op:
      - het steentje achterin de kruidentuin, tussen de bleekselderij en de smeerwortel
      - het wormenhotel en de moestuinbakken
      - het bord over de oude begraafplaats aan het parkhek bij de ingang aan het 's-Gravesandeplein
    attributes:
      original_use: Kindergraf op de Oosterbegraafplaats
      check_note: "Speld op de Tropentuin (omtrek in OSM); het steentje ligt achterin de kruidentuin, vaak onder het blad, en werd voor het laatst beschreven in oktober 2023."
    sources:
      - https://geheugenvanoost.amsterdam/page/105543
      - https://geheugenvanoost.amsterdam/page/105975

- title: Stefan Glerum's stained-glass fronts, Polderweg
  summary: "Two leaded-glass walls, each about 18 m high, light up the entrance of a new block on the Polderweg with the whole history of the gasworks site: coal, swimmers, a milk bottle, bandaged animals, Spitfires, a CoBrA snake and a hormone professor."
  body: |
    The Oostergasfabriek site has had more lives than most: gasworks, bathhouse and pool, milk factory, paint factory, animal shelter, the Don Bosco technical school, allotments, a band's rehearsal space and a university lab. When Heren 5 architects built the housing block at Polderweg 502-646, a brick design in the manner of the Amsterdam School, the illustrator Stefan Glerum got the stairwell at its centre, commissioned by Ymere with support from the Amsterdam arts fund (AFK). He filled the front and the back with leaded glass, about 18 m high, telling the site's stories from the bottom up, one story per floor.

    On the front, coal lies at the foot, and rounded bricks stand for a gasholder. A stoker shovels coal, strips off his work clothes and turns into a swimmer, for the bathhouses that became the Sportfondsenbad. A milk bottle floats by (the dairy), animals wear bandages (the shelter where people could have pets treated cheaply), and British Spitfires strafe the gasholders, because Germans were stationed there in the war. A tube of paint hides in a tree, a street urchin drops schoolbooks marked DB (Don Bosco), and a snake recalls the CoBrA painter Anton Rooskens, who taught metalwork there. The factory chimney ties it all together. On the back, the Roode Fanfare marches with a flag of beef studied by Ernst Laqueur, whose lab on the site isolated a female sex hormone in the 1920s and who, as a Jew, was barred from it in 1941; a policeman finds the treasure hidden in the Linnaeusstraat synagogue that the Germans never found, and a korfball player shoots into the chimney.

    Glerum's own advice: come after dark, when the glass is lit from inside.

    Look for:
    - the swimmer climbing out of the coal at the bottom of the front
    - the Spitfires over the gasholders
    - Laqueur and the beef flag on the back, facing the railway
    - Glerum's signature in the glass
