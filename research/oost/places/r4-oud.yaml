  nl:
    title: Villa Mattern, bungalow van Renate Rubinstein
    summary: "Een lage bungalow van glas en staal uit 1967, tussen het spoor en de blokken van Oostpoort. Columniste Renate Rubinstein kocht hem in 1985 omdat ze door MS geen trap meer op kon; haar geheime liefde Simon Carmiggelt kwam er op dinsdagmiddag langs."
    body: |
      Tussen de woonblokken van Oostpoort is Nicolaas de Roeverstraat 3 een buitenbeentje: een gelijkvloers huis van glas en staal op de hoek van de Polderweg. Architect F.J.E. Dekeukeleire bouwde het in 1967 in de geest van de Nieuwe Zakelijkheid, met veel licht, lucht en ruimte. In 1960 had hij al een vergelijkbaar wit kantoor aan het water ontworpen, aan de Westerdoksdijk 40.

      In 1985 kocht schrijfster Renate Rubinstein (1929-1990) de bungalow om een eenvoudige reden: er zaten geen trappen en geen drempels in. In 1977 was multiple sclerose bij haar vastgesteld en ze kon niet meer lopen. Sinds 1962 schreef ze onder de naam Tamar wekelijks een column in Vrij Nederland; ze geldt als de eerste columnist van Nederland. Haar stukken over haar scheiding en haar ziekte verschenen in de bundels *Niets te verliezen en toch bang* en *Nee heb je*. Hier kreeg ze bezoek van Simon Carmiggelt, die elke dinsdagmiddag bleef komen, ook toen hun verhouding al op zijn eind liep. Niemand wist ervan tot *Mijn beter ik* verscheen in 1991, kort nadat Rubinstein in 1990 op 61-jarige leeftijd zelf een einde aan haar leven had gemaakt. Carmiggelt was in 1987 overleden.

      Haar neef erfde het huis en maakte er met glazen schuifwanden en doorlopende kastanjehouten vloeren één grote ruimte van. Sinds 2002 zit er Villa Mattern, een locatie die wordt verhuurd voor vergaderingen en feesten; de grootste zalen heten Rubinstein en Tamar. Zomaar binnenlopen kan niet, maar vanaf de straat is het huis goed te zien.

      Let op:
      - het platte dak en de glazen wanden, een jarenzestigbungalow tussen de blokken
      - de hoek met de Polderweg, met daarachter het spoortalud
      - het reuzenbeen *Noch Einmal* van Henk Visch, een stukje verder aan de Polderweg
    attributes:
      architect: F.J.E. Dekeukeleire
      original_use: Woonhuis
    sources:
      - https://www.villamattern.eu/geschiedenis.html
      - https://geheugenvanoost.amsterdam/page/87970
      - https://geheugenvanoost.amsterdam/page/101351
      - https://nl.wikipedia.org/wiki/Renate_Rubinstein

- title: Marga Minco's house, Tweede Oosterparkstraat
  summary: "The author of Het bittere kruid and Een leeg huis lived behind this tall neo-Renaissance gable for 54 years. After her death at 103 it stood empty and stripped, was squatted in her name in 2025, and now faces a developer's plans for a bigger house."
  body: |
    Marga Minco (1920–2023), born Sara Minco in Ginneken near Breda, was the first Dutch journalist to be sacked for being Jewish, in May 1940. She went into hiding as Marga Faes and was the only one of her family to survive the war. Her debut *Het bittere kruid* (Bitter Herbs, 1957), a spare chronicle of a Jewish family's destruction, became a European classic and has been translated into some twenty languages. She won the Constantijn Huygens Prize in 2005 and the P.C. Hooft Prize in 2019.

    In 1969 she and her husband, the poet Bert Voeten (who died in 1992), moved into Tweede Oosterparkstraat 265, a stately neo-Renaissance house with a striking top gable on the smart odd-numbered side of the street, between the Linnaeusstraat and the Kastanjeplein. She lived there until her death in July 2023, aged 103, and the literary world came and went.

    Then the house was sold and its interior stripped. Left empty, it decayed, with broken windows and a hole in the roof. On 12 July 2025 a group of young squatters calling themselves De Panters moved in, hung a banner reading "Beter dan leegstand" (better than empty) and held readings and poetry nights in her name; the owner took them to court and they left in October. In early 2026 the neighbours objected to a permit for an extra storey, a basement dug out under the whole house and an extension into the garden. The house is not a listed monument, so the borough says it can do little. Her novel *Een leeg huis* (An Empty House, 1966) is about what the war left behind.

    The house is private. Only the front can be seen from the street.

    Look for:
    - the tall stepped top gable and the neo-Renaissance front
    - the first-floor balcony where the squatters hung their banner
    - the Witsenhuis and the Oosterpark a few steps north
