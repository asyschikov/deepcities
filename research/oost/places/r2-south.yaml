  nl:
    title: Beursmannetje (De krantenlezende man)
    summary: "Een klein bronzen mannetje, verdiept in zijn krant. Veertig jaar las hij die op het Damrak tegenover de Beurs, in 2006 verdween hij voor de metrowerken in een depot, en sinds 2012 staat hij bij de deur van Het Financieele Dagblad, het verkeer achter zijn rug."
    body: |
      Hij leest. Al sinds 1966. Vandalen, studenten met kleren en een metrolijn hebben hem niet van zijn krant kunnen afhouden.

      Voor zijn honderdste verjaardag in 1965 gaf Het Financieele Dagblad (FD) beeldhouwer Pieter d'Hont (1917–1997) de opdracht voor een beeld, als cadeau aan de stad. "De krantenlezende man" werd op 3 maart 1966 onthuld op het Damrak, niet ver van de drukkerij van de krant aan de Beursstraat. Omdat hij bij de Beurs stond, doopten Amsterdammers hem al snel tot het Beursmannetje, en dat bleef hangen. Hij lijkt sterk op de Maigret die d'Hont in hetzelfde jaar voor Delfzijl maakte; d'Hont ontwierp ook het Edison-beeldje van de muziekprijs.

      Twee maanden na de onthulling duwden vandalen hem 's nachts omver; de volgende ochtend zetten een paar agenten en een passerende bouwvakker hem weer overeind. In 1972 hingen studenten van een modeopleiding hem kleren om, als reclame voor hun school. In 2006 was hij zonder aankondiging weg: bouwvakkers trokken hem uit de grond voor de aanleg van de Noord/Zuidlijn, en hij bracht zes jaar door in een depot, tot verdriet van minstens één fan, die schreef dat niemand afscheid had genomen. In 2012 kwam hij terug, niet op het Damrak maar bij de schenkers zelf, aan het Prins Bernhardplein tegenover station Amstel, bij de ingang van het FD. Daar staat hij nog altijd te lezen, het verkeer achter zich. Een klein voorontwerp van het beeld werd jarenlang uitgereikt als de Henri Sijthoffprijs van het FD, voor bedrijven met goede financiële verslaggeving.

      Let op:
      - de krant die hij vlak voor zijn gezicht houdt
    sources:
      - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/1808
      - https://oost-online.nl/het-beursmannetje/
      - https://www.vriendenvanwatergraafsmeer.nl/beursmannetje-is-eindelijk-verankerd-na-een-zwervend-bestaan/

- title: Hildo Krop's gable stones, former Watergraafsmeerschool
  summary: Don Quixote, Sancho Panza, the Bremen Town Musicians, a faun and a child on a goat. Over forty terracotta reliefs by Hildo Krop decorate a 1926 Betondorp school, a money-saving copy of a set he made for a school in Noord.
  body: |
    In 1926 the city architect Nico Lansdorp built a second school for the new garden village of Betondorp on the Huismanshof, after his school complex on the Zuivelplein of 1923. The city sculptor Hildo Krop was asked to decorate it, but the city was short of money. The head of the buildings department of Public Works, A.R. Hulshoff, asked Krop whether he could reuse the designs he had just made for Lansdorp's school on the Wingerdweg in Noord. Krop agreed, so the same small reliefs in fired clay went up here too.

    There are eight designs, repeated along the facade: two birds, Don Quixote on horseback, Sancho Panza on his donkey, a boy playing the flute among birds, the Bremen Town Musicians from Grimm's tale, a faun sitting cross-legged, a child riding a goat and a tree with a leaping deer. Two bigger figures crown the porches: a gnome on a snail and a fox, both in front of a cypress (the fox, a common Krop symbol of cleverness at schools, was long catalogued as a lynx). The city's art database counts 43 pieces, the Hildo Krop Museum 41. The gnome is badly damaged. Krop used the porch crowns at two more schools; one of those, the Dr. Voûteschool in the Obistraat, was demolished and its sculpture probably lost.

    The school is now an apartment building, so the reliefs are seen from the street.

    Look for:
    - Don Quixote and, nearby, Sancho Panza on his donkey
    - the Bremen Town Musicians
    - the fox and the damaged gnome over the entrances
  category: street-art
  lat: 52.34099
  lng: 4.94248
  address: Huismanshof 11-13
