  nl:
    title: Gevelsteentjes van Hildo Krop, voormalige Watergraafsmeerschool
    summary: "Don Quichot, Sancho Panza, de Bremer stadsmuzikanten, een faun en een kind op een bok. Ruim veertig terracotta reliëfs van Hildo Krop sieren een school uit 1926 in Betondorp: een zuinige herhaling van een serie die hij voor een school in Noord maakte."
    body: |
      Bezuinigen kan ook mooi uitpakken. Omdat de gemeente krap zat, kreeg deze school in Betondorp gewoon dezelfde gevelsteentjes als een school in Noord.

      In 1926 bouwde gemeentearchitect Nico Lansdorp aan het Huismanshof een tweede school voor het nieuwe tuindorp Betondorp, drie jaar na zijn schoolcomplex aan het Zuivelplein. Stadsbeeldhouwer Hildo Krop zou ook hier de versiering maken, maar de stad had weinig geld. A.R. Hulshoff, directeur van de afdeling Gebouwen van Publieke Werken, vroeg Krop of de ontwerpen die hij net had gemaakt voor Lansdorps school aan de Wingerdweg in Noord opnieuw gebruikt mochten worden. Krop vond het best, en dus kwamen dezelfde kleine reliëfs van gebakken klei ook hier in de gevel.

      Er zijn acht ontwerpen, die langs de gevel steeds terugkomen: twee vogels, Don Quichot te paard, Sancho Panza op zijn ezel, een jongetje dat tussen vogels op een fluit speelt, de Bremer stadsmuzikanten uit het sprookje van Grimm, een faun die met gekruiste benen zit, een kind op een bok en een boom met een springend hert. Op de portieken staan twee grotere figuren: een kabouter op een slak en een vos, allebei voor een cipres. Die vos, bij Krop een vaak gebruikt teken van slimheid bij scholen, stond lang als lynx te boek. De gemeentelijke kunstdatabase telt 43 stuks, het Hildo Krop Museum 41. De kabouter is zwaar beschadigd. Krop gebruikte de portiekbekroningen nog bij twee andere scholen; een daarvan, de Dr. Voûteschool in de Obistraat, is gesloopt, en het beeldhouwwerk is waarschijnlijk verdwenen.

      In de school zitten nu appartementen, dus je bekijkt de reliëfs vanaf de straat.

      Let op:
      - Don Quichot en, vlakbij, Sancho Panza op zijn ezel
      - de Bremer stadsmuzikanten
      - de vos en de beschadigde kabouter boven de ingangen
    attributes:
      original_use: Lagere school
    sources:
      - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/1311
      - https://kenniscentrum.hildokropmuseum.nl/werken-in-nederland/beelden/b-55-b-watergraafsmeerschool-betondorp/
      - https://oost-online.nl/waar-is-dit-52/

- title: Rembrandt's Omval and the Rembrandttoren
  summary: "In 1645 Rembrandt etched this spit of land in the Amstel, with a couple hidden under a willow. Three and a half centuries later Amsterdam's tallest building went up beside it, and was named after him."
  body: |
    The Omval was a narrow strip of land in a bend of the Amstel, between the river and the old Weesper towing canal, named after a ruin that once stood there. Rembrandt walked out here often and drew it several times. His etching The Omval of 1645 is what made the name known: across the water lies the dike of the Watergraafsmeer, with the mouth of its ring canal and mills, boats and houses; in the shadow of a gnarled pollard willow in the foreground, a man lays a wreath of flowers on a woman's head, a couple only the patient viewer finds. Like many etchings it prints in mirror image.

    The Omval belonged to Ouder-Amstel until Amsterdam annexed it in 1921. In the 20th century it was an industrial edge of the city, with among others part of the Blooker cocoa factory (until 1964), an iron foundry and a shoe polish works. In 1987 the council approved three office towers named after Dutch painters. The Rembrandttoren went up from 1992 and opened in 1995: 135 metres (150 with its mast), partly inspired by the Empire State Building, and still the tallest building in the city. The Mondriaantoren and Breitnertoren followed in 2001 on the Omval itself, which by then had disappeared under sand.

    No plaque tells the story of the etching. Two kilometres up the Amstel, by the Riekermolen, Han Wezelaar's statue shows Rembrandt sketching with a pad on his knee.

    Look for:
    - the view from the west bank of the Amstel, where the three towers line up over the river
    - the little Blooker gatehouse of 1886, rebuilt in 2003 as a café
