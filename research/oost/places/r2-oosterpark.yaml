  nl:
    title: Gedenkteken politiehond Albert
    summary: "Een zwart steentje voor een politiehond die in 1919 de hoed van een moordenaar uit een stapel viste, tot in Indië beroemd werd en in 1923 stierf terwijl zijn baas aan de overkant in het ziekenhuis lag. Let op de spatie in POLITIE HOND."
    body: |
      Tussen twee dozijn andere hoeden lagen die van twee verdachten. Albert snuffelde aan het bebloede scheermes van de plaats delict en haalde de hoed van een van hen eruit. Het was april 1919: in Sint-Oedenrode was de directeur van een zuivelfabriek met doorgesneden keel naast de open brandkast gevonden, en de twee mannen die in Amsterdam waren opgepakt, ontkenden alles.

      Albert, thuis Ab of Appie, was een Tervuerense herder. Brigadier Jacob Water kreeg hem in 1916 als pup van een kantonrechter in Friesland en trainde hem op eigen houtje hier in het Oosterpark. Vooral in 1918 en 1919 zette de Amsterdamse politie de hond in om verdachten op te sporen. Zijn heldendaden haalden de kranten tot in Oost-Indië, en volgens de overlevering kwam de Amsterdamse hondenbrigade van 1921 er mede door hem. Niet iedereen was onder de indruk. In oktober 1919 klaagde een socialistisch blad dat Albert in een andere zaak de verkeerde had gegrepen, die daarvoor de cel in ging.

      Op 14 maart 1923 ging Albert dood. Water lag na een operatie in het Burgerziekenhuis aan de Linnaeusstraat; de hond mocht niet mee op ziekenbezoek en werd later dood onder het bed gevonden, met een zakdoek van zijn baas. Al snel ging het verhaal dat hij die zakdoek van verdriet had ingeslikt. Een comité zamelde geld in, wat niet vanzelf ging, en in juni 1924 werd het gedenkteken onthuld in een stil hoekje achter de melk- en limonadekiosk, waar Albert zijn eerste lessen had gehad. Een graf is het niet: volgens Water zelf ligt de hond in een houten kistje in de achtertuin van het ziekenhuis. De steen is sindsdien een paar keer verhuisd. Na vandalisme in de jaren vijftig verdween de witte marmeren plaat en werd het portret direct in het zwarte graniet gehakt. De speld staat op de steen.

      Let op:
      - "POLITIE HOND" met spatie, een klassieke Nederlandse spelfout
      - het wat onbeholpen portret van de hond, die misschien niet eens een Tervuerense herder is
      - het merkteken van steenhouwerij De Zuil aan het Leidseplein, onderaan de steen
    attributes:
      original_use: Gedenksteen voor een politiehond
    sources:
      - https://nl.wikipedia.org/wiki/Politiehond_Albert
      - https://geheugenvanoost.amsterdam/page/108272/%F0%9F%8E%A7-de-grote-daden-van-de-politiehond-albert
      - https://melandlangeveld.com/2015/05/13/standbeeld-politiehond-albert/

- title: Limietpalen in the Oosterpark
  summary: "Two stone columns crowned with Amsterdam's arms, marked LIMIET-PAAL 1838, one with an arrow and 'Kom der Gemeente Amsterdam'. Wanderers from elsewhere: via a museum garden and a sanatorium gate they ended up among the park's shrubs."
  body: |
    In a bed by the path on the north side of the park stand two almost identical stone columns, each topped by Amsterdam's coat of arms under a count's crown. A band around both reads "LIMIET-PAAL 1838"; one also says "Kom der Gemeente Amsterdam" (built-up area of the municipality of Amsterdam) above a black arrow. Such posts marked a municipal boundary, and the old city limit ran close by, between the later Derde Oosterparkstraat and the Vrolikstraat. Both came from elsewhere.

    Their later travels are recorded. In 1947 they ended up in the garden of the Stedelijk Museum. When that garden gave way to the museum's new wing in 1954, they moved to the Beatrixoord, a convalescent home on the north side of the Oosterpark, where they formed a kind of gate in the fence between sanatorium and park. With them came the top of a much older banpaal (ban post) of 1624 from the Spaarndammerdijk, one of the posts that banished criminals were not allowed to pass, which Rembrandt drew. That piece went back west in 2006 and now stands on the Spaarnwouderdijk, close to its old spot. The public-art site Buitenkunst Amsterdam still describes the banpaal here. The pin is on the post with the arrow.

    The same words turn up far to the east, where the city now meets Diemen. Two more posts marked "Kom der Gemeente Amsterdam" stand on that border: one near the Watergraafsmeer end of the Nesciobrug, where the Historische Kring Diemen has put up a board called "Op de grens van Diemen", and one on the old Zuiderzee dike by Fort Diemerdam, on the IJburg side. They are not part of this pair: a local survey of Amsterdam's limit posts shows a cast-iron one on the Diemen border. Together they are a reminder that the city's edge kept moving east; the Watergraafsmeer was a municipality of its own until Amsterdam annexed it in 1921.

    Look for:
    - the crowned arms of Amsterdam on top of both columns
    - "Kom der Gemeente Amsterdam" and the arrow on one post only
    - further east, two more "Kom der Gemeente Amsterdam" posts on the Diemen border: by the Nesciobrug and by Fort Diemerdam
