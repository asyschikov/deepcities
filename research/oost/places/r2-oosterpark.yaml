  nl:
    title: De Titaantjes (Hommage aan Nescio)
    summary: "Drie jongens met hoed en colbert hangen onderuit op een bronzen bank in het Oosterpark: Hoyer, Bavink en Koekebakker uit Nescio's Titaantjes. In 1985 werden ze gestolen, in 1988 kwamen ze terug als nieuw afgietsel."
    body: |
      Nescio is Latijn voor 'ik weet het niet'. Achter die schuilnaam zat J.H.F. Grönloh (1882-1961), overdag directeur van een handelsmaatschappij. Oost was zijn wijk: lagere school in de Eerste van Swindenstraat, HBS aan de Mauritskade, waar nu het Metis Lyceum zit. Zijn novelle *Titaantjes* (1915) opent met "Jongens waren we, maar aardige jongens" en volgt een groep vrienden vol idealen die er niets van terechtbrengt. De schilder Bavink maakt uiteindelijk alleen nog zonsondergangen en belandt in het gesticht. Hele zomernachten, schreef Nescio, hingen ze tegen het hek van het Oosterpark en praatten ze aan één stuk door.

      Hans Bayens, die ook de Multatuli op de Torensluis maakte, gaf drie van die vrienden een bank in datzelfde park. Hoyer, Bavink en Koekebakker, in die volgorde van links af, zitten er met hoed en colbert onderuitgezakt en kijken naar de wandelaars, net als hun schepper deed. Op 9 oktober 1971, tien jaar na Nescio's dood, onthulde zijn weduwe het beeld. In 1985 nam iemand het mee; in 1988 kwam er een nieuw afgietsel. In 2006 kreeg het drietal nog een lading verf over zich heen. De pin staat bij benadering.

      Let op:
      - de openingszin van *Titaantjes* op de sokkel
      - de hoeden en colberts: het zijn toch echt jongens
      - de langere tekst van Nescio op de gevel van Linnaeusstraat 7, net buiten het park tegenover het Tropenmuseum
    sources:
      - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/1217
      - https://nl.wikipedia.org/wiki/De_Titaantjes
      - https://geheugenvanoost.amsterdam/page/109142/%F0%9F%8E%A7-de-titaantjes

- title: SLM disaster memorial, 's-Gravesandeplein
  summary: "Three aluminium shapes leave a human figure cut out between them, for the 176 dead of the 1989 SLM crash in Suriname, among them footballers of the Kleurrijk Elftal and the Draver Boys band from the café round the corner. Commemorated here every 7 June."
  body: |
    In the early morning of 7 June 1989 a DC-8 of the Surinaamse Luchtvaart Maatschappij (SLM) crashed while trying to land in fog at Zanderij, Paramaribo's airport, on a flight from Schiphol. All nine crew and 167 of the 178 passengers died; eleven survived. It is the worst air disaster in Suriname's history. Most passengers were Surinamese Dutch on their way to visit family. On board was part of the Kleurrijk Elftal (Colourful Eleven), a team of Surinamese-Dutch professional footballers going to play a tournament, and the Draver Boys, a kawina band that often went with them. Their home base was café De Draver at Ruyschstraat 377, around the corner from this square, and the café was among those who started this memorial. It was paid for by Amsterdam, Rotterdam, The Hague and the Dutch football association KNVB, and unveiled in 1991.

    The Surinamese-Dutch painter Guillaume Lo-A-Njoe made three tall aluminium forms that leave the outline of a figure open between them. On the low base is the Sranan text "Lobiwan wi sa tan memre yu" (loved ones, we will always remember you). A broad black granite column and a bench evoke a grave monument. Every 7 June since 1991 people gather here; in 2026 flowers and drawings were laid from seven in the evening, while a football club in Middenmeer held its own commemoration with a tournament. The pin is on the memorial.

    Look for:
    - the empty human shape between the three aluminium forms
    - the Sranan line on the base
    - the bench, whose other support echoes the aluminium forms
