    rank: Nice
    built: "2000"
    architect: Frits van Dongen (de Architekten Cie.)
    artist: Gerrit Kouwenaar (poem), Kees Nieuwenhuijzen (lettering)
  photos:
    - commons:File:2021 Stenen gedicht (Kouwenaar, Nieuwenhuyzen).jpg
  sources:
    - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/1769 (poem text, 12 x 15 m, Nieuwenhuijzen)
    - https://oost-online.nl/triomf-van-de-metselaars/ (Dwars, 6 April 2026; 2000, 167 flats, Lieven de Key, Van Dongen, sawn bricks)
    - https://straatpoezie.nl/gedicht/stenen-gedicht-2/ (placed 2000)
  nl:
    title: Stenen gedicht (Kouwenaar)
    summary: "Een hele blinde muur van het Batavia-blok is een gedicht van acht regels van Gerrit Kouwenaar dat begint met \"Ik lig als een schip\", letter voor letter in gezaagde baksteen gemetseld door metselaars van wie niemand de naam kent."
    body: |
      De lokale krant Dwars vond in 2026 dat je nergens een mooier 'openbaar' gedicht tegenkomt, en vond het jammer dat de metselaars anoniem bleven.

      Batavia, 167 woningen op de hoek van de Panamalaan en de Borneolaan, verrees in 2000 voor woningstichting Lieven de Key, naar een ontwerp van Frits van Dongen. De directeur van de stichting had in het Stedelijk gezien hoe ontwerper Kees Nieuwenhuijzen vier gedichten van Kouwenaar op museumwanden had gezet, en vroeg de dichter om een eigen gedicht. Kouwenaar schreef acht regels waarin het gebouw zelf praat. Het ligt als een schip voor anker bij een eeuwenoude stad, vastgemaakt aan nu maar met een oude naam: het staat waar ooit de VOC-schepen aanlegden. En het huisvest mensen "zoals mensen binnen een huid".

      Nieuwenhuijzen, die veel boeken van Kouwenaar vormgaf, koos de slanke letter en het ritme van vier keer twee regels, op zo'n 12 bij 15 meter. Van Dongen bedacht hoe je dat metselt. De donkerste stenen van zijn 'Fritsmix' werden op halve dikte in stukjes gezaagd en verdiept gelegd, zodat elke letter een schaduwlijn krijgt. Tekenaars tekenden elke letter steen voor steen uit, en de metselaars bouwden het gedicht van onderaf op zonder één fout.

      Let op:
      - bovenaan de openingsregel, die begint met "Ik lig als een schip"
      - de schaduwlijn van elke verzonken letter
      - van dichtbij: de gezaagde halve stenen waaruit de letters bestaan
    attributes:
      architect: Frits van Dongen (de Architekten Cie.)
      artist: Gerrit Kouwenaar (gedicht), Kees Nieuwenhuijzen (typografie)
    sources:
      - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/1769
      - https://oost-online.nl/triomf-van-de-metselaars/

- title: Vrouwe Fortuna (Starreveld)
  summary: A bronze Fortune on a globe, holding a billowing sail, given by the staff of the shipping line SMN in 1950. She lost her company, her tower and her weathervane, spent years in storage, and has stood by Club Panama since 2007.
  body: |
    For its 80th birthday in 1950, the staff of the Stoomvaart Maatschappij Nederland (SMN), the Amsterdam line to the Dutch East Indies, gave the directors a bronze by Pieter Starreveld. Fortuna stands on an open globe with a compass rose and holds a sail that bellies out behind her. In 1951 she was mounted on a tower of the company's building on the Javakade, together with a clock with signs of the zodiac, wishing the firm prosperity and luck. Starreveld had already made the SMN's war memorial, Zeeman op de uitkijk (sailor on the lookout), at the head of the Java-eiland.

    Luck ran out: the colonial trade ended, the SMN merged in 1970 into the shipping group later called Nedlloyd, and the docks were rebuilt as housing. The city moved Fortuna to the head of the Oostelijke Handelskade, then into storage when work started on the cruise terminal; the weathervane she once stood on was lost along the way. On 30 March 2007 she was unveiled again in the strip of grass next to Club Panama, at the corner of the quay and the Piet Heinkade. Photos from 2023 show her there.

    Look for:
    - the sail held in both hands, bellying out behind her
    - the open globe and compass rose under her feet
    - the former hydraulic power station (Club Panama) right behind
  category: street-art
  lat: 52.375093
  lng: 4.929704
  address: Oostelijke Handelskade, by Club Panama
