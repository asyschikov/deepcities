  nl:
    title: Monument voor Keesje Brijde
    summary: "Een eenvoudig houten kruis voor een jongen van dertien, die op 13 december 1944 werd doodgeschoten toen hij in de hongerwinter kolen raapte op het spoorterrein. Buren zetten het neer, spoormannen en een school pasten erop, en elke 4 mei lezen kinderen hier gedichten voor."
    body: |
      Voor wat kolen ging Keesje Brijde op 13 december 1944 met zijn vriend Floris Goulooze de Rietlanden op. Op dat rangeerterrein lagen tussen de sintels van de stoomlocs nog resten kolen van de oude overslag, en in de hongerwinter kwamen mensen uit de omliggende straten ernaar zoeken. De Duitsers hadden het gebied tot Sperrgebiet verklaard en lieten het bewaken. Keesje werd in zijn hals geraakt. Hij werd nog naar het OLVG gebracht, maar overleefde het niet, en ligt begraven op De Nieuwe Ooster.

      Hij was dertien, geboren in 1931, het negende van twaalf kinderen; het gezin woonde eerst in het Zeeburgerdorp en daarna in de Benkoelenstraat. Wie schoot, weet niemand zeker. Lang dacht men aan de Grüne Polizei of een NSB'er. In 2010 meldde een ooggetuige dat het een Nederlandse landwachter was, wat De Waarheid in 1947 ook al had geschreven.

      Na de oorlog zetten buurtbewoners een houten kruis neer op de plek waar hij viel, bij wat nu de westelijke ingang van de Piet Heintunnel is. Bakker J. Schagen uit de Javastraat dichtte er als 'Rijmelaar' een vers bij. Eerst zorgde spoorwegpersoneel voor 'het graf van Keesje', daarna montessorischool Op de Kade. Bij de verbouwing van de havens bleef het bereikbaar; in 1999 verhuisde het naar de Cruquiusweg en in 2000 naar dit plantsoen, dat al sinds 1996 zijn naam draagt. Elke 4 mei houdt het Keesje Brijde Comité hier een bijeenkomst, waar kinderen van basisscholen uit de buurt bloemen leggen en gedichten voordragen (in 2025 nog bevestigd).

      Let op:
      - het houten kruis en het bord met het gedicht van 'Rijmelaar'
      - hoe het plantsoen schuin door het stratenraster van Sporenburg loopt
    sources:
      - https://nl.wikipedia.org/wiki/Keesje_Brijde
      - https://www.keesjebrijdeherdenking.nl/keesje/
      - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/1737

# ================================================================ Zeeburgereiland

- title: De Wokkel (A10)
  summary: "A fifteen-metre concrete column on the A10 Zeeburgerbrug that twists 45 degrees as it rises, made by the bridge's own engineer from the same concrete as the bridge. Named after a twisted Dutch crisp, it is best seen from a moving car."
  body: |
    Wim Snieder (1926–1994), architect-engineer for the national roads agency Rijkswaterstaat, co-designed the bridges and viaducts of the eastern and northern A10 ring, including its biggest piece, the Zeeburgerbrug and Zeeburgertunnel. He felt a structure like that deserved a sculpture and made one himself: a rectangular column about 15 metres tall that twists 45 degrees from bottom to top, so it seems to move as you drive past. It is built of the same concrete elements as the bridge, so it looks almost like part of the structure. The nickname, after the spiral-shaped Wokkels crisps, was there from the design stage.

    From 1990 it stood for a few years on the south side of the motorway, where a slip road ended. When that junction was widened it had to go, but it was moved, not lost: since 1993 it has stood on a bridge pier on the north side. Snieder died a year later. It stands on Rijkswaterstaat land and can only really be seen from the road or from a distance, for example from the Diemerzeedijk.

    Look for:
    - the twist, which comes alive as you drive past
    - the view from the Diemerzeedijk, with the bridge behind it
