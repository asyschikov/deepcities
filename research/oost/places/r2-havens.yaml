    - Google Street View, Cruquiusweg at the Entrepothof, April 2023 (work in place)
  nl:
    title: Katsenarie (Berend Strik)
    summary: "Een blauwe plastic wolk waar koperen uienkoepels uit steken, geplakt op de gevel van een kinderdagverblijf in het oude havendouanekantoor. De kunstenaar noemde het zelf mislukt en stelde voor het te slopen. Het hangt er nog steeds."
    body: |
      De kunstenaar wilde zijn eigen werk het liefst laten slopen. Op Street View van 2023 hangt het er nog.

      Het gebouw aan de Cruquiusweg was een havendouanekantoor. Toen architect Sjoerd Soeters er kinderdagverblijf Oehoeboeroe van maakte, verhuisde de ingang naar achteren, en aan de straat bleef een kale betonnen wand over. Berend Strik, bekend van zijn machineborduursel over foto's uit tijdschriften en pornoblaadjes, mocht er een voorgevel van maken. Zijn redenering: als je een grijze muur toch gaat verstoppen, doe dan niet alsof, maar overdrijf tot het overduidelijk nep is. In 1994 kwam er een reusachtige blauwe wolk op de gevel, met torenspitsen van buigzame koperen buis die eruit opsteken, als een oosters sprookjespaleis uit de Efteling dat half in de mist verdwijnt.

      Strik was ontevreden over wat er stond. Door bezuinigingen moest hij alle onderdelen kleiner maken, en hij schreef later dat de wolk voor het gebouw hing "als een slap decor", en vroeg zich af of het nog een wolk was of een uitgeperste blauwe sinaasappel. Hij stelde zelfs voor de blauwe wand weg te halen en de gevel met grijs cement te stuken. Niemand deed het. Op Street View van april 2023 hangen de wolk en de spitsen er nog, naast de hoek van de Entrepothof.

      Let op:
      - de donkere koperen spitsen die boven uit de wolk steken
      - de uitgespaarde ramen van het oude douanekantoor die door het plastic gluren
      - de lage glazen aanbouw van het kinderdagverblijf aan de voet
    attributes:
      original_use: Havendouanekantoor
    sources:
      - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/1778
      - https://www.artatsite.com/Amsterdam/details/Strik_Berend_Katsenarie_Cruquiusweg_beelden_statues_sculptures_kunst_Art_at_Site_Amsterdam.html (tekst buitenbeeldinbeeld.nl)

- title: Stenen gedicht (Kouwenaar)
  summary: "A whole blind wall of the Batavia block is a poem: \"Ik lig als een schip op de rede\", eight lines by Gerrit Kouwenaar, laid letter by letter in sawn brick by bricklayers whose names are unknown."
  body: |
    Batavia, 167 flats on the corner of the Panamalaan and the Borneolaan, went up in 2000 for the housing association Lieven de Key, designed by Frits van Dongen. The association's director had seen designer Kees Nieuwenhuijzen put four Kouwenaar poems on museum walls in the Stedelijk, and asked the poet for one of his own. Kouwenaar wrote eight lines in which the building speaks: it lies like a ship in the roads of a centuries-old city, tied to the present but carrying a past name (Batavia: the building stands where the VOC ships once moored), housing people "the way people live inside a skin".

    Nieuwenhuijzen, who designed many of Kouwenaar's books, set the slender letters and the rhythm of four times two lines, about 12 by 15 metres. Van Dongen worked out how to build them: the darkest bricks of his brick mix (the 'Fritsmix') were sawn into thin slices and laid recessed, so each letter throws a shadow line. Draughtsmen drew every letter brick by brick, and the bricklayers built the poem up from the bottom without a single slip. In 2026 the local paper Dwars called it the most beautiful public poem around and regretted that the bricklayers stayed anonymous.

    Look for:
    - the opening line "Ik lig als een schip op de rede" at the top
    - the shadow line of each sunken letter
    - the sliced half-bricks that make up the letters, up close
  category: street-art
  lat: 52.370077
  lng: 4.934610
  address: Panamalaan, corner of the Borneolaan
  links:
    - { label: Kunstwacht (Gevelgedicht), url: "https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/1769" }
    - { label: "Dwars: Triomf van de metselaars", url: "https://oost-online.nl/triomf-van-de-metselaars/" }
    - { label: Straatpoëzie, url: "https://straatpoezie.nl/gedicht/stenen-gedicht-2/" }
