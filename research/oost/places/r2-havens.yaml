  nl:
    title: Vrouwe Fortuna (Starreveld)
    summary: "Een bronzen Fortuna op een wereldbol, met een bollend zeil in haar handen, in 1950 geschonken door het personeel van rederij SMN. Ze raakte haar bedrijf, haar toren en haar windwijzer kwijt, lag jaren in de opslag en staat sinds 2007 bij Club Panama."
    body: |
      De godin van het geluk had zelf niet veel geluk. Ze verloor haar rederij, haar toren en haar windwijzer, en belandde een tijd in een depot.

      In 1950 bestond de Stoomvaart Maatschappij Nederland (SMN), de Amsterdamse lijn op Nederlands-Indië, tachtig jaar. Het personeel gaf de directie toen een brons van Pieter Starreveld. Fortuna staat op een opengewerkte wereldbol met windroos en houdt een zeil vast dat achter haar opbolt. In 1951 kwam ze op een toren van het bedrijfsgebouw aan de Javakade, samen met een klok met de tekens van de dierenriem, met de wens dat ze de firma welvaart en geluk zou brengen. Starreveld had eerder al het oorlogsmonument van de SMN gemaakt, Zeeman op de uitkijk, op de kop van het Java-eiland.

      Toen keerde het tij. De koloniale vaart hield op, de SMN fuseerde in 1970 tot de rederijcombinatie die later Nedlloyd heette, en de havens werden woonwijk. De gemeente zette Fortuna op de kop van de Oostelijke Handelskade, en borg haar op toen daar de bouw van de cruiseterminal begon. Onderweg raakte de windwijzer waarop ze stond zoek. Op 30 maart 2007 werd ze opnieuw onthuld, op het grasstrookje naast Club Panama, op de hoek van de kade en de Piet Heinkade. Op foto's uit 2023 staat ze er nog.

      Let op:
      - het zeil in haar beide handen, bollend achter haar
      - de opengewerkte wereldbol en de windroos onder haar voeten
      - het voormalige hydraulische krachtstation (Club Panama) er vlak achter
    sources:
      - https://www.buitenkunstamsterdam.nl/kunstwerken/bekijk/1750
      - https://nl.wikipedia.org/wiki/Fortuna_(Pieter_Starreveld)

# ================================================================ Java-eiland and KNSM-eiland

- title: Java-eiland canals and bridges
  summary: "Four little canals cut across a former harbour pier, lined with narrow canal houses by many different architects and crossed by nine black footbridges whose twisting railings secretly spell words in an artists' alphabet."
  body: |
    The Java-eiland was begun at the end of the 19th century as a breakwater in the IJ and became the quay of the shipping line SMN, which sailed to the Dutch East Indies. In the 1980s squatters and artists moved in. In the 1990s everything except one harbour building was cleared and Sjoerd Soeters drew a plan with four short canals across the island, the Brantas-, Lamong-, Majang- and Seranggracht, named after rivers on Java. Along them stand rows of tall, narrow houses, each to a different architect's design, and each design was built four times, once on every canal. The island was built up in 1999–2000.

    The nine footbridges over the canals are by the Belgian artist couple Guy Rombouts and Monica Droste. In the 1980s they invented the Azart alphabet ("A to Z art"), in which every letter is a line and a colour (C for curve and for lemon yellow). Each bridge railing is a word written in those wiggling lines: idee, image, word, wetenschap, enseignement, society, kunst, conscience and light. The letters were meant to be in colour too, but the architect of the bridges thought that looked like toys, so all of them are black.

    Look for:
    - the Kunst bridge over the Majanggracht, and the Idee bridge over the Seranggracht
    - the different height and window pattern of every house along one canal, then the same houses again on the next
    - the garden courtyards between the canals, named after Javanese towns
    - in the Tosarituin and elsewhere, Huibert Groenendijk's black-ribbed transformer houses (1997), which the designer of the Maxi-Cosi called "chapels" handing out the blessings of technology
  category: housing
  lat: 52.378586
  lng: 4.930030
  address: Majanggracht, Java-eiland
