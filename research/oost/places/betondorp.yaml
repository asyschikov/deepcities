  nl:
    title: Heilige Familiekerk, Zaaiersweg
    summary: "In het ‘rooie dorp’ was geen kerk voorzien, maar in 1952 kregen de katholieken er toch een: een sobere, zorgvuldig gemetselde kerk waarvan de klokkentoren precies aan het eind van de Veeteeltstraat staat. Sinds 1996 kerkt hier de Engelstalige katholieke parochie van Amsterdam."
    body: |
      Een kerk? Daar had in Betondorp, het ‘rooie dorp’, niemand op gerekend. De katholieken hielden het eerst bij een noodkerk in een school aan het Zuivelplein. In 1941 werden de eerste plannen gemaakt, en in 1951 paste de gemeente het uitbreidingsplan aan: een strook tussen het dorp en De Nieuwe Ooster die voor een park bestemd was, mocht een kerk krijgen. Opdrachtgever was de Congregatie van de Missionarissen van de Heilige Familie; de Leidse architecten H.A. van Oerle en J.J. Schrama tekenden het. Op 16 juli 1952 ging de kerk in gebruik, in augustus volgde de consecratie. Tegelijk verrees er een kloostertje voor zeven broeders, nu de pastorie.

      Het ontwerp is traditioneel en ingetogen: lichtrode baksteen, blauw geglazuurde pannen, ramen met een segmentboog, één schip met een vijfzijdige apsis. De klokkentoren van 16 meter staat op de as van de Veeteeltstraat en sluit dus het zicht door die straat af. Boven het ingangsportaal zit een stenen reliëf van de Heilige Familie door Cephas Stauthamer. Oorspronkelijk waren de muren roomwit geschilderd, wat fel afstak tegen het blauwe dak; een schoonmaakbeurt maakte daar een eind aan. Binnen heeft het tabernakel van edelsmid Van Draanen deurtjes met twee grazende herten en de woorden ‘Fons Vitae’.

      In 1996 namen de Engelstalige katholieken van Amsterdam, de Parish of the Blessed Trinity, kerk en klooster over.

      Let op:
      - de klokkentoren in de lijn van de Veeteeltstraat, met zijn klok in een open rondboog
      - het reliëf van de Heilige Familie door Stauthamer in de trapgevel van het portaal
      - de drie ronde vensters hoog in de zuidwestgevel
      - het bakstenen reliëf met het chi-rhoteken in een nis op de gevel van de pastorie
    attributes:
      architect: H.A. van Oerle en J.J. Schrama
      original_use: Rooms-katholieke kerk en klooster
    sources:
    - city register 200748 (redengevende omschrijving)
- title: German bunker, Middenweg
  summary: 'A small, thick-walled brick hut by the Middenweg is a rare survivor of the German defence
    line around occupied Amsterdam: a guard room where soldiers waited before running to their foxholes.'
  body: |
    During the Second World War the German occupiers ringed Amsterdam with defence lines. The outer line ran roughly where the ring road is now, using the ring canal (Ringvaart) and the Weespertrekvaart as obstacles; a second line ran just behind it. The Middenweg, the road out to Diemen, was a strategic way into the city from the east, like the Amstelveenseweg in the south and the Haarlemmerweg in the west.

    This little building, "Widerstandsnest 138" of the type Bereitschaftsraum (readiness room), guarded that road. It was not a real fortress: the register calls it "verstärkt feldmässig", only lightly reinforced. Its walls are of orange brick, about 65 centimetres thick, with a poured concrete roof that still shows the marks of its wooden formwork. Inside are a corridor along the Middenweg and two rooms, with windows to the east, south and west that could be shut with steel plates. Soldiers stayed and kept watch here, and in an attack they would run to the foxholes nearby. The city calls it a unique remnant of the German defences of Amsterdam and listed it in 2003.

    Look for:
    - the window openings bevelled outwards, with brick sills
    - the formwork marks in the slightly curved concrete roof
    - the bricked-up doorway on the west side
    - the plank door with round ventilation holes
