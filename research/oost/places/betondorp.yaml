  nl:
    title: Muurschildering Johan Cruijff, Anfieldroad
    summary: "Een portret van Johan Cruijff van dertien meter hoog op een flat bij het oude Ajax-terrein. De Braziliaan Paulo Consentino schilderde het in elf dagen met jongeren uit de buurt; Cruijffs weduwe onthulde het in 2017."
    body: |
      Paulo Consentino had al voetbalmuren geschilderd in Brazilië, Argentinië, Uruguay, Portugal, Spanje en Duitsland. Voor Cruijff had hij elf dagen nodig, en hij kreeg hulp van jongeren uit de buurt.

      Een jaar nadat Cruijff in maart 2016 was overleden, onthulden zijn weduwe Danny Cruijff en burgemeester Eberhard van der Laan op 9 mei 2017 de schildering. Ze beslaat de kopgevel van een woonblok op de hoek van de Wembleylaan en de Anfieldroad. Dat is op de grond waar ooit stadion De Meer van Ajax stond, en recht tegenover Betondorp, waar Cruijff opgroeide. Het werk is dertien meter hoog en acht meter breed. Het initiatief kwam van de Cruyff Legacy en de Cruyff Foundation, samen met verfmaker AkzoNobel.

      Ook de straatnamen horen bij het verhaal: de Anfieldroad heet naar het stadion van Liverpool. De schildering is er nog en is een stop op de Cruijff-wandeling van de stad.

      Let op:
      - het portret van dertien meter hoog op de kopgevel, op de hoek van de Wembleylaan en de Anfieldroad
    sources:
    - https://www.hartvannederland.nl/algemeen-nieuws/artikelen/muurschildering-johan-cruijff-onthuld
    - https://www.iamsterdam.com/zien-en-doen/natuur-en-actief/routes/wandelroute-door-de-stad-van-johan-cruijff
- title: Johan Cruijff's childhood home, Akkerstraat
  summary: "The corner house in Betondorp where Johan Cruijff lived until he was twelve, in his father's greengrocer's, a short walk from the Ajax ground. Today it is an ordinary social rental home, with stickers on the windows telling his story."
  body: |
    Johan Cruijff was born in 1947 in the Burgerziekenhuis on the Linnaeusstraat, but he grew up here, at Akkerstraat 32 on the corner of the Tuinbouwstraat, where his father ran a shop for fruit, vegetables and potatoes. The family lived here until 1959. The boy kept the ball up on this pavement, and the Ajax stadium De Meer was a few streets away.

    Calls to make the house a museum about Cruijff, Ajax and working-class Betondorp, backed by his brother Henny, came up whenever it fell empty. Instead it stayed what it was built as: a small social rental home, owned by the housing association Ymere, that drew over 1,500 applicants when it was last let in 2022. It is somebody's home, so look from the street only. Stickers on the windows tell the story of young Johan and his saying that outdoor play should be a school subject. Around 2021, when the street was refreshed, an Ajax shirt with his number 14 was laid in coloured tiles in the pavement beside the house, and the parking meters in the neighbourhood carry his picture. The Cruyff Court Betondorp at Onderlangs, opened by Cruijff himself in 2014, is a few streets away.

    Look for:
    - the number 14 Ajax shirt in coloured tiles next to the house
    - the window stickers about the young Johan
    - the parking meters with Cruijff seen from behind, directing his teammates
