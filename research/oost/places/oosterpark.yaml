  photos:
    - commons:File:Nieuw gebouw Raad van Arbeid Amsterdam, 1951.jpg
    - commons:File:Gebouw Raad van Arbeid Amsterdam, Bestanddeelnr 903-5766.jpg
    - commons:File:2020 Rhijnspoorplein 1 Man en vrouw (Krop).jpg
  sources:
    - city:200708 (register text)
  nl:
    title: Raad van Arbeid aan het Rhijnspoorplein
    summary: "Ontworpen in 1939, begonnen in 1940 en pas in 1951 af, toen beide architecten al dood waren. Een kantoorblok van acht lagen met een getrapte top, gebouwd voor de Raad van Arbeid, met binnen een raadzaal die er nog vrijwel gaaf bij ligt."
    body: |
      De Raad van Arbeid hoorde bij de Rijksverzekeringsbank, de staatsinstelling die de sociale verzekeringen uitvoerde. De raad zat eerst aan de Herengracht en daarna in een rijkskantoor aan de Droogbak. In 1939 vroeg het ministerie van Sociale Zaken architect C.J. Blaauw om een eigen gebouw, op het terrein van het vroegere Weesperpoortstation. In 1940 ging de schop de grond in, en toen kwam de oorlog. Van der Veen overleed in 1944, Blaauw in 1947. H.T. Zwiers maakte het in 1951 af, vrijwel precies volgens de oude tekeningen. Op de begane grond waren winkels bedacht; daarom loopt er aan de noordkant een galerij.

      Aan het Rhijnspoorplein staat het hoge deel, acht lagen, met een bovenste verdieping die terugwijkt en trapsgewijs oploopt. Langs de Mauritskade buigt een vleugel van vier lagen mee, met over de volle lengte een dakterras. Binnen zijn de raadzaal en de kamer van de voorzitter bewaard gebleven. Bij de hoofdingang dragen stenen pilasters een man en een vrouw.

      Let op:
      - de getrapte top van het hoge blok
      - de galerij aan de noordkant, overgebleven van de geplande winkels
      - de man en de vrouw op de pilasters bij de hoofdingang
    attributes:
      built: 1939–1951
      architect: C.J. Blaauw en J.H. van der Veen; voltooid door H.T. Zwiers
      original_use: Kantoor van de Raad van Arbeid
    sources:
      - https://data.amsterdam.nl/monumenten/9eecf7fd-1b71-4941-b684-faaf94a310b7

- title: Van Ravesteyn's ATO flats
  summary: "As far as is known the only Amsterdam building by Sybold van Ravesteyn, the railways' great architect: a block of flats of 1931–32 that fronted the garages and horse stables of the NS bus company ATO and the carrier Van Gend & Loos."
  body: |
    The Algemene Transport Onderneming (ATO) was the bus company of the Dutch Railways, founded in 1927, which bought up small bus firms; in 1948 it merged with Van Gend & Loos, the carrier that lives on in DHL. Near the old Weesperpoort station the two NS daughters built a complex of stables, garages and housing, and the railways' own architect Sybold van Ravesteyn (1889–1983) designed this block of flats in 1931–32. Van Ravesteyn, a member of the progressive Groep '32 and known for "poetic functionalism", built signal boxes, stations (Utrecht Centraal of 1940, Rotterdam Centraal of 1957, both demolished) and Blijdorp zoo; as far as is known, this is his only building in Amsterdam. The stables were demolished in the 1960s and a regional bus station was built on their foundations, later moved to the Amstelstation. The block was renovated in 2019.

    Look for:
    - the straight-lined facade, a rarity in the work of an architect known for curves
    - the side wall that follows the bend in the street, where the stables and later the bus station stood
