    summary: "Een bronzen bloemenbeeld van Karel Appel uit 1991 op het Oosterspoorplein, in 2002 geplaatst vlak bij de Dapperstraat, waar de CoBrA-schilder in 1921 werd geboren."
    body: |
      Karel Appel (1921-2006), schilder van de CoBrA-beweging, kwam vlak bij deze plek ter wereld, in de Dapperstraat. In 2002 kreeg zijn bronzen beeld *Flowers* uit 1991 een plaats op het Oosterspoorplein bij het Muiderpoortstation, als herinnering aan zijn jeugd in de Dapperbuurt. Het is geen kleurrijk boeket zoals je van Appel zou verwachten: op een dikke plaat boven een donkere granieten trommel liggen een grote bloemkop met geschulpte rand en een stapel ruwe planken, alles gegoten in donker brons, met de houtnerf nog te zien.

