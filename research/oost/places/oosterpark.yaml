  nl:
    title: Gordijnenfabriek Wild & Hardebeck
    summary: "Een betonnen gordijnenfabriek uit 1919-1921, versierd met gekleurd beton volgens een gepatenteerd procedé. De Joodse eigenaren werden gedeporteerd en kwamen nooit terug; de bedrijfsleider hield de boeken bij tot in de jaren zeventig. Sinds 1979 woningen en drie ateliers."
    body: |
      Elk jaar sloot bedrijfsleider Van de Bos de boeken af met dezelfde zin: 'behoudens goedkeuring van de directeuren'. Die directeuren waren er al lang niet meer. Ze waren in de oorlog weggevoerd en nooit teruggekeerd, en Van de Bos runde de fabriek door tot ze in de jaren zeventig dichtging. Zo vertelt het gemeentelijke monumentenregister het.

      Wild & Hardebeck waren twee Joodse kooplieden met een adres aan de Nieuwezijds Voorburgwal. In 1921 begonnen ze aan het Boerhaaveplein een fabriek voor gordijnstof; naar verluidt kwamen hun orders van warenhuizen als Metz en De Bijenkorf. Op het drukste moment werkten er zo'n 166 meisjes. Het ontwerp kwam van Carel Tenenti jr. uit Dordrecht, familie van directeur Julius Hardebeck. Hij bouwde een betonskelet en gaf de gevel art-decosieraden van gekleurd beton, gemaakt met een techniek waarop in 1918 octrooi was verleend. Binnen zaten werkplaatsen, een kantoor en een woning voor de opzichter. In 1927 ging de firma failliet, waarna ze verderging als N.V. Hardebeck's Gordijnenfabriek.

      Na de sluiting wilde iemand er in 1978 een cultureel centrum van maken, maar de buurt lag dwars. In 1979 kochten J. Dibbets en F. Becht het pand en lieten het, met zo min mogelijk ingrepen, verbouwen tot woningen en drie ateliers.

      Let op:
      - de sieraden van gekleurd beton in de gevel
      - de schuin afgewerkte aansluiting tussen kolommen en balken, te zien door de grote ramen
    attributes:
      built: 1919–1921
      architect: Carel Tenenti jr.
      original_use: Gordijnenfabriek
    sources:
      - https://data.amsterdam.nl/monumenten/9df60165-31d0-4f76-b84c-6f6a9bd63eae
      - https://amsterdamopdekaart.nl/1850-1940/Boerhaaveplein/4-6

- title: Talmud Tora school
  summary: "The Talmud Tora school of the main Ashkenazi synagogue, opened in 1924, with its name still in Hebrew brick letters on the facade and a tile tableau honouring Queen Wilhelmina's silver jubilee in the hall."
  body: |
    The Talmud Tora school, one of the oldest forms of Jewish education, taught ordinary primary and ULO subjects alongside basic knowledge of Judaism. It began in 1822 under the synagogue on the Uilenburgerstraat; its building on the Plantage Middenlaan (1882) was for boys only and outdated after forty years. Under the 1920 education law the city paid for this new school by Jacob S. Baars, opened in February 1924 and now also for girls: a gym on the ground floor and three classrooms on each upper floor. The school's name was written twice on the facade, in Hebrew brick letters (still there) and in Latin letters in the railings (gone). A tile tableau in the hall records that the founding year coincided with Queen Wilhelmina's silver jubilee in 1923.

    After the war the Jewish HBS used the building from 1947 to 1950, followed by the public Jozef Israëlsschool and, around 1979, an academy of natural medicine. It was squatted and since about 1982 has been apartments, with the gym shared for cultural use and the playground as a garden.

    Look for:
    - the Hebrew letters in red brick on the facade
    - the decorative brickwork of the chimneys
