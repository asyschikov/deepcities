    architect: C.J. Blaauw and J.H. van der Veen; completed by H.T. Zwiers
    original_use: Office of the Raad van Arbeid
    listed: 2013
  photos:
    - commons:File:Nieuw gebouw Raad van Arbeid Amsterdam, 1951.jpg
    - commons:File:Gebouw Raad van Arbeid Amsterdam, Bestanddeelnr 903-5766.jpg
    - commons:File:2020 Rhijnspoorplein 1 Man en vrouw (Krop).jpg
