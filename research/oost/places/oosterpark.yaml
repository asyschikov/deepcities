  nl:
    title: St. Elisabethgesticht, nu Hotel Arena
    summary: "Een katholiek tehuis voor ongeneeslijk zieke vrouwen en volwassen invalide wezen, in 1889 geopend als uitloper van het Maagdenhuis. In 1982 werd het een sleep-in, nu is het Hotel Arena, met kapel, hoge schoorsteen en een zelfgebouwde Lourdesgrot in de tuin."
    body: |
      In de tuin staat een grot van vijf meter hoog, gemaakt van cement, kippengaas en textiel. Het is een Lourdesgrot, en net als de rest van het complex een rijksmonument.

      Het St. Elisabethgesticht volgde het katholieke Maagdenhuis aan het Spui op. A.C. Bleys ontwierp het in 1886 als tehuis voor volwassen invalide wezen en ongeneeslijk zieke vrouwen van katholieken huize, verpleegd door de Zusters van Liefde uit Tilburg. Er werd maar een deel van het plan gebouwd, dus er was plaats voor 160 mensen in plaats van 268. Wie in de eerste of tweede klasse zat, betaalde en had een eigen kamer; de derde klasse sliep op zaal en deed huishoudelijk werk. In de oorlog kwam de kraamafdeling van het OLVG hierheen, nadat de Duitsers het ziekenhuis hadden ingepikt, tot in 1944 ook het tehuis zelf werd gevorderd.

      In 1971 verkocht de stichting het aan de gemeente, die er een verpleeghuis van maakte en de heilige Elisabeth weghaalde die boven de hoofdingang stond. In 1982 ging het dicht en opende de Sleep-in: een goedkope jongerenslaapplaats, later een centrum voor jongerencultuur met concerten en een club. Nu is het Hotel Arena, met woningen aan de kant van de Mauritskade. Beschermd zijn het hoofdgebouw, de oude pastorie aan de 's-Gravesandestraat, de hekken en muren, de schoorsteen en de grot. De pin staat op het hoofdgebouw.

      Let op:
      - de rijke ingang met Dorische halfzuilen en een gebroken fronton, zonder heilige
      - de schoorsteen ten oosten van de kapel, ongeveer 35 meter hoog, een van de laatste hoge schoorstenen van de stad
      - de Lourdesgrot in de tuin, een follie van cement, kippengaas en textiel, zo'n vijf meter hoog
      - de ijzeren hekken en muren aan de west- en noordkant
    attributes:
      built: 1886–1889
      architect: A.C. Bleys
      original_use: Rooms-katholiek verpleeghuis (gesticht)
