  nl:
    title: Noch Einmal, het reuzenbeen
    summary: "Een bronzen rechterbeen van zes meter, afgesneden ergens in de dij, tussen de Polderweg en het spoor. Henk Visch maakte het rond 2010 voor Ymere; na jaren in Amersfoort zette het in 2018 hier voet aan de grond."
    body: |
      Een reuzenbeen, en toch zegt Henk Visch dat het hoofd van Nefertiti voor een deel zijn inspiratie was.

      Visch heeft dit been in allerlei maten gegoten. De titel, Duits voor 'nog een keer', slaat op zijn gewoonte om telkens een nieuw exemplaar te laten gieten als er een verkocht is. Woningcorporatie Ymere bestelde rond 2010 een reuzenversie, zes meter hoog en ruim duizend kilo. Die was bedoeld voor Haarlem, maar dat ging niet door, en het been bleef jaren staan bij Kunsthal KAdE in Amersfoort, na een tentoonstelling van Visch.

      Toen in 2018 de herinrichting van het terrein van de Oostergasfabriek klaar was, haalde Ymere het naar Amsterdam. In juni werd het in Amersfoort uitgegraven, in augustus hier onthuld, tussen de Polderweg en de spoordijk van de lijn naar Amersfoort. Daarna zette Ymere geen kunst meer in de openbare ruimte. Omdat het been ergens in de dij ophoudt, kan niemand zeggen van wie het is.

      Let op:
      - de gietsporen over het hele brons
      - of je het been ziet stappen of stilstaan: dat verschilt per kijker
    attributes:
      built: ca. 2010 (geplaatst 2018)
      artist: Henk Visch
      original_use: Beeld
    sources:
      - https://nl.wikipedia.org/wiki/Noch_einmal
      - https://stadscuratorium.nl/collectie/noch-einmal/
