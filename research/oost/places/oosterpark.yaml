  nl:
    title: Kantoor van de Amstelbrouwerij
    summary: "Een in 1928-1933 tot stand gekomen voormalig kantoorgebouw van de Amstel Bierbrouwerij, in de stijl van de Delftse School met invloeden van het functionalisme. Het reliëf boven de ingang toont bokken, gerst en hop. Nu in gebruik bij de Hogeschool van Amsterdam."
    body: |
      Brouwerij "De Amstel" stond achter het kantoor en besloeg een groot deel van het terrein tussen Mauritskade en Tweede Boerhaavestraat. De brouwerij was in 1870 opgericht door Charles de Pesters en Johannes van Marwijk Kooy; de brouwerijgebouwen stonden hier toen buiten de stad in het weiland. In 1968 werd het bedrijf overgenomen door concurrent Heineken. De brouwerij, inmiddels omringd door woonwijken waar geklaagd werd over overlast, werd in 1982 gesloten. De meeste bedrijfspanden maakten plaats voor woningen.

      Het kantoorgebouw werd gebouwd naar een ontwerp van de architect F.A. Eschauzier in samenwerking met A.J. Langhout, in staand verband gemetseld in lichtbruine baksteen en met zandstenen accenten. De gevels vallen op door een asymmetrische plaatsing van de vensters. Het reliëf boven de ingang is gemaakt door Gerarda Rueter (1904-1993). Nu is het in gebruik bij de Hogeschool van Amsterdam onder de naam Koetsier-Montaignehuis.

      Aan de Mauritskade 55, waar de kade de noordgrens van het Oosterpark vormt, liet Amstel een paardenstalling, werkplaats en koetsierswoning bouwen voor hun paard en wagens. Een foto uit circa 1915 laat een gebouw zien met drie bouwlagen en de kopse kant naar de kade, met boven de entree de aanduiding "Stalgebouw van de Brouwerij de Amstel". De ontwerper van dat gebouw was Abraham Salm. Het terrein daarvoor werd in later tijden alsnog volgebouwd met loodsen van Amstel. Toen Amstel hier vertrok kwam er de Mauritsgarage en later VanMoof. De achterliggende stalling kreeg via architect Anne Boonstra een nieuw uiterlijk, waarbij de pui een nieuwe vorm kreeg, maar de industriële opzet met gietijzeren kolommen bleef onaangetast. Ook de voerderbakken bleven bewaard. Deze rigoureuze verbouwing zorgde ervoor dat het gebouw geen monument kon worden.

      Let op:
      - het plastiek met afbeeldingen in reliëf van rammen, korenaren en hop
      - de zandstenen cassettes met kleine menselijke figuren in reliëf
      - het ronde en gelede venster boven de toegangspartij
      - de voormalige paardenstalling van Amstel aan de Mauritskade 55, achter de nieuwere hal aan de kade (kantoor, alleen van buiten)
    attributes:
      built: 1928–1933
      architect: F.A. Eschauzier met A.J. Langhout
      original_use: Kantoor van een bierbrouwerij
      artist: Gerarda Rueter (reliëf)
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/526983
      - https://amsterdamopdekaart.nl/1850-1940/Mauritskade/11
      - https://nl.wikipedia.org/wiki/Mauritskade_55_GH

- title: Raad van Arbeid office on the Rhijnspoorplein
  summary: "An office for the social insurance council, designed in 1939, started in 1940 and only finished in 1951 after both architects had died. An eight-storey block with stepped top, and a council chamber still intact inside."
  body: |
    The Raad van Arbeid (labour council) handled social insurance in the Amsterdam region. After years in borrowed rooms, the Ministry of Social Affairs commissioned C.J. Blaauw in 1939 to design a new office on the site of the former Weesperpoort station area. Building started in 1940, but the war intervened, Van der Veen died in 1944 and Blaauw in 1947, and H.T. Zwiers finished it in 1951 almost exactly to the original design. Shops were planned on the ground floor, which explains the arcade on the north side.

    The building has an eight-storey block on the Rhijnspoorplein with a stepped, set-back top floor and a bent four-storey wing along the Mauritskade with a roof terrace over its whole length. Inside, the council chamber and the chairman's room survive. Stone figures decorate the building.

    Look for:
    - the stepped top of the tall block
    - the arcade on the north side, left over from the planned shops
    - the stone figures on the facade
  category: civic
  lat: 52.35998
  lng: 4.910369
  address: Mauritskade 9-10 / Rhijnspoorplein 1
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/9eecf7fd-1b71-4941-b684-faaf94a310b7" }
  attributes:
    rank: Okay
    heritage_status: Municipal monument
    monument_number: "200708"
