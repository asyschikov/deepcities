- title: Flowers by Karel Appel
  summary: "A dark bronze still life by Karel Appel on the station square: a big flower and rough planks lying on a slab over a granite drum. Placed in 2002 near the Dapperstraat, where the CoBrA painter was born in 1921."
  body: |
    Karel Appel (1921–2006), the CoBrA painter, was born in the Dapperstraat, close to here. In 2002 his bronze sculpture *Flowers* (1991) was placed on the Oosterspoorplein to mark his early years in the Dapperbuurt. It is not the bright bouquet you might expect from Appel: on a thick slab over a dark granite drum lie a large, scalloped flower head and a pile of rough planks, all cast in dark bronze, with the grain of the wood still visible. It stands by the station.

    Look for:
    - the wood grain cast into the bronze planks
    - "FLOWERS Karel Appel 1991" cut into the granite drum
