  nl:
    title: Man & Schaap, Zeeburgerdijk
    summary: "In een vijver tussen drie drukke wegen steken een bronzen mannenhoofd en een schapenkop boven het water uit en kijken elkaar strak aan, terwijl uit de ogen van de man water naar het schaap spuit. Merijn Bolink (2003) verwijst naar de oude dijkdoorbraken."
    body: |
      Wie naar de Zuiderzeeweg rijdt of fietst, komt er elke dag langs: een vijvertje in de punt tussen de Flevoparkweg, de Zeeburgerdijk en de Zuiderzeeweg, met twee hoofden erin. Het ene is van een kale man, het andere van een schaap. Ze staan allebei tot hun nek in het water en kijken elkaar recht in de ogen, en uit de ogen van de man spuit een straal water precies op het schaap af.

      Merijn Bolink (1967) had ooit een schetsje gemaakt voor een fontein met de hoofden van een man en een vrouw. Op zoek naar voorbeelden belandde hij in een feestwinkel, waar hij een masker vond dat op Alfred Hitchcock leek, en een schapenkop. Een mens en een dier vond hij spannender: het onvermogen van mens en dier om echt contact te maken is een oud thema van hem. Ze kunnen elkaar aankijken zonder te weten wat er in de ander omgaat. Uiteindelijk werd het niet Hitchcock, maar een vriend met een markant kaal hoofd, die toevallig Schaap heette. Dat moest wel een teken zijn.

      Dat de lichamen onder water zitten, is ook een verwijzing. De oude Zeeburgerdijk brak vroeger keer op keer door, en dan liep de polder erachter onder. Het beeld staat er sinds 2003 en won in 2011 de Amsterdamse Straatkunstprijs, die maar één keer is uitgereikt.

      Let op:
      - de straal uit de ogen van de man, gericht op die van het schaap
      - de oren van het schaap net boven het water
      - het Flevopark en de Hekkepoort een paar minuten lopen naar het zuiden
    sources:
      - https://nl.wikipedia.org/wiki/Man_en_schaap
      - https://geheugenvanoost.amsterdam/page/110758

# ================================================================ Oostelijk Havengebied

- title: De Kus, Azartplein
  summary: "A rust-brown steel sculpture beside the old Havenarbeidsreserve building, which the city's register lists as by an unknown artist. It was made in 1983 by Maarten Loonen, a squatter living in the building, and it outlasted most traces of the squat years."
  body: |
    In the early 1980s the port had left the Oostelijk Havengebied and the area lay quiet and deserted. The building of the Havenarbeidsreserve (1920), the pool of casual dock workers, on what is now the Azartplein, was squatted by a group of artists and urban nomads who turned it into a place to live and work. One of them was Maarten Loonen (1957–2021), a psychotherapist and visual artist. In 1983 he made an abstract sculpture in corten steel, which got the name *De Kus* (The Kiss), and put it in front of the building.

    Squatting on the island was not gentle: in a heavy storm the whole roof of the building blew off. When the KNSM-eiland was rebuilt as a housing district in the early 1990s, the building was converted into flats and most traces of the squat years went. The sculpture stayed where it was, through the cranes and the conversion.

    The city's public art register still lists it as the work of an unknown artist. In September 2026 neighbours told its story and passed the artist's name to the Stadscuratorium, the city's public art curators. The sculpture now stands very close to the wall and needs maintenance.

    It stands on the pavement against the corner of Azartplein 1-47 and can be seen at any time.

    Look for:
    - two rust-brown steel slabs whose pointed tongues slot into each other, held by two crossbars
    - the 1920 Havenarbeidsreserve building behind it, now flats
