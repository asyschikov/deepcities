    summary: "Zo'n 55 drijvende huizen, gebouwd op een werf en over het IJsselmeer hierheen gebracht, liggen aan openbare steigers in plaats van straten. Bijna zo dicht op elkaar als in de Jordaan, en elke voordeur komt uit op het water."
    body: |
      Hier woon je zo dicht op elkaar als in de Jordaan, alleen ligt er tussen je huis en de steiger een strook water.

      Waterbuurt West, ontworpen door Marlies Rohmer en in 2010 opgeleverd, is een uitgesproken stedelijke drijvende wijk op IJburg. Er liggen 75 waterwoningen van drie soorten: 55 drijvende huizen en drie hogere paalwoningen aan vier steigers (Steiger A tot en met D), en 17 dijkwoningen op platforms die vanaf de Haringbuisdijk deels boven het water hangen. Door een sluis in die dijk varen bewoners met hun boot vanaf de voordeur het IJmeer en het Markermeer op, of de stad in.

      De huizen zijn op een werf gebouwd en hierheen gevaren. Elk huis staat op een betonnen bak die half onder water ligt. Dat houdt het zwaartepunt laag, en in die bak liggen de slaapkamers. Daarop staan twee lichte verdiepingen met een houtskelet, bekleed met glas en panelen die op staal lijken: wit aan voor- en achterkant, wit en bruin aan de zijkanten. Twee meerpalen houden elk huis op zijn plek, maar dankzij een schuifconstructie gaat het een paar decimeter mee op en neer met het water. Water, gas en stroom lopen via flexibele leidingen door de steigers. Sommige huizen drijven alleen, andere per twee of drie aan elkaar, zodat er woningen in verschillende prijsklassen konden komen. Met zoveel huizen op een kluitje wordt de dichtheid vergeleken met die van de Jordaan.

      De steigers zijn autovrij en met opzet openbaar, zodat dit geen afgesloten enclave zou worden. Je mag er dus wandelen, maar het blijven iemands huizen. De bewoners parkeren in het lange Kadegebouw aan de IJburglaan, dat ook het verkeerslawaai van het water weghoudt.

      Let op:
      - de drie hoge paalwoningen, bij elke dwarsbrug één
      - de strook water tussen elk huis en zijn steiger
      - de beweegbare dwarsbruggen en de sluis in de Haringbuisdijk
      - de dijkwoningen op palen langs de Haringbuisdijk
    attributes:
      architect: Marlies Rohmer (met Villanova architecten)
    sources:
      - https://arcam.nl/architectuur-gids/waterbuurt-west/
      - https://nl.wikipedia.org/wiki/Steigereiland

- title: Vrijburcht and its fish wall
  summary: "A whole village in one block, built by its own future residents: 56 homes, a theatre, café, crèche, greenhouse and harbour. On the theatre's corner hang 274 aluminium fish, drying like a Zuiderzee catch, and a giant paper boat sits on the quay."
  body: |
    In 2000 a group of future IJburg residents set out to build their own block, without a developer: a collective private commission (CPO). Their architect, Hein de Haan of CASA architecten, was one of them and let the others help design. The housing association De Key acted as a safety net, ready to rent out any homes that did not sell, and commissioned the crèche and a group home for young people with an intellectual disability. Vrijburcht was opened on 21 April 2007: 56 homes, work spaces and studios, a café-restaurant, a theatre, a greenhouse, a guest flat and a sandpit room, all around a shared garden, with its own small harbour on the water. The residents celebrated 20 years in 2026, and the 50-seat theatre, run entirely by volunteers, began its twentieth season that autumn.

    Suzanne Willems made two works for the opening. On the corner wall of the theatre hangs a panel four metres high with 274 fish of anodised aluminium, each reflecting a different colour. Not long ago, she pointed out, fish swam where the building stands; now they hang side by side on dry land, the way Zuiderzee fishermen dried their catch in the sun. Across from it on the quay stands Gevouwen bootje, a folded paper boat three by five metres, made of white-painted metal plate. Up close it teems with little crustaceans, snails, fish, algae and shells, modelled by hand, a reminder that the island was raised from the old Zuiderzee. It also does duty in Pokémon GO.

    Look for:
    - the fish panel on the corner of the theatre, each fish reflecting its own colour
    - the creatures in relief on the paper boat
    - the residents' harbour and the shared inner garden (private)
  category: housing
  lat: 52.361240
  lng: 4.976249
  address: Jan Olphert Vaillantlaan 143 (theatre corner), Steigereiland
