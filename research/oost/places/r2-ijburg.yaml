  nl:
    title: Enneüs Heermabrug
    summary: "De voordeur van IJburg: een witte stalen brug van 230 meter, waarvan de twee grote bogen en de doorhangende middenboog een dubbele golf over het water vormen. Amsterdammers zagen er iets anders in en noemen hem de behabrug."
    body: |
      Twee rondingen naast elkaar, met een dipje ertussen. Je kunt er een dubbele golf in zien, maar Amsterdam zag er iets anders in en noemde dit de behabrug, of Cup IJ. Twee witte bogen van elk 75 meter dragen de hoofdoverspanningen, verbonden door een tegenboog van 30 meter die er als een omgekeerde boog tussen hangt. Met twee aanbruggen van 25 meter kom je op zo'n 230 meter. Het dek hangt aan stangen en is gesplitst in twee delen met een kier ertussen, zodat je tijdens het oversteken het water voelt. De bogen zouden zijn geïnspireerd op de gevels van oude grachtenhuizen, de liggers op het gelede skelet van een krab. In 2002 won de brug de Nationale Staalprijs.

      Het was de eerste brug die voor IJburg werd gebouwd. Hij verbindt het Zeeburgereiland met het Steigereiland, het eerste nieuwe eiland in het IJmeer, en is nog steeds de hoofdingang van de wijk voor auto, fiets en tram. De Britse architect Nicholas Grimshaw won de ontwerpwedstrijd. Het staal ging er in 2000 in, in 2001 ging de brug open en sinds 2005 rijdt de IJtram (lijn 26) eroverheen. De naam komt van Enneüs Heerma (1944-1999), Amsterdams wethouder en later leider van het CDA. Een kleiner zusje van dezelfde architect, brug 2002, brengt de weg verder naar het Haveneiland. In de spits is dit de flessenhals van IJburg.

      De wijk erachter kwam er ondanks een verloren stemming. De gemeenteraad keurde de plannen in 1996 goed; tegenstanders, bang voor de natuur in het IJmeer, dwongen een correctief referendum af. Op 19 maart 1997 stemden zo'n 133.000 Amsterdammers tegen en 93.000 voor, maar voor het afschieten van het besluit waren 155.000 tegenstemmen nodig. Het plan ging door, met natuurcompensatie: in 2002-2005 kwam ten noorden van Durgerdam de Hoeckelingsdam van 1,6 kilometer, die de Kinselbaai beschut voor watervogels. Het opspuiten van land begon in 1999 en in november 2002 trokken de eerste bewoners erin.

      Let op:
      - de tegenboog in het midden, het mooist vanaf de kade aan de IJburglaan of vanaf het water
      - de kier tussen de twee dekken, onder je voeten op het fietspad
      - de hangstangen en de tramdraden onder de bogen
      - zusje brug 2002, verderop aan de IJburglaan
      - vanaf het hoogste punt: de eilanden waar een meerderheid tegen stemde
    attributes:
      architect: Nicholas Grimshaw (Grimshaw)
    sources:
      - https://nl.wikipedia.org/wiki/Enneüs_Heermabrug
      - https://arcam.nl/architectuur-gids/enneus-heermabrug/
      - https://nl.wikipedia.org/wiki/IJburg

# ================================================================ Steigereiland

- title: Waterbuurt West, the floating neighbourhood
  summary: "Some 55 floating houses, built at a shipyard and towed across the IJsselmeer, moored along public jetties instead of streets. Nearly as dense as the Jordaan, and every front door opens on water."
  body: |
    Waterbuurt West, designed by Marlies Rohmer and completed in 2010, is a deliberately urban floating neighbourhood on IJburg. It has 75 water homes of three kinds: 55 floating houses and three taller pile dwellings along four jetties (Steiger A to D), and 17 dike houses on platforms that hang partly over the water from the Haringbuisdijk. A lock in that dike lets residents take their boat from their front door out to the IJmeer and the Markermeer, or into town.

    The houses were built at a dockyard and floated here. Each sits on a concrete tub, half under water, which keeps the centre of gravity low and holds the bedrooms; above it two light timber-framed floors are clad in glass and steel-look panels, white at front and back, white and brown at the sides. Two mooring posts hold each house in place, but a sliding fitting lets it rise and fall with the water by several decimetres; flexible pipes in the jetties carry water, gas and power. Some houses float alone, others in pairs or threes, which made different price classes possible. With so many homes packed in, the density is compared to the Jordaan.

    The jetties are car-free and deliberately public, so that this would not become a gated community; you may walk them, but remember these are people's homes. Residents park in the long Kadegebouw on the IJburglaan, which also shields the water from traffic noise.

    Look for:
    - the three tall pile dwellings, one at each cross-bridge
    - the gap of water between each house and its jetty
    - the movable cross-bridges and the lock in the Haringbuisdijk
    - the dike houses on stilts along the Haringbuisdijk
