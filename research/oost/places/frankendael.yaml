  nl:
    title: Voormalige Banketbakkersvakschool
    summary: "Een kubus uit 1956 met een uitkragende bovenverdieping, neergezet door de Nederlandse banketbakkers om leerlingen op te leiden. In het trappenhuis zit nog een echt fresco van oogst en maaltijd. Sinds 2019 zit er een school voor speciaal voortgezet onderwijs."
    body: |
      Begin jaren zestig zat Renault naast de deur, en iemand die daar werkte weet nog hoe hij hier gebak kocht: heerlijk, prachtig en voor weinig geld. Regelmatig stonden er taarten van leerlingen te kijk.

      De Nederlandse Banketbakkers Vereniging begon haar vakschool in 1924 in de Quellijnstraat. Eerste voorzitter was Willem Berkhoff (1863-1953), banketbakker met winkels in de Leidsestraat en de Eerste Constantijn Huygensstraat, en de school ging De Berkhoff heten. In 1956 verhuisde ze naar dit nieuwe gebouw van W.A. Ulrich en B.J.F. Kamphuis, op de hoek van Wibautstraat en Ringdijk, tussen de losse naoorlogse gebouwen die langs de nieuwe brede straat verrezen.

      Het is een halschool: een vierkant grondplan, lokalen rond een centrale hal met trap, beneden de theorie en op de uitkragende bovenverdieping de praktijkkeukens. Er was een fietsenkelder en aan de straat een etalage. Twee kolommen met blauw mozaïek staan bij de hoofdingang, een witmarmeren steen herinnert aan de oprichting en geelgeglazuurde tegeltjes sieren de borstweringen. In het trappenhuis schilderde Cor Dik een echt fresco van 80 vierkante meter over oogst en maaltijd; het is beschadigd en deels achter schotten verdwenen.

      In 2015 ging de school samen met de Hubertusschool en vertrok naar de Betuwestraat. Na een verbouwing, met een nieuwe vleugel die deels over het oude gebouw hangt, trok er in 2019 een school voor speciaal voortgezet onderwijs in, het Orion College Amstel.

      Let op:
      - de uitkragende bovenverdieping
      - de blauwe mozaïekkolommen bij de ingang aan de Ringdijkkant
      - de marmeren gedenksteen bij de oude etalage
    attributes:
      original_use: Vakschool voor banketbakkers
    sources:
      - https://data.amsterdam.nl/monumenten/1245576c-c429-43dd-901a-4132c71cc7eb
      - https://amsterdamopdekaart.nl/wederopbouw/Wibautstraat/220-222

- title: Dreibholz factory, Kruislaan
  summary: A little symmetrical industrial ensemble of 1914–1915 from just before annexation, with a plastered sawtooth-roofed metalworks between two directors' villas with mansard roofs and oriels.
  body: |
    Before Amsterdam annexed the Watergraafsmeer in 1921, the Kruislaan was already getting houses and small businesses. Here the firm Gebr. Dreibholz & Co. built a metalworking shop with a director's house on either side, to drawings signed by architects Heyn and Jac. S. Baars. The city register calls it a tin factory. The contract was put out to tender in 1915, and in the 1930s the firm Vultex made artificial kapok here.

    The composition is strictly symmetrical. In the middle stands the lower factory hall with sawtooth (shed) roofs whose windows face northeast, plastered at the front so that it stands out from the two brick houses. The houses are taller, with mansard roofs, three-sided oriels with balconies on top, and entrances in the side walls facing the factory. Wooden flower boxes and some original leaded glass survive. The old hall now houses businesses from the creative industry.

    Look for:
    - the sawtooth roofs behind the plastered factory front
    - the oriels with balconies and flower boxes on the two houses
    - the entrances turned towards the factory
  category: industrial
  lat: 52.348346
  lng: 4.941666
  address: Kruislaan 180-184
  links:
