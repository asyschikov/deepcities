    - "Commons, Hans Reicher, Vrede1.jpg (Ceescamel, 10 June 2018, CC BY-SA 4.0); scout pin 52.352096, 4.941418"
  nl:
    title: Flats van Piet Zanstra aan de Radioweg
    summary: "Tien bij elkaar horende portiekflats uit 1953 van Piet Zanstra, in het groen aan weerszijden van de Radioweg, als entree van het naoorlogse Middenmeer. De blokken aan de Edisonstraat hebben betonnen reliëfs, sierlijke ingangen en balkons."
    body: |
      Wie over de Radioweg Middenmeer in rijdt, passeert een erehaag van flats. Dat is geen toeval: Piet Zanstra zette ze daar in 1953 neer om de hoofdas van de wijk te markeren.

      Middenmeer is de naoorlogse uitbreiding van de Watergraafsmeer, symmetrisch aangelegd rond de Radioweg. Zanstra, een van de vooraanstaande Amsterdamse architecten van de wederopbouw, bouwde langs die as twee groepen flats, die tot en met de ramen, deuren en het groen opvallend gaaf zijn gebleven.

      Rond de Avogadrostraat, de Berthelotstraat en de Ohmstraat staan zes identieke blokken in twee groepjes van drie, aan elke kant van de Radioweg één, gebouwd voor Maarsen en Dijkhuis. Het zijn portiekflats met hoge trappenhuizen, stalen ramen en hier en daar een siermotief, in een open verkaveling tussen privé- en openbaar groen. Langs de Edisonstraat staan nog vier blokken, in twee paren, als een scherm aan de zuidoostrand van de wijk. Daar ging Zanstra verder: betonnen sierreliëfs, elegante ingangspartijen, afwisselende balkons met opvallende accenten, en houten ramen.

      Samen tonen ze het naoorlogse ideaal van licht, lucht en groen voor gewone huurders. De speld staat bij de blokken aan de Edisonstraat.

      Let op:
      - de betonnen reliëfs en de omlijstingen van de ingangen aan de Edisonstraat
      - de hoge trappenhuizen
      - de symmetrie van de groepen aan weerszijden van de Radioweg
      - zo'n 330 meter noordelijker, aan het zuideinde van het plantsoen midden op de Radioweg (bij de Johannes van der Waalsstraat), "Vrede" van Hans Reicher (1962): een bronzen naakte vrouw die geknield op een hoge zuil van Zweeds graniet een duif loslaat. Velen hielden het voor een oorlogsmonument, maar dat is het niet; het naakt gaf ophef, grappenmakers schilderden haar soms een beha aan, en in de buurt heette het gewoon "Het Beeld". Het was een van Reichers laatste werken; hij overleed in 1963
    attributes:
      original_use: Portiekflats
    sources:
      - https://data.amsterdam.nl/monumenten/311043a4-a138-4ce3-8402-4ba7e518d1d8
      - https://data.amsterdam.nl/monumenten/890409eb-13a5-45bd-ab52-30b95d04d0b5
      - https://nl.wikipedia.org/wiki/Vrede_(Hans_Reicher)

- title: Galileïplantsoen pond, Apostolic church and housing block
  summary: Where the Molenwetering widens into a pond, a sober 1930 church by Cornelis Kruyswijk and a 1933 housing block close the long view down the Galileïplantsoen and are mirrored in the water.
  body: |
    The Galileïplantsoen is a long green strip with the old polder ditch, the Molenwetering, down the middle. At its northeast end the ditch turns sharply in a pond, and two buildings were placed to close the view. On the corner stands the church of the Apostolisch Genootschap (Apostolic Society) of 1930 by Cornelis Kruyswijk, with the minister's house at Galileïplantsoen 109 and the church itself on the Archimedesweg. The block beside it follows its plain, businesslike character.

    That block (1933) is by B. van den Nieuwen Amstel jr. and has ground-floor and upper flats for the middle class around a U-shaped courtyard. It has a strongly horizontal front on the water, gabled corner bays with three-sided oriels turning into balconies at the top, and round-arched loggias on the short sides, a late echo of Berlage's rationalism. The city register calls the church, block and pond a harmonious ensemble reflected picturesquely in the water. The same architect designed Het Nieuwe Huis on the Roelof Hartplein, flats for single men and women nicknamed "the last chance".

    The pin is on the housing block, seen across the pond.

    Look for:
    - the reflection of the block and the church in the pond
    - the oriels and top balconies of the corner bays
    - the round-arched loggias on the side fronts
