  nl:
    title: Fabriekje Dreibholz, Kruislaan
    summary: "Een klein, symmetrisch fabriekscomplex uit 1914–1915, van vlak voor de annexatie: een gepleisterde metaalwerkplaats met sheddaken tussen twee directeursvilla's met mansardedak en erker."
    body: |
      Drie gebouwen, netjes in spiegelbeeld: in het midden de fabriek, links en rechts een directeurswoning, en de voordeuren van beide huizen kijken naar de werkplaats in plaats van naar de straat.

      Voordat Amsterdam de Watergraafsmeer in 1921 inlijfde, kwamen er aan de Kruislaan al huizen en kleine bedrijven. Hier bouwde de firma Gebr. Dreibholz & Co. een werkplaats voor metaalbewerking met aan elke kant een directeurswoning, naar tekeningen met de handtekeningen van de architecten Heyn en Jac. S. Baars. Het gemeentelijk register spreekt van een blikfabriek. Het werk werd in 1915 aanbesteed, en in de jaren dertig maakte de firma Vultex hier kunstkapok.

      In het midden staat de lagere fabriekshal met sheddaken, waarvan de ramen op het noordoosten liggen. Aan de voorkant is hij gepleisterd, zodat hij afsteekt tegen de twee bakstenen huizen. Die zijn hoger, met mansardedaken, driezijdige erkers met een balkon erop en de ingangen in de zijgevels die naar de fabriek kijken. Houten bloembakken en wat oud glas-in-lood zijn er nog. In de oude hal zitten nu bedrijven uit de creatieve sector.

      Let op:
      - de sheddaken achter de gepleisterde fabrieksgevel
      - de erkers met balkon en bloembakken aan de twee huizen
      - de ingangen die naar de fabriek zijn gedraaid
    attributes:
      original_use: Metaalwerkplaats met twee directeurswoningen
    sources:
      - https://data.amsterdam.nl/monumenten/6c216482-4ec8-4bfa-88ec-3ae56e96316e
      - https://amsterdamopdekaart.nl/1850-1940/Kruislaan/180-184

- title: Watergraafsmeer suburb houses, 1903–1914
  summary: Villas and middle-class houses from when the independent village of Watergraafsmeer planned a garden city for 200,000 people. A brink-like street of twelve varied town houses, a Kromhout villa that sold gravestones, and more.
  body: |
    Around 1900 the first suburban houses went up near the Hogeweg and the Bredeweg. In 1906 the council of the still independent municipality approved an ambitious plan for 200,000 inhabitants, a garden city meant to beat Amsterdam to it. Amsterdam annexed the village anyway in 1921, but these houses survive from those years.

    The Bredeweg, named in June 1900, has a planted strip down the middle that gives it the feel of a village green (brink). Its west side, nos. 6–28, is a row of twelve town houses that P.H. de Waal designed in 1904 as one picturesque whole: brown, yellow and red brick, white plaster accents, glazed bands, Art Nouveau leaded fanlights and tiled porches, some of them late Art Deco from a split into flats around 1930. This ensemble is pinned there. Across the Ringvaart the old Oostergasfabriek makes a striking contrast.

    On the corner of the Middenweg and the Jennerstraat stand two English-style double villas: Jennerstraat 1–3 by H.H. Baanders (1903), white plaster with dark woodwork, and "Oude-Meer" at Middenweg 144–146 by Willem Kromhout (1906), the architect of the American Hotel. After the war the stone carvers "De Naald" of P. Allgauer showed gravestones in its garden, close to the De Nieuwe Ooster cemetery. Wethouder Frankeweg 24–44 (1909, Z.D.J.W. Gulden) is a middle-class row on what was then the Nieuweweg. At Willem Beukelsstraat 32–38, S. Visser's houses of 1913 and 1914 sit behind front gardens right in the view down the Zacharias Jansestraat.

    Look for:
    - Bredeweg 6–28: twelve different fronts and porches, with Art Nouveau glass
    - Middenweg 144–146: the name "Oude-Meer" on the dormer
    - Jennerstraat 1–3: white plaster, dark timber and red glazed tiles
    - Wethouder Frankeweg 24–44: big dormers with timber framing over oriels
    - Willem Beukelsstraat 32–38: the dates 1913 and 1914 and a stepped gable
  category: housing
  lat: 52.355465
  lng: 4.930057
  address: Bredeweg 6-28, Jennerstraat 1-3, Middenweg 144-146, Wethouder Frankeweg 24-44, Willem Beukelsstraat 32-38
  links:
