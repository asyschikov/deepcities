  nl:
    title: Christus Koningkerk (votiefkerk)
    summary: "Midden in de oorlog beloofden Amsterdamse katholieken een kerk te bouwen als de stad honger en verwoesting bespaard bleef. In 1959 losten ze die gelofte in, met een kerk achter een dichte bakstenen muur. Rond 1996 ging hij dicht; nu zitten er een hotel en een theater in."
    body: |
      In 1943 en 1944, onder de Duitse bezetting, deden de katholieken van Amsterdam een gelofte: als de stad gespaard bleef voor hongersnood en vernietiging, kwam er een kerk. In 1945 en 1951 herhaalden ze die belofte, en vanaf 1945 werd er geld ingezameld. De nieuwe parochie Christus Koning nam de kerkarchitect K.P. Tholens in de arm, die de jonge ingenieur Herman van Balen het ontwerp liet maken. Op 4 mei 1957 ging de eerste paal de grond in, op 4 mei 1959 werd de kerk ingewijd.

      Het idee: modern, maar met de rug naar de wereld. Rondom staat een zware bakstenen muur met kantelen erop. De ramen zijn klein in grote wanden, in jaren waarin nieuwe woningen juist grote glaspartijen kregen om het licht binnen te halen. Binnen loopt alles over in één ruimte voor 950 mensen, onder een hoog dak met helder glas in lood, met een sacramentskapel onder een lantaarn en een doopvont in een verzonken vloer. Daartegenover staat in de voorhof de klokkentoren, vrijwel helemaal open: een stenen bok op drie poten, 15 meter hoog. Boven de ingang staat Christus Koning met de woorden "aula regis", gemaakt door J. van Rhijn.

      Rond 1996 was de laatste dienst en ging de parochie op in die van de Hofkerk. De lege kerk stond op de slooplijst, maar werd in 2003 gemeentelijk monument. Vanaf 2020 werd hij verbouwd: in 2024 ging Chassé Hotel Residency open, en in november 2025 volgde het Balkissoon Theater in het vroegere schip.

      Let op:
      - de bakstenen ommuring met kantelen
      - de open klokkentoren op drie poten
      - Christus Koning boven de ingang
    attributes:
      original_use: Rooms-katholieke votiefkerk
    sources:
      - https://data.amsterdam.nl/monumenten/5ec704ef-ef17-450e-aeb2-687472678668
      - https://nl.wikipedia.org/wiki/James_Wattstraat_56-58_(Amsterdam)
      - https://oost-online.nl/nieuw-leven-in-voormalige-kerk-het-balkissoon-theater-opent-in-de-james-wattstraat/

- title: Oude Kerk van Watergraafsmeer
  summary: A small neo-Renaissance church of 1899 by Tjeerd Kuipers, who built more than fifty Reformed churches. It has been a church, a shop and a furniture store, and has been a Kingdom Hall of Jehovah's Witnesses since 1975.
  body: |
    The Reformed (gereformeerde) congregation of the still independent village of Watergraafsmeer built this T-shaped church with a sexton's house in 1899, on the corner of the Simon Stevinstraat and the Wakkerstraat. The architect, Tjeerd Kuipers, came from a Frisian contractor family and designed more than fifty Reformed churches across the country, many of them in neo-Renaissance, the style favoured by Abraham Kuyper, leader of the Reformed, who rejected neo-Gothic.

    The church is dark red brick with stone around the openings, buttresses and crenellated stepped gables, with triple lancet windows over the main door. From 1910 to 1939 it served the Dutch Reformed congregation, and for a while it also held a shop. It was sold at auction in 1962 and briefly became a furniture shop. Since 1975 it has been a Kingdom Hall of Jehovah's Witnesses. Homes were built inside on gallery level, and the old timber roof is now mostly hidden.

    Look for:
    - the crenellated gables on both street fronts
    - the round-arched main door with a stone relieving arch
    - the low sexton's wing with its brick balustrade
