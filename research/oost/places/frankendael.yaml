  nl:
    title: Frankendael
    summary: "De laatste van zo'n veertig buitenplaatsen die ooit de Watergraafsmeer vulden. Een huis van rond 1700, een marmeren fontein uit 1714 met Neptunus en Amphitrite, een houten poort uit 1783 en een nepruïne op een eilandje."
    body: |
      Van ruim veertig buitenplaatsen staat er nog één. Nadat de Diemermeer in 1629 was drooggemalen, bezaaiden rijke Amsterdammers de nieuwe polder met boerderijen, lusthoven en buitenhuizen. Alleen Frankendael, op de hoek van de Middenweg en de oude Grote Tochtsloot, heeft het gehaald. In 1695 kocht Isaac Balde hier een hofstede van rond 1660 en liet het huidige huis bouwen: een villa van rode baksteen met lage vleugels, waarin vroeger de koetshuizen zaten. Over het bouwjaar zijn de bronnen het niet eens (van 1695 tot 1733).

      In de achttiende eeuw bracht de familie Gildemeester hier de zomers door. Hun wapen, een geharnaste arm die een bot vasthoudt, is uitgesneden in de dakbalustrade en op de achterkant van de houten poort uit 1783, die aan Jacob Otten Husly wordt toegeschreven. In 1770 kwam er een marmeren fontein bij, gehaald van buitenplaats Driemond bij Weesp: Neptunus en Amphitrite liggen aan weerszijden van Arion, die op een dolfijn rijdt. Ignatius van Logteren signeerde hem en zette er 1714 bij. Bacchus en Ceres bewaken het voorplein, koning David staat achter het huis, en in de westhoek van het park ligt bij een vijver een bakstenen hermitage, begin negentiende eeuw als ruïne gebouwd.

      De gemeente kocht de grond in 1882; vanaf 1930 zaten hier de stadskwekerij en een tuinbouwschool. Toen de kwekerij in 1998 sloot, wilde de stad er woningen bouwen. Aannemer Elgar Vos voerde actie, en het werd een openbaar park van 18 hectare. Architect Ben Merkelbach was al in 1957 in het vervallen huis getrokken en had het opgeknapt. Nu worden er evenementen en tentoonstellingen gehouden, en in een koetshuis zit een restaurant dat naar hem heet.

      Let op:
      - de poort op zijn bakstenen dam, met ‘FRANKENDAEL’, Mercurius en het wapen van de Gildemeesters
      - Arion op zijn dolfijn in het schelpvormige bekken, recht tegenover de voordeur
      - het Gildemeester-wapen op de dakbalustrade
      - de hermitage bij de vijver in het westen van het park
      - de herstelde formele tuin achter het huis
    attributes:
      built: rond 1700; fontein 1714, poort 1783
      original_use: Buitenplaats met tuin- en parkaanleg
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/422420
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/422421
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/422422
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/422423
      - https://nl.wikipedia.org/wiki/Frankendael

- title: Tuindorp Frankendael (Jeruzalem)
  summary: Small white houses with flat roofs, built 1950–1954 as "temporary" duplexes during the housing shortage. They reminded people of Jerusalem, and in 2010 this became the first post-war neighbourhood listed as a national monument.
  body: |
    Locals call it Jeruzalem: the near-white concrete panels and flat roofs made the low blocks look a little like Jerusalem. The original name is Tuindorp Frankendael. It was an experiment. Merkelbach & Karsten (later Merkelbach & Elling) and Mart Stam worked with the city planners under Cornelis van Eesteren on a new layout: pairs of L-shaped blocks around a shared court, an answer both to the closed 19th-century block and to rigid rows.

    Because of the post-war housing shortage, almost 400 family houses were built as duplexes, a ground-floor flat and an upper flat that could later be joined into one house. It was a first in the Netherlands. The blocks went up in a concrete system much like the British Airey system, with a grid of concrete posts. Mien Ruys designed the courts, with diagonal paths, a play corner and a quiet seat in each, and Aldo van Eyck the playgrounds with rounded concrete sandpits and climbing frames. In the middle stands the H-shaped Prof. Zeemanschool by J. Leupen (1952–1953), built semi-permanent because the ministry still banned permanent schools; its H-shape lets daylight into every classroom from two sides.

    The ideas tested here were scaled up in the Westelijke Tuinsteden. After years of plans and delays, blocks G and H were demolished, and in 2017 housing corporation Rochdale finished renovating 193 homes. The duplexes were rarely joined. The pin is on the court of the Bakhuys Roozeboomstraat, the best preserved of Ruys's gardens.

    Look for:
    - the concrete grid and flat roofs of the L-shaped blocks
    - the courts at Bakhuys Roozeboomstraat, F.C. Dondersstraat and Daltonstraat
    - remains of Van Eyck's playgrounds (Dondersstraat and Daltonstraat are best kept)
    - the Prof. Zeemanschool on the Lorentzlaan
