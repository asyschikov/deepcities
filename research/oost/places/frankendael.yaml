    - { label: Monumentenregister Amsterdam (Middenweg 144), url: "https://data.amsterdam.nl/monumenten/6f00f167-7dae-40f3-82e7-e519ca2a34ee" }
    - { label: Monumentenregister Amsterdam (Jennerstraat), url: "https://data.amsterdam.nl/monumenten/523ad0ab-4df9-4dea-997e-78c05476a8f3" }
