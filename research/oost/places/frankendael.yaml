    - commons:File:2020 Emmakerk.jpg
  sources:
    - rce:506280 (register description)
    - city:200749 (register text, demolition plan in the 1990s)
    - https://nl.wikipedia.org/wiki/Emmakerk_(Amsterdam)
  nl:
    title: Emmakerk
    summary: "Een hervormde kerk uit 1937-1939 die eruitziet als een katholieke basiliek, met een toren van 35 meter naast Park Frankendael. De architect bouwde de getallen 3, 7 en 12 in het gebouw in."
    body: |
      Een protestantse kerk in katholieke vorm: wat het rijksmonumentenregister het meest opvalt aan de Emmakerk is dat een hervormde gemeente koos voor de vorm van een basiliek, met een hoog middenschip en lage zijbeuken. Die vorm zie je vooral bij katholieke kerken.

      Lang moesten de Watergraafsmeerders over slechte wegen naar Amsterdam of Diemen om naar de kerk te gaan. In 1907 lagen er al plannen voor een eigen hervormde kerk, maar pas vanaf 1935 kwam het geld bij elkaar. Gijsbert Friedhoff ontwierp het gebouw; op 18 februari 1939 werd het ingewijd en vernoemd naar koningin Emma.

      De kerk is sober, van geelgrijze baksteen en beton, een mengvorm van traditioneel, Scandinavisch en modern bouwen. Klokkentoren en pastorie staan niet op de as van de kerk maar schuiven op naar de straat, zodat de toren de hoek van Middenweg en Hugo de Vrieslaan markeert. Een smalle gracht houdt de kerk gescheiden van het park. Friedhoff speelde met 'heilige' getallen: drie portalen, zeven traveeën, twaalf pilaren.

      In de jaren negentig wilde men de kerk afbreken en er iets kleins voor in de plaats zetten. De aanwijzing tot rijksmonument maakte daar een eind aan en het gebouw werd gerestaureerd. Binnen kwam een glazen wand van tien meter hoog van Jan Beutener, ook weer verdeeld in drie bij zeven. Sinds twee gemeenten in 1999 fuseerden, heet het geheel kerkelijk centrum De Bron.

      Let op:
      - de drie portalen aan de Middenweg, met hardstenen hoekblokken, boven aan de trap
      - de twee verweerde gedenkstenen naast de middelste deur
      - de toren, buiten de as op de hoek
      - het fonteintje met een zwerfkei voor de kerk
    attributes:
      original_use: Hervormde kerk met klokkentoren en pastorie
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/506280
      - https://nl.wikipedia.org/wiki/Emmakerk_(Amsterdam)
      - https://data.amsterdam.nl/monumenten/b2fb84f0-88bc-4e03-92af-b554e4154300

- title: Koningskerk
  summary: A 1950s brick box with a freestanding tower, whose side walls are huge glass-in-concrete windows by Berend Hendriks, among the first in the Netherlands. Christ on horseback fights a seven-headed dragon.
  body: |
    The Reformed church of the Watergraafsmeer laid the first stone of this second church on 5 March 1955 and took it into use on 21 March 1956. The architects, Wouter van de Kuilen and Cornelis Trappenburg, mostly worked around Hilversum. Their design is a plain box of light-brown brick with a grid of concrete panels, a low wing with parsonage, sexton's house and youth hall, and a tall tower standing on its own in the green.

    The art is the reason to come. Berend Hendriks filled the concrete grid with glass-in-concrete (dalle de verre), one of the first large examples in the country: thick chunks of coloured glass set in concrete, which make the light inside uneven and rich. One wall shows a rider attacking a seven-headed dragon, Christ the King of Kings against Satan; another an angel with a scroll. On the blind gable on the Glauberweg hangs Hendriks's concrete griffin, another image of Christ's kingship. Some say the outside looks like a crossword puzzle.

    In 1994 the church was sold to the Evangelische Broedergemeente (Moravian Church), whose congregation is largely Surinamese; it reopened in September 1995.

    Look for:
    - the glass-in-concrete walls (best seen lit from inside at dusk)
    - the griffin on the blind Glauberweg gable
    - the freestanding tower on the Van 't Hofflaan
  category: religious
  lat: 52.348441
  lng: 4.935766
  address: Van 't Hofflaan 18-20, Ostwaldstraat 1-5, Pasteurstraat 40
