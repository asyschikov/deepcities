  nl:
    title: Voormalige school aan de Newtonstraat ("Arbeid overwint")
    summary: "Een dorps ogende school uit 1930 van Cornelis Kruyswijk, met een steile kap van blauwe pannen en eigenaardige baksteenreliëfs: flamingo's bij het motto \"arbeid overwint\", een peinzend masker en kinderen voor een woeste zee."
    body: |
      Drie flamingo's bewaken de ingang, onder de woorden "arbeid overwint 1929". Het is niet de enige verrassing in de gevel van deze lagere school.

      Nadat de grondwet van 1917 bijzonder en openbaar onderwijs gelijk had getrokken, kwamen er in Amsterdam in de jaren twintig veel nieuwe scholen voor bijzonder onderwijs bij. Cornelis Kruyswijk tekende er in tien jaar alleen in deze stad al twaalf voor het christelijk onderwijs. Deze, uit 1930, bouwde hij voor de Watergraafsmeerse Schoolvereniging. Het is een gangschool: de lokalen kijken op het zuiden uit over de speelplaats, terwijl gangen, kapstoknissen en wc's achter de straatgevel zitten. Daarom zijn de ramen aan de straat kleiner. Kruyswijk liet de daklijn verspringen, zodat je de plattegrond van buiten kunt aflezen, met een steil hoofddak van blauwe pannen en vier schoorstenen.

      Maar de reliëfs zijn het mooiste. Bij de ingang loopt een band met "arbeid overwint 1929" naast drie uitheemse vogels die op flamingo's lijken, omlijst door vliegende vogels. Ernaast zit een tweede reliëf met een opvallende maskerkop en twee kleine peinzende figuurtjes. Op de hoek met de Newtonstraat staat een vierkant reliëf van een volwassene en drie kinderen voor een woelige zee met drie zeilboten. In 2002 werd het gebouw opgeknapt; nu zit er naschoolse opvang in. Van Kruyswijk is ook de kerk van het Apostolisch Genootschap aan het Galileïplantsoen.

      Let op:
      - het reliëf "arbeid overwint 1929" met de flamingo's bij de ingang
      - het maskerreliëf ernaast
      - het reliëf met zee en zeilboten op de hoek
    attributes:
      original_use: Christelijke lagere school
    sources:
      - https://data.amsterdam.nl/monumenten/a0d21919-4225-44e7-b738-51e2bb617ede

- title: Pieter Nieuwland College
  summary: A late-1950s concrete-frame school whose classroom wing ends in a full-width brick mosaic by Berend Hendriks, "Jacob wrestling with the angel". The gym wing floats on columns over the bike shed.
  body: |
    J.H. van der Zee designed this Protestant HBS (grammar school), built 1958–1960; it is now an interconfessional havo/vwo school with about 700 pupils. It is a hall-and-corridor school: three wings of three storeys around a central hall, with white concrete columns showing in the fronts like pilasters and cream tiles under the windows. The wing with two gyms on the James Wattstraat stands on columns, with the ground floor left open as a bike shed, and a covered bridge on four columns forms a kind of gate.

    Post-war schools were meant to bring young people into contact with modern art, and this one got a monumental brick mosaic: across the whole end wall of the classroom wing Berend Hendriks laid out Jacob wrestling with the angel at the ford of the Jabbok, in bricks of different firing colours. Hendriks made many such brick mosaics from 1952 on; he also made a concrete sculpture and glass-in-concrete for the Christus Koningkerk on the Ostwaldstraat.

    Look for:
    - the brick mosaic on the end of the classroom wing
    - the gym wing on columns over the bike shed
    - the white concrete frame in the fronts
  category: schools
  lat: 52.35004
  lng: 4.924096
  address: Nobelweg 4-6
  links:
    - { label: Monumentenregister Amsterdam, url: "https://data.amsterdam.nl/monumenten/7acde12e-f640-42da-a33c-b6608df8b64e" }
