  nl:
    title: Sloterkade 142–144, de dijkhuisjes, en het hoekblok uit 1941
    summary: "Twee piepkleine huizen uit 1882 en omstreeks 1900 met een steeg ertussen, nog op de hoogte van de oude dijk en een stukje lager dan de stoep van nu. Ernaast: een gebogen blok etagewoningen van rode baksteen, klaar in het oorlogsjaar 1941."
    body: |
      Voordat Amsterdam hier kwam, was de Sloterkade een weg op een dijk langs de Schinkel, met kleine huizen die door "gangen" van elkaar gescheiden waren. Daarachter lagen nog meer steegjes, met namen als Vlooiengang, Prutgang, Melkgang en Tolgang; van 1818 tot 1923 stond er een tolhek op de kade. In 1927 kwam er een nieuwe brug over de Schinkel, die de wijk met de oude stad verbond. Daarvoor werden de kades opgehoogd en ging het grootste deel van de oude huizen tegen de vlakte, en vanaf de jaren vijftig namen grote woon- en kantoorgebouwen de rest in.

      Deze twee bleven staan. Nr. 142, van omstreeks 1900, is een dubbel huis met de twee voordeuren in de zijgevel, aan de steeg. Nrs. 143–144, twee gespiegelde woningen onder één dak, zijn van 1882. De begane grond ligt op de oude hoogte van de dijk, die sindsdien een paar decimeter is opgehoogd; de tuinen erachter liggen nog ruim een meter lager. In 1982 was de achterkant van nr. 142 onbewoonbaar, en bij een verbouwing in 1982–1984 is het huis gered.

      De buurman op de hoek van de Hoofddorpweg kan haast niet meer verschillen. Zanstra, Giesen en Sijmons, het jonge bureau dat naam had gemaakt met de atelierwoningen aan de Zomerdijkstraat, bouwden hem in 1941. Ze hoorden bij Groep '32, architecten die modern wilden bouwen met ruimte voor schoonheid: vandaar de holle ronding van de hoek, de rode baksteen en de ramen met ronde zijkanten.

      Het zijn allemaal woningen, te zien vanaf de kade.

      Let op:
      - de steeg tussen 142 en 143, afgesloten met een hek van siersmeedwerk
      - hoe laag de voordeuren liggen ten opzichte van de stoep en de nieuwere panden
      - diamantkoppen en siermetselwerk in de bogen boven de ramen
      - nrs. 143–144: witte verf van omstreeks 1960 over de baksteen
      - het hoekblok: de holle ronding, de inpandige balkons en de hoge open portieken
    attributes:
      built: 1882 en omstreeks 1900 (huisjes); 1941 (etagewoningen)
      architect: Zanstra, Giesen en Sijmons (etagewoningen)
      original_use: Woonhuizen; etagewoningen boven winkels
    sources:
      - Redengevende omschrijving gemeentelijke monumenten 222098 en 222024
      - https://nl.wikipedia.org/wiki/Sloterkade
      - https://amsterdamopdekaart.nl/1850-1940/Sloterkade/143-144

- title: Patrimonium's first block, Vlietstraat
  summary: "219 workers' homes of 1912–1914 for the Reformed housing association Patrimonium, dressed as old Amsterdam: gables on the corners, gable stones and a little turret, while other associations were building in the sober modern manner."
  body: |
    The Schinkelbuurt went up around 1900 as cheap speculative housing on a triangle of land between the Amstelveenseweg and the Schinkel, with street names taken from shipping: Vaart, Vliet, Zeil, Haven. In its middle stands something more careful: a whole city block built in 1912–1914 for Patrimonium, the housing association of the Reformed (orthodox Protestant) workers' movement. Amsterdam op de kaart, the city's building history site, calls it the association's first block.

    The architects were Tjeerd Kuipers, known across the country for his Reformed churches, and A. Ingwersen. According to the city register it was their first project under the Housing Act of 1901, which let associations build with state loans. They gave it the look of the old Dutch town: top gables, round medallion windows, door frames with a hint of the Renaissance and gable stones like those in the city centre. Among the rationalist and Amsterdam School housing of those years, the register notes, that makes it a rarity.

    Each of the 219 homes had a living room, a kitchen, a toilet and two to five other rooms, laid out for large families. There was no bathroom: people washed in the kitchen. Sheds stood in a leafy garden inside the block. Patrimonium had its office at Vlietstraat 4, and a grocery tied to the association had the corner shop. The windows were replaced in a later renovation, and the shutters painted with hourglass shapes are gone.

    The homes are private. Walk around the block.

    Look for:
    - corner of Vaartstraat and Baarsstraat: the slanted corner with a small turret on the roof
    - the tile panel there with the words "Woningstichting Patrimonium"
    - gable stones with different pictures along the fronts
    - door frames with pilasters in the Vlietstraat
    - the front on the Schinkelkade, seen best from across the water
