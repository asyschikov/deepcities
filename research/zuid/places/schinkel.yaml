  nl:
    title: Het eerste blok van Patrimonium, Vlietstraat
    summary: "219 arbeiderswoningen uit 1912–1914 voor de gereformeerde woningbouwvereniging Patrimonium, verkleed als oud Amsterdam: topgevels op de hoeken, gevelstenen en een torentje, terwijl andere verenigingen strak en modern bouwden."
    body: |
      De Schinkelbuurt kwam rond 1900 tot stand als goedkope revolutiebouw op een driehoek tussen de Amstelveenseweg en de Schinkel, met straatnamen uit de scheepvaart: Vaart, Vliet, Zeil, Haven. Middenin staat iets wat met meer zorg is gemaakt: een heel bouwblok uit 1912–1914 voor Patrimonium, de woningbouwvereniging van de gereformeerde arbeidersbeweging. Amsterdam op de kaart, de site over de bouwgeschiedenis van de stad, noemt het het eerste blok van de vereniging.

      De architecten waren Tjeerd Kuipers, in het hele land bekend van zijn gereformeerde kerken, en A. Ingwersen. Volgens het gemeentelijke register was dit hun eerste project onder de Woningwet van 1901, die verenigingen met rijksleningen liet bouwen. Ze gaven het de aanblik van de oude Hollandse stad: topgevels, ronde medaillonvensters, deuromlijstingen met een vleugje renaissance en gevelstenen zoals in de binnenstad. Tussen de rationalistische en Amsterdamse Schoolwoningbouw van die jaren is dat een zeldzaamheid, merkt het register op.

      Elk van de 219 woningen had een woonkamer, een keuken, een wc en twee tot vijf andere kamers, ingedeeld voor grote gezinnen. Een badkamer was er niet: men waste zich in de keuken. In een lommerrijke tuin binnen het blok stonden schuurtjes. Patrimonium had zijn kantoor op Vlietstraat 4, en in de hoekwinkel zat een kruidenier die bij de vereniging hoorde. Bij een latere renovatie zijn de ramen vervangen, en de luiken met geschilderde zandlopers zijn verdwenen.

      Het zijn woningen. Loop een rondje om het blok.

      Let op:
      - hoek Vaartstraat en Baarsstraat: de schuine hoek met een torentje op het dak
      - het tegeltableau daar met de woorden "Woningstichting Patrimonium"
      - gevelstenen met verschillende voorstellingen langs de gevels
      - deuromlijstingen met pilasters in de Vlietstraat
      - de gevel aan de Schinkelkade, het best te zien vanaf de overkant van het water
    attributes:
      architect: Tj. Kuipers en A. Ingwersen
      original_use: Sociale woningbouw
      check_note: De speld staat op de hoek met het torentje, bepaald via het adres Baarsstraat 50; controleer of dat de hoek met de Vaartstraat is.
    sources:
      - Redengevende omschrijving gemeentelijk monument 222106
      - https://amsterdamopdekaart.nl/1850-1940/Vlietstraat/2-168
      - https://nl.wikipedia.org/wiki/Schinkelbuurt

- title: Hillegomschool, the school without corridors
  summary: "A double primary school of 1952–1954 where you walked through one classroom to reach the next: no corridors, windows on two sides of every room, and children working in small groups in the corners."
  body: |
    After the war Amsterdam was short of schools and set up a committee of architects, school inspectors, educationalists and a hygienist to work out what the ideal school looked like. Its answers: light and air from two sides, room for exercise, double schools of at least twelve classrooms, and schools spread through the city instead of clustered. In the new suburbs that produced free-standing buildings in the green. Here, in a district that was already full, the city's own architects G.H. Kleinhout and A.J. van der Steur had to squeeze the idea into a gap between blocks of flats.

    Their answer was a "doorloopschool", a walk-through school. There are no corridors: stairwells serve pairs of classrooms, which open into each other, and every room has windows front and back. A gymnasium of its own stands in the yard behind, between two playgrounds meant for lessons outdoors. Teaching followed the ideas of the reformer Leendert Groeneweg (1877–1950): children worked on their own in small groups in the corners of the room. The first part was handed over on 5 January 1954. In June 1955 the newspaper De Waarheid counted 735 pupils in 17 classes and called it one of the finest schools in Amsterdam.

    Corridors were later cut out of the classrooms in the left half after all. The building is still used for teaching and childcare and is not open. The long front faces a small public garden.

    Look for:
    - the three-storey front in which brick alternates with panels of concrete
    - the passage through the right half, the only way in, leading to the playgrounds
    - the long regular rows of classroom windows
    - the saddle roof, a traditional hat on a modern plan
    - the width of the street here, widened so that the front can be seen from the garden opposite
