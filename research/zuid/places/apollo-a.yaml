  nl:
    title: Sint Ignatiusgymnasium, op de plek van de Zentralstelle
    summary: Een school uit de jaren vijftig met betonnen bogen over het dak, op de plek waar het bureau dat de deportatie van de Nederlandse Joden regelde in een gevorderde school zat. Het oude gebouw ging verloren bij het bombardement van november 1944.
    body: |
      De betonnen bogen die over het dak van deze school springen, houden een voormalige gymzaal vast, geïnspireerd op het werk van Le Corbusier. Dat hier een naoorlogse school staat, komt doordat de vorige is gebombardeerd.

      De christelijke hbs die hier stond, werd door de bezetter gevorderd. Er kwam de Zentralstelle für jüdische Auswanderung in, het bureau van Ferdinand aus der Fünten dat de deportatie van de Nederlandse Joden organiseerde. Tot de zomer van 1942, toen de Hollandsche Schouwburg die rol overnam, werden Joden na razzia's naar dit gebouw gebracht en met de tram doorgestuurd naar het Centraal Station en Westerbork. Op 26 november 1944 mikten Britse Typhoons op het hoofdkwartier van de SD aan de overkant van het plein, maar raakten dit gebouw. Het gebouw werd verwoest en meer dan vijftig omwonenden kwamen om.

      De nieuwe school uit 1954-1956 kwam van het bureau van De Geus en Van der Bom en is vrijwel zeker getekend door de jonge Ben Ingwersen. Eronder ligt een commandopost van de Bescherming Bevolking uit de Koude Oorlog: een bunker uit 1955 onder de gymzaal en een tweede uit 1972, met ontsmettingsdouches, onder het schoolplein, bedoeld voor ongeveer honderd mensen in drie ploegen. Later lagen er de brandbare films van het Filmmuseum, nu staan er fietsen. Het Ignatius, in 1895 door de jezuïeten opgericht, zit hier sinds 2000. Het is een school in bedrijf; binnen kijken kan niet.

      Let op:
      - de bogen op het dak, het best te zien vanaf het Adama van Scheltemaplein
      - het kalkstenen reliëf met vier verstrengelde figuren van Aart Rietbroek (1957), een oorlogsmonument op de blinde muur aan de Rubensstraat
      - de rij van 65 betonnen tegels in de stoep van het plein, het Monument voor Gedeporteerde Joden (2007)
      - de zwarte zuil met biddende handen voor dichter Adama van Scheltema (1933), ernaast
      - het glaskunstwerk van Jakob die met de engel worstelt, van Joop van den Broek, sinds 2024 bij de ingang
      - het bronzen beeld van een man in een vis op het schoolplein aan de Rubensstraat: niemand weet wie het gemaakt heeft
      - verder naar het oosten in dezelfde straat, bij Jan van Eijckstraat 16: de plaquette uit 2023 voor het informatiebureau dat Alfred Wiener daar oprichtte, gebouwd op zijn archief over de nazi's; het verbindingskantoor van de Joodse Raad met de Zentralstelle, de Expositur, zat op nr. 15 (een eigen plek)
    attributes:
      architect: J.B. Ingwersen (bureau De Geus en Van der Bom)
      original_use: Christelijke hbs
    sources:
