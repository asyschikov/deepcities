    - { label: Rijksmonumentenregister (527836), url: "https://monumentenregister.cultureelerfgoed.nl/monumenten/527836" }
    - { label: Amsterdam op de kaart (21 to 23), url: "https://amsterdamopdekaart.nl/1850-1940/Albert_Hahnplantsoen/21-23" }
    - { label: Amsterdam op de kaart (25 to 27), url: "https://amsterdamopdekaart.nl/1850-1940/Albert_Hahnplantsoen/25-27" }
