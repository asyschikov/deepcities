  nl:
    title: Drive-inwoningen, Anthonie van Dijckstraat
    summary: "De eerste Nederlandse huizen die om de auto heen zijn gebouwd: vijf witte herenhuizen uit 1937 van Mart Stam, Lotte Stam-Beese en Willem van Tijen, met de garage in huis, een boodschappenkastje dat via de deurtelefoon opengaat en een bloemenvenster."
    body: |
      Dit zijn de eerste huizen in Nederland die om de auto heen zijn bedacht: vijf witte herenhuizen uit 1937 met beneden alleen een garage en een voordeur. Wonen begint een trap hoger. Het duurde tientallen jaren voor iemand in Nederland het idee overnam.

      Mart Stam was hier zijn eigen opdrachtgever, als directeur van bouwmaatschappij Wimbe II. Hij ontwierp het rijtje met zijn vrouw Lotte Stam-Beese en Willem van Tijen; een paar jaar eerder hadden ze samen de Montessorischool op de hoek ontworpen. De huizen kregen alle snufjes van die tijd: vuilstortkokers, garagedeuren die onder het plafond wegschuiven, oprolbare zonneschermen, opklapbare wastafels en een voordeur die met de deurtelefoon openging. Naast de deur zat een boodschappenkastje dat op dezelfde manier openging, zodat leveranciers bestellingen kwijt konden zonder dat iemand naar beneden hoefde. De woonkamer had een 'bloemenvenster' met een brede vensterbank van terrazzo, naast een hoek van het balkon die voor planten was bedoeld. Hugh Maaskant, die bij Van Tijen werkte, prees de woningen in het blad van de modernen als 'doelmatig, licht, ruim, zonnig en blij'. Tegelijk werd de straat hier verbreed tot een pleintje met een grasveld.

      De huizen zijn particulier bewoond en alleen vanaf de straat te zien.

      Let op:
      - de witte geglazuurde baksteen, in een buurt van bruine steen
      - de teruggelegde begane grond, met garagedeur en portiek naast elkaar
      - de balkons van zes meter met stalen hekken op de eerste verdieping
      - het dak dat naar voren steekt als luifel boven de terrassen van de bovenste verdieping, met matglazen schotten ertussen
      - de bloembakken bij de voordeuren
    attributes:
      architect: Mart Stam, Lotte Stam-Beese en Willem van Tijen
      original_use: Vijf herenhuizen met inpandige garage
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/527831
      - https://amsterdamopdekaart.nl/1850-1940/Anthonie_van_Dijckstraat/4-12
      - https://nl.wikipedia.org/wiki/Anthonie_van_Dijckstraat_4-12

- title: Hagedoornschool, a school run as a company
  summary: This primary school of 1931 belonged to a limited company with shareholders and charged fees to match. It had no corridors, and it did not survive the occupation. A French international school uses the building now.
  body: |
    This primary school of 1931 was a business. The N.V. Schoolvereeniging Hagedoorn, a merger of the two oldest private-school societies in Amsterdam, was a limited company that issued shares, and parents paid high fees to keep the shareholders content. It built here for the children of the well-off families who had just moved into the Apollobuurt.

    The plan came from Pierre Cuypers, grandson of the architect of the Rijksmuseum, who brought in A.J. Westerman for the fronts. The building is a horseshoe around a playground open to the south, and it had no corridors: every classroom runs the full depth of its wing, with large windows on both sides, and pupils walked through other rooms to reach their own. A newspaper of the day set it beside Duiker's Open Air School as a model for the future, and thought the heating revolutionary.

    The school could not fill the building. By 1940 part was let to another school, which got its own door on the Albrecht Dürerstraat. During the occupation the Hagedoornschool closed, probably because its Jewish pupils had disappeared. The Montessori Lyceum took over, followed by the Ignatius Gymnasium (1979–2000) and the British School (1983–2021). A French international school is here now.

    Look for:
    - the pale yellow-brown brick over a darker plinth, light against the dark brick of the streets around
    - the heavy straight cornice that runs all the way round
    - the concrete canopy over the main entrance
    - the round-arched doorway on the Albrecht Dürerstraat, formerly no. 38
    - the bay with a balcony above it on the Quinten Massijsstraat side
  category: schools
  lat: 52.348042
  lng: 4.875756
