- title: Teekenschool and the Rijksmuseum director's villa
  summary: "Behind the Rijksmuseum stand its drawing school and the house where three directors lived. Under the school the Ministry of War had cellars built to store rainwater: drinking water for an Amsterdam under siege."
  body: |
    Two smaller buildings in the south-east corner of the museum garden are by the same hand as the Rijksmuseum, Pierre Cuypers, and most people take them for outbuildings.

    The villa of 1883 was the official home of the museum's general director. Three directors lived there, the last of them Frederik Schmidt-Degener. His successor, appointed in 1945, chose not to move in, and since 1949 the house has been offices. The garden between villa and school was the director's own, fenced off from the public part.

    The Teekenschool (drawing school) of 1890–1891 was a practice school: trainee drawing teachers, whose course was housed in the museum attic, taught children here. The classrooms face north for even light. The chapel-shaped wing was given the medieval painted wooden vault of the church of Warmenhuizen, a transfer that set off a national argument about moving monuments; it went back in 1964. At the request of the Ministry of War large cellars were built underneath to collect rainwater, as drinking water if Amsterdam, inside its ring of forts (the Stelling van Amsterdam), were besieged. The register calls them originally secret.

    The teacher training left in 1966 for the Rietveld Academie. The school is now the museum's education centre, with courses and workshops for children and adults. The villa is not open; both are seen from the garden and the street.

    Look for:
    - above the school door: "Teekenen is spreken en schrijven tegelijk" (drawing is speaking and writing at once), a saying of Victor de Stuers
    - tile panels on the north wall with drawing-class subjects such as a pair of compasses and a polygon
    - the turret at the canal end of the school
    - the villa's corner bays, ending in small spires
    - the Caucasian wingnut tree by the villa, planted by Cuypers in 1907
