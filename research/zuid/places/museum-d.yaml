  nl:
    title: Teekenschool en directeursvilla van het Rijksmuseum
    summary: "Achter het Rijksmuseum staan de tekenschool en het huis waar drie directeuren hebben gewoond. Onder de school liet het ministerie van Oorlog kelders maken voor regenwater: drinkwater voor als Amsterdam belegerd zou worden."
    body: |
      In de zuidoosthoek van de museumtuin staan twee kleinere gebouwen van dezelfde architect als het Rijksmuseum, Pierre Cuypers. De meeste mensen houden ze voor bijgebouwen.

      De villa uit 1883 was de dienstwoning van de hoofddirecteur. Er hebben drie directeuren gewoond, als laatste Frederik Schmidt-Degener. Zijn opvolger, benoemd in 1945, wilde er niet in, en sinds 1949 is het huis kantoor. De tuin tussen villa en school hoorde bij de directeur en was met een hek van het openbare deel gescheiden.

      De Teekenschool uit 1890–1891 was een oefenschool: aankomende tekenleraren, die hun opleiding op de zolder van het museum volgden, gaven hier les aan kinderen. De lokalen liggen op het noorden, voor gelijkmatig licht. In de vleugel die op een kapel lijkt kwam het middeleeuwse beschilderde houten gewelf van de kerk van Warmenhuizen te hangen. Over die verhuizing ontstond in het hele land ruzie: mag je monumenten zomaar verplaatsen? In 1964 ging het gewelf terug. Op verzoek van het ministerie van Oorlog kwamen er onder het gebouw grote kelders om regenwater op te vangen, als drinkwater voor het geval Amsterdam binnen de Stelling van Amsterdam belegerd zou raken. Volgens het monumentenregister waren ze eerst geheim.

      De lerarenopleiding vertrok in 1966 naar de Rietveld Academie. Nu is de school het educatieve centrum van het museum, met cursussen en workshops voor kinderen en volwassenen. De villa is niet te bezoeken; je ziet beide gebouwen vanuit de tuin en vanaf de straat.

      Let op:
      - boven de deur van de school: 'Teekenen is spreken en schrijven tegelijk', een uitspraak van Victor de Stuers
      - tegeltableaus op de noordgevel met onderwerpen uit de tekenles, zoals de passer en de veelhoek
      - het torentje aan de kant van de kade
      - de hoekerkers van de villa, die uitlopen in spitsjes
      - de Kaukasische vleugelnoot bij de villa, in 1907 door Cuypers geplant
    attributes:
      original_use: Oefenschool voor tekenleraren; dienstwoning van de directeur
