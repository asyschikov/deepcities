    - https://nl.wikipedia.org/wiki/De_onbekende_verliezer (gateways under houses, sculpture intended, Smout's fresh runners at the Herculesstraat, Achillesstraat left empty for lack of money, restoration project of the city's heritage department, Katzir an Israeli trained at the Rietveld Academie, one runner looks back, the last one exhausted and bent over, under nos. 37-39 and 65-67; gives 1932 for Smout)
