  nl:
    title: Nieuwe Huishoudschool ('Gabriël met jus')
    summary: Een school die begon met een ruzie. In 1904 namen op twee na alle leraressen van de eerste huishoudschool van het land ontslag en begonnen voor zichzelf. Hun architect bouwde in zes maanden en trouwde later met de onderdirectrice.
    body: |
      De Amsterdamsche Huishoudschool uit 1891 was de eerste school in Nederland waar het huishouden een vak was. In 1904 liep een ruzie over salarissen en over het onderwijs uit de hand. Op twee na namen alle leraressen ontslag. Onder leiding van mejuffrouw S.G.F. Meyboom begonnen ze in een pand aan de Jan Luijkenstraat de Nieuwe Huishoudschool. Toen het geld bij elkaar was, zette architect Willem Leliman dit gebouw in maar zes maanden neer. Op 11 september 1907 ging het open. De trambestuurders die er langs reden noemden het 'Gabriël met jus'.

      Leliman wilde een huiselijke, vrolijke school, met in elk vertrek licht, lucht en zon. Links kwamen de lokalen en twee leskeukens. Op de bovenste verdiepingen was een internaat voor de directrice, de leraressen en de leerlingen, ingedeeld als één groot woonhuis met uitzicht op het Museumplein. Hij werkte het plan uit in nauw overleg met de directrice en de onderdirectrice, M.E. Bosch, met wie hij later trouwde. In 1930–1931 moest het buurhuis wijken voor een uitbreiding. De school bleef tot 1970 en ging toen op in wat nu de Hogeschool van Amsterdam is. Je bekijkt het vanaf de straat.

      Let op:
      - het kleurige tegeltableau onder de ramen van de bovenste verdieping: 'De Nieuwe Huishoudschool'
      - de twee erkertorentjes met rood-wit vakwerk en spitse dakjes
      - de rode dakpannen en het dakhuis in vakwerk tussen de torentjes
      - de vensterbanken: rood geglazuurd aan het deel uit 1907, kaal aan de vijf vensterassen die er in 1931 links bij kwamen
      - het smeedijzeren hek langs de stoep
    attributes:
      built: 1907, uitgebreid 1930–1931
      architect: J.H.W. (Willem) Leliman; uitbreiding G.H. Kleinhout en A.J. van der Steur
      original_use: Huishoudschool met internaat
      check_note: "Wie gebruikt het gebouw nu? Niet bevestigd sinds de school in 1970 vertrok."
    sources:
      - amsterdam:222123 (redengevende omschrijving)
      - https://amsterdamopdekaart.nl/1850-1940/Gabriel_Metsustraat/8

- title: Berlage's drawing school for girls (Gabriël Metsustraat 16)
  summary: A little-known Berlage of 1908, built so that girls could learn drawing, woodcarving, lithography and bookbinding. The school grew into the Rietveld Academie. Today the Concertgebouw Orchestra rehearses and has its office here.
  body: |
    This front is one of the lesser-known works of H.P. Berlage, the architect of the Amsterdam stock exchange. He built it in 1908 for the Dagteeken- en Kunstambachtsschool voor Meisjes (day school of drawing and applied art for girls), which a society for working people had founded in 1878. Girls learned drawing here, and also modelling, woodcarving, painting, lithography and bookbinding. The diploma opened the way to the training college for drawing teachers and to the state art academy.

    The school was too small almost at once: in 1914 Berlage applied to turn part of the top attic into a studio, and in 1932 the main stair was carried up to a new top floor. In 1924 the school merged with two others into the Instituut voor Kunstnijverheidsonderwijs. In 1967 that institute moved to a new building on the Fred. Roeskestraat and took the name Rietveld Academie.

    The Concertgebouw Orchestra bought the building in 2016 and rebuilt it until 2019 as its office and rehearsal house, putting the roof and dormers back as Berlage drew them. It is a place of work; the front is the sight.

    Look for:
    - the strip of yellow and red glazed tiles beside the entrance arch, with the year 1908
    - the wide round arch of the porch, set left of centre
    - the huge classroom windows, and behind them the raised floor edge with which Berlage hid where the storeys really are
    - the line of text on the front that begins "Let op wat iedereen kan horen" (mind what everyone can hear)
    - the original iron fence
  category: schools
  lat: 52.355806
  lng: 4.881817
