- title: Villa Troostwijk (Museumplein 4)
  summary: "On the Museumplein stands a house of flat roofs and straight lines only. An architect built it for himself in 1925, after Frank Lloyd Wright and De Stijl. Later it explained America to the Dutch."
  body: |
    This villa on the Museumplein refuses every curve. The architect Jan de Bie Leuveling Tjeenk built it for himself in 1925: brick boxes stacked at different heights, flat roofs, wooden canopies that jut out the way Frank Lloyd Wright's do, and nothing but right angles, as De Stijl preached. On the top floor is a room that opens onto a roof terrace. It was listed in 1980.

    The architect died in 1940. In 1950 the United States Information Office moved in, an agency that explained America to the Dutch. When it closed in 1957 the Netherlands-America Institute took over and arranged student exchanges from here until 1972. The name Villa Troostwijk comes from the next tenant, the firm Troostwijk, brokers in machinery, who had their office here from 1973 to 1986. From 1987 to 1990 the villa was Museum Overholland, for modern art on paper.

    The front and the left side can be seen from the square.

    Look for:
    - the canopies and roof edges that stick out far beyond the walls
    - the entrance with steps, built against the left side wall and not in the front
    - the closed brick balconies at the front and the back
    - the terrace room on the top floor
