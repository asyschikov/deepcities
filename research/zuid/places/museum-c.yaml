  nl:
    title: Villa Troostwijk (Museumplein 4)
    summary: "Aan het Museumplein staat een huis met alleen platte daken en rechte lijnen. Een architect bouwde het in 1925 voor zichzelf, naar Frank Lloyd Wright en De Stijl. Later werd hier Amerika aan Nederland uitgelegd."
    body: |
      Deze villa aan het Museumplein doet aan geen enkele ronding mee. Architect Jan de Bie Leuveling Tjeenk bouwde haar in 1925 voor zichzelf: bakstenen dozen die op verschillende hoogten zijn gestapeld, platte daken, houten luifels die ver uitsteken zoals bij Frank Lloyd Wright, en uitsluitend rechte hoeken, zoals De Stijl het wilde. Boven is een kamer die uitkomt op een dakterras. Het huis werd in 1980 een monument.

      De architect overleed in 1940. In 1950 kwam hier het United States Information Office, een bureau dat de Nederlanders over Amerika voorlichtte. Toen dat in 1957 sloot, nam het Nederland-Amerika Instituut het pand over en regelde er tot 1972 uitwisselingen van studenten. De naam Villa Troostwijk komt van de volgende huurder, de firma Troostwijk, makelaars in machines, die hier van 1973 tot 1986 kantoor hield. Van 1987 tot 1990 was de villa Museum Overholland, voor moderne kunst op papier.

      De voorkant en de linkerzijgevel zie je vanaf het plein.

      Let op:
      - de luifels en dakranden die ver buiten de muren steken
      - de ingang met stoep, die tegen de linkerzijgevel is gebouwd en niet in de voorgevel zit
      - de gesloten bakstenen balkons aan de voor- en achterkant
      - de terraskamer op de bovenste verdieping
    attributes:
      original_use: Eigen woonhuis van de architect
      check_note: "Wie gebruikt de villa nu? De laatste gevonden huurder is Museum Overholland, dat in 1990 vertrok."
    sources:
      - rce:3730 (omschrijving)
      - https://amsterdamopdekaart.nl/1850-1940/Museumplein/4

- title: Former ANWB office (Museumplein 5–7)
  summary: "A modern block among the early twentieth-century villas of the Museumplein, built in 1958 for the motorists' association with three large flats beside it. It is yellow because the red bricks the design board wanted had run out."
  body: |
    When car ownership took off in the 1950s, the ANWB, the Dutch touring and motorists' association, opened offices across the country. In Amsterdam it chose the Museumplein, and the architect Herman Knijtijzer gave it a plainly modern block: a concrete frame left in view, steel windows, flat roofs. Local building rules required housing on the site, so the south-west half (no. 7) became three large flats and the north-east half (no. 5) the office, with a shop in a low wing and the staff canteen on the roof.

    The city's design review board had pressed for red brick, to match the old villas. But on the building site a load of yellow bricks arrived, because red ones were no longer to be had. So the newcomer stands out twice over.

    The ANWB has left, and a glass box that held the shop entrance was removed in a later rebuilding. The building is offices and flats, seen from the square.

    Look for:
    - the white concrete bands that mark each floor right round the building
    - the glazed corners, where the concrete skeleton shows
    - the rounded stair housing on the roof, the only curve on the outside, read as a nod to Le Corbusier
    - the balustrade along the roof edge, which gives the block the air of a palazzo
    - the glass canopy over the flats' entrance, hung from tie rods
