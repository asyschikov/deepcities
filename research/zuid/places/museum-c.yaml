  nl:
    title: Villablok achter het Rijksmuseum (Honthorststraat 3–9, Jan Luijkenstraat 7–9)
    summary: "Drie villa's en een dubbele villa op grond die de gemeente gewoon verkocht, want wie villa's bouwt, zei de wethouder, hecht aan eigen grond. Eén ervan was in 1976 gekraakt en had al een sloopvergunning, tot een actie van buurtbewoners en architectuurhistorici haar redde."
    body: |
      Hier, tussen het Rijksmuseum en het Stedelijk, verkocht de gemeente de grond. Toen een paar raadsleden het in 1902 vreemd vonden dat die niet in erfpacht ging, antwoordde de wethouder dat wie villa's bouwt over het geheel genomen op eigendom van de grond gesteld is. Zo ontstond een blok vrijstaande huizen met onder de eerste bewoners een bankier, fabrikanten en een koopman. Loop een rondje om het blok.

      Villa Roelvink (Honthorststraat 9, 1899), op de hoek van de Paulus Potterstraat, stond er het eerst, voor een bankier die de Twentsche Bankvereeniging leidde. Op die villa staat de speld. In 1976 was ze gekraakt, en de eigenaar had al een sloopvergunning voor een modern kantoor. Buurtbewoners en architectuurhistorici voerden actie en wonnen; in 1983 is de villa in tweeën gesplitst.

      Nummer 5–7 (1902–1904) is een dubbele villa die architect Evert Breman voor eigen rekening bouwde en daarna een jaar lang te koop aanbood. Hij bouwde haar twee keer van één tekening: de tweeling staat een straat verder, aan de Hobbemastraat 14–16. Villa Reens (nummer 3, 1912–1913) is ontworpen door Harry Elte voor de directeur van een timmerfabriek die de betimmeringen voor Eltes interieurs leverde. Elte stierf in 1944 in Theresienstadt.

      Let op:
      - de hoektoren met spits dak van Villa Roelvink, en het ronde torentje dat uit de afgeschuinde hoek groeit
      - de banden van groen geglazuurde steen aan Villa Roelvink
      - de klokgevel en de felrode baksteen van Honthorststraat 7
      - de lantaarn boven op het dak van Villa Reens
      - bij Jan Luijkenstraat 7–9 de twee torens; veel van wat daar natuursteen lijkt, is gegoten kunststeen
    attributes:
      architect: A.L. van Gendt en zonen; E. Breman; H. Elte; P. van Dijk en J.W. Nagelvoort
      original_use: Villa's
    sources:
