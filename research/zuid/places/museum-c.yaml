  nl:
    title: Berlages tekenschool voor meisjes (Gabriël Metsustraat 16)
    summary: Een weinig bekende Berlage uit 1908, gebouwd om meisjes te leren tekenen, houtsnijden, lithograferen en boekbinden. Uit de school groeide de Rietveld Academie. Nu repeteert het Concertgebouworkest er en heeft het er zijn kantoor.
    body: |
      Deze gevel hoort bij de minder bekende werken van H.P. Berlage, de architect van de Beurs. Hij bouwde het pand in 1908 voor de Dagteeken- en Kunstambachtsschool voor Meisjes, in 1878 opgericht door de Maatschappij voor den Werkenden Stand. Meisjes leerden er tekenen, maar ook boetseren, houtsnijden, schilderen, lithograferen en boekbinden. Met het diploma konden ze door naar de opleiding voor tekenleraren en naar de Rijksacademie.

      De school was vrijwel meteen te klein. In 1914 vroeg Berlage vergunning om een deel van de vliering tot atelier te verbouwen, en in 1932 werd het hoofdtrappenhuis doorgetrokken naar een nieuwe bovenste verdieping. In 1924 ging de school met twee andere op in het Instituut voor Kunstnijverheidsonderwijs. Dat verhuisde in 1967 naar nieuwbouw aan de Fred. Roeskestraat en heet sindsdien Rietveld Academie.

      Het Concertgebouworkest kocht het gebouw in 2016 en verbouwde het tot 2019 tot kantoor en repetitiehuis. Daarbij kregen het dak en de dakkapellen de vorm terug die Berlage had getekend. Er wordt gewerkt; je komt voor de gevel.

      Let op:
      - de strook gele en rode geglazuurde tegels naast de boog van de ingang, met het jaartal 1908
      - de brede ronde boog van het portiek, links van het midden
      - de enorme ramen van de lokalen, met daarachter de opgetilde vloerrand waarmee Berlage verborg waar de verdiepingen echt liggen
      - de regel tekst op de gevel die begint met 'Let op wat iedereen kan horen'
      - het oorspronkelijke ijzeren hek
    attributes:
      original_use: Dagteken- en kunstambachtsschool voor meisjes
    sources:
      - amsterdam:200148 (redengevende omschrijving)
      - https://amsterdamopdekaart.nl/1850-1940/Gabriel_Metsustraat/16

- title: Hillehuis (Michel de Klerk, 1911–1912)
  summary: A block of flats of 1911–1912 for the builder Klaas Hille, counted as Michel de Klerk's first work of his own. Its angular, spiky details announce the Amsterdam School, years before Het Schip.
  body: |
    The Amsterdam School is usually shown off in the west of the city, at Het Schip. Its opening notes are here, on a quiet square behind the Concertgebouw. The builder Klaas Hille had leased a plot that runs from halfway down the Gabriël Metsustraat, round the Johannes Vermeerplein, into the Nicolaas Maesstraat. He gave the design to Michel de Klerk, who had worked in the offices of Eduard Cuypers and H.A.J. Baanders. It is regarded as De Klerk's first independent work.

    The result is still fairly traditional, with strong vertical lines. But the decoration is new: angular and prickly, in brick, iron, stone and wood. And behind the front De Klerk dropped Berlage's rule that the layout of the flats should be readable on the outside, a break the Amsterdam School would push to extremes. The three wings are tied together by one long balcony, the ornaments and the roof. Soon afterwards De Klerk designed housing for Hille on the Spaarndammerplantsoen, close to where Het Schip would later rise.

    The flats are private. Walk the whole front from the street to the square and round the corner.

    Look for:
    - the brick balcony that runs along the whole first floor, carried on brackets (some have been renewed)
    - the white-framed entrances with four doors side by side and iron grilles in the door windows
    - the garden fence with its looping ironwork
    - the house numbers worked into the door frames
    - the date stones high up on the front facing the square, which is calmer than the street side
