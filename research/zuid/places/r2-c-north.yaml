  nl:
    title: "De liberale synagoge op het eiland van Jacob Soetendorp"
    summary: "Een grijs blok uit 2010 op een eigen landtong, met een glazen uitsnede in de vorm van een menora. De oudere synagoge van de gemeente is verkocht en gesloopt, en de straat die naar haar rabbijn heette verdween mee. Sinds 2014 draagt het eiland zijn naam."
    body: |
      De glazen uitsnede in de gevel van dit grijze blok heeft de omtrek van een menora, de zevenarmige kandelaar. Het is de synagoge van de Liberaal Joodse Gemeente Amsterdam, ontworpen door Bjarne Mastenbroek en Uda Visser van SeARCH en sinds augustus 2010 in gebruik, met plaats voor 800 mensen.

      De gemeente bestaat sinds 1932 en groeide in de jaren dertig door Joden die uit Duitsland waren gevlucht. Na de oorlog waren er nog maar weinig leden over. Onder Jacob Soetendorp, rabbijn van 1954 tot 1972, bloeide ze weer op, en in 1966 bouwde ze een eigen synagoge aan de Graafschapstraat. In 1978 kreeg het stuk straat ervoor de naam Jacob Soetendorpstraat.

      Eind 2007 verkocht de gemeente dat gebouw aan theaterproducent Joop van den Ende. In 2008 ging het tegen de vlakte, en de straatnaam verviel: de hele straat heet weer Graafschapstraat. Tweeënhalf jaar lang waren de diensten in een zaal bij het Stadionplein. Op verzoek van de gemeente gaf de stad de naam van de rabbijn aan het schiereilandje waarop de nieuwbouw staat: Jacob Soetendorpeiland, sinds 2014.

      Je ziet het het best van over het water.

      Let op:
      - de menora in glas, uitgesneden in het grijze blok
      - het water rond het schiereilandje
    attributes:
      architect: "SeARCH (Bjarne Mastenbroek, Uda Visser)"
      original_use: Synagoge en cultureel centrum
