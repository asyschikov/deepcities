  nl:
    title: "Kinderboerderij De Pijp, de boerderij op de plek van de opera"
    summary: "Hier, op het terrein van de oude RAI, wilde Amsterdam zijn operagebouw neerzetten. De Pijp wilde woningen en een sporthal, en kreeg ze. De opera ging naar het Waterlooplein; dit hof kreeg flats, een sportcentrum en in 1983 een kinderboerderij."
    body: |
      Op de plek waar Amsterdam zijn operagebouw had gepland, staat een kinderboerderij.

      Dit was het terrein van de Oude RAI, een houten tentoonstellingshal die in 1961 leeg kwam toen de RAI verhuisde. De gemeente wilde hier een opera, de raad stemde er in 1967 mee in en architect Cees Dam maakte een ontwerp. De Pijp, waar veel oude woningen op waren, wilde woningen en een sporthal. Een van de mensen die zich vanuit een plaatselijk comité voor die sporthal inzetten was Jan Schaefer, die in De Pijp woonde.

      De buurt kreeg haar zin. De opera kwam uiteindelijk aan het Waterlooplein, in de Stopera. Hier kwamen woningen, een sportcentrum (geopend op 30 april 1983) en op 1 juli 1983 deze kinderboerderij. Het idee kwam van buurtbewoners. De gemeente zag er weinig in, tot uit een wijkenquête bleek dat het grootste deel van de buurt erachter stond. Toen er in 1984 werd bezuinigd, ging de boerderij leden werven, en zo bleef ze bestaan. In 1986 werd hier het eerste kalf van De Pijp geboren. In 1997 brandde het hoofdgebouw af; het is herbouwd.

      De toegang is gratis. Open op maandag en van woensdag tot en met vrijdag van 11.00 tot 16.45 uur, in het weekend vanaf 12.00 uur, dinsdag gesloten.

      Let op:
      - de heemtuin met inheemse planten
      - tegen de blauwe sporthal ernaast een splitskast van P.L. Marnette, in de Amsterdamse Schoolstijl uit de bouwtijd van de Nieuwe Pijp
      - in dezelfde straat, voor het kinderdagverblijf en medisch centrum, 'Passer' (1984) van Tjoe Fang King
      - de toren van Hotel Okura boven de daken
    attributes:
      built: "1983, hoofdgebouw herbouwd na 1997"
