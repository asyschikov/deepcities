- title: "Apollolaan, east end: Boterenbrood, Staal and Gratama"
  summary: Between the Muzenplein and the Beethovenstraat the avenue is lined with a jagged block by Boterenbrood, J.F. Staal's last design and 34 'small modern gentlemen's houses' by Jan Gratama. At the Beethovenstraat corner 29 prisoners were shot on 24 October 1944.
  body: |
    Three architects of the committee years share this stretch. Jan Gratama came first: in 1926 the building company he worked for leased the strip between the Mozartkade and the avenue, and he filled it with 34 houses, advertised as 'small modern gentlemen's houses' of seven to ten rooms. He moved into number 36 himself. Jan Boterenbrood followed in 1928–1929 on the south side with thirty flats behind a front that never sits still: yellow brick below, dark brown above, pointed gables on the corners, and a kink where the avenue bends. On the Beethovenstraat corner stands the last design of J.F. Staal, of 1938–1939: flats over shops, with bays, panels and brick in strict alternation. At the far east end, Apollolaan 1 is a villa of 1927–1928 with sculpture that Hildo Krop cut on the spot.

    The crossing with the Beethovenstraat is also a place of execution. On 23 October 1944 the resistance shot an officer of the German security police here. The next day the occupier brought 29 prisoners from the house of detention on the Weteringschans to this spot and shot them without trial; they had no part in the attack. The bronze group of three men by Jan Havermans in the central reservation, unveiled in 1952, stands where they fell.

    All the buildings are lived in. This ensemble is pinned on Boterenbrood's block.

    Look for:
    - the stone between Apollolaan 39 and 41: built by J.B. Sellmeijer & Zn, 1928-1929, architect J. Boterenbrood
    - the row of giant brick piers over three floors on the recessed part of that block
    - the round windows and the balconies on top of the bays of Staal's corner (65-83)
    - the canopies over the doors and the garages of Gratama's houses (20-50)
    - Krop's faun with an accordion on a corner stone of Apollolaan 1
    - the memorial west of the Beethovenstraat, with the date 24 October 1944 on its base
  category: housing
  lat: 52.349388
  lng: 4.881552
  address: Apollolaan 1-83 and 20-50, Mozartkade 1-17, Beethovenstraat 3-9
