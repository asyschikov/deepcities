    - { label: Amsterdam op de kaart, url: "https://amsterdamopdekaart.nl/1850-1940/Richard_Wagnerstraat/32" }
    - { label: Reliwiki, url: "https://www.reliwiki.nl/index.php/Amsterdam,_Richard_Wagnerstraat_32_-_First_Church_of_Christ,_Scientist" }
    - { label: Wikipedia (nl) Richard Wagnerstraat, url: "https://nl.wikipedia.org/wiki/Richard_Wagnerstraat" }
