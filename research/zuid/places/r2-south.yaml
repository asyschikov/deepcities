  nl:
    title: "Vogels en vissen: een Escher op een villagevel"
    summary: "Voor zover bekend heeft M.C. Escher één werk voor Amsterdam gemaakt, en dat zit op de gevel van een villa in Zuid: 75 Delftse tegels waarin witte vissen zwarte vogels worden. Eerst mopperde hij op tegels, daarna kwam hij naar de onthulling."
    body: |
      Het enige werk dat M.C. Escher voor zover bekend voor Amsterdam heeft gemaakt, zit op de bakstenen gevel van een woonhuis in een zijstraat van de Prinses Irenebuurt.

      In 1959 wilden de eigenaar van deze nieuwe villa en zijn vrouw kunst aan de muur. Ze dachten eerst aan een mozaïek, kozen toen voor zwart-wit, en voor de eigenaar moest het een Escher worden en anders niets. Escher had er weinig zin in: in een brief aan zijn zoon vloekte hij op de tegelmode, na een vermoeiende klus met schoolzuilen in Den Haag. Hij nam de opdracht toch aan en kreeg er plezier in. Hij ging uit van zijn houtsnede Lucht en water I uit 1938, tekende een ruit waarin vissen in vogels overgaan, en nummerde alle 75 tegels op de tekening voor De Porceleyne Fles in Delft, waar ze zijn gebakken. Architect Lau Peters wilde de ruit rechtop. De eigenaar en Escher wilden hem liggend, en zo hangt hij er. In het voorjaar van 1960 is het tableau onthuld, met Escher erbij.

      Het gemeentelijke register van wandkunst vindt het zo kenmerkend dat het zijn beeldmerk zou kunnen zijn. Er wordt gewoond: kijk vanaf de stoep.

      Let op:
      - het punt halverwege waar je niet meer kunt zeggen wat vis is en wat vogel
      - de kleuren: witte vissen, zwarte vogels, verder niets
      - hoe de ruit dwars door de rechte lijnen van de villa uit 1958 gaat
    sources:
      - gemeente Amsterdam, register Wandkunst, record Dirk Schäferstraat 59
      - https://nl.wikipedia.org/wiki/Dirk_Sch%C3%A4ferstraat
      - https://escherinhetpaleis.nl/en/escher-today/a-facade-with-fish-and-birds

- title: Your Life is Calling, the twelve fists
  summary: "Five tonnes of concrete fists were hoisted onto the Museumplein without a permit in 1990, as a protest against the Van Gogh fair. The guards thought it belonged to the show. Since 1999 the fists stand on a hillock in the Beatrixpark."
  body: |
    Twelve clenched fists rise out of a small hill in the south-east corner of the Beatrixpark, against the motorway. They were made to stand somewhere else, and nobody had asked for them.

    In 1990, a century after Van Gogh's death, the Museumplein filled with a "Van Gogh Village" for sponsors and souvenirs. The art world muttered. Two artists, Paul Pieck and Benno Réwinkel, found the muttering too easy and cast a statement instead: a little over 5,000 kilos of reinforced concrete, one fist for each month of the year, poured on the pavement in front of their studio on the Admiraal de Ruijterweg. At the end of March a lorry and a crane put it on the square, illegally. The guards let them work, assuming it was part of the exhibition. When an official found out there was no permit, the police came, heard that this was not a political action, and let them finish. The city tolerated it for eight years.

    When the square was redone in 1998 the fists went into storage. The makers wanted them seen and found the friends of the Beatrixpark, who were fighting a planned motorway exit through their park and could use a symbol. The first hill they picked could not carry the weight; this one could. In September 2007 someone hacked into the sculpture; it was repaired.

    Look for:
    - twelve fists, no two the same height
    - the low hill itself, chosen because it could bear five tonnes
