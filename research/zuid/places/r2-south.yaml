  nl:
    title: De stedenmaagd van het Vondelpark, met pensioen op de stadsgrens
    summary: "126 jaar lang nodigde ze wandelaars het Vondelpark in. Het zandsteen was niet tegen het verkeer bestand, dus op het parkhek zit nu een kopie, en het origineel begroet fietsers precies op de lijn waar Amsterdam begint."
    body: |
      De witte stenen vrouw aan de Koenenkade heeft 126 jaar hetzelfde werk gedaan bij de hoofdingang van het Vondelpark.

      Friedrich Schierholz maakte haar in 1883, toen het parkbestuur de ingang aan de Stadhouderskade meer aanzien wilde geven in het jaar van de Internationale Koloniale en Uitvoerhandel Tentoonstelling. Ze is de Stedenmaagd: Amsterdam als persoon, gezeten, 2,53 meter hoog, met het stadswapen op het schild in haar linkerhand, terwijl haar rechterhand de wandelaars naar binnen wenkt. Het zachte zandsteen uit Luxemburg hield het slecht uit naast een drukke weg. Na veel reparaties is ze op 12 november 2009 weggehaald, en op het hek kwam een kopie.

      Het origineel is nog een keer gerestaureerd en geschilderd, en op 18 juni 2014 op een sokkel van roestig cortenstaal gezet bij de fietsingang van het Amsterdamse Bos. De plek is precies gekozen. Ze zit op de grens tussen Amsterdam en Amstelveen en kijkt naar het zuiden, naar wie eraan komt. De stalen sokkel heeft de verhoudingen van de stenen pijler waar ze vandaan komt.

      Let op:
      - haar naam, uit het staal van de sokkel gefreesd
      - het schild met de drie Andreaskruisen
      - de rails van de museumtramlijn vlak achter haar
      - de kopie, op het hek van het Vondelpark aan de Stadhouderskade
    sources:
      - https://nl.wikipedia.org/wiki/Stedenmaagd_Amsterdamse_Bos
      - https://www.buitenkunstamsterdam.nl/Kunstwerken/1149
      - https://www.amsterdamsebos.nl/kunst/monumenten/

- title: "Vogels en vissen: an Escher on a villa wall"
  summary: "As far as anyone knows, M.C. Escher made one work for Amsterdam, and it is on the front of a private villa in Zuid: 75 Delft tiles in which white fish turn into black birds. He grumbled about tiles first, then came to the unveiling."
  body: |
    The only work M.C. Escher is known to have made for Amsterdam hangs on the brick front of a private house in a side street of the Prinses Irenebuurt.

    In 1959 the owner of this new villa and his wife wanted art on the wall. They thought of a mosaic, then decided on black and white, and the owner wrote that it was "to be an Escher or nothing". Escher was not keen: in a letter to his son he cursed the fashion for tiles, after a tiring job on school columns in The Hague. He took the commission anyway and came to enjoy it. He based the design on his woodcut Sky and Water I of 1938, drew a diamond in which fish change into birds, and numbered all 75 tiles on the drawing for De Porceleyne Fles, the Delft pottery that fired them. The architect, Lau Peters, wanted the diamond upright. The owner and Escher wanted it lying down, and it lies down. It was unveiled in the spring of 1960 with Escher present.

    The city's register of wall art calls it typical enough to be his trademark. People live here: look from the pavement.

    Look for:
    - the point halfway where you can no longer say which is fish and which is bird
    - the colours: white fish, black birds, nothing else
    - how the diamond cuts across the straight lines of the villa, built in 1958
