  nl:
    title: Lady Solid, de fontein die een buurt wegstemde
    summary: "Een levensgrote beschilderde vrouw lacht met gespreide armen naar het verkeer, terwijl het water langs haar benen loopt. Een plein in Oost vond haar in 1994 aanstootgevend. Het waterleidingbedrijf vond haar juist passen bij de poort."
    body: |
      Vanuit de auto op de Amstelveenseweg lijkt het of er iemand staat te zwaaien op het gras van het pompstation. Ze is van brons, in felle kleuren beschilderd, 1,65 meter lang, en ze was niet voor deze plek bedoeld.

      In 1994 vroeg stadsdeel Oost twee kunstenaars, Caro Bensca en Peer Veneman, om een fontein voor het Krugerplein, en de buurt mocht op de schetsen reageren. Bensca tekende een stralende vrouw die met open armen de gaven van het leven opvangt en ze aan de aarde teruggeeft als water dat uit haar broekspijpen loopt: de kringloop van het leven. Ze gaf haar trekken uit verschillende culturen mee, net als de buurt. De buurt zag een plassende vrouw en noemde haar ook zo. Het plein kreeg de fontein van Veneman.

      Het gemeentelijke waterleidingbedrijf zag er iets anders in: de hele waterkringloop in één figuur, een mens die water opneemt en weer afgeeft. Het kocht het beeld, en sinds 1997 staat Lady Solid bij de ingang van het terrein, op eigen grond achter een open hek, met opzet met haar gezicht naar de weg. In de volksmond heet ze het Waternetmeisje.

      Je ziet haar vanaf de stoep en het fietspad.

      Let op:
      - haar naam op haar rechterschouder
      - de mengeling die de kunstenaar bedoelde: de vlechten, de ogen, de spijkerbroek tot onder de knie
      - het grasveldje met drie bomen dat Bensca achter haar heeft aangelegd
    sources:
      - https://nl.wikipedia.org/wiki/Lady_Solid
      - https://publicart.amsterdam/projecten/lady-solid/
      - https://fonteinen-amsterdam-rotterdam.nl/amsterdam/overzicht-fonteinen/50-lady-solid
      - https://www.buitenkunstamsterdam.nl/Kunstwerken/2491

- title: The Vondelpark's city maiden, retired to the city limit
  summary: "For 126 years she invited walkers into the Vondelpark. The sandstone could not take the traffic, so a copy sits on the park gate now and the original greets cyclists on the exact line where Amsterdam begins."
  body: |
    The white stone woman on the Koenenkade did the same job for 126 years at the main gate of the Vondelpark.

    Friedrich Schierholz carved her in 1883, when the park's board wanted a grander entrance on the Stadhouderskade in the year of the International Colonial and Export Exhibition. She is the Stedenmaagd, the city maiden: Amsterdam as a person, seated, 2.53 metres high, with the city's arms on the shield in her left hand and her right hand inviting walkers in. The soft sandstone from Luxembourg did badly beside a busy road. After many repairs she was taken down on 12 November 2009, and a copy took her place on the gate.

    The original was restored once more and painted, and on 18 June 2014 it was set on a plinth of rusty Corten steel at the cyclists' entrance to the Amsterdamse Bos, the city's forest park. The spot is exact. She sits on the boundary between Amsterdam and Amstelveen and faces south, towards whoever is arriving. The steel plinth has the proportions of the stone pier she left behind.

    Look for:
    - her name cut out of the steel of the plinth
    - the shield with the three crosses of Amsterdam
    - the rails of the museum tram line right behind her
    - the copy, on the Vondelpark gate at the Stadhouderskade
  category: curiosities
  lat: 52.330391
  lng: 4.856108
  address: Koenenkade, at the entrance to the Amsterdamse Bos
