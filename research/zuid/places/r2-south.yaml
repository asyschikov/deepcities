- title: Lady Solid, the fountain a neighbourhood voted down
  summary: "A life-size painted woman laughs at the traffic with her arms spread, while water runs down her legs. A square in Oost refused her in 1994 as indecent. The water company thought she was exactly right for its gate."
  body: |
    From a car on the Amstelveenseweg she looks like someone waving from the lawn of the pumping station. She is bronze, painted in bright colours, 1.65 metres tall, and she was not meant to be here.

    In 1994 the borough of Oost asked two artists, Caro Bensca and Peer Veneman, to design a fountain for the Krugerplein, and let the neighbours comment on the sketches. Bensca drew a radiant woman who catches the gifts of life with open arms and gives them back to the earth as water running from her trouser legs: the circle of life. She mixed features from several cultures, to match the neighbourhood. The neighbourhood saw a woman peeing and called her that. Veneman's design got the square.

    The municipal water company saw something else: the whole water cycle in one figure, a person who takes water in and gives it off again. It bought the sculpture, and since 1997 Lady Solid has stood at the entrance of its site, on private ground behind an open fence, facing the road on purpose. People call her the Waternetmeisje, the Waternet girl.

    You see her from the pavement and the cycle path.

    Look for:
    - her name on her right shoulder
    - the mix the artist intended: the braids, the eyes, the jeans cut off below the knee
    - the patch of lawn with three trees that Bensca laid out behind her
