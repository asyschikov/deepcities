    - { label: Monumentenregister Amsterdam (Sophialaan 14 to 16), url: "https://data.amsterdam.nl/monumenten/2f2fd7a6-cbec-4e23-b785-9485933d6d02" }
    - { label: Amsterdam op de kaart (Sophialaan 18), url: "https://amsterdamopdekaart.nl/1850-1940/Sophialaan/18" }
    - { label: Amsterdam op de kaart (Sophialaan 14 to 16), url: "https://amsterdamopdekaart.nl/1850-1940/Sophialaan/14-16" }
