    title: Amstel-Badhuis Berebeit
    summary: "Een stukje badplaats aan de Amstel: een luxe badhuis uit 1883 met een hoektorentje en lange balkons, gebouwd door een architect die failliet ging in het jaar dat hij eraan begon. Heren gingen in de zijstraat naar binnen, dames aan de rivier."
    body: |
      De meeste mensen in de Pijp hadden thuis geen bad en gingen naar het eenvoudige badhuis aan de Eerste Sweelinckstraat. Dit was voor ander publiek. Het Amstel-Badhuis, gebouwd in 1882-1883, was een luxe inrichting met een eigen medische afdeling onder leiding van een dokter Arntzenius, en het werd in de loop der jaren meer kuuroord dan wasgelegenheid. De heren namen de deur aan de Tweede Jan van der Heijdenstraat, de dames die aan de Amsteldijk. Binnen lagen de badkamers rond een hoge vide met arcades.

      Van buiten lijkt het op niets anders in de wijk: grijze kalkzandsteen die op zijn kant is gemetseld, met rode strepen, lange balkons met ijzeren hekken en een ronde hoektoren onder een zinken spits. Het monumentenregister denkt aan de boulevards van Spa of Oostende. Architect A.A.M. Beretta was een Haagse timmerman die was gaan ontwerpen, en hij werd failliet verklaard in 1882, precies het jaar waarin de bouw begon.

      Na een brand in juni 1902 was het badhuis een jaar dicht. Rond 1920 sloot het voorgoed en kwam er een tearoom in, Berebeit genoemd naar een verdwenen buitenplaats aan de Amstel. Vanaf 1926 was de begane grond autoshowroom en later een garage met dezelfde naam. Sinds 2017 zit er het Italiaanse restaurant Impero Romano.

      Let op:
      - de ronde toren met spits op de hoek
      - de balkons langs beide verdiepingen, elk met drie dubbele deuren
      - de grijze en rode banden in het metselwerk
      - de guirlandes in het fries onder het dak
      - de twee deuren met brievenbussen in de zijstraat, in de stijl van de Weense Sezession, uit de tijd van de tearoom
    attributes:
      original_use: Badhuis
    sources:
      - "https://data.amsterdam.nl/monumenten/932b1bfa-659c-4afa-a23f-77bcb1c8486f"
      - https://nl.wikipedia.org/wiki/Amsteldijk_25
      - https://imperoromano.nl/

- title: The clock of Hemony and its neighbours
  summary: "A cigar shop of about 1910 named itself after the bell-founders of the street name and carved a bell over its window. Round the corner a marble plate still says a plumber's supplier is closed on Saturdays and Jewish holidays."
  body: |
    The north-east corner of the Pijp, between the Stadhouderskade and the Amstel, was built in the early 1880s for the lower middle class, a notch above the rest of the district. Four listed fronts within two minutes of each other show how such houses tried to stand out, and a fifth is waiting for its listing.

    Pinned here is Hemonystraat 22, an ordinary house of 1881 that got a new ground floor around 1910 for the cigar shop De klok van Hemony (the bell of Hemony). The name plays on the street, called after the 17th-century bell-founders Pieter and François Hemony. The black wooden shopfront with leaded glass kept a tobacconist until 1983 and earned the listing in 2014.

    On Tweede Jan Steenstraat 112 a marble plate announces P. Zeehandelaar, dealer in sanitary and water-pipe fittings, closed on Saturdays and Israelite holidays. The owner and his wife were murdered at Sobibor on 4 June 1943. The plate has stayed.

    All five are seen from the street.

    Look for:
    - Hemonystraat 22: the carved bell with a ribbon, and the arms of Amsterdam on a curling banner
    - Hemonystraat 9: a front of 1912–1913 with a ram's head over the porch, an oval window and a sandstone bay; before that the house was a private school for rich boys, run by the grandfather of the journalist H.J.A. Hofland
    - Tweede Jan Steenstraat 112–114: wooden balconies in the recessed middle of the front, where you would expect them at the back
    - Tweede Jan van der Heijdenstraat 94–96 (1881–1882): plaster masks, and French windows with cast-iron railings
    - Hemonylaan 22 (1884): the candidate, on a street as wide as the ditch it replaced
