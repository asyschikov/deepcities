      original_use: Lagere scholen, brandweerkazerne en politiepost
      check_note: "Huidige gebruikers niet ter plaatse bevestigd: de moskee op Govert Flinckstraat 286, de huurders van de twee scholen der derde klasse en de winkel op Ferdinand Bolstraat 8."
