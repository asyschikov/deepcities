  nl:
    title: Koningslaan, de parkkant (26–56)
    summary: >-
      Twee architecten van Carré tekenden deze laan in 1901 opnieuw en bouwden hem zelf vol: huizen
      voor meerdere gezinnen, vermomd als één landhuis. Eén staat in een V, één was in de
      jaren tachtig gekraakt, één was van een diamantair die in de bioscopen ging.
    body: |
      J.P.F. van Rossem en W.J. Vuyk kent men van Carré. Hier waren ze ook ontwikkelaar. In 1901 verkavelden ze de Koningslaan opnieuw, in 1902 richtten ze een NV op om de grond te exploiteren en vanaf 1905 woonden ze er zelf. Hun vondst was de 'villa voor drie familiën': meerdere huizen onder één schilderachtige kap, met een nette gevel aan de straat en terrassen en serres naar de lager gelegen vijver van het Vondelpark.

      De nummers 26–30 (1901–1902) waren de eerste. De eerste bewoner van nummer 26 was president-commissaris van Trompenburg, de fabriek van de Spyker-auto's, en overleed in 1912 in Frankrijk tijdens een tocht in een Spyker. De nummers 50–52 (1905–1907), waarop de speld staat, zijn het gewaagdst: twee huizen onder een hoek, zodat de gevels naar elkaar toe buigen. Op nummer 50 woonden de grootouders van Erik Hazelhoff Roelfzema, de Soldaat van Oranje. Later was het een verpleeghuis; daarna stond het leeg en was het van 1980 tot ongeveer 1988 gekraakt. Daarnaast bouwde J.F. Staal een dubbele villa in de trant van Berlage (54–56, 1911–1912) voor een diamantfabrikant; in 1912 werden ze samen commissaris van een bioscoopbedrijf. Aan de overkant zat in 31–33 (1913) van 1949 tot 1994 de economische faculteit van de Vrije Universiteit.

      De driedubbele villa op 32–36 heeft een eigen plek. Het zijn woonhuizen en kantoren; de tuinkant zie je het best vanaf de brug van het Vondelpark bij de Emmalaan.

      Let op:
      - 26–30: ronde traptorens met spits aan beide zijkanten
      - nr. 30: glas in lood met vlinders uit ongeveer 1925 in de zijgevel
      - nr. 28: het betegelde portiek met een trap naar de bel-etage en art-nouveausmeedwerk
      - 31–33: de garage uit 1913 aan de Emmalaan, met vouwdeuren en pirons op het dak
      - 50–52: balkonhekken met zweepslagen, en loggia's op een stenen kolom
      - 54–56: schoorstenen met een opengewerkte bakstenen kop
    attributes:
      architect: J.P.F. van Rossem en W.J. Vuyk, J.F. Staal, H.B.A. Bührs en G. de Groot
      original_use: Dubbele en driedubbele villa's
    sources:
      - https://data.amsterdam.nl/monumenten/80d3d09f-70e6-4e77-8e14-88a1a44b7b52
