  nl:
    title: De Dageraad
    summary: "De Amsterdamse School op haar uitbundigst: arbeiderswoningen van Piet Kramer en Michel de Klerk met golvende muren, torens van gestapelde cilinders en daken die niets dragen. In de hoektoren zit een klein museum dat vier middagen per week rondleidt."
    body: |
      Het rijksmonumentenregister maakt zelden grappen, maar noemt dit complex wel de Amsterdamse School 'in haar meest levendige, irrationele fase': golven en sprongen in de muren die alleen versiering zijn, dakvormen die niets dragen en een indeling die zich naar de buitenkant moest voegen. Het werd tussen 1918 en 1923 gebouwd voor de socialistische woningbouwvereniging De Dageraad, voortgekomen uit de gelijknamige bakkerscoöperatie een paar straten noordelijker. De huurders waren arbeiders.

      Kramer en De Klerk mochten het hele straatbeeld ontwerpen, op een terrein waar Berlage in zijn Plan Zuid eerst een ziekenhuis had gedacht. De twee helften spiegelen elkaar aan weerszijden van de Pieter Lodewijk Takstraat. Waar die straat op de Burgemeester Tellegenstraat uitkomt, gaan beide hoeken omhoog in een toren van achter elkaar gestapelde cilinders. Langs de Takstraat loopt de grens tussen gele en rode baksteen op en neer als een deining. De twee pleinen erachter, het Henriëtte Ronnerplein en het Thérèse Schwartzeplein, zijn rustiger: rijen die op losse villa's lijken.

      Museum De Dageraad, onderdeel van Museum Het Schip, zit in de westelijke hoek op Burgemeester Tellegenstraat 128. Het is open van donderdag tot en met zondag van 13.00 tot 17.00 uur; met een kaartje kun je om 13.30, 14.30 en 15.30 uur mee op een rondleiding om de blokken (de laatste in het Engels). De woningen zijn bewoond; al het andere zie je gewoon vanaf de straat.

      Let op:
      - P.L. Takstraat 1-5 en 2-6: de cilindertorens
      - P.L. Takstraat 1: het bakstenen gedenkteken voor P.L. Tak, oprichter van de vereniging, onthuld in 1924
      - de golvende gevels van P.L. Takstraat 7-25 en 8-26
      - Burgemeester Tellegenstraat 56-58 en 14-16: ronde hoeken met ramen als een scheepsboeg
      - Henriëtte Ronnerplein 15-16: een villadak dat plat tegen de gevel is gezet
      - de buste van wethouder Wibaut op de hoek van de Henriëtte Ronnerstraat en het plein
    attributes:
      architect: Piet Kramer en Michel de Klerk
      original_use: Sociale woningbouw
