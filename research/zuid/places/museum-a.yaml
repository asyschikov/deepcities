  nl:
    title: "Huize Loma en Zonnehoek: de eerste flats van Amsterdam"
    summary: In 1914 bouwde een architect van 25 aan de De Lairessestraat het eerste flatgebouw van Amsterdam, met een kat op het tegeltableau. Zonnehoek kreeg twee jaar later vuilniskokers en een stofzuigmachine voor alle bewoners.
    body: |
      Tot de Eerste Wereldoorlog woonde een welgesteld gezin in de hoogte: de keuken in het souterrain, de ontvangstkamers erboven, slapen nog een trap hoger. F.A. Warners had in Parijs en Wenen gezien dat het anders kon. In 1913–1914 bouwde hij Huize Loma, waar alle kamers van een woning op één verdieping lagen, ook die van het dienstmeisje. Het is het oudste flatgebouw van Amsterdam en Warners geldt als de man die het type in Nederland invoerde. Zelf sprak hij van een etagehuis.

      Loma begon met acht woningen, centrale verwarming, stromend warm water en een daktuin. In 1924 verving Warners het dak met de drie topgevels door een extra verdieping. Zo kwamen er twaalf woningen en verdween de daktuin.

      Voor zulke gebouwen wilde bijna niemand geld lenen. Daarom richtte Warners in 1914 een maatschappij op met zijn schoonvader, de uitgever Allert de Lange. Aandeelhouders kregen het recht om een etage te bewonen; een losse flat verkopen kon juridisch nog niet. Een van de eerste gebouwen van die maatschappij was Zonnehoek (1915–1916), 350 meter westelijker op de hoek van de Cornelis Schuytstraat. Daar waren elektrische bellen, vuilniskokers en een gezamenlijke stofzuigmachine, en op zolder zat het bureau van Warners zelf. Op de hoektoren stond een koperen bol die glom als een zon; de top is er later afgehaald.

      In beide gebouwen wordt gewoond; je bekijkt ze vanaf de straat. De speld staat op Huize Loma.

      Let op:
      - De Lairessestraat 4-8: het tegeltableau HUIZE LOMA met een kat en vogels boven de middelste portiek
      - de zandstenen waterspuwers in de vorm van dolfijnen, in de balkonmuur van Loma
      - de bovenste verdieping van Loma uit 1924, gemetseld in terugspringende lagen
      - De Lairessestraat 88-92: de naam ZONNEHOEK op de betonnen latei boven de deur
      - de drie Vlaamse gevels en het koperen dak van Zonnehoek
      - de stomp van de hoektoren, met zandstenen waterspuwers
    attributes:
      original_use: Etagehuizen
    sources:
      - city:222089, 222028 (registerteksten)
      - https://nl.wikipedia.org/wiki/Philip_Anne_Warners
      - https://amsterdamopdekaart.nl/1850-1940/De_Lairessestraat/4-8

- title: "De Lairessestraat 39 and 93: rows with hidden interiors"
  summary: Two quiet town houses, listed in 2021 for what is behind the front door. One has a room scheme full of East Indies motifs made during the First World War, the other glass walls with snakes that fold away like an accordion.
  body: |
    Nothing on the pavement gives these two away. Both stand in long rows built while the First World War raged outside neutral Holland, and both were made monuments for interiors that are private and cannot be visited.

    Number 39 belongs to the row 33-51, the whole south side of its block. G.J. Venemans leased the land, designed the houses and sold them himself, starting at the Jacob Obrechtstraat corner in 1916. His advertisements praised them as "low and wide": ten metres across, twelve rooms, garden facing south. That width is unusual for an Amsterdam terrace. The first family at 39, that of a Jewish diamond merchant who died in Bergen-Belsen in 1945, had the main floor fitted out by the designer Ad Grimmon, with work by the sculptor John Rädecker. The carved and painted decoration borrows from the Dutch East Indies and reflects on the war years. The register calls it extremely rare in the Netherlands.

    Number 93 is one of the row 89-107 (1918–1920) by the architects Groenendijk and Lammers. A Jewish couple had its ground floor planned differently from the neighbours: around a central hall, with glass partitions that fold away like an accordion and leaded glass showing snakes.

    This place is pinned on number 39.

    Look for:
    - nos. 33-51: how low and broad the houses are next to the tall blocks across the street
    - no. 39: the leaded-glass light above the front door, the one piece of the interior on show
    - nos. 89-107: the restrained Amsterdam School brickwork of the row
    - no. 93: the entrance, identical to its neighbours, which hides the odd plan behind it
