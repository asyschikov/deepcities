# Zuid round 2, slice r2-rivieren-b: scouted places in the Rivierenbuurt (items 229 to 234, 236, 237, 256).
# 7 new places. 234 is folded into 256 (one place: the garden and the blocks around it), 233 is dropped.
# See notes/r2-rivieren-b.md.
# Dutch texts are written fresh from Geheugen van Plan Zuid, Spoorzoeken in de Rivierenbuurt, Ons Amsterdam
# (1996, as republished by Geheugen van Plan Zuid), nl.wikipedia, the Anne Frank Stichting's Kennisbank,
# Bruggen (Nederlandse Bruggenstichting), Joods Cultureel Kwartier, AT5, Het Parool and Architectenweb.

- title: The German V above a Diezestraat doorway
  summary: "In the summer of 1941 the occupier answered the Allied V for Victory with a V of his own. A man who lived in the street watched a German soldier paint one of them. Black paint after the war never quite hid it."
  body: |
    Look up above the open stairwell between numbers 25 and 27: in the brick, just over the stone lintel, hangs the dark shadow of a large letter V.

    In 1941 leaflets dropped by the RAF spread the Allied V for Victory. That summer the Germans took the letter over: "V = Victorie, Duitschland wint voor Europa op alle fronten" (Germany wins for Europe on all fronts) appeared on banners, posters and walls. The resistance answered by turning the V into the W of Queen Wilhelmina.

    A man born in 1931, who lived at number 12, saw a German soldier paint the V over the next doorway, 29 and 31. The upper flats were lived in by soldiers, he said, who as far as he knew belonged to the Sieberg garage on the Scheldeplein nearby, then held by the Wehrmacht. After the liberation the letter was painted over in black, and it kept showing through.

    Even the local history foundation had missed it until he told them in 2011. Checking his tip, they found this second V over 25 and 27. He asked whether it was time to remove them. Most readers who answered said no.

    These are private homes: look from the pavement.

    Look for:
    - the V over the stairwell of 25 and 27, clearest in flat light
    - the doorway of 29 and 31, the next one south, where he saw the V being painted
    - the wrought-iron grille of the stairwell window above each doorway
  category: hidden-history
  lat: 52.345316
  lng: 4.892060
  address: Diezestraat 25-27
  links:
    - { label: Geheugen van Plan Zuid (the V-signs), url: "https://www.geheugenvanplanzuid.nl/archief/ingezonden/200.htm" }
  attributes:
    rank: Nice
    built: "1941"
    check: Still there?
    check_note: "A faint dark V shows above the doorway of 25-27 in street imagery of May 2024; the doorway of 29-31 is hidden behind a tree there and was last photographed in 2011."
  sources:
    - https://www.geheugenvanplanzuid.nl/archief/ingezonden/200.htm (2 May 2011; eyewitness born 1931 at Diezestraat 12, soldier painting the V, upper flats lived in by German soldiers, his assumption about the Sieberg garage, black paint after the war, about 60 cm, second V at 25-27, the three V campaigns after the Verzetsmuseum, the readers' answers; photos of 1 May 2011)
    - https://www.geheugenvanplanzuid.nl/pagina/architectuur/media-garage-sieberg/ (the garage was occupied by the Wehrmacht)
    - Google Street View, Diezestraat 27, image capture May 2024 (faint dark V above the lintel of the stairwell of 25-27; 29-31 hidden by an ivy-clad tree)
    - PDOK locatieserver (Diezestraat 25 at 52.345352, 4.892047 and 27 at 52.345280, 4.892077; pin between them)
  nl:
    title: De Duitse V boven een portiek in de Diezestraat
    summary: "In de zomer van 1941 beantwoordde de bezetter de geallieerde V van Victorie met een eigen V. Een man uit de straat zag een Duitse soldaat er een schilderen. Zwarte verf heeft hem na de oorlog nooit helemaal weggekregen."
    body: |
      Kijk omhoog bij het open trapportaal tussen de nummers 25 en 27: in de baksteen, vlak boven de stenen latei, staat de donkere schim van een grote letter V.

      In 1941 verspreidden strooibiljetten van de RAF de geallieerde V van Victorie. Die zomer namen de Duitsers de letter over: "V = Victorie, Duitschland wint voor Europa op alle fronten" kwam op spandoeken, affiches en muren te staan. Het verzet maakte van de V weer de W van Wilhelmina.

      Een man uit 1931, die op nummer 12 woonde, zag een Duitse soldaat de V boven het volgende portiek schilderen, dat van 29 en 31. In de bovenwoningen zaten soldaten die volgens hem bij de Sieberggarage aan het Scheldeplein hoorden, vlakbij, waar toen de Wehrmacht zat. Na de bevrijding is de letter met zwarte verf overgeschilderd, maar hij kwam steeds weer tevoorschijn.

      Ook de buurthistorici van Geheugen van Plan Zuid hadden het gemist tot hij het hun in 2011 vertelde. Bij het nagaan van zijn tip vonden ze deze tweede V boven 25 en 27. Hij vroeg of het geen tijd werd om ze weg te halen. De meeste lezers die reageerden, vonden van niet.

      Het zijn gewone woningen: kijk vanaf de stoep.

      Let op:
      - de V boven het trapportaal van 25 en 27, het best te zien bij vlak licht
      - het portiek van 29 en 31, het volgende naar het zuiden, waar hij de V zag schilderen
      - het smeedijzeren hekwerk voor het trappenhuisraam boven elk portiek
    attributes:
      check_note: "Op straatbeelden van mei 2024 is boven het portiek van 25-27 een vage donkere V te zien; het portiek van 29-31 gaat daar schuil achter een boom en is voor het laatst gefotografeerd in 2011."
    sources:
      - https://www.geheugenvanplanzuid.nl/archief/ingezonden/200.htm
      - https://www.geheugenvanplanzuid.nl/pagina/architectuur/media-garage-sieberg/

- title: The blackout house numbers behind glass
  summary: "When the blackout put out the lamps that showed the house numbers, people painted the numbers on the brick in white. Every year a few vanish; six in the Rivierenbuurt were put behind glass in 2012. This is the one at Vechtstraat 10."
  body: |
    Beside the door of Vechtstraat 10 a small pane of glass is clamped to the wall between two steel strips. Behind it, on the bare brick, is a hand-painted white 10.

    Before the war the house number was on the lamp by the door. In the blackout that lamp stayed dark, so the numbers went onto the wall in whitewash: mostly freehand, a few with a stencil, two to five brick courses high, and often on the back of the house as well. A local history project collected memories of them in 2010. It found no order from the occupier and thinks residents and landlords did it themselves; the numbers at the back most likely let the block warden see which house was showing light. It doubts the story that they served the raids on Jewish residents. Some were touched up by residents after the war.

    Every year a few more disappeared. In February 2012 the project had six good ones set behind unbreakable glass, "for the next ten years or longer". The glass is etched with "verduistering tweede wereldoorlog" (blackout, Second World War).

    Look for:
    - Vechtstraat 10, the pin
    - Amsteldijk 158, facing the river
    - the other four: Vechtstraat 119, Zomerdijkstraat 54, President Kennedylaan 210 and Deurloostraat 71
    - unprotected numbers elsewhere: pale figures beside a door or high on a back wall
  category: curiosities
  lat: 52.348516
  lng: 4.905206
  address: Vechtstraat 10
