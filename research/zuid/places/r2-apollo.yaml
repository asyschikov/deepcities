  nl:
    title: Schaduwen, de schaduwen van de razzia op het Olympiaplein
    summary: Op 20 juni 1943, tijdens de grote razzia, moesten Joden zich op dit sportveld verzamelen. Een NSB'er fotografeerde hen. Sinds 2022 liggen de schaduwen van de mensen op die foto in asfalt in de stoep, precies waar ze liepen.
    body: |
      De mensen op de foto hebben geen naam. Op zondag 20 juni 1943, tijdens de grote razzia, werden in Amsterdam op één dag ongeveer 5.500 Joden opgepakt. Het sportveld op het Olympiaplein was een van de plekken waar ze zich moesten verzamelen voordat ze naar Westerbork werden gebracht. Herman Heukels, lid van de NSB, maakte er een foto. Hoe de mensen op die foto heetten, is niet bekend.

      Kunstenaar Ram Katzir nam die foto, die nu bij het NIOD ligt, en liet alles weg behalve de schaduwen. Hij ging terug naar de plek en zocht uit waar de zon en de fotograaf stonden, zodat de schaduwen konden komen te liggen waar de mensen hadden gelopen. Negen figuren zijn uit de lichte stoeptegels gesneden en opgevuld met donker asfalt. Zijn gedachte: maar weinig mensen kwamen die dag in actie en de meesten keken de andere kant op, en wie werd weggevoerd, was al niet meer dan zijn schaduw.

      Hij werkte samen met drie leerlingen van Het Amsterdams Lyceum, de school net ten noorden van het plein. Het gedenkteken is op 20 juni 2022 onthuld, op de dag af 79 jaar later. Het ligt in de stoep aan de zuidkant van het Olympiaplein en is altijd toegankelijk.

      Let op:
      - de negen schaduwen onder je voeten
      - de informatiezuil met de foto uit 1943
      - de vergulde letters op het hek aan de zuidoosthoek: 'Hier trainde Fanny Blankers-Koen', die hier op de oude atletiekbaan oefende
      - het hek zelf, van Ruud-Jan Kokke, in 2008 bekroond met een Dutch Design Award
    sources:
      - https://www.4en5mei.nl/oorlogsmonumenten/monumenten_zoeken/oorlogsmonument/4502
      - https://buitenkunstamsterdam.nl/kunstwerken/bekijk/2533
      - https://nl.wikipedia.org/wiki/Olympiaplein

- title: Michelangelostraat 36, hideout of the Hidden Camera
  summary: "Behind this ordinary front a refugee photographer and a cavalry officer in hiding ran the group that secretly photographed the last winter of the occupation. Their 8,000 pictures fixed the image of the Hunger Winter."
  body: |
    The photographs that shaped the post-war image of the Hunger Winter were organised from two flats in this house. On the first and third floors of Michelangelostraat 36 hid Fritz Kahlenberg, a Jewish photographer and film-maker who had fled Berlin in the 1930s, and Tonny van Renterghem, a young cavalry officer who had escaped a German death sentence and became chief of staff of the armed resistance in Amsterdam-Zuid.

    On Dolle Dinsdag (Mad Tuesday, 5 September 1944, when the Dutch thought liberation was days away) the two decided to record the end of the occupation on film. Liberation did not come, and the group went on for eight months. Taking photographs had been forbidden. Professionals and amateurs, among them Emmy Andriesse, Cas Oorthuys, Charles Breijer and Krijn Taconis, worked with cameras hidden under coats or built into shopping bags and briefcases with a hole for the lens. For safety many knew each other only by a cover name. With little electricity, they developed by carbide lamp in a shared darkroom.

    A month after the liberation the pictures were shown in a studio on the Keizersgracht under the title "De Ondergedoken Camera" (the camera in hiding), and the group has gone by that name since. In 2025 the collection of about 8,000 photographs was entered in the Dutch Memory of the World register of UNESCO.

    Look for:
    - no. 36, in the west wall of the street just north of the Minervaplein
    - no. 59, across the street: Hannie Schaft, later a resistance fighter, had a student's attic room there from the summer of 1940
    - the Stolpersteine in the pavement at nos. 12, 43, 44, 45 and 58
