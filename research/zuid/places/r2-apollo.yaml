  nl:
    title: Modern meisje met de parel, Eerste Schinkelstraat
    summary: "Deze muurschildering vult een hele kopgevel van zo'n 117 vierkante meter met Vermeers Meisje met de parel, geschilderd door de Haagse straatkunstenaar Beyond nadat een bewoner erom vroeg en de buurt het ontwerp koos."
    body: |
      Een bewoner van de Schinkelbuurt kwam met het idee en benaderde straatkunstenaar Roelof Schierbeek, die werkt onder de naam Beyond. Hij legde de buurt drie ontwerpen voor, en de buurt koos dat naar het 'Meisje met de parel' van Vermeer.

      Er zit een grapje in die keuze. Het echte Meisje is sinds 1902 van het Mauritshuis in Den Haag en was maar even in Amsterdam te zien. Schierbeek komt ook uit Den Haag. Hij bracht haar naar een kopgevel van ongeveer 117 vierkante meter, waar ze mag blijven.

      De schildering zit er op zijn laatst sinds januari 2024. Ze vult een blinde kopgevel aan de Eerste Schinkelstraat, tussen de Amstelveenseweg en de Schinkel, en is altijd vanaf de straat te zien.

      Let op:
      - de tulband en de parel op huishoogte
      - hoe de raamloze kopgevel van een gewoon portiekblok de maat van het portret bepaalt
