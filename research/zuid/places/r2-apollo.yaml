  nl:
    title: The Regenerator, een Marina Abramović om op te zitten
    summary: "Op een hoek van een winkelstraat ligt een koperen schijf van twee meter doorsnee met zeven mineralen erin. De gebruiksaanwijzing staat in de stoep: ga op een van de mineralen zitten, regenereer, tijd onbeperkt. Het is een werk van Marina Abramović, gebruikt als bankje."
    body: |
      Op de hoek van de Beethovenstraat en de Gerrit van der Veenstraat ligt een koperen schijf van twee meter doorsnee en veertig centimeter hoog, als een reusachtige damschijf. Ze is verdeeld in segmenten, en in elk segment zit een ander mineraal.

      Abramović, de Servische performancekunstenaar, maakte het werk in 2001. Haar gedachte: het leven in grote steden gaat steeds sneller en mensen zijn bang om niets te doen; het is aan de kunstenaar om hen weer met de natuur te verbinden. Elke steen heeft zijn eigen werking: agaat tegen angst, rhodoniet voor kalmte en waardigheid, labradoriet voor nieuwe energie, rozenkwarts bij liefdesverdriet, rode jaspis voor wie zich op zijn gemak wil voelen met zijn seksualiteit, gele jaspis voor de hormonen en tijgeroog voor de communicatie. Het idee kwam van haar reizen, waaronder haar tocht over de Chinese Muur: bij elke soort grond onder haar voeten merkte ze een andere gemoedstoestand.

      De gebruiksaanwijzing ligt ernaast in de stoep, in hetzelfde koper. Het pleintje is een tramkruising en een hangplek voor leerlingen van de school in de buurt. In 2017 werd de schijf al afgeschermd door een bank met de houten letters BE erop.

      Let op:
      - de zeven gekleurde stenen in het koper
      - de aanwijzing in de stoep: zit op een van de mineralen, regenereer, voor onbepaalde tijd
      - het woord 'Regeneration', twee keer op de rand en bijna weggesleten
    sources:
      - https://nl.wikipedia.org/wiki/The_Regenerator
      - https://stadscuratorium.nl/collectie/the-regenerator/
      - https://buitenkunstamsterdam.nl/kunstwerken/bekijk/2232

- title: Minerva's return, the sculpture lawn opposite the Hilton
  summary: The avenue's patron goddess stood here from 1929 until thieves took her in 1985. She turned up with an art dealer, was given back in 2017 and stands on the lawn again, among works the two-yearly ArtZuid show left behind.
  body: |
    The Minervalaan lost its Minerva for more than thirty years. Jan Havermans's bronze goddess was unveiled in 1929 on the lawn where the avenue meets the Apollolaan, on the spot where the Hilton was later built across the road. In 1985 she was stolen from her plinth. She surfaced in the art trade: a dealer bought her in 2007 without knowing where she came from, and when he learned it had been stolen he called in a research bureau and the police, and then gave the statue through the tax office's gift scheme to the foundation behind ArtZuid. In 2017 she was shown in a museum exhibition in Hoorn on stolen art, and then she came home.

    While she was away the gap was filled. In 1994 the French artist Arman gave the city his bronze "Apollo Offering", a figure sliced lengthwise and pulled apart: the god of the avenue that crosses here, on the street of the goddess.

    The lawn has collected more since ArtZuid began in 2009. The show fills the Apollolaan and Minervalaan with sculpture every other summer (odd years), and a few pieces stay. Auke de Vries's "Bosgod" (forest god) was made for a bank's head office beside a nature park in Utrecht, where it looked, he said, as if an envoy of the woods had ventured onto the grounds. When that office closed it moved to the Zuidas in 2011, and in 2017 it came here.

    Look for:
    - Minerva on her round stone plinth, drawing a cloth over her shoulder
    - the split Apollo on a stone base marked "Arman 1994"
    - Bosgod, with the Hilton as a backdrop
    - a cast of Rodin's Thinker, and Shinkichi Tajiri's armoured "Wachter" (sentinel), further west on the lawn
  category: street-art
  lat: 52.350466
  lng: 4.872177
  address: Apollolaan, at the head of the Minervalaan (opposite Apollolaan 138)
  links:
    - { label: NOS on the recovered Minerva (2017), url: "https://nos.nl/artikel/2197968-gestolen-minerva-beeld-duikt-na-jaren-weer-op-en-iedereen-kan-het-nu-zien.html" }
    - { label: ArtZuid on Jan Havermans, url: "https://artzuid.nl/en/artzuid-artists/jan-havermans/" }
    - { label: Buitenkunst Amsterdam (Apollo), url: "https://buitenkunstamsterdam.nl/kunstwerken/bekijk/1915" }
