  nl:
    title: Minerva is terug, het beeldengazon tegenover het Hilton
    summary: De godin naar wie de laan heet, stond hier vanaf 1929 tot dieven haar in 1985 meenamen. Ze dook op bij een kunsthandelaar, werd in 2017 teruggegeven en staat weer op het gazon, tussen werk dat de tweejaarlijkse beeldenroute ArtZuid achterliet.
    body: |
      De Minervalaan is ruim dertig jaar haar Minerva kwijt geweest. De bronzen godin van Jan Havermans werd in 1929 onthuld op het gazon waar de laan op de Apollolaan uitkomt, op de plek waar later aan de overkant het Hilton verrees. In 1985 werd ze van haar sokkel gestolen. Ze kwam in de kunsthandel terecht: een handelaar kocht haar in 2007 zonder te weten waar ze vandaan kwam. Toen dat duidelijk werd, schakelde hij een onderzoeksbureau en de politie in, en via de schenkingsregeling van de Belastingdienst gaf hij het beeld aan de stichting achter ArtZuid. In 2017 stond ze in Hoorn op een museumtentoonstelling over gestolen kunst, daarna kwam ze naar huis.

      In de tussentijd was het gat gevuld. In 1994 schonk de Franse kunstenaar Arman de stad zijn bronzen 'Apollo Offering', een figuur die in de lengte is doorgesneden en uit elkaar getrokken: de god van de laan die hier kruist, in de straat van de godin.

      Sinds ArtZuid in 2009 begon, is er meer op het gazon blijven staan. De route zet de Apollolaan en de Minervalaan om de zomer (in de oneven jaren) vol beelden, en een paar blijven achter. 'Bosgod' van Auke de Vries is gemaakt voor het hoofdkantoor van een bank naast een natuurpark in Utrecht, waar het volgens hem leek alsof een afgezant van het bos zich op het terrein waagde. Toen dat kantoor dichtging, verhuisde het in 2011 naar de Zuidas, en in 2017 kwam het hierheen.

      Let op:
      - Minerva op haar ronde stenen sokkel, die een doek over haar schouder trekt
      - de gespleten Apollo op een stenen voet met 'Arman 1994'
      - Bosgod, met het Hilton als decor
      - een afgietsel van De Denker van Rodin en de geharnaste 'Wachter' van Shinkichi Tajiri, verder naar het westen op het gazon
    attributes:
      check_note: Minerva (foto mei 2023) en Bosgod (2023) zijn bevestigd; Apollo, het afgietsel van Rodin en de Wachter van Tajiri staan in de kunstlijst van de stad, maar zijn niet recent gezien.
    sources:
      - https://nos.nl/artikel/2197968-gestolen-minerva-beeld-duikt-na-jaren-weer-op-en-iedereen-kan-het-nu-zien.html
      - https://nl.wikipedia.org/wiki/Jan_Havermans
      - https://buitenkunstamsterdam.nl/kunstwerken/bekijk/1915
      - https://buitenkunstamsterdam.nl/kunstwerken/bekijk/2494
      - https://stadscuratorium.nl/advice/bosgod-apollolaan/

# ================================================================ Hoofddorppleinbuurt and Schinkelbuurt

- title: Pontus and the transformer house, Hoofddorpplein
  summary: A concrete dog that used to watch the IJ ferries now sits on the Hoofddorpplein. The transformer house next to him has lost its art twice, once to the tram and once to the wrecking crew, and is on its third work.
  body: |
    The dog on the Hoofddorpplein is called Pontus because he used to live by the pont, the ferry. Tom Claassen made him in 2007 for the bank of the IJ behind Central Station, a concrete dog almost as tall as a man. He sat at the ferry landing to warn passers-by that the quay was one long building site full of holes and bumps. A wooden structure on a pontoon nearby was turned into his kennel, and a card round his neck asked for a name. In 2016 yet another rebuilding of the waterfront drove him out, and he moved here without the kennel. Claassen means him to be stroked.

    Beside him stands a small transformer house with a history of its own. Martijn Sandberg once covered it in aluminium panels with the words "Power To The People" in yellow letters that lit up in the headlights of passing cars; it was taken off because the tram ran too close. In 2011 Fabrice Hünd gave the house a mosaic, "Hoofdzaak Liefde", made of crockery and glass that neighbours brought him. In October 2020 the house itself was demolished and replaced, and the mosaic went with it. Since 2021 the new house carries "Empower yourself" by Johan Moorman, a former graffiti writer, chosen by residents from three designs.

    Look for:
    - Pontus in the planted middle of the square
    - the red pixels on the transformer house, the colour of the brick around the square, and the little staircases
    - in the west wall of the square, the stump of the tall, slim tower that was pulled down in the 1970s
  category: street-art
  lat: 52.351124
  lng: 4.849829
  address: Hoofddorpplein
  links:
