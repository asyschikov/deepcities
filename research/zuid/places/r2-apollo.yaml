  nl:
    title: Pontus en het trafohuisje, Hoofddorpplein
    summary: Een betonnen hond die vroeger op de IJ-ponten lette, zit nu op het Hoofddorpplein. Het transformatorhuisje naast hem raakte twee keer zijn kunst kwijt, een keer door de tram en een keer door de sloper, en is aan zijn derde werk toe.
    body: |
      De hond op het Hoofddorpplein heet Pontus omdat hij vroeger bij de pont woonde. Tom Claassen maakte hem in 2007 voor de IJ-oever achter het Centraal Station: een betonnen hond, bijna zo hoog als een mens. Hij zat bij de aanlegplaats van de veren om voorbijgangers te waarschuwen dat de kade één lange bouwput vol gaten en hobbels was. Een houten bouwsel op een ponton vlakbij werd zijn hok, en op een kaartje om zijn nek stond waar je een naam kon insturen. In 2016 joeg de zoveelste herinrichting van de oever hem weg en verhuisde hij hierheen, zonder hok. Claassen wil dat hij geaaid wordt.

      Naast hem staat een transformatorhuisje met een eigen geschiedenis. Martijn Sandberg bekleedde het ooit met aluminium panelen met de tekst 'Power To The People', in gele letters die oplichtten in de koplampen van passerende auto's. Het werk is weggehaald omdat de tram te dicht langs het huisje reed. In 2011 gaf Fabrice Hünd het huisje een mozaïek, 'Hoofdzaak Liefde', van serviesgoed en glas dat buurtbewoners kwamen brengen. In oktober 2020 werd het huisje zelf gesloopt en vervangen, en het mozaïek ging mee. Sinds 2021 staat op het nieuwe huisje 'Empower yourself' van Johan Moorman, zelf begonnen als graffitischrijver; de buurt koos het uit drie ontwerpen.

      Let op:
      - Pontus in het plantsoen midden op het plein
      - de rode pixels op het trafohuisje, in de kleur van de baksteen rond het plein, en de trapjes
      - in de westwand van het plein de aanzet van de hoge, slanke toren die in de jaren zeventig is afgebroken
    sources:
      - https://nl.wikipedia.org/wiki/Pontus_(Tom_Claassen)
      - https://nl.wikipedia.org/wiki/Empower_yourself
      - https://nl.wikipedia.org/wiki/Hoofddorpplein
      - https://buitenkunstamsterdam.nl/kunstwerken/bekijk/2231

- title: Modern girl with a pearl, Eerste Schinkelstraat
  summary: "This mural covers a whole end wall of about 117 square metres with Vermeer's Girl with a Pearl Earring, painted by the Hague street artist Beyond after a resident asked for it and the neighbours chose the design."
  body: |
    A resident of the Schinkelbuurt had the idea and asked the street artist Roelof Schierbeek, who works as Beyond. He showed the neighbourhood three designs, and the neighbourhood picked the one after Vermeer's "Girl with a Pearl Earring".

    The choice has a small joke in it. The real Girl has belonged to the Mauritshuis in The Hague since 1902 and was shown in Amsterdam only for a while. Schierbeek is from The Hague too. He brought her to an end wall of about 117 square metres, where she can stay.

    The painting has been on the wall since January 2024 at the latest. It fills a blind end wall on the Eerste Schinkelstraat, between the Amstelveenseweg and the Schinkel, and can be seen at any time from the street.

    Look for:
    - the turban and the pearl at house height
    - how the window-less end wall of an ordinary block of flats sets the size of the portrait
