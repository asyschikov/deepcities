  nl:
    title: De wildplasser, ASV Arsenal
    summary: Toen amateurclub ASV Arsenal in 2011 een nieuw terrein kreeg, vroeg de club elf kunstenaars (een elftal) om de reclameborden te vervangen door kunst over sport. Erik Kessels kwam met een clublid dat langs het veld staat te plassen.
    body: |
      Naast het veld van amateurvoetbalclub ASV Arsenal staat een man met zijn rug naar de wedstrijd te doen wat een amateurvoetballer die even nodig moet langs het veld doet. Het is een beeld. Een ouder lid van de club stond er model voor.

      Arsenal verhuisde in 2011 naar dit terrein achter het Olympisch Stadion. Onder de naam 'Terreinwinst' vroeg de club een elftal kunstenaars om werk te maken voor de vereniging en de buurt. Er waren twee voorwaarden: het moest over sport gaan, en het moest een tijdlang de reclameborden vervangen die rond het veld de boventoon voerden. Erik Kessels, van communicatiebureau KesselsKramer, zag het verband tussen de voetballer die even nodig moet en een woord dat zelf nog jong was: buiten plassen doen mensen al eeuwen, maar 'wildplassen' kwam pas in de jaren negentig in de taal.

      Andere bijdragen waren een megafoon in de vorm van een afgeknotte kegel, voor de schreeuwende ouders langs de lijn, en een rij kuipstoeltjes op hoge palen voor de rustiger toeschouwers.

      Het beeld staat aan de rand van het sportterrein aan het IJsbaanpad en is vanaf het openbare pad te zien.

      Let op:
      - de figuur bij het hek, met de rug naar het veld
      - het Olympisch Stadion achter het terrein: de velden horen bij het stadiongebied
    attributes:
      check_note: Voor het laatst gefotografeerd in 2014 en sindsdien op de kaart; of de megafoon en de stoeltjes op palen van hetzelfde project er nog staan, is onbekend.
    sources:
      - https://nl.wikipedia.org/wiki/De_wildplasser

# ================================================================ Apollobuurt: public art

- title: The Regenerator, a Marina Abramović to sit on
  summary: "On a shopping-street corner lies a copper disc two metres across with seven minerals set in it. The instructions are in the pavement: sit on one of the minerals, regenerate, time unlimited. It is a work by Marina Abramović, used as a bench."
  body: |
    On the corner of the Beethovenstraat and the Gerrit van der Veenstraat lies a copper disc two metres across and forty centimetres high, like a giant draughts piece. It is divided into segments, and each holds a different mineral.

    Abramović, the Serbian performance artist, made it in 2001. Her idea was that life in big cities keeps speeding up and that people are afraid of doing nothing; the artist's job is to connect them with nature again. Each stone gets its own effect: agate against fear, rhodonite for calm and dignity, labradorite for new energy, rose quartz for heartache, red jasper for ease with your own sexuality, yellow jasper for the hormones and tiger's eye for communication. She traced the thought to her travels, among them her walk along the Great Wall of China, where she noticed that each kind of ground under her feet brought a different state of mind.

    The user's manual is set into the pavement beside it, in the same copper. The square is a tram crossing and a hangout for pupils of the school nearby. By 2017 the disc had been screened off by a bench with the wooden letters BE on it.

    Look for:
    - the seven coloured stones in the copper
    - the instruction in the pavement: sit on one of the minerals, regenerate, for an unlimited time
    - the word "Regeneration", twice on the rim and worn almost away
  category: street-art
  lat: 52.349058
  lng: 4.877526
  address: Beethovenstraat, corner of Gerrit van der Veenstraat (north-east side)
