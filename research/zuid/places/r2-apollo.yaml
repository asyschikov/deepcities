  nl:
    title: 11 Rue Simon Crubellier, een huiskamer op het Stadionplein
    summary: Op het Stadionplein staat een appartement zonder muren, gegoten in brons en beton. Matthew Darbyshire richtte het in met wat buurtbewoners uit een catalogus kozen en noemde het naar het adres van het huis uit de roman van Georges Perec.
    body: |
      Op het Stadionplein staat een appartement zonder muren, zonder dak en zonder huur. De Britse kunstenaar Matthew Darbyshire liet buurtbewoners een 'droomappartement' inrichten: ze kozen de spullen uit een digitale catalogus, en hij liet hun keuzes gieten in brons en beton. Het plein heeft nu dus een bank die niemand kan verschuiven: een Klippan van IKEA, naast een opvallende Carlton-kast van Ettore Sottsass, een ouderwetse telefoon en een fiets.

      De titel is een adres. Rue Simon-Crubellier 11 is het Parijse appartementengebouw uit de roman 'Het leven een gebruiksaanwijzing' (1978) van Georges Perec, die een huis kamer voor kamer doorloopt en opsomt wat er staat. Darbyshire deed hetzelfde met één kamer in Amsterdam-Zuid.

      Het werk was het sluitstuk van de vernieuwing van het plein. Dat deel van het plein is tussen 2010 en 2019 bebouwd; het werk staat op een groenstrook. In oktober 2018 werd het meubilair geplaatst en de buurt kreeg een housewarming.

      Het is een openbare huiskamer, op elk uur van de dag.

      Let op:
      - de Klippan-bank en de kast van Sottsass
      - de telefoon en de fiets
      - het uitzicht over de meubels op de Marathontoren van het stadion
    sources:
      - https://stadscuratorium.nl/collectie/11-rue-simon-crubellier-2/
      - https://nl.wikipedia.org/wiki/Stadionplein

- title: De wildplasser, ASV Arsenal
  summary: When the amateur football club ASV Arsenal got a new ground in 2011, it asked eleven artists (one team) to replace the advertising boards with art about sport. Erik Kessels sent a club member relieving himself at the edge of the pitch.
  body: |
    Beside the pitch of the amateur football club ASV Arsenal a man stands with his back to the game, doing what an amateur footballer who cannot wait does at the side of the pitch. He is a statue. "De wildplasser" means the man who urinates in public, and an older member of the club stood model for him.

    Arsenal moved to this ground behind the Olympic Stadium in 2011. Under the name "Terreinwinst" (ground gained) the club asked a team of eleven artists to make work for the club and the neighbourhood. There were two conditions: it had to be about sport, and it had to take the place, for a while, of the advertising boards that dominated the ground. Erik Kessels, of the communications agency KesselsKramer, saw the link between the footballer who cannot wait and a word that was itself new: people have relieved themselves outdoors for centuries, but "wildplassen" only entered the language in the 1990s.

    Other contributions were a megaphone shaped like a cut-off cone, for the shouting parents on the touchline, and a row of stadium seats on tall poles for the quieter spectators.

    The statue stands at the edge of the sports ground on the IJsbaanpad and is seen from the public path.

    Look for:
    - the figure at the fence, facing away from the pitch
    - the Olympic Stadium behind the ground: the fields here are part of its grounds
  category: street-art
  lat: 52.341148
  lng: 4.851549
  address: IJsbaanpad, at ASV Arsenal
