  nl:
    title: Amsterdamse School
    tagline: Baksteenexpressionisme in Amsterdam, 1911–1940 — arbeiderspaleizen, bruggen, scholen en badhuizen.
    description: >-
      Een kaart van de Amsterdamse School, in de spelling van toen de
      Amsterdamsche School: de expressieve baksteenarchitectuur die Amsterdam
      tussen ruwweg 1911 en 1940 een eigen gezicht gaf. Gebeeldhouwd metselwerk,
      golvende gevels, torentjes, trapvensters en beeldhouwwerk dat één geheel
      vormt met het gebouw maakten van sociale woningbouw 'arbeiderspaleizen'.
      De Dienst der Publieke Werken bracht de stijl naar scholen, badhuizen,
      gemalen en honderden bruggen. De plekken komen uit het rijksmonumentenregister
      (RCE), het gemeentelijk monumentenregister en Wikidata; de achtergrondverhalen
      op deze kaart gaan over de geschiedenis van de beweging, de architecten en
      waar je op moet letten.
