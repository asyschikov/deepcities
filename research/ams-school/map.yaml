# Map settings for the Amsterdamse School map (collection.create / updateSettings).
# Spelling: "Amsterdamse School" is the modern Dutch spelling (post-1947 spelling
# reform); "Amsterdamsche School" is the original period spelling, used when the
# term was coined (Jan Gratama, 1916). English: "Amsterdam School".
slug: amsterdamse-school
title: Amsterdamse School
tagline: Brick expressionism in Amsterdam, 1911–1940 — housing palaces, bridges, schools and bathhouses.
city: Amsterdam
centerLat: 52.3600
centerLng: 4.8900
zoom: 12.5
contributionPolicy: open
description: >-
  A map of the Amsterdam School (Amsterdamse School, originally spelled
  Amsterdamsche School): the Dutch brick expressionism that shaped Amsterdam
  between roughly 1911 and 1940. Sculpted brick, undulating façades, towers,
  stair-step windows and integrated sculpture turned social housing into
  "workers' palaces", and the city's Public Works department carried the style
  into schools, bathhouses, pumping stations and hundreds of bridges.
  Places come from the national monument register (RCE), the City of
  Amsterdam monument register and Wikidata; read the map's documents for the
  movement's history, its architects and what to look for.
categories:
  - { key: housing, label: Housing blocks, color: "#b45309" }
  - { key: houses, label: Villas & houses, color: "#a16207" }
  - { key: schools, label: Schools, color: "#2563eb" }
  - { key: public-works, label: Public buildings & utilities, color: "#0f766e" }
  - { key: bridges, label: Bridges, color: "#0369a1" }
  - { key: religious, label: Churches & synagogues, color: "#7c3aed" }
  - { key: commercial, label: Offices & shops, color: "#be123c" }
  - { key: culture, label: Cinemas, theatres & sport, color: "#a21caf" }
  - { key: ensembles, label: Squares & garden villages, color: "#15803d" }
fields:
  - key: heritage_status
    label: Heritage status
    type: select
    options: [National monument, Municipal monument, National + municipal monument, Not listed]
    help: Official listing — rijksmonument (national) and/or gemeentelijk monument (municipal).
  - key: monument_number
    label: Monument number
    type: text
    help: Register number(s), comma-separated.
  - key: built
    label: Built
    type: text
    help: Year or range, e.g. 1917–1920.
  - key: architect
    label: Architect
    type: text
  - key: client
    label: Commissioned by
    type: text
    help: Client, e.g. a housing association (woningbouwvereniging) or the city.
  - key: artists
    label: Sculptors & artists
    type: text
    help: Sculpture, stained glass, ironwork — e.g. Hildo Krop.
  - key: style_phase  # key is permanent; the field is shown as "Style"
    label: Style
    type: select
    options: [Forerunner, Expressive, Pared-down, Modernist mix]
    help: "How it looks: Forerunner (the rationalism it grew out of), Expressive (rippling walls, towers, sculpture), Pared-down (flat walls, little ornament), Modernist mix."
    filter: true
  - key: original_use
    label: Original use
    type: text
  - key: listed
    label: Listed in
    type: number
    help: Year it was designated a monument.
# Content languages: the base texts above are English; Dutch is written
# natively (not translated) in collection.translations.nl.
language: en
languages: [nl]
