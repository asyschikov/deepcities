title: Het Schip and the Spaarndammerbuurt
summary: |
  A short walk from the Haarlemmerplein into the Spaarndammerbuurt, where Michel de Klerk built three housing blocks in a row and the Amsterdam School first reached the street. It ends at Het Schip, the wildest of the three and home of the style's museum.
body: |
  **Start:** the café on the corner of the Haarlemmerplein, at the western edge of the old centre, about 25 minutes' walk from Centraal Station. **End:** the Zaandammerplein, two minutes from Het Schip.

  **Distance and time:** about 2 km, an hour at an easy pace. Add an hour or more if you visit Museum Het Schip, which is closed on Mondays (check its current opening hours before you go). Its guided tours take you into Het Schip's courtyard and past De Klerk's earlier blocks; without a tour the courtyard stays closed.

  **What you can go inside:** the café at the start and the museum (the restored 1920s post office, a furnished workers' flat and exhibitions). Everything else is housing, seen from the street. The route is flat and at street level throughout.

  In 1913 a young draughtsman called Michel de Klerk got his first big housing commission on a new little park, the Spaarndammerplantsoen. Over the next seven years he built three blocks around it, each bolder than the last: a calm brick "castle" for a private builder, a freer block for the socialist housing association Eigen Haard, and finally Het Schip, the high point of the whole movement. This walk follows that sequence. On the way you also see how the neighbours had to fit in around him, and how the city's own Public Works department framed the district with a sculpted railway bridge and a school.
mode: walk
photos: ["commons:File:Amsterdam Het Schip 006.JPG"]
nl:
  title: Het Schip en de Spaarndammerbuurt
  summary: |
    Een korte wandeling van het Haarlemmerplein naar de Spaarndammerbuurt, waar Michel de Klerk drie woningblokken na elkaar bouwde en de Amsterdamse School de straat op ging. Eindpunt is Het Schip, het wildste van de drie en het museum van de stijl.
  body: |
    **Start:** het café op de hoek van het Haarlemmerplein, aan de westrand van de binnenstad, zo'n 25 minuten lopen van Centraal Station. **Eind:** het Zaandammerplein, twee minuten van Het Schip.

    **Afstand en tijd:** ongeveer 2 km, een uur op je gemak. Reken een uur of meer extra als je Museum Het Schip bezoekt; het museum is op maandag dicht (kijk voor je gaat even naar de actuele openingstijden). Met een rondleiding kom je op het binnenterrein van Het Schip en langs De Klerks eerdere blokken; zonder rondleiding blijft het binnenterrein dicht.

    **Binnen kijken:** het café bij de start en het museum, met het gereconstrueerde postkantoor, een ingerichte woning uit de jaren twintig en tentoonstellingen. De rest is woningbouw, te zien vanaf de straat. De route is vlak en ligt helemaal op straatniveau.

    In 1913 kreeg de jonge tekenaar Michel de Klerk zijn eerste grote woningbouwopdracht, aan het nieuwe Spaarndammerplantsoen. In zeven jaar bouwde hij daar drie blokken, steeds vrijer: een rustige bakstenen 'burcht' voor een aannemer, een losser blok voor de sociaaldemocratische woningbouwvereniging Eigen Haard en ten slotte Het Schip, het hoogtepunt van de hele stroming. Deze wandeling volgt die reeks. Onderweg zie je ook hoe de buren zich moesten voegen naar De Klerk, en hoe de Dienst der Publieke Werken de buurt omlijstte met een spoorbrug vol beeldhouwwerk en een school.
stops:
  - place: Café on the Haarlemmerplein (Haarlemmerplein 31)
    narration: |
      Start with a coffee, and look at the café front before you go in. It was added in 1929 by Fred. Huisman jr. to a shop-and-flats building of 1894: polished granite running round the corner like a plinth, piers in block bond, and rows of leaded-glass fanlights over the windows. The city register calls it "sober but expressive" Amsterdam School.

      It is a late, modest piece of the style. By 1929 the Amsterdam School had become a vocabulary any architect could apply to a shopfront. This walk goes back to where that vocabulary was invented, fifteen years earlier and a short walk north.
    nl: |
      Begin met een kop koffie, maar kijk eerst naar de pui. Die kwam er in 1929, toen Fred. Huisman jr. de banketbakkerij in dit winkelhuis uit 1894 tot café verbouwde: gepolijst graniet dat als een basement om de hoek loopt, penanten in blokverband en rijen glas-in-loodbovenlichten. Het register spreekt van een "sobere maar expressieve Amsterdamse Schooltrant".

      Het is laat en bescheiden werk. In 1929 was de Amsterdamse School een vormentaal geworden waarmee elke architect een café kon aankleden. Deze wandeling gaat terug naar de plek waar die vormentaal ontstond, vijftien jaar eerder en een paar minuten noordelijker.
  - place: Willemsbrug (Brug 151)
    narration: |
      The bridge over the Singelgracht is by Piet Kramer, who worked alongside Michel de Klerk in Eduard Cuypers' office and would later share the De Dageraad commission with him. Kramer designed it in 1925 and it was built in 1928–1929.

      Its predecessor was notorious: it had no overhead wire, so trams had to coast across, and on 2 January 1924 a tram on line 18 skidded in the snow, through the railing and into the water. Look at Kramer's brick and natural-stone abutments, and at the neoclassical Willemspoort of 1840 beside them, the city gate the bridge is named after.
    nl: |
      De brug over de Singelgracht is van Piet Kramer, die op het bureau van Eduard Cuypers naast Michel de Klerk werkte en later samen met hem De Dageraad ontwierp. Kramer tekende de brug in 1925; ze werd gebouwd in 1928-1929.

      De oude brug was berucht bij trambestuurders. Er hing geen bovenleiding, dus trams moesten met een aanloop oversteken, en op 2 januari 1924 belandde een motorwagen van lijn 18 door sneeuw en ijs via de balustrade in de Singelgracht. Let op de landhoofden van baksteen en natuursteen, en op de Willemspoort ernaast, waar de brug naar is vernoemd.
    next:
      directions: Cross the bridge and head north to the railway bridge.
      nl: Steek de brug over en loop noordwaarts naar de spoorbrug.
  - place: Spaarndammerspoorbrug
    narration: |
      This is the front door of the Spaarndammerbuurt. Arend Jan Westerman of Public Works designed the railway bridge, finished in 1922, and the city sculptor Hildo Krop gave it four sculpture groups: Abundance (people, fruit and the god Pan) and Traffic (workers with hoses).

      Coming from the south you first meet the concrete half added in the 1990s, with large lettering of 2010–2011 by Janno Hahn based on Amsterdam School typography. Walk through to the older brick half to find Krop's groups on the abutments. By the time it was finished, De Klerk's first two blocks were already standing on the other side.
    nl: |
      Dit is de voordeur van de Spaarndammerbuurt. Arend Jan Westerman van de Dienst der Publieke Werken ontwierp de spoorbrug, die in 1922 klaar was, en stadsbeeldhouwer Hildo Krop maakte er vier beeldengroepen voor: Overvloed (mensen, vruchten en Pan) en Verkeer (arbeiders met slangen).

      Uit het zuiden kom je eerst langs het betonnen deel uit de jaren negentig, met de grote belettering van Janno Hahn (2010-2011), geïnspireerd op de typografie van de Amsterdamse School. Loop door naar het oude bakstenen deel voor de beelden van Krop op de landhoofden. Toen de brug klaar was, stonden De Klerks eerste twee blokken aan de overkant er al.
    next:
      directions: Walk on under the railway into the Spaarndammerbuurt, to the little park of the Spaarndammerplantsoen. Stand in the park facing its north side.
      nl: Loop onder het spoor door de Spaarndammerbuurt in, naar het Spaarndammerplantsoen. Ga in het plantsoen staan met je gezicht naar de noordkant.
  - place: Spaarndammerplantsoen, De Klerk's first block
    narration: |
      This is where it started. In 1913 De Klerk got his first big job here: rented workers' flats on the north side of the new park. The client was not a housing association but the building contractor Klaas Hille, for whom he had worked before.

      The national register calls the block closed and "castle-like", with fairly quiet architecture, and from here it does look restrained. But look at how it is treated as one mass rather than a row of houses. Four entrance bays run the full height of the long front and end in parabolic tops; in the middle the top floor is clad in timber; on the outer façades the upper zone is hung with terracotta tiles. The Belgian architect Huib Hoste called it "one life of form and colour". Many of the fine glazing bars in the windows have since gone.
    nl: |
      Hier begon het. In 1913 kreeg De Klerk zijn eerste grote opdracht: huurwoningen voor arbeiders aan de noordkant van het nieuwe plantsoen. Opdrachtgever was geen woningbouwvereniging maar aannemer Klaas Hille, voor wie hij al eerder had gewerkt.

      Het register spreekt van een blok "van gesloten, burchtachtig karakter en vrij rustige architectuur", en zo oogt het vanaf hier ook. Toch is het hele blok al als één massa opgevat, niet als een rij huizen. Vier ingangsrisalieten lopen door tot bovenaan en eindigen in een parabool; in het midden is de bovenste verdieping met hout bekleed, en op de buitengevels zit in de bovenste zone terracotta. De fijne roedenverdeling van de ramen is grotendeels verdwenen.
  - place: Spaarndammerplantsoen, De Klerk's second block
    narration: |
      Now turn round. Facing the first block across the park is De Klerk's second, his first for the socialist housing association Eigen Haard (Our Own Hearth). The register dates it to 1914; most literature gives a design of 1915–1916.

      The difference is obvious. Red and yellow brick are used, in the register's words, "here and there clearly non-constructively"; the round corner bays are clad in terracotta tiles; and at the corner with the Wormerveerstraat the roofs make no structural sense at all. Three entrance bays run up to the roof, and the original planked front doors survive.

      The plan was for three blocks to enclose the park. Once this one took the south side, the third had to move to a leftover triangle by the railway. That is where this walk ends.
    nl: |
      Draai je nu om. Tegenover het eerste blok staat het tweede, De Klerks eerste voor de sociaaldemocratische woningbouwvereniging Eigen Haard. Het register dateert het op 1914, de literatuur meestal op een ontwerp uit 1915-1916.

      Het verschil zie je meteen. Rode en gele baksteen zijn "hier en daar duidelijk onconstructief toegepast", de ronde hoekuitbouwen zijn met terracotta tegels bekleed, en op de hoek met de Wormerveerstraat zijn de daken bewust onconstructief. Drie ingangspartijen lopen door tot het dak, en de oorspronkelijke beplankte voordeuren zijn er nog.

      Het idee was dat drie blokken het plantsoen zouden omsluiten. Toen dit blok de zuidkant innam, moest het derde uitwijken naar een overgebleven driehoek tegen het spoor. Daar eindigt deze wandeling.
  - place: Spaarndammercarré (Gulden & Geldmaker)
    narration: |
      Right next to De Klerk's blocks, Zeger Gulden and Melle Geldmaker built four corner blocks in 1916–1921 for the housing association Amsterdam-Zuid. Their job was awkward, and the city's aesthetics committee debated at length how they should meet De Klerk's work. The city register adds that De Klerk himself did not find the result disturbing.

      The strip block on the Knollendamstraat next to De Klerk is the quietest, probably out of deference. The other three step their façades and roofs forward and back, and at the corner of the Knollendamstraat and Polanenstraat two cut-off corners make a little square. Gulden and Geldmaker were housing specialists who drew the floor plans for other architects' façades; here you see their own.
    nl: |
      Pal naast De Klerk bouwden Zeger Gulden en Melle Geldmaker in 1916-1921 vier hoekblokken voor woningbouwvereniging Amsterdam-Zuid. Geen makkelijke opdracht: in de Schoonheidscommissie en onder de architecten werd lang gediscussieerd over de aansluiting op De Klerks werk. Volgens de gemeentelijke beschrijving vond De Klerk het resultaat zelf niet storend.

      Het strookvormige blokje aan de Knollendamstraat, naast De Klerk, is het rustigst, waarschijnlijk uit respect. De andere drie hebben verspringende gevels en dakpartijen, en op de hoek Knollendamstraat/Polanenstraat maken twee afgeschuinde hoeken een soort pleintje. Gulden en Geldmaker tekenden vaak de plattegronden achter de gevels van anderen; hier zie je hun eigen gevels.
  - place: Polanenstraat block and Polanentheater
    narration: |
      Not everyone here was socialist. This long block of 1920–1922 was built for the Protestant housing association Patrimonium by Tjeerd Kuipers and Arnold Ingwersen, who worked mostly for Protestant clients. At its heart, joining the two street walls like the crossbar of an H, is the former Calvinist Rehoboth school, now the Polanentheater.

      Look for the little corner turrets either side of the wide opening in the Polanenstraat, and the three colours of brick: dark red at the base, light yellow above and green glazed accents. Through the opening, on the school front facing the courtyard, is a granite doorway in the silhouette of an Egyptian temple. Socialist or Protestant, the housing associations of this neighbourhood both built in the new style.
    nl: |
      Niet iedereen hier was socialist. Dit lange blok uit 1920-1922 werd gebouwd voor de protestantse woningbouwvereniging Patrimonium, naar ontwerp van Tjeerd Kuipers en Arnold Ingwersen, die vooral voor de gereformeerde zuil werkten. In het hart, als de dwarsbalk van een H tussen de twee straatwanden, ligt de voormalige gereformeerde Rehobothschool, sinds 1971 het Polanentheater.

      Let op de hoektorentjes aan weerszijden van de brede doorgang in de Polanenstraat, en op de drie kleuren baksteen: donkerrood voor de plint, lichtgeel erboven en groen geglazuurd als accent. Door de doorgang zie je de schoolgevel met een granieten portaal in het silhouet van een Egyptiserend tempelfront. Socialistisch of protestants: de woningbouwverenigingen in deze buurt bouwden allebei in de nieuwe stijl.
  - place: Het Schip
    narration: |
      Here is the third block, and the wildest. De Klerk built it in 1917–1920 for Eigen Haard on the leftover triangle by the railway, and locals named it for its prow-like shape. The national register calls it one of the most "irrational" highlights of the movement, and means it as praise.

      Compare it with the first block you saw, by the same architect a few years earlier. The brick now ripples in bright red and orange, roof tiles hang vertically like scales, the corner bays swell into barrels, and on the low entrance wing stands a slender tower that does nothing at all except mark the way into the courtyard. A postcard of a tower De Klerk sent from Copenhagen is often linked to it.

      Behind the show is a social programme. The 102 flats had separate rooms, their own toilets and plenty of light. At the sharp end of the block De Klerk put a small post office with a public telephone, so residents no longer had to go into town to post a letter or make a call. An existing school was wrapped into the block, and in the courtyard stands a small meeting hall of 1920.

      Museum Het Schip has occupied the post office since 2001, and since 2016 also the old school at Oostzaanstraat 45. Inside you can see the post office with its waiting bench and the telephone booth marked SPREEK ("speak"), and a furnished flat. De Klerk died in 1923, on his 39th birthday.
    nl: |
      Dit is het derde blok, en het wildste. De Klerk bouwde het in 1917-1920 voor Eigen Haard op de overgebleven driehoek tegen het spoor; in de buurt kreeg het door zijn vorm de bijnaam Het Schip. Het rijksmonumentenregister noemt het "een der irrationeelste hoogtepunten van de tweede fase der Amsterdamse School".

      Vergelijk het met het eerste blok, van dezelfde architect, een paar jaar eerder. Het metselwerk golft nu in helrood en oranje, de dakpannen hangen verticaal als schubben, de hoekerkers zwellen op tot tonnen, en op de lage toegangsvleugel staat een slank torentje dat nergens voor dient, behalve om de poort naar het binnenterrein te markeren.

      Achter het spektakel zit een sociaal programma. Arbeidersgezinnen kregen lichte woningen met aparte kamers en een eigen wc. In de punt van het blok kwam een postkantoortje met telefooncel, zodat bewoners niet meer de stad in hoefden voor een brief of een telefoontje. Een bestaande school werd in het blok opgenomen, en op het binnenterrein staat een vergadergebouwtje uit 1920.

      Sinds 2001 zit Museum Het Schip in het postkantoor en sinds 2016 ook in de oude school aan de Oostzaanstraat 45. Binnen zie je het postkantoor met de wachtbank voor arbeiders en de telefooncel met het woord SPREEK, en een ingerichte woning. De Klerk overleed in 1923, op zijn 39ste verjaardag.
  - place: Spitsbergenschool, Zaandammerplein
    narration: |
      End on the enclosed Zaandammerplein, just north of Het Schip. The primary school standing slightly forward of the flats was built by Public Works in 1923, the year De Klerk died, and it shows where the style was heading: calmer, symmetrical, "sober".

      The Amsterdam School is still there in the details. Either side of the projecting centre, with the gym's broad window upstairs, is a parabolic porch under a stepped brick crest (*hanekam*, cockscomb), trimmed in Bavarian granite, with wrought-iron gates and original doors. The corner chimneys have a concave notch. The housing framing the square, along the Hembrugstraat, is by Gerrit Jan Rutgers (1925). From here it is two minutes back to the museum.
    nl: |
      De wandeling eindigt op het omsloten Zaandammerplein, net ten noorden van Het Schip. De school die iets naar voren staat ten opzichte van de woningen werd in 1923 door Publieke Werken gebouwd, het jaar waarin De Klerk overleed. Je ziet hier waar de stijl naartoe ging: rustiger, symmetrisch, sober.

      In de details is de Amsterdamse School er nog volop. Aan weerszijden van het vooruitspringende middendeel, met het brede gymzaalraam op de verdieping, zit een paraboolvormig portiek onder een hanekam, gedetailleerd in Beiers graniet, met smeedijzeren hekken en de oorspronkelijke deuren. De hoekschoorstenen hebben een concave uitsparing. De woningen rond het plein aan de Hembrugstraat zijn van Gerrit Jan Rutgers (1925). Het museum is twee minuten terug.
