title: 'Plan West: Mercatorplein and the Baarsjes'
summary: >-
  Walk the Hoofdweg as its planners meant it, a row of street "rooms" by Kramer, Rutgers, Berlage
  and Wijdeveld around the Mercatorplein. Then the side streets: churches, schools, shops and a
  bridge, the sober Amsterdam School at neighbourhood scale.
body: |
  **Start:** the crossing of the Hoofdweg and the Postjesweg, at Piet Kramer's six-storey corner blocks.
  **End:** the Vierwindstrekenbrug on the Jan van Galenstraat, by the Erasmuspark.
  **Distance and time:** about 4 km. Allow about 2 hours with stops.

  Tram 13 runs along the Jan Evertsenstraat and stops at the Mercatorplein, so you can join or leave the walk halfway. The route is flat and on pavements all the way. This is a living neighbourhood, and nearly everything is seen from the street. The Jeruzalemkerk is still a working church, and the shops on the Jan Evertsenstraat and around the Mercatorplein are livelier in the daytime.

  In 1921 Amsterdam annexed the village of Sloten and its farmland west of the Kostverlorenvaart. A committee of three (the architects Jan Gratama and Gerrit Versteeg and A.R. Hulshoff of Public Works) reworked Sloten's extension plans. In 1922 they presented Plan West: about 6,000 working-class homes, with the old Hoofdweg as the spine and the Mercatorplein halfway along as the centre.

  It was built fast, mostly in 1925–1927, by the contractor H. van der Schaar. One office, Gulden & Geldmaker, drew the floor plans. The famous architects designed only the street fronts, which colleagues mocked as *schortjesarchitectuur* (apron architecture). Each architect usually got both sides of a street, so the Hoofdweg reads as a sequence of rooms. The style is the sober, pared-down Amsterdam School, with schools and churches set into the blocks. The walk follows the Hoofdweg north through those rooms, takes a detour east through the side streets, and ends at a Piet Kramer bridge.
mode: walk
nl:
  title: 'Plan West: het Mercatorplein en de Baarsjes'
  summary: >-
    Over de Hoofdweg zoals de ontwerpers hem bedoelden: een reeks straatwanden van Kramer, Rutgers,
    Berlage en Wijdeveld rond het Mercatorplein. Daarna de zijstraten met kerken, scholen, winkels
    en een brug: de verstrakte Amsterdamse School op buurtniveau.
  body: |
    **Start:** de kruising van de Hoofdweg en de Postjesweg, bij de zeslaagse hoekblokken van Piet Kramer.
    **Eind:** de Vierwindstrekenbrug in de Jan van Galenstraat, bij het Erasmuspark.
    **Afstand en duur:** ongeveer 4 kilometer, met stops zo'n twee uur.

    Tram 13 rijdt door de Jan Evertsenstraat en stopt bij het Mercatorplein, zodat je halverwege kunt in- of uitstappen. De route is vlak en gaat over de stoep. Dit is een gewone woonwijk; bijna alles bekijk je vanaf de straat. De Jeruzalemkerk is nog altijd in gebruik, en de winkels in de Jan Evertsenstraat en rond het Mercatorplein maken de wandeling overdag het levendigst.

    Op 1 januari 1921 annexeerde Amsterdam de gemeente Sloten. Een commissie van drie, A.R. Hulshoff van Publieke Werken en de architecten Jan Gratama en Gerrit Versteeg, bewerkte de oude Slotense uitbreidingsplannen en presenteerde in 1922 Plan West, ook wel het 6000-woningenplan. Het oude slotenpatroon bleef staan, de Hoofdweg werd de ruggengraat en het Mercatorplein het middelpunt.

    De bouw ging snel, grotendeels tussen 1925 en 1927, met aannemer H. van der Schaar. De plattegronden lagen al vast bij bureau Gulden & Geldmaker; Berlage, Kramer, Wijdeveld, Staal, Van der Mey, Rutgers en Roodenburgh mochten alleen de gevels tekenen. Vakgenoten spraken spottend van schortjesarchitectuur. Meestal kreeg één architect beide kanten van een straat, zodat de Hoofdweg leest als een reeks kamers. De wandeling volgt de Hoofdweg naar het noorden, maakt een lus door de zijstraten en eindigt bij een brug van Kramer.
stops:
  - place: Hoofdweg housing by Piet Kramer
    narration: |
      You are standing at the southern gate of Plan West. Where the Hoofdweg crosses the Postjesweg, Piet Kramer's blocks rise to six storeys and act as gateway buildings. Kramer, co-author of the Scheepvaarthuis and the Spaarndammerbuurt housing, designed both sides of the street in 1923, and they were finished by 1925. Giving both sides to one architect was the committee's policy: the Hoofdweg was to read as a single avenue leading to the Mercatorplein.

      Walk north and watch the entrances. The doorways are grouped four at a time under shared canopies, held up by sculpted brick piers with wooden ornaments. The blind stairwell strips run up to the roof and end there in pylon-like tops with wavy bands.

      Compared with his Spaarndammerbuurt work Kramer is restrained here: long, flat walls with seemingly endless rows of windows. The red-brick block on the east side, between the Postjesweg and the Davisstraat, is the most richly detailed.
    nl: |
      Hier begint Plan West. Op de kruising met de Postjesweg tellen de blokken van Piet Kramer zes lagen en werken ze als poortgebouwen. Kramer, medeontwerper van het Scheepvaarthuis en van de Spaarndammerbuurt, tekende in 1923 de gevels aan weerszijden van de zuidelijke Hoofdweg; in 1925 waren ze klaar. Dat tegenover elkaar liggende blokken van dezelfde architect zijn, was beleid van de Commissie van Drie: de Hoofdweg moest één toegangslaan naar het Mercatorplein worden.

      Loop naar het noorden en let op de ingangen: steeds vier gekoppelde portieken onder een gezamenlijke luifel, op plastische geveldammen met houten sierelementen. De blinde trappenhuisstroken lopen door tot de daklijst en eindigen in pylonen met golvende sierstroken.

      Het gemeentelijk register noemt dit een 'vertaling' van de Amsterdamse School in vrij vlakke, beheerste wanden met schier eindeloze vensterreeksen. Het rode blok aan de oostkant tussen Postjesweg en Davisstraat is het rijkst gedetailleerd.
    next:
      directions: Walk north along the Hoofdweg. At the Davisstraat the façades follow the bend in the road.
      nl: Loop over de Hoofdweg naar het noorden. Bij de Davisstraat volgen de gevels de knik in de weg.
  - place: Hoofdweg housing by G.J. Rutgers
    narration: |
      At the Willem Schoutenstraat the architect changes, and so does the room. Gerrit Jan Rutgers, one of the most productive housing architects of the Amsterdam School, designed both sides of the next stretch, built in 1924–1925. At this corner his two blocks form a symmetrical gateway, with rounded corners, towers, curved shopfronts and stepped-back upper floors.

      Now look north. The horizontal lines push your eye towards the Mercatorplein, helped by white-painted piers between the top-floor windows, which read almost as a mezzanine. Every third porch has a bay window above it, with quarter-round hollows where it meets the wall.

      Like Kramer, Rutgers turns the style into calm, flat street walls of flats with corner shops. You will come back to the square along another street, so turn off here.
    nl: |
      Bij de Willem Schoutenstraat wisselt de architect, en daarmee de kamer. Gerrit Jan Rutgers, een van de productiefste woningbouwarchitecten van de Gordel 20-40, ontwierp de blokken aan beide kanten van dit stuk Hoofdweg, gebouwd in 1924–1925. Op deze hoek vormen ze samen een symmetrisch poortgebouw met afgeronde hoeken, torens, gebogen winkelpuien en terugspringende bovenlagen.

      Kijk dan naar het noorden. De horizontale lijnen 'stuwen' de blik naar het Mercatorplein, versterkt door de witgeschilderde geveldammen in de vierde laag, die bijna een mezzanino vormt. Om de twee portieken volgt er een met een erker erboven, in de oksels kwarthol afgerond.

      Net als Kramer vertaalt Rutgers de stijl in rustige, vlakke gevelwanden met etagewoningen en buurtwinkels. Naar het plein kom je straks via een andere straat; sla hier af.
    next:
      directions: Turn right into the Willem Schoutenstraat, towards the tent roof of the Bethelkerk.
      nl: Sla rechtsaf de Willem Schoutenstraat in, naar het tentdak van de Bethelkerk.
  - place: Bethelkerk and Magalhaensplein
    narration: |
      Plan West slotted churches into its blocks, and each denomination built its own. The Bethelkerk was the Reformed (*gereformeerd*) counterpart of the Dutch Reformed Jeruzalemkerk, which comes later on this walk. E.A.C. Roest built it in 1928–1929 and joined it to his own church hall of 1925–1926 on the Cabotstraat. Public Works added a police post with a municipal health office on the Magalhaensplein (1928), and J.H. van der Veen a Christian pre-school on the Willem Schoutenstraat (1931–1933).

      The register calls the whole block a "little town". From the square, one-storey gabled buildings step up to the church hall with its mansard roof, and then to the church's steep tent roof and 12-metre turret, a design the register compares with the work of Michel de Klerk.

      Just south, on the Columbusplein, Commer de Geus's Reformed school of 1927 has parabolic entrance porches.
    nl: |
      Plan West kreeg kerken die in de bouwblokken werden ingepast, en elke richting bouwde de zijne. De Bethelkerk is de gereformeerde tegenhanger van de hervormde Jeruzalemkerk, die verderop in deze wandeling komt, en van de katholieke Chassékerk. Architect E.A.C. Roest bouwde haar in 1928–1929 en verbond haar met zijn vergadercentrum aan de Cabotstraat (1925–1926). Publieke Werken voegde in 1928 een politiepost en een post van de GG en GD aan het Magalhaensplein toe, en J.H. van der Veen in 1931–1933 een school aan de Willem Schoutenstraat.

      Vanaf het plein lopen de bouwdelen trapsgewijs op: van één laag onder zadeldaken, via het vergadercentrum met mansardekap, naar de kerk met haar steile tentdak en twaalf meter hoge daktoren. Het register spreekt van een 'klein stadje' en noemt het ontwerp verwant aan het werk van Michel de Klerk.

      Even verderop, aan het Columbusplein, staat de gereformeerde school van Commer de Geus uit 1927, met paraboolvormige portieken.
    next:
      directions: Walk north along the Cabotstraat.
      nl: Loop door de Cabotstraat naar het noorden.
  - place: Cabotstraat school island
    narration: |
      Six thousand working-class homes needed schools. In 1928 Public Works laid three school buildings side by side in strips here, with playgrounds between them hidden from the street by a high brick wall. From north to south they held the Admiralengrachtschool and Columbusschool, a nursery school, and the double Cabotschool and Vasco da Gamaschool.

      The wall is architecture in its own right. It sweeps in quarter-circles into the end walls of the schools, and it has doors under brick arches, a round window and a half-round door. Look up at the end façades for wavy brick balconies and gables with diamond-shaped top windows.

      All four parts, the three schools and the wall, are national monuments, as examples of the late Amsterdam School.
    nl: |
      Zesduizend arbeiderswoningen vroegen om scholen. In 1928 legde de Dienst Publieke Werken hier volgens het strokenbouwprincipe drie schoolgebouwen naast elkaar, met speelplaatsen ertussen die door een hoge muur van de straat zijn afgeschermd. Van noord naar zuid: de Admiralengrachtschool en Columbusschool, een kleuterschool, en de dubbele Cabotschool en Vasco da Gamaschool.

      De muur is zelf architectuur. Hij zwenkt kwartrond in naar de eindgevels en heeft deuren onder rollagen, een rondvenster en een halfronde vleugeldeur. Kijk aan de kopgevels omhoog naar de golvende gemetselde balkons en de puntgevels met ruitvormige topvensters.

      Het Rijk beschermt de drie scholen en de muur elk afzonderlijk, steeds als voorbeeld van de late Amsterdamse School.
    next:
      directions: At the north end of the schools, turn left into the Jan Evertsenstraat towards the Mercatorplein.
      nl: Sla aan de noordkant van de scholen linksaf de Jan Evertsenstraat in, richting Mercatorplein.
  - place: Jan Evertsenstraat housing by J.F. Staal
    narration: |
      The Jan Evertsenstraat is Plan West's shopping street, one of its main axes. J.F. Staal designed both sides of it between the Admiralengracht and the Mercatorplein in 1925–1926: six parts, several hundred flats and more than 80 shops. The national register calls it *verstrakte* (streamlined, sober) Amsterdam School.

      Walk towards the square and look at the rhythm of the five-storey walls. Projecting brick piers with concrete caps carry small balconies or three-sided bay windows. Above the shops runs a flat concrete canopy, with a strip of glass building blocks over it to light the shop interiors. The top floor is almost blind. Check the original doors for house numbers in Amsterdam School lettering.

      The eastern end of Staal's street, with a gateway over the Hudsonstraat, comes later in the walk.
    nl: |
      De Jan Evertsenstraat is de winkelstraat van Plan West en een van de hoofdassen. Jan Frederik Staal ontwierp in 1925–1926 beide wanden tussen Admiralengracht en Mercatorplein: zes complexonderdelen met samen enkele honderden etagewoningen en ruim tachtig winkels. Het rijksregister spreekt van 'de stijl van de verstrakte Amsterdamse School'.

      Loop richting het plein en let op het ritme van de vijflaagse gevels in Noors verband. Uitgemetselde muurdammen met betonnen koppen dragen kleine balkons of uitgebouwde, deels overhoekse vensters. Boven de winkels loopt een vlakke betonnen luifel, met daarboven een strook glazen bouwstenen die licht in de winkels brengt. De bovenste laag is grotendeels blind. Kijk ook naar de deuren met huisnummers in Amsterdamse Schoolletters.

      Het oostelijke deel van Staals straat, met het poortgebouw over de Hudsonstraat, komt later in de wandeling.
  - place: Mercatorplein
    narration: |
      The centre of Plan West, and the one Amsterdam School square that Berlage designed in full, although here too he did only the façades, not the homes behind them. Built in 1925–1927, it combines his late, sober manner with Amsterdam School brickwork and wrought-iron balcony ornament.

      Turn round slowly. The north and south walls are red brick and the east and west walls largely yellow-brown, all on a base of dark granite. Heavy brick piers carry the shop arcades, with meander bands and figurative 1920s sculpture on the corners, including portraits of the cartographers Mercator and Blaeu.

      Berlage planned three towers, and two were built. The tall one above the gateway into the Van Spilbergenstraat is original. The north tower was demolished in 1961, and the whole north wall was rebuilt to the original design in 1995–1998. In 1948 the first self-service shop in Amsterdam opened here, the start of the Dirk van den Broek chain.
    nl: |
      Het middelpunt van Plan West, en het enige Amsterdamse School-plein dat Berlage helemaal ontwierp, al waren ook hier de woningen achter de gevels niet van zijn hand. Het plein kreeg in 1924 de naam van cartograaf Gerardus Mercator; de vier wanden verrezen in 1925–1927, in Berlages late, sobere stijl met metselverbanden en smeedijzeren balkonornamenten uit de Amsterdamse School.

      Draai langzaam rond. De noord- en zuidwand zijn van rode baksteen, de oost- en westwand grotendeels van geelbruine, alles op een plint van zwart-grijs graniet. Zware gemetselde pijlers met meanders dragen de winkelgalerijen, met figuratief beeldhouwwerk op de hoeken.

      Berlage wilde drie torens; de toren in de westwand kwam er nooit. De hoge toren boven het poortgebouw naar de Van Spilbergenstraat is origineel. De noordelijke werd in 1961 als bouwvallig gesloopt, en vanaf 1995 werd de hele noordwand afgebroken en zoveel mogelijk in de oude vorm herbouwd, toren inbegrepen. In 1948 opende hier de eerste zelfbedieningswinkel van Amsterdam, voorloper van Dirk van den Broek.
    next:
      directions: Leave the square northwards along the Hoofdweg.
      nl: Verlaat het plein naar het noorden, over de Hoofdweg.
  - place: Hoofdweg housing by Wijdeveld
    narration: |
      North of the square, the last room of the avenue belongs to Hendrik Wijdeveld, editor of the Amsterdam School magazine *Wendingen*. He designed both street walls as one composition (1925–1926). Again the plans came from Gulden & Geldmaker, and he drew only the façades.

      The difference from Kramer and Rutgers is plain to see: everything here runs horizontally. A continuous window band runs the length of each block, cut through by vertical brick bands. The top floor is treated differently from the floors below, and at the block ends it cantilevers out into a round bay. Look for the hoist beams sticking out just above the roofline.

      Wijdeveld published the scheme in 1927, in a *Wendingen* issue devoted to Plan West. Walk on to the Jan van Galenstraat, where his blocks rise into towers.
    nl: |
      Ten noorden van het plein is de laatste kamer van de Hoofdweg van H.Th. Wijdeveld, de man achter het tijdschrift Wendingen. Hij ontwierp beide straatwanden als één compositie (1925–1926). Ook hier kwamen de plattegronden van Gulden & Geldmaker en tekende hij alleen de gevels.

      Het verschil met Kramer en Rutgers zie je meteen: alles is horizontaal. Een doorlopende vensterstrook loopt over de volle lengte van elk blok, doorsneden door uitstekende verticale banden in het metselwerk. De bovenste laag wijkt af van de verdiepingen eronder en kraagt aan de blokeinden uit in een ronde erker. Let op de hijsbalken die net boven de dakrand uitsteken.

      De gemeente wees de blokken in 1992 aan als gemeentelijk monument. Loop door tot de Jan van Galenstraat, waar ze uitlopen in torens.
  - place: Wijdeveld's stadspoort (north block)
    narration: |
      Where the Hoofdweg meets the Jan van Galenstraat, Wijdeveld marked the junction with a pair of tall corner blocks: a *stadspoort*, or city gate. The southern half belongs to the blocks you have just walked past. This northern half, across the Jan van Galenstraat, was built in 1925–1926 with workers' flats, shops and, at the top, artists' studio flats.

      Look up at the tower: the old studio floors have a multi-paned glass wall, and the blind attic wall above carries four hoisting beams. Towards the Jan van Galenstraat the ground and first floors jut out and end in a half-round bay over the shops.

      Kramer's six-storey blocks at the Postjesweg opened the Hoofdweg, and Wijdeveld's gate closes it. The block was listed in 2010 as an essential part of the Hoofdweg complex.
    nl: |
      Op de kruising van de Hoofdweg en de Jan van Galenstraat zette Wijdeveld twee hoge hoekblokken neer, een 'stadspoort'. Het zuidelijke deel hoort bij de blokken die je net bent gepasseerd. Dit noordelijke deel, aan de overkant van de Jan van Galenstraat, werd in 1925–1926 gebouwd met arbeiderswoningen, winkels en, op de bovenste lagen, atelierwoningen.

      Kijk omhoog naar de toren: de oude ateliers hebben een meerruits glasgevel, en in de hoge blinde zoldermuur daarboven zitten vier hijsbalken. Naar de Jan van Galenstraat steken begane grond en eerste verdieping uit en eindigen ze in een halfronde erker boven de winkels.

      Kramers poortblokken bij de Postjesweg openen de Hoofdweg, Wijdevelds stadspoort sluit hem af. Het blok werd in 2010 rijksmonument als "essentieel onderdeel van het complex Hoofdweg in Plan-West".
    next:
      directions: Walk east along the Jan van Galenstraat. At the corner of the Mercatorstraat is the small brick Gemaal Mercatorstraat (1927), a Public Works sewage pumping station with three Amsterdam crosses. Then turn right into the Vespuccistraat.
      nl: Loop door de Jan van Galenstraat naar het oosten. Op de hoek van de Mercatorstraat staat het bakstenen Gemaal Mercatorstraat (1927) van Publieke Werken, met drie Andreaskruisen. Sla daarna rechtsaf de Vespuccistraat in.
  - place: Vespuccistraat housing by Roodenburgh
    narration: |
      Jordanus Roodenburgh, who had worked for De Bazel, lined the Vespuccistraat with four blocks of flats and corner shops in 1924–1926. Start with the corner shop at the Jan van Galenstraat and its multi-sided display window.

      As you walk down the street, look at the ground floor. It reads as one continuous zone of six-sided parabolic porches, with stone blocks jutting out above them, and small, deep-set windows. The brick is orange-red, laid in Norwegian bond (*Noors verband*) on a base of dark clinker. Higher up, bands of ornamental brickwork link the top-floor windows. Opposite each side street the wall rises into a taller, almost blind mass with a stairwell bay.

      This is the apron architecture at work: the floor plans behind were standard, but the street front is all Roodenburgh.
    nl: |
      Langs de Vespuccistraat bouwde Jordanus Roodenburgh in 1924–1926 vier blokken met etagewoningen en hoekwinkels. Roodenburgh had bij De Bazel gewerkt en wordt tot de Amsterdamse School gerekend. Begin bij de hoekwinkel aan de Jan van Galenstraat, met zijn meerzijdige etalage.

      Let onder het lopen op de begane grond: de zeszijdige, paraboolvormige portieken met uitkragende natuursteenblokken erboven en de kleine, diepliggende vensters vormen één doorlopende zone. De gevels zijn gemetseld in oranjerode baksteen in Noors verband op een trasraam van donkere klinkers. Bovenin verbinden horizontale lagen siermetselwerk de vensters. Tegenover elke zijstraat springt de wand op in een hoger, vrijwel blind bouwdeel met een trappenhuiserker.

      Schortjesarchitectuur dus: de plattegronden erachter waren standaard, de gevel is helemaal Roodenburgh.
    next:
      directions: At the end of the Vespuccistraat, turn right into the Jan Maijenstraat.
      nl: Sla aan het eind van de Vespuccistraat rechtsaf de Jan Maijenstraat in.
  - place: Jeruzalemkerk
    narration: |
      The Dutch Reformed congregation of Sloterdijk built this church for the new district in 1928–1929. It was first to be called the Nieuwe Westerkerk. The name Jeruzalemkerk came from the fundraising campaign "Stad zonder Tempel" (city without a temple). The architect, Ferdinand Jantzen, worked in the sober, *verstrakte* Amsterdam School with clear influences from Frank Lloyd Wright. He attached the church to seven flats and a consistory on its corners, to express the idea that God lives among people.

      Everything here is symbolic, down to the dimensions. The church faces north–south and is strictly symmetrical. Look for the three identical doors in a base of purple clinker, the name JERUZALEMKERK in metal letters, and the three tall, narrow windows under a short, stocky bell tower.

      Inside are Jantzen's own stained-glass windows of the seven days of Creation. It is still a Protestant church.
    nl: |
      De Nederlands Hervormde gemeente van Sloterdijk liet deze kerk in 1928–1929 bouwen in het nieuwe Plan West. Eerst zou ze Nieuwe Westerkerk heten; de naam Jeruzalemkerk kwam van de inzamelingsactie 'Stad zonder Tempel'. Architect F.B. Jantzen werkte in de verstrakte Amsterdamse School, met duidelijke invloed van Frank Lloyd Wright. Hij bouwde de kerk bewust vast aan zeven etagewoningen en een consistorie: God wil bij de mensen wonen.

      Bouwvolumes, terrassen en maten verwijzen naar de tempelbouw en volgen getallenschema's. De kerk is noord-zuid gericht en streng symmetrisch. Let op de drie gelijke toegangen in een sokkel van paarse klinkers, de naam JERUZALEMKERK in metalen letters en de drie hoge, smalle vensters onder een korte, gedrongen klokkentoren.

      Binnen zitten Jantzens eigen glas-in-loodramen met de zeven scheppingsdagen. De kerk is nu een wijkgemeente van de PKN.
  - place: Jan Maijenschool
    narration: |
      Across the little square stands the church's neighbour: a single Public Works building that once held four elementary schools, the Vespucci-, Mercator-, Jan Evertsen- and Jan Maijenschool. J.W. Frantzen designed it in 1926.

      The church is strictly symmetrical, and so is the school. A long front of red-grey brick is held between yellow-brick corner pavilions whose outer corners are rounded into half-cylinders. Look for the double entrance under a curved porch roof, with undulating brick panels above it, and the crenellated parapet between the pavilions. The register calls it late Amsterdam School.

      The schools merged and closed in 1994. Today the upper classrooms are small flats and the old playground is a community garden, the Tuin van Jan.
    nl: |
      Tegenover de kerk staat het gebouw dat ooit vier lagere scholen huisvestte: de Vespucci-, Mercator-, Jan Evertsen- en Jan Maijenschool. J.W. Frantzen ontwierp het in 1926 voor de Dienst Publieke Werken; de aanbesteding in december 1925 kwam uit op 227.860 gulden.

      Het register spreekt van late Amsterdamse School. Een symmetrische middenpartij in roodgrauwe steen ligt tussen hoekpartijen van gele baksteen, waarvan de buitenste hoeken halfcilindervormig zijn uitgemetseld. Let op de dubbele entree onder een welvend portiekdak, met golvende muurvlakken erboven, en de kantelen van de borstwering tussen de hoekpartijen.

      In 1994 sloot de laatste school. Op de verdieping kwamen kleine wooneenheden, en het oude schoolplein werd de buurttuin 'Tuin van Jan'.
    next:
      directions: Make your way to the Jan Evertsenstraat and follow it east to the bridge over the Admiralengracht. On the way you pass the eastern part of Staal's street and his gateway over the Hudsonstraat.
      nl: Ga naar de Jan Evertsenstraat en volg die naar het oosten tot de brug over de Admiralengracht. Onderweg passeer je het oostelijke deel van Staals straat en zijn poortgebouw over de Hudsonstraat.
  - place: Molenslootbrug
    narration: |
      Piet Kramer again, now as the bridge architect of Public Works. This bridge (number 359) was built in 1929–1930 to replace a narrow emergency bridge of 1923. It carries the Jan Evertsenstraat and tram 13 over the Admiralengracht, which used to be called the Molensloot. It is the twin of the Machineslootbrug in the Postjesweg.

      Look at the brick and granite abutments with carved stone details, probably by Hildo Krop, and follow the continuous wrought-iron balustrade to its ends, which curl into sea anemones. Unusually for Amsterdam, the zebra crossing runs across the middle of the bridge rather than at the quays.

      Locals called it Brug Jan Eef, and after a jeweller was killed in a robbery in 2010, the Hundbrug. From the deck, look at Van der Mey's corner towers.
    nl: |
      Weer Piet Kramer, nu als bruggenarchitect van Publieke Werken. De Molenslootbrug (brug 359) verving in 1929–1930 een smalle noodbrug uit 1923, waarover sinds 1927 al trams naar het Mercatorplein reden. Kramer ontwierp hem samen met zijn zusje in de Postjesweg, de Machineslootbrug. De naam verwijst naar de Molensloot, een oude naam voor een deel van de Admiralengracht.

      Bekijk de landhoofden van baksteen en graniet met steenbewerkingen, vermoedelijk van Hildo Krop, en volg de doorlopende smeedijzeren balustrade tot het eind, waar ze uitloopt in zeeanemonen. Opvallend: het zebrapad ligt midden op de brug in plaats van bij de kades.

      Buurtbewoners spraken ook van Brug Jan Eef en, na de dodelijke overval op juwelier Fred Hund in 2010, van de Hundbrug. Vanaf de brug zie je de hoektorens van Van der Mey.
  - place: Jan Evertsenstraat housing by Van der Mey
    narration: |
      Joan van der Mey, architect of the Scheepvaarthuis, framed the bridge with two symmetrical "twin brothers" in red brick (1926–1927), with working-class flats over a shop gallery. Seen from the bridge, the taller corner blocks act as gatekeepers, and the four-storey walls fan out from them along the water like wings.

      Think back to the Scheepvaarthuis of 1912–1916, where every surface is modelled. Here the tension comes from the arrangement of fairly plain volumes: horizontal window strips under projecting lintels, set against vertical towers. Only in the rounded bay strips and the stepped towers, which look almost modelled in clay, does the old plasticity survive.

      Look for the shop arcades with concrete columns along the Jan Evertsenstraat and the gateway into the Krommertstraat.
    nl: |
      Joan Melchior van der Mey, bekend van het Scheepvaarthuis, ontwierp de twee blokken bij de brug (1926–1927): symmetrische 'tweelingbroers' in rode baksteen, met arbeiderswoningen boven een winkelgalerij. Vanaf de brug gezien zijn de hoger opgetrokken hoekpartijen poortwachters, met vierlaagse vleugels die langs de gracht 'uitwaaieren'.

      Denk even terug aan het Scheepvaarthuis van 1912–1916, waar elk stuk gevel bewogen is. Het register ziet hier de verzakelijkte vormentaal van de late Amsterdamse School: de spanning zit in de rangschikking van vrij massieve bouwdelen, met horizontale vensterstroken onder uitkragende lateien tegenover verticale torens. Alleen in de afgeronde erkerstroken en de getrapte torens leeft de oude plasticiteit nog, 'alsof het om geboetseerde architectuur gaat'.

      Let op de winkelgalerijen met betonkolommen en de poort naar de Krommertstraat.
    next:
      directions: Follow the Admiralengracht north to the Jan van Galenstraat. On the way, at Admiralengracht 301, is De Klimop, a Public Works nursery school of 1928–1930 whose low half-round wing wraps round its playground.
      nl: Volg de Admiralengracht naar het noorden tot de Jan van Galenstraat. Onderweg, op Admiralengracht 301, ligt De Klimop, een kleuterschool van Publieke Werken uit 1928–1930 waarvan de lage halfronde vleugel het speelplein omarmt.
  - place: Vierwindstrekenbrug
    narration: |
      The walk ends on the bridge where Kramer could, in the words of Dutch Wikipedia, use his Amsterdam School style to the full. It was built in 1932, when the Admiralengracht was extended north and the Jan van Galenstraat became a main road. It is 30 metres wide, mixes brick and granite, has wrought-iron railings with flower boxes, and has seating niches on its south side.

      On each bridgehead Hildo Krop represented one of the four winds (compass points). For the north, an Inuit figure with a weapon between an igloo and two walruses. For the south, an African warrior with spear and shield, a hut and two lions. For the east, a Chinese dock worker with a pagoda on a Chinese wall and two steamships. For the west, an American-style stockbroker on the telephone, in a bowler hat, with an office, share prices and two cars.

      These are ethnic stereotypes of their time. Three of the four reduce whole peoples to a single exotic type among animals and huts, while only the West stands for modern business. They show how the Netherlands of the colonial 1930s pictured the rest of the world, and they are worth looking at for exactly that reason.

      Jan Trapman's tiger and polar bear stand by the steps to the Erasmuspark. The bridge was known only as number 381 until 1996, when it was named after Krop's figures. Jantzen's first building, the Westerwijk community centre (1925–1926), is about 250 metres east, on the Admiraal de Ruijterweg.
    nl: |
      De wandeling eindigt op de brug waar Kramer zijn stijl volledig kon uitoefenen: baksteen en graniet, siersmeedwerk, zitjes. De brug werd in 1932 gebouwd, toen de Admiralengracht naar het noorden werd doorgetrokken en de Jan van Galenstraat een hoofdverkeersweg werd. Ze is 30 meter breed, met smeedijzeren balustrades met bloembakken en aan de zuidkant ingebouwde zitnissen.

      Op elk brughoofd verbeeldde Hildo Krop een windstreek. Het noorden: een Eskimo met wapen tussen een iglo en twee walrussen. Het zuiden: een Afrikaanse krijger met speer en schild, een hut en twee leeuwen. Het oosten: een Chinese sjouwer met een pagode op de Chinese muur en twee stoomschepen. Het westen: een telefonerende beursman in Amerikaanse stijl, met bolhoed en aktetas, een kantoor, beurskoersen en twee auto's.

      Het zijn etnische stereotypen uit hun tijd. Drie van de vier figuren brengen hele volken terug tot één exotisch type tussen dieren en hutten; alleen het Westen staat voor de moderne handel. De beelden laten zien hoe Nederland in de koloniale jaren dertig naar de rest van de wereld keek, en zijn juist daarom het bekijken waard.

      Bij de trappen naar het Erasmuspark staan een tijger en een ijsbeer van Jan Trapman. Pas in 1996 kreeg brug 381 haar naam, naar de beelden van Krop. Het eerste gebouw van Jantzen, wijkgebouw Westerwijk (1925–1926), staat zo'n 250 meter oostelijker aan de Admiraal de Ruijterweg.
