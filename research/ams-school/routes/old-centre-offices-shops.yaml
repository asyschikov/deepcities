title: Shipping offices, shops and cinemas in the old centre
summary: >-
  From the Scheepvaarthuis, where the Amsterdam School began, to Tuschinski and the Rembrandtplein:
  the style goes into business. Trading houses, newspaper offices, shops, an insurer and a bank,
  plus the city's own council wing and its cheeky urinal.
body: |
  **Start:** the Scheepvaarthuis on the Prins Hendrikkade, about ten minutes' walk from Centraal Station.
  **End:** the Rembrandtplein, where trams stop on the square.
  **Distance and time:** about 4 km. Allow 2 to 2½ hours with stops.

  Two buildings can be visited inside. The Scheepvaarthuis is now a hotel (Grand Hotel Amrâth), and its stairwell is open to visitors. Tuschinski is a working cinema with its 1921 lobby intact. Everything else is offices, shops, restaurants or university buildings, seen from the street. The Nieuwendijk and the Kalverstraat are busy shopping streets, so earlier in the day is calmer. The route is flat, with some cobbles and narrow alleys.

  Most Amsterdam School architecture is housing, schools and bridges, built in the new districts. In the old centre the clients were different: shipping lines and trading houses, newspapers, shops, insurers, a bank and a cinema owner, plus the city itself. The walk follows the style from its first building, the Scheepvaarthuis of 1912–1916, through the expressive offices and shopfronts of the late 1910s and 1920s, to blockier 1930s work at the edge of functionalism. The first two buildings were built on trade with the Dutch East Indies, and their sculpture shows it.
mode: walk
photos: ["commons:File:Amsterdam Scheepvaarthuis 002.JPG"]
nl:
  title: Rederijen, winkels en bioscopen in de binnenstad
  summary: >-
    Van het Scheepvaarthuis, waar de Amsterdamse School begon, naar Tuschinski en het
    Rembrandtplein: de stijl gaat zakendoen. Handelshuizen, krantenkantoren, winkels, een
    verzekeraar en een bank, en de stadhuisvleugel met zijn brutale urinoir.
  body: |
    **Start:** het Scheepvaarthuis aan de Prins Hendrikkade, zo'n tien minuten lopen van het Centraal Station.
    **Eind:** het Rembrandtplein, waar de tram stopt.
    **Afstand en duur:** ongeveer 4 kilometer, met stops twee tot tweeënhalf uur.

    Twee gebouwen kun je binnen bekijken. Het Scheepvaarthuis is nu Grand Hotel Amrâth, en het trappenhuis is te bezichtigen. Tuschinski is gewoon een bioscoop, met de foyer uit 1921 nog intact. De rest zijn kantoren, winkels, restaurants en universiteitsgebouwen, te zien vanaf de straat. De Nieuwendijk en de Kalverstraat zijn drukke winkelstraten; vroeg op de dag is het rustiger. De route is vlak, met hier en daar keien en smalle stegen.

    De meeste Amsterdamse School staat in de nieuwe wijken: woningen, scholen en bruggen. In de binnenstad waren de opdrachtgevers anders: rederijen en handelshuizen, kranten, winkels, verzekeraars, een bank en een bioscoopexploitant, en de gemeente zelf. De wandeling volgt de stijl van het allereerste gebouw, het Scheepvaarthuis van 1912–1916, via de expressieve kantoren en winkelgevels van eind jaren tien en de jaren twintig naar het strakkere werk van rond 1930, op de grens van het functionalisme. De eerste twee gebouwen dreven op de handel met Indië, en dat is aan het beeldhouwwerk te zien.
stops:
  - place: Scheepvaarthuis
    narration: |
      The Amsterdam School began in an office building. In 1912 six Amsterdam shipping lines, among them the SMN, the KPM and the KNSM, commissioned a shared head office on the tip of the Waalseiland. It was here that Cornelis de Houtman's first voyage to the East Indies set off in 1595. The engineers, the brothers Van Gendt, built the concrete frame and left the architecture to the little-known Jo van der Mey, who brought in his colleagues Michel de Klerk and Piet Kramer. The national register calls it the first building realised entirely in the Amsterdam School style.

      Stand back from the corner entrance. The plan is shaped like a ship's bow, with a truncated tower above the door and personifications of the oceans on either side. The lead roof edge is shaped as ropes, waves and fish heads, and the piers between the windows are carved with ships, sea creatures and references to the Dutch colonial shipping routes. Hildo Krop worked on this sculpture before he became the city sculptor; you will meet his work again on the Rokin and by the old city hall.

      Since 2007 it has been a hotel, so you can go in and see the stairwell under Willem Bogtman's stained-glass skylight. Before you leave, look behind the building: Van der Mey's Brug 283 (1913–1914) over the Waalseilandsgracht is one of the very first Amsterdam School bridges.
    nl: |
      De Amsterdamse School begon met een kantoorgebouw. Zes Amsterdamse rederijen, onder wie de SMN, de KPM, de JCJL en de KNSM, richtten de NV Kantoorgebouw 'Het Scheepvaarthuis' op en bouwden op de westpunt van het Waalseiland, waar Cornelis Houtman in 1595 vertrok voor de eerste reis naar Oost-Indië. De gebroeders Van Gendt zorgden voor het betonskelet en lieten de vormgeving over aan de toen nog onbekende Jo van der Mey, die zijn collega's Michel de Klerk en Piet Kramer erbij haalde. Het Rijksmonumentenregister noemt het "het eerste volledig in de stijl van de Amsterdamse School gerealiseerde bouwwerk".

      Ga op afstand van de hoekingang staan. De plattegrond heeft de vorm van een scheepsboeg, met een afgeknotte toren boven de deur en personificaties van de oceanen ernaast. De loden dakrand is gevormd als scheepstouwen, golven en vissenkopjes, en de penanten tussen de ramen staan vol maritieme symbolen. Ze vertellen het verhaal van de rederijen, en daarmee van de koloniale handel. In het atelier van Hendrik van den Eijnde werkte hier ook Hildo Krop, die je verderop aan het Rokin en bij het oude stadhuis weer tegenkomt.

      Sinds 2007 is het een hotel, dus je kunt naar binnen voor het trappenhuis onder de glas-in-loodkap van Willem Bogtman. Kijk voor je verdergaat even achter het gebouw: de Waalseilandbrug (brug 283) van Van der Mey uit 1913–1914 is een van de allereerste bruggen in Amsterdamse Schoolstijl.
    next:
      directions: Walk north-west along the Prins Hendrikkade.
      nl: Loop over de Prins Hendrikkade naar het noordwesten.
  - place: Gebouw Batavia
    narration: |
      Another company in the East Indies trade soon took up the new style. The N.V. Batavia Arak Maatschappij traded arrack, a spirit from the Dutch East Indies. In 1918–1920 the architect J.H. Slot built it this office and warehouse with a caretaker's flat, chose the Amsterdam School style, and gave it a reinforced-concrete frame by the firm De Kondor.

      The harbour front is asymmetric and strongly modelled. Look for the narrow half-round bay running up the right-hand side, with a ring ornament at its foot, the iron letters GEBOUW BATAVIA, and the row of gently pointed battlements along the top. The colonial trade shows in the sculpture: groups of monkeys on the brick piers and elephant heads elsewhere.

      The building runs through to the Oudezijds Kolk, where the symmetrical back still has its original leaded-glass fanlights. It has been a restaurant since the 1990s.
    nl: |
      Ook andere handelshuizen op Indië kozen al snel voor de nieuwe stijl. De N.V. Batavia Arak Maatschappij, die handelde in arak, liet dit kantoor met magazijn en conciërgewoning in 1918–1920 bouwen door architect J.H. Slot, in de stijl van de Amsterdamse School. Het gewapend beton was van de N.V. Gewapend Beton "De Kondor".

      Let op de smalle halfronde uitbouw over alle verdiepingen, met een ornament van concentrische ringen aan de voet, de metalen letters GEBOUW BATAVIA en de reeks licht gepunte kantelen bovenaan. Het beeldhouwwerk toont groepen apen en olifantskoppen: de handel met de kolonie, vertaald in exotische dieren op een Amsterdams kantoor.

      Het gebouw loopt door tot de Oudezijds Kolk, waar de achtergevel nog de oorspronkelijke glas-in-loodbovenlichten heeft. Sinds de jaren negentig zit er horeca in.
  - place: Rubber Centraal Station (Warmoesstraat)
    narration: |
      Ten years later the style had grown blockier. In 1928 the rubber trader Rubber Centraal Station R.C.S. replaced eight small shop-houses on the corner of the Nieuwe Brugsteeg and the Warmoesstraat with a single office. It was designed by H.A. Sangster, a Hague architect best known for his water towers, together with F. Warnaar.

      The city register calls the style related to the Amsterdam School: blocky volumes and the typical windows, with recessed lower sashes and slightly projecting upper lights. Because the Warmoesstraat bends here, the slightly concave, symmetrical front can be seen from far down the street. Look at the black stone ground floor with its projecting piers under a continuous canopy, and up at the attic storey of many small upright windows.

      Compare it with Batavia's monkeys and battlements a minute ago: here the blocky mass does the talking.
    nl: |
      Tien jaar later is de stijl blokvormiger geworden. Voor het "Kantoorgebouw Rubber Centraal Station R.C.S. Amsterdam" moesten in 1928 acht winkel-woonhuizen op de hoek van de Nieuwe Brugsteeg en de Warmoesstraat wijken; alleen Warmoesstraat 6 en 8 werden deels achter de nieuwe gevel opgenomen. Het ontwerp is van de Haagse architect H.A. Sangster, bekend van zijn watertorens, en F. Warnaar.

      Volgens het register is de stijl verwant aan de 'Amsterdamse school': een blokvormige opbouw en vensters met dieper liggende onderramen en licht vooruitstekende bovenramen met horizontale roeden. Doordat de Warmoesstraat hier buigt, is de licht concave gevel van ver te zien. Kijk naar de pui van zwart natuursteen met vooruitstekende penanten onder een doorlopende luifel, en omhoog naar de attica met vele kleine staande vensters.

      Na de apen en kantelen van Batavia: hier spreekt vooral de massa.
    next:
      directions: Cross the Damrak and head west to the Nieuwezijds Voorburgwal.
      nl: Steek het Damrak over en loop door naar de Nieuwezijds Voorburgwal.
  - place: Gebouw De Kolk
    narration: |
      In the 1920s the Nieuwezijds Voorburgwal was a busy office street, home to several newspapers. Gebouw De Kolk (1925) is a well-preserved example of its office architecture. J. Slaap had two plots merged and commissioned the architect Th. Kint to build offices to let, with storage and a caretaker's flat. A concrete frame freed the floors from load-bearing walls. For the look, Kint followed what the register calls the "robust, plastic" character of the Amsterdam School.

      Look at the ground floor, clad entirely in grey granite, and the double wooden doors with ladder-pattern glazing and their original brass letterboxes with names. GEBOUW-DE KOLK is spelled out in brass letters on the lintel. Above, brick piers rise three storeys like a giant order.

      This is an office block to let, and the new style was part of its appeal.
    nl: |
      De Nieuwezijds Voorburgwal was in de jaren twintig een straat vol kantoren, waaronder die van verschillende dagbladen. In 1925 liet J. Slaap de percelen 32 en 34 samenvoegen, en architect Th. Kint ontwierp op nummer 32 een kantoorverzamelgebouw met bergruimte en conciërgewoning. Een betonskelet maakte de indeling vrij. In de vormgeving sloot Kint volgens het register aan bij het "robuust-plastische en door expressief materiaalgebruik bepaalde karakter van de Amsterdamse School".

      Let op de geheel in grijs graniet uitgevoerde begane grond, de dubbele houten deur met laddermotief en de oorspronkelijke koperen brievenbussen met namen, en "GEBOUW-DE KOLK" in koperen letters. Daarboven lopen bakstenen lisenen over drie verdiepingen door, als een kolossale orde.

      Een verhuurkantoor dus, en de nieuwe stijl hoorde bij de verkoop.
    next:
      directions: Walk south along the Nieuwezijds Voorburgwal.
      nl: Loop over de Nieuwezijds Voorburgwal naar het zuiden.
  - place: Candida office building
    narration: |
      A few minutes and seven years further on, the same street got something very different. F.A. Warners, an architect with a strong eye on America, built this ten-storey office tower in 1931–1932 on a plot of under 400 square metres, for a company that developed rental flats. The brick walls hang on a reinforced-concrete frame, with continuous steel window strips. The register calls the manner cubist-expressionist; it comes close to the Nieuwe Bouwen (Dutch modernism).

      Look at the narrow entrance bay. The band above the ground floor turns into a canopy, and on it rests a three-sided steel bay holding the lift, like a glass column. The Amsterdam School survives in the patterned brickwork between the window strips and on the recessed top floor.

      If you have time, look at the back on the Spuistraat too, where round balconies stacked up one corner form an open fire escape.
    nl: |
      Een paar minuten verder en zeven jaar later kreeg dezelfde straat iets heel anders. F.A. Warners, sterk op Amerika georiënteerd, bouwde hier in 1931–1932 voor de N.V. Amsterdamsche Maatschappij tot Exploitatie van Etagewoningen een kantoorgebouw van tien lagen, op een grondvlak van nog geen 400 m². De bakstenen gevels hangen in een skelet van gewapend beton, met stalen vensterstroken. Het register spreekt van 'kubistisch-expressionistische trant'; Candida gaat een stap verder richting het Nieuwe Bouwen.

      Kijk naar de smalle ingangstravee: de band boven de begane grond loopt over in een luifel, en daarop rust de driezijdige stalen erker met de lift, als een zwevende glazen zuil. Van de Amsterdamse School blijft het siermetselwerk tussen de vensterstroken en op de terugwijkende bovenste verdieping.

      Wie tijd heeft, loopt even om naar de Spuistraat: daar vormen ronde, uitkragende balkons samen een open brandtrap.
    next:
      directions: Take the Sint Nicolaasstraat east to the Nieuwendijk.
      nl: Loop door de Sint Nicolaasstraat naar de Nieuwendijk.
  - place: Van den Brul clothing store (Nieuwendijk)
    narration: |
      The Nieuwendijk is one of the city's main shopping streets, and P. van den Brul was a well-known name on it. In 1930 the brothers Herman and Jan Baanders remodelled the store on this corner. Like a department store, it was meant to be a world of its own inside, behind a fairly closed screen of brick. The register compares it with Piet Kramer's Bijenkorf in The Hague of five years earlier and calls it a late example of Amsterdam School architecture.

      The original shopfronts and the steel windows with geometric leaded glass have gone, but the brick front folding round the rounded corner is intact, with tall window strips between the piers. Look at the foot of the piers: tuff blocks carved with the tools of the clothing trade, the initials PvdB, and Saint Martin sharing his cloak.
    nl: |
      Het gerenommeerde kledingmagazijn P. van den Brul liet zijn pand op de hoek van de Nieuwendijk en de Sint Nicolaasstraat in 1930 verbouwen door H.A.J. en J. Baanders. Net als bij een warenhuis lag de verleiding binnen, achter een tamelijk gesloten gevel. Het register vergelijkt het met de Bijenkorf die Piet Kramer vijf jaar eerder in Den Haag bouwde, en noemt het een laat voorbeeld van Amsterdamse Schoolarchitectuur.

      De winkelpuien en de stalen ramen met geometrisch glas-in-lood zijn verdwenen, maar de gevel die om de afgeronde hoek vouwt, met verticale vensterstroken, is er nog. Kijk naar de voet van de penanten: tufstenen blokken met attributen uit de kledingbranche, de initialen PvdB en Sint Maarten die zijn mantel deelt.
    next:
      directions: Follow the Nieuwendijk south to the Dam. Kalverstraat 1 is on the far side of the square, where the Kalverstraat begins.
      nl: Volg de Nieuwendijk naar de Dam. Kalverstraat 1 staat aan de overkant van het plein, waar de Kalverstraat begint.
  - place: Citroen jeweller's shop (Kalverstraat 1)
    narration: |
      Back to the very beginning. The jeweller Roelof Citroen had kept a shop on this spot just off the Dam since 1859. His son Karel commissioned a new building from the young Hendrik Wijdeveld: work began in April 1915 and the shop opened in February 1917. It was Wijdeveld's first building. A year later he launched *Wendingen*, the magazine that became the voice of the Amsterdam School.

      The front is faced in glazed ceramic stone rather than brick, and the national register calls it Art Deco in manner. The deep-set windows and the stained glass, though, point to the Amsterdam School. Look up at the carved frieze above the shop: a crown, festoons of pearls, doves and, in the top corners, elephants.

      The bronze shopfront with reliefs by Thomas Rodr dates from 1971, and Wijdeveld himself approved it.
    nl: |
      Terug naar het begin. Sinds 1859 zat juwelier Roelof Citroen op deze plek vlak bij de Dam. Zoon Karel vroeg de jonge architect Hendrik Wijdeveld om een nieuw pand; na de aanbesteding in april 1915 werd gebouwd, en in februari 1917 ging de zaak open. De Standaard vond het 'een lust voor het oog'. Het was Wijdevelds eerste gebouw, en een jaar later begon hij *Wendingen*, het spreekbuis van de Amsterdamse School.

      De gevel is van keramische steen in plaats van baksteen, en het rijksregister spreekt van 'Art Déco-trant'. De diepliggende vensters en het glas-in-lood zijn wel typisch Amsterdamse School. Kijk omhoog naar het fries boven de pui: een kroon, parelfestoenen, duiven en in de bovenhoeken olifanten.

      De bronzen pui met reliëfs van Thomas Rodr kwam er in 1971–1972, met instemming van Wijdeveld zelf.
    next:
      directions: Cross the Dam to the Nieuwezijds Voorburgwal behind the palace and walk south.
      nl: Steek de Dam over naar de Nieuwezijds Voorburgwal achter het paleis en loop naar het zuiden.
  - place: Telegraaf building
    narration: |
      The Nieuwezijds Voorburgwal was the city's newspaper street, and *De Telegraaf* built its printing works and offices here in 1928–1930. The architects were J.F. Staal, one of the core figures of the Amsterdam School, and G.J. Langhout. This late work moves towards functionalism, and the national register calls it functionalist. It is on the map as a transitional work.

      The building was organised from top to bottom: presses on the ground floor, offices on the next three floors, typesetting on the fourth and storage on the set-back fifth. Look at the front in dark, bronze-coloured glazed brick and granite. Then look up at the tower with its pierced, ribbed lead-clad spire, into which the flagpole could be lowered. The tower held the lifts and two water tanks, one for Vecht water and one for dune water.

      On the right are the doors for the paper rolls, which once had platform lifts down to the paper store in the basement.
    nl: |
      De Nieuwezijds Voorburgwal was de krantenboulevard van Amsterdam, en hier bouwde de N.V. Dagblad De Telegraaf in 1928–1930 een drukkerij met kantoren. De architecten waren J.F. Staal en G.J. Langhout; architect H. Wouda richtte de directiekamers in. Staal hoorde bij de kern van de Amsterdamse School, maar het Rijksmonumentenregister noemt dit late werk functionalistisch. Het staat op de kaart als overgangswerk.

      Het gebouw is van onder naar boven ingedeeld: op de begane grond de persen, op de eerste drie verdiepingen de kantoren, op de vierde de zetterij en op de teruggerooide vijfde de magazijnen. Bekijk de voorgevel van donker bronskleurige verglaasde steen en graniet, en de toren met de met lood beklede spits, waarin de vlaggenstok kon zakken. In de betonnen toren zaten de liften en twee waterreservoirs, voor Vecht- en duinwater.

      Rechts zitten de twee ijzeren deuren die ooit plateauliften hadden voor de papierrollen.
  - place: Modemagazijn Gerzon (Nieuwezijds Voorburgwal)
    narration: |
      A few doors on, the clock runs back to 1915. This wing of the Gerzon fashion store, designed by Adriaan Moen, is now the oldest part of the complex. The national register calls its façades "very plastic and lively", related to the earliest phase of the Amsterdam School, the same moment the Scheepvaarthuis was rising.

      Compare it with the Telegraaf just up the street. Some fifteen years lie between a front that is all modelling and one that is mostly function.

      Moen worked for Gerzon again in 1923–1926 on the large workshop block on the Singel and the Spuistraat, a few minutes' walk away.
    nl: |
      Een paar panden verder gaat de klok terug naar 1915. Dit achterste, nu oudste deel van modemagazijn Gerzon werd gebouwd naar ontwerp van Adriaan Moen. Het Rijksmonumentenregister beschrijft de gevels als "zeer plastisch-bewogen" en verwant aan de oudste fase van de Amsterdamse School: hetzelfde moment waarop het Scheepvaarthuis verrees.

      Vergelijk het met het Telegraafgebouw even verderop: zo'n vijftien jaar liggen tussen een gevel die helemaal boetseerwerk is en een die vooral functie is.

      Moen werkte in 1923–1926 opnieuw voor Gerzon, aan het grote ateliergebouw aan het Singel en de Spuistraat, op een paar minuten lopen.
    next:
      directions: Make your way east through the Kalverstraat to the Rokin. De Friesche is on the quiet side of the Rokin.
      nl: Loop via de Kalverstraat naar het Rokin. De Friesche staat aan de stille zijde.
  - place: De Friesche (Rokin 115)
    narration: |
      The insurer De Algemeene Friesche built this branch office in 1928. Its architects, Herman and Jan Baanders, were the brothers behind Van den Brul on the Nieuwendijk. Many insurers built new offices in Amsterdam in these years, and they liked modern, representative architecture with an open, welcoming ground floor.

      Here the ground floor is a triumphal arch: four octagonal pillars and a round arch of tapered bricks, with the arms of Amsterdam and North Holland over the side openings. Then look up. On the first floor Hildo Krop carved four figures as window posts, labelled WELVAART (prosperity, with fruit), ARBEID (labour, with tools), ZORG (care, with a bird) and RUST (rest). Together they show the blessings of life, as long as you are well insured.
    nl: |
      De verzekeraar De Algemeene Friesche liet dit kantoor in 1928 bouwen door H.A.J. en J. Baanders, dezelfde broers als van Van den Brul aan de Nieuwendijk. Hun vader was bekend geworden met winkelpuien en het EHLB-kantoor aan het Rokin. In deze jaren lieten veel verzekeraars nieuwe kantoren bouwen, met moderne, representatieve architectuur en een open, publieksvriendelijke begane grond.

      Hier is de begane grond een triomfpoort: vier achthoekige pijlers en een rondboog van tapse bakstenen, met de wapens van Amsterdam en Noord-Holland boven de zijopeningen. Kijk dan omhoog. Op de eerste verdieping staan als penanten vier figuren van Hildo Krop: WELVAART, ARBEID, ZORG en RUST. De zegeningen van het leven, mits goed verzekerd.
    next:
      directions: Cross the Rokin and head north-east to the Oudezijds Voorburgwal. The urinal stands at the canal's edge, opposite the old city hall.
      nl: Steek het Rokin over en loop naar de Oudezijds Voorburgwal. Het urinoir staat aan de waterkant, tegenover het oude stadhuis.
  - place: Urinal on the Oudezijds Voorburgwal
    narration: |
      Not every client in the old centre was a business. Public Works built this urinal in 1926, designed by A.R. Hulshoff, while the same department was finishing the new wing of the city hall across the water. It is a stone version of Jo van der Mey's cast-iron *plaskrul* (pee curl): a spiral screen of brick latticework on an oval stone base, under a flat round roof, rising from the canal edge.

      On top stands Hildo Krop's grey stone sculpture. Walk round it. On the entrance side a popular orator, fist clenched and mouth open, harangues the council chamber across the canal. On the other side is a cluster of heads, all with their mouths open.

      The national register calls it a rare example of Amsterdam School street furniture by Public Works.
    nl: |
      Niet alleen bedrijven bouwden hier. Het urinoir verrees in 1926 naar ontwerp van Allard Remco Hulshoff van de Dienst der Publieke Werken, terwijl dezelfde dienst aan de overkant de nieuwe stadhuisvleugel afbouwde. Het is een stenen variant op de metalen plaskrul van Jo van der Mey: een krul op een ovale natuurstenen sokkel, met bakstenen maaswerk en een overkragend rond, plat dak.

      Bovenop staat het hardstenen beeld van Hildo Krop. Loop eromheen. Aan de ingangszijde staat een volksredenaar met gebalde vuist en open mond, gericht op de raadzaal tegenover. Aan de andere kant een groep koppen, eveneens met open monden.

      Het Rijksmonumentenregister noemt het een representatief en zeldzaam voorbeeld van straatmeubilair van Publieke Werken in Amsterdamse Schoolstijl.
    next:
      directions: Walk a little way south along the quay and cross the Lommertbrug, a small Piet Kramer footbridge of 1926, to the old city hall.
      nl: Loop een stukje naar het zuiden langs de gracht en steek over via de Lommertbrug, een voetbrug van Piet Kramer uit 1926, naar het oude stadhuis.
  - place: City hall extension (Prinsenhof)
    narration: |
      When King Louis Napoleon took the city hall on the Dam as his palace in 1808, the city council moved here, to the Prinsenhof. In 1923–1926 Public Works added a wing in the Amsterdam School style, designed by Nicolaas Lansdorp and A.R. Hulshoff, with a new council chamber and a new wedding hall.

      Look at the galleries of sculpture on the canal front, and at how the brick wing sits beside the older Prinsenhof buildings. Inside, sculptors including Driekus Jansen van Galen, Anton Fortuin, Adrianus Remiëns and Bernard Richters decorated the rooms. The wedding hall has a tall stained-glass window that Rotterdam gave in 1925 for Amsterdam's 650th anniversary, with the arms of both cities.

      It was the city hall until 1988 and is now a hotel, which kept the wedding hall and its window. The wing, the urinal and the bridge you just crossed all date from the same few years.
    nl: |
      Nadat Lodewijk Napoleon in 1808 het stadhuis op de Dam als paleis in gebruik nam, trok het stadsbestuur naar het Prinsenhof. In 1923–1926 kwam er een uitbreiding in Amsterdamse Schoolstijl bij, met een nieuwe raadzaal en trouwzaal, ontworpen door Nicolaas Lansdorp, Allard Remco Hulshoff en Publieke Werken.

      Kijk naar de beeldengalerijen aan de grachtgevel en naar de nieuwe vleugel naast de oudere delen van het Prinsenhof. Binnen werkten onder anderen de beeldhouwers Driekus Jansen van Galen, Anton Fortuin, Adrianus Remiëns en Bernard Richters aan de aankleding. In de trouwzaal kwam een metershoog glas-in-loodraam met de wapens van beide steden, in 1925 door Rotterdam geschonken bij het 650-jarig bestaan van Amsterdam.

      Het gebouw bleef stadhuis tot 1988. Bij de verbouwing tot hotel bleven trouwzaal en raam bewaard. Vleugel, urinoir en Lommertbrug stammen alle drie uit dezelfde paar jaar.
    next:
      directions: Continue east to the Kloveniersburgwal. The Oudemanhuispoort passage is the most direct way when it is open.
      nl: Loop door naar de Kloveniersburgwal. Als de Oudemanhuispoort open is, is dat de kortste weg.
  - place: De Schaats (University building)
    narration: |
      Public Works also built for the university. P.L. Marnette designed this building on the Kloveniersburgwal for the University of Amsterdam in 1925–1927, the same years as the city hall wing. It is entered from the Oudemanhuispoort, the old almshouse gateway at the heart of the university's arts campus.

      Look across the canal to see where the nickname comes from. *De Schaats* means "the skate", and the large, multi-part window on the ground floor is shaped like one, swinging out of the wall plane on the left. Look too at the rounded corner, the tall, steep slate roof and the tower-like section on the left.

      Inside, the stairwell has a three-storey mural from 1951 by Peter Alma, *De Geschiedenis der Wetenschap* (the history of science).
    nl: |
      Publieke Werken bouwde ook voor de universiteit. P.L. Marnette ontwierp dit gebouw aan de Kloveniersburgwal in 1925–1927, dezelfde jaren als de stadhuisvleugel, met de toegang in de Oudemanhuispoort.

      De bijnaam verklaart zich vanaf de overkant van de gracht: het grote, meervoudig gelede venster op de begane grond heeft de vorm van een schaats en zwenkt links uit het gevelvlak. Let ook op de afgeronde hoek tussen voor- en zijgevel, het hoge, steile leien dakschild en het torenachtig bekroonde geveldeel links.

      In het trappenhuis zit over drie verdiepingen de wandschildering 'De Geschiedenis der Wetenschap' van Peter Alma uit 1951.
    next:
      directions: Head south across the Amstel to the Reguliersbreestraat.
      nl: Loop naar het zuiden, over de Amstel, naar de Reguliersbreestraat.
  - place: Tuschinski Theatre
    narration: |
      Abraham Tuschinski, a Polish-Jewish cinema operator who had settled in Rotterdam, bought up a slum called the Duvelshoek here in 1917 to build a "world theatre palace". Hijman Louis de Jong designed it in 1918, and after a falling-out with Tuschinski, Willem Kromhout took over. It opened on 28 October 1921 with a Wurlitzer theatre organ. Critics found it garish, and parts of the decoration were toned down in the 1930s.

      The national register calls it exuberant Art Deco, and English Wikipedia sees a blend of Art Deco, Art Nouveau and the Amsterdam School. It is on this map as the most famous building of the period around the Rembrandtplein. Look at the tall front between two domed towers, clad entirely in glazed tiles and ceramic sculpture by C. Bartels and B. Jordens, with four bronze lamps. Inside the working cinema, Jaap Gidding's lobby survives intact, with painted ceilings and a peacock-patterned carpet.

      Tuschinski and his brothers-in-law were murdered in the Holocaust in 1942. Pathé restored the building, and at its centenary in 2021 it received the royal title *Koninklijk*.
    nl: |
      Abraham Tuschinski exploiteerde vier bioscopen in Rotterdam toen hij in 1917 grond kocht in de Duvelshoek, tussen de Reguliersbreestraat en de Reguliersdwarsstraat, voor een "wereldtheaterpaleis". Hijman Louis de Jong ontwierp het in 1918; na onenigheid met Tuschinski nam Willem Kromhout zijn taken over. Op 28 oktober 1921 ging het open, met een Wurlitzer-theaterorgel. De kritiek op het "potsierlijke" gebouw leidde in de jaren dertig tot versobering van de decoraties.

      Het Rijksmonumentenregister spreekt van "uitbundige art deco"; het staat op deze kaart als blikvanger van de periode rond het Rembrandtplein, niet als zuivere Amsterdamse School. Kijk naar de hoge voorgevel tussen twee torens met koepeldaken, helemaal bekleed met geglazuurde tegels en keramische sculpturen van C. Bartels en B. Jordens, en de vier bronzen lampen. Binnen is de foyer van Jaap Gidding gaaf bewaard, met plafond- en wandschilderingen en tapijt met pauwmotief.

      Tuschinski en zijn zwagers werden in 1942 tijdens de Holocaust vermoord. Pathé restaureerde het theater, en bij het honderdjarig bestaan in 2021 kreeg het het predicaat Koninklijk.
    next:
      directions: Continue east to the Rembrandtplein.
      nl: Loop door naar het Rembrandtplein.
  - place: Rembrandtplein 44
    narration: |
      Three years before Tuschinski opened, a café-restaurant on the city's nightlife square had already gone "hypermodern". In 1918 the architect Van Schaik remodelled this building completely and gave it a front in the style De Klerk had only just introduced around the Spaarndammerplantsoen.

      The composition is still symmetrical and fairly conventional, but the strong modelling and the wealth of decorative brickwork announced a new era. According to the city register, the owner wanted an eye-catching building to give his business a face on the square.

      The register stresses that the style is rare in the old centre and calls this a remarkable example of the early, expressionist phase of the Amsterdam School. All the original window frames survive.
    nl: |
      Drie jaar vóór Tuschinski kreeg een café-restaurant aan het uitgaansplein al een "hypermoderne" gevel. Op deze plek had J.H. Lesmeister kort na 1900 een café-restaurant met biljartzaal gebouwd. In 1918 verbouwde architect Van Schaik het ingrijpend, in de stijl die De Klerk net rond het Spaarndammerplantsoen had geïntroduceerd.

      De symmetrische opzet is nog vrij conventioneel, maar de krachtige plasticiteit en de rijkdom aan siermetselwerk lieten zien dat er een nieuw tijdperk was begonnen. Volgens het gemeentelijk register koos de opdrachtgever bewust voor een opzienbarend gebouw om zijn zaak aan het plein een gezicht te geven.

      In de binnenstad zijn gebouwen in deze stijl zeldzaam. Alle raamkozijnen zijn nog origineel.
  - place: Amsterdamsche Bank (The Bank)
    narration: |
      The walk ends with a bank. The Amsterdamsche Bank built its head office on the corner of the Rembrandtplein and the Amstelstraat in 1926–1932. It was designed by the office of B.J. Ouëndag (father Bert Johan and son Willem Bert), who consulted Berlage, although little of his ideas is said to have survived. The interior once had much sculpture by Lambertus Zijl.

      Dutch sources class it as Amsterdam School, while English-language sources tend to call it Art Deco. Look at the large brick volume closing the corner, then at the tram tracks in the Amstelstraat that once let cash vans unload at the bank.

      The bank later merged into ABN AMRO, which left in 2002. After a spell as TomTom's headquarters, the building now holds restaurants and offices as The Bank. You started at the shipping lines' head office of 1912 and end at a bank head office finished in 1932: twenty years of the Amsterdam School in business.
    nl: |
      De wandeling eindigt bij een bank. Het bureau van B.J. Ouëndag ontwierp het hoofdkantoor van de Amsterdamsche Bank (1926–1932) en raadpleegde daarbij H.P. Berlage, al is van diens ideeën niet veel overgebleven. Het oorspronkelijke interieur bevatte veel beeldhouwwerk van Lambertus Zijl.

      Bekijk het grote bakstenen volume op de hoek van het Rembrandtplein en de Amstelstraat, en in de Amstelstraat het stukje strengelspoor, aangelegd zodat waardetransporten makkelijk bij de bank konden lossen.

      De bank ging op in de Amro Bank en ABN AMRO. Nadat die naar de Zuidas vertrok, zat hier een tijd TomTom; nu zitten er restaurants en bedrijven onder de naam The Bank. Begonnen bij het hoofdkantoor van de rederijen uit 1912, geëindigd bij een bankkantoor dat in 1932 klaar was: twintig jaar Amsterdamse School in zaken.
