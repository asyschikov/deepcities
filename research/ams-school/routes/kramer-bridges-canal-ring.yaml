title: Piet Kramer's bridges in the canal ring
summary: >-
  Thirteen bridges by Piet Kramer and Public Works, from the Raadhuisstraat to the Vijzelstraat:
  brick, granite and wrought iron, with Hildo Krop's faun, crows and fabulous beasts. A walk
  through the city's largest body of Amsterdam School work.
body: |
  **Start:** Brug 8, where the Raadhuisstraat crosses the Singel, a few minutes' walk west of the Dam. Trams run along the Raadhuisstraat.
  **End:** the Walenweeshuissluis (Brug 70) at the top of the Vijzelgracht, next to Vijzelgracht metro station.
  **Distance and time:** about 4.5 km. Allow about 2 to 2½ hours with stops.

  Everything is outdoors and free. Daylight is best, because much of the detail is low down on the piers and abutments; you see it best from the quay beside each bridge. The route follows streets and quays. There are no steps, but some bridges have a slope and many quays are cobbled.

  From 1917 to 1952 Piet Kramer was the architect of the bridges section of the city's Public Works department (Dienst der Publieke Werken). He made drawings for more than 500 bridges, and about 220 were built. For him a bridge was a piece of the street: a place to sit, a gateway, a stage for sculpture. Most of that sculpture is by Hildo Krop, the city sculptor.

  The walk does not follow the calendar. It starts with the four Raadhuisstraat bridges, designed in 1921–1923 and built in 1925, steps back to a 1921 footbridge from the office of Kramer's predecessor, follows the Lijnbaansgracht to the Leidseplein, and then takes the Leidsestraat bridges of 1921 and the Vijzelstraat bridges of 1922 and 1934–1935. On the last one you can see the ornament thinning out, as it did across the city in the 1930s.
mode: walk
nl:
  title: De bruggen van Piet Kramer in de grachtengordel
  summary: >-
    Dertien bruggen van Piet Kramer en Publieke Werken, van de Raadhuisstraat tot de Vijzelstraat:
    baksteen, graniet en smeedijzer, met de faunskop, kraaien en fabeldieren van Hildo Krop. Een
    wandeling langs het grootste ensemble Amsterdamse School in de stad.
  body: |
    **Start:** brug 8, waar de Raadhuisstraat het Singel kruist, een paar minuten lopen van de Dam. Door de Raadhuisstraat rijden trams.
    **Eind:** de Walenweeshuissluis (brug 70) aan het begin van de Vijzelgracht, naast metrostation Vijzelgracht.
    **Afstand en duur:** ongeveer 4,5 kilometer, met stops zo'n twee tot tweeënhalf uur.

    Alles is buiten en gratis te bekijken. Ga bij daglicht: veel details zitten laag, op de pijlers en landhoofden, en zijn het best te zien vanaf de kade naast de brug. De route loopt over straten en kades, zonder trappen, maar sommige bruggen hellen en veel kades hebben keien.

    Van 1917 tot 1952 was Piet Kramer architect bij de afdeling Bruggen van de Dienst der Publieke Werken. Hij tekende ruim vijfhonderd bruggen, waarvan er zo'n 220 werden gebouwd. Een brug was voor hem een stuk straat: een plek om te zitten, een poort, een sokkel voor beeldhouwwerk. Dat beeldhouwwerk is meestal van stadsbeeldhouwer Hildo Krop.

    De wandeling volgt niet de jaartallen. Eerst de vier bruggen in de Raadhuisstraat, getekend in 1921–1923 en gebouwd in 1925. Dan een stap terug, naar een voetbrug uit 1921 van het bureau van Kramers voorganger. Via de Lijnbaansgracht naar het Leidseplein, en daarna de Leidsestraatbruggen van 1921 en de Vijzelstraatbruggen van 1922 en 1934–1935. Aan de laatste zie je hoe de versiering in de jaren dertig minder werd.
stops:
  - place: Brug 8 (Raadhuisstraat, Singel)
    narration: |
      Start on the Singel bridge, the first of four Kramer bridges that carry the Raadhuisstraat west towards the Westerkerk. The street was cut through in the 1890s as the main road to Amsterdam-West. Around 1922 the city decided its bridges had to be replaced, and this one was rebuilt to Kramer's design between February and December 1925.

      Look over the side at the piers: brick and profiled stone blocks, stepped like a ziggurat. At the ends of the brick wings, half-round stone weights anchor the railing, and the stone pylons on the abutments are carved. Remember the pattern of the wrought-iron railing, because the next two bridges have the same one.

      For a long time the bridge was unofficially called the Huiszittensluis, after a poor-relief warehouse that stood where the main post office was later built. The city council dropped the name in 2016. Look north along the Singel towards the Torensluis.
    nl: |
      De wandeling begint op brug 8 over het Singel, de eerste van vier bruggen van Piet Kramer in de Raadhuisstraat, de route van de Dam naar de Westerkerk. Bij de aanleg van de Raadhuisstraat in 1894 was de oude brug al aangepast; rond 1922 besloot de gemeente tot vervanging, en van februari tot december 1925 werd de nieuwe brug gebouwd.

      Buig je over de leuning en kijk naar de pijlers: baksteen en geprofileerde natuursteen, trapsgewijs opgebouwd. Op de bakstenen vleugels zitten halfronde verzwaringen waaraan de leuning vastzit, en de natuurstenen pylonen op de landhoofden zijn gebeeldhouwd. Let op het siersmeedwerk van de balustrade: op de volgende twee bruggen kom je precies hetzelfde patroon tegen.

      De brug heette lang officieus Huiszittensluis, naar het Huiszittenpakhuis voor de armenbedeling, dat stond waar later het Hoofdpostkantoor kwam. In 2016 besloot de gemeenteraad die naam niet meer te gebruiken.
  - place: Warmoesbrug (Brug 22)
    narration: |
      The middle bridge of the set is named after the Warmoesgracht, the canal that was filled in to make the Raadhuisstraat. A bridge has stood here since at least 1599. The arched bridge of about 1895 could not cope with the traffic to Amsterdam-West or the trams. Kramer drew this replacement as early as 1921, but rising prices after the First World War held the work up until February 1925.

      Until 1957 three-rail track ran across it, so that the standard-gauge city trams and the metre-gauge tram to Zandvoort could share it.

      Compare it with Brug 8: the same brick abutments with carved stone blocks and bands, the same half-round weights holding the railing, and the same ironwork. New here are the decorated stone pylons halfway along the balustrade. Three bridges, one design: you are walking along a single composition.
    nl: |
      De Warmoesbrug dankt haar naam aan de Warmoesgracht, die na de demping Raadhuisstraat ging heten. Al op de kaart van Pieter Bast uit 1599 ligt hier een brug. De boogbrug van omstreeks 1895 kon het verkeer naar West en de trams niet aan. Kramer had in 1921 al een nieuw ontwerp klaar, maar door de prijsstijgingen na de Eerste Wereldoorlog begon de bouw pas in februari 1925.

      Tot 1 september 1957 lag hier drierailig spoor: normaalspoor voor de stadstram en meterspoor voor de tram naar Zandvoort, met één gedeelde spoorstaaf.

      Leg haar naast brug 8: dezelfde bakstenen landhoofden met gebeeldhouwde natuursteenblokken en -banden, dezelfde halfronde verzwaringen, hetzelfde siersmeedwerk. Midden in de balustrade staan hier gedecoreerde pylonen. Drie bruggen, één ontwerp: de Raadhuisstraat is als geheel bedacht.
  - place: Niek Engelschmanbrug (Brug 106)
    narration: |
      The Keizersgracht bridge is the richest of the three, with two spans instead of three. It was rebuilt in 1924–1925, and here Kramer's longest-standing partner comes in: Hildo Krop carved the granite sculpture on the middle piers. Look for a bearded faun's head between groups of three crows, with frogs' heads below. You see them best from the quay on either side, looking back at the pier.

      The wrought-iron railings were made by H.J. Winkelman, and sculpted stone pylons weight the ends of the brick wings.

      Since 2001 the bridge has carried the name of Niek Engelschman, a resistance fighter and a pioneer of the gay rights movement. Ahead, at the Westermarkt end, is the Homomonument, with the Westerkerk tower rising beyond it.
    nl: |
      De brug over de Keizersgracht is de rijkste van de drie, met twee doorvaarten in plaats van drie. Ze werd in 1924–1925 vernieuwd, en hier verschijnt de vaste partner van Kramer: Hildo Krop hakte het beeldhouwwerk op de middenpijlers. Zoek de granieten faunskop met lange baard tussen groepen van drie kraaien, met kikkerkoppen eronder. Je ziet ze het best vanaf de kade, schuin terugkijkend naar de pijler.

      De siersmeedwerk balustrades zijn ontworpen en gemaakt door H.J. Winkelman. Op de uiteinden van de bakstenen vleugels staan gebeeldhouwde pylonen.

      De brug is vernoemd naar Niek Engelschman, verzetsman en voorvechter van homorechten. Aan de kant van de Westermarkt ligt het Homomonument, met daarachter de toren van de Westerkerk.
  - place: Nieuwe-Wercksbrug (Brug 63)
    narration: |
      The fourth bridge takes the route over the Prinsengracht, from the Westermarkt into the Rozengracht. Kramer designed it in 1923, and the existing bridge was rebuilt to his design in 1925.

      After the faun and crows on the Keizersgracht, notice how much plainer it is. The sculpture at the ends of the brick abutments is simple. The character comes from the brick, the decorated stone blocks in the piers (best seen from the canal side), and the wrought-iron balustrade, which is fixed to the pylons and held at the ends by straps. Same architect and same years, but a much quieter bridge.

      Look up the Prinsengracht: the Westerkerk and the Anne Frank House are just along the quay.
    nl: |
      De vierde brug brengt de route over de Prinsengracht, van de Westermarkt naar de Rozengracht. Kramer ontwierp haar in 1923; in 1925 werd de bestaande brug naar zijn ontwerp verbouwd.

      Na de faunskop en de kraaien van de Keizersgracht valt op hoe sober deze is. Het beeldhouwwerk op de landhoofden is eenvoudig. Het karakter komt van de baksteen, de gedecoreerde natuursteen in de pijlers (het best te zien vanaf het water) en de smeedijzeren balustrade, die aan de pylonen is vastgezet en aan de uiteinden met stroppen is verankerd. Dezelfde architect, dezelfde jaren, maar een veel stillere brug.

      Kijk langs de Prinsengracht: de Westerkerk staat vlakbij.
    next:
      directions: From the Rozengracht end of the bridge, walk north along the Prinsengracht and turn left along the Egelantiersgracht.
      nl: Loop vanaf de Rozengrachtkant van de brug langs de Prinsengracht naar het noorden en sla linksaf langs de Egelantiersgracht.
  - place: Hilletjesbrug (Brug 125)
    narration: |
      A step back to before Kramer. Bridge design at Public Works had been led by Jo van der Mey, architect of the Scheepvaarthuis, and this little bridge of 1921 came from his office. The drawings credit only "the office of" Van der Mey, but his hand shows in the Amsterdam School detailing of the brick and stone abutments and in the quay walls that jut out on either side.

      The wrought-iron railings, by contrast, follow 18th-century patterns. Old and new sit together on one small bridge, where Kramer would soon design everything, ironwork included.

      Apart from a new deck in 1943 it has hardly changed in a hundred years. It is a twin of Brug 126, and it appears in the title sequence of the TV series *Baantjer*. The name may come from a local woman called Hilletje.
    nl: |
      Een stap terug, naar de tijd vóór Kramer. Bij Publieke Werken gaf Jo van der Mey, de architect van het Scheepvaarthuis, de toon aan bij de bruggen, en deze kleine brug uit 1921 kwam van zijn bureau. Zijn naam staat niet op de tekening, die "van het bureau van" Van der Mey heet, maar zijn hand is te zien in de Amsterdamse School-details van de landhoofden en de uitkragende walkanten.

      De leuningen zijn daarentegen typisch achttiende-eeuws smeedwerk. Oud en nieuw op één bruggetje; Kramer zou even later ook het smeedwerk zelf gaan tekenen.

      Behalve een nieuw brugdek in 1943 is de brug ruim honderd jaar onveranderd. Ze is een zusje van brug 126 en komt voor in de leader van Baantjer. De naam zou van een buurtbewoonster Hilletje komen.
    next:
      directions: Cross the Jordaan south-west to the far end of the Rozengracht, where it meets the Lijnbaansgracht.
      nl: Steek de Jordaan schuin over naar het eind van de Rozengracht, bij de Lijnbaansgracht.
  - place: Brug 117 (Rozengracht, Lijnbaansgracht)
    narration: |
      This is the far end of the road west from the Dam. Around 1885 the city chose the Rozengracht, not the Westerstraat, as the main road to Amsterdam-West. The canal was filled in, and after a dispute with the tram company a permanent bridge over the Lijnbaansgracht followed in 1891.

      The municipal register lists the present bridge as a 1926 design by Kramer. That fits the rebuilding of the whole road in the mid-1920s, when his bridges over the Singel, Herengracht, Keizersgracht and Prinsengracht went up: five Kramer bridges on one road.

      Look at the brick abutments and the stone details at the water's edge, much plainer than on the Keizersgracht. A few steps back east, Rozengracht 229–233 by Dick Greiner shows that the street also got Amsterdam School shops and housing.
    nl: |
      Hier eindigt de route van de Dam via Raadhuisstraat en Rozengracht. Rond 1885 koos de gemeente de Rozengracht, en niet de Westerstraat, als uitvalsweg naar Amsterdam-West. De gracht werd gedempt, en na getouwtrek met de trammaatschappij kwam er in 1891 een vaste brug over de Lijnbaansgracht.

      Het gemeentelijk monumentenregister noemt Piet Kramer als ontwerper van de huidige brug en 1926 als jaartal. Dat past bij de vernieuwing van de hele route halverwege de jaren twintig, toen ook zijn bruggen over Singel, Herengracht, Keizersgracht en Prinsengracht werden gebouwd. Deze brug is het sluitstuk.

      Kijk naar de landhoofden aan de waterkant: veel eenvoudiger dan op de Keizersgracht. Een paar stappen terug staat Rozengracht 229–233 van Dick Greiner, met winkels en woningen in Amsterdamse Schoolstijl.
    next:
      directions: Follow the Lijnbaansgracht south.
      nl: Volg de Lijnbaansgracht naar het zuiden.
  - place: Kramer bridges at the Passeerdersstraat (Brug 98, 99, 100)
    narration: |
      Here the Lijnbaansgracht meets two side canals, and in 1927–1928 Public Works renewed three neighbouring bridges to designs from Kramer's office. Brug 99 carries the Passeerdersstraat over the Lijnbaansgracht, Brug 100 (the Tetje de Jongbrug) crosses the Looiersgracht, and Brug 98 crosses the Passeerdersgracht in the eastern quay. In 1913 there had been plans to fill in the Looiersgracht; they came to nothing.

      The spans are fairly standard. Kramer's style is in the quay walls and abutments, best seen from the water's edge, in the wrought-iron railings that run to simply carved stone posts, and in the flower boxes. Bridges 99 and 100 are twins: compare their details.

      Around you are other monuments of the period: the 1939 housing block by Göbel and Den Hertog and the labour exchange (Arbeidsbeurs) on the Passeerdersgracht.
    nl: |
      Hier kruist de Lijnbaansgracht twee zijgrachten, en in 1927–1928 vernieuwde Publieke Werken drie naburige bruggen naar ontwerp van (het bureau van) Piet Kramer. Brug 99 ligt in de Passeerdersstraat over de Lijnbaansgracht, brug 100, de Tetje de Jongbrug, over de Looiersgracht, en brug 98 in de oostkade van de Lijnbaansgracht over de Passeerdersgracht. In 1913 was nog voorgesteld de Looiersgracht te dempen, maar dat ging niet door.

      De overspanningen zijn vrij standaard. De Amsterdamse School zit in de walkanten en landhoofden, het best te zien vanaf de waterkant, in de siersmeedwerk balustrades tot aan eenvoudig bewerkte natuurstenen kolommen, en in de bloembakken. Brug 99 en 100 zijn zusjes: vergelijk de details maar.

      Vlakbij staan het woonblok van Göbel en Den Hertog uit 1939 en de Arbeidsbeurs aan de Passeerdersgracht.
    next:
      directions: Continue south to the Leidseplein. The bridge crosses the Singelgracht on the far side of the square.
      nl: Loop verder naar het zuiden, naar het Leidseplein. De brug ligt aan de overkant van het plein, over de Singelgracht.
  - place: Leidsebrug (Brug 174)
    narration: |
      After the neighbourhood bridges, a gateway. The Leidsebrug carries one of the main approaches to the old city over the Singelgracht, between the Stadhouderskade and the Leidseplein. Kramer designed it in 1923, it was finished in 1925, and the sculpture is by Johan Polet.

      Look at the granite corner blocks, richly carved with hippopotamuses and lion heads. Then sit down. The low walls along the quays have wooden benches built in, ending in round, pointed knobs. The national register notes that this was the first bridge whose design included seating.

      This is Kramer's idea of a bridge at its clearest: not only a way across the water but a place to stop, with wrought-iron balustrades on the walls and on the bridge itself.
    nl: |
      Na de buurtbruggen een poort. De Leidsebrug over de Singelgracht verbindt de Stadhouderskade met het Leidseplein en is een van de belangrijkste toegangen tot de binnenstad. Kramer ontwierp haar in 1923, in 1925 was ze klaar, en het beeldhouwwerk is van Johan Polet.

      Bekijk de overdadig gedecoreerde granieten hoekblokken met nijlpaarden en leeuwenkoppen. En ga even zitten: in de borstweringen langs de walkant zijn houten zitbanken opgenomen, die eindigen in ronde, spits toelopende bollen. Volgens het Rijksmonumentenregister is dit de eerste brug waarin zitelementen in het ontwerp waren opgenomen.

      Zo zag Kramer een brug het liefst: niet alleen een oversteek maar een plek om te blijven, met smeedijzeren balustrades op de borstweringen en op de brug zelf.
    next:
      directions: Walk back across the Leidseplein into the Leidsestraat.
      nl: Loop terug over het Leidseplein de Leidsestraat in.
  - place: Aalmoezeniersbrug (Brug 68)
    narration: |
      The Leidsestraat crosses three canals, and in 1921 Kramer gave all three bridges one design. They are the oldest Kramer bridges on this walk. Their sculpture is older still: Hildo Krop designed it in 1916, and the firm of Johan Polet carved it.

      On this, the southernmost of the three, look for four fabulous beasts carved into the grey granite capping slabs. The brick wing walls step back horizontally, with stone blocks at the waterline, and the piers step out into stone corbels under the wrought-iron balustrade.

      Keep these features in mind. You will find every one of them again on the next two bridges.
    nl: |
      De Leidsestraat kruist drie grachten, en in 1921 gaf Kramer de drie bruggen één ontwerp. Het zijn de oudste Kramerbruggen van deze wandeling. Het beeldhouwwerk is nog ouder: Hildo Krop ontwierp het al in 1916, de firma Johan Polet hakte het.

      Op deze zuidelijkste van de drie liggen vier fabeldieren in de afdekplaten van grijs graniet. De bakstenen vleugels zijn horizontaal getrapt, met natuursteenblokjes bij de waterlijn, en de pijlers gaan over in natuurstenen uitkragingen onder de smeedijzeren balustrade.

      Onthoud ze goed: op de volgende twee bruggen kom je ze allemaal weer tegen.
  - place: Brug 43 (Leidsestraat, Keizersgracht)
    narration: |
      One canal on, the same design. Here are the four fabulous beasts in the grey granite again, the horizontally stepped wing walls with their brickwork motif and stone blocks at the waterline, and the wrought-iron balustrade on stepped piers.

      The beasts are Krop's work. He was a baker's son from Steenwijk who had learned to carve stone in Paris, Amsterdam and Berlin, and he had worked on the sculpture of the Scheepvaarthuis before joining Public Works. Kramer did the brick, granite and iron, and Krop added the figures. That division of labour would last for decades, all over the city.
    nl: |
      Eén gracht verder, hetzelfde ontwerp. Weer vier fabeldieren in grijs graniet, weer de horizontaal getrapte vleugels met een gemetseld siermotief en natuursteen bij de waterlijn, weer de smeedijzeren balustrade op getrapte pijlers.

      De fabeldieren zijn van Krop, een bakkerszoon uit Steenwijk die eerst banketbakker was en in Parijs, Amsterdam en Berlijn leerde beeldhouwen. Hij werkte in het atelier van Hendrik van den Eijnde aan het Scheepvaarthuis en werd daarna stadsbeeldhouwer. Kramer deed de baksteen, het graniet en het smeedwerk, Krop de beelden. Die taakverdeling hielden ze tientallen jaren vol, in de hele stad.
  - place: Koningssluis (Brug 29)
    narration: |
      The third bridge of the set crosses the Herengracht where the Leidsestraat opens onto the Koningsplein. It was also rebuilt in 1921 for the Bridges section of Public Works, with Krop's beasts carved by Polet.

      Look once more at the four beasts on the capping stones, then at the piers, which step up vertically into stone corbels carrying the ornamental balustrade. By walking the Leidsestraat you have crossed all three, which was the point of giving one street one design.

      Compare this set with the Raadhuisstraat bridges at the start. Here the sculpture lies in the capping slabs. There, a few years later, it stands up in carved pylons and fills the piers with faun, crows and frogs.
    nl: |
      De derde brug van het drietal overspant de Herengracht, waar de Leidsestraat uitkomt op het Koningsplein. Ook deze kreeg in 1921 haar huidige vorm naar ontwerp van Kramer, voor de Afdeling Bruggen van Publieke Werken, met de fabeldieren van Krop, gehakt door Polet.

      Kijk nog één keer naar de vier fabeldieren op de afdekplaten en naar de verticaal getrapte pijlers met natuurstenen uitkragingen en sierbalustrade. Wie de Leidsestraat afloopt, steekt ze alle drie over.

      Vergelijk ze met de Raadhuisstraatbruggen van het begin. Hier zit het beeldhouwwerk in de afdekplaten, daar staat het een paar jaar later rechtop in gebeeldhouwde pylonen en vult het de pijlers met faunskop, kraaien en kikkers.
    next:
      directions: Follow the Herengracht east to the Vijzelstraat and turn right.
      nl: Volg de Herengracht naar het oosten tot de Vijzelstraat en sla rechtsaf.
  - place: Johanna Borskibrug (Brug 41)
    narration: |
      The Vijzelstraat was widened, and its bridges were rebuilt as part of the job. This one over the Keizersgracht followed in 1922, to Kramer's design.

      Look at the stone pylons at the ends of the wing walls. They are chiselled with SPQA: *Senatus Populusque Amstelodamensis*, "the Senate and People of Amsterdam", a Roman formula for the city. The brick wing walls are laid in a special bond with segmental arches, on stone blocks that run down below the waterline. The piers are stepped and decorated, in stone and brick, under a wrought-iron balustrade.

      The bridge is named after Johanna Borski, the 19th-century banker.
    nl: |
      De Vijzelstraat werd verbreed, en de bruggen werden daarbij vernieuwd. Deze over de Keizersgracht kreeg in 1922 haar huidige vorm naar ontwerp van Kramer.

      Kijk naar de natuurstenen pylonen op de vleugeleinden: daarin is SPQA gebeiteld, *Senatus Populusque Amstelodamensis*, senaat en volk van Amsterdam. De bakstenen vleugels hebben segmentbogen en staan op blokken natuursteen die tot onder de waterlijn doorlopen. De pijlers van natuur- en baksteen zijn getrapt en versierd, met een smeedijzeren balustrade erop.

      De brug is genoemd naar Johanna Borski, de negentiende-eeuwse bankierster.
  - place: Walenweeshuissluis (Brug 70)
    narration: |
      The last link of the widened Vijzelstraat carries it over the Prinsengracht to the filled-in Vijzelgracht. Because filling in the Vijzelgracht was delayed, this was the last of the street's bridges to be finished. It was built in two halves between July 1934 and June 1935, so that traffic could keep moving.

      Compare it with the Leidsestraat bridges of 1921. Brick, natural stone and ornate wrought-iron balustrades are still here, and Kramer's hand is recognisable throughout. But the sculpture has shrunk to a few simple details, attributed to Kramer himself. This is the 1930s on Kramer's bridges: less ornament.

      Subsidence forced the city to take the bridge apart and rebuild it in 2020–2021. The walk ends here, by Vijzelgracht metro station.
    nl: |
      Het sluitstuk van de verbrede Vijzelstraat verbindt de straat over de Prinsengracht met de gedempte Vijzelgracht. Omdat de demping van de Vijzelgracht vertraging opliep, was dit de laatste brug op deze route. Ze werd tussen 9 juli 1934 en 8 juni 1935 in twee helften gebouwd, zodat het verkeer kon blijven doorgaan.

      Leg haar naast de Leidsestraatbruggen van 1921. Baksteen, natuursteen en sierlijke smeedijzeren balustrades zijn er nog, en Kramers hand is overal herkenbaar. Maar het beeldhouwwerk is teruggebracht tot een paar eenvoudige details, toegeschreven aan Kramer zelf. Zo zien de jaren dertig eruit op zijn bruggen: de versiering wordt minder.

      In 2020–2021 is de brug wegens verzakking in delen gedemonteerd en weer opgebouwd. Hier, bij metrostation Vijzelgracht, eindigt de wandeling.
