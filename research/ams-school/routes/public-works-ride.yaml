title: "The city builds: bathhouses, schools and pumping stations"
summary: >-
  A bike loop past the buildings Amsterdam designed for itself, from the Public Works yard on
  Uilenburg to a polder pumping station on the Amstel and back: round bathhouses, double schools,
  a sewage pumping station, a tram depot, Berlage's Amstel bridge and the old health service.
body: |
  This is a loop: it starts and finishes at the Werf Uilenburg on the Nieuwe Uilenburgerstraat, a
  few minutes' walk from the Nieuwmarkt and Waterlooplein metro stations. It runs south-west
  through the canal ring to the Rijksmuseum, through De Pijp into Plan Zuid and down the Amstel to
  Zorgvlied cemetery. Then it crosses the river on the Berlagebrug and comes back north through the
  Oosterparkbuurt and the Plantage. It is about 14 km by bike. Allow three to three and a half hours
  with stops.

  For a shorter, one-way ride of about 8.5 km, finish after Gemaal Stadwijck: tram 4 stops at the
  Victorieplein, about 1 km away.

  Almost everything is seen from the street. The Badhuistheater (Boerhaaveplein) and Splendor
  (Uilenburg) are a theatre and a music venue that you can enter for a performance. The other
  buildings are homes, studios, offices or schools, and the Remise Lekstraat is a working tram
  depot, so please look from the pavement.

  Between about 1915 and 1935 the city's Public Works department (*Dienst der Publieke Werken*)
  designed schools, bathhouses, pumping stations and other civic buildings in the new style. The
  department signed its work as a team, which is why so many places on this map say simply
  "Public Works". This ride follows that programme from Uilenburg, the city's first slum-clearance
  area, past the Rijksmuseum into the new districts of Plan Zuid, and back through Oost. You will
  see baths for homes without bathrooms, handsome schools for working-class children, and
  technical buildings that were each given an architectural face.
mode: bike
photos: ["commons:File:Badhuis Boerhaaveplein 28.JPG"]
nl:
  title: "De stad bouwt: badhuizen, scholen en gemalen"
  summary: >-
    Een fietsrondje langs de gebouwen die Amsterdam voor zichzelf ontwierp, van de werf van Publieke
    Werken op Uilenburg naar een poldergemaal aan de Amstel en terug: ronde badhuizen, dubbele
    scholen, een rioolgemaal, een tramremise, de Berlagebrug en de oude GGD.
  body: |
    Deze tocht is een rondje: hij begint en eindigt bij de Werf Uilenburg aan de Nieuwe
    Uilenburgerstraat, een paar minuten lopen van de metrostations Nieuwmarkt en Waterlooplein. Je
    fietst zuidwestwaarts door de grachtengordel naar het Rijksmuseum, door De Pijp naar Plan Zuid
    en langs de Amstel naar begraafplaats Zorgvlied. Over de Berlagebrug steek je de rivier over,
    en door de Oosterparkbuurt en de Plantage kom je terug. Het is ongeveer 14 km fietsen. Reken met
    de stops op drie tot drieënhalf uur.

    Liever korter? Stop dan na Gemaal Stadwijck: zo'n 8,5 km, en op het Victorieplein, een kilometer
    verderop, stopt tram 4.

    Bijna alles bekijk je vanaf de straat. In het Badhuistheater aan het Boerhaaveplein en in
    Splendor op Uilenburg kom je binnen bij een voorstelling of concert. De andere gebouwen zijn
    woningen, ateliers, kantoren of scholen, en de Remise Lekstraat is een werkende tramremise:
    kijk dus vanaf de stoep.

    Tussen ruwweg 1915 en 1935 ontwierp de Dienst der Publieke Werken scholen, badhuizen, gemalen
    en andere gemeentegebouwen in de nieuwe trant. De dienst presenteerde zijn gebouwen als werk
    van de afdeling, niet van een ontwerper; daarom staat er in de registers zo vaak alleen
    'Publieke Werken'. Deze route volgt dat programma vanaf Uilenburg, het eerste
    stadsvernieuwingsgebied van Amsterdam, langs het Rijksmuseum naar de nieuwe wijken van Plan
    Zuid en door Oost weer terug. Badhuizen voor woningen zonder bad, mooie scholen voor
    arbeiderskinderen en nutsgebouwen die allemaal een eigen architectuur kregen.
stops:
  - place: Werf Uilenburg (Public Works yard)
    narration: |
      Start where the drawings were made. Over the entrance, gilded letters still read PUBLIEKE
      WERKEN, AFDEELING RIOLEERING EN BRUGGEN. The sewers and bridges sections of Public Works
      moved into this building in 1926, and here Piet Kramer designed his Amsterdam bridges. It was
      designed in-house under the city architect A.R. Hulshoff, as was nearly everything on this
      ride.

      Look at the strict, stepped brick volumes, the two long bands of white-framed windows and the
      narrow, almost windowless corner that works as a tower. Next door stands the Uilenburger
      Synagogue of 1766. This was the heart of the old Jewish quarter. In 1910 hundreds of its
      homes were declared unfit to live in, and in the 1920s the city cleared the alleys and
      rebuilt the street you are standing in.
    nl: |
      Hier begint het, bij de tekentafel. Boven de ingang staat nog in vergulde letters PUBLIEKE
      WERKEN, AFDEELING RIOLEERING EN BRUGGEN. In oktober 1926 verhuisden de afdelingen Riolering
      en Bruggen naar dit gebouw, en hier tekende Piet Kramer zijn Amsterdamse bruggen. Het ontwerp
      kwam van Publieke Werken zelf, onder stadsarchitect A.R. Hulshoff, net als bijna alles op deze
      tocht.

      Let op de strenge, verspringende bakstenen volumes, de twee lange vensterstroken met wit
      kozijnhout en het smalle, bijna gesloten hoekvolume dat als toren werkt. Ernaast staat de
      Uilenburgersjoel uit 1766. Uilenburg was overvol: in 1910 werden 368 van de 861 woningen
      onbewoonbaar verklaard. In de jaren twintig liet de gemeente de stegen slopen en kwam de brede
      Nieuwe Uilenburgerstraat waar je nu staat.
    next:
      directions: The school and the bathhouse are a little further along the same street.
      nl: De school en het badhuis liggen iets verderop in dezelfde straat.
  - place: Double school Nieuwe Uilenburgerstraat
    narration: |
      The clearance brought more than homes. In 1920 Public Works built two primary schools here
      around one shared playground: a corridor school on this street and a corner school on the
      Oudeschans side, linked by a low wing with the gym. The classrooms face south-east for the
      sun, and corridors keep the toilets apart from them. The hygiene ideas of the day are built
      into the plan.

      From the street, look at the heavy walls of dark-brown brick, the brick mosaics
      (*metselmozaïek*) above the second-floor windows, and windows sized to the rooms behind them.
      Each street front is designed differently, to answer the buildings opposite. Remember this
      double school: on the Smaragdplein you will see the same idea in a new district, where there
      was room to spare.
    nl: |
      De sanering leverde meer op dan woningen. In 1920 bouwde Publieke Werken hier twee scholen
      voor gewoon lager onderwijs rond één speelplaats: een gangenschool aan deze straat en een
      hoekschool aan de Oude Schans, met daartussen een lage vleugel met het gymnastieklokaal. De
      lokalen liggen op het zuidoosten en de wc's zijn door gangen van de klassen gescheiden, zoals
      de ideeën over hygiëne en licht toen voorschreven.

      Kijk naar de zware muren van donkerbruine baksteen, de metselmozaïeken boven de vensters van
      de tweede verdieping en de roedenvensters, groot of klein naar gelang het lokaal erachter.
      Elke straatgevel is anders en speelt in op de overkant. Onthoud deze dubbele school: aan het
      Smaragdplein zie je straks hetzelfde idee in een nieuwe wijk, waar wél ruimte was.
  - place: Former bathhouse Uilenburg (Splendor)
    narration: |
      In a neighbourhood where few homes had a bath, the city combined a public bathhouse
      (*badhuis*) with a depot of the street-cleaning service. Public Works designed it in 1919,
      the year after the council decided to build a series of bathhouses. Men and women had their
      own wings, each with a changing room, showers, bath cubicles and a waiting room.

      Look at the colour. Bright red brick rises above a plinth of large black-glazed bricks set on
      end. The gateway in the middle is built entirely of black glazed brick, with carved stone
      corner blocks and a double iron gate. Later it was a bicycle factory, and since 2013 some
      fifty musicians have run it as the music venue Splendor. This is the first of three
      bathhouses on the ride. The other two, in the Diamantbuurt and on the Boerhaaveplein, are
      round.
    nl: |
      In een buurt waar bijna niemand een bad had, combineerde de gemeente een badhuis met een
      sectiepost van de Stadsreiniging. Publieke Werken ontwierp het in 1919, een jaar nadat de
      gemeente tot een reeks badhuizen had besloten. Mannen en vrouwen hadden elk een eigen afdeling
      met kleedruimte, douches, badlokalen en wachtkamer.

      Let op de kleur: helderrode baksteen boven een borstwering van grote zwart geglazuurde stenen
      in staand verband, en in het midden de poort, helemaal in zwart geglazuurde steen, met
      natuurstenen hoekblokken en een dubbel ijzeren hek. Later zat hier een rijwielfabriek; sinds
      2013 runnen zo'n vijftig musici er muziekgebouw Splendor. Dit is het eerste van drie badhuizen
      op de route; de andere twee, in de Diamantbuurt en aan het Boerhaaveplein, zijn rond.
    next:
      directions: >-
        Ride south-west through the canal ring to the Stadhouderskade, at its corner with the
        Ruysdaelkade, about 2.3 km.
      nl: >-
        Fiets zuidwestwaarts door de grachtengordel naar de Stadhouderskade, op de hoek met de
        Ruysdaelkade, ongeveer 2,3 km.
  - place: Rioolgemaal F
    narration: |
      Public Works also built what nobody thinks about. After 1913 the 19th-century districts
      outside the Singelgracht got a sewer system with seven pumping stations, lettered A to G.
      Station F, built in 1924, was the only one that also boosted the main sewer from the
      Haarlemmerpoort to the central pumping station on the Zeeburgerdijk. That is why it stands
      here, halfway along the line, near the Rijksmuseum.

      The site is a leftover triangle between the Boerenwetering and the Stadhouderskade. On it,
      four buildings and a connecting wall step up towards the point like a small brick fortress.
      Look for the date 1925 on the building on the Stadhouderskade, and the giant sequoia in the
      Ruysdaelplantsoen in front. The station pumped until 1987; the buildings are now let for
      cultural use.
    nl: |
      Publieke Werken bouwde ook wat niemand ziet. Vanaf 1913 kregen de negentiende-eeuwse wijken
      buiten de Singelgracht een rioolstelsel met zeven gemalen, A tot en met G. Gemaal F, in 1924
      gebouwd, was het enige dat ook als overpompgemaal diende voor het hoofdriool van de
      Haarlemmerpoort naar het hoofdgemaal aan de Zeeburgerdijk. Daarom staat het hier, halverwege
      die lijn, naast het Rijksmuseum.

      Op het driehoekige restperceel tussen Boerenwetering en Stadhouderskade bouwen vier gebouwtjes
      en een verbindende muur zich getrapt op naar de punt, als een kleine middeleeuwse burcht. Wie
      het ontwierp, vermeldt het register niet; de Nederlandse Wikipedia noemt Hulshoff. Zoek het
      jaartal 1925 op het gebouwtje aan de Stadhouderskade en de mammoetboom in het
      Ruysdaelplantsoen. Tot 1987 werd hier gepompt; nu zitten er culturele huurders.
    next:
      directions: Ride south-east through De Pijp to the Diamantbuurt, about 2 km.
      nl: Fiets zuidoostwaarts door De Pijp naar de Diamantbuurt, ongeveer 2 km.
  - place: Smaragdplein school
    narration: |
      Back to schools, now in a new district with room to spare. Public Works built this one in
      1920 as a double school: two primary schools under one roof, sharing a gym, one of the first
      of its kind. The design is attributed to Nicolaas Lansdorp, who became the city's main
      school architect. Nobody yet knew whether the space around it would be a square or the
      inside of a block, so it got good fronts on every side.

      Compare it with the dark Uilenburg school. Here the brick is yellow on a red plinth, with
      saw-tooth corners and toothed brickwork at the base and roofline. At each entrance is a small
      limestone sculpture by Hildo Krop, a ram's head with animals at the sides. The city register
      calls it one of the most beautiful Amsterdam School schools, an example of the socialist
      belief that handsome schools would raise working-class taste.
    nl: |
      Terug naar de scholen, nu in een nieuwe wijk met ruimte. Publieke Werken bouwde hier in 1920
      een dubbele school: de Jan Lievensschool en de Graaf Floris V-school onder één dak, met een
      gezamenlijke gymzaal. Het ontwerp wordt toegeschreven aan Nicolaas Lansdorp, die de
      belangrijkste scholenarchitect van de gemeente werd. Omdat lang onduidelijk bleef of hier een
      plein of een binnenterrein zou komen, kreeg het gebouw aan alle kanten een verzorgde gevel.

      Vergelijk het met de donkere school op Uilenburg: hier gele baksteen op een rode plint, met
      een zaagtandmotief op de hoeken en vertand metselwerk langs voet en daklijst. Bij de ingangen
      staan twee kalkstenen beeldjes van Hildo Krop, een ramskop met dieren opzij. Het register
      noemt het een van de mooiste scholen in Amsterdamse Schoolstijl. Mooie scholen moesten volgens
      de SDAP bijdragen aan de verheffing van de arbeiders.
  - place: Badhuis Diamantstraat
    narration: |
      A few steps away, where the Smaragdplein meets the Diamantstraat, stands the second bathhouse.
      The flats of the Diamantbuurt were built without bathrooms. On 16 October 1926 Alderman De
      Miranda opened this one, with eight showers and two tubs each for men and women.

      It is round, like the older bathhouse on the Boerhaaveplein near the end of the ride, but
      built up in stepped rings: low bathing cells outside, a higher corridor ring, and an eight-sided core under a slate tent
      roof with fan-shaped dormers. The design is attributed to Westerman, though he had left
      Public Works years before it was built. By the twin porches on the east side, find the stone
      placed by the tenants of three housing associations around it: De Dageraad, the Algemeene
      Woningbouwvereniging and Eigen Haard. It closed in the 1970s and has held artists' studios
      since about 2015.
    nl: |
      Een paar stappen verder, waar het Smaragdplein de Diamantstraat raakt, staat het tweede
      badhuis. De woningen van de Diamantbuurt hadden geen badkamer. Wethouder De Miranda opende dit
      badhuis op 16 oktober 1926, met voor mannen en vrouwen elk acht stortbaden en twee kuipbaden.

      Het is rond, net als het oudere badhuis aan het Boerhaaveplein aan het eind van de tocht, maar
      opgebouwd in ringen: lage badcellen, een hogere gangring en een achtkantige kern onder een leien tentdak met
      waaiervensters. Het ontwerp wordt aan Westerman toegeschreven, al was hij bij de bouw al jaren
      weg bij de dienst. Zoek onder het venster bij de ingang de gedenksteen van de bewoners van De
      Dageraad, de Algemeene Woningbouwvereniging en Eigen Haard. In de jaren zeventig ging het
      dicht; sinds een opknapbeurt rond 2015 zitten er ateliers.
  - place: Onderstation Borssenburgplein
    narration: |
      Even the power grid got architecture. The municipal electricity company (GEB) needed
      substations for its growing network, and in the new districts Public Works designed them as
      objects in the street. This one of 1924 stands free between the Borssenburgplein and the
      Amstelkanaal, with showpiece fronts facing both.

      It is the businesslike side of the style: yellow brick, black glazed tiles along the plinth,
      black-painted stone, and every front built up from asymmetrical rectangular blocks. Look for
      the concrete canopies set diagonally across the corners above steel doors with woven-pattern
      grilles, and the ventilation structure on the roof with its stone slabs and balls. A few
      hundred metres from Krop's rams at the school, the same department strikes a very different
      mood.
    nl: |
      Zelfs het stroomnet kreeg architectuur. Het Gemeentelijk Electriciteitsbedrijf had
      onderstations nodig voor zijn groeiende net, en in de nieuwe wijken ontwierp Publieke Werken ze
      als beeldbepalende objecten. Dit onderstation uit 1924 staat vrij, met de representatieve
      gevels naar het Borssenburgplein en het Amstelkanaal.

      Het is de zakelijk-expressionistische kant van de stijl: gele baksteen in Vlaams verband, zwart
      geglazuurde tegels langs de plint, zwart geschilderde hardsteen en asymmetrische gevels uit
      rechthoekige elementen. Let op de overhoekse betonnen luifels boven stalen deuren met
      gevlochten sierroosters, en op de ventilatie-opbouw op het dak met natuurstenen platen en
      bollen. Een paar honderd meter van Krops ramskoppen slaat dezelfde dienst een heel andere toon
      aan.
  - place: Meerhuizenplein school
    narration: |
      Five years after the Smaragdplein, Public Works designed another double school, for the
      Berlageschool and the Meerhuizenschool with a shared gym. This time the building is also part
      of the town plan. It stands on the central axis of the Meerhuizenplein and was built as a
      wall of the square, in line with Plan Zuid's idea that public space and architecture belong
      together.

      Look at the broad dark-yellow front, where the white window frames are part of the
      composition, and the higher central section with the clock in its low, wide tower. The two
      entrances answer each other: the west door sits in a corner that bulges out, the east door in
      one that curves in. Inside, on the stair walls, are two sgraffito murals by the German
      expressionist Herbert Fiedler.
    nl: |
      Vijf jaar na het Smaragdplein ontwierp Publieke Werken weer een dubbele school, voor de
      Berlageschool en de Meerhuizenschool, met een gezamenlijke gymzaal. Nu is het gebouw ook
      stedenbouw: het staat op de middenas van het Meerhuizenplein en vormt met de lage, brede
      klokkentoren een monumentale pleinwand.

      Kijk naar de brede gevel van donkergele baksteen, waarin de witte houten kozijnen met roeden
      als compositie-element zijn gebruikt, en naar het verhoogde middendeel met de klok. De twee
      ingangen zijn elkaars spiegelbeeld: de westelijke zit in een bol, de oostelijke in een hol
      gevormd bouwdeel. Binnen staan op de trapwanden twee sgraffito's van de Duitse
      expressionistische kunstenaar Herbert Fiedler.
    next:
      directions: Ride to the Amsteldijk; the depot's tram entrances face the river.
      nl: Fiets naar de Amsteldijk; daar liggen de inritten van de remise.
  - place: Remise Lekstraat
    narration: |
      The biggest building of the ride. A wooden temporary tram shed stood here from 1918, on land
      kept for a new depot, and in 1925 the city decided to build it properly. The first half came
      into use on 27 August 1927 and the second in 1930. With room for 320 trams it was then the
      largest tram depot in Europe, and it is still in use. Trams drive in from the Amsteldijk and
      leave on the Lekstraat side.

      Public Works kept the long brick walls plain and put the accents at the entrances and the
      offices. Look for Hildo Krop's openwork relief of the map of Amsterdam, a fitting emblem for
      a department that was building so much of the city. It is a working depot, so watch from the
      pavement.
    nl: |
      Het grootste gebouw van de tocht. Vanaf december 1918 stond hier een houten hulpremise, op
      grond die al voor een nieuwe remise was gereserveerd, en op 27 mei 1925 besloot de gemeente
      tot de bouw. Het eerste deel ging op 27 augustus 1927 in gebruik, het tweede was in 1930 klaar.
      Met plaats voor 320 tramwagens was het de grootste tramremise van Europa, en ze is nog altijd
      in bedrijf: de trams rijden aan de Amsteldijk naar binnen en aan de Lekstraat naar buiten.

      Publieke Werken hield de lange bakstenen gevels sober en legde de accenten bij de inritten en
      de kantoren. Zoek het opengewerkte reliëf van Hildo Krop met de plattegrond van Amsterdam, een
      passend embleem voor een dienst die zoveel van de stad bouwde. Het is een werkende remise:
      kijk vanaf de stoep.
    next:
      directions: >-
        Follow the Amsteldijk south along the river for about 1.4 km, to where it crosses the
        Kleine Wetering by Zorgvlied cemetery.
      nl: >-
        Volg de Amsteldijk langs de rivier ongeveer 1,4 km naar het zuiden, tot waar hij bij
        begraafplaats Zorgvlied de Kleine Wetering oversteekt.
  - place: Zorgvliedbrug
    narration: |
      Here the Amsteldijk crosses the Kleine Wetering on a small bridge by Piet Kramer, drawn in
      1921 by the same department whose yard you saw on Uilenburg. It belongs to a group built
      together with the Gemaal Stadwijck, the Zorgvlied lock and the houses of the machinist and
      the lock keeper, and it is named after Zorgvlied cemetery next door.

      It has Kramer's usual mix of brick and natural stone, with ornaments set into the brick
      panels. But look at the balustrades: milled wooden beams instead of the wrought-iron railings
      he normally specified, which makes this bridge unusual among his several hundred. From the
      bridge you can see the pumping station and the lock.
    nl: |
      Hier gaat de Amsteldijk over de Kleine Wetering, op een brugje van Piet Kramer uit 1921,
      getekend bij dezelfde dienst als de werf op Uilenburg. De brug hoort bij een complex met
      gemaal Stadwijck, de Zorgvliedschutsluis en de woningen van sluiswachter en machinist, en is
      vernoemd naar de begraafplaats ernaast.

      Je ziet Kramers gebruikelijke mengeling van bak- en natuursteen, met ornamenten in de
      baksteenvlakken. Maar kijk naar de balustrades: gefreesde houten balken, waar Kramer normaal
      siersmeedwerk voorschreef. Dat maakt deze brug bijzonder onder zijn vele honderden. Vanaf de
      brug zie je het gemaal en de sluis liggen.
  - place: Gemaal Stadwijck
    narration: |
      The southern tip of the loop is a building still doing its job. The old steam pumping station of this
      polder stood where the Meerhuizenstraat now runs, near the school you passed. When the land
      was raised with sand for the Rivierenbuurt it could no longer work, and in 1921 the city
      built this replacement on the Amstel. A.J. Westerman drew it; his round bathhouse on the
      Boerhaaveplein is still to come. The design was shown at the Paris decorative arts exhibition of 1925.

      Look at the sculptural brick mass on the river bank, with the machinist's house on the
      Amsteldijk and the lock keeper's house on the Zuidelijke Wandelweg, designed as one group.
      Two electric pumps still lift water about 1.6 metres from the polder into the Amstel, and
      Waternet runs it. From here the loop turns north, back across the Amstel.
    nl: |
      Het zuidelijkste punt van de tocht is een gebouw dat nog altijd werkt. Het oude stoomgemaal van deze polder
      stond waar nu de Meerhuizenstraat ligt, vlak bij de school die je passeerde. Toen dat deel
      van de polder met zand werd opgehoogd voor de Rivierenbuurt, kon daar niet meer worden
      bemalen, en in 1921 bouwde de gemeente dit gemaal aan de Amstel. Het ontwerp is van A.J.
      Westerman, van wie je straks ook het ronde badhuis aan het Boerhaaveplein ziet, en was te zien
      op de tentoonstelling voor decoratieve kunsten in Parijs (1925).

      Kijk naar de plastische bakstenen massa aan de Amsteloever, met de machinistenwoning aan de
      Amsteldijk en de sluiswachterswoning aan de Zuidelijke Wandelweg, als één groep ontworpen.
      Twee elektrische pompen brengen het polderwater nog altijd zo'n 1,6 meter omhoog naar de
      Amstel; Waternet beheert het gemaal. Vanaf hier gaat de lus naar het noorden, terug over de
      Amstel.
    next:
      directions: >-
        Ride north-west through the Rivierenbuurt to the Victorieplein, then east along the
        Vrijheidslaan to the Amstel, about 2.2 km.
      nl: >-
        Fiets noordwestwaarts door de Rivierenbuurt naar het Victorieplein en dan oostwaarts over de
        Vrijheidslaan naar de Amstel, ongeveer 2,2 km.
      via: [[4.90506, 52.34598]]
  - place: Berlagebrug and Schollenbrug (Brug 423, 340)
    narration: |
      The city gave H.P. Berlage, the planner of Plan Zuid, the honour of designing its new bridge
      over the Amstel, and named it after him. He drew the architecture. The steel engineering came
      from C. Biemond, head of the bridges section of Public Works, the section whose yard you saw
      on Uilenburg. It opened on 28 May 1932: a flat steel bascule bridge about 100 metres long and
      24 metres wide, with five openings.

      Stop before you cross. Look for Hildo Krop's Genius of Amsterdam, the city's protecting
      spirit, rising from the water, after his rams at the Smaragdplein and his city map on the
      tram depot. Then find the brick control tower over one pier and the lamp posts and railings
      designed with the bridge. Orange brick and Bavarian granite make it a gateway to the city, by
      land and by water. On the far bank, the smaller Schollenbrug over the Ringvaart belongs to
      the same design.
    nl: |
      Voor de nieuwe Amstelbrug gaf de gemeente Berlage, de maker van Plan Zuid, de ere-opdracht, en
      de brug kreeg zijn naam. Berlage zorgde voor de esthetiek, C. Biemond, directeur van de
      afdeling Bruggen van Publieke Werken, voor de techniek: dezelfde afdeling die op Uilenburg
      haar werf had. Op 28 mei 1932 ging de brug open, een vlakke stalen basculebrug van ruim honderd
      meter lang en 24 meter breed, met vijf doorvaarten.

      Stop even voor je oversteekt. Zoek het beeld van Hildo Krop, de genius van Amsterdam die uit
      het water oprijst; eerder zag je zijn ramskoppen aan het Smaragdplein en zijn plattegrond op
      de remise. Kijk dan naar de bakstenen bedieningstoren boven een van de pijlers en naar de
      lantaarnpalen en het hekwerk, die bij het ontwerp horen. Oranje baksteen en Beiers graniet
      maken er een stadspoort van, te land en te water. Aan de overkant hoort de kleinere
      Schollenbrug over de Ringvaart bij hetzelfde ensemble.
    next:
      directions: >-
        Cross the bridge and follow the Weesperzijde north along the river, then turn into the
        Oosterparkbuurt, about 1.7 km.
      nl: >-
        Steek de brug over en volg de Weesperzijde noordwaarts langs de rivier; dan de
        Oosterparkbuurt in, ongeveer 1,7 km.
  - place: Badhuis Boerhaaveplein (Badhuistheater)
    narration: |
      This is the bathhouse that set the pattern. Arend Jan Westerman of Public Works, who also drew
      the pumping station at Stadwijck, designed it, and on 6 July 1921 Alderman Monne de Miranda and
      Mayor Willem de Vlugt opened it. Five years before the Diamantstraat, it was the city's first
      free-standing bathhouse: a circle about nineteen metres across, alone in
      the square, for the families in the new housing-association blocks around it.

      Ride round it. Men and women had separate entrances either side of the office, and the
      left-hand porch still says "ingang mannen" (men's entrance). Metal letters spell
      GEMEENTEBADHUIS over the office window, and the eight-sided roof steps up to a squat
      chimney. Inside, some twenty bath and shower cubicles ringed the waiting rooms. It closed in
      the early 1980s, when urban renewal had given most homes here their own shower, and it has
      been the Badhuistheater since 1985.
    nl: |
      Hier kreeg het badhuisprogramma zijn vorm. Arend Jan Westerman van Publieke Werken, ook de
      ontwerper van gemaal Stadwijck, tekende het, en op 6 juli 1921 openden wethouder Monne de
      Miranda en burgemeester Willem de Vlugt het. Vijf jaar voor dat aan de Diamantstraat was dit
      het eerste vrijstaande badhuis van de stad: een cirkel van ongeveer negentien meter
      doorsnede, midden op het plein, voor de gezinnen in de nieuwe woningbouwcomplexen eromheen.

      Fiets er een rondje omheen. Mannen en vrouwen hadden aan weerszijden van het kantoortje een
      eigen ingang; op het linkerportiek staat nog 'ingang mannen'. Boven het kantoorvenster staan
      de metalen letters GEMEENTEBADHUIS, en het koepeldak van acht geknikte schilden loopt op naar
      een gedrongen schoorsteen. Binnen lagen zo'n twintig bad- en douchecellen rond de wachtkamers.
      Begin jaren tachtig ging het dicht, toen de meeste woningen in de Oosterparkbuurt een eigen
      douche hadden. Sinds 1985 zit hier het Badhuistheater.
    next:
      directions: The Talmud Tora school is round the corner, on the Tweede Boerhaavestraat.
      nl: De Talmud Tora-school staat om de hoek, aan de Tweede Boerhaavestraat.
  - place: Talmud Tora school (Tweede Boerhaavestraat)
    narration: |
      Not every school here was the city's, but this one takes you back to the Uilenburg story. The
      Dutch-Israelite Main Synagogue ran a Talmud Tora school for poor children, teaching ordinary
      primary subjects alongside basic Judaism. Until 1924 it had rooms under the Uilenburger
      synagogue, next to the yard where you started. As many Jewish families moved out of the old
      centre, the school moved too, into this building by Jacob S. Baars, named after the painter
      Jozef Israëls.

      On the canted corner its name is still spelled out in red brick and Hebrew letters. Look also
      at the yellow and red brick on a high red plinth, and the entrance porch with its concrete
      canopy and ladder-pattern sidelights. The German occupiers closed the school in 1943. It is
      now an apartment building.
    nl: |
      Niet elke school in deze buurt was van de gemeente, maar deze hoort wel bij het verhaal van
      Uilenburg. De Nederlands-Israëlitische Hoofdsynagoge hield een Talmud Tora-school voor
      armlastige kinderen, met gewoon lager onderwijs en les in het jodendom; in de crisisjaren
      kregen de leerlingen er ook maaltijden en kleding. Tot 1924 zat de school in lokalen onder de
      Uilenburgersjoel, naast de werf waar je begon. Toen veel joodse gezinnen de binnenstad
      verlieten, ging de school mee, naar dit gebouw van Jacob S. Baars, vernoemd naar de schilder
      Jozef Israëls.

      Op de afgeschuinde hoek staat de schoolnaam nog in rode baksteen en Hebreeuwse letters. Kijk
      ook naar de gele en rode baksteen op de hoge rode plint en het portiek met betonnen luifel en
      nevenlichten met laddermotief. In 1943 sloot de Duitse bezetter de school. Nu is het een
      appartementengebouw.
    next:
      directions: Ride north-west to the Nieuwe Achtergracht, about 700 m.
      nl: Fiets noordwestwaarts naar de Nieuwe Achtergracht, ongeveer 700 meter.
  - place: Former Municipal Health Service (GGD) building
    narration: |
      Baths were about health, and so was this building. Public Works completed it in 1923 for the
      city's health service (*Gemeentelijke Geneeskundige Dienst*, GGD), with waiting and treatment
      rooms on the ground floor and offices above; laboratories were later added on the top floor.
      It dates from the department's heyday, probably under A.R. Hulshoff, the head of its
      Buildings section, under whom the Uilenburg yard was also designed.

      Stand where you can look down the Lepelkruisstraat: the building was set on that sightline.
      Look for the deep slots that cut the sculpted centre off from the flat side wings like black
      lines, the long strips of six-light windows in dark-brown brick, and the two heavy, slanting
      stone posts beside the deep-set varnished front door.
    nl: |
      Een badhuis ging over gezondheid, en dit gebouw ook. Publieke Werken liet het in 1923 bouwen
      voor de Gemeentelijke Geneeskundige Dienst: beneden wacht- en behandelkamers, op de
      verdiepingen kantoren, en later bovenin laboratoria. Het stamt uit de bloeiperiode van de
      dienst, wellicht dankzij de leiding van A.R. Hulshoff, onder wie ook de werf op Uilenburg werd
      ontworpen.

      De middenpartij staat in de zichtas van de Lepelkruisstraat en de Nieuwe Prinsengracht. Let op
      de diepe sleuven die als zwarte lijnen het middendeel van de vlakke zijvleugels scheiden, de
      stroken forse zeslichtsvensters in donkerbruine baksteen en de twee zware, schuin geplaatste
      natuurstenen stijlen naast de diepliggende, blank gelakte voordeur.
    next:
      directions: Ride north through the Plantage back to Uilenburg, about 1.5 km.
      nl: Fiets noordwaarts door de Plantage terug naar Uilenburg, ongeveer 1,5 km.
  - place: Werf Uilenburg (Public Works yard)
    narration: |
      Back at the yard where Kramer drew his bridges. On one loop you have seen what the city's own
      designers made of everyday services: three bathhouses, three city schools, a sewage pumping
      station, a substation, a tram depot, a polder pumping station, a health-service building
      and the bridges in between. Sewers, baths, schools, power, trams and drainage: the city gave each of
      them architecture.
    nl: |
      Terug bij de werf waar Kramer zijn bruggen tekende. In één rondje zag je wat de eigen
      ontwerpers van de stad van gewone voorzieningen maakten: drie badhuizen, drie gemeentescholen,
      een rioolgemaal, een onderstation, een tramremise, een poldergemaal, een gebouw voor de
      gezondheidsdienst en de bruggen daartussen. Riool, bad, school, stroom, tram en polder: de gemeente gaf het
      allemaal architectuur.
