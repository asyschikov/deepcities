title: Across the IJ to the garden villages
summary: >-
  A loop by ferry and bike through Noord's garden villages: cottages under big roofs, a bathhouse
  shaped like a farmhouse, concrete test houses, Krop's fairy-tale school and the octagonal
  Purmerplein. The Amsterdam School at its most rural, from Centraal Station and back.
body: |
  This is a loop: it starts and finishes at the ferry pier behind Centraal Station, on the IJ side.
  Take your bike on the free ferry F3 to Buiksloterweg. The ride runs north-west to Tuindorp
  Oostzaan, comes back south-east through Disteldorp and the Mosplein, goes east to Tuindorp
  Nieuwendam and returns west through the Vogelbuurt to the Buiksloterweg ferry, which takes you
  back to Centraal Station.

  The ride is about 19 km plus two short crossings. Allow about four hours. For a shorter day of
  about 12.5 km, skip Tuindorp Nieuwendam and the Vogelbuurt: after the Wingerdweg schools the
  Buiksloterweg ferry is only about a kilometre away. Everything is seen
  from outside, except at events: the Bethlehemkerk is now the Studio 150 recording studio and
  concert venue, and the Zonnehuis hosts concerts and theatre. In Tuindorp Oostzaan a museum house
  from 1922 at Meteorenweg 174 shows how residents lived; check its opening times before you go.
  Most of the houses are lived in, so please be considerate.

  South of the IJ the Amsterdam School means four-storey brick walls. Here it looks completely
  different: two-storey cottages under big tiled roofs, little squares, timber cladding, even
  thatch. Arie Keppler, director of the Municipal Housing Service (*Gemeentelijke Woningdienst*)
  from 1915 to 1937, preferred low family houses, inspired by Ebenezer Howard's garden cities.
  From the late 1910s the city built garden villages (*tuindorpen*) north of the IJ, many for workers at the
  shipyards. Because the first homes had no bathrooms, the city added public bathhouses, and each
  village got its own schools, shops and halls.
mode: bike
photos: ["commons:File:Purmerplein 1.JPG"]
nl:
  title: Over het IJ naar de tuindorpen
  summary: >-
    Een rondje met pont en fiets door de tuindorpen van Noord: lage huizen onder grote daken, een
    badhuis als stolpboerderij, betonnen proefwoningen, Krops sprookjesschool en het achtkantige
    Purmerplein. De Amsterdamse School op zijn landelijkst, vanaf Centraal Station en terug.
  body: |
    Deze tocht is een rondje: hij begint en eindigt bij de pont achter Centraal Station, aan de
    IJ-kant. Neem je fiets mee op de gratis pont F3 naar Buiksloterweg. De route gaat eerst
    noordwestwaarts naar Tuindorp Oostzaan, dan terug naar het zuidoosten langs Disteldorp en het
    Mosplein, oostwaarts naar Tuindorp Nieuwendam en ten slotte door de Vogelbuurt naar de pont aan
    de Buiksloterweg, die je terugbrengt naar Centraal Station.

    Het is zo'n 19 km fietsen plus twee korte overtochten. Reken op ongeveer vier uur. Wil je het
    korter houden, zo'n 12,5 km, laat dan Tuindorp Nieuwendam en de Vogelbuurt schieten: na de
    scholen aan de Wingerdweg ben je op een kilometer van de pont aan de Buiksloterweg. Je bekijkt
    alles van buiten, behalve bij een evenement: in de Bethlehemkerk zit nu Studio 150, een
    geluidsstudio met concerten, en het Zonnehuis wordt verhuurd voor voorstellingen en concerten.
    In Tuindorp Oostzaan laat de museumwoning uit 1922 aan de Meteorenweg 174 zien hoe de bewoners
    leefden; kijk vooraf naar de openingstijden. In de meeste huizen wordt gewoond, dus houd
    rekening met de bewoners.

    Wie aan de Amsterdamse School denkt, ziet bakstenen gevelwanden van vier lagen. Boven het IJ
    ziet de stijl er heel anders uit: lage huizen onder grote pannendaken, pleintjes, houten
    betimmering en zelfs riet. Arie Keppler, van 1915 tot 1937 directeur van de Gemeentelijke
    Woningdienst, gaf de voorkeur aan laagbouw en liet zich inspireren door de tuinstad van
    Ebenezer Howard. Vanaf het eind van de jaren tien bouwde de gemeente hier tuindorpen, vooral voor de arbeiders van de
    scheepswerven. De eerste woningen hadden geen badkamer, dus kwamen er badhuizen, en elk dorp
    kreeg eigen scholen, winkels en een gebouw voor de verenigingen.
stops:
  - name: Centraal Station, ferry pier
    lat: 52.3809
    lng: 4.8997
    narration: |
      The ride starts with a crossing. Behind Centraal Station, on the IJ side, the free ferries
      leave for Noord. Wheel your bike on board the F3 to Buiksloterweg.

      The water you are crossing explains much of what follows. After the First World War the
      shipyards on the north bank of the IJ grew fast. Housing their workers close to the yards
      saved the city from building an expensive link across the river, so it built villages for
      them over there instead. The first stop is a short ride from the landing on the other side.
    nl: |
      De tocht begint met een overtocht. Achter Centraal Station, aan de IJ-kant, vertrekken de
      gratis ponten naar Noord. Rijd je fiets de pont F3 naar Buiksloterweg op.

      Het water dat je oversteekt verklaart veel van wat volgt. Na de Eerste Wereldoorlog groeiden
      de scheepswerven aan de noordkant van het IJ snel. Door de arbeiders dicht bij hun werk te
      huisvesten, was er geen dure oeververbinding nodig; dus bouwde de gemeente aan de overkant
      tuindorpen. De eerste stop ligt vlak bij de aanlegplaats.
    next:
      mode: ferry
      directions: >-
        Free ferry F3 to Buiksloterweg, a crossing of about five minutes. The police post stands
        close to the landing, on the bank of the North Holland Canal.
      nl: >-
        Neem de gratis pont F3 naar Buiksloterweg, ongeveer vijf minuten varen. Het politiepostje
        staat vlak bij de aanlegplaats, aan de oever van het Noordhollandsch Kanaal.
  - place: Former police post, Buiksloterweg
    narration: |
      One of the earliest public buildings in Noord to be described as Amsterdam School is also
      one of the smallest. Public Works built this police post in 1915–1916 on the west bank of
      the outer harbour of the North Holland Canal, facing the old city across the IJ. It held a
      constables' room, a room for the post commander, a bicycle store and, in the middle, two
      cells.

      The plan is two squares pushed into each other. The horizontal timber cladding is painted
      green at top and bottom and off-white in between, and the board ends are cut to points. Look
      up at the lead-clad section joining the two chimneys: it held the air ducts that brought
      fresh air to the cells. Timber, low roofs and a homely scale are the language of the garden
      villages ahead.
    nl: |
      Een van de vroegste openbare gebouwen in Amsterdamse Schoolstijl in Noord is ook een van de
      kleinste. De Dienst der Publieke Werken bouwde deze politiepost in 1915-1916 aan de westelijke
      oever van de Voorhaven van het Noordhollandsch Kanaal, met de binnenstad aan de overkant. Er
      waren een agentenkamer, een kamer voor de postcommandant, een fietsenbergplaats en in het
      midden twee arrestantenlokalen.

      De plattegrond bestaat uit twee in elkaar geschoven vierkanten. Het horizontale houten
      beschot is boven en onder groen en verder gebroken wit, met gepunte uiteinden. Kijk omhoog
      naar het loodbeklede tussenstuk tussen de twee schoorstenen: daarin zaten de luchtkanalen voor
      de arrestantenlokalen. Hout, lage daken en een huiselijke maat: dat is ook de taal van de
      tuindorpen verderop.
    next:
      directions: Ride north-west to Tuindorp Oostzaan and the Castorplein, about 4 km.
      nl: Fiets noordwestwaarts naar Tuindorp Oostzaan en het Castorplein, ongeveer 4 km.
  - place: Concrete test houses, Castorplein
    narration: |
      Welcome to Tuindorp Oostzaan. The Municipal Housing Service built it from 1919 for workers of
      the shipyards on the IJ, to a plan by Boeyinga and J.H. Mulder, and with state money under
      the Emergency Housing Act of 1917. This is the village that saved the city a link across the
      water you crossed by ferry.

      After the First World War bricks and bricklayers were scarce, so the Housing Service tried
      new building systems. Around this square Mulder built two rows of eight houses with the
      English Winget concrete block system. Look closely and the block pattern shows through the
      white render; one row has red roof tiles, the other dark blue. The paired front doors with
      sidelights are in a rural Amsterdam School manner. On the Castorstraat, two lower double
      houses under overhanging mansard roofs were probably built with hollow slag-concrete blocks.
    nl: |
      Welkom in Tuindorp Oostzaan. De Gemeentelijke Woningdienst bouwde het vanaf 1919 voor de
      arbeiders van de scheepswerven aan het IJ, naar een plan van Boeyinga en J.H. Mulder en met
      rijksgeld op grond van de Noodwoningenwet van 1917. De eerste huizen mochten "niet langer dan
      35 jaar" blijven staan.

      Baksteen en metselaars waren schaars, dus probeerde de Woningdienst nieuwe systemen uit. Aan
      weerszijden van dit plein bouwde Mulder twee rijen van acht woningen volgens het Engelse
      blokkensysteem Winget. Kijk goed: de structuur van de betonblokken schemert door het witte
      pleisterwerk. De ene rij heeft rode pannen, de andere donkerblauwe. De paarsgewijs geplaatste
      voordeuren met zijlichten zijn in landelijke Amsterdamse Schoolstijl. Aan de Castorstraat
      staan twee lagere dubbele woningen onder een overkragende mansardekap, vermoedelijk van holle
      slakkenbetonblokken.
  - place: Zonnehuis
    narration: |
      Keppler deliberately left churches and pubs out of Tuindorp Oostzaan, and for years its
      clubs had nowhere to meet. From 1927 a committee of local associations lobbied the city.
      After long disputes over the piling and the 250,000-guilder cost, the hall was built as a
      job-creation project and opened on 29 October 1932, for a village of about 7,000 people.

      Jo Mulder, who designed much of the housing around the square, set it right across the axis
      of the Zonneweg so that it closes the view. Look for the iron letters 't ZONNEHUIS between
      the brick pilasters. Then ride round to the back, on the Grote Beerstraat, where statues of a
      father, a mother and two children by W. IJzerdraat and M. Vreugde glorify family life. Saved
      from demolition in 1993 and restored by Stadsherstel, it now hosts concerts and theatre.
    nl: |
      Kerken en cafés liet Keppler bewust weg uit Tuindorp Oostzaan, en de verenigingen hadden jaren
      geen eigen plek. Rond 1927 begon een comité van 24 verenigingen met de gemeente te overleggen.
      Na lang gesteggel over het aantal heipalen en de bouwsom van 250.000 gulden werd het gebouw
      onderdeel van de werkverschaffing, en op 29 oktober 1932 ging 't Zonnehuis open. Er konden ook
      huwelijken worden gesloten.

      Jo Mulder, die ook de omgeving van het Zonneplein ontwierp, zette het gebouw dwars op de as van
      de Zonneweg. Let op de ijzeren letters 't ZONNEHUIS tussen de gemetselde pilasters. Fiets dan
      om naar de achtergevel aan de Grote Beerstraat: daar dragen de pilasters beelden van een vader,
      een moeder en twee kinderen, van W. IJzerdraat en M. Vreugde, die het gezinsleven verheerlijken.
      In 1993 werd sloop voorkomen; Stadsherstel restaureerde het, en nu zijn er voorstellingen en
      concerten.
  - place: Badhuis Meteorenweg
    narration: |
      Few homes in Tuindorp Oostzaan had a bath, so in 1927 Public Works added this bathhouse on
      the corner of the Meteorenweg and the Maanstraat, then the edge of the first building phase.
      Later you will see Boeyinga's farmhouse-shaped bathhouse in Disteldorp; this one is laid out
      quite differently. Two long single-storey volumes with
      pitched roofs are pushed against each other: one parallel to the street for the children's
      baths, the other at right angles for the men's and women's sections.

      Notice how it plays on the street line. The Meteorenweg narrows in steps just here, so the
      front faces the open space at the Maanstraat. The garden beside it was part of the design.
      It is now a home and business space. On the same street, the museum house at Meteorenweg 174
      shows a home of 1922.
    nl: |
      Weinig woningen in Tuindorp Oostzaan hadden een bad. In 1927 bouwde Publieke Werken daarom dit
      badhuis op de hoek van de Meteorenweg en de Maanstraat, toen de rand van de eerste bouwfase.
      Straks zie je in Disteldorp het badhuis van Boeyinga in de vorm van een stolpboerderij; dit is
      heel anders opgezet. Hier zijn twee langwerpige
      bouwvolumes van één laag met kap tegen elkaar geschoven: het ene evenwijdig aan de Meteorenweg,
      met het kinderbad, het andere haaks daarop, met de mannen- en vrouwenafdeling.

      Kijk hoe het gebouw inspeelt op de verspringende rooilijn: de Meteorenweg versmalt zich juist
      hier, zodat de gevel aan de Maanstraat vrij in het zicht ligt. Het plantsoen ernaast hoorde
      bij het ontwerp. Nu zijn er een woning en bedrijfsruimte. Verderop in dezelfde straat staat de
      museumwoning op nummer 174, nog in de staat van 1922.
  - place: Tuindorp Oostzaan civic buildings
    narration: |
      What made Tuindorp Oostzaan a village rather than an estate was its own set of public
      buildings. A cluster of them survives here on the Kometensingel, where the village meets the
      old Oostzanerdijk.

      Start with the former public reading room of about 1924, at no. 211: timber on a
      black-stained plinth under a huge overhanging thatched roof, with three-sided bay windows.
      Next come the doctor's house with its own surgery entrance, Boeyinga's four "teachers'
      houses" with linked doors and ladder windows, and at no. 175 a tiny fire-engine shed of 1922,
      one of the Housing Service's early concrete experiments. Behind them, the nursery school De
      Wilde Wingerd (1926) took 240 children. A short walk away, Boeyinga's Mercuriusplein is a
      little court of shops with flats above. From here the ride turns back south-east.
    nl: |
      Wat Tuindorp Oostzaan tot een dorp maakte en niet tot een woonwijk, waren de eigen
      voorzieningen. Aan de Kometensingel, waar het tuindorp aan de oude Oostzanerdijk grenst, staat
      er nog een groep bij elkaar.

      Begin bij de voormalige leeszaal van omstreeks 1924 op nummer 211: hout op een zwart gebeitste
      plint, onder een fors overkragend rieten dak met driezijdige erkers. Dan volgen de vrijstaande
      dokterswoning met een eigen praktijkingang, de vier 'onderwijzerswoningen' van Boeyinga met
      gekoppelde deuren en ladderramen, en op nummer 175 het brandspuithuisje uit 1922, een van de
      vroege betonexperimenten van de Woningdienst. Daarachter ligt kleuterschool De Wilde Wingerd
      (1926), met 240 kinderen een van de grootste van Amsterdam. Om de hoek ligt het Mercuriusplein
      van Boeyinga, een pleintje met winkels en bovenwoningen als een hofje. Vanaf hier gaat de tocht terug naar
      het zuidoosten.
    next:
      directions: >-
        Ride east along the Kometensingel, then south to Disteldorp, about 4.5 km. This way back
        avoids the road you came in on.
      nl: >-
        Fiets oostwaarts over de Kometensingel en dan zuidwaarts naar Disteldorp, ongeveer 4,5 km.
        Zo rijd je niet over dezelfde weg terug.
      via: [[4.8990, 52.4140], [4.9050, 52.4050]]
  - place: Badhuis Kromme Distelstraat
    narration: |
      This little building looks like a farmhouse on purpose. In 1918–1919 the Municipal Housing
      Service built Disteldorp here, an emergency village for the fast-growing city, and its new
      homes had no bathrooms. B.T. Boeyinga, the later planner of Tuindorp Nieuwendam, designed a
      bathhouse with eight shower cubicles on the corner of the Kromme Distelstraat and the
      Distelkade. The area still bordered farmland, so he gave it the pyramid roof of a North
      Holland *stolpboerderij* (farmhouse), with Amsterdam School details.

      The houses around it were meant to last about 35 years, but the war intervened and they
      survived. The bathhouse closed in 1977, stood empty for years, and escaped demolition when
      almost the whole area became a municipal monument. Compare it with the bathhouse on the
      Meteorenweg, built by Public Works eight years later.
    nl: |
      Dat dit gebouwtje op een boerderij lijkt, is geen toeval. In 1918-1919 bouwde de
      Gemeentelijke Woningdienst hier Disteldorp, een noodwoningdorp voor de snel groeiende stad. De
      nieuwe woningen hadden geen badkamer, dus ontwierp B.T. Boeyinga, later de stedenbouwer van
      Tuindorp Nieuwendam, op de hoek van de Kromme Distelstraat en de Distelkade een badhuis met
      acht douchecellen. Omdat de buurt toen nog aan het boerenland grensde, gaf hij het de vorm van
      een stolpboerderij, met invloeden van de Amsterdamse School.

      De woningen zouden na zo'n 35 jaar verdwijnen, maar de oorlog gooide dat plan om. Het badhuis
      sloot in 1977, stond lang leeg en ontsnapte aan sloop toen vrijwel de hele omgeving
      gemeentelijk monument werd. Vergelijk het met het heel andere badhuis aan de Meteorenweg, dat
      Publieke Werken acht jaar later bouwde.
  - place: Former Astoria cinema, Mosplein
    narration: |
      Not everything here was built by the city. Noord's own cinema, founded by J.J. Otter, opened
      on 17 May 1929 with the German silent film Das tanzende Wien. Willem Noorlander, who designed
      many Amsterdam cinemas and also housing in this neighbourhood, built it in sober Amsterdam
      School brick, as part of a complex of shops and flats on the corner of the Mosveld and the
      Mosplein.

      Look at the brick corner and try to make out where the auditorium sits inside the block. It
      had 550 seats, about 650 after 1938, with an orchestra pit and a stage for live acts in the
      intervals. Television emptied it. It closed on 5 December 1966 and was sold to the Albert
      Heijn supermarket chain.
    nl: |
      Niet alles hier bouwde de gemeente. Bioscooptheater Astoria, opgericht door J.J. Otter, opende
      op 17 mei 1929 met de Duitse stomme film Das tanzende Wien. Het gebouw is van Willem
      Noorlander, die veel bioscopen ontwierp, waaronder het Ceintuur Theater, en ook woningen in
      deze buurt. Hij zette het in sobere Amsterdamse Schoolstijl in een complex met winkels en
      woningen, op de hoek van het Mosveld en het Mosplein.

      Kijk naar de bakstenen hoek en zoek waar de zaal in het blok zit. Er waren 550 plaatsen, na
      1938 zo'n 650, met een orkestbak, kleedkamers en een toneel voor optredens in de pauze. Op 5
      december 1966 sloot de bioscoop, vooral door de televisie, en het pand ging naar Albert Heijn.
  - place: Clematisstraat 25 (Apostolisch Genootschap)
    narration: |
      Among two-storey houses this church stands out by its sheer bulk: broad, with a steep pointed
      roof and a small tower in the middle of the ridge. Cornelis Kruyswijk designed it for the
      Hersteld Apostolische Zendinggemeente, which had had a congregation in Noord since 1921 and
      for which he had already built a church in Watergraafsmeer. It opened on 22 December 1934,
      with some 700 seats and rooms for clubs and youth work. Kruyswijk died a few weeks later, on
      10 January 1935.

      Look at the tall window bays with stained glass by J.H.E. Schilling, and the brick wall that
      encloses the site. Near the end of the ride, Moen's Bethlehemkerk shows the opposite: a
      church that had to stay low among its neighbours. Since 1951 the building has belonged to the Apostolisch Genootschap.
    nl: |
      Tussen de laagbouw valt deze kerk op door haar breedte en het hoge, spitse dak met in het
      midden een torentje. Cornelis Kruyswijk ontwierp haar voor de Hersteld Apostolische
      Zendinggemeente, die sinds 1921 een gemeente in Noord had en voor wie hij eerder al een kerk in
      de Watergraafsmeer bouwde. Op 22 december 1934 ging ze open, met zo'n 700 plaatsen en ruimtes
      voor verenigings- en jeugdwerk. Kruyswijk overleed kort daarna, op 10 januari 1935.

      Kijk naar de hoge raampartijen met glas-in-lood van J.H.E. Schilling en de bakstenen muur rond
      het terrein. Aan het eind van de tocht zie je bij de Bethlehemkerk van Moen het
      omgekeerde: een kerk die juist laag moest blijven. Sinds
      1951 is het gebouw van het Apostolisch Genootschap, dat liever van een 'plaats van samenkomst'
      spreekt.
  - place: Wingerdweg schools
    narration: |
      Two public primary schools, the Resedaschool and the Wingerdschool, opened here in 1926 in a
      single long building that bends with the curve of the Wingerdweg. Nicolaas Lansdorp of
      Public Works designed it. He worked for the city from 1919 to 1932 and became its main school
      architect.

      Ride slowly along the front and look for the small fairy-tale figures by Hildo Krop, made to
      delight the younger children. Remember the gentle curve and the storybook figures: in
      Nieuwendam the same department, in the same years, built a school in a very different mood. A neighbouring
      Catholic school was damaged by bombing in the Second World War and later demolished. The
      heritage company Stadsherstel bought and renovated this building in 2002, and it is now let
      as business units.
    nl: |
      In 1926 gingen hier twee openbare scholen open, de Resedaschool en de Wingerdschool, in één
      lang gebouw dat meebuigt met de kromme Wingerdweg. Het ontwerp is van Nicolaas Lansdorp van
      Publieke Werken, onder leiding van W.A. de Graaf. Lansdorp werkte van 1919 tot 1932 voor de
      gemeente en werd haar belangrijkste scholenarchitect.

      Fiets langzaam langs de gevel en zoek de kleine sprookjesfiguren van Hildo Krop. Onthoud de
      zachte bocht en de sprookjesfiguren: in Nieuwendam bouwde dezelfde dienst in dezelfde jaren een
      school in een heel andere stemming. Naast de scholen stond de katholieke
      Sint-Rosaschool, die in de oorlog door een bombardement werd beschadigd en rond 1991 werd
      gesloopt. Stadsherstel kocht het complex in 2002 en verhuurt het nu als bedrijfsruimte.
    next:
      directions: Ride east to Tuindorp Nieuwendam, about 2.7 km, arriving along the Purmerweg.
      nl: Fiets oostwaarts naar Tuindorp Nieuwendam, ongeveer 2,7 km; je komt binnen over de Purmerweg.
      via: [[4.9300, 52.3950]]
  - place: Purmerplein, Tuindorp Nieuwendam
    narration: |
      Tuindorp Nieuwendam, built by the city between 1924 and 1934, is often counted among the most
      beautiful garden villages in the country, and this is its heart. B.T. Boeyinga of the
      Municipal Housing Service drew the urban plan, inspired by Howard's garden-city ideas. He also
      designed this octagonal square, lined with free-standing blocks of shops with flats above.

      Stand in the middle and look round. A broad, continuous awning shelters each row of shops.
      Above it runs a strip of windows in horizontal boarding, then a row of timber dormers in the
      tiled roof, and some blocks end in a half-round roof. On the Purmerweg, symmetrical gate
      buildings carried on heavy timber columns mark the entrances to the side streets. Ride
      through one of them to the next stop.
    nl: |
      Tuindorp Nieuwendam, tussen 1924 en 1934 door de gemeente gebouwd, geldt als een van de
      mooiste tuindorpen van het land, en dit is het hart. B.T. Boeyinga van de Gemeentelijke
      Woningdienst maakte het stedenbouwkundig plan, naar de ideeën van Howard, met het doel "een
      menswaardiger bestaan voor de arbeiders en hun gezinnen". Hij ontwierp ook dit achthoekige
      plein met vrijstaande blokken winkels en bovenwoningen.

      Ga in het midden staan en kijk rond. Een doorlopende brede luifel beschut de winkelpuien;
      daarboven loopt een vensterstrook met horizontaal beschot en in het pannendak een reeks houten
      dakkapellen. Sommige blokken eindigen in een halfronde kap. Aan de Purmerweg markeren
      symmetrische poortgebouwen op zware houten kolommen de toegang tot de zijstraten. Fiets door
      een van die poorten naar de volgende stop.
  - place: Keukenwoningen, Tuindorp Nieuwendam
    narration: |
      Behind the gates run short streets of single-family houses by J.H. Mulder. They are called
      keukenwoningen ("kitchen houses") because the kitchen was at the front, a novelty at the
      time. Unlike the earliest cottages north of the IJ, the houses of Nieuwendam now came with a
      bathroom.

      Each row has a ground floor and an attic under a tiled roof that sweeps down so low at the
      front that the doors and windows sit right under the gutter, with long dormers above. Look
      for the low brick walls flanking each pair of front doors. On the side gables, a timber
      cornice with a wavy line separates the brick from the dark weatherboarding above. Low brick
      links join the rows to Boeyinga's gate buildings.
    nl: |
      Achter de poortgebouwen liggen de straatjes met eengezinswoningen van J.H. Mulder. Ze heten
      keukenwoningen omdat de keuken, destijds nieuw, aan de straatkant lag. Anders dan in de eerste
      tuindorpen hadden de huizen in Nieuwendam nu wel een badkamer.

      Elk blok heeft een begane grond en kapverdieping onder een pannendak dat aan de straatkant zo
      laag doorloopt dat ramen en deuren direct onder de goot zitten; brede dakkapellen met vensters
      in serie verlichten de zolder. Let op de lage gemetselde muurdammen naast de voordeuren. Op de
      zijgevels scheidt een houten cordonlijst met golflijn het metselwerk van het donkere
      rabatbeschot erboven. Lage gemetselde verbindingen koppelen de rijtjes aan de poortgebouwen
      van Boeyinga.
  - place: Christian school, Wognumerplantsoen
    narration: |
      At the south-eastern tip of the village the style suddenly turns hard-edged. Public Works
      built this double Christian primary school, tendered in April 1925. It is a composition of
      flat-roofed cubic brick volumes stepping in and out: a long, lower centre between two taller
      cross wings that hold the entrances.

      After the soft roofs of the keukenwoningen, look at the contrast. Brick chimneys with stone
      canopies rise above both entrances, other canopies jut far out, and a long band of small
      windows runs along the upper floor. Classrooms face south, corridors and stairs north. Think
      back to Lansdorp's curving Wingerdweg schools: the same department, the same years, a
      completely different mood.
    nl: |
      In de zuidoostelijke punt van het tuindorp wordt de stijl ineens hoekig. Publieke Werken
      tekende deze dubbele christelijke school voor gewoon lager onderwijs; de aanbesteding was op
      6 april 1925. Het gebouw is een stapeling van kubische bouwvolumes van rode baksteen onder
      platte daken: een langgerekt lager middendeel tussen twee hogere dwarsvleugels met de
      ingangen.

      Na de lage daken van de keukenwoningen is het contrast groot. Boven beide ingangen staan
      bakstenen schoorstenen met natuurstenen luifels, andere luifels kragen ver uit, en op de
      verdieping loopt een lange reeks kleine vensters. De lokalen liggen op het zuiden. Later zaten
      er een slagersvakschool en een drumband. Denk terug aan de gebogen scholen van Lansdorp aan de
      Wingerdweg: dezelfde dienst, dezelfde jaren, maar een heel andere stemming.
    next:
      directions: Ride back west to the Vogelbuurt, about 2.7 km.
      nl: Fiets westwaarts terug naar de Vogelbuurt, ongeveer 2,7 km.
  - place: Gratama's blocks, Kievitstraat and Spechtstraat
    narration: |
      Back near the ferry, the Vogelbuurt has work by the man who named the style. Jan Gratama coined the label
      "Amsterdamsche School" in 1916. Here, for the housing association Eigen Haard, he built
      two-storey blocks of ground-floor and upper flats, completed in 1920. They show the low-rise
      type that Keppler preferred to four-storey blocks.

      Notice how roof and façade are equal partners. Orange-tiled mansard roofs with dormers and
      deep overhanging eaves tie the beige brick blocks together. Stepped, corbelled brick frames
      the doorways and marks the line of the roof. At the corner of the Koekoekstraat and the
      Kievitstraat, find the carved woodwork in the gable, and look for the stone tablets with
      animals at the block ends. The blocks step back in the middle to make room for front gardens.
    nl: |
      Terug in de buurt van de pont staat werk van de man die de stijl zijn naam gaf. Jan Gratama (1877-1947) ijkte in
      1916 de benaming 'Amsterdamsche School'. Hier in de Vogelbuurt ontwierp hij voor
      woningbouwvereniging Eigen Haard blokken van twee lagen onder een kap, met beneden- en
      bovenwoningen, opgeleverd in 1920. Het is precies de laagbouw waar Keppler de voorkeur aan gaf.

      Gevel en dak spelen hier een gelijkwaardige rol. De oranje pannen mansardedaken met
      dakkapellen en de sterk overkragende daklijst maken van de beige bakstenen blokken een eenheid,
      en getrapt, uitkragend metselwerk omlijst de entrees. Zoek op de hoek van de Koekoekstraat en
      de Kievitstraat het houtsnijwerk in de gevel, en op de koppen de natuurstenen tableaus met
      dieren. In het midden springen de blokken terug voor voortuinen.
    next:
      directions: The church is round the corner, on the Zwanenplein.
      nl: De kerk staat om de hoek, aan het Zwanenplein.
  - place: Bethlehemkerk
    narration: |
      The Vogelbuurt, built up from 1910, was low-rise from the start, and its church had to fit
      in. The Dutch Reformed parish association north of the IJ hired the architect Adriaan Moen
      in 1919. Building began in August 1923, and Queen Wilhelmina attended the opening on 13
      September 1924. Moen had to keep the church low so that it would not dominate the workers'
      houses around it. That explains the broad, tent-like silhouette: steep pantiled roofs over a
      taller centre, lower wings either side, and a small brick bell-cote on the ridge. Kruyswijk's
      church on the Clematisstraat, ten years younger, stands out by its bulk instead.

      Look for Alpha, Omega and the Chi-Rho in the east gable, and the heavy timber doors with
      wrought ironwork. Since 2017 the church has been Studio 150, a recording studio that hosts
      concerts. The houses around the Zwanenplein carry stones with animals and poems.
    nl: |
      De Vogelbuurt, vanaf 1910 gebouwd, was van begin af aan laagbouw, en de kerk moest zich
      daarnaar voegen. De Vereeniging voor Hervormde Wijkbelangen benoorden het IJ trok in 1919
      architect Adriaan Moen aan. In augustus 1923 werd de eerste paal geslagen en op 13 september
      1924 ging de kerk open, in aanwezigheid van koningin Wilhelmina. Tot april 1924 heette ze
      Zwanenkerk. Moen moest rekening houden met de lage woningen eromheen; vandaar het brede
      silhouet, met hoge pannendaken boven een hoger middendeel tussen lagere vleugels en een
      gemetselde klokkenstoel op de nok. De kerk van Kruyswijk aan de
      Clematisstraat, tien jaar jonger, valt juist op door haar breedte.

      Zoek Alfa, Omega en het labarum in de oostgevel, en de zware houten deuren met smeedwerk. Sinds
      2017 is het gebouw Studio 150, een geluidsstudio met concerten. In de woningen rond het
      Zwanenplein zitten gevelstenen met dieren en gedichten.
    next:
      directions: Ride back west to the Buiksloterweg ferry, about 1.3 km.
      nl: Fiets terug naar het westen, naar de pont aan de Buiksloterweg, ongeveer 1,3 km.
      via: [[4.91923, 52.38634], [4.91662, 52.38517], [4.91344, 52.38712], [4.90991, 52.38523], [4.90647, 52.38458]]
  - name: Buiksloterweg ferry
    lat: 52.38365
    lng: 4.90652
    narration: |
      The ferry landing, next to the little police post where the ride began on this side of the
      water. Wait here for the free F3 back to Centraal Station.
    nl: |
      De aanlegplaats van de pont, naast het politiepostje waar de rit aan deze kant van het water
      begon. Wacht hier op de gratis F3 terug naar Centraal Station.
    next:
      mode: ferry
      directions: Free ferry F3 back across the IJ to Centraal Station, a five-minute crossing.
      nl: Neem de gratis pont F3 terug over het IJ naar Centraal Station, vijf minuten varen.
  - name: Centraal Station, ferry pier
    lat: 52.3809
    lng: 4.8997
    narration: |
      Back where you started. From the ferry, look at the north bank you have just ridden through.
      On one loop you have seen the city's answer to the shipyards across the water: villages of
      low houses under big roofs, with their own bathhouses, schools, halls and shops, from
      Disteldorp's emergency homes to the garden villages of Oostzaan and Nieuwendam.
    nl: |
      Terug bij het begin. Kijk vanaf de pont nog eens naar de noordoever waar je net doorheen
      fietste. In één rondje zag je hoe de stad de werfarbeiders aan de overkant huisvestte: dorpen
      van lage huizen onder grote daken, met eigen badhuizen, scholen, verenigingsgebouwen en
      winkels, van de noodwoningen van Disteldorp tot de tuindorpen Oostzaan en Nieuwendam.
