title: Villas and town houses of Oud-Zuid
summary: |
  The Amsterdam School for the well-to-do: villas, garden houses and town houses from Willemspark past the Valeriusplein to the Apollolaan, built for brokers, builders and developers between 1911 and 1930. A walk from brick ornament to Wright-style cubes.
body: |
  **Start:** Villa Insinger on the Oranje Nassaulaan in Willemspark, a few minutes' walk from the Amstelveenseweg stop of tram 2. **End:** Villa den Tex on the Apollolaan; trams run along the Beethovenstraat, about ten minutes' walk to the south-west (check a journey planner for lines, which changed in 2026).

  **Distance and time:** about 4 km, two hours at a strolling pace. The last leg along the Apollolaan is the longest, about 1.3 km.

  **What you can go inside:** nothing, really. These are private homes and a working school, so look from the pavement and respect the residents. Many villas sit behind hedges and garden walls; in winter, with the trees bare, you see more. The route is flat and at street level throughout.

  Most Amsterdam School buildings are rented flats for working families. This walk shows the other side: the same architects working for private clients who could afford a house of their own. You start in Willemspark, the only villa park ever built in Amsterdam, where the style grows out of Nieuwe Kunst (Dutch Art Nouveau) and rationalist brick. You pass the Valeriusplein, where a grammar school stands across the road like a city gate into Berlage's Plan Zuid, and end among the villas of the later 1920s, where brick sculpture gives way to flat roofs and cubic volumes inspired by Frank Lloyd Wright, and Hildo Krop carves a faun with an accordion.
mode: walk
photos: ["commons:File:Amsterdam - Cornelis Schuytstraat 65.JPG"]
nl:
  title: Villa's en herenhuizen in Oud-Zuid
  summary: |
    De Amsterdamse School voor de gegoede burgerij: villa's, een tuinhuis en herenhuizen van Willemspark via het Valeriusplein naar de Apollolaan, gebouwd tussen 1911 en 1930. Een wandeling van baksteenornament naar Wrightiaanse kubussen.
  body: |
    **Start:** Villa Insinger aan de Oranje Nassaulaan in Willemspark, een paar minuten lopen van de tramhalte Amstelveenseweg van lijn 2. **Eind:** Villa den Tex aan de Apollolaan; over de Beethovenstraat, zo'n tien minuten lopen naar het zuidwesten, rijden trams (kijk in een reisplanner welke lijnen; het tramnet is in 2026 veranderd).

    **Afstand en tijd:** ongeveer 4 km, twee uur op wandeltempo. Het laatste stuk over de Apollolaan is het langst, zo'n 1,3 km.

    **Binnen kijken:** eigenlijk nergens. Dit zijn woonhuizen en een school in gebruik; kijk vanaf de stoep en laat de bewoners met rust. Veel villa's liggen achter heggen en tuinmuren; in de winter, als de bomen kaal zijn, zie je meer. De route is vlak en ligt helemaal op straatniveau.

    De meeste gebouwen van de Amsterdamse School zijn huurwoningen voor arbeidersgezinnen. Deze wandeling laat de andere kant zien: dezelfde architecten aan het werk voor particulieren die een eigen huis konden betalen. Je begint in Willemspark, het enige villapark dat in Amsterdam is gerealiseerd, waar de stijl voortkomt uit de Nieuwe Kunst en het rationalisme. Je passeert het Valeriusplein, waar een lyceum als stadspoort over de weg staat, met daarachter Berlages Plan Zuid. En je eindigt tussen de villa's van de late jaren twintig, met platte daken en kubische volumes naar het voorbeeld van Frank Lloyd Wright, en een harmonicaspelende faun van Hildo Krop.
stops:
  - place: Villa Insinger
    narration: |
      Start at a pond in Willemspark. F. Insinger had this free-standing villa built in 1917–1918 by Theo Groenendijk and Theo J. Lammers, one of the more expressive houses in the park.

      Its plan is unusual: four volumes of three and four storeys set back to back, under a cluster of folded (*geknikte*) hipped roofs in red tile, with patterned brick chimneys as part of the composition. Every façade has decorative brickwork. Find the entrance: a round arch with an oak door, leaded glass and a little diamond-shaped window, set between two flat stone consoles. You will see more of Groenendijk & Lammers on the Koninginneweg, in their earlier and tamer manner.
    nl: |
      Begin aan een vijver in Willemspark. F. Insinger liet deze vrijstaande villa in 1917-1918 bouwen naar ontwerp van Groenendijk & Lammers.

      De plattegrond is bijzonder: vier bouwvolumes van drie en vier lagen staan met de achterzijde tegen elkaar, onder een samenstel van geknikte wolfsdaken met rode pannen. Alle gevels hebben decoratief metselwerk, de schoorstenen ook. Zoek de ingang: een inpandige rondboog met een eikenhouten deur, glas-in-lood en een diamantvormig venstertje, tussen twee natuurstenen consoles. Verderop, aan de Koninginneweg, zie je ouder en braver werk van hetzelfde bureau. In 1948 werd hier oorlogsschade hersteld.
  - place: Villa Sophialaan 1–3
    narration: |
      Just round the corner, a very different villa. G. de Wilde designed it in 1919 for NV Technisch Bureau Visser on a six-sided plan with a flat roof, which gives it a compact, almost fortress-like silhouette among Willemspark's pitched roofs.

      Look at the broad projecting bay on the Sophialaan, where two piers carry a stone relief of stylised waves and a mask (a mascaron), and at the ribbed bands of projecting brick around the top floor. The north corners are chamfered. It began as two houses; in 1935 they were joined and split horizontally into flats.
    nl: |
      Om de hoek een heel andere villa. G. de Wilde ontwierp haar in 1919 voor de NV Technisch Bureau Visser, op een zeshoekige plattegrond onder een plat dak. Tussen de kappen van Willemspark geeft dat een gesloten, blokvormig silhouet.

      Kijk naar de brede risaliet aan de Sophialaan, met twee muurpijlers en een natuurstenen reliëf van gestileerde golven en een mascaron, en naar de regelmatig uitkragende bakstenen cordonlijsten rond de bovenste verdieping. De noordelijke hoeken zijn afgeschuind. In 1935 verbouwde J. Scheelbeek het interieur: de twee woningen werden samengevoegd en daarna horizontaal gesplitst.
  - place: Garden house Oranje Nassaulaan 10
    narration: |
      The smallest monument on this walk. The villa at Oranje Nassaulaan 10 is not protected, but the summer house in the point of its back garden is. C.J. Blaauw, best known for the villa village of Park Meerwijk in Bergen, designed it in 1925 for A. von Saher Crone.

      From the Koningslaan side you can just see its pointed slate roof over the brick garden wall. It is built on a triangular plan against that wall, partly brick and partly weatherboarded, with an open part on wooden posts, and painted yellow and dark green. The register praises those Amsterdam School colours. Blaauw had worked in the Baanders brothers' office; you will meet their school at the Valeriusplein.
    nl: |
      Het kleinste monument van deze wandeling. De villa Oranje Nassaulaan 10 is niet beschermd, het tuinhuis in de punt van de achtertuin wel. C.J. Blaauw, bekend van villapark Meerwijk in Bergen, ontwierp het in 1925 voor A. von Saher Crone.

      Vanaf de Koningslaan zie je net het leien zadeldak boven de gemetselde tuinmuur uitsteken. Het staat op een driehoekige grondslag tegen die muur, deels steen en deels gepotdekseld hout, met een open gedeelte onder een afdak op houten kolommen, geel en donkergroen geschilderd. Het register prijst de fijne detaillering en de kleurstelling. Blaauw begon zijn loopbaan bij de gebroeders Baanders, van wie je straks het Amsterdams Lyceum ziet.
  - place: Emmaplein villas
    narration: |
      This little square shows two generations side by side. On the west side stands a linked triple villa of 1911 by Jan Frederik Staal, in a rational style: flat, disciplined brick, deep window reveals, horizontal sash windows. In 1913 Staal turned its kitchen entrance into a garage. Staal went on to become one of the leading Amsterdam School architects; this is where he started.

      Across the square, on the corner with the Oranje Nassaulaan, Jan Juffer jr. built a double villa in 1919 in the sober Amsterdam School manner: four storeys under red-tiled mansard roofs, decorative brickwork and parabolic gables, one with a zinc roof turret. Look for its separate brick garage of 1920, a rare survivor from the first years of the car, and the wrought-iron fence in front of number 5.
    nl: |
      Op dit pleintje staan twee generaties naast elkaar. Aan de westzijde een geschakelde drievoudige villa van J.F. Staal uit 1911, in rationalistische trant ontworpen voor I.L. Nienaber: strakke bakstenen gevels zonder franje. In 1913 verbouwde Staal de keukeningang al tot 'automobielbewaarplaats'. Staal zou later een van de voormannen van de Amsterdamse School worden; hier zie je waar hij begon.

      Op de hoek met de Oranje Nassaulaan ontwierp Jan Juffer jr. in 1919 een dubbele hoekvilla in verstrakte Amsterdamse School-stijl: vier bouwlagen onder een mansardekap met rode pannen, decoratief metselwerk en paraboolvormige topgevels, met een zinken dakruiter. Bij nummer 3 hoort een gave garage uit 1920, een zeldzaam overblijfsel uit de begintijd van de auto, bij nummer 5 een sierhek op een bakstenen voet.
  - place: Koninginneweg 50–60
    narration: |
      Leave Willemspark for the Concertgebouwbuurt, laid out after Amsterdam annexed the area in 1896. Here Groenendijk & Lammers built two linked groups of town houses, nos. 56–60 in 1914 and nos. 50–54 in 1916, a few years before Villa Insinger.

      Look under the bay windows of nos. 50–54. Instead of stone consoles, they rest on corbels built up from many layers of brick laid flat and on edge. The city register calls this typical of the new style, in a design otherwise still rooted in the Nieuwe Kunst. Chronologically, these are the earliest Amsterdam School touches on this walk. Lammers went on to build large housing blocks in the 1920s.
    nl: |
      Je verlaat Willemspark voor de Concertgebouwbuurt, aangelegd na de annexatie van 1896. Hier bouwden Groenendijk & Lammers twee groepen herenhuizen: 56-60 in 1914 en 50-54 in 1916, een paar jaar vóór Villa Insinger.

      Kijk onder de erkers van nummer 50-54. Ze rusten niet op natuurstenen consoles maar op een uitkraging van meervoudig uitgemetselde lagen staande en liggende stenen. De versiering wortelt deels in de Nieuwe Kunst, maar volgens het gemeentelijk register zijn dit al elementen van de Amsterdamse School. Lammers bouwde in de jaren twintig grote woningbouwcomplexen in de expressieve baksteenstijl.
  - place: Valeriusplein toilet buildings
    narration: |
      Now a piece of street furniture. On the north side of the Valeriusplein, J. de Meyer of Public Works designed two mirror-image public toilets in 1922, together with the fence around the garden and a bench on the south side.

      They are half sunk below the pavement and reached by steps, built entirely of cast concrete in flowing, wavy lines under a broad overhanging flat roof. Look at the double doors divided by a half-column, and at the wrought-iron gates. The toilets have long been out of use and were filled with concrete to stop misuse, but they show the style reaching even the most modest public building, in a material other than brick.
    nl: |
      Nu een stukje straatmeubilair. Aan de noordzijde van het Valeriusplein ontwierp J. de Meyer van Publieke Werken in 1922 twee spiegelbeeldige toiletgebouwtjes, samen met het hekwerk rond het plantsoen en een zitbank aan de zuidkant.

      Ze liggen half onder het maaiveld, bereikbaar via een trap, en zijn helemaal van gegoten beton, in vloeiende, golvende lijnen onder een plat dak met brede overstek. Let op de dubbele deuren met een halfkolom ertussen en op de smeedijzeren hekken. De privaten zijn al lang buiten gebruik en met beton volgestort, maar ze laten zien dat de stijl ook het nederigste openbare gebouwtje bereikte, en dan in beton.
  - place: Huize de Windroos (Het Zwarte Huis)
    narration: |
      Just west of the square, Piet Kramer designed this five-storey block of flats in 1921 for the builder J.Th. Boersma, and changed the front to its present look in 1922. Its official name is Huize de Windroos (the compass rose); the neighbourhood calls it Het Zwarte Huis, the Black House, after its dark brick.

      Stand back and watch the façade fold round the kink in the Okeghemstraat. The register calls it a fine example of Amsterdam School flats "from just after the short, very expressive early period", cleverly responding to its site. Not everyone here lived in a villa: this is a block of flats, by Kramer in the same years as De Dageraad. The original windows were later replaced by plain ones.
    nl: |
      Net ten westen van het plein ontwierp Piet Kramer in 1921 dit vijflaagse blok etagewoningen voor bouwondernemer J.Th. Boersma; in 1922 wijzigde hij de voorgevel tot het huidige aanzien. Officieel heet het Huize de Windroos, in de volksmond Het Zwarte Huis, naar de donkere baksteen.

      Ga wat achteruit staan en zie hoe de gevel meebuigt met de knik in de Okeghemstraat. Het register noemt het een gaaf voorbeeld van etagebouw in Amsterdamse School-stijl "van vlak na de korte, zeer expressievolle beginperiode", dat boeiend inspeelt op de situering. In 1934 werden de kozijnen verlaagd, en de oorspronkelijke ramen zijn vervangen door eenvoudige drieruitsvensters.
  - place: Amsterdams Lyceum
    narration: |
      Across the south side of the Valeriusplein, the Baanders brothers built the Amsterdams Lyceum in 1918–1920 as a city gate: the road passes under its central block through two round-arched passages, and Berlage's Plan Zuid begins on the other side. Piet Kramer's Lyceumbrug (1926–1928) carries the axis on over the canal.

      Look at the symmetrical cubic brick volumes under flat roofs, the two towers either side of the passages and the decorative brick frieze running round the whole building. Its stained glass is by R.N. Roland Holst. On the corner with the De Lairessestraat stands the rector's house, De Zonne-Wijzer (the sundial, 1919), with its deep porch, horizontal brick bands and overhanging cornice: an early sign of Frank Lloyd Wright's influence, which you will see grow towards the end of this walk.
    nl: |
      Aan de zuidkant van het Valeriusplein bouwden de gebroeders Baanders in 1918-1920 het Amsterdams Lyceum als stadspoort: de weg loopt door twee rondboogdoorgangen onder het middendeel door, en aan de overkant begint Plan Zuid. De Lyceumbrug van Piet Kramer (1926-1928) zet die as voort over het Noorder Amstelkanaal.

      Kijk naar de symmetrische, kubische bouwvolumes onder platte daken, de twee risalerende torens bij de doorgangen en het fries van siermetselwerk rondom. Het glas-in-lood is van R.N. Roland Holst. Op de hoek met De Lairessestraat staat de rectorswoning De Zonne-Wijzer (1919), met een diepe portiek, horizontale cordonbanden en een overstekende daklijst: al invloed van Frank Lloyd Wright, die verderop op deze route sterker wordt.
    next:
      directions: Follow the De Lairessestraat east from the Valeriusplein.
      nl: Loop vanaf het Valeriusplein De Lairessestraat in, naar het oosten.
  - place: H.L. de Jong houses De Lairessestraat
    narration: |
      Hijman Louis de Jong is best known for the Tuschinski theatre. Here, in 1919–1921, he built a block of 12 single-family and 6 two-family houses for W.J. Baartscheer jr., between the Lassusstraat and the Dufaystraat.

      Read it from across the street as one symmetrical composition in five parts: a central group of four houses (nos. 154–160), two linking groups of four mirrored houses, and end pieces that turn the corners into the side streets. Town houses in a row, but designed as a single block: the idea Berlage was arguing for, a whole block designed at once. In 1939 the corner house became the office and laboratory of the Amsterdamsche Chininefabriek, a quinine factory.
    nl: |
      Hijman Louis de Jong is vooral bekend van Tuschinski. Hier bouwde hij in 1919-1921 voor W.J. Baartscheer jr. een blok van twaalf eengezins- en zes tweegezinswoningen, tussen Lassusstraat en Dufaystraat; de constructie was van De Kondor.

      Bekijk het vanaf de overkant als één symmetrisch geheel in vijf delen: een middendeel van vier woningen (154-160), twee tussenleden van elk vier gespiegelde woningen en kopse delen die de hoek om gaan, de zijstraten in. In 1939 werd de woning aan de Dufaystraat met nummer 142 verenigd tot kantoor, laboratorium en conciërgewoning van de Amsterdamsche Chininefabriek.
  - place: La Croix houses Cornelis Schuytstraat
    narration: |
      On the corner of the Cornelis Schuytstraat and the J.J. Viottastraat, G.F. La Croix built an L-shaped row of five family houses in 1917 for the developer H. van der Schaar, across the street from the maritime museum he designed for the same client.

      This is the expressive phase at domestic scale: decorative brickwork everywhere, a folded red-tiled roof with a carved gutter, triangular bays on carved wooden posts, and a deep, kinked parabolic entrance with a small parabolic fanlight crossed by a St Andrew's cross. Don't miss the Amsterdam School garden fence on the Cornelis Schuytstraat side.
    nl: |
      Op de hoek van de Cornelis Schuytstraat en de J.J. Viottastraat bouwde G.F. La Croix in 1917 vijf geschakelde eengezinswoningen voor H. van der Schaar, tegenover het scheepvaartmuseum dat hij voor dezelfde opdrachtgever ontwierp. In 1977 werd een deel dependance van een meisjesschool.

      Dit is de expressieve periode op huiselijke schaal: overal decoratief metselwerk, een geknikt pannendak met bewerkte gootlijst, licht uitkragende driehoekerkers met bewerkte posten en een diepe, paraboolvormige en geknikte entree met een bovenlichtje met Andreaskruis. Vergeet het tuinhek in Amsterdamse School-stijl aan de Cornelis Schuytstraat niet.
  - place: Villa Klatte
    narration: |
      Across the street stands a cooler kind of villa. Harry Elte and G.F. Mastenbroek built it in 1918–1919 for S.R. Klatte: compact, blocky, in light-brown brick. The national register calls the style *zakelijk-expressionistisch*, expressive but functional.

      Elte had been Berlage's assistant for ten years, and his work is more geometric than La Croix's next door: compare the two. He later designed the synagogue on the Jacob Obrechtplein. Under the German occupation he was barred from working, and he died in Theresienstadt in 1944; because of the persecution, none of his archive survives. Look at the bay on the north-east side, where a veranda was first planned, and the square brick posts that are all that remain of the garden fence.
    nl: |
      Aan de overkant staat een koelere villa. Harry Elte en G.F. Mastenbroek bouwden haar in 1918-1919 voor S.R. Klatte: blokvormig, in lichtbruine baksteen. Het register noemt de trant zakelijk-expressionistisch.

      Elte was tien jaar in dienst van Berlage geweest, en zijn werk is strakker dan dat van La Croix ernaast: vergelijk ze maar. Later ontwierp hij de synagoge aan het Jacob Obrechtplein. Tijdens de bezetting werd hij uit zijn beroep gezet; in 1944 overleed hij in Theresienstadt, en door de vervolging is er geen archief van hem bewaard. Let op de erker aan de noordoostzijde, waar eerst een veranda was getekend, en de gemetselde posten van het verdwenen tuinhek.
  - place: Warners villas J.J. Viottastraat
    narration: |
      A few years later, the villa has become a set of cubes. F.A. Warners designed these three double villas in 1925–1926, and the register sees recognisable influences of Frank Lloyd Wright: interlocking cubic volumes, flat roofs, horizontal glazing bars, pentagonal bays and projecting cornices. One house even had a garage built in next to the kitchen, unusual at the time.

      Look at the corner house, Cornelis Schuytstraat 72, with its pentagonal bays, zinc cornices and balcony parapets, and at the bands of block-patterned brick between the windows. Warners, a contractor's son with "a strong eye on America", introduced the apartment building to Amsterdam. The back gardens run down to the Noorder Amstelkanaal, which you cross next.
    nl: |
      Een paar jaar later is de villa een stapeling van kubussen geworden. F.A. Warners ontwierp deze drie dubbele villa's in 1925-1926, volgens het register verstrakte Amsterdamse School met herkenbare invloeden van Frank Lloyd Wright: in- en uitspringende kubische vormen, platte daken, horizontale roedenverdeling, vijfhoekige erkers en uitkragende lijsten met attiek. Eén woning kreeg een inpandige garage naast de keuken.

      Kijk naar het hoekhuis, Cornelis Schuytstraat 72, met zijn vijfhoekige erkers en balkons, naar het siermetselwerk in blokmotief en naar de oude tuinmuur met houten poorten aan de J.J. Viottastraat. Warners, een aannemerszoon, introduceerde het etagehuis in Amsterdam. De achtertuinen grenzen aan het Noorder Amstelkanaal, dat je nu oversteekt.
    next:
      directions: Cross the Noorder Amstelkanaal to the Apollolaan and the Albert Hahnplantsoen.
      nl: Steek het Noorder Amstelkanaal over naar de Apollolaan en het Albert Hahnplantsoen.
  - place: Apollolaan villas
    narration: |
      You are now inside Plan Zuid. Along this stretch of the Apollolaan, where gardens run down to the canal, a small villa district grew up in 1925–1930.

      On the Albert Hahnplantsoen, E. Nijsten's double villa (1930) has a tower, overhanging eaves and three garden houses linked by the garden walls; one of them belongs to Villa Lebbink, the next stop. Next to it is a double villa by the Baanders brothers that is really two apartments stacked on top of each other. At Apollolaan 178, look over the door for Mari Andriessen's two playing putti, and for his figures of the four seasons. Around the corner on the Dijsselhofplantsoen, G.J. Rutgers built the villa La Pergola, whose pergola has gone.
    nl: |
      Je bent nu in Plan Zuid. Langs dit stuk Apollolaan, met tuinen tot aan het kanaal, ontstond in 1925-1930 een kleine villawijk.

      Aan het Albert Hahnplantsoen staat de dubbele villa van E. Nijsten (1930) in rood-grauwe baksteen, met een toren, overkragende luifels en drie tuinhuisjes die via de erfafscheiding verbonden zijn; één ervan hoort bij Villa Lebbink, de volgende stop. Ernaast staat een dubbele villa van de gebroeders Baanders die eigenlijk uit twee boven elkaar gelegen appartementen bestaat. Aan de Apollolaan 178 zie je boven de deur twee spelende putti van Mari Andriessen, en zijn vier jaargetijden. Om de hoek, aan het Dijsselhofplantsoen, bouwde G.J. Rutgers villa La Pergola; de pergola zelf is verdwenen.
  - place: Villa Lebbink
    narration: |
      On the corner of the Apollolaan and the Albert Hahnplantsoen stands the villa Jo Mulder built in 1925–1927 for Christiaan Lebbink, a currency broker and art lover, who had the interior artistically furnished. When it was finished it still stood in rural surroundings.

      It is sober Amsterdam School, but full of brick craft: low eaves against tall gables, an asymmetric composition under black glazed pantiles, bricks set at 45 degrees along the roof edge and herringbone brickwork high in the gable. Look for the colourful stained-glass window and the brick garden wall. Later residents included the architect Kees Spanjer and the choreographer Beppie Blankert.
    nl: |
      Op de hoek van de Apollolaan en het Albert Hahnplantsoen staat de villa die Jo Mulder in 1925-1927 bouwde voor valutahandelaar en kunstliefhebber Christiaan Lebbink, die het interieur artistiek liet inrichten en er zo'n tien jaar woonde. Bij oplevering lag ze nog in een landelijke omgeving.

      Het is verstrakte Amsterdamse School, maar vol metselkunst: een lage dakrand tegenover hoge topgevels, een asymmetrische opbouw onder zwart verglaasde Hollandse pannen, stenen onder 45 graden langs de dakrand en visgraatmetselwerk hoog in de gevel. Let op het kleurige glas-in-loodraam en de bakstenen tuinmuur. Latere bewoners waren architect Kees Spanjer en choreografe Beppie Blankert.
    next:
      directions: Follow the Apollolaan east for about 1.3 km to number 1, on the corner of the Bernard Zweerskade. Shortly before the end you pass Boterenbrood's block at Apollolaan 25–43.
      nl: Volg de Apollolaan zo'n 1,3 km naar het oosten tot nummer 1, op de hoek van de Bernard Zweerskade. Vlak voor het eind kom je langs het blok van Boterenbrood op Apollolaan 25-43.
  - place: Villa den Tex (Apollolaan 1)
    narration: |
      End with a smile. The architect Frans den Tex designed this house in 1927–1928 on a plot his father Karel had bought, in a sober Amsterdam School of yellow-brown brick.

      What makes it special is Hildo Krop, the city sculptor, who carved dozens of small white limestone figures on site, especially around the garage. They were inspired by cube-like carvings Den Tex had seen in the Dutch East Indies. Hunt for the archer, the plants and animals, a faun playing an accordion with a dachshund (perhaps a wink at the architect), and a weasel, said to refer to the builder, Wezel. After a walk of brick ornament on villas, it is a fitting finale: the style has become calm and the sculpture has turned playful. On the Bernard Zweerskade side stands a small electrical junction box by P.L. Marnette.
    nl: |
      Eindig met een glimlach. Architect Frans den Tex bouwde dit woonhuis in 1927-1928 op grond die zijn vader Karel den Tex had gekocht, in een verstrakte Amsterdamse School van geelbruine baksteen.

      Het bijzondere is het werk van Hildo Krop, die talloze witte kalkstenen beeldjes ter plekke uithakte, vooral rond de garage. Hij liet zich inspireren door de kubusachtige beelden die Den Tex in Nederlands-Indië had gezien. Zoek de boogschutter, de planten en dieren, een harmonicaspelende faun met teckel (vermoedelijk een knipoog naar de architect) en een wezel, naar bouwondernemer Wezel. De architectuur is rustig geworden, het beeldhouwwerk speels. Aan de Bernard Zweerskade staat een splitskast van P.L. Marnette.
