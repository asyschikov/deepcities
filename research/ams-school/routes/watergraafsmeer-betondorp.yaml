title: Watergraafsmeer bridges and Betondorp
summary: >-
  A loop through the Watergraafsmeer that follows Piet Kramer's bridges from the 1920s to their
  plain post-war end, with Kruyswijk's church and school, two Public Works schools, and Betondorp,
  the concrete garden village. It starts and finishes at the Hartmanbrug.
body: |
  This is a loop: it starts and finishes at the Hartmanbrug, at the end of the Molukkenstraat in
  the Indische Buurt, where a bridge crosses the Ringvaart into the Watergraafsmeer. The ride runs
  south through the garden suburb to the Brink, the village green of Betondorp, and comes back
  north past Kramer's last bridges to a Public Works school just across the Ringvaart. Tram 9 runs
  along the Middenweg at the entrance to Betondorp, a few minutes from the Brink, so you can also
  join or leave the loop there. The ride is about 8.5 km. Allow two and a half to three hours with
  stops.

  Everything is seen from outside. The Vijfde Montessorischool and the school on the Batjanstraat
  are working schools, so be considerate during school hours. Kruyswijk's church on the
  Galileïplantsoen is the meeting house of the Apostolisch Genootschap. Several bridges are best
  seen from the water's edge, a few steps down from the road.

  Piet Kramer designed bridges for the city's Public Works department from 1917 to 1952. He drew more than 500
  bridges, and about 220 were built. The Watergraafsmeer, annexed by Amsterdam in 1921
  and laid out as a garden suburb with streets named after scientists, holds a run of his bridges
  over the old Molenwetering drainage channel. They range from the granite-studded culverts of 1928
  to bare brick walls built in the 1950s, and riding past them you watch his ornament thin out.
  Along the way are Cornelis Kruyswijk's church and school and two schools by Public Works. Halfway
  round lies Betondorp, the city's boldest garden-village experiment.
mode: bike
photos: ["commons:File:2022 Brink 43-45, Asd (10).jpg"]
nl:
  title: Bruggen in de Watergraafsmeer en Betondorp
  summary: >-
    Een rondje door de Watergraafsmeer langs de bruggen van Piet Kramer, van de jaren twintig tot
    hun sobere naoorlogse slot, met de kerk en school van Kruyswijk, twee scholen van Publieke
    Werken en Betondorp, het tuindorp van beton. Start en finish bij de Hartmanbrug.
  body: |
    Deze tocht is een rondje: hij begint en eindigt bij de Hartmanbrug, aan het eind van de
    Molukkenstraat in de Indische Buurt, waar een brug over de Ringvaart de Watergraafsmeer in gaat.
    De route gaat zuidwaarts door de wijk naar de Brink van Betondorp en komt langs Kramers laatste
    bruggen terug naar een school van Publieke Werken net over de Ringvaart. Over de Middenweg, bij
    de entree van Betondorp en een paar minuten van de Brink, rijdt tram 9; ook daar kun je in- of
    uitstappen. Het is ongeveer 8,5 km fietsen. Reken met de stops op tweeënhalf tot drie uur.

    Alles bekijk je van buiten. De Vijfde Montessorischool en de school aan de Batjanstraat zijn nog
    altijd scholen; houd daar rekening mee onder schooltijd. De kerk van Kruyswijk aan het
    Galileïplantsoen is de plaats van samenkomst van het Apostolisch Genootschap. Veel bruggen zie
    je het best vanaf de waterkant, een paar stappen van de weg.

    Piet Kramer ontwierp van 1917 tot 1952 bruggen voor de Dienst der Publieke Werken. De
    Watergraafsmeer, in 1921 door Amsterdam geannexeerd en als tuindorpachtige wijk aangelegd met
    straten vernoemd naar wetenschappers, heeft een hele reeks van zijn bruggen over de oude
    Molenwetering. Van de duikers met graniet uit 1928 tot kale bakstenen wanden uit de jaren
    vijftig: onderweg zie je zijn versiering langzaam verdwijnen. Daartussen staan de kerk en de
    school van Cornelis Kruyswijk en twee scholen van Publieke Werken. Halverwege ligt Betondorp, het
    gewaagdste tuindorpexperiment van de stad.
stops:
  - place: Hartmanbrug (Brug 190)
    narration: |
      This brick bridge links the Indische Buurt with the Watergraafsmeer, and it took nearly ten
      years of argument. In 1927 the city planned a temporary wooden footbridge here, at the end of
      the Molukkenstraat. Residents of the Celebesstraat protested, because they wanted the crossing
      in line with their own street. They got it, and the Molukkenstraat had to wait.

      Public Works designed a proper bridge here only in 1932. Piet Kramer drew it in his familiar
      brick manner, and it was tendered in 1935 for 26,000 guilders and opened in 1936. Look at the
      large brick surfaces of the abutments and balustrades. Then look along the Ringvaart towards
      the footbridge that beat this one, a few hundred metres west. Since 2011 this bridge has been
      called the Hartmanbrug.
    nl: |
      Deze bakstenen brug verbindt de Indische Buurt met de Watergraafsmeer, en er ging bijna tien
      jaar buurtdiscussie aan vooraf. Begin 1927 zou hier, in het verlengde van de Molukkenstraat, een
      houten noodbrug komen. Bewoners van de Celebesstraat protesteerden: zij wilden een brug in het
      verlengde van hun eigen straat. Die kwam er, en de Molukkenstraat moest wachten.

      Pas in 1932 ontwierp Publieke Werken hier een vaste brug, door Piet Kramer in zijn vertrouwde
      stijl met veel baksteen. Na een aanbesteding in 1935 voor 26.000 gulden ging ze in 1936 open.
      Let op de grote baksteenvlakken van landhoofden en balustrades, en kijk over de Ringvaart naar
      de voetbrug die het van deze brug won, een paar honderd meter westelijker. Sinds 2011 heet ze
      Hartmanbrug.
  - place: Caroline Herschelbrug (Brug 115)
    narration: |
      Here is the bridge the Celebesstraat residents fought for. In 1926 the city had decided
      against a footbridge at the end of the Molukkenstraat, fearing the path would become a
      through road. The residents argued that without a bridge they faced a long detour to the
      Watergraafsmeer. In 1927 this footbridge went up in line with their street, designed by
      Kramer on a budget of just 5,500 guilders.

      It is Kramer at pedestrian scale, much smaller than the Hartmanbrug. It is now named after
      the astronomer Caroline Herschel, to match the scientists' names of the streets beyond.
      Amsterdam annexed the Watergraafsmeer in 1921 and laid it out as a garden suburb; cross over
      and you are in it.
    nl: |
      Dit is de brug waar de bewoners van de Celebesstraat voor streden. In 1926 vond de gemeente
      een voetbrug in het verlengde van de Molukkenstraat onwenselijk, omdat zo'n route vanzelf een
      verkeersstraat zou worden. De bewoners wezen erop dat zij zonder brug een flinke omweg naar de
      Watergraafsmeer moesten maken. In 1927 kwam deze voetbrug in het verlengde van hun straat,
      ontworpen door Kramer en begroot op 5.500 gulden.

      Het is een Kramerbrug op voetgangersschaal, veel kleiner dan de Hartmanbrug. Nu is ze vernoemd
      naar de astronome Caroline Herschel, passend bij de wetenschappersnamen van de straten
      erachter. Amsterdam annexeerde de Watergraafsmeer in 1921 en legde er een tuindorpachtige wijk
      aan; steek over en je bent erin.
  - place: Newtonschool (Cornelis Kruyswijk)
    narration: |
      Cornelis Kruyswijk (1884–1935) designed this primary school in 1930 for the Watergraafsmeer
      school association. He worked in a sober version of the Amsterdam School, with good materials
      and careful detail. The school heads a block of plain middle-class housing but stands out
      from it, with mottled yellow-brown-red brick, a steep blue-tiled roof with four chimneys, and
      volumes of different heights stepping in and out.

      Go to the recessed entrance under its white canopy. In the porch, reliefs very probably by
      Theo van Reijn read "arbeid overwint 1929" ("work conquers") beside three flamingo-like
      birds, and a mask is flanked by two tiny seated figures posed like Rodin's Thinker. The
      school was meant as a *Gesamtkunstwerk* (total work of art), bringing children into early
      contact with art.
    nl: |
      Cornelis Kruyswijk (1884-1935) ontwierp deze lagere school in 1930 voor de Watergraafsmeerse
      Schoolvereniging, in een 'strakke en sobere' Amsterdamse School met hoogwaardige materialen en
      veel oog voor detail. De school vormt de kop van een blok met eenvoudige middenstandswoningen,
      maar valt op door de geel-bruin-rood gemêleerde baksteen, de steile kap met blauwe pannen en
      vier schoorstenen, en de verschillend hoge bouwvolumes die in- en uitspringen.

      Loop naar de verdiepte entree onder de witte luifel. In het portaal staan reliëfs, zeer
      waarschijnlijk van Theo van Reijn: 'arbeid overwint 1929' met drie flamingo-achtige vogels, en
      een maskerkop met twee zittende figuurtjes in de pose van Rodins Denker. De school was
      opgevat als Gesamtkunstwerk, dat kinderen al vroeg met kunst in aanraking moest brengen.
  - place: Vijfde Montessorischool Watergraafsmeer
    narration: |
      The next school is by the city. The Public Works architects Nicolaas Lansdorp and A.R.
      Hulshoff designed it, and it opened in 1931 as De Zilvermeeuw (The Herring Gull). It is still
      a Montessori school. Three brick wings form a U around the playground, which opens towards
      the green Galileïplantsoen, and the whole building sits on the axis of the Radioweg.

      Look up at the gables, where the ends of the ridge purlins poke out, carved into animals by
      Hildo Krop. Beside the left-hand entrance on the Herschelstraat stands Jan Heijens' limestone
      Pied Piper of Hamelin, next to a timber canopy and a brick flower box. On the playground side
      there are granite benches by the doors and the original steel-and-brick fence.
    nl: |
      De volgende school is van de gemeente. De architecten Nicolaas Lansdorp en A.R. Hulshoff van
      Publieke Werken ontwierpen haar; in 1931 ging ze open onder de naam De Zilvermeeuw, en het is
      nog altijd een montessorischool. Drie bakstenen vleugels omsluiten in een U het schoolplein,
      dat zich opent naar het Galileïplantsoen. De school ligt precies in de zichtas van de Radioweg.

      Kijk omhoog naar de topgevels: de uiteinden van de nokgordingen steken erdoor en zijn door
      Hildo Krop gesneden met diermotieven. Bij de linker ingang aan de Herschelstraat staat het
      kalkstenen beeld van de Rattenvanger van Hamelen door Jan Heijens, naast een forse houten
      luifel en een bakstenen bloembak. Aan de pleinzijde staan granieten zitbanken naast de deuren
      en het oorspronkelijke hekwerk.
  - place: Kramer bridges on the Galileïplantsoen (Brug 235, 335, 336, 337, 338)
    narration: |
      Start at the Radioweg bridge in front of the school. In the late 1920s the old drainage
      ditch, the Molenwetering, became the centre of this long green strip, and Kramer designed a
      family of five low, wide culvert bridges for the cross streets. They were built around 1928
      for just under 60,000 guilders together. From west to east they are the Henk van Laarbrug
      (Brug 235), the Jaap Kruizingabrug (335, Radioweg), the Hans Lipperheybrug (336), Brug 337
      and Brug 338.

      They show Kramer's sober side: little sculpture, and ironwork only at the ends. But look at
      the piers, alternating courses of brick and granite like stacks of draughts pieces
      (*damstenen*), and the brick balustrades studded with small granite blocks. Remember this mix;
      for the rest of the ride you will watch it thin out.
    nl: |
      Begin bij de brug in de Radioweg, voor de school. Toen Amsterdam eind jaren twintig dit deel
      van de Watergraafsmeer bebouwde, werd de oude Molenwetering de as van een lange groenstrook, en
      Kramer ontwierp voor de dwarsstraten een reeks brede duikerbruggen. Ze dateren van omstreeks
      1928 en kostten samen net geen 60.000 gulden. Van west naar oost: de Henk van Laarbrug (brug
      235), de Jaap Kruizingabrug (335, Radioweg), de Hans Lipperheybrug (336), brug 337 en brug 338.

      Het zijn sobere Kramerbruggen, met weinig beeldhouwwerk en siersmeedwerk alleen bij de
      landhoofden. Maar kijk naar de pijlers van afwisselend baksteen en graniet, als een stapel
      damstenen, en naar de bakstenen balustrades met granieten blokjes. Onthoud die combinatie: de
      rest van de tocht zie je haar steeds verder verdwijnen.
    next:
      directions: Follow the Galileïplantsoen towards the tall black roof of the church at its head.
      nl: Volg het Galileïplantsoen naar het hoge zwarte dak van de kerk aan het eind.
  - place: Apostolisch Genootschap Watergraafsmeer
    narration: |
      From the bridges you have been looking at this roof. In 1929 Cornelis Kruyswijk drew a church
      with a flat roof here for the Hersteld Apostolische Zendinggemeente. The city's aesthetics
      committee (*schoonheidscommissie*) wanted a monumental end to the long green axis, so the
      church got a tall slanting roof of black-glazed tiles. The committee also demanded the
      slender clock tower, which the city ended up paying for; the clock still belongs to the
      municipality. The church opened on 25 January 1931.

      Look at the yellow clinker brick on a blue-brick plinth, the small canopies over doors and
      windows, and the very tall, narrow stairwell windows that form little bays. The same
      congregation later had Kruyswijk build its church in Noord, which opened in December 1934,
      just weeks before he died.
    nl: |
      Vanaf de bruggen keek je al naar dit dak. In 1929 tekende Cornelis Kruyswijk hier een kerk met
      een plat dak voor de Hersteld Apostolische Zendinggemeente. Maar de schoonheidscommissie wilde
      een monumentale afsluiting van het Galileïplantsoen, en zo kwam er een hoog schuin dak met
      zwart verglaasde pannen. Ook de ranke toren was een eis van de commissie; de gemeente betaalde
      hem uiteindelijk, en het uurwerk is nog altijd gemeentebezit. Op 25 januari 1931 werd de kerk in
      gebruik genomen.

      Let op de geel genuanceerde gevelklinkers op een plint van blauwe klinkers, de luifeltjes boven
      ramen en deuren en de zeer smalle, hoge trappenhuisramen die een kleine erker vormen. Voor
      dezelfde gemeente bouwde Kruyswijk later de kerk aan de Clematisstraat in Noord, geopend in
      december 1934, een paar weken voor zijn dood.
  - place: Voltaplein
    narration: |
      Just to the south, a quiet garden square shows how the district filled up in the early
      1930s. The square was named after Alessandro Volta in 1927. Instead of one architect designing
      whole streets, four each built a small block around it: Jop van Epen, Arend Jan Westerman,
      Lau Peters and J.M. van Hardeveld. Westerman is the former Public Works architect of the round
      bathhouse on the Boerhaaveplein, here building housing.

      Ride round and compare the blocks: flat brick fronts, horizontal windows, tiled roofs and
      small brick accents, a catalogue of the style's sober late phase. Van Epen came back after
      completion to take photographs. In the middle, the rectangular garden has held Lajos Ratkai's
      abstract sculpture Twee bolvormen (Two spheres) since 1971.
    nl: |
      Iets zuidelijker laat een rustig plantsoenplein zien hoe de wijk begin jaren dertig volliep.
      Op 23 december 1927 kreeg het plein de naam van Alessandro Volta. De bebouwing kwam niet van één
      ontwerper: Jop van Epen, Arend Jan Westerman, Lau Peters en Johannes Martinus van Hardeveld
      bouwden hier elk een klein blok. Westerman is de man van het ronde badhuis aan het
      Boerhaaveplein, toen hij nog bij Publieke Werken werkte.

      Fiets een rondje en vergelijk de blokjes: portieken, vensterbanden en bakstenen details van de
      sobere jaren dertig. Van Epen kwam na de oplevering zelf nog kijken en fotograferen. Het
      plantsoen in het midden heeft een rechthoekige indeling van perkjes en paden; sinds 1971 staat
      er het abstracte beeld Twee bolvormen van Lajos Ratkai.
    next:
      directions: Ride west to the Molenwetering at the Linnaeushof.
      nl: Fiets westwaarts naar de Molenwetering bij de Linnaeushof.
  - place: Brug 304 (Linnaeushof)
    narration: |
      Back to Kramer, and back in time. This small culvert bridge of 1924 crosses the Molenwetering
      at one of the entrances to the Linnaeushof, the Catholic housing enclave that A.J. Kropholler
      built around his Hofkerk. Kropholler wrote in 1928 that one of the openings into the court
      was reached "over a little bridge", probably this one.

      Unusually for Kramer, the balustrades are brick rather than wrought iron, set with small
      granite blocks. On one abutment, a pillar of vertically laid brick is topped with worked
      granite. Look through into the Linnaeushof: it is a traditionalist ensemble, not Amsterdam
      School, so two ways of building meet at this little bridge.
    nl: |
      Terug naar Kramer, en terug in de tijd. Deze kleine duikerbrug uit 1924 ligt over de
      Molenwetering bij een van de toegangen tot de Linnaeushof, de katholieke enclave die A.J.
      Kropholler rond zijn Hofkerk bouwde. Kropholler schreef in 1928 dat een van de openingen 'over
      een brugje' toegang gaf tot de hof; vermoedelijk is dat deze.

      Afwijkend voor Kramer zijn de bakstenen balustrades in plaats van siersmeedwerk, met blokjes
      graniet erin. Op een van de landhoofden staat een verticaal gemetselde pilaar met bewerkt
      graniet. Kijk door naar de Linnaeushof: een traditionalistisch ensemble, geen Amsterdamse
      School. Bij dit brugje komen twee manieren van bouwen samen.
  - place: Frankendaelbrug (Brug 217)
    narration: |
      A few metres on, the Middenweg, the old main road through the polder, crosses the same water.
      The first bridge here, of 1923, was paid for by the parish that was building the Hofkerk next
      door. In 1930–1931 Public Works renewed and widened it to Kramer's design for 15,000
      guilders, and around 1951 he supervised its adaptation again.

      Tram 9 and buses rumble over it, so the best view is from the water's edge: large brick
      surfaces laid horizontally on the water side, Kramer's granite keystones and blocks, and the
      low culvert opening. Compare its broad brick faces with the draughts-stack piers on the
      Galileïplantsoen.
    nl: |
      Een paar meter verder gaat de Middenweg, de oude hoofdweg door de polder, over hetzelfde water.
      Een eerste brug hier, uit 1923, werd betaald door het kerkbestuur van de parochie van de H.H.
      Martelaren van Gorcum, dat ernaast de Hofkerk liet bouwen. In 1930-1931 vernieuwde en verbreedde
      Publieke Werken de brug voor 15.000 gulden naar ontwerp van Kramer, en rond 1951 volgde een
      nieuwe aanpassing, opnieuw onder zijn begeleiding.

      Tram 9 en bussen rijden eroverheen; je ziet de brug het best vanaf de waterkant. Let op de grote
      baksteenvlakken, aan de waterkant horizontaal gemetseld, Kramers granieten sluitstenen en
      blokjes, en de lage duikeropening. Vergelijk de brede bakstenen wanden met de damsteenpijlers
      aan het Galileïplantsoen.
    next:
      directions: Ride south-west to the Hugo de Vrieslaan, about 1 km.
      nl: Fiets zuidwestwaarts naar de Hugo de Vrieslaan, ongeveer 1 km.
  - place: Brug 441 and Brug 436 (Fahrenheitsingel)
    narration: |
      After the war Kramer kept working. These two bridges, twenty metres apart, were tendered
      together in 1949. Brug 441 carries the Hugo de Vrieslaan over a drainage channel of the
      Molenwetering. It is almost 28 metres wide over a channel barely 3 metres across, and so low
      that only a canoe can pass.

      Look at its wrought-iron railing. The top rails hang in a draped curve, like rope, and dip
      into the parapets at the ends, as on his concrete bridges in the Amsterdamse Bos. Brug 436,
      in the Fizeaustraat over the Fahrenheitsingel, lacks his usual ornament. Only its
      balustrades, running down into the ground beyond the abutment, give him away.
    nl: |
      Na de oorlog ging Kramer door. Deze twee bruggen, twintig meter uit elkaar, werden in 1949
      samen aanbesteed. Brug 441 ligt in de Hugo de Vrieslaan over een afwateringstocht van de
      Molenwetering, zo laag dat alleen een kano erdoor kan. Ze is bijna 28 meter breed, de doorvaart
      amper 3 meter.

      Kijk naar de smeedijzeren balustrade: de bovenste buizen hangen in een draperende lijn en dalen
      aan de uiteinden de borstwering in, net als bij Kramers betonnen bruggen in het Amsterdamse
      Bos. Brug 436, in de Fizeaustraat over de Fahrenheitsingel, mist de bekende versieringen. Alleen
      de balustrades, die voorbij het landhoofd de grond in lopen, verraden zijn hand.
    next:
      directions: Follow the Fizeaustraat to the Drieburg sports fields.
      nl: Volg de Fizeaustraat naar de sportvelden van Drieburg.
  - place: Kramer's post-war bridges at Sportpark Drieburg (Brug 254, 267, 273)
    narration: |
      These three plain brick culvert bridges show the very end of Kramer's bridge style. He
      designed them around 1940–1941, when the Fizeaustraat was extended past the sports fields,
      but the war delayed building until 1950–1951. Brug 254 carries the Fizeaustraat, and Brug
      273, a foot and cycle bridge, leads to the Von Liebigpad over the same ditch. Brug 267 is
      little more than two brick balustrades with granite end stones over a low arched culvert.

      The natural stone, ornamental ironwork and sculpture of the 1920s are gone, but the brick
      balustrades rounded off at the abutments of Brug 254 are still his. Nearby, the 1960s-style
      Brug 479 shows how fast taste changed after him.
    nl: |
      Deze drie sobere bakstenen duikerbruggen zijn het slot van Kramers bruggenstijl. Hij ontwierp
      ze rond 1940-1941, toen de Fizeaustraat langs de sportvelden werd verlengd, maar door de oorlog
      werden ze pas in 1950-1951 gebouwd. Brug 254 (Fizeaustraat) en brug 273, een fiets- en voetbrug
      naar het Von Liebigpad, liggen over dezelfde ringsloot. Brug 267 bestaat eigenlijk alleen uit
      twee bakstenen balustrades met granieten sluitstenen boven een lage boogduiker.

      Natuursteen, siersmeedwerk en beeldhouwwerk uit de jaren twintig ontbreken, maar de aan de
      landhoofden afgeronde balustrades van brug 254 zijn herkenbaar Kramer. Op nog geen honderd
      meter ligt brug 479, die laat zien hoe snel de smaak daarna veranderde.
    next:
      directions: Ride east into Betondorp, about 1.4 km, to its village green.
      nl: Fiets oostwaarts Betondorp in, ongeveer 1,4 km, naar de Brink.
  - place: Brink (Betondorp)
    narration: |
      Halfway round, the loop reaches Betondorp's village green. After the First World War bricks
      were expensive and bricklayers scarce, so between 1923 and 1925 the city built this garden suburb of about 900
      homes as a trial of concrete. Ten systems were chosen from some fifty entries, and locals
      soon called it Betondorp, "Concrete Village". Jan Gratama, the critic who named the Amsterdam
      School, laid it out with Gerrit Versteeg around this green, with streets named after farming
      terms.

      Dick Greiner designed the Brink as one ensemble (1924–1928), and it points both ways:
      Amsterdam School lettering and tilework on plain, flat-roofed grey blocks closer to the
      Nieuwe Bouwen (Dutch modernism). Look for LEESZAAL on the red door of the library at Brink
      43–45, the black-and-white zigzag tiles at the entrances, and the clock tower with its copper
      crown by the Veeteeltstraat. Gerard Reve grew up here and made it the "Cementwijk" of his
      novel De Avonden.
    nl: |
      Halverwege de tocht sta je op de Brink van Betondorp. Na de Eerste Wereldoorlog waren bakstenen duur en geschoolde
      bouwvakkers schaars. Daarom bouwde Amsterdam hier in 1923-1925 een tuindorp van zo'n 900
      woningen, deels als proef met beton. Uit vijftig inzendingen werden tien betonsystemen gekozen,
      en in de volksmond heette de wijk al snel Betondorp. Jan Gratama, die de naam Amsterdamse
      School bedacht, maakte met Gerrit Versteeg het plan, rond deze Brink en met straatnamen uit het
      boerenbedrijf.

      Dick Greiner ontwierp de Brink (1924-1928) als totaalontwerp, en je ziet er twee richtingen
      tegelijk: torentjes, belettering en tegelwerk van de Amsterdamse School op strakke grijze
      blokken met platte daken, die meer met het Nieuwe Bouwen gemeen hebben. Zoek 'Leeszaal' op de
      rode deur van Brink 43-45, de zwart-witte zigzagtegels bij de ingangen en de toren met vier
      wijzerplaten en koperen bekroning boven de winkels aan de Veeteeltstraat. Gerard Reve groeide
      hier op; in De Avonden heet de buurt Cementwijk.
    next:
      directions: Leave Betondorp along the Zaaiersweg towards the Middenweg.
      nl: Verlaat Betondorp over de Zaaiersweg, richting de Middenweg.
  - place: Fré Cohenbrug and Rinus Michelsbrug (Brug 341, 245)
    narration: |
      On the way out you pass through Betondorp's gateway. Where the Zaaiersweg leaves the
      Middenweg, the Molenwetering is crossed twice within five metres: Brug 341 carries the Zaaiersweg and Brug 245 the
      Middenweg, with a low brick wall between them, all from Kramer's office. The Fré Cohenbrug
      went up in the late 1920s, when Betondorp was finished. Sources date the Middenweg bridge,
      which now carries tram 9, variously to the 1920s and the 1950s.

      Look at the very low span of the Fré Cohenbrug, too low for any boat, and the granite blocks
      in the brick of the Rinus Michelsbrug. The names are local. Fré Cohen, the graphic designer of
      the socialist movement, lived on the Zaaiersweg from 1923. Rinus Michels coached Ajax, and in
      2005 nearby bridges were named after his European Cup players.
    nl: |
      Op weg naar buiten rijd je door de poort van Betondorp. Waar de Zaaiersweg vanaf de Middenweg
      de wijk in loopt, kruist de Molenwetering twee keer kort na elkaar: brug 341 in de Zaaiersweg en brug 245 in de
      Middenweg. Ook de tussenwal is van Kramers bureau. De Fré Cohenbrug verrees eind jaren
      twintig, toen Betondorp gereedkwam; de verkeersbrug in de Middenweg, waar tram 9 overheen
      rijdt, wordt afwisselend in de jaren twintig en de jaren vijftig gedateerd.

      Let op de zeer lage overspanning van de Fré Cohenbrug, waar geen boot onderdoor kan, en de
      granieten blokjes in het metselwerk van de Rinus Michelsbrug. De namen zijn van hier: Fré Cohen,
      grafisch ontwerpster van de arbeidersbeweging, woonde vanaf 1923 aan de Zaaiersweg, en brug 245
      kreeg in 2005 de naam van Ajax-trainer Rinus Michels, toen ook andere bruggen in de buurt naar
      zijn Europacupspelers werden vernoemd.
    next:
      directions: Ride north-east to the Radioweg, about 750 m.
      nl: Fiets noordoostwaarts naar de Radioweg, ongeveer 750 meter.
  - place: Heinz Stuybrug (Brug 334)
    narration: |
      Another late one, on the same Molenwetering you followed along the Galileïplantsoen. Kramer's
      design is said to date from 1946, but the bridge was built only in 1953, when the Radioweg
      was extended for a sports complex. So despite its lower number it is younger than bridges
      335–338 upstream.

      Look at the culvert walls: bare brick, with none of the granite blocks or ironwork. Set it
      beside the draughts-stack piers of 1928 and you have the arc of Kramer's late career on one
      stretch of water. Since 2005 the bridge has carried the name of Heinz Stuy, Ajax's goalkeeper
      in the sides that won the European Cup in 1971, 1972 and 1973. Ajax's De Meer stadium stood
      nearby. It is the last of Kramer's bridges on the ride; from here the loop heads home.
    nl: |
      Weer een late brug, over dezelfde Molenwetering als aan het Galileïplantsoen. Kramers ontwerp
      zou uit 1946 stammen, maar de brug kwam er pas in 1953, toen de Radioweg werd verlengd voor de
      aanleg van een sportcomplex. Ondanks het lagere nummer is ze dus jonger dan de bruggen 335-338
      stroomopwaarts.

      Kijk naar de wanden van de duiker: kale baksteen, zonder granieten blokjes of smeedwerk. Leg
      haar naast de damsteenpijlers van 1928 en je ziet Kramers late loopbaan aan één water. Sinds
      2005 draagt de brug de naam van Heinz Stuy, doelman van het Ajax dat in 1971, 1972 en 1973 de
      Europacup I won. Het is de laatste Kramerbrug van de tocht; vanaf hier gaat de lus terug naar
      het noorden.
    next:
      directions: >-
        Ride back north-west across the Watergraafsmeer, about 2 km, and cross the Hartmanbrug into
        the Indische Buurt. The school is a block beyond the bridge.
      nl: >-
        Fiets noordwestwaarts terug door de Watergraafsmeer, ongeveer 2 km, en steek de Hartmanbrug
        over naar de Indische Buurt. De school ligt een blok voorbij de brug.
  - place: Public Works school Batjanstraat
    narration: |
      Just across the Ringvaart, one more building by the city. The Buildings section of Public
      Works designed this double primary school in 1924, seven years before the Montessori school
      on the Galileïplantsoen, and two schools still share it. Most of this part of the Indische
      Buurt was rebuilt in the 1980s, so it is one of the few older buildings left.

      The long front is flat brick with rows of windows, but at each end the entrance bays bulge
      forward and push up above the cornice, rounded at the top and crowned with circles. The city
      register likens them to "swelling paper" and to Westerman's Fourth Trade School on the
      Postjesweg, built at the same time, and thinks Westerman may have designed both. If so, this
      is the architect you met at the Voltaplein. Compare these restless ends with the calm brick U
      of the Montessori school.
    nl: |
      Net over de Ringvaart staat nog één gebouw van de gemeente. De afdeling Gebouwen van Publieke
      Werken ontwierp deze dubbele lagere school in 1924, zeven jaar voor de montessorischool aan het
      Galileïplantsoen, en er zitten nog altijd twee basisscholen in. Dit deel van de Indische Buurt
      werd in de jaren tachtig grotendeels gesaneerd; de school is een van de weinige oudere
      gebouwen die bleven staan.

      De voorgevel is grotendeels vlak, met lange vensterreeksen, maar de ingangstraveeën aan de
      uiteinden steken scherp naar voren, zijn bovenin afgerond en worden boven de daklijst bekroond
      door cirkelvormige elementen, 'welhaast als bollend papier', zegt de gemeentelijke
      beschrijving. Die wijst op de verwantschap met de Vierde Ambachtsschool van Westerman aan de
      Postjesweg en houdt het voor mogelijk dat hij ook deze school ontwierp: dezelfde Westerman als
      aan het Voltaplein. Vergelijk de beweeglijke koppen met de rustige U van de montessorischool.
    next:
      directions: Ride back to the Hartmanbrug, a block away.
      nl: Fiets terug naar de Hartmanbrug, een blok verderop.
  - place: Hartmanbrug (Brug 190)
    narration: |
      Back where you started. On one loop you have seen the whole arc of Kramer's bridges: the
      granite-studded culverts of 1928 on the Galileïplantsoen, this brick bridge of 1936, and the
      bare walls of the 1950s at Drieburg and on the Radioweg. Along the way were Kruyswijk's church
      and school, two Public Works schools and Betondorp's concrete experiment.
    nl: |
      Terug bij het begin. In één rondje heb je Kramers hele ontwikkeling gezien: de duikers met
      granieten blokjes uit 1928 aan het Galileïplantsoen, deze bakstenen brug uit 1936 en de kale
      wanden uit de jaren vijftig bij Drieburg en aan de Radioweg. Onderweg de kerk en de school
      van Kruyswijk, twee scholen van Publieke Werken en het betonexperiment van Betondorp.
