title: De Dageraad and the workers' palaces of Plan Zuid
summary: |
  From Kramer's first housing block in De Pijp, through De Dageraad, across the Amstelkanaal and down the Vrijheidslaan to Staal's Wolkenkrabber: how housing associations, cooperatives and Berlage's Plan Zuid built palaces for working families.
body: |
  **Start:** the Van der Helstplein in De Pijp. Metro station De Pijp is roughly ten minutes' walk to the north-west. **End:** the Victorieplein, where tram 4 stops.

  **Distance and time:** about 3 km. Allow two hours with stops, more if you join a tour.

  **What you can go inside:** Museum De Dageraad, at Burgemeester Tellegenstraat 128, runs tours of the estate; check its opening times before you go. The Coöperatiehof is a courtyard reached through two gateways, so be quiet: people live there. Everything else is housing and schools, seen from the street. The route is flat, on pavements throughout.

  After the Housing Act of 1901, Amsterdam's housing associations could borrow cheaply to build good homes, and a socialist city council under alderman Floor Wibaut wanted them built. H.P. Berlage's Plan Zuid, approved in 1917, gave them streets and squares to fill. This walk follows the result: socialist and cooperative associations, a cooperative of building contractors, private developers and the city itself, all working in the Amsterdam School style in the early 1920s. You see De Klerk and Kramer at their most exuberant in De Dageraad, the first homes in Amsterdam designed by a woman, and the style calming down along the Vrijheidslaan until it reaches Staal's tower of 1930–1932.
mode: walk
photos: ["commons:File:Amsterdam De Dageraad 006.JPG"]
nl:
  title: De Dageraad en de arbeiderspaleizen van Plan Zuid
  summary: |
    Van Kramers eerste woongebouw in De Pijp via De Dageraad, over het Amstelkanaal en door de Vrijheidslaan naar Staals Wolkenkrabber: hoe woningbouwverenigingen, coöperaties en Berlages Plan Zuid paleizen voor arbeidersgezinnen bouwden.
  body: |
    **Start:** het Van der Helstplein in De Pijp. Metrostation De Pijp ligt op zo'n tien minuten lopen naar het noordwesten. **Eind:** het Victorieplein, waar tram 4 stopt.

    **Afstand en tijd:** ongeveer 3 km. Reken op twee uur met stops, langer als je een rondleiding meeloopt.

    **Binnen kijken:** Museum De Dageraad aan de Burgemeester Tellegenstraat 128 verzorgt rondleidingen door de buurt; kijk vooraf naar de openingstijden. Het Coöperatiehof is een hofje achter twee poorten: hier wonen mensen, dus doe rustig. De rest is woningbouw en scholen, te zien vanaf de straat. De route is vlak en loopt helemaal over de stoep.

    Dankzij de Woningwet van 1901 konden woningbouwverenigingen met voorschotten van gemeente en Rijk goede woningen bouwen, en een socialistisch stadsbestuur met wethouder Floor Wibaut wilde die er ook hebben. Berlages Plan Zuid, in 1917 vastgesteld, gaf de straten en pleinen. Deze wandeling laat zien wat dat opleverde: socialistische en coöperatieve verenigingen, een samenwerkingsverband van aannemers, particuliere bouwers en de gemeente zelf, allemaal in de stijl van de Amsterdamse School. Je ziet De Klerk en Kramer op hun uitbundigst in De Dageraad, de eerste door een vrouw ontworpen woningen van Amsterdam, en hoe de stijl langs de Vrijheidslaan rustiger wordt, tot aan Staals Wolkenkrabber van 1930-1932.
stops:
  - place: Van der Helstplein (Kramer)
    narration: |
      Begin with Piet Kramer before the socialists hired him. He drew this block in 1916 for a private developer, the N.V. Amsterdamsche Bouwmaatschappij, while he was still working on the Scheepvaarthuis. The First World War held it up, and it was only finished in 1920. It is the first housing he designed.

      From the square it reads as one symmetrical wall: 24 flats over 8 shops, five storeys high, held between two identical corner wings under tall, kinked roofs of red pantiles. Look for the wooden band with Amsterdam School detail over the shop windows, and the row of square attic windows with diagonal glazing bars. You are on the northern edge of the part of De Pijp that falls under Berlage's Plan Zuid.
    nl: |
      Begin bij Piet Kramer, nog voordat de socialisten hem vroegen. Hij tekende de gevels van dit blok in 1916 voor de Naamloze Vennootschap Amsterdamsche Bouwmaatschappij. Door de Eerste Wereldoorlog begon de bouw pas in 1919, en in 1920 was het klaar. Het is het eerste woongebouw dat Kramer ontwierp.

      Vanaf het plein zie je één symmetrische wand: 24 woningen boven 8 winkels, vijf lagen hoog, ingeklemd tussen twee gelijke hoekdelen onder hoge, geknikte schilddaken met rode holle pannen. Let op de houten strook met Amsterdamse Schooldetails boven de etalages en de vierkante zolderraampjes met schuine roeden. Je staat aan de noordrand van het deel van De Pijp dat binnen Berlages Plan Zuid valt.
  - place: Pastelstraat blocks (Gulden & Geldmaker)
    narration: |
      Walk down to the canal. These two blocks of 1921–1923 were built for the housing associations Amsterdam-Zuid and Rochdale, the cooperative named after the English town where the cooperative movement began. Rochdale had built Amsterdam's first homes under the Housing Act, in 1909.

      The architects, Zeger Gulden and Melle Geldmaker, were the city's housing specialists and active in the socialist SDAP. They drew floor plans for Berlage, Van der Mey and Staal, so their own façades are businesslike: compact masses with the accent on the corners, where the gables jut forward like a ship's bow. Each block wraps round its own inner area, with small, enclosed side streets, just as Plan Zuid intended.
    nl: |
      Loop naar het water. Deze twee blokken uit 1921-1923 werden gebouwd voor de woningbouwverenigingen Amsterdam-Zuid en Rochdale, de coöperatie die vernoemd is naar het Engelse stadje waar de coöperatieve beweging begon. Rochdale bouwde in 1909 de eerste woningwetwoningen van Amsterdam.

      De architecten, Zeeger Gulden en Melle Geldmaker, waren specialisten in de volkshuisvesting en actief in de SDAP. Ze tekenden plattegronden voor Berlage, Van der Mey en Staal, en hun eigen gevels zijn zakelijk: kloeke massa's met de nadruk op de hoeken, waar de topgevels als een voorsteven naar voren steken. Elk blok ligt rond een eigen binnenterrein met besloten zijstraatjes, helemaal in de geest van Plan Zuid.
  - place: Coöperatiehof
    narration: |
      Step through one of the two gateways from the Burgemeester Tellegenstraat into a quiet court. Everything here is by Piet Kramer, built in 1925–1928 for the Bouwmaatschappij tot Verkrijging van Eigen Woningen, Amsterdam's oldest workers' building society, founded in 1868.

      After De Dageraad next door, it is strikingly low and calm: three rows of two-storey cottages and, on the south side, a reading room and meeting hall with a tapering, lead-clad clock tower, the kind of neighbourhood facility housing reformers wanted in every new district. In the middle of the lawn stands Kramer's globe-shaped memorial to the society's long-time chairman Lucas van Buuren (1936). On the back of the reading room, on the axis of the P.L. Takstraat, is a memorial to mayor J.W.C. Tellegen, a champion of social housing.
    nl: |
      Loop door een van de twee poorten aan de Burgemeester Tellegenstraat een stil hofje in. Alles hier is van Piet Kramer, gebouwd in 1925-1928 voor de Bouwmaatschappij tot Verkrijging van Eigen Woningen, de eerste door arbeiders opgerichte woningbouwvereniging van Amsterdam (1868). De naam van het hof verwijst naar die coöperatieve opzet.

      Na het geweld van De Dageraad ernaast is het hier opvallend laag en rustig: drie blokjes woningen van twee lagen rond het plantsoen en aan de zuidkant een lees- en vergaderzaal met een taps toelopende, met lood beklede klokkentoren. Midden in het plantsoen staat het bolvormige monument voor voorzitter Lucas van Buuren (1936). Tegen de achtergevel van de leeszaal, in de zichtas van de P.L. Takstraat, staat het gedenkteken voor burgemeester Tellegen.
    next:
      directions: Leave by the other gateway to the fork of the P.L. Takstraat and the Burgemeester Tellegenstraat.
      nl: Verlaat het hof door de andere poort en loop naar de splitsing van P.L. Takstraat en Burgemeester Tellegenstraat.
  - place: De Dageraad
    narration: |
      This is the heart of the walk. In 1920 the socialist housing association De Dageraad (The Dawn) commissioned Michel de Klerk and Piet Kramer to design 294 homes and six shops here. Berlage had first reserved the site for a hospital, and the streets still follow its plan: a Y of the P.L. Takstraat and the Burgemeester Tellegenstraat, with two small squares tucked in on either side. De Klerk is credited with the façades around the squares, Kramer with much of the street walls.

      Stand at the fork and look at the two corner buildings: stacked brick cylinders stepping back like a castle. Walk a little way along the P.L. Takstraat and watch the line between red and yellow brick rise and fall as if a wave ran through it. Built into P.L. Takstraat 1 is the brick memorial to P.L. Tak, the association's founder, unveiled by alderman Wibaut on 29 March 1924. A bust of Wibaut stands on the Henriëtte Ronnerplein.

      The national register calls this the Amsterdam School "in its most lively, irrational phase", and notes that the floor plans were subordinated to the effect outside. That is the old criticism of the style: the façade came first. De Klerk saw the first homes finished shortly before he died in 1923. Museum De Dageraad, at Burgemeester Tellegenstraat 128, runs tours.
    nl: |
      Dit is het hart van de wandeling. In 1920 gaf de Algemeene Arbeiderscoöperatie De Dageraad Michel de Klerk en Piet Kramer opdracht voor 294 woningen en zes winkels. Berlage had het terrein eerst voor een ziekenhuis bestemd, en de blokken volgen nog de plattegrond daarvan: een gevorkte as van P.L. Takstraat en Burgemeester Tellegenstraat, met aan weerszijden het Henriëtte Ronnerplein en het Thérèse Schwartzeplein. De gevels rond de pleintjes worden aan De Klerk toegeschreven, een groot deel van de straatwanden aan Kramer.

      Ga op de splitsing staan en kijk naar de twee hoekgebouwen: terugwijkend opeengestapelde cilinders, als een burcht. Loop een stukje de P.L. Takstraat in en zie de grens tussen rood en geel metselwerk op en neer gaan, als een golf. In P.L. Takstraat 1 is het bakstenen gedenkteken voor P.L. Tak ingemetseld, de oprichter van De Dageraad, op 29 maart 1924 onthuld door wethouder Wibaut. Op de hoek van het Henriëtte Ronnerplein staat Wibauts portretbuste.

      Het rijksmonumentenregister spreekt van de Amsterdamse School "in haar meest levendige, irrationele fase", met een indeling die ondergeschikt is aan het uitwendige effect. Dat is meteen de oude kritiek op de stijl: eerst de gevel. De Klerk zag de eerste woningen nog opgeleverd kort voor zijn dood in 1923. Museum De Dageraad, Burgemeester Tellegenstraat 128, verzorgt rondleidingen.
    next:
      directions: Follow the P.L. Takstraat to its end at the Amstelkanaal and look at the school fronts from the quay.
      nl: Loop de P.L. Takstraat uit tot aan het Amstelkanaal en bekijk de schoolgevels vanaf de kade.
  - place: Tweede Openbare Handelsschool (Berlage Lyceum)
    narration: |
      The P.L. Takstraat ends at two school buildings by the city's Public Works department (1921–1924), now the Berlage Lyceum. The register sees them as the visual closing piece of the neighbourhood, built in the same spirit as the housing: the city joining in.

      From the Jozef Israëlskade, look at the long canal fronts in yellow-brown brick and their broad centres, where huge piers jut forward. Hildo Krop carved groups on them: agriculture, trade and industry on one building, "the birth of the deed" on the other. Round the back, on the schoolyard side, the doors have carvings of Mercury and Pan. Inside, out of sight, are a frieze of the seasons by Joop Sjollema and a wall painting by Peter Alma.
    nl: |
      De P.L. Takstraat eindigt bij twee schoolgebouwen van de Dienst der Publieke Werken (1921-1924), nu het Berlage Lyceum. Het register ziet ze als de visuele afsluiting van de P.L. Takbuurt, in stijl verwant aan de woningbouw eromheen: de gemeente deed mee.

      Kijk vanaf de Jozef Israëlskade naar de lange gevels van geelbruine baksteen en de brede middenrisalieten met diep uitgemetselde muurdammen. Hildo Krop maakte daarop beeldgroepen: landbouw, handel en nijverheid op het ene gebouw, "de geboorte van de daad" op het andere. Aan de schoolpleinkant hebben de deuren houtsnijwerk van Mercurius en Pan. Binnen, uit het zicht, zijn een fries van de seizoenen door Joop Sjollema en een wandschildering van Peter Alma bewaard.
    next:
      directions: Walk east along the quay and cross the canal by Kramer's bridge 401, the Ernst Cahn en Alfred Kohnbrug, into the Rijnstraat.
      nl: Loop over de kade naar het oosten en steek het kanaal over via Kramers brug 401, de Ernst Cahn en Alfred Kohnbrug, de Rijnstraat in.
      via: [[4.904183, 52.3491]]
  - place: Rijnstraat gateway (Rutgers)
    narration: |
      The bridge you just crossed carries the names of Ernst Cahn and Alfred Kohn, who ran the ice-cream parlour Koco in the Van Woustraat and the Rijnstraat. A resistance group operated from it at the start of the German occupation until its arrest in 1941. Cahn was executed; Kohn was killed in Auschwitz.

      On the far side, two near-symmetrical blocks by G.J. Rutgers frame the entrance to the Rijnstraat (designed 1921, built 1923–1925). Look up at the stairwells, set in round projections that end in drum-shaped towers, and at the brick balconies wrapping each corner, projecting further towards the bottom. The client was Amstels Bouwvereniging, not a housing association but a cooperative of 71 building firms. It took land here on leasehold in 1921 and by 1925 had built 1,739 small flats in the Rivierenbuurt; sixteen of its firms went bankrupt along the way.
    nl: |
      De brug die je net overstak draagt de namen van Ernst Cahn en Alfred Kohn, die in de Van Woustraat en de Rijnstraat IJssalon Koco dreven. Van daaruit werd in het begin van de bezetting een verzets- en knokgroep geleid, tot die in 1941 werd opgepakt. Cahn werd gefusilleerd op de Waalsdorpervlakte, Kohn kwam om in Auschwitz.

      Aan deze kant markeren twee bijna symmetrische blokken van G.J. Rutgers de ingang van de Rijnstraat (ontwerp 1921, gebouwd 1923-1925). Kijk omhoog naar de trappenhuizen in ronde uitbouwen, bekroond door trommelvormige torens, en naar de bakstenen balkons die om de hoeken lopen en naar beneden toe verder uitkragen. Opdrachtgever was de Amstels Bouwvereniging: geen woningwetvereniging maar een samenwerkingsverband van aannemers, dat grote delen van de Rivierenbuurt volbouwde.
  - place: Korte Meerhuizenstraat block (Kruyswijk)
    narration: |
      A smaller, quieter piece by Cornelis Kruyswijk, one of the most productive architects of the style, who often built for private developers. This block of workers' housing with corner shops (1921–1923) closes the eastern end of a block, with private gardens behind and little front gardens on the street.

      It is fully symmetrical, in yellow brick on a red plinth. Look at the two corner shops, each detailed differently and both with their leaded-glass fanlights intact, and at the more closed top floor with small windows, set back behind balconies on the short street. You will meet Kruyswijk again at the end of the walk, framing the Victorieplein.
    nl: |
      Een kleiner, rustiger werk van Cornelis Kruyswijk, een van de productiefste architecten van de stijl, die vaak voor particuliere bouwondernemers werkte. Dit blok arbeiderswoningen met hoekwinkels (1921-1923) vormt het oostelijke deel van een gesloten bouwblok, met privétuinen erachter en kleine voortuinen aan de straat.

      Het is geheel symmetrisch, in gele baksteen op een rode plint. Let op de twee hoekwinkels, elk met een eigen detaillering en nog gave glas-in-loodbovenlichten, en op de meer gesloten bovenste laag met kleine vensters, aan de Korte Meerhuizenstraat teruggelegen achter balkons. Aan het eind van de wandeling kom je Kruyswijk weer tegen, bij het Victorieplein.
    next:
      directions: Walk up the Borssenburgstraat to the Amstelkade.
      nl: Loop de Borssenburgstraat uit tot aan de Amstelkade.
  - place: Amstelkade blocks (Wijdeveld)
    narration: |
      Hendrik Wijdeveld was the editor of *Wendingen*, the movement's magazine, and this is his only housing in Plan Zuid: 57 social-housing flats designed in 1922 around three sides of a closed block.

      It is a very personal version of the style. Instead of sculpted brick, Wijdeveld decorates with tiles and with how he places them. On the Amstelkade, look for the three stairwells set back in black-tiled panels that run all the way up to the roof, flanked by rounded brick walls, and for porches two storeys high lined with white tiles. The doors have a vertical light with a wavy bar. Five storeys of yellow brick end in a flat roof: a quieter neighbour for the blocks you are about to see.
    nl: |
      Hendrik Wijdeveld was hoofdredacteur en vormgever van *Wendingen*, het tijdschrift van de beweging, en dit is zijn enige woningbouw in Plan Zuid: 57 sociale etagewoningen, in 1922 ontworpen, rond drie zijden van een gesloten bouwblok.

      Het register spreekt van een persoonlijke variant van de Amsterdamse Schoolstijl. Wijdeveld versiert niet met gebeeldhouwd metselwerk maar met tegels, en met de plaats van de betegelde vlakken. Kijk aan de Amstelkade naar de drie teruggelegen trappenhuizen in een zwart betegeld muurvlak tot aan de dakrand, tussen afgeronde bakstenen geveldelen, en naar de portieken van twee lagen hoog met witte wandtegels. De deuren hebben een golvende verticale balk.
  - place: Holendrechtstraat (Margaret Staal-Kropholler)
    narration: |
      At the corner, a rounded end ending in a brick cylinder above the roof marks the first housing in Amsterdam designed by a woman. Margaret Kropholler (1891–1966) is regarded as the first woman to practise as an architect in the Netherlands. In 1921–1922 she designed these 85 flats for Amstels Bouwvereniging, filling the western half of a long block split down the middle.

      Look round the corner into the Holendrechtstraat: a 110-metre wall set back from the street, given movement by balconies with undulating fronts. On the ground floor the windows curve inwards over curved brick sills, and above the attic windows runs a vertical "roof" of ridge tiles. The register singles out her attention to detail and to the dwelling plans.
    nl: |
      Op de hoek markeert een afgeronde kop met een gemetselde cilinder boven de daklijst de eerste door een vrouw ontworpen woningen van Amsterdam. Margaret Staal-Kropholler (1891-1966) wordt wel de eerste vrouwelijke architect van Nederland genoemd. In 1921-1922 ontwierp ze voor de Amstels Bouwvereniging dit ensemble van oorspronkelijk 85 etagewoningen, de westelijke helft van een in de lengte gedeeld bouwblok.

      Kijk de Holendrechtstraat in: een 110 meter lange, teruggerooide gevel die zijn beweging krijgt van golvende balkons. Op de begane grond zwenken de vensters naar binnen boven scheluw gemetselde afzaten, en boven de zoldervensters ligt een verticaal pannendek van nokvorsten. Het register prijst vooral haar voorkeur voor doordachte details.
  - place: Eigen Hulp block (Lammers)
    narration: |
      The other half of the same block, facing the Amstel, is by Theodorus Lammers, built in 1921–1922 for the cooperative building society Eigen Hulp (Self-Help): 61 flats, restored to their original look in 1991–1992.

      It is worth comparing the two halves. Lammers works with colour: red brick at the base, the corners and the tall bays, light brown elsewhere. The long three-storey centre on the Amsteldijk rises to four at the rounded corners. Look at the raised porches with double stairs, flanked by tiny toilet windows shaped like upside-down parabolas. A few years earlier, Lammers and his partner Theo Groenendijk had been building villas and town houses in Oud-Zuid; here he builds for a cooperative.
    nl: |
      De andere helft van hetzelfde blok, met de lange zijde aan de Amstel, is van Theodorus Lammers, in 1921-1922 gebouwd voor de Amsterdamse Coöperatieve Bouwvereniging Eigen Hulp: 61 etagewoningen, bij een renovatie in 1991-1992 in oude luister hersteld.

      Vergelijk de twee helften. Lammers werkt met kleur: rode baksteen bij plint, hoeken en hoge erkers, lichtbruin elders. Het middendeel aan de Amsteldijk telt drie lagen, de afgeronde hoeken vier. Let op de verhoogde portieken met dubbele trap, geflankeerd door omgekeerd-paraboolvormige toiletraampjes. Een paar jaar eerder bouwde Lammers met Theo Groenendijk nog herenhuizen en villa's in Oud-Zuid; hier werkt hij voor een coöperatie.
  - place: P.L. Kramerbrug
    narration: |
      Where the Amstelkanaal meets the Amstel, bridge 400 carries the Amsteldijk, the old route into the city and the main link between Plan Zuid and the old town. Piet Kramer designed it in 1917 and it was finished in 1921; it is now named after him.

      Public Works engineers did the steel and concrete, Kramer the brick, granite and iron, and Hildo Krop the sculpture, which refers to the sea that made the city rich and to its history. Step out onto one of the semicircular balconies on the Amstel side: its wavy edge turns into a carved seal. Look for shipworms and seals on the piers and, on the canal side, the medieval lord Gijsbrecht van Amstel and a cog ship. The two little hexagonal houses along the canal were built for the electricity company and the parks department.
    nl: |
      Waar het Amstelkanaal de Amstel raakt, ligt brug 400 in de Amsteldijk, de oude uitvalsroute en de verbinding tussen Plan Zuid en de oude stad. Kramers ontwerp dateert van 1917; in 1921 was de brug klaar. In de volksmond heet ze Pieter Kramerbrug.

      De afdeling Bruggen van Publieke Werken deed de constructie, Kramer de vormgeving en Hildo Krop het beeldhouwwerk, dat verwijst naar de zee waaraan de stad haar welvaart dankte, en naar haar geschiedenis. Ga op een van de halfronde uitbouwen aan de Amstelzijde staan: de golvende rand gaat over in een zeerob. Zoek de paalwormen en zeehonden op de pijlers, en Gijsbrecht van Amstel en een koggeschip. De twee zeshoekige huisjes langs het kanaal waren voor het GEB en de afdeling Beplantingen.
    next:
      directions: Follow the Amsteldijk south to the start of the Vrijheidslaan, between two blocks with tower-like corners, and turn into the avenue.
      nl: Loop over de Amsteldijk naar het zuiden tot het begin van de Vrijheidslaan, tussen twee blokken met torenachtige hoeken, en sla de laan in.
  - place: Vrijheidslaan north side (De Klerk)
    narration: |
      You entered the Vrijheidslaan (called the Amstellaan until 1946) between the two blocks of Heineke and Kuipers (1923–1929), which form a gateway into Plan Zuid from the Berlagebrug in a late style inspired by Frank Lloyd Wright.

      Beyond them, the north side is Michel de Klerk's, designed in 1921–1922, among his last works. Remember De Dageraad, being built at the same time a few streets away? Here the same architect lays long, flat planes of brick, saving the play for balconies set in a staggered rhythm and for the corners, where the volumes step into the side streets. The register sees these cubist forms as the start of the style's third, more restrained phase. The scale and politics of Plan Zuid, Dutch sources say, limited his freedom.
    nl: |
      Je kwam de Vrijheidslaan (tot 1946 Amstellaan) binnen tussen de twee blokken van Heineke en Kuipers (1923-1929), die vanaf de Berlagebrug de poort naar Plan Zuid vormen, in een late, op Frank Lloyd Wright geïnspireerde Amsterdamse School.

      Daarachter is de noordwand van Michel de Klerk, ontworpen in 1921-1922, een van zijn laatste werken. Denk even terug aan De Dageraad, die tegelijk een paar straten verderop verrees. Hier legt dezelfde architect lange, vlakke wanden neer; het spel zit in de balkons in verspringend ritme en in de hoeken naar de zijstraten. Het register ziet in die kubistische vormen al de overgang naar de derde, soberder fase. De grootschaligheid en de politieke inbreng in Plan Zuid beperkten De Klerk in zijn creativiteit.
  - place: Vrijheidslaan south side (Kramer, Marnette)
    narration: |
      Cross over and look back: the south wall answers the north one, and together they were meant to read as one composition. It was built in 1922–1923 for Amstels Bouwvereniging. Piet Kramer designed the eastern stretch and the corner; P.L. Marnette, who worked mostly for Public Works, the next stretch west.

      In Kramer's part, flat and sculpted bays alternate in a calm rhythm, white window frames play a big role, and a row of small attic windows sits between wavy brickwork under a roofline of pantiles. Further on, Marnette's part has six identical bays, each with a recessed double entrance and two tall stair windows with ladder-like frames and purple glass.
    nl: |
      Steek over en kijk terug: de zuidwand antwoordt op de noordwand, en samen vormen ze één compositie. Ze werd in 1922-1923 gebouwd voor de Amstels Bouwvereniging. Piet Kramer ontwierp het oostelijke deel en de hoek, P.L. Marnette, die vooral voor Publieke Werken werkte, het aansluitende deel naar het westen.

      Het register noemt Kramers blok een mooi voorbeeld van verstrakte Amsterdamse School, waarin vlakke en plastische geveldelen elkaar evenwichtig afwisselen. Let op de witte kozijnen en op de attiek met kleine ramen tussen "golvend" metselwerk, onder een daklijn van pannen. Bij Marnette zie je zes gelijke traveeën met elk een verdiepte dubbele entree en twee hoge trappenhuisvensters met ladderramen en paars glas.
    next:
      directions: Walk west along the Vrijheidslaan towards the tower at the end.
      nl: Loop de Vrijheidslaan af naar het westen, op de toren aan het eind af.
  - place: Victorieplein shop galleries (Kruyswijk)
    narration: |
      Where the avenue reaches the Victorieplein, Cornelis Kruyswijk designed two identical blocks facing each other, built in 1924–1929 for two private developers, N.V. Trompzicht and N.V. Rudolf. The workers' associations are behind you now; this is middle-class shopping.

      Each block has flats above a covered shopping gallery about 40 metres long. Walk under one: each of its three porches has four doors, two to shops and two to the flats upstairs, and the fanlights over the shop windows still have their Amsterdam School leaded glass. The attic floors were lowered in 1961; the southern block has recently been returned to its original height. Together the pair frame the view of the tower ahead.
    nl: |
      Waar de laan het Victorieplein bereikt, ontwierp Cornelis Kruyswijk twee identieke, tegenover elkaar geplaatste blokken, gebouwd in 1924-1929 voor twee particuliere bouwmaatschappijen, "Trompzicht" en "Rudolf". De arbeidersverenigingen liggen nu achter je; dit is winkelen voor de middenstand.

      Elk blok heeft etagewoningen boven een overdekte winkelgalerij. Loop er even onder door: elk van de drie portieken heeft vier deuren, twee voor de winkels en twee voor de bovenwoningen, en in de bovenlichten van de etalages zit nog glas-in-lood in Amsterdamse Schoolstijl. In 1961 werd de zolderverdieping verlaagd; bij een recente renovatie van het zuidelijke blok is de oorspronkelijke situatie hersteld. Samen omlijsten de blokken de toren voor je.
  - place: 12-verdiepingenhuis (De Wolkenkrabber)
    narration: |
      Berlage wanted towers to mark the key points of Plan Zuid. This is the one that rose here, though to a design by Jan Frederik Staal, an Amsterdam School architect and *Wendingen* editor. The building code allowed only four storeys of flats and had to be changed first. Finished in 1932, the 12-storey, 40-metre tower had intercoms, fast lifts, a refuse chute and central heating, and was soon nicknamed De Wolkenkrabber, the Skyscraper. Here the brick sculpture gives way to horizontal bands of windows and balconies.

      In front stands Hildo Krop's statue of Berlage (1966), one of his last works. The walk ends where Berlage's plan meets its future.

      These streets also carry a darker history. From 1933 Jewish refugees from Germany settled in the new Rivierenbuurt; the Frank family lived on the Merwedeplein behind the tower, in one of Staal's lower blocks, from 1933 to 1942. By 1940 about 17,000 Jewish people lived in the neighbourhood, and some 13,000 of them did not survive the war. A large raid swept the Rivierenbuurt on 20 June 1943.
    nl: |
      Berlage wilde de belangrijke punten van Plan Zuid met torens markeren. Dit is een van de weinige die er kwamen, maar dan naar ontwerp van Jan Frederik Staal, architect van de Amsterdamse School en redacteur van *Wendingen*. De bouwverordening stond maar vier woonlagen toe en moest eerst worden aangepast. Op 1 juli 1930 ging de eerste heipaal de grond in; in 1932 was het 40,65 meter hoge gebouw klaar, met een intercom, snelle liften, een vuilstortkoker en centrale verwarming. Volgens het gemeentelijk register kent Staals werk niet de explosieve expressiviteit van De Klerk en Kramer: hier wijkt het metselwerk voor horizontale banden van ramen en balkons.

      Op het plein staat Hildo Krops beeld van Berlage. Hier eindigt de wandeling, waar Berlages plan overgaat in het Nieuwe Bouwen.

      Deze straten hebben ook een zwarte geschiedenis. Vanaf 1933 vonden Duits-joodse vluchtelingen hier onderdak, onder wie de familie Frank, die aan het Merwedeplein achter de toren woonde, in een van Staals lagere blokken. Bij het begin van de oorlog woonden er in de Rivierenbuurt ongeveer 17.000 joden. Op 20 juni 1943 trof een grote razzia de buurt. Na de oorlog bood de weduwe van opdrachtgever Reijn terugkerende joden kosteloos woonruimte aan.
