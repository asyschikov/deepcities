- title: Bethlehemkerk
  summary: A low Amsterdam School church on the Zwanenplein (1923–1924) by Adriaan Moen, opened in the
    presence of Queen Wilhelmina; now the Studio 150 recording studio and concert venue.
  body: 'The Dutch Reformed "Association for Parish Interests North of the IJ" hired the architect Adriaan
    Moen in 1919, but construction only began in August 1923; Queen Wilhelmina attended the opening on
    13 September 1924 and presented a pulpit Bible. Moen had to keep the church low so that it would not
    dominate the surrounding workers'' housing, which explains its broad, tent-like silhouette: steep
    pantiled saddle roofs over a taller central part, flanked by lower wings, with a small brick bell-cote
    on the ridge. On the east gable a trapezium shows Alpha, Omega and the Chi-Rho.


    Inside, a parabola-like roof construction spans the hall, and two large stained-glass windows by H.J.
    Winkelman show the Annunciation to the Shepherds and the Wise Men from the East. The church closed
    for worship in 1993, later housed another congregation, and since 2017 has been Studio 150, a recording
    studio that hosts (often streamed) concerts.


    The Zwanenplein around it is worth a stroll: the wartime housing has carved animal stones and poem
    stones, part of the Vogelbuurt''s rich building sculpture.


    Look for:

    - the brick bell-cote with lead-clad horizontal accents on the ridge

    - Alpha, Omega and the Chi-Rho in the east gable

    - the heavy timber doors with wrought ironwork

    '
  category: religious
  lat: 52.387101
  lng: 4.918682
  address: Zwanenplein 34-36
