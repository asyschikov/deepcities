  nl:
    title: City of Wesopa
    summary: De bioscoop van Weesp, geopend in 1948 als laat voorbeeld van de Amsterdamse School, met
      een gevel van geel genuanceerde baksteen met pilasters, vierkante venstertjes en vlaggenmasthouders;
      sinds 1991 theater.
    body: 'Al in 1936 waren er plannen voor een bioscoop in Weesp, maar het toenmalige gemeentebestuur
      zag geen behoefte aan "een dergelijke wereldse gelegenheid". Naar ontwerp van C.J. Baart en E.W.
      Raadsheer, in opdracht van J.H. Otto, opende de bioscoop uiteindelijk op 14 oktober 1948. De gemeentelijke
      beschrijving noemt de architectuur "een laat voorbeeld van de Amsterdamse school". Na de opkomst
      van de televisie sloot de bioscoop; het gebouw diende als opslag voor Openbaar Kunstbezit en stond
      vanaf eind jaren tachtig leeg. In 1991 werd het Theater City of Wesopa, met nu zo''n 200 voorstellingen
      per jaar.


      Alleen de voorgevel is beschermd: geel genuanceerde baksteen in Vlaams verband met terugliggende
      voegen en een uitgekraagde betonnen luifel boven de begane grond. Het omlijste middendeel heeft
      vierkante vensters en pilasters die met consoles een overstek dragen, met venstertjes daartussen.
      De zijgeledingen hebben verticale indiepingen die beginnen op een console en eindigen in een kapiteelachtig
      ornament dat de vlaggenmasten draagt.


      Let op:

      - de pilasters en vierkante venstertjes van het middendeel

      - de kapiteelachtige ornamenten met vlaggenmasten

      - de betonnen luifel boven de ingang

      '
