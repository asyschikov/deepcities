- title: Shopfront Buitenveer 10, Weesp
  summary: A mahogany Amsterdam School shopfront with stained-glass fanlights, black tile plinth and a
    stepped wooden soffit, the only one of its kind in Weesp, still a barber's shop.
  body: 'Only the ground floor of this deep two-storey house is protected, but it is a rarity: the municipal
    description calls it an intact and, for Weesp, unique Amsterdam School shopfront, with its original
    leaded glass. The upper façade dates from around 1900.


    The front is made of mahogany. From left to right it holds a house door, a wide shop window and the
    shop door, and it continues across the alley to the right with another door and fanlight. Five fanlights
    have stained glass. The plinth is of black ceramic tiles, and the lead-covered canopy between the
    windows and fanlights has a stepped mahogany soffit underneath. A barber''s shop has been here ever
    since.


    Look for:

    - the five stained-glass fanlights

    - the stepped mahogany underside of the canopy

    - the black tile plinth

    '
