- title: Purmerplein, Tuindorp Nieuwendam
  summary: 'The heart of what is often called the most beautiful garden village in the Netherlands: an
    octagonal square of shops under deep awnings and timber-pillared gate buildings by B.T. Boeyinga (1923–1927).'
  body: 'Tuindorp Nieuwendam was built by the city between 1924 and 1934 to an urban plan by B.T. Boeyinga
    of the Municipal Housing Service, inspired by Ebenezer Howard''s garden-city ideas. It is regarded
    as a high point of the rural variant of the Amsterdam School: two storeys at most, tiled saddle roofs,
    timber cladding, small squares and short views.


    At its centre Boeyinga designed the octagonal Purmerplein, lined with freestanding blocks of shops
    with flats above. A continuous broad awning shelters shoppers along each block, above it runs a strip
    of windows in horizontal boarding, and a row of timber dormers breaks the tiled roof; some blocks
    end in a half-round, three-faceted roof. Where the side streets leave the Purmerweg, Boeyinga placed
    symmetrical gate buildings (poortgebouwen) with two shops and flats each, the passage carried on heavy
    timber columns, flanked by bay windows and balconies. All are national monuments, registered in 1998.


    Look for:

    - the continuous awnings over the shop fronts

    - the half-round roof ends of the blocks on the square

    - the timber columns of the gate buildings on the Purmerweg (Avenhornstraat, Beemsterstraat, Wijdenesserstraat,
    Oudorperstraat)

    '
