- title: School Amaliastraat 5
  summary: A symmetrical Christian school (1923) by Groenendijk & Lammers with a half-round entrance bay,
    granite trim and wrought-iron railings in full Amsterdam School swing.
  body: 'Built in 1923 to a design by Th. Groenendijk and Th.J. Lammers, this three-storey school in the
    Frederik Hendrikbuurt is a variant of the corridor type, with classrooms grouped around a central
    hall on every floor and a gym in the left wing. The façade is symmetrical and hierarchical: a recessed
    centre with a half-round projecting entrance block between two wings, built of yellow-grey brick with
    a plinth and stair tower in red Groningen clinker bricks and details in Bavarian granite.


    The entrance porch has curving walls and varnished glazed doors; inside the porch is a bronze relief
    of Christ among the lambs, given by former pupils, and a granite block carries the architects'' signature.
    Above the low walls either side runs a fine wrought-iron railing in Amsterdam School style with expressive
    wave motifs.


    Look for:

    - the half-round entrance bay and the curved porch walls

    - the wrought-iron railings with wave motifs on granite copings

    - the bronze relief in the porch and the architects'' signature stone

    '
