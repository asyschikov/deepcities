- title: Nassaukerk
  summary: A Greek-cross Calvinist church on the Kostverlorenvaart (1925–1926) by H.G. Krijgsman, with
    four tall gables, parabolic forms and a copper-clad crossing tower; still in use, and home to a Russian
    chamber choir.
  body: 'The Gereformeerde Kerk of Amsterdam held a design competition restricted to architects of its
    own denomination; Hugo Gerardus Krijgsman of Zeist won with the motto "Vrede" (Peace). The church
    was begun in July 1925 and opened on 18 June 1926, seating 924, considerably more than the 700 first
    planned. A detached building on the De Wittenstraat holds service rooms and six dwellings, and the
    sexton''s house on the quay has six more.


    The plan is a square with an inscribed Greek cross. Four high gables with decorative brickwork mark
    the arms, the two broken roofs are covered in blue tiles, and a 24 m tower with a slate base and copper
    top rises over the crossing; the clock was a gift from the city. Elliptical windows light the ground
    floor under the galleries. Inside, parabolic constructions and the 1931 Valckx & Van Kouteren organ
    are notable. The church still serves a Protestant congregation and is the rehearsal home of the Russian
    Chamber Choir (Het Russisch Kamerkoor).


    Look for:

    - the four stepped brick gables

    - the copper-clad crossing tower and its clock

    - the view across the Kostverlorenvaart from the opposite bank

    '
