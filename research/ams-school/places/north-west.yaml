  nl:
    title: Spaarndammerplantsoen, eerste blok van De Klerk
    summary: 'Hier begon het: het eerste woningblok van Michel de Klerk, een gesloten ''burcht'' aan de
      noordzijde van het Spaarndammerplantsoen met parabolische ingangspartijen en terracotta tegels,
      gebouwd voor aannemer Klaas Hille.'
    body: 'Het eerste grote werk van Michel de Klerk staat aan de noordzijde van het Spaarndammerplantsoen.
      Opdrachtgever was niet een woningbouwvereniging maar aannemer Klaas Hille, bij wie De Klerk eerder
      in dienst was geweest; pas voor de volgende twee blokken kwam Eigen Haard in beeld. Het register
      beschrijft een huizenblok "van gesloten, burchtachtig karakter en vrij rustige architectuur".


      De symmetrische gevel aan het plantsoen wordt geleed door vier tot bovenaan doorlopende ingangsrisalieten
      met een parabolische afsluiting. In het midden is de bovenste verdieping met hout bekleed en op
      de drie buitengevels is de bovenste zone met terracotta tegels bekleed. De kleine roedenverdeling
      van de vensters is grotendeels verdwenen. Al is het blok nog ingetogen, de gedachte van het woningblok
      als één gebeeldhouwde massa is er al: samen met het tweede blok aan de overkant en Het Schip om
      de hoek is dit de bakermat van de Amsterdamse School.


      Let op:

      - de vier doorlopende ingangsrisalieten met parabolische bekroning

      - de houten bekleding van de bovenste verdieping in het midden van de gevel

      - de terracotta tegels in de bovenste zone van de buitengevels

      '
    attributes:
      client: Aannemer Klaas Hille
      original_use: Arbeiderswoningen (verhuur)
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/5500
    - https://www.hetschip.nl/over-het-museum/
- title: Spaarndammerplantsoen, De Klerk's second block
  summary: 'De Klerk''s second block, the first he built for Eigen Haard: a brick fortress on the south
    side of the Spaarndammerplantsoen whose red and yellow brick, terracotta-clad round bays and crooked
    roofs openly ignore construction logic.'
  body: 'Facing the first block across the Spaarndammerplantsoen, this was the second of De Klerk''s three
    Spaarndammerbuurt blocks and the first for the socialist housing association Eigen Haard (Our Own
    Hearth), which had taken over the remaining plots. It was originally meant to be the second of three
    blocks around the gardens; once it had been placed on the south side, the third commission moved to
    the triangular site that became Het Schip.


    The design is visibly freer than the first block. The register notes red and yellow brick applied
    "here and there clearly non-constructively", three entrance bays on the plantsoen that run up to the
    roof, round projecting bays clad in terracotta tiles, and roof shapes that make no structural sense,
    especially at the corner with the Wormerveerstraat. The original doors with their characteristic planking
    survive.


    Sources differ on the date: the register gives 1914, literature generally 1915–1916 (design) with
    construction finishing around 1916–1918.


    Look for:

    - the three full-height entrance bays on the Spaarndammerplantsoen

    - the round bays clad in terracotta tiles at the corners

    - the restless roofline at the Wormerveerstraat corner

    - the original planked front doors

    '
