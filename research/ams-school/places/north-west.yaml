  nl:
    title: Slagerij Nieuwstraat 12a-14a, Weesp
    summary: 'Achttiende-eeuws dubbelhuis dat in 1927-1931 voor een slager een nieuwe gevel kreeg met
      invloed van de Amsterdamse School: een pui betegeld in oranje, geel en blauw met ''Vleeschhouwerij'',
      glas in lood en een art-decowinkel.'
    body: 'Achter de jongere voorgevel staat een groot achttiende-eeuws pand, dat in 1793 aan de Lutherse
      kerk werd geschonken en later onder meer kostschool, pastorie en boekhandel met drukkerij was. In
      1927-1931 werd het onder architect E.M. Raadsheer verbouwd voor slager D. van den Heuvel. Volgens
      de gemeentelijke beschrijving "vertoont de architectuur vormen die invloed van de Amsterdamse school
      verraden".


      De voorgevel is van grauwrode baksteen in kruisverband met een fries van siermetselwerk onder de
      goot. De brede pui is betegeld in oranje, geel en blauw met het opschrift ''Vleeschhouwerij''; de
      bovenlichten en de drielichtskozijnen op de verdieping hebben kleurig glas in lood. Van het interieur
      is vooral de slagerswinkel van belang, met betegelde vloeren en wanden in art-decovormen en een
      opaalglazen plafond in metalen strippen.


      Let op:

      - de betegelde pui met ''Vleeschhouwerij''

      - het kleurige glas in lood

      - het siermetselwerk onder de goot

      '
    attributes:
      client: Slager D. van den Heuvel
      original_use: Slagerij met woonhuis
    sources:
    - city:450130008 (redengevende omschrijving gemeente Weesp)
- title: Houses Waagplein 2-8, Weesp
  summary: Two mirrored pairs of houses (1936) in yellow brick under steep mansard roofs, with doors linked
    by a shared canopy and leaded fanlights, showing traits of the Amsterdam School.
  body: 'On the Waagplein stand two symmetrical double houses from 1936, each with mirrored plans. They
    have one storey under a mansard roof set at right angles to the street, covered in red pantiles that
    run straight over the gable without an overhang. The walls are yellow-toned brick on a plinth of dark
    sintered brick.


    The front doors of each pair are linked by a canopy that separates door and fanlight, with the small
    toilet windows joining the two door frames below it. Either side is a broad window reaching up to
    the canopy, with leaded fanlights and a wide central pane between narrow side casements; numbers 6
    and 8 keep horizontal glazing bars. The municipality values them for architecture showing traits of
    the Amsterdam School.


    Look for:

    - the shared canopy over each pair of front doors

    - the leaded fanlights and original doors at nos. 2 and 4

    - the roof tiles running over the gable without an overhang

    '
