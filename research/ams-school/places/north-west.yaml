- title: Spaarndammerspoorbrug
  summary: The railway bridge over the Spaarndammerstraat (1922) by Arend Jan Westerman of Public Works,
    guarded by four Hildo Krop sculptures of "Abundance" and "Traffic" that greet everyone entering the
    Spaarndammerbuurt.
  body: 'Where the Spaarndammerstraat dives under the railway to Haarlem and Zaandam, Arend Jan Westerman
    of the Public Works department designed a brick-clad railway bridge, completed in 1922. The railway
    company awarded the contract in 1920; because trains could not be interrupted, a temporary timber
    bridge was built first. The opening is 16 m wide and 4.20 m high, and the bridge stands on 760 wooden
    piles.


    The real reason to stop is the sculpture by the city sculptor Hildo Krop, in place since the start:
    four groups representing Abundance (people, fruit and the god Pan) and Traffic (workers with hoses).
    Krop and Westerman also worked together on the Vierde Ambachtsschool (now Het Sieraad). In the 1990s
    a concrete southern section was added for extra tracks, and in 2010–2011 large lettering inspired
    by Amsterdam School typography, designed by Janno Hahn, was applied to its south side.


    Look for:

    - Krop''s four sculpture groups on the abutments

    - the brick and natural-stone detailing of the original northern half

    - the Amsterdam School-style lettering on the newer southern part

    '
