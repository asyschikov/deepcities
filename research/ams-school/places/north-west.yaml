  nl:
    title: Het Schip
    summary: 'Het beroemdste blok van de Amsterdamse School: arbeiderswoningen, een postkantoor en een
      school in één expressionistisch baksteenschip van Michel de Klerk, met een torentje dat nergens
      voor dient. Nu Museum Het Schip.'
    body: 'Het derde blok dat Michel de Klerk in de Spaarndammerbuurt voor woningbouwvereniging Eigen
      Haard ontwierp, kwam op een overgebleven driehoekig terrein tegen het spoor te staan. Het rijksmonumentenregister
      noemt het "een der irrationeelste hoogtepunten van de tweede fase der Amsterdamse School". Arbeidersgezinnen
      kregen hier lichte woningen met aparte kamers en een eigen wc; in de punt van het blok kwam een
      postkantoortje met telefooncel, en een bestaande lagere school werd in het blok opgenomen. In de
      punt van het driehoekige binnenterrein staat een klein vergadergebouw dat in 1920 werd opgeleverd,
      met twee lage muurtjes aan het blok verbonden.


      Opvallend zijn de tonvormige hoekerkers, het metselwerk van helrode en oranje baksteen, de verticaal
      gehangen dakpannen en het slanke torentje op de lage toegangsvleugel, dat alleen de poort naar het
      binnenterrein markeert. In de buurt kreeg het blok door zijn vorm de bijnaam Het Schip.


      Sinds 2001 zit Museum Het Schip in het voormalige postkantoor en sinds 2016 ook in de vroegere school
      aan de Oostzaanstraat 45. Te zien zijn het gereconstrueerde postkantoor, een ingerichte museumwoning
      uit de jaren twintig en tentoonstellingen over de Amsterdamse School. Met een rondleiding kom je
      ook op het binnenterrein en langs De Klerks twee eerdere blokken aan het Spaarndammerplantsoen.


      Let op:

      - het torentje boven de lage ingangsvleugel aan de Zaanstraat en de poort naar het binnenterrein

      - de afgeronde ''boeg'' van het postkantoor aan het Spaarndammerplantsoen

      - de verticaal gelegde dakpannen, ladderramen en wisselende metselverbanden

      - het vergadergebouwtje in de punt van het binnenterrein (tijdens een rondleiding)

      '
    attributes:
      client: Woningbouwvereniging Eigen Haard
      original_use: Arbeiderswoningen, postkantoor, school en vergaderzaal
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/3961
    - https://www.hetschip.nl/over-het-museum/
    - https://nl.wikipedia.org/wiki/Spaarndammerbuurt
- title: Spaarndammerplantsoen, De Klerk's first block
  summary: 'Where it started: Michel de Klerk''s first housing block, a closed brick "castle" on the north
    side of the Spaarndammerplantsoen, with parabolic entrance bays and terracotta tiles. Built 1913–1915
    for the builder Klaas Hille.'
  body: 'In 1913 the young Michel de Klerk got his first big commission: a block of rented workers'' flats
    on the north side of the new Spaarndammerplantsoen. The client was not a housing association but the
    building contractor Klaas Hille, for whom De Klerk had already worked; Eigen Haard bought into the
    project for the next two blocks. The result is calmer than what followed, but everything that would
    define the Amsterdam School is already there: the block reads as one sculpted mass rather than a row
    of houses, and brick is used as a decorative skin.


    The national register describes a closed, castle-like block with fairly quiet architecture. The long,
    symmetrical front on the plantsoen is divided by four entrance bays that run up the full height and
    end in parabolic tops; in the centre the top floor is clad in timber, and on the three outer façades
    the upper zone is hung with terracotta tiles. The small window panes originally had fine glazing bars,
    many of which have since been removed.


    Seen together with the second block opposite and Het Schip around the corner, this is the place where
    the style was invented on the street.


    Look for:

    - the four full-height entrance bays with parabolic tops along the plantsoen

    - the timber-clad top floor in the middle of the façade

    - the terracotta tile cladding of the upper zone on the outer façades

    '
