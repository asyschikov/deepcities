  nl:
    title: Spitsbergenschool, Zaandammerplein
    summary: Gave school in de stijl van de sobere Amsterdamse School (1923) van de Dienst der Publieke
      Werken, beeldbepalend aan het omsloten Zaandammerplein, met paraboolvormige portieken onder hanekammen.
    body: 'De Dienst der Publieke Werken bouwde in 1923 deze school voor gewoon lager onderwijs voor jongens
      en meisjes, de Spitsbergenschool. Het gebouw staat iets naar voren ten opzichte van de omringende
      etagewoningen en neemt daardoor een dominante plaats in aan het Zaandammerplein; de achtergevel
      kijkt uit op een klein plein tussen de woningen. De woningbouw aan de Hembrugstraat rond het plein
      is van Gerrit Jan Rutgers (1925).


      Het drielagige gebouw heeft een schilddak met centrale steekkap. In de symmetrische voorgevel springt
      het midden naar voren, met op de verdieping het brede raam van de gymzaal. Aan weerszijden zitten
      paraboolvormig overwelfde portieken onder hanekammen, gedetailleerd in Beiers graniet, met houten
      deuren met Amsterdamse Schooldetaillering en smeedijzeren hekken. Daarboven zitten luiken met een
      overkapte hijsbalk; de hoekschoorstenen hebben een concave uitsparing.


      Let op:

      - de paraboolvormige portieken met hanekam en granieten detaillering

      - de smeedijzeren hekken en de oorspronkelijke deuren

      - de schoorstenen met concave uitsparing

      '
    attributes:
      architect: Dienst der Publieke Werken
      client: Gemeente Amsterdam
      original_use: School voor gewoon lager onderwijs
