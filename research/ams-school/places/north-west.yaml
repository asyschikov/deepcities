  nl:
    title: Brug 382 (Jan van Galenbrug)
    summary: 'Basculebrug van Piet Kramer over het Westelijk Marktkanaal (1935-1937) met beeldhouwwerk
      van Hildo Krop: pakhuizen en sjouwers, hijskranen, twee zeeleeuwen met een bal en Jona in de walvis.'
    body: 'Piet Kramer tekende hier in 1931 eerst een vaste brug en werkte die daarna om tot basculebrug
      in de Jan van Galenstraat over het Westelijk Marktkanaal. Volgens het register werd de brug in 1931-1933
      ontworpen en in 1935 gebouwd; dat jaartal staat ook in de brug gebeiteld, de opening volgde medio
      1937. De brug heeft twee ongelijke doorvaarten: een hoge westelijke die beweegbaar is, met sierlijk
      gesmede leuningen, en een lage oostelijke met gemetselde borstweringen. Brug en kademuren vormen
      samen een T, met een aanlegsteiger en zitbankjes.


      Het beeldhouwwerk is van Kramer zelf, Jaap Kaas en vooral stadsbeeldhouwer Hildo Krop: een rij van
      vijf pakhuizen met trapgevels geflankeerd door sjouwers, een loods met vijf hijskranen (verwijzend
      naar de Centrale Markthallen), twee zeeleeuwen met een bal en Jona in de walvis. Van Kaas is de
      zuil met een zeemonster bij de trap naar de steiger. In het Jan van Galenplantsoen staat De Rustende
      Tuinder van Jan Havermans (1938). Sinds 2016 heeft de brug officieel alleen nog haar nummer.


      Let op:

      - de pakhuizen met sjouwers en de hijskranen van Krop op de brughoofden

      - de zeeleeuwen en Jona in de walvis op de zuidwestelijke borstwering

      - het zeemonster van Kaas bij de trap naar de steiger

      '
    attributes:
      original_use: Verkeersbrug (basculebrug)
    sources:
