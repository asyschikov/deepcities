- title: City of Wesopa
  summary: Weesp's cinema, opened in 1948 as a late example of the Amsterdam School, with a yellow-brick
    front of pilasters, small square windows and flagpole brackets; a theatre since 1991.
  body: 'Plans for a cinema in Weesp existed by 1936, but the town council of the day saw no need for
    such a worldly entertainment. Designed by C.J. Baart and E.W. Raadsheer for J.H. Otto, the cinema
    finally opened on 14 October 1948, a late example of the Amsterdam School. After television hit cinema
    attendance it closed, served as a store for the state art collection and stood empty from the late
    1980s; in 1991 it reopened as Theater City of Wesopa, now staging some 200 performances a year.


    Only the front façade is protected. It is built of yellow-toned brick with recessed joints, with a
    cantilevered concrete canopy over the ground floor. Above it a framed central section holds square
    windows and pilasters on consoles carrying an overhang, with small windows between them. The side
    bays have vertical recesses starting on a console and ending in capital-like ornaments that carry
    the flagpoles.


    Look for:

    - the pilasters and small square windows of the central section

    - the capital-like ornaments holding the flagpoles

    - the concrete canopy over the entrance

    '
