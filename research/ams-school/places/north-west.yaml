  nl:
    title: Spaarndammercarré (Gulden & Geldmaker)
    summary: Vier hoekblokken van Gulden & Geldmaker rond de Knollendamstraat, met verspringende gevels
      en afgeschuinde hoeken, ontworpen om aan te sluiten op het expressieve werk van De Klerk aan het
      Spaarndammerplantsoen.
    body: 'De Spaarndammercarré bestaat uit vier hoekbebouwingscomplexen met etagewoningen voor arbeidersgezinnen,
      ontworpen door Gulden & Geldmaker voor woningbouwvereniging Amsterdam-Zuid. Omdat de blokken direct
      naast het blok van De Klerk aan het Spaarndammerplantsoen kwamen, werd in de Schoonheidscommissie
      en onder de architecten lang gediscussieerd over een passende aansluiting. De Klerk vond de vormgeving
      volgens de gemeentelijke beschrijving niet storend voor zijn blokken.


      Het strookvormige blokje aan de Knollendamstraat 56-78 is het rustigst, waarschijnlijk om bij De
      Klerk aan te sluiten. De andere drie hebben krachtig verspringende gevels en dakpartijen; twee blokken
      hebben afgeschuinde hoeken waardoor op de hoek Knollendamstraat/Polanenstraat een soort pleintje
      ontstaat. Decoratieve metselverbanden onder de daklijsten geven horizontale accenten. Bij renovaties
      in 1974 en vanaf 2006 zijn de plattegronden ingrijpend gewijzigd.


      De gemeentelijke beschrijving dateert de blokken in de tekst op 1916-1917; de registergegevens noemen
      1917-1921.


      Let op:

      - de afgeschuinde hoeken die een pleintje vormen op de hoek Knollendamstraat/Polanenstraat

      - de verspringende gevels en dakvlakken

      - het soberder blok 1 naast het blok van De Klerk

      '
    attributes:
      architect: Z.D.J.W. Gulden en M. Geldmaker
      client: Woningbouwvereniging Amsterdam-Zuid
      original_use: Arbeiderswoningen
    sources:
    - city:200764 (redengevende omschrijving gemeentelijk monument)
- title: Polanenstraat block and Polanentheater
  summary: A richly coloured housing block by Kuipers & Ingwersen with a former Calvinist school in its
    heart, an Egyptian-style granite doorway and green glazed brick; the school is now the Polanentheater.
  body: 'Tjeerd Kuipers and Arnold Ingwersen, architects who worked mostly for Protestant clients, designed
    this long block of four-storey workers'' flats between the Polanenstraat and Houtrijkstraat for the
    Christian housing association Patrimonium (1921–1922). Its centre is a school, the Calvinist Rehoboth
    school (1920–1922), which links the two street walls like the crossbar of an H; its playground was
    the courtyard behind a wide opening in the Polanenstraat.


    The housing is unusually lively: stair towers project slightly and end in gables cut into the mansard
    roof, little corner turrets flank the courtyard entrance, and three colours of brick are used (dark
    red plinth, light yellow upper floors, green glazed accents). The school front facing the courtyard
    has a granite entrance frame in the silhouette of an Egyptian temple, a sandstone plaque with the
    name Rehoboth, green glazed brick bands and a top floor clad in red ceramic tiles.


    The school closed around 1966 and became the Wijkcentrum Spaarndam; since 1971 it has been known as
    the Polanentheater, a small independent theatre (Polanenstraat 174).


    Look for:

    - the corner turrets either side of the courtyard opening on the Polanenstraat

    - the Egyptian-style granite doorway and the "Rehoboth" stone on the school

    - green glazed brick bands running from the school into the housing

    '
  category: housing
  lat: 52.390811
