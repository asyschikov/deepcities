  nl:
    title: Spaarndammerspoorbrug
    summary: Spoorbrug over de Spaarndammerstraat (1922) van Arend Jan Westerman van Publieke Werken,
      met vier beeldhouwwerken van Hildo Krop die Overvloed en Verkeer verbeelden.
    body: 'De spoorbrug over de Spaarndammerstraat, op de lijn tussen Amsterdam Centraal en Sloterdijk,
      werd in 1922 gebouwd naar ontwerp van Arend Jan Westerman van de Dienst der Publieke Werken. De
      Hollandsche IJzeren Spoorweg Maatschappij gunde het werk in april 1920. Omdat het treinverkeer niet
      gehinderd mocht worden, kwam er eerst een houten noodbrug. De doorgang is 16 meter breed en 4,20
      meter hoog; de brug rust op 760 houten palen.


      Sinds het begin staan er vier beeldhouwwerken van Hildo Krop: Overvloed (mensen, vruchten en Pan)
      en Verkeer (arbeiders met slangen). Krop en Westerman werkten ook samen aan de Vierde Ambachtsschool,
      het huidige Sieraad. In de jaren negentig kwam er een betonnen zuidelijk deel bij voor extra sporen;
      in 2010-2011 werd daarop belettering aangebracht van Janno Hahn, geïnspireerd op de typografie van
      de Amsterdamse School.


      Let op:

      - de vier beeldengroepen van Krop op de landhoofden

      - het baksteen- en natuursteenwerk van het oorspronkelijke deel

      - de belettering in Amsterdamse Schoolstijl aan de zuidkant

      '
    attributes:
      architect: Arend Jan Westerman (Dienst der Publieke Werken)
      original_use: Spoorbrug
    sources:
