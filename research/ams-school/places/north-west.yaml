  nl:
    title: Christelijke school Wognumerplantsoen
    summary: 'Dubbele christelijke lagere school (1925-1926) van Publieke Werken in kubistisch-expressionistische
      trant, in de punt van Tuindorp Nieuwendam: een stapeling van bakstenen blokken met uitkragende luifels.'
    body: 'In de zuidoostelijke punt van Tuindorp Nieuwendam staat een dubbele christelijke school voor
      gewoon lager onderwijs. De aanbesteding was op 6 april 1925; de bouwtekeningen komen van de gemeentelijke
      dienst Publieke Werken. Anders dan de landelijke woningen eromheen is de school opgebouwd uit kubische
      bouwvolumes van rode baksteen met in- en uitspringende muurvlakken onder platte daken: een langgerekt
      lager middendeel tussen twee hogere dwarsvleugels met de ingangen. Boven beide ingangen staan bakstenen
      schoorstenen met natuurstenen luifels, en sommige volumes hebben sterk uitkragende luifels. De lokalen
      liggen op het zuiden, gangen en trappenhuizen aan de noordkant.


      Op de verdieping van het middendeel en de westvleugel loopt een in Amsterdamse School-stijl gedetailleerde
      reeks kleine vensters; de hoeken hebben siermetselwerk. Het register noemt de school een representatief
      voorbeeld van de schoolarchitectuur van Publieke Werken in de jaren twintig. Later zaten er een
      slagersvakschool en een drumband.


      Let op:

      - de gestapelde kubische volumes en uitkragende luifels

      - de schoorstenen met natuurstenen luifels boven de ingangen

      - de lange reeks kleine vensters op de verdieping

      '
