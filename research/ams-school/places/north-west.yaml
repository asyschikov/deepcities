  nl:
    title: Badhuis Meteorenweg
    summary: Zeldzaam bewaard badhuis van Tuindorp Oostzaan (1927) van Publieke Werken, met kenmerken
      van de Amsterdamse School en landelijke elementen; met aparte afdelingen voor mannen, vrouwen en
      kinderen.
    body: 'Het vrijstaande voormalige badhuis op de hoek van Meteorenweg en Maanstraat werd in 1927 door
      de Dienst der Publieke Werken gebouwd, aan de rand van de eerste bouwfase van Tuindorp Oostzaan.
      De gemeente noemt het "een bijzonder en typologisch zeldzaam gebouw dat nog in behoorlijk gave staat
      verkeert".


      Het badhuis bestaat uit twee langwerpige, tegen elkaar geschoven bouwvolumes van één laag met kap:
      het ene evenwijdig aan de Meteorenweg met het kinderbad, het andere haaks daarop met de mannen-
      en vrouwenafdeling. In de vormentaal zijn kenmerken van de Amsterdamse School gecombineerd met landelijke
      elementen, zoals gebruikelijk in de tuindorpen van Noord. Het gebouw speelt in op de verspringende
      rooilijn van de Meteorenweg, die zich juist hier versmalt, zodat de gevel aan de Maanstraat vrij
      in het zicht ligt. Het naastgelegen plantsoen hoorde bij het ontwerp. Tegenwoordig zijn er een woning
      en bedrijfsruimte in gevestigd.


      Let op:

      - de twee in elkaar geschoven bouwvolumes met hun kappen

      - de oriëntatie op de open ruimte bij de Maanstraat

      '
    attributes:
      architect: Dienst der Publieke Werken
      client: Gemeente Amsterdam
      original_use: Openbaar badhuis
    sources:
    - city:200896 (redengevende omschrijving)
- title: Concrete test houses, Castorplein
  summary: Experimental workers' houses (1920–1921) built from prefabricated concrete blocks, using the
    English Winget system and Schütz & Bangert blocks, dressed with rural Amsterdam School doors and mansard
    roofs.
  body: 'After the First World War bricks and bricklayers were scarce, and the Municipal Housing Service
    tried out new building systems in Tuindorp Oostzaan. Around the Castorplein, J.H. Mulder Jr. designed
    two rows of eight concrete test houses using the English Winget block system, and on the Castorstraat
    two double houses probably built with Schütz & Bangert hollow slag-concrete blocks.


    The Winget rows have two full storeys under a long, low hipped roof (red tiles on the north-west row,
    dark blue on the south-east), with walls of a gravel-concrete outer leaf and nailable slag-concrete
    inner leaf; the block pattern shows through the white render. Their paired front doors with sidelights
    are in a rural Amsterdam School manner. The two double houses are lower, with an overhanging mansard
    roof, entrances on the short sides flanked by projecting piers, and twin dormers. Inside, the plans
    follow the Housing Service''s standard types with three bedrooms. The register values them for their
    pioneering role in building technology.


    Look for:

    - the block pattern visible through the render of the Winget rows

    - the paired doors with sidelights

    - the mansard roofs of the double houses on the Castorstraat

    '
