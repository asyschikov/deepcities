- title: Het Schip
  summary: 'Michel de Klerk''s "ship" of brick: workers'' flats, a post office and a school rolled into
    one fantastical block, with a pointless, wonderful tower. The high point of the Amsterdam School and
    home of its museum.'
  body: 'The third and wildest of Michel de Klerk''s three housing blocks in the Spaarndammerbuurt was
    built for the socialist housing association Eigen Haard on a leftover triangular plot hemmed in by
    the railway. De Klerk gave the poor tenants things no landlord had bothered with before: 102 flats
    with separate rooms, their own toilets, plenty of light and air, and at the sharp end of the block
    a small post office, so residents no longer had to walk into town to post a letter or make a phone
    call. An existing primary school was wrapped into the block, and in the triangular courtyard stands
    a little meeting hall finished in 1920.


    The national register calls it one of the most "irrational" highlights of the movement, and it is
    meant as praise: barrel-shaped corner bays, rippling brickwork in bright red and orange, roof tiles
    hung vertically like scales, and a slender tower on the low entrance wing that serves no function
    at all except to mark the way into the courtyard. Locals nicknamed the block for its prow-like shape.


    Since 2001 Museum Het Schip has occupied the old post office, and since 2016 also the former school
    at Oostzaanstraat 45. It shows the restored 1920s post office with its telephone booth, a furnished
    museum flat, and exhibitions on the Amsterdam School; guided tours (Tuesday–Sunday) also take you
    into the courtyard and past De Klerk''s two earlier blocks across the Spaarndammerplantsoen.


    Look for:

    - the tower above the low entrance wing on the Zaanstraat side, and the gate into the courtyard

    - the rounded post-office prow on the Spaarndammerplantsoen

    - vertically laid roof tiles, "ladder" windows and the varied brick bonds

    - the small meeting hall in the point of the courtyard (visible on a tour)

    '
