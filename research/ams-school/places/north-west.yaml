- title: Former police post, Buiksloterweg
  summary: A tiny timber police post (1915–1916) by Public Works on the bank of the North Holland Canal,
    made of two interlocking squares, with cells for arrested people and a lead-clad chimney that ventilated
    them.
  body: 'In 1915–1916 the Public Works department built this small police station on the west bank of
    the outer harbour of the North Holland Canal, opposite the city centre. It held a constables'' room,
    a room for the post commander, a bicycle store and, in the middle, two cells. It is one of the earliest
    public buildings in Noord to be described as Amsterdam School.


    The plan is two squares pushed into each other, on a brick plinth with horizontal timber cladding
    and a single storey plus attic under black-tiled roofs. The two chimneys on the ridges are joined
    by a decorative lead-clad section containing the air ducts that brought fresh air to the cells. The
    entrance sits on the chamfered south corner between narrow deep-set sidelights. All around are double
    casement windows with nine panes and shutters; the boards are painted green at top and bottom and
    off-white in between, their ends cut to points. The rear entrance and extension are later but in a
    related style.


    Look for:

    - the lead-clad link between the two chimneys

    - the pointed ends of the green-and-white cladding boards

    - the entrance on the chamfered corner

    '
