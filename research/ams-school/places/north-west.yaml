- title: Brug 382 (Jan van Galenbrug)
  summary: 'Piet Kramer''s bascule bridge by the Food Center (1935–1937), loaded with Hildo Krop sculpture:
    warehouses and dockers, cranes, two sea lions with a ball and Jonah in the whale.'
  body: 'Piet Kramer, the Public Works architect who designed hundreds of Amsterdam bridges, first drew
    a fixed bridge here in 1931 and then reworked it into a bascule bridge across the Westelijk Marktkanaal
    on the Jan van Galenstraat. 1935 is carved into the stonework; the bridge opened in mid-1937. It has
    two unequal openings: a high western one that lifts, with elegant wrought-iron railings, and a low
    eastern one with brick parapets. Brick, granite and sculpture continue along the quays, and a landing
    stage and benches are built in.


    The sculpture is the treat. The city sculptor Hildo Krop carved a row of five stepped-gable warehouses
    flanked by dockworkers, a shed with five cranes (a nod to the Central Markets next door), two sea
    lions with a ball and, on the keystone, Jonah in the whale; Kramer added ship''s cargo and Jaap Kaas
    a pillar with a sea monster. In the little park behind the quay stands Jan Havermans'' bronze "Resting
    Gardener" (1938). Long called Jan van Galenbrug, the bridge officially reverted to its number in 2016.


    Look for:

    - Krop''s warehouses-and-dockers and cranes on the bridgehead crowns

    - the sea lions with a ball and Jonah in the whale on the southwest parapet

    - Kaas''s sea monster at the stairs to the landing stage

    '
  category: bridges
