- title: Badhuis Meteorenweg
  summary: A rare surviving garden-village bathhouse (1927) by Public Works, combining Amsterdam School
    details with a rural roofline; it once had separate baths for men, women and children.
  body: 'Few of the homes in Tuindorp Oostzaan had a bath, so in 1927 the Public Works department built
    a public bathhouse on the corner of the Meteorenweg and Maanstraat, then the edge of the first building
    phase. The municipal register calls it typologically rare and still fairly intact.


    It consists of two long single-storey volumes with pitched roofs pushed against each other: one parallel
    to the Meteorenweg for the children''s baths, the other at right angles for the men''s and women''s
    sections. Amsterdam School characteristics are mixed with rural elements, as was usual in the garden
    villages of Noord, and the building is angled to catch the view down the Meteorenweg, which narrows
    in steps just here. The former garden beside it was part of the design. The bathhouse is now a home
    and business space, a reminder of the vanished ritual of the weekly public bath.


    Look for:

    - the two interlocking volumes and their roofs

    - how the façade faces the open space at the Maanstraat junction

    '
