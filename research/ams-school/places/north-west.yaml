  nl:
    title: Zonnehuis
    summary: Het verenigingsgebouw van Tuindorp Oostzaan (1932) van Jo Mulder in verstrakte Amsterdamse
      Schoolstijl, dwars op de as van de Zonneweg, met beelden van een vader, moeder en twee kinderen
      op de achtergevel.
    body: 'Rond 1927 begon een comité van 24 verenigingen met de gemeente te overleggen over een verenigingsgebouw
      voor Tuindorp Oostzaan. De gemeente vond dat een bloeiend verenigingsleven bijdroeg aan de opvoeding
      van de werkende klasse; er konden ook huwelijken worden gesloten. Na jaren gesteggel over het aantal
      heipalen en de bouwsom van 250.000 gulden werd het gebouw onderdeel van de werkverschaffing. In
      augustus 1931 ging de eerste paal de grond in en op 29 oktober 1932 werd ''t Zonnehuis geopend.


      Jo Mulder, die ook de omgeving van het Zonneplein ontwierp, zette het gebouw dwars op de as van
      Zonneweg en Zonneplein. Het register spreekt van een T-vormig gebouw in "Verstrakte Amsterdamse
      School-trant": een hoog middendeel met puntgevels tussen twee lage zijvleugels. Aan de pleinzijde
      staan gemetselde pilasters rond de ingang met daarboven in ijzeren letters ''t ZONNEHUIS. Op de
      achtergevel aan de Grote Beerstraat dragen de pilasters beelden van W. IJzerdraat en M. Vreugde
      die het gezinsleven verheerlijken. De grote zaal in art-decostijl bood met galerij plaats aan 600
      bezoekers.


      Het interieur werd na de overstroming van 1960 gewijzigd. In 1993 werd sloop voorkomen; in 2002
      kwam het gebouw in bezit van Stadsherstel Amsterdam, dat het restaureerde. Nu wordt het verhuurd
      voor voorstellingen, concerten en bijeenkomsten.


      Let op:

      - de ijzeren letters ''t ZONNEHUIS tussen de pilasters

      - de gezinsbeelden op de achtergevel aan de Grote Beerstraat

      - hoe het gebouw de zichtas van de Zonneweg afsluit

      '
    attributes:
      architect: J.H. (Jo) Mulder
      original_use: Verenigingsgebouw
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/508539
    - https://nl.wikipedia.org/wiki/Zonnehuis
- title: Tuindorp Oostzaan civic buildings
  summary: 'The small public buildings of a 1920s garden village: a thatched reading room, a doctor''s
    house, teachers'' houses, a concrete fire-engine shed, a nursery school and the shops of the Mercuriusplein,
    all in "rural" Amsterdam School.'
  body: 'Tuindorp Oostzaan was built from 1919 by the city''s Municipal Housing Service for workers of
    the new shipyards along the IJ, to a plan by B.T. Boeyinga and J.H. Mulder. As a semi-independent
    enclave it got its own facilities, and a cluster of them survives along the northern edge, the Kometensingel,
    where the garden village meets the old Oostzanerdijk. They mix the Amsterdam School with a rural,
    almost cottage-like idiom.


    The former public reading room (c. 1924, Kometensingel 211, probably Public Works) is a timber building
    on a black-stained plinth under a big overhanging thatched roof, with three-sided bay windows. Next
    to it stand the detached doctor''s house (1924–1925, Kometensingel 187) with its surgery entrance,
    and two pairs of semi-detached houses for middle-class residents, often called the teachers'' houses,
    by Boeyinga (1924, Kometensingel 179-185), with typical horizontally linked doors and ladder windows.
    The tiny fire-engine shed (1922, Kometensingel 175) is one of the Housing Service''s early concrete
    experiments, with a big mansard roof, buttressed corners and grooved reliefs around the doors; by
    1925 it was already let to the cleansing department. Behind them, the nursery school De Wilde Wingerd
    (1926, Kometensingel 189) was one of the largest in Amsterdam, for 240 children.


    A short walk away, Boeyinga''s Mercuriusplein (1924) is a symmetrical little square of shops with
    flats above, laid out like a hofje (almshouse court) as a meeting place, and on the Orionplantsoen
    a wooden canteen and store of the parks department (1925) shows the stricter, cubic side of the style.


    Look for:

    - the thatched roof and bay windows of the reading room

    - the grooved door surrounds and buttress-like corners of the fire-engine shed

    - ladder windows and linked entrances on the teachers'' houses

    - the symmetrical shop rows of the Mercuriusplein

    '
  category: ensembles
  lat: 52.415165
  lng: 4.884755
  address: Kometensingel 175-211, Mercuriusplein 1-12, Orionplantsoen 1
  links:
  - label: Rijksmonumentenregister (508540)
