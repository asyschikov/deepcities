    - https://monumentenregister.cultureelerfgoed.nl/monumenten/508379
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/508380
- title: Gratama's blocks, Kievitstraat and Spechtstraat
  summary: 'Low-rise Eigen Haard housing in the Vogelbuurt by Jan Gratama, the critic who gave the Amsterdam
    School its name: stepped brickwork, mansard roofs and stone tablets with animals.'
  body: 'Jan Gratama is best remembered as the architect and critic who coined the label "Amsterdamsche
    School" in 1916. Here in the Vogelbuurt of Amsterdam-Noord he built two-storey blocks with ground-floor
    and upper flats for the housing association Eigen Haard, completed in 1920.


    Gratama treated façade and roof as equals. The beige brick walls are kept taut, enlivened by sparing
    geometric lines of stepped, corbelled brickwork that frame doorways, mark the transition to the roof
    and strengthen the rhythm of the bays. Some façades are flat, others have projecting bays; entrances
    are recessed or topped by a projecting lintel. The orange-tiled mansard roofs with dormers and the
    strongly overhanging eaves tie the blocks together. At several block ends there are recessed niches
    and natural-stone tablets with animal reliefs, and the end of the block on the Koekoekstraat at the
    corner of the Kievitstraat has decorative woodcarving in the gable. The blocks step back in the middle
    to make room for front gardens, and the backs open onto unusually generous gardens.


    Look for:

    - stepped brick framing around the entrances

    - stone tablets with animals and the carved gable at Koekoekstraat/Kievitstraat

    - the deep overhanging eaves of the mansard roofs

    '
