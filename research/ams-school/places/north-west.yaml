  nl:
    title: Villa Buitenveer 21, Weesp
    summary: Kleine vrijstaande villa uit 1922 van geel genuanceerde baksteen, met een loodgedekte driehoekige
      erker tussen hellende steunberen, een afgeplatte mansardekap en glas in lood; zeldzaam voor Weesp.
    body: 'De gemeente noemt deze villa uit 1922 een "goed, en voor Weesp zeldzaam voorbeeld van een woonhuis
      in de stijl van de Amsterdamse school". De rechthoekige plattegrond heeft risalietvormige uitbouwen
      aan voor- en achtergevel, waardoor het huis min of meer S-vormig is. De afgeplatte mansardekap met
      rode tuiles du nord volgt de sprongen in de gevels. Het metselwerk van geel genuanceerde baksteen
      is in halfsteensverband met Dudokvoeg, afgesloten door een ruim overstekende goot.


      De voorgevel heeft een loodgedekte driehoekige erker tussen hellende steunberen en een inspringend
      portiek onder een betonlatei met daarboven siermetselwerk in de vorm van cassetten. In het portiek
      een fraaie deur met lantaarn en een granitovloer. De verdiepingsvensters hebben liggende roeden
      en deels oorspronkelijke houten bloembakken; de dakkapellen hebben diagonale roeden, de trappenhuisvensters
      glas in lood. Rond het huis staat een hek uit de bouwtijd.


      Let op:

      - de driehoekige erker tussen de steunberen

      - het portiek met lantaarn en de cassetten erboven

      - de diagonale roeden in de dakkapellen

      '
    attributes:
      original_use: Vrijstaand woonhuis
    sources:
    - city:450032002 (redengevende omschrijving gemeente Weesp)
- title: Butcher's shop Nieuwstraat 12a-14a, Weesp
  summary: 'An 18th-century house given a new brick front with Amsterdam School touches in 1927–1931 for
    a butcher: a shopfront tiled in orange, yellow and blue reading "Vleeschhouwerij", stained glass and
    an Art Deco tiled shop.'
  body: 'Behind this façade stands a large 18th-century double house that served as a Lutheran parsonage,
    a boarding school and a printer''s shop. In 1927–1931 the architect E.M. Raadsheer remodelled it for
    the butcher D. van den Heuvel, and the new front shows clear Amsterdam School influence.


    The front is built of greyish-red brick with a frieze of decorative brickwork under the eaves. The
    wide shopfront is tiled in orange, yellow and blue with the word "Vleeschhouwerij" (butcher''s), and
    the fanlights and the upstairs sash windows have coloured leaded glass. Inside, the butcher''s shop
    survives with tiled floors and walls in Art Deco forms and an opal-glass ceiling in metal strips.


    Look for:

    - the tiled shopfront with "Vleeschhouwerij"

    - the coloured leaded glass in the fanlights and upper windows

    - the decorative brick frieze under the eaves

    '
