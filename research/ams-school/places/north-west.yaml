    title: Winkelpui Buitenveer 10, Weesp
    summary: Mahoniehouten winkelpui in Amsterdamse Schoolstijl met glas-in-lood bovenlichten, zwarte
      tegelplint en getrapt houten plafond onder de luifel; uniek voor Weesp en nog altijd een kapperszaak.
    body: 'Van dit diepe huis van twee bouwlagen is alleen de onderpui beschermd; de bovengevel is van
      omstreeks 1900. De gemeentelijke beschrijving noemt de pui een "gaaf en voor Weesp uniek voorbeeld
      van een pui in de stijl van de Amsterdamse school", met origineel glas in lood.


      De pui is van mahoniehout en bevat van links naar rechts een woonhuisdeur, een breed venster en
      een winkeldeur; hij loopt door voor de steeg rechts van het huis, met nog een deur met bovenlicht.
      Vijf bovenlichten hebben glas in lood. De sokkel is van zwarte keramische tegels; de met lood beklede
      luifel tussen benedenzone en bovenlichten heeft aan de onderzijde een getrapt plafond van mahoniehouten
      delen. Er zit nog altijd een kapper.


      Let op:

      - de vijf bovenlichten met glas in lood

      - het getrapte mahoniehouten plafond onder de luifel

      - de zwarte tegelsokkel

      '
    attributes:
      original_use: Winkel (kapperszaak) met woonhuis
    sources:
    - city:450032003 (redengevende omschrijving gemeente Weesp)
- title: Villa Buitenveer 21, Weesp
  summary: A small detached villa (1922) in yellow brick with a lead-covered triangular bay between sloping
    buttresses, a flattened mansard roof and leaded glass; a rare Amsterdam School house in Weesp.
  body: 'This little villa of 1922 is described by the municipality as a good and, for Weesp, rare example
    of a house in the Amsterdam School style. Its rectangular plan has projecting bays front and back,
    giving a roughly S-shaped outline, under a flattened mansard roof of red tiles that follows the steps
    in the walls. The yellow brick is laid with a "Dudok joint" and topped by deep eaves.


    The front has a lead-covered triangular bay flanked by sloping buttresses and a recessed porch under
    a concrete lintel, with decorative brick panels above. In the porch are a fine door with a lantern
    and a terrazzo floor. The upper windows have horizontal glazing bars and some original wooden flower
    boxes; the dormers have diagonal bars, the staircase windows leaded glass, and the chimney decorative
    brickwork. A fence from the time of building surrounds the house.


    Look for:

    - the triangular bay between sloping buttresses

    - the porch with lantern and the brick panels above

    - diagonal glazing bars in the dormers

    '
  category: houses
  lat: 52.308301
  lng: 5.036307
  address: Buitenveer 21, Weesp
