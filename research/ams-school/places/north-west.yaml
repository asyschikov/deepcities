  nl:
    title: Clematisstraat 25 (Apostolisch Genootschap)
    summary: Breed kerkgebouw in Amsterdamse Schoolstijl (1933-1934) van Cornelis Kruyswijk, met een hoog
      spits dak, een torentje en glas-in-lood van J.H.E. Schilling, uittorenend boven de laagbouw bij
      het Florapark.
    body: 'De Hersteld Apostolische Zendinggemeente had sinds 1921 een gemeente in Amsterdam-Noord en
      wilde een eigen kerk. Architect Cornelis Kruyswijk, die eerder al een kerk in de Watergraafsmeer
      voor haar bouwde, ontwierp het gebouw in Amsterdamse Schoolstijl. De bouw begon in 1933 en op 22
      december 1934 werd de kerk geopend, met ongeveer 700 plaatsen en ruimtes voor verenigings- en jeugdwerk.
      Kruyswijk overleed kort daarna, op 10 januari 1935. Sinds 1951 is het gebouw van het Apostolisch
      Genootschap, dat zich van de HAZEA had afgesplitst en zelf liever van een ''plaats van samenkomst''
      spreekt.


      Het gebouw valt op door zijn breedte en vooral door het spitse dak met in het midden een torentje.
      In de hoge raampartijen zit glas-in-lood van J.H.E. Schilling; een bakstenen muur omsluit het terrein.
      Via de Andoornstraat kijk je uit op het Florapark.


      Let op:

      - de hoge raampartijen met glas-in-lood

      - het torentje op het dak

      - de bakstenen omheiningsmuur

      '
