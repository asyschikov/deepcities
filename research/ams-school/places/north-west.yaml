  nl:
    title: Brug 604
    summary: Een van de laatste bruggen van Piet Kramer (1953-1955), onderdeel van een monumentale toegangspoort
      tot de tuinsteden van Nieuw-West, met beelden van Jan Meefout en pergola's; vroeger 'Bananenbrug'
      genoemd.
    body: 'Brug 604 in de Burgemeester Röellstraat over de Burgemeester Cramergracht is een van de laatste
      ontwerpen van Piet Kramer voor de Dienst der Publieke Werken. Volgens de gemeente vormt de brug
      met de omringende bebouwing "een monumentale entree tot Nieuw West" en is zij representatief voor
      de "opmerkelijke samenwerking" tussen de modernist C. van Eesteren en de Amsterdamse School-architect
      Kramer. Zoals al zijn bruggen is ook deze zorgvuldig gedetailleerd, met bakstenen landhoofden, natuursteen
      en zijn befaamde smeedijzeren leuningen.


      De beelden zijn, anders dan bij veel andere Kramerbruggen, niet van Hildo Krop maar van Jan Meefout:
      Het gezin en Man en vrouw. Kramer ontwierp de pergola''s; Rob Schreefel voegde in 1987 ruimtelijke
      versieringen toe. De bijnaam Bananenbrug, naar de pergolaversieringen, mag sinds 2016 officieel
      niet meer. De gemeente noemt 1953-1954 als bouwjaren, andere bronnen 1953-1955.


      Let op:

      - de beelden van Meefout

      - Kramers pergola''s en smeedijzeren leuningen

      - het zicht op brug 605, de tweede poort

      '
