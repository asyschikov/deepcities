  nl:
    title: Polanenstraat en Polanentheater
    summary: Rijk vormgegeven woningblok van Kuipers & Ingwersen voor Patrimonium, met in het hart de
      voormalige gereformeerde Rehobothschool met Egyptiserend granieten portaal; de school is nu het
      Polanentheater.
    body: 'Het architectenduo Tjeerd Kuipers en Arnold Ingwersen, vooral actief voor de gereformeerde
      zuil, ontwierp in 1921 dit middendeel van het lange bouwblok tussen Polanenstraat en Houtrijkstraat
      voor woningbouwvereniging Patrimonium. De plattegrond is een langgerekte H; de verbinding vormt
      de school voor lager onderwijs op gereformeerde grondslag (1920-1922), de Rehobothschool. Het binnenterrein
      achter de brede onderbreking in de Polanenstraat was de speelplaats.


      De gemeentelijke beschrijving noemt het blok "rijk vormgegeven": iets vooruitstekende trappenhuizen
      met topgevels in het mansardedak, hoektorentjes aan weerszijden van de toegang tot het binnenterrein
      en metselwerk in drie kleuren, donkerrood voor de plint, lichtgeel voor de verdiepingen en groen
      geglazuurd als accent. De schoolgevel aan het binnenterrein heeft een ingang met forse granieten
      sierlijsten in het silhouet van een Egyptiserend tempelfront, een zandstenen gevelsteen met de naam
      Rehoboth, groengeglazuurde sierstroken en een met roodkeramische tegels beklede bovenverdieping.


      De school sloot rond 1966 en werd Wijkcentrum Spaarndam; sinds 1971 heet het gebouw Polanentheater.
      Het werd op 18 november 2008 gemeentelijk monument.


      Let op:

      - de hoektorentjes bij de doorgang naar het binnenterrein

      - het Egyptiserende granieten portaal en de gevelsteen ''Rehoboth''

      - de groengeglazuurde stroken die van de school doorlopen in de woningblokken

      '
    attributes:
      architect: Tj. Kuipers en A. Ingwersen
      client: Woningbouwvereniging Patrimonium
      original_use: Arbeiderswoningen en gereformeerde lagere school
    sources:
