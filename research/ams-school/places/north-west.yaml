    body: 'Brug 605 is een viaduct in de Burgemeester Röellstraat over de Burgemeester van de Pollstraat,
      met daarover ook tramlijn 13. Piet Kramer ontwierp het in 1949 voor de Dienst der Publieke Werken
      als een van zes bruggen voor de westelijke stadsuitbreiding; de bouw liep van het najaar van 1953
      tot de zomer van 1954. Baksteen, beton en graniet wisselen elkaar af, met de voor Kramer typerende
      smeedijzeren balustrades. Kramer wilde meer beeldhouwwerk, maar daar was geen geld voor; in 1987
      ontwierp Rob Schreefel de kegel- en prismavormige versieringen.


      Let op:

      - de smeedijzeren leuningen

      - de afwisseling van baksteen, beton en graniet

      - de kegels en prisma''s van Schreefel

