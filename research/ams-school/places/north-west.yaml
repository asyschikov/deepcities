- title: Brug 605
  summary: A Piet Kramer viaduct (designed 1949, built 1953–1954) carrying the Burgemeester Röellstraat
    and tram 13 over the Burgemeester van de Pollstraat, with his trademark wrought-iron railings and
    1987 additions by Rob Schreefel.
  body: 'Just west of brug 604, this road viaduct is one of six bridges Piet Kramer designed for the western
    garden cities. The design dates from 1949; it was built between autumn 1953 and summer 1954 and carries
    the Burgemeester Röellstraat and tram line 13 over the Burgemeester van de Pollstraat. Brick, concrete
    and granite alternate, and the wrought-iron railings are pure Kramer. He planned more sculpture, but
    there was no money; in 1987 Rob Schreefel added cone- and prism-shaped decorations.


    Look for:

    - Kramer''s wrought-iron railings

    - the alternation of brick, concrete and granite

    - Schreefel''s cones and prisms

    '
