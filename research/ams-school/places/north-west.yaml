  nl:
    title: Woningen Waagplein 2-8, Weesp
    summary: Twee gespiegelde dubbele woningen uit 1936 van geel genuanceerde baksteen onder mansardekappen,
      met door een luifel gekoppelde voordeuren en glas in lood, met trekken van de Amsterdamse School.
    body: 'Aan het Waagplein staan twee symmetrisch gebouwde dubbele woningen uit 1936 met gespiegelde
      plattegronden. Ze hebben één bouwlaag onder een mansardekap haaks op de voorgevel, gedekt met rode
      verbeterd holle pannen die zonder overstek met gevelpannen over de gevel doorlopen. De gevels zijn
      van geel genuanceerde baksteen op een plint van donker gesinterde steen.


      De voordeuren zijn gekoppeld door een luifel die deur en bovenlicht scheidt; daaronder verbinden
      de toiletraampjes de deurkozijnen. Aan weerszijden zit een breed venster tot aan de luifel met bovenlichten
      in glas in lood, een breed middenraam en smalle draairamen; de nrs. 6 en 8 hebben nog een horizontale
      roedeverdeling. De gemeente noemt de woningen van belang vanwege de architectuur, die "trekken van
      de Amsterdamse school vertoont".


      Let op:

      - de gemeenschappelijke luifel boven de voordeuren

      - het glas in lood en de originele voordeuren van nrs. 2 en 4

      - de pannen die zonder overstek over de gevel lopen

      '
    attributes:
      original_use: Woonhuizen
    sources:
    - city:450192001 (redengevende omschrijving gemeente Weesp)
- title: Park bridge opposite Groeneweg 22, Weesp
  summary: A small brick park bridge with two pylons and wrought-iron gates, converging parapets and Muschelkalk
    ornaments; a well-preserved example of the Amsterdam School, rare in Weesp.
  body: 'This small bridge was built as the entrance to the park behind it, which was largely lost in
    1989. A barrel vault carries it over the watercourse, showing as a round arch in the side walls. In
    the middle stand two pylons with wrought-iron gates between them; the connecting bar between the pylons
    has gone, but scrolled ironwork still flanks them on the outside.


    The masonry is dark red brick with recessed joints: half-brick bond in the pylons, cross bond in the
    parapets, which converge and rise towards the middle. Blocks and ornaments of Muschelkalk limestone
    sit in the brick patterns of the parapets and on top of the pylons. The municipality calls it a well-preserved
    example of the Amsterdam School, which is rare in Weesp.


    Look for:

    - the two pylons with Muschelkalk ornaments

    - the wrought-iron gates and flanking scrollwork

    - the rising, converging parapets

    '
