- title: Former Astoria cinema, Mosplein
  summary: Noord's neighbourhood cinema (1929) by Willem Noorlander, in sober Amsterdam School brick as
    part of a block of shops and flats; it showed films until 1966 and then became a supermarket.
  body: 'The Astoria opened on 17 May 1929 on the corner of the Mosveld and Mosplein with the German silent
    film "Das tanzende Wien". It was designed by Willem Noorlander, who built many Amsterdam cinemas (including
    the Ceintuur Theater) and also housing in this neighbourhood, in a sober Amsterdam School brick style,
    as part of a complex with shops and flats. Founded by J.J. Otter, it had one screen with 550 seats
    (about 650 after 1938) and an orchestra pit, dressing rooms and a stage for live acts in the intervals.
    It was modernised in 1946, closed on 5 December 1966 as television emptied cinemas, and was sold to
    the Albert Heijn supermarket chain.


    Look for:

    - the brick corner of the complex on the Mosplein

    - the integration of the former auditorium into the block of shops and flats

    '
