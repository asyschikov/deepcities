    body: 'Bij de oplevering in 1926 droeg dit complex van de Dienst der Publieke Werken nog de huisnummers
      12 en 14. Het bevatte twee openbare scholen: de Resedaschool (nrs. 32-34) en de Wingerdschool (nrs.
      28-30). Architect was Nicolaas Lansdorp, onder leiding van W.A. de Graaf, in de stijl van de Amsterdamse
      School. Het gebouw buigt mee met de kromme straat.


      De gevels zijn versierd met kleine sprookjesfiguren van Hildo Krop. Naast de scholen stond de katholieke
      Sint-Rosaschool, die in de Tweede Wereldoorlog door een bombardement werd beschadigd en rond 1991
      werd gesloopt. Stadsherstel kocht het complex in 2002, renoveerde het en verhuurt het nu als bedrijfsruimte.
      Het is een gemeentelijk monument.


      Let op:

      - de sprookjesfiguurtjes van Krop in de gevels

      - de manier waarop het gebouw de bocht van de Wingerdweg volgt

      '
