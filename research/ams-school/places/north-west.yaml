- title: Christian school, Wognumerplantsoen
  summary: 'A cubist-expressionist double school (1925–1926) by Public Works at the tip of Tuindorp Nieuwendam:
    stacked brick blocks, jutting canopies and chimneys over the entrances, nothing like the cottages
    around it.'
  body: 'At the south-eastern tip of the garden village the Public Works department built a double Christian
    primary school, tendered in April 1925. Where the surrounding houses are rural and tiled, the school
    is a composition of flat-roofed cubic brick volumes stepping in and out: a long lower centre between
    two taller cross wings that hold the entrances, each topped by a brick chimney with a stone canopy,
    and some volumes with strongly cantilevered canopies. Corridors and stairs face north, classrooms
    south. The upper floor of the centre and west wing has a continuous row of small windows detailed
    in Amsterdam School fashion, and the corners carry decorative brickwork.


    The register calls it a representative example of 1920s school architecture by Public Works. It later
    housed a butchers'' trade school and a drum band''s rehearsal room.


    Look for:

    - the stacked cubic volumes and cantilevered canopies

    - the chimneys with stone canopies over the entrances

    - the long band of small windows on the upper floor

    '
