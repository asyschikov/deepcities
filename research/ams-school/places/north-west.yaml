- title: Brug 604
  summary: One of Piet Kramer's last bridges (1953–1955), part of a monumental gateway into the post-war
    garden cities of Nieuw-West, with sculptures by Jan Meefout and pergolas once nicknamed "the banana
    bridge".
  body: 'The Amsterdam School outlived its era on Amsterdam''s bridges. Piet Kramer designed this fixed
    bridge over the Burgemeester Cramergracht on the Burgemeester Röellstraat as one of his last works
    before retiring from Public Works, in collaboration with the modernist planner Cornelis van Eesteren,
    whose General Extension Plan it serves. Together with the surrounding buildings and neighbouring bridge
    605 it forms a deliberately monumental entrance to the new garden city of Slotermeer.


    Typical Kramer features return: brick bridgeheads, natural stone and his famous wrought-iron railings.
    Unusually for a Kramer bridge, the sculptures are not by Hildo Krop but by Jan Meefout ("The Family"
    and "Man and Woman"); Kramer designed the pergolas, and Rob Schreefel added spatial decorations in
    1987. Its informal name, Bananenbrug, after the pergola decorations, was dropped in 2016.


    Look for:

    - Meefout''s sculptures "Het gezin" and "Man en vrouw"

    - Kramer''s pergolas and wrought-iron railings

    - the view west to brug 605, its twin gateway viaduct

    '
