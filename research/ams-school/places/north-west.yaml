- title: Zonnehuis
  summary: 'The community hall of Tuindorp Oostzaan (1932) by Jo Mulder: a T-shaped brick "house of the
    sun" across the axis of the Zonneweg, with statues of a father, mother and two children glorifying
    family life.'
  body: 'The garden village of Tuindorp Oostzaan had about 7,000 residents but nowhere for its clubs to
    meet. From 1927 a committee of local associations lobbied the city, which believed a lively club life
    would help educate the working class; weddings could be held here too. Disputes over piling and the
    250,000-guilder cost dragged on until the building was made part of a job-creation scheme. The first
    pile went in in August 1931 and the hall opened on 29 October 1932.


    Jo Mulder, who designed much of the housing around the Zonneplein, placed the hall right across the
    axis of the Zonneweg so that it closes the view. It is a symmetrical T: a tall central volume with
    gabled ends and two low side wings, in the restrained late phase of the style. Tall brick pilasters
    frame the entrance, and iron letters spell ''t ZONNEHUIS. On the back, facing the Grote Beerstraat,
    the pilasters carry statues of a father, mother and two children by W. IJzerdraat and M. Vreugde.
    The main hall, Art Deco inside, held 600 including the gallery.


    Saved from demolition in 1993 and damaged by the 1960 flood, it was bought by Stadsherstel Amsterdam
    in 2002, restored, and now hosts concerts, theatre and events.


    Look for:

    - the iron lettering ''t ZONNEHUIS between the entrance pilasters

    - the family statues on the rear façade (Grote Beerstraat)

    - how the building blocks the axis of the Zonneweg

    '
