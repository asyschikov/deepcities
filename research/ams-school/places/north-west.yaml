    summary: Badhuisje in de vorm van een stolpboerderij (1919) van B.T. Boeyinga voor het noodwoningdorp
      Disteldorp, met acht douchecellen; met invloeden van de Amsterdamse School en ontsnapt aan alle
      sloopplannen.
    body: 'Het hoekpand aan de Kromme Distelstraat en Distelkade werd in 1918-1919 door de Gemeentelijke
      Woningdienst gebouwd voor de bewoners van Disteldorp, een noodwoningdorp voor de snel groeiende
      Amsterdamse bevolking. De nieuwe woningen hadden geen badkamer; het badhuis had acht douchecellen.
      Architect Berend Tobia Boeyinga gaf het gebouw, omdat de buurt toen aan boerenland grensde, de vorm
      van een stolpboerderij met invloeden van de Amsterdamse School. Het is een ontwerpbroertje van het
      badhuis aan de Zamenhofstraat 28a.


      De woningbouw zou na ongeveer 35 jaar verdwijnen, maar de oorlog gooide dat plan om. Het badhuis
      sloot in 1977 en stond daarna lang leeg; het ontsnapte aan sloop toen vrijwel de hele omgeving gemeentelijk
      monument werd.


      Let op:

      - het stolpdak

      - de hoekligging aan de Distelkade

      '
