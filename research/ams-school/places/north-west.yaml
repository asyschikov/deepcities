  nl:
    title: Betonnen proefwoningen Castorplein
    summary: Experimentele arbeiderswoningen (1920-1921) van J.H. Mulder jr. in Tuindorp Oostzaan, gebouwd
      met betonblokken volgens het Engelse systeem Winget en het systeem Schütz & Bangert, met deuren
      in landelijke Amsterdamse Schooltrant.
    body: 'Na de Eerste Wereldoorlog waren baksteen en metselaars schaars. Rond het Castorplein in Tuindorp
      Oostzaan bouwde J.H. Mulder jr. daarom proefwoningen in beton. Aan weerszijden van het plein staan
      twee rijen van acht woningen volgens het uit Engeland afkomstige blokkenbouwsysteem Winget: muren
      met een spouw van 6 cm, een buitenwand van grindbeton en een binnenwand van spijkerbare slakkenbeton.
      De structuur van de blokken is door de witte pleisterlaag heen zichtbaar. De noordwestelijke rij
      heeft rode, de zuidoostelijke donkerblauwe pannen. De paarsgewijs geplaatste toegangsdeuren met
      zijlichten zijn in landelijke Amsterdamse School-stijl.


      Aan de Castorstraat staan twee dubbele proefwoningen van één bouwlaag met een overkragende mansardekap,
      vermoedelijk gebouwd met holle slakkenbetonblokken van Schütz & Bangert. De ingangen zitten aan
      de korte zijden tussen uitstekende muurdammen. De plattegronden volgen de typen van de Woningdienst,
      met drie slaapkamers. Het register waardeert de woningen om hun "pionierskarakter" in de geschiedenis
      van de bouwtechniek.


      Let op:

      - de blokstructuur onder het pleisterwerk van de rijtjes

      - de gekoppelde voordeuren met zijlichten

      - de mansardekappen van de dubbele woningen aan de Castorstraat

      '
    attributes:
      client: Gemeentelijke Woningdienst Amsterdam
      original_use: Experimentele arbeiderswoningen
    sources:
