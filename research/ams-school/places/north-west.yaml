  nl:
    title: Spaarndammerplantsoen, tweede blok van De Klerk
    summary: 'Het tweede blok van Michel de Klerk en zijn eerste voor Eigen Haard: een burchtachtig huizenblok
      aan de zuidzijde van het Spaarndammerplantsoen, met rood-geel metselwerk, ronde uitbouwen met terracotta
      en grillige daken.'
    body: 'Tegenover het eerste blok, aan de zuidzijde van het Spaarndammerplantsoen, bouwde De Klerk
      zijn tweede blok, het eerste voor woningbouwvereniging Eigen Haard. Oorspronkelijk zouden drie blokken
      het plantsoen omsluiten; toen dit blok aan de zuidkant was geplaatst, week het derde blok uit naar
      de driehoek tegen het spoor: Het Schip.


      Het register spreekt van een huizenblok "van gesloten, burchtachtige karakter met tamelijk gewogen
      details". De buitenwanden zijn van rode en gele baksteen, "hier en daar duidelijk onconstructief
      toegepast". De drie tot boven doorlopende ingangspartijen aan het plantsoen en de ronde uitbouwen
      op de hoeken zijn met terracotta tegels bekleed, en de dakvormen zijn vooral op de hoek van de Wormerveerstraat
      bewust onconstructief. De originele deuren met hun karakteristieke beplanking zijn bewaard.


      De datering verschilt per bron: het register noemt 1914, de literatuur meestal een ontwerp uit 1915–1916
      met oplevering rond 1916–1918.


      Let op:

      - de drie doorlopende ingangspartijen aan het Spaarndammerplantsoen

      - de ronde hoekuitbouwen met terracotta tegels

      - de grillige daklijn op de hoek met de Wormerveerstraat

      - de originele, beplankte voordeuren

      '
    attributes:
      client: Woningbouwvereniging Eigen Haard
      original_use: Arbeiderswoningen
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/5499
- title: Spaarndammercarré (Gulden & Geldmaker)
  summary: 'Four corner blocks by Gulden & Geldmaker that frame De Klerk''s work: stepped façades, cut-off
    corners and rooflines that try to keep up with the master across the street.'
  body: 'Between 1916 and 1921 the architects Zeger Gulden and Melle Geldmaker built four corner blocks
    of workers'' flats around the Knollendamstraat for the housing association Amsterdam-Zuid. Their task
    was delicate: the blocks had to sit right next to De Klerk''s first block on the Spaarndammerplantsoen,
    and the city''s aesthetics committee and the architects argued at length about how to fit in. According
    to the municipal register, De Klerk himself did not find the result disturbing.


    The small strip block at Knollendamstraat 56-78 is the quietest, probably to defer to De Klerk. The
    other three are much more plastic: façades and roofs step forward and back, and two blocks have cut-off
    corners that turn the junction of the Knollendamstraat and Polanenstraat into a small square. Bands
    of decorative brickwork under the eaves add horizontal lines; window strips and brick piers give vertical
    rhythm. The interiors were rebuilt in renovations in 1974 and from 2006.


    Look for:

    - the cut-off corners forming a mini-square at Knollendamstraat/Polanenstraat

    - stepped façades and roof planes on blocks 2–4

    - the plainer block 1 next to De Klerk''s building on the plantsoen

    '
