  nl:
    title: School Amaliastraat 5
    summary: Symmetrische school uit 1923 van Groenendijk en Lammers met een halfrond uitgebouwd ingangsblok,
      Beiers granieten details en siersmeedijzeren hekwerk in Amsterdamse Schoolstijl.
    body: 'De school aan de Amaliastraat werd in 1923 gebouwd naar ontwerp van Th. Groenendijk en Th.J.
      Lammers. Het is een variant op het corridortype: op elke verdieping liggen de lokalen aan een centrale
      hal, en in de linkervleugel zit op de begane grond een gymzaal.


      De voorgevel is symmetrisch en hiërarchisch geleed, met een teruggezet middendeel met een halfrond
      uitgebouwd blok en twee dwarsvleugels. De gevels zijn van geelgrijze waalsteen, het trappenhuis
      en de plint van rode Groningse klinkers, de detaillering in Beiers graniet. In het portiek met naar
      binnen gebogen wanden hangt een bronzen reliëf van oud-leerlingen met Christus tussen de lammeren;
      een granieten blok draagt de signatuur van de architecten. Op de borstwering staat een siersmeedijzeren
      hekwerk in Amsterdamse Schoolstijl met "expressief golvende motieven".


      Let op:

      - het halfronde ingangsblok met gebogen portiekwanden

      - het smeedijzeren hekwerk met golfmotieven op granieten dekplaten

      - het bronzen reliëf en de signatuursteen in het portiek

      '
    attributes:
      architect: Th. Groenendijk en Th.J. Lammers
      original_use: Christelijke lagere school
