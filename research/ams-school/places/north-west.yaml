  nl:
    title: Bethlehemkerk
    summary: Lage kerk in Amsterdamse Schoolstijl aan het Zwanenplein (1923-1924) van Adriaan Moen, geopend
      in aanwezigheid van koningin Wilhelmina; nu de opnamestudio en concertlocatie Studio 150.
    body: 'De in 1916 opgerichte Vereeniging voor Hervormde Wijkbelangen benoorden het IJ trok in 1919
      architect Adriaan Moen aan. In augustus 1923 werd de eerste paal geslagen en op 13 september 1924
      werd de kerk geopend in aanwezigheid van koningin Wilhelmina, die een kanselbijbel schonk. Tot april
      1924 heette ze Zwanenkerk. Moen moest bij de bouwhoogte rekening houden met de omringende woningbouw;
      vandaar het brede silhouet met hoge, met pannen gedekte zadeldaken boven een hoger middendeel tussen
      lagere vleugels, en een gemetselde klokkenstoel op de nok. In de oostgevel staat een trapezium met
      Alfa, Omega en een labarum.


      Binnen overspant een "paraboolachtige binnenbouw" de zaal, en twee grote glas-in-loodramen van H.J.
      Winkelman tonen De verkondiging aan de herders en De wijzen uit het oosten. Bij de opening bood
      de kerk plaats aan 542 kerkgangers. In 1993 sloot de kerk als hervormde kerk; sinds 2017 is het
      gebouw Studio 150, een geluidsstudio met regelmatig (gestreamde) concerten.


      Rond het Zwanenplein zitten in de woningbouw uit de Eerste Wereldoorlog gevelstenen met dieren en
      gedichten.


      Let op:

      - de gemetselde klokkenstoel met loodbeklede accenten

      - Alfa, Omega en het labarum in de oostgevel

      - de zware houten deuren met smeedwerk

      '
