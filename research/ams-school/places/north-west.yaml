- title: Gemaal Mercatorstraat
  summary: A small brick sewage pumping station and electricity house (1927) by Public Works at the tip
    of the Erasmuspark, with solid doors, natural stone and three Amsterdam crosses in Amsterdam School
    style.
  body: 'Even a sewage pump got the full treatment from the Public Works department. Built in 1927 on
    the corner of the Jan van Galenstraat and Mercatorstraat, at the south-western point of the Erasmuspark
    but separated from it by a ring canal, this small building combines an electrically driven wastewater
    pumping station with a transformer house. It is solidly built of brick and natural stone; the two
    heavy front doors refer to the municipal energy company, and the city''s three St Andrew''s crosses
    appear in Amsterdam School form. The rear wall is plain brick with six poster panels.


    It still pumps thousands of litres of wastewater a day towards the Westpoort treatment plant. In 2017
    it was restored in consultation with local residents, and the roof over the pump cellar became a small
    garden.


    Look for:

    - the three Amsterdam crosses

    - the heavy front doors and natural-stone trim

    - the little roof garden over the pump cellar

    '
