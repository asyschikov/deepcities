  nl:
    title: Blokken van Gratama, Kievitstraat en Spechtstraat
    summary: 'Laagbouw van woningbouwvereniging Eigen Haard in de Vogelbuurt door Jan Gratama, die de
      naam Amsterdamse School bedacht: getrapt metselwerk, mansardedaken en natuurstenen tableaus met
      dieren.'
    body: 'Jan Gratama (1877-1947) ijkte in 1916 de benaming ''Amsterdamsche School''. In de Vogelbuurt
      in Noord ontwierp hij voor woningbouwvereniging Eigen Haard blokken van twee bouwlagen onder een
      kap met beneden- en bovenwoningen, opgeleverd in 1920.


      Volgens de gemeentelijke beschrijving heeft Gratama de blokken "krachtig vormgegeven door middel
      van een heldere opzet waarin gevel en dakpartij een gelijkwaardige rol spelen". De beige baksteen
      is strak gehouden, met spaarzame geometrische lijnen van getrapt, uitkragend metselwerk rond de
      entrees, bij de overgang naar het dak en bij de erkers. Op enkele koppen zitten verdiepte nissen
      en natuurstenen tableaus met dieren. De oranje pannen mansardedaken met dakkapellen en de sterk
      overkragende daklijst maken de blokken tot een eenheid. Op de kop van een blok in de Koekoekstraat,
      bij de Kievitstraat, zit sierlijk houtsnijwerk in de gevel. De blokken springen in het midden terug
      voor voortuinen; achter liggen opvallend ruime tuinen.


      Let op:

      - het getrapte metselwerk rond de entrees

      - de dierentableaus en het houtsnijwerk op de hoek Koekoekstraat/Kievitstraat

      - de overkragende daklijsten van de mansardedaken

      '
