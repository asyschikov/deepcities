- title: Spitsbergenschool, Zaandammerplein
  summary: A sober Amsterdam School primary school (1923) by Public Works that anchors the enclosed Zaandammerplein,
    with parabolic porches under brick "cockscombs" and Bavarian granite details.
  body: 'The Public Works department (Publieke Werken) built this public primary school for boys and girls
    in 1923 in the restrained, "sober" version of the style. It stands slightly forward of the surrounding
    flats and dominates the enclosed Zaandammerplein; its back looks onto a small square between housing
    blocks. Around the square, the housing along the Hembrugstraat (1925) is by Gerrit Jan Rutgers.


    The three-storey building has a hipped roof with a central gable. The symmetrical front has a projecting
    centre with a broad window for the gym on the upper floor; either side of it is a parabolic porch
    under a stepped brick crest, detailed in Bavarian granite, with timber doors in Amsterdam School style
    and wrought-iron gates. Above the porches are hatches with hoisting beams, and the corner chimneys
    have a concave notch.


    Look for:

    - the two parabolic porches with their brick crests and granite trim

    - the wrought-iron gates and original doors

    - the chimneys with a concave notch at the corners

    - Rutgers'' housing blocks framing the square

    '
  category: schools
