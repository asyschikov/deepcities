- title: Clematisstraat 25 (Apostolisch Genootschap)
  summary: A tall, broad church (1933–1934) by Cornelis Kruyswijk with a steep pointed roof, a small ridge
    tower and stained glass by J.H.E. Schilling, towering over the low houses by the Florapark.
  body: 'The Hersteld Apostolische Zendinggemeente (HAZEA), which had had a congregation in Amsterdam-Noord
    since 1921, commissioned this church from Cornelis Kruyswijk, who had already built a church for it
    in Watergraafsmeer. Construction began in 1933 and the building, seating about 700 and including rooms
    for clubs and youth work, opened on 22 December 1934. Kruyswijk died a few weeks later, on 10 January
    1935. Since 1951 it has belonged to the Apostolisch Genootschap, which had split from HAZEA.


    In a neighbourhood of two-storey houses, the church stands out for its width and above all its steep
    pointed roof, with a small tower in the middle. Tall window bays hold stained glass by J.H.E. Schilling,
    and a brick wall encloses the site. The open Andoornstraat gives a view from here onto the Florapark.


    Look for:

    - the tall stained-glass window bays

    - the small tower on the ridge

    - the brick enclosure wall

    '
