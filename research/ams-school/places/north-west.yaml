- title: Keukenwoningen, Tuindorp Nieuwendam
  summary: Rows of "kitchen houses" by J.H. Mulder (1923–1927), named for the then-novel kitchen at the
    front, with timber-clad gables and wavy cornices behind the gates of the Purmerplein.
  body: 'Behind Boeyinga''s gate buildings on the Purmerweg run short streets of single-family houses
    by J.H. Mulder, known as keukenwoningen (kitchen houses) because the kitchen was placed at the front,
    an innovation at the time. There are about 25 listed rows of two to eight houses along the Avenhornstraat,
    Beemsterstraat, Wijdenesserstraat, Oudorperstraat, Wognumerstraat and Edammerstraat, all in the stricter
    late Amsterdam School.


    Each row is a single storey plus attic under a tiled saddle roof that sweeps low at the front, so
    windows and doors sit right under the eaves. Broad dormers with rows of casements light the attic.
    Low brick walls flank the doors; between them, set-back sections with linked windows mark the kitchens.
    On the side gables a timber cornice with a wavy line divides the brick from upper sections of dark
    weatherboarding. Low brick links connect the rows to the gate buildings. The neighbouring block around
    the Middeliestraat and Edammerstraat (1926–1927, municipal monument) is by Jan Boterenbrood.


    Look for:

    - the timber-clad side gables with wavy cornices

    - the deep-swept roofs with long dormers

    - the low brick walls flanking each pair of front doors

    '
