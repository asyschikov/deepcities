    summary: Buurtbioscoop van Noord (1929) van Willem Noorlander in sobere Amsterdamse Schoolstijl, onderdeel
      van een complex met winkels en woningen; tot 1966 bioscoop, daarna supermarkt.
    body: 'Bioscooptheater Astoria op de hoek van het Mosveld en het Mosplein opende op 17 mei 1929 met
      de Duitse stomme film Das tanzende Wien. Het gebouw is van Willem Noorlander, die veel bioscopen
      ontwierp, waaronder het Ceintuur Theater, en ook woningen in deze buurt. Het is in "sobere Amsterdamse
      School-stijl" in baksteen opgetrokken en maakt deel uit van een complex met winkels en woningen.
      Oprichter en directeur was J.J. Otter. De zaal had 550 plaatsen, na 1938 ongeveer 650, en een orkestbak,
      kleedkamers en een toneel voor optredens in de pauze. In 1946 werd de bioscoop verbouwd; op 5 december
      1966 sloot hij, vooral door de televisie, en het pand werd verkocht aan Albert Heijn.


