  nl:
    title: Tuindorp Oostzaan, gemeenschapsgebouwen
    summary: 'De kleine voorzieningen van een tuindorp uit de jaren twintig: een leeszaal met rieten dak,
      een dokterswoning, onderwijzerswoningen, een betonnen brandspuithuisje, een kleuterschool en het
      winkelpleintje Mercuriusplein.'
    body: 'Tuindorp Oostzaan werd vanaf 1919 door de Gemeentelijke Woningdienst gebouwd voor arbeiders
      van de scheepswerven aan het IJ, naar een plan van B.T. Boeyinga en J.H. Mulder. Als halfzelfstandige
      enclave kreeg het tuindorp eigen voorzieningen: een bibliotheek, een badhuis, een verenigingsgebouw,
      een wijkpost voor de plantsoenendienst en een brandspuitgebouw. Aan de Kometensingel, waar het tuindorp
      grenst aan de oude Oostzanerdijk, staat een groep van deze gebouwen in een mengeling van landelijke
      bouwtrant en Amsterdamse School.


      De voormalige leeszaal (omstreeks 1924, Kometensingel 211, vermoedelijk van Publieke Werken) is
      van hout op een zwart gebeitste plint, onder een fors overkragend rieten schilddak met driezijdige
      erkers. De vrijstaande dokterswoning (1924-1925, nr. 187) heeft een apart toegankelijke praktijkruimte.
      De vier middenstandswoningen van Boeyinga (1924, nr. 179-185), vaak ''onderwijzerswoningen'' genoemd,
      hebben horizontaal gekoppelde deur- en vensterpartijen met ladderramen. Het brandspuithuisje (1922,
      nr. 175) is een van de vroege betonexperimenten van de Woningdienst, met een grote mansardekap,
      steunbeerachtige hoeken en groeven rond deuren en ramen; al in 1925 werd het aan de Reinigingsdienst
      verhuurd. De kleuterschool De Wilde Wingerd (1926, nr. 189) behoorde met 240 kinderen tot de grootste
      van Amsterdam.


      Om de hoek ontwierp Boeyinga het Mercuriusplein (1924): een symmetrisch pleintje met winkels en
      bovenwoningen, opgezet als een hofje en ontmoetingsplek. Aan het Orionplantsoen staat het houten
      schaft- en bergplaatsgebouw van de plantsoenendienst (1925) in verstrakte Amsterdamse Schoolstijl.


      Let op:

      - het rieten dak en de erkers van de leeszaal

      - de groeven en verzwaarde hoeken van het brandspuithuisje

      - de ladderramen en gekoppelde entrees van de onderwijzerswoningen

      - de symmetrische winkelrijen aan het Mercuriusplein

      '
    attributes:
      architect: B.T. Boeyinga, Gemeentelijke Woningdienst, Dienst der Publieke Werken
