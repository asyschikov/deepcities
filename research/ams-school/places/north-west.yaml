    summary: Rioolgemaal met elektriciteitshuisje (1927) van Publieke Werken op de zuidwestpunt van het
      Erasmuspark, van baksteen en natuursteen, met drie Andreaskruisen in Amsterdamse Schoolstijl.
    body: 'Op de hoek van de Jan van Galenstraat en de Mercatorstraat, op de zuidwestpunt van het Erasmuspark
      maar daarvan gescheiden door een ringvaart, bouwde de Dienst der Publieke Werken in 1927 een rioolgemaal
      met aangebouwd elektriciteitshuis. Het gebouwtje is van baksteen en natuursteen en staat er stevig
      bij. De twee massieve deuren aan de voorkant verwijzen naar het Gemeentelijk Energie Bedrijf (nu
      Liander); de drie Andreaskruisen van Amsterdam zijn in Amsterdamse Schoolstijl uitgevoerd. De achtergevel
      is geheel van baksteen, met zes vakken voor affiches.


      Volgens Waternet pompt het gemaal dagelijks duizenden liters afvalwater naar de zuivering in Westpoort.
      Bij de restauratie in 2017, in overleg met buurtbewoners, werd het plateau boven de pompkelder een
      tuintje.


      Let op:

      - de drie Andreaskruisen

      - de massieve deuren en natuurstenen accenten

      - het tuintje boven de pompkelder

      '
