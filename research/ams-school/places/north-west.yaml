  nl:
    title: Stadspoort van Wijdeveld (noordblok)
    summary: 'Het noordelijke deel van de ''stadspoort'' van H.Th. Wijdeveld (1925-1926) op de hoek Hoofdweg/Jan
      van Galenstraat: een toren van zes lagen met glazen ateliergevel, halfronde hoekerker en hijsbalken
      onder het dak.'
    body: 'Hendrik Wijdeveld, de man achter het tijdschrift Wendingen, ontwierp in Plan West een lange
      reeks woningen aan de Hoofdweg. Het kruispunt met de Jan van Galenstraat markeerde hij met twee
      hoge hoekblokken, een ''stadspoort''. Dit is het noordelijke deel, op de noordwestelijke hoek, gebouwd
      in 1925-1926 met arbeiderswoningen, winkels en oorspronkelijk atelierwoningen op de bovenste lagen.
      Het zuidelijke deel staat aan de overkant van de Jan van Galenstraat aan de Hoofdweg en hoort bij
      de Hoofdwegblokken van Wijdeveld.


      Het register beschrijft een iets teruggezette rechthoekige toren van zes bouwlagen met aan de achterzijde
      een hogere voortzetting. Aan de voorkant zitten grote drieruitsvensters; de bovenste lagen, waar
      de ateliers zaten, hebben een meerruits gelede glasgevel. Verder zijn er verticale accenten in decoratief
      metselwerk in het fries, een doorlopende uitkragende reeks vensters met telkens drie hoge ramen
      en een hoge blinde zoldermuur met vier hijsbalken. Naar de Jan van Galenstraat steken begane grond
      en eerste verdieping uit en eindigen in een halfronde erker, met winkelpuien en een reeks matglazen
      vensters onder een fries. Het blok werd in 2010 rijksmonument als "essentieel onderdeel van het
      complex Hoofdweg in Plan-West".


      Let op:

      - de glazen ateliergevel boven in de toren

      - de vier hijsbalken in de blinde zoldermuur

      - de halfronde hoekerker en het zuidelijke tegenblok aan de overkant

      '
    attributes:
      original_use: Arbeiderswoningen, winkels en atelierwoningen
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/531143
- title: Vierwindstrekenbrug
  summary: 'Piet Kramer''s bridge over the Admiralengracht (1932), guarded by Hildo Krop''s four winds:
    an Inuit hunter, an African warrior, a Chinese stevedore and a telephoning American stockbroker in
    a bowler hat.'
  body: 'When the Admiralengracht was extended northwards and the Jan van Galenstraat became a main road,
    the Public Works architect Piet Kramer designed this fixed bridge, built in 1932. Thirty metres wide,
    it mixes brick and granite, has wrought-iron railings with flower boxes in summer, and seating niches
    built into its south side.


    Its fame comes from Hildo Krop''s four bridgehead sculptures representing the four winds, very much
    of their time: to the north an Inuit figure with a weapon between an igloo and two walruses; to the
    south an African hunter with spear and shield between a hut and two lions; to the east a Chinese stevedore
    with a pagoda on a Chinese wall and two steamships; and to the west an American-style stockbroker
    on the telephone, with bowler hat and briefcase, an office, share prices and two cars. Jan Trapman
    added a tiger and a polar bear by the stairs to the Erasmuspark, and Jaap Kaas and Hubert van Lith
    figures at the foot of the stairs on the other side. The bridge was known only as no. 381 until 1996,
    when it was named after Krop''s sculptures.


    Look for:

    - Krop''s four "winds" on the four bridgeheads

    - Trapman''s tiger and polar bear at the steps to the Erasmuspark

    - the seating niches on the south side

    '
