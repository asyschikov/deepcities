- title: Wijdeveld's stadspoort (north block)
  summary: 'The northern half of H.Th. Wijdeveld''s "city gate" (1925–1926) on the corner of the Hoofdweg
    and Jan van Galenstraat: a six-storey tower with glazed studio floors, a rounded corner bay and hoisting
    beams under the roof.'
  body: 'Hendrik Wijdeveld, editor of the Amsterdam School magazine Wendingen, designed a long run of
    housing along the Hoofdweg in Plan West, and at its crossing with the Jan van Galenstraat he marked
    the junction with a pair of towering corner blocks: a stadspoort, or city gate. This is the north
    block, on the north-west corner, built in 1925–1926 with workers'' flats, shops and, originally, artists''
    studio flats on the top floors. The southern half stands across the Jan van Galenstraat on the Hoofdweg
    and belongs to Wijdeveld''s Hoofdweg blocks.


    The register describes a slightly set-back rectangular tower of six storeys, with a taller continuation
    at the back. Large three-pane windows run up the front; the former studio floors at the top have a
    multi-paned glass wall. A frieze of vertical decorative brickwork, a cantilevered band of windows
    in groups of three, and a high blind attic wall with four hoisting beams complete the composition.
    Towards the Jan van Galenstraat the ground and first floors jut out and end in a half-round bay, with
    shop fronts and a band of frosted-glass windows under a frieze. The block was listed in 2010 as an
    essential part of the Hoofdweg complex.


    Look for:

    - the glazed studio floors at the top of the tower

    - the four hoisting beams in the blind attic wall

    - the half-round corner bay on the Jan van Galenstraat, and the matching south block across the street

    '
