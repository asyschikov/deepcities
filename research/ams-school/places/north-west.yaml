  nl:
    title: Purmerplein, Tuindorp Nieuwendam
    summary: 'Het hart van Tuindorp Nieuwendam: een achthoekig plein met winkelwoningen onder brede luifels
      en poortgebouwen met zware houten kolommen, van B.T. Boeyinga (1923-1927) in verstrakte Amsterdamse
      School.'
    body: 'Tuindorp Nieuwendam werd tussen 1924 en 1934 door de gemeente gebouwd naar een stedenbouwkundig
      plan van B.T. Boeyinga van de Gemeentelijke Woningdienst, geïnspireerd op de tuinstadgedachte van
      Ebenezer Howard. Het geldt als hoogtepunt van de landelijke variant van de Amsterdamse School: hoogstens
      twee lagen met kap, pannendaken, houten gevelbeschot, pleintjes en korte zichtlijnen.


      Centraal ligt het achthoekige Purmerplein, met vrijstaande bouwblokken met winkels en bovenwoningen
      in "verstrakte Amsterdamse School". Een doorlopende brede luifel biedt het winkelend publiek beschutting;
      daarboven loopt een vensterstrook met horizontaal beschot en in het pannendak een reeks houten dakkapellen.
      Sommige blokken eindigen in een halfronde kap uit drie dakschilden. Aan de Purmerweg markeren symmetrische
      poortgebouwen met twee winkels en bovenwoningen de toegang tot de zijstraten; de doorgang rust op
      zware houten kolommen, met erkers en een balkon aan weerszijden. Ze werden op 28 januari 1998 rijksmonument.


      Let op:

      - de doorlopende luifels boven de winkelpuien

      - de halfronde kapafsluitingen aan het plein

      - de houten kolommen van de poortgebouwen aan de Purmerweg

      '
    attributes:
      client: Gemeentelijke Woningdienst Amsterdam
