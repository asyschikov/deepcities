  nl:
    title: Keukenwoningen, Tuindorp Nieuwendam
    summary: Rijtjes 'keukenwoningen' van J.H. Mulder (1923-1927), genoemd naar de toen nieuwe keuken
      aan de voorzijde, met houten topgevels en golvende lijsten, achter de poortgebouwen van het Purmerplein.
    body: 'Achter de poortgebouwen aan de Purmerweg liggen de straatjes met eengezinswoningen van J.H.
      Mulder in "verstrakte Amsterdamse Schooltrant". Ze heten keukenwoningen omdat de keuken, destijds
      nieuw, aan de voorzijde lag. Het gaat om reeksen van twee tot acht woningen aan de Avenhornstraat,
      Beemsterstraat, Wijdenesserstraat, Oudorperstraat, Wognumerstraat en Edammerstraat.


      Elk blok heeft een begane grond en kapverdieping onder een pannengedekt zadeldak dat aan de straatzijde
      laag doorloopt, zodat vensters en deuren direct onder de goot zitten. Brede dakkapellen met vensters
      in serie verlichten de zolder. Lage gemetselde muurdammen flankeren de entrees; daartussen zitten
      teruggezette geveldelen met gekoppelde vensters, waarachter de keuken. Op de zijgevels scheidt een
      houten cordonlijst met golflijn het metselwerk van een bovendeel met donkere rabatdelen. Lage gemetselde
      verbindingen koppelen de blokken aan de poortwoningen. Het nabijgelegen complex rond Middeliestraat
      en Edammerstraat (1926-1927) is van J. Boterenbrood.


      Let op:

      - de houten topgevels met golvende cordonlijst

      - de laag doorlopende daken met lange dakkapellen

      - de lage muurdammen naast de voordeuren

      '
