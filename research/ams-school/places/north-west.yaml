- title: Wingerdweg schools
  summary: Two public schools under one curving roof (1926) by Nicolaas Lansdorp of Public Works, following
    the bend of the Wingerdweg and decorated with small fairy-tale figures by Hildo Krop.
  body: 'In 1926 the Public Works department opened two public primary schools side by side on the Wingerdweg:
    the Resedaschool and the Wingerdschool. They were designed by Nicolaas Lansdorp, working under the
    department''s chief architect W.A. de Graaf, as one long building that bends with the curve of the
    street.


    The façades carry small fairy-tale figures by the city sculptor Hildo Krop, a typical touch in the
    Public Works schools of the 1920s, where sculpture was meant to delight children. A neighbouring Catholic
    school was damaged by wartime bombing and later demolished. In 2002 the heritage company Stadsherstel
    bought and renovated the building; it is now let as business units.


    Look for:

    - Krop''s fairy-tale figures on the façades

    - how the building follows the bend of the Wingerdweg

    '
