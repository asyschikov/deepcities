- title: Badhuis Kromme Distelstraat
  summary: A little bathhouse shaped like a North Holland farmhouse (1919) by B.T. Boeyinga, built for
    the emergency village of Disteldorp, whose new homes had no bathrooms; it survived every demolition
    plan.
  body: 'In 1918–1919 the Municipal Housing Service built Disteldorp, an emergency village for Amsterdam''s
    fast-growing population, and because the new homes had no bathrooms, B.T. Boeyinga designed this small
    public bathhouse with eight shower cubicles on the corner of the Kromme Distelstraat and Distelkade.
    As the area then still bordered farmland, he gave it the form of a stolpboerderij, the pyramid-roofed
    North Holland farmhouse, with Amsterdam School details. It is a sibling of Boeyinga''s bathhouse on
    the Zamenhofstraat.


    The houses were expected to last about 35 years, but the war intervened and the neighbourhood survived.
    The bathhouse closed in 1977 and stood empty for years; it escaped demolition when the surrounding
    area was designated a municipal monument.


    Look for:

    - the farmhouse-style pyramid roof

    - the corner position facing the Distelkade

    '
