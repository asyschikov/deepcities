  nl:
    title: Nassaukerk
    summary: Gereformeerde kerk aan de Kostverlorenvaart (1925-1926) van H.G. Krijgsman op een plattegrond
      met ingeschreven Grieks kruis, met vier hoge topgevels en een koperen vieringtoren. Nog altijd in
      gebruik.
    body: 'De Gereformeerde Kerk van Amsterdam schreef een prijsvraag uit voor architecten die zelf gereformeerd
      waren. H.G. Krijgsman uit Zeist won met het motto ''Vrede''. De eerste steen werd in juli 1925 gelegd
      en op 18 juni 1926 werd de kerk in gebruik genomen, met 924 zitplaatsen. Aan de De Wittenstraat
      staat een los gebouw met dienstruimten en zes woningen, aan de kade de kosterij met nog eens zes
      woningen.


      De kerk heeft een rechthoekig grondplan met ingeschreven Grieks kruis en trapportalen. Vier hoge
      topgevels met siermetselwerk markeren de kruisarmen; de gebroken kappen zijn met blauwe pannen gedekt
      en op de kruising staat een 24 meter hoge toren met leien onderbouw en koperen bekleding. De gemeente
      schonk het uurwerk. Beneden zitten ellipsbogige ramen. De Amsterdamse Schoolstijl blijkt uit het
      baksteenwerk, de raamverdelingen en de paraboolconstructies. Het orgel is uit 1931 (Valckx & Van
      Kouteren). De kerk wordt gebruikt door een wijkgemeente van de Protestantse Kerk Amsterdam en is
      de vaste repetitieruimte van het Russisch Kamerkoor.


      De registergegevens noemen 1926-1930, de bouw zelf vond plaats in 1925-1926.


      Let op:

      - de vier topgevels met siermetselwerk

      - de koperen vieringtoren met uurwerk

      - het zicht op de kerk vanaf de overkant van de Kostverlorenvaart

      '
    attributes:
      client: Gereformeerde Kerk Amsterdam
      original_use: Kerk met kosterij en woningen
