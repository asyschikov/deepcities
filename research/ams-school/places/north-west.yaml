  nl:
    title: Vierwindstrekenbrug
    summary: 'Brug van Piet Kramer over de Admiralengracht (1932) met de vier windstreken van Hildo Krop:
      een Inuit, een Afrikaanse jager, een Chinese sjouwer en een telefonerende Amerikaanse beursman met
      bolhoed.'
    body: 'Toen de Admiralengracht naar het noorden werd doorgetrokken en de Jan van Galenstraat een hoofdverkeersweg
      werd, ontwierp Piet Kramer voor Publieke Werken deze vaste brug (brug 381), gebouwd in 1932. De
      brug is 30 meter breed en combineert baksteen en graniet, met smeedijzeren balustrades met bloembakken
      en aan de zuidkant ingebouwde zitnissen.


      Op elk brughoofd staat een beeldhouwwerk van Hildo Krop dat een windstreek verbeeldt: het noorden
      als een Inuit met wapen tussen een iglo en twee walrussen, het zuiden als een Afrikaanse krijger
      met speer en schild tussen een hut en twee leeuwen, het oosten als een Chinese sjouwer met een pagode
      op een Chinese muur en twee stoomschepen, en het westen als een telefonerende beursman in Amerikaanse
      stijl met bolhoed en aktetas, een kantoor, beurskoersen en twee auto''s. Van Jan Trapman zijn een
      tijger en een ijsbeer bij de trappen naar het Erasmuspark; van Jaap Kaas en Hubert van Lith een
      knielende moeder met kind en een staand naakt bij de trappen naar het Joos Banckersplantsoen. De
      brug kreeg pas in 1996 haar naam, naar de beelden van Krop. Een door Kramer getekend kiosk werd
      nooit gebouwd.


      Let op:

      - de vier windstreken van Krop op de brughoofden

      - de tijger en ijsbeer van Trapman bij de trappen naar het Erasmuspark

      - de zitnissen aan de zuidzijde

      '
    attributes:
      original_use: Verkeersbrug
    sources:
