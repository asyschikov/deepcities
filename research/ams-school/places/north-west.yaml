  nl:
    title: Voormalige politiepost Buiksloterweg
    summary: Klein houten politiebureau (1915-1916) van Publieke Werken aan de Voorhaven van het Noordhollandsch
      Kanaal, op een plattegrond van twee in elkaar geschoven vierkanten, met arrestantenlokalen en een
      loodbeklede luchtschacht.
    body: 'De Dienst der Publieke Werken bouwde in 1915-1916 aan de westelijke oever van de Voorhaven
      van het Noordhollandsch Kanaal deze politiepost "naar een ontwerp in Amsterdamse School-stijl".
      Er waren een agentenkamer, een kamer voor de postcommandant, een fietsenbergplaats en in het midden
      twee arrestantenlokalen.


      Het gebouwtje heeft een plattegrond van twee in elkaar geschoven vierkanten, een bakstenen plint
      met horizontaal houten beschot en één bouwlaag met kapverdieping onder zwarte pannen. De twee schoorstenen
      op de nokpunten zijn verbonden door een decoratief met lood bekleed tussenstuk met luchtkanalen
      voor de zuurstofvoorziening van de arrestantenlokalen. De ingang zit op de afgeschuinde zuidhoek,
      tussen smalle diepliggende zijlichten. Rondom zitten dubbele openslaande negenruitsvensters met
      luiken. Het beschot is boven en onder groen en verder gebroken wit geschilderd, met gepunte uiteinden.
      Achteringang en aanbouw zijn later, in verwante trant.


      Let op:

      - het loodbeklede tussenstuk tussen de schoorstenen

      - de gepunte uiteinden van het groen-witte beschot

      - de ingang op de afgeschuinde hoek

      '
