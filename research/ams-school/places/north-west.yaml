  nl:
    title: Parkbrug tegenover Groeneweg 22, Weesp
    summary: 'Bakstenen parkbrug met twee pylonen en gesmede hekken, oplopende borstweringen en ornamenten
      van Muschelkalksteen: een gaaf voorbeeld van de in Weesp zeldzame Amsterdamse School.'
    body: 'De brug was bedoeld als toegang tot het achterliggende park, dat in 1989 sterk werd gedecimeerd.
      Een tongewelf overkluist de waterloop en tekent zich in de wanden af als rondboog. Midden op de
      brug staan twee pylonen met daartussen gesmede hekken met een eenvoudig ornament; de koppelstaaf
      tussen de pylonen is verdwenen, maar aan de buitenzijden zitten nog flankstukken van siersmeedwerk.


      Het metselwerk is van donkerrode baksteen met terugliggende voeg: halfsteensverband in de pylonen,
      kruisverband in de convergerende, naar het midden oplopende borstweringen. In de vlechtingen van
      de borstweringen en bovenop de pylonen zitten blokken en ornamenten van Muschelkalksteen. De gemeente
      noemt de brug een "gaaf bewaard voorbeeld van de in Weesp zeldzame ''Amsterdamse school''".


      Let op:

      - de pylonen met ornamenten van Muschelkalksteen

      - de gesmede hekken en flankstukken

      - de oplopende borstweringen

      '
    attributes:
      original_use: Toegangsbrug naar park
    sources:
    - city:450066001 (redengevende omschrijving gemeente Weesp)
