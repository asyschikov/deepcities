- title: Kriterion
  summary: Built in 1924 as an extension of a workers' club, this symmetrical Amsterdam School building
    has been the student-run cinema Kriterion since the 1950s.
  body: 'In 1924 the architects G.H. Kleinhout and A.J. van der Steur added this building on the Roetersstraat
    to the clubhouse of the Handwerkers Vriendenkring, a craftsmen''s association, with a coffee room,
    a large meeting hall and a caretaker''s flat. In the early 1950s it was converted into a cinema for
    the Stichting Onderlinge Studenten Steun, so that students could earn their way through university
    by working there. Kriterion is still run by students, which gives the building cultural-historical
    value beyond its architecture.


    Look for:

    - a clear, symmetrical front with a projecting central section in contrasting colour on the first
    floor, where the meeting hall was

    - the deep-set, largely glazed wooden ground-floor front that leads up to it

    - traces of the original fittings in the café (the former coffee room)

    '
  category: culture
  lat: 52.362552
  lng: 4.910738
  address: Roetersstraat 170-172
