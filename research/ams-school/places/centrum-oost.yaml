- title: Former bathhouse Uilenburg (Splendor)
  summary: A municipal bathhouse and street-cleaning depot designed in 1919, in bright red and glazed
    black brick around a courtyard. Since 2013 the musicians' venue Splendor.
  body: 'Designed in 1919 by Publieke Werken, this U-shaped complex combined a municipal bathhouse (badhuis)
    — in a neighbourhood where few homes had a bath — with a section post of the street-cleaning service
    (Stadsreiniging). The bathhouse had separate men''s and women''s wings, each with a changing room,
    showers and bath cubicles and its own waiting room; the depot held offices, storage, a canteen and
    a caretaker''s flat. It later became a bicycle factory, and between 2010 and 2013 it was converted
    into Splendor, a venue run by some fifty musicians.


    Look for:

    - the striking bright-red brick with a plinth of large black-glazed bricks laid on end

    - the central gateway entirely in black glazed brick, with sculpted stone corner blocks and a double
    iron gate in Amsterdam School style

    - walls raised above the roofline to mark where one building part meets the next

    '
  category: public-works
