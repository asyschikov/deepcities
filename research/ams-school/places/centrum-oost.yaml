- title: Gym halls Lijnbaansgracht (Barlaeus Gymnasium)
  summary: 'Two stacked gymnasium halls for the Barlaeus Gymnasium (1930s) by Public Works: utilitarian
    window bands on one side, a carefully composed canal front with a caretaker''s flat on the other.'
  body: 'The site held the Costerschool, a girls'' primary school closed in 1923. Around 1930 the growing
    Barlaeus Gymnasium, across the canal, needed gym halls closer than its old ones on the busy Marnixstraat,
    and in October 1930 Publieke Werken tendered "a gymnasium building with dwelling on partly existing
    foundations": two high gym halls, with a caretaker''s flat squeezed in on the first floor where the
    ancillary rooms are lower. As usual at Publieke Werken, the individual designer was not named. Since
    2017 it has been used by the Lucia Marthas dance academy. After A.R. Hulshoff became head of the section
    in 1916 (and city architect in 1924), Amsterdam''s public buildings of the 1920s and 1930s acquired
    a recognisable, carefully detailed character that the city register calls Amsterdam School; this building
    is a characteristic example of that work. The interior, with its carefully detailed staircase, is
    solid, sober and practical.


    Look for:

    - on the Korte Leidsedwarsstraat, two tall window bands of the gym halls in red-brown brick, without
    a door

    - on the Lijnbaansgracht, a row of deep, narrow windows framed in grey pebble-dash render, with matt
    black glazed sills

    - the original round-profiled window frames

    '
