  nl:
    title: Brug 283 (Waalseilandbrug)
    summary: 'Vaste brug met vijf doorvaarten achter het Scheepvaarthuis, in 1913 ontworpen door Jo van
      der Mey: een van de allereerste bruggen in Amsterdamse School-stijl.'
    body: 'Terwijl het Scheepvaarthuis in aanbouw was, ontwierp Jo van der Mey in 1913 voor de Afdeling
      Bruggen van Publieke Werken deze plaatbrug over de Waalseilandsgracht. Hij werd in 1914 gebouwd
      en verbindt de Lastageweg met de Buiten Bantammerstraat. De vier smeedijzeren lantaarns zijn vermoedelijk
      van Piet Kramer, die later honderden Amsterdamse bruggen zou tekenen.


      De brug heeft gemetselde zijwanden, vier doorvaarten in de vorm van een keperboog en een middendoorvaart
      met naar binnen hellende brughoofden. Het register prijst de hoogwaardige esthetische kwaliteit
      en het belang voor het oeuvre van Van der Mey.


      Let op:

      - de keperbogen en de natuurstenen blokken op de hoeken van de pijlers

      - de gemetselde balustrades op de aanbruggen met vier bijpassende lantaarns

      - het brugnummer 283 in siersmeedwerk boven de middelste pijlers

      '
    attributes:
      original_use: Brug
      client: Publieke Werken, Afdeling Bruggen
      artists: Piet Kramer (lantaarns, vermoedelijk)
    sources:
    - rce:518384
    - https://nl.wikipedia.org/wiki/Brug_283
- title: Jan de Liefdeschool (De Boomspijker)
  summary: A Christian primary school of 1929–1930 on the Recht Boomssloot, with tall ladder-shaped bay
    windows running round the corner; since 1977 the neighbourhood centre De Boomspijker.
  body: 'The Jan de Liefde school was built in 1929–1930 for the Vereniging tot Heil des Volks, a Protestant
    evangelisation society, on the corner of the Recht Boomssloot and the Korte Koningsdwarsstraat. A.
    Ingwersen designed it in what the national register calls the late Amsterdam School style. In 1977
    it was converted into the neighbourhood centre De Boomspijker.


    The building consists of two volumes: a long wing under a sloping flat roof and a higher, gabled block
    on the corner, both roofed with black tiles.


    Look for:

    - two multi-storey bay windows with tall, vertical "ladder" windows of leaded glass that wrap around
    the corners

    - small windows grouped in threes with horizontal, finely divided transoms cutting through the wall

    - the tall corner chimney running up past the eaves

    '
