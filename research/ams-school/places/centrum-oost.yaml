- title: Scheepvaarthuis
  summary: 'The building where the Amsterdam School began: a shipping-company office shaped like a ship''s
    prow, its brick, terracotta and iron worked into sea gods, ropes, waves and the ports of the Dutch
    shipping lines.'
  body: 'The Scheepvaarthuis (Shipping House) was commissioned in 1912 by six Amsterdam shipping lines
    — among them the Stoomvaart Maatschappij Nederland, the Koninklijke Paketvaart Maatschappij and the
    KNSM — as a shared head office. It stands on the tip of the Waalseiland, where Cornelis de Houtman''s
    first voyage to the East Indies set off in 1595, and thirteen old houses on the Prins Hendrikkade
    and Binnenkant were demolished to make room.


    The brothers Van Gendt engineered the building and its reinforced-concrete frame; they left the architecture
    to the then little-known Jo van der Mey, who brought in his colleagues from Eduard Cuypers'' office,
    Michel de Klerk and Piet Kramer. The result was so new that the national register calls it the first
    building realised entirely in the style of the Amsterdam School: a concrete skeleton with "pasted-on",
    restlessly modelled brick walls and roofs, small windows and a dense programme of sculpture. Hendrik
    van den Eijnde led the sculptors'' workshop, with Hildo Krop, Anton Rädecker and Joop van Lunteren
    in the team (W.C. Brouwer had led it earlier); Willem Bogtman made almost all the stained glass. A
    second phase along the Binnenkant followed in 1926–1928, using bricks fired at the same time as the
    first to avoid colour differences.


    The floor plan is triangular, with the directors'' rooms in the "bow" over the corner entrance. The
    shipping lines left by 1981; the city''s transport company GVB used it as head office from 1983 to
    2004, and since 2007 it is the Grand Hotel Amrâth — so the interior, including the stairwell, can
    be visited.


    Look for:

    - the corner entrance under the truncated tower clad in copper-coloured slate, flanked by personifications
    of the oceans

    - the lead roof edge shaped as ropes, waves and fish heads

    - carvings and reliefs full of maritime symbols — ships, sea creatures, references to the Dutch colonial
    shipping routes — on the piers between the windows

    - wrought-iron railings and lamps that run into the brickwork

    - inside (hotel lobby): the stairwell with ironwork and Bogtman''s stained-glass skylight

    '
  category: commercial
  lat: 52.374647
  lng: 4.903879
  address: Prins Hendrikkade 108, Binnenkant
