- title: Double school Nieuwe Uilenburgerstraat
  summary: Two public primary schools of 1920 around one shared playground, each façade answering the
    street it faces — heavy dark-brown brick lit up by bands of brick mosaic.
  body: 'Built by Publieke Werken in 1920 as part of the Uilenburg clearance, this U-shaped complex held
    two separate elementary schools (gewoon lager onderwijs) around a common playground: a corridor school
    facing the Nieuwe Uilenburgerstraat and a corner school on the Oudeschans/Nieuwe Batavierstraat, linked
    by a low wing with the gym and play hall. Classrooms face south-east for sun, and toilets are separated
    from the classrooms by corridors — the hygiene ideas of the day built into the plan. The city register
    lists it under the name Jonas Daniël Meijerschool.


    Look for:

    - each street façade designed differently, responding to the buildings opposite

    - heavy walls of dark-brown brick with small and large white-framed multi-pane windows, sized to the
    rooms behind

    - brick mosaics (metselmozaïek) above the second-floor windows

    '
  category: schools
