    summary: De eerste van drie gelijke bruggen van Piet Kramer in de Leidsestraat (1921), met vier fabeldieren
      naar ontwerp van Hildo Krop.
    body: 'De Koningssluis overspant de Herengracht en verbindt het Koningsplein met de Leidsestraat.
      In 1921 kreeg de brug bij een verbouwing haar huidige vorm naar ontwerp van Piet Kramer, voor de
      Afdeling Bruggen van Publieke Werken. Het beeldhouwwerk had Hildo Krop al in 1916 ontworpen; de
      firma Johan Polet voerde het uit. De bruggen 43 over de Keizersgracht en 68 over de Prinsengracht
      volgen hetzelfde ontwerp, zodat je in de Leidsestraat alle drie oversteekt.


      Let op:

      - de vier fabeldieren op de gebeeldhouwde afdekplaten

      - de horizontaal getrapte bakstenen vleugels met een gemetseld motief, op natuursteen bij de waterlijn

      - de verticaal getrapte pijlers met natuurstenen uitkragingen en de smeedijzeren sierbalustrade

      '
