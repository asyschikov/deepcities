  nl:
    title: Plantage Kerklaan 37
    summary: 'Een zeldzaam woonhuis in Amsterdamse Schoolstijl in de binnenstad (1921): een afgeschuinde
      erker, een stijgbeugelvormige geveltop en een expressieve bak om de hijsbalk, tussen de rijk versierde
      Plantagehuizen.'
    body: 'De Plantage werd grotendeels in het laatste kwart van de negentiende eeuw bebouwd, met voorname
      herenhuizen vol ornamenten uit de catalogus. Dit woonhuis met café op de begane grond uit 1921 steekt
      daar scherp tegen af. Architect Th. Kint was volgens het gemeentelijk register "niet van het postuur
      van De Klerk of Kramer", maar wel exemplarisch voor de generatie architecten die, veelal anoniem,
      de principes van de Amsterdamse School huldigden. In de nieuwe stadsdelen kregen zij volop kansen;
      in de binnenstad is hun werk zeldzaam.


      Let op:

      - de stijgbeugelvormige geveltop, een stijlmiddel dat rond 1911 opdook bij het Scheepvaarthuis en
      bij De Klerks huizen aan het Johannes Vermeerplein

      - de tweezijdig afgeschuinde erker in oranje handvormsteen

      - de expressief geprofileerde bak om de hijsbalk en de vlaggenmasthouder

      - de begane grond in witgepleisterde natuursteen, een moderne interpretatie van een zuilenorde

      '
    attributes:
      original_use: Woonhuis met café
    sources:
    - city:205030
- title: Theater Desmet
  summary: An 1879 theatre given a new white front in 1926–1927 by Jan Boterenbrood, mixing Art Deco and
    the Amsterdam School. Later the Desmet cinema; now a broadcast studio.
  body: 'The building began in 1879 as the Frascati theatre by A.L. van Gendt and was rebuilt several
    times. Its present face is the work of Jan Boterenbrood, an architect best known for Amsterdam School
    housing, who redesigned it in 1926–1927 as the Rika Hopper Theater, named after a well-known actress.
    After 1946 the Desmet family turned it into a cinema; in 2000 it became a broadcasting studio.


    The symmetrical front has a flat, clear structure with features of both Art Deco and the Amsterdam
    School. The plaster layer is not original and some detail has been lost.


    Look for:

    - double round-arched glass doors on the corners with oversized keystones and fan-shaped glazing bars

    - red decorative bands that spring from the canopy, run up the square piers and down to the ground

    - the stepped top above a strip of seven small windows

    '
