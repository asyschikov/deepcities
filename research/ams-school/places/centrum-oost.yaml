  nl:
    title: Woningcomplex Uilenburg (Jo Mulder)
    summary: 'Complex van 72 woningen uit de sanering van Uilenburg (1926): drie gevels met elk een eigen
      dak — tuitgevels aan de straat, een mansardedak aan de Oostersekade, een schilddak aan de Oudeschans.'
    body: 'In het begin van de twintigste eeuw werd Uilenburg ingrijpend gesaneerd. De Uilenburgerstraat
      en de Batavierstraat werden samengevoegd tot de brede Nieuwe Uilenburgerstraat en vrijwel alle oude
      bebouwing verdween. Volgens het gemeentelijk register leverden de grote complexen uit de jaren twintig
      een "zeldzame concentratie van Amsterdamse Schoolarchitectuur" in de binnenstad op. Dit blok tussen
      de Nieuwe Uilenburgerstraat, de Oostersekade en de Oudeschans werd in 1926 ontworpen door J.H. (Jo)
      Mulder; de aanbesteding volgde in april 1926.


      Mulder speelde in op de stedenbouwkundige situatie door elke gevel anders vorm te geven. Het complex
      bestaat uit identieke eenheden van zes woningen, met winkels en werkplaatsen op de begane grond.
      De trappenhuizen liggen juist op de scheiding tussen twee eenheden, zodat bewoners van verschillende
      ''huizen'' één voordeur delen.


      Let op:

      - aan de Nieuwe Uilenburgerstraat acht brede topgevels, afgewisseld met smalle, terugliggende trappenhuizen

      - donkerrode handvormsteen boven een donkerbruine begane grond, met gestileerde natuurstenen pylonen
      en wigvormige penanten

      - de gegroefde paneeldeuren met het typische bovenlicht met wigvormige stijlen

      - aan de Oudeschans de stenen poort met een hert en een bliksemschicht van Marinus Vreugde

      '
    attributes:
      original_use: Woningen met winkels en werkplaatsen
    sources:
    - city:202037
    - city:202040
    - https://nl.wikipedia.org/wiki/Oudeschans_17A-23B
- title: Werf Uilenburg (Public Works yard)
  summary: The 1925–1926 yard and offices of the city's Sewers and Bridges departments — where Piet Kramer's
    bridges were drawn. Stepped brick volumes, a tower-like corner and the original gilt lettering.
  body: 'Built in 1925–1926 on the site of an old shipyard, this L-shaped building housed the sewers department
    and the Bridges section of Publieke Werken (Public Works), which had outgrown its old premises. It
    was designed in-house under city architect A.R. Hulshoff, and it was here that Piet Kramer designed
    his Amsterdam bridges. The city register describes it as an example of the "linear expressive" variant
    of the Amsterdam School: stepped, flat-roofed brick volumes of great geometric strictness, with sparing
    decoration.


    Behind the gate stands the 1887 caretaker''s house of the former Sophie Rosenthal nursery school for
    poor Jewish children, also a municipal monument. The building is next to the Uilenburger Synagogue
    (1766).


    Look for:

    - the gilded bronze letters PUBLIEKE WERKEN, AFDEELING RIOLEERING EN BRUGGEN over the entrance

    - two long bands of sixteen sash windows set in thick white frames

    - the narrow, almost windowless tower-like volume at the corner

    - a re-set seventeenth-century gable stone with the arms of Portugal

    '
