- title: Johanna Borskibrug (Brug 41)
  summary: Piet Kramer's 1922 Vijzelstraat bridge over the Keizersgracht, its stone pylons chiselled with
    SPQA — "the Senate and People of Amsterdam".
  body: 'Rebuilt in 1922 to a design by Piet Kramer for the Bridges section of Publieke Werken, as part
    of the widening of the Vijzelstraat. It is now named after Johanna Borski, the nineteenth-century
    banker.


    Look for:

    - stone pylons at the ends of the wing walls, carved with SPQA (Senatus Populusque Amstelodamensis
    — the Senate and People of Amsterdam)

    - brick wing walls in a special bond with segmental arches, on stone blocks running below the waterline

    - stepped and decorated piers of stone and brick, and a wrought-iron balustrade

    '
