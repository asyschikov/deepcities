  nl:
    title: Gymnastiekgebouw Lijnbaansgracht (Barlaeus Gymnasium)
    summary: 'Twee gymzalen boven elkaar voor het Barlaeus Gymnasium, in verstrakte Amsterdamse School
      van Publieke Werken: utilitair aan de ene kant, een zorgvuldig gecomponeerde grachtgevel met dienstwoning
      aan de andere.'
    body: 'Hier stond de Costerschool, een openbare lagere meisjesschool die in 1923 sloot. Het snel groeiende
      Barlaeus Gymnasium had zijn eigen gymlokaal opgeofferd voor leslokalen en uitwijken naar de Marnixstraat
      werd door het verkeer te gevaarlijk. In oktober 1930 werd "het bouwen van een gymnastiekgebouw met
      woning op een gedeeltelijk bestaande fundering" aanbesteed. Het ontwerp kwam van de Dienst der Publieke
      Werken, waar de naam van de architect gewoonlijk niet werd genoemd. Onder A.R. Hulshoff, vanaf 1916
      hoofd van de Afdeling Gebouwen en vanaf 1924 stadsarchitect, kregen de openbare gebouwen een herkenbaar,
      zorgvuldig gedetailleerd karakter. Het gemeentelijk register noemt dit gebouw een karakteristiek
      voorbeeld. Sinds 2017 is het in gebruik bij de dansacademie Lucia Marthas.


      Let op:

      - aan de Korte Leidsedwarsstraat de twee hoge bandvormige vensterreeksen van de gymzalen in roodbruine
      baksteen, zonder deur

      - aan de Lijnbaansgracht de rij diepliggende smalle ramen in een kader van grijs stucwerk met kiezeltoeslag
      en dof zwart geglazuurde lekdorpels

      - de ramen met de voor die tijd karakteristieke rond geprofileerde wisseldorpel

      '
    attributes:
      original_use: Gymnastieklokalen met dienstwoning
      architect: Publieke Werken (Afdeling Gebouwen onder A.R. Hulshoff)
      client: Gemeente Amsterdam
    sources:
    - city:200494
