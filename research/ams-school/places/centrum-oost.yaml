  nl:
    title: Weteringschans 193-195
    summary: Dubbel winkel- en woonpand uit 1927 in een verstrakte Amsterdamse School, met de jaarsteen
      "Anno DO=1927".
    body: 'In 1927 ontwierp C.J.H. Schol, een bouwkundig tekenaar die verder in Amsterdam onbekend is
      gebleven, dit dubbele pand met twee winkels en twee woonlagen voor de Exploitatiemaatschappij Veka.
      Het verving een pand van twee bouwlagen. Wikipedia beschrijft de bouwstijl als "een verstrakte vorm
      van de Amsterdamse School". Het is gemeentelijk monument vanwege het eigentijdse karakter van het
      ontwerp.


      Let op:

      - de jaarsteen "Anno DO=1927"

      - het siersmeedwerk boven de opening van het trappenhuis

      - de glas-in-loodbovenlichten en de natuurstenen plint

      '
    attributes:
