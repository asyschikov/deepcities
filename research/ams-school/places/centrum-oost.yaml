  nl:
    title: Carlton Hotel (Grand Hotel Centraal)
    summary: Gebouwd in 1925–1929 als het grootste en luxueuste hotel van Nederland, als brug over de
      Reguliersdwarsstraat. Beeldhouwwerk van Theo Vos met het wereldverkeer en de werelddelen.
    body: 'Op de grond die bij de verbreding van de Vijzelstraat vrijkwam, liet de NV Grand Hotel Centraal
      tussen 1925 en 1929 een hotel bouwen naar ontwerp van G.J. Rutgers in Amsterdamse School-stijl.
      Het was het grootste en luxueuste hotel van zijn tijd in Nederland, met bij elke kamer een badkamer
      en telefoon. Een feestzaal overspant de Reguliersdwarsstraat. De inspringende bovenbouw is van G.
      van Arkel en H.J. Breman. De opdrachtgever ging tijdens de bouw failliet, waarna een Engelse onderneming
      het hotel als Carlton opende, op tijd voor de Olympische Spelen van 1928. In de jaren dertig speelden
      hier Louis Armstrong en Cab Calloway.


      In de nacht van 26 op 27 april 1943 stortte een neergeschoten Britse Halifax-bommenwerper achter
      het hotel neer. De brand verwoestte vrijwel alle bebouwing tot aan het Singel, en Jan Wils leidde
      het herstel. Alle oorspronkelijke ramen zijn later vervangen. Sinds 2019 heet het hotel NH Flower
      Market.


      Let op:

      - de galerij met hoekig gelijnde bogen op zware, naar beneden toe versmallende pijlers, met grijs
      graniet in de baksteen

      - de driehoekerkers met overhoeks geplaatste pilasters op de kamerverdiepingen

      - het beeldhouwwerk van Theo Vos tussen tussenverdieping en eerste verdieping, en de beelden van
      Amerika en Europa aan de korte zijde

      - het brede balkon boven de overspanning en de stompe toren aan de Singelkant

      '
    attributes:
