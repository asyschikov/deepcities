      - de overdadig gedecoreerde granieten hoekblokken met nijlpaarden en leeuwenkoppen

      - de borstweringen langs de walkant met houten zitbanken, eindigend in ronde, spits toelopende bollen

      - de smeedijzeren balustraden op de borstweringen en op de brug zelf

