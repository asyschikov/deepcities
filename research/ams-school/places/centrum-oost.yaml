  nl:
    title: Flesseman
    summary: 'Magazijn- en kantoorgebouw uit 1926–1927 aan de Nieuwmarkt, met gevels van Wendingen- redacteur
      Hendrik Wijdeveld: torentje, ronde geveldelen en een grote klok. Nu een verzorgingshuis.'
    body: 'In 1925 kondigde de firma I.L. Flesseman, groothandel in confectie, aan de hele gevelwand naast
      haar pand aan de Nieuwmarkt te slopen, inclusief twee zeventiende-eeuwse huizen op nummer 19 en
      21. Hendrik Wijdeveld ontwierp de gevels, Jordanus Roodenburgh de constructie. Op 16 januari 1927
      opende Flesseman het nieuwe gebouw, in het jaar dat de firma zestig jaar bestond. Het Volk sprak
      van een staaltje "mooie architectuur".


      Het circa dertig meter hoge gebouw van rode baksteen op een natuurstenen plint is een variant van
      de Amsterdamse School. Flesseman vertrok in 1961. In 1986–1988 verbouwde de Coöperatieve Architecten
      Vereniging het tot verzorgingshuis, met nieuwe vleugels aan de Sint Antoniesbreestraat en de Dijkstraat.
      Een externe isolatielaag deed toen de karakteristieke gevel grotendeels teniet.


      Let op:

      - het torentje en de grote klok aan de Nieuwmarkt

      - ramen met een hoek, ronde geveldelen en de uitkragende eerste verdieping

      - boven de ingang kopieën van de gevelstenen Sint-Andreas en Sint-Jacobus uit de gesloopte huizen

      '
    attributes:
      original_use: Magazijn en kantoor van een confectiebedrijf
      architect: Hendrik Wijdeveld (gevels), Jordanus Roodenburgh (constructie)
    sources:
    - https://nl.wikipedia.org/wiki/Flesseman
- title: Uilenburg housing block (Jo Mulder)
  summary: 'A 72-home block from the slum clearance of Uilenburg, 1926: three façades, three roof shapes
    — stepped gables on the street, a mansard on the Oostersekade, a hipped roof on the Oudeschans.'
  body: 'In the early twentieth century the old Jewish quarter of Uilenburg was almost entirely cleared:
    the two narrow streets were merged into the broad Nieuwe Uilenburgerstraat and seventeenth-century
    houses were replaced by new municipal housing, schools and a bathhouse. The city register calls the
    result a rare concentration of Amsterdam School architecture in the old centre. This block of 72 dwellings,
    designed in 1926 by Jo (J.H.) Mulder, fills a whole block between the Nieuwe Uilenburgerstraat, the
    Oostersekade and the Oudeschans.


    Mulder gave each of the three façades its own character. The block is made up of identical units of
    six dwellings each, with shops and workshops on the ground floor; the shared stairwells sit on the
    joins between units, so neighbours from two "houses" share one door.


    Look for:

    - on the Nieuwe Uilenburgerstraat: eight broad gables alternating with narrow, recessed, flat-topped
    stairwell bays

    - dark-red handmade brick above a darker brown ground floor, with stylised stone pylons and wedge-shaped
    brick piers

    - grooved panelled doors with typical wedge-shaped Amsterdam School fanlights

    - on the Oudeschans: the stone gateway with a sculpture of a deer and lightning bolt by Marinus Vreugde

    '
  category: housing
  lat: 52.371425
  lng: 4.906883
  address: Nieuwe Uilenburgerstraat 2-68, Oostersekade 4-8, Oudeschans 17A-23B
