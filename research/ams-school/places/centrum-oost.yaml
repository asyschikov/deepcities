- title: Herengracht 613
  summary: 'A 1922 canal house by A.J. Westerman: traditional in size and materials, but with low, even
    floors, a granite-clad ground floor and strongly vertical windows — sober Amsterdam School on the
    Herengracht.'
  body: 'One of the earliest independent commissions of A.J. Westerman (1884–1966), who had worked for
    Publieke Werken before starting his own, very productive office. Westerman is traditionally counted
    among the Amsterdam School, though his designs are less sculptural than those of his PW colleague
    Marnette. The house fits the canal in material, stoop and plot width, but its proportions and detailing
    break with its neighbours: the floors are low and even, and the top floor is set back behind a parapet
    under a projecting canopy. The low ground floor suggests that parts of an older structure may survive
    behind.


    Look for:

    - the granite-clad ground floor with a pared-down entablature

    - fanlights divided by strong vertical wooden bars, repeated in slimmer form on the floors above

    - the angular ironwork of the door grille and the railings between the stoop posts

    - a sturdy hoisting beam rising above the canopy

    '
