  nl:
    title: Hoofdkantoor Amsterdamsche Bank (The Bank)
    summary: Het voormalige hoofdkantoor van de Amsterdamsche Bank aan het Rembrandtplein (1926–1932),
      ontworpen door het bureau Ouëndag in overleg met Berlage. Nu bedrijfsverzamelgebouw The Bank.
    body: 'Het bureau van B.J. Ouëndag ontwierp het hoofdkantoor van de Amsterdamsche Bank en raadpleegde
      daarbij H.P. Berlage, al is van diens ideeën niet veel overgebleven. Het oorspronkelijke interieur
      bevatte veel beeldhouwwerk van Lambertus Zijl. De bank ging later op in de Amro Bank en ABN AMRO.
      Nadat die naar de Zuidas was vertrokken, zat hier een tijd TomTom.


      In de jaren zeventig verbouwden Zwiers en Fontein het gebouw ingrijpend en verwijderden ze de lichtkoepel.
      Bij een latere verbouwing bracht Kees Rijnboutt veel oorspronkelijke elementen terug. Nu zitten
      er restaurants en bedrijven onder de naam The Bank.


      Let op:

      - het grote bakstenen volume op de hoek van het Rembrandtplein en de Amstelstraat

      - het stukje strengelspoor in de Amstelstraat, aangelegd zodat waardetransporten makkelijk bij de
      bank konden lossen

      '
    attributes:
      original_use: Hoofdkantoor van een bank
      architect: B.J. en W.B. Ouëndag (met H.P. Berlage)
    sources:
    - https://nl.wikipedia.org/wiki/Hoofdkantoor_Amsterdamsche_Bank
- title: Tuschinski Theatre
  summary: 'Abraham Tuschinski''s "world theatre palace" (1918–1921): two domed towers, a façade clad
    in glazed tiles and ceramic sculpture, and a peacock-themed lobby by Jaap Gidding. Exuberant Art Deco
    with Amsterdam School touches.'
  body: 'Abraham Tuschinski, a Polish-Jewish cinema operator who had settled in Rotterdam, bought up the
    slum known as the Duvelshoek between the Reguliersbreestraat and Reguliersdwarsstraat in 1917 to build
    a "world theatre palace". Hijman Louis de Jong designed it in 1918; after a falling-out with Tuschinski,
    Willem Kromhout took over his tasks. It opened on 28 October 1921 with a Wurlitzer theatre organ.
    Critics found it garish, and parts of the decoration were toned down in the 1930s. Tuschinski and
    his brothers-in-law were murdered in the Holocaust in 1942. Pathé restored the cinema in 1998–2002
    and again for its centenary in 2021, when it received the royal predicate Koninklijk.


    The national register calls it exuberant Art Deco; the English Wikipedia describes the façade as a
    blend of Art Deco, Art Nouveau and the Amsterdam School. It is on this map as the most famous building
    of the period around the Rembrandtplein, rather than as a pure Amsterdam School work.


    Look for:

    - the tall front between two towers with domed roofs, entirely clad in glazed tiles and ceramic sculpture
    by C. Bartels and B. Jordens

    - four monumental bronze lamps on the façade

    - inside, the intact lobby by Jaap Gidding: painted ceilings and walls, carpet with peacock motifs,
    woodcarving and wrought iron

    '
  category: culture
  lat: 52.366111
  lng: 4.894444
  address: Reguliersbreestraat 26-28
  links:
