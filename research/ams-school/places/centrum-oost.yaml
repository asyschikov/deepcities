- title: Leidsebrug (Brug 174)
  summary: Piet Kramer's grand gateway bridge to the Leidseplein (1923–1925), guarded by granite hippos
    and lion heads — and the first Amsterdam bridge designed with built-in benches.
  body: 'The Leidsebrug carries the main approach to the old city over the Singelgracht, linking the Stadhouderskade
    with the Leidseplein. Piet Kramer designed it in 1923 and it was completed in 1925; the sculpture
    is by Johan Polet. The national register notes that it was the first bridge whose design included
    seating.


    Look for:

    - richly decorated granite corner blocks with hippopotamuses and lion heads

    - low walls along the quays with wooden benches built in, ending in round, pointed knobs

    - decorative wrought-iron balustrades on the walls and on the bridge itself

    '
