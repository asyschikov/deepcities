- title: Brug 283 (Waalseilandbrug)
  summary: A five-arched brick bridge behind the Scheepvaarthuis, designed by Jo van der Mey while the
    Shipping House was rising — one of the very first Amsterdam School bridges.
  body: 'Brug 283 crosses the Waalseilandsgracht between the Lastageweg and the Buiten Bantammerstraat,
    right behind the Scheepvaarthuis. Jo van der Mey designed it in 1913 for the Bridges section of the
    city''s Public Works department (Publieke Werken), and it was built in 1914 — years before Piet Kramer''s
    long series of canal bridges made the style standard across the city. The four wrought-iron lamps
    were probably designed by Kramer.


    It is a fixed plate bridge with brick side walls and five openings: four pointed (keel-arch) passages
    and a wider central one with inward-leaning abutments.


    Look for:

    - the pointed arches and the natural-stone blocks on the corners of the piers

    - the brick balustrades on the approaches, capped with stone and carrying four ornamental lamps

    - the bridge number 283 worked into the wrought iron over the middle piers

    '
