  nl:
    title: Theater Tuschinski
    summary: 'Het "wereldtheaterpaleis" van Abraham Tuschinski (1918–1921): twee torens met koepeldaken,
      een gevel vol geglazuurde tegels en keramiek en een foyer met pauwmotief. Uitbundige art deco met
      trekjes van de Amsterdamse School.'
    body: 'Abraham Tuschinski exploiteerde vier bioscopen in Rotterdam toen hij in 1917 grond kocht in
      de Duvelshoek, tussen de Reguliersbreestraat en de Reguliersdwarsstraat. Hijman Louis de Jong ontwierp
      het theater in 1918; na onenigheid met Tuschinski nam Willem Kromhout zijn taken over. Op 28 oktober
      1921 ging het open, met een Wurlitzer-theaterorgel. De kritiek op het "potsierlijke" gebouw leidde
      in de jaren dertig tot versobering van de decoraties. Tuschinski en zijn zwagers werden in 1942
      vermoord. Pathé restaureerde het theater, en bij het honderdjarig bestaan in 2021 kreeg het het
      predicaat Koninklijk.


      Het Rijksmonumentenregister spreekt van "uitbundige art deco", de stijl die destijds internationaal
      met de speelfilm werd verbonden. Het gebouw staat op deze kaart als blikvanger van de periode rond
      het Rembrandtplein, niet als zuivere Amsterdamse School.


      Let op:

      - de hoge voorgevel tussen twee torens met koepeldaken, geheel bekleed met geglazuurde tegels en
      keramische sculpturen van C. Bartels en B. Jordens

      - de vier monumentale bronzen lampen in de gevel

      - binnen de gave foyer van Jaap Gidding, met plafond- en wandschilderingen, tapijt met pauwmotief,
      houtsnijwerk en siersmeedwerk

      '
    attributes:
      original_use: Bioscoop en theater
      architect: Hijman Louis de Jong (met Willem Kromhout)
      artists: C. Bartels en B. Jordens (keramiek); Jaap Gidding (foyer); Pieter den Besten (muurschilderingen)
    sources:
