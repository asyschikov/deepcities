  nl:
    title: Herengracht 613
    summary: 'Grachtenpand uit 1922 van A.J. Westerman: passend in maat en materiaal, maar met lage, gelijkmatige
      verdiepingen, een granieten begane grond en sterk verticale ramen.'
    body: 'Een van de vroegste zelfstandige opdrachten van A.J. Westerman (1884–1966), die eerst enkele
      jaren voor Publieke Werken had ontworpen en daarna een succesvol en productief eigen bureau had.
      Westerman wordt traditioneel tot de Amsterdamse School gerekend, maar zijn werk is minder plastisch
      dan dat van zijn PW-collega Marnette. Het huis past in materiaal, stoep en perceelmaat bij de grachtengordel,
      maar wijkt af in de verhoudingen van de bouwlagen en in de detaillering. De bovenste verdieping
      ligt terug achter een borstwering onder een overkragende luifel. Door de lage begane grond zijn
      achter de gevel mogelijk oudere delen bewaard.


      Let op:

      - de met graniet beklede begane grond met een sterk versoberd hoofdgestel

      - de bovenlichten met kloeke verticale houten stijlen, slanker herhaald op de verdiepingen

      - de hoekige hekwerken tussen de stoeppalen en voor het glas van de deur

      - de kloeke hijsbalk boven de luifel

      '
    attributes:
      original_use: Woonhuis
    sources:
    - city:202061
- title: Herengracht 513-515 / Vijzelstraat 22-28
  summary: 'A large 1928 corner block by G.J. Rutgers, built when the Vijzelstraat was widened: shops,
    restaurants and flats, broken up so that on the canal it reads as two buildings.'
  body: 'Between 1914 and 1927 the west side of the Vijzelstraat was demolished and the street widened
    for north–south traffic, with tall, block-scale buildings under the urban supervision of K.P.C. de
    Bazel — the first attempt at large-scale architecture with a strong urban component in the old centre.
    On a corner plot that had held about seven houses, G.J. Rutgers built this block in 1928: a shop and
    two restaurants at street level, a mezzanine with small square windows, and five floors of flats.


    Look for:

    - on the Vijzelstraat, lively relief and strong vertical lines; the top floor clad, like the roof,
    in mastic slates

    - on the Herengracht, a symmetrical main front and a lower, set-back wing matched to the historic
    neighbour

    - the gateway to the rear courtyard in the canal wing

    '
  category: housing
