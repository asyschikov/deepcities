  nl:
    title: Walenweeshuissluis (brug 70)
    summary: 'Het sluitstuk van de verbrede Vijzelstraat: een brug van Piet Kramer over de Prinsengracht,
      in 1934–1935 in twee helften gebouwd.'
    body: 'Brug 70 verbindt de Vijzelstraat over de Prinsengracht met de gedempte Vijzelgracht. Ze werd
      tussen 9 juli 1934 en 8 juni 1935 in twee helften gebouwd, zodat het verkeer kon blijven doorgaan.
      Omdat de demping van de Vijzelgracht vertraging opliep, was dit de laatste van de bruggen in deze
      route. Het ontwerp kwam van het bureau van Piet Kramer bij Publieke Werken, en zijn hand is overal
      herkenbaar. In 2020–2021 is de brug wegens verzakking in delen gedemonteerd en weer opgebouwd.


      Let op:

      - de bakstenen landhoofden en pijlers in combinatie met natuursteen

      - de sierlijke smeedijzeren balustrades

      - het eenvoudige beeldhouwwerk, toegeschreven aan Kramer zelf

      '
