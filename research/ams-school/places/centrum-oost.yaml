- title: Incassobank archive building
  summary: A square brick archive block of 1928–1929 for the Incassobank, finished by Jan Gratama, who
    coined the name "Amsterdam School" — oddly crowned with a steep Mauritshuis-style slate roof.
  body: 'The Incassobank, whose offices stood on the Herengracht behind, needed a separate archive building
    on the site of a former coach house in the Reguliersdwarsstraat. The firm of Baanders made a design
    in Amsterdam School style in 1920, but the permit lapsed; I. Blomhert submitted a new design in 1927,
    and in July 1928, during construction, Jan Gratama took over — probably after a conflict. Gratama
    is the critic who coined the name "Amsterdamsche School" in 1916. Throughout these changes the main
    lines of the façade stayed the same; Blomhert and Gratama mainly adapted the detailing. A late change
    in 1929 replaced the planned flat roof with a high one.


    Inside were mostly large open archive and storage rooms around a central corridor and stair.


    Look for:

    - nine windows set in three recessed panels between four heavy brick piers

    - decorative brickwork in the parapets under the windows

    - three fine varnished wooden doors, the outer two probably for goods

    - the high slate roof with big corner chimneys, a nod to the Mauritshuis in The Hague (the wide dormer
    is from the 1950s)

    '
