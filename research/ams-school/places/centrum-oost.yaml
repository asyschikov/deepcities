  nl:
    title: Nieuwe Spiegelstraat 61
    summary: Smal winkel-woonhuis uit 1922 waarvoor Kleinhout en Van der Steur een vindingrijke, sobere
      gevel in Amsterdamse Schoolachtige trant ontwierpen, met originele winkelpui en deuren.
    body: 'Perceelbreedte en bouwhoogte lagen vast, dus konden G.H. Kleinhout en A.J. van der Steur weinig
      meer ontwerpen dan de straatgevel en het interieur. Volgens het gemeentelijk register leidde die
      beperking juist tot een eigentijdse en originele gevel. Dat de winkelpui nog origineel is, is bijzonder:
      in die tijd moderniseerden winkeliers hun pui voortdurend. A.J. van der Steur (1895–1963) zat later
      in de redactie van Bouwkundig Weekblad Architectura en was van 1945 tot 1953 voorzitter van de BNA.


      Let op:

      - het centrale etalagevenster tussen twee deuren in een hoge hardstenen omlijsting, deels met marmer
      bekleed

      - de originele deuren met ruitvormige sierroeden in de bovenlichten, en de drie houten staven voor
      het onderste paneel van de linkerdeur

      - de sierlijke roosters voor de kelderraampjes

      - de vrijwel onversierde gevel van donkerbruine baksteen erboven

      '
    attributes:
      original_use: Winkel met woning
      architect: G.H. Kleinhout en A.J. van der Steur
    sources:
    - city:207022
- title: Prinsengracht 688
  summary: A 1920 canal-side workshop and house, probably built by the architect Joh. Visser for himself
    — a closed, symmetrical brick front with a heavy stone base, rare on the canal ring.
  body: 'Like Nieuwe Spiegelstraat 61 (with which it shares a close stylistic kinship), this building
    had to fit a fixed plot and height, yet Joh. Visser arrived at a contemporary, original front. Permit
    records suggest he built it for his own technical bureau. It fits the canal in scale but stands out
    by its Amsterdam School-like manner — the city register values it for its rarity on the canal ring.


    Look for:

    - a heavy natural-stone shopfront framed by stylised pilasters, with the original doors to the upper
    floors

    - window groups set in recessed panels, with brick bands and edges giving the front its relief

    - an almost classical three-part build-up: base, a two-storey middle zone and a closing top floor

    '
