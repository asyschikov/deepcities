  nl:
    title: Prinsengracht 688
    summary: 'Woon- en bedrijfspand uit 1920 dat architect Joh. Visser vermoedelijk voor zichzelf bouwde:
      een gesloten, symmetrische gevel met een zware natuurstenen pui, zeldzaam in de grachtengordel.'
    body: 'Net als bij Nieuwe Spiegelstraat 61, waarmee het pand sterk verwant is, lagen perceelbreedte
      en hoogte vast. Toch kwam Joh. Visser tot een eigentijdse, originele gevel. Uit de vergunningsgegevens
      blijkt dat hij het pand waarschijnlijk voor zijn eigen technisch bureau bouwde. In maat en proportie
      past het in de gevelwand, maar de Amsterdamse Schoolachtige bouwtrant maakt het tot een opvallend
      element. Het register spreekt van zeldzaamheidswaarde in de grachtengordel.


      Let op:

      - de fors gedimensioneerde natuurstenen pui met gestileerde pilasters en de originele deuren naar
      de verdiepingen

      - de raampartijen in verdiepte velden, met bakstenen banden en randen die de gevel plasticiteit
      geven

      - de bijna klassieke driedeling in basement, middenzone en afsluitende verdieping

      '
    attributes:
      original_use: Woon- en bedrijfspand
    sources:
    - city:208045
- title: Vijzelgracht 15 bakery
  summary: A 1928 Amsterdam School shopfront in black stone, teak and leaded glass — with its original
    bakery interior, still in use as a bakery.
  body: 'The house itself dates from 1881, but in 1928 its shop was remodelled for a bakery in the then
    fashionable Amsterdam School style, which was found especially suited to shopfronts; often the whole
    shop fitting was designed along with it. What makes this one special, according to the city register,
    is that the original interior survives and is still used as a bakery. The architect, F.M. Kramer,
    is otherwise unknown — not to be confused with Piet Kramer.


    Look for:

    - a shopfront of polished black stone and teak, with a brass-edged display window meeting the porch
    at a right angle

    - a leaded-glass shop door with a carved handle

    - the teak door to the upper house with a small peephole set across its vertical divisions

    - the original bakery fittings inside

    '
