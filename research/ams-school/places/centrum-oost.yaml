  nl:
    title: Rembrandtplein 44
    summary: 'Café-restaurant dat in 1918 een gevel kreeg in de toen "hypermoderne" Amsterdamse School:
      een vroeg en rijk gemetseld voorbeeld van de expressieve fase, midden op het uitgaansplein.'
    body: 'Op deze plek bouwde J.H. Lesmeister kort na 1900 een café-restaurant met biljartzaal en vergaderzalen.
      In 1918 verbouwde architect Van Schaik het pand ingrijpend en gaf hij het een gevel in de stijl
      die De Klerk net rond het Spaarndammerplantsoen had geïntroduceerd. De symmetrische opzet is nog
      vrij conventioneel, maar de krachtige plasticiteit en de rijkdom aan siermetselwerk lieten zien
      dat er een nieuw tijdperk was begonnen. Volgens het gemeentelijk register koos de opdrachtgever
      bewust voor een opzienbarend gebouw om zijn zaak aan het plein een gezicht te geven.


      In de binnenstad zijn gebouwen in deze stijl zeldzaam. Het register noemt de gevel een opmerkelijk
      voorbeeld van de vroege, expressionistische fase van de Amsterdamse School. Alle raamkozijnen zijn
      nog origineel; het interieur is vrijwel verdwenen.


      Let op:

      - de sterk plastische gevel met rijk siermetselwerk

      - de complete set originele raamkozijnen

      '
    attributes:
      original_use: Café-restaurant
    sources:
    - city:200483
- title: Amsterdamsche Bank (The Bank)
  summary: The former head office of the Amsterdamsche Bank on the Rembrandtplein (1926–1932), by the
    Ouëndag office with advice from Berlage — a monumental brick bank, now shops and offices as The Bank.
  body: 'The Amsterdamsche Bank built its head office on the Rembrandtplein between 1926 and 1932. It
    was designed by the office of B.J. Ouëndag (father Bert Johan and son Willem Bert), who consulted
    H.P. Berlage; little of Berlage''s ideas is said to have survived. The original interior had much
    sculpture by Lambertus Zijl. The bank later merged into AMRO and ABN AMRO, which left the building
    in 2002; it was then the headquarters of TomTom. In the 1970s Zwiers and Fontein remodelled it and
    removed the skylight; a later renovation by Kees Rijnboutt brought back many original elements, and
    it now houses restaurants and offices as The Bank.


    Dutch sources and Wikidata class it as Amsterdam School; English-language sources tend to call it
    Art Deco.


    Look for:

    - the large brick volume closing the corner of the Rembrandtplein and Amstelstraat

    - tram tracks in the Amstelstraat that once let cash vans unload at the bank

    '
