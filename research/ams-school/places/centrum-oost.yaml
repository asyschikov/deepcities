- title: Dageraadsbrug (Brug 353)
  summary: A wide Piet Kramer bridge of 1934–1935 by the De Gooyer windmill, replacing a draw bridge that
    once expanded in the heat and would not close.
  body: 'The Dageraadsbrug links the Sarphatistraat with the Czaar Peterstraat across the Nieuwe Vaart,
    next to the De Gooyer windmill. Its predecessor, a swing bridge named after the De Dageraad shipyard,
    was notoriously unreliable — in 1922 it expanded so much in the heat that it could not be closed after
    opening. Piet Kramer designed a replacement in 1931, but the Depression delayed construction until
    1934–1935. The new fixed bridge multiplied the roadway width from 6.8 to 26.5 metres; tram 7 runs
    over it.


    Look for:

    - Kramer''s mix of brick and granite in the abutments

    - wrought-iron balustrades

    - no Hildo Krop sculpture here — a sign of the leaner 1930s

    '
