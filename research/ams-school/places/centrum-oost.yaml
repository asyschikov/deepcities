  nl:
    title: Werf Uilenburg
    summary: Werf en kantoor van Publieke Werken, afdelingen Riolering en Bruggen (1925–1926), waar Piet
      Kramer zijn bruggen ontwierp. Strenge, verspringende bakstenen volumes en de originele vergulde
      letters.
    body: 'De gemeente zocht al vanaf 1920 een nieuwe plek voor de afdeling Riolering, en later ook voor
      de afdeling Bruggen van Publieke Werken, die aan de Voormalige Stadstimmertuin te krap zat. Op het
      terrein van de vroegere scheepswerf Wed. F. Hindeloopen werd op 12 oktober 1925 aanbesteed; in oktober
      1926 verhuisden de diensten. Het ontwerp kwam van Publieke Werken zelf, onder leiding van stadsarchitect
      A.R. Hulshoff. Hier tekende Piet Kramer zijn Amsterdamse bruggen.


      Het gemeentelijk register ziet in de geometrische strengheid van de verspringende, plat afgedekte
      volumes de "lineaire expressieve variant" van de Amsterdamse School. Op het binnenterrein staat
      nog de dienstwoning van de Sophie Rosenthal Bewaarschool uit 1887. Ernaast staat de Uilenburger
      Synagoge uit 1766.


      Let op:

      - de vergulde bronzen letters PUBLIEKE WERKEN, AFDEELING RIOLEERING EN BRUGGEN boven de ingang

      - de twee lange vensterstroken met zestien roedenvensters in dik wit kozijnhout

      - het smalle, hoge en vrijwel gesloten hoekvolume dat als toren werkt

      - de herplaatste gevelsteen met het wapen van Portugal

      '
    attributes:
      original_use: Werf en kantoor van de afdelingen Riolering en Bruggen
      architect: Publieke Werken (onder A.R. Hulshoff)
      client: Gemeente Amsterdam
    sources:
