  nl:
    title: Geologisch Instituut en Laboratorium voor Organische Chemie (Roeterseiland)
    summary: Universiteitsgebouw van rond 1930 op de kop van het Roeterseiland, met laat, opmerkelijk
      anekdotisch beeldhouwwerk van Hildo Krop over paleontologie en geografie.
    body: 'Het complex rond een binnenplaats is rond 1930 vermoedelijk ontworpen door A.R. Hulshoff van
      Publieke Werken. Aan de Nieuwe Prinsengracht zat het Geologisch en Mineralogisch Instituut, aan
      de Nieuwe Achtergracht het Laboratorium voor Organische Chemie en Thermodynamica. Het gemeentelijk
      register noemt de geometrische strengheid kenmerkend voor de "lineaire expressieve variant" van
      de Amsterdamse Schoolstijl. De lange, geknikte volumes begrenzen de kop van het eiland, en aan de
      oostzijde wijken ze terug, zodat er een pleintje ontstaat.


      Het beeldhouwwerk, grotendeels in Franse kalksteen, is van Hildo Krop en verwijst naar paleontologie
      en geografie. Het register noemt dit late werk "opmerkelijk anekdotisch" en in de verte verwant
      aan het Berlijnse expressionisme.


      Let op:

      - het beeldhouwwerk van Krop op de hoeken en rond de ingangen

      - de ingang aan de Nieuwe Achtergracht met uitkragende volumes boven de gootlijst, waarvan één als
      vliesgevel met trappenhuis

      - de ingang aan de Nieuwe Prinsengracht met een vergelijkbaar volume en een torenachtige bekroning

      - de verticale vensterstroken als erkers (de stalen ramen zijn vervangen door aluminium)

      '
    attributes:
      original_use: Geologisch instituut en chemisch laboratorium van de universiteit
      architect: A.R. Hulshoff (Publieke Werken, vermoedelijk)
    sources:
    - city:209057
