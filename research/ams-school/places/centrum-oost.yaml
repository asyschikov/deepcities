    summary: Brug van Piet Kramer uit 1922 waarover de Vijzelstraat de Keizersgracht kruist, met natuurstenen
      pylonen waarin SPQA is gebeiteld.
    body: 'De brug in de Vijzelstraat over de Keizersgracht kreeg in 1922 bij een verbouwing haar huidige
      vorm naar ontwerp van Piet Kramer, voor de Afdeling Bruggen van Publieke Werken. Ze is genoemd naar
