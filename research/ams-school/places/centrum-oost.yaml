  nl:
    title: Theater Desmet
    summary: Theater uit 1879 dat in 1926–1927 een nieuwe witte voorgevel kreeg van Jan Boterenbrood,
      met kenmerken van Art Deco en Amsterdamse School. Later bioscoop Desmet, nu omroepstudio.
    body: 'A.L. van Gendt ontwierp het gebouw in 1879 als theater Frascati voor Gustave Prot. In 1892
      kwam er een wintertuin bij en in 1904 volgde een verbouwing door Ed. Cuypers, waarvan nog iets in
      de top te zien is. Het huidige aanzien is grotendeels van Jan Boterenbrood, die het in 1926–1927
      verbouwde tot het Rika Hoppertheater, genoemd naar een bekende actrice. Boterenbrood gold als vertegenwoordiger
      van de Amsterdamse School en ontwierp in de jaren twintig vooral woningbouw. Na 1946 maakte de familie
      Desmet er een bioscoop van; sinds 2000 is het een omroepstudio.


      De symmetrische gevel heeft een vlakke, heldere opbouw met stijlkenmerken van Art Deco en Amsterdamse
      School. Het pleisterwerk is niet origineel en veel detaillering is verloren gegaan.


      Let op:

      - de dubbele rondboogdeuren op de hoeken met bovenmaatse sluitstenen en een waaierroedenverdeling

      - de rode sierbanden die vanaf de luifel langs de pijlers lopen en op de hoeken tot het maaiveld
      afdalen

      - de getrapte gevelbeëindiging boven de strook van zeven kleine vensters

      '
    attributes:
      original_use: Theater, later bioscoop
      built: 1926–1927 (voorgevel); theater 1879
    sources:
    - city:205059
- title: Rembrandtplein 44
  summary: A 1918 café-restaurant front on the Rembrandtplein in what was then the "hypermodern" Amsterdam
    School style — an early, richly modelled brick façade on the city's nightlife square.
  body: 'The building on this site was a café-restaurant with a billiard hall and meeting rooms, designed
    by J.H. Lesmeister shortly after 1900. In 1918 the architect Van Schaik remodelled it completely and
    gave it a new front in the style De Klerk had only just introduced around the Spaarndammerplantsoen
    — still revolutionary at the time. The composition is basically symmetrical and conventional, but
    the strong plasticity and wealth of decorative brickwork announced a new era. The owner clearly wanted
    an eye-catching building to give his business a face on the square.


    The city register stresses that the style is rare in the old centre and calls this façade a remarkable
    example of the early, expressionist phase of the Amsterdam School. All original window frames survive;
    the original interior is almost entirely gone.


    Look for:

    - the strongly modelled brick façade with rich ornamental brickwork

    - the complete set of original window frames

    '
  category: commercial
  lat: 52.365768
  lng: 4.89721
  address: Rembrandtplein 44
  links:
  - label: Gemeentelijk monument (200483)
