- title: Liberty workshop (Metz & Co)
  summary: A 1926–1927 workshop for the Metz & Co department store, where Liberty fabrics were made up
    — yellow brick, an iron bay under a bronze roof and a grid of concrete glazing bars.
  body: 'Metz & Co, on the corner of the Leidsestraat and Keizersgracht, was the Amsterdam agent of the
    London store Liberty. In 1926–1927 it had this workshop (bedrijfsatelier) with shops and a dwelling
    built nearby in the Kerkstraat, designed by H.A. van Anrooy in what the national register calls an
    Expressionist and Amsterdam School style. It is protected as a functional part of the Metz & Co complex.


    Look for:

    - a façade partly in yellow brick and concrete on a stone plinth

    - at no. 45, a round-arched porch outlined by three bands of contrasting bond

    - an iron bay window under a little bronze-clad pointed roof

    - a large window field divided by vertical and horizontal concrete bars, crowned by four oval finials
    above the cornice

    '
