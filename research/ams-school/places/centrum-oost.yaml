  nl:
    title: Scheepvaarthuis
    summary: 'Het gebouw waarmee de Amsterdamse School begon: een kantoor voor zes rederijen op de punt
      van het Waalseiland, met een plattegrond als een scheepsboeg en gevels vol zeegoden, touwwerk, golven
      en vissenkoppen.'
    body: 'Het Scheepvaarthuis verrees op de westpunt van het Waalseiland, de plek waar Cornelis Houtman
      in 1595 vertrok voor de eerste reis naar Oost-Indië. Opdrachtgever was de NV Kantoorgebouw ''Het
      Scheepvaarthuis'', opgericht door zes Amsterdamse rederijen, onder wie de SMN, de KPM, de JCJL en
      de KNSM. Voor het gebouw moesten dertien panden aan de Prins Hendrikkade en de Binnenkant wijken.


      De gebroeders Van Gendt zorgden voor de uitvoering en het betonskelet; de architectonische vormgeving
      lieten ze over aan de toen nog onbekende Jo van der Mey, die zijn collega''s van het bureau van
      Eduard Cuypers, Michel de Klerk en Piet Kramer, erbij haalde. Het Rijksmonumentenregister noemt
      het "het eerste volledig in de stijl van de Amsterdamse School gerealiseerde bouwwerk": een betonskelet
      met ''aangeplakte'', uiterst plastisch bewogen wanden en dakvormen. Het beeldhouwwerk ontstond in
      een atelier onder leiding van Hendrik van den Eijnde, met onder anderen Hildo Krop, Anton Rädecker
      en Joop van Lunteren; W.C. Brouwer had de leiding eerder. Willem Bogtman maakte vrijwel al het glas
      in lood, Theo Nieuwenhuis de beraadzaal. De uitbreiding langs de Binnenkant volgde in 1926–1928;
      de stenen voor beide fasen werden tegelijk gebakken om kleurverschil te voorkomen.


      De rederijen vertrokken uiterlijk in 1981. Van 1983 tot 2004 was het GVB hier gevestigd, sinds 2007
      is het Grand Hotel Amrâth. Daardoor is ook het trappenhuis te bezichtigen.


      Let op:

      - de hoofdingang op de hoek, bekroond door een afgeknotte toren met koperkleurige Engelse leisteen,
      met personificaties van de oceanen

      - de loden dakrand in de vorm van scheepstouwen, golven en vissenkopjes

      - het rijke beeldhouwwerk met maritieme symbolen op de penanten tussen de ramen

      - het siersmeedwerk dat in het metselwerk overloopt

      - binnen: het centrale trappenhuis met smeedwerk en de glas-in-loodkap van Bogtman

      '
    attributes:
      original_use: Kantoorgebouw voor rederijen
      client: NV Kantoorgebouw Het Scheepvaarthuis (zes Amsterdamse rederijen)
      architect: Jo van der Mey, met Michel de Klerk en Piet Kramer (uitvoering A.D.N. en J.G. van Gendt)
