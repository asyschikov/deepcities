  nl:
    title: Archiefgebouw Incassobank
    summary: Vierkant bakstenen archiefgebouw van de Incassobank (1928–1929), afgebouwd door Jan Gratama,
      de bedenker van de naam Amsterdamsche School, en opvallend bekroond met een kap naar het voorbeeld
      van het Mauritshuis.
    body: 'De Incassobank had haar kantoor aan de Herengracht en liet op de plek van een oud koetshuis
      aan de Reguliersdwarsstraat een apart archiefgebouw bouwen. Het bureau Baanders maakte in 1920 een
      ontwerp in de stijl van de Amsterdamse School, maar de vergunning werd in 1923 ingetrokken. In 1927
      diende I. Blomhert een nieuw plan in. Op 16 juli 1928, tijdens de bouw, meldde de bank dat Jan Gratama
      zijn rol had overgenomen, waarschijnlijk na een conflict. Gratama had in 1916 de term "Amsterdamsche
      School" gemunt. De hoofdopzet van de gevel bleef al die tijd gelijk; Blomhert en Gratama pasten
      vooral de detaillering aan. In 1929 kreeg het gebouw alsnog een hoge kap in plaats van het geplande
      platte dak.


      Let op:

      - de negen ramen in drie spaarvelden tussen vier zware penanten

      - het siermetselwerk in de borstweringen

      - de drie fraaie blank gelakte deuren; de twee buitenste dienden waarschijnlijk voor expeditie

      - de hoge leien kap met forse hoekschoorstenen, een verwijzing naar het Mauritshuis (de brede dakkapel
      is uit de jaren vijftig)

      '
    attributes:
      original_use: Archiefgebouw van een bank
      architect: Jan Gratama (naar ontwerpen van Baanders en I. Blomhert)
    sources:
