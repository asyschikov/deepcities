  nl:
    title: Herengracht 513-515 / Vijzelstraat 22-28
    summary: 'Groot hoekgebouw van G.J. Rutgers uit 1928, gebouwd bij de verbreding van de Vijzelstraat:
      winkels, restaurants en woningen, aan de gracht gesplitst in schijnbaar twee gebouwen.'
    body: 'Om het toenemende verkeer te kunnen verwerken, werd de Vijzelstraat tussen 1914 en 1927 verbreed.
      Aan de westkant verrees daarbij hoge, bloksgewijze bebouwing onder stedenbouwkundige supervisie
      van K.P.C. de Bazel. Het was de eerste poging om in de binnenstad grootschalige architectuur met
      een sterk stedenbouwkundige component te realiseren. Op een hoekkavel waar ongeveer zeven panden
      hadden gestaan, bouwde G.J. Rutgers in 1928 dit complex. Op de begane grond zitten een winkel en
      twee restaurants, daarboven een insteekverdieping met kleine vierkante vensters en vijf woonlagen.


      Let op:

      - aan de Vijzelstraat het levendige reliëf met nadruk op de verticale geleding, en de bovenste verdieping
      die net als de kap met mastiekleien is bekleed

      - aan de Herengracht een symmetrisch hoofddeel en een lagere, iets teruggezette vleugel die aansluit
      op het monumentale buurpand

      - de poortdoorgang naar het achterterrein in de grachtvleugel

      '
    attributes:
      original_use: Woningen, winkel en restaurants
    sources:
    - city:207009
- title: Carlton Hotel (Grand Hotel Centraal)
  summary: Built 1925–1929 as the largest, most luxurious hotel in the Netherlands, bridging the Reguliersdwarsstraat.
    G.J. Rutgers' brick front carries Theo Vos's sculptures of the continents and world traffic.
  body: 'The widening of the Vijzelstraat made room for Grand Hotel Centraal, designed by G.J. Rutgers
    in the Amsterdam School style and built 1925–1929. It was the largest and most luxurious hotel of
    its day in the Netherlands — every room had a bathroom and telephone — and a banqueting hall bridges
    the Reguliersdwarsstraat. The client went bankrupt during construction; a British company took over
    and opened it as the Carlton in time for the 1928 Olympics. The set-back top floor was added by G.
    van Arkel and H.J. Breman. In the 1930s it hosted Louis Armstrong and Cab Calloway. In April 1943
    a downed British Halifax bomber crashed behind the hotel; the fire destroyed most of the block to
    the Singel, and Jan Wils led the restoration. The hotel is now called NH Flower Market. All original
    windows have been replaced.


    Look for:

    - the arcade of angular arches on heavy, downward-tapering piers, with grey granite in the brick

    - triangular bay windows between diagonally placed piers on the room floors

    - Theo Vos''s sculpture between mezzanine and first floor (allegories of world traffic and the continents)
    and figures of America and Europe on the short side

    - the broad balcony marking the span over the Reguliersdwarsstraat, and the stepped tower on the Singel
    side

    '
