  nl:
    title: Bakkerij Vijzelgracht 15
    summary: Winkelpui uit 1928 in Amsterdamse Schoolstijl, van zwart natuursteen, teak en glas in lood,
      met het originele bakkerij-interieur dat nog altijd als bakkerij in gebruik is.
    body: 'De voorgevel van het pand dateert uit 1881, maar in 1928 werd de winkelpui voor een bakkerij
      verbouwd in de toen modieuze Amsterdamse Schoolstijl. Die decoratieve stijl werd bij uitstek geschikt
      gevonden voor winkelpuien, en vaak werd de hele winkelinventaris meeontworpen. Bijzonder is volgens
      het gemeentelijk register dat het oorspronkelijke interieur bewaard is en nog steeds als bakkerij
      dienst doet. Over architect F.M. Kramer, niet te verwarren met Piet Kramer, is verder niets bekend.


      Let op:

      - de pui van zwart gepolijst natuursteen en teakhout, met een messing omrande etalage

      - de winkeldeur met glas in lood en een bewerkte greep

      - de teakhouten deur naar de bovenwoning met een klein kijkglaasje

      - binnen de originele bakkerij-inrichting

      '
    attributes:
      original_use: Bakkerij
      built: 1928 (winkelpui); pand 1881
    sources:
    - city:201042
- title: Weteringschans 193-195
  summary: 'A 1927 double shop-and-flats building on the Weteringschans in a stripped-down Amsterdam School
    style, dated in stone: "Anno DO=1927".'
  body: 'In 1927 C.J.H. Schol — a building draughtsman otherwise unknown in Amsterdam — designed this
    double building with two shops and two floors of flats for the Exploitatiemaatschappij Veka, replacing
    a two-storey predecessor. Wikipedia describes the style as a "stiffened" (verstrakte) form of the
    Amsterdam School; it is a municipal monument for the contemporary character of the design.


    Look for:

    - the date stone "Anno DO=1927"

    - ornamental ironwork over the stairwell opening

    - leaded-glass fanlights and the natural-stone plinth

    '
