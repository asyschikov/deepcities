- title: Walenweeshuissluis (Brug 70)
  summary: 'The last link in the widened Vijzelstraat: a Piet Kramer bridge over the Prinsengracht built
    1934–1935, in brick, stone and wrought iron.'
  body: 'Brug 70 carries the Vijzelstraat over the Prinsengracht to the filled-in Vijzelgracht. It was
    built in two halves between July 1934 and June 1935 so that traffic could keep moving, and was the
    last of the Vijzelstraat bridges to be finished because the filling of the Vijzelgracht was delayed.
    The design came from Piet Kramer''s office at Publieke Werken and his style is recognisable throughout.
    In 2020–2021 it was taken apart and rebuilt because of subsidence.


    Look for:

    - brick abutments and piers combined with natural stone

    - ornate wrought-iron balustrades

    - simple sculpted details attributed to Kramer himself

    '
