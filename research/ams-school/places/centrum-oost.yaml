  nl:
    title: Vijzelstraat 81 (apotheek Warmolts)
    summary: Kubistisch ogende hoekapotheek van Cornelis Kruyswijk (1926–1927), met cilindrische erkers,
      een doorlopende vensterstrook met Mondriaanachtig glas in lood en een beeldhouwwerk op de hoekpijler.
    body: 'Leonardus en Johanna Cornelia Warmolts hadden een homeopathische apotheek op Vijzelstraat 130,
      dat moest wijken voor de verbreding van de straat. Rond 1926 kochten ze deze hoek, lieten het pand
      uit 1670 slopen en schakelden Cornelis Kruyswijk in, een van de productiefste architecten van de
      Amsterdamse School. Op 10 september 1927 ging de apotheek weer open; ze bleef tot in de jaren zestig.
      Sinds 1985 zit er een opticien.


      Het gemeentelijk register benadrukt dat er door de stijl geen hoofd- en zijgevel is, maar één driedimensionaal
      ontwerp. Zoals bij oude hoekpanden in de buurt rust de hoek op een pijler met glas boven de plint.


      Let op:

      - het overkragende gemetselde vlak boven de etalages met een omlopende vensterstrook met ladderroeden
      (het glas in lood is deels verdwenen)

      - de cilindrische erker boven de ingang aan de gracht, die overgaat in een hoekerker over twee verdiepingen

      - de afgeronde natuurstenen hoekpijler met beeldhouwwerk naast de winkeldeur

      - twee zolderraampjes in insneden in de gevel, en een hijsbalk onder een erker

      '
    attributes:
      original_use: Apotheek met bovenwoningen
      client: L. en J.C. Warmolts
    sources:
    - city:201049
    - https://nl.wikipedia.org/wiki/Vijzelstraat_81
- title: Nieuwe Spiegelstraat 61
  summary: A small 1922 shop-house in the antiques street, where Kleinhout and Van der Steur made an inventive,
    sober Amsterdam School front out of one narrow plot — original shopfront and doors included.
  body: 'With plot width and height fixed, the architects G.H. Kleinhout and A.J. van der Steur could
    design little more than the street front and the interior — yet the city register praises the result
    as an inventive, contemporary façade in a sober Amsterdam School manner. It is rare that the shopfront
    survives: in this period shopkeepers modernised their fronts constantly. A.J. van der Steur (1895–1963)
    later edited the *Bouwkundig Weekblad Architectura* and chaired the Dutch architects'' association
    BNA.


    Look for:

    - a central display window between two doors in a tall stone frame partly clad in marble

    - original doors with diamond-shaped glazing bars in the fanlights, and three wooden bars in front
    of the lower panel of the left door

    - ornamental grilles over the two cellar windows

    - the almost undecorated dark-brown brick front above

    '
