  nl:
    title: Voormalig gebouw Gemeentelijke Geneeskundige Dienst
    summary: 'Gebouw van Publieke Werken uit 1923 aan de Nieuwe Achtergracht: vlakke symmetrische vleugels
      en een plastisch vormgegeven middenpartij in de zichtas van de Lepelkruisstraat.'
    body: 'Volgens het gemeentelijk monumentenregister liet Publieke Werken dit gebouw in 1923 bouwen
      voor de gemeentelijke geneeskundige dienst. Op de begane grond lagen wacht- en behandelkamers, op
      de verdiepingen kantoren; later kwamen er op de vierde verdieping laboratoria bij. Het ontstond
      in de bloeiperiode van Publieke Werken, wellicht dankzij de leiding van A.R. Hulshoff. De dominante
      middenpartij staat in de zichtas van de Lepelkruisstraat en de Nieuwe Prinsengracht.


      Let op:

      - de diepe sleuven die als zwarte lijnen de middenpartij van de vlakke zijvleugels scheiden

      - de horizontale stroken van forse zeslichtsvensters in donkerbruine baksteen

      - de twee zware, schuin geplaatste natuurstenen stijlen naast de diepliggende, blank gelakte voordeur

      - het licht gebogen volume op de eerste verdieping met kleine vierkante ruitjes, gedragen door afgeronde
      pijlers

      - binnen de taps toelopende plafonds in de gangen

      '
    attributes:
      original_use: Kantoor en spreekuurlokalen van de gemeentelijke geneeskundige dienst
      client: Gemeente Amsterdam
    sources:
    - city:205026
- title: Geological and Chemistry Institute (Roeterseiland)
  summary: A c. 1930 university institute closing the tip of the Roeterseiland, with Hildo Krop's late,
    anecdotal limestone sculpture of fossils and geography.
  body: 'Built around a courtyard about 1930, probably to a design by A.R. Hulshoff of Publieke Werken,
    the complex housed the university''s Geological and Mineralogical Institute on the Nieuwe Prinsengracht
    side and the Laboratory for Organic Chemistry and Thermodynamics on the Nieuwe Achtergracht. The city
    register calls its geometric strictness typical of the linear expressive variant of the Amsterdam
    School. The long, angled volumes frame the head of the island, and on the east side they step back
    to form a small square.


    The sculpture, mostly in French limestone, was designed by Hildo Krop and refers to palaeontology
    and geography; the register calls this late work remarkably anecdotal and distantly related to Berlin
    expressionism.


    Look for:

    - Krop''s sculpture at corners and entrances

    - the entrance on the Nieuwe Achtergracht, marked by cantilevered volumes rising above the eaves,
    one a glazed stair tower

    - a similar glazed volume with a tower-like crown at the Nieuwe Prinsengracht entrance

    - vertical window strips set as bays (the original steel windows were replaced by aluminium)

    '
  category: schools
