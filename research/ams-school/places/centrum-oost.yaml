  nl:
    title: Kriterion
    summary: In 1924 gebouwd als uitbreiding van het verenigingsgebouw van de Handwerkers Vriendenkring,
      in heldere Amsterdamse School-trant. Sinds de jaren vijftig de studentenbioscoop Kriterion.
    body: 'G.H. Kleinhout en A.J. van der Steur bouwden in 1924 aan de Roetersstraat een uitbreiding van
      het verenigingsgebouw van de Handwerkers Vriendenkring uit 1898. Er kwamen een koffiekamer, een
      grote vergaderzaal en een dienstwoning in. Begin jaren vijftig verbouwde J. Teders het tot bioscoop
      in opdracht van de Stichting Onderlinge Studenten Steun, zodat studenten hun studie konden verdienen
      door er te werken. Kriterion wordt nog steeds door studenten gerund, wat het gebouw volgens het
      gemeentelijk register ook cultuurhistorische waarde geeft.


      Let op:

      - de heldere, symmetrische gevel met een risalerend en in kleur contrasterend deel op de eerste
      verdieping, waar de vergaderzaal zat

      - de verdiept geplaatste, grotendeels transparante houten pui

      - in het café, de vroegere koffiekamer, nog sporen van de oorspronkelijke aankleding

      '
    attributes:
      original_use: Uitbreiding verenigingsgebouw (vergaderzaal, koffiekamer)
      architect: G.H. Kleinhout en A.J. van der Steur
    sources:
    - city:211033
- title: Former Municipal Health Service (GGD) building
  summary: 'The 1923 Public Works building for the city health service on the Nieuwe Achtergracht: flat
    symmetrical wings and a sculpted central entrance on the axis of the Lepelkruisstraat.'
  body: 'According to the city monument register, Publieke Werken completed this building in 1923 for
    the Gemeentelijke Geneeskundige Dienst (municipal health service), with waiting and treatment rooms
    on the ground floor and offices above; laboratories were later added on the top floor. It dates from
    the heyday of Publieke Werken, probably under the leadership of A.R. Hulshoff. The symmetrical building
    sits on the sightline of the Lepelkruisstraat and the Nieuwe Prinsengracht.


    Look for:

    - deep slots that separate the sculpted central section from the flat side wings like black lines

    - long horizontal strips of large six-light windows in dark-brown brick

    - two heavy, slanting stone posts flanking the deep-set varnished entrance door

    - a gently curved first-floor volume with small square panes, resting on rounded piers

    '
  category: public-works
  lat: 52.362527
