  nl:
    title: Dubbele school Nieuwe Uilenburgerstraat
    summary: 'Twee lagere scholen uit 1920 rond één speelplaats, met straatgevels die elk op hun overkant
      reageren: zware donkerbruine baksteen met metselmozaïeken.'
    body: 'Als onderdeel van de sanering van Uilenburg bouwde Publieke Werken in 1920 dit U-vormige complex
      voor twee scholen voor gewoon lager onderwijs, rond een gemeenschappelijke speelplaats. Aan de Nieuwe
      Uilenburgerstraat staat een symmetrische gangenschool, aan de Oude Schans/Nieuwe Batavierstraat
      een ''hoekschool''. Ertussen ligt een lage vleugel met het gymnastiek- en speellokaal. De indeling
      volgt de toenmalige ideeën over hygiëne en licht: de lokalen liggen op het zuidoosten en de wc''s
      zijn door gangen van de lokalen gescheiden. In het gemeentelijk register heet het complex Jonas
      Daniël Meijerschool.


      Let op:

      - de straatgevels, die elk anders zijn vormgegeven en inspelen op de bebouwing aan de overkant

      - de zware muren van donkerbruine baksteen met kleine en grote roedenvensters in wit kozijnhout

      - de metselmozaïeken boven de vensters van de tweede verdieping

      '
    attributes:
      original_use: Twee openbare lagere scholen
      client: Gemeente Amsterdam
    sources:
    - city:202039
- title: Plantage Kerklaan 37
  summary: 'A rare Amsterdam School house in the old centre (1921): an angled bay, a stirrup-shaped brick
    gable and an expressive brick box around the hoisting beam, among the ornate 19th-century villas of
    the Plantage.'
  body: 'Among the catalogue-ornamented villas of the Plantage, this house with a café on the ground floor
    (1921) stands out sharply. Its architect, Th. Kint, was no De Klerk or Kramer; the city register presents
    him as typical of the generation of mostly anonymous architects who adopted the principles of the
    Amsterdam School. They built widely in the new districts, but examples in the old centre are rare.


    Look for:

    - the stirrup-shaped (stijgbeugel) gable, a motif introduced around 1911 at the Scheepvaarthuis and
    De Klerk''s houses on the Johannes Vermeerplein

    - the bay window with two chamfered sides running up through the orange handmade brick

    - the sculpted brick box built around the hoisting beam, and a flagpole holder in sober Amsterdam
    School style

    - the ground floor in white-plastered stone, a modern take on a row of columns

    '
  category: houses
  lat: 52.366907
  lng: 4.911983
  address: Plantage Kerklaan 37
