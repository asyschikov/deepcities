  nl:
    title: Jan de Liefdeschool (De Boomspijker)
    summary: Christelijke lagere school uit 1929–1930 aan de Recht Boomssloot, met hoge laddervormige
      erkervensters die om de hoek lopen. Sinds 1977 buurthuis De Boomspijker.
    body: 'De Jan de Liefdeschool kwam in 1929–1930 tot stand op de hoek van de Recht Boomssloot en de
      Korte Koningsdwarsstraat, in opdracht van de Vereniging tot Heil des Volks. Architect A. Ingwersen
      ontwierp haar in wat het Rijksmonumentenregister de Late Amsterdamse School-stijl noemt; het betonwerk
      was van G. Lotgerink. In 1977 verbouwde architectenbureau Joh. Nust de school tot buurthuis De Boomspijker.


      Het gebouw bestaat uit twee tegen elkaar geplaatste volumes: een langwerpig deel onder een schuin
      oplopend plat dak en een hoger hoekdeel met puntgevel, beide gedekt met zwarte pannen.


      Let op:

      - de twee erkers over meerdere verdiepingen met hoge, laddervormige glas-in-loodvensters die om
      de hoeken doorlopen

      - de kleine, meest per drie gekoppelde vensters met fijn verdeelde bovenlichten

      - de hoge schoorsteen op de hoek, die ver boven de gootlijst uitsteekt

      '
    attributes:
      original_use: Christelijke lagere school
    sources:
    - rce:518414
- title: Flesseman
  summary: A 1926 department-store warehouse on the Nieuwmarkt by Hendrik Wijdeveld, the editor of Wendingen
    — with a little tower, rounded bays and a big clock. Now a care home.
  body: 'In 1925 the clothing wholesaler I.L. Flesseman demolished a row of old houses on the Nieuwmarkt
    — including two seventeenth-century houses — for a new warehouse and office. The façades were designed
    by Hendrik Wijdeveld, the editor of the Amsterdam School magazine *Wendingen*, with Jordanus Roodenburgh
    responsible for the construction. The building opened on 16 January 1927; the socialist paper *Het
    Volk* praised it as a piece of "beautiful architecture" for the neighbourhood.


    The roughly 30-metre-high block of red brick on a stone plinth is a variant of the Amsterdam School:
    a small tower, distinctive window bands (some wrapping round corners), rounded façade sections, a
    cantilevered first floor and a large clock. Flesseman left in 1961. After the metro works of the 1970s
    it was converted (1986–1988, CAV architects) into a care home with new wings along the Sint Antoniesbreestraat
    and Dijkstraat; an external insulation layer added then has blurred much of the original brick façade.


    Look for:

    - the tower and clock facing the Nieuwmarkt

    - corner windows and rounded façade sections

    - over the entrance, copies of two seventeenth-century gable stones (St Andrew and St James) from
    the houses demolished for the building

    '
