  nl:
    title: Voormalig badhuis Uilenburg (Splendor)
    summary: Gemeentebadhuis met sectiepost van Stadsreiniging, ontworpen in 1919, in felrode en zwart
      geglazuurde baksteen rond een binnenplaats. Sinds 2013 het muziekgebouw Splendor.
    body: 'Publieke Werken ontwierp dit U-vormige complex in 1919 voor een gemeentebadhuis en een sectiepost
      van de dienst Stadsreiniging. Het badhuis was verdeeld in een mannen- en een vrouwenafdeling, elk
      met een kleedruimte, douches en badlokalen en een eigen wachtkamer. De sectiepost had kantoren,
      bergingen, een schaftlokaal en een conciërgewoning. Later zat er een rijwielfabriek. Tussen 2010
      en 2013 werd het verbouwd tot Splendor, een muziekgebouw dat door zo''n vijftig musici wordt gerund.


      Let op:

      - de opvallend helderrode baksteen boven een borstwering van grote zwart geglazuurde stenen in staand
      verband

      - het middendeel met de poort, geheel in zwart geglazuurde steen, met plastische natuurstenen hoekblokken
      en een dubbel ijzeren poorthek in Amsterdamse Schoolstijl

      - de hoger opgetrokken bouwmuren die de overgang tussen de bouwdelen markeren

      '
    attributes:
      original_use: Gemeentebadhuis en sectiepost Stadsreiniging
      client: Gemeente Amsterdam
    sources:
