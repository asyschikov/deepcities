- title: Koningssluis (Brug 29)
  summary: The first of three matching Piet Kramer bridges along the Leidsestraat (1921), with four fabulous
    beasts carved by Hildo Krop.
  body: 'Where the Leidsestraat meets the Koningsplein, the Koningssluis crosses the Herengracht. In 1921
    Piet Kramer, the bridge architect of Publieke Werken, rebuilt it in Amsterdam School style; the sculpture
    had already been designed in 1916 by Hildo Krop and was executed by the firm of Johan Polet. Brug
    43 (Keizersgracht) and Brug 68 (Prinsengracht) further down the Leidsestraat follow the same design
    — walking the street you cross all three.


    Look for:

    - four carved fabulous beasts (fabeldieren) on the capping stones

    - brick wing walls stepped horizontally with a brickwork motif, resting on stone blocks at the waterline

    - piers stepped vertically into stone corbels, carrying a wrought-iron balustrade

    '
