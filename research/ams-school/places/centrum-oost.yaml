  nl:
    title: Dageraadsbrug (brug 353)
    summary: Brede brug van Piet Kramer bij molen De Gooyer (1934–1935), opvolger van een draaibrug die
      in 1922 door de hitte zo uitzette dat hij niet meer dicht kon.
    body: 'De Dageraadsbrug verbindt de Sarphatistraat met de Czaar Peterstraat over de Nieuwe Vaart,
      naast molen De Gooyer. De naam komt van de scheepswerf De Dageraad. De vorige draaibrug was berucht:
      in 1922 zette hij in de hitte zo uit dat hij na een opening niet meer sloot. Piet Kramer ontwierp
      al in 1931 een vervanger, maar door de crisis werd die pas in 1934–1935 gebouwd. Hij tekende een
      brug in baksteen en graniet met siersmeedijzeren balustrades; beeldhouwwerk van Hildo Krop ontbreekt.
      De rijbaan werd verbreed van 6,83 tot 26,5 meter. Tramlijn 7 rijdt eroverheen.


      Let op:

      - Kramers combinatie van baksteen en graniet in de landhoofden

      - de siersmeedijzeren balustrades

      '
