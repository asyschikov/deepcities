  nl:
    title: Liberty-atelier (Metz & Co)
    summary: Bedrijfsatelier van Metz & Co uit 1926–1927 in de Kerkstraat, in gele baksteen en beton,
      met een ijzeren erker onder een bronzen puntdakje en een raster van betonnen roeden.
    body: 'Metz & Co op de hoek van de Leidsestraat en de Keizersgracht verkocht stoffen en meubels van
      het Londense Liberty. In 1926–1927 liet de firma vlakbij in de Kerkstraat een bedrijfsatelier met
      winkels en een woning bouwen, naar ontwerp van H.A. van Anrooy. Het Rijksmonumentenregister noemt
      de stijl expressionistisch en Amsterdamse School. Uitvoerder was B.C. Stein. Het pand is beschermd
      als functioneel onderdeel van het complex van Metz & Co.


      Let op:

      - de gevel van deels gele baksteen en beton op een natuurstenen plint

      - bij nummer 45 de rondboogportiek, omlijst door drie banden in afwijkend metselverband

      - de ijzeren erker onder een met bronsplaat bekleed puntdakje

      - het grote vlak met betonnen roeden en de vier ovale bekroningen boven de daklijst

      '
    attributes:
      original_use: Bedrijfsatelier met winkels en woning
    sources:
    - rce:518358
- title: Vijzelstraat 81 (Warmolts pharmacy)
  summary: A cubist-looking corner pharmacy of 1926–1927 by Cornelis Kruyswijk, with cylindrical bays,
    a wrap-around window strip with Mondrian-like leaded glass and a sculpted keystone on the corner pillar.
  body: 'Leonardus and Johanna Warmolts ran a homeopathic pharmacy at Vijzelstraat 130 until the street
    widening forced them out. Around 1926 they bought this corner, demolished the 1670 house on it and
    commissioned Cornelis Kruyswijk, one of the most productive Amsterdam School architects. The pharmacy
    reopened on 10 September 1927 and stayed until the 1960s; since 1985 an optician has occupied the
    shop.


    Because of the style there is no front or side façade but one three-dimensional design. Like the old
    corner houses in the area, the corner rests on a pillar with glass above the plinth.


    Look for:

    - the cantilevered band over the shop windows with a wrap-around strip of ladder-divided windows (some
    Mondrian-like leaded glass is missing)

    - a cylindrical bay over the canal entrance flowing into a two-storey corner bay

    - the rounded stone corner pillar with sculpture next to the shop door

    - two attic windows cut into the brick, and a hoisting beam under a bay

    '
