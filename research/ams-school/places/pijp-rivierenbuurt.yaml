  nl:
    title: Winkelgalerijen Victorieplein (Kruyswijk)
    summary: De twee identieke blokken van Cornelis Kruyswijk waar de Vrijheidslaan het Victorieplein
      bereikt, met etagewoningen boven overdekte winkelgalerijen en glas-in-lood in Amsterdamse Schoolstijl.
    body: 'Het complex kwam in 1924-1929 tot stand en bestaat uit twee identieke, tegenover elkaar geplaatste
      blokken met etagewoningen boven een winkelgalerij, naar een ontwerp in sobere Amsterdamse Schoolstijl
      van C. Kruyswijk. Het noordelijke blok werd gebouwd voor de N.V. Bouw- en Exploitatie Mij. "Trompzicht",
      het zuidelijke voor de N.V. Bouw- en Exploitatie Mij. "Rudolf". De gewapend-betonconstructie leverde
      D.J. Haverkamp.


      In 1961 werd de zolderverdieping verlaagd en kwam er een daklijst. Bij een recente renovatie van
      het zuidelijke blok is de oorspronkelijke situatie hersteld.


      Let op:

      - de galerijen aan de Vrijheidslaan, met per galerij drie portieken met elk vier toegangen: twee
      voor winkels en twee voor de bovenwoningen

      - het glas-in-lood in de bovenlichten van de etalages

      - de grotendeels nog aanwezige oorspronkelijke voordeuren en roedenverdeling

      '
    attributes:
      original_use: Etagewoningen boven winkelgalerijen
    sources:
    - https://api.data.amsterdam.nl/v1/monumenten/monumenten/?monumentnummer=222245
- title: 12-verdiepingenhuis (De Wolkenkrabber)
  summary: 'Amsterdam''s first residential tower, J.F. Staal''s 12-storey ''Skyscraper'' of 1930–1932
    on the Victorieplein: the Amsterdam School stepping into steel, glass and the Nieuwe Bouwen.'
  body: 'Berlage wanted towers to mark the key points of Plan Zuid. This is one of the few that were built,
    though to a design by Jan Frederik Staal. Plans date from 1927; the building code allowed only four
    storeys of flats and had to be changed first. Construction started in 1930 and the 40-metre tower
    was finished in 1932. Its six-room flats had an intercom, fast lifts, a refuse chute, refrigerators
    and central heating, and it was soon nicknamed De Wolkenkrabber (The Skyscraper). It closes the view
    down the Vrijheidslaan, with Staal''s lower blocks for the same developer, Hilwis, flanking it.


    The tower is a "late" case: Staal was an Amsterdam School architect and an editor of *Wendingen*,
    but here the brick sculpture gives way to horizontal bands of windows and balconies. In 1933 the Frank
    family, refugees from Germany, moved into Merwedeplein 37, one of the flanking blocks by Staal; Anne
    Frank lived there until 1942.


    Look for:

    - the tower''s horizontal bands of windows and balconies, read from the far end of the Vrijheidslaan

    - the Hildo Krop statue of Berlage on the Victorieplein in front

    - the lower Staal blocks along the Merwedeplein and Victorieplein

    '
  category: housing
  lat: 52.345964
  lng: 4.902668
  address: Victorieplein 45-47, Deltastraat 1-2
  links:
  - label: Rijksmonumentenregister (532002)
    url: https://monumentenregister.cultureelerfgoed.nl/monumenten/532002
  - label: Gemeentelijk monument (222240)
