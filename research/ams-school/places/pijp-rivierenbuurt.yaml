  nl:
    title: Rooseveltlaan en Maasstraat (Baanders)
    summary: Late Amsterdamse Schoolwoningbouw uit 1932-1934 van het bureau Baanders, deels betaald uit
      een negentiende-eeuws luthers legaat, met torenachtige hoeken bij de Maasstraat.
    body: 'Het complex is gebouwd in 1932-1934 naar ontwerp van het architectenbureau Baanders, in opdracht
      van de N.V. Bouw- en Handelmij. "Broco I". Volgens een gedenksteen in het midden van de gevelwand
      aan de Rooseveltlaan is het deel ten zuidwesten van de Maasstraat gebouwd in opdracht van "de Evangelisch
      Luthersche Gemeente te Amsterdam uit een legaat van J.R. Kemper overleden den zestienden januari
      1879". Dat deel verrees in 1932-1933, het noordoostelijke deel in 1934.


      De gevels aan de Rooseveltlaan tellen vijf bouwlagen, de bovenste als mezzanino, onder platte daken
      met een afgeschuind voorschild. Aan de Maasstraat zijn het vier bouwlagen onder zadeldaken, met
      kantoren en winkels op de begane grond.


      Let op:

      - de gedenksteen voor Kemper midden in de gevelwand aan de Rooseveltlaan

      - de twee torenachtige hoeken bij de Maasstraat, die als stadspoort de entree van de winkelstraat
      markeren

      - het verschil tussen de gevel aan de laan en die aan de winkelstraat

      '
    attributes:
      architect: Architectenbureau Baanders
      original_use: Woningen, kantoren en winkels
    sources:
