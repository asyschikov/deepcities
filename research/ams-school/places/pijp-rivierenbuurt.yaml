  nl:
    title: Judith Leysterbrug
    summary: 'De drukke brug 176 van Piet Kramer in de Stadhouderskade over de Boerenwetering: zonder
      beelden of brughuisjes, maar met zijn sierbalustrades en granieten steunen.'
    body: 'In 1890 verving een vaste brug hier een hoge sluis. In 1920 was die brug zo beschadigd dat
      ze een half jaar dicht moest. In mei 1924 besteedde de gemeente een nieuwe brug aan naar ontwerp
      van Piet Kramer; in februari 1925 kon ze open zodra de Boerenwetering op hetzelfde peil als de Singelgracht
      was gebracht. De aanleg kostte 51.000 gulden.


      Het is een eenvoudige Kramerbrug, zonder brughuisjes en zonder beeldhouwwerk van Hildo Krop, maar
      met horizontaal en verticaal gemetselde baksteen, granieten steunen en de voor Kramer kenmerkende
      sierbalustrades. De brug heette officieus Stadhoudersbrug en kreeg later de naam van de schilderes
      Judith Leyster.


      Let op:

      - het afwisselend liggend en staand gemetselde baksteen

      - de smeedijzeren balustrades en de granieten blokken op de hoeken

      '
    attributes:
      architect: Piet Kramer (Dienst der Publieke Werken)
      client: Gemeente Amsterdam
      original_use: Verkeersbrug
    sources:
    - https://nl.wikipedia.org/wiki/Judith_Leysterbrug
- title: P.L. Kramerbrug
  summary: 'The bridge named after its designer: Piet Kramer''s showpiece where the Amstel meets the Amstelkanaal,
    with Hildo Krop''s seals, shipworms and Gijsbrecht van Amstel.'
  body: 'Bridge 400 carries the Amsteldijk across the mouth of the Amstelkanaal, on the old radial route
    along the Amstel into the city and the main link between Plan Zuid and the old town. Piet Kramer designed
    it in 1917 and it was finished in 1921. As usual, Public Works'' bridge department did the engineering
    in steel and concrete while Kramer gave it its brick, granite and iron form.


    Hildo Krop''s granite sculpture refers to the sea that made the city rich and to its history: seals,
    sea lions and shipworms, the medieval lord Gijsbrecht van Amstel and a cog ship. The register calls
    it a characteristic example of an expressionist traffic structure, fitting the housing blocks around
    it.


    Look for:

    - semicircular brick balconies on the Amstel side with a view over the river, their wavy edge turning
    into a carved seal

    - shipworm and seal reliefs on the piers, and the knight and cog on the canal side

    - the wrought-iron railing that seems to hang from its top rail

    - two small hexagonal houses along the canal, built for the electricity company and the parks department

    '
  category: bridges
  lat: 52.349838
  lng: 4.909785
  address: Amsteldijk over the Amstelkanaal (brug 400), opposite Amstelkade 1
  links:
