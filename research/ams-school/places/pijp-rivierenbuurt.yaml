  nl:
    title: Dick Schmüllbrug
    summary: Een van de laatste bruggen van Piet Kramer, ontworpen in 1931 en gebouwd tijdens de bezetting,
      met beeldhouwwerk van Hildo Krop en een zitbank.
    body: 'Brug 415 ligt in de Parnassusweg over het Zuider Amstelkanaal. Piet Kramer ontwierp haar samen
      met de Dienst der Publieke Werken; de plannen dateren uit 1931, toen er 1.150.000 gulden werd vrijgemaakt
      voor acht bruggen. De bouw, ter vervanging van een ijzeren noodbrug, begon pas in juli 1940. In
      juli 1941 konden voetgangers en fietsers erover, begin 1942 werd de brug geopend. Het gebied ten
      zuiden ervan was toen nog niemandsland; pas in de jaren vijftig kwam daar bebouwing.


      De brug heeft een zitbank en twee beeldhouwwerken van Hildo Krop, "Ode aan Berlage" en "Muze". Tot
      2016 stond ze officieus te boek als Parnassusbrug; in juli 2022 werd ze per raadsbesluit vernoemd
      naar de Amsterdamse volley- en basketbalpromotor Dick Schmüll.


      Let op:

      - de twee beelden van Krop op de borstweringen

      - de zitbank in de brug

      - de soberder combinatie van baksteen en graniet dan bij Kramers bruggen uit het begin van de jaren
      twintig

      '
    attributes:
      architect: Piet Kramer (Dienst der Publieke Werken)
      client: Gemeente Amsterdam
      original_use: Verkeersbrug
    sources:
    - https://nl.wikipedia.org/wiki/Dick_Schmüllbrug
- title: Gemaal Stadwijck
  summary: A 1921 polder pumping station on the Amstel by A.J. Westerman, with its machinist's and lock
    keeper's houses, shown at the Paris exhibition of 1925 and still at work.
  body: 'When the polder where the Rivierenbuurt now stands was raised with sand, the old steam pumping
    station on the site of today''s Meerhuizenstraat could no longer work. In 1921 the city built this
    replacement on the Amsteldijk, named after the farmstead Stadwyck demolished here in 1915–1916. A.J.
    Westerman of Public Works designed it, and at the same time the machinist''s house next door, the
    Zorgvliedbrug and the Zorgvlied lock were built. The design was shown at the Paris decorative arts
    exhibition of 1925.


    It still drains the Binnendijkse Buitenvelderse polder, lifting water about 1.6 metres from the polder
    into the Amstel with two electric centrifugal pumps, and is run by Waternet. The pumping station,
    machinist''s house and lock keeper''s house are municipal monuments.


    Look for:

    - the pumping station''s sculptural brick mass on the Amstel bank

    - the machinist''s house on the Amsteldijk and the lock keeper''s house on the Zuidelijke Wandelweg,
    designed as one group

    - the lock and the Zorgvliedbrug right beside it

    '
  category: public-works
  lat: 52.33572
  lng: 4.905377
  address: Amsteldijk 271-272, Zuidelijke Wandelweg 25
  links:
  - label: Gemeentelijk monument (200882)
