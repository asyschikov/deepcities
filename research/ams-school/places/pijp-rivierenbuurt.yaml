- title: De Dageraad
  summary: 'The socialist housing estate where Michel de Klerk and Piet Kramer let brick ripple, bulge
    and climb: the most exuberant ensemble the Amsterdam School ever built.'
  body: 'The socialist housing association De Dageraad (The Dawn) commissioned Michel de Klerk and Piet
    Kramer in 1920 to design 294 dwellings and six shops on a plot in Berlage''s Plan Zuid that had first
    been reserved for a hospital. The street pattern still follows that hospital plan: a Y of P.L. Takstraat
    and Burgemeester Tellegenstraat, with two small squares, the Henriëtte Ronnerplein and Thérèse Schwartzeplein,
    tucked in on either side. De Klerk is credited with the façades around the squares, Kramer with much
    of the street walls. It became the best-known workers'' housing of the movement after Het Schip.


    The national register calls it the Amsterdam School "in its most lively, irrational phase": walls
    that undulate, roofs that do no structural work, and plans subordinated to the outside effect. A visitor
    centre, Museum De Dageraad, runs tours from Burgemeester Tellegenstraat 128.


    Look for:

    - the two corner buildings where P.L. Takstraat meets Burgemeester Tellegenstraat: stacked, receding
    brick cylinders like a castle

    - the brick memorial to P.L. Tak, the association''s founder, built into P.L. Takstraat 1 and unveiled
    by alderman Floor Wibaut on 29 March 1924

    - the line between red and yellow brick rising and falling along P.L. Takstraat as if a wave ran through
    it

    - the bust of Wibaut on the corner of Henriëtte Ronnerstraat and Henriëtte Ronnerplein, and the round
    "tower" with ship''s-bow windows on Burgemeester Tellegenstraat

    '
  category: housing
