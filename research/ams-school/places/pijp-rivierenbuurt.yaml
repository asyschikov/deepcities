- title: Rooseveltlaan and Maasstraat (Baanders)
  summary: Late Amsterdam School housing of 1932–1934 by the Baanders office, partly paid for by a 19th-century
    Lutheran legacy, with tower-like corners at the Maasstraat.
  body: 'The Baanders office designed these two parts of closed blocks on the Rooseveltlaan and Maasstraat
    for the developer Broco I, built in 1932–1934. A memorial stone in the middle of the Rooseveltlaan
    front records that the part south-west of the Maasstraat was built for the Evangelical Lutheran congregation
    of Amsterdam from the legacy of J.R. Kemper, who died on 16 January 1879. That part went up in 1932–1933,
    the north-eastern part in 1934.


    The Rooseveltlaan fronts have five storeys, the top one a mezzanine, under flat roofs with a sloping
    front edge; the Maasstraat fronts have four storeys under pitched roofs, with offices and shops at
    street level. Large private gardens and school buildings fill the inside of the blocks.


    Look for:

    - the Kemper memorial stone in the centre of the Rooseveltlaan wall

    - the two tower-like corners where the Maasstraat leaves the Rooseveltlaan, a city gate into the shopping
    street

    - the difference between the grand avenue front and the shopping-street front

    '
  category: housing
  lat: 52.342587
  lng: 4.896732
  address: Rooseveltlaan 69-213, Maasstraat
