- title: Pastelstraat blocks (Gulden & Geldmaker)
  summary: Two sturdy social-housing blocks on the Amstelkanaal by the SDAP architects Gulden and Geldmaker,
    with corners that jut out like a ship's prow.
  body: 'Zeeger Gulden and Melle Geldmaker were Amsterdam''s housing specialists: they drew dwelling plans
    for Berlage, Van der Mey and Staal, published on rationalised housing, and were active in the socialist
    SDAP. These two blocks of 1921–1923 were built for the housing associations Amsterdam-Zuid and Rochdale.
    Each wraps around a private inner area, with small side streets of an intimate, enclosed character,
    exactly as Plan Zuid intended.


    The city register describes the style as a sober variant of the Amsterdam School: compact, massive
    volumes enlivened by simple but careful detail, with the accent on the corners and centres. The complex
    was thoroughly renovated in 1985.


    Look for:

    - the corner sections whose projecting gables are built like the bow of a ship

    - porches set in panels of dark-red decorative brickwork with folded reveals, and sculpted wooden
    doors

    - weatherboarded upper parts and mansard roofs above four storeys of red-brown brick

    '
  category: housing
  lat: 52.350446
  lng: 4.895339
  address: Pastelstraat 1-50, Jozef Israëlskade 50-53, Tweede Van der Helststraat, Mesdagstraat
  links:
