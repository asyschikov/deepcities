  nl:
    title: Rijnstraat 24-58 en IJselstraat (Boterenbrood, Greiner)
    summary: Een doorlopende winkelstraatwand aan de Rijnstraat van Jan Boterenbrood en Dick Greiner,
      gebouwd in 1921-1922, in de latere, verstrakte fase van de Amsterdamse School.
    body: 'De Rijnstraat werd op 22 maart 1922 vernoemd en groeide uit van buurtstraat tot radiale uitvalsweg
      richting Utrecht, en sinds de jaren dertig tot winkelstraat van de Rivierenbuurt. De gevelwand van
      nummer 24 tot en met 58 bestaat uit meerdere gemeentelijke monumenten (1980), onderbroken door de
      ingang van de IJselstraat. Jan Boterenbrood ontwierp Rijnstraat 24-30 en 36-54, Dick Greiner de
      hoek met de IJselstraat, allemaal in 1921-1922.


      De bouwtekeningen van Rijnstraat 36-42 vermelden nog "Van Woustraat", omdat de straatnaam toen nog
      niet vaststond. Opdrachtgevers waren volgens de Nederlandse Wikipedia particulieren, onder wie C.J.
      en E. van Poelwijck en P. Prins.


      Let op:

      - hoe één ontwerp doorloopt over afzonderlijk gebouwde delen, zodat de straat als één wand leest

      - de hoekoplossing bij de IJselstraat

      - de originele winkelpuien en deuren met bovenlicht

      '
    attributes:
      original_use: Woningen en winkels
