- title: Remise Lekstraat
  summary: Once the largest tram depot in Europe, built by Public Works in 1927–1930 for 320 trams, with
    Hildo Krop's openwork relief of the city map. Still in use by the GVB.
  body: 'In 1918 the municipal tram company put up a wooden temporary shed on the Amsteldijk, on land
    reserved for a new depot. In 1925 the city decided to build it properly. The first half came into
    use on 27 August 1927; the wooden shed was then demolished for the second half, which opened in 1930.
    With room for 320 trams it was the largest tram depot in Europe. It is still Amsterdam''s second tram
    depot, a one-way building where trams enter from the Amsteldijk side and leave on the Lekstraat side.


    Public Works designed it in a businesslike expressionist manner: long brick walls with the main accents
    at the entrances and the offices.


    Look for:

    - Hildo Krop''s openwork relief showing the map of Amsterdam

    - the tram entrances on the Amsteldijk and the exits on the Lekstraat

    '
  category: public-works
  lat: 52.34556
  lng: 4.91056
  address: Amsteldijk 153, Kromme-Mijdrechtstraat 25, Lekstraat
