- title: Zorgvlied cemetery gates
  summary: The 1926 brick piers, iron gates and lanterns of Zorgvlied cemetery on the Amsteldijk, with
    the name lettered in Amsterdam School type.
  body: 'Zorgvlied cemetery, laid out in 1870 for the municipality of Nieuwer-Amstel (now Amstelveen),
    had an iron fence that by the 1920s needed replacing, partly because the cemetery was extended and
    Amsterdam needed a strip of land along the Amstel to build Gemaal Stadwijck. In 1926 a new fence in
    Amsterdam School style was built, designed by Leo van der Bijl for Nieuwer-Amstel, with two entrances:
    one by the gravedigger''s house, later the office, and one with a drive to the chapel.


    The cemetery lies on Amstelveen land and Amstelveen still manages it, though the entrance is on the
    Amsterdam side of the Amsteldijk. The fence is a national monument.


    Look for:

    - wrought-iron gates hung between square brick piers on a plinth, continuing into wings

    - lanterns in the same style on some of the piers

    - the name ZORGVLIED in Amsterdam School lettering on the two gate piers

    '
