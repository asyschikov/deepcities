  nl:
    title: Blok Eigen Hulp (Lammers)
    summary: Het expressieve woonblok van Th.J. Lammers aan de Amstel voor de coöperatie Eigen Hulp, in
      rode en lichtbruine baksteen, in 1991-1992 in oude luister hersteld.
    body: 'Theodorus Johannes Lammers ontwierp dit complex van 61 etagewoningen, in 1921-1922 gebouwd
      voor de Amsterdamse Coöperatieve Bouwvereniging Eigen Hulp. Het is de oostelijke helft van het blok
      waarvan Margaret Staal-Kropholler de westelijke helft aan de Holendrechtstraat ontwierp; de woningen
      aan de lange zijde kijken uit over de Amstel. Bij een grote renovatie in 1991-1992 onder leiding
      van architect M.F. Hartman kreeg het blok zijn oorspronkelijke uiterlijk terug.


      Het register prijst het als zorgvuldig gedetailleerde, expressieve verenigingsbouw. Het middendeel
      aan de Amsteldijk telt drie lagen, de hoeken en kopzijden vier. Het blok heeft een inwendige staalconstructie.


      Let op:

      - de rode baksteen bij plint, hoeken en hoge erkers tegenover de lichtbruine baksteen elders

      - de verhoogde portieken met dubbele trap, geflankeerd door omgekeerd-paraboolvormige toiletraampjes

      - de afgeronde hoekdelen en de afwisseling van erkers en vlakke geveldelen met balkons

      '
    attributes:
      original_use: Woningbouw (61 etagewoningen)
    sources:
    - https://api.data.amsterdam.nl/v1/monumenten/monumenten/?monumentnummer=222244
- title: Borssenburgstraat blocks (Lansdorp)
  summary: Two mirrored U-shaped blocks by the school architect Nicolaas Lansdorp, each wrapped around
    a cul-de-sac and a little square, with parabolic porch arches.
  body: 'Nicolaas Lansdorp (1885–1968) is best known for the many schools he designed for Public Works,
    but in 1921–1924 he also built these two blocks of workers'' housing in the Rivierenbuurt for one
    of the many housing corporations that filled Plan Zuid. They mirror each other: each is a U-shaped
    block whose open side forms a dead-end street and a small, intimate square. The register calls them
    a good example of his earlier work in the Amsterdam School style, used to give shape to the urban
    space.


    The fronts are mostly yellow brick on a plinth of blue-grey and red brick. The corners rise as vertical
    compositions, while the walls between them are horizontal.


    Look for:

    - parabolic arches over the porches on the Meerhuizenstraat

    - three projecting brick courses and a decorative cornice along the top

    - the dairy shop at Borssenburgstraat 33, whose interior is largely original

    '
  category: housing
  lat: 52.348415
  lng: 4.908747
  address: Borssenburgstraat 1-19 and 27-35, Meerhuizenstraat 2-8 and 26-34
  links:
  - label: Gemeentelijk monument (222203)
    url: https://data.amsterdam.nl/monumenten/eeeac8c9-e60b-49eb-8c13-090f78b3e465
  - label: Gemeentelijk monument (222204)
    url: https://data.amsterdam.nl/monumenten/fa3477f5-83fc-486a-9b20-ae7cfd143d62
  attributes:
    heritage_status: Municipal monument
    monument_number: 222203, 222204
    built: 1921–1924
    architect: Nicolaas Lansdorp
    style_phase: Expressive
    original_use: Workers' housing with shops
    listed: 2012
  photos:
  - commons:File:Amsterdam - Borssenburgstraat 3-5.JPG
