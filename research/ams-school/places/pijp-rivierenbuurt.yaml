  nl:
    title: Hekwerk Zorgvlied
    summary: De bakstenen pijlers, smeedijzeren hekken en lantaarns van Begraafplaats Zorgvlied aan de
      Amsteldijk uit 1926, met de naam in Amsterdamse Schooltypografie.
    body: 'Begraafplaats Zorgvlied had sinds de inrichting in 1870 een hekwerk dat in de jaren twintig
      aan vervanging toe was, mede door uitbreiding van de begraafplaats en doordat Amsterdam een strook
      grond langs Amstel en Amsteldijk nodig had voor de bouw van gemaal Stadwijck. In 1926 kwam er een
      nieuw hekwerk in de stijl van de Amsterdamse School, ontworpen door Leo van der Bijl voor de gemeente
      Nieuwer-Amstel. Er kwamen twee ingangen: één bij de doodgraverswoning (later kantoor) en één met
      een oprijlaan naar de aula.


      De begraafplaats ligt op grondgebied van Amstelveen en wordt door die gemeente beheerd. Het hekwerk
      is rijksmonument.


      Let op:

      - de smeedijzeren hekken aan vierkante bakstenen kolommen op een plint, doorlopend in de vleugels

      - de lantaarns in dezelfde stijl op enkele pijlers

      - de naam Zorgvlied in bijbehorende typografie op beide pijlers

      '
