  nl:
    title: Barbiersbrug
    summary: Brug 404 tussen Ferdinand Bolstraat en Scheldestraat, met vier ruitvormige brughuisjes die
      nog steeds winkeltjes zijn en beeldhouwwerk van Hildo Krop.
    body: 'De brug ligt op de route die via Schelde- en Ferdinand Bolstraat van Plan Zuid naar de oude
      stad leidt. Kramers eerste ontwerp dateert van 1917; na de Eerste Wereldoorlog lag er lang een houten
      noodbrug, tot er in 1925 krediet kwam. In 1927-1928 werd de brug, sterk gewijzigd ten opzichte van
      het eerste ontwerp, gebouwd. Het technische deel kwam van Cornelis Biemond, het esthetische van
      Kramer.


      Bijzonder zijn de vier identieke brughuisjes op de hoeken, die vanaf de oplevering dienstdeden als
      winkeltjes van 16 m². Ze hebben een bijna ruitvormige plattegrond, gele baksteen en tentdaken met
      vijf schilden van rood geglazuurde holle pannen. Hildo Krop maakte een faunskop in golvend water,
      een opgerolde slang, een kop in de golven en een vis.


      Let op:

      - de etalages die met de stompe hoek van de huisjes meebuigen, met een brede luifel erboven

      - de getrapte, cilindrische bakstenen beëindigingen van de borstwering met beeldhouwwerk

      - het golvende siersmeedwerk van de balustrade

      '
    attributes:
      architect: Piet Kramer, met Cornelis Biemond (Dienst der Publieke Werken)
      client: Gemeente Amsterdam
      original_use: Verkeersbrug met vier winkeltjes
