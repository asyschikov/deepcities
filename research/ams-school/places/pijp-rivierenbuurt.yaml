  nl:
    title: 12-verdiepingenhuis (De Wolkenkrabber)
    summary: 'Het eerste woontorengebouw van Amsterdam: J.F. Staals Wolkenkrabber uit 1930-1932 aan het
      Victorieplein, waar de Amsterdamse School overgaat in staal, glas en Nieuwe Bouwen.'
    body: 'Berlage wilde de belangrijke punten van zijn Plan Zuid met torens markeren; dit is een van
      de weinige die zijn gebouwd, maar dan naar ontwerp van Jan Frederik Staal. De plannen dateren al
      uit 1927. Omdat de bouwverordening maximaal vier woonlagen toestond, moest die eerst worden aangepast.
      Op 1 juli 1930 ging de eerste heipaal de grond in; in 1932 was het 40,65 meter hoge gebouw klaar.
      De zeskamerwoningen hadden onder meer een intercom, snelle liften, een vuilstortkoker, een koelkast
      en centrale verwarming. Het staat aan het eind van de Vrijheidslaan (tot 1946 Amstellaan) en domineert
      het Victorieplein.


      Opdrachtgever was Hilwis BV van K. Hille en J. Reijn, voor wie Staal ook de flankerende blokken
      aan het Victorieplein en Merwedeplein ontwierp. Volgens het gemeentelijk register kent zijn werk
      niet de explosieve expressiviteit van De Klerk en Kramer. In de woningen aan het Merwedeplein vonden
      Duits-Joodse vluchtelingen onderdak, onder wie de familie Frank. Na de oorlog bood de weduwe van
      Reijn terugkerende Joden kosteloos woonruimte aan.


      Let op:

      - de horizontale banden van vensters en balkons, gezien vanaf het eind van de Vrijheidslaan

      - het standbeeld van Berlage door Hildo Krop op het plein ervoor

      - de lagere blokken van Staal langs Merwedeplein en Victorieplein

      '
    attributes:
      client: Hilwis (K. Hille en J. Reijn)
      original_use: Middenstandswoningen
    sources:
    - https://nl.wikipedia.org/wiki/12-verdiepingenhuis
    - https://api.data.amsterdam.nl/v1/monumenten/monumenten/?monumentnummer=222240
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/532002
- title: Merwedeplein west (Van der Mey)
  summary: J.M. van der Mey, architect of the Scheepvaarthuis, closes the west end of the wedge-shaped
    Merwedeplein with two blocks whose corners jut out like ships' prows.
  body: 'The Merwedeplein is a wedge-shaped green square, the heart of a symmetrical layout between the
    Churchill-laan and Rooseveltlaan, with the Biesboschstraat as a sightline to Staal''s Wolkenkrabber.
    Its west end is closed by two nearly identical blocks by J.M. van der Mey, built in 1928–1929 for
    the developer Alidrina. Van der Mey had led the design of the Scheepvaarthuis, the building usually
    counted as the start of the Amsterdam School; in the 1920s he mainly designed large housing blocks
    in Plan Zuid, often with Gulden & Geldmaker.


    The heads of the two blocks on the square stand at an obtuse angle to each other and are one storey
    lower than the wings along the side streets.


    Look for:

    - projecting corners on the Merwedeplein, shaped like a ship''s prow, marking the entrances to the
    Roerstraat and Jekerstraat

    - a slightly projecting window group on the second floor at the corners of the Biesboschstraat

    - windows with framed, projecting fanlights with vertical bars, and wrought-iron work

    '
  category: housing
  lat: 52.345242
  lng: 4.899829
  address: Merwedeplein 53-62, Biesboschstraat 1-30
  links:
  - label: Gemeentelijk monument (222212)
    url: https://data.amsterdam.nl/monumenten/68a964ba-c161-4a5f-bea3-13b55e278136
  attributes:
    heritage_status: Municipal monument
    monument_number: '222212'
    built: 1928–1929
    architect: J.M. van der Mey
    client: Bouw- en Exploitatie Mij. Alidrina
    style_phase: Restrained
    original_use: Housing
    listed: 2013
  photos:
  - commons:File:Merwedeplein 53-61 (1).jpg
  - commons:File:Merwedeplein hoek Biesboschstraat.JPG
  sources:
  - city:222212 (full register text)
  nl:
    title: Merwedeplein west (Van der Mey)
    summary: J.M. van der Mey, architect van het Scheepvaarthuis, sluit de westkant van het wigvormige
      Merwedeplein af met twee blokken waarvan de hoeken als scheepsstevens naar voren steken.
    body: 'Het wigvormige Merwedeplein ligt ingeklemd tussen Churchill-laan en Rooseveltlaan, met de Biesboschstraat
      als zichtas op de Wolkenkrabber van J.F. Staal. De westzijde wordt afgesloten door twee nagenoeg
      identieke bouwblokken van J.M. van der Mey, gebouwd in 1928-1929 in opdracht van de Bouw- en Exploitatie
      Mij. "Alidrina". Van der Mey ontwierp vooral grote woningbouwblokken in Plan Zuid, in 1924-1930
      vaak samen met Gulden en Geldmaker.


      De kopzijden aan het plein staan onder een stompe hoek ten opzichte van elkaar en zijn een bouwlaag
      lager dan de blokken langs de zijstraten.


      Let op:

      - de als de steven van een schip ogende, risalerende bouwdelen aan het Merwedeplein bij Roerstraat
      en Jekerstraat

      - de licht uitspringende vensterpartij op de tweede bouwlaag bij de Biesboschstraat

      - de omlijste, naar voren gelegen bovenlichten met verticaalroeden en het siersmeedwerk

      '
    attributes:
      client: Bouw- en Exploitatie Mij. Alidrina
    sources:
    - https://api.data.amsterdam.nl/v1/monumenten/monumenten/?monumentnummer=222212
- title: Scheldestraat gateway (Rutgers)
  summary: G.J. Rutgers's blocks at the south end of the Barbiersbrug that, together with Kramer's bridge,
    form the entrance from De Pijp into the Rivierenbuurt.
  body: 'In Berlage''s plan the Scheldestraat continued the Ferdinand Bolstraat across the Amstelkanaal
    as a shopping street, over the bridge Kramer built in 1927–1928. G.J. Rutgers designed the blocks
    on both sides of its southern end, between the Amstelkade, Sloestraat and Churchill-laan, built in
    1928–1929 for a string of private developers. Their most striking role, says the city register, is
    as a gateway into "Zuid", together with the bridge.


    Rutgers started his career in 1912 with designs in Berlage''s rationalist manner but became known
    for his later Amsterdam School work. The blocks have four storeys under pitched roofs, with five on
    the Scheldestraat, where the top floor steps back under a flat roof, and private gardens in the middle.


    Look for:

    - the taller Scheldestraat fronts with shops, compared with the quieter Amstelkade and Churchill-laan
    walls

    - the composition of the volumes at the bridgehead, read from the Barbiersbrug

    '
  category: housing
  lat: 52.347879
  lng: 4.891845
  address: Scheldestraat 2-26, Amstelkade, Sloestraat, Churchill-laan 140-260
  links:
  - label: Gemeentelijk monument (222207)
    url: https://data.amsterdam.nl/monumenten/7e33c2b1-3854-4328-86db-be3700be69a7
  attributes:
    heritage_status: Municipal monument
    monument_number: '222207'
    built: 1926–1929
    architect: G.J. Rutgers
    style_phase: Restrained
    original_use: Housing and shops
    listed: 2013
  photos:
  - commons:File:Scheldestraat 2, 4 en hoger, hoek Amstelkade Amsterdam pic1.jpg
  sources:
  - city:222207 (full register text; metadata gives 1926–1928, text 1928–29)
  nl:
    title: Poort Scheldestraat (Rutgers)
    summary: De blokken van G.J. Rutgers aan de zuidkant van de Barbiersbrug, die samen met Kramers brug
      de entree vanuit De Pijp naar de Rivierenbuurt vormen.
    body: 'In het plan van Berlage werd de Scheldestraat via een fraaie brug over het Amstelkanaal doorgetrokken
      als winkelstraat in het verlengde van de Ferdinand Bolstraat. Het wooncomplex met winkels aan weerszijden
      van het begin van de Scheldestraat, tussen Amstelkade, Sloestraat en Churchill-laan, werd in 1928-1929
      gebouwd naar ontwerp van G.J. Rutgers, in opdracht van een reeks bouwmaatschappijen, waaronder de
      N.V. Machintor en de N.V. Koningsvijver V. Het opvallendste is volgens het register de poortfunctie
      als entree tot "Zuid", samen met de brug van Kramer.


      Rutgers begon in 1912 als zelfstandig architect in de rationalistische stijl van Berlage, maar werd
      vooral bekend door zijn latere werk in de trant van de Amsterdamse School. De blokken tellen vier
      bouwlagen onder zadeldaken; aan de Scheldestraat zijn het er vijf, waarvan de bovenste iets terugligt
      onder een plat dak.


      Let op:

      - de hogere winkelgevels aan de Scheldestraat tegenover de rustiger wanden aan Amstelkade en Churchill-laan

      - de compositie van de volumes bij het bruggenhoofd, gezien vanaf de Barbiersbrug

      '
    sources:
    - https://api.data.amsterdam.nl/v1/monumenten/monumenten/?monumentnummer=222207
- title: Boerenwetering villas (Rutgers)
  summary: A picturesque string of detached villas by G.J. Rutgers along the Boerenwetering, an odd one
    out among the big housing blocks of Plan Zuid.
  body: 'On the western edge of the eastern half of Plan Zuid, along the Boerenwetering, G.J. Rutgers
    designed a group of detached villas built in 1928–1931. Set in gardens by the water, they form a picturesque
    ensemble that the city register calls something of an odd one out next to the large housing blocks
    around them. The corner villa at Churchill-laan 223, of 1929–1930, with a partly built-in garage and
    a west wall rising straight from the water, is a national monument; it was built for A. Haupt.


    The villas are carefully laid in narrow red hand-moulded-style brick with recessed joints, under broad
    overhanging hipped roofs that step down at the sides.


    Look for:

    - stepped side roofs tucked under the main roof, with brick chimneys on the ridge and slopes

    - entrance porches in the side walls

    - the Churchill-laan villa rising directly out of the Boerenwetering

    '
  category: houses
  lat: 52.346904
  lng: 4.886558
  address: Haringvlietstraat 2-12, Churchill-laan 223
  links:
  - label: Gemeentelijk monument (222208)
    url: https://data.amsterdam.nl/monumenten/0b44488d-e7cf-44fb-80bd-deba3a59db44
  - label: Gemeentelijk monument (222209)
    url: https://data.amsterdam.nl/monumenten/3f2c9ce9-92f1-48a6-a0e7-ebfc49f3a495
  - label: Rijksmonumentenregister (530054)
    url: https://monumentenregister.cultureelerfgoed.nl/monumenten/530054
