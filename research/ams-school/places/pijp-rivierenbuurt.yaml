    url: https://data.amsterdam.nl/monumenten/fad34d03-ebfc-4066-b367-23e4e03c7491
  attributes:
    heritage_status: Municipal monument
    monument_number: '222205'
    built: 1921–1923
    architect: Cornelis Kruyswijk
    style_phase: Expressive
    original_use: Workers' housing with corner shops
    listed: 2012
  sources:
  - city:222205 (full register text)
  nl:
    title: Korte Meerhuizenstraat (Kruyswijk)
    summary: Een symmetrisch blok arbeiderswoningen van Cornelis Kruyswijk, een van de productiefste architecten
      van de Amsterdamse School, met gave hoekwinkelpuien.
    body: 'Cornelis Kruyswijk (1884-1935) realiseerde in Plan West en Plan Zuid veel woningbouw, vaak
      voor particuliere bouwondernemers. Dit complex arbeiderswoningen met winkels op de hoeken kwam in
      1921-1923 tot stand en vormt het oostelijke deel van een gesloten bouwblok, met privétuinen erachter
      en kleine voortuinen aan de straat. De opzet is geheel symmetrisch.


      De gevels zijn uitgevoerd in gele baksteen op een rode plint. Kenmerkend voor Kruyswijk zijn het
      plastische karakter en de decoratieve elementen in het metselwerk.


      Let op:

      - de twee hoekwinkels met elk een eigen detaillering en nog gave glas-in-loodbovenlichten

      - de meer gesloten bovenste bouwlaag met kleine vensters, aan de Korte Meerhuizenstraat teruggelegen
      achter balkons

      '
    attributes:
      original_use: Arbeiderswoningen met hoekwinkels
    sources:
    - https://api.data.amsterdam.nl/v1/monumenten/monumenten/?monumentnummer=222205
- title: Onderstation Borssenburgplein
  summary: A free-standing 1924 electricity substation in yellow brick and black stone, designed by Public
    Works as a sculptural object on a Plan Zuid square.
  body: 'The municipal electricity company (GEB) needed substations for its growing network, and in the
    new districts Public Works designed them as architecture. This one of 1924 stands free between the
    Borssenburgplein and the Amstelkanaal, with its showpiece fronts facing both. The register calls it
    an intact example of a utility building in the manner of the Amsterdam School, here in a businesslike
    expressionist version.


    It is built of yellow brick in Flemish bond under flat and saw-tooth roofs, entirely of asymmetrical,
    rectangular parts. Black glazed tiles run along the plinth and black-painted stone marks bands, sills
    and edges.


    Look for:

    - concrete canopies set diagonally across the corners above steel doors with woven-pattern grilles

    - stones with lettering in relief under the canopy on the east side

    - the ventilation structure on the roof, with stone slabs and balls

    '
  category: public-works
  lat: 52.349219
  lng: 4.907505
  address: Borssenburgplein 1-3, Amstelkade 13
  links:
