  nl:
    title: Maarten Lutherkerk
    summary: 'Een lutherse kerk uit 1936-1938 van F.B. Jantzen: een persoonlijke, late interpretatie van
      de Amsterdamse School, geïnspireerd op het kubistisch expressionisme van Frank Lloyd Wright.'
    body: 'Het kerkgebouw werd voor de Evangelisch-Lutherse kerk ontworpen door Ferdinand Jantzen en kwam
      in 1936-1938 tot stand. Volgens het gemeentelijk register wordt zijn oeuvre van vóór 1940 gekenmerkt
      door een persoonlijke interpretatie van het idioom van de Amsterdamse School, geïnspireerd op het
      expressionistisch kubisme van Frank Lloyd Wright; ook de Duitse kerkarchitect Otto Bartning was
      een voorbeeld.


      Het is een van de laatste Amsterdamse gebouwen die nog tot de Amsterdamse School gerekend kunnen
      worden, gebouwd toen het Nieuwe Bouwen al de toon zette. De baksteen en de zorgvuldige massaopbouw
      zijn gebleven, maar de vormen zijn blokvormig en horizontaal.


      Het complex is opgetrokken in gele Friese baksteen op een plint van Donaugraniet: de kerk met torenlichaam
      en apsis, twee lagere aanbouwen en een dienstgebouw met kosterswoning.


      Let op:

      - het piramidale torendak met ingesnoerde, met koper gedekte spits en een windvaan in de vorm van
      een zwaan

      - de monumentale dubbele bordestrap naar de hoofdingang aan de Dintelstraat

      - de ligging waar de knikkende Uiterwaardenstraat de slingerende Dintelstraat kruist

      '
    attributes:
      client: Evangelisch-Lutherse Gemeente Amsterdam
      original_use: Lutherse kerk
    sources:
    - https://api.data.amsterdam.nl/v1/monumenten/monumenten/?monumentnummer=222315
    - https://nl.wikipedia.org/wiki/Maarten_Luther_Kerk_(Amsterdam)
- title: Dick Schmüllbrug
  summary: One of Piet Kramer's last bridges, planned in 1931 and built during the German occupation,
    with Hildo Krop's 'Ode to Berlage' and a stone bench.
  body: 'Bridge 415 carries the Parnassusweg over the Zuider Amstelkanaal, on the southern edge of Plan
    Zuid. Kramer designed it with Public Works in 1931, when the city set aside money for eight bridges,
    but construction began only in July 1940 to replace an iron temporary bridge. Pedestrians could cross
    from July 1941 and it opened in early 1942. At the time the land south of it was still empty; building
    there began only in the 1950s.


    In brick and granite, it has a built-in bench and two sculptures by Hildo Krop: an "Ode to Berlage"
    and a muse. Until 2016 it was unofficially called the Parnassusbrug, after the street; in July 2022
    the council named it after Dick Schmüll, an Amsterdam promoter of volleyball and basketball.


    Look for:

    - Krop''s two sculptures on the parapets

    - the stone bench, a rare piece of street furniture built into a bridge

    - Kramer''s mix of brick and granite, here more restrained than in his bridges of the early 1920s

    '
  category: bridges
  lat: 52.343972
  lng: 4.868
  address: Parnassusweg over the Zuider Amstelkanaal (brug 415)
  links:
