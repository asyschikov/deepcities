  nl:
    title: Gemaal Stadwijck
    summary: Een poldergemaal uit 1921 aan de Amstel van A.J. Westerman, met machinistenwoning en sluiswachterswoning,
      getoond op de tentoonstelling in Parijs van 1925 en nog in bedrijf.
    body: 'Het gemaal is vernoemd naar de boerenhofstede Stadwyck die hier stond en in 1915-1916 in opdracht
      van de gemeente werd gesloopt. Het verving het oude stoomgemaal waar nu de Meerhuizenstraat ligt;
      toen dat deel van de polder met zand werd opgehoogd voor de Rivierenbuurt, was bemaling daar niet
      meer mogelijk. Het werd in 1921 gebouwd naar ontwerp van A.J. Westerman van de Dienst der Publieke
      Werken. Tegelijk verrezen de machinistenwoning, de Zorgvliedbrug en de Zorgvliedsluis. Het ontwerp
      was te zien op de tentoonstelling voor decoratieve kunsten in Parijs (1925).


      Het gemaal ontwatert de Binnendijkse Buitenvelderse polder en pompt het water met twee elektrische
      centrifugaalpompen zo''n 1,6 meter omhoog naar de Amstel. Het is eigendom van het waterschap Amstel,
      Gooi en Vecht en wordt beheerd door Waternet.


      Let op:

      - de plastische bakstenen massa van het gemaal aan de Amsteloever

      - de machinistenwoning aan de Amsteldijk en de sluiswachterswoning aan de Zuidelijke Wandelweg,
      als één groep ontworpen

      - de sluis en de Zorgvliedbrug ernaast

      '
    attributes:
      architect: A.J. Westerman (Dienst der Publieke Werken)
      client: Gemeente Amsterdam
      original_use: Poldergemaal met dienstwoningen
    sources:
