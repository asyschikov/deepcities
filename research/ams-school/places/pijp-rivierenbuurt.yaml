  nl:
    title: School Meerhuizenplein
    summary: Een dubbele lagere school uit 1925 op de as van het Meerhuizenplein, met een lage brede klokkentoren
      en hoeken die afwisselend bol en hol zijn.
    body: 'De Dienst der Publieke Werken ontwierp dit gebouw in 1925 voor twee scholen voor Gewoon Lager
      Onderwijs: de Berlageschool (nummer 4) en de Meerhuizenschool (4A), met een gezamenlijke gymzaal.
      Het is een corridorschool met de lokalen aan één kant van de gang. Door de plaats op de middenas
      van het plein en de lage, brede klokkentoren heeft het gebouw een monumentale werking als pleinwand.


      De school is opgetrokken in donkergele baksteen, met een paarsrood deel bij het inspringende bouwdeel
      aan de oostkant. De witte houten kozijnen met roeden zijn als compositorisch element gebruikt.


      Let op:

      - het verhoogde middendeel met klok en het grote, bijzonder gevormde venster op de bovenste verdieping

      - de westelijke ingang in een bol en de oostelijke in een hol gevormd bouwdeel

      - binnen: twee sgraffito''s op de trapwanden van de Duitse expressionistische kunstenaar Herbert
      Fiedler

      '
    attributes:
      client: Gemeente Amsterdam
      artists: Herbert Fiedler (sgraffito)
      original_use: Twee lagere scholen
    sources:
    - https://api.data.amsterdam.nl/v1/monumenten/monumenten/?monumentnummer=222226
- title: Korte Meerhuizenstraat block (Kruyswijk)
  summary: A symmetrical workers' block by Cornelis Kruyswijk, one of the most productive Amsterdam School
    architects, with intact corner shopfronts and leaded glass.
  body: 'Cornelis Kruyswijk (1884–1935) built widely in Plan West and Plan Zuid, often for private developers.
    This block of workers'' housing with corner shops, of 1921–1923, forms the eastern end of a closed
    block, with private gardens inside and small front gardens on the street. It is fully symmetrical:
    identical fronts on the Borssenburgstraat and Meerhuizenstraat and a symmetrical front on the short
    street between them.


    The walls are yellow brick on a red plinth. Kruyswijk''s typical plastic massing and decorative brickwork
    show at the corners.


    Look for:

    - the two corner shops, each with its own detailing and leaded fanlights still intact

    - the more closed top storey with small windows, set back behind balconies on the Korte Meerhuizenstraat

    '
  category: housing
  lat: 52.347877
  lng: 4.906844
  address: Korte Meerhuizenstraat 2-16, Borssenburgstraat 21-25, Meerhuizenstraat
  links:
