- title: Ernst Cahn en Alfred Kohnbrug
  summary: Piet Kramer's tram bridge between the Van Woustraat and the Rijnstraat, in brick and granite,
    named after two resistance fighters from the ice-cream parlour Koco.
  body: 'Bridge 401 links the Van Woustraat in De Pijp to the Rijnstraat in the Rivierenbuurt, and tram
    4 runs over it. Kramer''s first designs date from 1916, but wartime price rises left a wooden emergency
    bridge here until the permanent one was built in 1927. Unlike the P.L. Kramerbrug and the Barbiersbrug
    it has no Krop sculpture and no bridge houses. Instead it has four granite wing walls with deep cut-outs
    and rosette-like ends.


    In 2008 it was named after Ernst Cahn and Alfred Kohn, who ran the ice-cream parlour Koco in the Van
    Woustraat and the Rijnstraat. At the start of the German occupation a resistance group operated from
    the parlour until it was arrested in 1941. Cahn was executed on the Waalsdorpervlakte; Kohn was killed
    in Auschwitz.


    Look for:

    - the carved granite wing walls on all four corners

    - a granite stone marked NAP, just above the water on the north-west wing

    - the Rutgers gateway blocks at the Rivierenbuurt end of the bridge

    '
  category: bridges
  lat: 52.3491
  lng: 4.904183
  address: Van Woustraat / Rijnstraat over the Amstelkanaal (brug 401)
  links:
  - label: Wikipedia (nl)
    url: https://nl.wikipedia.org/wiki/Ernst_Cahn_en_Alfred_Kohnbrug
  - label: Wikidata
    url: https://www.wikidata.org/wiki/Q28849727
