- title: Zorgvliedbrug
  summary: A small 1921 Kramer bridge on the Amsteldijk over the Kleine Wetering, unusual for its milled
    wooden balustrades instead of his usual wrought iron.
  body: 'Bridge 424 carries the Amsteldijk over the Kleine Wetering by Zorgvlied cemetery, after which
    it is named. It was built in 1921 to a design by Piet Kramer, as part of the group with Gemaal Stadwijck,
    the Zorgvlied lock and the houses of the machinist and lock keeper. Like most of his bridges it mixes
    brick and natural stone, with ornaments set into the brick panels.


    What makes it unusual among Kramer''s several hundred bridges is the infill of the balustrades: milled
    wooden beams instead of the wrought-iron railings he normally specified. The handrails are his, and
    resemble those of his bridges in the Amsterdamse Bos. The roadway is paved in brick and the footpaths
    in tiles.


    Look for:

    - the milled wooden balustrades

    - ornaments in the brick panels

    - the view from the bridge to the pumping station and lock

    '
  category: bridges
  lat: 52.336086
  lng: 4.90608
  address: Amsteldijk over the Kleine Wetering (brug 424)
  links:
