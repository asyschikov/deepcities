  nl:
    title: Remise Lekstraat
    summary: Ooit de grootste tramremise van Europa, gebouwd door Publieke Werken in 1927-1930 voor 320
      trams, met een opengewerkt reliëf van de stadsplattegrond door Hildo Krop.
    body: 'Op 14 december 1918 kwam achter de voormalige watertoren aan de Amsteldijk een houten hulpremise,
      op een terrein dat al was gereserveerd voor een nieuwe remise. Op 27 mei 1925 werd tot de bouw besloten.
      Het eerste gedeelte kwam op 27 augustus 1927 in gebruik; daarna werd de hulpremise gesloopt voor
      het tweede gedeelte, dat in 1930 klaar was. Met plaats voor 320 tramwagens was het de grootste tramremise
      van Europa, gebouwd voor ƒ 2.432.000.


      Het is nu de tweede remise van het Amsterdamse trambedrijf, een eenrichtingremise: de trams rijden
      aan de Amsteldijk naar binnen en aan de Lekstraat naar buiten. De Dienst der Publieke Werken ontwierp
      het gebouw in zakelijk-expressionistische trant.


      Let op:

      - het opengewerkte reliëf van Hildo Krop met de plattegrond van Amsterdam

      - de inritten aan de Amsteldijk en de uitritten aan de Lekstraat

      '
