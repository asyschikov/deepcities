  nl:
    title: Dongeschool
    summary: Het grote schoolcomplex van Nicolaas Lansdorp uit 1926-1928 voor vier scholen, in de stijl
      van de late of verstrakte Amsterdamse School, op een eigen terrein aan de Dintelstraat.
    body: 'Dit schoolgebouw kwam in 1926-1928 tot stand in opdracht van de gemeente Amsterdam, naar ontwerp
      van N. Lansdorp van de Dienst der Publieke Werken, in de stijl van de late of verstrakte Amsterdamse
      School. Oorspronkelijk bevatte het twee dubbele scholen voor Gewoon Lager Onderwijs, een school
      voor Voorbereidend Onderwijs, een school voor Nijverheidsonderwijs (de Industrieschool van de Maatschappij
      voor den Werkenden Stand) en een conciërgewoning. Het terrein wordt begrensd door Dongestraat, Geulstraat
      en Dintelstraat.


      Het gebouw laat zien hoeveel de stad in deze jaren in onderwijs investeerde nu de nieuwe wijk zich
      met gezinnen vulde.


      Let op:

      - de afzonderlijke ingangen voor de verschillende scholen

      - de lange horizontale gevels met regelmatige vensterreeksen

      - de hoek gezien vanaf de Geulstraat

      '
