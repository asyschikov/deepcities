  nl:
    title: Ernst Cahn en Alfred Kohnbrug
    summary: Brug 401 van Piet Kramer tussen Van Woustraat en Rijnstraat, in baksteen en graniet, vernoemd
      naar twee verzetsmensen van IJssalon Koco.
    body: 'De verkeersbrug, waarover tramlijn 4 rijdt, verbindt de Van Woustraat met de Rijnstraat. Kramers
      eerste ontwerpen dateren uit 1916, maar door de Eerste Wereldoorlog en de prijsstijgingen bleef
      er lang een houten noodbrug liggen. Pas in 1927 kwam de definitieve brug, die circa 80.000 gulden
      kostte. Beelden van Hildo Krop en brughuisjes ontbreken hier; in plaats daarvan zijn er vier bewerkte
      granieten walmuren. In 2003 zijn delen van de brug vernieuwd.


      In 2008 kreeg de brug de namen van Ernst Cahn en Alfred Kohn, die in de Van Woustraat en de Rijnstraat
      IJssalon Koco dreven. Van daaruit werd in het begin van de oorlog een verzets- en knokgroep geleid,
      tot die in 1941 werd opgepakt. Cahn werd gefusilleerd op de Waalsdorpervlakte, Kohn kwam om in Auschwitz.


      Let op:

      - de granieten walmuren met uitsparingen en rozetten op de uiteinden

      - de NAP-steen net boven het water bij de noordwestvleugel

      '
    attributes:
      architect: Piet Kramer (Dienst der Publieke Werken)
      client: Gemeente Amsterdam
      original_use: Verkeers- en trambrug
    sources:
    - https://nl.wikipedia.org/wiki/Ernst_Cahn_en_Alfred_Kohnbrug
- title: Barbiersbrug
  summary: Kramer's bridge between the Ferdinand Bolstraat and the Scheldestraat, with four diamond-shaped
    bridge houses still used as shops and Hildo Krop's fauns, fish and snakes.
  body: 'Bridge 404 carries the radial route from Plan Zuid via the Scheldestraat and Ferdinand Bolstraat
    towards the old city. Kramer made a first design in 1917, but a wooden emergency bridge served until
    money came in 1925; the permanent bridge, much changed from the first plan, opened in 1928. Cornelis
    Biemond of Public Works did the engineering, Kramer the architecture.


    What makes it stand out are the four identical bridge houses on the corners, built from the start
    as tiny shops of about 16 square metres. They have an almost diamond-shaped plan, yellow brick and
    five-sided tent roofs of red glazed pantiles. Hildo Krop carved a faun''s head in waves, a coiled
    snake, a head among waves and a fish.


    Look for:

    - the bridge houses with their curved shop windows and canopies following the corner

    - the stepped round brick posts at the ends of the parapets, crowned with Krop''s sculpture

    - the wave-patterned wrought-iron railing

    '
  category: bridges
  lat: 52.348247
  lng: 4.89125
  address: Ferdinand Bolstraat / Scheldestraat over the Amstelkanaal (brug 404)
  links:
