- title: Van der Helstplein (Kramer)
  summary: 'Piet Kramer''s first housing block, designed in 1916: a symmetrical wall of shops and flats
    on a small square in De Pijp, with steep red roofs at the corners.'
  body: 'Piet Kramer drew these façades in 1916 for the N.V. Amsterdamsche Bouwmaatschappij, a private
    developer. The First World War delayed construction until 1919, and the block was finished in 1920.
    It was the first residential building Kramer designed, made while he was still working on the Scheepvaarthuis
    and before De Dageraad. It sits at the head of a closed block on the north edge of the part of De
    Pijp that falls under Berlage''s Plan Zuid.


    The building is a single symmetrical composition of 24 flats over 8 shops, five storeys high, with
    the long front facing the square and two identical cross-wings under tall, kinked pyramid roofs of
    red pantiles. The shop fronts in their stone frames run along the whole ground floor.


    Look for:

    - the wooden band with Amsterdam School detailing above the shop windows

    - the bevelled bays between the main front and the corner wings, where flagpoles once stood

    - the row of square attic windows with diagonal glazing bars, set between slightly convex brick piers

    '
  category: housing
  lat: 52.351543
  lng: 4.89543
  address: Van der Helstplein 7-17, Rustenburgerstraat 323, Karel du Jardinstraat 47
