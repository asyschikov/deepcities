  nl:
    title: Badhuis Diamantstraat
    summary: Een rond gemeentelijk badhuis uit 1925-1926 midden in de Diamantbuurt, met een achtzijdig
      leien tentdak, gebouwd omdat de nieuwe woningen geen badkamer hadden.
    body: 'Waar het Smaragdplein de Diamantstraat raakt, bouwde de gemeente in 1925-1926 een badhuis voor
      de bewoners van de nieuwe Diamantbuurt. Wethouder Monne de Miranda opende het op 16 oktober 1926.
      Het linkerdeel was voor mannen, het rechter voor vrouwen, elk met acht stortbaden en twee kuipbaden.
      Het ontwerp kwam van de Dienst der Publieke Werken en wordt toegeschreven aan A.J. Westerman, ook
      ontwerper van het badhuis aan het Boerhaaveplein, al was hij bij de bouw al weg bij de dienst. Volgens
      het register is het het derde in een reeks ronde gemeentelijke badhuizen.


      In de jaren zeventig ging het dicht, toen de woningen bij renovatie eigen sanitair kregen. Na lange
      leegstand is het rond 2015 opgeknapt en ingericht als ateliers voor kunstenaars.


      Let op:

      - de opbouw in ringen: lage badcellen, een hogere gangring en de achtkantige kern onder een tentdak
      met waaiervensters

      - de gedenksteen van de bewoners van De Dageraad, de Algemeene Woningbouwvereniging en Eigen Haard
      onder het venster bij de ingang

      - restanten van de geschulpte keramische rand langs de ronde gevel

      '
    attributes:
      client: Gemeente Amsterdam
      original_use: Gemeentelijk badhuis
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/527842
    - https://nl.wikipedia.org/wiki/Diamantstraat_134
- title: Smaragdplein school
  summary: 'One of the earliest and finest Amsterdam School schools: a double primary school of 1920–1922
    with zigzag brickwork and two small Hildo Krop sculptures at the doors.'
  body: 'Public Works built this double primary school on the Smaragdplein, two schools under one roof
    sharing a gym. It was one of the first schools of that kind in the 1920s. The design is attributed
    to Nicolaas Lansdorp. Because nobody had yet decided whether the space around it would be a public
    square or the inside of a block, the building was given good fronts on every side. The city register
    calls it an early and one of the most beautiful Amsterdam School schools, an example of the socialist
    belief that handsome schools would raise working-class taste. It housed the El Arqam school until
    2007 and now has other uses.


    The yellow brick sits on a red plinth, with toothed brickwork at the base and roofline and saw-tooth
    brick on the corners.


    Look for:

    - two small limestone sculptures of 1921–1922 by Hildo Krop at the entrances, each a ram''s head with
    animals at the sides

    - diamond-patterned glazing bars in the corridor and stair windows, and wave-shaped lintels

    - the slightly bay-like central section where the shared gym lies

    '
