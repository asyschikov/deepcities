  nl:
    title: P.L. Kramerbrug
    summary: 'Brug 400, naar haar ontwerper vernoemd: Kramers pronkstuk op de plek waar Amstel en Amstelkanaal
      elkaar raken, met zeehonden, paalwormen en Gijsbrecht van Amstel van Hildo Krop.'
    body: 'Brug 400 ligt in de Amsteldijk over het Amstelkanaal, op de oude uitvalsroute langs de Amstel
      en als verbinding tussen Plan Zuid en de oude stad. In december 1919 besloten B en W tot de bouw
      van deze brug en brug 401; Kramers ontwerp dateerde van 1917 en in 1921 was de bouw voltooid. De
      constructie kwam zoals gebruikelijk van de afdeling Bruggen van Publieke Werken.


      Het beeldhouwwerk van Hildo Krop verwijst naar de zee, waaraan de stad haar welvaart dankte, en
      naar haar geschiedenis: zeerobben, zeehonden en paalwormen, Gijsbrecht van Amstel en een koggeschip.
      In de volksmond heet ze Pieter Kramerbrug.


      Let op:

      - de halfronde uitbouwen aan de Amstelzijde, waarvan de golvende rand overgaat in een zeerob

      - de reliëfs van paalwormen en zeehonden op de pijlers

      - de smeedijzeren balustrade die aan de bovenrand lijkt te hangen

      - de twee zeshoekige huisjes langs het kanaal voor het GEB en de afdeling Beplantingen

      '
    attributes:
      architect: Piet Kramer (Dienst der Publieke Werken)
      client: Gemeente Amsterdam
      original_use: Verkeersbrug met twee dienstgebouwtjes
    sources:
