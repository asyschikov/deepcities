  nl:
    title: De Dageraad
    summary: 'Het woningcomplex van De Klerk en Kramer aan de P.L. Takstraat: golvende gevels, burchtachtige
      hoektorens en een gedenkteken voor P.L. Tak. Het hoogtepunt van de Amsterdamse School in Plan Zuid.'
    body: 'De socialistische woningbouwvereniging De Dageraad gaf in 1920 Michel de Klerk en Piet Kramer
      opdracht voor 294 woningen en zes winkels in Berlages Plan Zuid. Berlage had het terrein eerst bestemd
      voor een ziekenhuis, en de blokken volgen nog de plattegrond van dat ziekenhuis: een gevorkte as
      van P.L. Takstraat en Burgemeester Tellegenstraat, met aan weerszijden het Henriëtte Ronnerplein
      en het Thérèse Schwartzeplein.


      Het rijksmonumentenregister noemt het complex een voorbeeld van de Amsterdamse School "in haar meest
      levendige, irrationele fase": zuiver decoratieve golvingen en sprongen in de muurvlakken, onconstructieve
      daken en een indeling die ondergeschikt is aan het uitwendige effect. In de Burgemeester Tellegenstraat
      128 zit Museum De Dageraad, dat rondleidingen door de buurt verzorgt.


      Let op:

      - de twee hoekgebouwen aan het begin van de P.L. Takstraat met terugwijkend opeengestapelde cilinders

      - het bakstenen gedenkteken voor P.L. Tak, oprichter van De Dageraad, ingemetseld in P.L. Takstraat
      1 en op 29 maart 1924 onthuld door Floor Wibaut

      - de op en neer gaande grens tussen rood en geel metselwerk, die een golfbeweging suggereert

      - de portretbuste van wethouder Wibaut op de hoek van Henriëtte Ronnerstraat en Henriëtte Ronnerplein,
      en de ronde "toren" met scheepsboegvensters aan de Burgemeester Tellegenstraat

      '
    attributes:
      original_use: Sociale woningbouw en winkels
