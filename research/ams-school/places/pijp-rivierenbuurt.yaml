- title: Vrijheidslaan north side (De Klerk)
  summary: 'Michel de Klerk''s last housing, on the broad avenue to the Berlagebrug: cubic blocks with
    staggered balconies that already point to the stricter third phase of the style.'
  body: 'The Vrijheidslaan (called Amstellaan until 1946) is one of the main avenues of Plan Zuid, running
    from the Amstel to the Victorieplein. Its north side between the Amsteldijk end and the Rijnstraat
    was designed in 1921–1922 by Michel de Klerk, among his last works before his death in 1923. The national
    register lists the houses as a group of rijksmonuments and notes that their cubist forms already mark
    a transition to the third, more restrained phase of the Amsterdam School.


    Compared with De Dageraad, built at the same time a few streets away, the walls here are calm: long
    flat planes of brick, with the play reserved for stepped balconies and the corners towards the side
    streets. Further west, the same wall is continued by S.J. Zietsma (Vrijheidslaan 54-78) and Zietsma
    with Lammers (80-88).


    Look for:

    - balconies set in a staggered rhythm across the long façades

    - the turn of the blocks into the side streets, where De Klerk let the volumes step and project

    - how the north wall answers Kramer''s south wall across the avenue

    '
  category: housing
  lat: 52.347186
  lng: 4.909461
  address: Vrijheidslaan 10-48 and side streets
  links:
  - label: Rijksmonumentenregister (3731)
