  nl:
    title: Vrijheidslaan zuidzijde (Kramer, Marnette)
    summary: 'De gevelwanden van Piet Kramer en P.L. Marnette aan de zuidkant van de Vrijheidslaan voor
      de Amstels Bouwvereniging: vlakke en erkerachtige traveeën onder een golvende attiek.'
    body: 'Tegenover de blokken van De Klerk verrees in 1922-1923 de zuidwand van de Vrijheidslaan, in
      opdracht van de Amstels Bouwvereniging. Piet Kramer ontwierp het woningblok Vrijheidslaan 9-43 /
      Kromme Mijdrechtstraat 11-15 (1922) en de hoek Vrijheidslaan 45-51 / Kromme Mijdrechtstraat 6-10.
      P.L. Marnette ontwierp het aansluitende deel naar het westen, Vrijheidslaan 53-77 en Vechtstraat
      63.


      Het register noemt Kramers blok een mooi voorbeeld van verstrakte Amsterdamse Schoolarchitectuur,
      waarin vlakke en plastische geveldelen elkaar evenwichtig afwisselen. Het deel van Marnette is een
      zorgvuldig vormgegeven voorbeeld van particuliere woningbouw in dezelfde trant.


      Let op:

      - bij Kramer: de attiekverdieping met kleine ramen, "golvend" metselwerk ertussen en een daklijn
      van pannen

      - de witte kozijnen, die een belangrijke rol spelen in het geheel

      - bij Marnette: zes gelijke traveeën met elk een verdiepte dubbele entree en twee hoge trappenhuisvensters
      met ladderramen en paars glas, met daarboven gekoppelde driehoekige vensters

      '
    sources:
    - https://api.data.amsterdam.nl/v1/monumenten/monumenten/?monumentnummer=200018
    - https://api.data.amsterdam.nl/v1/monumenten/monumenten/?monumentnummer=222242
- title: Vrijheidslaan gateway (Heineke & Kuipers)
  summary: Two blocks on the Amsteldijk with towers at the start of the Vrijheidslaan, forming the gateway
    into Plan Zuid from the Berlagebrug, in a late style inspired by Frank Lloyd Wright.
  body: 'D. Heineke and E.J. Kuipers designed these two blocks, built in 1923–1929, on either side of
    the start of the Vrijheidslaan, each with a long front on the Amsteldijk. Seen from the Berlagebrug,
    the tower-like corners make them a gateway into Berlage''s Plan Zuid. The street layout here follows
    Berlage''s plan of 1917 closely.


    The city register describes the style as the late or straightened Amsterdam School, inspired by Frank
    Lloyd Wright: long horizontal lines, concrete canopies and strip windows instead of the sculpted brick
    of the early 1920s. It is a useful contrast with the De Klerk and Kramer blocks a few steps further
    along the same avenue.


    Look for:

    - the corner volumes two storeys higher than the rest, with a concrete canopy over a band of windows
    in the top floor

    - a half-round end towards the Vrijheidslaan and a squared end towards the Amsteldijk, each with a
    ladder-like window

    - the rounded corners at the other cross-wings, whose curve runs down the façade to just above the
    ground floor

    '
  category: housing
  lat: 52.347381
  lng: 4.910768
  address: Vrijheidslaan 1-8, Amsteldijk 124-142, Waverstraat 2
  links:
  - label: Gemeentelijk monument (222241)
    url: https://data.amsterdam.nl/monumenten/50efe146-1ca2-4953-8c21-7794372168cd
  attributes:
    heritage_status: Municipal monument
    monument_number: '222241'
    built: 1923–1929
    architect: D. Heineke, E.J. Kuipers
    style_phase: Late
    original_use: Housing
    listed: 2013
  photos:
  - commons:File:Vrijheidslaan hoek Amsteldijk, Etagewoningen en winkels in verstrakte Amsterdamse School-stijl
    pic1.JPG
  sources:
  - city:222241 (full register text)
  nl:
    title: Poort Vrijheidslaan (Heineke en Kuipers)
    summary: Twee blokken met torens aan het begin van de Vrijheidslaan die vanaf de Berlagebrug de poort
      naar Plan Zuid vormen, in een late, op Frank Lloyd Wright geïnspireerde Amsterdamse School.
    body: 'D. Heineke en E.J. Kuipers ontwierpen deze twee bouwblokken, gebouwd in 1923-1929, aan weerszijden
      van het begin van de Vrijheidslaan, met elk een lange gevelwand aan de Amsteldijk. Door de torenachtige
      bouwvolumes op de hoeken fungeren ze, gezien vanaf de Berlagebrug, als "poort" naar Berlages Plan
      Zuid. De verkaveling volgde grotendeels het plan van Berlage uit 1917.


      Het gemeentelijk register spreekt van een goed voorbeeld van de op Frank Lloyd Wright geïnspireerde,
      late of verstrakte Amsterdamse Schoolstijl.


      Let op:

      - de hoekdelen die twee lagen hoger zijn opgetrokken, met in de bovenste laag een betonnen luifel
      boven een strookvenster

      - de halfronde afsluiting met laddervenster aan de Vrijheidslaan en de rechthoekige aan de Amsteldijk

      - de afgeronde hoeken bij de andere dwarsvleugels, waarvan de welving doorloopt tot boven de begane
      grond

      '
    sources:
    - https://api.data.amsterdam.nl/v1/monumenten/monumenten/?monumentnummer=222241
- title: Victorieplein shop galleries (Kruyswijk)
  summary: Cornelis Kruyswijk's twin blocks where the Vrijheidslaan reaches the Victorieplein, with flats
    above covered shopping galleries and Amsterdam School leaded glass.
  body: 'Where the Vrijheidslaan reaches the Victorieplein and the Rijnstraat, Cornelis Kruyswijk designed
    two identical blocks facing each other across the avenue, in a sober Amsterdam School manner. They
    were built in 1924–1929 for two private developers, N.V. Trompzicht (north) and N.V. Rudolf (south).
    Each has five or six storeys of flats above a covered shopping gallery about 40 metres long on the
    Vrijheidslaan side. They frame the view down the avenue towards Staal''s Wolkenkrabber.


    The attic floor was lowered and given a cornice in 1961; a recent renovation of the southern block
    restored its original height and removed the roof overhangs.


    Look for:

    - the galleries, each with three porches holding four doors: two to shops and two to the flats above

    - leaded glass in Amsterdam School style in the fanlights over the shop windows

    - original front doors and window bars, largely still in place

    '
  category: housing
  lat: 52.345983
  lng: 4.90506
  address: Victorieplein 1-6, Rijnstraat 56-62, Vrijheidslaan 90-101
  links:
  - label: Gemeentelijk monument (222245)
    url: https://data.amsterdam.nl/monumenten/9d347098-51e6-4b3c-b21f-5e54f93016db
  attributes:
    heritage_status: Municipal monument
    monument_number: '222245'
    built: 1924–1929
    architect: Cornelis Kruyswijk
    client: N.V. Trompzicht, N.V. Rudolf
    style_phase: Restrained
    original_use: Flats above shopping galleries
    listed: 2013
  photos:
  - commons:File:Victorieplein 1-3.jpg
