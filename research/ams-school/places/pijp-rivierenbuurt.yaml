  nl:
    title: Van der Helstplein (Kramer)
    summary: 'Het eerste woongebouw van Piet Kramer, ontworpen in 1916: een symmetrische wand van winkels
      en woningen aan een pleintje in De Pijp, met hoge geknikte kappen op de hoeken.'
    body: 'Piet Kramer ontwierp in 1916 de gevels van dit blok voor de Naamloze Vennootschap Amsterdamsche
      Bouwmaatschappij. Door de Eerste Wereldoorlog begon de bouw pas in 1919; in 1920 was het klaar.
      Het is het eerste door Kramer ontworpen woongebouw. Het staat op de kop van een gesloten bouwblok
      aan de noordrand van het deel van De Pijp dat binnen Berlages Plan Zuid valt.


      Het geheel telt 24 woningen boven 8 winkels in vijf bouwlagen. De lange gevel aan het plein wordt
      ingeklemd door twee gelijke hoekdelen onder hoge, geknikte schilddaken met rode holle pannen. Bij
      de restauratie is de noordelijke zijgevel niet in de oude staat teruggebracht.


      Let op:

      - de houten strook met Amsterdamse Schooldetails boven de etalages in hardstenen omlijsting

      - de afgeschuinde travee tussen plein- en hoekdelen, waar vroeger de vlaggenmasten stonden

      - de vierkante zolderraampjes met schuine roeden tussen licht bolle penanten

      '
    attributes:
      original_use: Woningen en winkels
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/527852
- title: Badhuis Diamantstraat
  summary: A round public bathhouse of 1925–1926 in the middle of the Diamantbuurt, with an octagonal
    slate roof, built because the new flats around it had no baths.
  body: 'The flats of the Diamantbuurt were built without bathrooms, so the city added a public bathhouse
    at the point where the Smaragdplein meets the Diamantstraat. It opened on 16 October 1926, with separate
    halves for men and women and eight showers and two bathtubs each. Public Works designed it; the design
    is attributed to A.J. Westerman, who also drew the bathhouse on the Boerhaaveplein, although he had
    left the department by the time it was built. The national register calls it the third in a series
    of round municipal bathhouses.


    It closed in the 1970s, once the surrounding blocks were renovated with their own bathrooms. After
    years of decay it was restored around 2015 as studios for artists.


    Look for:

    - the stepped rings: low bathing cells outside, a higher corridor ring, and the octagonal core under
    a slate tent roof with fan-glazed dormers

    - the twin entrance porches on the east side and the commemorative stone below the window, placed
    by the residents of De Dageraad, the Algemeene Woningbouwvereniging and Eigen Haard

    - remnants of the scalloped ceramic edging along the round outer wall

    '
  category: public-works
