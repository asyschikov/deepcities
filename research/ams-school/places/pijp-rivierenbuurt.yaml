- title: Tweede Openbare Handelsschool (Berlage Lyceum)
  summary: Two Public Works school buildings that close off the Dageraad estate on the Amstelkanaal, with
    Hildo Krop's sculpture on colossal brick piers and painted halls inside.
  body: 'At the southern end of P.L. Takstraat, facing the Amstelkanaal, the city''s Public Works department
    (Dienst der Publieke Werken) built a pair of schools in 1921–1924, starting with the Second Public
    Commercial School (Tweede Openbare Handelsschool). Today the buildings house the Berlage Lyceum. The
    register praises them as an intact example of expressionist school building and as the visual closing
    piece of the P.L. Tak neighbourhood, built in the same spirit as the housing around them.


    The canal fronts, about 68 metres long in yellow-brown brick, have a broad central section with huge
    piers jutting forward. Hildo Krop carved groups on them: scenes of agriculture, trade and industry
    on one building, "the birth of the deed" on the other. Inside are a frieze of the seasons by Joop
    Sjollema (1929) and a wall painting by Peter Alma.


    Look for:

    - the sculpture groups on the projecting piers above the Jozef Israëlskade

    - the main doors on the schoolyard side: carved Mercury and Pan over the doorway, flanked by round
    posts with harbour scenes or a youth facing the Hydra

    - the corner balconies set diagonally in the end towers, with ESKAF relief tiles underneath

    '
  category: schools
  lat: 52.348901
  lng: 4.900382
  address: Pieter Lodewijk Takstraat 33 and 34, Jozef Israëlskade
