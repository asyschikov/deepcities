  nl:
    title: Woningbouw Diamantbuurt (Van Epen)
    summary: 'De woonblokken van J.C. van Epen rond Topaas-, Smaragd- en Saffierstraat: versoberde Amsterdamse
      School met paraboolbogen boven de trappenhuizen en omlopende hoekvensters.'
    body: 'Een groot deel van de Diamantbuurt werd tussen 1921 en 1925 ontworpen door J.C. van Epen, in
      opdracht van de Algemeene Woningbouwvereniging en de Stichting "Amsterdam". De gemeente plaatste
      in 1980 vier van zijn complexen op de monumentenlijst als karakteristieke voorbeelden van sociale
      woningbouw in versoberde Amsterdamse Schoolstijl, die het beeld van deze buurt bepalen.


      De blokken tellen vier of vijf bouwlagen. De twee blokken aan de Amsteldijk (1924) hebben erkerachtige
      uitbouwen met in vloeiende lijn verjongende "steunberen" en geknikte dwarskappen met rode pannen.


      Let op:

      - de paraboolvormige accenten boven de ingangen, die de trappenhuizen markeren

      - de om de hoek doorlopende vensters

      - de doorgang van de Jozef Israëlskade naar de Topaasstraat

      '
    attributes:
      original_use: Sociale woningbouw
    sources:
