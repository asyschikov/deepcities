  nl:
    title: Holendrechtstraat (Margaret Staal-Kropholler)
    summary: 'De eerste door een vrouwelijke architect ontworpen woningen van Amsterdam: 85 etagewoningen
      van Margaret Staal-Kropholler, met golvende balkons.'
    body: 'Margaret Staal-Kropholler (1891-1966) wordt wel de eerste vrouwelijke architect van Nederland
      genoemd. Ze ging in de leer bij het bureau van haar broer A.J. Kropholler en J.F. Staal, met wie
      ze later trouwde, en volgde de avondopleiding van de Academie van Bouwkunst. In 1921-1922 ontwierp
      ze voor de Amstels Bouwvereniging dit ensemble van oorspronkelijk 85 etagewoningen. Het beslaat
      de westelijke helft van een in de lengte gedeeld bouwblok; de oostelijke helft is van Th.J. Lammers.
      Holendrechtstraat 23-35 staat al sinds 1999 als apart gemeentelijk monument op de lijst.


      Haar voorkeur voor doordachte details is volgens het register vooral te zien aan de uitspringende
      balkons, die door hun golvende vorm de gevel grote plasticiteit geven. Later zijn op onderdelen
      beeldbepalende elementen verdwenen.


      Let op:

      - de golvende balkons langs de 110 meter lange, teruggerooide gevel

      - de inzwenkende vensters op de begane grond met scheluw gemetselde afzaten

      - het verticale pannendek van nokvorsten boven de zoldervensters

      - de afgeronde hoek naar de Amstelkade met een gemetselde cilinder boven de daklijst

      '
    attributes:
      original_use: Woningbouw (85 etagewoningen)
    sources:
    - https://api.data.amsterdam.nl/v1/monumenten/monumenten/?monumentnummer=222246
- title: Eigen Hulp block (Lammers)
  summary: Th.J. Lammers's expressive block on the Amstel for the cooperative Eigen Hulp, red and light-brown
    brick, restored to its original look in 1991–1992.
  body: 'Theodorus Lammers built this block of 61 flats in 1921–1922 for the Amsterdam cooperative building
    society Eigen Hulp (Self-Help). It forms the eastern half of the block whose western half is Margaret
    Staal-Kropholler''s Holendrechtstraat, and its long front looks straight out over the Amstel. A thorough
    renovation in 1991–1992 under the architect M.F. Hartman returned it to its original appearance.


    The register calls it carefully detailed, expressive Amsterdam School association housing. The long
    three-storey centre on the Amsteldijk rises to four storeys at the corners, with tall bays towards
    the Amstelkade and Uithoornstraat. Inside, the block has a steel frame.


    Look for:

    - the two-colour brickwork: red at the base, the corners and the tall bays, light brown elsewhere

    - raised porches with double stairs, flanked by small toilet windows shaped like upside-down parabolas

    - rounded corner sections and the rhythm of flat wall parts with balconies between bays

    '
  category: housing
  lat: 52.349471
  lng: 4.90966
  address: Amsteldijk 108-123, Amstelkade 1-2, Uithoornstraat 2-4
  links:
