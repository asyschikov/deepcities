    summary: 'Een van de vroegste en fraaiste scholen in Amsterdamse Schoolstijl: een dubbele lagere school
      met vertand metselwerk en twee beeldjes van Hildo Krop bij de ingangen.'
    body: 'Publieke Werken bouwde aan het Smaragdplein een dubbele school voor Gewoon Lager Onderwijs:
      de Jan Lievensschool en de Graaf Floris V-school onder één dak, met een gezamenlijke gymzaal. Het
      ontwerp wordt aan Nicolaas Lansdorp toegeschreven. Omdat lang onduidelijk bleef of hier een plein
      of een binnenterrein zou komen, kreeg het gebouw aan alle zijden een verzorgde gevel; het plein
      kreeg pas in 1931 zijn naam. Tot 2007 zat hier de school El Arqam.


      Het gemeentelijk register noemt het een fraai en vroeg voorbeeld van de Amsterdamse School, en een
      van de mooiste scholen in die stijl. Mooie scholen moesten volgens de SDAP bijdragen aan de verheffing
      van de arbeiders.


      Let op:

      - de twee kalkstenen beeldjes van Hildo Krop (1921-1922) bij de ingangen: een ramskop met dieren
      opzij

      - de ruitvormige roedenverdeling in de gang- en trapvensters en de golvende lateien

      - het zaagtandmotief op de hoeken en het vertande metselwerk langs voet en daklijst

      '
    attributes:
      architect: Dienst der Publieke Werken (vermoedelijk Nicolaas Lansdorp)
      client: Gemeente Amsterdam
      original_use: Twee lagere scholen
    sources:
    - https://api.data.amsterdam.nl/v1/monumenten/monumenten/?monumentnummer=222134
    - https://nl.wikipedia.org/wiki/Smaragdplein_3-5
- title: Diamantbuurt housing (Van Epen)
  summary: J.C. van Epen's pared-back workers' blocks around the Topaas-, Smaragd- and Saffierstraat,
    with parabolic arches over the stairwells and windows wrapping the corners.
  body: 'Most of the Diamantbuurt, the small triangle of streets named after gems between the Amstelkanaal
    and the Amstel, was designed by J.C. van Epen in 1921–1925. The clients were the Algemeene Woningbouwvereniging
    and the Stichting "Amsterdam". The city listed four of his complexes in 1980 as characteristic examples
    of social housing in a toned-down Amsterdam School manner, and as defining the character of this neighbourhood.


    The blocks have four or five storeys of brick, broken by recessed porches and, on the water side,
    by bays with tapering buttress-like piers under kinked cross-roofs of red pantiles.


    Look for:

    - parabolic arches over the entrances, marking each stairwell

    - windows turning the corners of the blocks

    - the passage from the Jozef Israëlskade into the Topaasstraat

    - the Amsteldijk blocks, with tapering piers and small dormers in the cross-roofs

    '
  category: housing
  lat: 52.350654
  lng: 4.906712
  address: Topaasstraat, Smaragdstraat, Saffierstraat, Jozef Israëlskade 450-457, Amsteldijk
