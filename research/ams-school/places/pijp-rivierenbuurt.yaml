  nl:
    title: Villa's Boerenwetering (Rutgers)
    summary: Een schilderachtige reeks vrijstaande villa's van G.J. Rutgers langs de Boerenwetering, een
      vreemde eend in de bijt tussen de grote woningbouwblokken van Plan Zuid.
    body: 'Architect G.J. Rutgers, die ook diverse woningbouwcomplexen in de Rivierenbuurt realiseerde,
      ontwierp deze villa''s, gebouwd in 1928-1931. Als vrijstaande objecten langs het water van de Boerenwetering,
      in tuinen met veel groen, vormen ze een schilderachtig ensemble aan de rand van het oostelijke deel
      van Plan Zuid. Het register noemt ze min of meer een vreemde eend in de bijt naast de nabije woningbouwcomplexen.
      De hoekvilla Churchill-laan 223 uit 1929-1930, met deels inpandige garage en een westgevel die direct
      aan het water grenst, is rijksmonument.


      De gevels zijn zorgvuldig gemetseld in smalle rode quasi-handvormsteen in Vlaams verband met verzonken
      voegen, onder breed overstekende dakschilden.


      Let op:

      - de trapsgewijs instekende schilddaken en de bakstenen schoorstenen op nok en schilden

      - de ingangspartijen met portiek in de zijgevels

      - de villa aan de Churchill-laan die rechtstreeks uit de Boerenwetering oprijst

      '
    attributes:
      original_use: Villa's
    sources:
    - https://api.data.amsterdam.nl/v1/monumenten/monumenten/?monumentnummer=222208
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/530054
- title: Deurloostraat block (Franswa)
  summary: A 1928 block by J.J.B. Franswa, one of the busiest builders of the Rivierenbuurt, with a continuous
    band of concrete balconies above a heavy brick base.
  body: 'J.J.B. Franswa designed a large number of housing projects in the ring of districts built between
    1920 and 1940, many in the Rivierenbuurt, and the city register credits him with contributing a great
    deal to Amsterdam School housing. This block of 1928 has four storeys under roofs that interlock rather
    than turning the corners: mansard roofs on the Deurloostraat and Haringvlietstraat, a pitched roof
    on the Krammerstraat.


    It is laid in red-brown brick in English cross bond, with concrete blocks marking bays and corners.
    The flats are reached in several ways: porches with stairs up to a landing, paired doors straight
    off the street and separate entrances.


    Look for:

    - the continuous projecting balconies along the second storey, with a heavy light-painted concrete
    slab that makes the ground floor read as a base

    - wooden bay windows with horizontal glazing bars

    - the three roofs meeting at the corners

    '
  category: housing
  lat: 52.346186
  lng: 4.886801
  address: Deurloostraat, Krammerstraat, Haringvlietstraat
  links:
  - label: Gemeentelijk monument (222210)
    url: https://data.amsterdam.nl/monumenten/ad6faee2-d7e8-4cc5-9457-ac83bfe4c66a
  attributes:
    heritage_status: Municipal monument
    monument_number: '222210'
    built: '1928'
    architect: J.J.B. Franswa
    style_phase: Restrained
    original_use: Housing
    listed: 2013
  sources:
  - city:222210 (full register text)
  nl:
    title: Deurloostraat (Franswa)
    summary: Een blok uit 1928 van J.J.B. Franswa, een van de productiefste bouwers van de Rivierenbuurt,
      met doorlopende betonnen balkons boven een zware bakstenen basis.
    body: 'Architect J.J.B. Franswa realiseerde een groot aantal woningbouwprojecten in de "Gordel 20-40",
      onder meer in de Rivierenbuurt, en heeft volgens het register veel bijgedragen aan de ontwikkeling
      van de Amsterdamse Schoolarchitectuur. Dit complex uit 1928 telt vier bouwlagen onder een kapverdieping.
      Aan de Deurloostraat en de Haringvlietstraat heeft het een mansardedak, aan de Krammerstraat een
      zadeldak; de drie kappen grijpen in elkaar.


      Het is opgetrokken in roodbruine baksteen in kettingverband met betonnen blokmotieven bij traveeën
      en hoeken. De woningen worden op verschillende manieren ontsloten: via portieken met trappenhuizen
      naar een bordes, via gekoppelde ingangen aan de straat en via afzonderlijke ingangspartijen.


      Let op:

      - de doorlopende, uitkragende balkons langs de tweede bouwlaag, met een forse licht geschilderde
      betonnen balkonplaat

      - de houten lichterkers met horizontaalroeden

      - de in elkaar grijpende kappen op de hoeken

      '
    sources:
    - https://api.data.amsterdam.nl/v1/monumenten/monumenten/?monumentnummer=222210
- title: Jekerstraat school
  summary: A 1926 Public Works double school, the former Jekerschool and Michiel de Klerkschool, facing
    south over the Jekerstraat square.
  body: 'Public Works designed this building in 1926 for two primary schools under one roof: the Jekerschool
    on the right and the Michiel de Klerkschool on the left, named after the architect who had died three
    years earlier. Fourteen classrooms, seven per school, line one side of the corridor and face south
    onto the square in the Jekerstraat; a shared gym sits crosswise at the back. The plan is a mirror
    image, with each school''s entrance at its own end.


    The city register calls it a fine example of an Amsterdam School school and of the way a school was
    meant to adorn the cityscape. Young architects later counted as the Amsterdam School designed the
    department''s buildings as if they were works of art.


    Look for:

    - the two entrances at either end of the long front, each with its own stair behind

    - the three storeys and attic under a pitched roof, with classroom windows facing the square

    '
  category: schools
  lat: 52.3462
  lng: 4.896722
  address: Jekerstraat 84-86
  links:
  - label: Gemeentelijk monument (222228)
    url: https://data.amsterdam.nl/monumenten/52e2ca17-b27d-4ea6-93f2-ad46c5346c6e
  attributes:
    heritage_status: Municipal monument
    monument_number: '222228'
    built: 1926–1927
    architect: Dienst der Publieke Werken
    client: City of Amsterdam
    style_phase: Restrained
    original_use: Two primary schools
    listed: 2013
  sources:
  - city:222228 (full register text)
  nl:
    title: School Jekerstraat
    summary: Een dubbele school van Publieke Werken uit 1926, de voormalige Jekerschool en Michiel de
      Klerkschool, op het zuiden gericht naar het plein in de Jekerstraat.
    body: 'Het schoolgebouw is in 1926 ontworpen door de Dienst der Publieke Werken voor twee scholen
      voor Gewoon Lager Onderwijs in één gebouw: de voormalige Jekerschool rechts en de Michiel de Klerkschool
      links. Het is een corridorschool met de lokalen aan één zijde van de gang, hier de voorzijde, zodat
      de veertien lokalen (zeven per school) op het zuiden liggen en uitkijken op het plein van de Jekerstraat.
      Achter ligt dwars het gemeenschappelijke gymnastieklokaal. De plattegrond is spiegelbeeldig.


      Volgens het register is dit een fraai voorbeeld van een school in de stijl van de Amsterdamse School
      en van de manier waarop een schoolgebouw moest bijdragen aan de verfraaiing van het stadsbeeld.


      Let op:

      - de twee ingangen aan weerszijden, elk met een eigen trappenhuis

      - de drie verdiepingen en de zolder onder het zadeldak, met de lokaalvensters naar het plein

      '
    attributes:
      client: Gemeente Amsterdam
      original_use: Twee lagere scholen
    sources:
    - https://api.data.amsterdam.nl/v1/monumenten/monumenten/?monumentnummer=222228
- title: Dongeschool
  summary: Nicolaas Lansdorp's large 1926–1928 school complex for four schools in the late, straightened
    Amsterdam School style, filling a whole site off the Dintelstraat.
  body: 'Public Works'' school architect Nicolaas Lansdorp designed this complex in 1926–1928 for the
    City of Amsterdam. Originally it held two double primary schools, a nursery school, an industrial
    school run by the Maatschappij voor den Werkenden Stand and a caretaker''s house, all on one site
    bounded by the Dongestraat, Geulstraat and Dintelstraat. The national register describes it as late
    or straightened Amsterdam School: the sculpted brick of Lansdorp''s earlier school on the Smaragdplein
    gives way to large, ordered volumes.


    It is a good place to see how much Amsterdam was building for education in these years: one building
    serving several school types, as the new district filled with families.


    Look for:

    - the separate entrances for the different schools

    - the long horizontal façades with their regular window bands

    - the corner seen from the Geulstraat

    '
  category: schools
  lat: 52.345753
  lng: 4.893216
  address: Dintelstraat 5-11, Dongestraat, Geulstraat
