  nl:
    title: Tweede Openbare Handelsschool (Berlage Lyceum)
    summary: Twee schoolgebouwen van Publieke Werken die de P.L. Takbuurt aan het Amstelkanaal afsluiten,
      met beeldhouwwerk van Hildo Krop op kolossale muurdammen.
    body: 'Aan het eind van de P.L. Takstraat, aan het Amstelkanaal, bouwde de Dienst der Publieke Werken
      in 1921-1924 twee scholen, waaronder de Tweede Openbare Handelsschool, het latere Berlage Lyceum.
      Het rijksmonumentenregister ziet ze als een gaaf en representatief voorbeeld van expressionistische
      scholenbouw en als de visuele afsluiting van de P.L. Takbuurt, in stijl verwant aan de omringende
      woningbouw van Plan Zuid.


      De gevels aan de Jozef Israëlskade, zo''n 68 meter lang in geelbruine baksteen, hebben een brede
      middenrisaliet met diep uitgemetselde muurdammen. Hildo Krop maakte daarop beeldgroepen: landbouw,
      handel en nijverheid op het ene gebouw, "de geboorte van de daad" op het andere. Binnen zijn een
      fries van de seizoenen door Joop Sjollema (1929) en een wandschildering van Peter Alma bewaard.


      Let op:

      - de beeldgroepen op de muurdammen aan de kade

      - de hoofdingangen aan het schoolplein, met houtsnijwerk van Mercurius en Pan en zware ronde stijlen
      met havengezichten of de jonge mens tegenover de Hydra

      - de overhoekse balkons in de hoge hoekvolumes, met ESKAF-reliëftegels eronder

      '
