  nl:
    title: Rijnstraat en Amstelkade (Rutgers)
    summary: De bijna symmetrische blokken van G.J. Rutgers die de ingang van de Rijnstraat aan het Amstelkanaal
      markeren, met trappenhuizen in ronde trommeltorens en om de hoek lopende balkons.
    body: 'Wie vanuit De Pijp over brug 401 de Rivierenbuurt binnenkomt, rijdt tussen twee blokken van
      G.J. Rutgers door, gebouwd voor de Amstels Bouwvereniging. De twee winkel- en woonhuisblokken aan
      weerszijden van de Rijnstraat (Amstelkade 32-38, Rijnstraat 1-9) werden in 1921 ontworpen en in
      1923-1925 gebouwd, met winkels en woningen op straatniveau, drie woonlagen en een bergruimteverdieping.
      Amstelkade 28-31 is een iets ouder deel van dezelfde kadewand en staat sinds 1980 op de gemeentelijke
      lijst.


      Het register noemt het hoekcomplex een goed voorbeeld van de expressionistische richting binnen
      de Amsterdamse School, met verzorgde detaillering en een vormgeving die fraai inspeelt op de bijzondere
      ligging.


      Let op:

      - de ronde uitbouwen met trappenhuizen boven de portieken, bekroond door trommelvormige torens

      - de drie omlopende bakstenen balkons op de hoeken van de Rijnstraat, naar beneden toe verder uitkragend

      - de ritmisch opzwenkende gevellijn langs het water, boven het oostelijke blok later rechtgetrokken

      - de vele originele deuren, soms met bovenlicht

      '
    attributes:
      original_use: Woningen en winkels
    sources:
    - https://api.data.amsterdam.nl/v1/monumenten/monumenten/?monumentnummer=222202
