  nl:
    title: Pastelstraat (Gulden en Geldmaker)
    summary: Twee kloeke woningbouwblokken aan het Amstelkanaal van Gulden en Geldmaker, met hoekpartijen
      die als de voorsteven van een schip naar voren steken.
    body: 'De architecten Zeeger Gulden en Melle Geldmaker waren specialisten in de volkshuisvesting.
      Ze leverden woningplattegronden voor onder anderen Berlage, Van der Mey en Staal, en waren actief
      in de SDAP. Deze twee blokken met etagewoningen en enkele hoekwinkeltjes werden in 1921-1923 gebouwd
      voor de woningbouwverenigingen Amsterdam-Zuid en Rochdale. Ze liggen rond binnenterreinen, met besloten
      zijstraatjes, geheel in de geest van Plan Zuid. In 1985 is het complex ingrijpend gerenoveerd.


      Het gemeentelijk register noemt de architectuur een sobere variant op de Amsterdamse School. Het
      scheepsmotief van de hoekpartijen komt in die stijl vaker voor.


      Let op:

      - de plastische hoekpartijen met scheepsachtig opgezette topgevels

      - de portieken in donkerrood siermetselwerk met geknikte dagkanten en de plastische houten deuren

      - gepotdekseld houtbeschot en mansardedaken boven roodbruin metselwerk

      '
    attributes:
      original_use: Sociale woningbouw met hoekwinkels
    sources:
    - https://api.data.amsterdam.nl/v1/monumenten/monumenten/?monumentnummer=222012
- title: Rioolgemaal F
  summary: 'A little brick castle by the Rijksmuseum that pumped the sewage of the 19th-century ring of
    Amsterdam: four Public Works buildings behind a stepped wall.'
  body: 'After 1913 the 19th-century districts outside the Singelgracht got a sewer system with seven
    pumping stations, A to G. Station F, built by Public Works in 1924, was the only one that also served
    as a booster for the main sewer running from the Haarlemmerpoort to the central pumping station on
    the Zeeburgerdijk. It was needed halfway along that line, near the Rijksmuseum. It worked from 1925
    until 1987 and the buildings are now let for cultural use.


    The site is a leftover triangle between the Boerenwetering and the Stadhouderskade, and the four buildings
    and connecting wall step up towards its point like a small medieval fortress. The city register finds
    the whole fairly sober despite its sculptural Amsterdam School details.


    Look for:

    - the stepped wall linking the four buildings

    - the date 1925 on the building on the Stadhouderskade, completed with "19" and "25" figures by the
    street artist Frankey in 2019–2020

    - the giant sequoia in the Ruysdaelplantsoen in front

    '
  category: public-works
  lat: 52.359319
  lng: 4.887402
  address: Ruysdaelkade 2-4, Stadhouderskade 46
  links:
  - label: Gemeentelijk monument (200448)
