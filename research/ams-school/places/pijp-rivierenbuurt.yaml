  nl:
    title: Onderstation Borssenburgplein
    summary: Een vrijstaand onderstation van het GEB uit 1924 in gele baksteen en zwarte hardsteen, door
      Publieke Werken als beeldbepalend object aan een plein in Plan Zuid ontworpen.
    body: 'Het onderstation van het Gemeentelijk Electriciteitsbedrijf werd in 1924 gebouwd naar ontwerp
      van de Dienst Publieke Werken, in zakelijk-expressionistische trant. Het staat vrij, met de representatieve
      gevels naar het Borssenburgplein en het Amstelkanaal. Het register waardeert het als gaaf voorbeeld
      van een nutsgebouw in de trant van de Amsterdamse School, en als getuige van de uitbreiding van
      de gemeentelijke elektriciteitsvoorziening.


      Het is opgetrokken in gele baksteen in Vlaams verband onder platte en zaagtanddaken. Alle gevels
      zijn asymmetrisch en opgebouwd uit rechthoekige elementen. Langs de plint lopen zwart geglazuurde
      tegels, en hardsteen is zwart geschilderd.


      Let op:

      - de overhoekse betonnen luifels boven stalen deuren met gevlochten sierroosters

      - de reliëfstenen met tekst onder de luifel aan de oostkant

      - de ventilatie-opbouw op het dak met natuurstenen platen en bollen

      '
    attributes:
      client: Gemeentelijk Electriciteitsbedrijf (GEB)
      original_use: Elektriciteitsonderstation
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/526709
- title: Rijnstraat gateway (Rutgers)
  summary: G.J. Rutgers's near-symmetrical blocks that frame the entrance to the Rijnstraat from the Amstelkanaal,
    with stairwells in round drum towers and balconies wrapped around the corners.
  body: 'Coming over the Ernst Cahn en Alfred Kohnbrug from De Pijp, you enter the Rivierenbuurt between
    two blocks by G.J. Rutgers, built for Amstels Bouwvereniging, the cooperative of building contractors
    that put up much of this district. The pair on the Rijnstraat corner (Amstelkade 32-38 / Rijnstraat
    1-9) was designed in 1921 and built in 1923–1925; the neighbouring Amstelkade 28-31 is a slightly
    earlier part of the same frontage. Shops and flats on the ground floor, three storeys of flats above
    and a storage floor at the top.


    The city register picks the corner pair as a good example of the expressionist strand of the Amsterdam
    School, with careful detail and a design that responds well to its special position on the water and
    at the head of a main street.


    Look for:

    - stairwells in round projections above the porches, ending in drum-shaped towers

    - three bands of brick balconies wrapping each corner of the Rijnstraat, projecting further towards
    the bottom

    - the roofline along the canal swinging up and stepping down, still intact on the west block but later
    straightened on the east one

    - many original doors, some with their fanlights

    '
  category: housing
