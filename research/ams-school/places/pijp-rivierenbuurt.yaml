    - https://nl.wikipedia.org/wiki/Amstelkade_28-31
- title: Rijnstraat 24-58 and IJselstraat (Boterenbrood, Greiner)
  summary: A continuous shopping-street wall on the Rijnstraat by Jan Boterenbrood and Dick Greiner, built
    in 1921–1922 when the Amsterdam School was turning sober and straighter.
  body: 'The Rijnstraat was named in 1922 and grew from a local street into the main road south towards
    Utrecht and, from the 1930s, the Rivierenbuurt''s shopping street. Its first stretch, from number
    24 to 58, broken only by the mouth of the IJselstraat, is a row of four municipal monuments listed
    in 1980. Jan Boterenbrood designed Rijnstraat 24-30 and 36-54, and Dick Greiner the corner with the
    IJselstraat, all in 1921–1922 for a mix of small private developers.


    Seen together they show the Amsterdam School of the Rivierenbuurt at a later moment: brick walls that
    are flatter and more regular than at De Dageraad, with the decoration concentrated in shopfronts,
    doors, bays and rooflines.


    Look for:

    - how one design runs across several separately built and commissioned parts, so that the street reads
    as a single wall

    - the corner treatment where the IJselstraat opens off the Rijnstraat

    - original shopfront frames and doors with fanlights above street level

    '
  category: housing
  lat: 52.347454
  lng: 4.904413
  address: Rijnstraat 24-58, IJselstraat 1-8
