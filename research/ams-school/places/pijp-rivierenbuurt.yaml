- title: Van Lennepschool
  summary: A Protestant primary school of 1926–1927 by J.Ph.L. Petri tucked inside a Rivierenbuurt block,
    with sculpture by Johan Polet, now artists' studios.
  body: 'Not every Amsterdam School school was municipal. This one was built in 1926–1927 for the board
    of the Dutch Reformed (Nederduitsch Hervormde) schools, to a design by J.Ph.L. Petri, and named after
    the writer Jacob van Lennep. It sits inside a block off the Reggestraat, reached from the street rather
    than set on a square, like many denominational schools of the period. It has no heritage listing.


    The building is now the Van Lennep Ateliers, a home for artists'' studios. Johan Polet, one of the
    sculptors who worked in the Amsterdam School idiom, made its original sculpture; new versions by Tobias
    Snoep were placed on the building on 16 June 2026.


    Look for:

    - the sculpture by the entrance, and how the new versions by Snoep relate to Polet''s originals

    - the brick massing typical of the late 1920s: tighter and more horizontal than the schools of 1920–1922

    '
  category: schools
