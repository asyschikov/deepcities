  nl:
    title: Van Lennepschool
    summary: Een hervormde lagere school uit 1926-1927 van J.Ph.L. Petri, verscholen in een bouwblok aan
      de Reggestraat, met beeldhouwwerk van Johan Polet. Nu ateliers.
    body: 'Niet elke school in Amsterdamse Schoolstijl was gemeentelijk. Deze school werd in 1926-1927
      gebouwd voor het bestuur van de Nederduitsch Hervormde scholen, naar ontwerp van J.Ph.L. Petri,
      en vernoemd naar de schrijver Jacob van Lennep. Ze ligt binnen een bouwblok aan de Reggestraat.
      Het gebouw is geen monument.


      Tegenwoordig zijn hier de Van Lennep Ateliers gevestigd. Het oorspronkelijke beeldhouwwerk is van
      Johan Polet; op 16 juni 2026 zijn nieuwe versies van de hand van Tobias Snoep aangebracht.


      Let op:

      - het beeldhouwwerk bij de ingang, en de verhouding tussen de nieuwe beelden van Snoep en het werk
      van Polet

      - de strakkere, meer horizontale bouwmassa van de late jaren twintig

      '
    attributes:
