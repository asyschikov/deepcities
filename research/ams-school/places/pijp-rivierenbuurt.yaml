  nl:
    title: Vrijheidslaan noordzijde (De Klerk)
    summary: 'De laatste woningbouw van Michel de Klerk, aan de brede laan naar de Berlagebrug: kubische
      blokken met verspringende balkons, al een overgang naar de verstrakte derde fase.'
    body: 'De Vrijheidslaan, tot 1946 Amstellaan, is een van de hoofdassen van Plan Zuid en loopt van
      de Amstel naar het Victorieplein. De huizenblokken aan de noordzijde werden in 1921-1922 ontworpen
      door Michel de Klerk, een van zijn laatste werken voor zijn dood in 1923. Ze staan als reeks rijksmonumenten
      op de lijst. Het register merkt op dat ze in hun kubistische vormen al een overgang vormen naar
      de derde fase van de Amsterdamse School.


      Vergeleken met De Dageraad, die tegelijkertijd een paar straten verderop verrees, zijn de wanden
      hier rustig. Verder naar het westen wordt de gevelwand voortgezet door S.J. Zietsma (Vrijheidslaan
      54-78) en Zietsma en Lammers (80-88), beide gemeentelijk monument.


      Let op:

      - de balkons in verspringend ritme langs de lange gevels

      - de hoeken naar de zijstraten, waar De Klerk de volumes laat verspringen

      - hoe de noordwand antwoordt op de zuidwand van Kramer aan de overkant

      '
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/3731
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/6170
- title: Vrijheidslaan south side (Kramer, Marnette)
  summary: 'Piet Kramer''s and P.L. Marnette''s walls on the south side of the Vrijheidslaan for Amstels
    Bouwvereniging: flat and bay-like bays in a calm rhythm under a wavy attic.'
  body: 'Opposite De Klerk''s blocks, the south wall of the Vrijheidslaan was built in 1922–1923 for Amstels
    Bouwvereniging. Piet Kramer designed Vrijheidslaan 9-43 with Kromme Mijdrechtstraat 11-15 (1922),
    and the corner at Vrijheidslaan 45-51 with Kromme Mijdrechtstraat 6-10. P.L. Marnette, who worked
    mostly for Public Works, designed the next stretch west, Vrijheidslaan 53-77 with Vechtstraat 63.


    The city register describes Kramer''s part as a straighter Amsterdam School in which flat and sculpted
    parts alternate in a pleasant rhythm, and Marnette''s part as a carefully designed example of private
    building in the same manner. Both are five or four storeys of brick with shops or stone-faced ground
    floors.


    Look for:

    - in Kramer''s block: a row of small attic windows separated by wavy brickwork, and a roofline of
    pantiles

    - white window frames playing a big part in the composition

    - in Marnette''s part: six identical bays, each with a recessed double entrance and two tall stair
    windows with ladder-like frames and purple glass, topped by paired triangular windows

    '
  category: housing
  lat: 52.346411
  lng: 4.908592
  address: Vrijheidslaan 9-77, Kromme Mijdrechtstraat 6-15, Vechtstraat 63
  links:
