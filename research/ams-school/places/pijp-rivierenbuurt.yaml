  nl:
    title: Rioolgemaal F
    summary: 'Een burchtje van baksteen naast het Rijksmuseum: vier gebouwen van Publieke Werken achter
      een getrapte muur, gebouwd als rioolgemaal en overpompgemaal voor de negentiende-eeuwse gordel.'
    body: 'Voor de negentiende-eeuwse wijken buiten de Singelgracht werd vanaf 1913 een rioolstelsel met
      zeven gemalen (A tot en met G) aangelegd. Gemaal F, in 1924 gebouwd door de Dienst der Publieke
      Werken, was het enige dat ook als overpompgemaal diende voor het hoofdriool van de Haarlemmerpoort
      naar het hoofdgemaal aan de Zeeburgerdijk. Van 1925 tot 1987 was het in bedrijf; daarna werden de
      gebouwen verhuurd aan een kunstinstelling. Wie de architect was is volgens het register onbekend;
      de Nederlandse Wikipedia noemt A.R. Hulshoff.


      Het complex van vier gebouwen met een verbindende muur bouwt zich op het driehoekige perceel tussen
      Boerenwetering en Stadhouderskade getrapt op naar de punt, en roept zo de associatie op met een
      kleine middeleeuwse burcht.


      Let op:

      - de in- en uitspringende muur die de vier gebouwen verbindt

      - het jaartal 1925 op het gebouwtje aan de Stadhouderskade, in 2019-2020 door straatkunstenaar Frankey
      aangevuld

      - de mammoetboom in het Ruysdaelplantsoen ervoor

      '
    attributes:
      client: Gemeente Amsterdam
      original_use: Rioolgemaal en overpompgemaal
    sources:
    - https://api.data.amsterdam.nl/v1/monumenten/monumenten/?monumentnummer=200448
    - https://nl.wikipedia.org/wiki/Ruysdaelkade_2-4
- title: Judith Leysterbrug
  summary: Piet Kramer's busy bridge on the Stadhouderskade over the Boerenwetering, without sculpture
    or bridge houses but with his trademark railings and granite blocks.
  body: 'A bridge here replaced a high sluice in 1890, when the Stadhouderskade was being built up around
    the new Rijksmuseum. By 1920 it was badly damaged, and in 1924 the city tendered a new bridge to a
    design by Piet Kramer, who led the look of Amsterdam''s bridges from the Public Works department.
    It could open in 1925, once the Boerenwetering had been brought to the same water level as the Singelgracht.
    Today it carries the inner ring road (s100) and is one of the city''s busiest bridges.


    This is a plain Kramer bridge: no bridge-keeper''s houses and no Hildo Krop sculpture, but brick laid
    both horizontally and vertically, granite supports and his decorative iron railings. It was long known
    unofficially as the Stadhoudersbrug and was later named after the 17th-century painter Judith Leyster.


    Look for:

    - the change between horizontal and vertical brick courses in the parapets

    - the wrought-iron railings and granite blocks at the ends

    '
  category: bridges
  lat: 52.360025
  lng: 4.887103
  address: Stadhouderskade over the Boerenwetering (brug 176)
  links:
  - label: Wikipedia (nl)
    url: https://nl.wikipedia.org/wiki/Judith_Leysterbrug
  - label: Wikidata
    url: https://www.wikidata.org/wiki/Q28216443
  attributes:
    heritage_status: Not listed
    built: 1924–1925
    architect: Piet Kramer (Dienst der Publieke Werken)
    client: City of Amsterdam
    style_phase: Restrained
    original_use: Road bridge
  photos:
  - commons:File:Judith Leysterbrug taken from the western side.jpg
  sources:
