  nl:
    title: Zorgvliedbrug
    summary: Een kleine brug van Piet Kramer uit 1921 in de Amsteldijk over de Kleine Wetering, bijzonder
      door de gefreesde houten balustrades in plaats van zijn gebruikelijke smeedijzer.
    body: 'Brug 424 ligt in de Amsteldijk over de Kleine Wetering en is vernoemd naar de nabijgelegen
      Begraafplaats Zorgvlied. Ze werd in 1921 geplaatst naar ontwerp van Piet Kramer, in de stijl van
      de Amsterdamse School met de voor hem gebruikelijke mengeling van bak- en natuursteen. In de baksteenvlakken
      zijn ornamenten aangebracht. De brug hoort bij een complex met gemaal Stadwijck, de Zorgvliedschutsluis
      en de woningen van sluiswachter en machinist.


      Bijzonder ten opzichte van andere Kramerbruggen is de houten opvulling van de balustrades met gefreesde
      balken; normaal schreef Kramer siersmeedhekwerken voor. De leuningen vertonen overeenkomsten met
      die van zijn bruggen in het Amsterdamse Bos. De rijweg is bestraat met baksteen, het voetpad met
      tegels. In 2016 werd de naam na discussie in de gemeenteraad opnieuw vastgesteld.


      Let op:

      - de gefreesde houten balustrades

      - de ornamenten in de baksteenvlakken

      - het zicht op gemaal en sluis

      '
    attributes:
      architect: Piet Kramer (Dienst der Publieke Werken)
      client: Gemeente Amsterdam
      original_use: Verkeersbrug
    sources:
