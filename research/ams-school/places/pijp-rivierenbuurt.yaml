- title: Amstelkade blocks (Wijdeveld)
  summary: 'H.Th. Wijdeveld''s only Plan Zuid housing: a yellow-brick block on the Amstelkanaal whose
    stairwells sit in tall black-tiled recesses.'
  body: 'Hendrik Wijdeveld is best known as the editor and designer of the magazine *Wendingen*, the movement''s
    mouthpiece, and for his long friendship with Frank Lloyd Wright. Here he designed 57 social-housing
    flats in 1922, occupying three sides of a closed block between the Amstelkanaal, Borssenburgstraat
    and Holendrechtstraat. The individual houses are absorbed into one overall design.


    The register calls it a personal variant of the Amsterdam School. The decoration lies less in brick
    sculpture than in tiles: hand-moulded tiles on the walls, tall porches and the placing of the tiled
    planes. Five storeys of yellow brick end in a band of profiled panels under a flat roof.


    Look for:

    - three recessed stairwells on the Amstelkade, each in a black-tiled panel running up to the roof,
    flanked by rounded brick wall sections

    - porches two storeys high with white-tiled walls

    - doors with a vertical light and a wavy vertical bar

    '
  category: housing
  lat: 52.349404
  lng: 4.908677
  address: Amstelkade 6-11, Borssenburgstraat 2-10
  links:
  - label: Gemeentelijk monument (222247)
    url: https://data.amsterdam.nl/monumenten/0415e022-7f0c-4480-bd61-90b230e3d6bb
  attributes:
    heritage_status: Municipal monument
    monument_number: '222247'
    built: 1921–1923
    architect: H.Th. Wijdeveld
    style_phase: Expressive
    original_use: Social housing
    listed: 2013
  sources:
  - city:222247 (full register text)
  - https://en.wikipedia.org/wiki/Hendrik_Wijdeveld
  nl:
    title: Amstelkade (Wijdeveld)
    summary: 'Het woningcomplex van H.Th. Wijdeveld aan het Amstelkanaal: gele baksteen, met trappenhuizen
      in hoge, zwart betegelde nissen.'
    body: 'Hendricus Theodorus Wijdeveld was hoofdredacteur en vormgever van het tijdschrift Wendingen
      en combineerde in zijn werk de vormentaal van de Amsterdamse School met die van het Nieuwe Bouwen.
      Aan de Amstelkade ontwierp hij in 1922 een complex van 57 sociale etagewoningen, dat drie zijden
      van een gesloten bouwblok inneemt. De afzonderlijke woningen gaan op in één totaalontwerp.


      Het gemeentelijk register spreekt van een persoonlijke variant van de Amsterdamse Schoolstijl. De
      decoratie zit vooral in de tegels, de hoge portieken en de plaatsing van de betegelde vlakken. De
      oorspronkelijke zwarte betegeling van de bovenste laag aan de Borssenburgstraat is verdwenen.


      Let op:

      - de drie teruggelegen trappenhuizen aan de Amstelkade in een zwart betegeld muurvlak tot aan de
      dakrand

      - de portieken van twee bouwlagen hoog met witte wandtegels

      - de deuren met een golvende verticale balk

      '
    attributes:
      original_use: Sociale woningbouw
    sources:
    - https://api.data.amsterdam.nl/v1/monumenten/monumenten/?monumentnummer=222247
- title: Holendrechtstraat (Margaret Staal-Kropholler)
  summary: 'The first homes in Amsterdam designed by a woman architect: Margaret Staal-Kropholler''s 85
    flats with wavy balconies, a showpiece of the Rivierenbuurt.'
  body: 'Margaret Kropholler (1891–1966) is regarded as the first woman in the Netherlands to practise
    as a professional architect. She trained in the office of her brother Alexander Kropholler and J.F.
    Staal, whom she later married, and at the Amsterdam Academy of Architecture. In 1925 she won a silver
    medal at the Paris decorative arts exhibition. This block for Amstels Bouwvereniging, the cooperative
    of builders that developed much of the Rivierenbuurt, contains 85 flats and fills half of a long block
    split down the middle. It was the first housing in Amsterdam designed by a woman.


    Her attention to detail and to dwelling plans shows in the street front: a 110-metre wall set back
    from the street, with corner sections that step forward.


    Look for:

    - balconies whose undulating fronts give the long wall its movement

    - ground-floor windows that curve inwards, with sills bricked in a curve

    - the vertical "roof" of ridge tiles above the attic windows

    - the rounded corner towards the Amstelkade, ending in a brick cylinder above the roof

    '
  category: housing
  lat: 52.34857
  lng: 4.909388
  address: Holendrechtstraat 1-47, Amstelkade 3-5, Uithoornstraat 6
  links:
  - label: Gemeentelijk monument (222246)
