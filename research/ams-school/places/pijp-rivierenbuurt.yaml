  nl:
    title: Borssenburgstraat (Lansdorp)
    summary: Twee gespiegelde U-vormige blokken van schoolarchitect Nicolaas Lansdorp, elk rond een doodlopende
      straat met pleintje, met paraboolbogen boven de portieken.
    body: 'Nicolaas Lansdorp is vooral bekend van zijn scholen voor de Dienst Publieke Werken, maar in
      1922-1924 bouwde hij ook deze twee complexen arbeiderswoningen voor een van de vele woningcorporaties
      in Plan Zuid. De blokken spiegelen elkaar: beide zijn U-vormig en omsluiten een doodlopende straat
      met een intiem pleintje. Het register ziet ze als goed voorbeeld van zijn vroegere werk in de Amsterdamse
      Schoolstijl.


      De gevels zijn uitgevoerd in gele baksteen op een plint van blauwgrijze en rode steen. Bij de hoeken
      zijn de volumes verticaal gericht, de wanden ertussen horizontaal.


      Let op:

      - de portieken met paraboolbogen aan de Meerhuizenstraat

      - de drie vooruitstekende rollagen en de daklijst van siermetselwerk

      - de zuivelwinkel op Borssenburgstraat 33, met een grotendeels oorspronkelijk interieur

      '
    attributes:
      original_use: Arbeiderswoningen met winkels
    sources:
    - https://api.data.amsterdam.nl/v1/monumenten/monumenten/?monumentnummer=222203
    - https://api.data.amsterdam.nl/v1/monumenten/monumenten/?monumentnummer=222204
- title: Meerhuizenplein school
  summary: A double primary school of 1925–1926 that closes the axis of the Meerhuizenplein, with a low
    clock tower and corners that bulge out or curve in.
  body: 'Public Works designed this building in 1925 for two primary schools, the Berlageschool and the
    Meerhuizenschool, sharing a gym. It is one of the first schools where two schools were deliberately
    combined again in one well-planned building. It stands on the central axis of the square and was built
    as a wall of that square, in line with Plan Zuid''s idea that public space and architecture should
    belong together.


    The broad front is mostly dark-yellow brick, with white-painted wooden window frames used as part
    of the composition. A higher central section holds the shared gym and a low, wide clock tower.


    Look for:

    - the stepped central section with the clock and the largest, specially shaped window on the top floor

    - the west entrance in a convex corner and the east entrance in a concave one

    - inside, two sgraffito murals on the stair walls by the German expressionist Herbert Fiedler

    '
  category: schools
  lat: 52.348197
  lng: 4.908059
  address: Meerhuizenplein 4
