- title: Coöperatiehof
  summary: 'A hidden courtyard behind two gateways: Piet Kramer''s low cottages, a reading room with a
    little bell tower, and memorials to the housing pioneers Tellegen and Van Buuren.'
  body: 'The Coöperatiehof is a pentagonal block on Burgemeester Tellegenstraat with a quiet court inside,
    reached only through two gateways. It was built in 1925–1928 for the Bouwmaatschappij tot Verkrijging
    van Eigen Woningen, Amsterdam''s oldest workers'' building society (founded 1868), and every building
    in it was designed by Piet Kramer. Around the court he placed three rows of two-storey cottages and,
    on the south side, a small reading room and meeting hall (1926–1927), a neighbourhood facility of
    the kind housing reformers wanted in every new district.


    On the back of the reading room, on the axis of P.L. Takstraat, is a memorial to mayor J.W.C. Tellegen,
    a champion of social housing, put up in 1924 by the Amsterdamsche Woningbouwvereeniging. In the middle
    of the lawn stands Kramer''s globe-shaped memorial to Lucas van Buuren, long-time chairman of the
    society, presented by its members in December 1936.


    Look for:

    - the reading room''s tapering, lead-clad clock tower and the steep pantiled roof over its entrance

    - the relief above the door and the sculpted stones in the vertical brick band on the Tellegen memorial
    side

    - the Van Buuren globe on its compass rose, lettered in Amsterdam School type

    - the two gateways from Burgemeester Tellegenstraat

    '
