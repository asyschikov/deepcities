  nl:
    title: Coöperatiehof
    summary: 'Een verscholen hofje achter twee poorten, geheel ontworpen door Piet Kramer: lage arbeiderswoningen,
      een leeszaal met klokkentorentje en gedenktekens voor Tellegen en Van Buuren.'
    body: 'Het Coöperatiehof ligt binnen een vijfhoekig woonblok aan de Burgemeester Tellegenstraat en
      is alleen bereikbaar via twee poortgebouwen. Het werd tussen 1925 en 1928 gebouwd door de Bouwmaatschappij
      tot Verkrijging van Eigen Woningen, de eerste door arbeiders opgerichte woningbouwvereniging van
      Amsterdam (1868). De naam verwijst naar die coöperatieve opzet. Alle gebouwen zijn van Piet Kramer:
      drie blokjes woningen van twee lagen met zolder rond het plantsoen, en aan de zuidkant een lees-
      en vergaderzaal (1926-1927) als voorziening voor de wijk.


      Tegen de achtergevel van de leeszaal, in de zichtas van de P.L. Takstraat, staat het gedenkteken
      voor burgemeester J.W.C. Tellegen, in 1924 geschonken door de Amsterdamsche Woningbouwvereeniging.
      Midden in het plantsoen staat het bolvormige Van Buurenmonument, in december 1936 door de leden
      aangeboden aan voorzitter Lucas van Buuren.


      Let op:

      - de taps toelopende, met lood beklede klokkentoren op de leeszaal

      - de gevelsteen met zinnebeeldige voorstelling boven de ingang van de leeszaal

      - de bol van het Van Buurenmonument op een kompasroos, met letters in Amsterdamse Schooltrant

      - de twee poorten vanaf de Burgemeester Tellegenstraat

      '
    attributes:
      original_use: Arbeiderswoningen, lees- en vergaderzaal
