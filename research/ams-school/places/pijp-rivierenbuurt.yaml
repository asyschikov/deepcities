- title: Maarten Lutherkerk
  summary: 'A Lutheran church of 1936–1938 by F.B. Jantzen: a personal, late take on the Amsterdam School,
    inspired by the cubist expressionism of Frank Lloyd Wright.'
  body: 'The Evangelical Lutheran congregation, which had already put its Kemper legacy into housing on
    the Rooseveltlaan nearby, built this church in the Rivierenbuurt in 1936–1938. The architect, F.B.
    Jantzen, worked before 1940 in what the city register calls a personal interpretation of the Amsterdam
    School idiom, inspired by the cubist expressionism of Frank Lloyd Wright and by the German church
    architect Otto Bartning.


    It is one of the last buildings in Amsterdam that can still be called Amsterdam School, built when
    the Nieuwe Bouwen had already taken over the avant-garde. Brick and the careful handling of mass remain,
    but the forms are blocky and horizontal.


    The complex is built of yellow Frisian brick on a granite plinth, with the church, its tower, the
    apse, two lower annexes and a sexton''s house as distinct but linked parts.


    Look for:

    - the tower''s pyramid roof with a pinched copper spire, crowned by a swan weathervane (the swan is
    a Lutheran emblem)

    - the monumental double flight of steps up to the main entrance on the Dintelstraat

    - the church''s position where the winding Uiterwaardenstraat crosses the Dintelstraat

    '
  category: religious
  lat: 52.341483
  lng: 4.894866
  address: Dintelstraat / Uiterwaardenstraat
  links:
  - label: Gemeentelijk monument (222315)
    url: https://data.amsterdam.nl/monumenten/a4369b28-fd06-428b-80af-4bf962bb66b0
  - label: Wikipedia (nl)
    url: https://nl.wikipedia.org/wiki/Maarten_Luther_Kerk_(Amsterdam)
  attributes:
    heritage_status: Municipal monument
    monument_number: '222315'
    built: 1936–1938
    architect: F.B. Jantzen
    client: Evangelisch-Lutherse Gemeente Amsterdam
    style_phase: Late
    original_use: Lutheran church
    listed: 2016
