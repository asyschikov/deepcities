  nl:
    title: Juwelierszaak Citroen (Kalverstraat 1)
    summary: 'Het eerste gebouw van H.Th. Wijdeveld (1915–1917), kort voor hij Wendingen oprichtte: een
      juwelierswinkel in keramische steen met een fries van kronen, parelsnoeren, duiven en olifanten.'
    body: 'Sinds 1859 zat juwelier Roelof Citroen op deze plek vlak bij de Dam. Zoon Karel Citroen vroeg
      de jonge architect Hendrik Wijdeveld om een nieuw pand; na de aanbesteding in april 1915 werd gebouwd,
      en in februari 1917 ging de zaak open. De Standaard vond het ''een lust voor het oog''. Een jaar
      later begon Wijdeveld het tijdschrift *Wendingen*, het spreekbuis van de Amsterdamse School.


      Het rijksregister spreekt van ''Art Déco-trant''. Volgens Wikipedia zat Wijdeveld hier nog in die
      voorafgaande stijl, maar bevat het pand ook glas-in-lood in Amsterdamse School-trant en de voor
      die school kenmerkende diepliggende vensters. In 1932 verbouwde Frans Jurrema de winkel. In 1971–1972
      kreeg de begane grond een bronzen pui met reliëfs van Thomas Rodr, waar Wijdeveld zelf mee instemde.
      Boven is veel van de oorspronkelijke woning bewaard, met een ''Italiaans'' trappenhuis rond een
      binnenplaats onder een lichtkap.


      Let op:

      - de gevel van keramische steen in plaats van baksteen

      - het gebeeldhouwde fries boven de pui met een kroon, parelfestoenen, duiven en in de bovenhoeken
      olifanten

      - de aan de onderzijde gedecoreerde vensterstijlen

      - de diepliggende vensters met glas-in-lood bovenlichten

      - het breed uitkragende fries onder de getoogde daklijst, met in het midden een vlaggenmasthouder

      '
    attributes:
      client: Karel Citroen (juwelier Roelof Citroen)
      artists: Thomas Rodr (bronzen pui, 1971)
      original_use: Juwelierswinkel met bovenwoning
