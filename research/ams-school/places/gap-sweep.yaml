- title: Citroen jeweller's shop (Kalverstraat 1)
  summary: 'H.Th. Wijdeveld''s first building (1915–1917), years before he launched the magazine Wendingen:
    a jeweller''s shop faced in ceramic stone, with a frieze of crowns, pearl festoons, doves and elephants.'
  body: 'Roelof Citroen had kept a jeweller''s shop on this spot, just off the Dam, since 1859. His son
    Karel commissioned a new building from the young Hendrik Theodorus Wijdeveld. Work began in April
    1915 and the shop opened in February 1917. A year later Wijdeveld launched *Wendingen*, the magazine
    that became the voice of the Amsterdam School.


    The national register describes the front as Art Deco in manner. Dutch Wikipedia notes that alongside
    the strict Art Deco lines there is stained glass in both Art Deco and Amsterdam School taste, and
    that the deep-set windows are typical of the Amsterdam School. Frans Jurrema altered the shop in 1932.
    In 1971 it got a bronze shopfront with reliefs by Thomas Rodr, which Wijdeveld himself approved. Upstairs,
    much of the original flat survives, with an "Italian" stair hall round a top-lit court.


    Look for:

    - the facing of glazed ceramic stone rather than brick

    - the carved frieze above the shop: a crown, festoons of pearls, doves, and elephants in the top corners

    - the window mullions decorated at their base

    - the deep-set windows with stained-glass transoms

    - the wide projecting frieze under the curved cornice, with a decorative flagpole holder in the middle

    '
