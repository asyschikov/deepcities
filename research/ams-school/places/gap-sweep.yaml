  nl:
    title: Kantoorgebouw Candida
    summary: 'Tien verdiepingen hoog kantoorgebouw (1931–1932) tussen Nieuwezijds Voorburgwal en Spuistraat
      van F.A. Warners: baksteen in een betonskelet, stalen vensterstroken en een glazen liftschacht,
      in ''kubistisch-expressionistische trant''.'
    body: 'De N.V. Amsterdamsche Maatschappij tot Exploitatie van Etagewoningen liet dit kantoorgebouw
      in 1931–1932 bouwen naar een ontwerp van F.A. Warners. Op een grondvlak van nog geen 400 m² telt
      het tien bouwlagen; de bakstenen gevels hangen in een skelet van gewapend beton. Het verrees naast
      het kantoorgebouw Neptunus.


      Warners, sterk op Amerika georiënteerd, bouwde eerder in Zuid kubische villa''s en flats in verstrakte
      Amsterdamse Schoolstijl en bij het Leidsebosje het kantoorgebouw Atlanta. Candida gaat nog een stap
      verder richting het Nieuwe Bouwen, maar houdt siermetselwerk tussen de vensterstroken. Het register
      prijst de bijzondere gevel en de samenhang tussen exterieur en interieur.


      Let op:

      - de smalle ingangstravee aan de Nieuwezijds Voorburgwal: de band boven de begane grond loopt over
      in een luifel, die de driezijdige stalen erker met de lift als een zwevende glazen zuil draagt

      - de natuurstenen begane grond met diepliggende, getraliede vensters

      - het siermetselwerk tussen de stalen vensterstroken en op de terugwijkende bovenste verdieping

      - aan de Spuistraat de ronde, uitkragende balkons die samen een open brandtrappenhuis vormen

      '
    attributes:
      client: N.V. Amsterdamsche Maatschappij tot Exploitatie van Etagewoningen
      original_use: Verhuurkantoren met conciërgewoning
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/518442
    - https://nl.wikipedia.org/wiki/Candida_(Amsterdam)
- title: Mariniersbrug (Brug 272)
  summary: 'The Netherlands'' first Chicago-type bascule bridge (1935), over the Dijksgracht: a steel
    leaf that tips into a brick-and-stone pier shaped like an Amsterdam School bastion.'
  body: 'When the eastern railway embankment was raised in the 1930s, the road under it had to be lowered
    and the old swing bridge over the Dijksgracht replaced. Ships still needed a wide passage to the yards
    on Oostenburg. The answer, opened in December 1935, was a single bascule bridge with a 22-metre leaf,
    modelled on the bridges over the Chicago River. It was the first of its type in the Netherlands. The
    steelwork was made by the Nederlandsche Dok Maatschappij (NDM) in Amsterdam-Noord and brought in by
    ship.


    The national register credits Piet Kramer of the Bridges section of Public Works (Publieke Werken).
    Dutch Wikipedia names Jan Leupen of the Buildings section, possibly prompted by his chief W.A. de
    Graaf. Either way, the heavy southern pier, which holds the pivot, counterweight cellar and motor
    room, looks like one of Kramer''s brick bastions. Unusually for Amsterdam, the steel girders run above
    the deck as well as below it, and are rounded off where they swing down into the pier.


    Look for:

    - the brick and stone pier on the south side, with abstract carved decoration

    - the riveted steel trusses sloping up towards the pivot

    - the wrought-iron balustrade and the matching lamp posts

    - the glass bridge-keeper''s house of 2000

    '
