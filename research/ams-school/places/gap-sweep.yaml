  nl:
    title: Gebouw De Nederlanden (Dikker & Thijs)
    summary: 'Vroeg winkel- en kantoorgebouw met betonskelet (1914–1915) op de hoek van Prinsengracht
      en Leidsestraat: donkere baksteen, ronde erkers en een stenen feniks op de hoek, naar zakelijk-expressionistisch
      ontwerp van B.J. Ouëndag.'
    body: 'Levensverzekeringsmaatschappij De Nederlanden liet dit hoekpand in 1914–1915 bouwen naar een
      ontwerp van Bert Johan Ouëndag, met winkels beneden en kantoren erboven, rond een skelet van gewapend
      beton. Na de naamsuitbreiding tot De Nederlanden van 1870 kwam er een grote lichtreclame ''1870''
      op het dak. De winkels werden verpacht aan een hoeden- en pettenzaak; in 1921 kwam er een oestersalon.
      Vanaf 1922 zat hier delicatessenzaak Dikker & Thijs, met op de eerste verdieping een restaurant
      voor oesters, kreeft en kaviaar dat in 1957 een van de eerste Michelinsterren van Nederland kreeg.
      Van 1970 tot 1994 was het een van de chicste restaurants van de stad; het hotel draagt de naam nog.


      Het rijksregister noemt het ontwerp zakelijk-expressionistisch. Het is een voorloper: het ritme
      van donkere baksteen, natuursteen en uitgebouwde erkers en de abstract gebeeldhouwde kapitelen lopen
      vooruit op wat de Amsterdamse School kort daarna zou doen.


      Let op:

      - de zware, zwarte natuurstenen rustica-pilasters rond de etalages

      - de halfronde erkers op de derde en vierde bouwlaag, met natuurstenen stijlen

      - de bovenste verdieping met diepliggende vensters achter een opengewerkte borstwering, tussen bakstenen
      pijlers met abstracte kapitelen

      - de gebeeldhouwde vogel (een feniks?) boven de daklijst op de afgeschuinde hoek

      '
    attributes:
      client: Levensverzekeringsmaatschappij De Nederlanden
      original_use: Winkels en kantoren
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/518364
    - https://nl.wikipedia.org/wiki/Dikker_%26_Thijs
- title: Heineken brewery cold store (Heineken Experience)
  summary: The brewery's closed brick block of 1933–1934 on the Stadhouderskade, built of cubic volumes
    around fermenting cellars, with gold letters and a slim clock tower. Now the Heineken Experience.
  body: 'Heineken brewed on the Stadhouderskade until 1988. The Ouëndag office designed this building
    in 1933–1934 as a store, cold store and fermenting house on the corner with the Ferdinand Bolstraat.
    Its façades are almost blind because the lager cellars on the first floor and the fermenting cellars
    on the second and third needed a constant temperature. Huge steel fermenting tanks still stand inside.
    On the roof, set back, is the long cooling room under a pitched roof. There the wort was cooled, with
    37 windows on each side that could be opened.


    The national register calls it typical of the businesslike expressionist manner (*zakelijk-expressionistisch*):
    a composition of cubic brick volumes rather than the sculpted façades of the 1910s, belonging to the
    sober late phase of the Amsterdam School. Today it houses the Heineken Experience. Fittings added
    for the visitor attraction are not part of the protection.


    Look for:

    - the broad blind front with HEINEKEN BROUWERIJ in gold letters

    - the tower-like projection on the right, with a gilded clock and a very narrow vertical slit

    - the alternating header and stretcher courses of red-brown brick above a rough-hewn stone plinth

    - on the Ferdinand Bolstraat, the tall closed bay ending in a gable with a stepped plaster frieze

    '
