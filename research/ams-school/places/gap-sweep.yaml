  nl:
    title: Koelhuis Heineken-brouwerij (Heineken Experience)
    summary: Gesloten bakstenen bedrijfsgebouw uit 1933–1934 aan de Stadhouderskade, opgebouwd uit kubische
      volumes rond lig- en gistkelders, met gouden letters en een smalle klokkentoren. Nu de Heineken
      Experience.
    body: 'Op de hoek van Stadhouderskade en Ferdinand Bolstraat liet Heineken''s Bierbrouwerij in 1933–1934
      dit bedrijfs-, opslag- en koelgebouw neerzetten naar ontwerp van het bureau van B.J. en W.B. Ouëndag.
      De gevels zijn vrijwel gesloten, omdat de ligkelders op de eerste verdieping en de gistkelders op
      de tweede en derde verdieping een constante temperatuur nodig hadden. Binnen staan nog de stalen
      gistbakken, sommige tien bij zes meter. Teruggezet op het dak ligt het koelschip onder een zadeldak,
      waar de wort werd gekoeld; aan weerszijden konden 37 ramen met bijzondere ijzeren tracering open.


      Het rijksregister noemt het gebouw ''in kenmerkende zakelijk-expressionistische trant'': een opbouw
      uit kubische bakstenen volumes in plaats van de gebeeldhouwde gevels van de vroege Amsterdamse School.
      Tot 1988 werd hier gebrouwen; nu is het de Heineken Experience. Wat daarvoor recent is aangebracht,
      valt buiten de bescherming.


      Let op:

      - het brede, gesloten gevelvlak met ''HEINEKEN BROUWERIJ'' in gouden letters

      - de torenachtige uitbouw rechts met vergulde wijzerplaat en een zeer smalle, hoge muuropening

      - de wisselende koppen- en strekkenlagen van roodbruine baksteen op een ruw behakte natuurstenen
      plint

      - aan de Ferdinand Bolstraat de hoge gesloten erkerpartij met topgevel en een klimmend gepleisterd
      fries

      '
    attributes:
      architect: B.J. en W.B. Ouëndag
      client: Heineken's Bierbrouwerij
      original_use: Bedrijfsgebouw, opslag en koelhuis van de brouwerij
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/527811
- title: Candida office building
  summary: 'A ten-storey office tower of 1931–1932 between the Nieuwezijds Voorburgwal and the Spuistraat
    by F.A. Warners: brick hung on a concrete frame, steel window strips and a glass lift bay, in what
    the register calls a cubist-expressionist manner.'
  body: 'Frederik Adriaan Warners, an architect with a strong eye on America, designed this office building
    in 1931–1932 for a company that developed rental flats (the N.V. Amsterdamsche Maatschappij tot Exploitatie
    van Etagewoningen). On a plot of under 400 m² it rises ten storeys: brick walls hung on a reinforced-concrete
    frame, with continuous steel window strips. It went up next to the Neptunus office building.


    Elsewhere on this map Warners appears with the cubic villas and flats of Plan Zuid and the Atlanta
    office by the Leidsebosje. Candida takes that line further, close to the Nieuwe Bouwen, while keeping
    decorative brickwork between the window strips. The national register praises the unusual front and
    the close link between exterior and interior.


    Look for:

    - the narrow entrance bay on the Nieuwezijds Voorburgwal, where a three-sided steel bay holds the
    lift and rests on the canopy like a glass column

    - the stone ground floor with deep-set, barred windows

    - the patterned brickwork between the steel window strips and on the recessed top floor

    - on the Spuistraat side, the round balconies stacked up one corner as an open fire escape

    '
  category: commercial
  lat: 52.375281
  lng: 4.8918
  address: Nieuwezijds Voorburgwal 120–126, Spuistraat
