- title: Wilhelmina Gasthuis surgical clinic
  summary: 'The last big addition to the old municipal hospital (1932–1933): a symmetrical brick double
    clinic with a clock turret, granite doorways and reliefs by Hildo Krop of surgeons and an archer.'
  body: 'In 1925 the Wilhelmina Gasthuis (WG), Amsterdam''s municipal hospital since 1893, began replacing
    its first pavilions. This double surgical clinic of 1932–1933 was the largest of the new buildings.
    E.P. Messer of the Public Works department designed it, and the national register calls it a characteristic
    example of sober, businesslike expressionist (*zakelijk-expressionistisch*) hospital architecture.
    The two halves probably first separated men and women. The hospital moved to the AMC in the early
    1980s, and the clinic is now flats and workspace on the WG-terrein.


    The long building faces the WG-plein, with its back to the quay of the Jacob van Lennepkanaal. A five-storey
    centre block under a tiled hipped roof is flanked by four-storey wings, linked by hook-shaped balconies.
    At the rear, tall windows in shallow bays and big roof lights brought daylight into the operating
    theatres.


    Hildo Krop made the sculpture in 1929. Inside, the right-hand stair hall keeps a wrought-iron balustrade,
    and two original murals survive: Pasteur and Lister by W. Molin (1937) and a nurse with grateful patients
    by Bouhuijs.


    Look for:

    - Krop''s figurative stones by the entrances: two surgeons, an arrow piercing a rose and an archer

    - the granite door surrounds

    - the clock turret on the central roof

    - the brick bands framing panels of upright headers between the windows

    - from the canal side, the tall operating-theatre windows

    '
