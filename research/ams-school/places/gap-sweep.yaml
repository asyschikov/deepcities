  nl:
    title: Lloyd Hotel en kantoor KHL
    summary: 'Een groot bakstenen landverhuizershotel (1918–1921) met natuurstenen klokkentoren en ernaast
      het kantoor van de rederij: Duits georiënteerd baksteenexpressionisme met invloeden van de Amsterdamse
      School.'
    body: 'De Koninklijke Hollandsche Lloyd (KHL), voortgekomen uit de Zuid-Amerika Lijn, legde zich toe
      op passagiersvervoer naar Zuid-Amerika en bouwde aan de Oostelijke Handelskade een eigen complex.
      Architect was Evert Breman, eerder stadsarchitect en vooral bekend van Hollandse neorenaissance.
      Eerst kwam het langgerekte kantoorgebouw (1915–1917), daarna het landverhuizershotel, in 1918 ontworpen
      en op 1 juni 1921 opgeleverd. Het bood tijdelijk onderdak aan zo''n 900 mensen. Velen waren arme
      Joden uit Oost-Europa die de pogroms ontvlucht waren; artsen van de GG&GD onderzochten hen en hun
      kleding en bagage werden ontsmet. De bouw kostte acht keer zoveel als begroot, wat bijdroeg aan
      het faillissement van de KHL in 1936.


      Daarna volgde een bewogen geschiedenis: vanaf 1938 opvang voor Joodse vluchtelingen uit nazi-Duitsland,
      in de oorlog Huis van Bewaring III (in 1941 werden er zo''n honderdvijftig Februaristakers opgesloten),
      tot 1989 gevangenis en jeugdgevangenis, daarna ateliers. Sinds 2004 is het weer hotel, sinds 2023
      onder de naam The Hoxton, Lloyd Amsterdam.


      Nederlandse bronnen noemen het hotel eclectisch, met invloeden van de Amsterdamse School. Het rijksregister
      spreekt bij beide gebouwen van ''Duits georiënteerde expressionistische baksteenarchitectuur''.
      Het is dus een tijdgenoot van de Amsterdamse School, geen schoolvoorbeeld ervan.


      Let op:

      - de middentoren van het hotel met natuurstenen hoekbekroningen, een achtzijdige trommel met keramische
      bekleding en vier wijzerplaten, en een windwijzer met scheepsmotief

      - de zware luifel op gebeeldhouwde consoles, bekleed met lood

      - de topgevels met ojiefmotief en een gebeeldhouwd wapen onder een kroon

      - bij het kantoor het siermetselwerk in banden, de driezijdige erkers onder gemetselde balkons en
      de smeedijzeren vlaggenmasthouders op de hoeken

      '
    attributes:
      client: Koninklijke Hollandsche Lloyd
      original_use: Landverhuizershotel en rederijkantoor
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/523289
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/523290
    - https://nl.wikipedia.org/wiki/Lloyd_Hotel_(hotel)
    - https://nl.wikipedia.org/wiki/Evert_Breman
- title: De Nederlanden building (Dikker & Thijs)
  summary: 'An early concrete-framed office and shop block of 1914–1915 on the corner of the Prinsengracht
    and Leidsestraat: dark brick, round bays and a stone phoenix on the corner, by B.J. Ouëndag.'
  body: 'The life insurer De Nederlanden commissioned this corner block in 1914 from Bert Johan Ouëndag.
    It went up with a reinforced-concrete frame, shops on the ground floor and offices above. After the
    company became De Nederlanden van 1870, a large "1870" sign went up on the roof. In 1921 the lower
    floors became an oyster bar. From 1922 the delicatessen Dikker & Thijs had its shop here, with a famous
    restaurant upstairs that won one of the first Michelin stars in the Netherlands in 1957. A hotel still
    carries the name.


    The national register calls the design businesslike expressionist (*zakelijk-expressionistisch*).
    Built just before Van der Mey''s Scheepvaarthuis was finished, it is a precursor rather than a full
    Amsterdam School work. Its rhythm of dark brick, stone and projecting bays, and its abstract carved
    capitals, point in the same direction.


    Look for:

    - the heavy black stone rusticated pilasters framing the shop windows

    - the round bays on the third and fourth floors, divided by stone mullions

    - the top floor''s recessed windows behind an open brick parapet, between brick pillars with abstractly
    carved stone capitals

    - the stone bird (a phoenix?) above the cornice on the cut-off corner

    '
  category: commercial
