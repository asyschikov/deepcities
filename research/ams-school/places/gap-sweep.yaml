  nl:
    title: Mariniersbrug (brug 272)
    summary: 'De eerste basculebrug van het Chicagotype in Nederland (1935), over de Dijksgracht: een
      stalen val die kantelt in een pijler van baksteen en natuursteen die aan de bastions van Piet Kramer
      doet denken.'
    body: 'Voor de verhoging van de spoordijk (Spoorwegwerken Oost) moest de weg onder het spoor omlaag
      en moest de oude draaibrug over de Dijksgracht weg. Er bleef wel een brede doorvaart nodig voor
      de werven op Oostenburg. Zo kwam er een enkele basculebrug met een val van 22 meter, naar het voorbeeld
      van de bruggen over de Chicago River: de eerste van dit type in Nederland. De Nederlandsche Dok
      Maatschappij (NDM) in Amsterdam-Noord maakte de constructie, die in september 1935 per schip werd
      aangevoerd. In december 1935 ging de brug open. Samen met de wanden van het spoorviaduct, een seinhuis
      en een brugwachtershuisje vormde ze één ontwerp; seinhuis en brugwachtershuisje verdwenen in 1955.


      Het rijksregister noemt P.L. Kramer van de afdeling Bruggen van Publieke Werken als ontwerper. Volgens
      Wikipedia was het Jan Leupen van de afdeling Gebouwen, mogelijk onder invloed van zijn chef W.A.
      de Graaf. De zware zuidelijke pijler, met draaias, ballastkelder en machinekamer, ''doet sterk denken
      aan de Amsterdamse School van Piet Kramer''. Bijzonder is dat de stalen spanten niet alleen onder
      maar ook boven het brugdek lopen; waar ze bij het openen de kelder in draaien, zijn ze afgerond.


      Let op:

      - de pijler van baksteen en natuursteen aan de zuidkant, met geabstraheerd beeldhouwwerk

      - de geklonken stalen vakwerkspanten die oplopen naar de draaias

      - de smeedijzeren balustrade en de bijpassende lantaarnpalen

      - het glazen brugwachtershuisje van Hans Bloem (2000)

      '
