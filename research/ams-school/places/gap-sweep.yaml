  nl:
    title: Chirurgische kliniek Wilhelmina Gasthuis
    summary: 'De laatste grote uitbreiding van het oude gemeenteziekenhuis (1932–1933): een symmetrische
      dubbele kliniek met dakruiter, granieten entrees en gevelstenen van Hildo Krop met chirurgen en
      een boogschutter.'
    body: 'Vanaf 1925 kreeg het Wilhelmina Gasthuis, sinds 1891–1893 het gemeentelijk ziekenhuis buiten
      de Singelgracht, nieuwe paviljoens die het karakter van het terrein helemaal veranderden. De dubbele
      chirurgische kliniek uit 1932–1933 is daarvan de grootste. Het ontwerp kwam van E.P. Messer van
      de Dienst Publieke Werken. Het rijksregister noemt het gebouw een kenmerkend voorbeeld van zakelijk-expressionistische
      ziekenhuisbouw. De twee helften waren vermoedelijk eerst naar geslacht gescheiden; later werd de
      rechterhelft de afdeling algemene chirurgie. Na de verhuizing van het WG naar het AMC (1981–1983)
      kregen de gebouwen een woon- en werkbestemming.


      Het gebouw ligt met de voorgevel aan het WG-plein en met de achtergevel tegen de kademuur van het
      Jacob van Lennepkanaal. Een hoofdgebouw van vijf bouwlagen met mezzanino en kap onder een schilddak
      wordt geflankeerd door zijvleugels van vier lagen, verbonden door haakvormige balkons. Aan de achterkant
      gaven hoge vensters in ondiepe erkers en grote liggende daklichten licht aan de operatiekamers.


      Het bouwbeeldhouwwerk is van Hildo Krop (1929). Binnen zijn de smeedijzeren trapbalustrade in het
      rechter trappenhuis en twee wandschilderingen bewaard: Pasteur en Lister van W. Molin (1937) en
      een verpleegster met dankbare patiënten van Bouhuijs, met het Amsterdamse wapen op haar uniform.


      Let op:

      - Krops gevelstenen van bijna een meter hoog: twee chirurgen, een pijl in een roos en een boogschutter

      - de granieten omlijstingen van de entrees

      - de dakruiter met wijzerplaat op het middendeel

      - de gemetselde lijsten rond velden met staande strekken tussen de vensters

      - aan de kanaalkant de hoge vensters van de operatiekamers

      '
    attributes:
      architect: E.P. Messer (Publieke Werken)
      client: Gemeente Amsterdam
      artists: Hildo Krop (beeldhouwwerk); W. Molin, Bouhuijs (wandschilderingen)
      original_use: Chirurgische kliniek van een ziekenhuis
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/524815
    - https://nl.wikipedia.org/wiki/Wilhelmina_Gasthuis
- title: Lloyd Hotel and KHL office
  summary: 'A grand brick hotel for emigrants bound for South America (1918–1921), with a stone clock
    tower, and the shipping line''s office next door: brick expressionism with a German accent on the
    Eastern Docklands.'
  body: 'The Royal Holland Lloyd (Koninklijke Hollandsche Lloyd, KHL) ran a passenger line to South America
    and built its own small complex on the Oostelijke Handelskade. Evert Breman, a former city architect
    better known for neo-Renaissance work, designed it: first a long two-storey office (1915–1917), then
    the emigrants'' hotel (designed 1918, opened 1 June 1921). The hotel was meant to house up to 900
    people waiting for the ship. Many were Jews from Eastern Europe fleeing pogroms; on arrival they were
    checked by doctors and their luggage was disinfected. It cost eight times the estimate, which helped
    bring the KHL down in 1936.


    The building had a long second life: a shelter for Jewish refugees from Germany from 1938, a prison
    during the war and a (youth) prison until 1989, then artists'' studios. It reopened as a "cultural
    embassy" hotel in 2004, with MVRDV, and since 2023 it has been The Hoxton, Lloyd Amsterdam.


    Breman''s style is a mix. English Wikipedia calls the hotel eclectic, and Dutch sources see Amsterdam
    School influence in the brickwork. The national register describes both buildings as German-oriented
    expressionist brick architecture. Here the Amsterdam School shows as a contemporary current, not the
    source.


    Look for:

    - the hotel''s central tower, with its stone corner finials, a ceramic-clad octagonal drum with four
    clock faces, and a weathervane shaped like a ship

    - the heavy porch canopy on carved brackets, edged in lead

    - the end gables with ogee curves and the arms under a crown

    - on the office, decorative brick bands and three-sided bays under brick balconies, and the corner
    flagpole holders

    '
