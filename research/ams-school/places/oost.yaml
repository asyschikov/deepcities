- title: Hartmanbrug (Brug 190)
  summary: A brick bridge of 1936 by Piet Kramer linking the Indische Buurt with Watergraafsmeer across
    the Ringvaart. Residents argued about it for nearly ten years before it was built.
  body: 'In 1927 the city planned a temporary wooden footbridge here, at the end of the Molukkenstraat.
    Residents of the Celebesstraat protested, because they wanted the crossing in line with their own
    street. They got the Caroline Herschelbrug, and the Molukkenstraat waited. Public Works designed a
    proper bridge only in 1932. Piet Kramer drew it in his familiar brick Amsterdam School manner. It
    was tendered in 1935 for 26,000 guilders and opened in 1936. Since 2011 it has been called the Hartmanbrug.


    Look for:

    - the large brick surfaces of the abutments and balustrades

    - the view along the Ringvaart between the Valentijnkade and the Ooster Ringdijk

    '
