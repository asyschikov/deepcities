- title: Frankendaelbrug (Brug 217)
  summary: The Middenweg's culvert bridge over the Molenwetering, rebuilt and widened to Piet Kramer's
    design in 1930–1931 and adapted again under him around 1951. Trams still rumble over its brick and
    granite.
  body: 'The first bridge here, from 1923, was paid for by the parish of the Martyrs of Gorcum, which
    was building the Hofkerk next door. In 1930–1931 Public Works renewed and widened it for 15,000 guilders,
    to a design by Piet Kramer. Around 1951 it had to be adapted again, and Kramer supervised that work
    too. Tram 9 and buses now cross it on the Middenweg, the old main road through the polder.


    Look for:

    - large surfaces of brick, laid horizontally on the water side

    - Kramer''s granite keystones and blocks

    - the low culvert opening, best seen from the water''s edge

    '
