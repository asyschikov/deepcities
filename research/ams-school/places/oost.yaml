- title: Berlagebrug and Schollenbrug (Brug 423, 340)
  summary: 'Berlage''s last major Amsterdam work: the 1932 gateway bridge over the Amstel, with a brick
    control tower and Hildo Krop''s Genius of Amsterdam, and its smaller twin over the Ringvaart on the
    east bank.'
  body: 'The city gave H.P. Berlage the honour of designing the new Amstel bridge for his Plan Zuid, and
    it was named after him. Berlage drew the architecture, and C. Biemond, head of the Public Works bridges
    section, the steel engineering. The bridge opened on 28 May 1932. It is a flat steel bascule bridge
    about 100 metres long and 24 metres wide, with five openings. The register calls the style "businesslike
    expressionist". Orange facing brick on the piers, Bavarian granite for the structural parts, and an
    asymmetrical control tower make it a gateway to the city by land and water. The lamp posts, railings
    and boathouses were part of the design.


    The smaller Schollenbrug (Brug 340), on the east bank where the Weesperzijde crosses the Ringvaart,
    belongs to the same ensemble. Both became national monuments in 2008. The boathouses on the Weesperzijde
    were rebuilt after the war.


    Look for:

    - Hildo Krop''s sculpture of the Genius of Amsterdam, the city''s protecting spirit, rising from the
    water

    - the brick control tower set over one of the piers

    - the widened brick corner blocks where the bridge meets the quays

    - the integrated lamp posts and railings

    '
