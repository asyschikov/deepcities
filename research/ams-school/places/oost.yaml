- title: Krugerhof
  summary: A U-shaped block of about a hundred workers' flats from 1929–1930, by A.J. Westerman and Jacob
    Dunnebier, in four colours of brick with corner towers — a commercial experiment in the stricter late
    Amsterdam School.
  body: 'The developer Huibert van Saane, director of the Maatschappij voor Moderne Woningbouw, applied
    for a permit in March 1929. Building started that year and the flats were handed over in early 1930.
    Arend Jan Westerman designed the façades and Jacob Dunnebier the floor plans. The block wraps in a
    U around a garden on the Tugelaweg, Maritzstraat and Christiaan de Wetstraat. On the Maritzstraat
    it steps back from the building line, and the garden there once had a summer house and a sandpit.
    The name comes from the nearby Krugerplein.


    The flats were small but modern for working-class housing: a living room, two bedrooms, a kitchen
    and a bathroom with a bath, central heating and hot water. Stairwells with double half-landings saved
    space. The socialist daily Het Volk thought the experiment had failed: the flats were cramped for
    families and the rents high compared with municipal housing.


    Look for:

    - the four brick colours: reddish-brown ground floor, yellow bands around entrances, corners and first
    floor, red upper floors, and a fourth colour on the towers

    - the corner towers roofed with vertically laid dark-red tiles

    - bay windows on the two corners above the shops

    - inward-facing balconies and the open garden on the Maritzstraat side

    '
  category: housing
  lat: 52.354704
  lng: 4.919247
  address: Christiaan de Wetstraat 3-19, Maritzweg 2-22, Tugelaweg 70-77
