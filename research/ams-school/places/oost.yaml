  nl:
    title: Berlagebrug en Schollenbrug (brug 423, 340)
    summary: 'Berlages ere-opdracht: de stalen basculebrug over de Amstel uit 1932, met bakstenen bedieningstoren
      en Hildo Krops Genius van Amsterdam, en de kleinere Schollenbrug over de Ringvaart aan de oostoever.'
    body: 'De gemeente gaf H.P. Berlage de ere-opdracht voor de nieuwe Amstelbrug, die daarom zijn naam
      kreeg. Berlage verzorgde de esthetiek, C. Biemond, directeur van de afdeling Bruggen van Publieke
      Werken, de techniek. De brug werd op 28 mei 1932 officieel in gebruik genomen. Het is een vlakke
      stalen basculebrug van ruim honderd meter lang en 24 meter breed met vijf doorvaarten, door het
      Rijk omschreven als ''zakelijk expressionistisch''. Oranje verblendsteen, Beiers graniet voor de
      constructieve delen en een asymmetrisch geplaatste bedieningstoren maken haar tot stadspoort, te
      land en te water. Hekwerk, lantaarnpalen en botenhuizen horen bij het ontwerp.


      De Schollenbrug (brug 340), waar de Weesperzijde de Ringvaart kruist, hoort bij hetzelfde ensemble.
      Beide bruggen werden in 2008 rijksmonument. De botenloodsen aan de Weesperzijde zijn na de oorlog
      herbouwd.


      Let op:

      - het beeld van Hildo Krop: de genius van Amsterdam, die bij de Dam uit het water oprijst

      - de bakstenen bedieningstoren in het verlengde van een van de pijlers

      - de verbrede gemetselde hoekblokken bij de landhoofden

      - de lantaarnpalen en het hekwerk als onderdeel van het ontwerp

      '
    attributes:
      architect: H.P. Berlage, met C. Biemond (Publieke Werken)
      original_use: Basculebrug en vaste brug
