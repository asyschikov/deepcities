    summary: Twee Kramerbruggen uit 1949, op twintig meter van elkaar. Brug 441 in de Hugo de Vrieslaan
      is bijna 28 meter breed bij een doorvaart van amper 3 meter en heeft een draperend smeedijzeren
      hekwerk.
    body: 'De twee bruggen werden samen aanbesteed in 1949. Brug 441 ligt in de Hugo de Vrieslaan over
      een afwateringstocht van de Molenwetering, zo laag dat alleen een kano erdoor kan; ze is bijna 28
      meter breed, de doorvaart amper 3 meter. Opvallend is de smeedijzeren balustrade: de bovenste buizen
      hangen in een draperende lijn en dalen aan de uiteinden de borstwering in, net als bij Kramers betonnen
      bruggen in het Amsterdamse Bos. Brug 436, in de Fizeaustraat over de Fahrenheitsingel, mist de bekende
      versieringen, maar de balustrades, die voorbij het landhoofd de grond in lopen, verraden zijn hand.


      Let op:

      - de draperende buisleuning van brug 441

      - de manier waarop de balustrades eindigen: in de borstwering bij brug 441, in de grond bij brug
      436

