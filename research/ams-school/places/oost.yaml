  nl:
    title: Kramerbruggen aan het Galileïplantsoen (brug 235, 335, 336, 337, 338)
    summary: Vijf lage bruggen van baksteen en graniet over de Molenwetering, rond 1928 ontworpen door
      Piet Kramer en samen goed voor net geen 60.000 gulden. De pijlers lijken op stapels damstenen.
    body: 'Toen Amsterdam eind jaren twintig het noordelijke deel van de Watergraafsmeer bebouwde, werd
      de oude Molenwetering de as van een lange groenstrook, het Galileïplantsoen. Piet Kramer, bruggenarchitect
      van de Dienst der Publieke Werken, ontwierp voor de dwarsstraten een reeks brede duikerbruggen.
      Ze dateren van omstreeks 1928 en kostten samen net geen 60.000 gulden. Twee kregen recent een naam:
      de Jaap Kruizingabrug (2015), naar de onderwijzer en schrijver van onder meer ''Amsterdam, stad
      der duizend bruggen'', en de Henk van Laarbrug (2017), naar de onderwijzer, verzetsman en medeoprichter
      van Ons Amsterdam.


      Van west naar oost gaat het om de Henk van Laarbrug (brug 235, Linnaeusparkweg), de Jaap Kruizingabrug
      (brug 335, Radioweg), de Hans Lipperheybrug (brug 336, Archimedesweg), brug 337 (Galileïplantsoen)
      en brug 338 (Johannes van der Waalsstraat). Het zijn sobere Kramerbruggen: weinig beeldhouwwerk
      en siersmeedwerk alleen bij de landhoofden. De afwisseling van baksteen en graniet verraadt zijn
      hand.


      Let op:

      - de pijlers van afwisselend baksteen en graniet, als een stapel damstenen

      - bakstenen balustrades met granieten blokjes en sluitstenen

      - bij de Henk van Laarbrug: horizontaal gemetselde baksteen aan de waterkant, verticaal aan de straatkant

      - siersmeedwerk alleen aan de uiteinden

      - het zicht langs het water op de kerk van Kruyswijk en de montessorischool

      '
    attributes:
      architect: Piet Kramer (Publieke Werken)
      original_use: Bruggen
