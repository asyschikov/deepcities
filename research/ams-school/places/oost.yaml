  nl:
    title: Apostolisch Genootschap Watergraafsmeer
    summary: Kerkgebouw uit 1931 van Cornelis Kruyswijk aan de kop van het Galileïplantsoen. Het hoge
      schuine dak met zwart verglaasde pannen en de ranke klokkentoren kwamen er op eis van de schoonheidscommissie.
    body: 'In 1929 kreeg Cornelis Kruyswijk de opdracht voor een kerk met woonhuis voor de Hersteld Apostolische
      Zendinggemeente (HAZEA), die het gebouw op 25 januari 1931 in gebruik nam, met zo''n 800 zitplaatsen
      in de grote zaal. Kruyswijk had een plat dak getekend, maar de schoonheidscommissie wilde een monumentale
      afsluiting van het Galileïplantsoen. Zo kwam er een hoog schuin dak met zwart verglaasde Romaanse
      pannen, en ook een toren, die uiteindelijk door de gemeente werd betaald. Het uurwerk is nog altijd
      gemeentebezit.


      De gevels zijn opgetrokken in geel genuanceerde gevelklinkers op een plint van blauwe klinkers;
      hoge, smalle gebrandschilderde ramen verlichten de zaal. Het interieur werd in 1931 uit geldgebrek
      sterk vereenvoudigd, in 1968 verbouwd en in 1999 gerenoveerd met Kruyswijks oorspronkelijke ontwerp
      als leidraad. Sinds 1992 is het gebouw gemeentelijk monument, als typerend voorbeeld van laat-Amsterdamse
      School.


      Let op:

      - het grote schuine dak boven de rechthoekige zaal, als blikvanger aan het eind van het plantsoen

      - de ranke toren met torenklok

      - de luifeltjes boven ramen en deuren, laddervensters en gedetailleerd metselwerk

      - de zeer smalle, hoge trappenhuisramen die een kleine erker vormen

      '
