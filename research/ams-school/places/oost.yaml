- title: Berlageblokken
  summary: Three housing blocks of 1911–1915 by H.P. Berlage for the association De Arbeiderswoning, with
    stair towers that turn into five-sided bays. They are the rationalist forerunners the Amsterdam School
    grew out of, and were saved from demolition after a squat.
  body: 'Berlage designed these three blocks between the Javastraat and the Balistraat for the housing
    association De Arbeiderswoning. They were meant for large families on low incomes. Two blocks are
    closed around communal inner gardens, and the third makes a U against existing buildings. Berlage
    added two cross streets to give the flats more sun, and drew on English social housing and on Jan
    Ernst van der Pek''s earlier blocks. Van der Pek''s own Rochdale block of 1909–1912 stands across
    the Balistraat.


    The register calls the style rationalism, not Amsterdam School. But Berlage''s honest brickwork and
    the idea of a block designed as one unit were the starting point for De Klerk, Kramer and the others.
    The blocks were renovated in 1969–1971 and threatened with demolition in the 1990s. Local protest
    got them onto the national register in 2004. They were squatted, cleared on 14 December 2004, and
    then renovated into owner-occupied, social-rent and student flats.


    Look for:

    - the stair-tower bays that start on stepped corbels and turn five-sided from the second floor

    - the double moulding of rough-cut brick lintels running round the whole block

    - the recessed corners with small planted areas

    - the arched window under each bay, with paired casements

    '
