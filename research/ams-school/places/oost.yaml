- title: Kramer bridges on the Galileïplantsoen (Brug 235, 335, 336, 337, 338)
  summary: Five brick-and-granite bridges that Piet Kramer built over the Molenwetering in 1928, for just
    under 60,000 guilders together. Their piers look like stacks of draughts pieces.
  body: 'When Amsterdam built the new northern part of Watergraafsmeer in the late 1920s, the old drainage
    ditch, the Molenwetering, became the centrepiece of a long green strip, the Galileïplantsoen. Piet
    Kramer, the city''s bridge architect at Public Works, designed a set of low, wide culvert bridges
    to carry the cross streets over it. They were built around 1928 and cost just under 60,000 guilders
    together. Two were named in 2015–2017 after local historians who taught in the area: Jaap Kruizinga,
    author of books on Amsterdam''s bridges, and Henk van Laar, a co-founder of the society Ons Amsterdam
    and a member of the wartime resistance.


    The family runs, roughly from west to east, from the Henk van Laarbrug (Brug 235, Linnaeusparkweg)
    through the Jaap Kruizingabrug (Brug 335, Radioweg), the Hans Lipperheybrug (Brug 336, Archimedesweg)
    and Brug 337 (Galileïplantsoen) to Brug 338 (Johannes van der Waalsstraat). They show Kramer''s sober
    side. There is little sculpture, and the wrought iron is kept to the abutments, but the mix of brick
    and granite is unmistakably his.


    Look for:

    - piers of alternating brick and granite courses, like stacks of draughts pieces (damstenen)

    - brick balustrades set with small granite blocks and keystones

    - on the Henk van Laarbrug, brick laid horizontally on the water side and vertically on the street
    side

    - wrought-iron railings only at the ends of the bridges

    - the view along the canal to Kruyswijk''s church and the Montessori school

    '
  category: bridges
