    summary: Bakstenen brug uit 1936 van Piet Kramer over de Ringvaart, tussen de Indische Buurt en de
      Watergraafsmeer. Er ging bijna tien jaar buurtdiscussie aan vooraf.
    body: 'Begin 1927 zou hier, in het verlengde van de Molukkenstraat, een houten noodbrug komen. Bewoners
      van de Celebesstraat protesteerden: zij wilden een brug in het verlengde van hun eigen straat. Die
      kwam er, de Caroline Herschelbrug, en de Molukkenstraat moest wachten. Pas in 1932 ontwierp Publieke
      Werken hier een vaste brug, door Piet Kramer in zijn vertrouwde Amsterdamse Schoolstijl met veel
      baksteen. Na een aanbesteding in 1935 voor 26.000 gulden ging de brug in 1936 open. Sinds 2011 heet
      ze Hartmanbrug.


      Let op:

      - de grote baksteenvlakken van landhoofden en balustrades

      - het zicht over de Ringvaart tussen Valentijnkade en Ooster Ringdijk

      '
