      hoofdweg door de polder.


      Let op:

      - de grote baksteenvlakken, aan de waterkant horizontaal gemetseld

      - Kramers granieten sluitstenen en blokjes

      - de lage duikeropening, het best te zien vanaf de waterkant

      '
