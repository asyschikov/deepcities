    summary: Brede duikerbrug uit 1941 van Piet Kramer in de Wibautstraat over de Ringvaart, met balustrades
      van baksteen en granieten blokjes in plaats van siersmeedwerk.
    body: 'Brug 427 voert de Wibautstraat over de Ringvaart van de Watergraafsmeer, tussen Transvaalkade
      en Ringdijk. De aanbesteding vond plaats op 28 april 1941; aannemers boden tussen 45.500 en 60.000
      gulden. De Amsterdamse School is terug te zien in de grote baksteenvlakken en Kramers afwisseling
      van natuursteen en baksteen. De gebruikelijke smeedijzeren balustrades ontbreken: ook die zijn van
      baksteen met granieten blokjes. Van 1942 tot 1971 lagen er tramsporen op de brug.


      Let op:

      - de bakstenen balustrades met granieten blokjes

      - de brede duikeropening over de Ringvaart

      '
