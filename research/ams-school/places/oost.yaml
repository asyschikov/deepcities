- title: Fré Cohenbrug and Rinus Michelsbrug (Brug 341, 245)
  summary: Two brick culvert bridges from Piet Kramer's office, barely five metres apart, at the entrance
    to Betondorp. One is named after the socialist graphic designer Fré Cohen, who lived on the Zaaiersweg.
  body: 'Where the Zaaiersweg leaves the Middenweg into Betondorp, the Molenwetering is crossed twice
    in quick succession. Brug 341 carries the Zaaiersweg and Brug 245 the Middenweg, and Kramer''s office
    also designed the low wall between them. The Fré Cohenbrug went up in the late 1920s, when Betondorp
    was finished; sources date the Middenweg bridge, which now carries tram 9, variously to the 1920s
    and the 1950s. Brug 245 was named in 2005 after the Ajax coach Rinus Michels, when nearby bridges
    got the names of his European Cup players. Brug 341 was named in 2016 after Fré Cohen, the graphic
    designer of the socialist movement, who lived on the Zaaiersweg from 1923.


    The bridges are plain, with no sculpture, but the brick, granite blocks and low arches are typical
    of Kramer''s many small bridges in Watergraafsmeer.


    Look for:

    - the very low span of the Fré Cohenbrug, too low for any boat

    - granite blocks set into the brick on the Rinus Michelsbrug

    - the connecting brick wall between the two bridges

    '
