  nl:
    title: Fré Cohenbrug en Rinus Michelsbrug (brug 341, 245)
    summary: Twee bakstenen duikerbruggen van het bureau van Piet Kramer, nog geen vijf meter uit elkaar,
      bij de entree van Betondorp. Eén is vernoemd naar de grafisch ontwerpster Fré Cohen, die aan de
      Zaaiersweg woonde.
    body: 'Waar de Zaaiersweg vanaf de Middenweg Betondorp in loopt, kruist de Molenwetering twee keer
      kort na elkaar: brug 341 in de Zaaiersweg en brug 245 in de Middenweg. Ook de tussenwal is van Kramers
      bureau. De Fré Cohenbrug verrees eind jaren twintig, toen Betondorp gereedkwam; de verkeersbrug
      in de Middenweg, waar nu tram 9 overheen rijdt, wordt afwisselend in de jaren twintig en de jaren
      vijftig gedateerd. Brug 245 werd in 2005 vernoemd naar Ajax-trainer Rinus Michels, toen ook andere
      bruggen in de buurt namen van zijn Europacupspelers kregen; brug 341 kreeg in 2016 de naam van Fré
      Cohen, grafisch ontwerpster van de arbeidersbeweging, die vanaf 1923 aan de Zaaiersweg woonde.


      Beeldhouwwerk ontbreekt, maar baksteen, granieten blokjes en lage bogen zijn kenmerkend voor Kramers
      vele kleine bruggen in de Watergraafsmeer.


      Let op:

      - de zeer lage overspanning van de Fré Cohenbrug, waar geen boot onderdoor kan

      - de granieten blokjes in het metselwerk van de Rinus Michelsbrug

      - de bakstenen tussenwal tussen beide bruggen

      '
    attributes:
      architect: Piet Kramer (Publieke Werken)
