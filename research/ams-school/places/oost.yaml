- title: Brug 304 (Linnaeushof)
  summary: A small 1924 culvert bridge by Piet Kramer that carries the path into the Linnaeushof over
    the Molenwetering. It has brick balustrades, granite blocks, and a vertically laid brick pier on one
    abutment.
  body: 'Brug 304 crosses the Molenwetering at one of the entrances to the Linnaeushof, the Catholic housing
    enclave built by A.J. Kropholler around his Hofkerk. Kropholler wrote in 1928 that one of the openings
    into the court was reached "over a little bridge", probably this crossing. Piet Kramer of Public Works
    designed the bridge in 1924 as a culvert. Unusually for him, the balustrades are brick rather than
    wrought iron. The ironwork on one of the quays may not be his.


    Look for:

    - the brick structure set with small granite blocks

    - the brick pillar on one abutment, laid vertically and topped with worked granite

    - the view into the Linnaeushof, a court of houses around the church (a traditionalist, not Amsterdam
    School, ensemble)

    '
