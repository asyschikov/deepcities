- title: Brug 427 (Wibautstraat)
  summary: 'The Wibautstraat''s 1941 bridge over the Ringvaart: a broad Piet Kramer culvert where even
    the balustrades are brick, set with granite blocks instead of wrought iron.'
  body: 'Brug 427 carries the Wibautstraat over the Ringvaart of Watergraafsmeer, between the Transvaalkade
    and the Ringdijk. It was tendered on 28 April 1941, with bids between 45,500 and 60,000 guilders,
    so it is one of Kramer''s wartime bridges. The style shows in the big brick surfaces and his familiar
    mix of natural stone and brick. His usual wrought-iron railings are missing; the balustrades are brick
    with granite blocks. Trams crossed it from 1942 to 1971.


    Look for:

    - the brick balustrades set with small granite blocks

    - the wide culvert opening over the Ringvaart

    '
