  nl:
    title: Berlageblokken
    summary: 'Drie woonblokken uit 1911-1915 van H.P. Berlage voor ''De Arbeiderswoning'', met trappenhuizen
      die overgaan in vijfzijdige erkers: rationalistische voorlopers van de Amsterdamse School, na kraak
      en acties gered van de sloop.'
    body: 'Berlage ontwierp de drie blokken tussen de Javastraat en de Balistraat voor de Vereeniging
      tot verbetering der Volkshuisvesting ''De Arbeiderswoning''. Ze waren bedoeld voor grote gezinnen
      met lage inkomens. Twee blokken zijn gesloten rond een gemeenschappelijke binnentuin, het derde
      sluit in een U-vorm aan op bestaande bebouwing. Voor betere bezonning legde Berlage twee dwarsstraten
      aan. Hij liet zich inspireren door Engelse sociale woningbouw en door het werk van Jan Ernst van
      der Pek, wiens blok voor Rochdale (1909-1912) aan de overkant van de Balistraat staat.


      Het Rijk rekent de blokken tot het rationalisme, niet tot de Amsterdamse School. Maar Berlages eerlijke
      baksteenarchitectuur en het als eenheid ontworpen bouwblok waren het vertrekpunt voor De Klerk,
      Kramer en hun generatie. In 1969-1971 werden de woningen gemoderniseerd, eind jaren negentig dreigde
      sloop. Na buurtacties volgde in 2004 de aanwijzing tot rijksmonument. Het complex werd gekraakt
      en op 14 december 2004 ontruimd, en daarna gerenoveerd tot koop-, huur- en studentenwoningen.


      Let op:

      - de trappenhuiserkers die op getrapte consoles beginnen en vanaf de tweede verdieping vijfzijdig
      worden

      - de dubbele sierlijst van ruw bewerkte strekken die rond het hele blok loopt

      - de inspringende hoeken met plantsoentjes

      - het segmentboogvenster onder elke erker

      '
    attributes:
      client: Vereeniging tot verbetering der Volkshuisvesting De Arbeiderswoning
      original_use: Arbeiderswoningen
