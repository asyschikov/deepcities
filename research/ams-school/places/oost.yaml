  nl:
    title: Kraaipanbuurt (Gratama & Versteeg)
    summary: Gemeentelijke woningbouw rond de Kraaipanstraat en de Transvaalkade uit het begin van de
      jaren twintig, van het bureau van Jan Gratama, die de term 'Amsterdamse School' muntte, en Gerrit
      Versteeg.
    body: 'De Transvaalbuurt werd vanaf 1903 aangelegd naar plannen van H.P. Berlage, en hier zette ook
      de Gemeentelijke Woningdienst haar eerste stappen. Rond de Kraaipanstraat experimenteerde de dienst
      met een alternatief voor het negentiende-eeuwse stratenplan: een ruim bouwblok met een buitenring
      en een binnenring van bebouwing, verwant aan de Zaanhof en het Zaandammerplein in de Spaarndammerbuurt.
      De gemeentelijke monumentenbeschrijving van de Linnaeushof dateert dit experiment in 1916.


      Het bureau van Jan Gratama en Gerrit Versteeg ontwierp de woningen, die rond 1920-1924 verrezen
      aan de Kraaipanstraat, Schalk Burgerstraat, Albert Luthulistraat, De la Reijstraat, Colensostraat
      en Transvaalkade. Gratama (1877-1947) was ook publicist en redacteur, en de eerste die de term Amsterdamse
      School gebruikte. Met Versteeg werkte hij daarna aan Betondorp en Plan West. In 2026 liep de procedure
      om het complex als gemeentelijk monument aan te wijzen.


      Let op:

      - de lange, eenvormige bakstenen gevelwanden aan de Transvaalkade, langs de Ringvaart

      - de binnenstraat van de Schalk Burgerstraat, omsloten door de buitenblokken

      - herhaalde portieken, pannendaken en bakstenen details die hele straten tot één ontwerp maken

      '
    attributes:
      architect: Bureau J. Gratama en G. Versteeg
      client: Gemeentelijke Woningdienst Amsterdam
