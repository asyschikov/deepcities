- title: Kramer's post-war bridges at Sportpark Drieburg (Brug 254, 267, 273)
  summary: Three plain brick culvert bridges around the Drieburg sports fields, designed by Piet Kramer
    around 1940–1941 but not built until 1950–1951. They show the very end of his bridge style.
  body: 'When the Fizeaustraat was extended past the sports fields and playground of Amsteldorp, the ring
    ditches around the fields needed crossings. Piet Kramer had designed them around 1940–1941, but the
    war delayed construction until 1950–1951. Brug 254 (Fizeaustraat) and Brug 273 (a foot and cycle bridge
    to the Von Liebigpad) cross the same ditch. Brug 267, on the extension towards the Kruislaan, is little
    more than two brick balustrades with granite end stones over a low arched culvert on timber piles.


    All three are plain. The natural stone, ornamental ironwork and sculpture of his 1920s bridges are
    gone, but the rounded brick balustrades still carry his signature. A few metres from Brug 254, the
    1960s-style Brug 479 shows how fast taste changed.


    Look for:

    - brick balustrades rounded off at the abutments (Brug 254)

    - granite end stones on Brug 267

    - the restrained ironwork of Brug 273

    '
