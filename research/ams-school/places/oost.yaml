- title: Caroline Herschelbrug (Brug 115)
  summary: A 1927 footbridge by Piet Kramer that joins the Celebesstraat to the Ooster Ringdijk across
    the Ringvaart. It was budgeted at just 5,500 guilders after residents insisted on a crossing in line
    with their street.
  body: 'In 1926 the city decided not to put a footbridge at the end of the Molukkenstraat, fearing the
    path would become a through road. Residents of the Celebesstraat argued that without a bridge they
    faced a long detour to Watergraafsmeer. In 1927 a footbridge was built in line with their street,
    to a design by Piet Kramer of Public Works, on a budget of 5,500 guilders. It is now named after the
    astronomer Caroline Herschel, matching the scientists'' names of the Watergraafsmeer streets beyond.


    Look for:

    - a Kramer bridge on a small, pedestrian scale

    - the contrast with the larger Hartmanbrug a few hundred metres east

    '
