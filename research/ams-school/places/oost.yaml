- title: Brug 441 and Brug 436 (Fahrenheitsingel)
  summary: Two Kramer bridges of 1949, twenty metres apart. Brug 441 in the Hugo de Vrieslaan is almost
    28 metres wide over a 3-metre channel, and its iron railings sag like draped rope.
  body: 'Both bridges were tendered together in 1949. Brug 441 carries the Hugo de Vrieslaan over a drainage
    channel of the Molenwetering. It sits so low that only a canoe can pass, and it is almost 28 metres
    wide over a channel barely 3 metres across. Its wrought-iron railing has top rails that hang in a
    draped curve and dip down into the parapets at the ends. Kramer used similar railings on his concrete
    bridges in the Amsterdamse Bos. Brug 436, in the Fizeaustraat over the Fahrenheitsingel, lacks his
    usual ornament, but the balustrades, which run down into the ground beyond the abutment, show his
    hand.


    Look for:

    - the draped tubular railing of Brug 441

    - how the balustrades end: dipping into the parapet on Brug 441, running into the ground on Brug 436

    '
