- title: Linnaeusstraat housing (Co Franswa)
  summary: A large 1930 Amsterdam School housing block by Co Franswa on the Linnaeusstraat, one of the
    few older buildings left around the new Oostpoort square on the site of the old eastern gasworks.
  body: 'Co (J.J.B.) Franswa designed this large block in 1930. It runs along the Linnaeusstraat (nos.
    197–225), the Nirwana (4–12) and the south side of what is now the Land van Cocagneplein (2–10). The
    surrounding Oostpoort district was built in the early 2000s on the site of the Oostergasfabriek (eastern
    gasworks), and its streets were named after utopias. That makes Franswa''s block, the 1887 gasworks
    engineer''s house in the middle of the square and the old retort house one of the rare older pieces
    in the area.


    The city listed the block as a municipal monument in 1998.


    Look for:

    - the long brick wall to the Linnaeusstraat, turning the corner onto the new square

    - the contrast with the 19th-century eclectic gasworks house standing free on the square

    '
