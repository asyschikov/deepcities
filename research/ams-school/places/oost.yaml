    body: 'Een eerste brug hier, uit 1923, werd betaald door het kerkbestuur van de parochie van de H.H.
      Martelaren van Gorcum, dat ernaast de Hofkerk liet bouwen. In 1930-1931 vernieuwde en verbreedde
      Publieke Werken de brug voor 15.000 gulden naar ontwerp van Piet Kramer. Rond 1951 volgde een nieuwe
