- title: Badhuis Boerhaaveplein (Badhuistheater)
  summary: A round brick bathhouse in the middle of a square, built by the city in 1920–1921 so that families
    in the new workers' blocks around it could wash. Since 1985 it has been a small theatre.
  body: 'In autumn 1918 the city decided to build a series of public bathhouses for neighbourhoods where
    new housing-association blocks had no bathrooms. Wartime material prices delayed the work, and the
    budget rose from 100,000 to 140,000 guilders before the job could be tendered in 1920. Arend Jan Westerman
    of the Public Works department (Publieke Werken) designed this one. Alderman Monne de Miranda and
    Mayor Willem de Vlugt opened it on 6 July 1921.


    It was the city''s first free-standing bathhouse, and its plan is a circle about nineteen metres across.
    Men and women had separate entrances on either side of the office. A corridor ran round the central
    waiting rooms and led to some twenty bath and shower cubicles. Above it rises a stepped, eight-sided
    roof with a squat central chimney. The bathhouse closed in the early 1980s, when urban renewal had
    given most homes in the Oosterparkbuurt their own shower. It reopened in 1985 as the Badhuistheater.


    The national register values it as a rare type and as a reminder of how closely the city linked good
    housing with hygiene.


    Look for:

    - the round wall of brown-red brick laid in stretcher bond, above a darker plinth with vent grilles
    for the old heating cellar

    - the metal letters GEMEENTEBADHUIS over the office window, with small ornaments either side

    - the left-hand porch, still marked "ingang mannen" (men''s entrance)

    - the shingled roof with its timber-clad clerestory and four small dormers

    '
  category: public-works
  lat: 52.359531
  lng: 4.912752
  address: Boerhaaveplein 28
