  nl:
    title: Naoorlogse Kramerbruggen bij Sportpark Drieburg (brug 254, 267, 273)
    summary: 'Drie sobere bakstenen duikerbruggen rond de sportvelden van Drieburg, rond 1940-1941 door
      Piet Kramer ontworpen maar pas in 1950-1951 gebouwd: het slot van zijn bruggenstijl.'
    body: 'Bij de verlenging van de Fizeaustraat langs de sportvelden en speeltuin Amsteldorp waren bruggen
      over de ringsloten nodig. Piet Kramer ontwierp ze rond 1940-1941, maar door de oorlog werden ze
      pas in 1950-1951 gebouwd. Brug 254 (Fizeaustraat) en brug 273 (fiets- en voetbrug naar het Von Liebigpad)
      liggen over dezelfde ringsloot. Brug 267, richting Kruislaan, bestaat eigenlijk alleen uit twee
      bakstenen balustrades met granieten sluitstenen boven een lage boogduiker op een houten paalfundering.


      Ze zijn alle drie sober: natuursteen, siersmeedwerk en beeldhouwwerk uit Kramers jaren twintig ontbreken.
      De afgeronde bakstenen balustrades blijven herkenbaar. Op nog geen honderd meter ligt brug 479,
      die laat zien hoe snel de smaak daarna veranderde.


      Let op:

      - de aan de landhoofden afgeronde bakstenen balustrades (brug 254)

      - de granieten sluitstenen van brug 267

      - het sobere siersmeedwerk van brug 273

      '
    attributes:
      architect: Piet Kramer (Publieke Werken)
      original_use: Bruggen
    sources:
    - https://nl.wikipedia.org/wiki/Brug_254
    - https://nl.wikipedia.org/wiki/Brug_267
