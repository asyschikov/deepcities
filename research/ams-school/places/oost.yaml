  nl:
    title: Newtonschool (Cornelis Kruyswijk)
    summary: 'Lagere school uit 1930 van Cornelis Kruyswijk in geel-bruin-rode baksteen onder een steile
      kap met blauwe pannen, met reliëfs bij de ingang: ''arbeid overwint 1929'' en een maskerkop met
      twee kleine ''Denkers'' naar Rodin.'
    body: 'Cornelis Kruyswijk (1884-1935) ontwierp deze lagere school in 1930 in opdracht van de Watergraafsmeerse
      Schoolvereniging. Hij bouwde meer Amsterdamse scholen, in een ''strakke en sobere'' Amsterdamse
      School-vormgeving met hoogwaardige materialen en veel oog voor detail. De school vormt de kop van
      een bouwblok met eenvoudige middenstandswoningen, maar valt op door de geel-bruin-rood gemêleerde
      baksteen, de blauwe pannen en de verschillend hoge bouwvolumes die in- en uitspringen. In 2002 werd
      het gebouw gerestaureerd voor naschoolse opvang.


      De school werd opgevat als Gesamtkunstwerk, waarin architectuur, beeldhouwwerk en kunstnijverheid
      kinderen al vroeg met kunst in aanraking brengen. De reliëfs zijn zeer waarschijnlijk van de Haarlemse
      beeldhouwer Theo van Reijn. Binnen zorgen geglazuurde tegels en nissen voor een kleurrijke afwerking.


      Let op:

      - de steile kap van de hoofdvleugel met vier schoorstenen

      - de verdiepte entree onder een witte luifel met daarboven een rij glazen bouwstenen

      - de reliëfs in het portaal: ''arbeid overwint 1929'' met drie flamingo-achtige vogels, en een maskerkop
      met twee zittende, peinzende figuurtjes in de pose van Rodins Denker

      - de smalle verticale strook glasblokken voor het trappenhuis

      - het grote hoekvenster van de vroegere kamer van het schoolhoofd

      '
    attributes:
      client: Watergraafsmeerse Schoolvereniging
      artists: Theo van Reijn (reliëfs, toegeschreven)
      original_use: Lagere school
