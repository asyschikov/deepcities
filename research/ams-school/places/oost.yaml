  nl:
    title: Krugerhof
    summary: 'U-vormig blok met circa honderd arbeiderswoningen uit 1929-1930 van A.J. Westerman en Jacob
      Dunnebier, in vier kleuren baksteen met hoektorens: verstrakte Amsterdamse School voor een commerciële
      woningbouwmaatschappij.'
    body: 'Projectontwikkelaar Huibert van Saane, directeur van de Maatschappij voor Moderne Woningbouw,
      vroeg in maart 1929 de bouwvergunning aan; begin 1930 werd het complex opgeleverd. Arend Jan Westerman
      tekende de gevels, Jacob Dunnebier de plattegronden. Het blok ligt als een U aan de Tugelaweg, Maritzstraat
      en Christiaan de Wetstraat; aan de Maritzstraat springt de rooilijn terug, waar een tuin met tuinhuisje
      en zandbak lag. De naam verwijst naar het nabije Krugerplein.


      De woningen waren klein maar modern: een woonkamer, twee slaapkamers, keuken en badkamer met badcel,
      centrale verwarming en warm water. Ruimtebesparende trappenhuizen met dubbele bordestrappen ontsloten
      de woningen. Het socialistische dagblad Het Volk vond het experiment mislukt: te krap voor grote
      gezinnen en te duur vergeleken met gemeentelijke woningbouw in West.


      Let op:

      - de vier kleuren baksteen: roodbruin op de begane grond, gele banden bij ingangen, hoeken en eerste
      verdieping, rood op de bovenverdiepingen en een vierde kleur bij de torens

      - de hoektorens met verticaal gelegde donkerrode dakpannen

      - de erkers op de twee hoeken boven de winkels

      - de naar binnen gerichte balkons en de open tuin aan de Maritzstraat

      '
    attributes:
      architect: Arend Jan Westerman (gevels), Jacob Dunnebier (plattegronden)
      original_use: Arbeiderswoningen met winkels
    sources:
    - https://nl.wikipedia.org/wiki/Krugerhof
- title: Kraaipanbuurt (Gratama & Versteeg)
  summary: 'The city''s own housing around the Kraaipanstraat and Transvaalkade, by the office of Jan
    Gratama — the critic who first wrote of an "Amsterdam School" — and Gerrit Versteeg: long brick street
    walls of the early 1920s by the Ringvaart.'
  body: 'The Transvaalbuurt was laid out from 1903 to a plan by H.P. Berlage, and was one of the first
    places where the city''s own Housing Department (Gemeentelijke Woningdienst) built. Around the Kraaipanstraat
    the department tried something new. Instead of the usual 19th-century grid, it used a large block
    with an outer and an inner ring of housing, like the Zaanhof and Zaandammerplein in the Spaarndammerbuurt.
    The city register dates that experiment to 1916.


    The office of Jan Gratama and Gerrit Versteeg designed the housing, built around 1920–1924 along the
    Kraaipanstraat, Schalk Burgerstraat, Albert Luthulistraat, De la Reijstraat, Colensostraat and Transvaalkade.
    Gratama (1877–1947) was also a critic and editor, and he was the first to use the name "Amsterdam
    School" in print. With Versteeg he went on to plan Betondorp and parts of Plan West. In 2026 the complex
    was in the procedure to become a municipal monument.


    Look for:

    - the long, unified brick walls along the Transvaalkade, facing the Ringvaart

    - the inner street of the Schalk Burgerstraat, ringed by the outer blocks

    - repeated porches, tiled roofs and brick details that hold whole streets together as one design

    '
