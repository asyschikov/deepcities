    summary: Kleine duikerbrug uit 1924 van Piet Kramer over de Molenwetering bij de Linnaeushof, met
      bakstenen balustrades, granieten blokjes en een verticaal gemetselde pilaar op een van de landhoofden.
    body: 'Brug 304 overspant de Molenwetering bij een van de toegangen tot de Linnaeushof, de katholieke
      enclave van A.J. Kropholler rond de Hofkerk. Kropholler schreef in 1928 dat een van de openingen
      ''over een brugje'' toegang gaf tot de hof; vermoedelijk is dat deze overgang. Piet Kramer van Publieke
      Werken ontwierp de duiker in 1924. Afwijkend voor Kramer zijn de bakstenen balustrades in plaats
      van siersmeedwerk. Het smeedwerk op een van de walkanten is mogelijk niet van zijn hand.


      Let op:

      - de bakstenen constructie met blokjes graniet

      - de verticaal gemetselde bakstenen pilaar met bewerkt graniet op een van de landhoofden

      - de doorkijk naar de Linnaeushof, een traditionalistisch ensemble van Kropholler

      '
