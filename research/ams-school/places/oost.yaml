  nl:
    title: Brink (Betondorp)
    summary: Het centrale plein van Betondorp, het tuindorp van beton uit de jaren twintig. Dick Greiner
      ontwierp de hele Brink, met winkels, leeszaal en verenigingsgebouw, als een mengeling van Amsterdamse
      School en Nieuwe Bouwen.
    body: 'Na de Eerste Wereldoorlog waren bakstenen duur en geschoolde bouwvakkers schaars. Daarom bouwde
      Amsterdam zijn tuindorp in de Watergraafsmeer (1923-1925, circa 900 woningen) deels als experiment
      met beton. Uit vijftig inzendingen werden tien betonsystemen gekozen; in de volksmond heette de
      wijk al snel Betondorp. Jan Gratama en Gerrit Versteeg maakten het stedenbouwkundig plan, met een
      centrale Brink en straatnamen ontleend aan het boerenbedrijf.


      Dick Greiner ontwierp de Brink (1924-1928) als totaalontwerp, uitgevoerd in het door Wim Greve uitgevonden
      korrelbeton en van buiten bepleisterd. Rond het plantsoen staan winkels met bovenwoningen, middenstandswoningen,
      een openbare leeszaal en bibliotheek en een verenigingsgebouw, onderling verbonden door een verhoogde
      galerij. Greiner combineerde daarbij Amsterdamse School en Nieuwe Bouwen. Zijn zoon Onno Greiner
      renoveerde de Brink in 1987-1989. Gerard Reve groeide hier op; in De Avonden heet de buurt Cementwijk.
      Sinds 2022 is Betondorp beschermd stadsgezicht.


      Let op:

      - de letters ''Leeszaal'' in Amsterdamse School-typografie op de rode deur van Brink 43-45, en de
      oorspronkelijk vergulde naam op het verenigingsgebouw (Brink 1)

      - de zwart-witte tegeltableaus met zigzagmotieven bij de ingangen en in de plint

      - de toren met vier wijzerplaten en koperen bekroning boven de winkels aan de Veeteeltstraat

      - de grote glas-in-loodvensters van leeszaal en verenigingsgebouw

      '
    attributes:
      architect: Dick Greiner (Brink); stedenbouwkundig plan Jan Gratama en Gerrit Versteeg
      original_use: Winkels, woningen, leeszaal, verenigingsgebouw
