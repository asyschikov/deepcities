- title: Apostolisch Genootschap Watergraafsmeer
  summary: Cornelis Kruyswijk's 1931 church at the head of the Galileïplantsoen. The city's planning committee
    demanded the steep black-glazed roof and the slender clock tower, and the city paid for the tower.
  body: 'In 1929 Cornelis Kruyswijk was asked to design a church with a minister''s house for the Hersteld
    Apostolische Zendinggemeente. It opened on 25 January 1931, with about 800 seats in the main hall.
    Kruyswijk had drawn a flat roof. The city''s aesthetics committee (schoonheidscommissie) wanted a
    monumental end to the long green axis of the Galileïplantsoen, so the building got a tall sloping
    roof of black-glazed tiles. The committee also demanded a tower, which the city ended up paying for.
    The clock still belongs to the municipality.


    The walls are of yellow-toned clinker bricks on a blue-brick plinth. Tall narrow stained-glass windows
    light the hall. The interior was simplified for lack of money in 1931, rebuilt in 1968 and renovated
    in 1999 with Kruyswijk''s design as a guide. Today it is the meeting house of the Apostolisch Genootschap,
    and a municipal monument since 1992 as a typical example of late Amsterdam School.


    Look for:

    - the big slanting roof over the rectangular hall, closing the view along the canal

    - the slender clock tower

    - small canopies over doors and windows, ladder windows and detailed brickwork

    - the tall, very narrow stairwell windows that form little bays

    '
