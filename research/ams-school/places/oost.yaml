    title: Heinz Stuybrug (brug 334)
    summary: 'Uiterst sobere bakstenen duikerbrug in de Radioweg, in 1946 door Piet Kramer ontworpen en
      in 1953 gebouwd voor het nieuwe sportcomplex: een laat voorbeeld van zijn stijl.'
    body: 'Brug 334 overspant de Molenwetering in de Radioweg bij het Middenmeerpad. Het ontwerp van Piet
      Kramer zou uit 1946 stammen, maar de brug werd pas in 1953 geplaatst, toen de Radioweg werd verlengd
      voor de aanleg van een sportcomplex. Ondanks het lagere nummer is ze dus jonger dan de bruggen 335-338
      uit 1928. De bakstenen wanden zijn volledig onversierd. In 2005 werd de brug vernoemd naar Heinz
      Stuy, doelman van het Ajax dat in 1971, 1972 en 1973 de Europacup I won.


      Let op:

      - de kale bakstenen wanden, in contrast met de granietrijke bruggen uit 1928 aan hetzelfde water

      '
    attributes:
      architect: Piet Kramer (Publieke Werken)
      original_use: Fiets- en voetbrug
    sources:
