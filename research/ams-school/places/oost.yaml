- title: Heinz Stuybrug (Brug 334)
  summary: A very plain brick culvert bridge on the Radioweg, designed by Piet Kramer in 1946 and built
    in 1953 for the new sports complex. It is a late, unadorned example of his style.
  body: 'Brug 334 crosses the Molenwetering on the Radioweg near the Middenmeerpad. Kramer''s design is
    said to date from 1946, but the bridge was only built in 1953, when the Radioweg was extended for
    a sports complex. So despite its lower number it is younger than the 1928 bridges 335–338 upstream.
    Its brick walls have none of the usual decoration. In 2005 it was named after Heinz Stuy, Ajax''s
    goalkeeper in the European Cup–winning sides of 1971–1973. De Meer stadium stood nearby.


    Look for:

    - the bare brick walls of the culvert, a contrast with the granite-studded bridges of 1928 on the
    same water

    '
