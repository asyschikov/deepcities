    summary: Hefbrug uit 1953 in de Spaklerweg, een van de laatste bruggen die Piet Kramer voor Publieke
      Werken ontwierp en een van de laatste in de stijl van de Amsterdamse School.
    body: 'De Omvalbrug overspant de Weespertrekvaart naast de hooggelegen spoor- en metrobaan bij het
      Amstelstation. Het ontwerp is van Piet Kramer, een van zijn laatste voordat hij bij Publieke Werken
      vertrok. De brug stamt uit 1953, maar kwam pas in gebruik na de opening van de Spaklerweg. Vergeleken
      met zijn werk uit de jaren twintig is ze sober, met een eenvoudige leuning van metalen platen. Aan
      de oostzijde staat het brugwachtershuisje, met een trap naar het lager gelegen maaiveld.


      Let op:

      - het brugwachtershuisje met trap naar beneden

      - de sobere leuning met metalen platen

      '
