    body: 'In 1926 vond de gemeente een voetbrug in het verlengde van de Molukkenstraat onwenselijk, omdat
      zo''n route vanzelf een verkeersstraat zou worden. Bewoners van de Celebesstraat wezen erop dat
      zij zonder brug een flinke omweg naar de Watergraafsmeer moesten maken. In 1927 kwam er een voetbrug
