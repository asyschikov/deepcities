  nl:
    title: Vijfde Montessorischool Watergraafsmeer
    summary: Montessorischool uit 1931 van Publieke Werken (Lansdorp en Hulshoff) in de zichtas van de
      Radioweg, met door Hildo Krop gesneden dierenkoppen aan de nokgordingen en een Rattenvanger van
      Hamelen van Jan Heijens.
    body: 'De Dienst Publieke Werken, in dit geval de architecten Nicolaas Lansdorp en A.R. Hulshoff,
      ontwierp deze Vijfde Montessorischool voor lager onderwijs, in 1931 geopend onder de naam De Zilvermeeuw.
      Het is nog altijd een montessorischool. Het complex neemt een volledig bouwblok in: drie bakstenen
      vleugels omsluiten in een U het schoolplein, dat zich opent naar het Galileïplantsoen. De school
      ligt precies in de zichtas van de Radioweg en is zo een stedenbouwkundig scharnierpunt.


      De gemeente omschrijft het gebouw als ''vormgegeven in een zakelijke trant met invloed van de Amsterdamse
      School''. Het heeft hoge daken met gesmoorde pannen, granieten lekdorpels en vensters met het voor
      de Amsterdamse School kenmerkende laddermotief. Uitwendig is de school nagenoeg ongewijzigd, tot
      en met ramen en deuren. Zoals in het interbellum gebruikelijk werd ze verrijkt met monumentale kunst.


      Let op:

      - de uiteinden van de nokgordingen die door de topgevels steken, door Hildo Krop gesneden met diermotieven

      - het kalkstenen beeld van de Rattenvanger van Hamelen door Jan Heijens bij de linker ingang aan
      de Herschelstraat

      - de forse houten luifel en de bakstenen bloembak bij die ingang

      - de symmetrische schoolpleinzijde aan het Galileïplantsoen met granieten zitbanken naast de deuren
      en het oorspronkelijke hekwerk

      '
    attributes:
      architect: Nicolaas Lansdorp en A.R. Hulshoff (Publieke Werken)
      artists: Hildo Krop (gesneden nokgordingen); Jan Heijens (kalkstenen beeldhouwwerk)
      original_use: Montessorischool voor lager onderwijs
    sources:
    - https://data.amsterdam.nl (gemeentelijk monument 200638, redengevende omschrijving)
    - https://nl.wikipedia.org/wiki/Galile%C3%AFplantsoen
- title: Newtonschool (Cornelis Kruyswijk)
  summary: A 1930 primary school by Cornelis Kruyswijk in yellow-brown-red brick under a steep blue-tiled
    roof, with an entrance relief reading "arbeid overwint 1929" (work conquers) and a mask flanked by
    two tiny Rodin "Thinkers".
  body: 'Cornelis Kruyswijk (1884–1935) designed this primary school in 1930 for the Watergraafsmeer school
    association. He built several Amsterdam schools in a sober version of the Amsterdam School, known
    for good materials and careful detail. The school stands at the head of a block of plain middle-class
    housing. It stands out through its mottled yellow-brown-red brick and blue roof tiles, and through
    its volumes of different heights stepping in and out of the building line. It was restored in 2002
    and is now used for after-school care.


    The school was treated as a Gesamtkunstwerk, where architecture, sculpture and craft would introduce
    children to art. The reliefs are very probably by the Haarlem sculptor Theo van Reijn. Inside, glazed
    tiles and niches give a colourful finish.


    Look for:

    - the steep main roof with four chimneys, rising high above the lower wings

    - the recessed entrance under a white canopy, with a band of glass blocks above it

    - the reliefs in the porch: "arbeid overwint 1929" with three flamingo-like birds, and a mask with
    two small seated figures posed like Rodin''s Thinker

    - the narrow vertical strip of glass blocks lighting the stairwell

    - the big corner window of the former head teacher''s room

    '
  category: schools
  lat: 52.356327
  lng: 4.936801
  address: Newtonstraat 54
  links:
  - label: Gemeentelijk monument (200642)
    url: https://data.amsterdam.nl/monumenten/a0d21919-4225-44e7-b738-51e2bb617ede
  - label: Cornelis Kruyswijk (Wikipedia nl)
    url: https://nl.wikipedia.org/wiki/Cornelis_Kruyswijk
