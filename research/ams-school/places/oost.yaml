  nl:
    title: School Batjanstraat (Publieke Werken)
    summary: Dubbele lagere school uit 1924 in de Indische Buurt, van Publieke Werken. De vlakke gevel
      wordt aan beide uiteinden verlevendigd door 'als bollend papier' vormgegeven ingangstraveeën, een
      geliefd motief van de Amsterdamse School.
    body: 'De afdeling Gebouwen van de Dienst Publieke Werken ontwierp dit gebouw in 1924 als dubbele
      school voor gewoon lager onderwijs. Het is een van de weinige historische gebouwen in dit grotendeels
      in de jaren tachtig gesaneerde deel van de Indische Buurt; aan de overkant ligt het voormalige katholieke
      eiland rond Jan Stuyts Gerardus Majellakerk. Er zitten nog steeds twee basisscholen in.


      De voorgevel is grotendeels vlak, met lange horizontale vensterreeksen. De uiteinden met de ingangen
      zijn plastisch vormgegeven, ''welhaast als bollend papier'', zoals de gemeentelijke beschrijving
      het zegt. Ze steken scherp naar voren, zijn op de bovenste verdieping afgerond en worden boven de
      daklijst bekroond door cirkelvormige elementen. De gemeente wijst op de overeenkomst met de Vierde
      Ambachtsschool aan de Postjesweg van A.J. Westerman, die tegelijk ontstond, en houdt het voor mogelijk
      dat Westerman ook deze school ontwierp.


      Let op:

      - de twee plastische ingangstraveeën met scherpe uitsprongen, afgeronde bovenverdieping en ronde
      bekroning

      - de dubbele deuren in portieken met een witgeschilderde bovenzijde

      - de oorspronkelijke houten ramen met horizontaalroeden en de vierkante stalen ramen op de bovenste
      verdieping

      - het contrast tussen het horizontale middendeel en de verticale hoektraveeën

      '
    attributes:
      architect: Publieke Werken (mogelijk A.J. Westerman)
      original_use: Dubbele lagere school
    sources:
    - https://data.amsterdam.nl (gemeentelijk monument 200636, redengevende omschrijving)
- title: Vijfde Montessorischool Watergraafsmeer
  summary: A 1931 Montessori school by Public Works that closes the view down the Radioweg, with roof
    beams carved into animals by Hildo Krop and limestone Pied Pipers by Jan Heijens.
  body: 'The Public Works architects Nicolaas Lansdorp and A.R. Hulshoff designed this Montessori primary
    school for boys and girls, completed in 1931. It was first called De Zilvermeeuw (The Herring Gull)
    and is still a Montessori school today. The building fills a whole block. Three brick wings form a
    U around the playground, which opens towards the Galileïplantsoen and its canal, and the school sits
    on the axis of the Radioweg.


    The register describes it as businesslike with Amsterdam School influence. It has high roofs of smoked
    tiles, granite sills, and ladder-pattern windows with horizontal glazing bars. The building is almost
    unaltered outside, down to the windows and doors. In the 1920s and 1930s the city liked to enliven
    its schools with art, and this one has two sculptors'' contributions.


    Look for:

    - the ends of the ridge purlins poking out of the gables, carved with animals by Hildo Krop

    - the limestone Pied Piper of Hamelin by Jan Heijens beside the left-hand entrance on the Herschelstraat

    - the timber canopy and brick flower box at that entrance

    - the symmetrical playground front on the Galileïplantsoen, with granite benches beside the doors
    and the original steel-and-brick fence

    '
  category: schools
  lat: 52.354075
  lng: 4.937881
  address: Galileïplantsoen 37-41, Herschelstraat 2-4
  links:
  - label: Gemeentelijk monument (200638)
    url: https://data.amsterdam.nl/monumenten/682ec764-f85f-4788-92f9-528681d5b1f5
  attributes:
    heritage_status: Municipal monument
    monument_number: '200638'
    built: 1928–1931
    architect: Nicolaas Lansdorp and A.R. Hulshoff (Publieke Werken)
    client: Gemeente Amsterdam
    artists: Hildo Krop (carved roof beams); Jan Heijens (limestone sculpture)
    style_phase: Pared-down
    original_use: Montessori primary school
    listed: 2012
  photos:
  - commons:File:Montessorischool Herschelstraat 4 te Amsterdam, Bestanddeelnr 901-6641.jpg
  - commons:File:Montessorischool Herschelstraat 4 te Amsterdam, Bestanddeelnr 901-6643.jpg
