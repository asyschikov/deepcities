  nl:
    title: Badhuis Boerhaaveplein (Badhuistheater)
    summary: Rond, vrijstaand gemeentebadhuis uit 1920-1921 midden op het Boerhaaveplein, door A.J. Westerman
      van Publieke Werken in Amsterdamse Schoolstijl ontworpen. Sinds 1985 zit er het Badhuistheater in.
    body: 'In het najaar van 1918 besloot de gemeente Amsterdam een reeks badhuizen te bouwen, voor buurten
      waar de nieuwe woningbouwcomplexen geen eigen badgelegenheid hadden. Door de hoge materiaalprijzen
      tijdens de Eerste Wereldoorlog liep de bouw vertraging op en steeg het krediet van 100.000 naar
      140.000 gulden; pas begin 1920 kon er worden aanbesteed. Het ontwerp kwam van Arend Jan Westerman,
      architect bij de Dienst der Publieke Werken. Op 6 juli 1921 openden wethouder Monne de Miranda en
      burgemeester Willem de Vlugt het badhuis.


      Het was het eerste vrijstaande badhuis van de stad, op een cirkelvormige plattegrond van ongeveer
      negentien meter doorsnede. Mannen en vrouwen hadden aan weerszijden van het kantoortje een eigen
      ingang; een rondgang om de gescheiden wachtkamers gaf toegang tot zo''n twintig bad- en douchecellen.
      Het koepeldak bestaat uit acht geknikte schilden met in het midden een gedrongen schoorsteen. Begin
      jaren tachtig sloot het badhuis: na de stadsvernieuwing hadden de meeste woningen in de Oosterparkbuurt
      een eigen douche. Sinds 1985 is hier het Badhuistheater gevestigd.


      Het Rijk beschermt het gebouw als bijzondere uitdrukking van een typologische ontwikkeling en als
      herinnering aan de nauwe band tussen volkshuisvesting en volksgezondheid.


      Let op:

      - de ronde gevel van bruinrood geschakeerde baksteen in staand verband, boven een donkere plint
      met roosters van de vroegere verwarmingskelder

      - de metalen letters GEMEENTEBADHUIS boven het kantoorvenster, met ornamenten ernaast

      - het linkerportiek met het opschrift ''ingang mannen''

      - het met shingles gedekte dak met houten opbouw en vier dakkapellen

      '
    attributes:
      architect: Arend Jan Westerman (Publieke Werken)
      original_use: Openbaar badhuis
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/526986
    - https://nl.wikipedia.org/wiki/Boerhaaveplein_28_(Amsterdam)
- title: Boerhaaveplein housing (A. van Baalen)
  summary: A robust brick block with corner towers and round-arched porches that closes off the Boerhaaveplein
    opposite the bathhouse — the work of an architect whose designs the city register calls closely related
    to the Amsterdam School.
  body: 'A. van Baalen designed this block of upstairs and downstairs flats in 1920. It forms the western
    end of the wedge-shaped block between the Tweede Boerhaavestraat and the Andreas Bonnstraat, so it
    faces the square and Westerman''s bathhouse. The register sees the pair as one ensemble. A café uses
    the corner shop space on the ground floor.


    Little is known about Van Baalen''s life. He was active in Architectura et Amicitia, edited the magazine
    De Architect from 1906, and exhibited alongside Berlage, Kromhout and De Bazel in 1910. He also built
    in Plan Zuid and entered the 1922 Chicago Tribune competition. The city register sees a strong kinship
    with the Amsterdam School in his sculptural volumes and careful brickwork. It also points to German
    models, especially Richard Riemerschmidt.


    Look for:

    - the symmetrical front to the square, with two large round arches around the café windows and smaller
    arches over the side entrances

    - the canted corner towers with broken tent roofs clad in zinc and mastic

    - the high plinth of hacked brick, with granite blocks at the springing of the arches

    - bay-window projections on the side streets, with decorative brickwork on their corners

    - the original brown-stained doors in the porches

    '
  category: housing
  lat: 52.35958
  lng: 4.913647
  address: Tweede Boerhaavestraat 52-60, Andreas Bonnstraat 1-5
  links:
