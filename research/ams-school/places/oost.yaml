- title: Omvalbrug (Brug 429)
  summary: A 1953 lift bridge on the Spaklerweg, one of the last bridges Piet Kramer designed before leaving
    Public Works, and one of the last in the Amsterdam School style.
  body: 'The Omvalbrug crosses the Weespertrekvaart next to the raised railway and metro line near Amstel
    station. Piet Kramer designed it as one of his last bridges for Public Works, and it dates from 1953.
    It only opened to traffic once the Spaklerweg was finished. Next to the 1920s work it is restrained,
    with plain metal-plate railings. The bridge-keeper''s house on the east side still ties it to the
    Amsterdam School, and from there a stair leads pedestrians down to the low polder level.


    Look for:

    - the bridge-keeper''s house with its stair down to the polder

    - the late, sober railings of metal plates

    '
