- title: Voltaplein
  summary: A quiet rectangular garden square in Watergraafsmeer, lined in the early 1930s with small late-Amsterdam
    School blocks by Jop van Epen, A.J. Westerman, Lau Peters and J.M. van Hardeveld.
  body: 'After Amsterdam annexed Watergraafsmeer in 1921, the city laid out a garden-suburb district here
    and named its streets after scientists. The square was named after Alessandro Volta on 23 December
    1927, and building followed in the early 1930s. Instead of one architect designing whole streets,
    several hands each built a small block around the square: Jop van Epen, Arend Jan Westerman, Lau Peters
    and Johannes Martinus van Hardeveld. Van Epen came back after completion to take photographs. The
    result is a catalogue of the sober late phase of the style: flat brick fronts, horizontal windows,
    tiled roofs and small brick accents.


    The garden in the middle has a rectangular pattern of beds and paths. Since 1971 it has held Lajos
    Ratkai''s abstract sculpture Twee bolvormen (Two spheres).


    Look for:

    - the differences between the blocks of the different architects around the square

    - porches, window bands and brick details typical of the 1930s sober style

    '
