  nl:
    title: Woningcomplex Boerhaaveplein (A. van Baalen)
    summary: Robuust woonblok uit 1920 met hoektorens en rondboogportieken, als kopbeëindiging van het
      bouwblok aan het Boerhaaveplein, tegenover het badhuis. Van Baalens werk toont volgens de gemeente
      'sterke verwantschap met de Amsterdamse School'.
    body: 'Architect A. van Baalen ontwierp dit complex van beneden- en bovenwoningen in 1920. Het vormt
      de westelijke kop van het wigvormige bouwblok tussen de Tweede Boerhaavestraat en de Andreas Bonnstraat
      en is met de voorgevel op het Boerhaaveplein gericht. Daar staat het badhuis van A.J. Westerman,
      en samen vormen de twee gebouwen een waardevol ensemble. In de bedrijfsruimte op de begane grond
      zit een café.


      Over Van Baalen is weinig bekend. Hij was actief in het architectengenootschap Architectura et Amicitia,
      werd in 1906 redacteur van De Architect en exposeerde in 1910 met Berlage, Kromhout en De Bazel.
      Hij bouwde ook in Plan Zuid en deed mee aan de prijsvraag voor de Chicago Tribune. Volgens de gemeentelijke
      beschrijving zijn zijn ontwerpen plastisch en expressief, met zorgvuldig metselwerk, en verwant
      aan zowel de Amsterdamse School als de Duitse architectuur van Richard Riemerschmidt.


      Let op:

      - de symmetrische pleingevel met twee grote rondbogen om de cafévensters en kleinere rondbogen boven
      de ingangen

      - de overhoeks afgeschuinde hoektorens met gebroken tentdaken van zink en mastiek

      - de hoge plint van gehakte baksteen met granieten blokken bij de boogaanzetten

      - de erkerrisalieten met siermetselwerk in de zijstraten

      - de oorspronkelijke bruingebeitste portiekdeuren

      '
    attributes:
      original_use: Woningen met winkel/café
    sources:
    - https://data.amsterdam.nl (gemeentelijk monument 200657, redengevende omschrijving)
- title: Talmud Tora school (Tweede Boerhaavestraat)
  summary: A Jewish religious school of 1922–1925 by Jacob S. Baars, in yellow and red brick, with its
    name still spelled out in Hebrew letters on the corner. Closed by the occupiers in 1943, it is now
    apartments.
  body: 'The Dutch-Israelite Main Synagogue (Nederlands-Israëlitische Hoofdsynagoge) ran a Talmud Tora
    school for poor children, teaching ordinary primary subjects alongside basic Judaism. In the Depression
    it also gave pupils meals and clothing. As many Jewish families moved from the old city centre to
    the new districts along the Weesperzijde, the school left its rooms under the Uilenburger synagogue.
    In 1924 it moved into this building, named after the painter Jozef Israëls.


    Jacob S. Baars (1886–1956) was, with Harry Elte, one of the main architects of Jewish institutions
    in Amsterdam. He also built the synagogue on the Linnaeusstraat, demolished in 1962. The city register
    calls this school a good example of his pre-war work, carefully executed in the Amsterdam School manner.
    The German occupiers closed the school in 1943. It later housed a school on "nature-philosophical"
    principles, was squatted, and became a shared apartment building.


    Look for:

    - the asymmetrical yellow-and-red brick front on a high red plinth with decorative brickwork

    - the school''s name in red brick and Hebrew letters on the canted corner

    - the entrance porch with brick piers and a concrete canopy, and the ladder-pattern sidelights

    - the wrought-iron railing on the low garden wall to the left of the entrance

    - the projecting red-brick parapets and the patterned chimneys

    '
  category: schools
  lat: 52.35914
  lng: 4.911435
  address: Tweede Boerhaavestraat 7
  links:
