  nl:
    title: Talmud Tora-school (Tweede Boerhaavestraat)
    summary: Voormalige joodse Talmud Tora-school uit 1922-1925 van Jacob S. Baars, in gele en rode baksteen,
      met de schoolnaam in Hebreeuwse letters op de hoek. In 1943 door de bezetter gesloten, nu een woongebouw.
    body: 'De Nederlands-Israëlitische Hoofdsynagoge hield een Talmud Tora-school voor armlastige kinderen,
      waar naast het gewone lager onderwijs ook basiskennis van het jodendom werd onderwezen; in de crisisjaren
      kregen de leerlingen er ook maaltijden en kleding. Met de verhuizing van veel joodse gezinnen uit
      de verpauperde binnenstad naar de Weesperzijdestrook verliet de school haar lokalen onder de Uilenburgersjoel.
      In 1924 betrok ze dit gebouw, vernoemd naar de schilder Jozef Israëls. Een tegeltableau in de hal
      herdenkt ook het zilveren regeringsjubileum van koningin Wilhelmina (1923).


      Architect Jacob S. Baars (1886-1956) was naast Harry Elte een van de belangrijkste ontwerpers van
      joodse gebouwen in Amsterdam; van hem was ook de in 1962 gesloopte synagoge aan de Linnaeusstraat.
      De gemeente noemt de school een goed voorbeeld van scholenbouw ''in Amsterdamse Schooltrant''. In
      1943 werd de school op last van de Duitse bezetter gesloten. Daarna volgden een school op ''natuurfilosofische
      grondslag'', een kraakperiode en de verbouwing tot appartementencomplex.


      Let op:

      - de asymmetrische gevel van gele en rode baksteen op een hoge roodbakstenen plint met siermetselwerk

      - de schoolnaam in rode baksteen en Hebreeuwse letters op de afgeschuinde hoek

      - het ingangsportiek met gemetselde penanten, betonnen luifel en nevenlichten met laddermotief

      - het smeedijzeren sierhek op het tuinmuurtje links van de ingang

      - de uitkragende roodbakstenen borstweringen en de schoorstenen met siermetselwerk

      '
    attributes:
      client: Nederlands-Israëlitische Hoofdsynagoge
      original_use: Joodse school (Talmud Tora)
    sources:
    - https://data.amsterdam.nl (gemeentelijk monument 200661, redengevende omschrijving)
- title: Public Works school Batjanstraat
  summary: A 1924 double primary school in the Indische Buurt whose flat front is framed by two entrance
    bays that bulge like swelling paper — a textbook Amsterdam School motif, probably by A.J. Westerman.
  body: 'The Buildings section of Public Works designed this double primary school in 1924. It is one
    of the few older buildings left in this part of the Indische Buurt, most of which was rebuilt in the
    1980s. Across the street is the former Catholic enclave around Jan Stuyt''s Gerardus Majellakerk.
    Two schools still share the building.


    The front is mostly a flat brick wall with long horizontal rows of windows. At each end, though, the
    entrance bays curve forward and push up above the cornice, rounded at the top floor and crowned with
    circular shapes. The city register compares this "swelling paper" effect with Westerman''s Fourth
    Trade School (Vierde Ambachtsschool) on the Postjesweg, built at the same time. It suggests Westerman
    may have designed both.


    Look for:

    - the two sculpted entrance bays, with sharp-edged projections, rounded upper floors and circular
    crowns above the roofline

    - the double entrance doors in porches with white-painted lintels

    - the horizontal bars in the original wooden windows, and the small square steel windows on the top
    floor

    - the contrast between the long horizontal centre and the vertical end bays

    '
  category: schools
  lat: 52.359318
  lng: 4.93865
  address: Batjanstraat 56-84
  links:
