  nl:
    title: Voltaplein
    summary: Rustig rechthoekig plein in de Watergraafsmeer, begin jaren dertig omzoomd met kleine bouwblokjes
      in de late stijl van de Amsterdamse School door Jop van Epen, A.J. Westerman, Lau Peters en J.M.
      van Hardeveld.
    body: 'Na de annexatie van de Watergraafsmeer in 1921 legde Amsterdam hier een tuindorpachtige wijk
      aan, met straten vernoemd naar wetenschappers. Op 23 december 1927 kreeg het plein de naam van Alessandro
      Volta; begin jaren dertig volgde de bebouwing. Die kwam niet van één ontwerper: Jop van Epen, Arend
      Jan Westerman, Lau Peters en Johannes Martinus van Hardeveld bouwden hier elk kleine blokjes, de
      meeste in de late Amsterdamse School. Van Epen kwam na de oplevering zelf nog kijken en fotograferen.


      Het plantsoen in het midden heeft een rechthoekige indeling van perkjes en paden. Sinds 1971 staat
      er het abstracte beeld Twee bolvormen van Lajos Ratkai.


      Let op:

      - de verschillen tussen de blokjes van de verschillende architecten

      - portieken, vensterbanden en bakstenen details van de sobere jaren-dertigstijl

      '
    attributes:
      original_use: Woningen
    sources:
    - https://nl.wikipedia.org/wiki/Voltaplein
- title: Brink (Betondorp)
  summary: The village green of Betondorp, the 1920s concrete garden suburb. Dick Greiner designed the
    whole square, with its shops, library and community hall, mixing Amsterdam School lettering and tilework
    with flat-roofed modern blocks.
  body: 'After the First World War there was a shortage of bricks and bricklayers. Amsterdam therefore
    built its new garden suburb in Watergraafsmeer (1923–1925, about 900 homes) partly as an experiment
    in concrete. Ten concrete systems were chosen from fifty entries, and locals soon called the area
    Betondorp ("Concrete Village"). Jan Gratama and Gerrit Versteeg drew the plan around a central green,
    the Brink, with streets named after farming terms.


    Dick Greiner designed the Brink as one total design (1924–1928), built in the clinker concrete invented
    by Willem Greve and plastered outside. Around the green are shops with flats, middle-class houses,
    a public reading room and library, and a community hall (verenigingsgebouw), linked by a raised gallery.
    These buildings mix the Amsterdam School and the Nieuwe Bouwen (Dutch modernism): sculpted towers,
    overhangs and lettering on otherwise plain grey blocks. Greiner''s son Onno restored the Brink in
    1987–1989. Writer Gerard Reve grew up here and turned it into the "Cementwijk" of his novel De Avonden.
    Betondorp became a protected townscape in 2022.


    Look for:

    - "LEESZAAL" in Amsterdam School letters on the red door of the library (Brink 43-45), and the gilded
    name on the community hall (Brink 1)

    - black-and-white zigzag tile panels around the entrances and along the plinths

    - the clock tower with a copper crown over the shops at the corner of the Veeteeltstraat

    - the large leaded windows of the library and community hall

    '
