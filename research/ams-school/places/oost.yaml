    body: 'Co (J.J.B.) Franswa ontwierp dit grote woonblok in 1930. Het beslaat Linnaeusstraat 197-225,
      Nirwana 4-12 en de zuidwand van het huidige Land van Cocagneplein (2-10). De omringende wijk Oostpoort
      verrees in het begin van de 21e eeuw op het gesaneerde terrein van de Oostergasfabriek; de straten
      kregen namen van utopische werelden. Daardoor is het blok, samen met het vrijstaande ingenieurshuis
      van de gasfabriek uit 1887 en de voormalige stokerij, een van de weinige historische gebouwen hier.


      Het blok is sinds 3 februari 1998 een gemeentelijk monument.


      Let op:

      - de lange bakstenen gevelwand aan de Linnaeusstraat die de hoek omgaat naar het nieuwe plein

      - het contrast met het eclectische dienstgebouw van de gasfabriek midden op het plein

      '
