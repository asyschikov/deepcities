- title: Hilletjesbrug (Brug 125)
  summary: A 1921 Public Works footbridge over the Egelantiersgracht, with Amsterdam School abutments
    from Jo van der Mey's office and 18th-century-style railings.
  body: 'A bridge has probably crossed the Egelantiersgracht here since the canal was dug. The present
    one dates from 1921 and was designed in the Public Works office where Jo van der Mey, architect of
    the Scheepvaarthuis, was then responsible for bridges. His name is not on the drawings, which credit
    "the office of" Van der Mey. His hand shows in the Amsterdam School details of the abutments and the
    projecting quay walls. The wrought-iron railings, by contrast, follow 18th-century patterns. The bridge
    is a twin of Brug 126.


    Apart from a new deck in 1943, it has hardly changed in a hundred years. It appears in the title sequence
    of the TV series *Baantjer*. The name may come from a local woman called Hilletje.


    Look for:

    - the brick and stone abutments with Amsterdam School detailing

    - the projecting quay walls on either side

    - the traditional railings, an unusual mix with the modern abutments

    '
