- title: Café on the Haarlemmerplein (Haarlemmerplein 31)
  summary: An 1894 corner building that got a wraparound café front in a 'sober but expressive' Amsterdam
    School style in 1929, with leaded glass and polished granite.
  body: 'The building itself is an 1894 shop with upper flats by the contractor-architect W.J. Appen,
    decorated in a Dutch Renaissance revival style. In 1929 the ground floor, until then a pastry shop,
    became a café, and the architect Fred. Huisman jr. designed new café fronts that wrap round the corner
    of the Haarlemmerplein and the Korte Marnixstraat. It is still a café.


    The city register describes the café front as "sober but expressive" Amsterdam School work. It is
    included here for that front, not for the 19th-century building above it.


    Look for:

    - the café front in polished granite, running round the corner like a plinth

    - the piers in block bond, the rectangular single-pane windows and the rows of leaded-glass fanlights

    - the original doors, in the corner and on the Korte Marnixstraat

    - the 1894 building above, for contrast: plaster details, a timber corner oriel and dormers with hoist
    beams

    '
