  nl:
    title: Rozengracht 229-233
    summary: 'Winkel- en woonblok van Dick Greiner uit 1925-1926: Amsterdamse School-detaillering in een
      ongebruikelijk strenge symmetrie.'
    body: 'Dick Greiner (1891-1964), onder meer architect van Betondorp, ontwierp dit pand in 1925 voor
      een particuliere ontwikkelaar, met drie winkels en negen bovenwoningen, op de plek van drie oudere
      woonhuizen. De demping van de Rozengracht in 1889 maakte er een brede radiaal van, die om grotere
      bebouwing vroeg. Nu is de begane grond één grote winkel.


      Het register noemt de stijl verwant aan die van de ''Amsterdamse school'', maar onderscheidend door
      de strenge symmetrie, die ongebruikelijk was. Het exterieur is grotendeels origineel.


      Let op:

      - ''ANNO'' en ''1925'' in reliëf in de buitenste zwarte natuurstenen muurdammen

      - de gedenksteen in het middenportiek voor de voltooiing op 14-9-1926

      - drie identieke verdiepingen met gekoppelde vensters met lage onderramen en veelruits bovenramen

      '
    attributes:
      original_use: Drie winkels met negen bovenwoningen
    sources:
    - city:200555 (redengevende omschrijving)
