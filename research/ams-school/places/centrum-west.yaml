  nl:
    title: Modemagazijn Gerzon (Nieuwezijds Voorburgwal)
    summary: Het oudste deel van modemagazijn Gerzon (1915) door Adriaan Moen, met zeer plastisch bewogen
      gevels verwant aan de vroegste fase van de Amsterdamse School.
    body: 'Het achterste, nu oudste deel van modemagazijn Gerzon aan de Nieuwezijds Voorburgwal werd in
      1915 gebouwd naar ontwerp van Adriaan Moen. Het Rijksmonumentenregister beschrijft de gevels als
      "zeer plastisch-bewogen" en verwant aan de oudste fase van de Amsterdamse School: hetzelfde moment
      waarop het Scheepvaarthuis verrees.


      Moen werkte in 1923-1926 opnieuw voor Gerzon, aan het grote ateliergebouw aan Singel en Spuistraat,
      op een paar minuten lopen.


      Let op:

      - de sterk gemodelleerde bakstenen gevel, een vroeg experiment in de nieuwe stijl

      - het verschil met Moens latere, uitbundiger ateliergebouw aan het Singel 347

      '
    attributes:
      original_use: Modemagazijn
    sources:
