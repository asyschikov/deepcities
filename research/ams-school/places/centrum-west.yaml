  nl:
    title: Arbeidsbeurs (Passeerdersgracht)
    summary: De gemeentelijke arbeidsbeurs van 1915-1917, een vroeg ontwerp van Publieke Werken met aparte
      ingangen voor mannen, vrouwen, werkgevers en bakkers.
    body: 'De arbeidsbeurs, voorloper van het arbeidsbureau, kwam in 1915-1917 tot stand in opdracht van
      de gemeente, naar ontwerp van de Dienst der Publieke Werken in Amsterdamse Schoolstijl. Volgens
      het Rijksmonumentenregister is het het vroegste voorbeeld van een speciaal voor arbeidsbemiddeling
      ontworpen gemeentelijk kantoorgebouw.


      De plattegrond laat zien hoe werkzoekenden werden verdeeld. In de lage aanbouw aan de Tweede Passeerdersdwarsstraat
      zaten de bakkers, de conciërgewoning en de mannelijke ingang; aan de gracht lagen de ingangen voor
      werkgevers en voor vrouwen. Op de eerste verdieping wachtten vrouwelijk kantoor- en winkelpersoneel,
      dienstboden en schoonmaaksters, op de tweede het mannelijk kantoor- en handelspersoneel.


      Let op:

      - de driezijdige erker over drie verdiepingen boven de hoofdingang, met overhoekse vensters en glas-in-lood

      - de gemetselde posten naast de deur met trapsgewijs verjongende natuurstenen afsluiting

      - loden en gemetselde ornamenten op dak en hoek

      - de verschillende ingangen aan beide straten

      '
    attributes:
      client: Gemeente Amsterdam
      original_use: Gemeentelijke arbeidsbeurs
    sources:
    - rce:518343 (omschrijving Rijksmonumentenregister)
