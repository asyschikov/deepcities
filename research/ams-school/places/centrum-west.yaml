  nl:
    title: Ateliergebouw Gerzon (Singel 347)
    summary: Textielatelier en magazijn van Adriaan Moen voor Gerzon (1923-1926), van Singel tot Spuistraat,
      met hoektoren en beeldhouwwerk van Indische vrouwen met pauwen.
    body: 'Modehuis Gerzon liet dit textielatelier annex magazijn in twee fasen bouwen naar ontwerp van
      Adriaan Moen. Het deel uit 1923 heeft een traditionele, symmetrische compositie; de uitbreiding
      van 1926 met torenuitbouwen op de hoeken geeft het expressieve silhouet van de Amsterdamse School.
      Achter de atelierramen werkten naaisters in ongedeelde ruimtes, mogelijk gemaakt door een betonskelet.
      Het was in zijn tijd de grootschaligste ingreep op het Singel.


      Gevels van gele baksteen, met lateien en beeldhouwwerk in groenige diabaas en veel lood. Wattjes
      nam het op in Nieuw Nederlandsche Bouwkunst (1926).


      Let op:

      - de hoektoren aan het Singel en het overkragende geveldeel van 1926

      - beeldhouwwerk op de hoeken: Indische vrouwen met een kroonduif en bloemen, en met pauwen

      - gehamerde loodslabben op de overgang van het trasraam naar de gele baksteen

      - het hekwerk van U-vormig gebogen staven

      '
    attributes:
      original_use: Confectieatelier en magazijn
    sources:
    - city:203063 (redengevende omschrijving)
  links:
  - label: Gemeentelijk monument (203063)
    url: https://data.amsterdam.nl/monumenten/a2efc3b7-4d50-4d6f-ab75-405214a2d00a
- title: Modemagazijn Gerzon (Nieuwezijds Voorburgwal)
  summary: The 1915 rear wing of the Gerzon fashion store by Adriaan Moen, an early, very sculptural building
    related to the first phase of the Amsterdam School.
  body: 'This wing of the Gerzon fashion store on the Nieuwezijds Voorburgwal was built in 1915 to a design
    by Adriaan Moen. It is now the oldest part of the complex. The national register describes its façades
    as "very plastic and lively", related to the earliest phase of the Amsterdam School. 1915 is the same
    moment as the Scheepvaarthuis, the movement''s founding building.


    Moen worked for Gerzon again in 1923–1926 on the large workshop block on the Singel and Spuistraat,
    a few minutes'' walk away.


    Look for:

    - the strongly modelled brick façade, an early experiment in the new style

    - the contrast with Moen''s later, more exuberant Gerzon workshops at Singel 347

    '
  category: commercial
  lat: 52.370819
  lng: 4.891028
  address: Nieuwezijds Voorburgwal 303-307
