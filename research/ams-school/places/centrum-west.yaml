  nl:
    title: Gebouw De Kolk
    summary: Kantoorverzamelgebouw van Th. Kint uit 1925 aan de Nieuwezijds Voorburgwal, met een granieten
      basement, originele koperen brievenbussen en 'kolossale' bakstenen lisenen.
    body: 'In 1925 liet J. Slaap de percelen Nieuwezijds Voorburgwal 32 en 34 samenvoegen. Architect Th.
      Kint ontwierp op nr. 32 een kantoorverzamelgebouw met bergruimte en conciërgewoning, opgezet met
      een betonskelet zodat de indeling vrij was. In de vormgeving sloot Kint volgens het register aan
      bij het "robuust-plastische en door expressief materiaalgebruik bepaalde karakter van de Amsterdamse
      School". De Nieuwezijds Voorburgwal was toen een straat vol kantoren, waaronder die van verschillende
      dagbladen.


      Let op:

      - de geheel in grijs graniet uitgevoerde begane grond met verspringende blokvormige dekstukken

      - de dubbele houten deur met laddermotief en oorspronkelijke koperen brievenbussen

      - "GEBOUW-DE KOLK" in koperen letters en het smeedijzeren rooster in het bovenlicht

      - bakstenen lisenen over drie verdiepingen als een kolossale orde

      - de bovenste verdieping met drie kleine vensters en een vlaggenmast

      '
    attributes:
      original_use: Kantoorverzamelgebouw met conciërgewoning
    sources:
    - city:207038 (redengevende omschrijving)
  links:
  - label: Gemeentelijk monument (207038)
