- title: Brug 117 (Rozengracht, Lijnbaansgracht)
  summary: The Rozengracht bridge over the Lijnbaansgracht, rebuilt in 1926 to a design by Piet Kramer
    on the main road from the centre to Amsterdam-West.
  body: 'Around 1885 the city chose the Rozengracht, rather than the Westerstraat, as the main road from
    the centre to Amsterdam-West. The canal was filled in and a bridge was needed over the Lijnbaansgracht
    at its end. After a dispute with the tram company, a permanent bridge followed in 1891. A little further
    south, an older swing bridge had crossed near the De Victor windmill.


    The municipal register lists the present bridge as a 1926 design by Piet Kramer. That date fits the
    wider rebuilding of the whole Raadhuisstraat–Rozengracht route in the mid-1920s: Kramer''s bridges
    over the Singel, Herengracht, Keizersgracht and Prinsengracht were all rebuilt in 1925.


    Look for:

    - the brick abutments and stone details at the water''s edge

    - the bridge as part of the Rozengracht traffic route, continuing Kramer''s Raadhuisstraat bridges

    - Rozengracht 229–233 by Dick Greiner, an Amsterdam School shop and housing block a few steps east

    '
