- title: Lommertbrug (Brug 203)
  summary: A small 1926 Piet Kramer footbridge over the Oudezijds Voorburgwal, between the old city hall
    and the former municipal pawnshop.
  body: 'A bridge has crossed the Oudezijds Voorburgwal at the Enge Lombardsteeg since at least 1599.
    It takes its name from the *Lommert* or *Lombard*, the municipal pawnshop (Bank van Lening) on the
    west side. It was renewed again and again, in 1857, 1888 and 1905. In 1926 the Public Works department
    replaced it completely under its bridge architect Piet Kramer. The work ran from 5 July to 3 October
    1926, probably reusing the old timber pile foundations under new stone abutments and steel beams.


    The date ties it to the other Amsterdam School work of that year on this stretch of canal: the new
    city hall wing in the Prinsenhof on the east bank, and Hildo Krop''s urinal a little further north.


    Look for:

    - the stone abutments carrying the steel beams of the 1926 rebuild

    - the Prinsenhof and its 1920s wing on one side, and the Bank van Lening and De Brakke Grond on the
    other

    '
