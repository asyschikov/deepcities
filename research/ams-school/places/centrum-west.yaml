  nl:
    title: Voormalig GG&GD-gebouw Willemsstraat
    summary: Gebouw van de Gemeentelijke Geneeskundige en Gezondheidsdienst uit 1926, door Publieke Werken,
      op de plek van een gesaneerde Jordaanse slop.
    body: 'Het voormalige gebouw van de Gemeentelijke Geneeskundige en Gezondheidsdienst (nr. 24) en de
      bijbehorende woning (nr. 26) werden in 1926 ontworpen door de Dienst Publieke Werken. Ter plaatse
      lag vroeger de Wijde Gang, een steeg met kleine arbeiderswoningen; bij de sanering van de Jordaan
      werden zulke sloppen vanaf de late negentiende eeuw opgeruimd.


      De gevel ligt enkele meters terug ten opzichte van de rest van de straatwand. Het register spreekt
      van een vrij sobere baksteenarchitectuur die in de decoratieve details en de ingewikkelde raamindelingen
      duidelijk invloed van de Amsterdamse School toont, een stijl die Publieke Werken toen veel toepaste.


      Let op:

      - de terugliggende rooilijn

      - rode baksteen met verdiepte voegen en enkele hardstenen elementen

      - de vensters met ingewikkelde roedenverdeling

      '
