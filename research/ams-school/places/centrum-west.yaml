    title: Gebouw Batavia
    summary: Handelskantoor van de Batavia Arak Maatschappij (1918-1920) aan de Prins Hendrikkade, met
      gebeeldhouwde apen en olifantskoppen en een halfronde uitbouw.
    body: 'De N.V. Batavia Arak Maatschappij liet dit handelskantoor met magazijn en conciërgewoning in
      1918-1920 bouwen door architect J.H. Slot, die zich bediende van de stijl van de Amsterdamse School.
      Het gewapend beton was van de N.V. Gewapend Beton "De Kondor". Het gebouw heeft een voorgevel aan
      de Prins Hendrikkade en een achtergevel aan de Oudezijds Kolk; sinds de jaren negentig zit er horeca
      in.


      Let op:

      - de smalle halfronde uitbouw over alle verdiepingen, met een ornament van concentrische ringen
      aan de voet

      - de metalen letters GEBOUW BATAVIA aan beide kanten

      - beeldhouwwerk van groepen apen en olifantskoppen

      - de reeks licht gepunte kantelen als gevelbeëindiging

      - aan de Oudezijds Kolk de oorspronkelijke glas-in-loodbovenlichten

      '
