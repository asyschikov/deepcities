- title: Willemsbrug (Brug 151)
  summary: A 1928–1929 Piet Kramer bascule bridge over the Singelgracht, carrying the Haarlemmerplein
    towards the Haarlemmerweg past the Willemspoort.
  body: 'A bridge was needed here after the Westerkanaal was dug in 1877. The first one was notorious
    among tram drivers. Its approach curved and it had no overhead wire, so trams had to coast across,
    and on 2 January 1924 a tram on line 18 skidded off the rails in snow and ice, through the railing
    and into the Singelgracht.


    Piet Kramer designed the replacement in 1925, and it was built in 1928–1929. It is a bascule bridge
    (a lifting bridge), named after the nearby Willemspoort city gate, and it links the Haarlemmerplein
    with the Nassauplein and the Haarlemmerweg. This time the tram rails came with an overhead wire. Trams
    ran over it until 1955.


    Look for:

    - the brick and natural-stone abutments of Kramer''s design

    - the lifting span and its machinery

    - the Willemspoort (1840), the neoclassical city gate next to the bridge

    '
