- title: Telephone exchange (Singel 340)
  summary: 'The 1916–1919 head office of the municipal telephone service, by Rutgers and Marnette: rough
    stone below, and Hildo Krop''s sculpted telephone poles as capitals.'
  body: 'The city''s own telephone service (*Gemeentetelefoon*, from 1942 the *Plaatselijke Telefoondienst*)
    had this central exchange built in 1916–1919. It was designed by the Public Works architects G.J.
    Rutgers and P.L. Marnette in the restrained, "tightened" version of the style. The sculpture is by
    Hildo Krop.


    The building originally ran through to an identical front on the Herengracht (293–305), but that side
    was replaced in 1955. Its entrance, with Krop''s sculpture, was moved to the PTT building in the Watergraafsmeer.
    The Singel front survives largely intact.


    Look for:

    - the heavy rusticated base of roughly hewn stone, with barred windows

    - the brick piers between the bays, each with a carved base and a capital sculpted as a telephone
    pole with wires, flanked by the coats of arms of Dutch cities

    - the windows in groups of three, and the meandering stone band at the top floor

    - the small early Amsterdam School office next door at Herengracht 303, built because the exchange''s
    construction undermined the old house there

    '
