  nl:
    title: Hilletjesbrug (brug 125)
    summary: Brug uit 1921 over de Egelantiersgracht, 'van het bureau van' J.M. van der Mey, met Amsterdamse
      School-landhoofden en achttiende-eeuws smeedwerk.
    body: 'Waarschijnlijk ligt hier al een brug sinds de aanleg van de gracht. De huidige brug stamt uit
      1921, ontworpen door Publieke Werken, waar J.M. van der Mey toen verantwoordelijk was voor de bruggen.
      Zijn naam staat niet op het ontwerp, dat "van het bureau van" heet, maar zijn hand is terug te zien
      in de Amsterdamse School-elementen van de landhoofden en de uitkragende walkanten. De balustrades
      zijn typisch achttiende-eeuws smeedwerk. De brug is een zusje van brug 126.


      Behalve een nieuw brugdek in 1943 is ze ruim honderd jaar onveranderd. Ze komt voor in de leader
      van Baantjer. De naam zou van een buurtbewoonster Hilletje komen.


      Let op:

      - de landhoofden met Amsterdamse School-details

      - de uitkragende walkanten

      - het traditionele smeedwerk van de leuningen

      '
