- title: Brug 8 (Raadhuisstraat, Singel)
  summary: The Singel bridge on the Raadhuisstraat, rebuilt in 1925 to Piet Kramer's design, with sculpted
    stone pylons and stepped stone piers.
  body: 'This is the easternmost of Piet Kramer''s three matching bridges on the Raadhuisstraat. An old
    bridge here was adapted in 1894, when the street was cut through. Around 1922 the city decided to
    replace it, and the new bridge was built between February and December 1925.


    It has Kramer''s trademark elements: brick abutments with natural-stone pylons, some of them carved,
    and wrought-iron railings in the same pattern as on its sisters over the Herengracht and the Keizersgracht.
    Its unofficial name, *Huiszittensluis*, referred to a poor-relief warehouse that stood where the main
    post office (now Magna Plaza) was later built. The city council dropped that name in 2016.


    Look for:

    - the carved stone pylons on the ends of the abutments

    - the piers of brick and profiled stone blocks, stepped like a ziggurat

    - the half-round weights at the ends of the brick wings that anchor the railing

    - the view along the Singel towards the Torensluis

    '
