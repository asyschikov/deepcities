  nl:
    title: Urinoir Oudezijds Voorburgwal
    summary: Bakstenen urinoir dat uit de gracht oprijst, bekroond met Hildo Krops volksredenaar met gebalde
      vuist, gericht op het oude stadhuis.
    body: 'Het urinoir verrees in 1926 naar ontwerp van Allard Remco Hulshoff van de Dienst der Publieke
      Werken, in dezelfde tijd dat die dienst de nieuwe stadhuisvleugel aan de overkant bouwde. Het is
      een stenen variant op de metalen plaskrul van Jo van der Mey: een krul op een natuurstenen sokkel,
      met daarboven bakstenen maaswerk en een overkragend rond, plat dak.


      Op het dak staat een beeld van Hildo Krop. Aan de ingangszijde een volksredenaar met gebalde vuist
      en open mond, verwijzend naar de raadzaal tegenover; aan de andere kant een groep koppen, eveneens
      met open monden. Het Rijksmonumentenregister noemt het een representatief en zeldzaam voorbeeld
      van straatmeubilair van Publieke Werken in Amsterdamse Schoolstijl.


      Let op:

      - het bakstenen maaswerk boven de ovale natuurstenen plint

      - het hardstenen beeld van Krop (115 cm), van beide kanten

      - het boogfriesje in de walmuur naast de ingang

      '
    attributes:
      client: Gemeente Amsterdam
      original_use: Openbaar urinoir
    sources:
    - rce:518487 (omschrijving Rijksmonumentenregister)
