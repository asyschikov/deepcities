- title: Rozengracht 229-233
  summary: 'Dick Greiner''s 1925–1926 block of three shops and nine flats on the Rozengracht: Amsterdam
    School detail held in an unusually strict symmetry.'
  body: 'Dick Greiner (1891–1964), best known as the architect of the concrete garden village Betondorp,
    designed this block for a private developer in 1925. It replaced three older houses. The filling-in
    of the Rozengracht in 1889 had turned it into a wide radial road, which invited bigger buildings like
    this one. It held three shops with nine flats above. Today one large shop fills the ground floor.


    The city register describes the design as related to the leading Amsterdam School group, but unusual
    for its strict symmetry. The exterior is largely original.


    Look for:

    - "ANNO" and "1925" carved into the outer black-stone piers of the ground floor

    - a small stone in the central porch recording completion on 14 September 1926

    - three identical upper floors of brown-red brick, with linked window rows of low lower sashes and
    many-paned upper lights

    - the high hipped roof with one broad dormer

    '
