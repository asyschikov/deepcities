- title: Lijnbaansgracht 211-217 (Göbel & Den Hertog)
  summary: A wedge-shaped 1939 block of 36 flats, shops and offices by Göbel and Den Hertog, a late, 'tightened'
    Amsterdam School block dropped into the old city.
  body: 'In 1939 J. Reijnhoudt received a permit to build a warehouse, showroom, offices and 36 flats
    on this cleared site. The architects were Lucas Göbel (1899–1989) and Gerardus den Hertog (1901–1990),
    who also worked on the large housing blocks of Bos en Lommer. The block resembles those. In 1946 the
    printing and advertising firm Cloeck en Moedigh / Calff en Meischke had the ground floor adapted by
    the same architects. The block still mixes shops, businesses and housing.


    Wikipedia describes it as late, "tightened" (*verstrakte*) Amsterdam School. Its bulk is unusual in
    the small-scale inner city, and it fills a whole wedge-shaped block between the Lijnbaansgracht, Passeerdersgracht,
    Passeerdersstraat and Tweede Passeerdersdwarsstraat.


    Look for:

    - the symmetrical main fronts, combining vertical oriel strips with horizontal window bands

    - the brown brick in Flemish bond, and the stone parapet around the basement

    - the tall cut-in porches with small stone blocks in the brickwork

    - the sharp, narrow end where the block meets the Passeerdersstraat

    '
  category: housing
  lat: 52.367115
  lng: 4.879811
  address: Lijnbaansgracht 211-217, Passeerdersgracht 34-38
  links:
  - label: Wikipedia (nl)
