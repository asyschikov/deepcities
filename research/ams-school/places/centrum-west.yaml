  nl:
    title: Singel 46-48 (Confectiefabriek Cohen)
    summary: Bedrijfspand van Adriaan Moen voor een confectiefabriek, waarvan de hoek uitloopt in een
      'expressionistisch crescendo van baksteenkunst'.
    body: 'Aan dit deel van het Singel zaten vroeger veel bedrijven, waaronder de Boldoot-fabrieken. Adriaan
      Moen (1879-1950) ontwierp hier rond 1920 kantoor, werkplaats en magazijn voor de Confectiefabriek
      Cohen; de historische gevel van de Roomolenstraat bleef behouden. Moen werd opgeleid bij Posthumus
      Meyjes; zijn latere werk is sterk beïnvloed door de Amsterdamse School. J.G. Wattjes nam dit pand
      en Moens Gerzon-gebouw op in Nieuw Nederlandsche Bouwkunst (1926).


      Het register noemt het gebouw een stilistische dissonant in de grachtenwand: de geaccentueerde hoek
      en de vreemde verhouding tussen raam en muur zijn "karakteristiek voor de Amsterdamse School natuurlijk".


      Let op:

      - de hoek met verticale baksteenbanen die uitlopen in een expressionistisch crescendo

      - de driehoekige erker boven de ingang

      - de in Amsterdamse Schoolstijl gedecoreerde voordeur boven een stoep van zes treden

      - het zware kozijnhout, een knipoog naar oudere Amsterdamse bouwkunst

      '
    attributes:
      original_use: Kantoor, werkplaats en magazijn van een confectiefabriek
    sources:
    - city:203048 (redengevende omschrijving)
  links:
  - label: Gemeentelijk monument (203048)
    url: https://data.amsterdam.nl/monumenten/6af35201-49b4-4d4c-8a6c-c825d77f3d00
- title: Langestraat 61 (Cordemeijer office)
  summary: A small 1919–1920 office with flats on the corner of the Blauwburgwal, with a jagged brick-and-ceramic
    roofline and a gable stone of a stone ship.
  body: 'B. Cordemeijer commissioned this office building with upper flats in 1919–1920 from the architect
    J.J. Eijrond and his son J.F.J. Eijrond. In 1927 the son widened it along the Blauwburgwal, copying
    the character and detail of the first part. You can still see the difference in the colour of the
    brick. Among the older buildings around it, the corner block stands out, especially seen from the
    Blauwburgwal, and the city register values it as an example of office building in the Amsterdam School
    style.


    Look for:

    - the roofline of projecting brick ornaments, jagged against the sky, with ceramic ornaments over
    the oriel on the Langestraat

    - the ceramic band above the stone plinth

    - the original door with a metal ornament, and the leaded fanlight with the initials BC and the dates
    1919–1940

    - the gable stone with a sailing ship (*het stenen schip*) in the oriel on the Blauwburgwal, saved
    from the house demolished for the extension

    '
