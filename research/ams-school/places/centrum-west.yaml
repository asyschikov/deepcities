  nl:
    title: Uitbreiding stadhuis (Prinsenhof)
    summary: De Amsterdamse School-vleugel van het oude stadhuis aan de Oudezijds Voorburgwal (1923-1926),
      met raadzaal en trouwzaal; nu onderdeel van een hotel.
    body: 'Nadat Lodewijk Napoleon in 1808 het stadhuis op de Dam als paleis in gebruik nam, trok het
      stadsbestuur naar het Prinsenhof aan de Oudezijds Voorburgwal. In 1923-1926 kwam daar een uitbreiding
      in de stijl van de Amsterdamse School bij, met een nieuwe raadzaal en trouwzaal, ontworpen door
      Nicolaas Lansdorp, Allard Remco Hulshoff en Publieke Werken. Aan de aankleding werkten onder anderen
      de beeldhouwers Driekus Jansen van Galen, Anton Fortuin, Adrianus Remiëns en Bernard Richters.


      In de trouwzaal kwam een metershoog glas-in-loodraam met de wapens van beide steden, in 1925 geschonken
      door Rotterdam bij het 650-jarig bestaan van Amsterdam. Het gebouw bleef stadhuis tot 1988; bij
      de verbouwing tot hotel bleven trouwzaal en raam bewaard.


      Let op:

      - de beeldengalerijen aan de grachtgevel

      - de nieuwe vleugel naast de oudere delen van het Prinsenhof

      - het urinoir met beeld van Hildo Krop aan de overkant, uit hetzelfde jaar

      '
    attributes:
      client: Gemeente Amsterdam
      original_use: Uitbreiding stadhuis (raadzaal, trouwzaal)
    sources:
