- title: Telegraaf building
  summary: J.F. Staal and G.J. Langhout's 1928–1930 newspaper printing works and offices for De Telegraaf,
    with dark bronze-glazed brick and a lead-clad tower spire.
  body: 'The newspaper *De Telegraaf* commissioned this printing works and office building from Jan Frederik
    Staal and G.J. Langhout. It was built in 1928–1930 on the Nieuwezijds Voorburgwal, then the city''s
    newspaper street. Staal was one of the core Amsterdam School architects (Park Meerwijk in Bergen,
    the Wolkenkrabber on the Victorieplein). This late work, though, moves towards functionalism, and
    the national register describes it as functionalist. It is included here as a late, transitional work
    by one of the movement''s leading figures.


    The presses ran on the ground floor, the offices filled the first three floors, typesetting was on
    the fourth and storage on the set-back fifth. A reinforced-concrete tower held the lifts and two water
    tanks, one for Vecht water and one for dune water. H. Wouda fitted out the directors'' rooms. The
    building was redeveloped and reopened in 2020.


    Look for:

    - the front in dark, bronze-coloured glazed brick and granite

    - the tower with its lead-clad spire, pierced and ribbed, into which the flagpole could be lowered

    - bronze printing-hall windows with glass blocks in the upper parts

    - the paper-roll doors on the right, which once had platform lifts down to the paper store in the
    basement

    '
  category: commercial
  lat: 52.37159
  lng: 4.89128
  address: Nieuwezijds Voorburgwal 225
  links:
