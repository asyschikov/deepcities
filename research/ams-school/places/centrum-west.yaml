  nl:
    title: Bewaarschool 't Smallepad
    summary: Voorbereidende school van Cornelis Kruyswijk uit 1924 op de Westelijke Eilanden, met een
      halfronde ingangstoren onder Romaanse pannen en terracotta langs de dakrand.
    body: 'De voorbereidende school ''t Smallepad verrees in 1923-1924 op de hoek van de Korte Zoutkeetsgracht
      en de Planciusstraat, in opdracht van het schoolbestuur van de Nederduitsch Hervormde Gemeente.
      Architect was Cornelis Kruyswijk (1884-1935), die voor hervormde opdrachtgevers veel scholen en
      kerken bouwde.


      De lageronderwijswet van 1920 stelde bijzonder en openbaar onderwijs financieel gelijk; de subsidies
      die volgden leidden tot een golf van schoolbouw, met opvallend eigentijdse gebouwen. Het gemeentelijk
      monumentenregister noemt ''t Smallepad een mooi voorbeeld van eenvoudige baksteenarchitectuur met
      Amsterdamse School-elementen. Vooral vanaf de Houtmankade en het Zoutkeetsplein is het een blikvanger.
      De school heeft inmiddels een andere functie, maar is nog altijd als schoolgebouw herkenbaar.


      Let op:

      - de vooruitspringende halfronde ingangspartij met Romaanse pannen en de naam "Smallepad" in metalen
      letters

      - de plint van gevlamde rode baksteen met een sierbetonnen band erboven

      - terracotta ornamenten en bollen langs de gevelbeëindiging, en het jaartal 1924

      - de muur rond de speelplaats met de tekst "Voorbereidende School ''t Smallepad"

      '
    attributes:
      original_use: Voorbereidende school (bewaarschool)
    sources:
    - city:214009 (redengevende omschrijving)
- title: Harm Smeengeschool
  summary: A rounded brick school for bargemen's children on the Droogbak, with a wavy roofline, designed
    by P.L. Marnette of Public Works.
  body: 'The city built this school in 1924–1925 for the children of inland skippers, whose families lived
    on their boats and moved with the cargo. It was named after mr. Harm Smeenge. The design came from
    Pieter Lucas Marnette (1888–1948), one of the architects of the Public Works department (*Dienst der
    Publieke Werken*), who designed several of the city''s Amsterdam School schools and offices.


    The building has two parts: a taller north wing with the stairs, corridors, toilets and offices, and
    a south wing with three classrooms on each floor, all facing the sun. Its rounded corners and wavy
    parapet make it a landmark on the Droogbak, next to the railway viaduct. Since 1988–1989 the ground
    floor has housed a drop-in centre and the upper floors a gym.


    Look for:

    - the rounded corners of the brick volumes

    - the parapet, which waves up at regular intervals along the top of the walls

    - the entrance in the narrow east front, flanked by a broad stone pillar, with three tall gridded
    windows above it

    - the rows of small square windows on the south side, which mark the toilets

    '
