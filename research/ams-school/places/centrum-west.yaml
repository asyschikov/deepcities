  nl:
    title: Kantoor Deli-Batavia (Herengracht 286)
    summary: 'Kantoor van de Deli-Batavia Maatschappij (1920-1922) van de gebroeders Van Gendt: Amsterdamse
      School met zeventiende-eeuwse invloeden en een rijk betegeld interieur.'
    body: 'De N.V. Deli-Batavia Maatschappij, oorspronkelijk de Deli-Batavia Tabak Maatschappij, liet
      in 1921 drie panden slopen voor dit kantoor met twee woningen. De gebroeders Van Gendt ontwierpen
      het in de stijl van de Amsterdamse School met invloeden van de neo-zeventiende- en achttiende-eeuwse
      trant: sokkel, lisenen en kruiskozijnen. De geveltop van het gesloopte Herengracht 286 staat nu
      op het tuinhuis.


      Ook het interieur is beschermd: gangen en trappenhuis met fraaie tegels, trapleuningen en radiatorombouw
      van opengewerkte bouwkeramiek, een houten bank in Amsterdamse Schoolstijl en een lichthof met glas-in-loodlantaarn.


      Let op:

      - de bruine bakstenen gevel met vijf lisenen met afgeschuinde kanten

      - de natuurstenen kolommen met bollen en kettingen en het geometrische smeedijzeren hek

      - de hoge attiek met vier gemetselde ornamenten

      - het Duitse gebroken dak met ranke metalen pirons

      '
    attributes:
      original_use: Kantoorgebouw met twee woningen
    sources:
    - rce:518337 (omschrijving Rijksmonumentenregister)
- title: Gerzon fashion workshops (Singel 347)
  summary: Adriaan Moen's 1923–1926 workshop block for the Gerzon fashion house, running from the Singel
    to the Spuistraat, with a corner tower and carvings of Indonesian women with peacocks.
  body: 'The fashion house Gerzon had this textile workshop and warehouse built in two stages to designs
    by Adriaan Moen. The first part (1923) has a traditional symmetrical layout. The 1926 extension, with
    its corner towers, has the expressive silhouette of the Amsterdam School. Large workshop windows lit
    the open floors where seamstresses worked, made possible by a concrete frame. In its day it was the
    largest intervention on the Singel, cutting through the medieval plot pattern from the Singel to the
    Spuistraat and the Vliegendesteeg.


    The building is in yellow brick, with lintels, carvings and other accents in greenish diabase (sometimes
    called syenite in the literature) and a lot of lead. J.G. Wattjes published it in *Nieuw Nederlandsche
    Bouwkunst* (1926).


    Look for:

    - the corner tower on the Singel and the overhanging bay on the 1926 extension

    - stone carvings at the base of the corners: Indonesian women with a crowned pigeon and flowers, and
    with peacocks

    - hammered lead flashings with ornaments where the purple-brick base meets the yellow brick

    - the U-shaped iron bars in front of the lower windows

    '
