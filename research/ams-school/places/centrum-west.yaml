  nl:
    title: Kantoor Wallich & Matthes (Spuistraat 281)
    summary: Kantoor uit 1925 van P.J.J.M. Cuypers van de Spuistraat tot de Nieuwezijds Voorburgwal, met
      in lagen opgebouwd metselwerk en licht gebogen bouwmuren.
    body: 'De financieringsinstelling Wallich & Matthes liet dit kantoor bouwen dat de hele breedte van
      het blok beslaat, van de Spuistraat tot de Nieuwezijds Voorburgwal. Het ontwerp uit 1925 is van
      P.J.J.M. Cuypers; van hem is in Amsterdam verder alleen het Montessori Lyceum (1930-1931, met A.J.
      Westerman) bekend. Het rode baksteen valt op in beide straten.


      Bijzonder is volgens het register het zorgvuldige metselwerk: de hoofdstructuur lijkt in lagen met
      bakstenen lijsten en velden te zijn bekleed, wat een ingetogen en subtiel effect geeft. De gevel
      aan de Spuistraat is het rijkst gedetailleerd.


      Let op:

      - de licht gebogen uitgemetselde bouwmuren

      - de erker boven de voormalige hoofdingang, bovenin als balkon gebruikt

      - de begane grond in zwarte natuursteen met gestileerde pilasters en de houten deur in Amsterdamse
      Schooltrant

      '
    attributes:
      original_use: Kantoorgebouw
    sources:
    - city:206025 (redengevende omschrijving)
  links:
