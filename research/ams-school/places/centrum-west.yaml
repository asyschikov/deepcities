- title: J.J. van Noortschool
  summary: 'Cornelis Kruyswijk''s 1925 school on the Prinsengracht: a granite base with sculpted birds,
    suns and ''Indian heads'', and a tower-like central bay above the door.'
  body: 'Cornelis Kruyswijk designed this Protestant school, which opened in 1926. It is named after J.J.
    van Noort, a Reformed minister who did much for Christian education in the city, and it is still a
    school. The first stone was laid on 21 March 1925, as a stone in the façade records. Like ''t Smallepad,
    it came out of the school-building boom that followed the 1920 Primary Education Act.


    The plan is a simple central corridor with classrooms on both sides. Kruyswijk gave the front a symmetrical
    composition: a granite ground floor as a plinth, narrow yellow-brown brick above it, and a half-round,
    tower-like central bay rising from the entrance.


    Look for:

    - the sculpted corner blocks with birds and suns, and the "Indian heads" at the ends of the heavy
    granite lintel over the door

    - the school''s name in wrought-iron letters on the lintel, and the half-round leaded fanlight above

    - the projecting window strips with angled sides, each with three stacked rows of windows and narrow
    lights between them

    - the foundation stone on the far left of the façade

    '
