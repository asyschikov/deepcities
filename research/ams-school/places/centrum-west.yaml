  nl:
    title: School Lindengracht 146
    summary: School van Publieke Werken uit 1927 in de Jordaan, met grote lokaalramen en een zwaar pannendak,
      tegenover een oudere gemeenteschool uit 1914.
    body: 'De Dienst Publieke Werken ontwierp deze school in 1927; tegenwoordig is het een woongebouw.
      Omdat de school in een bestaande straatwand moest passen, kreeg alleen de straatgevel een echte
      vormgeving. Door schaal en grote lokaalvensters onderscheidt het gebouw zich duidelijk van de buren.


      Volgens het gemeentelijk register is het een goed voorbeeld van de functionele fase die de scholenbouw
      van Publieke Werken in de jaren twintig en dertig doormaakte. Samen met de school aan de overkant
      uit 1914, van dezelfde dienst maar nog traditioneel van opzet, vormt het een ensemble: daar een
      brede, lage gevel, hier een hoge opbouw met brede raampartijen in Amsterdamse Schoolstijl.


      Let op:

      - het hoge pannendak met overstekende goot, dat de gevel iets massiefs geeft

      - de brede, fijn ingedeelde lokaalramen

      - de forse luifel boven de ingang en de erkers over de eerste en tweede verdieping

      - de school uit 1914 aan de overkant

      '
    attributes:
      client: Gemeente Amsterdam
      original_use: Lagere school
    sources:
    - city:209026 (redengevende omschrijving)
  links:
  - label: Gemeentelijk monument (209026)
