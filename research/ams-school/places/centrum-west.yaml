  nl:
    title: Telegraafgebouw
    summary: Drukkerij en kantoor van De Telegraaf (1928-1930) van J.F. Staal en G.J. Langhout, met donker
      bronskleurige verglaasde steen en een met lood beklede torenspits.
    body: 'Voor de N.V. Dagblad De Telegraaf ontwierpen J.F. Staal en G.J. Langhout deze drukkerij met
      kantoren aan de Nieuwezijds Voorburgwal, destijds de krantenboulevard van Amsterdam. Het gebouw
      verrees in 1928-1930; architect H. Wouda richtte de directiekamers in. Staal behoorde tot de kern
      van de Amsterdamse School, maar het Rijksmonumentenregister noemt dit late werk functionalistisch.
      Het staat op deze kaart als laat overgangswerk.


      Op de begane grond stonden de persen, op de eerste drie verdiepingen de kantoren, op de vierde de
      zetterij en op de teruggerooide vijfde de magazijnen. In de betonnen toren zaten liften en twee
      waterreservoirs, voor Vecht- en duinwater.


      Let op:

      - de voorgevel van donker bronskleurige verglaasde steen en graniet

      - de met lood beklede torenspits met glazen bouwstenen, waarin de vlaggenstok kon zakken

      - de bronzen ramen van de drukkerij met glazen bouwstenen

      - de twee ijzeren deuren rechts, ooit met plateauliften voor de papierrollen

      '
    attributes:
      client: N.V. Dagblad De Telegraaf
      artists: H. Wouda (directiekamers)
      original_use: Krantendrukkerij met kantoren
    sources:
    - rce:518329 (omschrijving Rijksmonumentenregister)
- title: Roothaanhuis
  summary: A 1928–1929 Catholic parish house and youth club on the Rozengracht by H.W. Valk, with a tower-like
    oriel and 17th-century carved stones reused in the back wall.
  body: 'The parish of Saint Ignatius, whose church De Zaaier stood across the Rozengracht, commissioned
    this parish house and club house for Catholic young people. The architect was H.W. Valk (1886–1973),
    a nationally known Catholic architect who also designed De Zaaier (1928). The building is named after
    the 18th-century Dutch Jesuit general J.P. Roothaan. It was built in 1928–1929 (the register gives
    1933 as its date). Today it houses a restaurant, with flats at the back.


    The filling-in of the Rozengracht in 1889 made it a wide traffic road, which explains the building''s
    unusual height and bulk among the older houses. The city register calls the design strongly related
    to the leading Amsterdam School group. The exterior is almost entirely original.


    Look for:

    - the asymmetric front, with an angled oriel running up all floors and rising above the roofline as
    a tower

    - the arched entrance to a deep porch, framed in rusticated bluestone

    - the floors decreasing in height towards an almost closed top floor

    - on the Rozenstraat, four reused 17th- or 18th-century sandstone blocks, among them a lion''s head
    and four sailing ships with the text "BAYADTODOSOSSANCTOS"

    '
  category: culture
  lat: 52.372764
  lng: 4.878836
  address: Rozengracht 133, Rozenstraat 144, Tweede Rozendwarsstraat 5
