  nl:
    title: Warmoesbrug (brug 22)
    summary: Kramers brug over de Herengracht in de Raadhuisstraat, al in 1921 ontworpen maar door prijsstijgingen
      na de Eerste Wereldoorlog pas in 1925 gebouwd.
    body: 'Al op de kaart van Pieter Bast uit 1599 ligt hier een brug. De naam verwijst naar de Warmoesgracht,
      die na demping Raadhuisstraat ging heten. De boogbrug van omstreeks 1895 kon het verkeer naar West
      en de trams niet aan. Piet Kramer maakte in 1921 al een ontwerp in Amsterdamse Schoolstijl, maar
      door de prijsstijgingen na de Eerste Wereldoorlog kon pas in februari 1925 met de bouw worden begonnen.


      Tot 1 september 1957 lag hier drierailig spoor: normaalspoor voor de stadstram en meterspoor voor
      de tram naar Zandvoort, met één gedeelde spoorstaaf.


      Let op:

      - de bakstenen landhoofden met gebeeldhouwde natuursteenblokken en -banden

      - de halfronde natuurstenen verzwaringen waaraan de leuning vastzit

      - de gedecoreerde pylonen midden in de balustrade

      - het siersmeedwerk, gelijk aan dat van brug 8 en brug 106

      '
    attributes:
      client: Gemeente Amsterdam (afdeling Bruggen, Publieke Werken)
      original_use: Verkeers- en trambrug
