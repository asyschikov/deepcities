    summary: 'School van Cornelis Kruyswijk uit 1925 aan de Prinsengracht: een granieten basement met
      vogels, zonnen en ''Indische koppen'' en een torenachtige middenas boven de ingang.'
    body: 'Op 21 maart 1925 legde H.C. de Zwart, secretaris van de hervormde scholen, de eerste steen
      van deze school; in 1926 ging ze open. De naam eert ds. J.J. van Noort, die veel betekende voor
      het christelijk onderwijs in de stad. Al sinds 1899 zat hier een hervormde school. Architect was
      Cornelis Kruyswijk, een van de vooraanstaande architecten van de Amsterdamse School. Het gebouw
      is nog steeds een school.


      De plattegrond is een middengang met lokalen aan weerszijden. De symmetrische gevel heeft een basement
      van grijs graniet, daarboven smalle geelbruine baksteen, en in het midden een halfronde, torenachtige
      opbouw boven de ingang.


      Let op:

      - gebeeldhouwde sierblokken met vogel- en zonmotieven en ''Indische koppen'' bij de granieten latei

      - de schoolnaam in smeedijzeren letters en het halfronde glas-in-loodbovenlicht

      - de naar voren springende vensterstroken met schuine zijkanten en drie rijen ramen boven elkaar

      - de eerste steen uiterst links in de gevel

      '
    attributes:
      original_use: Christelijke burgerschool (voortgezet onderwijs)
    sources:
