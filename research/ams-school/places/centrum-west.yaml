- title: Rubber Centraal Station (Warmoesstraat)
  summary: A 1928 office for the rubber trader R.C.S. at the head of the Warmoesstraat, by The Hague water-tower
    architect H.A. Sangster, with blocky volumes and stepped windows.
  body: 'The *Kantoorgebouw Rubber Centraal Station R.C.S. Amsterdam* replaced eight small shop-houses
    on the corner of the Nieuwe Brugsteeg and the Warmoesstraat. Behind a single new front, only Warmoesstraat
    6 and 8 were partly kept. It was designed in 1928 by H.A. Sangster (1892–1971), a Hague architect
    best known for his water towers built across the Netherlands in 1920–1935, together with F. Warnaar.


    The city register calls the style related to that of the "Amsterdam School" group: blocky volumes
    and the typical windows, with recessed lower sashes and slightly projecting upper lights with horizontal
    glazing bars. Because the Warmoesstraat bends here, the slightly concave, symmetrical front can be
    seen from far down the street. Today there are restaurants downstairs and offices above.


    Look for:

    - the concave front on the Warmoesstraat

    - the black stone ground floor with projecting piers under a continuous canopy

    - the attic storey of many small upright windows, with artificial-stone blocks between them that once
    held horizontal bars

    '
