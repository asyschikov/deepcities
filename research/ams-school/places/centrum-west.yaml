- title: De Schaats (University building)
  summary: A university building by P.L. Marnette whose big, asymmetric ground-floor window is shaped
    like an ice skate, hence its nickname.
  body: 'The Public Works architect P.L. Marnette designed this building for the University of Amsterdam
    in 1925–1927. It stands on the Kloveniersburgwal and is entered from the Oudemanhuispoort, the old
    almshouse gateway that is now the heart of the university''s arts campus. Its nickname, *De Schaats*
    (the skate), comes from the shape of the large window on the canal side.


    Inside, the stairwell has a three-storey mural from 1951 by Peter Alma, *De Geschiedenis der Wetenschap*
    (the history of science).


    Look for:

    - the large, multi-part, skate-shaped window on the ground floor facing the canal, which swings out
    of the wall plane on the left

    - the rounded corner between the canal front and the side front

    - the tall, steep slate roof on the canal side

    - the tower-like raised section on the left, and the wooden frieze between the rows of linked windows

    '
