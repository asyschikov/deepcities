    title: De Schaats (universiteitsgebouw)
    summary: Universiteitsgebouw van P.L. Marnette (1925-1927) aan de Kloveniersburgwal, dat zijn bijnaam
      dankt aan het schaatsvormige venster op de begane grond.
    body: 'Voor de Universiteit van Amsterdam ontwierp P.L. Marnette van de Dienst der Publieke Werken
      in 1925-1927 dit gebouw aan de Kloveniersburgwal, met de toegang in de Oudemanhuispoort. Het heet
      De Schaats vanwege het grote, asymmetrische venster aan de grachtzijde. In het trappenhuis bevindt
      zich over drie verdiepingen de wandschildering ''De Geschiedenis der Wetenschap'' van Peter Alma
      uit 1951.


      Let op:

      - het schaatsvormige, meervoudig gelede venster, dat links uit het gevelvlak zwenkt

      - de afgeronde hoek tussen voor- en zijgevel

      - het hoge, steile leien dakschild aan de grachtkant

      - het torenachtig bekroonde geveldeel links en het houten fries tussen de vensterseries

      '
