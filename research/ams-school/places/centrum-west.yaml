- title: Niek Engelschmanbrug (Brug 106)
  summary: Piet Kramer's Keizersgracht bridge on the Raadhuisstraat, with Hildo Krop's granite fauns'
    heads, crows and frogs on the piers.
  body: 'When the Rozengracht was filled in and the Raadhuisstraat cut through in the 1890s, this became
    the main route from the centre to Amsterdam-West. By 1922 the bridges were too narrow. The Public
    Works department rebuilt them to designs by its bridge architect Piet Kramer: this one in 1924–1925,
    with two spans, and its sisters over the Herengracht (Warmoesbrug) and the Singel (Brug 8) with three.
    All three share the same look.


    This is the richest of the set. Hildo Krop carved the granite sculpture on the middle piers, and the
    wrought-iron railings were made by H.J. Winkelman. In 2001 the bridge was renamed after Niek Engelschman,
    a resistance fighter and pioneer of the gay rights movement.


    Look for:

    - Krop''s carvings on the piers: a bearded faun''s head between groups of three crows, with frogs''
    heads below (best seen from the quay or a boat)

    - the brick wings, weighted at the ends by sculpted stone pylons

    - Kramer''s wrought-iron balustrade

    - the Westerkerk tower beyond, and the Homomonument at the Westermarkt end

    '
  category: bridges
