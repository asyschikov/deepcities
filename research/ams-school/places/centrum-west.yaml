- title: Arbeidsbeurs (Passeerdersgracht)
  summary: Amsterdam's municipal labour exchange of 1915–1917, an early Public Works design with separate
    entrances for men, women, employers and bakers.
  body: 'The city built this labour exchange (*arbeidsbeurs*), a forerunner of today''s job centres, in
    1915–1917 to a design by the Public Works department. The national register calls it the earliest
    purpose-built municipal office for job placement, and it is one of the department''s earliest buildings
    in the new style.


    The original plans show how job seekers were sorted. Bakers had the ground floor of the low annex
    on the Tweede Passeerdersdwarsstraat, which also held the caretaker''s flat and the men''s entrance.
    The canal front had separate doors for employers and for women. Female office staff, maids and cleaners
    waited on the first floor, and male clerks and shop staff on the second.


    Look for:

    - the three-storey, three-sided oriel above the main door, with angled windows and leaded glass

    - the brick posts beside the door, ending in stepped stone tops

    - the lead ornaments and brick crowns on the roof and the corner

    - the separate doorways on both street fronts

    '
