- title: De Friesche (Rokin 115)
  summary: A 1928 insurance office on the quiet side of the Rokin by the Baanders brothers, with a triumphal-arch
    entrance and Hildo Krop's figures of Prosperity, Labour, Care and Rest.
  body: 'The insurer *De Algemeene Friesche* had this branch office built in 1928 by the brothers Herman
    and Jan Baanders. Their father had become known for shopfronts and for the EHLB office on the Rokin.
    Many insurers built new offices in Amsterdam in these years, and they liked modern, representative
    architecture with an open, welcoming ground floor.


    The city register calls the style Amsterdam School. Its strongest feature is the symbolic sculpture
    by Hildo Krop, which shows the blessings of life (as long as you are well insured).


    Look for:

    - the ground floor as a triumphal arch: four octagonal pillars and a round arch of tapered bricks

    - the arms of Amsterdam and North Holland over the side openings

    - Krop''s four figures as window posts on the first floor, labelled WELVAART (prosperity, with fruit),
    ARBEID (labour, with tools), ZORG (care, with a bird) and RUST (rest)

    - the corner piers in alternating yellow brick and stone, and the loggia on the third floor

    '
