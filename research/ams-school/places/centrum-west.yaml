  nl:
    title: Roothaanhuis
    summary: Parochie- en clubhuis voor katholieke jongeren aan de Rozengracht (1928-1929) van H.W. Valk,
      met een torenachtige erker en oude zandstenen gevelstenen achterin.
    body: 'Het Parochiaal Kerkbestuur van den Heiligen Ignatius, van de kerk De Zaaier aan de overkant,
      liet dit parochiehuis en clubhuis voor rooms-katholieke jongeren bouwen. Architect H.W. Valk (1886-1973),
      in katholieke kringen een landelijk bekende bouwmeester, ontwierp het in 1928/29; hij tekende ook
      De Zaaier (1928). De naam verwijst naar de achttiende-eeuwse jezuïetengeneraal J.P. Roothaan. Nu
      zit er onder meer een restaurant, achterin wordt gewoond.


      De Rozengracht was in 1889 gedempt en werd een brede verkeersweg, wat de forse hoogte verklaart.
      Volgens het register is het ontwerp sterk verwant aan de ''Amsterdamse school''; het exterieur is
      vrijwel origineel.


      Let op:

      - de asymmetrische gevel met een schuine erker die boven de daklijst uittorent

      - de boogvormige toegang met hardstenen rustica-omlijsting

      - de in hoogte afnemende verdiepingen en de bijna gesloten bovenste laag

      - aan de Rozenstraat oude zandstenen blokken, waaronder een leeuwenkop en vier zeilschepen met ''BAYADTODOSOSSANCTOS''

      '
    attributes:
      client: R.K. Parochie St. Ignatius
      original_use: Parochiehuis en clubhuis voor katholieke jongeren
    sources:
    - city:215011 (redengevende omschrijving)
