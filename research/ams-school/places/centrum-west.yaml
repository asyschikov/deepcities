    url: https://data.amsterdam.nl/monumenten/a55739a0-7cf6-46c3-a663-63dde8b46448
- title: Drie Koningen (Singel 200-208)
  summary: A big 1920 corner office by A.D.N. van Gendt on the Singel, with 'bastion' corner bays and
    a carving of the Three Kings on its stone base.
  body: 'The cutting of the Raadhuisstraat in 1894–1896 brought offices into this part of the canal ring.
    On the corner of the Singel and the Driekoningenstraat, A.D.N. van Gendt (1870–1932) built this large
    office in 1920. Van Gendt had trained with the British office Burnet, Son and Campbell to master the
    office building. Its five storeys and attic made it clear that this was no canal house.


    The family firm Van Gendt was productive for over fifty years and followed whatever style was current.
    Here, as at the Deli-Batavia office on the Herengracht, that meant the Amsterdam School. The building
    was converted to flats in 1995–2000.


    Look for:

    - the carving of the Three Kings on the corner, set in the rusticated stone base

    - the brickwork pushed forward into triangular bays at the ends of the front, with small deep-set
    windows, like bastions

    - the closed top floor behind a high brick parapet, and the slate mansard roof

    - the dark red-brown brick with deeply raked joints

    '
  category: commercial
  lat: 52.374037
  lng: 4.888543
  address: Singel 200-208, Driekoningenstraat
  attributes:
    heritage_status: Municipal monument
    monument_number: '203051'
    built: '1920'
    architect: A.D.N. van Gendt
    style_phase: Expressive
    original_use: Office building
    listed: 2004
  photos: []
  sources:
  - city:203051
  nl:
    title: Drie Koningen (Singel 200-208)
    summary: Groot hoekkantoor van A.D.N. van Gendt uit 1920 aan het Singel, met bastionachtige hoekerkers
      en een beeldhouwwerk van de drie koningen.
    body: 'De aanleg van de Raadhuisstraat (1894-1896) bracht de cityvorming naar dit deel van de grachtengordel.
      Op de hoek van het Singel en de Driekoningenstraat bouwde A.D.N. van Gendt (1870-1932) in 1920 dit
      grote kantoorgebouw. Van Gendt was voor de kantooropgave in de leer geweest bij het Engelse bureau
      Burnet, Son and Campbell. Vijf bouwlagen en een kap maken direct duidelijk dat dit geen grachtenhuis
      is.


      Het Bureau Van Gendt volgde de mode van de dag; hier was dat de Amsterdamse School, net als bij
      Herengracht 286. Tussen 1995 en 2000 werd het pand verbouwd tot appartementen.


      Let op:

      - het beeldhouwwerk van de drie koningen op de hoek in het natuurstenen basement

      - de driehoekige erkers met diepliggende raampjes, als bastionachtige hoekpaviljoens

      - de gesloten vierde verdieping achter een hoge borstwering

      '
    attributes:
      original_use: Kantoorgebouw
    sources:
    - city:203051 (redengevende omschrijving)
  links:
  - label: Gemeentelijk monument (203051)
    url: https://data.amsterdam.nl/monumenten/79434065-bb6c-42c9-9ec6-41ec5ebcc73f
- title: Oudezijds Voorburgwal 87-89
  summary: A 1920 office with a caretaker's flat in the red-light district, in a sober Amsterdam School
    style with a multi-storey oriel and window strips.
  body: 'This office with a caretaker''s flat was designed in 1920 and spans the full width of its block,
    between the Oude Kennissteeg and the Kreupelsteeg. It is taller than its neighbours and looks different,
    but the city register notes that the careful craftsmanship and the composition of the front keep it
    from clashing with the old canal. The register describes it as a well-worked-out design in a sober
    Amsterdam School style. Its architect is not recorded.


    Look for:

    - the asymmetric front of two bays, the narrow right bay rising as an oriel through several floors

    - the broad windows in the left bay, with a heavy white-painted frame at the raised ground floor (*bel-etage*)

    - the vertical accents and window strips of carefully laid brick

    - the steep roof slope towards the street on top of the flat roof

    '
  category: commercial
  lat: 52.37362
  lng: 4.898445
  address: Oudezijds Voorburgwal 87-89
  attributes:
    heritage_status: Municipal monument
    monument_number: '215002'
    built: '1920'
    style_phase: Sober
    original_use: Office building with caretaker's flat
    listed: 2007
  photos: []
  sources:
  - city:215002
  nl:
    title: Oudezijds Voorburgwal 87-89
    summary: Kantoorgebouw met conciërgewoning uit 1920 in sobere Amsterdamse Schoolstijl, met een erker
      over meerdere verdiepingen en vensterstroken.
    body: 'Het kantoorgebouw met conciërgewoning werd in 1920 ontworpen en beslaat de hele breedte van
      het blok tussen de Oude Kennissteeg en de Kreupelsteeg. Door hoogte en vormgeving wijkt het af van
      de buren, maar dankzij de ambachtelijke uitvoering en de geleding van de gevel detoneert het volgens
      het register niet. Het ontwerp is uitgevoerd in sobere Amsterdamse Schoolstijl; de architect is
      niet bekend.


      Let op:

      - de asymmetrische gevel met een erker over meerdere verdiepingen in de smalle rechtertravee

      - de brede raampartijen links, met een fors wit geschilderde omlijsting op de bel-etage

      - het zorgvuldige metselwerk met verticale accenten

      '
    attributes:
      original_use: Kantoorgebouw met conciërgewoning
    sources:
    - city:215002 (redengevende omschrijving)
  links:
