- title: Former GG&GD building (Willemsstraat)
  summary: A 1926 health-service building by Public Works on a street of cleared Jordaan alleys. Plain
    brick, with Amsterdam School detail in its intricate windows.
  body: 'The Public Works department designed this building in 1926 for the Municipal Health Service (*Gemeentelijke
    Geneeskundige en Gezondheidsdienst*, GG&GD), with a dwelling attached at number 26. It stands where
    an alley called the Wijde Gang once ran, lined with tiny workers'' houses. From the late 19th century
    the city cleared these *sloppen* (alleys) to improve the Jordaan, and a health-service post here is
    part of that story.


    The façade is set back a few metres from the rest of the street. The city register describes the style
    as fairly plain brick architecture that clearly shows Amsterdam School influence in its decorative
    details and in the complicated division of some of the windows. Public Works used this approach often
    at the time.


    Look for:

    - the set-back front, breaking the line of the street

    - red brick with deeply raked joints and a few bluestone accents

    - the windows with complex glazing patterns

    '
  category: public-works
  lat: 52.38141
  lng: 4.884979
  address: Willemsstraat 24-26
  attributes:
