- title: Warmoesbrug (Brug 22)
  summary: The Herengracht crossing of the Raadhuisstraat, a three-span Piet Kramer bridge designed in
    1921 but delayed by post-war price rises until 1925.
  body: 'A bridge has stood here since at least 1599. Its name recalls the Warmoesgracht, the canal filled
    in to make the Raadhuisstraat. The arched bridge of about 1895 could not cope with the traffic to
    Amsterdam-West, or with the horse trams and electric trams that used it. Piet Kramer drew a replacement
    as early as 1921. Rising prices after the First World War delayed the work until February 1925.


    It is the middle one of three matching Kramer bridges on the Raadhuisstraat, with Brug 8 over the
    Singel and the Niek Engelschmanbrug over the Keizersgracht. Until 1957 the bridge carried three-rail
    track, so that the city trams (standard gauge) and the metre-gauge tram to Zandvoort could share it.


    Look for:

    - the brick abutments with carved stone blocks and bands

    - the half-round stone weights at the ends of the wings, holding the railings

    - the decorated stone pylons in the middle of the balustrade

    - Kramer''s wrought-iron railings, the same pattern as on the other two bridges

    '
  category: bridges
