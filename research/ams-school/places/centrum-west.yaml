    summary: Voetgangersbrug uit 1926 van Piet Kramer over de Oudezijds Voorburgwal, tussen het oude stadhuis
      en de Bank van Lening.
    body: 'Al op de kaarten van Pieter Bast (1599) en Berckenrode (1625) ligt hier een brug. Ze is genoemd
      naar de Lommert of Lombard, de Bank van Lening aan de westkant. De brug werd vaak vernieuwd, onder
      meer in 1857, 1888 en 1905. In 1926 werd ze in haar geheel vervangen onder leiding van bruggenarchitect
      Piet Kramer van de Dienst der Publieke Werken: van 5 juli tot 3 oktober 1926 werd gebouwd, vermoedelijk
      op de bestaande houten paalfundering, met stenen landhoofden en stalen liggers.


      Let op:

      - de stenen landhoofden

      - het Prinsenhof met de stadhuisuitbreiding aan de ene kant, de Bank van Lening en De Brakke Grond
      aan de andere

