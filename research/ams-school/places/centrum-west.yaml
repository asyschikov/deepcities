    body: 'Deze brug zet de route van de Raadhuisstraat voort: van de Westermarkt over de Prinsengracht
      naar de Rozengracht. Piet Kramer ontwierp haar in 1923 voor de afdeling Bruggen van Publieke Werken;
      in 1925 werd de bestaande brug naar zijn ontwerp verbouwd.


      Ze is soberder dan de drie bruggen in de Raadhuisstraat: het beeldhouwwerk op de landhoofden is
      eenvoudig, en het karakter komt van baksteen, gedecoreerde natuursteen in de pijlers en de smeedijzeren
      balustrade, die met stroppen aan de verzwaringen is vastgezet.


      Let op:

      - de bakstenen landhoofden met eenvoudig beeldhouwwerk op de uiteinden

      - de gedecoreerde natuursteen in de pijlers, het best te zien vanaf het water

      - de balustrade, vastgezet aan de pylonen en met stroppen aan de uiteinden

      '
