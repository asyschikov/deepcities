- title: Wallich & Matthes office (Spuistraat 281)
  summary: A 1925 office running from the Spuistraat to the Nieuwezijds Voorburgwal by P.J.J.M. Cuypers,
    with brickwork laid in layers and gently curved party walls.
  body: 'The finance house Wallich & Matthes commissioned this office, which runs the full depth of its
    block, from the Spuistraat to the Nieuwezijds Voorburgwal. It was designed in 1925 by P.J.J.M. Cuypers.
    His only other known Amsterdam work is the Montessori Lyceum (1930–1931), designed with A.J. Westerman.
    Its red brick stands out in both streets.


    What makes it special, according to the city register, is the very careful brickwork. The main structure
    seems to be clad in layers of brick courses and panels, a quiet and subtle effect. The Spuistraat
    front is the richer of the two.


    Look for:

    - the gently curved brick party walls

    - the multi-storey oriel over the former main entrance, used as a balcony at the top

    - the ground floor in black stone with stylised pilasters, and the Amsterdam School wooden door

    - the decorative brick bands and stone accents along the top

    '
  category: commercial
  lat: 52.369591
  lng: 4.889268
  address: Spuistraat 281, Nieuwezijds Voorburgwal 326-328
