- title: Herengracht 303 (Mart J. Stam office)
  summary: 'One of the very few Amsterdam School buildings on the canal ring: a small 1919 office with
    ''stirrup'' dormers and exposed concrete, by Mart J. Stam of Wormer.'
  body: 'When the old telephone exchange was built behind it in 1919, the house here, *Het Wapen van Swoll*,
    was so weakened that it had to be demolished. Its replacement is a small office by Mart J. Stam of
    Wormer (the building firm M. Stam en Zn.), not to be confused with his famous modernist namesake Mart
    Stam from Purmerend. The same year, Stam built the Mercurius rice mill in Wormer in a very similar
    idiom.


    The city register calls it one of the few buildings on the canal ring in the Amsterdam School style.
    It is an early example, recognisable by its stirrup motifs, and one of the few offices in the style,
    with folding "harmonica" windows inspired by the Scheepvaarthuis. Stam''s open use of concrete sets
    him apart from De Klerk and Kramer.


    Look for:

    - the two dormers shaped like stirrups (*stijgbeugels*), with the same shape repeated beside the H-shaped
    chimney

    - the bay windows with angled sides, joined by concrete posts with a ceramic sawtooth, and slabs with
    ceramic drip ornaments

    - the Amsterdam School front door, framed together with the windows of the raised ground floor, set
    in a field of small orange-red tiles

    - the side wall on the Oude Spiegelstraat, designed to match the front

    '
  category: commercial
  lat: 52.370302
  lng: 4.887293
  address: Herengracht 303, Oude Spiegelstraat 10
  attributes:
    heritage_status: Municipal monument
    monument_number: '203018'
    built: '1919'
    architect: Mart J. Stam (Wormer)
    style_phase: Expressive
    original_use: Office building
    listed: 2004
  photos: []
  sources:
  - city:203018
  nl:
    title: Herengracht 303 (kantoor van Mart J. Stam)
    summary: 'Een van de weinige Amsterdamse School-panden op de grachtengordel: een klein kantoor uit
      1919 met stijgbeugelvormige dakvensters en zichtbaar beton.'
    body: 'Door de bouw van de telefooncentrale in 1919 raakte het pand ''Het Wapen van Swoll'', ook wel
      ''De Trompetter'', zo verzwakt dat het moest worden vervangen. Het nieuwe kantoortje is van Mart
      J. Stam uit Wormer (bouwfirma v/h M. Stam en Zn.), niet te verwarren met zijn modernistische naamgenoot
      uit Purmerend. Stam bouwde in hetzelfde jaar de rijstpellerij Mercurius in Wormer in een verwante
      vormentaal.


      Het register noemt het een van de weinige panden op de grachtengordel in Amsterdamse Schoolstijl,
      een vroeg voorbeeld herkenbaar aan de stijgbeugelmotieven, en een van de weinige kantoren in die
      stijl, met harmonicavensters naar voorbeeld van het Scheepvaarthuis. Het zichtbare beton onderscheidt
      Stam van De Klerk en Kramer.


      Let op:

      - de stijgbeugelvormige dakvensters naast de H-vormige schoorsteen

      - de erkers met betonnen stijlen met keramische zaagtand en druppelornamenten

      - de voordeur in een omlijsting met oranjerode tegeltjes

      - de deels meeontworpen zijgevel aan de Oude Spiegelstraat

      '
    attributes:
      original_use: Kantoorgebouw
    sources:
    - city:203018 (redengevende omschrijving)
  links:
  - label: Gemeentelijk monument (203018)
    url: https://data.amsterdam.nl/monumenten/6ff649c6-c723-4068-86e5-ada9a248c8fb
- title: Deli-Batavia office (Herengracht 286)
  summary: A 1920–1922 tobacco company office on the Herengracht by the Van Gendt brothers, mixing Amsterdam
    School with 17th-century motifs, with a lavish tiled interior.
  body: 'The N.V. Deli-Batavia Maatschappij, originally a tobacco company in Batavia (now Jakarta), had
    three canal houses demolished in 1921 to build this office with two flats. It was designed by the
    Van Gendt brothers in the Amsterdam School style, mixed with neo-17th- and 18th-century elements:
    a stone base, pilaster strips and cross-shaped window frames. The gable top of the demolished Herengracht
    286 was saved and placed on the garden house.


    The interior is part of the listing. The corridors and stairwell are lined with fine tiles, the stair
    balustrades and radiator covers are made of openwork ceramics, and there is an Amsterdam School bench
    and a lightwell with a geometric leaded-glass lantern.


    Look for:

    - the strongly divided brown-brick front with five pilaster strips with chamfered edges

    - the stone posts with balls and chains in front of the stone base, and the geometric wrought-iron
    railing with pinnacles

    - the high attic with four brick ornaments above a projecting stone slab

    - the steep broken (mansard-like) slate roof, with slender metal finials at the ends of the ridge

    '
  category: commercial
  lat: 52.370567
  lng: 4.886552
  address: Herengracht 286
  links:
  - label: Rijksmonumentenregister (518337)
    url: https://monumentenregister.cultureelerfgoed.nl/monumenten/518337
  - label: Wikidata
    url: https://www.wikidata.org/wiki/Q17302705
  attributes:
    heritage_status: National monument
    monument_number: '518337'
    built: 1920–1922
    architect: Gebroeders van Gendt
    client: N.V. Deli-Batavia Maatschappij
    style_phase: Expressive
