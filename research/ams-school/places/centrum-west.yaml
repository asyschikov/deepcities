  nl:
    title: De Friesche (Rokin 115)
    summary: 'Verzekeringskantoor uit 1928 van de gebroeders Baanders aan de stille zijde van het Rokin,
      met een triomfpoort als ingang en beelden van Hildo Krop: Welvaart, Arbeid, Zorg en Rust.'
    body: 'De verzekeraar De Algemeene Friesche liet in 1928 dit kantoor bouwen door de gebroeders H.A.J.
      en J. Baanders, wier vader bekendheid verwierf met winkelpuien en het EHLB-kantoor aan het Rokin.
      In deze jaren lieten veel verzekeraars nieuwe kantoren bouwen, met moderne representatieve architectuur
      en een open, publieksvriendelijke begane grond. De stijl is die van de Amsterdamse School.


      De representatieve waarde zit vooral in het beeldhouwwerk van Hildo Krop, dat de zegeningen van
      het leven verbeeldt, mits goed verzekerd.


      Let op:

      - de begane grond als triomfpoort: vier achthoekige pijlers en een rondboog van tapse bakstenen

      - de wapens van Amsterdam en Noord-Holland boven de zijopeningen

      - Krops vier figuren als penanten op de eerste verdieping: WELVAART, ARBEID, ZORG en RUST

      - de hoeklisenen van afwisselend gele baksteen en natuursteen en de loggia

      '
    attributes:
      client: De Algemeene Friesche (verzekeraar)
      original_use: Verzekeringskantoor
    sources:
    - city:201023 (redengevende omschrijving)
  links:
