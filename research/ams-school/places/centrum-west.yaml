- title: Kramer bridges at the Passeerdersstraat (Brug 98, 99, 100)
  summary: Three small 1927 Piet Kramer bridges where the Lijnbaansgracht meets the Passeerdersgracht
    and the Looiersgracht, all built in the same few months.
  body: 'In 1913 there were plans to fill in the Looiersgracht and move the crossing. They came to nothing,
    and in 1927 the Public Works department renewed three neighbouring bridges along the Lijnbaansgracht
    to designs from Piet Kramer''s office:

    - Brug 99 carries the Passeerdersstraat over the Lijnbaansgracht (August–December 1927).

    - Brug 100, the Tetje de Jongbrug, crosses the Looiersgracht (December 1927 – May 1928).

    - Brug 98 crosses the Passeerdersgracht in the eastern quay of the Lijnbaansgracht.


    Bridges 99 and 100 are twins. The spans themselves are fairly standard. Kramer''s style shows in the
    quay walls and abutments, the wrought-iron railings that run to simply carved stone posts, and the
    flower boxes. The bridges sit among other monuments: the 1939 housing block by Göbel and Den Hertog,
    the labour exchange on the Passeerdersgracht and the former Openbare Handelsschool on the Raamplein.


    Look for:

    - the Amsterdam School brickwork of the abutments, best seen from the water''s edge

    - Kramer''s wrought-iron balustrades and the stone end posts

    - the matching details on bridges 99 and 100

    '
