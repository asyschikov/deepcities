- title: Singel 46-48 (Confectiefabriek Cohen)
  summary: Adriaan Moen's office and workshop for a clothing factory, whose corner rises into an 'expressionist
    crescendo' of brick against the old canal houses.
  body: 'This stretch of the Singel, between the Brouwersgracht and the Blauwburgwal, was once full of
    businesses, among them the Boldoot factories. Around 1920 Adriaan Moen (1879–1950) designed offices,
    a workshop and a warehouse here for the Cohen clothing factory, keeping the historic façade of Roomolenstraat
    3–7 behind. Moen trained in the office of Posthumus Meyjes, and his later work was strongly influenced
    by the Amsterdam School. J.G. Wattjes included this building, and Moen''s Gerzon building on the Spuistraat,
    in his survey *Nieuw Nederlandsche Bouwkunst* (1926).


    The city register frankly calls the building a dissonant in the canal: the stressed corner and the
    odd balance of window and wall are "characteristic of the Amsterdam School, of course".


    Look for:

    - the corner, where vertical bands of brickwork rise into an expressionist climax at fifth-floor level

    - the triangular oriel over the central entrance on the Singel

    - the decorated Amsterdam School front door at the top of a six-step stoop

    - the projecting brick band with sculptural brickwork where it crosses the piers

    - the very heavy window frames, a nod to old Amsterdam joinery

    '
  category: commercial
  lat: 52.37817
  lng: 4.892432
  address: Singel 46-48, Roomolenstraat 1
  attributes:
    heritage_status: Municipal monument
    monument_number: '203048'
    built: c. 1920
    architect: Adriaan Moen
    client: Confectiefabriek Cohen
    style_phase: Expressive
    original_use: Office, workshop and warehouse for a clothing factory
    listed: 2004
  photos: []
  sources:
