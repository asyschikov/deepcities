  nl:
    title: Sint Vincentiusschool
    summary: 'Katholieke school van J. Duncker uit 1924 in de Jordaan: een hoge getoogde ingang onder
      een tegeltableau met de schoolnaam en forse houten raamomlijstingen.'
    body: 'In 1924 verving de Vereeniging van den Heiligen Vincentius à Paulo haar school uit 1883 door
      een nieuw gebouw naar ontwerp van J. Duncker, die eerder al aan de Oostenburgergracht een school
      voor dezelfde vereniging bouwde. Waar die school uit 1919 "een bijna schrale expressie" heeft, is
      deze volgens het gemeentelijk register een duidelijke vertegenwoordiger van de Amsterdamse Schoolstijl.


      Het grootste deel is een gangenschool op het binnenterrein, met de lokalen op het zuiden. Alleen
      het bouwdeel met hal en trappenhuis staat aan de straat; Duncker gaf dat smalle deel een monumentale
      gevel zodat het toch als school herkenbaar is.


      Let op:

      - de hoge getoogde ingang met een tegeltableau met de schoolnaam

      - de grote raampartijen met glas-in-lood

      - de fors gedimensioneerde houten omlijstingen, kenmerkend voor de stijl

      - de smeedijzeren vlaggenstokhouders


      Het metselwerk is tot het tableau bruin geschilderd en een deel van het glas-in-lood is verdwenen.

      '
    attributes:
      original_use: Rooms-katholieke lagere school
    sources:
    - city:209028 (redengevende omschrijving)
  links:
