  nl:
    title: Rubber Centraal Station (Warmoesstraat)
    summary: Kantoor uit 1928 van H.A. Sangster en F. Warnaar aan de kop van de Warmoesstraat, met blokvormige
      volumes en typische Amsterdamse School-vensters.
    body: 'Het "Kantoorgebouw Rubber Centraal Station R.C.S. Amsterdam" verving acht winkel-woonhuizen
      op de hoek van de Nieuwe Brugsteeg en de Warmoesstraat; alleen Warmoesstraat 6 en 8 werden deels
      achter de nieuwe gevel opgenomen. Het ontwerp uit 1928 is van de Haagse architect H.A. Sangster
      (1892-1971), bekend van zijn watertorens, en F. Warnaar.


      Volgens het register is het gebouw ontworpen in een stijl verwant aan de ''Amsterdamse school'',
      zichtbaar in de blokvormige opbouw en de vensters met dieper liggende onderramen en licht vooruitstekende
      bovenramen met horizontale roeden. Doordat de Warmoesstraat hier buigt, is de licht concave gevel
      van ver te zien.


      Let op:

      - de concave, symmetrische gevel aan de Warmoesstraat

      - de pui van zwart natuursteen met vooruitstekende penanten onder een doorlopende luifel

      - de attica met vele kleine staande vensters

      '
    attributes:
      original_use: Kantoorgebouw met winkels
    sources:
