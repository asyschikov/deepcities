  nl:
    title: Telefooncentrale Singel 340
    summary: 'Hoofdkantoor van de Gemeentetelefoon (1916-1919) van Rutgers en Marnette: een ruw natuurstenen
      basement en kapitelen van Hildo Krop in de vorm van telefoonpalen.'
    body: 'Het voormalige hoofdkantoor van de gemeentelijke telefoondienst, aanvankelijk Centraal Bureau
      Centrum van de Gemeentetelefoon en sinds 1942 de Plaatselijke Telefoondienst, werd in 1916-1919
      gebouwd naar ontwerp van de PW-architecten G.J. Rutgers en P.L. Marnette, in de verstrakte Amsterdamse
      School. Het beeldhouwwerk is van Hildo Krop.


      Het gebouw liep oorspronkelijk door tot een gelijke gevel aan de Herengracht 293-305. Die werd in
      1955 vervangen door nieuwbouw van C. van der Wilk; de ingangspartij met beeldhouwwerk van Krop verhuisde
      naar het PTT-gebouw in de Watergraafsmeer. De Singelgevel is redelijk gaaf bewaard.


      Let op:

      - de zware rustica-sokkel van ruw behakte natuursteen met zwaar traliewerk

      - de muurdammen met als kapiteel een telefoonpaal met draden, geflankeerd door wapens van Nederlandse
      steden

      - de vensters in groepen van drie en de meanderende natuurstenen band op de bovenste verdieping

      '
    attributes:
      client: Gemeente Amsterdam (Gemeentetelefoon)
      original_use: Telefooncentrale en kantoor
    sources:
    - rce:518372 (omschrijving Rijksmonumentenregister)
- title: City hall extension (Prinsenhof)
  summary: The 1923–1926 Amsterdam School wing of the old city hall on the Oudezijds Voorburgwal, with
    a council chamber and wedding hall. It is now part of a hotel.
  body: 'After King Louis Napoleon took over the city hall on the Dam as his palace in 1808, the city
    council moved to the Prinsenhof on the Oudezijds Voorburgwal. In 1923–1926 the Public Works department
    added a new wing in the Amsterdam School style, designed by Nicolaas Lansdorp and Allard Remco Hulshoff.
    It held a new council chamber and a new wedding hall. The interior was decorated by sculptors including
    Driekus Jansen van Galen, Anton Fortuin, Adrianus Remiëns and Bernard Richters.


    The wedding hall has a tall stained-glass window, a gift from Rotterdam in 1925 for Amsterdam''s 650th
    anniversary, with the arms of both cities. The building served as city hall until 1988 and is now
    a hotel, which kept the wedding hall and its window.


    Look for:

    - the galleries of sculpture on the canal front

    - the brick wing next to the older Prinsenhof buildings

    - Hildo Krop''s sculpted urinal on the opposite quay, made the same year as a comment on the council
    chamber

    '
