- title: Van den Brul clothing store (Nieuwendijk)
  summary: A late Amsterdam School clothing store of 1930 by the Baanders brothers, wrapping round a corner
    of the Nieuwendijk, with reliefs of the clothing trade and Saint Martin.
  body: 'The clothing store P. van den Brul was a well-known name on the Nieuwendijk, one of the city''s
    main shopping streets. In 1930 the brothers Herman and Jan Baanders remodelled its premises on the
    corner of the Sint Nicolaasstraat. Like a department store, it was meant to be a world of its own
    inside, behind a fairly closed screen of brick. The city register compares it with Piet Kramer''s
    Bijenkorf in The Hague of five years earlier and calls it a late example of Amsterdam School architecture.
    In 1932 the same architects built the firm''s garage and workshops round the corner, at Sint Nicolaasstraat
    12–14, in a historicising style.


    The shopfronts and the original steel windows with geometric leaded glass have gone, but the brick
    screen is intact.


    Look for:

    - the continuous front folding round the rounded corner, with tall vertical window strips between
    brick piers

    - the tuff blocks at the foot of the piers, carved with clothing-trade attributes, the initials PvdB
    and Saint Martin sharing his cloak

    - the decorative brick band above the ground floor

    '
