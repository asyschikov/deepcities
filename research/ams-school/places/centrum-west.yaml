- title: Gunters & Meuser
  summary: An ironmonger's shop and warehouse of 1917–1918 on the corner of the Prinsengracht, its dark
    brick front lettered in wrought iron with the firm's name.
  body: 'The ironmongers Gunters & Meuser already had a shop in the 1883 corner building at Prinsengracht
    108. In 1917–1918 they added this building next door: a shop, a warehouse and offices, designed by
    Piet Vorkink and Jacob Wormser. The concrete work was done by the Wittenburg cement-iron factory (Monier
    system). The national register singles out its unusual materials and ornament.


    The front is dark brown brick, in three parts: a broad centre of seven bays between two narrow corner
    bays. Hoist doors and lettering advertise the trade.


    Look for:

    - "HANDEL IN IJZERWAREN" (ironmongery) in iron letters over the shop window, and "GUNTERS & MEUSER"
    in wrought iron twice higher up

    - the wrought-iron hoist beams, dated ANNO 1917, with lamps above them

    - the pilasters between the windows, shaped like brick bonding patterns

    - the windows set at an angle, and the zigzag glazing bars in the fanlights over the side doors

    '
