  nl:
    title: Mr. Harm Smeengeschool
    summary: Afgeronde bakstenen school voor schipperskinderen aan het Droogbak (1924-1925), ontworpen
      door P.L. Marnette van Publieke Werken, met een golvende dakrand.
    body: 'Aan het Droogbak liet de gemeente in 1924-1925 een school bouwen voor kinderen van binnenschippers:
      de mr. Harm Smeengeschool. Het ontwerp kwam van P.L. Marnette (1888-1948), architect bij de Dienst
      der Publieke Werken.


      Het gebouw bestaat uit twee volumes: een hogere noordvleugel met trappenhuis, gangen, sanitair en
      kantoren, en een zuidvleugel met drie lokalen per verdieping, alle op de zon gericht. De afgeronde
      hoeken en de golvende gevelbeëindiging maken het tot een beeldbepalend gebouw aan het Droogbak.
      Sinds 1988-1989 zit op de begane grond een opvang en boven een sportschool.


      Let op:

      - de afgeronde hoeken van de bouwvolumes

      - de dakrand die op regelmatige afstanden omhoog golft

      - de ingang in de smalle oostgevel met een brede natuurstenen stijl en drie roostervormig verdeelde
      ramen erboven

      - de rijen vierkante raampjes van de sanitaire ruimten aan de zuidkant

      '
    attributes:
      architect: P.L. Marnette (Dienst der Publieke Werken)
      client: Gemeente Amsterdam
      original_use: Lagere school voor schipperskinderen
    sources:
    - rce:518379 (omschrijving Rijksmonumentenregister)
