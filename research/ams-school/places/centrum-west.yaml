- title: Langemeijer shopfront (Heiligeweg 37)
  summary: A mahogany Amsterdam School shopfront of about 1915 with curved display windows and pointed
    leaded lights, set into an early 19th-century house.
  body: 'The house dates from the first half of the 19th century and became a shop with storage in 1907.
    Around 1915 the firm Langemeijer had the shopfront rebuilt to a design by A. Jacot, with the builder
    J. Verheus. The national register values the shopfront as a characteristic Amsterdam School design,
    kept intact.


    The front is symmetrical, with a deep porch in the middle leading to the door. All the woodwork is
    mahogany.


    Look for:

    - the curved shop windows on either side of the porch, above a bluestone plinth

    - the floor of small red square tiles in the porch

    - the fanlight row of five pairs of leaded panes set at an angle, ending in points, framed in decorated
    wood

    - the broad wooden frieze with moulding and decorative lead

    '
  category: commercial
