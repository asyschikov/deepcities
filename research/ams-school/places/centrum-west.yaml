    heritage_status: Municipal monument
    monument_number: '206056'
    built: '1930'
    architect: H.A.J. Baanders, J. Baanders
    client: N.V. Kleedingmagazijnen v/h P. van den Brul
    style_phase: Sober
    original_use: Clothing store, warehouse and workshops
    listed: 2005
  photos: []
