    summary: Klein kantoorgebouw met bovenwoningen uit 1919-1920 op de hoek van de Blauwburgwal, met een
      grillige gevelbeëindiging en een gevelsteen met een stenen schip.
    body: 'B. Cordemeijer liet dit kantoorgebouw met bovenwoningen in 1919-1920 bouwen naar ontwerp van
      J.J. Eijrond en zijn zoon J.F.J. Eijrond. In 1927 verbreedde de zoon het pand aan de Blauwburgwal,
      met overname van karakter en detaillering; het kleurverschil in het metselwerk is nog zichtbaar.
      Tussen de oudere bebouwing is het hoekpand, vooral vanaf de Blauwburgwal, sterk beeldbepalend.


      Let op:

      - de gevelbeëindiging met uitgemetselde bakstenen ornamenten en keramiek boven de erker

      - de keramische rand boven de natuurstenen plint

      - de originele deur en het glas-in-loodbovenlicht met de letters BC en de jaartallen 1919-1940

      - de gevelsteen "het stenen schip" in de erker aan de Blauwburgwal

      '
