  nl:
    title: Theo Thijssenschool
    summary: Hoekschool van Publieke Werken in de Jordaan, waar de bakstenen gevel rond een gebogen hoek
      vloeit, met lange vensterreeksen en de originele blankgelakte deur.
    body: 'De Theo Thijssenschool aan de Anjeliersstraat is een door de Dienst Publieke Werken in de jaren
      twintig ontworpen school in Amsterdamse Schoolstijl. Het hoekperceel leidde tot het zogeheten hoekschooltype:
      twee gangen haaks op elkaar, die samenkomen bij een centraal trappenhuis in de knik. De lokalen
      liggen op het zuiden, sanitair en bergingen aan de straat; daardoor zijn de straatgevels vrij gesloten,
      met lange vensterreeksen in forse omlijstingen.


      Het register prijst het "fijnzinnig expressionisme": met de plastische hoek, de verspringende daklijst
      en het vloeiende metselwerk probeert het compacte gebouw zich te bevrijden uit de straatwand. Met
      de buurschool uit 1874 vormt het een ensemble dat een halve eeuw scholenbouw laat zien.


      Let op:

      - de afgeronde ingangspartij met blankgelakte deur

      - de vensters met V-roeden naast de ingang

      - de lange, horizontale vensterstroken

      - de school uit 1874 ernaast

      '
    attributes:
      client: Gemeente Amsterdam
      original_use: Lagere school
    sources:
    - city:209001 (redengevende omschrijving)
