- title: Theo Thijssenschool
  summary: A corner school in the Jordaan where Public Works bent the brick façade round a curved corner,
    with long ribbons of windows and the original varnished door.
  body: 'The Public Works department built this school in the mid-1920s on a corner plot in the Jordaan.
    It is named after Theo Thijssen, the Amsterdam teacher, writer and politician. It follows the department''s
    "corner school" type. Two corridors at right angles meet at a central staircase in the angle, the
    classrooms face south, and the toilets and storerooms line the street. That layout explains why the
    street fronts are fairly closed, crossed by long horizontal ribbons of windows in heavy frames.


    The city register praises its "subtle expressionism". The curved corner, the stepping roofline and
    the flowing lines of the brickwork try to free the compact building from the tight street wall. Next
    door stands a city school from 1874, and the two together show how school design changed in fifty
    years.


    Look for:

    - the rounded entrance with its original varnished wooden door

    - the windows beside the door, divided by V-shaped glazing bars

    - the long bands of windows in deep frames

    - the stepped roofline and the curving brickwork at the corner

    - the 1874 school next door at Anjeliersstraat 153–155

    '
