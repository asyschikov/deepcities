- title: Nieuwe-Wercksbrug (Brug 63)
  summary: Piet Kramer's three-span 1925 bridge over the Prinsengracht, linking the Westermarkt to the
    Rozengracht in the shadow of the Westerkerk.
  body: 'This bridge continues the Raadhuisstraat route west: it carries traffic from the Westermarkt
    over the Prinsengracht into the Rozengracht. Piet Kramer designed it in 1923 for the Bridges department
    of Public Works, and it was rebuilt to his design in 1925.


    It is simpler than the three bridges on the Raadhuisstraat. The sculpture on the abutments is plain,
    and the character comes from the brick, the decorated natural stone of the piers and the wrought-iron
    railings, which are tied to the pylons and anchored with straps at the ends.


    Look for:

    - the brick abutments, weighted at the ends with simple carved stone

    - the decorated stone blocks in the piers, best seen from the canal side

    - the wrought-iron balustrade, fixed to the pylons and held at the ends by straps

    - the Westerkerk and the Anne Frank House just up the Prinsengracht

    '
