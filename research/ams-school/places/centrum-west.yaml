  nl:
    title: Willemsbrug (brug 151)
    summary: Basculebrug van Piet Kramer over de Singelgracht (gebouwd 1928-1929), tussen Haarlemmerplein
      en Nassauplein, vlak bij de Willemspoort.
    body: 'Na de aanleg van het Westerkanaal in 1877 was hier een brug nodig. De oude brug was berucht
      bij trambestuurders: er hing geen bovenleiding en er lag een flauwe bocht vóór de brug, zodat trams
      met een aanloop moesten oversteken. Op 2 januari 1924 raakte een motorwagen van lijn 18 door sneeuw
      en ijs uit de rails en belandde via de balustrade in de Singelgracht.


      Piet Kramer ontwierp in 1925 de huidige basculebrug, die in 1928-1929 werd gebouwd en is vernoemd
      naar de nabije Willemspoort. Nu kwam er wel bovenleiding; tot 1955 reden er trams over de brug.
      Ze is een gemeentelijk monument.


      Let op:

      - de landhoofden van baksteen en natuursteen

      - het beweegbare brugdek

      - de Willemspoort naast de brug

      '
