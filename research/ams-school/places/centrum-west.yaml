- title: Huize Labor (Westermarkt 2)
  summary: A 1919–1921 office on the Westermarkt whose construction, after a pair of 17th-century step
    gables was demolished, helped found the Hendrick de Keyser society.
  body: 'G. van Arkel designed this office building in 1919 for H.W.C. Würdeman. It was a purpose-built
    office, with offices on the upper floors and, on the ground floor, a sample room, a rinsing room,
    a coach house and a caretaker''s flat. To make room, a pair of early 17th-century twin step gables
    was demolished. Van Arkel himself sat on the committee for the city''s appearance that approved the
    demolition. The outcry contributed to the founding of the Vereniging Hendrick de Keyser, which still
    saves historic houses. Van Arkel left the committee and died soon after, and his partner Breman finished
    the building.


    The city register calls it a rare example of a sober Amsterdam School design by an architect otherwise
    rooted in the 1890–1910 period: the decorative brick bonds, the sculpted concrete and the wedge-shaped
    dormers are of the style, but the composition is strict and classical.


    Look for:

    - the symmetrical Westermarkt front with a three-storey oriel over the entrance, a triangular gable
    top and angled corner oriels

    - the grooved bluestone plinth and the sculpted concrete brackets under the oriel

    - the diamond-pattern glazing bars in the fanlights

    - the white-painted crown on the slate-and-shingle mansard roof

    '
  category: commercial
  lat: 52.37475
  lng: 4.884937
  address: Westermarkt 2, Keizersgracht 198
  attributes:
    heritage_status: Municipal monument
    monument_number: '205048'
    built: 1920–1921
    architect: G. van Arkel (completed by Breman)
    client: H.W.C. Würdeman
    style_phase: Sober
    original_use: Office building with caretaker's flat
    listed: 2005
  photos: []
  sources:
