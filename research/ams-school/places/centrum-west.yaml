  nl:
    title: Café aan het Haarlemmerplein (Haarlemmerplein 31)
    summary: Hoekpand uit 1894 dat in 1929 een omlopende cafépui kreeg in 'sobere maar expressieve' Amsterdamse
      Schooltrant, met glas-in-lood en gepolijst graniet.
    body: 'Het winkelhuis met bovenwoningen werd in 1894 gebouwd door aannemer-architect W.J. Appen, met
      sierdetails in Hollandse renaissancetrant. In 1929 werd de banketbakkerij op de begane grond een
      café; architect Fred. Huisman jr. tekende de cafépuien die om de hoek van het Haarlemmerplein en
      de Korte Marnixstraat lopen. Het is nog altijd een café.


      Het register beschrijft de pui als uitgevoerd in een "sobere maar expressieve Amsterdamse Schooltrant".
      Die pui is de reden dat het pand op deze kaart staat.


      Let op:

      - de omlopende pui in gepolijst graniet, als basement onder de woonverdiepingen

      - penanten in blokverband en rijen glas-in-loodbovenlichten

      - de oorspronkelijke deuren in de hoek en aan de Korte Marnixstraat

      - het negentiende-eeuwse pand erboven met houten hoekerker

      '
