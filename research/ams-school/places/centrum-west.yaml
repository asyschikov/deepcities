- title: Lindengracht 146 school
  summary: A 1927 Public Works school in the Jordaan, with big classroom windows and a heavy tiled roof,
    facing an older city school from 1914 across the street.
  body: 'The Public Works department designed this school in 1927. It was one of a number of schools built
    on the sites of cleared slums in the Jordaan. Unlike the new schools in the expansion districts, it
    had to fit into an existing street, so only the street front was given a real design. Its scale and
    its large classroom windows set it apart from its neighbours. The building is now housing.


    The city register sees it as a good example of the more functional phase of Public Works school design
    in the 1920s and 1930s. It also forms a pair with the school opposite, built by the same department
    in 1914. That older school is low and traditional. This one is tall, with broad windows whose Amsterdam
    School detailing gives it a modern look.


    Look for:

    - the steep pantiled roof with its deep overhanging gutter, which gives the front a massive look

    - the large, finely divided classroom windows

    - the heavy canopy over the entrance and the brick bays across the first and second floors

    - the 1914 school across the street, for comparison

    '
