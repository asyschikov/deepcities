  nl:
    title: Brug 117 (Rozengracht, Lijnbaansgracht)
    summary: Brug in de Rozengracht over de Lijnbaansgracht, op de uitvalsroute naar West; volgens het
      gemeentelijk register in 1926 vernieuwd naar ontwerp van Piet Kramer.
    body: 'Rond 1885 koos de gemeente de Rozengracht, en niet de Westerstraat, als uitvalsweg naar Amsterdam-West.
      De gracht werd gedempt en er moest een brug over de Lijnbaansgracht komen; na getouwtrek met de
      trammaatschappij volgde in 1891 een vaste brug. Iets zuidelijker lag eerder een draaibrug bij molen
      De Victor.


      Het gemeentelijk monumentenregister noemt Piet Kramer als ontwerper en 1926 als jaartal. Dat past
      bij de vernieuwing van de hele route Raadhuisstraat-Rozengracht halverwege de jaren twintig, toen
      ook Kramers bruggen over Singel, Herengracht, Keizersgracht en Prinsengracht werden gebouwd.


      Let op:

      - de landhoofden aan de waterkant

      - de brug als sluitstuk van de Kramerbruggen op deze route

      - Rozengracht 229-233 van Dick Greiner, een paar stappen verderop

      '
