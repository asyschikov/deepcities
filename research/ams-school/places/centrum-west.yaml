  nl:
    title: Kramerbruggen bij de Passeerdersstraat (brug 98, 99 en 100)
    summary: Drie kleine bruggen uit 1927 van Piet Kramer waar de Lijnbaansgracht de Passeerdersgracht
      en de Looiersgracht kruist.
    body: 'In 1913 werd voorgesteld de Looiersgracht te dempen en de brug te verleggen, maar dat ging
      niet door. In 1927 vernieuwde Publieke Werken drie naburige bruggen naar ontwerp van (het bureau
      van) Piet Kramer:

      - brug 99 in de Passeerdersstraat over de Lijnbaansgracht (augustus-december 1927)

      - brug 100, de Tetje de Jongbrug, over de Looiersgracht (december 1927-mei 1928)

      - brug 98 in de oostkade van de Lijnbaansgracht over de Passeerdersgracht


      Brug 99 en 100 zijn zusjes. De overspanning is vrij standaard; de Amsterdamse Schoolstijl zit vooral
      in de walkanten, de siersmeedwerk balustrades tot aan eenvoudig bewerkte natuurstenen kolommen,
      en de bloembakken. Alle drie zijn sinds 1995 gemeentelijk monument.


      Let op:

      - het metselwerk van de landhoofden, het best te zien vanaf de waterkant

      - de smeedijzeren balustrades en natuurstenen kolommen

      - het woonblok van Göbel en Den Hertog en de Arbeidsbeurs vlakbij

      '
