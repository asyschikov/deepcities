  nl:
    title: Lijnbaansgracht 211-217 (Göbel en Den Hertog)
    summary: Wigvormig blok uit 1939 met 36 woningen, winkels en kantoren van Göbel en Den Hertog, in
      de verstrakte Amsterdamse Schoolstijl.
    body: 'In 1939 kreeg J. Reijnhoudt vergunning voor een magazijn, showroom, kantoren en 36 woningen
      op dit vrijgekomen terrein. Architecten waren Lucas Göbel (1899-1989) en Gerardus den Hertog (1901-1990),
      die ook aan de woonblokken in Bos en Lommer werkten; dit blok lijkt daarop. In 1946 liet het drukkers-,
      uitgevers- en reclamebedrijf Cloeck en Moedigh/Calff en Meischke de begane grond door dezelfde architecten
      aanpassen.


      nl.wikipedia rekent het tot de verstrakte Amsterdamse Schoolstijl. Het forse blok is een uitzondering
      in de kleinschalige binnenstad en vult een heel wigvormig bouwblok.


      Let op:

      - de symmetrische hoofdgevels met verticale erkerstroken en horizontale vensterreeksen

      - bruine strengperssteen in Vlaams verband

      - hoge ingesneden portieken met blokjes natuursteen

      - de smalle, scherpe kop aan de Passeerdersstraat

      '
    attributes:
      original_use: 36 woningen met winkels, showroom en kantoren
    sources:
    - city:206049 (redengevende omschrijving)
    - https://nl.wikipedia.org/wiki/Lijnbaansgracht_211-218
