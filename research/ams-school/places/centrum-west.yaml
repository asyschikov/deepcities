  nl:
    title: Huize Labor (Westermarkt 2)
    summary: Kantoorgebouw uit 1920-1921 aan de Westermarkt; de sloop van een zeventiende-eeuwse tweelingtrapgevel
      ervoor leidde mede tot de oprichting van Hendrick de Keyser.
    body: 'G. van Arkel ontwierp dit kantoorgebouw in 1919 voor H.W.C. Würdeman, met op de begane grond
      een dienstwoning, monsterlokaal, spoelkamer en wagenremise. Voor de bouw werd een vroeg-zeventiende-eeuwse
      tweelingtrapgevel gesloopt. De Commissie voor het stadsschoon, waarin Van Arkel zelf zat, had geen
      bezwaar; het protest leidde uiteindelijk tot de oprichting van de vereniging Hendrick de Keyser.
      Van Arkel trad uit de commissie en overleed kort daarna; zijn compagnon Breman voltooide het gebouw.


      Het register noemt het een zeldzaam voorbeeld van een ontwerp van Van Arkel in sobere Amsterdamse
      Schoolstijl: decoratieve metselverbanden, plastisch beton en wigvormige dakvensters, maar een strenge,
      klassieke opzet.


      Let op:

      - de symmetrische gevel met een erker over drie verdiepingen, een driehoekige geveltop en overhoekse
      erkers

      - de gegroefde hardstenen plint en de plastische betonconsoles

      - de ruitvormige roeden in de bovenlichten

      - de witte bekroning op het mansardedak

      '
    attributes:
      architect: G. van Arkel (voltooid door Breman)
      original_use: Kantoorgebouw met dienstwoning
    sources:
    - city:205048 (redengevende omschrijving)
  links:
