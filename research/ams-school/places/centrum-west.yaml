    title: Gunters & Meuser
    summary: IJzerwarenhandel uit 1917-1918 op de hoek van de Prinsengracht, met een donkerbruine bakstenen
      gevel en de firmanaam in smeedijzeren letters.
    body: 'De ijzerwarenhandel Gunters & Meuser zat al in het hoekpand Prinsengracht 108 uit 1883. In
      1917-1918 kwam op het belendende perceel een nieuw gebouw met winkel, magazijn en kantoren, naar
      ontwerp van P. Vorkink en Jac. Ph. Wormser in Amsterdamse Schoolstijl. Uitvoerder was de Amsterdamsche
      Fabriek van cement-ijzerwerken (Systeem Monier) ''Wittenburg''. Het Rijksmonumentenregister roemt
      het bijzondere materiaalgebruik en de ornamentiek.


      Let op:

      - "HANDEL IN IJZERWAREN" boven de winkelpui en tweemaal "GUNTERS & MEUSER" in smeedijzer

      - de sierlijke hijsbalken met "ANNO 1917" en de lampen erboven

      - de pilasters in de vorm van metselverband tussen de vensters

      - de overhoeks geplaatste vensters en de zaagtandvormige roeden in de bovenlichten van de zijdeuren

      '
    attributes:
      original_use: IJzerwarenhandel met magazijn en kantoren
