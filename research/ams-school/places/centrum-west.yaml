  nl:
    title: Kledingmagazijn Van den Brul (Nieuwendijk)
    summary: Laat Amsterdamse School-kledingmagazijn uit 1930 van de gebroeders Baanders, om de hoek van
      de Nieuwendijk, met reliëfs over de kledinghandel en Sint Maarten.
    body: 'Het gerenommeerde kledingmagazijn P. van den Brul liet zijn pand op de hoek van de Sint Nicolaasstraat
      in 1930 verbouwen door H.A.J. en J. Baanders. Net als bij een warenhuis lag de verleiding binnen:
      een tamelijk gesloten gevel, waarachter een eigen wereld werd geschapen. Het register vergelijkt
      het met de Bijenkorf van Piet Kramer in Den Haag van vijf jaar eerder en noemt het een laat voorbeeld
      van Amsterdamse Schoolarchitectuur. In 1932 bouwden dezelfde architecten om de hoek een garage met
      werkplaatsen in historiserende stijl.


      De oorspronkelijke winkelpuien en de stalen ramen met geometrisch glas-in-lood zijn verdwenen.


      Let op:

      - de ononderbroken gevel die om de afgeronde hoek vouwt, met verticale vensterstroken

      - tufstenen sierblokken met attributen uit de kledingbranche, de initialen PvdB en Sint Maarten
      die zijn mantel deelt

      - de siermetselwerkstrook boven de begane grond

      '
    attributes:
      original_use: Kledingmagazijn met magazijn en werkplaatsen
    sources:
    - city:206056 (redengevende omschrijving)
