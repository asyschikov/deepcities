- title: '''t Smallepad school'
  summary: A kindergarten on the Westelijke Eilanden by Cornelis Kruyswijk, with a half-round entrance
    tower capped in pantiles and terracotta ornaments along the roofline.
  body: 'The *Voorbereidende School ''t Smallepad* (a preparatory school, roughly a kindergarten) was
    built in 1923–1924 on the corner of the Korte Zoutkeetsgracht and the Planciusstraat. Its architect,
    Cornelis Kruyswijk (1884–1935), was one of the leading Amsterdam School designers and built mainly
    schools and churches for the Dutch Reformed community, which commissioned this one.


    The 1920 Primary Education Act put public and religious schools on an equal financial footing. The
    subsidies that followed set off a boom in school building, and denominations used it to build eye-catching
    modern schools like this one. The city register calls it a fine example of simple brick architecture
    with Amsterdam School elements. It is no longer a school, but it still reads clearly as one.


    Look for:

    - the projecting half-round entrance bay, crowned with Romanesque roof tiles, and "Smallepad" in metal
    letters above the door

    - the base of flamed red brick, separated from the plain upper brickwork by a band of ornamental concrete

    - terracotta ornaments and brick balls along the top of the façade, and the date 1924 high on the
    left

    - the long rows of classroom windows on the Planciusstraat side, and the playground wall with its
    lettered gate

    '
  category: schools
  lat: 52.387702
  lng: 4.885231
  address: Korte Zoutkeetsgracht 1-8, Houtmanstraat 2
