- title: Gebouw De Kolk
  summary: A 1925 office block by Th. Kint on the Nieuwezijds Voorburgwal, with a granite base, original
    brass letterboxes and a 'colossal order' of brick piers.
  body: 'In 1925 J. Slaap had two plots merged and commissioned the architect Th. Kint to build a multi-tenant
    office building with storage and a caretaker''s flat. It has a concrete frame, which freed the floors
    from load-bearing walls. For the look, Kint followed what the city register calls the "robust, plastic"
    character of the Amsterdam School, combining granite and brick. The neighbour at number 34, with a
    showroom, was probably also his, but its detailing is very different.


    The Nieuwezijds Voorburgwal was a busy office street in those years, home to several newspapers, and
    Gebouw De Kolk is a well-preserved example of its office architecture.


    Look for:

    - the ground floor clad entirely in grey granite, with stepped blocks on its piers

    - the double wooden doors with ladder-pattern glazing and original brass letterboxes with names

    - "GEBOUW-DE KOLK" in brass letters on the lintel, and the wrought-iron grille in the fanlight

    - brick piers rising three storeys like a giant order, with stepped reveals and block ornaments

    - the top-floor parapet with three small windows and a central flagpole

    '
  category: commercial
  lat: 52.376928
  lng: 4.894341
  address: Nieuwezijds Voorburgwal 32
  attributes:
    heritage_status: Municipal monument
    monument_number: '207038'
    built: '1925'
    architect: Th. Kint
    client: J. Slaap
    style_phase: Expressive
    original_use: Office building with caretaker's flat
    listed: 2005
  photos: []
  sources:
