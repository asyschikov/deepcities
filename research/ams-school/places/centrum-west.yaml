- title: Sint Vincentiusschool
  summary: A Catholic school in the Jordaan by Jacob Duncker, with a tiled name panel over a tall arched
    entrance and chunky Amsterdam School window frames.
  body: 'In 1924 the Catholic charity the Society of Saint Vincent de Paul replaced its 1883 school here
    with a new one by Jacob Duncker (1863–1935). Duncker worked in many styles over a long career, and
    this is one of his few clearly Amsterdam School designs. The city register contrasts it with the almost
    bare school he had built for the same society on the Oostenburgergracht in 1919.


    Most of the building is a corridor school hidden in the courtyard of the block, with its classrooms
    facing south. Only the entrance wing, with the hall and the stairs, reaches the street. Duncker made
    that narrow front monumental so the building would still read as a school.


    Look for:

    - the tall arched entrance, crowned by a tiled panel with the school''s name

    - the large windows above it with leaded glass

    - the heavy timber window frames, typical of the style

    - the wrought-iron flagpole holders


    The brickwork has been painted brown up to the tile panel, and some of the leaded glass is gone.

    '
