- title: Harkema tobacco office (Nes 67)
  summary: A 1923 tobacco merchant's office on the Nes by the Van Gendt brothers, with closed brick fronts,
    the firm's name in swirling wrought iron, and its old sample rooms intact.
  body: 'The Nes was the centre of the Amsterdam tobacco trade. The tobacco auction met in what is now
    the Frascati theatre, and brokers filled the street''s sample rooms. In 1923 the firm G. Harkema had
    its office extended along the Sint Barberenstraat by the Van Gendt brothers, who gave the whole complex
    new façades.


    The city register sees the flat, closed fronts as an example of the linear, expressive variant of
    the Amsterdam School. Inside, the original rooms survive: traditional panelled directors'' offices
    next to modern open offices with Amsterdam School doors, tiled dados and a glazed office booth.


    Look for:

    - the firm''s name in swirling wrought iron on the Nes front

    - the almost closed Nes front, against the horizontal window rows on the Sint Barberenstraat and Kuipersteeg
    that lit the offices and sample rooms

    - brick corbelled out on stone brackets, adding relief to the flat walls

    - the large double wooden door on the Sint Barberenstraat

    '
  category: commercial
