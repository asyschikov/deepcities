- title: Gebouw Batavia
  summary: A 1918–1920 trading house for an arrack company on the Prins Hendrikkade, with carved monkeys
    and elephant heads and a round tower bay.
  body: 'The N.V. Batavia Arak Maatschappij, which traded arrack (a spirit from the Dutch East Indies),
    commissioned these offices and warehouse in 1918–1920 from the architect J.H. Slot, who chose the
    Amsterdam School style. It runs from the Prins Hendrikkade through to the Oudezijds Kolk and included
    a caretaker''s flat. The reinforced concrete was by the firm De Kondor. Since the 1990s it has been
    a restaurant.


    The harbour front is asymmetric and strongly modelled. The colonial trade shows in the sculpture.


    Look for:

    - the narrow half-round bay running up the right-hand side, with a ring ornament at its foot

    - the iron letters GEBOUW BATAVIA, on both fronts

    - carved groups of monkeys on the brick piers, and elephant heads elsewhere

    - the entrance porch with decorative brick and tiles

    - the row of gently pointed battlements along the top

    - the symmetrical back on the Oudezijds Kolk, which keeps its original leaded-glass fanlights

    '
