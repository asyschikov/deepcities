  nl:
    title: Winkelpui Langemeijer (Heiligeweg 37)
    summary: Mahoniehouten winkelpui in Amsterdamse Schoolstijl van omstreeks 1915, met gebogen etalageruiten
      en puntige glas-in-loodruiten, in een negentiende-eeuws pand.
    body: 'Het pand dateert uit de eerste helft van de negentiende eeuw en werd in 1907 verbouwd tot winkel
      met magazijn. Omstreeks 1915 liet de firma Langemeijer de winkelpui vernieuwen naar ontwerp van
      A. Jacot, in samenwerking met bouwkundige en aannemer J. Verheus. Het Rijksmonumentenregister waardeert
      de pui als karakteristiek en gaaf bewaard ontwerp in de stijl van de Amsterdamse School.


      Let op:

      - het diepe middenportiek met een vloer van kleine rode tegeltjes

      - de gebogen winkelruiten boven een hardstenen plint

      - de vijf paar schuin geplaatste, puntig eindigende glas-in-loodruiten in gedecoreerd houtwerk

      - het brede mahoniehouten fries met loden beslag

      '
    attributes:
      client: Firma Langemeijer
      original_use: Winkel met magazijn
    sources:
