  nl:
    title: Niek Engelschmanbrug (brug 106)
    summary: Piet Kramers brug over de Keizersgracht in de Raadhuisstraat, met granieten faunskoppen,
      kraaien en kikkers van Hildo Krop op de pijlers.
    body: 'Na de demping van de Warmoesgracht en de doorbraak naar de Keizersgracht in de jaren 1890 werd
      deze route de belangrijkste verbinding met Amsterdam-West. Al in 1922-1923 kwamen plannen om de
      bruggen te verbreden. Brug 106 werd in 1924-1925 vernieuwd naar ontwerp van Piet Kramer, bruggenarchitect
      van Publieke Werken, en kreeg hetzelfde uiterlijk als brug 8 en brug 22, maar twee doorvaarten in
      plaats van drie.


      Het beeldhouwwerk op de middenpijlers is van Hildo Krop; de siersmeedwerk balustrades werden ontworpen
      en gemaakt door H.J. Winkelman. De brug is vernoemd naar Niek Engelschman, verzetsman en voorvechter
      van homorechten.


      Let op:

      - Krops granieten faunskop met lange baard tussen groepen van drie kraaien, met kikkerkoppen eronder

      - de bakstenen vleugels met gebeeldhouwde pylonen op de uiteinden

      - de smeedijzeren balustrade

      '
    attributes:
      client: Gemeente Amsterdam (afdeling Bruggen, Publieke Werken)
      artists: Hildo Krop (beeldhouwwerk), H.J. Winkelman (smeedwerk)
      original_use: Verkeersbrug
