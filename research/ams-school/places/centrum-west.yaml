- title: Urinal on the Oudezijds Voorburgwal
  summary: A brick-latticed public urinal rising from the canal, topped by Hildo Krop's ranting soapbox
    orator facing the old city hall.
  body: 'Public Works built this urinal in 1926, designed by Allard Remco Hulshoff, while the same department
    was finishing the new wing of the city hall across the water. It is a stone version of Jo van der
    Mey''s cast-iron *plaskrul* (pee curl): a spiral screen on a stone base under a flat round roof, rising
    from the canal edge.


    On top stands a sculpture by Hildo Krop. On the side facing the entrance, a popular orator with a
    clenched fist and open mouth harangues the council chamber. The other side shows a cluster of heads,
    all mouths open. The national register calls it a representative and rare example of Amsterdam School
    street furniture by Public Works.


    Look for:

    - the brick latticework above the oval stone plinth

    - Krop''s grey stone sculpture, about 1.15 m tall, from both sides

    - the small arched frieze on the quay wall beside the entrance

    '
