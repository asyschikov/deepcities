  nl:
    title: Tabakskantoor Harkema (Nes 67)
    summary: Tabakskantoor uit 1923 van de gebroeders Van Gendt in de Nes, met gesloten bakstenen gevels,
      een zwierige smeedijzeren firmanaam en bewaarde monsterkamers.
    body: 'De Nes was het centrum van de Amsterdamse tabakshandel; de veiling zat vanaf 1879 in het huidige
      Frascati. In 1923 liet de firma G. Harkema haar kantoor uitbreiden aan de Sint Barberenstraat door
      de gebroeders Van Gendt, die het hele complex nieuwe gevels gaven.


      Volgens het register verwijzen de rechte, gesloten gevels naar de lineaire, expressieve variant
      van de Amsterdamse Schoolstijl. Binnen zijn de vertrekken aan de Sint Barberenstraat nog oorspronkelijk:
      traditioneel betimmerde directiekamers naast open werkruimten met strakke tegellambriseringen en
      deuren in Amsterdamse Schoolstijl.


      Let op:

      - de firmanaam in zwierig smeedijzerwerk aan de Nes

      - de bijna gesloten Nesgevel tegenover de vensterreeksen aan Sint Barberenstraat en Kuipersteeg

      - uitkragingen op natuurstenen consoles

      - de forse dubbele houten toegangsdeur

      '
    attributes:
      client: Firma G. Harkema (tabakshandel)
      original_use: Tabakskantoor met monsterkamers
    sources:
