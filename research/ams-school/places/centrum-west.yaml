    body: 'De oude brug was in 1894 bij de aanleg van de Raadhuisstraat aangepast. Rond 1922 besloot de
      gemeente tot vervanging; de nieuwe brug naar ontwerp van Piet Kramer werd van februari tot december
      1925 gebouwd. Ze vormt een set met brug 22 en brug 106, met hetzelfde siersmeedwerk in de balustrades.


      De brug had lang de officieuze naam Huiszittensluis, naar het Huiszittenpakhuis voor de armenbedeling,
      dat stond waar later het Hoofdpostkantoor verrees. In 2016 besloot de gemeenteraad die naam niet
      meer te gebruiken.


