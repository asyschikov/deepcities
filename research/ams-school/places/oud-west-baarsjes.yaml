  nl:
    title: Molenslootbrug (brug 359)
    summary: Brug 359, Piet Kramers tweelingbrug van de Machineslootbrug, voert de Jan Evertsenstraat
      en tram 13 over de Admiralengracht, tussen de poortwachters van Van der Mey.
    body: 'De Molenslootbrug verving in 1929-1930 een smalle noodbrug uit 1923, waarover sinds 1927 al
      trams naar het Mercatorplein reden. Piet Kramer ontwierp hem samen met zijn zusje in de Postjesweg.
      De naam verwijst naar de Molensloot, een oude naam voor een deel van de Admiralengracht. Buurtbewoners
      spraken ook van Brug Jan Eef en, na de dodelijke overval op juwelier Fred Hund in 2010, van de Hundbrug.
      Opvallend: het zebrapad ligt midden op de brug in plaats van bij de kades. Vanaf 2021 is de brug
      vernieuwd.


      Let op:

      - landhoofden van baksteen en graniet met steenbewerkingen, vermoedelijk van Hildo Krop

      - de doorlopende smeedijzeren balustrade die eindigt in zeeanemonen

      - het zicht vanaf de brug op de hoektorens van Van der Mey

      '
