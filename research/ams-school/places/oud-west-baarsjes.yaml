- title: Bethelkerk and Magalhaensplein
  summary: 'A "little town" around the Magalhaensplein: E.A.C. Roest''s 1929 Reformed church with a steep
    tent roof, plus a church hall, a police post and a school, all stepping up towards the roof turret.'
  body: 'The Bethelkerk was the Reformed (gereformeerd) counterpart of the Dutch Reformed Jeruzalemkerk
    and the Catholic Chassékerk. In 1926 the Reformed Church of Amsterdam-West asked for a site, and architect
    E.A.C. Roest built the church in 1928–1929. He combined it with his own church hall on the Cabotstraat
    (1925–1926). Together with Public Works, the plot grew into a whole complex: a police post with a
    GG&GD (municipal health service) office on the Magalhaensplein (1928) and a Christian pre-school on
    the Willem Schoutenstraat by J.H. van der Veen (1931–1933). The church is now used by the Maranatha
    evangelical congregation.


    The register calls the whole block a "klein stadje" (little town) or intimate hofje. Seen from the
    square, one-storey gabled buildings step up to the two-storey church hall with its mansard roof and
    finally to the church. The church has a steep tent roof and a 12-metre roof turret influenced by the
    Amsterdam School. The register compares its expressive form with the work of Michel de Klerk.


    Look for:

    - the tall tent roof and turret above the red-tiled roofscape

    - square dormers that cut through the gutter of the church roof

    - the symmetrical former health-centre front closing the Magalhaensplein

    - Van der Veen''s school with projecting steel-framed upper lights

    '
  category: religious
  lat: 52.367976
  lng: 4.85487
