  nl:
    title: Woningbouw Vespuccistraat (Roodenburgh)
    summary: 'Het complex van Jordanus Roodenburgh aan de Vespuccistraat: oranjerode baksteen in Noors
      verband, paraboolvormige portieken en banden siermetselwerk.'
    body: 'Langs de Vespuccistraat, tussen de Jan van Galenstraat en de Jan Mayenstraat, bouwde Jordanus
      Roodenburgh in 1924-1926 een woningbouwcomplex van vier blokken met etagewoningen en hoekwinkels.
      Roodenburgh had bij De Bazel gewerkt en wordt tot de Amsterdamse School gerekend. Het complex is
      zowel rijks- als gemeentelijk monument.


      De gevels van vier lagen zijn gemetseld in oranjerode baksteen in Noors verband op een trasraam
      van donkere klinkers, met natuursteen en siermetselwerk als versiering. De begane grond vormt met
      de zeszijdige, paraboolvormige portieken en de kleine diepliggende vensters één doorlopende zone.
      Op de bovenste verdieping verbinden horizontale lagen siermetselwerk de vensters, waarboven het
      metselwerk verticaal wordt. Tegenover de zijstraten springt de wand op in een hoger, vrijwel blind
      bouwdeel met een blinde trappenhuiserker.


      Let op:

      - de paraboolvormige portieken met uitkragende natuursteenblokken erboven

      - de hogere blinde bouwdelen tegenover Jan Mayenstraat en Shackletonstraat

      - de hoekwinkel met meerzijdige etalage aan de Jan van Galenstraat

      '
    attributes:
      original_use: Etagewoningen en winkels
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/527130
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/527132
