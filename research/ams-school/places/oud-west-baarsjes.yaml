  nl:
    title: Voormalige kleuterschool Overtoom 103-105
    summary: 'Een verscholen kleuterschool uit 1928 achter de Overtoom, door Theo Kint: een dorps ensemble
      van gebouwen met mansardedaken en een torentje op een binnenterrein.'
    body: 'Achter de straatwand van de Overtoom ligt een kleine enclave: de voormalige school voor voorbereidend
      onderwijs, in 1928 ontworpen door Theo Kint. Opdrachtgever was een vereniging voor de godsdienstige
      belangen van de bewoners van de buitenwijken. Het geheel omvatte een school met zes lokalen en twee
      speellokalen, een aparte dienstwoning en een overdekte speelplaats waar de kleuters in de zandbak
      speelden, nu ingenieus verbouwd tot kantoor. Samen vormden ze een kleinschalig en besloten kinderterrein.
      Tegenwoordig zit de reclassering er.


      Volgens het register zijn kenmerken van de Amsterdamse School goed benut voor het dorpse karakter
      van het ensemble. Het zware rode, afgeplatte mansardedak geeft de school iets van een landhuis;
      bij de vestibule staat een torenachtig bouwdeel van drie lagen onder een plat dak. Binnen zijn diverse
      oorspronkelijke elementen bewaard.


      Let op:

      - het torentje bij de vestibule tegenover de lage mansardedaken

      - de dienstwoning met eenzelfde mansardedak bij de steeg

      - de verbouwde overdekte speelplaats aan de noordkant

      '
    attributes:
      client: Vereeniging ter behartiging der Godsdienstige Belangen van de Bewoners van de Buitenwijken
        van Amsterdam
      original_use: Kleuterschool met dienstwoning
