  nl:
    title: Scholencomplex Cabotstraat
    summary: 'Drie evenwijdige scholen van Publieke Werken uit 1928, verbonden door een hoge, golvende
      schoolmuur: een ''school-eiland'' in de stijl van de late Amsterdamse School.'
    body: 'In 1928 legde de Dienst Publieke Werken hier volgens het strokenbouwprincipe drie schoolgebouwen
      naast elkaar, met speelplaatsen ertussen die door een hoge muur van de straat zijn afgeschermd.
      Van noord naar zuid: de Admiralengrachtschool en Columbusschool, een kleuterschool, en de dubbele
      Cabotschool en Vasco da Gamaschool. Het Rijk beschermt de drie scholen en de muur afzonderlijk,
      steeds als voorbeeld van de late Amsterdamse School.


      De scholen zijn langgerekte gangscholen van drie lagen onder rode pannendaken, met blokvormige,
      verspringende ingangsuitbouwen aan de kopse kanten, puntgevels met ruitvormige topvensters en reeksen
      kleine vierkante vensters. De muur is zelf architectuur: hij zwenkt kwartrond in naar de eindgevels
      en heeft deuren onder rollagen, een rondvenster en een halfronde vleugeldeur.


      Let op:

      - de hoge schoolmuur en zijn kwartronde inzwenkingen

      - golvende gemetselde balkons aan de kopgevels

      - puntgevels met ruitvormige topvensters

      '
    attributes:
      architect: Dienst Publieke Werken
      client: Gemeente Amsterdam
      original_use: Lagere scholen en kleuterschool
