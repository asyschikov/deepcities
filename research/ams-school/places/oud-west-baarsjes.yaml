- title: Hoofdweg housing by Wijdeveld
  summary: 'Hendrik Wijdeveld''s "city gate" on the Hoofdweg: two long housing blocks with continuous
    window bands and rounded corner bays, leading up to towers at the Jan van Galenstraat.'
  body: 'North of the Mercatorplein, Hendrik Wijdeveld – editor of the Amsterdam School magazine *Wendingen*
    – designed the street walls on both sides of the Hoofdweg as one composition (1925–1926). Following
    the Plan West method, the dwelling plans came from Gulden & Geldmaker and Wijdeveld designed the façades.
    The four-storey walk-up blocks are horizontal in feel: a continuous window band runs the length of
    each block, the top floor is treated differently from the lower floors, and at the ends the top floor
    cantilevers out into a round bay. Wijdeveld published the scheme in a 1927 *Wendingen* issue devoted
    to Plan West.


    Where the Hoofdweg meets the Jan van Galenstraat, the blocks rise into tower-like corner buildings
    that form a "stadspoort" (city gate) into the district. The northern half of this gate, with its former
    studio flats behind tall glazed fronts (Hoofdweg 405-411), lies just across the Jan van Galenstraat
    in Bos en Lommer and is a national monument (531143).


    Look for:

    - the unbroken horizontal window strips and the vertical brick bands that cut through them

    - rounded cantilevered bays at the block ends

    - hoist beams projecting just above the roofline

    - the paired towers at the Jan van Galenstraat crossing

    '
