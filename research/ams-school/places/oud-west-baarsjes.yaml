- title: Het Sieraad
  summary: The former Fourth Trade School on its kite-shaped island at the Postjesweg, by A.J. Westerman
    with sculpture by Hildo Krop – now an events venue with a Michelin-starred restaurant.
  body: 'Built for the Public Works department to a design by Arend Jan Westerman, this was the Vierde
    Ambachtsschool (Fourth Trade School) Ir. W. Maas Geesteranus. It stands on a five-sided plot almost
    surrounded by water: the Kostverlorenvaart, the Admiralengracht and the Postjeswetering. Classrooms
    ring an inner courtyard. From 1980 it housed the school for goldsmiths and watchmakers, later part
    of ROC Zadkine. After it closed in 2002 the building was restored (from 2005) and the courtyard got
    a glass roof. It now holds an events venue, education and theatre groups, and since 2021 restaurant
    Daalder.


    The concave front, richly built for its time, is the most decorative trade school of the Amsterdam
    School. Hildo Krop''s sculpture refers to the subjects taught (shipbuilding, electricity, wood and
    metalwork) and to the sea voyages of the admirals after whom the surrounding streets are named. A
    man and a woman flank the motto "zonder moeite niets" (nothing without effort).


    Look for:

    - Krop''s tufa sculptures around the main door and the wrought-iron grilles with wave motifs

    - half-round brick oriels on sculpted consoles above the side entrances

    - the long horizontal window bands and the extra storey of the former museum hall at the front

    '
