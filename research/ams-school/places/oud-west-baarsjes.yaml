- title: Hoofdweg housing by Piet Kramer
  summary: Piet Kramer's long housing walls between the Postjesweg and the Willem Schoutenstraat, with
    six-storey gate blocks and stairwell strips crowned by wavy brick pylons.
  body: 'Piet Kramer, co-author of the Scheepvaarthuis and the Spaarndammerbuurt housing, designed the
    blocks on both sides of the southern Hoofdweg in 1923; they were completed by 1925. They contain downstairs
    and upstairs flats for working-class tenants, with small corner shops. Giving both sides of a street
    to one architect was deliberate policy of the Plan West committee: the street was to read as a single
    avenue leading to the Mercatorplein. At the Postjesweg the blocks rise to six storeys and act as a
    gateway into the district, and at the bend by the Davisstraat the façades follow the kink of the road.


    Compared with his plastic Spaarndammerbuurt work, Kramer is more restrained here: long, flat walls
    with seemingly endless rows of windows. The sculptural energy is concentrated in the entrances and
    the stairwell strips. The block on the east side between the Postjesweg and the Davisstraat is in
    red brick and is more richly detailed than the grey-brown blocks.


    Look for:

    - four-at-a-time grouped doorways under shared canopies held up by sculpted brick piers with wooden
    ornaments

    - blind stairwell strips rising to the roof, where they end in pylon-like tops with wavy bands

    - the six-storey corner blocks at the Postjesweg crossing

    - concave and convex brickwork at the porch corners

    '
