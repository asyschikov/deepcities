  nl:
    title: Röntgengebouw Wilhelmina Gasthuis
    summary: Een hoekpaviljoen van het oude Wilhelmina Gasthuis uit 1925, gebouwd voor röntgenafdeling
      en collegezaal, met een paraboolvormig venster en een trappenhuisschacht boven de daklijst.
    body: 'Het Wilhelmina Gasthuis (WG) was het gemeentelijk ziekenhuis; de paviljoens zijn nu een woon-
      en werkgebied. In 1925 bouwde de Dienst Publieke Werken dit hoekgebouw overhoeks tegen het voormalige
      vrouwenpaviljoen, met een röntgenafdeling en een collegezaal. Het Rijk beschermt het als voorbeeld
      van een ziekenhuispaviljoen in de stijl van de Amsterdamse School.


      Het bakstenen gebouw heeft twee lagen aan de Eerste Helmersstraat en drie aan de kant van het WG-plein,
      onder een schuine lichtkap. Lateien, de overhoekse luifel en andere details zijn van hardsteen.
      Aan de straatzijde zit geen ingang.


      Let op:

      - het paraboolvormige venster met gebogen ijzeren roedenverdeling aan het WG-plein

      - het doorlopende lintvenster op de begane grond aan de straat

      - de verticale trappenhuisschacht die boven de gevellijst uitsteekt en met inzwenkend muurwerk aansluit
      op een halfronde gevel

      '
    attributes:
      architect: Dienst Publieke Werken
      client: Gemeente Amsterdam
      original_use: Röntgenafdeling en collegezaal van het ziekenhuis
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/524817
- title: Wilhelmina Gasthuis pathology laboratory
  summary: A. R. Hulshoff's cubic brick laboratory for the old municipal hospital, grouped around a tower-like
    stair hall and showing Frank Lloyd Wright's influence on late Amsterdam School.
  body: 'The former laboratory for pathological anatomy of the Wilhelmina Gasthuis was designed by A.R.
    Hulshoff, head of buildings at Public Works and one of the makers of Plan West. The national register
    dates the design to 1927; other sources date construction to about 1930. The register calls it "zakelijk-expressionistisch"
    (businesslike expressionist). Its strict brick volumes and strong horizontal and vertical lines show
    kinship with American architecture of the Frank Lloyd Wright period. Wikidata tags it as Amsterdam
    School.


    Cubic volumes of varying height step in and out around a central tower-like stair hall with the main
    entrance. The two wings meet the stair tower in a T, parallel to and at right angles to the Jacob
    van Lennepkanaal.


    Look for:

    - deep-set steel windows with fine glazing bars

    - stone cornices and geometric ornaments at the corners

    - the lower wing at the back with a hipped skylight roof and tall twenty-pane windows

    '
