- title: Bellamystraat housing by La Croix
  summary: 'A small 1919 corner block for the Rochdale housing association: the first commission given
    to an Amsterdam School architect by a social housing association.'
  body: 'Designed in 1917 by G.F. la Croix and built in 1919 for Bouwvereniging Rochdale, this corner
    block is modest in size but important in history. According to the city register, La Croix was the
    first Amsterdam School architect asked to design a complex under the Woningwet (Housing Act), years
    before the movement''s great social-housing commissions. It was also his first commission of any size,
    in a small oeuvre. At the time architects were pressing to separate themselves from builder-developers.
    The complex has three houses on the Bellamystraat, a corner house with a former shop and two houses
    on the Van Effenstraat, with four flats per house.


    The register singles out the treatment of the wall surface, typical of the Amsterdam School. The whole
    block reads as one volume rather than a row of separate houses, under a flat roof with steep slopes
    on the street sides.


    Look for:

    - the carefully worked corner, with lettering in the architecture

    - doors with ribbed vertical mouldings in Amsterdam School style

    - the triangular timber heads over the dormers

    '
