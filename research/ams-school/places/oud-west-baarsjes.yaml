  nl:
    title: Onderstation Eerste Helmersstraat 21
    summary: 'Een klein onderstation van het GEB uit 1923-1924 met een symmetrische torenpartij: zelfs
      een transformatorhuis kreeg van Publieke Werken Amsterdamse School-zorg.'
    body: 'Dit 10 kV-onderstation ontstond in twee fasen naar ontwerp van de Dienst Publieke Werken. Het
      eerste gebouw lag op een binnenterrein achter negentiende-eeuwse woningen; toen die tussen 1924
      en 1930 werden gesloopt, is het onderstation tot aan de straat uitgebreid. In de jaren twintig waren
      puntgevels in Amsterdamse Schoolstijl populair voor transformatorgebouwen; in de jaren dertig werd
      de vormgeving functionalistischer. Sinds 2007 heeft het gebouw een gemengde woon- en bedrijfsfunctie.


      Aan de straat staat een symmetrische torenpartij in een sobere Amsterdamse Schoolstijl; het bouwdeel
      uit 1924 erachter, met een dwarsgeplaatst rood pannendak, is expressionistischer. Betonnen randen
      markeren de platte daken en risalerend metselwerk benadrukt de verticale geleding.


      Let op:

      - de symmetrische torenpartij aan de Eerste Helmersstraat

      - blokvormige, sober expressionistische versieringen in graniet en beton rond de deur

      - hekwerken met geometrische vormen van metaalplaat

      '
    attributes:
      architect: Dienst Publieke Werken
