  nl:
    title: Bethelkerk en Magalhaensplein
    summary: 'Een ''klein stadje'' rond het Magalhaensplein: de gereformeerde Bethelkerk van E.A.C. Roest
      met hoog tentdak, plus wijkgebouw, politiepost en school die naar de daktoren oplopen.'
    body: 'De Bethelkerk is de gereformeerde tegenhanger van de hervormde Jeruzalemkerk en de katholieke
      Chassékerk. In 1926 vroeg de Gereformeerde Kerk van Amsterdam West een bouwterrein in erfpacht;
      architect E.A.C. Roest bouwde de kerk in 1928-1929 en verbond haar met zijn kerkelijk vergadercentrum
      aan de Cabotstraat (1925-1926). In overleg met Publieke Werken groeide het geheel uit tot een complex
      met een politiepost en een post van de GG en GD aan het Magalhaensplein (Publieke Werken, 1928)
      en een school aan de Willem Schoutenstraat van J.H. van der Veen (1931-1933). De kerk is nu in gebruik
      bij de volle evangelische gemeente Maranatha.


      Vanaf het plein lopen de bouwdelen trapsgewijs op, van één laag onder zadeldaken via het vergadercentrum
      met mansardekap naar de kerk met haar steile tentdak en twaalf meter hoge daktoren. Het register
      spreekt van een ''klein stadje'' of intiem hofje en noemt het ontwerp verwant aan het werk van Michel
      de Klerk.


      Let op:

      - het hoge tentdak en de door de Amsterdamse School beïnvloede daktoren

      - vierkante dakkapellen die de dakgoot doorsnijden

      - de symmetrische gevel van het voormalige GG en GD-gebouw aan het plein

      - de school van Van der Veen met uitkragende ijzeren bovenlichten

      '
    attributes:
      architect: E.A.C. Roest (kerk, vergadercentrum); Dienst Publieke Werken (politiepost); J.H. van
        der Veen (school)
      client: Gereformeerde Kerk Amsterdam-West
      original_use: Kerk, kerkelijk vergadercentrum, politiepost met GG en GD, school
