  nl:
    title: Jan Maijenschool
    summary: 'Een vierdubbel schoolgebouw van Publieke Werken uit 1926 tegenover de Jeruzalemkerk: golvend
      metselwerk, lange vensterstroken en gele hoekpartijen met halfronde hoeken.'
    body: 'Tegenover de Jeruzalemkerk staat het gebouw dat ooit vier lagere scholen huisvestte: de Vespucci-,
      Mercator-, Jan Evertsen- en Jan Maijenschool. J.W. Frantzen ontwierp het in 1926 voor de Dienst
      Publieke Werken; de aanbesteding in december 1925 kwam uit op 227.860 gulden. Gangen liggen aan
      de straatkant, lokalen aan het schoolplein. De scholen smolten samen en in 1994 sloot de laatste.
      Na restauratie kwamen er kleine wooneenheden op de verdieping; sinds 2011 zit beneden de Meesteropleiding
      Coupeur. Het voormalige schoolplein werd de buurttuin ''Tuin van Jan''.


      Het register spreekt van late Amsterdamse School: een plastische gevel met golvende onderdelen,
      gevarieerd siermetselwerk en lange vensterstroken. Een symmetrische middenpartij in roodgrauwe steen
      ligt tussen hoekpartijen van gele baksteen, waarvan de buitenste hoeken halfcilindervormig zijn
      uitgemetseld.


      Let op:

      - de dubbele entree onder een welvend portiekdak met golvende muurvlakken erboven

      - de halfronde hoeken van de gele hoekpartijen

      - de kantelen van de teruggelegen borstwering tussen beide hoekpartijen

      '
    attributes:
      architect: J.W. Frantzen (Dienst Publieke Werken)
      client: Gemeente Amsterdam
      original_use: Vier lagere scholen
    sources:
    - https://nl.wikipedia.org/wiki/Jan_Maijenstraat_11-17
