  nl:
    title: Het Sieraad
    summary: De voormalige Vierde Ambachtsschool op een vijfhoekig eiland aan de Postjesweg, door A.J.
      Westerman met beeldhouwwerk van Hildo Krop – nu evenementenlocatie met sterrenrestaurant.
    body: 'Arend Jan Westerman ontwierp dit gebouw in opdracht van de Dienst Publieke Werken voor de Vierde
      Ambachtsschool Ir. W. Maas Geesteranus. Het staat op een vlieger- of vijfhoekig perceel, grotendeels
      omgeven door Kostverlorenvaart, Admiralengracht en Postjeswetering. De lokalen liggen aan een omlopende
      gang rond een binnenplaats. Vanaf 1980 zat hier de Vakschool voor Edelsmeden en Uurwerktechniek,
      later onderdeel van ROC Zadkine. Na de sluiting in 2002 volgde vanaf 2005 restauratie, met een glazen
      kap boven de binnenplaats. Nu zijn er een evenementenlocatie, onderwijs, theater en sinds 2021 restaurant
      Daalder.


      Het register noemt het een ''rijk uitgevoerde'' Amsterdamse Schooltrant. Het beeldhouwwerk van Hildo
      Krop verwijst naar de vakken van de school (scheepsbouw, elektriciteit, hout- en metaalbewerking)
      en naar de zeereizen van de admiraals naar wie de omliggende straten heten. Een man- en vrouwfiguur
      dragen het stadswapen en de spreuk ''zonder moeite niets''.


      Let op:

      - Krops tufstenen beelden bij de hoofdingang en het smeedijzeren traliewerk met golfslagmotieven

      - halfronde gemetselde erkers op gebeeldhouwde consoles boven de zij-ingangen

      - de lange horizontale vensterseries en de extra bouwlaag van de vroegere museumzaal

      '
