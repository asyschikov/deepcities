  nl:
    title: Westerwijk
    summary: 'Het eerste gebouw van Ferdinand Jantzen (1925-1926): een kerkelijk wijkgebouw met bovenwoningen
      aan de Admiraal de Ruijterweg, aan de straat Amsterdamse School, in de tuin Frank Lloyd Wright.'
    body: 'Drie jaar vóór zijn Jeruzalemkerk ontwierp de jonge F.B. Jantzen dit wijk- of evangelisatiegebouw
      voor de Hervormde Gemeente Sloterdijk, gebouwd in 1925-1926 voor net geen 80.000 gulden. Het bevatte
      een recreatiezaal voor wijkvergaderingen, ruimten voor jeugdwerk en zondagsschool, een dokterskamer
      en een bibliotheek in de kelder, met woningen op de verdiepingen; Jantzen woonde zelf op nummer
      152. Achter het voorgebouw ligt, deels in de tuin verzonken, een gehoorzaal voor zo''n 350 mensen.
      Het gebouw wordt nog gebruikt door de christelijke woongroep Westerwijk en verhuurd aan onder meer
      de Voedselbank.


      Volgens het gemeentelijk register een goed voorbeeld van expressionistische vormgeving uit het interbellum:
      het voorgebouw is Amsterdamse School-achtig, de zaal in de tuin eerder beïnvloed door Frank Lloyd
      Wright. Binnen bleven kozijnen met Amsterdamse School-verdeling, kleurig glas-in-lood en een elektrische
      klok in de zaal bewaard.


      Let op:

      - de bruine bakstenen gevel met teruggezette middenpartij en hogere zijtraveeën met ingesnoerde
      erkers

      - de donkergrijze syenietpui die om de driedelige entree meandert

      - de naam ''Westerwijk'' in bronskleurige siersmeedletters

      '
    attributes:
      client: Hervormde Gemeente Sloterdijk
      original_use: Kerkelijk wijkgebouw met bovenwoningen
    sources:
    - https://nl.wikipedia.org/wiki/Westerwijk_(Amsterdam)
