  nl:
    title: Atlanta (Stadhouderskade 5-6)
    summary: 'Het kantoorgebouw Atlanta van F.A. Warners uit 1929 bij het Leidsebosje: een vroeg verhuurkantoor
      met betonskelet en lift, gedetailleerd in Amsterdamse Schoolstijl.'
    body: 'In de jaren twintig was het gespecialiseerde kantoorgebouw in Amsterdam nog nieuw; meestal
      werden grachtenhuizen tot kantoor verbouwd. Architect Frans Warners, sterk op Amerika georiënteerd,
      ontwierp Atlanta in 1929 als modern geoutilleerd verhuurkantoor met betonskelet en automatische
      lift, met een autobedrijf op de begane grond. Het register noemt het van belang voor de ontwikkeling
      van het moderne kantoorgebouw en beeldbepalend in de reeks grote gebouwen net buiten de oude vestinggracht.


      Het gebouw is ''geheel in de stijl van de Amsterdamse School gedetailleerd'': rode handvormsteen
      in staand verband met diepliggende voegen, en twee min of meer halfronde erkers die het gevelvlak
      omkaderen. De bovenlichten liggen iets vóór het gevelvlak en het onderste deel van de vensters juist
      erachter, een typisch Amsterdamse School-detail. Het bouwbeeldhouwwerk is van L.S.W. van der Noordaa.


      Let op:

      - de twee halfronde erkers aan de voorgevel

      - de robuuste, teruggelegen kapverdieping met verticale stroken siermetselwerk

      - het bouwbeeldhouwwerk van Van der Noordaa

      '
    attributes:
      original_use: Verhuurkantoren en autobedrijf
    sources:
    - https://data.amsterdam.nl/monumenten/1d93cfa2-3705-4f4e-8d6e-698ff1fa14e4
- title: AMVJ building
  summary: 'Foeke Kuipers'' 1928 high-rise for the AMVJ (the Amsterdam YMCA), with a swimming pool inside:
    American-style concrete frame, Amsterdam School brick and granite reliefs by Louis van der Noordaa.'
  body: 'The A.M.V.J. (Amsterdamsche Vereeniging tot Ondersteuning van Jongelieden, the Amsterdam YMCA)
    was a major force in youth work. Its central building was designed by Foeke Kuipers and completed
    in 1928, with a swimming pool, guest rooms and meeting spaces. Around 1940 it also housed the Hotel
    Centraal. The association left later, and the building is now entirely a hotel.


    At eight storeys on the Stadhouderskade and seven on the Vondelstraat, it was an early high-rise in
    central Amsterdam. The register describes it as "American style" with Amsterdam School influence:
    a concrete skeleton clad in massive brickwork with plastic elements and a curved, partly angled front
    on the Vondelstraat.


    Look for:

    - carved granite blocks with figurative reliefs between the first-floor windows, by Louis van der
    Noordaa

    - the main entrance against the north wall on the Stadhouderskade

    - the bent façade line along the Vondelstraat

    '
