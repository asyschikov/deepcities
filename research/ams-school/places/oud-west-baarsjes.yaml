- title: Jan Evertsenstraat housing by Van der Mey
  summary: 'Twin blocks by J.M. van der Mey that greet you as you cross the Admiralengracht: corner towers
    like gatekeepers and concrete-columned shop arcades along the Jan Evertsenstraat.'
  body: 'Joan van der Mey, architect of the Scheepvaarthuis, designed the two blocks where the Jan Evertsenstraat
    crosses the Admiralengracht (1926–1927). They are symmetrical "twin brothers" in red brick, with working-class
    flats over a shop gallery along the street. Seen from the Molenslootbrug, the higher corner blocks
    act as gatekeepers, and the four-storey walls along the water fan out from them like wings.


    This is the late, more businesslike phase of the Amsterdam School. The emphasis is on the exciting
    arrangement of fairly plain volumes: horizontal window strips under projecting lintels, set against
    vertical tower elements. Some of the old plasticity remains in rounded bay strips and in the towers,
    which look almost modelled in clay. The northern block was renovated with some loss of original materials
    and detail.


    Look for:

    - the stepped corner towers on both sides of the bridge

    - shop arcades with concrete columns along the Jan Evertsenstraat

    - the gateway into the Krommertstraat

    '
  category: housing
  lat: 52.371289
  lng: 4.85841
  address: Jan Evertsenstraat 9-44, Krommertstraat 1-5, Admiralengracht
  links:
