  nl:
    title: Pesthuysbrug (brug 181)
    summary: 'Brug 181 uit 1938 over het Jacob van Lennepkanaal: een sobere late brug van Publieke Werken
      uit de tijd van Piet Kramer, met baksteen en graniet maar zonder ornament.'
    body: 'Eerst lag hier een dubbele basculebrug uit 1892, want het Jacob van Lennepkanaal was een aanvoerroute
      voor de groentemarkt aan de Marnixstraat. Toen die markt in 1932 naar de Centrale Markthallen verhuisde,
      hoefde de brug niet meer open; wel was er een brede verbinding tussen Oud-West en Oud-Zuid nodig.
      Het ontwerp van de vaste brug uit 1938 kwam van Publieke Werken, waar Piet Kramer toen ''een grote
      vinger in de pap had''. Tram 3 rijdt eroverheen.


      Vergeleken met Kramers andere bruggen is deze zeer sober: wel de wisseling van baksteen en natuursteen,
      maar geen brughuisjes, beeldhouwwerk of siersmeedijzeren balustrades. De naam herinnert aan het
      Pesthuis dat ooit op het latere terrein van het Wilhelmina Gasthuis stond.


      Let op:

      - het in graniet uitgebeitelde jaartal van oplevering

      - de landhoofden van baksteen en graniet langs de Jacob van Lennepkade

      '
    attributes:
      architect: Dienst Publieke Werken (Piet Kramer)
      client: Gemeente Amsterdam
      original_use: Verkeers- en trambrug
    sources:
    - https://nl.wikipedia.org/wiki/Pesthuysbrug
- title: Overtoom 103-105 nursery school
  summary: 'A hidden 1928 nursery school behind the Overtoom by Theo Kint: a village-like enclave of mansard-roofed
    buildings and a little tower, built for the children of the outer districts.'
  body: 'Behind the street front of the Overtoom lies a small enclave of buildings that formed a former
    school for Voorbereidend Onderwijs (nursery education), designed in 1928 by Theo Kint. It was built
    for a Protestant association for the religious interests of the residents of the outer districts.
    The complex has a school with six classrooms and two playrooms, a separate caretaker''s house and
    a covered playground, where the toddlers once had their sandpit; it is now an office. Together they
    made a small, closed world for young children. The building is now used by the probation service.


    The register points to Amsterdam School features used to give the ensemble a village-like character.
    A heavy red-tiled mansard roof makes the school look like a country house, and a three-storey tower
    with a flat roof marks the entrance hall. The interior keeps several original elements.


    Look for:

    - the tower by the vestibule, contrasting with the low mansard roofs

    - the matching mansard-roofed caretaker''s house by the alley

    - the converted covered playground on the north side

    '
  category: schools
