- title: De Klimop (Admiralengracht 301)
  summary: A child-sized Public Works nursery school of 1928–1930 whose low half-round wing hugs its playground
    beside the Admiralengracht.
  body: 'This school for Voorbereidend Onderwijs (pre-school education) was designed by the Public Works
    department and built in 1928–1930. From 1935 until the 1980s it was the Klimop nursery school. In
    1994 it was redeveloped as a day-care centre for babies and toddlers, keeping the main layout. The
    register praises it as a successful example of Public Works Amsterdam School architecture of the 1930s.
    It dates from the time when the city first took on the building of good schools for young children
    as well.


    The design is a play of three volumes under red pitched roofs of different heights, in red brick with
    stone corner blocks. A low, half-round wing in purple-blue brick wraps around the playground and creates
    a sheltered little world for the children. The volumes show the inside: playrooms under a cross gable
    at the west end, then the classrooms, and a two-storey stair wing at the east end.


    Look for:

    - the curved low wing with a window band under the eaves, embracing the playground

    - classroom windows divided into rows of uneven panes, with a strip of narrow panes in between

    - French doors with a small balcony marking the head teacher''s room

    '
  category: schools
