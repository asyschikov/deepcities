  nl:
    title: Hoofdkantoor Gemeentetram (Stadhouderskade 1)
    summary: 'Het kantoor van de Gemeentetram uit 1922-1923, rijzend uit de Singelgracht: P.L. Marnettes
      Amsterdamse School-paleis met bouwbeeldhouwwerk van Hildo Krop.'
    body: 'P.L. Marnette van de Dienst Publieke Werken ontwierp dit symmetrische kantoorgebouw voor de
      Gemeentetram, gebouwd in 1922-1923. Het is het enige gebouw aan dit deel van de Stadhouderskade
      dat direct aan het water ligt; de achtergevel rijst met een kelderverdieping recht uit de Singelgracht
      op. Aan de westkant lag een speciaal spoor waar conducteurs veilig hun ontvangsten konden afdragen.
      De Gemeentetram vertrok in 1983, de Stadsreiniging bleef tot 1990; daarna werd het een particulier
      kantoorgebouw.


      De U-vormige plattegrond bestaat uit een middenblok tussen twee hoekpaviljoens onder platte daken,
      alle door Hildo Krop van beeldhouwwerk voorzien. De onderste drie lagen hebben identieke vensters
      met lisenen ertussen en figuratieve bouwkeramiek op de muurdammen. De bovenste laag is grotendeels
      blind, in ruitmotief gemetseld, met een getande gevelbeëindiging. Ten noordwesten staat een eveneens
      beschermd bijgebouw met portiersloge en transformatorhuisje.


      Let op:

      - Krops bouwkeramiek op de muurdammen en het grote ornament boven de ingang

      - het zich verjongende portiek met lantaarns in Amsterdamse Schoolstijl

      - de achtergevel, gezien vanaf de overkant van de Singelgracht

      '
    attributes:
      architect: P.L. Marnette (Dienst Publieke Werken)
      original_use: Hoofdkantoor Gemeentetram
