  nl:
    title: A.M.V.J.-gebouw
    summary: 'Foeke Kuipers'' hoogbouw uit 1928 voor de A.M.V.J., met zwembad: een betonskelet in ''American
      Style'', bekleed met baksteen in Amsterdamse School-geest en granieten reliëfs van Louis van der
      Noordaa.'
    body: 'De Amsterdamse architect Foeke Kuipers bouwde dit centrale verenigingsgebouw van de A.M.V.J.,
      dat in 1928 gereed kwam, met onder meer een zwembad, logeer- en ontmoetingsruimtes. Rond 1940 zat
      er ook Hotel Centraal in. De jongerenvereniging, die een grote rol speelde in het Amsterdamse jeugdwerk,
      vertrok later; nu is het gebouw geheel hotel.


      Met acht bouwlagen aan de Stadhouderskade en zeven aan de Vondelstraat was het een vroeg voorbeeld
      van hoogbouw in de binnenstad. Het register spreekt van een gebouw in ''American Style'' met invloed
      van de Amsterdamse School: een betonskelet met massieve bakstenen gevels, plastische elementen en
      een gerende, deels geknikte gevel aan de Vondelstraat.


      Let op:

      - de gebeeldhouwde granieten dekblokken met figuratieve reliëfs van Louis van der Noordaa langs
      de eerste bouwlaag

      - de hoofdingang tegen de noordelijke bouwmuur aan de Stadhouderskade

      - de geknikte gevellijn langs de Vondelstraat

      '
    attributes:
      original_use: Verenigingsgebouw met zwembad en logies
    sources:
    - https://data.amsterdam.nl/monumenten/581b09e1-6fd2-499f-8ae7-2ee0a198bc4f
