  nl:
    title: Plan West
    summary: 'Het uitbreidingsplan uit 1922 voor de Baarsjes: zesduizend arbeiderswoningen rond de Hoofdweg
      en het Mercatorplein, met straatwanden die bekende architecten in Amsterdamse Schooltrant mochten
      ontwerpen.'
    body: 'Na de annexatie van Sloten in 1921 nam Amsterdam de oude Slotense uitbreidingsplannen (1909,
      verbeterd in 1916) onder de loep. Een ''Commissie van Drie'' – de architecten Jan Gratama en Gerrit
      Versteeg en A.R. Hulshoff, hoofd van de afdeling Gebouwen van Publieke Werken – presenteerde in
      juni 1922 Plan West, ook wel het 6000-woningenplan. Het oude slotenpatroon bleef gehandhaafd, de
      Hoofdweg werd de centrale as en het Mercatorplein het stedenbouwkundige middelpunt. Net als in Berlages
      Plan Zuid ging men uit van een ''einheitliches Blockfront'': lange, samenhangende gevelwanden met
      hoogteaccenten op de hoeken.


      De bouw verliep opvallend snel, grotendeels tussen 1925 en 1927, met aannemer H. van der Schaar
      als hoofduitvoerder. De plattegronden lagen al vast (bureau Gulden & Geldmaker); architecten als
      Berlage, Kramer, Wijdeveld, Staal, Van der Mey, Rutgers en Roodenburgh mochten alleen de gevels
      ontwerpen. Onder vakgenoten heette dat spottend ''schortjesarchitectuur''. Een schoonheidscommissie
      keurde het geheel. In het noorden kregen de straten namen van ontdekkingsreizigers en cartografen,
      in het zuiden van plaatsen in West-Indië.


      Let op:

      - de Hoofdweg als toegangslaan, met aan weerszijden blokken van dezelfde architect

      - poortgebouwen en torens bij de Postjesweg, het Mercatorplein en de Jan van Galenstraat

      - scholen en kerken die in het blokkenpatroon zijn ingevoegd

      '
    attributes:
      architect: Jan Gratama, Gerrit Versteeg, A.R. Hulshoff (plan); gevels door Berlage, Kramer, Wijdeveld,
        Staal, Van der Mey, Rutgers, Roodenburgh e.a.
      original_use: Uitbreidingsplan (arbeiderswoningen)
    sources:
