  nl:
    title: Jeruzalemkerk
    summary: Ferdinand Jantzens hervormde kerk uit 1929, vastgebouwd aan woningen en tot in de maatverhoudingen
      doordrenkt van symboliek, met glas-in-loodramen over de zeven scheppingsdagen.
    body: 'De Nederlands Hervormde gemeente van Sloterdijk liet deze kerk in 1928-1929 bouwen in het nieuwe
      Plan West. Eerst zou ze Nieuwe Westerkerk heten; de naam Jeruzalemkerk kwam van de inzamelingsactie
      ''Stad zonder Tempel''. Architect F.B. Jantzen werkte in de stijl van de verstrakte Amsterdamse
      School met invloeden van Frank Lloyd Wright. Hij bouwde de kerk bewust vast aan zeven etagewoningen
      en een consistorie: God wil bij de mensen wonen. In 1929 werd de kerk in gebruik genomen; nu is
      ze een wijkgemeente van de PKN.


      De bouwvolumes, terrassen en liturgische opstelling verwijzen naar de tempelbouw; maten en verhoudingen
      volgen getallenschema''s, en ook steensoorten, lampen en betimmeringen hebben symbolische betekenis.
      De kerk is noord-zuid gericht en streng symmetrisch. Jantzen ontwierp zelf de glas-in-loodramen
      met de zeven scheppingsdagen. Het drieklaviers orgel bouwde Furtwängler & Hammer in 1930.


      Let op:

      - drie gelijke toegangen in een sokkel van paarse klinkers, met de naam JERUZALEMKERK in metalen
      letters

      - drie hoge, smalle vensters onder een korte, gedrongen klokkentoren

      - oranjerode en donkerbruine baksteen met Beiers graniet

      - het hek op gemetselde voet rond de kerk

      '
    attributes:
      client: Nederlands Hervormde Gemeente Sloterdijk
      artists: F.B. Jantzen (glas-in-lood); orgel door Furtwängler & Hammer
      original_use: Kerk met etagewoningen en consistorie
