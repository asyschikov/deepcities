- title: Jeruzalemkerk
  summary: Ferdinand Jantzen's Reformed church of 1929, built into the housing around it and composed
    with number symbolism and stained glass of the seven days of Creation.
  body: 'The Dutch Reformed congregation of Sloterdijk commissioned this church for the new Plan West
    district. It was first to be called the Nieuwe Westerkerk, but the name Jeruzalemkerk came from the
    fundraising campaign "Stad zonder Tempel" (city without a temple). Ferdinand Jantzen designed it in
    1928–1929 in the sober "verstrakte" Amsterdam School with clear influences from Frank Lloyd Wright.
    He chose to attach the church to seven flats and a consistory on its corners, expressing the idea
    that God lives among people.


    Everything is symbolic: the stepped cubic volumes and terraces refer to temple architecture, and the
    dimensions follow numerical schemes. The stone colours, lamps, woodwork and railings carry meanings
    too. The church faces north–south across a small square, opposite the Jan Maijenschool, and is strictly
    symmetrical. Inside, Jantzen''s own stained-glass windows show the seven days of Creation. The three-manual
    organ was built in 1930 by Furtwängler & Hammer. It is still a Protestant (PKN) church.


    Look for:

    - three identical doors in a base of purple clinker, with the name JERUZALEMKERK in metal letters

    - three tall, narrow triple windows under a short, stocky bell tower

    - orange-red and dark-brown brick with Bavarian granite accents

    - the brick-footed fence enclosing the church on three sides

    '
  category: religious
  lat: 52.371359
  lng: 4.851992
  address: Jan Maijenstraat 14, Torresstraat 2-4, James Cookstraat 1-3
  links:
