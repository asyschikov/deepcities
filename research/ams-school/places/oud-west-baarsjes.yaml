    - Gemeentelijk monumentenregister 200725 (stedenbouwkundige context Plan-West)
- title: Mercatorplein
  summary: 'Berlage''s square at the heart of Plan West: four matching brick walls, two gateway towers
    and arcades of shops, rebuilt to his design in the 1990s.'
  body: 'The Mercatorplein was named in 1924 after the cartographer Gerardus Mercator and was meant as
    the centrepiece of Plan West. H.P. Berlage designed the layout and all four walls of the square (1925–1927),
    although he was only responsible for the façades, not the dwellings behind them. He worked in his
    own late, sober manner combined with Amsterdam School brickwork and wrought-iron balcony ornament.
    The north and south walls are in red brick and the east and west walls largely in yellow-brown brick,
    all on a base of dark granite. The Hoofdweg crosses the square with a "bayonet" shift, and the Mercatorstraat
    and Van Spilbergenstraat enter through gateway buildings.


    Berlage planned three towers; only two were built. By the 1980s the area was run down. The north tower
    had already been demolished in 1961, and from 1995 the northern wall was demolished and rebuilt to
    the original design, tower included. The square reopened in 1998 (with Queen Beatrix present) with
    a paving map in Mercator projection, and it was redesigned again in 2008–2010. The first self-service
    supermarket in Amsterdam opened here in 1948, in a shop that grew into the Dirk van den Broek chain.


    Look for:

    - the tall south-west tower above the gateway into the Van Spilbergenstraat, and its rebuilt twin
    on the north side

    - heavy brick piers carrying the shop arcades, with meander bands and figurative 1920s sculpture on
    the corners (credited to Anton Rädecker, Johan Polet, Theo Vos, Adrianus Remiëns and Jan Havermans,
    including portraits of Mercator and Blaeu)

    - the colour change between the red north and south walls and the yellow-brown east and west walls

    '
