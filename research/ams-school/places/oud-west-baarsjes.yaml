  nl:
    title: Woningbouw Jan Evertsenstraat (J.F. Staal)
    summary: 'Staals winkelstraat in Plan West: zes lange bouwblokdelen langs de Jan Evertsenstraat met
      doorlopende luifels, glazen bouwstenen en cilindervormige hoekdammen.'
    body: 'Jan Frederik Staal ontwierp in 1925-1926 beide wanden van de Jan Evertsenstraat tussen Admiralengracht
      en Mercatorplein, een van de hoofdassen van Plan West. Het rijksmonument bestaat uit zes complexonderdelen
      met samen enkele honderden etagewoningen en ruim tachtig winkels, volgens het register gebouwd ''in
      de stijl van de verstrakte Amsterdamse School''. De twee blokken aan de oostkant vormen samen de
      visuele entree van de straat; een poortgebouw over de Hudsonstraat verbindt twee andere blokken.
      De gemeente beschermt delen ervan al sinds 1992.


      De vijflaagse gevels in Noors verband krijgen ritme door uitgemetselde muurdammen met betonnen koppen,
      met kleine balkons of uitgebouwde, deels overhoekse vensters. Boven de winkels loopt een vlakke
      betonnen luifel met daarboven een strook glazen bouwstenen. De bovenste laag is grotendeels blind.


      Let op:

      - het poortgebouw over de Hudsonstraat met hoge middendoorgang

      - de cilindrisch uitgemetselde hoekdam bij de Vespuccistraat

      - stroken glazen bouwstenen boven de winkelluifels

      - deuren met huisnummers in Amsterdamse Schoolletters

      '
    attributes:
      original_use: Etagewoningen en winkels
    sources:
