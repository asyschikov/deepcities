  nl:
    title: Woningbouw Bellamystraat (La Croix)
    summary: 'Een klein hoekcomplex uit 1919 voor bouwvereniging Rochdale: volgens het register de eerste
      woningwetopdracht voor een architect van de Amsterdamse School.'
    body: 'G.F. la Croix ontwierp dit complex in 1917 voor Bouwvereniging Rochdale; het werd in 1919 gebouwd.
      Het is bescheiden van omvang, maar volgens het gemeentelijk register was La Croix de eerste Amsterdamse
      Schoolarchitect die werd gevraagd een woningwetcomplex te ontwerpen. Het was tevens zijn eerste
      opdracht van enige omvang in een beperkt oeuvre. Architecten wilden zich in die jaren nadrukkelijk
      onderscheiden van de aannemer-timmerlieden. Het complex bestaat uit drie huizen aan de Bellamystraat,
      een hoekhuis met voormalige winkel en twee huizen aan de Van Effenstraat, met vier woningen per
      huis.


      Kenmerkend is de muurvlakbehandeling, ''typisch voor de Amsterdamse Schoolbouwtrant'': het complex
      lijkt één volume in plaats van een rij losse huizen, onder een plat dak met steile dakschilden aan
      de straatkanten.


      Let op:

      - de zorgvuldig uitgewerkte hoekpartij met belettering

      - deuren met geribbelde verticale sierlijsten in Amsterdamse Schoolstijl

      - de driehoekige aftimmering boven de dakkapellen

      '
    attributes:
      client: Bouwvereniging Rochdale
      original_use: Woningwetwoningen en hoekwinkel
    sources:
    - https://data.amsterdam.nl/monumenten/fd5e11aa-af70-43d9-9306-ce26385945cc
- title: Zocherstraat HBS
  summary: 'A 1916 Public Works secondary school by the Vondelpark with some of Hildo Krop''s earliest
    building sculpture: Egyptian-inspired eagles and a serpent biting its tail.'
  body: 'This three-year HBS (secondary school) with a caretaker''s house was officially designed in 1916
    by the Public Works department. Architect A.A. Kok, a colleague, attributed it to G.J. Rutgers. It
    had 16 classrooms, including science, geography and drawing rooms, and a gym wing. The classrooms
    face south towards the park.


    Its special value lies in the sculpture by Hildo Krop, made around 1917 at the very start of his career
    as the city''s unofficial sculptor, when Hulshoff had just begun giving him commissions. According
    to the register it was one of the first Amsterdam school buildings enriched with art of such quality.
    The art was meant to have a moral and educational effect on the pupils. The motifs are mysterious
    and strongly influenced by Egyptian art: a circular serpent biting its own tail and eagles as ancient
    symbols of power. Inside, Krop carved the newel posts of the stairs into exotic animals, and there
    is a leaded-glass "stepped" pattern.


    Look for:

    - Krop''s sculptures on the park side of the Zocherstraat, among the largest he made for any school

    - the narrow entrance façade cut into the corner of the C-shaped plan

    - the low gym wing with a hipped roof

    '
