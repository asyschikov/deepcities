  nl:
    title: Woongebouwen Hoofdweg (Wijdeveld)
    summary: 'Wijdevelds ''stadspoort'' aan de Hoofdweg: twee lange portiekblokken met doorlopende vensterstroken
      en ronde erkers, die bij de Jan van Galenstraat uitlopen in torens.'
    body: 'Ten noorden van het Mercatorplein ontwierp H.Th. Wijdeveld, de man achter het tijdschrift Wendingen,
      beide straatwanden van de Hoofdweg als één compositie (1925-1926). Volgens de werkwijze van Plan
      West kwamen de plattegronden van Gulden & Geldmaker; Wijdeveld tekende de gevels. Het zijn twee
      woongebouwen met portiekwoningen over vier lagen. Een doorlopende vensterstrook loopt over de volle
      lengte, de bovenste laag wijkt af van de verdiepingen eronder en aan de uiteinden kraagt de bovenverdieping
      uit met een ronde erker. De gemeente wees de blokken in 1992 aan als gemeentelijk monument.


      Bij de kruising met de Jan van Galenstraat lopen de blokken op tot torenachtige hoekgebouwen, de
      zogeheten ''stadspoort'' van Wijdeveld. Het noordelijke deel daarvan, Hoofdweg 405-411 met oorspronkelijk
      atelierwoningen achter een meerruits glasgevel, ligt al in Bos en Lommer en is rijksmonument.


      Let op:

      - de ononderbroken horizontale vensterstroken en de uitstekende verticale banden in het metselwerk

      - de uitkragende ronde erkers aan de blokeinden

      - hijsbalken die net boven de dakrand uitsteken

      '
