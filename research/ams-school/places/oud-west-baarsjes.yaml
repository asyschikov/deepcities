- title: Traffic police station (Overtoom)
  summary: 'Amsterdam''s 1924 traffic police station by P.L. Marnette: a concave-convex front with curving
    window bands and a round sergeant''s lodge – the city''s first traffic lights were reportedly run
    from here.'
  body: 'Designed in 1923 by P.L. Marnette of Public Works and opened on 1 October 1924, this was the
    "Politiebureau voor het Verkeerswezen aan den Overtoom". It housed motorcycle and bicycle police,
    vehicle inspection and a lorry weighbridge, and stabled police horses at the back. Amsterdam''s first
    traffic lights were reportedly operated from here around 1932, a reminder of how fast motor traffic
    grew in the 1920s. In a 1994–1995 conversion everything except the street front and adjoining parts
    was lost. Today there is a gym on the ground floor and flats above.


    The front is a lively piece of Amsterdam School. Between garage doors and the main entrance sits a
    flattened round lodge for the duty sergeant. Above it the façade swings back, forward and back again
    in concave and convex curves, followed by two bands of ten coupled windows each. At the top a nearly
    blind wall ends in a toothed frieze with pointed corners.


    Look for:

    - the round sergeant''s lodge in the middle of the stone-clad ground floor

    - heavy double doors with expressive ironwork and oval windows

    - small windows for working the flagpoles, with three-part flagpole holders

    '
  category: public-works
