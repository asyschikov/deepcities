  nl:
    title: Politiebureau Verkeerswezen (Overtoom)
    summary: 'Het verkeerspolitiebureau van P.L. Marnette uit 1924: een concaaf-convexe gevel met golvende
      vensterstroken en een ronde brigadiersloge; vanhier zouden de eerste verkeerslichten zijn bediend.'
    body: 'Het ''Politiebureau voor het Verkeerswezen aan den Overtoom'' werd in 1923 ontworpen door P.L.
      Marnette van Publieke Werken en op 1 oktober 1924 geopend. Er zaten motor- en fietspolitie, de keuring
      van motorrijtuigen en een weegbrug voor vrachtwagens; achterin waren stallen voor politiepaarden.
      Rond 1932 zouden vanhier de eerste verkeerslichten van Amsterdam zijn bediend. Bij de verbouwing
      van 1994-1995 verdween alles behalve de voorgevel en aansluitende delen; nu zit er een sportschool
      met woningen erboven.


      Het register spreekt van Amsterdamse Schoolstijl. Tussen garagedeuren en hoofdingang ligt een afgeplatte,
      ronde uitbouw: de loge van de brigadier. Daarboven zwenkt de gevel terug, naar voren en weer concaaf
      naar het midden, met twee stroken van tien gekoppelde vensters. Bovenin een vrijwel blinde muur
      met een getand fries met gepunte hoekaccenten.


      Let op:

      - de ronde brigadiersloge in de natuurstenen plint

      - zware dubbele deuren met expressief beslag en ovale vensters

      - kleine raampjes voor het bedienen van de vlaggenmasten, met driedelige vlaggenmasthouders

      '
    attributes:
      architect: P.L. Marnette (Dienst Publieke Werken)
      client: Gemeente Amsterdam
      original_use: Politiebureau voor het verkeerswezen
    sources:
    - https://nl.wikipedia.org/wiki/Overtoom_39-41_(Amsterdam)
