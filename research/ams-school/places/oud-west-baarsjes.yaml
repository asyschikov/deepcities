- title: Jan Maijenschool
  summary: 'A quadruple Public Works school of 1926 by J.W. Frantzen, facing the Jeruzalemkerk: wavy brick
    walls, long window bands and yellow corner pavilions with half-round towers.'
  body: 'Across the little square from the Jeruzalemkerk stands a single building that once held four
    elementary schools: the Vespucci-, Mercator-, Jan Evertsen- and Jan Maijenschool. J.W. Frantzen of
    the Public Works department designed it in 1926, tendered in December 1925 for 227,860 guilders. Like
    many Public Works schools it has corridors along the street and classrooms facing the playground at
    the back. The schools gradually merged and closed in 1994. After restoration the upper classrooms
    became small flats, and since 2011 the ground floor has housed a training school for theatre and fashion
    tailoring. The former playground is now a community quiet garden, the Tuin van Jan.


    The façade is a showpiece of the late Amsterdam School. A long, symmetrical front of red-grey brick
    is held between yellow-brick corner pavilions. Their outer corners are rounded into half-cylinders,
    and the waves of the brickwork carry on into the window frames.


    Look for:

    - the double entrance under a curved porch roof, with undulating brick panels above it

    - half-cylindrical corners of the yellow-brick end pavilions

    - crenellated parapet linking the two pavilions

    '
  category: schools
  lat: 52.370949
  lng: 4.852294
  address: Jan Maijenstraat 11-17
  links:
