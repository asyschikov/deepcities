  nl:
    title: Mercatorplein
    summary: 'Berlages plein in het hart van Plan West: vier op elkaar afgestemde pleinwanden, twee torens
      op poortgebouwen en winkelgalerijen, in de jaren negentig deels naar het oorspronkelijke ontwerp
      herbouwd.'
    body: 'Het plein kreeg in 1924 de naam van cartograaf Gerardus Mercator en werd het middelpunt van
      Plan West. H.P. Berlage ontwierp de aanleg en de vier gevelwanden (1925-1927); de woningen erachter
      waren niet van zijn hand. Hij combineerde zijn late, sobere stijl met metselverbanden en smeedijzeren
      balkonornamenten uit de Amsterdamse School. De noord- en zuidwand zijn van rode baksteen, de oost-
      en westwand grotendeels van geelbruine steen, alles op een plint van zwart-grijs graniet. Het Rijk
      beschermt de pleinwanden als onderdeel van ''het complex Mercatorplein''.


      Berlage dacht aan drie torens; de toren in de westwand is nooit gebouwd. De noordelijke toren werd
      in 1961 als bouwvallig gesloopt. Na jaren van verval werd vanaf 1995 de noordwand in zijn geheel
      afgebroken en zoveel mogelijk in de oude vorm herbouwd, toren inbegrepen. Koningin Beatrix opende
      het vernieuwde plein in 1998; in 2008-2010 volgde een nieuwe herinrichting. Aan het plein opende
      in 1948 de eerste zelfbedieningswinkel van Amsterdam, voorloper van Dirk van den Broek.


      Let op:

      - de hoge toren boven het poortgebouw naar de Van Spilbergenstraat en zijn herbouwde tegenhanger
      in het noorden

      - galerijen met zware gemetselde pijlers en meanders en figuratief bouwbeeldhouwwerk op de hoeken

      - het kleurverschil tussen de rode en de geelbruine pleinwanden

      '
    attributes:
      built: 1925–1927 (noordwand herbouwd 1995–1998)
      original_use: Arbeiderswoningen en winkels
