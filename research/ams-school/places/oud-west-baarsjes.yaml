- title: Molenslootbrug
  summary: Bridge 359, Piet Kramer's twin of the Machineslootbrug, carrying the Jan Evertsenstraat and
    tram 13 over the Admiralengracht between Van der Mey's gatekeeper blocks.
  body: 'Built in 1929–1930 to replace a narrow 1923 emergency bridge, the Molenslootbrug was designed
    by Piet Kramer together with its sister in the Postjesweg. It carries the Jan Evertsenstraat, one
    of the main axes of Plan West, over the Admiralengracht, which used to be called the Molensloot. Van
    der Mey''s twin housing blocks frame its western end. Unusually for Amsterdam, the zebra crossing
    runs across the middle of the bridge rather than at the quays. Locals called it Brug Jan Eef or, after
    a jeweller killed in a 2010 robbery, the Hundbrug. The bridge was renewed from 2021.


    Look for:

    - brick and granite abutments with carved stone details (probably by Hildo Krop)

    - the continuous wrought-iron balustrade ending in sea-anemone forms

    - the view of Van der Mey''s corner towers from the bridge deck

    '
