- title: Hoofdweg housing by G.J. Rutgers
  summary: 'Gerrit Jan Rutgers'' blocks on the Hoofdweg leading to the Mercatorplein: long window bands,
    white-painted piers on the top floor and rounded corner towers at the Willem Schoutenstraat.'
  body: 'Between the Willem Schoutenstraat and the Mercatorplein the Hoofdweg is lined by two blocks designed
    by G.J. Rutgers and built in 1924–1925 by the building company N.V. Bouwmij. "De Berk". Earlier designs
    had been made by Gulden & Geldmaker, but Rutgers delivered the final façades. Like Kramer just to
    the south, Rutgers – one of the most productive housing architects of the Amsterdam School – "translated"
    the style into calm, flat street walls of working-class flats with corner shops.


    The horizontal lines push the eye towards the Mercatorplein. They are reinforced by white-painted
    piers between the windows of the top floor, which reads almost as a mezzanine. Every third porch has
    a bay window above it, rounded in the corners, with modest ornamental brickwork and decorative balls
    on the balconies. At the Willem Schoutenstraat the two blocks form a symmetrical gateway with rounded
    corners, towers and stepped-back upper floors.


    Look for:

    - the corner towers and curved shopfronts at the Willem Schoutenstraat

    - bay windows with quarter-round hollows where they meet the wall

    - porches with granito floors and small touches of ornamental brickwork

    '
