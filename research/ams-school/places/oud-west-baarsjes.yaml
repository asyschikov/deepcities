- title: Cabralschool
  summary: A double school of 1924 that bridges two streets with blind brick end walls and twin towers
    – the register calls its open-ended placement in the block unique in Amsterdam.
  body: 'Designed by the Public Works department in 1924, this double corridor school (completed around
    1926) was set across a block so that it links the Cabralstraat and the Marco Polostraat; each school
    had its own entrance at one end. They shared a gym, and the two halves were separated by fire doors.
    The city register calls this way of opening up the ends of a housing block unique in Amsterdam. Later
    it was sold to a Catholic parish and divided into several schools. After years of vacancy and squatting
    it was renovated from 2013 and now houses a creative business centre called MidWest.


    The building is strikingly closed: large expanses of brick with almost blind end walls. The style
    mixes Amsterdam School and cubist elements. Red brick for the base and door surrounds contrasts with
    yellow brick above.


    Look for:

    - the two tall rectangular towers at the west end, landmarks for the neighbourhood

    - ladder windows above the doors, flanked by bulging brick panels

    - small wavy, convex and concave piers on the corners of the south façade

    - the original door on the Marco Polostraat side

    '
