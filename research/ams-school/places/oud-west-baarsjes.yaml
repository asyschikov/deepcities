  nl:
    title: Pathologisch-anatomisch laboratorium WG
    summary: 'Hulshoffs kubische laboratorium voor het Wilhelmina Gasthuis, gegroepeerd rond een torenachtig
      trappenhuis: zakelijk expressionisme met verwantschap aan Frank Lloyd Wright.'
    body: 'Het voormalige laboratorium voor pathologische anatomie van het Wilhelmina Gasthuis is ontworpen
      door A.R. Hulshoff van de Dienst Publieke Werken, een van de makers van Plan West. Het rijksregister
      dateert het ontwerp in 1927 en noemt het ''zakelijk-expressionistisch''; andere bronnen geven circa
      1930 als bouwjaar. De strakke bakstenen wanden met sterke horizontale en verticale belijning tonen
      verwantschap met Amerikaanse architectuur uit de periode van Frank Lloyd Wright.


      In hoogte variërende, in- en uitspringende kubische bouwvolumes liggen rond een centraal, torenachtig
      trappenhuis met de hoofdentree. Twee vleugels sluiten T-vormig op het trappenhuis aan, deels evenwijdig
      aan het Jacob van Lennepkanaal.


      Let op:

      - verdiepte stalen vensters met fijne roedenverdeling

      - natuurstenen lijsten en geometrische ornamenten op de hoeken

      - het lagere bouwdeel achter met schilddakvormige lichtkap en hoge twintigruits vensters

      '
    attributes:
