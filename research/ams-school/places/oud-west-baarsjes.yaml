  nl:
    title: Cabralschool (Cabralstraat 1)
    summary: Een dubbele school uit 1924 die twee straten verbindt, met vrijwel blinde kopgevels en twee
      torens; volgens het register is deze inpassing in een bouwblok uniek voor Amsterdam.
    body: 'De Dienst Publieke Werken ontwierp in 1924 deze dubbele corridorschool, rond 1926 gereed. Ze
      ligt dwars in een bouwblok en verbindt zo de Cabralstraat met de Marco Polostraat; elke school had
      een eigen ingang in een kopgevel. De twee scholen deelden een gymzaal en waren door branddeuren
      gescheiden. Het gemeentelijk register noemt het openen van de kopse kanten van een bouwblok voor
      een school uniek voor Amsterdam. In 1937 werd het gebouw verkocht aan het rooms-katholieke kerkbestuur
      van Sint-Augustinus. Na leegstand en kraak volgde vanaf 2013 een renovatie; nu is het bedrijfsverzamelgebouw
      MidWest.


      De gevels zijn expressief en kubistisch, met grote vlakken baksteen: rode steen voor plint en deuromlijsting,
      gele daarboven.


      Let op:

      - de twee hoge rechthoekige torens aan de westzijde

      - ladderramen boven de deuren tussen bolle muurdelen

      - kleine golvende, bol- en holronde muurdammen op de hoeken van de zuidgevel

      - de originele deur aan de Marco Polostraat

      '
    attributes:
      architect: Dienst Publieke Werken
      original_use: Twee lagere scholen
    sources:
