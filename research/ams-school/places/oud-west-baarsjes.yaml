  nl:
    title: Woningbouw Jan Evertsenstraat (Van der Mey)
    summary: 'Twee ''tweelingbroers'' van J.M. van der Mey bij de Molenslootbrug: hoektorens als poortwachters
      en winkelgalerijen met betonkolommen langs de Jan Evertsenstraat.'
    body: 'Joan Melchior van der Mey, bekend van het Scheepvaarthuis, ontwierp de twee blokken waar de
      Jan Evertsenstraat de Admiralengracht kruist (1926-1927). Het zijn symmetrische ''tweelingbroers''
      in rode baksteen met arbeiderswoningen boven een winkelgalerij. Vanaf de Molenslootbrug presenteren
      de hoger opgetrokken hoekpartijen zich als poortwachters, met vierlaagse vleugels die langs de gracht
      ''uitwaaieren''.


      Het gemeentelijk register ziet hier de verzakelijkte vormentaal van de late Amsterdamse School:
      de spanning zit in de rangschikking van vrij massieve bouwdelen, met horizontale vensterstroken
      onder uitkragende lateien tegenover verticale torens. In de afgeronde erkerstroken en de torens
      leeft de oude plasticiteit nog, ''alsof het om geboetseerde architectuur gaat''. Het noordelijke
      blok is ingrijpend gerenoveerd met verlies aan detail.


      Let op:

      - de getrapte hoektorens aan weerszijden van de brug

      - winkelgalerijen met betonkolommen langs de Jan Evertsenstraat

      - de poort naar de Krommertstraat

      '
    attributes:
      original_use: Arbeiderswoningen en winkels
    sources:
    - https://data.amsterdam.nl/monumenten/b271be0d-fb4c-4be4-889a-bc802a80243d
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/527151
