  nl:
    title: School Columbusplein (Commer de Geus)
    summary: 'De gereformeerde dubbele school van Commer de Geus uit 1927 aan de noordkant van het Columbusplein:
      sobere baksteen onder breed overstekende daken, met paraboolvormige portieken.'
    body: 'Architect Commer de Geus ontwierp deze dubbele school voor gewoon lager onderwijs op gereformeerde
      grondslag, gereed in 1927 en een van zijn vroege werken. Het gebouw beëindigt een bouwblok dat aan
      één kant deel uitmaakt van de gebogen wand van de Magalhaensstraat en is een blikvanger aan de noordzijde
      van het Columbusplein.


      Het register spreekt van een sobere, zakelijke trant met invloed van de Amsterdamse School. Roodbruine
      baksteen in staand verband, breed overstekende pannendaken en lange reeksen lokaalvensters met oorspronkelijke
      veelruits bovenlichten en granieten waterlijsten geven een sterke horizontale werking. Binnen bleven
      kleurig betegelde vloeren en granito lambriseringen met geometrische patronen bewaard.


      Let op:

      - de paraboolvormige portieken met deuren in laddermotief

      - de brede overstekende bakgoot en de vijf bakstenen schoorstenen op de nok

      - de risaliet met topgevel naast de hoofdingang

      '
    attributes:
      original_use: Gereformeerde lagere school
    sources:
    - https://data.amsterdam.nl/monumenten/3ec5bc91-e345-4a22-befd-19099100903b
- title: Paramaribostraat housing by Piet Kramer
  summary: A 1924 Piet Kramer housing ensemble in the Westindische Buurt, south of the Postjesweg, listed
    by the city in its first round of Amsterdam School designations.
  body: 'In the southern, West Indian-named part of Plan West, Piet Kramer designed the blocks along the
    Paramaribostraat and Marowijnestraat (1924), at the same time as his long walls on the Hoofdweg nearby.
    The city listed the ensemble as a municipal monument in 1992, in the same round as Wijdeveld''s Hoofdweg
    blocks, Roodenburgh''s Vespuccistraat and Staal''s Jan Evertsenstraat. The register has no published
    description yet, so the details below come from looking at the buildings.


    Look for:

    - the corner of the Paramaribostraat and the Marowijnestraat, where the blocks turn with Kramer''s
    characteristic stepped massing

    - grouped porch entrances and the play of brick piers between window bands, comparable with his Hoofdweg
    blocks

    '
