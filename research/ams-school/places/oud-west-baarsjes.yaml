- title: Vespuccistraat housing by Roodenburgh
  summary: 'Jordanus Roodenburgh''s blocks on the Vespuccistraat: orange-red brick in Norwegian bond,
    parabolic porches and bands of ornamental brickwork between the Jan van Galenstraat and the Jeruzalemkerk.'
  body: 'The Vespuccistraat, between the Jan van Galenstraat and the Jan Maijenstraat, is lined by a housing
    complex by Jordanus Roodenburgh (1924–1926). He was a De Bazel pupil and is counted among the Amsterdam
    School architects. Four blocks of flats with corner shops make up the complex, which is protected
    both nationally and by the city.


    The four-storey façades are in orange-red brick in Noors verband (Norwegian bond) on a base of dark
    clinker. Natural stone and ornamental brickwork are used for decoration. The ground floor reads as
    one continuous zone of six-sided parabolic porch entrances and small, deep-set windows. Higher up,
    horizontal bands of ornamental brick link the top-floor windows, above which the brickwork turns vertical.
    Opposite each side street the wall rises into a taller, almost blind mass with a stairwell bay.


    Look for:

    - parabolic porch openings with jutting stone blocks above them

    - the taller blind sections opposite the Jan Mayenstraat and Shackletonstraat

    - the corner shop with its multi-sided display window at the Jan van Galenstraat

    '
  category: housing
  lat: 52.371
  lng: 4.853717
  address: Vespuccistraat 2-134, Jan Maijenstraat 1-9, Shackletonstraat 1-4
