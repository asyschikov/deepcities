  nl:
    title: Corantijnschool
    summary: Een dubbele school van Publieke Werken uit 1922-1923 op de hoek met de Hoofdweg, met plastisch
      gemetselde lichte gevels, halfronde uitbouwen en torens die de buurt domineren.
    body: 'De gemeente Sloten nam in 1921 het initiatief tot een school op deze plek; na de annexatie
      ontwierp de Dienst Publieke Werken een dubbel schoolgebouw voor gewoon lager onderwijs, gereed in
      1923. Het werd gedeeld door de Corantijnschool en de Hoofdwegschool, elk met een eigen zij-ingang.
      In de Tweede Wereldoorlog gebruikte de bezetter het als kazerne. Er zit nog altijd een school in,
      OBS Corantijn.


      Het register spreekt van verstrakte Amsterdamse School: plastisch gemetselde gevels in lichte geelbruine
      baksteen op een deels hoger opgetrokken donkere plint, met accenten in donkere natuursteen. De symmetrische
      voorgevel heeft halfronde uitbouwen naast de middentravee en schuin geplaatste, deels concaaf gemetselde
      opbouwen op de hoeken. Leerlingen voegden later beeldwerk en in 2013 ''taaltegels'' toe.


      Let op:

      - de teruggezette bovenste verdieping met balkon en concave borstwering in verticaal metselwerk

      - de ronde uitbouwen in de zijgevels

      - de grote negenruits lokaalvensters

      '
    attributes:
      architect: Dienst Publieke Werken
      client: Gemeente Amsterdam
      original_use: Twee lagere scholen
    sources:
    - https://nl.wikipedia.org/wiki/Corantijnschool
