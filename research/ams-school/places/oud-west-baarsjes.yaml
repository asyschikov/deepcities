- title: Plan West
  summary: 'The 1920s district plan for De Baarsjes: 6,000 workers'' homes laid out around the Hoofdweg
    and Mercatorplein, with every street wall given an Amsterdam School façade.'
  body: 'In 1921 Amsterdam annexed the municipality of Sloten, which had already drawn up extension plans
    for the farmland west of the Kostverlorenvaart. A "Commissie van Drie" (committee of three) – the
    architects Jan Gratama and Gerrit Versteeg and A.R. Hulshoff, head of the buildings department of
    Public Works – reworked those plans. In June 1922 they presented Plan West: about 6,000 dwellings,
    with the Hoofdweg as the main axis and the Mercatorplein halfway along it as the visual and social
    centre. Like Berlage''s Plan Zuid, it was built up as a "Blockfront": long, carefully composed street
    walls with towers and accents at the corners.


    It was built remarkably fast, mostly between 1925 and 1927, by the developer and contractor H. van
    der Schaar. The dwelling plans had already been drawn by the office of Gulden & Geldmaker, so the
    invited architects (Berlage, Piet Kramer, Wijdeveld, J.F. Staal, Van der Mey, Rutgers, Roodenburgh
    and others) could only design the street fronts. Architects joked about this as *schortjesarchitectuur*
    (apron architecture). A permanent committee set the heights and silhouettes, and a beauty committee
    checked the results. The streets in the north are named after explorers and cartographers, those in
    the south after places in the West Indies.


    Look for:

    - the Hoofdweg as a processional avenue, with matching blocks by the same architect on both sides
    of the street

    - towers and gateways marking the entrances to each neighbourhood: Postjesweg, Mercatorplein, Jan
    van Galenstraat

    - Public Works schools and churches set into the block pattern, such as the Jeruzalemkerk and the
    Jan Maijenschool

    '
