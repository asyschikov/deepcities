  nl:
    title: Woonblokken Hoofdweg (G.J. Rutgers)
    summary: 'De blokken van G.J. Rutgers aan de Hoofdweg richting Mercatorplein: lange vensterreeksen,
      witte geveldammen in de bovenste laag en afgeronde hoektorens bij de Willem Schoutenstraat.'
    body: 'Tussen de Willem Schoutenstraat en het Mercatorplein staan aan beide kanten van de Hoofdweg
      woonblokken naar ontwerp van Gerrit Jan Rutgers, in 1924-1925 gebouwd door de N.V. Bouwmij. ''De
      Berk''. Eerdere plannen waren gemaakt door Z.D.J.W. Gulden en M. Geldmaker, maar Rutgers leverde
      het definitieve ontwerp. Rutgers was een van de productiefste woningbouwarchitecten van de Gordel
      20-40; ook hier vertaalde hij de Amsterdamse School in rustige, vlakke gevelwanden met etagewoningen
      en buurtwinkels.


      De horizontale werking ''stuwt'' de blik naar het Mercatorplein, versterkt door witgeschilderde
      geveldammen in de vierde bouwlaag, die bijna een mezzanino vormt. Om de twee portieken volgt een
      portiek met een erker erboven, in de oksels kwarthol afgerond en voorzien van sierbollen. Bij de
      Willem Schoutenstraat vormen beide blokken een symmetrisch poortgebouw met afgeronde hoeken, torens
      en terugspringende bovenlagen.


      Let op:

      - de hoektorens en gebogen winkelpuien bij de Willem Schoutenstraat

      - portieken met granitovloertjes en bescheiden siermetselwerk

      - de erkers met kwartholle oksels

      '
    attributes:
      original_use: Arbeiderswoningen en winkels
    sources:
    - https://data.amsterdam.nl/monumenten/759780db-c2b5-4d87-9185-58c27c80207b
- title: Jan Evertsenstraat housing by J.F. Staal
  summary: 'Jan Frederik Staal''s shopping street: six long blocks lining the Jan Evertsenstraat towards
    the Mercatorplein, with shop canopies, glass-block bands and rounded corner towers.'
  body: 'J.F. Staal designed both sides of the Jan Evertsenstraat between the Admiralengracht and the
    Mercatorplein, one of the main axes of Plan West (1925–1926). The complex has six parts with several
    hundred flats and more than 80 shops. At the east end two matching blocks form the "visual entrance"
    to the street, and a gateway building over the Hudsonstraat ties two blocks together. The national
    register describes it as "verstrakte" (streamlined, sober) Amsterdam School.


    Staal gives the long, five-storey street walls a strong rhythm. Projecting brick piers with concrete
    caps carry small balconies or three-sided bay windows. A continuous flat concrete canopy runs above
    the shops, with a strip of glass building blocks over it to light the shop interiors. The top floor
    is almost blind. At the corners with the side streets, cylindrical brick piers rise above the roofline.


    Look for:

    - the gateway with a tall central passage over the Hudsonstraat

    - cylindrical corner piers at the Vespuccistraat

    - glass-block bands above the shop canopies

    - original doors with house numbers in Amsterdam School lettering

    '
  category: housing
  lat: 52.37104
  lng: 4.855153
