  nl:
    title: Woningbouw Paramaribostraat (Piet Kramer)
    summary: Een ensemble van Piet Kramer uit 1924 in de Westindische Buurt, ten zuiden van de Postjesweg,
      in 1992 aangewezen als gemeentelijk monument.
    body: 'In het zuidelijke, naar West-Indië genoemde deel van Plan West ontwierp Piet Kramer in 1924
      de blokken aan de Paramaribostraat en de Marowijnestraat, in dezelfde jaren als zijn woonblokken
      aan de Hoofdweg. De gemeente wees het complex in 1992 aan als gemeentelijk monument, in dezelfde
      ronde als Wijdevelds Hoofdweg, Roodenburghs Vespuccistraat en Staals Jan Evertsenstraat. Een gepubliceerde
      redengevende omschrijving ontbreekt nog; wat hieronder staat, is wat je ter plekke ziet.


      Let op:

      - de hoek Paramaribostraat-Marowijnestraat, waar de blokken met Kramers verspringende massa''s de
      hoek omgaan

      - gekoppelde portiekingangen en geveldammen tussen de vensterreeksen, vergelijkbaar met zijn Hoofdwegblokken

      '
    attributes:
      original_use: Woningen
    sources:
    - https://data.amsterdam.nl/monumenten/fafa011c-a917-46b2-a4bc-902d5811fa58
- title: Gemeentetram headquarters
  summary: 'The 1922–1923 head office of the municipal tramways, rising straight out of the Singelgracht:
    P.L. Marnette''s Amsterdam School palace of offices with sculpture by Hildo Krop.'
  body: 'Public Works architect P.L. Marnette designed this office building for the Gemeentetram (municipal
    tram company), built in 1922–1923. It is the only building on this stretch of the Stadhouderskade
    standing directly on the water: the back rises straight out of the Singelgracht from a basement storey.
    A special siding on the west side let fare collectors safely deliver the day''s takings. The tram
    company left in 1983, and the city cleaning department stayed until 1990. Today it is a private office
    building.


    The U-shaped plan has a central block between two corner pavilions, all under flat roofs, and Hildo
    Krop provided the sculpture. The middle part is strongly rhythmic, with identical windows and brick
    piers and figurative building ceramics at their tops. The top floor is mostly blind, with brickwork
    in a diamond pattern and a toothed cornice. A small utility building with a rounded porter''s lodge
    and a transformer room, also listed, stands to the north-west.


    Look for:

    - Krop''s ceramic figures on the piers and the larger ornament above the entrance

    - the tapering entrance porch with Amsterdam School lanterns

    - the rear façade seen from across the Singelgracht

    '
  category: commercial
  lat: 52.36392
  lng: 4.879184
  address: Stadhouderskade 1
