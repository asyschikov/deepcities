- title: Wilhelmina Gasthuis X-ray building
  summary: A 1925 corner pavilion of the old municipal hospital, built for X-rays and a lecture hall,
    with a parabolic window and a stairwell shaft rising above the roof.
  body: 'The Wilhelmina Gasthuis (WG) was Amsterdam''s municipal hospital from 1893 until the move to
    the AMC in the 1980s; its pavilions are now a mixed residential and business quarter. In 1925 the
    Public Works department added this corner building against the former women''s pavilion to house an
    X-ray department and a lecture hall. The national register calls it a hospital pavilion in Amsterdam
    School style.


    It is a compact brick building under a flat roof: two storeys on the Eerste Helmersstraat and three
    on the WG-plein side under a sloping skylight. Bluestone is used for the lintels and the canopy over
    the corner.


    Look for:

    - the parabolic window with curved iron glazing bars on the WG-plein front

    - the continuous ribbon window on the ground floor along the street

    - the vertical stairwell shaft that rises above the cornice, joined by curving brickwork to a half-round
    end wall

    '
  category: public-works
  lat: 52.362828
  lng: 4.871826
  address: WG-plein 874-881, Marius van Bouwdijk Bastiaansestraat 81
