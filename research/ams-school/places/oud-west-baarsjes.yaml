- title: Corantijnschool
  summary: A double Public Works school of 1922–1923 on the corner of the Hoofdweg, with sculpted pale-brick
    walls, half-round bays and towers that still dominate the Westindische Buurt.
  body: 'The municipality of Sloten initiated a school here in 1921, and after the annexation Amsterdam''s
    Public Works department designed a double elementary school, completed in 1923. It was shared by the
    Corantijnschool and the Hoofdwegschool, each with its own side entrance. During the Second World War
    the German occupiers used it as barracks. It is still a school (OBS Corantijn).


    The national register calls it "verstrakte" Amsterdam School, though it is one of the earliest Plan
    West buildings and still quite plastic. The walls are light yellow-brown brick on a dark base, with
    dark stone accents. Symmetrical façades have half-round bays flanking the centre and tall, angled
    tower-like corners. Pupils have added sculpture and, in 2013, tiles with their own texts.


    Look for:

    - the recessed top floor with a balcony and a concave parapet in vertical brickwork

    - pairs of brick half-cylinders on the side walls

    - large nine-pane classroom windows

    '
