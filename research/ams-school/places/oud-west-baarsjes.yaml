  nl:
    title: Machineslootbrug (brug 358)
    summary: 'Piet Kramers brug uit 1929-1930 in de Postjesweg over de Admiralengracht, naast Het Sieraad:
      baksteen, graniet en smeedijzeren leuningen die eindigen in zeeanemonen.'
    body: 'In 1923 kwamen er in de Jan Evertsenstraat en de Postjesweg twee houten noodbruggen over de
      Admiralengracht, samen 22.000 gulden. Met zo''n 35.000 nieuwe bewoners in de Mercatorbuurt konden
      ze het verkeer al snel niet aan. Na jaren aandringen van winkeliers en bewoners vroeg de gemeente
      in het najaar van 1928 een krediet van 330.000 gulden aan; de buurt vierde het besluit met een feestweek.
      Beide nieuwe bruggen kwamen van de tekentafel van Piet Kramer. Brug 358 is het zusje van de Molenslootbrug
      (brug 359).


      Het water lag destijds veel lager, op het peil van de Sloterpolder; in 1952 werd het op Amsterdams
      grachtenpeil gebracht. In de volksmond heette de brug ook wel Ambachtbrug, naar de school ernaast.


      Let op:

      - landhoofden van baksteen en graniet met bewerkingen, vermoedelijk van Hildo Krop

      - siersmeedijzeren balustrades die eindigen in de vorm van een zeeanemoon; hier onderbroken, bij
      brug 359 doorlopend

      '
    attributes:
      architect: Piet Kramer (Dienst Publieke Werken)
      client: Gemeente Amsterdam
      artists: Hildo Krop (toegeschreven)
      original_use: Verkeers- en trambrug
