- title: GEB substation Eerste Helmersstraat
  summary: A small 1923–1924 electricity substation with a symmetrical brick tower front, proof that Public
    Works gave even transformer houses Amsterdam School care.
  body: 'This 10 kV substation for the municipal electricity company (GEB) was built in two phases by
    the Public Works department. The first building stood behind a row of 19th-century houses. When those
    were demolished in 1924–1930, the station was extended to the street. In the 1920s Amsterdam School
    gables were the fashion for transformer buildings; in the 1930s they became more functional. Since
    2007 the building has had a mixed residential and business use.


    Facing the street is a symmetrical tower section in a sober Amsterdam School style. Behind it is the
    1924 hall, described as more expressionist, with a red-tiled cross roof. Concrete roof edges mark
    the flat roofs and projecting brickwork stresses the verticals.


    Look for:

    - the symmetrical brick tower on the Eerste Helmersstraat

    - blocky, soberly expressionist granite and concrete ornament around the door

    - gates decorated with geometric sheet-metal shapes

    '
  category: public-works
  lat: 52.36384
  lng: 4.876839
  address: Eerste Helmersstraat 21
