- title: Cabotstraat school island
  summary: Three parallel Public Works schools of 1928 joined by a tall curving schoolyard wall – a late
    Amsterdam School "school island" between the Admiralengracht and the Cabotstraat.
  body: 'In 1928 the Public Works department laid out three school buildings side by side in strips, with
    playgrounds between them screened from the street by a high brick wall. From north to south they held
    the Admiralengrachtschool and Columbusschool, a nursery school, and the double Cabotschool and Vasco
    da Gamaschool. All four parts – three schools and the wall – are national monuments, described as
    late Amsterdam School.


    The schools are long three-storey corridor buildings under red-tiled roofs. They have block-like,
    stepped entrance wings at both ends, pointed gables with diamond windows, and rows of small square
    windows above taller ones. The wall is architecture in its own right: it curves into the end walls
    of the schools, has doors under brick arches, and ends at one school in a round window and at another
    in a half-round door.


    Look for:

    - the high schoolyard wall, with quarter-round sweeps where it meets the end walls

    - wavy brick balconies on the end façades

    - gables with diamond-shaped top windows

    '
