  nl:
    title: De Klimop (Admiralengracht 301)
    summary: Een kindvriendelijke kleuterschool van Publieke Werken uit 1928-1930, waarvan de lage halfronde
      vleugel het speelplein aan de Admiralengracht omarmt.
    body: 'Deze school voor voorbereidend onderwijs is ontworpen door de Dienst Publieke Werken en gebouwd
      in 1928-1930. Van 1935 tot de opheffing in de jaren tachtig was het kleuterschool De Klimop. In
      1994 werd het naar ontwerp van architectenbureau M. van Haaren een kinderopvang voor baby''s en
      peuters, met behoud van de hoofdindeling. Het register noemt het een geslaagd schoolvoorbeeld van
      de Amsterdamse Schoolarchitectuur van Publieke Werken in de jaren dertig, uit de tijd dat de gemeente
      ook voor kleuters gedegen scholen ging bouwen.


      Drie bouwvolumes met rode zadeldaken van verschillende hoogte, in rode baksteen met natuursteen
      voor hoek- en afsluitblokken. Een lage halfronde vleugel in paarsblauwe steen omarmt het schoolplein
      en schept een beschutte schoolwereld. De volumes laten de indeling zien: speellokalen onder een
      dwarskap, dan de klaslokalen, dan het trappenhuis.


      Let op:

      - de lage gebogen vleugel met vensterstrook onder de goot

      - lokaalramen met ongelijke ruiten en een strook smalle ruitjes ertussen

      - de openslaande deuren met Frans balkon van de directiekamer

      '
    attributes:
      architect: Dienst Publieke Werken
      client: Gemeente Amsterdam
      original_use: Kleuterschool
    sources:
