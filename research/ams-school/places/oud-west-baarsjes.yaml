- title: Pesthuysbrug
  summary: Bridge 181 of 1938 over the Jacob van Lennepkanaal, an austere late Public Works bridge from
    Piet Kramer's era, with brick and granite but no ornament.
  body: 'A double bascule bridge of 1892 stood here first, carrying trams over a canal that fed the vegetable
    market on the Marnixstraat. When the market moved to the new Centrale Markthallen in 1932, the bridge
    no longer had to open. What was needed instead was a wide road link between Oud-West and Oud-Zuid.
    The new fixed bridge of 1938 was designed by the Public Works bridge office, where Piet Kramer still
    had a big say in the architectural design. It carries tram 3 between the Bilderdijkstraat and the
    Eerste Constantijn Huygensstraat.


    Compared with Kramer''s earlier bridges it is very sober. There is the familiar Amsterdam School alternation
    of brick and natural stone, but no bridge-keeper''s houses, sculpture or wrought-iron balustrades.
    The name recalls the plague house (pesthuis) that once stood on the site of the later Wilhelmina Gasthuis.


    Look for:

    - the completion year carved into the granite

    - brick and granite abutments along the Jacob van Lennepkade

    '
  category: bridges
