- title: Westerwijk
  summary: 'Ferdinand Jantzen''s first building (1925–1926): a church community hall with flats on the
    Admiraal de Ruijterweg, Amsterdam School at the front and Frank Lloyd Wright in the garden hall.'
  body: 'Three years before his Jeruzalemkerk, the young architect F.B. Jantzen designed this neighbourhood
    building for the Dutch Reformed congregation of Sloterdijk. It held a meeting hall, rooms for youth
    work and Sunday school, a doctor''s room and a library in the basement, with flats on the upper floors;
    Jantzen himself lived at no. 152. Behind the street block, partly sunk into the garden, is an auditorium
    for about 350 people. The building is still used by a Christian community, also called Westerwijk,
    and the halls are rented out to groups such as the food bank.


    The city register calls it a good example of interwar expressionist design. The front building is
    Amsterdam School in character, while the garden hall shows the influence of Frank Lloyd Wright. Inside
    survive Amsterdam School window frames, colourful leaded glass and an electric wall clock in the hall.


    Look for:

    - the brown-brick front with a stepped-back centre and taller side bays with pinched bay windows

    - the dark syenite base that meanders around the triple entrance

    - the name WESTERWIJK in bronze-coloured wrought letters over the middle door

    '
  category: religious
  lat: 52.374053
  lng: 4.858982
  address: Admiraal de Ruijterweg 148-152
  links:
