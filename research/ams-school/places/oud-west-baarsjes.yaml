- title: Atlanta (Stadhouderskade 5-6)
  summary: 'F.A. Warners'' 1929 office block Atlanta by the Leidsebosje: an early American-style rental
    office with concrete frame and lift, wrapped in hand-made brick and Amsterdam School detail.'
  body: 'In the 1920s a purpose-built office building was still a new type in Amsterdam, where firms usually
    moved into old canal houses. Frans Warners, who was strongly oriented towards America, designed Atlanta
    in 1929 as a modern speculative office block. It had a concrete frame and an automatic lift, with
    a car business on the ground floor. The register values it as a step in the development of the modern
    office building and as a landmark in the row of large buildings just outside the old city moat.


    The building was detailed throughout in the Amsterdam School manner: red hand-moulded brick with deep
    joints in stretcher bond, and two roughly half-round bays framing the façade above the ground floor.
    The upper lights of the windows sit slightly in front of the wall and the lower parts slightly behind
    it, a typical Amsterdam School detail. Sculptor L.S.W. van der Noordaa provided the building sculpture.


    Look for:

    - the two half-round bays on the front

    - the robust recessed top floor with vertical strips of ornamental brickwork

    - Van der Noordaa''s sculpture

    '
  category: commercial
  lat: 52.363159
  lng: 4.879328
  address: Stadhouderskade 5-6
  links:
  - label: Gemeentelijk monument (224005)
