    summary: 'Een HBS van Publieke Werken uit 1916 aan het Vondelpark, met zeer vroeg werk van Hildo Krop:
      Egyptisch geïnspireerde adelaars en een slang die in zijn eigen staart bijt.'
    body: 'Deze driejarige HBS met dienstwoning is officieel in 1916 ontworpen door de Dienst Publieke
      Werken; collega-architect A.A. Kok schrijft haar toe aan G.J. Rutgers. Er waren 16 lokalen, waaronder
      een natuur- en scheikundelokaal, een aardrijkskunde- en een tekenlokaal, en een gymvleugel. De lokalen
      liggen op het zuiden, aan de parkzijde.


      Bijzonder zijn de beelden van Hildo Krop uit zijn zeer vroege periode (1917), toen ir. Hulshoff
      hem net de eerste opdrachten gaf. Volgens het register is dit een van de allereerste scholen die
      met zulke hoogwaardige kunst is verfraaid; kunst zou een ''zedelijke en opvoedkundige werking''
      hebben. De motieven zijn mysterieus en duidelijk beïnvloed door Egyptische kunst: een cirkelvormige
      slang met de staart in de bek, adelaars als antiek symbool van macht. Binnen vormde Krop de trappalen
      tot exotische dieren, en er is glas-in-lood met een ''getrapt patroon''.


      Let op:

      - Krops beelden aan de parkzijde, met die aan de P.L. Takstraat zijn grootste werk aan een school

      - de smalle entreegevel in de afgeplatte hoek van de C-vormige plattegrond

      - de lage gymvleugel met schilddak

      '
    attributes:
      built: 1916–1917
      architect: Dienst Publieke Werken (toegeschreven aan G.J. Rutgers)
      client: Gemeente Amsterdam
      original_use: Hogere burgerschool met dienstwoning
