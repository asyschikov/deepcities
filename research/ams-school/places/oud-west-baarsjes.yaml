- title: Columbusplein school (Commer de Geus)
  summary: 'Commer de Geus''s 1927 Christian double school closing the north side of the Columbusplein:
    sober brick under wide eaves, entered through parabolic porches.'
  body: 'Architect Commer de Geus designed this double elementary school on a Reformed (gereformeerd)
    basis, completed in 1927, as one of his early works. It closes the end of a block whose other side
    forms the curved wall of the Magalhaensstraat. That makes it a landmark on the north side of the Columbusplein,
    one of the squares of Plan West.


    The register describes a sober, businesslike design with Amsterdam School details. Red-brown brick
    is laid in stretcher bond under widely overhanging tiled eaves. Long rows of classroom windows with
    their original multi-pane upper lights and granite sills give the façade a strong horizontal line.
    Inside survive colourful tiled floors and granito wainscots with geometric patterns.


    Look for:

    - the parabolic entrance porches with doors in a ladder motif

    - the broad overhanging gutter and five brick chimneys on the ridge

    - the corner risalit with gable and cross roof next to the main entrance

    '
  category: schools
