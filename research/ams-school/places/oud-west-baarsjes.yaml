  nl:
    title: Woonblokken Hoofdweg (Piet Kramer)
    summary: 'Piet Kramers gevelwanden tussen Postjesweg en Willem Schoutenstraat: zeslaagse poortblokken
      en trappenhuisstroken die eindigen in pylonen met golvende sierstroken.'
    body: 'Piet Kramer, medeontwerper van het Scheepvaarthuis en van de Spaarndammerbuurt, leverde in
      1923 het ontwerp voor de blokken aan weerszijden van de zuidelijke Hoofdweg; in 1925 waren ze klaar.
      Het zijn beneden- en bovenwoningen voor arbeiders, met buurtwinkeltjes op de hoeken. Dat tegenover
      elkaar liggende blokken van dezelfde architect zijn, was beleid van de Commissie van Drie: de Hoofdweg
      moest één toegangslaan naar het Mercatorplein vormen. Bij de Postjesweg tellen de blokken zes lagen
      en werken ze als poortgebouwen; bij de Davisstraat volgen de gevels de knik in de weg.


      Volgens het gemeentelijk register is de Amsterdamse School hier ''vertaald'' in vrij vlakke, beheerste
      gevelwanden met schier eindeloze vensterreeksen. De plastiek zit in de ingangspartijen en trappenhuisstroken.
      Het rode blok aan de oostzijde tussen Postjesweg en Davisstraat is rijker gedetailleerd dan de grijsbruine
      blokken. Door renovatie ging veel oorspronkelijke detaillering verloren, maar het karakter bleef
      herkenbaar.


      Let op:

      - per vier gekoppelde ingangen onder een gezamenlijke luifel op plastische geveldammen met houten
      sierelementen

      - blinde trappenhuisstroken tot aan de daklijst, bekroond met pylonen met golvende sierstroken

      - de zeslaagse hoekblokken bij de Postjesweg

      '
    attributes:
      architect: Piet Kramer (gevels); Gulden & Geldmaker (plattegronden)
      original_use: Arbeiderswoningen en winkels
    sources:
    - https://data.amsterdam.nl/monumenten/37ce335d-2af4-49d5-b4cd-8f10bf2ebab7
