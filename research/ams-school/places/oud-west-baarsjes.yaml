- title: Machineslootbrug
  summary: 'Piet Kramer''s 1929–1930 bridge carrying the Postjesweg over the Admiralengracht, beside Het
    Sieraad: brick, granite and wrought-iron railings ending in sea anemones.'
  body: 'When Plan West filled up, the temporary wooden bridges of 1923 over the Admiralengracht could
    no longer cope with some 35,000 new residents and their trams. After years of lobbying by shopkeepers,
    the council voted in autumn 1928 for 330,000 guilders to replace two of them, and the neighbourhood
    celebrated with a party week. Both new bridges came from the drawing board of Piet Kramer, the Public
    Works architect behind hundreds of Amsterdam bridges. Bridge 358 in the Postjesweg is the sister of
    the Molenslootbrug (bridge 359) in the Jan Evertsenstraat.


    The water was much lower then, at the level of the Sloterpolder. It was raised to the Amsterdam canal
    level in 1952. Locals also called this the Ambachtsbrug, after the trade school next to it.


    Look for:

    - brick abutments with granite carvings (probably by Hildo Krop)

    - wrought-iron balustrades that end in sea-anemone shapes at the abutments, interrupted here (continuous
    on the Molenslootbrug)

    - trams 7 and 17 crossing towards Het Sieraad

    '
