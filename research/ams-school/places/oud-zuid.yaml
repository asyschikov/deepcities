  nl:
    title: Calvijnschool
    summary: Christelijke lagere school uit 1932 van de verder onbekende J. Op 't Land, waarin late Amsterdamse
      School-vensterreeksen en smeedwerk samengaan met traditionalistische rondbogen en Oudhollandse roeden.
    body: 'De Calvijnschool, in 1932 gebouwd als christelijke school voor lager onderwijs, is het enige
      bekende werk van architect J. Op ''t Land – opmerkelijk, schrijft het gemeentelijk register, voor
      een ontwerp van zo''n hoge kwaliteit. Tegenover de school staat een tweede schoolgebouw uit dezelfde
      tijd.


      Het is een gangschool met alle lokalen aan de voorgevel. Het register beschrijft een mengvorm: de
      horizontaliserende reeksen lokaalvensters zijn late Amsterdamse School, maar de welhaast Oudhollandse
      roedenverdeling, de quasi-handvormsteen, de Romaanse pannen, de sierbollen en de rondboogingang
      zijn traditionalistisch. Binnen mengt het trappenhuis met plastische borstweringen en siersmeedwerk
      beide. Nu zitten er een peuterspeelzaal en kunstenaarsateliers.


      Let op:

      - de rondboogportiek met granieten speklagen, geflankeerd door posten met sierbollen

      - de dubbele deur met deurramen in laddermotief

      - de hoge gymlokaalvensters met terugwijkende benedenramen

      '
    attributes:
      original_use: Christelijke lagere school
    sources:
    - https://monumentenzoeker.amsterdam.nl/monument/222126
