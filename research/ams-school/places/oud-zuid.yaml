  nl:
    title: Villa's aan de Apollolaan
    summary: 'Een groep villa''s uit 1925–1930 aan Apollolaan en Albert Hahnplantsoen: een dubbele villa
      met toren en tuinhuisjes, een villa met de jaargetijden van Mari Andriessen, een dubbele villa van
      Baanders en Rutgers'' ''La Pergola''.'
    body: 'Langs de Apollolaan bij het Albert Hahnplantsoen en het Dijsselhofplantsoen, met tuinen tot
      aan het Noorder Amstelkanaal, ontstond binnen Plan Zuid een kleine villawijk.


      - Albert Hahnplantsoen 21–23: dubbele villa (1930, ontwerp 1928) van E. Nijsten voor J.J. Eyrond,
      in rood-grauwe baksteen met toren, overkragende luifels en drie tuinhuisjes die via de erfafscheiding
      verbonden zijn (één hoort bij Villa Lebbink).

      - Apollolaan 178: villa (1926–1928) van L.J.H. Zonneveldt en C.W. Rooyaards voor C. Hülsmann, met
      beeldhouwwerk van Mari Andriessen: twee spelende putti boven de deur en de vier jaargetijden.

      - Albert Hahnplantsoen 25–27: dubbele villa (1925–1928) van H.A.J. en Jan Baanders voor J. Polak
      Grodel, eigenlijk twee boven elkaar gelegen appartementen.

      - Dijsselhofplantsoen 10: villa La Pergola (1928–1929) van G.J. Rutgers voor B.A. Sanders; de pergola
      zelf is verdwenen.


      Let op:

      - de toren en de tuinhuisjes van Albert Hahnplantsoen 21–23

      - de sluitsteen met putti en de jaargetijden aan Apollolaan 178

      '
