- title: Dobbelsteen houses (Hacquartstraat)
  summary: Twelve town houses by F.A. Warners (1921–1924), nicknamed the 'dice' houses, mixing Frank Lloyd
    Wright's cubic forms with Amsterdam School details.
  body: 'Frederik Adriaan Warners built this block of twelve town houses in phases between 1921 and 1924
    for several clients: Allert de Lange (nos. 6–16), S. Kloots, G.A.O. Krause and J. Rozenstraten. Locals
    call them the *dobbelsteen* (dice) houses for their cubic forms.


    The national register values the combination of an internationally inspired composition, clearly influenced
    by Frank Lloyd Wright, with Amsterdam School detailing. The front gardens are closed off by a wooden
    fence on a brick base, also detailed in the Amsterdam School manner.


    Look for:

    - the stepping cubic volumes and in-and-out wall planes

    - the original wooden garden fence along the street

    - (the bay and balcony of no. 8 are recent)

    '
