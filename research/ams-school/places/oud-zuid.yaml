  nl:
    title: Raw Aron Schuster Synagoge
    summary: Synagoge van Harry Elte aan het Jacob Obrechtplein (1927–1928), sober van buiten met toren
      en brede overstekken in de trant van Dudok en Wright – de grootste nog werkende Asjkenazische synagoge
      van Amsterdam.
    body: 'Toen veel joodse Amsterdammers van de oude Jodenbuurt naar Zuid verhuisden, liet de Nederlandsch
      Israelitische Hoofdsynagoge op de hoek van het Jacob Obrechtplein en de Heinzestraat een synagoge
      bouwen naar ontwerp van H. Elte Phzn., in samenwerking met C. van der Wilk. Het complex omvat een
      mikwe, een verenigingslokaal (bijsjoel) en twee ambtswoningen voor de voorzangers; W. Bogtman maakte
      het glas-in-lood. De inwijding was op 18 mei 1928.


      Het register spreekt van een trant naar Dudok en F.L. Wright: blokvormige volumes, een toren, een
      overdekte ingang en brede overstekende daken. Het interieur staat in de traditie van de Amsterdamse
      School met art-deco-elementen. Na de oorlog werd de sjoel het centrum van het religieuze joodse
      leven in Amsterdam; hij is genoemd naar opperrabbijn Aron Schuster (1942–1973). Elte kwam in 1944
      om in Theresienstadt.


      Let op:

      - de vierkante toren en de brede, vlakke overstekken

      - de overdekte ingang op de hoek van het plein

      '
    attributes:
      original_use: Synagoge met mikwe
    sources:
    - https://nl.wikipedia.org/wiki/Raw_Aron_Schuster_Synagoge
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/505651
- title: Kramer houses Heinzestraat
  summary: Five mirrored houses by Piet Kramer (1921–1922) with triangular, inward-folding porches, twisted
    wooden half-columns and a terracotta sawtooth cornice.
  body: 'Builder J.Th. Boersma, who also commissioned Huize de Windroos, asked Piet Kramer to design this
    block of five linked houses on the Heinzestraat in 1921–1922. Each originally contained a house with
    an upper flat, one with two upper flats. They are mirrored in pairs about the centre.


    Kramer, better known for his bridges, gave these small houses the full expressive treatment: light-brown
    brick on a black-plastered base, three storeys under a flat roof, and a terracotta sawtooth (*muizetand*)
    cornice.


    Look for:

    - the triangular porches folded into the façade under projecting bays, with doors set at an angle
    to each other

    - the wooden half-columns that twist outwards on either side of each porch

    - the terracotta sawtooth along the roofline

    '
