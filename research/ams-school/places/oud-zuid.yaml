- title: Warners block Olympiaplein
  summary: 'F.A. Warners'' late Amsterdam School flats facing the Olympiaplein (1926–1928): nine repeating
    bays under a strongly overhanging red-tiled roof, a chimney for every bay.'
  body: 'F.A. Warners designed the whole block between the Olympiaplein, Gerrit van der Veenstraat, Leonardostraat
    and Titiaanstraat in two parts, in the style of the late Amsterdam School. The side facing the square,
    designed in 1926 and completed in 1928, has a regular rhythm suited to the large open space; the side
    facing the quiet Leonardostraat is more varied and intimate. A projecting part with a gable marks
    where the two meet.


    The walls are orange-red brick over a dark-brown plinth, under a steeply overhanging hipped roof of
    red pantiles with one chimney per bay.


    Look for:

    - the nine identical bays between two slightly different corner sections on the Olympiaplein

    - the deep eaves and the row of chimneys

    '
