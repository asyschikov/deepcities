  nl:
    title: Jacob Obrechtstraat 66–70
    summary: Drie herenhuizen (1923–1924) die ontwikkelaar H. van der Schaar zelf ontwierp, in ingetogen
      Amsterdamse School-stijl met levendige erkers en een vernieuwende hal achter glazen draaiwanden.
    body: 'H. van der Schaar ontwierp en bouwde deze drie samenhangende huizen in 1923–1924. Het gemeentelijk
      register noemt nummer 66 een geslaagd voorbeeld van ingetogen Amsterdamse School-architectuur: zorgvuldig
      gedetailleerd, met expressief gebruik van baksteen en erkers die het gevelbeeld levendig maken.


      De grootste waarde ligt in het interieur. Net als in De Lairessestraat 93 staat een grote centrale
      hal via glazen draaiwanden met glas-in-lood in verbinding met de woonvertrekken – voor herenhuizen
      uit die tijd ongebruikelijk. Ook de vestibule met marmeren wandbekleding en de schoorsteenpartij
      in de voorkamer zijn bewaard.


      Let op:

      - de bakstenen erkers en het siermetselwerk van 66–70

      - het glas-in-lood in voordeur en bovenlichten

      '
    attributes:
      original_use: Herenhuizen
    sources:
    - https://monumentenzoeker.amsterdam.nl/monument/200974
- title: Raw Aron Schuster Synagogue
  summary: Harry Elte's synagogue on the Jacob Obrechtplein (1927–1928), austere outside with a tower
    and deep eaves in the manner of Dudok and Wright — Amsterdam's largest working Ashkenazi synagogue.
  body: 'As Jewish families moved from the old Jewish quarter to Zuid, the Nederlandsch Israelitische
    Hoofdsynagoge commissioned Harry Elte (1880–1944), a pupil of Berlage, to design a synagogue on the
    corner of the Jacob Obrechtplein and the Heinzestraat. It was consecrated on 18 May 1928. The complex
    includes a ritual bath (*mikveh*), a side hall (*bijsjoel*) and two flats for the cantors; Willem
    Bogtman made the stained glass.


    The national register describes the exterior as in the manner of Dudok and Frank Lloyd Wright: blocky
    volumes, a tower, a covered entrance and wide overhanging roofs. The interior follows the Amsterdam
    School with Art Deco touches. After the Second World War it became the centre of religious Jewish
    life in Amsterdam; it is named after Aron Schuster, the congregation''s rabbi from 1942 to 1973. Elte
    was murdered in Theresienstadt in 1944.


    Look for:

    - the square tower and the deep, flat overhanging eaves

    - the covered entrance on the corner of the square

    - the Hebrew lettering on the façade

    '
