    - https://monumentenregister.cultureelerfgoed.nl/monumenten/527830
- title: Zonnehof (Greiner)
  summary: 'Dick Greiner''s late work of 1938–1940: a whole block of 256 luxury flats mixing late Amsterdam
    School brickwork with Nieuwe Bouwen, with a post office built in.'
  body: 'NV Bouw- en Exploitatiemij. Socrates commissioned Dick Greiner (1891–1964), the architect of
    the Betondorp and Tuindorp Watergraafsmeer designs, to fill the whole block between the Watteaustraat,
    Courbetstraat, Michelangelostraat and Milletstraat. Zonnehof was built in 1938–1940 with 256 luxury
    flats on five floors under flat roofs; Courbetstraat 32–40 (1940) got a post office on the ground
    floor, and Greiner added the Watteaustraat corner in 1951.


    The register values it as a late phase of Greiner''s work, mixing expressive and functionalist elements,
    and for its careful façades with striking brick bonds.


    Look for:

    - the dark-brown base and the patterned brickwork

    - stair porches giving access to the flats

    '
