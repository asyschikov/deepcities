  nl:
    title: Stadionweg 44 (woonhuis Harry Elte)
    summary: 'Het woonhuis dat Harry Elte in 1928–1930 voor zichzelf bouwde: handvormsteen, een rondboogportiek,
      Anna-groene glasstenen van Berlage en glas-in-lood van Willem Bogtman.'
    body: 'Bij de driesprong Stadionweg/Diepenbrockstraat ontwierp H. Elte een woonhuis voor zichzelf,
      inclusief het interieur. Het register noemt de trant zakelijk-expressionistisch.


      Het huis van drie lagen onder een plat dak is geheel in handgevormde baksteen opgetrokken, op een
      uitkragend basement van afwijkende steen, met een asymmetrische gevelindeling. De glazen bouwstenen
      in de voorgevel zijn ontworpen door Eltes leermeester H.P. Berlage; het glas-in-lood is van Willem
      Bogtman.


      Let op:

      - de rondboogvormige portiek met afwijkend metselverband en een ronde eikenhouten deur

      - twee rijen Anna-groene glasstenen op straatniveau

      '
