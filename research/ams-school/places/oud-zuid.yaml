- title: Fysiologisch Laboratorium (VU)
  summary: A 1916 laboratory by Groenendijk & Lammers for the Calvinist Free University, with a parabolic
    stone entrance and windows that break through the floors.
  body: 'The *Vereeniging voor Hooger Onderwijs op Gereformeerden Grondslag*, the body behind the Vrije
    Universiteit (VU), commissioned this physiological laboratory on the corner of the De Lairessestraat
    and the Valeriusplein. Groenendijk & Th.J. Lammers designed it in 1916, making it one of the earlier
    Amsterdam School buildings in the area.


    It rises from a semi-basement to an attic under two black-tiled mansard roofs. The register points
    to the windows: different sizes, sometimes running through a floor, divided now horizontally, now
    vertically. A brick garden wall encloses a narrow garden on the square.


    Look for:

    - the parabolic entrance, partly in bluestone, reached by eleven steps

    - the irregular window pattern on the Valeriusplein front

    '
  category: schools
  lat: 52.352039
  lng: 4.864966
  address: Valeriusplein 11, De Lairessestraat 190
  links:
