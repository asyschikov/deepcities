  nl:
    title: Voormalig Scheepvaartkundig Museum
    summary: 'In 1917–1920 door G.F. La Croix gebouwd als scheepvaartmuseum, nu veilinghuis: rode baksteen,
      kolossale pilasters, een daklijst met reliëfs en golfvormig versierde vensteromlijstingen.'
    body: 'Op de hoek van De Lairessestraat en Cornelis Schuytstraat liet H. van der Schaar Lzn. tussen
      1917 en 1920 een Scheepvaartkundig Museum bouwen naar ontwerp van G.F. La Croix, in verstrakte Amsterdamse
      School-stijl. In 1929 kwam er een glazen overkapping voor de Vereeniging Scheepvaart Museum. Tegenwoordig
      is het een veilinghuis.


      Het rood bakstenen pand telt een begane grond, verdieping en kapverdieping onder een mansardedak.
      Kolossale bakstenen pilasters en hoeklisenen dragen een uitkragend fries en een daklijst met reliëfversieringen.


      Let op:

      - de houten vensteromlijstingen met golfvormige decoratie

      - de twee driehoekerkers naast de entree, elk met een balkon erboven

      - de Franse balkons en het sierhek aan De Lairessestraat

      '
    attributes:
      original_use: Scheepvaartmuseum
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/505472
