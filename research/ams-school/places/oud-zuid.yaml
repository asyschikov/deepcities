  nl:
    title: Woningen van Kramer, Heinzestraat
    summary: Vijf gespiegelde woningen van Piet Kramer (1921–1922) met driehoekige, naar binnen gevouwen
      portieken, draaiende houten halfzuilen en een terracotta muizetand als daklijst.
    body: 'Bouwondernemer J.Th. Boersma, ook opdrachtgever van Huize de Windroos, liet Piet Kramer in
      1921–1922 dit blok van vijf geschakelde woningen aan de Heinzestraat ontwerpen. Vier huizen hadden
      elk één bovenhuis, één had er twee; ze zijn paarsgewijs gespiegeld.


      Kramer gaf ook deze bescheiden woningen de volle expressieve behandeling: lichtbruine baksteen op
      een zwart gepleisterde plint, drie lagen onder een plat dak en een terracotta muizetand als daklijst.


      Let op:

      - de driehoekige, naar binnen gelegen ingangen met schuin tegen elkaar geplaatste deuren

      - de naar buiten draaiende houten halfzuilen naast de portieken

      - de terracotta muizetand langs de dakrand

      '
    attributes:
      original_use: Woningen met bovenhuizen
