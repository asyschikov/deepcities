  nl:
    title: Olympisch Stadion
    summary: Jan Wils' bakstenen stadion voor de Spelen van 1928, waar op de Marathontoren de eerste olympische
      vlam brandde; in 1987 van sloop gered en in 2000 in de vorm van 1928 hersteld.
    body: 'Jan Wils ontwierp het stadion voor de Olympische Spelen van 1928; het werd in 1927–1928 gebouwd
      en op 28 juli 1928 geopend. Het betonskelet is bekleed met zo''n twee miljoen bakstenen. Het register
      spreekt van een voor Wils typerende zakelijk-expressionistische trant: strakke horizontale lijnen,
      overstekende luifels en verspringende daken.


      Naast de Marathonpoort staat de 46 meter hoge Marathontoren, de ''leftoren'', waarop de eerste olympische
      vlam uit de geschiedenis brandde; op de balkons stonden bazuinblazers bij opening en sluiting. In
      1937 kwam er een tweede ring bij. In 1987 wilde de gemeente het stadion slopen voor woningbouw;
      het werd monument, en in 1998–2000 restaureerde André van Stigt de vorm van 1928. Ook Wils'' dienstwoningen
      aan het Stadionplein horen bij het complex.


      Let op:

      - de Marathontoren met getrapte bekroning, balkons en olympische ringen

      - de Marathonpoort met reliëfs van J.C. Altorf en namen van Nederlandse olympische kampioenen

      - de met baksteen beklede binnenring en de lange luifels

      '
