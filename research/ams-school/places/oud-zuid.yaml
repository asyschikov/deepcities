  nl:
    title: Harmoniehof
    summary: Middenstandswoningen van J.C. van Epen voor 'De Samenwerking' (1919–1926) rond een besloten
      plantsoen met vijvers en een fontein uit 1925.
    body: 'De Amsterdamsche Coöperatieve Woningvereeniging De Samenwerking bouwde dit complex tussen Roelof
      Hartstraat, Hobbemakade, Reijnier Vinkeleskade en Joh. M. Coenenstraat. J.C. van Epen ontwierp het
      grootste deel, samen met M.J.E. Lippits, in 1919–1923; B. van den Nieuwen Amstel voegde in 1925–1926
      het noordwestelijke blok toe.


      In het midden ligt de stille Harmoniehof met drielaagse blokken en vier dubbele woonhuizen. Het
      rechthoekige plantsoen in nieuw-architectonische tuinstijl heeft drie verbonden achthoekige vijvers
      en een conische fontein met dierfiguren en een tekstfries, in 1925 aan het bestuur van De Samenwerking
      aangeboden ter afsluiting van het werk. Aan de Roelof Hartstraat en de Hobbemakade is het buitenblok
      vijf lagen hoog met winkels en een toren van zes lagen op de hoek.


      Let op:

      - Van Epens erkers met steunberen, lange trappenhuisramen en kleine vensters in wisselende vormen

      - de fontein en vijvers in het plantsoen

      - de hoektoren aan de Roelof Hartstraat en de rondboogpoorten naar de binnentuinen

      '
    attributes:
      client: Woningvereeniging De Samenwerking
      original_use: Middenstandswoningen en winkels
