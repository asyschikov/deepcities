  nl:
    title: Atelierwoningen Jacob Obrechtstraat
    summary: Verscholen reeks van vijf atelierwoningen (1917) van J.M. van der Mey, bereikbaar via de
      poort van Oldenhoeck, elk met een groot atelierraam op het noorden.
    body: 'Op een binnenterrein achter de Jacob Obrechtstraat, bereikbaar door een poort tussen de nummers
      55 en 67, bouwde J.M. van der Mey in 1917 voor de NV Bouwmaatschappij De Lairesse een sprongsgewijs
      geplaatste reeks van vijf atelierwoningen. Het poortgebouw op nummer 67 heet Oldenhoeck.


      Het register spreekt van een sobere Amsterdamse Schooltrant. Elke woning staat op een bijna vierkante
      plattegrond in donkerbruine baksteen onder een plat dak, met op het noorden een naar binnen teruglopend
      achtruits atelierraam dat uitloopt in een geprofileerde gootlijst. Sommige deuren en ramen zijn
      later gewijzigd.


      Let op:

      - de poort aan de Jacob Obrechtstraat

      - de schuine atelierramen die trapsgewijs langs het binnenterrein staan

      '
    attributes:
      original_use: Atelierwoningen
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/505813
- title: Jacob Obrechtstraat 66–70
  summary: Three town houses (1923–1924) designed and built by developer H. van der Schaar in restrained
    Amsterdam School style, with lively brick bays and an inventive open-plan hall inside no. 66.
  body: 'H. van der Schaar, the developer behind several buildings in this part of the Concertgebouwbuurt,
    designed these three houses himself in 1923–1924. The city register calls no. 66 a successful example
    of restrained Amsterdam School architecture: carefully detailed, with expressive brickwork and bay
    windows giving a lively front.


    The greatest value is inside. As at De Lairessestraat 93, the ground floor centres on a large hall
    linked to the living rooms by glass pivoting walls with leaded glass, a flexible arrangement unusual
    for town houses of the time. The vestibule has marble cladding and the front room a carved chimneypiece.


    Look for:

    - the brick bay windows and patterned brickwork of nos. 66–70

    - leaded glass in the front door and transoms

    '
  category: housing
