- title: Rutgers block Apollolaan 175–185
  summary: A middle-class housing block by G.J. Rutgers (1927–1929) with stepped gables on the Apollolaan
    corner and high-quality sculpture by T.A. (Theo) Vos.
  body: 'Gerrit Jan Rutgers designed this U-shaped block of flats for the middle class, built 1927–1929,
    wrapping the Apollolaan, Raphaëlstraat and Titiaanstraat. It is three and four storeys high with attics
    under saddle roofs, in pink-brown brick.


    The register singles out the sculpture by Thomas Andreas (Theo) Vos (1887–1948), one of the "Amsterdam
    expressionists" whom Rutgers often asked for architectural sculpture; it calls the work characteristic
    of the great flowering of building sculpture between the wars and a good example of their close collaboration.


    Look for:

    - the big gables stepping one beside another at the corner of the Apollolaan and the Raphaëlstraat

    - Vos''s sculpture, including carved consoles under the projecting central bay

    - varied porches and original wooden windows with many-paned side lights

    '
