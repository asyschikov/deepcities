    summary: Piet Kramers brug uit 1927 (brug 116) over de Boerenwetering tussen Ceintuurbaan en Roelof
      Hartstraat, in baksteen en graniet met siersmeedwerk en waaiervormig bewerkte dekstenen.
    body: 'Al in 1876 waren er plannen voor een brug op deze plek, maar de huidige Ceintuurbrug dateert
      van 1927. Piet Kramer van Publieke Werken ontwierp haar als verbinding tussen de Ceintuurbaan en
      de Roelof Hartstraat over de Boerenwetering.


      Het is een plaatbrug met horizontaal en verticaal gemetselde baksteen in combinatie met graniet.
      Niet te verwarren met de brug waarmee de Ceintuurbaan over de Amstel gaat.


      Let op:

      - het afwisselend liggende en staande metselwerk

      - waaiervormig snijwerk op enkele granieten dekstenen

      - Kramers siersmeedijzeren leuningen

      '
