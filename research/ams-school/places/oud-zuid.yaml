- title: Amsterdams Lyceum
  summary: A monumental school by the Baanders brothers (1918–1920) that bridges the road like a city
    gate into Plan Zuid, with stained glass by R.N. Roland Holst and a Wright-inspired rector's house.
  body: 'The *Vereeniging Het Amsterdamsch Lyceum* commissioned Herman and Jan Baanders to build its school
    over the southern part of the Valeriusplein. Built in 1918–1920 and opened in 1919–1920, it was deliberately
    placed as a gateway: the road passes under its central block through two round-arched passages, and
    Berlage''s Plan Zuid begins on the other side. Piet Kramer''s Lyceumbrug (1926–1928) continues the
    axis across the canal.


    The national register calls the style sober (*verstrakt*) Amsterdam School. The symmetrical school
    is built of cubic brick volumes under flat roofs, with a central block between two projecting towers.
    Its stained-glass windows were designed by R.N. Roland Holst and placed in 1920, 1922 and 1927; he
    also made the glass mosaics in the assembly hall.


    On the corner with the De Lairessestraat stands the rector''s house *De Zonne-Wijzer* (the sundial),
    also by the Baanders brothers (1919), with clear influences of Frank Lloyd Wright.


    Look for:

    - the two arched passages under the school, and the towers either side

    - the decorative brick frieze running round the whole building

    - the Zonne-Wijzer''s deep porch, horizontal brick bands and overhanging cornice

    '
  category: schools
  lat: 52.351213
  lng: 4.865166
  address: Valeriusplein 13–15
