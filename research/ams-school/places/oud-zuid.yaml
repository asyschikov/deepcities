- title: VU laboratory De Lairessestraat
  summary: Chemistry and physics laboratory of the Free University (1930–1933) by B.T. Boeyinga — glass-brick
    stair tower, steel windows and Theo van Reyn sculpture, one of the last Amsterdam School works.
  body: 'Built for the new fourth faculty of the Vrije Universiteit, this laboratory was designed by B.T.
    Boeyinga with engineer I.J. Kranenburg and built in 1930–1933. It housed chemistry in one wing and
    physics in the other, on either side of a central stair. In 1951–1952 Boeyinga added two or three
    storeys in a plainer style and an observatory dome.


    The national register calls it expressive-functional (*zakelijk-expressionistisch*) and "one of the
    last representatives of the Amsterdam School", and values it together with the older physiological
    laboratory next door.


    Look for:

    - the stair tower on the De Lairessestraat with two vertical strips of glass bricks

    - the bronze name plaques "scheikundig laboratorium en natuurkundig laboratorium" and "vrije universiteit"
    on the canopy

    - two sculptures by Theo van Reyn referring to the labs, and four incised profile portraits beside
    the stairs

    '
  category: schools
  lat: 52.352195
  lng: 4.865756
  address: De Lairessestraat 176
