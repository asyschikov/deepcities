  nl:
    title: Gerrit van der Veen College
    summary: De voormalige meisjes-HBS uit 1929–1930 in late Amsterdamse Schooltrant, met een getrapte
      klokkentoren met bronzen beelden en een boogschutter als windwijzer.
    body: 'Het schoolgebouw uit 1929–1930 was het hoofdonderdeel van het complex van de voormalige meisjes-HBS.
      Het register beschermt het om de late Amsterdamse Schooltrant, het grotendeels gave interieur en
      het markante torensilhouet. In de oorlog was hier een hoofdkwartier van de Sicherheitsdienst; bij
      een luchtaanval op 26 november 1944 raakte de school zwaar beschadigd. Na de oorlog werden straat
      en school vernoemd naar beeldhouwer en verzetsman Gerrit van der Veen; zijn bronzen hoofdjes van
      Loeki van der Veen en prinses Juliana staan in de hal.


      Het donkerrode bakstenen gebouw heeft twee haaks op elkaar staande vleugels. Bij de hoofdingang
      rijst een trapsgewijs verjongende toren met wijzerplaten, balkonnetjes en bovenin twee bronzen beelden:
      een man met sikkel en pikhaak en een Amor.


      Let op:

      - de klokkentoren en de bronzen beelden

      - de vijfzijdige toren met een boogschutter als windwijzer

      - de sluitsteen met een kind aan het water en het beeld van een zittende vrouw met kind in de tuin

      '
    attributes:
      original_use: Meisjes-HBS
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/527773
