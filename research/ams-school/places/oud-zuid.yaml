- title: Vrijburg (Remonstrant church)
  summary: Jordanus Roodenburgh's Remonstrant church of 1932–1933, a tall saddle-roofed brick hall with
    a bell tower, a leaded-glass cross over the arched door and keystones by Louise Beijerman.
  body: 'The Remonstrant congregation, which had been meeting in the old church Vrijburg on the Keizersgracht,
    commissioned Jordanus Roodenburgh (1886–1972) to build a new church in Zuid, with catechism rooms
    and a sexton''s house on the Herman Gorterstraat. Built in 1932–1933 and opened on 18 June 1933, it
    carries on the name Vrijburg. The national register calls it late Amsterdam School.


    The brick church has a high, overhanging saddle roof of black tiles and low side wings. A bell tower
    with a spire rises above it.


    Look for:

    - the round-arched entrance with decorative brickwork and bronze letters "remonstrantse kerk"

    - the large cross in leaded glass above it

    - sculpted keystones by Louise Beijerman, and the oak doors with a radiating pattern

    '
