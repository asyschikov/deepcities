    title: Bouwblok Kuipers & Ingwersen, Olympiakade
    summary: Omvangrijk blok etagewoningen (1923–1925) van Tjeerd Kuipers en Arnold Ingwersen met E.A.C.
      Roest, met geknikte armen rond een driehoekig pleintje bij de Stadionweg.
    body: 'De architecten Tj. Kuipers en A. Ingwersen leverden, in samenwerking met E.A.C. Roest, het
      ontwerp voor dit blok, gebouwd in 1923–1925. Etagewoningen en een enkele winkel liggen rond een
      open binnenterrein op een onregelmatige U-vorm, waarvan de geknikte armen een driehoekig pleintje
      omsluiten. Het blok telt vier en vijf lagen onder platte daken, ontsloten volgens het portiekflatprincipe.
      Kuipers werkte veel voor gereformeerde opdrachtgevers.


      De massieve bouwmassa in bruine baksteen wordt geleed door risalieten; afgeschuinde hoeken markeren
      de straataansluitingen.


      Let op:

      - het driehoekige pleintje tussen de geknikte vleugels

      - portieken met siermetselwerk, glas-in-lood en sierroosters

      - de trasraamplint van verticaal gemetselde donkerbruine steen

      '
    attributes:
      original_use: Etagewoningen
    sources:
    - https://monumentenzoeker.amsterdam.nl/monument/222005
- title: Overtoomse Sluis
  summary: Piet Kramer's post-war bascule bridge (1948, bridge 199) over the Kostverlorenvaart, a late
    Amsterdam School design with a Hildo Krop sculpture recalling the old boat-hauling ramp.
  body: 'The Overtoomse Sluis links the Overtoom and the Amstelveenseweg, via the Surinamestraat and Surinameplein,
    across the Kostverlorenvaart on the old border between Oud-West and De Baarsjes. Here stood the original
    *overtoom*, a ramp where boats were hauled over the dike, and later a lock.


    The present bascule bridge dates from 1948 and was designed by Piet Kramer in his Amsterdam School
    manner — a late echo of the style just before his retirement. A sculpture by Hildo Krop commemorates
    the old overtoom and lock. Tram line 1 has crossed it since 1971.


    Look for:

    - Krop''s sculpture recalling the boat ramp

    - Kramer''s brick and stone bridge houses and railings

    '
