  nl:
    title: Villa's aan het Emmaplein
    summary: 'Twee generaties baksteenvilla''s in Willemspark: het rationalistische drievoudige villablok
      van J.F. Staal (1911) en de dubbele hoekvilla in verstrakte Amsterdamse School-stijl van Jan Juffer
      (1919).'
    body: 'Het Emmaplein ligt in Willemspark, het enige villapark dat in Amsterdam is gerealiseerd. Aan
      de westzijde staat een geschakelde drievoudige villa van J.F. Staal jr. uit 1911, in rationalistische
      trant ontworpen voor I.L. Nienaber. Staal verbouwde in 1913 de keukeningang tot ''automobielbewaarplaats'';
      in 1924 legde K. Perk Vlaanderen de tuin aan.


      Op de hoek met de Oranje Nassaulaan ontwierp Jan Juffer jr. in 1919 voor D.H. van Biema-Nykerk en
      D. de Vries een dubbele hoekvilla in verstrakte Amsterdamse School-stijl: vier bouwlagen onder een
      mansardekap met rode pannen, decoratief metselwerk en paraboolvormige topgevels. Bij nummer 3 hoort
      een gave garage uit 1920, bij nummer 5 een sierhekwerk op een bakstenen voet. De Gebr. van Gendt
      breidden het oostelijk deel in 1922 uit.


      Let op:

      - de paraboolvormige topgevels van nummer 3 en 5 en de zinken dakruiter

      - de vroege garage, een zeldzaam overblijfsel uit de begintijd van de auto

      - de strakke bakstenen gevels van Staal op nummer 2

      '
    attributes:
      original_use: Villa's
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/504589
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/504609
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/505331
- title: Garden house Oranje Nassaulaan 10
  summary: A tiny triangular garden pavilion by C.J. Blaauw (1925), painted yellow and dark green, tucked
    into the tip of a Willemspark back garden on the Koningslaan.
  body: 'The villa at Oranje Nassaulaan 10 is not itself protected, but the small summer house in the
    point of its back garden is. Cornelis Jonke Blaauw (1885–1947), best known for the Park Meerwijk villa
    village in Bergen, designed it in 1925 for A. von Saher Crone.


    It is built against the brick garden wall on a triangular plan, partly in brick and partly in overlapping
    weatherboarding, with an open part under a slate roof carried on wooden posts. The national register
    praises its finely detailed design and its Amsterdam School colours, and its setting in Willemspark,
    the only villa park built in Amsterdam.


    Look for:

    - the pointed slate roof just visible over the garden wall on the Koningslaan side

    - the yellow and dark green paintwork and the weatherboarded walls

    '
  category: houses
  lat: 52.354622
  lng: 4.861765
  address: Oranje Nassaulaan 10 (garden, Koningslaan side)
