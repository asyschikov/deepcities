    title: Vossius Gymnasium
    summary: Gymnasium van Nico Lansdorp (Publieke Werken, 1931–1932) in Late Amsterdamse School-stijl,
      met Hildo Krops Erasmus bij de ingang en werk van Rädecker, Theo Vos en anderen binnen.
    body: 'Vanwege de grote toeloop naar het Stedelijk Gymnasium aan de Weteringschans werd in 1926 een
      tweede gymnasium gesticht; beide scholen kregen toen de namen van de eerste twee hoogleraren van
      het Athenaeum. Het Vossius kreeg in 1931–1932 een eigen gebouw, ontworpen door Nicolaas Lansdorp
      van Publieke Werken in Late Amsterdamse School-stijl; het werd in 1933 in gebruik genomen.


      Het staat vrij op een vierkant terrein tussen vier straten, met conciërgewoning, tuin en speelterrein.
      Het register ziet het als exponent van een tijd waarin het sociaaldemocratische gemeentebestuur
      schoolbouw zeer belangrijk vond. Aan het interieur werkten D.K. Broos, J.M. Luttge, Leo Visser,
      Theo Vos, John en Willem Rädecker, Jan Heyens, H. Paulides en Hans Reicher mee.


      Let op:

      - Krops natuurstenen Erasmus links van de ingang, met de tekst ''Qui vitat molam, vitat farinam''

      - de lange lokalengevels

      '
    attributes:
      original_use: Gymnasium
