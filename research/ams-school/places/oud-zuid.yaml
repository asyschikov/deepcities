  nl:
    title: Villa den Tex (Apollolaan 1)
    summary: Woonhuis van Frans den Tex (1927–1928) in verstrakte Amsterdamse School-stijl, bezaaid met
      witte kalkstenen beeldjes van Hildo Krop – een harmonicaspelende faun, een wezel, een boogschutter.
    body: 'Op de hoek van de Apollolaan en de Bernard Zweerskade bouwde architect Frans den Tex in 1927–1928
      een woonhuis, op grond die zijn vader Karel den Tex in 1927 had gekocht. Hij ontwierp het in een
      verstrakte vorm van de Amsterdamse School, in geelbruine baksteen.


      Opvallend is het beeldhouwwerk van Hildo Krop, die talloze witte kalkstenen beeldjes ter plekke
      uithakte, vooral rond de garage. Hij liet zich inspireren door de kubusachtige beelden die Den Tex
      in Nederlands-Indië had gezien. Er zijn flora en fauna, een boogschutter, een harmonicaspelende
      faun met teckel – vermoedelijk een knipoog naar de architect – en een wezel, naar bouwondernemer
      Wezel. Aan de Bernard Zweerskade staat een splitskast van P.L. Marnette.


      Let op:

      - de witte beeldjes tegen de bruine baksteen, vooral bij de garage

      - de faun met trekharmonica en teckel, en de wezel

      '
    attributes:
      original_use: Woonhuis
    sources:
    - https://nl.wikipedia.org/wiki/Apollolaan_1_(Amsterdam)
    - https://monumentenzoeker.amsterdam.nl/monument/222011
- title: Villa Lebbink
  summary: 'Jo Mulder''s villa of 1925–1927 on the Apollolaan, built for an art-loving currency broker:
    low eaves, tall gables, bricks set at 45 degrees and a colourful stained-glass window.'
  body: 'Currency broker and art lover Christiaan Lebbink commissioned this free-standing villa, with
    J.F.J. Eyrond & Zn., from Jo (J.H.) Mulder jr., later a Public Works architect. Built in 1925–1927
    on the corner of the Apollolaan and the Albert Hahnplantsoen, it stood in still-rural surroundings
    when finished. Lebbink had the interior artistically furnished and lived here for about ten years.
    Later residents included the architect Kees Spanjer and choreographer Beppie Blankert.


    The house has a cellar, ground floor, a floor partly in the roof and an attic, under a saddle roof
    of black glazed tiles, with an attached garage.


    Look for:

    - the low eaves against tall gables, and the asymmetric composition

    - bricks set at 45 degrees along the roof edge and herringbone brickwork high in the gable

    - the colourful stained-glass window and the brick garden wall

    '
