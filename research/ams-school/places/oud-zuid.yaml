  nl:
    title: Woningen La Croix, Cornelis Schuytstraat
    summary: L-vormig blok van vijf eengezinswoningen (1917) van G.F. La Croix, met paraboolvormige, geknikte
      entrees, bewerkte raamposten en een tuinhek in Amsterdamse School-stijl.
    body: 'Tegenover zijn scheepvaartmuseum bouwde La Croix in 1917 voor dezelfde opdrachtgever, H. van
      der Schaar, vijf geschakelde eengezinswoningen op een L-vormig terrein op de hoek van de Cornelis
      Schuytstraat en de J.J. Viottastraat. In 1977 werd een deel dependance van een meisjesschool.


      De woningen tellen drie lagen onder een geknikt pannendak met bewerkte gootlijst en fries. Kenmerkend
      voor de expressieve periode: overal decoratief metselwerk, ruitvormig onderverdeelde bovenlichten
      en raamposten met snijwerk.


      Let op:

      - de diepe, paraboolvormige en geknikte entree met een bovenlicht met Andreaskruis

      - de licht uitkragende driehoekerkers met bewerkte posten

      - het tuinhek aan de Cornelis Schuytstraat

      '
    attributes:
      original_use: Eengezinswoningen
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/505567
