  nl:
    title: Europaschool (Hygiëaplein)
    summary: Lagere school met gymnastieklokaal uit 1921 van Nico Lansdorp (Publieke Werken) aan het Hygiëaplein,
      in gele baksteen, met reliëftegels naar ontwerp van Hildo Krop.
    body: 'N. Lansdorp, van 1920 tot 1932 architect bij de Dienst Publieke Werken, ontwierp deze school
      voor lager onderwijs met aangebouwd gymnastieklokaal in 1921. Ze staat in de zuidoostelijke wand
      van het Hygiëaplein; een tussenlid verbindt de gymzaal met de achtergevel, met aan weerszijden een
      speelplaats.


      Het symmetrische gebouw van drie lagen in gele baksteen onder een plat dak eindigt in een fries
      van siermetselwerk en een decoratieve betonnen afdeklijst. In het trappenhuis zit een muurschildering
      uit de bouwtijd van Jezus met spelende kinderen, gesigneerd J. Froquet, en reliëftegels naar ontwerp
      van Hildo Krop. Het register noemt de school een zeer gaaf voorbeeld, in- en uitwendig, van een
      openbaar schoolgebouw in Amsterdamse School-stijl. Verderop aan het plein bouwde Publieke Werken
      in 1924 nog een school.


      Let op:

      - de symmetrische voorgevel van zo''n dertig meter

      - het fries van siermetselwerk en de betonnen afdeklijst

      '
    attributes:
      original_use: Lagere school met gymnastieklokaal
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/527851
- title: Olympia (HAGA blocks)
  summary: 'Jan Gratama''s workers'' housing of 1924–1926 around the Marathonweg: 572 homes and 28 shops
    in five closed blocks joined by elliptical gateways with carved keystones.'
  body: 'Jan Gratama (1877–1947) supervised the building of the Stadionbuurt for the city in 1920–1924
    and at the same time designed this complex for NV Bouw- en Exploitatie Mij. H.A.G.A., a company in
    which he was himself a partner — which caused controversy in the professional press. Built in 1924–1926,
    it has 572 homes and 28 shop-homes in five closed blocks, in two ensembles either side of the Marathonweg,
    linked by gateways across the Theseusstraat, Simsonstraat and Sportstraat. It is known as Olympia.


    Gratama was then seen as one of the leaders of the Amsterdam School, though his work is more restrained
    than De Klerk''s or Kramer''s; by the late 1920s he turned to historical architecture and became a
    fierce critic of modernism.


    Look for:

    - the gateways shaped as flattened elliptical arches, with carved sandstone keystones by C.J. Hassoldt,
    Jan Trapman and Jaap Kaas, and granite bollards

    - the long street walls on the Olympiakade and Olympiaweg with small front lawns and trees

    '
