  nl:
    title: Huize Lydia
    summary: 'Rooms-katholiek tehuis voor vrouwen en meisjes (1924–1927) van Jan Boterenbrood: een U-vormig
      bakstenen gebouw van zes à zeven lagen rond een groene binnenhof aan het Roelof Hartplein.'
    body: 'De afdeling Amsterdam van de Roomsch-Katholieke Internationale Vereeniging tot bescherming
      van Meisjes liet dit tehuis bouwen naar ontwerp van J. Boterenbrood, in verstrakte Amsterdamse School-stijl;
      het betonwerk was van ir. K. Bakker. Het gebouw werd op 23 mei 1927 geopend en telde 158 slaapkamers;
      ook verpleegsters van het nabijgelegen Onze Lieve Vrouwe Gasthuis woonden er.


      De U-vorm omsluit een groene binnenhof voor licht en lucht. In de oorlog aten er dagelijks leden
      van de SD. In 1980 kocht de gemeente het gebouw voor huisvesting van bijzondere doelgroepen; nu
      zitten er woningen, een buurthuis en schaakclub Caïssa.


      Let op:

      - de diepe hoofdingang onder een gemetselde luifel op twee natuurstenen consoles, met een stoep
      van acht treden

      - de gevel van zes lagen aan het Roelof Hartplein met gemetselde attiek

      '
    attributes:
      client: R.K. Internationale Vereeniging tot bescherming van Meisjes (afd. Amsterdam)
      original_use: Tehuis voor vrouwen en meisjes
    sources:
    - https://nl.wikipedia.org/wiki/Huize_Lydia
