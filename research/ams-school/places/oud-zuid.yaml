- title: Apollolaan 191 (Van Anrooy)
  summary: A narrow five-storey building of four luxury flats (1928–1930) by H.A. van Anrooy, sober Amsterdam
    School with New Objectivity touches and asymmetric block-bond brickwork.
  body: 'H.A. van Anrooy designed this asymmetrical building of four apartments, one per floor, in the
    south wall of the Apollolaan near the Olympiaplein. Built in 1928–1930, it is described by the national
    register as a representative example of sober Amsterdam School with New Objectivity (*Nieuwe Zakelijkheid*)
    elements, typical of the architect''s work.


    The front is mostly purple-brown brick with recessed joints, but the ground floor and part of the
    first floor are laid in grey-brown brick in an asymmetric block bond, which continues into the raised
    front step.


    Look for:

    - the block-bond brickwork at the base and in the step

    - the geometric square pattern on the right of the ground floor

    - the steep roof of glazed tiles parallel to the street

    '
