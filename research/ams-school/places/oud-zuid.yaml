  nl:
    title: Herenhuizen van Rutgers, Hacquartstraat
    summary: Kubische, soms afgeronde herenhuizen van G.J. Rutgers (1923–1925) op de vliegervormige hoek
      van Reijnier Vinkeleskade, Hacquartstraat en Cornelis Schuytstraat, met zandstenen dier- en vogelreliëfs.
    body: 'Tussen 1923 en 1925 ontwierp G.J. Rutgers rond de hoek van de Cornelis Schuytstraat en de Hacquartstraat
      een reeks herenhuizen in Amsterdamse School-stijl voor verschillende opdrachtgevers: J. Vegersteen
      (vier geschakelde woningen, 1923–1924), NV Zuiderkwartier, G. Kroese, J.H. Werner jr. van NV Holland,
      J. Warners en Rutgers zelf (Reijnier Vinkeleskade 80).


      De huizen zijn samengesteld uit kubische, aan de voorzijde soms afgeronde volumes met in- en uitspringende
      gevelvlakken, in rode baksteen met platte daken en gepleisterde daklijsten en attieken. De portieken
      zijn bekleed met bewerkte zandsteen met laagreliëfs.


      Let op:

      - de vijfhoekige erker van Cornelis Schuytstraat 69 met rond balkon en zandstenen vogelreliëfs

      - de twee dierreliëfs naast het portiek van hetzelfde huis

      - de portieken met afgeronde hoeken en betegelde stoepen aan de Hacquartstraat

      '
