- title: Lutherkapel
  summary: G.J. Rutgers' Lutheran chapel (1929–1930) on a Greek-cross plan, its high roofs and tower marking
    the corner of the Bachstraat; inside, an intact interior with coloured glass and dark wood.
  body: 'The fund of the Restored Evangelical Lutheran congregation for a building in the southern district
    commissioned Gerrit Jan Rutgers in 1928 to design a whole street wall with 58 houses, shops and a
    church. The chapel was finished in 1929–1930, a little behind schedule, together with a club house
    and a former sexton''s house.


    Rutgers worked out the Greek-cross plan as an accent at the crossing of the Bachstraat and the Gerrit
    van der Veenstraat. The high roofs and the tower dominate an exterior of red brick, natural stone,
    red tiles and copper. The city register calls the rare, intact interior — open roof, surrounding gallery,
    pyramid- and lozenge-shaped windows, coloured glass, dark wood and period light fittings — a unique
    period document in the spirit of the Amsterdam School leaning towards Art Deco.


    Look for:

    - the porch with two sturdy columns built out beyond the building line

    - the wide, fanning pyramidal window in the gable on the Gerrit van der Veenstraat

    - the tower, a landmark for the neighbourhood

    '
