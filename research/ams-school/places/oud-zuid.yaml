  - commons:File:Huis De Windroos, Okeghemstraat 25.JPG
- title: ULO school Cornelis Krusemanstraat
  summary: A Public Works school of 1920 in the sober Amsterdam School style, built of brick volumes of
    two and three storeys at the corner of the Okeghemstraat.
  body: 'The city''s Public Works department (*Dienst der Publieke Werken*) designed this school for extended
    primary education (*Uitgebreid Lager Onderwijs*, ULO) in 1920, at the corner of the Cornelis Krusemanstraat
    and the Okeghemstraat, just west of the Valeriusplein. It is one of the many schools Public Works
    built in the style as Amsterdam expanded.


    The building is composed of several brick volumes of different heights under flat roofs, alternating
    two and three storeys. On the Cornelis Krusemanstraat a two-storey wing on a dark brick plinth has
    a row of nine identical tall windows, each made of three stacked cross-frames: a sash at the bottom,
    a pivoting window at the top.


    Look for:

    - the regular row of tall classroom windows on the ground floor

    - the triple windows on the upper floor that cut through the band between the storeys

    '
  category: schools
  lat: 52.351546
  lng: 4.863298
  address: Cornelis Krusemanstraat 10
