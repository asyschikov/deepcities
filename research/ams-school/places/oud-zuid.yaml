  nl:
    title: Gemeentelijk Meisjeslyceum (Reijnier Vinkeleskade)
    summary: Het eerste gemeentelijke lyceum voor meisjes (1925) van Publieke Werken, met een sculpturale
      middenpartij waar Hildo Krops granieten beelden van de Arbeid en de Vrije Tijd de ingang bewaken.
    body: 'Het eerste Gemeentelijk Lyceum voor meisjes kreeg een prominente plek aan de Reijnier Vinkeleskade,
      aan het Noorder Amstelkanaal, geheel in de lijn van Berlages opvatting dat openbare gebouwen Plan
      Zuid moesten markeren. Het ontwerp kwam van Publieke Werken, waarschijnlijk van hoofdarchitect Nicolaas
      Lansdorp, bijgestaan door B.A. Lubbers; Krop noemde in zijn archief alleen Lansdorp.


      Het symmetrische gebouw van gele baksteen heeft een plat dak en vijf ongelijke traveeën, met het
      accent op de sculpturaal vormgegeven middenpartij. Bij het ontwerp hoort de conciërgewoning Heinzestraat
      13 (1925–1926). In de hal hangen zeven doeken van Maria Hubrecht over de geologische tijdperken,
      met dinosaurussen – een van de vroegste opdrachten van de gemeentelijke afdeling Kunstzaken.


      Let op:

      - de verhoogde ingang met zes treden en de gebeeldhouwde kapitelen van Hildo Krop

      - Krops granieten gevelbeelden de Arbeid en de Vrije Tijd

      '
    attributes:
      original_use: Meisjeslyceum
    sources:
    - https://monumentenzoeker.amsterdam.nl/monument/222128
