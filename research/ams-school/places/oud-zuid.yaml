- title: Lyceumbrug
  summary: Amsterdam's largest flat bridge (bridge 410, 1926–1928) by Piet Kramer, with Hildo Krop's family
    sculptures, parabolic bridge houses and boat landings with changing rooms hidden beneath.
  body: 'Piet Kramer (1881–1961) of the Public Works bridges department designed this bridge over the
    Noorder Amstelkanaal as the continuation of the axis through the Amsterdams Lyceum; engineer Cornelis
    Biemond did the structure. It opened in May 1928, before all of its sculpture was finished.


    The deck is barely curved. Kramer used his full repertoire: light-coloured brick alternating with
    stone blocks and keystones, expressionist wrought-iron railings (originally light, now canal green),
    and on the south side two boat landings ending in small parabolic bridge houses, one a toilet, one
    a boatman''s hut. A passage under the bridge links the landings; storage for canoes, changing rooms
    and a repair shop were built in. The landings were added at the request of the school''s headmaster,
    who wanted more exercise for his pupils.


    Hildo Krop carved four French limestone figures: on the lyceum side a mother with daughter (rose and
    swallow) and a father with son (cogwheel and gull); on the far side a boy and a girl, modelled on
    Krop''s own children.


    Look for:

    - Krop''s four figures on the pylons and keystones

    - the two parabolic bridge houses at the ends of the landings

    - the stepped brick walls enclosing the landings

    '
  category: bridges
  lat: 52.350728
  lng: 4.865245
  address: Olympiaplein / Pieter Lastmankade
  links:
