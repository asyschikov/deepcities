  nl:
    title: Willem de Zwijgerkerk
    summary: Hervormde kerk van Cornelis Kruyswijk (1931) aan de Olympiaweg, met hoge kap en ijle toren
      aan het Noorder Amstelkanaal en een gaaf interieur van Slavonisch eiken en gekleurd glas.
    body: 'In 1923 maakte de Nederlandse Hervormde gemeente bekend een kerk in Plan Zuid te willen bouwen.
      Cornelis Kruyswijk won de besloten prijsvraag. De kerk verrees in 1931, in één bouwblok met het
      wijkgebouw Moria aan de Speerstraat, twee pastorieën en een rusthuis (nu studentenhuis) aan de Olympiakade.


      Een pleintje voor de kerk geeft de toren ruimte tussen de belendende panden. Het gemeentelijk register
      noemt het interieur van kerk en dienstgebouw een uniek voorbeeld van geïntegreerde Amsterdamse School-vormgeving,
      met Slavonisch eiken, gekleurd glas-in-lood en tegelvloeren; orgel en preekstoel vormen één ensemble.
      De ramen van Kees Kuiler verbeelden Kerstmis, Pasen en Pinksteren. In het frontpaneel zit een reliëf
      van Theo van Reyn met de wapenspreuk van Willem de Zwijger: ''Saevis tranquillus in undis''.


      Let op:

      - de ijle toren boven Olympiaweg en kanaal

      - het reliëf met de wapenspreuk

      '
    attributes:
      client: Nederlandse Hervormde Gemeente
      original_use: Kerk, wijkgebouw en rusthuis
