    summary: Basculebrug van Piet Kramer uit 1948 (brug 199) over de Kostverlorenvaart, een naoorlogse
      echo van de Amsterdamse School, met een beeld van Hildo Krop dat aan de oude overtoom herinnert.
    body: 'De Overtoomse Sluis verbindt de Overtoom en de Amstelveenseweg via Surinamestraat en Surinameplein
      over de Kostverlorenvaart, op de grens van Oud-West en De Baarsjes. Hier lag ooit de overtoom waarmee
      schepen over de dijk werden getrokken, en later een sluis.


      De huidige basculebrug is in 1948 gebouwd naar ontwerp van Piet Kramer, in de stijl van de Amsterdamse
      School. Een beeld van Hildo Krop herinnert aan de oorspronkelijke overtoom en sluis. Sinds 1971
      rijdt tram 1 eroverheen.


      Let op:

      - Krops beeld dat de overtoom gedenkt

      - Kramers brugwachtershuisje en leuningen

      '
