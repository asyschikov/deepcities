  nl:
    title: Rutgers aan het Valeriusplein
    summary: G.J. Rutgers omzoomde het Valeriusplein met een dubbel woonhuis met Wrightiaanse invloeden
      (1925) en een groot bouwblok langs het Noorder Amstelkanaal met een ver zichtbare hoektoren.
    body: 'G.J. Rutgers ontwierp beide gebouwen in 1923, tegenover het Amsterdams Lyceum.


      Op de hoek van het Valeriusplein en de Cornelis Krusemanstraat staat een gespiegeld dubbel woonhuis
      (1925) voor J. Vegersteen jr., in verstrakte Amsterdamse School-stijl met Wrightiaanse invloeden:
      twee lagen onder een plat dak met overstekende daklijst, trechtervormige entrees in de afgeschuinde
      hoeken en een ommuring met een poort.


      Erachter ligt het blok tussen Cornelis Krusemanstraat, Okeghemstraat, Pieter Lastmankade en Valeriusterras
      (1925–1926, gefinancierd door NV de Aandacht): 27 percelen met etagewoningen en winkels rond een
      open binnenterrein. Elke zijde is anders uitgewerkt; aan de intieme Okeghemstraat is het blok een
      laag lager. Een teruggelegen toren op de hoek aan het kanaal is van ver te zien. Het gemeentelijk
      register wijst op de samenhang met het Lyceum en de Lyceumbrug.


      Let op:

      - de erker met vier gekoppelde vensters boven de entrees van Valeriusplein 42–44

      - de hoektoren aan de Pieter Lastmankade

      - de winkelpui onder een doorlopende luifel aan de Cornelis Krusemanstraat

      '
    attributes:
      client: J. Vegersteen jr.; NV de Aandacht
      original_use: Dubbel woonhuis; etagewoningen en winkels
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/505490
    - https://monumentenzoeker.amsterdam.nl/monument/222014
- title: Huize de Windroos (Het Zwarte Huis)
  summary: Piet Kramer's dark-brick block of flats of 1921–1922, bending with the kink in the Okeghemstraat
    — known locally as 'the Black House'.
  body: 'Builder J.Th. Boersma commissioned this block of flats from Piet Kramer in 1921; Kramer changed
    the front in 1922 to its present appearance. Officially named *Huize de Windroos* (the compass rose),
    it is known in the neighbourhood as *Het Zwarte Huis* for its dark brick.


    Five storeys high, it follows the kink in the Okeghemstraat between the Cornelis Krusemanstraat and
    the Lomanstraat. The national register calls it a fine example of Amsterdam School flats "from just
    after the short, very expressive early period", cleverly responding to its site. Later changes lowered
    the window frames (1934) and replaced the original Amsterdam School window joinery with plain three-pane
    windows; the hoisting beam is not original.


    Look for:

    - the way the façade folds around the bend in the street

    - the dark brick and the rhythm of the entrances

    '
  category: housing
  lat: 52.351726
  lng: 4.863031
  address: Okeghemstraat 25–27
