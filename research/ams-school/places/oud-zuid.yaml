- title: Olympic Stadium
  summary: Jan Wils' brick stadium for the 1928 Olympics, where the first Olympic flame burned on the
    Marathon Tower; saved from demolition in 1987 and restored to its 1928 form in 2000.
  body: 'Jan Wils (1891–1972) designed the stadium for the 1928 Summer Olympics; it was built in 1927–1928
    and opened on 28 July 1928. Its concrete structure is clad in about two million bricks. The national
    register describes the style as Wils'' typical expressive-functional (*zakelijk-expressionistisch*)
    manner; English sources note how Wils adapted his earlier Frank Lloyd Wright-inspired ideas with clean
    horizontal lines, overhanging canopies and stepped roofs. It is often grouped with the Amsterdam School.


    Next to the Marathon Gate stands the 46-metre Marathon Tower (*Marathontoren*), nicknamed the *leftoren*;
    the first Olympic flame in history burned in the bowl on top. Trumpeters stood on its balconies at
    the opening and closing ceremonies. A second ring raised the capacity in 1937. In 1987 the city proposed
    demolition for housing; the stadium was listed instead, and in 1998–2000 the extra ring was removed
    and the 1928 form restored. Wils'' service buildings, such as the northern service house on the Stadionplein,
    belong to the complex.


    Look for:

    - the Marathon Tower with its stepped top, balconies and Olympic rings

    - the Marathon Gate with reliefs by J.C. Altorf and names of Dutch Olympic winners

    - the brick-clad inner ring and the long canopies

    '
  category: culture
