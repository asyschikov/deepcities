  nl:
    title: Woningblok Boterenbrood, Apollolaan
    summary: Dertig etagewoningen voor de hogere middenstand (1928–1929) van Jan Boterenbrood, geknikt
      met de Apollolaan onder zeer steile daken; een gedenksteen noemt bouwer en architect.
    body: 'Tussen Gerrit van der Veenstraat, Apollolaan en Bachstraat werd in 1928–1929 een blok met dertig
      etagewoningen gebouwd naar ontwerp van J. Boterenbrood, in opdracht van de NV Bouwmij De Vier en
      NV Sellmeyer''s Bouwmij. Het register noemt het een gaaf en representatief voorbeeld van expressief
      gedetailleerde etageportiekwoningen voor de hogere middenstand, met een markante ligging bij de
      knik in de Apollolaan.


      Het onderkelderde blok telt een begane grond, drie verdiepingen en een zolder, onder zadeldaken
      met zeer steile schilden.


      Let op:

      - de gedenksteen tussen nummer 39 en 41: "gebouwd door J.B. Sellmeijer & Zn anno 1928-1929 arch.
      J. Boterenbrood"

      - de knik van het blok mee met de laan

      '
