- title: Rutgers town houses Hacquartstraat
  summary: G.J. Rutgers' cubic, partly rounded town houses of 1923–1925 on the kite-shaped corner of Reijnier
    Vinkeleskade, Hacquartstraat and Cornelis Schuytstraat, with sandstone animal and bird reliefs.
  body: 'Between 1923 and 1925 Gerrit Jan Rutgers designed a cluster of town houses (*herenhuizen*) around
    the corner of the Cornelis Schuytstraat and the Hacquartstraat, for several clients: J. Vegersteen
    (four linked houses, 1923–1924), NV Zuiderkwartier, G. Kroese, J.H. Werner jr. of NV Holland, J. Warners,
    and Rutgers himself, who took Reijnier Vinkeleskade 80.


    The houses are composed of cubic volumes, sometimes rounded at the front, with stepping wall planes
    in red brick, flat roofs and plastered cornices and attics. It is a good place to see how Rutgers
    worked with sculptors: the porches are lined with carved sandstone blocks in low relief.


    Look for:

    - the five-sided bay at Cornelis Schuytstraat 69, with a round balcony above and sandstone reliefs
    of birds beside the middle window

    - two sandstone animal reliefs flanking the porch of the same house

    - recessed porches with rounded corners and tiled steps at Hacquartstraat 30–32, and the carved house
    number ''32''

    - the wooden garden fence on the Cornelis Schuytstraat

    '
