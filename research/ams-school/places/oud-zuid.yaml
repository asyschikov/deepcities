- title: Kuipers & Ingwersen block Olympiakade
  summary: A large block of flats (1923–1925) by Tjeerd Kuipers and Arnold Ingwersen with E.A.C. Roest,
    its kinked wings wrapping a small triangular square at the Stadionweg.
  body: 'Tjeerd Kuipers and Arnold Ingwersen, working with E.A.C. Roest, designed this extensive block,
    built in 1923–1925. Flats and a single shop surround an open courtyard on an irregular U-plan whose
    kinked arms frame a small triangular square. The block has four and five storeys under flat roofs,
    with porch stairs serving the upper flats (the *portiekflat* principle). Kuipers often worked for
    Reformed (*gereformeerde*) clients.


    The massive brown-brick volume is articulated by projecting bays, and chamfered corners mark each
    street junction.


    Look for:

    - the triangular square framed by the kinked wings

    - porches and entrances enlivened with decorative brickwork, leaded side lights and grilles

    - the dark-brown brick plinth laid vertically

    '
