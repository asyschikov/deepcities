  nl:
    title: Villa Insinger
    summary: 'Vrijstaande villa van Groenendijk & Lammers (1917–1918) aan een vijver in Willemspark: vier
      bouwvolumes rug aan rug onder geknikte wolfsdaken.'
    body: 'F. Insinger liet deze villa in 1917–1918 bouwen naar ontwerp van Groenendijk & Lammers, het
      bureau dat ook het laboratorium aan het Valeriusplein en huizenrijen aan de Koninginneweg en De
      Lairessestraat ontwierp. In 1948 werd oorlogsschade hersteld.


      De plattegrond is bijzonder: vier bouwvolumes van drie en vier lagen staan met de achterzijde tegen
      elkaar, onder een samenstel van geknikte wolfsdaken met rode pannen. Alle gevels hebben decoratief
      metselwerk, ook de schoorstenen. De west- en zuidzijde liggen aan een vijver.


      Let op:

      - de inpandige rondboogentree met eikenhouten deur, glas-in-lood en twee natuurstenen consoles

      - het diamantvormige venster in de deur

      '
    attributes:
      original_use: Villa
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/505479
  photos:
  - commons:File:Amsterdam - Oranje Nassaulaan 63.JPG
- title: Villa Sophialaan 1–3
  summary: A hexagonal, flat-roofed villa by G. de Wilde (1919), with chamfered corners, stacked brick
    cornices and a stone relief of stylised waves and a mascaron.
  body: 'G. de Wilde designed this villa in 1919 for NV Technisch Bureau Visser. It stands on a six-sided
    plan with a flat roof, which gives it a compact, almost fortress-like silhouette among the pitched
    roofs of Willemspark. In 1935 J. Scheelbeek remodelled the interior, joining the two original houses
    and splitting them horizontally into flats.


    The light-brown brick walls are enlivened with projecting brick cornices at the top floor, patterned
    brickwork and vertically divided windows with their original glazing bars.


    Look for:

    - the broad projecting bay on the Sophialaan with two piers carrying a stone relief of stylised waves
    and a mask

    - the chamfered north corners

    - the ribbed bands of projecting brick around the top floor

    '
