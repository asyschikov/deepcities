  nl:
    title: Bachzaal (Amsterdamsch Conservatorium)
    summary: Conservatorium en muziekschool van Piet Vorkink (1930–1931) aan de Bachstraat, met een gehoorzaal
      die om zijn akoestiek bekendstaat – hier werden musici voor het Concertgebouworkest opgeleid.
    body: 'Piet Vorkink ontwierp in 1930 in opdracht van de vereniging Amsterdamsch Conservatorium een
      gebouw met conservatorium, muziekschool, dienstwoning en de gehoorzaal, de Bachzaal. Het ligt aan
      een klein vijfhoekig plein schuin tegenover de Eerste Montessorischool, in de geest van Berlage:
      ''open pleinen met openbare gebouwen, want plein en gebouw zijn er om elkaar''.


      Het voorgebouw heeft een sobere, vlakke gevel van okergele baksteen onder een rood pannendak, met
      doorlopende vensterreeksen; een dwarskap markeert de entree. Jan Zietsma beschreef in het Bouwkundig
      Weekblad van 1931 de geluiddempende constructies van de zaal. Het register noemt Vorkinks ontwikkeling:
      van de expressieve vormentaal van de Amsterdamse School naar een architectuur van vlakken onder
      invloed van Frank Lloyd Wright. Na het vertrek van het conservatorium in 2008 werd het een kinderdagverblijf.


      Let op:

      - de lange vensterreeksen en de dwarskap boven de ingang

      - de ligging aan het pleintje

      '
    attributes:
      original_use: Conservatorium, muziekschool en concertzaal
    sources:
    - https://nl.wikipedia.org/wiki/Bachzaal
    - https://monumentenzoeker.amsterdam.nl/monument/200601
- title: Stadionweg 44 (Harry Elte's house)
  summary: 'The house Harry Elte built for himself in 1928–1930: hand-made brick, a round-arched porch,
    green glass blocks by Berlage and leaded glass by Willem Bogtman.'
  body: 'Harry Elte, architect of the Jacob Obrechtplein synagogue, designed this house near the junction
    of the Stadionweg and the Diepenbrockstraat for himself, and its interior too. The national register
    calls it expressive-functional (*zakelijk-expressionistisch*).


    It is a three-storey house of hand-made brick on a projecting base of different brick, with an asymmetrical
    front. Elte''s teacher H.P. Berlage designed the glass building blocks in the front; Willem Bogtman
    made the leaded-glass panels.


    Look for:

    - the round-arched porch picked out in a different brick bond, with a round oak door

    - two rows of green (*Anna-groen*) glass blocks at street level

    - the projecting base in contrasting brick

    '
