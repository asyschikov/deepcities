  - commons:File:Valeriusplein t.o. 12.JPG
- title: Rutgers buildings at Valeriusplein
  summary: G.J. Rutgers framed the south-west of the Valeriusplein with a Wright-inspired double house
    (1925) and a large block along the Noorder Amstelkanaal whose corner tower is seen from far off.
  body: 'Gerrit Jan Rutgers designed both buildings in 1923 for the corner opposite the Amsterdams Lyceum.


    On the corner of the Valeriusplein and the Cornelis Krusemanstraat stands a mirrored double house
    (1925) for J. Vegersteen jr., in sober Amsterdam School style with Frank Lloyd Wright influences:
    two storeys under a flat roof with an overhanging wooden cornice, funnel-shaped entrances in the chamfered
    corners, and a walled garden with an Amsterdam School gate.


    Behind it, the block bounded by the Cornelis Krusemanstraat, Okeghemstraat, Pieter Lastmankade and
    Valeriusterras (1925–1926, financed by NV de Aandacht) holds 27 houses of flats with shops. Its four
    sides are each treated differently around an open courtyard; it is a storey lower on the quiet Okeghemstraat,
    and a set-back tower on the canal corner makes it visible from far away. The city register stresses
    its ensemble value with the Lyceum and the Lyceumbrug.


    Look for:

    - the oriel of four linked windows above the entrances of Valeriusplein 42–44

    - the tower on the Valeriusterras / Pieter Lastmankade corner

    - the shopfronts under a continuous canopy on the Cornelis Krusemanstraat

    '
  category: housing
  lat: 52.351497
  lng: 4.864311
