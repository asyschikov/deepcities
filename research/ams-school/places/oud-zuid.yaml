- title: Ceintuurbrug
  summary: Piet Kramer's 1927 bridge (no. 116) carrying the Ceintuurbaan over the Boerenwetering, in brick
    and granite with ornamental wrought-iron railings and fan-carved deck stones.
  body: 'Plans for a bridge here go back to 1876, but the present Ceintuurbrug dates from 1927, when Piet
    Kramer of the Public Works bridges department designed it to link the Ceintuurbaan with the Roelof
    Hartstraat over the Boerenwetering. It is one of roughly 220 bridges Kramer saw built.


    It is a plate bridge, faced in brick laid alternately horizontal and vertical, combined with granite.
    Do not confuse it with the bridge carrying the Ceintuurbaan over the Amstel, which has a different
    name and number.


    Look for:

    - the alternating horizontal and vertical brickwork

    - fan-shaped carving on some of the granite deck stones

    - Kramer''s wrought-iron railings

    '
