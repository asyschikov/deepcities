- title: Staal block Bronckhorststraat
  summary: '108 flats by J.F. Staal for ''De Samenwerking'' (1922–1924): a U-shaped block whose long façade
    is a strict modular grid of windows punctuated by block-shaped stair lights.'
  body: 'J. de Waal, for the cooperative housing association De Samenwerking, commissioned Jan Frederik
    Staal to design this U-shaped block on the Bronckhorststraat, Bartholomeus Ruloffsstraat and Joh.
    M. Coenenstraat; J.H. Struebe designed the concrete. Built in 1922–1924, it originally held 108 flats.
    The whole block was renovated and restored in 1986.


    It shows Staal moving from expressive ornament to a disciplined, almost abstract order. Four storeys
    under a flat roof, dark brick at the bottom and light brown above: the long façade on the Joh. M.
    Coenenstraat is a regular wall with rows of windows in a modular grid, its geometry accented by block-shaped
    stair windows above the entrances.


    Look for:

    - the grid of windows on the Joh. M. Coenenstraat

    - the cubic stair lights rising above the entrances

    - the contrast between the dark base and the lighter upper brick

    '
