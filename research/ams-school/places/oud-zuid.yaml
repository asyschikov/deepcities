  nl:
    title: Surinameplein (blokken Roodenburgh)
    summary: De kwartcirkelvormige woonblokken van Jordanus Roodenburgh (1927–1929) aan het ronde Surinameplein,
      met hoektorens en hoge sierwanden tussen de holle gevels.
    body: 'Het ronde Surinameplein markeert de grens tussen Zuid en De Baarsjes, waar Berlages Plan Zuid
      en het latere Algemeen Uitbreidingsplan van Van Eesteren elkaar raken. J. Roodenburgh, die bij de
      gebroeders Baanders en K.P.C. de Bazel had gewerkt, ontwierp de blokken in fasen: de Hoofdweg en
      de oostelijke kwartcirkel vanaf 1927, de zuidelijke kwartcirkel met Surinamestraat en Sloterkade
      in 1929.


      Het gemeentelijk register noemt de blokken kenmerkend voor de Amsterdamse School door de plastische
      elementen – de hoge sierwanden haaks op de holle bouwdelen, sierblokken en siermetselwerk – en de
      hoge pannendaken. Rode quasi-handvormsteen, sobere hardstenen details en robuuste hoektorens.


      Let op:

      - de hoge sierwanden tussen de gebogen gevels

      - de hoektorens

      - de blankhouten voordeuren met diagonaalroeden

      '
    attributes:
      original_use: Etagewoningen en winkels
    sources:
    - https://monumentenzoeker.amsterdam.nl/monument/222009
