  nl:
    title: Woningblok van Staal, Bronckhorststraat
    summary: '108 etagewoningen van J.F. Staal voor ''De Samenwerking'' (1922–1924): een U-vormig blok
      waarvan de lange gevel een streng modulair raster van vensters is.'
    body: 'J. de Waal liet namens De Samenwerking dit U-vormige blok aan de Bronckhorststraat, Bartholomeus
      Ruloffsstraat en Joh. M. Coenenstraat bouwen naar een ontwerp in Amsterdamse School-stijl van J.F.
      Staal; de betonconstructie was van J.H. Struebe. Het werd in 1922–1924 gebouwd met 108 etagewoningen
      en in 1986 gerenoveerd en gerestaureerd.


      Het blok telt vier lagen onder een plat dak; de begane grond is donker gemetseld, de verdiepingen
      lichtbruin. De lange gevel aan de Joh. M. Coenenstraat is een regelmatig muurvlak met rijen ramen
      in een geordend modulair rooster, waarvan de geometrie wordt geaccentueerd door de blokvormige traplichten
      boven de entrees.


      Let op:

      - het vensterraster aan de Joh. M. Coenenstraat

      - de blokvormige traplichten boven de ingangen

      '
    attributes:
      client: Amsterdamsche Coöperatieve Woningvereeniging De Samenwerking
      original_use: Etagewoningen
    sources:
