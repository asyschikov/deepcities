- title: De Lairessestraat 89–107
  summary: A row of restrained Amsterdam School houses by Groenendijk & Lammers (1918–1920); no. 93 keeps
    a rare open-plan ground floor with folding glass walls and leaded glass with snakes.
  body: 'Groenendijk & Lammers designed the row De Lairessestraat 89–107 as one composition, a link between
    the late-19th-century neighbourhood to the north and the planned extension to the south. The city
    register calls no. 93 a successful example of restrained (*ingetogen*) Amsterdam School architecture.


    Its real interest is inside. The Jewish couple Drilsma-Maykels, who commissioned it, departed from
    the plan of the other houses: a central hall connects to the other main rooms through concertina-like
    pivoting walls, mostly of glass, so the space could be opened up or divided. The leaded glass in these
    walls shows decoratively stylised snakes. Few such flexible wall systems from around 1920 survive.
    A similar hall plan appears at Jacob Obrechtstraat 66.


    Look for:

    - the unified row of brick fronts, with no. 93 among them

    - leaded glass visible in the door and windows

    '
