  nl:
    title: Hek Vondelpark Amstelveenseweg
    summary: Smeedijzeren parkhek in Laat-Amsterdamse School-trant (ca. 1925–1930) tussen taps toelopende
      betonnen pijlers, met een gedenksteen uit 1945 voor vier gefusilleerde verzetsstrijders.
    body: 'Het bestuur van de Vereeniging tot aanleg van een Rij- en Wandelpark liet dit hek aan de Amstelveenseweg
      vermoedelijk tussen 1925 en 1930 plaatsen. Het register noemt de trant Laat-Amsterdamse School.


      Het hekwerk van dubbele staven staat op een hoge, gecanneleerde plint van grofkorrelig beton tussen
      zware pijlers die zich naar boven verjongen. Er is een brede hoofdingang met voetgangersdoorgangen
      ernaast. In 1945 kwam in het midden een gedenksteen naar ontwerp van F. Jantzen, ter herinnering
      aan vier verzetsstrijders die hier werden gefusilleerd.


      Let op:

      - de taps toelopende betonnen pijlers en de gecanneleerde plint

      - de gedenksteen in het midden van het hek

      '
    attributes:
      original_use: Parkhek
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/504846
  photos:
  - commons:File:Amstelveenseweg tegenover 4.JPG
- title: Koninginneweg 50–60
  summary: Two groups of town houses by Groenendijk & Lammers (1914 and 1916) where brick corbels replace
    stone consoles — Nieuwe Kunst roots with the first Amsterdam School touches.
  body: 'Theo Groenendijk and Theo J. Lammers built these two linked groups of houses on the Koninginneweg
    in 1914 (nos. 56–60) and 1916 (nos. 50–54). They stand in the Concertgebouwbuurt, a neighbourhood
    of middle-class houses laid out after Amsterdam annexed the area in 1896.


    The city register describes a taut design that makes creative use of brick ornament. The decoration
    is rooted in the Nieuwe Kunst (Dutch Art Nouveau), but already shows Amsterdam School elements: the
    bay windows rest not on stone consoles but on corbels built up from many layers of brick laid flat
    and on edge, which the register calls typical of the new style. Lammers went on to build large Amsterdam
    School housing blocks in the 1920s.


    Look for:

    - the stepped brick corbels under the bay windows of nos. 50–54

    - the projecting cornice with patterned brickwork and the simple wooden gutter

    '
  category: housing
  lat: 52.353893
  lng: 4.865137
  address: Koninginneweg 50–60
