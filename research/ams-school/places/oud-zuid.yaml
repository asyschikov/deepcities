- title: Het Nieuwe Huis
  summary: 'A 1928 apartment hotel for single people on the Roelof Hartplein: 188 flats with a shared
    restaurant, reading room, shops and tower, by Barend van den Nieuwen Amstel.'
  body: 'In 1914 Miss Kruis came up with a plan for a building where unmarried people, who then had to
    rely on lodgings and boarding houses, could live independently. Her cooperative *Het Nieuwe Huis*
    realised it with the association De Samenwerking, and Barend van den Nieuwen Amstel designed it in
    the sober (*verstrakte*) Amsterdam School style. It was completed in 1927–1928.


    The building originally had 188 apartments of different types, plus a dining room for residents and
    one for the public, a reading room, shops, a post office, a cycle hall in the basement and a tower;
    the kitchen and some studios were in the attic. A branch of the cooperative kitchen supplied meals,
    an early form of meal service. A porter''s lodge still guards the entrance, and the public library
    has a branch on the ground floor.


    Look for:

    - the curved façade on the Roelof Hartplein, with stepped stair windows

    - the tower and the wings along the Gerard Terborgstraat and Roelof Hartstraat

    '
