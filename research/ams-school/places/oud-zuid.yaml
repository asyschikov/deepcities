- title: Villa Klatte
  summary: A free-standing villa of 1918–1919 by Harry Elte and G.F. Mastenbroek in an expressive-functional
    brick style, among the villas of the Cornelis Schuytstraat.
  body: 'S.R. Klatte commissioned this villa from Harry Elte (1880–1944) and G.F. Mastenbroek; the concrete
    work was by NV Gewapend Betonbouw De Kondor. Built in 1918–1919 of light-brown brick, it has a cellar,
    a raised ground floor, an upper floor and an attic.


    The national register describes it as *zakelijk-expressionistisch* (expressive-functional) — the cooler,
    more geometric branch of Dutch brick architecture that Elte, a pupil of Berlage, also used for the
    synagogue on the Jacob Obrechtplein. Its garden rises gently because the plot was slightly raised;
    only the square brick posts of the original wooden garden fence remain. The shutters were removed
    in 1949 to save on painting.


    Look for:

    - the compact, blocky massing and the light-brown brick

    - the bay on the north-east side, which replaced a planned veranda

    '
