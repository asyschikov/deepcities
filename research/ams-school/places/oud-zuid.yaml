  nl:
    title: Villa's van Warners, J.J. Viottastraat
    summary: Drie dubbele villa's (1925–1926) van F.A. Warners in verstrakte Amsterdamse School-stijl
      met duidelijke invloed van Frank Lloyd Wright, met tuinen tot aan het Noorder Amstelkanaal.
    body: 'F.A. Warners ontwierp deze dubbele villa''s in 1925–1926; A.F. Baak was constructeur van fundering
      en gewapend beton. Twee werden besteld door C. Schleicher (een deel van de opdracht ging over naar
      NV Aannemings Maatschappij voorheen J. Rozestraten), de derde door W. den Tex-Bondt. Voor dat laatste
      perceel bestond al een plan van Harry Elte uit 1920.


      Het register spreekt van verstrakte Amsterdamse School met herkenbare invloeden van Frank Lloyd
      Wright: in- en uitspringende kubische vormen, platte daken, horizontale roedenverdeling, vijfhoekige
      erkers en uitkragende lijsten met attiek. Eén woning heeft een inpandige garage naast de keuken.
      De achtertuinen grenzen aan het kanaal.


      Let op:

      - de vijfhoekige erkers en balkons van Cornelis Schuytstraat 72

      - siermetselwerk in blokmotief en de oorspronkelijke bloembak

      - de oude tuinmuur met houten poorten aan de J.J. Viottastraat

      '
