- title: Kinderbrug and Hildo Kropbrug (Muzenplein)
  summary: Piet Kramer's twin bridges around the Muzenplein (1926–1928, built 1930–1931), the 'Kinderbrug'
    ensemble, with Hildo Krop's children in boats, with squirrels and rabbits.
  body: 'Where the Zuider Amstelkanaal meets the Boerenwetering, Piet Kramer designed a small ensemble
    of two bridges, a quay wall and a transformer house around the Muzenplein. Designed in 1926–1928 and
    built in 1930–1931, it is known as the *Kinderbrug* (children''s bridge) complex after its sculpture.


    Bridge 419 crosses the Zuider Amstelkanaal from the Apollolaan; since 2004 it has been called the
    Hildo Kropbrug. On two tall brick pylons on its south side Krop placed a girl and a boy, each in a
    stylised boat (1932). Bridge 420 (the Kinderbrug proper) crosses the Boerenwetering, its abutments
    dated ANNO 1930; Krop''s sculptures show a girl with squirrels and a boy with rabbits, and on the
    north side a 10-metre Bavarian granite pier crowned with his sculpture. A small brick transformer
    house of the electricity company, with a zinc pyramid roof, ends the quay wall, and by bridge 419
    stands the former building of the city''s planting department.


    Look for:

    - Krop''s children in boats on the two pylons of bridge 419

    - the girl with squirrels and boy with rabbits on bridge 420, and the tall granite pier

    - the transformer house with its overhanging pyramid roof and St Andrew''s-cross vents

    '
