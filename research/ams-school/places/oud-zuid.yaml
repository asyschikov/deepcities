  nl:
    title: Tuinhuis Oranje Nassaulaan 10
    summary: Een klein driehoekig tuinhuis van C.J. Blaauw uit 1925, geel en donkergroen geschilderd,
      in de punt van een achtertuin aan de Koningslaan.
    body: 'De villa Oranje Nassaulaan 10 zelf is niet beschermd, het tuinhuis achterin wel. C.J. Blaauw,
      bekend van villapark Meerwijk in Bergen, ontwierp het in 1925 voor A. von Saher Crone.


      Het staat op een driehoekige grondslag tegen de gemetselde tuinmuur: deels steen, deels gepotdekseld
      hout, met een open gedeelte onder een afdak op houten kolommen en een zadeldak van leien. Het register
      prijst de fijne detaillering en de kleurstelling in Amsterdamse School-stijl, en de ligging in het
      enige Amsterdamse villapark.


      Let op:

      - het leien dak boven de tuinmuur aan de Koningslaan

      - het geel en donkergroen van het houtwerk

      '
    attributes:
      original_use: Tuinhuis
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/505220
- title: Villa Insinger
  summary: A free-standing brick villa by Groenendijk & Lammers (1917–1918), four volumes back to back
    under folded hipped roofs, on a pond on the Oranje Nassaulaan.
  body: 'F. Insinger commissioned this villa from the partnership of Theo Groenendijk and Theo J. Lammers,
    who also built the laboratory on the Valeriusplein and the house rows along the Koninginneweg and
    De Lairessestraat. Built in 1917–1918, it is one of the more expressive villas of Willemspark.


    The plan is unusual: four building volumes set back to back, of three and four storeys, under a cluster
    of folded (*geknikte*) hipped roofs in red tile. Every façade has decorative brickwork, and the patterned
    chimneys are part of the composition. The west and south sides overlook a pond. War damage was repaired
    in 1948.


    Look for:

    - the round-arched entrance with an oak door, side lights and leaded glass, set between two flat stone
    consoles

    - the diamond-shaped window in the door

    - decorative brick chimneys on the folded roofs

    '
  category: houses
  lat: 52.353801
  lng: 4.858927
  address: Oranje Nassaulaan 63
  links:
