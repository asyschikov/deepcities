  - commons:File:Gerrit van der Veenstraat 99.JPG
- title: Boterenbrood block Apollolaan
  summary: Thirty flats for the upper middle class (1928–1929) by Jan Boterenbrood, bending with the kink
    in the Apollolaan under very steep roofs; a stone records builder and architect.
  body: 'Jan Boterenbrood designed this V-shaped block between the Gerrit van der Veenstraat, the Apollolaan
    and the Bachstraat, built in 1928–1929 by NV Bouwmij De Vier and NV Sellmeyer''s Bouwmij. Its thirty
    flats for the upper middle class are reached by shared porches.


    The national register praises it as an intact, representative example of expressively detailed porch
    flats and as a landmark at the kink in the Apollolaan. The block has a ground floor, three upper floors
    and an attic, under very steep saddle roofs.


    Look for:

    - the stone between nos. 39 and 41: "gebouwd door J.B. Sellmeijer & Zn anno 1928-1929 arch. J. Boterenbrood"

    - how the block bends with the Apollolaan

    - the steep roofs sweeping down over the top floor

    '
