  nl:
    title: Westhove
    summary: 'Een van de eerste appartementengebouwen van Nederland (1920–1923): F.A. Warners'' U-vormige
      flat met zestien woningen rond een gemeenschappelijke tuin.'
    body: 'H.K. Westendorp liet dit flatgebouw bouwen naar een ontwerp in verstrakte Amsterdamse School-stijl
      van F.A. Warners; constructeur was E. Handl. Het werd in 1920–1923 opgetrokken en bevat zestien
      appartementen. In het midden geeft een poort toegang tot een gemeenschappelijk binnenterrein. Het
      register waardeert het als een van de eerste appartementengebouwen in Nederland.


      De U-vormige flat staat op een sokkel van gesmoorde Groningse klinkers en telt een souterrain en
      vier verdiepingen; de twee hoekpaviljoens zijn hoger, met een zolderverdieping. Bronskleurige betonranden
      lopen rond langs het platte dak.


      Let op:

      - de twee hogere hoekpaviljoens rond de voortuin

      - de poort naar het binnenterrein

      '
    attributes:
      original_use: Appartementengebouw
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/505891
