  nl:
    title: Toiletgebouwen Valeriusplein
    summary: Twee spiegelbeeldige, half verdiepte openbare toiletten van gegoten beton in vloeiende lijnen
      (1922), met smeedijzeren hekken in expressionistische trant en een bijpassende bank.
    body: 'J. de Meyer ontwierp in 1922 voor de Dienst der Publieke Werken twee identieke toiletgebouwen
      aan de noordzijde van het Valeriusplein, samen met het hekwerk rond het plantsoen en een zitbank
      aan de zuidzijde.


      De gebouwtjes liggen half onder het maaiveld en zijn via een trap bereikbaar. Ze zijn geheel van
      gegoten beton, in vloeiende en golvende lijnen, onder een plat dak met brede overstek. De privaten
      zijn al lang buiten gebruik en ter voorkoming van misbruik met beton volgestort.


      Let op:

      - de golvende betonvormen, links en rechts gespiegeld

      - de dubbele deuren met een halfkolom ertussen en decoratieve roedenverdeling

      - de smeedijzeren afsluithekken en het halfronde sierhek

      '
    attributes:
      original_use: Openbare toiletten, hekwerk en bank
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/505846
