  nl:
    title: ULO-school Cornelis Krusemanstraat
    summary: School voor uitgebreid lager onderwijs van Publieke Werken (1920) in verstrakte Amsterdamse
      School-stijl, opgebouwd uit bakstenen volumes van twee en drie lagen.
    body: 'De gemeentelijke Dienst der Publieke Werken ontwierp deze ULO-school in 1920, op de hoek van
      de Cornelis Krusemanstraat en de Okeghemstraat, vlak bij het Valeriusplein.


      De school bestaat uit meerdere bakstenen bouwvolumes van verschillende hoogte onder platte daken,
      afwisselend twee en drie lagen. Aan de Cornelis Krusemanstraat heeft de tweelaagse vleugel boven
      een donkere plint negen gelijke, hoge vensters, elk opgebouwd uit drie kruiskozijnen boven elkaar:
      onderin een schuifraam, bovenin een tuimelraam.


      Let op:

      - de regelmatige reeks lokaalvensters op de begane grond

      - de drielingvensters op de verdieping die door de cordonband snijden

      '
