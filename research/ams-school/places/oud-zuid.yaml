- title: Huize Lydia
  summary: 'A Catholic residence for young women (1924–1927) by Jan Boterenbrood: a U-shaped, six- to
    seven-storey brick block around a green courtyard on the Roelof Hartplein.'
  body: 'The Amsterdam branch of the Roman Catholic international association for the protection of girls
    commissioned Jan Boterenbrood (1886–1932) to design a home for women and girls. Built in 1924–1927
    in sober (*verstrakte*) Amsterdam School style, it opened on 23 May 1927 with 158 bedrooms; nurses
    from the nearby Onze Lieve Vrouwe Gasthuis lived here too. The concrete work was designed by K. Bakker.


    The U-shaped plan wraps a green inner court to bring light and air into the building. During the war
    German security service staff took their meals here. The city bought it in 1980 for special housing;
    today it holds homes, a community centre and the chess club Caïssa.


    Look for:

    - the deep main entrance under a broad brick canopy on two carved stone consoles, reached by eight
    steps

    - the six-storey front on the Roelof Hartplein with a straight cornice and brick attic

    '
