  nl:
    title: Hillehuis
    summary: 'Het eerste zelfstandige ontwerp van Michel de Klerk (1911–1912): een woningblok aan het
      Johannes Vermeerplein waarvan de hoekige, stekelige details de Amsterdamse School aankondigen.'
    body: 'Aannemer Klaas Hille nam een terrein in erfpacht dat van de Gabriël Metsustraat langs het Johannes
      Vermeerplein doorliep tot in de Nicolaas Maesstraat. Het ontwerp kwam van Michel de Klerk, die toen
      nog bij Herman Baanders werkte; het geldt als zijn eerste zelfstandige werk. Het blok werd in 1911
      begonnen en in 1912 opgeleverd.


      Het Rijksmonumentenregister spreekt van een trant "die met zijn hoekige en stekelige detaillering
      het begin van de Amsterdamse School aankondigt". Het ontwerp mengt nog neoclassicisme, rationalisme
      en de nieuwe stijl. Een doorlopend balkon, de ornamentiek en het dak binden de gevel aan het plein
      en de twee zijvleugels tot één geheel – opvallend in een straat waar verder ieder pand afzonderlijk
      werd ontworpen. Later toegevoegde dakkapellen en vervangen balkonconsoles hebben die eenheid wat
      aangetast.


      Let op:

      - het lange balkon aan het Vermeerplein en het metselverband ervan

      - ornamenten in ijzer, steen en hout, en de jaartalstenen bovenin de gevel

      '
    attributes:
      client: Klaas Hille (aannemer)
      original_use: Woningen
    sources:
    - https://nl.wikipedia.org/wiki/Hillehuis
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/1108
- title: Emmaplein villas
  summary: 'Two generations of brick villas on a small Willemspark square: J.F. Staal''s rational triple
    villa of 1911 and Jan Juffer''s sober Amsterdam School double villa of 1919, with its garage, fence
    and parabolic gables.'
  body: 'The Emmaplein sits in Willemspark, the only villa park ever realised in Amsterdam. On its west
    side stands a linked triple villa by Jan Frederik Staal (1879–1940), built in 1911 for I.L. Nienaber
    in a rational style: plain brick, deep window reveals, horizontal sash windows. Staal later became
    one of the leading Amsterdam School architects, and the house shows where he started. In 1913 Staal
    turned its kitchen entrance into a garage, and in 1924 the garden was laid out by K. Perk Vlaanderen.


    Across the square, on the corner with the Oranje Nassaulaan, Jan Juffer jr. designed a double corner
    villa in 1919 for D.H. van Biema-Nykerk and D. de Vries, in the sober (*verstrakte*) Amsterdam School
    style. Each half rises four storeys under a red-tiled mansard roof, with decorative brickwork and
    a parabolic gable on the central bay. A separate brick garage (1920) and a decorative iron fence on
    a brick base belong to the ensemble; the Gebr. van Gendt extended the east half in 1922.


    Look for:

    - the parabolic gables of Emmaplein 3 and 5, and the swung gable with a zinc roof turret on number
    5

    - the early garage at number 3, a rare survivor from the first years of the car

    - the wrought-iron fence in front of number 5

    - Staal''s flat, disciplined brick fronts at Emmaplein 2 for comparison

    '
  category: houses
  lat: 52.354422
  lng: 4.863293
  address: Emmaplein 2, 3, 5
