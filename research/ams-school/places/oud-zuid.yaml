- title: Scheepvaartkundig Museum (De Lairessestraat)
  summary: 'Built in 1917–1920 by G.F. La Croix as a maritime museum, now an auction house: a red-brick
    block with giant pilasters, relief-decorated cornice and wave-carved window frames.'
  body: 'Developer H. van der Schaar Lzn. commissioned Guillaume Frédéric La Croix (1877–1923) to build
    a maritime museum (*Scheepvaartkundig Museum*) on the corner of the De Lairessestraat and the Cornelis
    Schuytstraat. It went up in 1917–1920 in the sober Amsterdam School style; a glass roof was added
    in 1929 for the Vereeniging Scheepvaart Museum. The building is now an auction house.


    The red-brick block of two storeys and an attic sits under a red-tiled mansard roof. Colossal brick
    pilasters and corner strips carry a projecting brick frieze and a cornice with relief decoration,
    and the windows are set in recessed wall panels.


    Look for:

    - the wooden window surrounds carved with a wave motif, a nod to the maritime purpose

    - the two triangular bay windows either side of the entrance, each with a balcony above

    - the decorative iron fence and French balconies on the De Lairessestraat side

    '
  category: culture
  lat: 52.353655
  lng: 4.872711
  address: Cornelis Schuytstraat 57
