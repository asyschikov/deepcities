- title: Westhove
  summary: 'One of the first apartment buildings in the Netherlands (1920–1923): F.A. Warners'' U-shaped
    block of 16 flats around a shared garden on the De Lairessestraat.'
  body: 'H.K. Westendorp commissioned this *flatgebouw* from Frederik Adriaan Warners (1888–1952); E.
    Handl was the engineer. Built in 1920–1923, it holds 16 apartments in a U around a shared front garden,
    with a central gateway to a common courtyard. The national register values it as one of the first
    apartment buildings in the country.


    The style is sober Amsterdam School: brick on a base of dark Groningen clinkers, a basement and four
    storeys, the two corner pavilions a storey higher. Continuous bronze-coloured concrete bands run round
    the flat roof.


    Look for:

    - the two taller corner pavilions framing the front garden

    - the central bay rising from the basement, and the gateway to the courtyard

    - the bronze-coloured concrete edges

    '
  category: housing
  lat: 52.351576
  lng: 4.865792
