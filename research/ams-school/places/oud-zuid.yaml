  nl:
    title: Villa Sophialaan 1–3
    summary: Zeshoekige villa met plat dak van G. de Wilde (1919), met afgeschuinde hoeken, uitkragende
      cordonlijsten en een reliëf van golven en een mascaron.
    body: 'G. de Wilde ontwierp deze villa in 1919 voor de NV Technisch Bureau Visser. Ze staat op een
      zeshoekige plattegrond onder een plat dak, wat haar tussen de kappen van Willemspark een gesloten,
      blokvormig silhouet geeft. In 1935 verbouwde J. Scheelbeek het interieur: de twee oorspronkelijke
      woningen werden samengevoegd en daarna horizontaal gesplitst.


      De lichtbruine bakstenen gevels zijn rond de bovenste verdieping voorzien van regelmatig uitkragende
      bakstenen cordonlijsten en verder verlevendigd met mondsteen en siermetselwerk.


      Let op:

      - de brede risaliet aan de Sophialaan met twee muurpijlers en een natuurstenen reliëf van gestileerde
      golven en een mascaron

      - de afgeschuinde noordelijke hoeken

      '
    attributes:
      original_use: Villa
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/505187
- title: Vondelpark gate Amstelveenseweg
  summary: A late Amsterdam School iron gate of c. 1925–1930 between tapering concrete piers, with a 1945
    memorial stone for four executed resistance fighters.
  body: 'The board of the association that ran the Vondelpark (*Vereeniging tot aanleg van een Rij- en
    Wandelpark*) placed this entrance on the Amstelveenseweg, probably between 1925 and 1930. The national
    register calls its design late Amsterdam School.


    The wrought-iron fence of paired bars stands on a high fluted base of coarse-grained concrete, between
    heavy concrete piers that taper towards the top. A wide central gate is flanked by pedestrian passages.
    In 1945 a memorial stone designed by F. Jantzen was set in the middle of the fence, in memory of four
    resistance fighters executed here.


    Look for:

    - the tapering piers and fluted base, both cast in rough concrete

    - the decorative tops of the iron bars

    - the 1945 memorial stone in the middle of the fence

    '
  category: public-works
  lat: 52.354938
  lng: 4.855757
  address: Amstelveenseweg, Vondelpark entrance
  links:
