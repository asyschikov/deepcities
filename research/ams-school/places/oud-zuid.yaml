- title: Surinameplein (Roodenburgh blocks)
  summary: Jordanus Roodenburgh's quarter-circle housing blocks of 1927–1929 on the round Surinameplein,
    with corner towers and tall decorative walls between the concave fronts.
  body: 'The round Surinameplein marks the border between Zuid and De Baarsjes, where Berlage''s Plan
    Zuid met the later General Extension Plan of Van Eesteren. Jordanus Roodenburgh (1886–1972), who trained
    with the Baanders brothers and K.P.C. de Bazel, designed the blocks around it in phases: the Hoofdweg
    side and the eastern quarter-circle from 1927, the southern quarter-circle, Surinamestraat and Sloterkade
    in 1929.


    The city register calls the blocks typical of the Amsterdam School for their plastic elements — the
    tall ornamental walls set at right angles between the concave sections, decorative blocks and brickwork
    — and their high tiled roofs. Red quasi-handmade brick, sober bluestone detailing and robust corner
    towers.


    Look for:

    - the tall decorative walls projecting between the curved sections

    - the corner towers

    - original light-wood front doors with diagonally barred door windows

    '
  category: housing
  lat: 52.357701
  lng: 4.854259
