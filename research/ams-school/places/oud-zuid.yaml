- title: Gemeentelijk Meisjeslyceum (Reijnier Vinkeleskade)
  summary: Amsterdam's first municipal girls' grammar school (1925) by Public Works, with a sculptural
    central entrance where Hildo Krop's granite figures of Work and Leisure stand guard.
  body: 'The first municipal lyceum for girls was given a prominent site on the Reijnier Vinkeleskade
    along the Noorder Amstelkanaal, in line with Berlage''s idea that public buildings should mark Plan
    Zuid. The design came from Public Works, probably from its chief architect Nicolaas Lansdorp assisted
    by Bernardus Lubbers; Hildo Krop''s archive names only Lansdorp.


    The symmetrical yellow-brick building has a flat roof and five bays of unequal width, with the emphasis
    on a sculptural central section where form and structure merge. Sixteen classrooms face south over
    the canal. The caretaker''s house at Heinzestraat 13 (1925–1926) belongs to the design. Inside, Maria
    Hubrecht''s seven paintings of the geological eras, with dinosaurs, hang in the hall — among the city''s
    earliest art commissions.


    Look for:

    - the raised entrance reached by six steps, with carved capitals and reliefs by Hildo Krop

    - Krop''s two granite figures, Work (*Arbeid*) and Leisure (*Vrije Tijd*)

    - the corner bays for the larger classrooms

    '
  category: schools
