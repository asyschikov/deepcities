  nl:
    title: Etagewoningen Minervalaan II (Rutgers)
    summary: Vier bouwblokken van Rutgers op de kruising van Minervalaan en Gerrit van der Veenstraat,
      met winkelgalerijen waarvan de kapitelen van Jacob Kaas de jaargetijden, ambachten en leden van
      de Schoonheidscommissie tonen.
    body: 'Op de kruising van de Minervalaan en de Gerrit van der Veenstraat ontwierp G.J. Rutgers vier
      bouwblokken met winkel- en etagewoningen in late Amsterdamse School-stijl, één op elke hoek. Het
      Rijksmonumentenregister beschermt ze als complex Etagewoningen Minervalaan II.


      Op elke hoek staan deels ingesnoerde puntgevels, aan de Minervalaan een lagere puntgevel boven een
      winkelgalerij. De gemetselde galerijkolommen op natuurstenen sokkels dragen kapitelen in tufsteen
      van beeldhouwer Jacob Kaas (ontwerp 1928): de vier jaargetijden en ambachten, en in één blok portretten
      van leden van de Schoonheidscommissie, later Commissie Zuid. Tussen de woningen lopen halfronde
      torenuitkragingen die boven het dak eindigen in torentjes.


      Let op:

      - de kapitelen van Kaas in de galerijen

      - het roosvenster in de grote puntgevel aan de Minervalaan

      - de torentjes boven de halfronde uitbouwen

      '
    attributes:
      original_use: Etagewoningen en winkels
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/527779
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/527780
- title: Gerrit van der Veen College
  summary: The former girls' HBS of 1929–1930, a late Amsterdam School school with a stepped clock tower
    topped by bronze figures and an archer weathervane.
  body: 'Built in 1929–1930 as the main building of a girls'' secondary school (HBS), this school on the
    Gerrit van der Veenstraat is protected for its late Amsterdam School architecture, its largely intact
    interior and its striking tower silhouette. During the war the German security service used it as
    a headquarters; an air raid on 26 November 1944 badly damaged it. Afterwards the street and the school
    were named after the sculptor and resistance leader Gerrit van der Veen; his bronze heads of Loeki
    van der Veen and Princess Juliana are in the hall.


    The dark-red brick building has two wings at right angles. Over the main entrance rises a tall, stepped
    tower with clock faces, small balconies and two bronze figures at the top: a man with sickle and hook,
    and a Cupid.


    Look for:

    - the stepped clock tower and its bronze figures

    - the five-sided turret with an archer weathervane on the other end of the long wing

    - a keystone with a child by the water, and in the garden a seated woman with child

    - the leaded-glass oriel with a copper roof over the teachers'' entrance

    '
