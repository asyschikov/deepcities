  nl:
    title: Lyceumbrug
    summary: De grootste platte brug van Amsterdam (brug 410, 1926–1928) van Piet Kramer, met beelden
      van Hildo Krop, paraboolvormige brughuisjes en bootsteigers met kleedruimtes eronder.
    body: 'Piet Kramer van de afdeling Bruggen van Publieke Werken ontwierp de Lyceumbrug als voortzetting
      van de as door het Amsterdams Lyceum; ingenieur Cornelis Biemond verzorgde de constructie. In mei
      1928 ging de brug open voor verkeer, toen nog zonder een van de beelden.


      Het brugdek is nauwelijks gekromd. Kramer combineerde lichte baksteen met natuurstenen blokjes en
      sluitstenen, en ontwierp de siersmeedijzeren balustraden. Aan de zuidzijde liggen twee aanlegsteigers
      die eindigen in paraboolachtige brughuisjes; een gang onder de brug verbindt ze, met bergruimte
      voor kano''s, kleedruimtes en een werkplaats. De steigers kwamen er op verzoek van rector Gunning,
      die zijn leerlingen meer beweging wilde geven.


      Hildo Krop hakte vier beelden in Franse kalksteen: aan de lyceumzijde een moeder met dochter en
      een vader met zoon, aan de overkant een jongen en een meisje, naar Krops eigen kinderen.


      Let op:

      - de vier beelden van Krop op de pylonen en sluitstenen

      - de twee brughuisjes aan het eind van de steigers

      '
    attributes:
      original_use: Brug (nr. 410) met aanlegsteigers
    sources:
    - https://nl.wikipedia.org/wiki/Lyceumbrug
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/527832
- title: Valeriusplein toilet buildings
  summary: Two mirror-image public toilets in flowing cast concrete (1922), half sunk into the Valeriusplein,
    with expressionist wrought-iron gates and a matching bench.
  body: 'J. de Meyer designed these two identical toilet buildings for the Public Works department in
    1922, together with the fence around the square''s garden and a bench on its south side. They are
    half below ground level, reached by steps, and built entirely of cast concrete in flowing, wavy lines
    under a broad overhanging flat roof.


    The toilets have long been out of use and were filled with concrete to prevent misuse, but they remain
    a rare piece of Amsterdam School street furniture.


    Look for:

    - the curved concrete shells on the north side of the square, mirrored left and right

    - the double doors divided by a half-column, with decorative glazing bars

    - the expressionist wrought-iron gates and the semicircular iron fence

    '
  category: public-works
  lat: 52.352628
  lng: 4.863931
  address: Valeriusplein 7–8
