- title: Olympiaschool (Stadionkade 113)
  summary: A municipal open-air school flanked by two primary schools (1931–1932), with classroom balconies
    for lessons and rest in the fresh air, and a tower over the stair.
  body: 'The city tendered this complex in June 1931 and opened it a year and a half later: a municipal
    open-air school (*openluchtschool*, called the Spartaschool) around a central stair tower, flanked
    by two ordinary primary schools, the Apolloschool and the Moriaschool (for Reformed pupils). The open-air
    school is recognisable by its balconies, joined to classrooms with sash windows so children could
    be taught or rest almost outdoors. The design came from Public Works and was assigned to Gustaaf Adolf
    Roobol.


    The building stands well back from the Stadionkade to leave big playgrounds front and back. On the
    street line stand two small play pavilions (originally covered playgrounds) with a brick wall and
    gate between them. It is now the Olympiaschool.


    Look for:

    - the tower rising from the ground to far above the roof in the middle bay

    - the recessed classroom balconies with tall brick parapets

    - the two pavilions and the wall with gate (bronze guardians by Peer Veneman, 1994)

    '
