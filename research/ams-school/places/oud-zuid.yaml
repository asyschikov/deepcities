  nl:
    title: Kinderbrug en Hildo Kropbrug (Muzenplein)
    summary: 'Piet Kramers bruggencomplex ''Kinderbrug'' rond het Muzenplein (ontwerp 1926–1928, gebouwd
      1930–1931), met kinderbeelden van Hildo Krop: in bootjes, met eekhoorns en met konijnen.'
    body: 'Waar het Zuider Amstelkanaal en de Boerenwetering samenkomen, ontwierp Piet Kramer een ensemble
      van twee bruggen, een kademuur en een transformatorhuisje rond het Muzenplein. Het ontwerp dateert
      van 1926–1928, de uitvoering van 1930–1931.


      Brug 419 over het Zuider Amstelkanaal verbindt de Apollolaan met het Muzenplein en heet sinds 2004
      Hildo Kropbrug. Op twee hoge gemetselde pilonen aan de zuidzijde staan Krops ''meisje in boot''
      en ''jongen in boot'' (1932). Brug 420, de eigenlijke Kinderbrug, gaat over de Boerenwetering en
      draagt jaartalstenen ''ANNO 1930''; Krop maakte hier ''meisje met eekhoorns'' en ''jongen met konijnen'',
      en aan de noordzijde een tien meter hoge pijlerbekroning van Beiers graniet. De kademuur loopt uit
      in een transformatorhuisje van het GEB.


      Let op:

      - de kinderen in bootjes op de pilonen van brug 419

      - het meisje met eekhoorns, de jongen met konijnen en de granieten pijler bij brug 420

      - het transformatorhuisje met overkragend piramidedak en ventilatiekleppen met andreaskruisen

      '
    attributes:
      original_use: Bruggen (nrs. 419 en 420) en transformatorhuisje
    sources:
