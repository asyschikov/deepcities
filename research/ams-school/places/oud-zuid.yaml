    summary: Vrijstaande villa (1918–1919) van Harry Elte en G.F. Mastenbroek in zakelijk-expressionistische
      trant, tussen de villa's rond de Cornelis Schuytstraat.
    body: 'S.R. Klatte liet deze villa ontwerpen door H. Elte Phzn. en G.F. Mastenbroek; het betonwerk
      was van NV Gewapend Betonbouw De Kondor. De villa van lichtbruine baksteen telt een kelder, parterre,
      verdieping en kapverdieping.


      Het register noemt de trant zakelijk-expressionistisch, dezelfde koele, geometrische richting die
      Elte later voor de synagoge aan het Jacob Obrechtplein gebruikte. De tuin glooit licht doordat het
      perceel iets is opgehoogd; van het houten tuinhek resten alleen de gemetselde posten. De luiken
      verdwenen in 1949 om schilderkosten te besparen.


      Let op:

      - de blokvormige massa in lichtbruine baksteen

      - de erker aan de noordoostzijde, waar eerst een veranda was getekend

      '
