    body: 'De NV Bouw- en Exploitatiemij. Socrates liet Dick Greiner het hele blok tussen Watteaustraat,
      Courbetstraat, Michelangelostraat en Milletstraat ontwerpen. Zonnehof werd in 1938–1940 gebouwd
      met 256 luxe etagewoningen in vijf lagen onder platte daken. Op de begane grond van Courbetstraat
      32–40 (1940) kwam een PTT-kantoor; de hoek met de Watteaustraat voegde Greiner in 1951 toe.


      Het register waardeert het blok als late fase van Greiners oeuvre, met een menging van expressionistische
      en functionalistische elementen, en om de zorgvuldige gevels met opvallend metselverband.


      Let op:

