  nl:
    title: Bouwblok Rutgers, Apollolaan 175–185
    summary: Middenstandswoningen van G.J. Rutgers (1927–1929) met trapsgewijs verspringende topgevels
      op de hoek en hoogwaardig beeldhouwwerk van T.A. (Theo) Vos.
    body: 'G.J. Rutgers ontwierp dit U-vormige blok etagewoningen voor de middenklasse, gebouwd in 1927–1929,
      langs de Apollolaan, Raphaëlstraat en Titiaanstraat. Het is drie en vier lagen hoog met een zolder
      onder zadeldaken, in rozebruine baksteen.


      Het register wijst op de beeldhouwwerken van Thomas Andreas (Theo) Vos (1887–1948), die tot de ''Amsterdamse
      expressionisten'' wordt gerekend en door Rutgers veel werd gevraagd. Ze zijn karakteristiek voor
      de grote bloei van de bouwsculptuur in het interbellum en een goed voorbeeld van de hechte samenwerking
      tussen architect en beeldhouwer.


      Let op:

      - de trapsgewijs naast elkaar geplaatste topgevels op de hoek Apollolaan–Raphaëlstraat

      - het beeldhouwwerk van Vos, waaronder gebeeldhouwde consoles onder de uitkragende middenpartij

      '
