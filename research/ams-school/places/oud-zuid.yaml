  nl:
    title: Huize de Windroos (Het Zwarte Huis)
    summary: Donker bakstenen blok etagewoningen van Piet Kramer (1921–1922) dat de knik in de Okeghemstraat
      volgt – in de buurt bekend als Het Zwarte Huis.
    body: 'Bouwondernemer J.Th. Boersma liet dit blok in 1921 ontwerpen door Piet Kramer; in 1922 wijzigde
      Kramer de voorgevel tot het huidige aanzien. De officiële naam is Huize de Windroos, maar in de
      volksmond heet het Het Zwarte Huis.


      Het vijflaagse blok volgt de knik in de Okeghemstraat tussen Cornelis Krusemanstraat en Lomanstraat.
      Het register noemt het een gaaf voorbeeld van etagebouw in Amsterdamse School-stijl "van vlak na
      de korte, zeer expressievolle beginperiode", dat boeiend inspeelt op de situering. In 1934 werden
      de kozijnen verlaagd; de oorspronkelijke ramen in Amsterdamse School-detaillering zijn vervangen
      door eenvoudige drieruitsvensters.


      Let op:

      - hoe de gevel meebuigt met de straat

      - de donkere baksteen

      '
    attributes:
      original_use: Etagewoningen
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/505372
