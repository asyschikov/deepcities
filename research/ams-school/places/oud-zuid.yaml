- title: Vossius Gymnasium
  summary: Nico Lansdorp's grammar school of 1931–1932 for the city, a late Amsterdam School building
    with Hildo Krop's statue of Erasmus at the entrance and art by Rädecker, Theo Vos and others inside.
  body: 'Because so many pupils applied to the Stedelijk Gymnasium, Amsterdam founded a second grammar
    school in 1926; both were then named after the city''s first two professors, Barlaeus and Vossius.
    The Vossius got its own building in 1931–1932, designed by Nicolaas Lansdorp (1885–1968), architect
    at Public Works, in late Amsterdam School style. It opened in 1933.


    It stands free on a square plot bounded by four streets, with a caretaker''s house, a garden on the
    south and a playground on the north. The register sees it as an exponent of the period when the social-democratic
    city council considered school building of the highest importance. Many artists contributed to the
    interior: D.K. Broos, J.M. Luttge, Leo Visser, Theo Vos, John and Willem Rädecker, Jan Heyens, H.
    Paulides and Hans Reicher.


    Look for:

    - Hildo Krop''s stone Erasmus beside the main entrance, inscribed "Qui vitat molam, vitat farinam"
    (who avoids the mill, avoids the flour)

    - the long classroom fronts and the tower-like stair volumes

    '
