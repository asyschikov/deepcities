- title: Hillehuis
  summary: 'Michel de Klerk''s first independent building (1911–1912): a block of flats on the Johannes
    Vermeerplein whose angular, spiky details announced the Amsterdam School.'
  body: 'The building contractor Klaas Hille took a plot running from the Gabriël Metsustraat along the
    Johannes Vermeerplein into the Nicolaas Maesstraat, and asked the young Michel de Klerk (1884–1923)
    to design flats for it. De Klerk was still working in the office of Herman Baanders, and this is regarded
    as his first independent work, five years before Het Schip.


    The national register describes the style as one "that with its angular and spiky detailing announces
    the beginning of the Amsterdam School". The block is still a mix: a symmetrical, almost classical
    composition and rational brick walls, but with a continuous balcony binding the three parts together
    and sharp, crystalline ornament in brick, stone, iron and wood. Unusually for a street of individually
    designed houses, the whole façade reads as one.


    Over the years dormers were added and several balcony brackets were replaced, so the uniformity is
    less crisp than in 1912.


    Look for:

    - the long balcony across the Vermeerplein front, and its patterned brickwork

    - pointed, faceted ornaments in stone and wrought iron, and the year stones near the top

    - the corners where the block turns into the two side streets

    '
  category: housing
  lat: 52.355422
  lng: 4.883182
  address: Gabriël Metsustraat 22–34, Nicolaas Maesstraat 32–34
