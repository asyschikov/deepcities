- title: Harmoniehof
  summary: 'A garden-court housing complex by J.C. van Epen for ''De Samenwerking'' (1919–1926): middle-class
    blocks and double houses around a formal garden with ponds and a 1925 fountain.'
  body: 'The cooperative housing association *Amsterdamsche Coöperatieve Woningvereeniging De Samenwerking*
    built this complex between the Roelof Hartstraat, Hobbemakade, Reijnier Vinkeleskade and Joh. M. Coenenstraat.
    Johannes Christiaan van Epen (1880–1960), with M.J.E. Lippits, designed most of it in 1919–1923; Barend
    van den Nieuwen Amstel added the north-west block in 1925–1926.


    In the middle lies a quiet green court, the Harmoniehof itself, lined with three-storey blocks and
    four detached double houses. The formal garden has three linked octagonal ponds and a conical stone
    fountain with animal figures and a lettered frieze, presented to the association in 1925 to mark completion.
    On the Roelof Hartstraat and Hobbemakade the outer block rises to five storeys with shops and a six-storey
    corner tower.


    Look for:

    - Van Epen''s trademarks: bay windows with buttresses, tall stair windows and small windows of varied
    shapes

    - the fountain and ponds in the central garden

    - the tower on the corner of the Roelof Hartstraat and the Hobbemakade, and round-arched gateways
    into the inner gardens

    '
  category: ensembles
  lat: 52.351458
  lng: 4.882115
