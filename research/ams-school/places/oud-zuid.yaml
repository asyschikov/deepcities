  nl:
    title: Olympia (H.A.G.A.-complex)
    summary: 'Jan Gratama''s arbeiderswoningen uit 1924–1926 rond de Marathonweg: 572 woningen en 28 winkelwoningen
      in vijf gesloten blokken, verbonden door poorten met gebeeldhouwde sluitstenen.'
    body: 'Jan Gratama voerde in 1920–1924 namens de gemeente de supervisie over de bouw van de Stadionbuurt
      en ontwierp tegelijk dit complex voor de NV Bouw- en Exploitatie Mij. H.A.G.A., waarin hij zelf
      deelnam – wat in de vakpers tot controverse leidde. Het complex, in de volksmond Olympia, telt 572
      woningen en 28 winkelwoningen in vijf gesloten bouwblokken, in twee ensembles aan weerszijden van
      de Marathonweg, met poorten bij de Theseusstraat, Simsonstraat en Sportstraat.


      Gratama gold toen als een van de voormannen van de Amsterdamse School, al is zijn werk terughoudender
      dan dat van De Klerk en Kramer. Eind jaren twintig liet hij zich steeds meer inspireren door architectuur
      van rond 1800 en werd hij een fel criticus van het modernisme.


      Let op:

      - de poorten in de vorm van een gedrukte ellipsboog met zandstenen sluitstenen van C.J. Hassoldt,
      Jan Trapman en Jaap Kaas, en granieten stootblokken

      - de lange gevelwanden aan Olympiakade en Olympiaweg met groene perkjes

      '
    attributes:
      original_use: Arbeiderswoningen en winkels
    sources:
    - https://nl.wikipedia.org/wiki/Olympia_(Amsterdam)
    - https://monumentenzoeker.amsterdam.nl/monument/222149
- title: Willem de Zwijgerkerk
  summary: Cornelis Kruyswijk's Reformed church (1931) on the Olympiaweg, with a high roof and slender
    tower marking the Noorder Amstelkanaal, and an intact interior of Slavonian oak and coloured glass.
  body: 'In 1923 the Dutch Reformed congregation announced plans for a church in Plan Zuid. Cornelis Kruyswijk
    (1884–1935) won the closed competition for it; the church was built in 1931, in one block with a parish
    hall (Moria) on the Speerstraat, two parsonages and an old people''s home (now student housing) on
    the Olympiakade.


    The church fits into the block, but a small square in front of it gives the tower room to stand out.
    The city register calls the interior of church and parish building a unique example of integrated
    Amsterdam School design, with Slavonian oak, coloured leaded glass and tiled floors; organ and pulpit
    form one monumental ensemble. The windows by Kees Kuiler show Christmas, Easter and Pentecost. Over
    the entrance is a relief by Theo van Reyn of William the Silent''s motto, *Saevis tranquillus in undis*.


    Look for:

    - the slender tower above the Olympiaweg and the canal

    - Van Reyn''s relief with the motto on the front panel

    '
