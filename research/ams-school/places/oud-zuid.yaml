  nl:
    title: Het Nieuwe Huis
    summary: 'Voorzieningengebouw voor ongehuwden aan het Roelof Hartplein (1927–1928) van Barend van
      den Nieuwen Amstel: 188 woningen met eetzaal, leeszaal, winkels, postkantoor en toren.'
    body: 'In 1914 bedacht mejuffrouw Kruis een gebouw waar ongehuwden zelfstandig konden wonen, in plaats
      van op kamers of in een pension. Haar coöperatieve vereniging Het Nieuwe Huis bracht het plan samen
      met De Samenwerking tot stand; architect B. van den Nieuwen Amstel ontwierp het in verstrakte Amsterdamse
      School-stijl. Het gebouw was in 1928 klaar.


      Er waren 188 appartementen van verschillende typen, eetzalen voor bewoners en publiek, een leeszaal,
      winkels, een postkantoor, een fietsenkelder en een toren; op zolder zaten de keuken en enkele ateliers.
      Een filiaal van de Amsterdamsche Coöperatieve Keuken leverde de maaltijden. Bij de ingang zit nog
      altijd een portiersloge, en op de begane grond een vestiging van de Openbare Bibliotheek.


      Let op:

      - de gebogen gevel aan het Roelof Hartplein met trapvensters

      - de toren en de vleugels langs Gerard Terborgstraat en Roelof Hartstraat

      '
    attributes:
      client: Amsterdamsche Coöperatieve Woningvereeniging De Samenwerking
      original_use: Woongebouw voor ongehuwden
    sources:
    - https://nl.wikipedia.org/wiki/Het_Nieuwe_Huis
