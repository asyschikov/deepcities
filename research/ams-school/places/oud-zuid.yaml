  nl:
    title: Boerenweteringbrug
    summary: Brug 406 (1926–1927) van Piet Kramer bij de Kom van de Boerenwetering, met beelden van Hildo
      Krop die als pijlers naar de rijweg kijken.
    body: 'De Boerenweteringbrug voert de Van Hilligaertstraat over de Boerenwetering tussen Ruysdaelkade
      en Hobbemakade, waar het water uitloopt in De Kom. De planning begon in 1922, maar de bouw liep
      vertraging op; de brug werd in 1926–1927 gebouwd naar ontwerp van Piet Kramer en ging in september
      1927 open. Samen met brug 405 leidt ze het verkeer rond De Kom naar de Stadionweg.


      Het is een plaatbrug in baksteen en natuursteen met sierlijke smeedijzeren balustraden. Hildo Krop
      maakte de beelden, die als pijlers op de steunpunten staan en naar binnen kijken; de waterzijde
      is blind. Volgens de overlevering horen ze bij een gedicht van A.E. van Collem, maar een direct
      verband is niet gevonden.


      Let op:

      - Krops beelden op de pijlers

      - de banden van baksteen en natuursteen en de smeedijzeren leuningen

      '
    attributes:
      original_use: Brug (nr. 406)
    sources:
