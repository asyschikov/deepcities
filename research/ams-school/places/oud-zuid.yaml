  nl:
    title: Lutherkapel
    summary: Lutherse kapel van G.J. Rutgers (1929–1930) op een Grieks-kruisplattegrond, met hoge daken
      en een toren op de hoek van de Bachstraat, en een gaaf interieur met gekleurd glas en donker hout.
    body: 'De Stichting Fonds voor een eigen gebouw in de zuidelijke wijk der Hersteld Evangelische Luthersche
      Gemeente liet G.J. Rutgers in 1928 een hele straatwand ontwerpen met 58 woningen, winkels en een
      kerk. De kapel kwam in 1929–1930 tot stand, samen met een verenigingsgebouw en een kosterswoning.


      Rutgers werkte de Grieks-kruisplattegrond uit als stedenbouwkundig accent op de kruising van Bachstraat
      en Gerrit van der Veenstraat. Hoge daken en de toren bepalen het exterieur van rode baksteen, natuursteen,
      rode pannen en koper. Volgens het gemeentelijk register maakt het gaaf bewaarde interieur – open
      kap, rondlopende gaanderij, piramide- en ruitvormige vensters, gekleurd glas, donker hout en armaturen
      uit de bouwtijd – in de geest van de Amsterdamse School met een neiging naar art deco de kapel tot
      een uniek tijdsdocument.


      Let op:

      - het portaal met twee robuuste zuilen buiten de rooilijn

      - het breed uitwaaierende piramidale venster aan de Gerrit van der Veenstraat

      - de toren als oriëntatiepunt

      '
    attributes:
      client: Hersteld Evangelisch-Lutherse Gemeente
      original_use: Kerk met verenigingsgebouw
    sources:
    - https://monumentenzoeker.amsterdam.nl/monument/222143
- title: Rutgers houses Stadionweg / Gerrit van der Veenstraat
  summary: A complex of spacious family houses and corner flats (1928–1930) by G.J. Rutgers, with parabolic
    dormers and brick flower boxes; the architect lived and worked on the Verdistraat corner.
  body: 'Gerrit Jan Rutgers designed this complex, spread over parts of three closed blocks around the
    Gerrit van der Veenstraat, Händelstraat, Stadionweg and Bachplein, for three developers: G.P. Wijker
    & Co., the brothers Th. and A. Wajer, and Bouwmij Slomiep. Built in 1928–1930, it consists mostly
    of spacious three-storey family houses with an attic, with flats in the taller corner volumes. Rutgers
    had his own house and studio on the corner of the Stadionweg and the Verdistraat, which is listed
    separately.


    Red brick, stained doors, white woodwork and steep roofs of red Roman tiles. The Gerrit van der Veenstraat
    acts as an axis of symmetry, and each house can be read in the rhythm of the windows. The complex
    is very well preserved, even with double glazing carefully fitted into the old frames.


    Look for:

    - the parabolic dormers in the taller volumes by the Bachplein and on the Gerrit van der Veenstraat

    - bay windows and brick flower boxes

    '
