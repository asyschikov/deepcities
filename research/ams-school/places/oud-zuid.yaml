- title: Joep Langebrug
  summary: Bridge 417 (1939–1940), one of Piet Kramer's last Amsterdam School bridges, carrying the Beethovenstraat
    over the Zuider Amstelkanaal, with two sculptures by Hildo Krop.
  body: 'Piet Kramer and the Public Works department designed this bridge in 1939 to carry the Beethovenstraat
    over the Zuider Amstelkanaal, between the Stadionkade and Bernard Zweerskade on the north and the
    Cornelis Dopperkade on the south, beside the Beatrixpark. It was completed around the turn of 1940–1941,
    on the eve of the occupation, late in the life of the style. Tram line 5 has crossed it since 1978.


    Hildo Krop, the city''s sculptor, made two works for it: *De handen van de schepper* (The hands of
    the creator) and *Nieuw leven* (New life).


    Look for:

    - Krop''s two sculptures on the bridge

    - Kramer''s mix of brick and stone and his wrought-iron railings

    '
