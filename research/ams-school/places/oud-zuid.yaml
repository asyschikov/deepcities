  nl:
    title: De Lairessestraat 89–107
    summary: Huizenrij in ingetogen Amsterdamse School-stijl van Groenendijk & Lammers (1918–1920); nummer
      93 heeft een zeldzame open benedenverdieping met glazen draaiwanden en glas-in-lood met slangen.
    body: 'De huizenrij De Lairessestraat 89–107 werd gelijktijdig en in samenhang ontworpen door Groenendijk
      & Lammers, als schakel tussen de laat-negentiende-eeuwse buurt in het noorden en de planmatige uitbreiding
      in het zuiden. Het gemeentelijk register noemt nummer 93 een geslaagd voorbeeld van ingetogen Amsterdamse
      School-architectuur.


      De bijzonderheid zit binnen. Het joodse echtpaar Drilsma-Maykels week af van de indeling van de
      buurpanden: een centrale hal staat via harmonicavormige, grotendeels glazen draaiwanden in verbinding
      met de andere vertrekken, zodat de ruimte naar behoefte kon worden ingedeeld. Het glas-in-lood toont
      decoratief opgevatte slangen. Zulke flexibele wandsystemen uit omstreeks 1920 zijn zeldzaam.


      Let op:

      - de samenhangende rij bakstenen gevels

      - het glas-in-lood in deur en bovenlichten

      '
    attributes:
      original_use: Herenhuizen
    sources:
    - https://monumentenzoeker.amsterdam.nl/monument/200942
- title: H.L. de Jong houses De Lairessestraat
  summary: A block of 12 family houses and 6 two-family houses (1919–1921) by Hijman Louis de Jong, built
    as five distinct parts between the Lassusstraat and the Dufaystraat.
  body: 'W.J. Baartscheer jr. commissioned this block from Hijman Louis de Jong (1883–1945), better known
    for the Tuschinski theatre; the construction was by De Kondor. Built in 1919–1921, it originally had
    12 single-family and 6 two-family houses. In 1939 the house on the Dufaystraat was joined to De Lairessestraat
    142 and turned into the office, laboratory and caretaker''s house of the Amsterdamsche Chininefabriek
    (quinine factory).


    The block is built up of five more or less separately designed parts: a central section of four houses
    (De Lairessestraat 154–160), flanked by two linking sections of four mirrored houses each, and end
    pieces turning the corners.


    Look for:

    - the symmetrical five-part composition along the De Lairessestraat

    - how the end pieces turn into the Lassusstraat and Dufaystraat

    '
