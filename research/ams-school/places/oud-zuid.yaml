- title: La Croix houses Cornelis Schuytstraat
  summary: An L-shaped row of five family houses (1917) by G.F. La Croix with parabolic, kinked entrances,
    carved window posts and an Amsterdam School garden fence.
  body: 'Across the street from his maritime museum, La Croix built a block of five linked family houses
    in 1917 for the same developer, H. van der Schaar, on an L-shaped plot at the corner of the Cornelis
    Schuytstraat and the J.J. Viottastraat. In 1977 part of the row became an annex of a girls'' school.


    The houses have three storeys under a folded red-tiled roof with a carved gutter and frieze. They
    are typical of the expressive phase: decorative brickwork everywhere, diamond-patterned transoms,
    and window posts carved with ornament.


    Look for:

    - the deep, parabolic and kinked entrance framed by decorative brickwork, with a small parabolic fanlight
    divided by a St Andrew''s cross

    - the slightly projecting triangular bays with carved wooden posts

    - the Amsterdam School garden fence on the Cornelis Schuytstraat side

    '
  category: housing
  lat: 52.353392
