  nl:
    title: Olympiaschool (Stadionkade 113)
    summary: Gemeentelijke openluchtschool met twee lagere scholen (1931–1932), met balkons voor les en
      rust in de buitenlucht en een toren boven het trappenhuis.
    body: 'De gemeente besteedde het werk op 29 juni 1931 aan; anderhalf jaar later ging de school open.
      Het complex combineert een centraal rond het trappenhuis gelegen openluchtschool (de Spartaschool)
      met twee scholen voor gewoon lager onderwijs, de Apolloschool en de hervormde Moriaschool. De openluchtschool
      is herkenbaar aan de balkons bij de lokalen, zodat kinderen vrijwel buiten les kregen of rustten.
      Het ontwerp van Publieke Werken werd toegewezen aan G.A. Roobol, in de verstrakte variant van de
      Amsterdamse School.


      De school staat ver achter de rooilijn, met grote speelplaatsen. Aan de straat staan twee speelgebouwtjes
      (eerst overdekte speelplaatsen) met een muur en poort ertussen. Sinds 2004 is het complex rijksmonument.


      Let op:

      - de toren in de middenrisaliet, hoog boven het dak

      - de terugliggende lokaalbalkons met hoge gemetselde borstweringen

      - de speelgebouwtjes en de poort met bronzen wachters van Peer Veneman (1994)

      '
    attributes:
      original_use: Openluchtschool en twee lagere scholen
    sources:
    - https://nl.wikipedia.org/wiki/Stadionkade_113
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/527792
- title: Europaschool (Hygiëaplein)
  summary: A yellow-brick Public Works primary school of 1921 by Nico Lansdorp on the Hygiëaplein, with
    a gymnasium behind and relief tiles by Hildo Krop.
  body: 'Nico Lansdorp, architect at Public Works from 1920 to 1932, designed this primary school with
    an attached gymnasium in 1921. It forms part of the south-east wall of the Hygiëaplein, south-west
    of the Marathonweg; the gym is linked to the back by a connecting wing, with a playground either side.


    The symmetrical school rises three storeys in yellow brick under a flat roof, finished with a frieze
    of decorative brickwork and a decorative concrete coping. Inside, the stairwell has a period mural
    of Jesus with children playing, signed J. Froquet, and relief tiles designed by Hildo Krop. The register
    calls it a very intact example, inside and out, of an Amsterdam School public school building. Further
    along the square, at Hygiëaplein 8–10, Public Works and Lansdorp built another school in 1924.


    Look for:

    - the 30-metre symmetrical front on the Hygiëaplein

    - the brick frieze and concrete coping along the roofline

    '
