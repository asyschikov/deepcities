  nl:
    title: Woningen Rutgers, Stadionweg / Gerrit van der Veenstraat
    summary: Complex van ruime eengezinswoningen en hoekflats (1928–1930) van G.J. Rutgers, met paraboolvormige
      dakkapellen en gemetselde bloembakken; Rutgers had zelf zijn woonhuis en atelier op de hoek met
      de Verdistraat.
    body: 'G.J. Rutgers ontwierp dit complex, verdeeld over delen van drie gesloten bouwblokken rond Gerrit
      van der Veenstraat, Händelstraat, Stadionweg en Bachplein, in opdracht van G.P. Wijker & Co., de
      gebroeders Th. en A. Wajer en Bouwmij Slomiep. Het werd in 1928–1930 gebouwd en bestaat vooral uit
      ruime eengezinswoningen van drie lagen met een zolder; in de hogere hoekvolumes liggen etagewoningen.
      Op de hoek van Stadionweg en Verdistraat had Rutgers zijn eigen woonhuis en atelier, dat apart is
      beschermd.


      Rode baksteen, gebeitste deuren, wit houtwerk en steile daken met rode Romaanse pannen bepalen het
      beeld. De Gerrit van der Veenstraat is symmetrieas; in het ritme van de vensters is elke woning
      afzonderlijk af te lezen. Het complex is zeer gaaf, mede doordat dubbel glas zorgvuldig in de bestaande
      ramen is ingepast.


      Let op:

      - de paraboolvormige dakkapellen bij het Bachplein en aan de Gerrit van der Veenstraat

      - erkers en gemetselde bloembakken

      '
    attributes:
      client: G.P. Wijker & Co.; Th. en A. Wajer; Bouwmij Slomiep
      original_use: Eengezinswoningen en etagewoningen
    sources:
    - https://monumentenzoeker.amsterdam.nl/monument/222010
- title: Bachzaal (Amsterdamsch Conservatorium)
  summary: Piet Vorkink's conservatory and music school of 1930–1931 on the Bachstraat, with a concert
    hall famed for its acoustics — where Concertgebouw musicians were trained.
  body: 'The *Amsterdamsch Conservatorium* commissioned Piet Vorkink (1878–1960) in 1930 to design a building
    for the conservatory, a music school, a caretaker''s house and a concert hall, the Bachzaal. It stands
    on the Bachstraat, facing a small five-sided square opposite the first Montessori school, in line
    with Berlage''s idea that public buildings should dominate a square.


    The front building is a sober, flat façade of ochre-yellow brick under a red tile roof, with continuous
    bands of windows, the tallest on the first floor; a cross roof marks the entrance. Behind lies the
    auditorium, with sound-damping constructions described in detail by Jan Zietsma in the *Bouwkundig
    Weekblad* of 1931. The city register calls the hall unique in Amsterdam for its acoustics and design.
    Vorkink''s work, it notes, moved from the expressive Amsterdam School towards compositions of planes
    influenced by Frank Lloyd Wright. The conservatory moved out in 2008 and the building became a day-care
    centre.


    Look for:

    - the long rows of windows and the cross-gabled entrance bay

    - how the building faces the little square

    '
