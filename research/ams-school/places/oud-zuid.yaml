    title: Woningen H.L. de Jong, De Lairessestraat
    summary: Bouwblok van twaalf eengezins- en zes tweegezinswoningen (1919–1921) van H.L. de Jong in
      Amsterdamse School-stijl, opgebouwd uit vijf afzonderlijk vormgegeven delen.
    body: 'W.J. Baartscheer jr. liet dit blok tussen Lassusstraat en Dufaystraat bouwen naar een ontwerp
      in Amsterdamse School-stijl van H.L. de Jong, de architect van Tuschinski; de constructie was van
      De Kondor. Het kwam in 1919–1921 tot stand met oorspronkelijk twaalf eengezins- en zes tweegezinswoningen.
      In 1939 werd de woning aan de Dufaystraat met De Lairessestraat 142 verenigd tot kantoor, laboratorium
      en conciërgewoning van de Amsterdamsche Chininefabriek.


      Het blok bestaat uit vijf min of meer afzonderlijk vormgegeven delen: een middendeel van vier woningen
      (154–160), twee tussenleden van elk vier gespiegelde woningen en de kopse delen op de hoeken.


      Let op:

      - de symmetrische opbouw in vijf delen

      - de hoekoplossingen naar de Lassusstraat en Dufaystraat

      '
    attributes:
      original_use: Eengezins- en tweegezinswoningen
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/506105
- title: Atelierwoningen Jacob Obrechtstraat
  summary: A hidden row of five artists' studio houses (1917) by J.M. van der Mey, reached through the
    Oldenhoeck gateway, each with a big north-facing studio window.
  body: 'Behind the street front of the Jacob Obrechtstraat, reached through a gateway between nos. 55
    and 67, Joan van der Mey (1878–1949), the architect of the Scheepvaarthuis, built a staggered row
    of five studio houses (*atelierwoningen*) in 1917 for NV Bouwmaatschappij De Lairesse. The gateway
    building at no. 67 is known as Oldenhoeck.


    The national register calls the style sober Amsterdam School. Each two-storey house stands on an almost
    square plan in dark-brown brick under a flat roof. On the north side an eight-pane studio window,
    divided by wooden bars, slopes inwards and ends in a moulded gutter; the wall panels either side are
    clad in worked wood. Some doors and windows were later altered.


    Look for:

    - the gateway on the Jacob Obrechtstraat

    - the sloping north studio windows, one per house, stepping along the courtyard

    - patches of decorative brickwork

    '
  category: houses
