  nl:
    title: Dobbelsteenwoningen (Hacquartstraat)
    summary: 'Twaalf herenhuizen van F.A. Warners (1921–1924), in de volksmond de ''dobbelsteen''-woningen:
      Wrightiaanse kubusvormen met Amsterdamse School-details.'
    body: 'F.A. Warners bouwde dit blok van twaalf herenhuizen in fasen tussen 1921 en 1924 voor verschillende
      opdrachtgevers: Allert de Lange (nummers 6–16), S. Kloots, G.A.O. Krause en J. Rozenstraten. In
      de volksmond heten ze de dobbelsteenwoningen.


      Het register waardeert de combinatie van een op internationale invloeden (Frank Lloyd Wright) geïnspireerde
      vormgeving met detaillering in Amsterdamse School-stijl. De voortuinen worden afgesloten door een
      houten tuinhek op een bakstenen plint, eveneens in die stijl.


      Let op:

      - de verspringende kubische volumes

      - het oorspronkelijke houten tuinhek langs de straat

      '
