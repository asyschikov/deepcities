  nl:
    title: Apollolaan 191 (Van Anrooy)
    summary: 'Smal appartementengebouw van vijf lagen met vier woningen (1928–1930) van H.A. van Anrooy:
      strakke Amsterdamse School met nieuw-zakelijke elementen en asymmetrisch blokverband.'
    body: 'Architect H.A. van Anrooy ontwierp dit asymmetrische pand met vier appartementen in de zuidelijke
      gevelwand van de Apollolaan, vlak bij het Olympiaplein. Het register noemt het een representatief
      en grotendeels gaaf voorbeeld van verstrakte Amsterdamse School met nieuw-zakelijke elementen, kenmerkend
      voor het oeuvre van Van Anrooy.


      De voorgevel is grotendeels van paarsbruine geschifte baksteen met verdiepte voeg; de begane grond
      en een deel van de eerste verdieping zijn in grijsbruine steen in asymmetrisch blokverband gemetseld,
      dat doorloopt in de stoep.


      Let op:

      - het blokverband onderin en in de stoep

      - het geometrische patroon van vierkanten rechts op de begane grond

      '
    attributes:
      original_use: Luxe appartementen
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/527850
