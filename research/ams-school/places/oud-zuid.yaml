- title: Boerenweteringbrug
  summary: Bridge 406 (1926–1927) by Piet Kramer at the Kom of the Boerenwetering, with Hildo Krop's figures
    on pillars facing inward over the roadway.
  body: 'The Boerenweteringbrug carries the Van Hilligaertstraat over the Boerenwetering, linking the
    Ruysdaelkade and the Hobbemakade where the waterway widens into *De Kom* (the basin). Planned from
    1922 but delayed, it was built in 1926–1927 to Piet Kramer''s design and opened to traffic in September
    1927. Together with bridge 405 it carries traffic around the Kom towards the Stadionweg.


    It is a plate-girder bridge combining brick and natural stone with ornate wrought-iron balustrades.
    Hildo Krop made its sculptures, which stand as pillars on the supports and face inward; their water
    sides are left blind. Tradition links them to a poem by Abraham Eliazer van Collem, but researchers
    have found no direct connection.


    Look for:

    - Krop''s figures on the pillars, turned towards the road

    - the brick and stone bands and the wrought-iron railings

    '
