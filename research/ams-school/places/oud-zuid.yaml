  nl:
    title: Blokken Haarlemmermeerstraat
    summary: 'Drie architecten, één symmetrische compositie (1930–1932): Van der Mey, Roodenburgh en de
      gebroeders Baanders omzoomden de Haarlemmermeerstraat met mansardedaken, hoektorens en natuurstenen
      basementen.'
    body: 'Rond Haarlemmermeerstraat, Weissenbruchstraat en Theophile de Bockstraat ontwierpen drie bureaus
      in 1930–1932 elk delen van twee gesloten bouwblokken, binnen één symmetrische opzet. Volgens het
      gemeentelijk register toont die opzet de stedenbouwkundige erfenis van de Amsterdamse School en
      de Commissie Zuid.


      J.M. van der Mey, bekend van het Scheepvaarthuis, tekende de hoeken Weissenbruchstraat 29–43 / Haarlemmermeerstraat
      117–147 (1930): vier lagen onder mansardedaken met rode pannen boven een hardstenen basement, met
      sculpturale hoekoplossingen die het register kenmerkend voor de Amsterdamse School noemt. Roodenburghs
      blokken aan het Legmeerplein (1931–1932) zijn classicistischer, met Amsterdamse School-invloed in
      de portieken. De blokken van de gebroeders Baanders (1931–1932) hebben een kolossale orde, hoektorens
      en balkons met stalen hekwerk.


      Let op:

      - de hoge gevelwanden en gespiegelde hoeken van de Haarlemmermeerstraat

      - Van der Meys mansardedaken en hardstenen basement

      - de hoektorens bij de Theophile de Bockstraat

      '
    attributes:
      original_use: Etagewoningen en winkels
    sources:
    - https://monumentenzoeker.amsterdam.nl/monument/222008
    - https://monumentenzoeker.amsterdam.nl/monument/222006
    - https://monumentenzoeker.amsterdam.nl/monument/222007
- title: Calvijnschool
  summary: A 1932 Christian primary school by the otherwise unknown J. Op 't Land, mixing late Amsterdam
    School window bands and ironwork with traditionalist arches and Old Dutch glazing bars.
  body: 'Built in 1932 as the Calvijnschool, a Christian primary school, this building on the Floris Versterstraat
    is the only known work of J. Op ''t Land — surprising, the city register notes, for a design of such
    quality. A second school of the same period stands opposite.


    It is a corridor school, with all classrooms along the front. The register describes a blend: the
    bands of classroom windows, horizontal in feeling, are late Amsterdam School, but the almost Old Dutch
    glazing bars, quasi-handmade brick, Roman tiles, ornamental stone balls and round-arched entrance
    are traditionalist. Inside, the stair with sculpted parapets and wrought iron mixes the two. Today
    it houses a playgroup and artists'' studios.


    Look for:

    - the round-arched entrance with granite bands, flanked by posts topped with stone balls

    - the double door with ladder-pattern windows and grilles

    - the tall gym windows with stepped-back lower panes

    '
