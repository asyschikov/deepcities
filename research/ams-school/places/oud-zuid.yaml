  nl:
    title: VU-laboratorium De Lairessestraat
    summary: Scheikundig en natuurkundig laboratorium van de Vrije Universiteit (1930–1933) van B.T. Boeyinga,
      met glasstenen trappenhuis en beeldhouwwerk van Theo van Reyn.
    body: 'Voor de nieuwe vierde faculteit van de Vrije Universiteit ontwierp B.T. Boeyinga, met constructeur
      I.J. Kranenburg, dit laboratorium; het werd in 1930–1933 gebouwd. Scheikunde en natuurkunde kregen
      elk een vleugel aan weerszijden van het centrale trappenhuis. In 1951–1952 verhoogde Boeyinga het
      gebouw in soberder trant met twee à drie lagen en een sterrenwachtkoepel.


      Het register noemt het gebouw zakelijk-expressionistisch en "een van de laatste representanten van
      de Amsterdamse School", en wijst op de samenhang met het oudere fysiologisch laboratorium ernaast.


      Let op:

      - het trappenhuis aan De Lairessestraat met twee verticale stroken glasstenen

      - de bronzen naamplaquettes en het opschrift "vrije universiteit" op de luifel

      - twee beeldhouwwerken van Theo van Reyn en vier gegraveerde profielportretten

      '
