  sources:
  - rce:505243
  nl:
    title: Koninginneweg 8 (appartementengebouw Rutgers)
    summary: 'Vroeg luxe etagebouw van G.J. Rutgers (1924) met de achterzijde aan het Vondelpark: een
      halfronde erker van drieënhalve verdieping en twee stompe torentjes.'
    body: 'De NV Koningsvijver liet dit aan drie zijden vrijstaande appartementengebouw in 1924 ontwerpen
      door G.J. Rutgers, in verstrakte Amsterdamse School-stijl. De achterzijde grenst aan het Vondelpark.
      Het register waardeert het als vroeg voorbeeld van luxe etagebouw, met een exterieur dat nog geheel
      in originele staat is.


      Het gebouw telt vier bouwlagen en een souterrain in donkerbruine baksteen onder een plat dak. Een
      natuurstenen band scheidt de topverdieping af, die verder wordt benadrukt door beeldhouwwerk op
      de hoeken.


      Let op:

      - de halfronde erker boven de ingang, drieënhalve verdieping hoog

      - de twee minuscule stompe torentjes naast de middentravee

      '
    attributes:
      original_use: Luxe etagewoningen
    sources:
