  nl:
    title: Joep Langebrug
    summary: Brug 417 (1939–1940), een van Piet Kramers laatste Amsterdamse School-bruggen, voert de Beethovenstraat
      over het Zuider Amstelkanaal, met twee beelden van Hildo Krop.
    body: 'Piet Kramer en de Dienst der Publieke Werken ontwierpen deze vaste brug in 1939 voor de Beethovenstraat
      over het Zuider Amstelkanaal, tussen Stadionkade en Bernard Zweerskade aan de noordkant en de Cornelis
      Dopperkade aan de zuidkant, naast het Beatrixpark. Ze was rond de jaarwisseling 1940/1941 klaar.
      Sinds 1978 rijdt tram 5 eroverheen.


      Hildo Krop maakte er twee beelden voor: ''De handen van de schepper'' en ''Nieuw leven''.


      Let op:

      - de twee beelden van Krop

      - Kramers combinatie van baksteen, natuursteen en smeedijzer

      '
    attributes:
      original_use: Brug (nr. 417)
    sources:
    - https://nl.wikipedia.org/wiki/Joep_Langebrug
- title: Villa den Tex (Apollolaan 1)
  summary: A sober Amsterdam School villa by Frans den Tex (1927–1928) on the Apollolaan, dotted with
    Hildo Krop's small white limestone carvings — a faun with an accordion, a weasel, an archer.
  body: 'The architect Frans den Tex (1897–1969) designed this house on the corner of the Apollolaan and
    the Bernard Zweerskade in 1927–1928; his father Karel had bought the plot. It is a sober version of
    the Amsterdam School in yellow-brown brick.


    What makes it special is the sculpture by Hildo Krop, who carved numerous small figures in white limestone
    on site, especially around the private garage. Inspired by cube-like carvings the architect had seen
    in the Dutch East Indies, they include flora and fauna, an archer, a faun playing an accordion with
    a dachshund (perhaps a wink at Den Tex), and a weasel, said to refer to the builder Wezel. On the
    Bernard Zweerskade side stands a small electrical junction box by P.L. Marnette.


    Look for:

    - Krop''s white figures against the brown brick, especially by the garage

    - the faun with accordion and dachshund, and the weasel

    '
