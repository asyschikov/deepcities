  nl:
    title: Fysiologisch Laboratorium (VU)
    summary: Laboratorium van Groenendijk & Lammers uit 1916 voor de Vrije Universiteit, met een paraboolvormige
      ingang en vensters die door de verdiepingen heen lopen.
    body: 'De Vereeniging voor Hooger Onderwijs op Gereformeerden Grondslag, de vereniging achter de Vrije
      Universiteit, liet op de hoek van De Lairessestraat en het Valeriusplein een fysiologisch laboratorium
      bouwen naar een ontwerp van Groenendijk & Th.J. Lammers uit 1916.


      Het hoekgebouw telt een souterrain, bel-etage, verdieping en kapverdieping onder twee mansardekappen
      met zwarte pannen. Opvallend zijn de vensters: ongelijk van formaat, soms door de verdieping heen
      lopend en nu eens horizontaal, dan weer verticaal geleed. Een gemetseld tuinhek begrenst de smalle
      tuin aan het plein.


      Let op:

      - de deels hardstenen, paraboolvormige toegang met elf treden

      - het onregelmatige vensterpatroon aan het Valeriusplein

      '
    attributes:
      client: Vereeniging voor Hooger Onderwijs op Gereformeerden Grondslag (VU)
      original_use: Universiteitslaboratorium
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/505394
  photos:
