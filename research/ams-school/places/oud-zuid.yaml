  nl:
    title: Het Amsterdams Lyceum
    summary: Monumentaal schoolgebouw van de gebroeders Baanders (1918–1920) dat als stadspoort over het
      Valeriusplein is gebouwd, met glas-in-lood van R.N. Roland Holst en de rectorswoning De Zonne-Wijzer.
    body: 'De Vereeniging Het Amsterdamsch Lyceum liet in 1918–1920 haar school bouwen naar ontwerp van
      H.A.J. en J. Baanders, in verstrakte Amsterdamse School-stijl. Het gebouw staat als stadspoort over
      het zuidelijk deel van het Valeriusplein: de weg loopt door twee rondboogdoorgangen onder het middendeel
      door, en aan de overkant begint Plan Zuid. De Lyceumbrug van Piet Kramer zet die as voort over het
      Noorder Amstelkanaal.


      De symmetrische school bestaat uit kubische bouwvolumes onder platte daken: een corps de logis tussen
      twee risalerende torens en lagere zijvleugels. De glas-in-loodramen van R.N. Roland Holst werden
      in 1920, 1922 en 1927 geplaatst; hij maakte ook de glasmozaïeken in de aula. Op de hoek met De Lairessestraat
      staat de rectorswoning De Zonne-Wijzer (1919), eveneens van Baanders, met invloeden van Frank Lloyd
      Wright.


      Let op:

      - de doorgangen onder de school en de torens aan weerszijden

      - het fries van siermetselwerk rondom

      - de diepe portiek en de horizontale cordonbanden van De Zonne-Wijzer

      '
    attributes:
      original_use: Lyceum en rectorswoning
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/504650
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/504657
