  nl:
    title: Koninginneweg 50–60
    summary: 'Twee groepen herenhuizen van Groenendijk & Lammers (1914 en 1916) waarin bakstenen uitkragingen
      de natuurstenen consoles vervangen: Nieuwe Kunst met de eerste Amsterdamse School-trekken.'
    body: 'Groenendijk & Lammers bouwden aan de Koninginneweg in 1914 de panden 56–60 en in 1916 de panden
      50–54, in de Concertgebouwbuurt die na de annexatie van 1896 werd aangelegd.


      Volgens het gemeentelijk register zijn de huizen strak ontworpen, met creatief gebruik van de decoratieve
      mogelijkheden van baksteen. De versiering wortelt deels in de Nieuwe Kunst, maar toont al elementen
      van de Amsterdamse School: de erkers rusten niet op natuurstenen consoles maar op een uitkraging
      van meervoudig uitgemetselde lagen staande en liggende stenen. Lammers bouwde in de jaren twintig
      grote woningbouwcomplexen in de expressieve baksteenstijl.


      Let op:

      - de getrapte bakstenen uitkragingen onder de erkers van nummer 50–54

      - de uitkragende lijst met siermetselwerk onder de houten goot

      '
    attributes:
      original_use: Herenhuizen
    sources:
    - https://monumentenzoeker.amsterdam.nl/monument/222095
    - https://monumentenzoeker.amsterdam.nl/monument/222096
- title: Koninginneweg 8 (Rutgers flats)
  summary: An early luxury apartment building by G.J. Rutgers (1924) backing onto the Vondelpark, with
    a half-round bay three and a half storeys high and tiny stub towers.
  body: 'NV Koningsvijver commissioned this apartment building from Gerrit Jan Rutgers (1877–1962) in
    1924. Free-standing on three sides, its back faces the Vondelpark. The national register values it
    as an early example of luxury flats (*etagebouw*) and for its exterior, which survives entirely in
    original condition.


    The four storeys and basement are built in dark-brown brick under a flat roof. A stone band separates
    the top floor, which is accented by sculpture at the corners and two small stub towers either side
    of the central bay.


    Look for:

    - the half-round bay over the entrance, rising three and a half storeys

    - the corner sculpture and the two small towers on the top floor

    - the stone band that sets off the top storey

    '
  category: housing
  lat: 52.355511
  lng: 4.86764
  address: Koninginneweg 8
  links:
