  nl:
    title: Vrijburg (Remonstrantse kerk)
    summary: Remonstrantse kerk van Jordanus Roodenburgh (1932–1933) in Late Amsterdamse School-stijl,
      met hoog zadeldak, klokkentoren, een glas-in-loodkruis boven de rondboogingang en sluitstenen van
      Louise Beijerman.
    body: 'De Remonstrantse gemeente, tot dan gehuisvest in de kerk Vrijburg aan de Keizersgracht 102,
      liet in 1932–1933 aan de Diepenbrockstraat een nieuwe kerk bouwen met catechisatielokalen en een
      kosterswoning aan de Herman Gorterstraat. Het ontwerp in Late Amsterdamse School-stijl is van J.
      Roodenburgh. De kerk werd op 18 juni 1933 in gebruik genomen en zet de naam Vrijburg voort.


      De bakstenen kerk heeft een hoog oprijzend, overstekend zadeldak met zwarte pannen en lage zijvleugels.
      Een klokkentoren met spits rijst erboven uit.


      Let op:

      - de rondboogingang met siermetselwerk en bronzen letters ''remonstrantse kerk''

      - het grote glas-in-loodkruis erboven

      - de gebeeldhouwde sluitstenen van Louise Beijerman

      '
