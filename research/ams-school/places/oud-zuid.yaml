- title: Haarlemmermeerstraat blocks
  summary: 'Three architects, one symmetrical composition (1930–1932): Van der Mey, Roodenburgh and the
    Baanders brothers framed the Haarlemmermeerstraat with mansards, corner towers and stone bases.'
  body: 'Around the Haarlemmermeerstraat, Weissenbruchstraat and Theophile de Bockstraat, three firms
    each designed parts of two closed blocks in 1930–1932, keeping to a shared symmetry — an inheritance,
    the city register says, of the Amsterdam School and the Commissie Zuid.


    Joan van der Mey (of the Scheepvaarthuis) designed the corners at Weissenbruchstraat 29–43 / Haarlemmermeerstraat
    117–147 (1930): four storeys with red-tiled mansard roofs over a bluestone-clad base, with sculptural
    corner solutions the register calls characteristic of the Amsterdam School. Jordanus Roodenburgh''s
    blocks on the Legmeerplein side (1931–1932) are more classical, with an Amsterdam School touch in
    the porches. The Baanders brothers'' blocks (1931–1932) add a colossal order, corner towers and steel-railed
    balconies.


    Look for:

    - the high wall of the Haarlemmermeerstraat and its mirrored corners

    - Van der Mey''s mansards and bluestone base

    - the corner towers near the Theophile de Bockstraat

    '
  category: housing
