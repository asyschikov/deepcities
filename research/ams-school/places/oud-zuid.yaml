  nl:
    title: Bouwblok Warners, Olympiaplein
    summary: 'Etagewoningen van F.A. Warners in late Amsterdamse School-stijl (1926–1928) aan het Olympiaplein:
      negen gelijke traveeën onder een sterk overstekend schilddak, met een schoorsteen per travee.'
    body: 'F.A. Warners ontwierp het hele bouwblok tussen Olympiaplein, Gerrit van der Veenstraat, Leonardostraat
      en Titiaanstraat in twee delen, in de stijl van de late Amsterdamse School. De pleinzijde, ontworpen
      in 1926 en voltooid in 1928, heeft een repeterende reeks traveeën die past bij de grootstedelijke
      open ruimte; de zijde aan de Leonardostraat is afwisselender en intiemer. Een risalerend deel met
      topgevel markeert de overgang.


      De gevels zijn van oranjerode baksteen op een donkerbruine plint, onder een sterk overstekend schilddak
      met rode golfpannen.


      Let op:

      - de negen traveeën tussen twee licht afwijkende hoekpartijen

      - de diepe dakoverstek en de rij schoorstenen

      '
    attributes:
      original_use: Etagewoningen
    sources:
    - https://monumentenzoeker.amsterdam.nl/monument/222150
- title: Minervalaan II blocks (Rutgers)
  summary: Four Rutgers blocks at the Minervalaan crossing (c. 1928–1930) with shopping arcades whose
    capitals by Jacob Kaas show the seasons, crafts and members of the beauty commission.
  body: 'At the crossing of the Minervalaan and the Gerrit van der Veenstraat, Gerrit Jan Rutgers designed
    four blocks of flats with shops, one on each corner, in late Amsterdam School style. The national
    register lists them as the complex *Etagewoningen Minervalaan II*.


    Each corner has partly narrowed gables, and on the Minervalaan a lower gable over a shopping arcade.
    The brick arcade columns stand on stone bases and carry tufa capitals carved by Jacob Kaas (designed
    1928): the four seasons and crafts, and in one block portraits of members of the *Schoonheidscommissie*
    (later Commissie Zuid), the committee that vetted façades in Plan Zuid. Half-round tower bays run
    up between the housing units and end in small turrets above the roof.


    Look for:

    - Kaas''s carved capitals in the arcades, including the committee portraits

    - the rose window high in the big gable on the Minervalaan

    - the turrets crowning the half-round bays, and the copper-capped little tower

    '
