  nl:
    title: Villa Lebbink
    summary: 'Villa van Jo Mulder (1925–1927) aan de Apollolaan voor een kunstminnende valutahandelaar:
      lage goten, hoge topgevels, schuin gemetselde stenen en een kleurrijk glas-in-loodraam.'
    body: 'Valutahandelaar en kunstliefhebber Christiaan Lebbink liet deze vrijstaande villa met garage,
      samen met J.F.J. Eyrond & Zn., bouwen naar ontwerp van J.H. (Jo) Mulder jr., in verstrakte Amsterdamse
      School-stijl. Bij oplevering stond ze nog in een landelijke omgeving. Lebbink liet het interieur
      artistiek inrichten en woonde er zo''n tien jaar. Latere bewoners waren architect Kees Spanjer en
      choreografe Beppie Blankert.


      Het huis heeft een kelder, begane grond, een deels in de kap gelegen verdieping en een zolder, onder
      een zadeldak met zwart verglaasde Hollandse pannen.


      Let op:

      - de lage dakrand tegenover de hoge topgevels en de asymmetrische opbouw

      - stenen onder 45 graden langs de dakrand en visgraatmetselwerk hoog in de gevel

      - het kleurige glas-in-loodraam en de bakstenen tuinmuur

      '
    attributes:
      original_use: Villa
    sources:
    - https://nl.wikipedia.org/wiki/Villa_Lebbink
    - https://monumentenregister.cultureelerfgoed.nl/monumenten/527840
- title: Apollolaan villas
  summary: 'A cluster of 1925–1930 villas along the Apollolaan and Albert Hahnplantsoen: a towered double
    villa with garden houses, a villa with Mari Andriessen''s seasons, Baanders'' double villa and Rutgers''
    ''La Pergola''.'
  body: 'The stretch of the Apollolaan by the Albert Hahnplantsoen and Dijsselhofplantsoen, where gardens
    run down to the Noorder Amstelkanaal, became a small villa district within Plan Zuid.


    - Albert Hahnplantsoen 21–23: double villa (1930, design 1928) by E. Nijsten for J.J. Eyrond, in red-grey
    brick with a tower, overhanging eaves, and three garden houses linked by the garden walls (one belongs
    to Villa Lebbink).

    - Apollolaan 178: villa (1926–1928) by L.J.H. Zonneveldt and C.W. Rooyaards for C. Hülsmann, with
    sculpture by Mari Andriessen: two playing putti over the door and figures of the four seasons.

    - Albert Hahnplantsoen 25–27: double villa (1925–1928) by H.A.J. and Jan Baanders for J. Polak Grodel,
    really two stacked apartments, partly flat-roofed and partly under a shingled hipped roof.

    - Dijsselhofplantsoen 10: villa *La Pergola* (1928–1929) by G.J. Rutgers for B.A. Sanders; the pergola
    that named it is gone.


    Look for:

    - the tower and garden houses of Albert Hahnplantsoen 21–23

    - Andriessen''s putti keystone and seasons at Apollolaan 178

    '
