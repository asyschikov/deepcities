- title: Warners villas J.J. Viottastraat
  summary: Three double villas of 1925–1926 by F.A. Warners in a cubic, Frank Lloyd Wright-inspired version
    of the sober Amsterdam School, with gardens running down to the Noorder Amstelkanaal.
  body: 'Frederik Adriaan Warners designed these double villas in 1925–1926, with A.F. Baak as the engineer
    for the foundations and reinforced concrete. Two were commissioned by C. Schleicher (part of the work
    passed to the contractor NV voorheen J. Rozestraten), the third by W. den Tex-Bondt; an earlier 1920
    design for that plot by Harry Elte was never built.


    The national register describes them as sober (*verstrakte*) Amsterdam School with recognisable influences
    from Frank Lloyd Wright: interlocking cubic volumes, flat roofs, horizontal window bars, pentagonal
    bays and projecting cornices with an attic band. One house has an integral garage next to the kitchen,
    unusual at the time. The back gardens reach the canal, where Warners also designed a raised parapet
    on the quay wall.


    Look for:

    - pentagonal bay windows with zinc cornices and balcony parapets on the corner house at Cornelis Schuytstraat
    72

    - windows with horizontal glazing bars between bands of block-patterned brickwork

    - the original wrought-iron front door and the brick flower box under the first-floor windows

    - the old garden wall with wooden gates on the J.J. Viottastraat

    '
