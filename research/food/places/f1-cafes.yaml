    - "https://onsamsterdam.nl/artikelen/beroemde-stamkroegen (2008; at Reijnders Wim Sonneveld and Conny Stuart after rehearsals, with Simon Vinkenoog, Ramses Shaffy and other alternative youth around 1960)"
