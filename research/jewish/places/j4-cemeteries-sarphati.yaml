  nl:
    title: Sarphati's broodfabriek (verdwenen), Nieuwe Weteringstraat
    summary: Op de plek van de broodfabriek die Samuel Sarphati in 1855 op touw zette, is een hele straat aangelegd. Met een stoommalerij en heteluchtovens bakte ze tarwebrood ver onder de bakkersprijs, en andere broodfabrieken volgden al snel.
    body: |
      Rond 1850 was brood duur en vaak slecht: molenaars en bakkers maakten onderling afspraken over de prijs, en het meel werd met goedkopere dingen aangelengd. De arts Samuel Sarphati meende dat een fabriek beter en goedkoper brood kon bakken, en in 1855 nam hij het initiatief tot de Maatschappij voor Meel- en Broodfabrieken. Het complex kwam op de oude stratenmakerswerf van de stad, tussen de Vijzelgracht en de Lijnbaansgracht, en begon in 1857 te bakken.

      Dankzij een eigen stoommalerij en heteluchtovens werd er sneller en goedkoper gebakken, en het witbrood kostte zo'n dertig procent minder dan bij de bakker. De fabriek werd een succes en kreeg al snel navolging, in Amsterdam en daarbuiten.

      Van de fabriek is niets over. Na de sluiting is het complex gesloopt, en op het vrijgekomen terrein werd de Nieuwe Weteringstraat aangelegd, een korte woonstraat tussen de Vijzelgracht en de Lijnbaansgracht. Dat de straat er is, is het spoor van de fabriek.

      Let op:
      - het tracé van de Nieuwe Weteringstraat zelf, dwars door het oude bouwblok waar de fabriek stond
      - de Lijnbaansgracht aan het eind, de achtergrens van het fabrieksterrein
    attributes:
      built: 1856–1857
      original_use: Stoommeel- en broodfabriek
