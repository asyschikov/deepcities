- title: Sarphati's bread factory (gone), Nieuwe Weteringstraat
  summary: A whole street was laid out on the site of the bread factory Samuel Sarphati set up in 1855. Its steam mill and hot-air ovens baked wheat bread well below the bakers' price, and other bread factories soon followed.
  body: |
    Around 1850 bread in Amsterdam was dear and often bad: millers and bakers agreed prices among themselves, and flour was cut with cheaper stuff. The doctor Samuel Sarphati argued that a factory could bake better and cheaper bread, and in 1855 he set up the Maatschappij voor Meel- en Broodfabrieken (Society for Flour and Bread Factories). Its works rose on the old city paving yard between the Vijzelgracht and the Lijnbaansgracht and started baking in 1857.

    A steam mill and hot-air ovens let it bake faster and more cheaply, and its white bread sold at about thirty per cent under the bakers' price. It was a success, and other bread factories soon copied the idea, in Amsterdam and beyond.

    Nothing of the factory survives. After it closed the complex was pulled down, and the Nieuwe Weteringstraat, a short street of housing between the Vijzelgracht and the Lijnbaansgracht, was laid out across its ground. The street's very existence is its trace.

    Look for:
    - the line of the Nieuwe Weteringstraat itself, cut through the old block where the factory stood
    - the Lijnbaansgracht at the far end, the factory's back boundary
