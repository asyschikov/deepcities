- title: Herengracht 598, Samuel Sarphati's house
  summary: Next to the corner house on the Amstel, the city improver Samuel Sarphati lived in this seventeenth-century canal house with his wife. In June 1866 thousands lined the canals as his funeral left from here for Ouderkerk.
  body: |
    Samuel Sarphati (1813–1866), son of a Portuguese-Jewish tobacco dealer, took his doctor's degree in Leiden in 1839 and in 1840 became physician to the poor of the Portuguese-Jewish community. In 1843 he married Abigaël Mendes de Leon, from one of the community's leading families, and they lived here, in a seventeenth-century house next to the corner with the Amstel.

    From these years came most of what he started: refuse collection in 1847, the bread factory in 1855, the Paleis voor Volksvlijt, opened in 1864, and the Amstel Hotel. Abigaël died in May 1864, a few months before the palace opened. Sarphati himself died on 23 June 1866, aged 53, before the Amstel Hotel was finished. His funeral, from this house to the cemetery at Ouderkerk, drew thousands into the streets.

    The house is private, best seen from across the canal.

    Look for:
    - the neck gable, given back its original shape in a restoration
    - the corner house next door (no. 600), which forms a group with it
    - the Amstel Hotel, his last project, across the river to the south-east
