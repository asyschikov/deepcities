- title: Jewish cemetery Diemen, where the Zeeburg graves went
  summary: Opened in 1914 when Zeeburg was full, cut in two by a railway viaduct in 1925, then given 28,000 graves moved from Zeeburg. In field U lie some 400 urns from Westerbork, ashes of Jews cremated in the camp against Jewish law.
  body: |
    By the start of the twentieth century the Ashkenazi community's cemetery at Zeeburg was running out of room, so in 1907 it decided on a new one in the Diemen polder; it opened in 1914. In 1925 the municipality expropriated a strip for a railway viaduct, which split the grounds in two. Harry Elte designed the metaheerhuis, the house where the dead are washed and prepared, built in 1931.

    In 1956 part of Zeeburg was sold for road building, and about 28,000 graves, with the soil around them, were moved here. Those fields lie higher than the rest, and a stone in Hebrew and Dutch ends: "May this resting place remain undisturbed."

    Field U is the smallest. Jews are buried, not cremated, but between 1943 and 1945 the camp at Westerbork cremated 529 Jewish prisoners who died there. During and after the war their urns went to the places they came from; about 400, of Amsterdam Jews, were buried here close together.

    Visiting: Sunday to Thursday until 16:00, Friday and the eve of holidays until 14:00; closed on the Sabbath and Jewish holidays. Men cover their heads, and visitors keep to the paths. Field A is entered from the Ouddiemerlaan 146, fields B, C and D from Landlust 2.

    Look for:
    - the railway between the western and eastern parts
    - the Zeeburg stone and the raised Zeeburg fields
    - Elte's metaheerhuis at the end of the entrance path of the eastern part
