  nl:
    title: Beth Haim, de Portugees-Joodse begraafplaats in Ouderkerk
    summary: Sinds 1614 begraven de Portugese Joden van Amsterdam hun doden in dit dorp aan de Amstel, vroeger over het water aangevoerd. Zulke gebeeldhouwde marmeren graven uit de Gouden Eeuw vind je nergens anders op Joodse graven. Samuel Sarphati ligt hier naast zijn vrouw.
    body: |
      De Sefardische (Portugese) Joden die zich in Amsterdam vestigden, kregen in de stad geen begraafplaats en begroeven hun doden eerst in Groet, boven Alkmaar. In 1614 kochten ze grond in Ouderkerk aan de Amstel, waar de Bullewijk in de Amstel uitstroomt, en voortaan kwamen de doden uit de stad over het water; Beth Haim (Huis des Levens) heeft nog altijd zijn aanlegsteiger. De graven in Groet werden later hierheen overgebracht.

      Op zo'n vier hectare liggen 28.000 tot 30.000 mensen, en volgens de Joodse wet wordt geen graf ooit geruimd. Veel eenvoudige liggende stenen zijn in het veen weggezakt. Beroemd is de begraafplaats om de marmeren graven van rijke families uit de zeventiende eeuw, met gebeeldhouwde figuren en voorstellingen zoals op geen andere Joodse graven. Jacob van Ruisdael schilderde het graf van Eliahu Montalto, lijfarts van Maria de' Medici. Menasseh ben Israel, de ouders van Spinoza en Samuel Sarphati liggen hier, Sarphati naast zijn vrouw Abigaël Mendes de Leon.

      Bezoek: gratis, zondag tot en met donderdag van 8.30 uur tot 19.00 uur (oktober tot en met maart) of 20.00 uur (april tot en met september), vrijdag tot 17.00 uur; gesloten op zaterdag en op Joodse feestdagen. Zoals op elke Joodse begraafplaats bedekken mannen het hoofd en blijven bezoekers op de paden. In het Coronelpaviljoen bij de ingang (2020) draait een film en staan maquettes; de gratis app Beth Haim Tour Guide wijst verschillende routes. Rondleidingen op afspraak.

      Let op:
      - het Rodeamentoshuis van 1705, waar men zevenmaal om de kist van een overleden man loopt (alleen met een gids van binnen te zien)
      - de gebeeldhouwde marmeren graven in het oudste deel, bij het Rodeamentoshuis
      - het Vegahuis aan de Kerkstraat, waar tot 2014 de bewaarders met hun gezinnen woonden
    attributes:
      built: 1614; Rodeamentoshuis 1705
      original_use: Portugees-Joodse begraafplaats
