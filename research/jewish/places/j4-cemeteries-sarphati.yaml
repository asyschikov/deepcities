  nl:
    title: Joodse begraafplaats Diemen, waar de graven van Zeeburg heen gingen
    summary: In 1914 geopend toen Zeeburg vol raakte, in 1925 door een spoorviaduct in tweeën gedeeld, en daarna de nieuwe rustplaats van 28.000 graven uit Zeeburg. Op veld U liggen zo'n 400 urnen uit Westerbork, as van Joden die tegen de Joodse wet in in het kamp werden gecremeerd.
    body: |
      Begin twintigste eeuw raakte de begraafplaats van de Hoogduitse gemeente op Zeeburg vol. In 1907 besloot de gemeente tot een nieuwe in de Diemerpolder, die in 1914 in gebruik werd genomen. In 1925 onteigende de gemeente een strook voor een spoorwegviaduct, waardoor het terrein in tweeën viel. Harry Elte ontwierp het metaheerhuis, waar de doden worden gewassen en verzorgd, gebouwd in 1931.

      In 1956 werd een deel van Zeeburg verkocht voor de aanleg van een weg, en zo'n 28.000 graven gingen, met de grond eromheen, naar Diemen. Die velden liggen hoger dan de rest, en een steen in het Hebreeuws en Nederlands sluit af met: 'Moge deze rustplaats verder ongestoord blijven.'

      Veld U is het kleinste. Joden worden begraven, niet gecremeerd, maar tussen 1943 en 1945 werden in kamp Westerbork 529 Joodse gevangenen die daar stierven gecremeerd. Tijdens en na de oorlog gingen hun urnen naar de plaatsen van herkomst; ongeveer 400, van Amsterdamse Joden, liggen hier dicht opeen begraven.

      Bezoek: zondag tot en met donderdag tot 16.00 uur, vrijdag en de dag voor een feestdag tot 14.00 uur; gesloten op sjabbat en Joodse feestdagen. Heren bedekken het hoofd en bezoekers blijven op de paden. Veld A is bereikbaar via de Ouddiemerlaan 146, de velden B, C en D via Landlust 2.

      Let op:
      - het spoor tussen het westelijke en het oostelijke deel
      - de gedenksteen van Zeeburg en de opgehoogde Zeeburgvelden
      - het metaheerhuis van Elte aan het eind van het toegangspad van het oostelijke deel
    attributes:
      built: 1914; metaheerhuis 1931
      architect: Harry Elte (metaheerhuis)
