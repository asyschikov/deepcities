  nl:
    title: Joodse begraafplaats Muiderberg, de grootste die nog in gebruik is
    summary: Sinds 1642 begraven de Hoogduitse Joden van Amsterdam hun doden achter deze eeuwenoude bakstenen muur. Met zo'n 45.000 graven de grootste die nog in gebruik is; in het monument van 1948 rust de as van 28 jonge mannen die in februari 1941 werden opgepakt.
    body: |
      In 1642 kochten de Hoogduitse (Asjkenazische) Joden van Amsterdam bij Muiderberg grond voor een eigen begraafplaats, achter een bakstenen muur die er nog altijd staat. De Poolse Joden voegden zich later bij hen, en het terrein werd verschillende keren uitgebreid, tot zo'n 16 hectare.

      Er liggen ongeveer 45.000 mensen, en daarmee is dit de grootste Joodse begraafplaats van Nederland die nog in gebruik is. Over het terrein lopen speciale paden voor kohaniem, mannelijke afstammelingen van de priesters, die niet dicht bij een overledene mogen komen. De twee bakstenen gebouwen bij de ingang, het ontvangstgebouw en het metaheerhuis dat als aula dient, zijn in de stijl van de Amsterdamse School ontworpen door Harry Elte en kwamen in 1933 klaar.

      Naast de aula staat het monument dat op 30 mei 1948 werd onthuld voor de Joden die uit Amsterdam zijn weggevoerd en vermoord. Voor de bakstenen gedenkmuur liggen 28 grafstenen met de namen van jonge mannen die bij de razzia's van februari 1941 werden opgepakt; hun as ligt in urnen eronder.

      Bezoek: zondag tot en met donderdag van 10.00 tot 16.00 uur, vrijdag en de dag voor een feestdag van 10.00 tot 14.00 uur; gesloten op zaterdag en Joodse feestdagen. Heren bedekken het hoofd en bezoekers blijven op de paden. Parkeren tegenover de ingang; in het seizoen zijn er rondleidingen.

      Let op:
      - de oude bakstenen muur langs de Googweg
      - de twee bakstenen gebouwen van Elte bij de ingang
      - het monument van 1948 naast de aula, met de 28 stenen ervoor
    attributes:
      built: 1642; gebouwen 1933
      architect: Harry Elte (gebouwen)
      original_use: Hoogduits-Joodse begraafplaats
