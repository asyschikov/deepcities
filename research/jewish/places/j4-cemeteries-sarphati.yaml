  nl:
    title: Herengracht 598, het huis van Samuel Sarphati
    summary: Naast het hoekhuis aan de Amstel woonde de stadsvernieuwer Samuel Sarphati met zijn vrouw in dit zeventiende-eeuwse grachtenhuis. In juni 1866 stonden duizenden langs de grachten toen zijn lijkstoet hiervandaan naar Ouderkerk vertrok.
    body: |
      Samuel Sarphati (1813-1866), zoon van een Portugees-Joodse tabakshandelaar, promoveerde in 1839 in Leiden tot arts en werd in 1840 armenarts van de Portugees-Joodse gemeente. In 1843 trouwde hij met Abigaël Mendes de Leon, uit een van de vooraanstaande families van de gemeente, en het paar woonde hier, in een zeventiende-eeuws huis naast de hoek met de Amstel.

      Uit deze jaren stamt het meeste wat hij op gang bracht: de afvalinzameling in 1847, de broodfabriek in 1855, het Paleis voor Volksvlijt, geopend in 1864, en het Amstel Hotel. Abigaël overleed in mei 1864, een paar maanden voor de opening van het paleis. Sarphati zelf stierf op 23 juni 1866, 53 jaar oud, voordat het Amstel Hotel klaar was. Zijn begrafenis, van dit huis naar de begraafplaats in Ouderkerk, bracht duizenden mensen op de been.

      Het huis is particulier en het best te zien vanaf de overkant van de gracht.

      Let op:
      - de halsgevel, bij een restauratie in de oorspronkelijke vorm teruggebracht
      - het hoekhuis ernaast (nr. 600), dat er een groep mee vormt
      - het Amstel Hotel, zijn laatste project, aan de overkant van de rivier in het zuidoosten
    attributes:
      built: 17de eeuw
      original_use: Grachtenhuis
    sources:
      - https://www.monumenten.nl/monument/1915
      - https://www.joodsamsterdam.nl/samuel-sarphati/
      - https://nl.wikipedia.org/wiki/Samuel_Sarphati
