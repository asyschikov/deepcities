- title: Beth Haim, the Portuguese Jews' cemetery at Ouderkerk
  summary: Since 1614 the Portuguese Jews of Amsterdam have buried their dead in this village on the Amstel, once brought over the water. Its carved marble tombs of the Golden Age have no match on Jewish graves anywhere; Samuel Sarphati lies here beside his wife.
  body: |
    The Sephardic (Portuguese) Jews who settled in Amsterdam were refused a burial ground in the city and first buried their dead at Groet, north of Alkmaar. In 1614 they bought land at Ouderkerk aan de Amstel, where the Bullewijk flows into the Amstel, and from then on the dead came from the city over the water; Beth Haim (House of Life) still has its landing stage. The graves at Groet were later moved here.

    Between 28,000 and 30,000 people lie in about four hectares, and under Jewish law no grave is ever cleared. Many plain stones have sunk into the peat. What makes the place famous are the marble tombs of rich families of the seventeenth century, carved with figures and scenes as on no other Jewish graves. Jacob van Ruisdael painted the tomb of Eliahu Montalto, physician to Maria de' Medici. Menasseh ben Israel, Spinoza's parents and Samuel Sarphati are buried here, Sarphati beside his wife Abigaël Mendes de Leon.

    Visiting: free, Sunday to Thursday from 8:30 until 19:00 (October to March) or 20:00 (April to September), Friday until 17:00; closed on Saturdays and Jewish holidays. As at any Jewish cemetery, men cover their heads and visitors keep to the paths. The Coronel pavilion by the entrance (2020) shows a film and models; a free app (Beth Haim Tour Guide) leads several routes. Guided tours by appointment.

    Look for:
    - the Rodeamentoshuis of 1705, where mourners walk seven times round the coffin of a man (inside only on a guided visit)
    - the carved marble tombs in the oldest part, near the Rodeamentoshuis
    - the Vegahuis on the Kerkstraat, where the caretakers and their families lived until 2014
