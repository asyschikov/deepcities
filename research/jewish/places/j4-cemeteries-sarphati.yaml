- title: Jewish cemetery Muiderberg, the largest still in use
  summary: Amsterdam's Ashkenazi Jews have buried their dead behind this old brick wall since 1642. With about 45,000 graves it is the largest Jewish cemetery still in use in the Netherlands, and its 1948 monument holds the ashes of 28 young men taken in February 1941.
  body: |
    In 1642 the Ashkenazi (German) Jews of Amsterdam bought ground for a cemetery of their own near Muiderberg, behind a brick wall that still stands. The Polish Jews' community later joined them, and the ground was extended several times, to about 16 hectares.

    About 45,000 people lie here, which makes it the largest Jewish cemetery still in use in the Netherlands. Special paths run across it for kohanim, men of priestly descent who may not come near the dead. The two brick buildings at the entrance, a reception building and the metaheerhuis (house for preparing the dead) used as the funeral hall, were designed by Harry Elte in the style of the Amsterdam School and opened in 1933.

    Beside the hall stands the monument unveiled on 30 May 1948 for the Jews deported from Amsterdam and murdered. In front of its brick wall lie 28 gravestones with the names of young men taken in the raids of February 1941; their ashes rest in urns beneath.

    Visiting: Sunday to Thursday 10:00 to 16:00, Friday and the eve of holidays 10:00 to 14:00; closed on Saturdays and Jewish holidays. Men cover their heads and keep to the paths. Parking opposite the gate; guided tours in season.

    Look for:
    - the old brick wall along the Googweg
    - Elte's two brick buildings at the entrance
    - the 1948 monument beside the hall, with the 28 stones in front of it
