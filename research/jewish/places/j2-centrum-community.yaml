    body: |
      De bakkerij De Haan vestigde zich in 1830 in de Valkenburgerstraat, toen de straat bij de volle Jodenbuurt op het eiland Marken hoorde. Als A.I. de Haan & Co. werd het een van de bekendste matzebakkers van het land: voor de oorlog bakte de fabriek vijf tot zes miljoen matzes per jaar, het ongedesemde brood van Pesach.

      Het uithangbord was een woordgrap op de naam: een haan in hardgebakken keramisch reliëf. De steen zat in de gevel tot het pand in 2002 werd gesloopt. De Vereniging Vrienden van de Amsterdamse Gevelstenen redde hem, en in 2007 kwam hij terug in de nieuwbouw op de plek. Niet in de straatgevel, maar binnen, bij de ingang.

      Bezoek: de nieuwbouw is particulier; de steen zit niet in de straatgevel.

