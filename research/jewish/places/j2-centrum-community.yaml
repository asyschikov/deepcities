  nl:
    title: Aby Jetomim, het Portugees-Joodse jongensweeshuis (Plantage Middenlaan 80)
    summary: "Een vereniging uit 1648 die zorgde voor Portugees-Joodse weesjongens, een van de oudste van Amsterdam, trok in 1930 met haar weeshuis in dit huis. Dertien jaar later werden de vader en moeder van het weeshuis in Sobibor vermoord."
    body: |
      Aby Jetomim ("vader van de wezen") werd in 1648 door Portugese Joden opgericht en is een van de oudste Joodse wezenverenigingen van Amsterdam. Een eigen huis had ze aanvankelijk niet: ze besteedde weesjongens uit bij particulieren, die ze verzorgden en opvoedden. In 1817 kwam er een eigen weeshuis in de Jodenbreestraat, in een van de gebouwen van de vereniging.

      In 1930 verhuisde het weeshuis hierheen, naar een woonhuis aan de Plantage Middenlaan dat voor een particulier gezin was gebouwd. In de bezetting waren Isaäc en Sara Drukker de vader en moeder van het weeshuis. Beiden werden gedeporteerd en op 4 juni 1943 in Sobibor vermoord. Na de oorlog werd het weer een woonhuis.

      Bezoek: particulier, alleen vanaf de straat te zien. De plaquette over de oprichting zit binnen en is niet te zien.

      Let op:
      - de gevel van nr. 80 aan de Middenlaan, een paar deuren van de villa's en bejaardenhuizen van de oostelijke Plantage
    attributes:
      original_use: Woonhuis; Portugees-Israëlitisch jongensweeshuis 1930 tot 1943
