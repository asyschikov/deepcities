  nl:
    title: Tip Top, het theater van de Jodenhoek (verdwenen)
    summary: "Vanaf 1914 had de Jodenbreestraat een eigen bioscoop en variététheater, waar Louis en Heintje Davids optraden. De bezetter sloot het, in de hongerwinter ging het hout in de kachel, in 1953 viel de ruïne. Sinds maart 2026 markeren glas-in-loodramen de ingang."
    body: |
      Het Tip Top opende op 17 maart 1914 midden in de Jodenhoek als bioscoop met een toneeltje, ontworpen door de architecten Gulden en Geldmaker, met Joseph Kroonenberg als directeur. Er draaiden films en er was cabaret en variété; Louis en Heintje Davids hoorden bij de artiesten die hier stonden.

      Bij de eerste razzia op Joden in Amsterdam, op 22 februari 1941, werden mannen uit de buurt tegen de muur van het theater opgesteld, en daar is een foto van. Later sloot de bezetter het theater. De filmoperateur hield een achterdeur open, zodat opgejaagde buurtgenoten zich binnen konden verstoppen. In de hongerwinter van 1944-1945 werd het hout eruit gesloopt om te stoken, en aan het eind van de oorlog stonden alleen de zijmuren nog. Wat over was werd in 1953 afgebroken, toen de Jodenbreestraat werd verbreed.

      Op de plek staat nu de Academie voor Theater en Dans. Op 17 maart 2026, 112 jaar na de opening, werden daar zes glas-in-loodramen onthuld, ontworpen door Luka Viool en uitgevoerd door glazenier Robin Kapitein, op de plek van de vroegere hoofdingang. Ze hangen aan de voorkant van het gebouw, zodat je ze vanaf de straat ziet.

      Let op:
      - de zes glas-in-loodramen in de gevel van de academie, beelden van het theater voor, tijdens en na de oorlog
      - aan de overkant het Rembrandthuis en het Goslerhuisje, die een eigen plek hebben
