      - joodsamsterdam.nl/nieuwe-herengracht

- title: Lindenbaum's printing works and the boy's first stone (Reguliersdwarsstraat 10)
  summary: "In September 1912 eleven-year-old Erwin Lindenbaum laid the first stone of his father's new printing works, and it is still in the front. A few years later his father's lawsuit against a rival printer changed Dutch law. Father, mother and son were murdered in 1944."
  body: |
    Max Lindenbaum was a printer from Essen who had settled in Amsterdam. In 1907 he bought Herengracht 457, and in 1912 he had this building put up behind it, on the Reguliersdwarsstraat, for his printing works. The first stone was laid that September by his son Erwin, who had just turned eleven; it is still in the front, beside three relief stones over the first-floor windows.

    The firm's name lives on in law books. A rival printer, Cohen, bribed one of Lindenbaum's clerks to pass on his quotes. Nothing in the law forbade it, and Lindenbaum lost on appeal. On 31 January 1919 the Supreme Court ruled for him anyway, holding that acting against good morals or the care owed to others in society is also unlawful. Lindenbaum/Cohen became a landmark of Dutch civil law.

    The family did not survive the war. Max Lindenbaum and his wife Bertha died in Theresienstadt in November 1944; Erwin, by then a translator, was murdered in Auschwitz on 31 March 1944. The building is now flats.

    Visiting: private; the stones are in the street front.

    Look for:
    - the first stone in the front of no. 10
    - the three relief stones over the first-floor windows, and the wrought-iron railing along the roof
