- title: The rooster of De Haan's matzo factory (Valkenburgerstraat)
  summary: "A ceramic rooster, haan in Dutch, once named the matzo bakery of A.I. de Haan, which baked five to six million matzos a year in this street before the war. Saved when the old building came down, it returned to the new block on the site in 2007, inside its entrance."
  body: |
    The De Haan bakery settled in the Valkenburgerstraat in 1830, when the street was part of the crowded Jewish quarter on the island of Marken. As A.I. de Haan & Co. it became one of the best-known matzo bakers in the country: before the war it turned out five to six million matzos a year, the unleavened bread eaten at Passover.

    Its sign was a pun on the name: a rooster in hard-baked ceramic relief. The stone stayed in the front until 2002, when the building came down. The Friends of Amsterdam's Gable Stones (Vereniging Vrienden van de Amsterdamse Gevelstenen) saved it, and in 2007 it came back in the new building on the site. It was not put in the street front but inside, by the entrance.

    Visiting: the new building is private; the stone is not on the street front.

    Look for:
    - the ceramic rooster inside the entrance of no. 186
    - a few doors north, Valkenburgerstraat 202-210, the street's last old building, which has its own place
