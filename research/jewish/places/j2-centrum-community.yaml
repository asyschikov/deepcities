  nl:
    title: Drukkerij Lindenbaum en de eerste steen van de jongen (Reguliersdwarsstraat 10)
    summary: "In september 1912 legde de elfjarige Erwin Lindenbaum de eerste steen van de drukkerij van zijn vader; die zit nog in de gevel. Een paar jaar later veranderde het proces van zijn vader tegen een concurrent het Nederlandse recht. Vader, moeder en zoon kwamen in 1944 om."
    body: |
      Max Lindenbaum was een drukker uit Essen die zich in Amsterdam had gevestigd. In 1907 kocht hij Herengracht 457, en in 1912 liet hij daarachter, aan de Reguliersdwarsstraat, dit pand voor zijn drukkerij bouwen. De eerste steen werd die septembermaand gelegd door zijn zoon Erwin, die net elf was geworden; hij zit nog in de gevel, naast drie gevelstenen met reliëf boven de ramen van de eerste verdieping.

      De naam van de firma leeft voort in de rechtenstudie. Concurrent Cohen kocht een bediende van Lindenbaum om, die hem zijn offertes doorspeelde. Geen wet verbood dat, en in hoger beroep verloor Lindenbaum. Op 31 januari 1919 gaf de Hoge Raad hem toch gelijk: ook wie handelt tegen de goede zeden of de zorgvuldigheid die in het maatschappelijk verkeer betaamt, handelt onrechtmatig. Lindenbaum/Cohen werd een mijlpaal in het Nederlandse burgerlijk recht.

      De familie overleefde de oorlog niet. Max Lindenbaum en zijn vrouw Bertha stierven in november 1944 in Theresienstadt; Erwin, inmiddels vertaler, werd op 31 maart 1944 in Auschwitz vermoord. Het pand is nu verbouwd tot appartementen.

      Bezoek: particulier; de stenen zitten in de straatgevel.

      Let op:
      - de eerste steen in de gevel van nr. 10
      - de drie reliëfstenen boven de ramen van de eerste verdieping, en het smeedijzeren hek langs het dak
    attributes:
      original_use: Drukkerij
      check_note: "Het monumentenregister noemt 26 september 1912 voor de eerste steen, een andere bron 25 september (Erwins verjaardag); lees de datum op de steen"
    sources:
      - monumentenregister Amsterdam 215001 (redengevende omschrijving)
