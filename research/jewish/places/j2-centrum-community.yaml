- title: Rapenburgersjoel, the synagogue of the 1797 breakaway
  summary: "A year after Dutch Jews won equal citizenship, a group wanting a modern community left the Ashkenazi congregation, and from 1799 prayed in this house. Under Louis Napoleon the split was undone in 1808. Next door the Jewish seminary trained rabbis until the war."
  body: |
    In 1796 the Batavian Republic made Jews equal citizens. Some Amsterdam Jews wanted their community to change with it: they called themselves Jewish Dutchmen rather than Dutch Jews, and wanted reforms such as Dutch in the service. In 1797 they broke away from the Ashkenazi (High German) congregation and founded their own, Adath Jesurun, known as the Neie Kille ("new community"). They prayed in a private house at first, from June 1797 in a house on the Nieuwe Herengracht facing the Plantage, and on 1 May 1799 they held their first service here. They also opened their own cemetery at Overveen.

    The breakaway did not last. Under King Louis Napoleon the two communities were reunited in 1808, and this became an ordinary synagogue of the main congregation, in use until the Second World War.

    Next door, at nos. 175-177, the Nederlands Israëlietisch Seminarium (the Dutch Jewish seminary) trained rabbis and teachers from 1839 until the war. The seminary still exists, elsewhere in the city.

    Visiting: both buildings are private and can only be seen from the street.

    Look for:
    - the tall windows of no. 173, the only outside sign of the synagogue
    - the seminary's long front at nos. 175-177
    - next door at no. 171, the Jewish girls' orphanage, which has its own place
  category: religious
