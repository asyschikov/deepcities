  nl:
    title: Rapenburgersjoel, de sjoel van de afscheiding van 1797
    summary: "Een jaar na de gelijkberechtiging van de Joden stapte een groep die een moderne gemeente wilde uit de Hoogduitse gemeente; vanaf 1799 kerkten ze in dit huis. In 1808 maakte Lodewijk Napoleon de scheuring ongedaan. Ernaast leidde het seminarium rabbijnen op."
    body: |
      In 1796 kregen de Joden in de Bataafse Republiek gelijke burgerrechten. Een deel van de Amsterdamse Joden wilde dat hun gemeente daarin meeging: ze zagen zich als Joodse Nederlanders, niet als Nederlandse Joden, en wilden hervormingen, zoals Nederlands tijdens de dienst. In 1797 scheidden ze zich af van de Hoogduitse gemeente en stichtten Adath Jesurun, de Neie Kille ("nieuwe gemeente"). Eerst kwamen ze bijeen in een woonhuis, vanaf juni 1797 in een huis aan de Nieuwe Herengracht tegenover de Plantage, en op 1 mei 1799 was hier de eerste dienst. Ze hadden ook een eigen begraafplaats in Overveen.

      Lang duurde het niet. Onder koning Lodewijk Napoleon werden de twee gemeenten in 1808 herenigd, en dit werd een gewone sjoel van de Hoogduitse gemeente, in gebruik tot de Tweede Wereldoorlog.

      Ernaast, op nr. 175-177, leidde het Nederlands Israëlietisch Seminarium van 1839 tot de oorlog rabbijnen en onderwijzers op. Het seminarium bestaat nog, op een ander adres in de stad.

      Bezoek: beide panden zijn particulier en alleen vanaf de straat te zien.

      Let op:
      - de hoge ramen van nr. 173, het enige wat buiten nog aan de sjoel herinnert
      - de lange gevel van het seminarium op nr. 175-177
      - ernaast op nr. 171 het Joodse meisjesweeshuis, dat een eigen plek heeft
    attributes:
      original_use: Woonhuis, vanaf 1799 synagoge van Adath Jesurun
    sources:
      - joodsamsterdam.nl/synagoge-rapenburgerstraat-173
      - joodsamsterdam.nl/nederlands-israelitisch-seminarium
      - geheugenvanoost.amsterdam (De Vrijdagavond)

- title: Waterlooplein market, from Jewish market to flea market
  summary: "When two canals were filled in 1882, the city moved the mostly Jewish street traders of the Jodenbreestraat onto the new square. From 1893 it was a daily market, closed on Saturdays. In the war its playground held one of the markets where only Jews could buy and sell."
  body: |
    The Waterlooplein was made in 1882 by filling in the Leprozengracht and the Houtgracht. The city then decided that the street traders around the Jodenbreestraat, most of them Jewish, had to move their stalls onto the new square. From 1893 it was a daily market, open six days a week and shut on Saturday, the Sabbath.

    During the occupation Jews were barred from the ordinary markets. From late 1941 to 1943 they could only trade and shop at a few separate markets behind closed fences, and one of them was in the playground on the Waterlooplein. The Jewish quarter around the square was emptied by the deportations, and after the war little was left of the Jewish market.

    What came back was a flea market. Most of the old square disappeared in the 1970s and 1980s under the metro and the Stopera, the town hall and opera house that now fill its south side, and the market squeezed in around them.

    Visiting: about 300 stalls on the Waterlooplein and along the Zwanenburgwal, Monday to Saturday from 9:30 to 18:00; closed on Sunday.

    Look for:
    - on the Amstel corner, the black column of the monument to Jewish resistance, which has its own place
    - across the Mr. Visserplein, the Portuguese Synagogue and the Jewish Museum
    - behind the stalls, the poor relief's peat stores and the Moses and Aaron church, which have their own place
