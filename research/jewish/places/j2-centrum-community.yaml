- title: Nieuwe Herengracht 33, the stones of the Portuguese-Jewish old men's home
  summary: "Over the door, a stone in Hebrew letters and a Dutch rhyme blessing whoever feeds the aged, brought from the first house of the Portuguese-Jewish old men's home. Its residents were deported in February 1943."
  body: |
    In 1751 the brotherhood Mishenet Zekenim opened a home for poor old Jewish men in the Weesperstraat. In 1794 it bought this larger house on the Nieuwe Herengracht and moved the Portuguese-Jewish old men's home here; the old women stayed behind and later got a home of their own on the Amstel. Two text stones from the Weesperstraat house were set into this front when the old house was demolished in 1932. The upper one is in Hebrew letters. The lower one reads, in old Dutch: DES HEMELS GUNST BESTRAALT EN ZEGEND EN BEHOED DIE DE OUD BEJAARDE LIEN STAAG ONDERHOUD EN VOED, "heaven's favour shines on, blesses and guards those who keep and feed the aged".

    In February 1943 the occupier deported the residents, and they were murdered in the camps.

    Visiting: a private house; the stones are over the front door, easily read from the quay.

    Look for:
    - the two stones over the door, the Hebrew one above, the Dutch rhyme below
    - round the corner on the Amstel, the almshouses of the Amstelhof corner, which have their own place
