- title: Aby Jetomim, the Portuguese boys' orphanage (Plantage Middenlaan 80)
  summary: "A society founded in 1648 to care for Portuguese-Jewish orphan boys, among the oldest in Amsterdam, moved its orphanage into this house in 1930. Thirteen years later the orphanage's father and mother were murdered in Sobibor."
  body: |
    Aby Jetomim ("father of the orphans") was founded in 1648 by Portuguese Jews and is one of the oldest Jewish orphan societies in Amsterdam. At first it did not run a home: it paid private families to take in and bring up orphan boys. In 1817 it opened its own orphanage in the Jodenbreestraat, in one of the society's buildings there.

    In 1930 the orphanage moved here, into a house on the Plantage Middenlaan that had been built for a private family. During the occupation Isaäc and Sara Drukker ran it as father and mother of the orphanage. Both were deported and murdered in Sobibor on 4 June 1943. After the war the house became a private home again.

    Visiting: private; seen from the street only. The society's founding plaque is inside and cannot be seen.

    Look for:
    - the front of no. 80 on the Middenlaan, a few doors from the villas and old people's homes of the eastern Plantage
