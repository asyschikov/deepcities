  nl:
    title: De Waag op de Nieuwmarkt, stadspoort, gildehuis en eerste Joods museum
    summary: "Een vijftiende-eeuwse stadspoort, een van de twee die Amsterdam nog heeft, werd in 1617 een waag en huisvestte de gilden, ook de chirurgijns, voor wie Rembrandt de Anatomische les schilderde. In 1932 opende het Joods Historisch Museum in de torenkamer; het bleef tot 1987."
    body: |
      Dit was de Sint Antoniespoort, een poort in de stadsmuur. Een steen in de toren op de hoek met de Zeedijk zegt dat de eerste steen op 28 april 1488 werd gelegd, maar in het archief komt de poort al eerder voor, en het jaartal hoort waarschijnlijk bij de voorpoort die toen werd toegevoegd. Toen de stad buiten haar muren groeide, had de poort geen functie meer, en in 1617-1618 werd hij tot waag verbouwd. Boven trokken de gilden in: smeden, schilders, metselaars en chirurgijns, elk met een eigen deur. Het anatomisch theater van de chirurgijns, met de koepel uit 1690-1691, was hun gildehuis, en daarvoor schilderde Rembrandt De anatomische les van Dr. Nicolaes Tulp.

      In de twintigste eeuw werd de Waag een museumgebouw. In 1926 opende hier het Amsterdams Historisch Museum, en het Genootschap voor de Joodsche Wetenschap richtte tentoonstellingen in in de torenkamer. In 1930 werd de stichting Joodsch Historisch Museum opgericht, en op 24 februari 1932 opende wethouder Emanuel Boekman het museum hier. De bezetter sloot het en een groot deel van de collectie werd in beslag genomen; maar een deel kwam terug. Premier Willem Drees heropende het museum in 1955 in de Waag. Het kreeg meer ruimte toen het stadsmuseum in 1975 vertrok, en in 1987 verhuisde het naar de vier voormalige synagogen aan het Jonas Daniël Meijerplein, nu het Joods Museum.

      Bezoek: beneden een café-restaurant; boven zit Waag Futurelab, dat af en toe gratis rondleidingen door het gebouw geeft (in het Nederlands).

      Let op:
      - de steen uit 1488 in de toren op de hoek van de Zeedijk en de Geldersekade
      - de gildetekens boven de kleine deuren, en THEATRUM ANATOMICUM boven de deur van de chirurgijns
      - de platanen, de stoeptegelvogel en de oude sluis van het plein, die een eigen plek hebben
