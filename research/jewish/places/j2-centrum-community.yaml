- title: Waag on the Nieuwmarkt, city gate, guild house and first Jewish museum
  summary: "A 15th-century city gate, one of only two left in Amsterdam, became a weigh house in 1617 and housed the guilds, including the surgeons who hung Rembrandt's Anatomy Lesson here. In 1932 the Jewish Historical Museum opened in its tower room; it stayed until 1987."
  body: |
    This was the Sint Antoniespoort, a gate in the city wall. A stone in the tower on the Zeedijk corner says the first stone was laid on 28 April 1488, but archive records mention the gate earlier, and the date probably belongs to the outer gate added then. When the city grew past its walls the gate lost its job, and in 1617 to 1618 it was turned into a weigh house. The guilds moved in upstairs: smiths, painters, masons and surgeons, each with its own door. The surgeons' anatomy theatre, with its dome of 1690 to 1691, was their guildhall, and Rembrandt painted The Anatomy Lesson of Dr Nicolaes Tulp for it.

    In the 20th century the Waag became a museum building. The Amsterdam Historical Museum opened here in 1926, and the Jewish Society for Science (Genootschap voor de Joodsche Wetenschap) put on exhibitions in the tower room. In 1930 the Jewish Historical Museum was founded, and alderman Emanuel Boekman opened it here on 24 February 1932. The occupier closed it, and much of the collection was seized; only part came back. Prime Minister Willem Drees reopened the museum in the Waag in 1955. It gained more room after the city museum left in 1975, and in 1987 it moved to the four former synagogues on the Jonas Daniël Meijerplein, now the Jewish Museum.

    Visiting: a café-restaurant on the ground floor; upstairs is Waag Futurelab, which runs occasional free guided tours of the building (in Dutch).

    Look for:
    - the 1488 stone in the tower at the Zeedijk and Geldersekade corner
    - the guild emblems over the small doors, and THEATRUM ANATOMICUM over the surgeons' door
    - the plane trees, the paving-slab bird and the old sluice of the square, which have their own place
