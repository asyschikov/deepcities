- title: Beth Am, the Jewish people's house on the Amstel (Amstel 107-111)
  summary: "In the spring of 1923 the top floor of this building near Carré became Beth Am, a Jewish 'people's house' for lectures, clubs and meetings. The Jewish National Fund moved its office here from the Leidseplein the same summer."
  body: |
    In May 1923 the Beth Am foundation (Hebrew for "house of the people") took its new rooms on the top floor of Amstel 107-111 into use, a stone's throw from Carré; the official opening followed in October. In June the office of the Jewish National Fund, which raised money for land in Palestine, moved here from the Hirsch building on the Leidseplein.

    Beth Am became an address for the Jewish clubs and societies of the city: lecture evenings, Zionist groups and, that same autumn, the meetings of a Jewish sports club were held here.

    Visiting: a private building, seen from the street on the Amstel quay near Carré.

    Look for:
    - the top floor of nos. 107-111, where the rooms were
    - a few doors south, Carré, which has its own place
