  nl:
    title: De Swarte Mvele en het pand van De Vries van Buuren (Waterlooplein 3)
    summary: "Uit een winkel in garen en kant aan de Jodenbreestraat groeide vanaf 1829 een Joodse textielgroothandel tot aan het Waterlooplein. Voor de uitbreiding vielen de hoekhuizen, en hun zeventiende-eeuwse molensteen ging naar een museum. In 2007 kwam hij terug."
    body: |
      In 1829 begon M. de Vries van Buuren & Co. een winkel in garen, band, kant en mutsen op Jodenbreestraat 8, een paar deuren van het Rembrandthuis. Het werd een textielgroothandel, een Joods bedrijf waarvan het pand dwars door het blok liep, van de Jodenbreestraat tot het Waterlooplein.

      Om uit te breiden liet de firma de oude hoekhuizen aan de Houtgracht, het latere Waterlooplein, afbreken. In een daarvan zat een gevelsteen met een standerdmolen, DE SWARTE MVELE (de zwarte molen), waarschijnlijk aangebracht door Jan Cornelis Molen, die het hoekerf in 1609 kocht. De steen ging naar de museumcollectie van de stad. In 2007 keerde hij terug naar zijn oude plek, ingemetseld in de zijgevel van het pand aan de kant van de Zwanenburgwal.

      Bezoek: het pand is particulier; de steen is vanaf de straat te zien.

      Let op:
      - de zwarte standerdmolen op zijn vier gemetselde voeten, in de zijgevel aan de Zwanenburgwal
      - ernaast het Rembrandthuis en de hoek van Uylenburgh, die een eigen plek hebben
    attributes:
      original_use: Pand van een textielgroothandel
      check_note: "Pin staat bij de hoek van Waterlooplein 3; zet hem op de steen in de zijgevel aan de Zwanenburgwal"
