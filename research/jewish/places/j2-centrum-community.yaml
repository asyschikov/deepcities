    summary: "Boven de deur een steen in Hebreeuwse letters en een rijm dat wie de ouden voedt zegent, meegenomen uit het eerste huis van het Portugees-Israëlitisch Oude Mannenhuis. De bewoners werden in februari 1943 weggevoerd."
    body: |
      In 1751 stichtte de broederschap Mishenet Zekenim in de Weesperstraat een tehuis voor behoeftige oude Joodse mannen. In 1794 kocht ze dit grotere huis aan de Nieuwe Herengracht en verhuisde het Portugees-Israëlitisch Oude Mannenhuis hierheen; de oude vrouwen bleven achter en kregen later een eigen huis aan de Amstel. Twee tekststenen uit het huis in de Weesperstraat werden in deze gevel gezet toen dat pand in 1932 werd gesloopt. De bovenste is in Hebreeuwse letters. Op de onderste staat: DES HEMELS GUNST BESTRAALT EN ZEGEND EN BEHOED DIE DE OUD BEJAARDE LIEN STAAG ONDERHOUD EN VOED.

      In februari 1943 voerde de bezetter de bewoners weg; ze werden in de kampen vermoord.

      Bezoek: een particulier woonhuis; de stenen zitten boven de voordeur en zijn vanaf de kade goed te lezen.

      Let op:
      - de twee stenen boven de deur, de Hebreeuwse boven, het Nederlandse rijm eronder
      - om de hoek aan de Amstel de hofjes van de Amstelhofhoek, die een eigen plek hebben
    attributes:
      original_use: Grachtenhuis; vanaf 1794 Portugees-Israëlitisch Oude Mannenhuis
    sources:
