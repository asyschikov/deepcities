- title: De Swarte Mvele and the De Vries van Buuren building (Waterlooplein 3)
  summary: "A shop in thread and lace opened on the Jodenbreestraat in 1829 and grew into a Jewish textile wholesaler reaching the Waterlooplein. Expanding, it pulled down the corner houses, and their 17th-century windmill stone went to a museum. In 2007 it came back."
  body: |
    In 1829 M. de Vries van Buuren & Co. opened a shop in thread, ribbon, lace and caps at Jodenbreestraat 8, a few doors from the Rembrandthuis. It grew into a textile wholesaler, a Jewish firm whose building ran right through the block from the Jodenbreestraat to the Waterlooplein.

    To expand, the firm had the old corner houses on the Houtgracht, later the Waterlooplein, pulled down. One of them carried a gable stone of a post windmill, DE SWARTE MVELE (the black mill), probably put up by Jan Cornelis Molen, who bought the corner plot in 1609. The stone went into the city's museum collection. In 2007 it came back to its old spot, set into the side wall of the firm's building facing the Zwanenburgwal.

    Visiting: the building is private; the stone can be seen from the street.

    Look for:
    - the black post mill on its four brick feet, in the side wall on the Zwanenburgwal
    - next door, the Rembrandthuis and Uylenburgh's corner, which have their own places
