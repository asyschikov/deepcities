  nl:
    title: Beth Am, het Joodsch Volkshuis aan de Amstel (Amstel 107-111)
    summary: "In het voorjaar van 1923 werd de bovenste verdieping van dit pand bij Carré Beth Am, een Joods volkshuis voor lezingen, verenigingen en bijeenkomsten. Diezelfde zomer verhuisde het Joodsch Nationaal Fonds zijn kantoor hierheen van het Leidseplein."
    body: |
      In mei 1923 nam de Stichting Beth Am (Hebreeuws voor "huis van het volk") haar lokalen op de bovenste verdieping van Amstel 107-111 in gebruik, op een steenworp van Carré; de officiële opening volgde in oktober. In juni verhuisde het kantoor van het Joodsch Nationaal Fonds, dat geld inzamelde voor grond in Palestina, hierheen vanuit het Hirschgebouw aan het Leidseplein.

      Beth Am werd een adres voor het Joodse verenigingsleven van de stad: lezingen, zionistische clubs en, datzelfde najaar, de vergaderingen van een Joodse sportvereniging.

      Bezoek: een particulier pand, vanaf de straat te zien aan de Amstelkade bij Carré.

      Let op:
      - de bovenste verdieping van nr. 107-111, waar de lokalen waren
      - een paar deuren verder Carré, dat een eigen plek heeft
