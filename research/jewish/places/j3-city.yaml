    - { label: Wikipedia (nl), url: "https://nl.wikipedia.org/wiki/Plaquette_Herman_Elteschool" }
    - { label: Joods Amsterdam, url: "https://www.joodsamsterdam.nl/herman-elteschool-van-ostadestraat-203-1935-1943/" }
