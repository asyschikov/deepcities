  nl:
    title: Rechouwous, Molukkenstraat 89 (verdwenen)
    summary: Een gebedsruimte op de eerste verdieping, in 1925 geopend voor zo'n 600 Joodse gezinnen in de nieuwe Indische Buurt. Er kwam een Hebreeuwse school en koosjer schooleten, maar het ledental zakte. In 1940 dicht.
    body: |
      De Indische Buurt liep in de jaren twintig vol; in 1928 woonden er zo'n 600 Joodse gezinnen, ver van de synagogen in de oude stad. Op zondag 8 november 1925 werd in zaal De Tunnel, in aanwezigheid van rabbijn Coppenhagen, de vereniging Rechouwous opgericht. Ze bereikte ongeveer een derde van die gezinnen.

      De eerste gebedsruimte lag op de eerste verdieping van Molukkenstraat 89. Naast de diensten was er een Hebreeuwse school in de Balistraat met ruim 150 leerlingen, en de vereniging zorgde ervoor dat de gemeente koosjer eten gaf bij de schoolvoeding. Na 1928 verhuisde de sjoel naar de Insulindeweg, later naar de Javastraat. Het ledental zakte van 195 in 1932 naar 91 in 1934.

      Na de Duitse inval in mei 1940 hielden de diensten op. Er woonden toen nog zo'n 250 Joodse gezinnen in de buurt.

      Het pand op Molukkenstraat 89 staat er nog, met woningen boven de straat; aan de gevel herinnert niets aan de gebedsruimte.

      Let op:
      - De eerste verdieping van nummer 89, in een blok uit 1924.
    attributes:
      original_use: Gebedsruimte
    sources:
      - 'joodsamsterdam.nl; Joods Monument (Rechouwous)'

- title: Synagogue in a garage, Waalstraat (gone)
  summary: In 1926 a congregation in the new Rivierenbuurt fitted out a ground floor meant as a car garage as its synagogue, in flaming red, bright green and soft lilac. A critic found it garish by day and fine by lamplight.
  body: |
    When the Rivierenbuurt was being built, its first Jewish congregation, Benei Teimon ("sons of the south"), held services in the building of the co-operative De Dageraad in the Tolstraat. With money from the Ashkenazi community it then rented the ground floor of the corner of the Waalstraat and the Havenkade, now the Amstelkade. The long room had been meant as a garage. Harry Elte, the architect of several Amsterdam synagogues, fitted it out with 140 seats for men and 40 for women, and it was consecrated on Sunday 14 February 1926.

    The colours caused a stir. A writer in the Jewish weekly De Vrijdagavond described flaming red benches, bright green runners and a reader's desk and Ark in soft lilac: garish in daylight, he wrote, but fine under the soft, diffused light of the lamps. A skylight brought in daylight from above.

    As the Rivierenbuurt filled up, the room grew too small, and in 1937 the large synagogue in the Lekstraat opened nearby.

    Nothing marks the place now. The corner building on the Amstelkade dates from 1924; what its ground floor is used for today is not known.

    Look for:
    - The ground floor of the corner building, Amstelkade and Waalstraat (odd side).
    - The Lekstraat synagogue of 1937, ten minutes' walk south.
  category: religious
  lat: 52.348150
  lng: 4.900180
  address: Waalstraat, corner of the Amstelkade
