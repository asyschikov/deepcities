  nl:
    title: Struikeldrempel Victorieplein
    summary: Een drempel in de stoep bij de tramhalte op het Victorieplein herinnert aan de duizenden Joden die op 20 juni 1943 vanaf dit plein met de gemeentetram werden gedeporteerd. Gemeente en GVB legden hem in 2025.
    body: |
      Op 20 juni 1943 werden duizenden Joden uit de Rivierenbuurt naar het Victorieplein gebracht, het drukke hart van de buurt, en met de gemeentetram naar het station vervoerd.

      Het gemeentelijk vervoerbedrijf werd voor die transporten betaald. De gemeente rondde dat bedrag naar boven af en schonk het aan de Joodse gemeenschap, en in 2025 legde ze met het GVB drie struikeldrempels bij tramhaltes die bij de deportaties centraal stonden: bij Artis aan de Plantage Middenlaan, in de Beethovenstraat en hier. De drempel, een lange variant van een Stolperstein, herinnert aan de Joden die vanaf dit plein met de gemeentetram werden weggevoerd.

      Hij ligt in de stoep bij de tramhalte aan de kant van de Rijnstraat, onder de toren van de Wolkenkrabber.

      Let op:
      - De drempel bij de tramhalte.
      - De Wolkenkrabber erboven.
    attributes:
      check_note: Tekst van de drempel naar één online weergave; ter plekke nalezen.
    sources:
      - 'tracesofwar.nl; NOS; IamExpat'

- title: Refugee house plaque, Zuideinde 443
  summary: On a side wall in old Oostzaan, a bronze plaque says that 30 of the 75 Jewish refugees who came to this area from 1933 to 1939 lived in this one house. Some got away in time; others were murdered.
  body: |
    Between 1933 and 1939 about 75 Jewish refugees from Germany, Poland and elsewhere in Eastern Europe found temporary shelter on the Zuideinde and in Oostzaan. Thirty of them lived in this house. Some managed to leave the Netherlands in time; others did not survive the camps and persecution; one child was hidden in the neighbourhood.

    Among those who stayed here were Fajga Rozenszajn and her small son Leo Mozes, born in Duisburg in 1935. They lived in Oostzaan from 1939 until March 1942. Leo was murdered in Auschwitz in 1944, at the age of nine.

    On 28 April 2005, sixty years after the liberation, a bronze plaque was unveiled on the side wall of the house. Its text tells the story above in a few lines and ends by remembering those who helped them.

    The house is a private home on the corner of the Jacob Honigstraat. The plaque can be read from the street; please do not disturb the residents.

    Look for:
    - The bronze plaque on the side wall facing the Jacob Honigstraat.
    - The old houses along the Zuideinde, the dike road.
