  nl:
    title: Blasiussjoel, Swammerdamstraat 70
    summary: Achter deze hoekgevel hadden Joden die voor de pogroms in Rusland waren gevlucht hun sjoel. Na de oorlog heropend en beroemd om de volle diensten op Jom Haätsmaoet. Nu woningen.
    body: |
      In de jaren 1880 vestigden Joodse gezinnen die de pogroms in het Russische Rijk ontvluchtten zich in de nieuwe straten bij de Weesperzijde. Op 5 januari 1890 richtten zij de vereniging Kehilas Ja'akow op, waarschijnlijk toen die in dit hoekpand haar sjoel kreeg. Die werd bekend als de Blasiussjoel, naar de straat om de hoek.

      De deportaties maakten er een eind aan. Na de oorlog heropenden overlevenden de sjoel. Uit piëteit met de vermoorde leden bleef men de Oost-Europese, asjkenazische ritus volgen. De ochtenddienst op Jom Haätsmaoet, de Israëlische onafhankelijkheidsdag, werd een begrip: in 1962 zat de sjoel om zeven uur vol en na afloop werd de hora gedanst. Datzelfde jaar kreeg het bestuur opdracht een gebouw in Zuid te zoeken.

      Het pand is nu woonruimte; niets wijst meer op de synagoge. Op 4 mei legt het buurtcomité beschilderde borden met de namen van weggevoerde buurtbewoners voor de deur.

      Let op:
      - De hoek met de Blasiusstraat.
      - Op 4 mei de beschilderde naamborden op de stoep.
    attributes:
      original_use: Winkel, vanaf 1907 synagoge
    sources:
      - 'joodsamsterdam.nl (NIW 23-11-1962); amsterdamhv.nl; Reliwiki; NH Nieuws'

- title: Rechouwous, Molukkenstraat 89 (gone)
  summary: A first-floor prayer room in the Indische Buurt, opened in 1925 for some 600 Jewish families in the new district. It ran a Hebrew school and won kosher school meals, but numbers fell; it closed in 1940.
  body: |
    The Indische Buurt filled up in the 1920s, and by 1928 about 600 Jewish families lived there, far from the synagogues of the old centre. On Sunday 8 November 1925 a new society, Rechouwous, was founded at a meeting in the hall De Tunnel, with rabbi Coppenhagen present. It reached perhaps a third of those families.

    Its first prayer room was on the first floor of Molukkenstraat 89. Besides services it ran a Hebrew school in the Balistraat for more than 150 children and pressed the city to serve kosher food in its meals for schoolchildren. After 1928 the room moved to the Insulindeweg, and later to the Javastraat. Membership fell from 195 in 1932 to 91 in 1934.

    After the German invasion in May 1940 services stopped; about 250 Jewish families still lived in the district.

    The house at Molukkenstraat 89 still stands, with flats above the street; there is nothing to mark the prayer room.

    Look for:
    - The first floor of no. 89, in a block of 1924.
