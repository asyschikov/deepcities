  nl:
    title: Plaquette vluchtelingenhuis, Zuideinde 443
    summary: Op een zijgevel in het oude Oostzaan vertelt een bronzen plaquette dat dertig van de 75 Joodse vluchtelingen die hier tussen 1933 en 1939 kwamen in dit ene huis woonden. Sommigen ontkwamen, anderen werden vermoord.
    body: |
      Tussen 1933 en 1939 vonden zo'n 75 Joodse vluchtelingen uit Duitsland, Polen en Oost-Europa tijdelijk onderdak aan het Zuideinde en in Oostzaan. Dertig van hen woonden in dit huis. Sommigen verlieten Nederland op tijd, anderen overleefden kampen en vervolging niet; één kind zat in de buurt ondergedoken.

      Onder hen waren Fajga Rozenszajn en haar zoontje Leo Mozes, in 1935 in Duisburg geboren. Zij woonden van 1939 tot maart 1942 in Oostzaan. Leo werd in 1944 in Auschwitz vermoord; hij was negen.

      Op 28 april 2005, zestig jaar na de bevrijding, werd op de zijgevel een bronzen plaquette onthuld. De tekst vat het verhaal hierboven in een paar regels samen en gedenkt ook wie hen hielpen.

      Het huis is een particuliere woning op de hoek van de Jacob Honigstraat. De plaquette is vanaf de straat te lezen; stoor de bewoners niet.

      Let op:
      - De bronzen plaquette op de zijgevel aan de Jacob Honigstraat.
      - De oude huizen langs het Zuideinde, de dijkweg.
    sources:
      - '4en5mei.nl (2673); tracesofwar.nl (24481); Joods Monument'
