  nl:
    title: Bijlmermeer
    summary: 'De Bijlmer moest dé wijk voor de moderne mens worden: hoogbouw van tien lagen in honingraatvorm, verkeer op verhoogde dreven, groen ertussen. Het liep anders. Hier sta je midden in een van de laatste zeshoeken, in het beschermde Bijlmermuseum.'
    body: |
      De bouw van de Bijlmer startte in 1966. Het ontwerp, vervaardigd door een team van de afdeling Stadsontwikkeling van de Amsterdamse Dienst der Publieke Werken onder leiding van architect en stedenbouwkundige Siegfried Nassuth, werd geïnspireerd door de functionele stad-ideeën van de CIAM en Le Corbusier. Wonen, werken, recreëren en verkeer werden strikt gescheiden. De wijk kreeg hoogbouw van negen verdiepingen op een onderbouw met binnenstraat, in een kenmerkende zeskantige honingraatstructuur met veel groen. Burgemeester Van Hall sloeg op 13 december 1966 de eerste paal; de wijk werd "het prettigste woonoord dat zich laat denken". De eerste bewoners kwamen in 1968.

      Al snel ontstonden de eerste problemen. De flats waren slecht opgeleverd, de huren hoog, deels door de half lege parkeergarages. Het budget voor de binnenstraten werd wegbezuinigd en de metro reed pas in 1977. De Amsterdamse gezinnen waarvoor de wijk gebouwd was bleven weg. Rond de Surinaamse onafhankelijkheid in 1975 trokken duizenden migranten naar Amsterdam, maar al in 1972 hanteerden gemeente en woningcorporaties discriminerende regels die Surinamers en Antillianen uit de Bijlmerflats weerden. Activisten kraakten zo'n honderd leegstaande woningen in Gliphoeve. In 1983 verplaatste de gemeente heroïneverslaafden van de Zeedijk naar de Bijlmer; midden jaren tachtig stond een kwart van de 13.000 woningen leeg. Bewoners organiseerden vanaf 1975 het festival Kwaku. Zo ontwikkelde de Bijlmer, of Bims, een eigen identiteit.

      Op 4 oktober 1992 stortte een vrachtvliegtuig van El Al neer op de flats Groeneveen en Klein-Kruitberg. Er kwamen 43 mensen om, van wie 39 op de grond. In 1992 werd ook besloten een kwart van de flats te slopen; rond de eeuwwisseling volgde nog een kwart. De helft van de hoogbouw is gesloopt en veel dreven zijn verlaagd. Sinds mei 2019 is het Bijlmermuseum een gemeentelijk beschermd stadsgezicht: de overgebleven zes flatgebouwen Gooioord, Groeneveen, Grubbehoeve, Kikkenstein, Kleiburg en Kruitberg, met de 1100 meter lange metroviaducten en de parkachtige openbare ruimte ertussen.

      Let op:
      - de geknikte vleugels van Gooioord rond dit grasveld: één cel van de honingraat;
      - het metroviaduct in het oosten, het hart van het beschermde gebied;
      - het restant van Groeneveen, over het water.

      Zie ook Kleiburg ("De Flat"), het Bijlmer Museum, het Groeiend Monument en De Boom die Alles Zag, Groenhoven en Gouden Leeuw, Hoptille en The Botanical Garden of the Bims.
