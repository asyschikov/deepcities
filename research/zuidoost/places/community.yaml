  nl:
    title: Gedenkteken Steven van Dorpel
    summary: "Een bronzen beeld van 'de parel van de Bijlmer', de voetballer uit de buurt die in 1989 met 175 anderen omkwam toen een toestel van Surinam Airways bij Zanderij neerstortte: de andere vliegramp van de Bijlmer."
    body: |
      Hij zou in Suriname zijn vader terugzien, voor het eerst sinds hij als driejarige het land uit was gegaan. Steven ('Steve') van Dorpel (1965–1989) begon te voetballen bij SV Bijlmer en was de eerste van die club die een profcontract aangeboden kreeg. In 1989 werd hij topscorer van FC Volendam, en een overstap naar Roda JC stond al vast. Die zomer vloog hij met het Kleurrijk Elftal, een ploeg Surinaams-Nederlandse profs, naar Paramaribo voor benefietwedstrijden. Op 7 juni 1989 probeerde de DC-8 van Surinam Airways in de mist te landen bij Zanderij en stortte neer. Van de 187 mensen aan boord overleefden er maar elf; vijftien spelers van het Kleurrijk Elftal waren dood. In de Surinaamse gemeenschap in Nederland doet de ramp nog altijd pijn.

      Het idee voor een beeld kwam van SV Bijlmer, de 'Vrienden van Steve' zamelden het geld in en in 1990 werd Nelson Carrilho gevraagd. Hij is bekend om maatschappelijk betrokken bronzen als Mama Baranka in het Vondelpark en maakt meestal vrij werk; dit keer moest het beeld juist op Steve lijken. Het ontstond in overleg met de familie, en zijn moeder herkende haar zoon erin. Ajax-hulptrainer Bobby Haarms onthulde het op 28 mei 1992 op een grasveldje aan de Flierbosdreef. Sinds 2010 staat het in het Nelson Mandelapark, waar Steve uitkijkt over de jonge voetballers op de velden. Het monument voor alle slachtoffers staat op het 's-Gravesandeplein in Amsterdam-Oost.

      Let op:
      - Van Dorpel met de bal aan de voet, die er klein uitziet (in werkelijkheid was hij heel lang)
      - de plaquette op de sokkel van cortenstaal: "Ter nagedachtenis aan 'de parel van de Bijlmer'"
    sources:
      - https://nl.wikipedia.org/wiki/Steve_van_Dorpel_(beeld)
      - https://publicart.amsterdam/projecten/gedenkteken-steven-van-dorpel/
      - Kunstwacht / Buitenkunst Amsterdam 1993

- title: Now Speak!
  summary: A concrete lectern inviting anyone in the Bijlmer to speak their mind. Its microphone was stolen, it was abandoned after the 2009 show it belonged to, and residents asked the city to save it. A replica is used for speeches in Boston.
  body: |
    The Argentine-born artist Amalia Pica made *Now Speak!* in 2009 for the *Straat van Sculpturen* ("Street of Sculptures"), a temporary art route through Zuidoost. It is a speaker's lectern in concrete, an open invitation to passers-by to make themselves heard in public. The title borrows the line Michelangelo is said to have spoken to his statue of Moses when he finished it: "Now speak!".

    The concrete microphone that stood on it was soon stolen. When the art route ended there was no money to look after the work, the city did not take it over, and it was simply left behind by the Gulden Kruispad, where a curving footpath worn by cyclists and walkers bent neatly round it. Meanwhile Pica made a replica for the Museum of Fine Arts in Boston, which has used it for performances, readings and speeches since 2011. In Amsterdam, neighbours grew fond of the neglected lectern and asked the city to adopt and repair it. It was restored and moved a little south to the Krimpertplein, and is now a stop on the Zuidoost art route.

    Look for:
    - the stone desktop where your hands rest as you speak
    - the empty spot where the microphone was
