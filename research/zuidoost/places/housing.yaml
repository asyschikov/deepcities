  nl:
    title: Het Zandkasteel
    summary: "Een bankhoofdkantoor met bijna geen rechte hoeken: tien bakstenen torens van Alberts & Van Huut, gebouwd voor de NMB (later ING) in een organische stijl met antroposofische wortels. Het eerste monument van Zuidoost, nu woningen, een school en kantoren, met rondleidingen."
    body: |
      Tussen 0 en 90 graden liggen nog 89 andere graden, hield Ton Alberts het NRC voor. In zijn bankgebouw zijn rechte hoeken dan ook vermeden waar het maar kon.

      In de jaren tachtig groeide de Nederlandsche Middenstandsbank (NMB) uit haar kantoor in Amsterdam-Zuid. De bank gaf het jonge bureau van Ton Alberts en Max van Huut opdracht voor een nieuw hoofdkantoor. Directeur Wim Scherpenhuijsen Rom was antroposoof, net als een paar andere directeuren, en wilde een gebouw op menselijke maat. Het personeel mocht meepraten over de inrichting. In 1987 ging het open aan het Bijlmerplein, tussen het strakke raster van kantoren en winkelcentrum bij de Amsterdamse Poort.

      Tien aaneengeschakelde torens slingeren in een S rond twee ingesloten tuinen. De plattegronden zijn uitgerekte zeshoeken en de gevels hellen. Daarvoor moesten de bakstenen schuin worden gebakken, en de leverancier eiste dat de bank ook de misbaksels afnam; daarom verschilt de gevel van kleur. Binnen verbindt een kronkelende straat met vides alle tien de torens. Kunst zit in het gebouw zelf: lichtkunst in elke toren, marmermozaïeken bij de liften, gekleurd glas in de binnenstraat. Ook aan energie werd vroeg gedacht: de schuine gevels kaatsen straatlawaai omhoog en de torens zijn naar de zon gericht. De buurt noemde het al snel het Zandkasteel; in Madurodam staat een miniatuur.

      In 2017 werd het het eerste monument van Zuidoost. ING, de opvolger van de bank, vertrok in januari 2020. Sindsdien zijn de torens met zo min mogelijk ingrepen verbouwd: in mei 2023 werden de eerste woningen opgeleverd, dat najaar trok de Amsterdam International Community School erin. In de binnenstraat zitten kantoren, er zijn evenementen en er is een jazzpodium.

      Let op:
      - de verspringende dakranden en het vijfhoekige dakraam op elke toren
      - de ramen waarvan één hoek omlaag is getrokken
      - de binnentuinen en de waterpartijen, en de rondleidingen door het interieur
    attributes:
      architect: Alberts en Van Huut (Ton Alberts, Max van Huut)
      original_use: Hoofdkantoor van de NMB, later ING
    sources:
      - city register 200890
      - https://nl.wikipedia.org/wiki/Het_Zandkasteel_(gebouw)

- title: Atlas ArenA (Atlas office complex)
  summary: 'Five white office blocks named after the continents, put up in 1983 by a pension fund before a single tenant had signed: once the largest speculative office building in the Netherlands, and since March 2026 a monument to the 1980s office boom.'
  body: |
    When the Atlas complex went up in 1983 on the corner of Hoogoorddreef and Hondsrugweg, it was one of the first offices of Bullewijk, the business district meant to give Amsterdam a reachable alternative to the crowded centre. The PGGM pension fund built it purely as an investment, without knowing who would rent it; at the time it was the largest office building in the country built that way. Its architect, Frits Dekeukeleire, broke with his usual work and chose a structuralist set of interlocking volumes around two courtyards. Each part is named after a continent: Asia, Africa and America have X-shaped plans with the lifts at the crossing, so every wing can be let separately; Australia, on a lifted T, bridges between them and opens a view into the courtyard; Europe is half an X on its own. A parking garage called Antarctica followed in 1986. The landscape was designed by the office of Mien Ruys and Hans Veldhoen.

    Letting was slow until Fokker Aircraft moved its head office here; when Fokker went bankrupt, tenants left again and the complex stood largely empty for years. Revived after the Arena stadium arrived next door, it is now an office campus with a hotel. The city's monuments committee called it a symbol of the 1980s leap in scale of the office market, with a largely original exterior and a rarity in the Netherlands. It became a municipal monument on 3 March 2026.

    Look for:
    - the strongly horizontal façades: pale precast concrete parapets with fluting and Norwegian marble chips, over dark recessed strip windows;
    - the gate-like Corten steel work by Evert Strobos and the sculptures by Steef Roothaan, both made for the site;
    - the green courtyards, kept free of cars by the underground parking.
