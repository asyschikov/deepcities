  nl:
    title: A Pregnant Man's Dream, Ramon Martins op Haag en Veld
    summary: "Een Braziliaanse muurschildering van elf verdiepingen op de kopgevel van een Bijlmerflat: totemachtige figuren, een kat, een ananas, wervelend blauw water. Ramon Martins zou haar naar zijn zwangere vriendin hebben genoemd (niet bevestigd)."
    body: |
      Een hele kopgevel van een hoogbouwflat beschilderen lijkt volgens Ramon Martins op bevallen: eerst een lange voorbereiding, dan een zware lichamelijke klus. Toen hij hieraan werkte was zijn vriendin zwanger, en hij noemde het werk *A Pregnant Man's Dream*, naar zijn wens om te voelen wat zij doormaakte. Omdat een baby in vocht groeit, stroomt er overal water door het beeld, en organische vormen verbinden de figuren, die als totems in het beeld staan. (Dit verhaal achter de titel komt uit de blog van een street-art-gids en is niet door andere bronnen bevestigd.)

      Martins, muralist uit São Paulo, schilderde het in 2014 voor R.U.A. (Reflexo on Urban Art), dat Braziliaanse en andere kunstenaars vroeg de kale betonnen flats van de H-buurt na hun renovatie op te fleuren. Op Haag en Veld stond al een muurschildering van Derlon uit 2012; nu was Martins aan de beurt voor het andere blok. Wie een H-flat beschildert, moet creatief zijn met de ramen en de buizen.

      Niet elke gevel heeft zijn kleur gehouden. De muurschildering van Rimon Guimarães op Hogevecht Oost, uit dezelfde ronde van 2014, werd in 2024 wit overgeschilderd. Deze stond er in 2025 nog.

      De gevel kijkt naar het oosten, over het parkeerterrein tussen de twee blokken van Haag en Veld, en is te zien vanaf de Flierbosdreef.

      Let op:
      - de bleke, in lijnen getekende figuren tegen het blauw
      - de kat en de ananas
      - de beschilderde buizen en het ruitpatroon rond de ramen
      - het zwart-witte tegelwerk van Barbara Broekman aan de voet van de flat
    sources:
      - https://stadscuratorium.nl/collectie/a-pregnant-mans-dream/
      - https://nl.wikipedia.org/wiki/Mural_Hogevecht
      - https://nl.wikipedia.org/wiki/Hogevecht
