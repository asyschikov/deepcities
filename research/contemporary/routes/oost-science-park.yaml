title: From the Wibautstraat to Science Park and Diemen
summary: >-
  A ride south-east from the HvA's new engineering faculty, along the Amstel to the towers of the
  Amstelkwartier and the old prison site, then through the Watergraafsmeer to the timber, steel and
  Cor-ten of Science Park, ending at a slate-clad farmhouse of flats in Diemen.
body: |
  **Start:** the Jakoba Mulderhuis on the corner of the Wibautstraat and the Mauritskade, by the Rhijnspoorplein.
  **End:** Woonhoeve Diemen on the Joop Niemanslaan in Diemen. Diemen station, on the same railway line as Science Park, is about a kilometre away; or ride back to town.
  **Distance and time:** about 13 km, a little over an hour of riding. Allow 2.5 to 3 hours with stops.

  The route is flat. After the Science Park substation it doubles back for about a kilometre towards the station before turning south to Diemen; that is the only way to reach both the far end of the campus and Diemen. What you can go into: the Jakoba Mulderhuis and Amsterdam University College (both listed by Arcam's architecture guide as open to the public; they are working buildings); the shops in the plinth of AMST; the bar of the Ruby Emma Hotel (daily, 7 am to 1 am); and the café of De Nieuwe Meent. LAB42 opens to visitors only at set times, such as the Science Park's Science Day, though the campus route for walkers and cyclists runs through it. The rest is housing or infrastructure, seen from the street. HAUT is at its best at dusk, when the timber ceilings behind the glass are lit.

  The theme is what stays and what changes. A 1970s office keeps its terraces and loses its tiles; a prison wall is worked into social housing; a 1923 telephone exchange gets two storeys of timber on top; a timber tower turns out to be a hybrid; a university building is designed to be taken apart like shelving. Along the way two housing cooperatives and a substation show that the new materials (cross-laminated timber, reusable steel, rusted Cor-ten) are not only for showpieces.

  The Nesciobrug (also on this map) links Science Park and Diemen with the Diemerpark and IJburg, where the ride "Eastern Docklands to IJburg" ends, if you want to join the two.
mode: bike
nl:
  title: Van de Wibautstraat naar Science Park en Diemen
  summary: >-
    Van de nieuwe faculteit Techniek van de HvA langs de Amstel naar de torens van het Amstelkwartier
    en de oude bajes, dan door de Watergraafsmeer naar het hout en staal van Science Park, tot een
    boerderij van appartementen in leien in Diemen.
  body: |
    **Start:** het Jakoba Mulderhuis op de hoek van Wibautstraat en Mauritskade, aan het Rhijnspoorplein.
    **Eind:** Woonhoeve Diemen aan de Joop Niemanslaan in Diemen. Station Diemen, aan dezelfde spoorlijn als Science Park, ligt op ongeveer een kilometer; of fiets terug naar de stad.
    **Afstand en duur:** zo'n 13 kilometer, iets meer dan een uur fietsen. Met stops ben je 2,5 tot 3 uur onderweg.

    De route is vlak. Na het hoogspanningsstation op Science Park fiets je ongeveer een kilometer terug richting het station voordat je naar Diemen afbuigt; anders haal je niet zowel het uiterste puntje van de campus als Diemen. Naar binnen kun je in het Jakoba Mulderhuis en Amsterdam University College (allebei volgens de architectuurgids van Arcam openbaar toegankelijk; het zijn werkende gebouwen), in de winkels in de plint van AMST, in de bar van het Ruby Emma Hotel (elke dag van 7.00 tot 1.00 uur) en in het café van De Nieuwe Meent. LAB42 gaat alleen op vaste momenten open voor bezoekers, zoals de Wetenschapsdag van het Science Park, al loopt de campusroute voor fietsers en voetgangers er dwars doorheen. De rest zijn woningen of installaties, te bekijken vanaf de straat. HAUT is op zijn mooist in de schemering, als de houten plafonds achter het glas verlicht zijn.

    Het thema is wat blijft en wat verandert. Een kantoor uit de jaren zeventig houdt zijn terrassen en verliest zijn tegels, een gevangenismuur wordt deel van sociale huurwoningen, een telefooncentrale uit 1923 krijgt twee houten verdiepingen erbovenop, een houten toren blijkt half om half, en een universiteitsgebouw is ontworpen om als een stellingkast uit elkaar te halen. Onderweg laten twee wooncoöperaties en een hoogspanningsstation zien dat de nieuwe materialen (kruislaaghout, herbruikbaar staal, roestend cortenstaal) niet alleen iets voor pronkstukken zijn.

    Wie de twee tochten aan elkaar wil knopen: de Nesciobrug (ook op deze kaart) verbindt Science Park en Diemen met het Diemerpark en IJburg, waar de fietstocht 'Van het Oostelijk Havengebied naar IJburg' eindigt.
stops:
  - place: Jakoba Mulderhuis
    narration: |
      Start at the gateway. The Jakoba Mulderhuis, finished in 2022, completes the Hogeschool van Amsterdam's rebuilt Amstelcampus and houses its Faculty of Technology. Two of its designers, Marc Koehler and Nanne de Ru of Powerhouse Company, studied architecture at the HvA themselves, and worked with de Architekten Cie. The building is named after Jakoba Mulder, the city planner behind the Amsterdamse Bos.

      From the corner, see how the 54-metre tower and the listed Benno Premselahuis opposite frame the Wibautstraat like a gate. The Jura limestone matches the Theo Thijssenhuis next door. Then look at the window pattern climbing from left to right. Inside, each department has its own floor ending in a terrace on a shared atrium, so students see what the others are building. Tower and low block can run separately, so the building can take another use later: a first hint of the ride's theme.
    nl: |
      Het Jakoba Mulderhuis, klaar in 2022, maakt de vernieuwde Amstelcampus van de Hogeschool van Amsterdam af; hier zit de faculteit Techniek. Twee van de ontwerpers, Marc Koehler en Nanne de Ru van Powerhouse Company, studeerden zelf bouwkunde aan de HvA en werkten samen met de Architekten Cie. De naam komt van Jakoba Mulder, de stedenbouwkundige van het Amsterdamse Bos.

      Zie vanaf de hoek hoe de toren van 54 meter en het monumentale Benno Premselahuis aan de overkant samen een poort aan de Wibautstraat vormen. De Jurakalksteen heeft de kleur van het Theo Thijssenhuis ernaast. Kijk dan naar het patroon van ramen dat van links naar rechts omhoogloopt. Binnen heeft elke opleiding een eigen verdieping met een terras aan een gezamenlijk atrium, zodat studenten zien wat de anderen maken. Toren en laagbouw kunnen los van elkaar werken, zodat het gebouw later iets anders kan worden: een voorproefje van het thema.
    next:
      directions: Ride south along the Amstel's east bank, the Weesperzijde, to the Berlagebrug.
      nl: Fiets langs de oostoever van de Amstel, de Weesperzijde, naar het zuiden tot de Berlagebrug.
  - place: Rivierstaete, the Monkey Rock that lost its tiles
    narration: |
      Stop on the Berlagebrug and look south along the far bank. Huig Maaskant's stepped office of 1967 to 1973 was the Apenrots (monkey rock) almost from the day it opened: terraces of white tile with narrow strips of window, in a neighbourhood of red brick.

      It was never pulled down. When Vastint bought it in 2013 it stood 60 percent empty, and they chose renovation over demolition. MVSA Architects stripped it back to its concrete frame of stepped volumes, replaced the tiles and slit windows with floor-to-ceiling glass, added a storey and planted roof terraces. Since 2019 it has been called Amsteldok.

      So what you see is half Maaskant and half new: the terraces are his, the glass is not. Keep that split in mind; the ride is full of buildings where something was kept and something changed.
    nl: |
      Stop op de Berlagebrug en kijk naar het zuiden, langs de overkant. Het getrapte kantoor van Huig Maaskant, gebouwd van 1967 tot 1973, was vrijwel meteen de Apenrots: terrassen van witte tegels met smalle stroken raam, midden in een buurt van rode baksteen.

      Gesloopt is het nooit. Toen Vastint het in 2013 kocht, stond het voor 60 procent leeg, en de nieuwe eigenaar koos voor renovatie in plaats van sloop. MVSA Architects bracht het terug tot het betonskelet van getrapte volumes, verving de tegels en de smalle ramen door glas van vloer tot plafond en zette er een verdieping en beplante dakterrassen op. Sinds 2019 heet het Amsteldok.

      Wat je ziet is dus half Maaskant en half nieuw: de terrassen zijn van hem, het glas niet. Onthoud die tweedeling; deze tocht zit vol gebouwen waar iets bleef en iets veranderde.
    next:
      directions: Come back off the bridge on the east bank and ride on to the square on the east side of Amstelstation.
      nl: Fiets terug van de brug naar de oostoever en door naar het plein aan de oostkant van het Amstelstation.
  - place: AMST
    narration: |
      Opposite Amstelstation, on what was long an empty, unloved strip, VenhoevenCS built two blocks with 252 homes in some 25 types, 80 percent of them mid-rent or social housing, finished in 2023.

      The facade is the trick. A slim concrete frame runs round every side, filled with wooden shutters that residents open and close by hand against sun and noise. Look along a front and you will see each shutter set a little differently. That gives one calm face to a jumble of flat types behind it. Then turn round: the architects matched the colour of the concrete to the station building across the square.

      The plinth with its supermarket and shops is open to everyone. From here the ride heads south to the Amstelkwartier, where three very different towers stand within a few hundred metres.
    nl: |
      Tegenover het Amstelstation, op een strook die jarenlang verlaten lag, zette VenhoevenCS twee blokken neer met 252 woningen in zo'n 25 typen, voor tachtig procent middenhuur of sociale huur, opgeleverd in 2023.

      De gevel doet het werk. Een smal betonnen kader loopt rondom, gevuld met houten luiken die bewoners met de hand bedienen tegen zon en lawaai. Kijk langs een gevel en je ziet dat elk luik net anders staat. Zo krijgt een allegaartje van woningtypen één rustig gezicht. Draai je dan om: volgens de architecten past de kleur van het beton bij het stationsgebouw aan de overkant.

      In de plint zitten een supermarkt en andere winkels, open voor iedereen. Vanaf hier gaat de route naar het zuiden, het Amstelkwartier in, waar drie heel verschillende torens op een paar honderd meter van elkaar staan.
  - place: HAUT, the timber tower
    narration: |
      Dutch Wikipedia calls HAUT a wooden skyscraper: 73 metres, 21 storeys, 55 apartments by the Amstel, designed by Team V Architectuur with the engineers Arup and finished in 2022. The name is French for "high" and sounds like the Dutch hout, wood.

      But look closer at what "wooden" means. The foundation, basement and stability core are concrete. The floors are prefabricated slabs of 16 cm of cross-laminated timber under 8 cm of concrete. Arup's motto was "timber where possible, concrete and steel where necessary". It still holds more than 2,000 cubic metres of wood. Through the glass and solar-panel skin you can see the timber ceilings, best at dusk.

      Kept and changed, again: a tower that is half one thing and half the other. The hotel next door hides its recycled material in the concrete.
    nl: |
      Wikipedia noemt HAUT een houten wolkenkrabber: 73 meter, 21 verdiepingen, 55 appartementen aan de Amstel, ontworpen door Team V Architectuur met constructeur Arup en klaar in 2022. De naam is Frans voor 'hoog' en klinkt als 'hout'.

      Maar kijk wat 'houten' hier betekent. Fundering, kelder en de kern die het geheel overeind houdt zijn van beton. De vloeren zijn kant-en-klare platen van 16 centimeter kruislaaghout onder 8 centimeter beton. Arup hield het op "timber where possible, concrete and steel where necessary". Toch zit er ruim 2.000 kubieke meter hout in. Achter de huid van glas en zonnepanelen zie je de houten plafonds, het best in de schemering.

      Weer half om half dus. Het hotel ernaast verstopt zijn hergebruikte materiaal in het beton.
  - place: Ruby Emma Hotel (ex QO)
    narration: |
      Mulderblauw architecten and Paul de Ruiter Architects designed this 76-metre hotel tower, opened in 2018 as QO and now Ruby Emma. Look at the facade first: outside the windows, moving panels open and close room by room with the season, the weather and whether the guest is in, so the facade keeps changing.

      Then the hidden part. Some 5,000 tonnes of concrete from the demolished facade of the former Shell tower in Noord, now A'DAM Toren, were crushed and reused in the new concrete. The carpets were made from recycled fishing nets. After HAUT's timber, this is reuse you cannot see.

      The bar on the ground floor is open to everyone, daily from 7 am to 1 am, a good place for a break. The next stop is a few steps east, on the site of the Bijlmerbajes.
    nl: |
      Mulderblauw architecten en Paul de Ruiter Architects tekenden deze hoteltoren van 76 meter, in 2018 geopend als QO en nu Ruby Emma. Kijk eerst naar de gevel: buiten de ramen gaan panelen per kamer open en dicht, afhankelijk van seizoen, weer en de vraag of de gast er is. De gevel verandert dus voortdurend.

      Dan het verborgen deel. Zo'n 5.000 ton vermalen beton van de gesloopte gevel van de oude Shelltoren in Noord, nu A'DAM Toren, ging in het nieuwe beton. De vloerbedekking is gemaakt van oude visnetten. Na het hout van HAUT is dit hergebruik dat je niet ziet.

      De bar beneden is voor iedereen open, elke dag van 7.00 tot 1.00 uur: een goede plek voor een pauze. De volgende stop ligt een paar stappen oostelijker, op het terrein van de Bijlmerbajes.
  - place: De Vrijheid, Bajeskwartier
    narration: |
      The Bijlmerbajes prison is giving way to the Bajeskwartier, and at its centre four residential towers stand round a small square, each by a different office. De Vrijheid ("Freedom") is by Atelier Kempe Thill: 140 social-rent flats, handed over in December 2024.

      Find the old prison wall. A listed stretch was kept along one side, and the base of the building reaches out over it on six heavy legs, like a table. So the wall that once kept people in now stands under their homes. Above the six-storey base, a nine-storey tower; inside, round a daylit atrium, stands an eleven-metre tree (residents only).

      The prize jury of 2026 praised the housing but found the ground floor turns its back on the street. The next stop was nominated for the same prize.
    nl: |
      De Bijlmerbajes maakt plaats voor het Bajeskwartier. In het midden staan vier woontorens om een klein plein, elk van een ander bureau. De Vrijheid is van Atelier Kempe Thill: 140 sociale huurwoningen, opgeleverd in december 2024.

      Zoek de oude gevangenismuur. Een beschermd stuk bleef aan één kant staan, en het onderste deel van het gebouw kraagt er op zes zware poten overheen uit, alsof het geheel op een tafel staat. De muur die mensen ooit binnenhield, staat nu onder hun woningen. Op het blok van zes lagen staat een toren van negen; binnen, rond een atrium dat van bovenaf licht krijgt, staat een boom van elf meter (alleen voor bewoners).

      De vakjury van 2026 prees de woningen, maar vond dat de begane grond de straat de rug toekeert. De volgende stop was voor dezelfde prijs genomineerd.
    next:
      directions: Ride north-east through the Watergraafsmeer to the Middenweg, by Park Frankendael.
      nl: Fiets noordoostwaarts door de Watergraafsmeer naar de Middenweg, bij Park Frankendael.
  - place: Telephone exchange, Middenweg (De Telefoondienst)
    narration: |
      Albert Boeken of Public Works designed this Amsterdam School telephone exchange, opened in 1923, fully automatic from the start. Oddly, it faced away from the street. Look in the lane off the Middenweg: over the old door, TELEFOONDIENST in Art Deco letters, and at the back the director's house.

      Around 1960 the Kamerlingh Onneslaan was laid past the back, and the back became the front. Go round to see the portal added then, with Hildo Krop's sculpture of the four continents, brought from the old telephone head office on the Herengracht.

      Ronald Janssen Architecten converted it in 2024 to 2025 into 33 rented homes, with two new storeys on top: a timber frame faced with flamed granite, the stone of the old ornaments. Like Rivierstaete, old bones, new top; the 2026 prize jury singled out the granite and the new stairs.
    nl: |
      Albert Boeken van Publieke Werken ontwierp deze telefooncentrale in Amsterdamse School-stijl, in 1923 geopend en vanaf het begin volautomatisch. Merkwaardig genoeg stond hij met de rug naar de straat. Kijk in het straatje aan de Middenweg: boven de oude deur staat TELEFOONDIENST in art-decoletters, en achterin staat het directeurshuis.

      Rond 1960 werd de Kamerlingh Onneslaan langs de achterkant aangelegd, en de achterkant werd de voorkant. Fiets eromheen voor de poort die toen kwam, met beeldhouwwerk van Hildo Krop van de vier werelddelen, afkomstig van het oude hoofdkantoor van de telefoondienst aan de Herengracht.

      Ronald Janssen Architecten verbouwde het in 2024 en 2025 tot 33 huurwoningen, met twee nieuwe lagen erbovenop: houtskeletbouw met een gevel van gevlamd graniet, dezelfde steen als in de oude ornamenten. Net als bij Rivierstaete: oud skelet, nieuwe top. De vakjury van 2026 noemde vooral het graniet en de nieuwe trappen.
  - place: De Nieuwe Meent
    narration: |
      A short ride east, a different kind of client. De Nieuwe Meent is one of Amsterdam's first pilot housing cooperatives: its members, who are also its tenants, developed, designed and financed the building themselves, with Time to Access and Office Raumplan as architects. Its 40 social homes are taken off the market for good.

      It nearly did not happen. In early 2023 the co-op had a contractor, a permit and 450,000 euros in crowdfunded loans, but a wrong ground-lease calculation, a slow permit, the war in Ukraine, inflation and rising interest rates broke the sums, and the alderman said the city is not a bank. It was finished in 2025 all the same.

      Look for the nest openings for bats, birds and insects in the brick; behind it is a cross-laminated timber structure. The café on the ground floor is open to everyone.
    nl: |
      Een stukje oostelijker, een heel ander soort opdrachtgever. De Nieuwe Meent hoort bij de eerste Amsterdamse proefprojecten met wooncoöperaties: de leden, die er ook huren, ontwikkelden, ontwierpen en financierden het gebouw zelf, met Time to Access en Office Raumplan als architecten. De 40 sociale huurwoningen zijn voorgoed uit de markt gehaald.

      Het ging bijna mis. Begin 2023 lagen er een aannemer, een vergunning en 450.000 euro aan crowdlending klaar, maar een foute erfpachtberekening van de gemeente, een trage vergunning, de oorlog in Oekraïne, inflatie en stijgende rente gooiden de begroting om. "De gemeente is immers geen bank," zei de wethouder. In 2025 was het toch klaar.

      Zoek in het metselwerk de nestopeningen voor vleermuizen, vogels en insecten; daarachter zit een draagconstructie van kruislaaghout. Het café op de begane grond is voor iedereen.
    next:
      directions: Ride under the railway by Station Science Park onto the campus.
      nl: Fiets bij station Science Park onder het spoor door de campus op.
  - place: Amsterdam University College
    narration: |
      Mecanoo's college of 2012 stands next to Science Park station: a square block in striped, rust-brown Cor-ten steel, ending on each side in a saw-tooth of pointed roofs. The folds are not just for show; they carry sedum and hold back rainwater, and under them is a timber-lined attic with the library.

      The best idea is inside. The college does not teach in mass lectures, so there is no big lecture theatre; for the occasional large gathering, a wide staircase with double-height steps serves as the seating. Arcam's guide lists the building as open to the public, so look in through the glass entrance.

      It won the Amsterdamse Architectuur Prijs in 2013. Remember that rusted steel: you will see it again at the far end of the campus, on a building for electricity rather than students.
    nl: |
      Het college van Mecanoo uit 2012 staat naast station Science Park: een vierkant blok met roestbruine strepen van cortenstaal, aan weerszijden afgesloten door een zaagtand van puntdaken. Die knikken doen ook iets: er groeit sedum op en ze houden regenwater vast. Eronder ligt een zolder met houten plafond en de bibliotheek.

      Het mooiste idee zit binnen. Massale colleges worden hier niet gegeven, dus een grote collegezaal is er niet; bij grote bijeenkomsten zit men op een brede trap met dubbelhoge treden. Volgens de architectuurgids van Arcam is het gebouw openbaar toegankelijk; kijk dus even door de glazen entree naar binnen.

      In 2013 won het de Amsterdamse Architectuur Prijs. Onthoud dat roestbruine staal: je ziet het terug aan het eind van de campus, aan een gebouw voor stroom in plaats van studenten.
  - place: LAB42
    narration: |
      A few hundred metres on, Benthem Crouwel (architect Joost Vos) built the University of Amsterdam's home for informatics and AI, opened in September 2022. The users keep changing, so the building had to be able to change too.

      Look at the strict grid of the facade. The steel main frame works like a shelving unit: it can be taken apart, rearranged or extended, and the bays are filled with ceramics, glass or solar panels, about 1,800 square metres of them, enough for the building to make as much energy as it uses. Through the glass ground floor you can see the visualisation, robotics and game labs.

      This is the ride's theme turned into a design brief: not "what do we keep?" but a building made to be kept in parts. The campus route for walkers and cyclists runs right through it.
    nl: |
      Een paar honderd meter verder bouwde Benthem Crouwel (architect Joost Vos) het onderkomen voor informatica en AI van de UvA, geopend in september 2022. De gebruikers wisselen steeds, dus het gebouw moest mee kunnen veranderen.

      Kijk naar het strenge raster van de gevel. Het stalen hoofdframe werkt als een stellingkast: demonteren, anders indelen of uitbreiden kan allemaal. De vakken zijn gevuld met keramiek, glas of zonnepanelen, zo'n 1800 vierkante meter, genoeg om evenveel energie op te wekken als het gebouw gebruikt. Door de glazen plint zie je de visualisatie-, robot- en gamelabs.

      Hier is het thema van de tocht een ontwerpopdracht geworden: niet 'wat houden we?', maar een gebouw dat in onderdelen bewaard kan worden. De campusroute voor fietsers en voetgangers loopt er dwars doorheen.
  - place: 150 kV station Science Park
    narration: |
      At the far eastern tip of the Science Park, near the Flevopark, Willem Schutter of Schutter ETH wrapped a high-voltage substation for the grid operator Liander in rusted Cor-ten steel, finished in 2008. It is one of the 150 kV stations that keep Amsterdam supplied with power.

      Compare it with the college you passed: the same steel, but here laid in overlapping rows like scales. The front curves in waves, the long sides fold in a zigzag, and the doors are set into the pattern so they hardly show. It was nominated for the Amsterdamse Architectuur Prijs 2009.

      It is a working substation: outside only. From here, ride back west towards the station and turn south for Diemen.
    nl: |
      Op het uiterste oostpunt van het Science Park, vlak bij het Flevopark, pakte Willem Schutter van Schutter ETH een hoogspanningsstation van netbeheerder Liander in met roestend cortenstaal; in 2008 was het klaar. Het is een van de 150 kV-stations waarmee Amsterdam van stroom wordt voorzien.

      Vergelijk het met het college van daarnet: hetzelfde staal, maar hier in overlappende rijen gelegd als schubben. De voorkant golft, de lange zijden knikken in een zigzag, en de deuren gaan zo in het patroon op dat je ze nauwelijks ziet. Het stond op de lijst van genomineerden voor de Amsterdamse Architectuur Prijs 2009.

      Het is een werkend station: alleen van buiten te bekijken. Fiets vanaf hier terug naar het westen, richting het station, en buig dan af naar het zuiden, naar Diemen.
    next:
      directions: Ride back west towards Station Science Park, under the railway, then south-east into Diemen.
      nl: Fiets terug naar het westen richting station Science Park, onder het spoor door en dan zuidoostwaarts Diemen in.
  - place: Woonhoeve Diemen (Homestead)
    narration: |
      The ride ends outside the city, on the site of the care organisation Cordaan's old organic nursery, where Diemen's new housing meets sports fields, the railway, the Weespertrekvaart and the nature reserve along the Diem. Marcel Lok_Architect calls this a "residential farm": twelve flats of 2017 in one long, barn-shaped volume, modelled on the monumental barn next door.

      After all the glass, steel and timber, look at the skin: walls, roof and two chimneys are wrapped in one continuous folded layer of French ceramic slates in earthy colours, a nod to the ceramics of the old nursery. Gutters and drainpipes are hidden, and the solar panels lie flush in the roof. The balconies sit at the glazed ends, in dark concrete frames.

      A new building that borrows the shape of an old one: the last version of the ride's theme. Diemen station is about a kilometre away.
    nl: |
      De tocht eindigt buiten de stad, op het terrein van de vroegere biologische kwekerij van zorgorganisatie Cordaan, waar de nieuwe wijk van Diemen grenst aan sportvelden, het spoor, de Weespertrekvaart en het natuurgebied langs de Diem. Marcel Lok_Architect noemt dit een 'woonhoeve': twaalf appartementen uit 2017 in één lang volume als een schuur, familie van de monumentale schuur ernaast.

      Na al dat glas, staal en hout: kijk naar de huid. Gevels, dak en twee schoorstenen zitten in één doorlopende, geknikte laag Franse keramische leien in aardetinten, een verwijzing naar het keramiek van de oude tuinderij. Goten en regenpijpen zijn weggewerkt, de zonnepanelen liggen verzonken in het dak. De balkons zitten aan de glazen kopgevels, in kaders van donker beton.

      Een nieuw gebouw dat de vorm van een oud gebouw leent: de laatste variant op het thema van de tocht. Station Diemen ligt op zo'n kilometer.
