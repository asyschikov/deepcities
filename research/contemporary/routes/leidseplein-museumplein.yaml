title: 'Old institutions remade: from the Leidseplein to the Frederiksplein'
summary: >-
  A party hall behind glass, a theatre climbing over a concert venue, a shopfront copied in glass
  bricks, a savings bank turned hotel, three museums that turned to the square, and a central bank
  that opened its gold vault.
body: |
  **Start:** the Leidseplein (trams), at DeLaMar on the Marnixstraat.
  **End:** De Nederlandsche Bank on the Frederiksplein. Vijzelgracht metro station (exit at the Weteringcircuit) is about ten minutes' walk back west.
  **Distance and time:** about 4 km. Allow about 2 hours with stops, without museum visits. For a shorter walk of about 2 km, end at the Rijksmuseum.

  DeLaMar and the Rabozaal are theatres: you get in with a ticket for a show. The Crystal Houses are a shop, and the front can be studied from the pavement at any hour. The Conservatorium hotel lets you into its public parts. The Stedelijk, the Van Gogh Museum and the Rijksmuseum charge for entry; the Van Gogh and the Rijksmuseum sell tickets for a set time. The passage through the Rijksmuseum and its garden are free. Since March 2025 the old vaults and the inner garden of De Nederlandsche Bank are free to walk into. Frederiksplein 1 is an office, seen from outside.

  Nearly every stop on this walk is an institution from the 19th or 20th century that has been given a new layer since 2009: a party hall, a city theatre, a savings bank, a municipal museum, a national museum, an insurance office and the central bank. Some kept their old face and built behind it, one copied an old front in glass, several turned their entrances round, and the last one opened up the place it used to guard most closely.
mode: walk
nl:
  title: 'Oude instellingen, nieuw gemaakt: van het Leidseplein naar het Frederiksplein'
  summary: >-
    Een feestzaal achter glas, een theaterzaal boven op een poppodium, een winkelpui nagemaakt in glazen
    bakstenen, een spaarbank die hotel werd, drie musea die zich naar het plein keerden en een centrale
    bank die haar goudkluis openzette.
  body: |
    **Start:** het Leidseplein (tram), bij DeLaMar aan de Marnixstraat.
    **Eind:** De Nederlandsche Bank aan het Frederiksplein. Metrostation Vijzelgracht (uitgang Weteringcircuit) ligt zo'n tien minuten lopen terug naar het westen.
    **Afstand en duur:** ongeveer 4 kilometer, met stops zo'n twee uur, zonder museumbezoek. Wie het korter wil, zo'n 2 kilometer, stopt bij het Rijksmuseum.

    DeLaMar en de Rabozaal zijn theaters: je komt binnen met een kaartje voor een voorstelling. In de Crystal Houses zit een winkel, en de gevel bekijk je op elk uur vanaf de stoep. In het Conservatorium hotel mag je in de openbare delen. Stedelijk, Van Gogh Museum en Rijksmuseum vragen entree; bij het Van Gogh en het Rijksmuseum kies je een tijd. De onderdoorgang van het Rijksmuseum en de tuin zijn gratis. De oude kluizen en de binnentuin van De Nederlandsche Bank zijn sinds maart 2025 gratis toegankelijk. Frederiksplein 1 is een kantoor; dat bekijk je van buiten.

    Bijna elke stop is een instelling uit de negentiende of twintigste eeuw die er sinds 2009 een nieuwe laag bij kreeg: een feestzaal, een schouwburg, een spaarbank, een gemeentemuseum, een rijksmuseum, een verzekeringskantoor en de centrale bank. Sommige hielden hun oude gezicht en bouwden erachter, één liet een oude gevel in glas namaken, verschillende draaiden hun ingang om, en de laatste zette juist open wat ze vroeger het best bewaakte.
stops:
  - place: Maison Stroucken, the party hall inside DeLaMar
    narration: |
      Look through the glass front of the DeLaMar theatre and you see an older front behind it, in sandstone, with round stair turrets. This was a party hall of 1881, attributed to Eduard Cuypers, for the Bellevue society, which also let in women and children. As Maison Stroucken it was a favourite for political meetings; Ferdinand Domela Nieuwenhuis spoke to his voters here.

      When the VandenEnde Foundation rebuilt the site as DeLaMar, opened in 2010, Jo Coenen and Arno Meijs rebuilt the old front, partly as a replica, with glass rising behind and above it. That is this walk's theme in one building: an old institution kept as a face, with new work wrapped round it.

      Next door, at no. 404, Hildo Krop's bronze marks where the resistance set fire to the files of the German labour draft in January 1945, and where the occupier shot hostages in reprisal.
    nl: |
      Kijk door de glazen gevel van theater DeLaMar en je ziet er een oudere gevel achter, van zandsteen, met ronde traptorens. Dit was een feestzaal uit 1881, toegeschreven aan Eduard Cuypers, voor sociëteit Bellevue, waar ook vrouwen en kinderen welkom waren. Als Maison Stroucken was het geliefd voor politieke vergaderingen; Ferdinand Domela Nieuwenhuis sprak hier zijn kiezers toe.

      Toen de VandenEnde Foundation het terrein herbouwde tot DeLaMar, open sinds 2010, trokken Jo Coenen en Arno Meijs de oude gevel opnieuw op, deels als replica, met glas erachter en erboven. Daar heb je het thema van deze wandeling in één gebouw: een oude instelling die haar gezicht houdt, met nieuw werk eromheen.

      Ernaast, bij nummer 404, staat het brons van Hildo Krop op de plek waar het verzet in januari 1945 de kaartenbakken van de Arbeitseinsatz in brand stak en waar de bezetter uit wraak gijzelaars fusilleerde.
    next:
      directions: Walk round the block to the far side of the Lijnbaansgracht, to see the box above the Melkweg.
      nl: Loop om het blok heen naar de overkant van de Lijnbaansgracht, voor het zicht op de doos boven de Melkweg.
  - place: Rabozaal, the theatre on top of the Melkweg
    narration: |
      The Stadsschouwburg on the Leidseplein, a national monument, needed a modern flat-floor hall and had no room. Its neighbour, the Melkweg, wanted more space too. Jonkman Klinkhamer Architecten put one new building across the boundary between them, opened in 2009.

      From across the canal you see it widen as it rises: a slim glass base with a rehearsal room you can look into, a glass corridor eight metres up along the water, the foyer jutting out fifteen metres up, and behind it the hall itself, wrapped in orange corrugated aluminium under perforated dark grey steel, partly above the Melkweg's concert hall.

      At DeLaMar the new glass stands in front of the old front. Here the new work climbs over the back of the old theatre: the glass wall behind the stage can be opened onto its brick fly tower. You get in with a ticket.
    nl: |
      De Stadsschouwburg aan het Leidseplein, een rijksmonument, wilde een moderne zaal met een vlakke vloer en had geen ruimte. De buren van de Melkweg zochten ook meer plek. Jonkman Klinkhamer Architecten zette één nieuw gebouw over de erfgrens heen, in 2009 geopend.

      Vanaf de overkant van de gracht zie je het naar boven breder worden: een smalle glazen voet waardoor je een repetitieruimte in kijkt, op acht meter een glazen gang langs het water, op vijftien meter de uitkragende foyer, en daarachter de zaal, dicht met oranje golfplaat van aluminium onder geperforeerd donkergrijs staal, deels boven de concertzaal van de Melkweg.

      Bij DeLaMar staat het nieuwe glas voor de oude gevel. Hier klimt het nieuwe werk over de achterkant van de oude schouwburg: de glazen wand achter het toneel kan open, met uitzicht op de bakstenen toneeltoren. Binnen kom je met een kaartje.
    next:
      directions: Go back across the Leidseplein and over the water to the south, to the P.C. Hooftstraat.
      nl: Loop terug over het Leidseplein en over het water naar het zuiden, naar de P.C. Hooftstraat.
  - place: Crystal Houses, the shopfront of glass bricks
    narration: |
      From across the street this looks like an old shopfront gone out of focus. Two shop-houses of about 1890 stood here until 2014. MVRDV rebuilt their front in solid glass: glass bricks and glass window frames. Their first design was all glass, and taller; the city's aesthetics committee found that too wild for the street. The compromise is the best part: from the first floor up the glass dissolves, brick by brick, into ordinary terracotta for the flats above.

      Engineers of Delft University and ABT spent more than a year on it. The bricks were cast solid in Italy, and instead of mortar there is a clear glue that hardens under UV light, the kind dentists use, in joints of 0.3 millimetres.

      DeLaMar kept part of its old front and partly rebuilt it. Here the old front is gone, and copied in a material that shows it is new.
    nl: |
      Vanaf de overkant lijkt het een oude winkelpui die onscherp is geworden. Tot 2014 stonden hier twee winkelhuizen uit omstreeks 1890. MVRDV bouwde hun gevel opnieuw in massief glas: glazen bakstenen en glazen kozijnen. Eerst tekenden ze alles in glas, en hoger; de welstandscommissie vond dat te wild voor de straat. Het compromis is het mooiste: vanaf de eerste verdieping lost het glas steen voor steen op in gewone baksteen voor de woningen erboven.

      Ingenieurs van de TU Delft en ABT rekenden en testten er ruim een jaar aan. De stenen zijn in Italië massief gegoten, en in plaats van specie zit er doorzichtige lijm tussen die uithardt onder uv-licht, zoals tandartsen gebruiken, in voegen van 0,3 millimeter.

      DeLaMar hield een deel van de oude gevel en bouwde de rest na. Hier is de oude gevel weg, en nagemaakt in een materiaal dat laat zien dat het nieuw is.
    next:
      directions: Walk on to the end of the P.C. Hooftstraat and turn left into the Van Baerlestraat.
      nl: Loop door tot het eind van de P.C. Hooftstraat en sla linksaf de Van Baerlestraat in.
  - place: Rijkspostspaarbank (Conservatorium hotel)
    narration: |
      The state post office savings bank, founded in 1881, let ordinary people pay in at any post office in the country; by 1931 it held some 2.2 million accounts. Its head office, by the government architect Daniël Knuttel, opened on 1 August 1901, with a 65-metre front on the Van Baerlestraat. Look for RIJKSPOSTSPAARBANK in gilded letters over the arched window above the entrance, and the many-sided corner turret with its weathervane at the Paulus Potterstraat end.

      The bank left in 1977. From 1985 to 2008 the Sweelinck Conservatorium was here, and since December 2011 it is a hotel that kept the music school's name. Outside little changed. Inside, the music school's soundproofing and suspended ceilings came out, and a roof of steel and glass went over the courtyard, plainly new against the brick of 1901. In the public parts you can see Art Nouveau tiles with bees and spiders in their webs.
    nl: |
      Bij de Rijkspostspaarbank, opgericht in 1881, kon iedereen op elk postkantoor in het land sparen; in 1931 waren er zo'n 2,2 miljoen spaarrekeningen. Het hoofdkantoor van rijksbouwmeester Daniël Knuttel ging op 1 augustus 1901 open, met een gevel van 65 meter aan de Van Baerlestraat. Zoek RIJKSPOSTSPAARBANK in vergulde letters boven het boogvenster boven de ingang, en het veelhoekige hoektorentje met windwijzer aan de kant van de Paulus Potterstraat.

      In 1977 vertrok de bank. Van 1985 tot 2008 zat hier het Sweelinck Conservatorium, en sinds december 2011 is het een hotel dat de naam van de muziekschool hield. Buiten veranderde weinig. Binnen gingen de geluidsisolatie en systeemplafonds van het conservatorium eruit, en op de binnenplaats kwam een dak van staal en glas, zichtbaar nieuw tegen de baksteen van 1901. In de openbare delen zie je art-nouveautegels met bijen en spinnen in hun web.
    next:
      directions: The Stedelijk's old front is across the street, on the Paulus Potterstraat.
      nl: De oude gevel van het Stedelijk staat aan de overkant, aan de Paulus Potterstraat.
  - place: Stedelijk Museum
    narration: |
      The savings bank was built opposite what is now the Stedelijk: A.W. Weissman's red-brick municipal museum of 1892 to 1894. It did not start modern. Built largely with the legacy of Sophia Lopez Suasso-de Bruyn, it showed her collection and was known as the Suasso museum. Look up at the Paulus Potterstraat front: the medallions over the upper windows are still empty, waiting for the portraits of contemporary artists Weissman meant to add.

      Then go round to the square for Benthem Crouwel's wing of 2012, the Bathtub. It is a seamless shell of fibre-reinforced synthetic, part lifted into the air and part sunk below the square, so that Weissman's building stays almost wholly in view. With it the entrance moved from the Paulus Potterstraat to the Museumplein.
    nl: |
      De spaarbank kwam tegenover wat nu het Stedelijk is: het rode bakstenen gemeentemuseum van A.W. Weissman uit 1892 tot 1894. Modern was het eerst niet. Het werd grotendeels betaald uit de nalatenschap van douairière Lopez Suasso-de Bruyn, toonde haar verzameling en heette in de volksmond het Suasso-museum. Kijk omhoog naar de gevel aan de Paulus Potterstraat: de medaillons boven de ramen van de verdieping zijn nog altijd leeg. Weissman wilde er later portretten van kunstenaars van zijn eigen tijd in zetten.

      Loop daarna om naar het plein, naar de vleugel van Benthem Crouwel uit 2012, de badkuip. Dat is één naadloze schil van vezelversterkte kunststof, deels opgetild en deels onder het plein, zodat het gebouw van Weissman bijna helemaal zichtbaar blijft. Met de badkuip verhuisde de ingang van de Paulus Potterstraat naar het Museumplein.
    next:
      directions: The Van Gogh Museum's glass entrance is next door, across the Willem Sandbergplein.
      nl: De glazen entree van het Van Gogh Museum ligt ernaast, aan de overkant van het Willem Sandbergplein.
  - place: Van Gogh Museum
    narration: |
      Next door, the same turn towards the square. Gerrit Rietveld drew this museum and died in 1964, before it was built; his partners Joan van Dillen and J. van Tricht dropped his glazed brick for concrete blocks imitating stone, which you can see on the Paulus Potterstraat. Kisho Kurokawa's oval wing of 1999 sits half sunk into the square.

      For a new entrance, director Axel Rüger went to Kurokawa's firm, Kurokawa himself having died in 2007, and came back with a sketch: complete the ellipse that the oval wing and its sunken pond already half drew. Hans van Heeswijk Architecten built it as the glass canopy that opened in 2015. The queue now forms here, between the two museums, rather than along the Paulus Potterstraat. After the Rijksmuseum and the Stedelijk, the Van Gogh too faces the square.
    nl: |
      Ernaast dezelfde draai naar het plein. Gerrit Rietveld ontwierp dit museum en overleed in 1964, voor de bouw; Joan van Dillen en J. van Tricht, met wie hij samenwerkte, lieten zijn geglazuurde baksteen vallen voor betonsteen die op breuksteen moest lijken. Dat zie je aan de Paulus Potterstraat. De ovale vleugel van Kisho Kurokawa uit 1999 zit half verzonken in het plein.

      Voor een nieuwe entree reisde directeur Axel Rüger naar het bureau van Kurokawa, die in 2007 was overleden, en nam een schets mee terug: maak de ellips af die de ovale vleugel en de verdiepte vijver al half vormden. Hans van Heeswijk Architecten werkte dat uit tot de glazen overkapping die in 2015 openging. De rij staat nu hier, tussen de twee musea, en niet meer langs de Paulus Potterstraat. Na het Rijksmuseum en het Stedelijk keerde ook het Van Gogh zich naar het plein.
    next:
      directions: Cross the Museumplein to the Rijksmuseum. The Asian Pavilion is in the garden on its south side.
      nl: Steek het Museumplein over naar het Rijksmuseum. In de tuin aan de zuidkant staat het Aziatisch Paviljoen.
  - place: Rijksmuseum
    narration: |
      Pierre Cuypers's national museum of 1885 has a public road through its middle. In 1873 the city gave the land on one condition, a passage to the new district behind it, and it never handed that strip to the state. Director after director hoped to make it the museum's entrance hall and failed.

      The ten-year rebuild that ended in April 2013, led by Cruz y Ortiz of Seville with Van Hoogevest as restoration architect and Jean-Michel Wilmotte for the galleries, solved it from below. They cleared the two built-up courtyards, roofed them in glass and lowered the floor so that the two meet underground, beneath the cycle path. In the passage walls brick gave way to glass: cyclists look into the museum, and visitors look out.
      Walk through the passage, which is free, as is the garden with the Asian Pavilion of Portuguese stone, standing in water.
    nl: |
      Dwars door het rijksmuseum van Pierre Cuypers uit 1885 loopt een openbare weg. De stad gaf in 1873 de grond op één voorwaarde, een doorgang naar de nieuwe wijk erachter, en droeg die strook nooit aan het Rijk over. Directeur na directeur hoopte er een ingangshal van te maken, tevergeefs.

      De verbouwing van tien jaar, in april 2013 klaar, onder leiding van Cruz y Ortiz uit Sevilla, met Van Hoogevest als restauratiearchitect en Jean-Michel Wilmotte voor de zalen, loste het van onderen op. De twee volgebouwde binnenhoven werden leeggehaald en kregen een glazen dak, en de vloer ging omlaag, zodat de hoven onder het fietspad door in elkaar overlopen. In de zijmuren van de doorgang kwam glas waar baksteen zat: fietsers kijken het museum in, bezoekers naar buiten.
      Loop door de onderdoorgang; die is gratis, net als de tuin met het Aziatisch Paviljoen van Portugese steen, midden in het water.
    next:
      directions: Come out on the city side and follow the water east for about a kilometre to the Frederiksplein.
      nl: Kom aan de stadskant naar buiten en volg het water zo'n kilometer naar het oosten, naar het Frederiksplein.
  - place: Frederiksplein 1
    narration: |
      A quieter kind of remaking. Arthur Staal, a committed modernist, designed this office for an insurance bank in 1967, when the city was busy replacing old buildings with new ones. He fitted it between two historic neighbours in an abstract way: one half of the front is brick and the other concrete, showing that the plot once held two houses, and the top floor runs a cornice line like the older fronts on the square.

      Office Winhov renewed it for Egeria, finished in 2022, without stripping it. The front was replaced in the same style to meet today's energy standards, keeping the rhythm and depth of the frames, and behind Staal's odd top-floor front is now the staff restaurant.

      DeLaMar kept a 19th-century face; this keeps a sixties one.
    nl: |
      Een stillere manier van vernieuwen. Arthur Staal, een overtuigd modernist, ontwierp dit kantoor in 1967 voor een verzekeringsbank, in de jaren dat Amsterdam volop oude bebouwing verving. Hij sloot abstract aan op twee historische buren: de gevel is half baksteen en half beton, zodat je ziet dat hier ooit twee panden stonden, en de bovenste verdieping volgt met een doorgaande lijn de oudere gevels rond het plein.

      Office Winhov verbouwde het voor Egeria, in 2022 klaar, en poetste niets weg. De gevel is in dezelfde stijl vervangen, zodat het pand weer aan de energie-eisen voldoet, met behoud van het ritme en de diepte van de kozijnen. Achter Staals eigenzinnige bovenste gevel eet nu het personeel.

      DeLaMar hield een negentiende-eeuws gezicht; dit pand houdt een gezicht uit de jaren zestig.
    next:
      directions: The central bank is across the square.
      nl: De centrale bank ligt aan de overkant van het plein.
  - place: De Nederlandsche Bank, the gold vault anyone can walk into
    narration: |
      Here stood the Paleis voor Volksvlijt, Amsterdam's palace of industry in iron and glass, opened in 1864. It burned down in April 1929; its surviving shopping gallery was pulled down in 1961 for the central bank, which the writer Rudy Kousbroek called the most extreme act of vandalism in post-war Amsterdam.

      Marius Duintjer's bank opened in 1968. Mecanoo rebuilt it from 2020 to 2025, kept his robust geometry and the brick front with its brown tiles, and cut the new entrance on the Frederiksplein straight through the gold vault. The most secret part of the bank became its most public. Since March 2025 anyone can walk in free to the old vaults and the inner garden. Ossip Zadkine's sculpture is back by the entrance.

      Halfway along, a savings bank became a hotel. The walk ends at a bank that opened its vault.
    nl: |
      Hier stond het Paleis voor Volksvlijt, het Amsterdamse Crystal Palace van ijzer en glas, geopend in 1864. In april 1929 brandde het af; de winkelgalerij die overbleef, ging in 1961 tegen de vlakte voor de centrale bank. Rudy Kousbroek noemde dat de meest extreme daad van vandalisme in Amsterdam na de oorlog.

      Het gebouw van Marius Duintjer ging in 1968 open. Mecanoo verbouwde het van 2020 tot 2025, liet Duintjers stevige vormen en de bakstenen gevel met bruine tegels intact, en legde de nieuwe ingang aan het Frederiksplein dwars door de goudkluis. Zo werd het geheimste deel van de bank het meest openbare. Sinds maart 2025 kan iedereen gratis de oude kluizen en de binnentuin in. Het beeld van Ossip Zadkine staat weer bij de ingang.

      Halverwege werd een spaarbank een hotel. De wandeling eindigt bij een bank die haar kluis openzette.
