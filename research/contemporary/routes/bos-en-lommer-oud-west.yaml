title: 'From tram depot to art house: old and new in West'
summary: >-
  From the tram depot of De Hallen to a technical school full of artists, through Oud-West and Bos en
  Lommer: a mosque in Amsterdam School brick, a pool in a coat of plants, an office turned homes and new
  housing that has to live with the A10.
body: |
  **Start:** De Hallen, off the Bellamyplein and the Tollensstraat in Oud-West. Several tram stops are within a few minutes' walk.
  **End:** WOW Amsterdam on the Wiltzanghlaan, about ten minutes' walk from De Vlugtlaan metro station.
  **Distance and time:** about 5 km. Allow about 2½ hours with stops, more if you stop for a swim or a meal.

  **What you can go into:** De Hallen's indoor street, free to wander through, with a food hall, a cinema and a library; the Westermoskee; Sportplaza Mercator, a working pool and gym with a café; the raised courtyard of Rhapsody in West; the sculpture gallery outside the GAK building; the raised square of the Bos en Lommerplein; and the public parts of WOW (restaurant and art space). Everything else is housing, seen from the street. The route is flat; the leg from the Westermoskee to Sportplaza Mercator is the longest, a bit over a kilometre. If you have energy left, two more places from this map are close by: the Augustanakerk, a church turned hofje with a quiet garden by the Erasmusgracht, east of the Bos en Lommerplein, and De Voortuinen, a 1971 bank tower turned flats, on the Haarlemmerweg about a kilometre east of WOW.

  This walk is about what the west of the city did with the buildings it no longer needed, and what it built on the gaps in between. Three conversions frame it: a tram depot opened up as a covered street, a 1960 office by the ring road turned into studios, and a technical school turned into artists' studios paid for by a hostel. In between come new buildings that had to fit in or fight back: a mosque wrapped in Amsterdam School brick, a pool dressed in plants, and in Bos en Lommer a run of housing that has to deal with the noise of the A10, with a block as a sound wall, curved fronts and windows that may not open. Several of them, old and new, were built for the same people: young Amsterdammers looking for a first home.
mode: walk
nl:
  title: 'Van tramremise tot kunsthuis: oud en nieuw in West'
  summary: >-
    Van de tramremise van De Hallen naar een technische school vol kunstenaars, door Oud-West en Bos en
    Lommer: een moskee in Amsterdamse Schoolsteen, een zwembad in een jas van planten, een kantoor vol
    woningen en nieuwbouw die moet leven met de A10.
  body: |
    **Start:** De Hallen, aan het Bellamyplein en de Tollensstraat in Oud-West. Binnen een paar minuten lopen zijn er verschillende tramhaltes.
    **Eind:** WOW Amsterdam aan de Wiltzanghlaan, zo'n tien minuten lopen van metrostation De Vlugtlaan.
    **Afstand en duur:** ongeveer 5 kilometer, met stops zo'n 2,5 uur, langer als je gaat zwemmen of eten.

    **Naar binnen:** de overdekte straat van De Hallen, vrij toegankelijk, met de Foodhallen, een bioscoop en een bibliotheek; de Westermoskee; Sportplaza Mercator, gewoon een zwembad met sportschool en een café; het verhoogde binnenterrein van Rhapsody in West; de beeldengalerij bij het GAK-gebouw; het verhoogde Bos en Lommerplein; en de openbare delen van WOW (restaurant en kunstruimte). De rest is woningbouw, te bekijken vanaf de straat. De route is vlak; het stuk van de Westermoskee naar Sportplaza Mercator is het langst, iets meer dan een kilometer. Heb je nog puf, dan liggen er twee plekken van deze kaart vlakbij: de Augustanakerk, een kerk die een hofje werd, met een stiltetuin aan de Erasmusgracht, ten oosten van het Bos en Lommerplein, en De Voortuinen, een bankkantoor uit 1971 vol woningen, aan de Haarlemmerweg, zo'n kilometer ten oosten van WOW.

    Deze wandeling gaat over wat West deed met gebouwen die het niet meer nodig had, en wat het neerzette op de gaten ertussen. Drie verbouwingen vormen de lijst: een tramremise die werd opengebroken tot overdekte straat, een kantoor uit 1960 langs de ring dat vol studio's kwam, en een technische school die ateliers werd, betaald door een hostel. Daartussen nieuwbouw die zich moest voegen of verweren: een moskee in het metselwerk van de Amsterdamse School, een zwembad in een jas van planten, en in Bos en Lommer een rij woongebouwen die het lawaai van de A10 moeten tegenhouden, met een blok als geluidsmuur, bolle gevels en ramen die niet open mogen. Opvallend veel ervan, oud en nieuw, zijn voor dezelfde mensen bedoeld: jonge Amsterdammers die een eerste woning zoeken.
stops:
  - place: De Hallen (Westelijke Tramremise)
    narration: |
      Start inside, in the passage. This was the city's largest tram depot when it opened in 1902, built on a filled-in lake with 21 tracks for 135 trams. After it emptied, squatters moved in in 2010, promising to leave once there was a plan the neighbourhood backed. That plan came from residents, future users and the architect André van Stigt, and the complex reopened in 2015.

      Van Stigt worked from "function follows form": the halls decided what fitted. His main moves were to open the halls up and run this passage right through, so the depot joins the neighbourhood instead of walling it off. Look down at the tram rails in the floor and up at the Polonceau trusses and glass roofs. Two 1940 murals by Mozes Cohen here remember the 165 Jewish residents of Oud-West who were deported and murdered.
    nl: |
      Begin binnen, in de passage. In 1902 was dit de grootste tramremise van de stad: 21 sporen voor 135 motorwagens, op een gedempt meer. Toen het leeg stond, kwamen in 2010 de krakers, die beloofden te gaan zodra er een plan lag dat de buurt steunde. Dat plan kwam van buurtbewoners, toekomstige gebruikers en architect André van Stigt; in 2015 ging het complex weer open.

      Van Stigt werkte vanuit "function follows form": de hallen bepaalden zelf wat erin paste. Zijn belangrijkste ingrepen waren het openmaken van de hallen en het doortrekken van deze passage, zodat de remise nu bij de Ten Katebuurt hoort. Kijk omlaag naar de tramrails in de vloer en omhoog naar de polonceauspanten en de glazen kappen. Twee schilderingen uit 1940 van Mozes Cohen herinneren hier aan de 165 Joodse bewoners van Oud-West die werden weggevoerd en vermoord.
  - place: Westermoskee
    narration: |
      From a building that was opened up to one that had to fit in. In 1994 the Turkish association Milli Görüş bought this derelict site by the Kostverlorenvaart. Years of bitter conflict with the district followed, then a deal in 2000: a smaller mosque, 111 homes, all by the French architects Marc and Nada Breitman. The mosque opened only on 1 April 2016.

      Stand on the Piri Reisplein and look at how it is dressed: dark red brick with white details, running from the mosque into the housing around it, in the manner of the Amsterdam School streets nearby. Behind that Dutch skin the plan is Ottoman: a main dome 25 metres high, seven domes on the front, nine on the canal side, four half-domes at the corners. The 43-metre minaret stands at the height an arbitration committee insisted on. In the north-east wall, look for the ten "bird palaces".
    nl: |
      Van een gebouw dat werd opengebroken naar een dat zich moest voegen. In 1994 kocht de Turkse vereniging Milli Görüş dit verlaten terrein aan de Kostverlorenvaart. Er volgde een jarenlange, felle strijd met het stadsdeel en in 2000 een akkoord: een kleinere moskee, 111 woningen, alles van het Franse architectenpaar Marc en Nada Breitman. Pas op 1 april 2016 ging de moskee open.

      Kijk vanaf het Piri Reisplein hoe ze is aangekleed: donkerrode baksteen met witte accenten, die doorloopt van de moskee naar de woningen eromheen, op de manier van de Amsterdamse School in de buurt. Achter die Hollandse huid volgt het ontwerp de Ottomaanse moskeebouw: een hoofdkoepel van 25 meter hoog, zeven koepels aan de voorkant, negen aan de waterkant en vier halve koepels op de hoeken. De minaret van 43 meter staat op de hoogte waar een arbitragecommissie op stond. Zoek in de noordoostgevel de tien vogelpaleizen.
  - place: Sportplaza Mercator
    narration: |
      The mosque hides in brick; this pool hides in plants. It replaced two worn-out pools in West, including the open-air Jan van Galenbad on this very site, where boys and girls swam apart behind a fence until the 1970s. VenhoevenCS designed it, and it opened in 2006, two years late.

      From the Jan van Galenstraat it looks like an overgrown bastion at the head of the Rembrandtpark. The black, elastic skin has a slit every twenty centimetres, each holding a planter: about 50,000 plants of some sixty kinds, watered by computer, under grass roofs. How green it looks depends on the season. Through the glass front you see a small society in one building: lap swimmers, children, people in the therapy pool, gym-goers and people who only came for the café. On the central reservation in front stands Eveline van Duyl's Potkachel (stove).
    nl: |
      De moskee verstopt zich in baksteen, dit zwembad in planten. Het verving twee versleten baden in West, waaronder het openluchtbad Jan van Galenbad op precies deze plek, waar jongens en meisjes tot in de jaren zeventig door een hek gescheiden zwommen. VenhoevenCS ontwierp het, en in 2006 ging het open, twee jaar later dan gepland.

      Vanaf de Jan van Galenstraat lijkt het een overgroeid bolwerk aan de kop van het Rembrandtpark. De zwarte, elastische huid heeft om de twintig centimeter een sleuf met een plantenbak: zo'n 50.000 planten van een stuk of zestig soorten, door een computer van water voorzien, onder grasdaken. Hoe groen het is, hangt af van het seizoen. Door de glazen pui zie je een kleine samenleving in één gebouw: baantjeszwemmers, kinderen, mensen in het therapiebad, sporters en mensen die alleen voor het café komen. Op de middenberm ervoor staat de Potkachel van Eveline van Duyl.
    next:
      directions: Follow the Jan van Galenstraat west, past the ring road, and turn into the new neighbourhood on your right.
      nl: Volg de Jan van Galenstraat naar het westen, voorbij de ring, en sla rechts de nieuwe buurt in.
  - place: 'Laan van Spartaan: a neighbourhood built round a football club'
    narration: |
      Here the gap was a sports park, and the city built over it without losing the club. Ymere and Bouwfonds put up more than a thousand homes from 2007 to 2021, and VVA/Spartaan came back in 2006 to two new pitches in the middle, with the blocks round them like stands. Look at the pitches from the Laan van Spartaan.

      Along the east side runs De Tribune (2011) by Claus en Kaan, 250 metres long and ten to thirteen storeys high. It doubles as a noise wall against the A10, so it has two faces: dark, sleek steel and glass towards the motorway, pale brick with balconies and relief towards the pitches. It was first planned as offices; when nobody needed them it became homes for older people, students and top athletes. Keep an ear on the A10: it stays with you as far as the Bos en Lommerplein.
    nl: |
      Hier was het gat een sportpark, en de stad bebouwde het zonder de club kwijt te raken. Ymere en Bouwfonds bouwden er van 2007 tot 2021 ruim duizend woningen, en VVA/Spartaan kwam in 2006 terug op twee nieuwe velden in het midden, met de blokken er als tribunes omheen. Bekijk de velden vanaf de Laan van Spartaan.

      Aan de oostkant staat De Tribune (2011) van Claus en Kaan, 250 meter lang en tien tot dertien lagen hoog. Het blok is ook geluidsscherm tegen de A10 en heeft daarom twee gezichten: naar de snelweg een donkere, strakke gevel van staal en glas, naar de velden lichte baksteen vol balkons en reliëf. Eerst was het bedacht als kantoor; toen niemand die kantoren nodig had, kwamen er ouderenwoningen, studentenkamers en woningen voor topsporters in. Hou de A10 in de gaten: die blijft bij je tot aan het Bos en Lommerplein.
    next:
      directions: Walk north through the neighbourhood and back east across the ring road to the long glass office building.
      nl: Loop door de buurt naar het noorden en aan de andere kant van de ring terug naar het oosten, naar het lange glazen kantoorgebouw.
  - place: GAK-gebouw
    narration: |
      De Tribune turned from offices into homes while still on the drawing board. Here the offices were built, used for 45 years and then converted. Ben Merkelbach's last building opened in 1960 for the national social-insurance office, one of the largest and most modern office buildings in the country, and locals call it the "Aquarium" for its glass walls. You can still read the plinth, the central block and the long wings.

      It emptied in 2005, and the developers AM and Stadgenoot chose small studios of about 28 m² for starters and students: 320 in the north wing in 2012 and 331 in the south wing in 2015. Along the A10 the windows were not allowed to open, so a double front was made there, with ventilated sunrooms behind it. Outside, find the sculpture gallery with its pergola and pond, and Carel Visser's Watertafel.
    nl: |
      De Tribune veranderde al op de tekentafel van kantoor in woningbouw. Hier stond het kantoor er echt, 45 jaar lang, voor het werd verbouwd. Het laatste gebouw van Ben Merkelbach ging in 1960 open voor het Gemeenschappelijk Administratiekantoor en hoorde toen bij de grootste en modernste kantoren van het land. In de buurt heet het het Aquarium, naar de glazen gevels. Plint, middenbouw en lange vleugels zijn nog altijd goed te zien.

      In 2005 kwam het leeg te staan, en AM en Stadgenoot kozen voor kleine studio's vanaf zo'n 28 m² voor starters en studenten: 320 in de noordvleugel in 2012, 331 in de zuidvleugel in 2015. Langs de A10 mochten de ramen niet open, dus kwam er een dubbele gevel met geventileerde serres erachter. Zoek buiten de beeldengalerij met pergola en vijver, en de Watertafel van Carel Visser.
  - place: De Houten Leeuw
    narration: |
      Cross back to the west side of the ring road, into the Kolenkitbuurt, just behind the Kolenkitkerk. Same client as the GAK conversion, the housing association Stadgenoot, and the same people to house: 53 studios of about 35 m² for young people aged 18 to 28. But where the GAK reused a concrete office, this is new and made of wood. Arcam calls it the first apartment building in Amsterdam's social-rent sector built entirely of timber, finished in November 2024; the builder says the cross-laminated frame went up in nine weeks.

      From the street you would hardly guess it. The front is rendered, a compromise after the city's design review committee had its doubts. The timber shows at the back, where a gallery of azobé leans against the building with a broad stair climbing along it, and a bench and storage box for every flat.
    nl: |
      Je bent weer aan de westkant van de ring, in de Kolenkitbuurt, vlak achter de Kolenkitkerk. Dezelfde opdrachtgever als bij het GAK-gebouw, woningcorporatie Stadgenoot, en dezelfde doelgroep: 53 studio's van zo'n 35 m² voor jongeren van 18 tot 28. Maar waar het GAK een betonnen kantoor hergebruikte, is dit nieuw en van hout. Volgens Arcam is het het eerste appartementengebouw in de Amsterdamse sociale sector dat helemaal van hout is, in november 2024 opgeleverd; het skelet van kruislaaghout stond er volgens de bouwer in negen weken.

      Vanaf de straat zie je dat nauwelijks. De voorgevel is gestuct, een compromis nadat de commissie ruimtelijke kwaliteit hoofdbrekens had over de gevel. Het hout zit aan de achterkant, waar een galerij van azobé tegen het gebouw leunt, met een brede trap erlangs en bij elke woning een bankje met opbergbak.
  - place: Rhapsody in West
    narration: |
      Around 2010 the Kolenkitbuurt was named one of the most deprived neighbourhoods in the Netherlands. At its edge, against the A10, lay an empty plot with noise, fine dust and water problems. TANGRAM's answer, finished in 2019, takes on the noise in layers. A long block along the A10 and a side block on the Bos en Lommerweg take the brunt of the traffic. Between them, three rounded blocks bend the rest of the noise away with their curved fronts, in the dark red brick of the rest of the Kolenkitbuurt, with glass and white concrete.

      Go up into the raised courtyard, which is open to the neighbourhood: a garden, a greenhouse, a coffee bar and a guest flat where neighbours can put up family from far away. Volunteer community managers run it for a rent discount. The project won the public prize of the Amsterdamse Architectuur Prijs 2020.
    nl: |
      Rond 2010 gold de Kolenkitbuurt als een van de armste wijken van Nederland. Aan de rand, tegen de A10, lag een braakliggend terrein vol lawaai, fijnstof en wateroverlast. TANGRAM, in 2019 klaar, pakte het lawaai in lagen aan. Een lang gebouw langs de A10 en een zijgebouw aan de Bos en Lommerweg vangen het verkeer op. Daartussen staan drie ronde blokken waarvan de bolle gevels het overgebleven geluid afbuigen, in de donkerrode baksteen van de rest van de Kolenkitbuurt, met glas en wit beton.

      Ga naar boven, het verhoogde binnenterrein op, dat open is voor de buurt: een tuin, een kas, een koffiebar en een logeerwoning waar buurtbewoners familie van ver kunnen onderbrengen. Vrijwillige communitymanagers houden het bij en krijgen daarvoor korting op de huur. Het project won de publieksprijs van de Amsterdamse Architectuur Prijs 2020.
  - place: Bos en Lommerplein, the evacuated square
    narration: |
      Here the ring road reshaped a whole square. It was designed in 1939 as a symmetrical plaza in Berlage's spirit, then lost its coherence when the road alongside became the raised ring road. Around 2000 came a raised market square over a car park, ringed by shops, designed by Vera Yanovshtchinsky Architecten to close the axis that runs from the Mercatorplein. On the west side, offices above the shops double as a noise screen; the homes face east.

      Then the story turns. In February 2006 a lorry sank into the deck, and on 11 July mayor Job Cohen had the whole complex cleared: the residents of all 96 flats went to hotels. The concrete was strengthened at about four hundred points. The market, held almost daily until 2020, was abolished in 2023; the city wants a greener square without it.
    nl: |
      Hier gooide de ringweg een heel plein om. Het werd in 1939 ontworpen als een symmetrisch plein in de geest van Berlage, maar verloor zijn samenhang toen de weg ernaast de verhoogde ringweg werd. Rond 2000 kwam er een verhoogd marktplein boven een parkeergarage, met winkels eromheen, ontworpen door Vera Yanovshtchinsky Architecten, als formeel eind van de as die vanaf het Mercatorplein loopt. Aan de westkant zitten boven de winkels kantoren die ook het lawaai tegenhouden; de woningen liggen aan de oostkant.

      Dan neemt het verhaal een wending. In februari 2006 zakte een vrachtwagen door het dek, en op 11 juli liet burgemeester Job Cohen het hele complex ontruimen: de bewoners van alle 96 koopwoningen gingen naar een hotel. Het beton werd op zo'n vierhonderd punten versterkt. De markt, tot 2020 bijna dagelijks, werd in 2023 opgeheven; de stad wil een plein zonder markt en met meer groen.
  - place: 'WOW Amsterdam: technical school, asylum centre, art house'
    narration: |
      The walk ends where it began, with a building nobody needed any more. This concrete school was designed in 1965 as a higher technical college: a five-storey block with low wings round half-enclosed courtyards, steel-framed glass fronts alternating with white glazed brick. It became an asylum seekers' centre in 2000 and stood empty from 2006.

      In 2013 a hotelier and a city-maker took it on with almost no money. MMX-architecten finished in June 2014: they made the ground floor fully transparent, and turned the huge stairwell into a vertical gallery. Now there are fifty studios for young artists, an art space, a restaurant and a hostel on the top two floors, whose beds keep the place running without structural subsidy. Like De Hallen, it was opened up rather than rebuilt. On the hill in front stand Nicolas Chuard's sofa of rock and André Volten's steel cubes.
    nl: |
      Je eindigt zoals je begon: bij een gebouw dat niemand meer nodig had. Deze betonnen school werd in 1965 getekend als hts: een blok van vijf lagen met lage vleugels rond half besloten buitenruimtes, glazen puien in dunne stalen kozijnen afgewisseld met wit geglazuurde steen. In 2000 werd het een asielzoekerscentrum, vanaf 2006 stond het leeg.

      In 2013 namen een hotelier en een stadmaker het met een minimaal budget onder handen. MMX-architecten was in juni 2014 klaar: de begane grond werd van glas, en het enorme trappenhuis werd een verticale galerie. Nu zitten er vijftig ateliers voor jonge kunstenaars, een kunstruimte, een restaurant en op de bovenste twee verdiepingen een hostel, waarvan de bedden het geheel zonder vaste subsidie draaiende houden. Net als De Hallen werd het opengebroken in plaats van herbouwd. Op de heuvel ervoor staan de stenen bank van Nicolas Chuard en de stalen kubussen van André Volten.
