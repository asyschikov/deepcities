title: 'Plantage to Oostenburg: old institutions remade, new homes on old yards'
summary: >-
  From the Holocaust Names Monument and the museum in the old teacher-training college, past a zoo
  corner given to the city and the Admiralty's storehouse, to the VOC's shipyard island and a buried
  bastion, where new homes fill the old industrial ground.
body: |
  **Start:** the National Holocaust Names Monument on the Weesperstraat, a few minutes' walk from Waterlooplein metro station.
  **End:** Verdana in the car-free Funenpark. Muiderpoort station (trains and trams) is about 20 minutes' walk to the south.
  **Distance and time:** about 4.5 km, some 70 minutes' walking. Allow 2.5 to 3 hours with stops, and more if you visit a museum.

  The Names Monument is free and open from 8:00 to 20:00 in winter and to 21:00 in summer. The National Holocaust Museum is open daily from 10:00 to 17:00, with a paid ticket, and is recommended from age 10. The Artisplein is free, outside the zoo fence. Arcam's pavilion is open to the public. Het Scheepvaartmuseum is open daily from 10:00 to 17:00 (paid, card only). The housing on Oostenburg and in the Funen is private and seen from the street; the Funenpark itself is open to all. Three more buildings on this map are inside Artis and need a zoo ticket: the elephant enclosure with its sunken bridge, the spider monkey house and Het Duivenhuis.

  The first half visits institutions given a new form: a national monument on a strip left open when the houses of the old Jewish Weesperstraat were cleared after the war, a museum in a teacher-training college through which Jewish children were smuggled to safety, a corner of the zoo opened to the city, the architecture centre and the Admiralty's naval storehouse. The second half crosses to Oostenburg, where the VOC built its ships and Werkspoor and Stork built engines, and ends on the site of bastion Zeeburg. Here old industrial ground has been filled with homes, from 32 buildings shared out among three firms to ten houses under one rolling roof.
mode: walk
nl:
  title: 'Van de Plantage naar Oostenburg: oude instellingen, nieuwe woningen op oude werven'
  summary: >-
    Van het Holocaust Namenmonument en het museum in de oude kweekschool, langs een hoek van Artis die
    aan de stad is gegeven en het zeemagazijn van de Admiraliteit, naar het werfeiland van de VOC en
    een begraven bolwerk, waar nieuwe woningen de oude bedrijfsgrond vullen.
  body: |
    **Start:** het Nationaal Holocaust Namenmonument aan de Weesperstraat, op een paar minuten lopen van metrostation Waterlooplein.
    **Eind:** Verdana in het autovrije Funenpark. Station Muiderpoort (trein en tram) ligt zo'n twintig minuten lopen naar het zuiden.
    **Afstand en duur:** ongeveer 4,5 kilometer, zo'n zeventig minuten lopen. Met stops ben je tweeënhalf tot drie uur bezig, langer als je een museum in gaat.

    Het Namenmonument is gratis en 's winters open van 8.00 tot 20.00 uur, 's zomers tot 21.00 uur. Het Nationaal Holocaustmuseum is dagelijks open van 10.00 tot 17.00 uur, met kaartje, en aanbevolen vanaf 10 jaar. Het Artisplein ligt buiten het hek en is gratis. Het paviljoen van Arcam is vrij toegankelijk. Het Scheepvaartmuseum is dagelijks open van 10.00 tot 17.00 uur (betaald, alleen met pin of creditcard). De woningen op Oostenburg en in het Funen zijn particulier en bekijk je vanaf de straat; het Funenpark zelf is voor iedereen. Drie gebouwen op deze kaart liggen binnen Artis en vragen een toegangskaart: het olifantenverblijf met de verdiepte brug, het slingerapenverblijf en het Duivenhuis.

    De eerste helft gaat langs instellingen die een nieuwe vorm kregen: een nationaal monument op de groenstrook die openbleef toen na de oorlog de huizen van de oude Joodse Weesperstraat werden gesloopt, een museum in de kweekschool waardoor Joodse kinderen in veiligheid werden gebracht, een hoek van de dierentuin die aan de stad is gegeven, het architectuurcentrum en het zeemagazijn van de Admiraliteit. De tweede helft steekt over naar Oostenburg, waar de VOC schepen bouwde en Werkspoor en Stork machines, en eindigt op de plek van bolwerk Zeeburg. Daar is oude bedrijfsgrond gevuld met woningen, van 32 panden verdeeld over drie bureaus tot tien huizen onder één golvend dak.
stops:
  - place: National Holocaust Names Monument (Holocaust Namenmonument)
    narration: |
      Start among the names. Each of some 102,000 bricks carries the name, date of birth and age at death of a Jew from the Netherlands who was murdered in the Holocaust and has no grave; some 220 Sinti and Roma are named here too. Daniel Libeskind laid out the walls, about two metres high, so that seen from above they form the four Hebrew letters of the word for "in memory of". On the ground you walk corridors with names on both sides.

      On top, mirror-polished stainless steel catches the trees, the sky and the street. Between steel and brick runs a narrow gap, so the letters seem to float: it stands for the break in the history of the Dutch Jews. The monument, unveiled in 2021, fills the green strip left open when the houses of the old Jewish Weesperstraat were cleared after the war. QR codes on site lead you to any name.
    nl: |
      Je begint tussen de namen. Op elk van ruim 102.000 bakstenen staan de naam, de geboortedatum en de leeftijd bij overlijden van een Jood uit Nederland die in de Holocaust is vermoord en geen graf heeft; ook ruim 220 Sinti en Roma staan hier. Daniel Libeskind legde de muren, zo'n twee meter hoog, zo neer dat ze van bovenaf de vier Hebreeuwse letters van Lezecher vormen, 'ter herinnering aan'. Beneden loop je door gangen met namen aan weerszijden.

      Erbovenop spiegelen vormen van glanzend roestvrij staal de bomen, de lucht en de straat. Tussen staal en baksteen zit een smalle kier, waardoor de letters lijken te zweven: het beeld van de breuk in de geschiedenis van de Nederlandse Joden. Het monument, in 2021 onthuld, ligt op de groenstrook die openbleef toen na de oorlog de huizen van de oude Joodse Weesperstraat werden gesloopt. Met de QR-codes ter plekke vind je elke naam.
    next:
      directions: Walk east into the Plantage, to the Plantage Middenlaan.
      nl: Loop oostwaarts de Plantage in, naar de Plantage Middenlaan.
  - place: National Holocaust Museum (Nationaal Holocaustmuseum), in the old teacher-training college
    narration: |
      At number 27, the Protestant teacher-training college of 1888 has been the National Holocaust Museum since March 2024. The building next door held the Jewish crèche. From October 1942 the occupier used it as an annex of the Hollandsche Schouwburg across the road: children up to about twelve waited there for deportation, apart from their parents.

      The crèche's director Henriëtte Pimentel, Walter Süskind in the theatre opposite and resistance groups got children out. Johan van Hulst, head of the college, let them into its garden and classrooms, and they left by the school's front door. The museum puts the number saved at about six hundred. Pimentel was deported on 26 July 1943 and murdered.

      Office Winhov kept what survived of the school and added an entrance building in pale brick, so the museum would look open rather than closed and dark. On the old front, look for the bronze plaque of 1982 to all who helped keep Jewish children from deportation.
    nl: |
      Op nummer 27 zit sinds maart 2024 het Nationaal Holocaustmuseum, in de Hervormde Kweekschool uit 1888, waar onderwijzers werden opgeleid. In het pand ernaast zat de Joodse crèche. Vanaf oktober 1942 gebruikte de bezetter die als dependance van de Hollandsche Schouwburg aan de overkant: kinderen tot een jaar of twaalf wachtten daar, los van hun ouders, op hun deportatie.

      Directrice Henriëtte Pimentel, Walter Süskind in de schouwburg tegenover en verzetsgroepen kregen kinderen naar buiten. Johan van Hulst, directeur van de kweekschool, liet de crèchekinderen in zijn tuin en lokalen toe, en via de voordeur van de school verlieten ze het gebouw. Volgens het museum werden er zo'n zeshonderd kinderen gered. Pimentel werd op 26 juli 1943 weggevoerd en vermoord.

      Office Winhov bewaarde wat er van de school over was en zette er een entreegebouw van lichte baksteen naast: geen somber, dichtgetrokken museum. Zoek op de oude gevel de bronzen plaquette uit 1982, "Aan allen die tijdens de Duitse bezetting hebben geholpen Joodse kinderen voor deportatie te behoeden".
    next:
      directions: Walk on east along the Plantage Middenlaan to the corner of the Plantage Kerklaan.
      nl: Loop verder naar het oosten over de Plantage Middenlaan, tot de hoek met de Plantage Kerklaan.
  - place: Artisplein, a corner of the zoo you can sit in for free
    narration: |
      At this corner Artis gave part of the zoo to the city. In 2014 it pulled down its Geological Museum and the flamingo house and opened a square outside the fence. The landscape architect Michael van Gessel laid a brick "carpet" between two listed buildings, the members' rooms (Ledenlokalen, now also home to Micropia) and the Groote Museum of 1852–1855.

      Anyone can drag a chair to the edge of the flamingo pond. Along the park side a long fountain, the Watertafel (water table), runs in front of an aviary of meadow birds, with spoonbills. The square won the public prize of the Amsterdamse Architectuur Prijs in 2015.

      Behind the fence are three more buildings on this map, for those with a ticket: the elephant enclosure with its sunken bridge, the spider monkey house and Het Duivenhuis.
    nl: |
      Op deze hoek gaf Artis een stuk van de dierentuin aan de stad. In 2014 sloopte de dierentuin het Geologisch Museum en het flamingoverblijf en opende hier een plein buiten het hek. Landschapsarchitect Michael van Gessel legde een bakstenen 'tapijt' tussen twee monumenten: de Ledenlokalen, waar nu ook Micropia zit, en het Groote Museum uit 1852–1855.

      Iedereen kan een stoel naar de rand van de flamingovijver schuiven. Aan de parkkant loopt een lange fontein, de Watertafel, voor de Hollandse Polder langs, een volière met weidevogels en lepelaars. In 2015 kreeg het plein de publieksprijs van de Amsterdamse Architectuur Prijs.

      Achter het hek liggen nog drie gebouwen van deze kaart, voor wie een kaartje heeft: het olifantenverblijf met de verdiepte brug, het slingerapenverblijf en het Duivenhuis.
    next:
      directions: Walk north towards the IJ tunnel entrance on the Prins Hendrikkade.
      nl: Loop naar het noorden, richting de ingang van de IJtunnel aan de Prins Hendrikkade.
  - place: Foeliestraat 2-4
    narration: |
      From the Plantage to the edge of the old harbour, and a small building with a hard brief. Ronald Janssen Architecten fitted six flats above a commercial space (2020) onto a tight plot between a listed warehouse of the Dutch East India Company (VOC) and a housing block, right by the IJ tunnel, so the traffic is loud.

      The deep grid of grey-brown brick in front is a sound barrier; behind it the real façade is mostly glass, its aluminium frames placed exactly behind the brick piers. Then look at how it bows to its neighbour: a plinth takes up the sloping street and the height difference, the top floor slopes back, and the horizontal concrete beams echo those in the warehouse's gable on the Prins Hendrikkade.

      Remember the name Ronald Janssen: his office turns up again on Oostenburg.
    nl: |
      Van de Plantage naar de rand van de oude haven, en een klein gebouw met een lastige opgave. Ronald Janssen Architecten zette hier zes appartementen boven een bedrijfsruimte (2020), op een krappe kavel tussen een monumentaal pakhuis van de VOC en een woonblok, met de ingang van de IJtunnel om de hoek. Het verkeer maakt dus flink lawaai.

      Het diepe raster van grijsbruine baksteen voorop is een geluidsscherm; daarachter is de echte gevel grotendeels van glas, met aluminium kozijnen die precies achter de bakstenen penanten zitten. Kijk dan hoe het gebouw rekening houdt met de buurman: een sokkel vangt de hellende straat en het hoogteverschil op, de bovenste verdieping loopt schuin af, en de liggende betonbalken herhalen de balken in de kopgevel van het pakhuis aan de Prins Hendrikkade.

      Onthoud de naam Ronald Janssen: zijn bureau kom je op Oostenburg weer tegen.
  - place: Arcam's folded pavilion and the Museumhaven
    narration: |
      A few steps east, on the Oosterdok, Amsterdam's architecture centre lives in a building told to be modest. René van Zuuk had to build around Renzo Piano's lookout pavilion of 1996, keeping its floors and columns. The site set the rules: as unassuming as possible seen from the Scheepvaartmuseum, closed to the street, open to the water, and one single block. So it ducks down on the water side, and one skin of zinc-coated aluminium is folded over the roof down to the ground. It opened in 2003; inside is a timeline of Amsterdam from 2000 to 2030.

      In front lies the Museumhaven. In 1984 skippers of historic inland vessels moored here and, in their own words, squatted the eastern Oosterdok. More than twenty tjalks, barges and tugs of fifty years and older are lived in and sailed; you can't go aboard.
    nl: |
      Een paar stappen verder naar het oosten, aan het Oosterdok, zit het architectuurcentrum van Amsterdam in een gebouw dat bescheiden moest blijven. René van Zuuk moest om het uitkijkpaviljoen van Renzo Piano uit 1996 heen bouwen, met behoud van vloeren en kolommen. De plek stelde de eisen: vanaf het Scheepvaartmuseum zo bescheiden mogelijk, dicht naar de straat, open naar het water, en één compact blok. Daarom is het aan de waterkant lager en is één huid van verzinkt aluminium over het dak tot op de grond gevouwen. In 2003 ging het open; beneden ligt een tijdlijn van Amsterdam van 2000 tot 2030.

      Ervoor ligt de Museumhaven. In 1984 meerde een groep schippers met historische binnenvaartschepen hier aan en "kraakte", zoals ze het zelf zeggen, het oostelijk deel van het Oosterdok. Ruim twintig tjalken, klippers, motorschepen en sleepboten van vijftig jaar en ouder liggen er, bewoond en varend; aan boord gaan kan niet.
  - place: Het Scheepvaartmuseum and the ship Amsterdam
    narration: |
      This is the neighbour Arcam bows to: 's Lands Zeemagazijn, the Amsterdam Admiralty's naval storehouse. The first stone went in on 28 September 1655 and it was in use nine months later, as the line TOT GEBRVYCK GEBRAGT IN NEGEN MAENDEN in the blind windows of the north front still boasts. It burned out in 1791 and was rebuilt with render coloured like Bentheim sandstone.

      From 2007 Liesbeth van der Pol of Dok architecten spent four years letting the building speak again. The jetties that had grown round it were cleared, so it stands free in the water, and the only new materials are glass and metal. Over the courtyard, Laurent Ney's self-supporting roof of about 1,200 panes takes its lines from the compass roses and rhumb lines of old sea charts. At the jetty lies the replica of the VOC ship Amsterdam.
    nl: |
      Dit is de buurman voor wie Arcam bukt: 's Lands Zeemagazijn van de Admiraliteit van Amsterdam. Op 28 september 1655 werd de eerste steen gelegd en negen maanden later was het in gebruik, zoals TOT GEBRVYCK GEBRAGT IN NEGEN MAENDEN in de blinde vensters van de noordgevel nog meldt. In 1791 brandde het uit; bij de herbouw kregen de muren pleister in de kleur van Bentheimer zandsteen.

      Vanaf 2007 liet Liesbeth van der Pol van Dok architecten het zeemagazijn in vier jaar weer spreken. De steigers die tegen het gebouw waren gegroeid verdwenen, zodat het weer vrij in het water staat, en wat er nieuw bij kwam is alleen glas en metaal. Boven de binnenplaats ligt de zelfdragende kap van Laurent Ney, zo'n 1200 ruiten waarvan de lijnen zijn ontleend aan de windrozen en koerslijnen op oude zeekaarten. Aan de steiger ligt de replica van het VOC-schip Amsterdam.
    next:
      directions: Walk east to Oostenburg, the island where the VOC built its ships. The new block stands opposite the long brick Van Gendt halls.
      nl: Loop naar het oosten, naar Oostenburg, het eiland waar de VOC haar schepen bouwde. Het nieuwe blok staat tegenover de lange bakstenen Van Gendthallen.
  - place: Stadswerf Oostenburg
    narration: |
      From the Admiralty's storehouse to the VOC's yard. From the 17th century the VOC built its ships on Oostenburg, and on this spot stood its East India warehouse, more than 200 metres long, which collapsed in 1822. Then came the engine works of Werkspoor and later Stork, and the Van Gendt halls of 1894 across the street.

      Stadswerf Oostenburg (2022 and 2023) is by three firms: Paul de Ruiter Architects, Bastiaan Jongerius Architecten and, again, Ronald Janssen Architecten. They drew one sketch plan together and then shared out the buildings one by one rather than plot by plot, so the block would not look like one development; Arcam counts 32 buildings on nine plots. Walk along the Oostenburgermiddenstraat and spot the different hands. The streets are one kerbless "shipyard floor", with parking out of sight.
    nl: |
      Van het zeemagazijn van de Admiraliteit naar de werf van de VOC. Vanaf de zeventiende eeuw bouwde de VOC op Oostenburg haar schepen, en precies hier stond het Oost-Indisch Zeemagazijn, ruim 200 meter lang, dat in 1822 instortte. Daarna kwam de machinebouw, eerst van Werkspoor en later van Stork; de Van Gendthallen aan de overkant zijn uit 1894.

      Stadswerf Oostenburg (2022 en 2023) is van drie bureaus: Paul de Ruiter Architects, Bastiaan Jongerius Architecten en opnieuw Ronald Janssen Architecten. Ze tekenden eerst samen een schets en verdeelden daarna de panden één voor één, niet per kavel, om meer afwisseling te krijgen; volgens Arcam 32 panden op negen kavels. Loop door de Oostenburgermiddenstraat en zoek de verschillende handschriften. De openbare ruimte is één werfvloer zonder stoepranden, en de auto's staan uit het zicht.
  - place: De Gieter and De Slijper, Oostenburg
    narration: |
      Beside the Werkspoorhal, two housing blocks of 2023 by Space Encounters take their names from trades on the old works: De Gieter (the caster) and De Slijper (the grinder).

      They are deliberately unalike. De Gieter is clad in coarse green-grey concrete; its street front has three bays of windows that echo an Amsterdam canal house, and its roofline follows the shed roofs of the old works. De Slijper is low and horizontal, in glossy white tiles with blue joints and blue railings, a contrast to the old hall next door. Between them, a narrow raised volume for stairs and lifts is wrapped in see-through metal mesh.

      Compare with the block you just left: there, variety came from dealing out buildings among three firms; here, from one firm drawing two siblings that refuse to match.
    nl: |
      Naast de Werkspoorhal staan twee woongebouwen uit 2023 van Space Encounters, vernoemd naar het werk op de oude fabriek: De Gieter en De Slijper.

      Ze lijken bewust niet op elkaar. De Gieter heeft een huid van grofkorrelig, groengrijs beton; de straatgevel telt drie verticale raamstroken, een knipoog naar het Amsterdamse grachtenpand, en de daklijn volgt de sheddaken van de vroegere loodsen. De Slijper is laag en horizontaal, met glimmend witte tegels, blauwe voegen en blauwe hekken: een tegenhanger van de Werkspoorhal ernaast. Daartussen zit een smal, opgetild volume met trappen en liften, gehuld in doorzichtig metalen gaas.

      Vergelijk het met het blok van zonet. Daar kwam de afwisseling van drie bureaus die de panden verdeelden, hier van één bureau dat twee broers tekende die niet op elkaar willen lijken.
  - place: Houtrak, Oostenburg
    narration: |
      At the head of the Oostenburgervaart, on one of the last plots of Oostenburg, stands Houtrak (2025) by Marcel Lok_Architect and Workshop Architecten. The best view is from across the water.

      The six-storey block on the canal is clad in azobé wood. The planks stood as sheet piling in the Markkanaal between Oosterhout and Breda until Rijkswaterstaat replaced it; here they got a second life on the façade and in the solid balconies that cantilever deep over the water. Behind it, a four-storey block has shed roofs and black-brown metal cassettes. Both stand on a frame of timber columns and concrete floor slabs, quick to build and easy to rearrange later.

      After the concrete and tiles of the last stop, a building of reused wood.
    nl: |
      Aan de kop van de Oostenburgervaart, op een van de laatste kavels van Oostenburg, staat Houtrak (2025) van Marcel Lok_Architect en Workshop Architecten. Je ziet het het best vanaf de overkant van het water.

      Het pand van zes lagen aan de vaart is bekleed met azobéhout. De planken stonden als damwand in het Markkanaal tussen Oosterhout en Breda, tot Rijkswaterstaat die oeverconstructie verving; nu zitten ze op de gevel en in de massieve balkons die ver boven het water uitsteken. Het achterste pand telt vier lagen, met sheddaken en zwartbruine metalen gevelcassettes. Beide staan op een casco van houten kolommen en betonnen vloerplaten: snel gebouwd en later makkelijk anders in te delen.

      Na het beton en de tegels van de vorige stop een gebouw van hergebruikt hout.
    next:
      directions: Walk south to the start of the Czaar Peterstraat.
      nl: Loop naar het zuiden, naar het begin van de Czaar Peterstraat.
  - place: De Keyzer
    narration: |
      Here new housing took the opposite approach to Oostenburg's variety. For more than a hundred years the start of the Czaar Peterstraat and the Blankenstraat was lined by the 19th-century Dubbeltjespanden. Tom Frantzen's block for the housing association De Key replaced them in 2011 and keeps exactly to their building lines, so it reads as one traditional city block, about 130 metres long.

      Frantzen took his cue from the 19th-century streets around it: red brick, set in large prefabricated brick-and-concrete panels, and a steady rhythm of bays along the Czaar Peterstraat that divide the roof terraces from each other. Large windows between deep piers open up the heavy block. Inside are 68 flats, 14 homes run by the care provider Amsta and a care centre. It won the Zuiderkerkprijs 2011 for the best new housing in Amsterdam.
    nl: |
      Hier koos de nieuwbouw het omgekeerde van de afwisseling op Oostenburg. Meer dan honderd jaar stonden aan het begin van de Czaar Peterstraat en de Blankenstraat de negentiende-eeuwse Dubbeltjespanden. Het blok van Tom Frantzen voor woningcorporatie De Key kwam er in 2011 voor in de plaats en houdt zich exact aan hun rooilijnen, zodat het leest als één klassiek Amsterdams bouwblok van zo'n 130 meter.

      Frantzen keek naar de negentiende-eeuwse straten eromheen: rode baksteen, verwerkt in grote geprefabriceerde elementen van baksteen en beton, en een vast ritme van erkers langs de Czaar Peterstraat die de dakterrassen van elkaar scheiden. Grote ramen tussen diepe penanten maken het zware blok open. Er zitten 68 huurappartementen in, 14 woningen van zorgaanbieder Amsta en een dienstencentrum. In 2011 won het de Zuiderkerkprijs voor het beste nieuwe woongebouw van Amsterdam.
  - place: Het Funen, a car-free quarter on top of the last bastion
    narration: |
      Amsterdam's wall of 1663 had 26 bastions. Zeeburg, guarding the IJ, was the last to go, sold for demolition in 1877. Then trains shunted here, the carrier Van Gend & Loos had a goods yard, and after that the site lay empty for a long time.

      Frits van Dongen's plan of 2000 wraps the south and east sides in a long block with glass scales that keeps out the noise of the trains. Behind it stand sixteen blocks of homes by nine architects, each different, around shared space with no cars; the model was the old hofjes, the almshouse courtyards. The variety earned it the nickname "Hidden Delights", after a box of chocolates. Look down at the paths: under one of Gabriel Lester's sculptures, Tussentijd, you can see the walls of the bastion, the most intact one left underground.
    nl: |
      De Amsterdamse stadsmuur van 1663 had 26 bolwerken. Zeeburg, dat het IJ bewaakte, bleef het langst liggen, tot het in 1877 voor afbraak werd verkocht. Daarna rangeerden hier treinen, had vervoerder Van Gend & Loos er een overslagterrein, en volgde een lange tijd van leegstand.

      Het plan van Frits van Dongen uit 2000 legt aan de zuid- en oostkant een lang gebouw met glazen schubben tegen het lawaai van de treinen. Daarachter staan zestien woonblokken van negen architecten, allemaal anders, rond gedeelde ruimte zonder auto's; de oude hofjes waren het voorbeeld. Die verscheidenheid leverde de bijnaam "Hidden Delights" op, naar een doos bonbons. Kijk naar de paden: onder een van de beelden Tussentijd van Gabriel Lester zie je de muren van het bolwerk, het meest intacte dat nog onder de grond ligt.
  - place: Verdana (Funen Blok K)
    narration: |
      End at the last block of the Funen to be finished, NL Architects' Verdana of 2009: ten houses, each with exactly the same volume, 633 cubic metres.

      The architects turned the central lane so it runs diagonally through the block, which gave every house a different footprint and opened a shortcut. To keep the volumes equal, the short houses grew taller and the long ones lower, from one and a half to four storeys. That produced the rolling roof of moss and sedum, with terraces poking out at seemingly random spots. Front doors and storage sit on the inner lane, so the fronts facing the park could be largely glass; look for the gold-coloured window frames.

      In 2011 the public voted Verdana the best new building in the city, against the experts' taste.
    nl: |
      Je eindigt bij het laatst opgeleverde blok van het Funen, Verdana van NL Architects uit 2009: tien huizen, elk precies even groot, 633 kubieke meter.

      De architecten draaiden het binnensteegje een stukje, zodat het diagonaal door het blok loopt. Zo kreeg elke woning een andere plattegrond en ontstond er een doorsteek. Om de inhoud gelijk te houden werden de korte huizen hoger en de lange lager, van anderhalve tot vier lagen. Dat leverde het golvende dak op, begroeid met mos en sedum, met dakterrassen die schijnbaar willekeurig naar buiten steken. Voordeuren en bergingen liggen aan het steegje, dus de gevels naar het park konden grotendeels van glas zijn; let op de goudkleurige kozijnen.

      In 2011 koos het publiek Verdana tot beste nieuwbouw van de stad, tegen de smaak van de deskundigen in.
