title: 'Eastern Docklands to IJburg: from the emigrant hotel to the self-built island'
summary: >-
  A ride east across the water, from a 1921 emigrant hotel through West 8's Sporenburg, over
  Grimshaw's bridge to IJburg's floating houses, the zinc Jonas and the white prow of De Witte Kaap,
  ending among the blocks Centrumeiland's residents built for themselves.
body: |
  **Start:** the Lloyd Hotel on the Oostelijke Handelskade, a few minutes' walk from the Rietlandpark stop of tram 26.
  **End:** Bakstayn on Centrumeiland, right by the Centrumeiland stop of tram 26, which takes you back to Centraal Station.
  **Distance and time:** about 10 km, under an hour of riding. Allow 2.5 to 3 hours with stops, more if you go inside.

  The route is flat. Tram 26 runs alongside much of it, with a stop at Steigereiland by the Sluishuis, so you can shorten it. The Python Bridge is for pedestrians only, with steps: leave your bike at its foot and climb it on foot. What you can go into: the public parts of the Lloyd (now the hotel The Hoxton, Lloyd Amsterdam); the public jetties of Waterbuurt West (these are people's homes, so walk quietly); Vrijburcht's café and theatre; and the ground floor and the timber "canyon" of Jonas, both open to the public. The Sluishuis roof walk is open on at least eighty days a year, not every day, so check before you go. Everything else is private housing, seen from the street.

  The theme is how Amsterdam builds on water. In the 1990s West 8 filled the old harbour peninsulas with a "sea" of low houses and a few huge blocks; from 1999 the city raised new islands out of the IJmeer for IJburg, after a referendum in which the no side won but fell short of the votes needed to stop it. Along the way the same ideas keep coming back: blocks lifted off the ground for light and views, buildings that borrow from ships, and, at the end, residents who skip the developer and build their own homes together.

  If you would rather ride on than take the tram, the Nesciobrug (also on this map) links IJburg and the Diemerpark with the Watergraafsmeer, Science Park and Diemen, where the ride "From the Wibautstraat to Science Park and Diemen" ends.
mode: bike
nl:
  title: 'Van het Oostelijk Havengebied naar IJburg: van landverhuizershotel tot zelfbouweiland'
  summary: >-
    Oostwaarts over het water: van een landverhuizershotel uit 1921 door het Sporenburg van West 8,
    over de brug van Grimshaw naar de drijvende huizen van IJburg, Jonas en De Witte Kaap, tot de
    blokken die bewoners op Centrumeiland zelf bouwden.
  body: |
    **Start:** het Lloyd Hotel aan de Oostelijke Handelskade, een paar minuten lopen van tramhalte Rietlandpark (lijn 26).
    **Eind:** Bakstayn op Centrumeiland, vlak bij halte Centrumeiland van tram 26, die je terugbrengt naar Centraal Station.
    **Afstand en duur:** zo'n 10 kilometer, nog geen uur fietsen. Met stops ben je 2,5 tot 3 uur onderweg, langer als je ergens naar binnen gaat.

    De route is vlak. Tram 26 rijdt een groot deel mee, met een halte Steigereiland bij het Sluishuis, dus inkorten kan. De Pythonbrug is alleen voor voetgangers en heeft treden: zet je fiets aan de voet en loop omhoog. Naar binnen kun je in de openbare delen van het Lloyd (nu het hotel The Hoxton, Lloyd Amsterdam), op de openbare steigers van Waterbuurt West (het blijven iemands huizen, dus loop er rustig), in het café en het theater van Vrijburcht, en op de begane grond en in de houten 'canyon' van Jonas, die openbaar zijn. De dakwandeling over het Sluishuis is minstens tachtig dagen per jaar open, niet elke dag; kijk dat dus van tevoren na. De rest zijn woningen, te bekijken vanaf de straat.

    Het thema is bouwen op en aan het water. In de jaren negentig vulde West 8 de oude havenschiereilanden met een 'zee' van laagbouw en een paar enorme blokken. Vanaf 1999 spoot de stad in het IJmeer nieuwe eilanden op voor IJburg, na een referendum dat een meerderheid tegen had maar te weinig stemmen om het plan tegen te houden. Onderweg komen steeds dezelfde ideeën terug: blokken die van de grond worden getild voor licht en zicht, gebouwen die leentjebuur spelen bij de scheepsbouw, en aan het eind bewoners die de projectontwikkelaar overslaan en samen hun eigen huis bouwen.

    Wil je liever doorfietsen dan de tram nemen: de Nesciobrug (ook op deze kaart) verbindt IJburg en het Diemerpark met de Watergraafsmeer, Science Park en Diemen, waar de fietstocht 'Van de Wibautstraat naar Science Park en Diemen' eindigt.
stops:
  - place: Lloyd Hotel and the Lloyd complex
    narration: |
      Start with the oldest building on the ride and the reason it is on a map of new architecture. Evert Breman's brick hotel of 1921 was a waiting room for emigrants to South America, many of them Jews who had fled pogroms in Eastern Europe, deloused in the building behind before they got a bed. It later held refugees, then prisoners, then artists.

      In 2004 it became a hotel again. MVRDV kept Breman's front, with its decorative brickwork, leaded windows and little octagonal tower, and worked inside: floors were taken out in the middle to make voids that let the daylight in. Since 2023 it has been The Hoxton, and you can walk into the lobby, restaurant and bar.

      Keep this brick in mind. The ride ends among new blocks on Centrumeiland, one of which looks back to the same era of Amsterdam brick.
    nl: |
      We beginnen bij het oudste gebouw van de tocht, en meteen bij de vraag waarom het op een kaart met nieuwe architectuur staat. Het bakstenen hotel van Evert Breman uit 1921 was een wachtkamer voor landverhuizers naar Zuid-Amerika, veel van hen Joden op de vlucht voor pogroms in Oost-Europa, die eerst in het gebouw erachter werden ontluisd voor ze een bed kregen. Later zaten er vluchtelingen, gevangenen en kunstenaars.

      In 2004 werd het weer een hotel. MVRDV liet de gevel van Breman staan, met het siermetselwerk, het glas-in-lood en het achtkantige torentje, en werkte vooral binnen: midden in het gebouw verdwenen vloeren, en de vides brachten daglicht naar binnen. Sinds 2023 is het The Hoxton; lobby, restaurant en bar kun je zo in.

      Onthoud die baksteen. De tocht eindigt bij nieuwe blokken op Centrumeiland, waarvan er een teruggrijpt op dezelfde Amsterdamse baksteentraditie.
  - place: The Whale (Sporenburg)
    narration: |
      From the Lloyd you cross onto Sporenburg, a former railway and harbour peninsula that West 8 (Adriaan Geuze) replanned in the 1990s. The city wanted 100 homes per hectare, the developers wanted family houses, so Geuze laid out a "sea" of low-rise and dropped a few huge blocks into it, the "meteorites". This is one, by Frits van Dongen of de Architekten Cie., finished in 2000, with 214 flats.

      Stand underneath. Van Dongen lifted the zinc block off the ground and folded the roof to follow the sun, so the lowest flats get light and you can see into the courtyard from the street. Note the lifted belly: the Sluishuis, later on the ride, plays the same trick with one corner.

      The name? Amsterdam already had a De Walvis, so it became The Whale.
    nl: |
      Vanaf het Lloyd kom je op Sporenburg, een oud spoor- en havenschiereiland dat West 8 (Adriaan Geuze) in de jaren negentig opnieuw ontwierp. De stad eiste 100 woningen per hectare, de ontwikkelaars wilden eengezinshuizen. Geuze tekende daarom een 'zee' van laagbouw en liet er een paar enorme blokken in neerploffen, de 'meteorieten'. Dit is er een, van Frits van Dongen van de Architekten Cie., in 2000 klaar, met 214 woningen.

      Ga er even onder staan. Van Dongen tilde het zinken blok van de grond en liet het dak meeknikken met de baan van de zon, zodat ook de laagste woningen zon krijgen en je vanaf de straat de binnentuin in kijkt. Let op die opgetilde onderkant: het Sluishuis, verderop, doet met één hoek iets vergelijkbaars.

      De Walvis mocht het niet heten, die naam was in Amsterdam al vergeven. Dus werd het The Whale.
  - place: Python Bridge (Hoge brug)
    narration: |
      West 8 again, this time as bridge designers. Geuze's red footbridge of 2001 writhes over the Spoorwegbassin between Sporenburg and Borneo and climbs to 9.5 metres so boats can pass under it. It is for pedestrians only, with steps, so lock your bike at the foot on the Panamakade and walk up.

      From the top you look along the basin and over the narrow canal houses of Borneo, the low-rise "sea" you have just ridden through. Look at the railings, which lean in, out and in again, and the lamps, meant as long-legged birds perched on the rail.

      After this the ride leaves the old harbour behind: the next stops are on islands that did not exist when this bridge opened, or were only just being made.
    nl: |
      Weer West 8, nu als bruggenbouwer. De felrode voetbrug van Geuze uit 2001 kronkelt over het Spoorwegbassin tussen Sporenburg en Borneo en klimt tot 9,5 meter, zodat er boten onderdoor kunnen. Hij is alleen voor voetgangers en heeft treden: zet je fiets vast aan de voet op de Panamakade en loop omhoog.

      Bovenop kijk je over het bassin en de smalle grachtenhuizen van Borneo, de 'zee' van laagbouw waar je net doorheen fietste. Kijk naar de leuningen, die naar binnen, naar buiten en weer naar binnen hellen, en naar de lantaarns, die als langpotige vogels op de reling staan.

      Hierna laat de route de oude haven achter. De volgende stops liggen op eilanden die er nog niet waren toen deze brug openging, of net werden opgespoten.
  - place: Smiley
    narration: |
      On Zeeburgereiland, by the Piet Hein tunnel, Studioninedots built 364 student flats in one curving block of 134 metres, finished in 2016. It is the Whale's problem again, daylight, solved another way. The master plan put the shared garden on the north side, away from the road; the architects found it too dark and moved it up onto the roof, as stepped terraces in the sun on the south side. The stepped block also shields the homes behind it from traffic noise.

      Read the front from end to end: the brick piers widen towards the middle and the windows towards the ends, so the long façade falls into three parts. According to the architects, that play of piers and windows is what makes the building smile. It is student housing, so look from the street.
    nl: |
      Op het Zeeburgereiland, vlak bij de Piet Heintunnel, zette Studioninedots 364 studentenwoningen neer in één gebogen blok van 134 meter, klaar in 2016. Het probleem van The Whale komt terug, daglicht, met een andere oplossing. In het stedenbouwkundig plan lag de gezamenlijke tuin aan de noordkant, weg van de weg; de architecten vonden dat te donker en legden de buitenruimte op het dak, als getrapte terrassen aan de zonnige zuidkant. Het getrapte volume houdt bovendien het verkeerslawaai weg bij de woningen erachter.

      Lees de gevel van kop tot staart: de bakstenen penanten worden naar het midden toe breder, de ramen naar de uiteinden toe, zodat de lange gevel in drieën uiteenvalt. Door dat spel met penanten en ramen gaat het gebouw volgens de architecten glimlachen. Het zijn studentenwoningen, dus kijken doe je vanaf de straat.
  - place: Enneüs Heermabrug
    narration: |
      This is IJburg's front door, and you ride over it with the tram. Nicholas Grimshaw's white steel bridge opened in 2001: two arches of 75 metres joined by a 30-metre counter-arch that dips between them. Amsterdammers saw a bra in it and call it the beha-brug.

      On the cycle path, look down: the deck is split in two with a gap between, so you feel the water as you cross. From the top, look ahead. The islands in front of you were raised from the IJmeer from 1999, after a 1997 referendum in which about 133,000 people voted against and 93,000 for; the no votes fell short of the 155,000 needed, so building went ahead.

      From the bridge you can already see the lifted corner of the Sluishuis, the next stop; this is the best place to see it.
    nl: |
      Dit is de voordeur van IJburg, en je fietst er samen met de tram overheen. De witte stalen brug van Nicholas Grimshaw ging in 2001 open: twee bogen van 75 meter met daartussen een tegenboog van 30 meter die naar beneden hangt. Amsterdam zag er een beha in en noemt hem de behabrug.

      Kijk op het fietspad naar beneden: het dek is in tweeën gedeeld met een kier ertussen, zodat je het water voelt. Kijk vanaf het hoogste punt vooruit. De eilanden voor je werden vanaf 1999 opgespoten in het IJmeer, na een referendum in 1997 waarin zo'n 133.000 Amsterdammers tegen stemden en 93.000 voor. Voor het afschieten van het plan waren 155.000 tegenstemmen nodig, dus het ging door.

      Vanaf de brug zie je al de opgetilde hoek van het Sluishuis, de volgende stop; van hieruit zie je hem het mooist.
  - place: Sluishuis
    narration: |
      BIG (Bjarke Ingels) and Barcode Architects won the 2016 competition for a landmark at the entrance to Steigereiland, and finished it in 2022: a closed square block standing in the water with its facades sliced off at an angle. One corner is pulled up high, so the courtyard opens to the IJ and boats can moor "inside" the building. It is the Whale's lifted belly taken to the scale of a whole block.

      Ride round to the Steigereiland side, where the block steps down in terraces. Two stairs climb past the residents' terraces to a walkway on the roof. The owners' association controls them, but the city stipulated that they be open to the public on at least eighty days a year: a public route, but a rationed one.

      Opposite lies Marlies Rohmer's housing, the next stop.
    nl: |
      BIG (Bjarke Ingels) en Barcode Architects wonnen in 2016 de prijsvraag voor een beeldbepalend gebouw bij de entree van het Steigereiland; in 2022 was het klaar. Het is een dicht, vierkant blok in het water, met schuin afgesneden gevels. Eén hoek is hoog opgetrokken, zodat de binnenplaats openligt naar het IJ en boten 'in' het gebouw aanleggen. De opgetilde onderkant van The Whale, maar dan op de schaal van een heel bouwblok.

      Fiets om naar de kant van het Steigereiland, waar het blok in terrassen afloopt. Twee trappen klimmen langs de terrassen van de bewoners naar een pad over het dak. De VvE gaat over de toegang, maar de gemeente heeft vastgelegd dat iedereen minstens tachtig dagen per jaar naar boven mag. Openbaar dus, maar op rantsoen.

      Tegenover liggen de woningen van Marlies Rohmer, de volgende stop.
  - place: Waterbuurt West, the floating neighbourhood
    narration: |
      Here the water is the street. Marlies Rohmer's Waterbuurt West, finished in 2010, has 75 water homes: 55 floating houses and three taller pile dwellings along four jetties, and 17 dike houses hanging partly over the water from the Haringbuisdijk. The houses were built at a dockyard and floated here. Each sits on a concrete tub, half under water, that holds the bedrooms, and slides up and down its mooring posts with the water.

      The jetties are car-free and deliberately public, so that this would not become a gated enclave. Walk one, quietly, and look at the strip of water between each house and its jetty. Packed this close, the density is compared to the Jordaan's.

      From the island's waterfront, the ride now turns inland to a block built by its own residents.
    nl: |
      Hier is het water de straat. Waterbuurt West van Marlies Rohmer, in 2010 opgeleverd, telt 75 waterwoningen: 55 drijvende huizen en drie hogere paalwoningen aan vier steigers, en 17 dijkwoningen die vanaf de Haringbuisdijk deels boven het water hangen. De huizen zijn op een werf gebouwd en hierheen gevaren. Elk huis staat op een betonnen bak die half onder water ligt, met daarin de slaapkamers, en schuift met het water mee langs zijn meerpalen.

      De steigers zijn autovrij en met opzet openbaar, zodat dit geen afgesloten enclave zou worden. Loop er rustig een op en kijk naar de strook water tussen elk huis en zijn steiger. Met zoveel huizen op een kluitje wordt de dichtheid vergeleken met die van de Jordaan.

      Vanaf de waterkant buigt de route nu het eiland in, naar een blok dat de bewoners zelf neerzetten.
  - place: Vrijburcht and its fish wall
    narration: |
      In 2000 a group of future IJburgers decided to build their own block, without a developer, as a collective private commission (CPO). Their architect, Hein de Haan of CASA architecten, was one of them. Vrijburcht opened in 2007: 52 homes, studios, a café-restaurant, a 50-seat theatre run by volunteers, a crèche, a greenhouse and a small harbour, round a shared garden.

      Look at the theatre's corner wall: Suzanne Willems hung 274 aluminium fish there, each reflecting its own colour, drying side by side like a Zuiderzee catch on land where fish swam not long ago. Across the quay sits her folded paper boat, covered in hand-modelled shells, snails and little crustaceans.

      Remember the word CPO. At the end of the ride, on Centrumeiland, a new generation of residents is doing the same thing.
    nl: |
      In 2000 besloot een groep toekomstige IJburgers hun eigen blok te bouwen, zonder projectontwikkelaar, in collectief particulier opdrachtgeverschap (CPO). Hun architect, Hein de Haan van CASA architecten, woonde zelf mee. In 2007 ging Vrijburcht open: 52 woningen, ateliers, een café-restaurant, een theater van 50 stoelen dat vrijwilligers draaiende houden, een crèche, een kas en een eigen haventje, rond een gezamenlijke tuin.

      Kijk naar de hoekgevel van het theater. Suzanne Willems hing er 274 aluminium vissen op, elk met een eigen weerkaatsende kleur, naast elkaar te drogen als Zuiderzeevangst, op een plek waar kort geleden nog vis zwom. Op de kade tegenover ligt haar papieren bootje, vol geboetseerde schelpen en kreeftjes.

      Onthoud dat woord CPO. Aan het eind van de tocht, op Centrumeiland, doet een nieuwe lichting bewoners precies hetzelfde.
    next:
      directions: Ride east across Haveneiland to the head of the IJburg harbour.
      nl: Fiets oostwaarts over het Haveneiland naar de kop van de haven van IJburg.
  - place: Jonas
    narration: |
      After The Whale, Jonah. Orange Architects named this zinc block of 2022, on the headland of the IJburg harbour, after Jonah, sheltering inside the whale. Like Van Dongen's block it is clad in dark zinc and lifted off the ground, but here the windows seem to wander across the skin.

      The structure is borrowed from wooden shipbuilding: a row of trusses like a ship's frames, with the homes packed into the outer layer. That leaves the middle free for a "canyon", a widened central corridor lined in timber that brings daylight deep inside, with a patio of three mature trees. The canyon and the ground floor are open to the public, so go in.

      The BNA named it Best Building of the Year 2023. Next, another building that thinks it is a ship.
    nl: |
      Na The Whale komt Jonas. Orange Architects noemde dit zinken blok uit 2022, op de kop van de haven van IJburg, naar Jonas in de buik van de walvis. Net als het blok van Van Dongen is het bekleed met donker zink en raakt het de grond niet, maar hier lijken de ramen over de gevel te golven.

      De constructie is afgekeken van de houten scheepsbouw: een rij spanten als het geraamte van een schip, met de woningen in de huid. Zo bleef het midden vrij voor de 'canyon', een opgerekte middengang vol hout die daglicht diep naar binnen haalt, met daarnaast het Bos, een patio met drie grote bomen. De canyon en de begane grond zijn openbaar: ga naar binnen.

      De BNA riep Jonas uit tot Beste Gebouw van het Jaar 2023. Hierna nog een gebouw dat denkt dat het een schip is.
  - place: De Witte Kaap
    narration: |
      IJburg is mostly brick and right angles. At the north-east tip of Haveneiland, Claus en Kaan Architecten built the opposite in 2010: a painted white block of 134 homes that follows its wedge-shaped plot to a long, rounded point aimed at the water. With its rows of identical windows and stacked "decks", the comparison with a moored cruise ship is hard to avoid. The architects named Michel de Klerk's Het Schip among their inspirations.

      See the prow head-on from the corner of the quay, then look out over the IJmeer. Opinions were mixed: in Het Parool, Ronald Hooft called it the handsomest block in a rather monotonous IJburg, while the Zuiderkerkprijs jury in 2011 praised the outside but found the inside cramped.

      Across the water lies Centrumeiland, the last island on the ride.
    nl: |
      IJburg is vooral baksteen en rechte hoeken. Op de noordoostpunt van het Haveneiland zetten Claus en Kaan Architecten er in 2010 precies het omgekeerde neer: een wit geschilderd blok met 134 woningen dat de wig van de kavel volgt tot een lange, ronde punt richting het water. Met de rijen gelijke ramen en de gestapelde 'dekken' is de vergelijking met een aangemeerd cruiseschip snel gemaakt. Als inspiratie noemden de architecten onder meer Het Schip van Michel de Klerk.

      Bekijk de boeg recht van voren vanaf de hoek van de kade en kijk dan uit over het IJmeer. De meningen liepen uiteen: Ronald Hooft vond het in Het Parool het mooiste blok van een verder nogal eentonig IJburg, de jury van de Zuiderkerkprijs prees in 2011 de buitenkant maar vond het binnen benauwd.

      Aan de overkant ligt Centrumeiland, het laatste eiland van de tocht.
  - place: De Warren, Amsterdam's first housing co-op
    narration: |
      Centrumeiland is where most homes are built by their own residents, and De Warren goes furthest. In a housing cooperative the residents own the building together and in effect rent from themselves, without profit. A group of Amsterdammers won the city's pilot tender in 2018, and De Warren became the first self-built housing cooperative in the city to be finished, opening in April 2023: 36 social and mid-rent homes, with 30 percent of the floor space shared, from a dance hall to a workshop.

      Look at the facade. Natrufied Architecture clad it in reused wood from old mooring posts and sheet piling, so the waterfront you have ridden along all day ends up on the walls, and planted it with shrubs, climbers and trees. It is the residents' home: look from the street.
    nl: |
      Op Centrumeiland bouwen de meeste bewoners hun eigen huis, en De Warren gaat het verst. In een wooncoöperatie bezitten de bewoners het gebouw samen en huren ze in feite van zichzelf, zonder winst. Een groep Amsterdammers won in 2018 de tender voor de proef van de gemeente, en De Warren werd de eerste zelfgebouwde wooncoöperatie van de stad die ook echt af kwam. In april 2023 ging het open: 36 sociale en middeldure huurwoningen, en 30 procent van de vloer gedeeld, van danszaal tot klusruimte.

      Kijk naar de gevel. Natrufied Architecture bekleedde die met hergebruikt hout van oude meerpalen en damwanden, zodat de waterkant waar je de hele dag langs fietste op de muren terechtkomt, en liet er struiken, klimplanten en bomen op groeien. Het is het huis van de bewoners: bekijk het vanaf de straat.
  - place: CPO Srefi Bow
    narration: |
      Here is Vrijburcht's idea at the scale of eight households. As a collective private commission they designed this block with JoustraReid Architecten and lab03 architecten from the first sketches; the shell was handed over in 2023 and the residents finished their own homes.

      Apart from the basement and the lift shaft it is all timber, like De Warren, but the street front is brick. Look closely: the bricks are stacked dry, without mortar, so they can be taken down and used again. A balcony runs across the whole front, with a metal grid in front of it for climbing plants.

      It was nominated for the Amsterdamse Architectuur Prijs 2025. Private homes, seen from the square; the last stop is a few steps on.
    nl: |
      Hier zie je het idee van Vrijburcht op de schaal van acht huishoudens. Als collectief particulier opdrachtgever ontwierpen ze dit blok vanaf de eerste schetsen met JoustraReid Architecten en lab03 architecten. In 2023 werd het casco opgeleverd en bouwden de bewoners hun woning zelf af.

      Behalve de kelder en de liftschacht is alles van hout, net als bij De Warren, maar de straatgevel is van baksteen. Kijk goed: de stenen zijn zonder mortel gestapeld, zodat ze later los kunnen en opnieuw te gebruiken zijn. Over de hele breedte loopt een balkon, met een metalen raster ervoor waar planten tegenop moeten groeien.

      Het was genomineerd voor de Amsterdamse Architectuurprijs 2025. Particuliere woningen, te zien vanaf het plein; de laatste stop is een paar stappen verder.
  - place: Bakstayn
    narration: |
      The ride ends where it began: with red brick. Five households started Bakstayn on a self-build plot here and designed it with Time to Access; it was finished in August 2025, with 18 homes for residents aged 25 to 71. They wanted red brick as a homage to the Amsterdam School, and got a plinth, a middle and a crown, brick alternating with concrete, green glazed tiles at the top and wooden window frames whose different sizes give away the different flats behind them.

      Look for the three small gates in the street front; they lead to a shared garden with a pond and a sauna (private). From a shipping company's quarter built over a century ago to a block whose residents are their own developer, that is the arc of the ride. Tram 26 leaves from the Centrumeiland stop close by.
    nl: |
      De tocht eindigt zoals hij begon: met rode baksteen. Vijf huishoudens begonnen Bakstayn op een zelfbouwkavel hier en ontwierpen het met Time to Access. In augustus 2025 was het klaar, met 18 woningen voor bewoners van 25 tot 71. Ze wilden rode baksteen als eerbetoon aan de Amsterdamse School, en kregen een plint, een middendeel en een kroon, baksteen afgewisseld met beton, groen geglazuurde tegels bovenin en houten kozijnen in allerlei maten, die verraden dat er achter elk raam een andere woning zit.

      Zoek de drie poortjes in de straatgevel; ze leiden naar een gedeelde tuin met vijver en sauna (privé). Van de bedrijfswijk van een rederij, ruim een eeuw geleden, naar een blok waarvan de bewoners hun eigen ontwikkelaar zijn: dat is de boog van deze tocht. Tram 26 vertrekt vlakbij, van halte Centrumeiland.
