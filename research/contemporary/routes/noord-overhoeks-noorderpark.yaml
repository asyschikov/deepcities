title: 'Noord by bike: Overhoeks, the metro and the Noorderpark'
summary: >-
  Ride from the ferry through Overhoeks, Shell's old land turned into a district of towers, to a
  renovated garden village, the two open-air stations of the Noord/Zuidlijn and the Noorderpark,
  with three new schools and a church turned social market on the way.
body: |
  **Start:** the ferry piers behind Centraal Station. The free GVB ferry F3 takes you and your bike to Buiksloterweg, right by Eye.
  **End:** Metro station Noord on the Nieuwe Leeuwarderweg, with the metro back to the centre.
  **Distance and time:** about 10.5 km, some 50 minutes of riding. Allow about 3 hours with stops, more if you go into Eye or up the A'DAM Lookout.

  Several stops let you in. Eye's bar-restaurant is open daily; films and exhibitions need a ticket. The A'DAM Lookout on top of the tower is paid, and its swing costs extra. The Noorderparkbad is a public pool. The Noorderparkkamer in the park is let as a café, open at set times. De Ark is a social market for its visitors three days a week, and its hall also hosts events. The halls of both metro stations are public; the platforms are behind the ticket gates. The three schools and all the housing are seen from outside.

  Until 2009 much of the bank where you land was Shell's: its laboratory tower of 1971 still stands, remade as the A'DAM Toren. The rest became Overhoeks, a district of towers facing the IJ, where social housing for the corporation Ymere holds its own between the luxury blocks. Further in, a 1920s garden village built for a shipping company has been renovated for the same landlord. In 2018 the Noord/Zuidlijn metro opened; its two open-air stations bracket the Noorderpark, with a travelled Swiss pavilion and an award-winning pool. On the way three schools show three ways of building for children: stacked up, put together from lorry-sized boxes, and built round movable walls.
mode: bike
nl:
  title: 'Noord op de fiets: Overhoeks, de metro en het Noorderpark'
  summary: >-
    Van de pont door Overhoeks, het oude Shell-terrein dat een wijk van torens werd, naar een
    gerenoveerd tuindorp, de twee bovengrondse stations van de Noord/Zuidlijn en het Noorderpark,
    met onderweg drie nieuwe scholen en een kerk die sociale markt werd.
  body: |
    **Start:** de pontsteigers achter Centraal Station. De gratis GVB-pont F3 brengt je met fiets en al naar Buiksloterweg, vlak bij Eye.
    **Eind:** metrostation Noord aan de Nieuwe Leeuwarderweg, met de metro terug naar de stad.
    **Afstand en duur:** ongeveer 10,5 kilometer, zo'n 50 minuten fietsen. Met stops ongeveer drie uur, langer als je Eye in gaat of de A'DAM Lookout op.

    Op een aantal plekken kun je naar binnen. Het bar-restaurant van Eye is elke dag open; voor films en tentoonstellingen koop je een kaartje. De A'DAM Lookout boven in de toren kost entree, de schommel komt erbij. Het Noorderparkbad is een openbaar zwembad. De Noorderparkkamer in het park wordt verhuurd als café en is op vaste momenten open. De Ark is drie dagen per week een sociale markt voor haar bezoekers, en in de zaal zijn ook activiteiten. De hallen van beide metrostations zijn openbaar, de perrons liggen achter de poortjes. De drie scholen en alle woningen bekijk je van buiten.

    Tot 2009 was een groot deel van de oever waar je aankomt van Shell. De laboratoriumtoren uit 1971 staat er nog, omgebouwd tot A'DAM Toren. De rest werd Overhoeks, een wijk van torens aan het IJ, waar sociale huur van Ymere zich staande houdt tussen de luxe blokken. Verderop is een tuindorp uit de jaren twintig, gebouwd voor een rederij, voor dezelfde verhuurder gerenoveerd. In 2018 ging de Noord/Zuidlijn open; de twee bovengrondse stations liggen aan weerszijden van het Noorderpark, met een Zwitsers paviljoen dat een hele reis maakte en een bekroond zwembad. Onderweg laten drie scholen drie manieren zien om voor kinderen te bouwen: gestapeld, in elkaar gezet uit dozen op vrachtwagenmaat, en rond verschuifbare wanden.
stops:
  - name: Centraal Station, ferry pier
    lat: 52.38095
    lng: 4.89968
    narration: |
      Wheel your bike onto the free F3 ferry to Buiksloterweg, a crossing of a few minutes. From the deck you see the first two stops side by side on the far bank: the white, angular Eye Filmmuseum at the water's edge and, behind it, the A'DAM Toren with its white crown turned crosswise. Both stand on land that belonged to Shell, which the rest of the first half of the ride explores.
    nl: |
      Rij je fiets de gratis pont F3 naar Buiksloterweg op, een paar minuten varen. Vanaf het dek zie je de eerste twee stops naast elkaar aan de overkant: het witte, hoekige Eye Filmmuseum aan het water en daarachter de A'DAM Toren met zijn dwars gedraaide witte kroon. Allebei staan ze op grond die van Shell was, en daar gaat de eerste helft van de rit over.
    next:
      mode: ferry
      directions: Free GVB ferry F3 to Buiksloterweg.
      nl: Neem de gratis GVB-pont F3 naar Buiksloterweg.
  - place: Eye Filmmuseum
    narration: |
      Ride off the ferry and the path seems to run underneath Eye: on this side the building juts out 32 metres. The Viennese firm Delugan Meissl designed it as a faceted solid with hardly a right angle inside or out, so it looks different from every side, and clad it in white aluminium panels that catch the light differently through the day. It opened in 2012. Half of it stands on land newly made for Overhoeks, the district you ride through next.

      Inside, broad steps lead up to the Arena, a grandstand facing a glass wall onto the IJ. The film museum nearly went to Rotterdam in 1998 before Amsterdam fought to keep it. The bar-restaurant is open daily; films and exhibitions need a ticket.
    nl: |
      Rij van de pont af en het pad lijkt onder Eye door te lopen: aan deze kant steekt het gebouw 32 meter uit. Het Weense bureau Delugan Meissl tekende het als een veelvlakkig blok waarin vrijwel geen hoek van 90 graden zit, dus van geen twee kanten ziet het er hetzelfde uit. De huid van witte aluminium platen weerkaatst het licht de hele dag anders. In 2012 ging het open. Het halve gebouw staat op grond die pas voor Overhoeks werd aangelegd, de wijk waar je hierna doorheen fietst.

      Binnen brengen brede trappen je naar de Arena, een tribune met zicht op de glazen wand en het IJ. In 1998 was het Filmmuseum bijna naar Rotterdam vertrokken, tot Amsterdam terugvocht. Het bar-restaurant is elke dag open; voor films en tentoonstellingen koop je een kaartje.
  - place: A'DAM Toren and A'DAM Lookout
    narration: |
      Behind Eye stands Shell's old tower. Arthur Staal designed it for Shell's Amsterdam laboratory, finished in 1971. Its name, *Overhoeks* (diagonally), comes from the way the 15-storey block sits crosswise on a long low building, on four huge forked concrete legs. Stand back to see them.

      For the conversion, finished in 2016, Felix Claus of Claus Van Wageningen Architecten, with OeverZaaijer, had to keep Staal's tower recognisable: a dark tower on white legs under a white crown turned crosswise. The worn concrete facade was replaced entirely, and the crown was rebuilt as a full storey to hold the Lookout. Look up for the swing hanging over its edge. Eye is new building on new land; this is old building given a new life, offices, a hotel, a club and a revolving restaurant. The Lookout is paid.
    nl: |
      Achter Eye staat de oude toren van Shell. Arthur Staal tekende hem voor het Koninklijke/Shell-Laboratorium; in 1971 was hij klaar. De naam Overhoeks zegt het al: het blok van vijftien verdiepingen staat dwars op een lang laag gebouw, op vier kolossale betonnen poten met een vork. Ga een eindje achteruit om ze te zien.

      Bij de verbouwing, in 2016 klaar, moest Felix Claus van Claus Van Wageningen Architecten, samen met OeverZaaijer, Staals toren herkenbaar houden: een donkere toren op witte poten onder een overhoeks gedraaide witte kroon. De versleten betonnen gevel werd helemaal vervangen en de kroon opnieuw gebouwd als echte verdieping voor de Lookout. Kijk omhoog naar de schommel die over de rand hangt. Eye is nieuwbouw op nieuwe grond; dit is een oud gebouw met een nieuw leven, met kantoren, een hotel, een club en een draaiend restaurant. De Lookout kost entree.
    next:
      directions: Ride west along the IJ bank and the Oeverpark to the white marble block.
      nl: Fiets naar het westen langs de IJ-oever en het Oeverpark, naar het witmarmeren blok.
  - place: De Europa (Álvaro Siza)
    narration: |
      When Shell left the eastern part of its site in 2009, the land became Overhoeks, planned by Geurst & Schulze to face the water rather than the older streets behind. The Portuguese architect Álvaro Siza drew three blocks for it, each named after an ocean liner; De Europa, finished in 2011, was the first.

      Look at it from the Oeverpark: white marble facades, terraces stepping back above the fifth floor, and balconies and loggias cut out of the mass, which keeps the big white volume from looming. Siza modelled it on the residential hotels of the 1930s, with a shared gym and sauna for the 79 flats, set on a half-sunken car park so that every flat looks out over the IJ, the park or the courtyard. Beside it stand the Shell offices of 2005 to 2009. Private homes.
    nl: |
      Toen Shell in 2009 het oostelijke deel van zijn terrein verliet, werd de grond Overhoeks. Geurst & Schulze maakten het plan en keerden de wijk naar het water, niet naar de oudere buurt erachter. De Portugese architect Álvaro Siza tekende er drie woonblokken voor, elk genoemd naar een oceaanstomer; De Europa kwam in 2011 als eerste gereed.

      Bekijk het vanuit het Oeverpark: gevels van wit marmer, terrassen die boven de vijfde verdieping terugwijken, en balkons en loggia's die uit het volume zijn gesneden, waardoor het grote witte blok niet dominant wordt. Siza baseerde het op de woonhotels uit de jaren dertig, met een gedeelde fitnessruimte en sauna voor de 79 appartementen, boven een half verdiepte garage, zodat elke woning uitkijkt over het IJ, het park of de binnenplaats. Ernaast staan de Shell-kantoren uit 2005 tot 2009. Particuliere woningen.
    next:
      directions: Ride east through Overhoeks to the Badhuiskade.
      nl: Fiets naar het oosten door Overhoeks, naar de Badhuiskade.
  - place: Hyperion Lyceum
    narration: |
      A school that had to grow upwards. The Hyperion Lyceum started in 2011 in a temporary building on the Tolhuiskade and moved here in 2018, with about 850 pupils. The building is unusually tall for a Dutch secondary school, so Ector Hoogstad Architecten stacked it as a double helix: an atrium inside, and outside a route of linked terraces climbing the building, each with its own theme, in place of a schoolyard. Follow them up the slanting front from the Badhuiskade.

      The grey, partly see-through aluminium skin is deliberately cheap and plain. Now look for the tower behind: on the school's north wall Lara Almarcegui painted a list of the 46,753 tonnes of building materials behind the new district, and it vanished almost at once behind the 25-storey Bold tower, 10 centimetres away. This is the first of three schools on the ride.
    nl: |
      Een school die de hoogte in moest. Het Hyperion Lyceum begon in 2011 in een tijdelijk gebouw aan de Tolhuiskade en verhuisde in 2018 hierheen, met zo'n 850 leerlingen. Voor een middelbare school is het ongewoon hoog, dus stapelde Ector Hoogstad Architecten het als een dubbele helix: binnen een atrium, buiten een route van aan elkaar geschakelde terrassen die langs het gebouw omhoog klimmen, elk met een eigen thema. Die terrassen vervangen het schoolplein. Volg ze vanaf de Badhuiskade langs de schuine gevel omhoog.

      Het grijze, deels doorzichtige aluminium buitenschild is bewust eenvoudig en goedkoop. Kijk dan naar de toren erachter: op de noordgevel schilderde Lara Almarcegui een lijst van de 46.753 ton bouwmaterialen achter de nieuwe wijk, en die verdween vrijwel meteen achter de toren Bold van 25 verdiepingen, op 10 centimeter afstand. Dit is de eerste van drie scholen op de route.
  - place: De Jakoba, Overhoeks
    narration: |
      Its architects, Studioninedots, call Overhoeks a district of towers in a campus-like layout, rather un-Amsterdam. Their building for the housing corporation Ymere (2022) is the exception: 135 social-rent studios, each for one person. The plan required the building to step back from the street, so they bent the whole block inwards; it staggers and curves as it rises, and every studio is laid out slightly differently.

      Look for the pale green curved fins on the prefab concrete, which owes its colour to sand and gravel, and the balconies running the full length of both fronts to shade the homes below. Against loneliness, everyone uses one entrance, which leads through the building to a shared garden. The name honours Jakoba Mulder, the architect who headed the city's planning department from 1958.
    nl: |
      De architecten, Studioninedots, noemen Overhoeks een wijk van torens in een campusachtige opzet, nogal on-Amsterdams. Hun gebouw voor woningcorporatie Ymere (2022) is de uitzondering: 135 sociale huurstudio's, allemaal voor één persoon. Het plan schreef terugliggende rooilijnen voor, dus bogen ze het hele blok naar binnen. Het verspringt en kromt naar boven toe, en elke studio is net anders ingedeeld.

      Let op de zachtgroene gebogen vinnen op het prefab beton, dat zijn kleur dankt aan zand en grind, en op de balkons die aan beide lange gevels over de hele lengte doorlopen en de woningen eronder schaduw geven. Tegen eenzaamheid gebruikt iedereen dezelfde entree, die dwars door het gebouw naar een gezamenlijke tuin leidt. De naam verwijst naar Jakoba Mulder, de architecte die vanaf 1958 de afdeling Stadsontwikkeling leidde.
  - place: De August
    narration: |
      A second Ymere building, and a second answer to the luxury towers around it. De August by Team V Architectuur, finished in 2024, holds 175 compact flats for social rent; the task, as the architects put it, was to stand up to its expensive neighbours.

      They did it through thrift. The U-shaped block is mirrored down the middle, with two identical entrances, and all the balconies and rainpipes are the same. The money saved went into the plinth of green glazed brick from Royal Tichelaar, while the floors above have a thin cream-white render. Look up at the triangular balconies, which turn a different way on each floor, then into the half-open courtyard on the Docklandsweg, laid out by Kiki van Eijk with Buro Sant en Co, with big terracotta-coloured boulders to sit on and ceramic lamps.
    nl: |
      Een tweede gebouw van Ymere, en een tweede antwoord op de luxe torens eromheen. De August van Team V Architectuur, in 2024 klaar, telt 175 kleine woningen in de sociale huur; de opgave was volgens de architecten overeind te blijven naast de dure buren.

      Dat lukte door zuinig te zijn. Het U-vormige blok is in het midden gespiegeld, met twee gelijke entrees, en alle balkons en regenpijpen zijn identiek. Wat dat opleverde, ging naar de plint van groen geglazuurde baksteen van Royal Tichelaar; hogerop is de gevel afgewerkt met dun crèmewit stucwerk. Kijk omhoog naar de driehoekige balkons, die per verdieping een andere kant op draaien, en dan de halfopen binnentuin aan de Docklandsweg in, ingericht door Kiki van Eijk met Sant en Co: grote terracottakleurige keien om op te zitten en keramieken lampen.
    next:
      directions: Ride east out of Overhoeks to the Gentiaanplein.
      nl: Fiets naar het oosten, Overhoeks uit, naar het Gentiaanplein.
  - place: Gentiaanbuurt, the shipping line's garden village
    narration: |
      A century older, and the same landlord. These closed blocks round a big square were built in the 1920s for the shipping company Stoomvaartmaatschappij Nederland, the southern ones designed by A.D.N. van Gendt and G.H. Kleinhout; the housing company Tuindorp, now Ymere, took the plan over. Ride in through one of the gateways under the houses.

      Inside, the homes shift and step around the corners, some with three separate stairwells running through them, a fire risk that was one reason to renovate. Because the outside is protected, Hooyschuur (block 5) and then Ibelings van Tilburg (blocks 6 to 10, finished in 2023) put the insulation on the inside, and paint research brought back the green doors and window frames. Most tenants moved back in. On the square, look for the picnic table with a tiled mosaic of butterflies.
    nl: |
      Een eeuw ouder, en dezelfde verhuurder. Deze gesloten blokken rond een groot plein zijn in de jaren twintig gebouwd voor de rederij Stoomvaartmaatschappij Nederland; de zuidelijke tekenden A.D.N. van Gendt en G.H. Kleinhout. Woningmaatschappij Tuindorp, nu Ymere, nam het plan over. Fiets naar binnen door een van de poorten onder de huizen.

      Binnen verschuiven en verspringen de woningen om de hoeken heen, en door sommige lopen wel drie trappenhuizen. Dat brandgevaar was een van de redenen om te renoveren. Omdat de buitenkant beschermd stadsgezicht is, legden Hooyschuur (blok 5) en daarna Ibelings van Tilburg (blok 6 tot en met 10, klaar in 2023) de isolatie aan de binnenkant, en kleuronderzoek bracht het groen terug op deuren en kozijnen. De meeste huurders kwamen terug. Zoek op het plein de picknicktafel met een tegelmozaïek van vlinders.
    next:
      directions: Ride east to the metro viaduct along the Nieuwe Leeuwarderweg.
      nl: Fiets naar het oosten, naar het metroviaduct langs de Nieuwe Leeuwarderweg.
  - place: Noorderpark station
    narration: |
      Here the Noord/Zuidlijn comes up into the open. Benthem Crouwel Architects designed all seven stations of the line, five underground and two above ground in Noord; this is one of those two, a plain station with a single exit at the north end of the platform. What marks it out is the slender, curved glass roof over the platform. Lit up at night, its wavy line explains the nickname, "de Cobra". The line opened in July 2018 and in 2019 won the jury prize of the Amsterdam Architecture Prize, for stations that read as part of the street rather than as buildings.

      At the south end of the platform the trains run through De 7 Poorten, seven brick gates overgrown by crystal shapes, by Persijn Broersen and Margit Lukács. They can be seen from every train, so look out for them on your way back.
    nl: |
      Hier komt de Noord/Zuidlijn boven de grond. Benthem Crouwel Architects ontwierp alle zeven stations van de lijn, vijf onder de grond en twee erboven in Noord; dit is er een van, een sober station met één uitgang aan de noordkant van het perron. Herkenbaar wordt het door de dunne, gebogen glazen kap boven het perron. 's Avonds brandt er licht in, en aan de golvende vorm zie je waarom het station de Cobra heet. De lijn ging in juli 2018 open en kreeg in 2019 de vakprijs van de Amsterdamse Architectuurprijs, omdat de stations zich gedragen als een stuk straat dat doorloopt.

      Aan de zuidkant van het perron rijden de metro's door De 7 Poorten, zeven bakstenen poorten die worden overwoekerd door kristalvormen, van Persijn Broersen en Margit Lukács. Je ziet ze vanuit elke metro, dus let erop als je straks terugrijdt.
    next:
      directions: Ride north into the Noorderpark to the wooden pavilion on the Floraparkweg.
      nl: Fiets naar het noorden het Noorderpark in, naar het houten paviljoen aan de Floraparkweg.
  - place: Noorderparkkamer, the Swiss pavilion and the Marktplaats bar
    narration: |
      In the middle of the park stands a building that has travelled. Marcel Meili and Markus Peter designed the wooden pavilion around 1990 as a workshop for a young craftsman in Switzerland: seven big timber panels leaning on each other like a house of cards, with a roof that slides out and walls that slide aside. It was built in Hoogvliet near Rotterdam, then set up here by the borough of Noord, and from 2007 it was the park's "cultural living room". Open the sliding wall and it becomes a stage.

      In 2012 Overtreders W and bureau SLA added a bar billed as the first building in the Netherlands made entirely from Marktplaats purchases: stripped units from a temporary hospital, 42 second-hand windows and wooden shutters charred the Japanese way. Reuse again, but on a small budget and second hand. Since July 2026 it has been licensed as Noorderpark Café.
    nl: |
      Midden in het park staat een gebouw met een reis achter de rug. Marcel Meili en Markus Peter ontwierpen het houten paviljoen rond 1990 als werkplaats voor een jonge ambachtsman in Zwitserland: zeven grote houten platen die als een kaartenhuis tegen elkaar leunen, met een dak dat naar buiten schuift en wanden die opzij kunnen. Het werd gebouwd in Hoogvliet bij Rotterdam, daarna zette stadsdeel Noord het hier neer, en vanaf 2007 was het de culturele huiskamer van het park. Schuif de wand open en het is een podium.

      In 2012 zetten Overtreders W en bureau SLA er een bar naast die werd aangekondigd als het eerste gebouw van Nederland dat helemaal met Marktplaats-aankopen is gemaakt: gestripte units van een tijdelijk ziekenhuis, 42 tweedehands ramen en houten luiken die op Japanse wijze zijn geschroeid. Ook hergebruik, maar dan klein en tweedehands. Sinds juli 2026 heeft het een vergunning als Noorderpark Café.
    next:
      directions: Continue north through the park to the pool on the Sneeuwbalweg.
      nl: Fiets verder naar het noorden door het park, naar het zwembad aan de Sneeuwbalweg.
  - place: Noorderparkbad
    narration: |
      At the north end of the park, a pool for everyone. De Architekten Cie., the office behind the NDSM masterplan, built the Noorderparkbad in 2013 to 2015 next to the Floraparkbad of 1975, which was pulled down after the opening. In 2016 it won both the jury prize and the public prize of the Amsterdam Architecture Prize, and at a pool trade fair in Lyon it was named the most beautiful public swimming pool in the world.

      From outside, look for the wavy rain curtain on the facade and, through the glass, the wooden rhomboid roof structure. The jury had called the tiling surprising; in 2021 the floor tiles came loose, because the floor could not stand chlorine, heat and damp, and a new floor went in. It is a family pool for Noord, with outdoor pools on the park side, open to the public.
    nl: |
      Aan de noordkant van het park, een zwembad voor iedereen. De Architekten Cie., het bureau achter het masterplan voor de NDSM, bouwde het Noorderparkbad in 2013-2015 naast het Floraparkbad uit 1975, dat na de opening werd gesloopt. In 2016 kreeg het van de Amsterdamse Architectuurprijs zowel de juryprijs als de publieksprijs, en op een zwembadbeurs in Lyon werd het tot mooiste openbare bad ter wereld gekozen.

      Kijk buiten naar het golvende regengordijn aan de gevel, en door het glas naar de houten dakconstructie van ruiten. De jury had het tegelwerk nog verrassend genoemd; in 2021 lieten de tegels los, omdat de vloer niet tegen chloor, warmte en vocht kon, en kwam er een nieuwe vloer in. Het is een openbaar familiebad voor Noord, met buitenbaden aan de kant van het park.
    next:
      directions: A detour west of about 2 km to the Tuinderijlaan in De Bongerd.
      nl: Een omweg van zo'n 2 kilometer naar het westen, naar de Tuinderijlaan in De Bongerd.
  - place: Klein Amsterdam school
    narration: |
      The second school, and the opposite of the Hyperion's tall stack. New districts fill with children faster than the city can build schools, so in 2017 the foundation Leren in de Tussenruimte asked SeARCH for a building that could keep up. The answer, delivered in 2019, is made entirely of prefabricated timber modules that stand without foundations. Each one measures 8.7 by 3.3 metres, the size that fits on a standard lorry, so the school can grow with extra modules, shrink or move.

      Count the stacked timber boxes, each one a lorry-load. It was always meant to be temporary: in November 2026 the city said it would refurbish a school building on the Schoenerstraat for Klein Amsterdam, without saying what happens to the modules. A working primary school; see it from outside.
    nl: |
      De tweede school, en het tegendeel van de hoge stapel van het Hyperion. In een nieuwe wijk komen de kinderen sneller dan de gemeente scholen kan bouwen, dus vroeg Stichting Leren in de Tussenruimte in 2017 aan SeARCH om een gebouw dat dat tempo kon bijhouden. Het werd een school van louter houten prefab modules, in 2019 opgeleverd, zonder fundering. Elke module is 8,7 bij 3,3 meter, de maat van een gewone vrachtwagen, dus de school kan groeien, krimpen of verhuizen.

      Tel de gestapelde houten dozen, elk een vrachtwagenlading. Tijdelijk was het altijd: in november 2026 maakte de gemeente bekend dat een schoolgebouw aan de Schoenerstraat wordt opgeknapt voor Klein Amsterdam. Wat er met de modules gebeurt, staat er niet bij. Een basisschool in bedrijf, alleen van buiten te bekijken.
    next:
      directions: Ride north-east to the Aakstraat in Banne Buiksloot.
      nl: Fiets naar het noordoosten, naar de Aakstraat in Banne Buiksloot.
  - place: De Ark, church hall turned social market
    narration: |
      From new building to a new use. Sunday services in this plain brick church stopped in 2022, and rather than sell or close it, the Protestant Church Amsterdam and its diaconate turned the food bank into a Sociale Markt: visitors shop with a guide at a free supermarket, a chemist and a clothes shop instead of queuing for a ready-made parcel.

      The hall still had to serve for film nights, funerals and concerts, so the architects of Open Kaart fitted all three shops into one large wooden piece of furniture in the form of a stand, in clear-lacquered wood that sits with the stone floor, green ceiling and brick walls of the old church. When the shop doors are closed, only their keyholes give them away. From outside, as the diaconate's director admits, it still looks closed. The market opens three days a week, for its visitors.
    nl: |
      Van nieuwbouw naar een nieuwe bestemming. Sinds 2022 zijn er in deze eenvoudige bakstenen kerk geen zondagse diensten meer. Verkopen of sluiten wilden de Protestantse Kerk Amsterdam en de diaconie niet; ze maakten van de voedselbank een Sociale Markt. Bezoekers doen onder begeleiding boodschappen in een gratis supermarkt, drogisterij en kledingwinkel, in plaats van in de rij te staan voor een kant-en-klaar pakket.

      De zaal moest geschikt blijven voor filmavonden, uitvaarten en concerten. Daarom bracht Open Kaart de drie winkels onder in één groot houten meubel in de vorm van een tribune, van blank gelakt hout dat goed samengaat met de natuurstenen vloer, het groene plafond en de bakstenen muren van de oude kerk. Zijn de winkeldeuren dicht, dan verraadt alleen het sleutelgat ze. Van buiten oogt het nog gesloten, geeft de directeur van de diaconie toe. De markt is drie dagen per week open voor haar bezoekers.
    next:
      directions: Ride south-east to Elzenhagen Zuid.
      nl: Fiets naar het zuidoosten, naar Elzenhagen Zuid.
  - place: Xplore Agora
    narration: |
      The third school, built for teaching with no fixed classes: in Agora schools, groups of 12 to 17 pupils of mixed ages and levels work on "challenges" whose subjects they choose themselves. Studio Ard Hoksbergen and VDNDP designed it after meeting pupils, teachers and craftspeople every week for half a year, and it opened in August 2025 with room for 600 pupils.

      Movable partitions join or close off almost every room, so the building can change with the school. After the Hyperion's terraces and Klein Amsterdam's lorry-sized boxes, this is the third way to keep a school flexible. Look at the facade: concrete with red bricks laid at a slant in a rhythmic pattern, nest boxes built in, and planting along the walls and the quay. The jury of the Amsterdam Architecture Prize 2026, which nominated it, praised a design that could later also serve an ordinary secondary school.
    nl: |
      De derde school, gebouwd voor onderwijs zonder vaste klassen: op Agora-scholen werken leerlingen van verschillende leeftijden en niveaus in groepjes van 12 tot 17 aan "challenges", waarvan ze het onderwerp zelf kiezen. Studio Ard Hoksbergen en VDNDP ontwierpen het gebouw na een halfjaar wekelijks overleg met leerlingen, coaches en vakmensen. In augustus 2025 ging het open, met plek voor 600 leerlingen.

      Bijna elke ruimte is met verplaatsbare wanden te koppelen of af te sluiten, zodat het gebouw met de school kan meebewegen. Na de terrassen van het Hyperion en de vrachtwagendozen van Klein Amsterdam is dit de derde manier om een school soepel te houden. Kijk naar de gevel: beton met schuin gelegde rode bakstenen in een vast ritme, nestkastjes erin en groen langs gevel en kade. De vakjury van de Amsterdamse Architectuurprijs 2026, die de school nomineerde, waardeerde dat het gebouw later ook een gewone middelbare school kan huisvesten.
    next:
      directions: Ride east to the metro viaduct on the Nieuwe Leeuwarderweg, by the IJdoornlaan.
      nl: Fiets naar het oosten, naar het metroviaduct aan de Nieuwe Leeuwarderweg, bij de IJdoornlaan.
  - place: Metro station Noord
    narration: |
      The ride ends at a station. The brief for the Noord/Zuidlijn stations, as Jan Benthem tells it, was strict: stay underground, demolish nothing, leave the city above as it was. Only Noord and Noorderpark, which you passed earlier, could be seen. Noord stands on a viaduct along the Nieuwe Leeuwarderweg, and its whole platform lies under a transparent roof of bent steel trusses glazed with cold-bent glass.

      See the long glass roof from the bus station at the north end, which lies right against the platform: the idea behind all seven stations was the shortest possible route between platform and street, with daylight to show the way. With a ticket, look down on the platform too, at Harmen Liemburg's Flyways, birds and old maps cut into the tiles. The metro runs from here to the centre, through the seven gates at Noorderpark.
    nl: |
      De rit eindigt bij een station. De opdracht voor de stations van de Noord/Zuidlijn was volgens Jan Benthem streng: blijf ondergronds, sloop niets, laat de stad erboven ongemoeid. Alleen Noord en Noorderpark, waar je eerder langskwam, mochten zich laten zien. Noord staat op een viaduct langs de Nieuwe Leeuwarderweg, en het hele perron valt onder een doorzichtige kap van gebogen stalen spanten met koud gebogen glas.

      Bekijk de lange glazen kap vanaf het busstation aan de noordkant, dat direct aan het perron grenst: bij alle zeven stations was de gedachte zo kort mogelijk van perron naar straat, met daglicht als wegwijzer. Met een kaartje kijk je op het perron ook omlaag, naar Flyways van Harmen Liemburg: vogels en oude kaarten, uitgesneden in de tegels. Vanaf hier rijdt de metro naar de stad, door de zeven poorten bij Noorderpark.
