title: 'NDSM and Buiksloterham: the shipyard reused, the self-builders next door'
summary: >-
  Take the ferry to the old NDSM shipyard, where sheds, slipways, a crane track and a crane got new
  lives, then walk into the Buiksloterham, where self-builders, residents' groups and floating
  households filled the plots the big developers left.
body: |
  **Start:** the ferry piers behind Centraal Station. The free GVB ferry F4 takes you to the NDSM, where the walk begins at the landing.
  **End:** De Ceuvel on the Korte Papaverweg. Noorderpark metro station is about a kilometre's walk away.
  **Distance and time:** about 5.5 km on foot from the NDSM landing. Allow about 2.5 hours with stops.

  Most of what you see is homes and offices, looked at from the quays and streets. A few places let you in. The NDSM Loods opens at set times, for events and the IJ-Hallen flea market. De Ceuvel has a café-restaurant in the middle of its boats. The squares and steps of Republica were designed to be walked through. The Botel, the hotel tower beside the Smederij and the suites in Kraan 13 are for hotel guests, and the Schoonschip residents run guided tours of their floating neighbourhood.

  The NDSM was one of the big shipyards of the IJ until it went bankrupt in 1984. Its sheds, slipways, crane track and last crane were not cleared away but reused, by artists first and later also by offices and hotels, and the walk reads that story from the ferry landing to the slipways. Next door, the Buiksloterham was an industrial estate meant for large blocks. When the building crisis stopped those plans, the city sold small plots to private builders and residents' groups. The second half of the walk shows what they made: narrow self-built houses, a car-free village, timber towers, a floating neighbourhood and, at the end, old houseboats on a former shipyard.
mode: walk
nl:
  title: 'NDSM en Buiksloterham: de werf hergebruikt, de zelfbouwers ernaast'
  summary: >-
    Met de pont naar de oude NDSM-werf, waar loodsen, hellingen, een kraanspoor en een kraan een
    tweede leven kregen. Daarna de Buiksloterham in, waar zelfbouwers, bewonersgroepen en drijvende
    huishoudens de kavels vulden die de grote ontwikkelaars lieten liggen.
  body: |
    **Start:** de pontsteigers achter Centraal Station. De gratis GVB-pont F4 brengt je naar de NDSM, waar de wandeling bij de aanlegplaats begint.
    **Eind:** De Ceuvel aan de Korte Papaverweg. Metrostation Noorderpark is ongeveer een kilometer lopen.
    **Afstand en duur:** ongeveer 5,5 kilometer te voet vanaf de NDSM-pont, met stops zo'n tweeënhalf uur.

    Het meeste zijn woningen en kantoren, die je vanaf de kades en de straat bekijkt. Op een paar plekken kun je naar binnen. De NDSM Loods is op vaste momenten open, bij evenementen en de IJ-Hallen-vlooienmarkt. De Ceuvel heeft een café-restaurant tussen de boten. De pleintjes en trappen van Republica zijn ontworpen om doorheen te lopen. Het Botel, de hoteltoren naast de Smederij en de suites in Kraan 13 zijn voor hotelgasten, en de bewoners van Schoonschip geven rondleidingen door hun drijvende wijk.

    De NDSM was tot het faillissement van 1984 een van de grote werven aan het IJ. De loodsen, hellingen, het kraanspoor en de laatste kraan werden niet gesloopt maar hergebruikt, eerst door kunstenaars, later ook door kantoren en hotels. De wandeling volgt dat verhaal van de pont tot de hellingen. Ernaast lag de Buiksloterham, een bedrijventerrein waar grote bouwblokken moesten komen. Toen de crisis die plannen stillegde, verkocht de gemeente kleine kavels aan particulieren en bewonersgroepen. De tweede helft laat zien wat zij bouwden: smalle zelfbouwhuizen, een autovrij dorp, houten torens, een drijvende wijk en tot slot oude woonboten op een voormalige scheepswerf.
stops:
  - name: Centraal Station, ferry pier
    lat: 52.38095
    lng: 4.89968
    narration: |
      The walk starts on the water. The F4 ferry crosses from the piers behind Centraal Station to the old NDSM shipyard on the north bank of the IJ. Stand at the front for the last stretch: two stops on this walk are best seen from the ferry as it comes in. Watch for five red letters, each 6.5 metres tall, standing on the deck of a moored white hotel ship and spelling BOTEL. Then, right at the landing, two brick towers, one white and one red-brown. Those towers belong to Pontkade, the first stop, and the letters are the second.
    nl: |
      De wandeling begint op het water. De pont F4 vaart van de steigers achter Centraal Station naar de oude NDSM-werf aan de noordoever van het IJ. Ga voorin staan voor het laatste stuk, want twee stops van deze wandeling zie je het mooist vanaf de aankomende pont. Let op vijf rode letters van 6,5 meter hoog op het dek van een afgemeerd wit hotelschip: BOTEL. En dan, vlak bij de aanlegplaats, twee bakstenen torens, de een wit, de ander roodbruin. Die torens horen bij Pontkade, de eerste stop; de letters zijn de tweede.
    next:
      mode: ferry
      directions: Free GVB ferry F4 to NDSM.
      nl: Neem de gratis GVB-pont F4 naar de NDSM.
  - place: Pontkade
    narration: |
      You step off at the building named after the ferry: Pontkade means ferry quay. Its architects, de Architekten Cie. with partner Pi de Bruijn, also made the masterplan for the whole yard. That plan splits the NDSM in two. The eastern part, with the old sheds and slipways you will walk through next, stays for art, events and culture. The western part gets dense new housing, and Pontkade, finished in 2020, was meant as its prototype.

      Look at the ring of blocks round the inner court. Each has its own design and its own facing material; what holds them together, the architects say, is the raw, sturdy character of the shipyard. The two towers hold mostly rented flats, and there are 252 homes in all, with a plinth built for shops, cafés and workspaces.
    nl: |
      Je stapt uit bij het gebouw dat naar de pont is genoemd. De Architekten Cie., met partner-architect Pi de Bruijn, maakte ook het masterplan voor de hele werf. Dat plan verdeelt de NDSM in tweeën. Het oostelijke deel, met de oude loodsen en hellingen waar je straks doorheen loopt, blijft voor kunst, evenementen en cultuur. Op het westelijke deel komt dichte nieuwbouw, en Pontkade, in 2020 opgeleverd, moest daarvan het voorbeeld zijn.

      Kijk naar de ring van blokken rond het binnenterrein. Elk blok heeft een eigen ontwerp en eigen gevelmateriaal; wat ze bindt is volgens de architecten het ruige, stoere karakter van de scheepswerf. In de twee torens zitten vooral huurappartementen, en in totaal zijn er 252 woningen, met een plint voor winkels, horeca en werkruimtes.
    next:
      directions: Walk a little way west along the quay to the moored hotel ship.
      nl: Loop een klein stukje naar het westen over de kade, naar het afgemeerde hotelschip.
  - place: Botel and its letter rooms
    narration: |
      Now see the letters from the quay. In 2011 the owner of this white hotel ship asked MMX architecten how her boat could fit in with the creative scene of the old yard. With the filmmaker and architect Jord den Hollander they set five toy-like letters on the deck, finished in 2015. They are meant to recall the funnels of the ocean liners that once slid off the NDSM slipways, where this walk will take you later.

      Every letter is a hotel room, each by a different designer. Richard Hutten put a skateboard half-pipe in the B; Den Hollander fitted the E with what is billed as the smallest cinema in the Netherlands, with a bath facing the screen. The rooms are for guests only.
    nl: |
      Nu zie je de letters vanaf de kade. In 2011 vroeg de eigenaar van dit witte hotelschip aan MMX architecten hoe haar boot beter kon passen bij de creatieve sfeer van de oude werf. Samen met filmmaker en architect Jord den Hollander zetten ze vijf letters als reuzenspeelgoed op het dek, in 2015 klaar. Ze verwijzen naar de schoorstenen van de oceaanstomers die vroeger van de NDSM-hellingen liepen, waar je later op deze wandeling staat.

      Elke letter is een hotelkamer, elk door een andere ontwerper ingericht. Richard Hutten zette een halfpipe voor skateboarders in de B; Den Hollander maakte in de E wat de kleinste bioscoop van Nederland heet, met een bad tegenover het scherm. De kamers zijn alleen voor gasten.
    next:
      directions: Follow the water north to the long glass building on concrete piers.
      nl: Volg het water naar het noorden, naar het lange glazen gebouw op betonnen pijlers.
  - place: Kraanspoor
    narration: |
      The concrete underneath is the yard's own. This is a crane track (*kraanspoor*) of around 1952, designed by the Postma office: a raised structure on which two cranes rolled up and down to fit out ships moored alongside. The city had already issued a demolition permit when the architect Trude Hooykaas saw a foundation in it. The permit was withdrawn.

      Because the old concrete could not carry much, she set a light office block of steel and glass on top: three floors, about 270 metres long, standing on small supports of its own, so it seems to hover. Look for that gap between old and new, and for the pattern of timber boards still printed in the concrete. The stairs and lifts sit in the four portal-shaped piers, and escape walkways hang from them on the water side. It was finished in 2007; the offices are not open.
    nl: |
      Het beton eronder is van de werf zelf. Dit is een kraanspoor van rond 1952, ontworpen door het bureau Postma: een verhoogde stellage waarover twee kranen heen en weer reden, om schepen langszij af te bouwen. De sloopvergunning lag er al toen architect Trude Hooykaas er een fundament in zag. De vergunning werd ingetrokken.

      Beton kan niet alles hebben, dus zette ze er een lichte doos van staal en glas op: drie verdiepingen, zo'n 270 meter lang, op eigen pootjes, waardoor hij lijkt te zweven. Zoek de kier tussen oud en nieuw, en de nerf van de bekistingsplanken die nog in het beton staat. In de vier pijlers in de vorm van portalen zitten de trappen en liften, en aan de waterkant hangen er vluchtbruggen aan. In 2007 was het klaar; de kantoren zijn niet open.
    next:
      directions: Turn back south past the ferry landing and head inland to the old workshops in the heart of the yard.
      nl: Loop terug naar het zuiden, langs de pont, en ga landinwaarts naar de oude werkplaatsen in het hart van de werf.
  - place: Smederij and Timmerwerkplaats, NDSM
    narration: |
      These sheds are older than the yard they stand in. A workshop of 1909 at the NSM's old yard on the Conradstraat was taken apart and put up again here in 1927, to a design by G.J. Langhout, as two sheds: the forge (*smederij*) and the carpentry shop (*timmerwerkplaats*). Read the facades: a steel frame filled in with brick and long runs of small-paned steel windows, under very low roofs with skylights.

      GROUP A converted the forge, only sandblasting the listed steel columns and trusses. Beside it, on the site of the last small workshop, they lifted a pitched roof to about 30 metres to make a slim hotel tower as a marker for the wharf, today the DoubleTree by Hilton; its roof shape comes from the old forge roofs. Look for the tall sliding doors of the rebuilt workshops, in the blue of the wharf.
    nl: |
      Deze loodsen zijn ouder dan de werf waarop ze staan. Een werkplaats uit 1909 op de oude NSM-werf aan de Conradstraat werd gedemonteerd en in 1927 hier weer opgetrokken, naar ontwerp van G.J. Langhout, als twee loodsen: de smederij en de timmerwerkplaats. Lees de gevels: een stalen skelet, ingevuld met baksteen en lange stroken stalen ramen met kleine ruitjes, onder heel flauwe daken met lichtstraten.

      GROUP A verbouwde de smederij en straalde de beschermde stalen kolommen en spanten alleen schoon. Op de plek van de laatste puntloods ernaast tilde het bureau het dak op tot zo'n 30 meter: een slanke hoteltoren als baken voor de werf, nu het DoubleTree by Hilton. De dakvorm is afgeleid van de oude smederijdaken. Let op de hoge schuifdeuren van de herbouwde loodsen, in het blauw van de werf.
  - place: NDSM Loods (Scheepsbouwloods)
    narration: |
      Langhout again: he designed this shipbuilding shed (*scheepsbouwloods*) in 1919 to 1920, when the NSM, out of room on Oostenburg, built a new yard across the IJ. Outside, look for the faded ship and company names painted high on the facade facing the IJ, and for the tall blue doors.

      After the yard closed, squatters and artists moved in. Their foundation, Kinetisch Noord, now owns and runs the hall. In about a third of it Dynamo Architecten built the *Kunststad* (art city): some 85 studios stacked in a bare frame of black steel, kept apart from the hall's green ironwork, in which the tenants build their own studios. Remember that idea, a frame that people fill in themselves; you will meet it again in the Buiksloterham. The hall opens at set times, for events and the IJ-Hallen flea market.
    nl: |
      Weer Langhout: hij ontwierp deze scheepsbouwloods in 1919-1920, toen de NSM, te krap op Oostenburg, aan de overkant van het IJ een nieuwe werf bouwde. Kijk buiten naar de verbleekte scheeps- en bedrijfsnamen hoog op de gevel aan het IJ, en naar de hoge blauwe deuren.

      Toen de werf dicht was, trokken krakers en kunstenaars erin. Hun Stichting Kinetisch Noord bezit en beheert de loods nu. In ongeveer een derde ervan bouwde Dynamo Architecten de Kunststad: zo'n 85 ateliers in een kaal skelet van zwart staal, los van het groene ijzerwerk van de loods, waarin de huurders hun eigen atelier bouwen. Onthoud dat idee, een raamwerk dat mensen zelf invullen; in de Buiksloterham kom je het weer tegen. De loods is op vaste momenten open, bij evenementen en de IJ-Hallen.
  - place: NDSM slipways and Kraan 13 (Faralda Crane Hotel)
    narration: |
      This is where the ships were made. Two slipways (*hellingen*) survive, angled towards the IJ with a crane track between them. A ship was built on one and slid stern-first into the water at its launch; the last went in 1979. These are the slipways the Botel's letters remember. Langhout laid them out too.

      Under the western one, Helling X, artists made their own studio fronts, doors and windows; it reopened in 2025 with 17 studios. Above stands Kraan 13, the last of the yard's cranes. IAA Architecten hung three suites in signal-red steel round its frame, at 35, 40 and 45 metres, kept visibly apart from the old steel, much as the Kraanspoor's glass box floats over its concrete. The project won the Pieter van Vollenhoven Prize for re-use in 2016. Only guests get in. Before you leave, look out over the IJ from the foot of the slipways.
    nl: |
      Hier werden de schepen gemaakt. Er zijn nog twee hellingen, schuin naar het IJ gericht, met een kraanbaan ertussen. Een schip werd erop gebouwd en gleed bij de tewaterlating met de achtersteven voorop het water in; in 1979 voor het laatst. Aan deze hellingen denken de letters van het Botel terug. Ook ze zijn aangelegd onder Langhout.

      Onder de westelijke, Helling X, maakten kunstenaars zelf de puien, deuren en ramen van hun ateliers; in 2025 ging hij weer open met 17 ateliers. Erboven staat Kraan 13, de laatste werfkraan. IAA Architecten hing er drie suites van signaalrood staal omheen, op 35, 40 en 45 meter, zichtbaar los van het oude frame, zoals de glazen doos van het Kraanspoor boven zijn beton zweeft. In 2016 won het project de Pieter van Vollenhovenprijs voor herbestemming. Naar binnen kunnen alleen gasten. Kijk voor je gaat nog even over het IJ vanaf de voet van de hellingen.
    next:
      directions: Leave the yard eastwards into the Buiksloterham, just under a kilometre, to the Kaasjeskruidstraat.
      nl: Verlaat de werf naar het oosten, de Buiksloterham in, iets minder dan een kilometer naar de Kaasjeskruidstraat.
  - place: Self-build houses of Buiksloterham
    narration: |
      From the shipyard to its opposite. The 2009 zoning plan for this old industrial estate imagined large blocks up to 30 metres high. Then the crisis in the building trade hit, and the city turned to self-build (*zelfbouw*): at self-build markets in 2011, 2012 and 2013 it offered plots to private people, many on the site of a departed concrete plant, and cut the maximum height to 15 metres.

      Walk the Kaasjeskruidstraat: narrow houses side by side, each built for its own owner, some with a workshop or office on the ground floor. On the Klaprozenweg, find the Drie Generatiehuis (2018) by BETA, which its architect Gus van Oppen designed for his own family and his parents-in-law. Its black front to the road is almost closed, against traffic noise; the south side opens up behind a stack of balconies. These are private homes.
    nl: |
      Van de scheepswerf naar het tegendeel. Het bestemmingsplan van 2009 voor dit oude bedrijventerrein ging uit van grote bouwblokken tot 30 meter hoog. Toen kwam de crisis in de bouw, en koos de gemeente voor zelfbouw. Op zelfbouwmarkten in 2011, 2012 en 2013 bood ze kavels aan particulieren aan, veel ervan op het terrein van een vertrokken betonmortelcentrale, en de maximale bouwhoogte ging van 30 naar 15 meter.

      Loop door de Kaasjeskruidstraat: smalle huizen naast elkaar, elk voor een eigen opdrachtgever gebouwd, sommige met een werkruimte of kantoor beneden. Aan de Klaprozenweg staat het Drie Generatiehuis (2018) van BETA, dat architect Gus van Oppen tekende voor zijn eigen gezin en zijn schoonouders. De zwarte gevel aan de weg is bijna dicht, tegen het verkeerslawaai; aan de zuidkant gaat het huis open achter een stapel balkons. Het zijn particuliere woningen.
  - place: Republica, Papaverhof
    narration: |
      Where the self-builders made single houses, Republica made a village. Marc Koehler Architects took a closed factory plot of 80 by 80 metres and broke it open into six buildings, each with its own skin: a soft green concrete tower, a stepped white block, a timber-clad apartment hotel, a workshop building in Corten steel and a café with a front of recycled brick.

      Climb the broad steps from the street. The car-free squares and alleys sit a storey up, on a half-sunken garage that keeps cars, bikes and bins out of sight, and they were designed to be walked through. Like the Kunststad, part of the work was left to the owners: the ten Superlofts in the green tower were sold as empty shells and fitted out by their buyers. In front of the café, broad seating steps face south, meant as the "Spanish steps" of Buiksloterham.
    nl: |
      Waar de zelfbouwers losse huizen maakten, maakte Republica een dorp. Marc Koehler Architects brak een gesloten fabrieksterrein van 80 bij 80 meter open tot zes gebouwen, elk met een eigen huid: een zachtgroen betonnen torentje, een witte getrapte toren, een appartementenhotel met een houten gevel, een werkgebouw van cortenstaal en een café met een gevel van gerecyclede baksteen.

      Klim de brede trap op vanaf de straat. De autovrije pleintjes en stegen liggen een verdieping hoger, op een halfverdiepte garage waar auto's, fietsen en afval uit het zicht blijven, en ze zijn ontworpen om doorheen te lopen. Net als in de Kunststad bleef een deel van het werk aan de eigenaren: de tien Superlofts in het groene torentje zijn als lege casco verkocht en door de kopers zelf afgebouwd. Voor het café liggen brede zittreden op het zuiden, bedoeld als de Spaanse trappen van Buiksloterham.
    next:
      directions: Head south-west to the Tolhuiskanaal and the Leen Jongewaardkade.
      nl: Ga naar het zuidwesten, naar het Tolhuiskanaal en de Leen Jongewaardkade.
  - place: The Doors
    narration: |
      On the Tolhuiskanaal stands a building that started from a tax rule. Self-employed people can only deduct the cost of a workspace at home if it has its own front door, so the developer Edwin Oostmeijer gave each of the twelve flats two: one for living and one for a workspace beside it. The architects, Space Encounters, add that the second door also lets a grown-up child or an elderly parent live next door.

      Look at the front, finished in 2023 and stacked in three layers: a closed plinth of white glazed tiles and Ceppo di Gré stone, a glazed middle, and a heavier top that shades it, all crossed by bands of concrete with built-in planters. The self-build houses put a workshop beside the home on the ground floor; here the same mix of living and working is stacked into one block. Private flats; see them from the quay.
    nl: |
      Aan het Tolhuiskanaal staat een gebouw dat begon met een belastingregel. Een zelfstandige mag de kosten van een werkplek thuis alleen aftrekken als die een eigen voordeur heeft, dus gaf projectontwikkelaar Edwin Oostmeijer elk van de twaalf appartementen er twee: een voor het wonen en een voor de werkruimte ernaast. Die tweede deur kan ook dienen voor een volwassen kind of een ouder vlakbij, merken de architecten van Space Encounters op.

      Kijk naar de gevel, in 2023 klaar, in drie lagen: onderin een gesloten plint van wit geglazuurde tegels en Ceppo di Gré-natuursteen, daarboven een glazen middendeel en bovenop een zwaarder ogende kop die schaduw geeft, met horizontale betonbanden vol plantenbakken. Bij de zelfbouwhuizen zat de werkruimte beneden naast het huis; hier zijn wonen en werken in één blok gestapeld. Particuliere woningen, te bekijken vanaf de kade.
  - place: Cityplot and the Tolhuiskade beacon
    narration: |
      Here the plan itself was cut into pieces. During the last crisis Studioninedots and the landscape architects DELVA dropped the idea of one big master plan between the Tolhuiskanaal and the Johan van Hasseltkanaal and divided the land into small plots for different architects to fill over time.

      Go to the bend of the canal. Civic Architects' block of ten homes (2024) is the district's beacon: a double fin runs over its roof, hiding the flues, and its zigzag folds spell different words from different sides: BAK and STUUR (port and starboard), NOORD and ZUID. On the inner side of the same plot, Studioninedots' own building, C14, wears a coated steel skin that seems to dissolve into the sky one moment and mirrors the sun the next. Then read the street signs: since 2016 the streets here carry the names of cabaret performers, such as Conny Stuart and Leen Jongewaard.
    nl: |
      Hier werd het plan zelf in stukken geknipt. Tijdens de vorige crisis lieten Studioninedots en landschapsarchitecten DELVA het idee van één groot masterplan tussen het Tolhuiskanaal en het Johan van Hasseltkanaal los en verdeelden ze de grond in kleine kavels, die verschillende architecten in de loop van de tijd konden invullen.

      Loop naar de bocht van het kanaal. Het blok van tien woningen van Civic Architects (2024) is het baken van de buurt: over het dak loopt een dubbele vin die de rookkanalen verbergt, en door de zigzagplooien lees je van elke kant een ander woord: BAK en STUUR, NOORD en ZUID. Aan de binnenkant van dezelfde kavel staat C14, het eigen gebouw van Studioninedots, met een stalen huid die het ene moment in de lucht lijkt op te lossen en het volgende de zon weerkaatst. Lees dan de straatnaambordjes: sinds 2016 zijn de straten hier genoemd naar kleinkunstenaars, zoals Conny Stuart en Leen Jongewaard.
    next:
      directions: Walk east to the Johan van Hasseltkade.
      nl: Loop naar het oosten, naar de Johan van Hasseltkade.
  - place: Timber towers of Buiksloterham (Patch22, Top-Up, Stories)
    narration: |
      In 2009 the city offered plots here at a fixed price and chose the builders on sustainability rather than on who paid most. Three answers stand around you, all in timber.

      Patch22 (2016), by Tom Frantzen's office, was billed at completion as the tallest timber apartment building in the Netherlands: 30 metres of wood. Its floors step in and out, as if a storm had already rattled them, because wind was the main problem for so light a structure. Next door, Top-Up (2020), by the same team, sits on the round concrete walls of an old PTT cable store; its buyers got empty shells, as at Republica. About 130 metres north-west, Stories (2021), a 47-metre tower commissioned by its own future residents, stands inside a white steel frame of balconies and planters. All three are private.
    nl: |
      In 2009 gaf de gemeente hier kavels uit tegen een vaste prijs en koos ze de bouwers op duurzaamheid in plaats van op het hoogste bod. Om je heen staan drie antwoorden, alle drie van hout.

      Patch22 (2016), van het bureau van Tom Frantzen, gold bij oplevering als het hoogste houten appartementengebouw van Nederland: 30 meter hout. De verdiepingen verspringen, alsof een storm ze al flink heeft opgeschud, want bij zo'n lichte constructie was de wind het grootste probleem. Ernaast staat Top-Up (2020), van hetzelfde team, op de ronde betonwanden van een oude kabelopslag van de PTT; de kopers kregen er een lege casco, net als bij Republica. Zo'n 130 meter naar het noordwesten staat Stories (2021), een toren van 47 meter, gebouwd in opdracht van de toekomstige bewoners zelf, in een wit stalen frame van balkons en plantenbakken. Alle drie particulier.
  - place: Schoonschip floating neighbourhood
    narration: |
      In the canal opposite the timber towers, self-build goes afloat. In 2010 a group of Amsterdammers who wanted to live on the water set out to build a sustainable neighbourhood here without a developer. It took them about eleven years. Since early 2020, 46 households have lived on 30 arks in the Johan van Hasseltkanaal, each designed by its residents with their own architect within a master plan by Space&Matter, so no two look the same.

      There is no gas. Heat pumps draw warmth from the canal water, solar panels cover much of the energy, and a shared smart grid lets the arks trade electricity, so the whole neighbourhood needs only one connection to the national grid. Look for the jetty that links the arks and the floating gardens. These are private homes: look from the quay, or join one of the tours the residents run.
    nl: |
      In het kanaal tegenover de houten torens gaat de zelfbouw het water op. In 2010 begon een groep Amsterdammers die op het water wilde wonen hier zonder projectontwikkelaar aan een duurzame wijk. Dat kostte ze zo'n elf jaar. Sinds begin 2020 wonen 46 huishoudens op 30 arken in het Johan van Hasseltkanaal, elk door de bewoners zelf ontworpen met een eigen architect, binnen een plan van Space&Matter. Geen twee zien er hetzelfde uit.

      Gas is er niet. Warmtepompen halen warmte uit het kanaalwater, zonnepanelen leveren een groot deel van de energie, en via een eigen slim net wisselen de arken stroom uit, zodat de hele wijk maar één aansluiting op het landelijke net nodig heeft. Let op de steiger die de arken verbindt en de drijvende tuinen. Het zijn particuliere woningen: kijk vanaf de kade of ga mee met een rondleiding van de bewoners.
    next:
      directions: Continue east along the water to the Korte Papaverweg.
      nl: Loop verder naar het oosten langs het water, naar de Korte Papaverweg.
  - place: De Ceuvel
    narration: |
      The walk ends on a shipyard, as it began. From 1919 a yard stood on this bank, next to the Fokker aircraft factory; it closed in 2000 and left soil heavily polluted with metals. In 2012 a team including Space&Matter, the planners of Schoonschip, and DELVA, who worked on the Cityplot plan, won a lease, and from 2013 they lifted fifteen old houseboats out of the water and set them on land as offices and studios.

      After the arks on the canal, here are boats on dry land. Nobody may dig deeper than 50 centimetres into the ground, so every pipe and cable runs over the surface and a winding boardwalk links the boats, among plants chosen to draw metals out of the soil. The café-restaurant in the middle, by Wouter Valkenier, is built from reused materials. Go while you can: the city wants the site back empty in early 2028.
    nl: |
      De wandeling eindigt op een scheepswerf, zoals hij begon. Vanaf 1919 stond aan deze oever een werf, naast de vliegtuigfabriek van Fokker. In 2000 ging hij dicht, en wat achterbleef was een bodem vol metalen. In 2012 won een ploeg met onder anderen Space&Matter, de ontwerpers van het plan voor Schoonschip, en DELVA, dat meetekende aan het plan voor Cityplot, een huurcontract. Vanaf 2013 hesen ze vijftien oude woonboten uit het water en zetten ze op het land, als kantoor en atelier.

      Na de arken in het kanaal staan hier boten op het droge. Dieper graven dan 50 centimeter mag niet, dus liggen alle leidingen en kabels bovenop en loop je over een slingerend plankenpad van boot naar boot, tussen planten die metalen uit de grond halen. Het café-restaurant in het midden, van Wouter Valkenier, is gebouwd met hergebruikt materiaal. Ga zolang het kan: de gemeente wil het terrein begin 2028 leeg terug.
