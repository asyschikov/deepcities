title: "Van Eesteren's garden cities renewed: a ride through Nieuw-West"
summary: >-
  From the museum of the plan itself through Slotermeer, Osdorp and Slotervaart: how the post-war
  garden cities were remade, first by tearing down and building new, then by keeping and adapting,
  with new schools, towers and converted buildings, ending at station Lelylaan.
body: |
  **Start:** the Van Eesteren Museum, Noordzijde 31, on the north shore of the Sloterplas. Coming by train, it is about 2 km by bike from station Lelylaan, where the ride ends.
  **End:** Cornelis on the Schielandplein, by station Amsterdam Lelylaan (train and metro).
  **Distance and time:** about 16 km, about 80 minutes of riding. Allow about 3 hours with stops.

  The ride is flat and runs through residential neighbourhoods, schools and parks. What you can go into: the Van Eesteren Museum's pavilion, at set times (its guided walk through Slotermeer runs Thursday to Sunday); the public foyer of Station Wildeman; and the public hall under Westbeat, where the dance company ICK Dans Amsterdam holds weekly open programmes and open rehearsals. The park and waterside walk at the Four Towers in Osdorp are public. Everything else is homes or working schools, seen from the street, so a weekday after school hours or a weekend is the calmest time.

  Cornelis van Eesteren stood at the cradle of Amsterdam's General Extension Plan of 1934, and after the war the Westelijke Tuinsteden (Western Garden Cities) went up to his layouts: open blocks in greenery, walk-up flats, schools set into the neighbourhoods. In this century they were renewed. The ride follows that renewal in roughly two waves. In Slotermeer and Osdorp you see the first: blocks of the 1950s and 1960s pulled down and replaced by buildings that each try something different, from MVRDV's hollowed-out block to glass-fronted town houses. The renewal of the Wildemanbuurt stalled in the 2009 recession, and from there on the ride shows the other way: a school, a flat and a neighbourhood centre kept and remade, and on the way to Lelylaan, new homes squeezed in for young people and families.
mode: bike
nl:
  title: 'De tuinsteden van Van Eesteren, vernieuwd: een fietstocht door Nieuw-West'
  summary: >-
    Van het museum over het plan zelf door Slotermeer, Osdorp en Slotervaart: hoe de naoorlogse
    tuinsteden werden vernieuwd, eerst met sloop en nieuwbouw, later door te behouden en om te bouwen.
    Nieuwe scholen, torens en verbouwingen, tot station Lelylaan.
  body: |
    **Start:** het Van Eesteren Museum, Noordzijde 31, aan de noordoever van de Sloterplas. Wie met de trein komt: het ligt zo'n 2 kilometer fietsen van station Lelylaan, waar de tocht eindigt.
    **Eind:** Cornelis aan het Schielandplein, bij station Amsterdam Lelylaan (trein en metro).
    **Afstand en duur:** ongeveer 16 kilometer, zo'n tachtig minuten fietsen. Met stops ben je zo'n drie uur onderweg.

    De route is vlak en gaat door woonbuurten, langs scholen en door parken. Naar binnen kun je in het paviljoen van het Van Eesteren Museum, op vaste tijden (de rondleiding door Slotermeer is van donderdag tot en met zondag), in de openbare foyer van Station Wildeman en in de openbare hal onder Westbeat, waar dansgezelschap ICK Dans Amsterdam wekelijks open programma's en open repetities heeft. Het park en het wandelpad langs het water bij de Vier torens in Osdorp zijn openbaar. De rest zijn woningen en scholen in bedrijf, te bekijken vanaf de straat; na schooltijd of in het weekend is het er het rustigst.

    Cornelis van Eesteren stond aan de wieg van het Algemeen Uitbreidingsplan van 1934, en na de oorlog verrezen de Westelijke Tuinsteden volgens zijn plannen: open bebouwing in het groen, portiekflats, scholen midden in de buurt. Deze eeuw gingen ze op de schop. De tocht volgt die vernieuwing ruwweg in twee golven. In Slotermeer en Osdorp zie je de eerste: blokken uit de jaren vijftig en zestig gesloopt, en ervoor in de plaats gebouwen die elk iets anders proberen, van het uitgeholde blok van MVRDV tot rijtjeshuizen met een glazen voorgevel. De vernieuwing van de Wildemanbuurt liep vast in de crisis van 2009, en vanaf daar laat de tocht de andere weg zien: een school, een portiekflat en een buurthuis die bleven staan en werden omgebouwd, en richting Lelylaan nieuwe woningen voor jongeren en gezinnen, ingepast tussen wat er al stond.
stops:
  - place: Van Eesteren Museum
    narration: |
      Start at the museum of the plan you are about to ride through. This spot on the Sloterplas was set aside for a cultural pavilion in Van Eesteren's own 1939 plan for Tuinstad Slotermeer, and it stayed empty for almost eighty years, until Korteknie Stuhlmacher's pavilion opened here in 2017. The museum itself was founded in 2010 by heritage groups and residents, after housing corporations announced plans to renovate heavily or demolish hundreds of homes around here.

      That tension, keep or replace, runs through the whole ride. Look at the dark timber cladding, broad profiled boards below and narrow lettered boards above, which lets the building half disappear into the park. On the east side stands an Aldo van Eyck climbing frame, saved from Osdorp with €6,000 of crowdfunding.
    nl: |
      Je begint bij het museum over het plan waar je zo doorheen fietst. Deze plek aan de Sloterplas had Van Eesteren al in zijn plan voor Tuinstad Slotermeer van 1939 gereserveerd voor een cultureel paviljoen. Bijna tachtig jaar bleef de kavel leeg, tot hier in 2017 het paviljoen van Korteknie Stuhlmacher openging. Het museum zelf werd in 2010 opgericht door erfgoedclubs en bewoners, nadat woningcorporaties plannen hadden gemaakt om honderden woningen in de buurt flink te verbouwen of te slopen.

      Behouden of vervangen: die vraag loopt door de hele tocht. Kijk naar de donker gebeitste houten gevel, onderaan brede geprofileerde planken, bovenaan smalle planken met sierletters, waardoor het gebouw half oplost in het park. Aan de oostkant staat een klimrek van Aldo van Eyck, met 6000 euro aan crowdfunding gered uit Osdorp.
    next:
      directions: Ride north-west to the Eendrachtspark and look at Parkrand first from the park side.
      nl: Fiets naar het noordwesten, naar het Eendrachtspark, en bekijk Parkrand eerst vanaf de parkkant.
  - place: Parkrand (MVRDV)
    narration: |
      Parkrand, completed in 2007, was meant to kick-start the renewal of the northern garden cities. Three L-shaped slabs stood here; MVRDV replaced them with one huge block of about 225 homes and then punched three holes through it, so the streets behind keep their view of the park and light gets deep inside. You can also read it as five towers on a plinth, joined at the top by bridges of flats.

      From the park, compare the two skins: dark and rough outside, with jutting balconies, and white glazed brick inside the holes, with a faint pattern of crosses. Up in the holes hang Richard Hutten's chandeliers and giant lampshades, furniture for the residents' shared outdoor rooms. It is the opposite of the open garden-city layout, and the next stop answers it quite differently.
    nl: |
      Parkrand, opgeleverd in 2007, moest de vernieuwing van het noordelijke deel van de Westelijke Tuinsteden op gang brengen. Hier stonden drie L-vormige flats; MVRDV zette er één groot blok van zo'n 225 woningen voor in de plaats en sloeg er drie gaten in, zodat de straten erachter zicht houden op het park en het daglicht diep naar binnen valt. Je kunt het ook lezen als vijf torens op een plint, bovenin verbonden door bruggen met woningen.

      Vergelijk vanuit het park de twee huiden: buiten donker en ruw, met uitstekende balkons, in de gaten wit geglazuurde steen met een vaag kruispatroon. In de gaten hangen de kroonluchters en reuzenlampenkappen van Richard Hutten, meubilair voor de gezamenlijke buitenkamers van de bewoners. Het is het tegendeel van de open tuinstad, en de volgende stop pakt het heel anders aan.
    next:
      directions: Ride south to the Confuciusplein.
      nl: Fiets naar het zuiden, naar het Confuciusplein.
  - place: Averroes, Confuciusplein
    narration: |
      Where Parkrand made one giant out of three slabs, Van Sambeek & van Veen went back to the garden city's own language. The Confuciusplein stayed the centre of four neighbourhoods when the area was renewed; their two housing buildings, finished in 2009, were meant to bring back the greenery the garden cities were known for. Averroes is the one standing on its own on the square.

      Look at how it stands: a simple, solid volume free in the open space, stepping down from five storeys on the square to two in the streets behind. The horizontal brick lines of the 1950s blocks around it return in a modern form, with big frames marking each home and loggias folded back into them. The square of trees in front is part of the design.
    nl: |
      Waar MVRDV van drie flats één reus maakte, greep Van Sambeek & van Veen terug op de taal van de tuinstad zelf. Bij de vernieuwing bleef het Confuciusplein het hart van vier woonbuurten; hun twee woongebouwen, klaar in 2009, moesten het groen terugbrengen waar de tuinsteden om bekend stonden. Averroes is het blok dat los op het plein staat.

      Kijk hoe het er staat: een eenvoudig, stevig volume, vrij in de open ruimte, aflopend van vijf lagen aan het plein tot twee in de straten erachter. De horizontale lijnen van de gemetselde jaren-vijftigblokken eromheen komen in moderne vorm terug: grote kaders lichten elke woning uit, met de loggia's erin teruggevouwen. Het vierkant van bomen voor het gebouw hoort bij het ontwerp.
    next:
      directions: Ride south-west, about 2 km, to the Osdorper Ban in Osdorp.
      nl: Fiets zo'n 2 kilometer naar het zuidwesten, naar de Osdorper Ban in Osdorp.
  - place: Nieuw Reimerswaal, school and homes (Mecanoo)
    narration: |
      You are now in Osdorp, on the edge of the garden cities. The Reimerswaalbuurt was rebuilt as nine housing blocks, and Mecanoo's, finished in 2011, was the first. In the garden city a school stood apart in the green; here it is stacked into the housing.

      From the Osdorper Ban the block reads as homes, in varied brick with balconies. The tall base holds a primary school, a sports hall, two playgroups, a day nursery and a care post, each with its own door, with 51 flats on top. The giveaway is the band of glass panels around the base, printed by the artist Elspeth Pikaar with the pupils' own texts and drawings. Behind, the block steps down from six storeys to three around a green courtyard shared by residents and pupils.
    nl: |
      Je bent nu in Osdorp, aan de rand van de tuinsteden. De Reimerswaalbuurt kreeg negen nieuwe woonblokken, en dat van Mecanoo, klaar in 2011, was het eerste. In de tuinstad stond een school los in het groen; hier zit hij onder de woningen.

      Vanaf de Osdorper Ban lijkt het een woongebouw, met afwisselend metselwerk en balkons. In de hoge plint zitten een basisschool, een sporthal, twee peuterspeelzalen, een kinderdagverblijf en een zorgsteunpunt, elk met een eigen ingang, en daarboven 51 appartementen. Wat de school verraadt, is het lint van glazen panelen rond de plint, waarop kunstenaar Elspeth Pikaar teksten en tekeningen van de leerlingen drukte. Aan de achterkant zakt het blok van zes naar drie lagen, rond een groene binnenhof voor bewoners en leerlingen samen.
  - place: De Hood
    narration: |
      A few steps away, in the green strip, stands the youth centre built in the same renewal, for the same clients, Ymere and Bouwfonds, and opened in the same year. Neighbours feared it would bring trouble, and Atelier Kempe Thill answered with two opposite floors. The ground floor is glass all round, with panes five metres long, so the neighbourhood can look straight in and the tree canopy becomes part of the room. The upper floor is closed and lit only from above: a room the young people have to themselves.

      The glass ate the budget, which is why the upper walls are sprayed polyurethane, the lumpy white skin you see. Remember the architects: Kempe Thill turn up again later in Osdorp, with houses that are almost all window.
    nl: |
      Een paar stappen verderop, in de groenstrook, staat het jongerencentrum van dezelfde vernieuwing, voor dezelfde opdrachtgevers, Ymere en Bouwfonds, en in hetzelfde jaar geopend. Omwonenden waren bang voor onrust, en Atelier Kempe Thill antwoordde met twee tegengestelde lagen. De begane grond is rondom van glas, met ruiten van vijf meter, zodat de buurt zo naar binnen kijkt en de boomkruinen bij de ruimte horen. De verdieping erboven is dicht en krijgt alleen licht van boven: een domein van de jongeren zelf.

      Het glas slokte het budget op, en daarom is de bovenbouw bespoten met polyurethaan: de hobbelige witte huid die je ziet. Onthoud de architecten: Kempe Thill komen verderop in Osdorp terug, met huizen die bijna helemaal uit raam bestaan.
  - place: Station Wildeman
    narration: |
      Here the ride turns from rebuilding to keeping. The renewal of the Wildemanbuurt stalled in the 2009 recession, and the 1960s Kraemerschool in its middle was left standing. In 2020 Stichting Samenwonen-Samenleven, the foundation behind the Ru Paré Community in Slotervaart, took the lease, and BETA remade the school with a few moves.

      Find the new entrance at the south end, facing the Osdorper Ban; it used to be tucked away between the two stairwells. Look at the brick bands alternating with shiny corrugated metal, and the letter W that turns up all over. The additions are designed to be taken apart again. Walk into the foyer: it is public. The BNA jury pointed out that public buildings of this post-1965 kind are often demolished.
    nl: |
      Hier slaat de tocht om van herbouwen naar behouden. De vernieuwing van de Wildemanbuurt liep vast toen in 2009 de crisis toesloeg, en de Kraemerschool uit de jaren zestig midden in de buurt bleef staan. In 2020 tekende Stichting Samenwonen-Samenleven, die eerder de Ru Paré Community in Slotervaart maakte, het huurcontract, en BETA bouwde de school met een paar ingrepen om.

      Zoek de nieuwe ingang aan de zuidkant, richting Osdorper Ban; vroeger lag hij verstopt tussen de twee trappenhuizen. Kijk naar de banden metselwerk die afwisselen met glimmende golfplaat, en naar de letter W die overal opduikt. Alles wat is toegevoegd kan later weer los. Loop gerust de foyer in, die is voor iedereen. De jury van BNA Gebouw van het Jaar wees erop dat zulke openbare gebouwen van na 1965 vaak gesloopt worden.
    next:
      directions: Ride south to the Hoekenesgracht.
      nl: Fiets naar het zuiden, naar de Hoekenesgracht.
  - place: Cadiz, Hoekenesgracht
    narration: |
      Back to the first wave. Where duplex flats stood, Abbink X De Haas built 69 homes in 2008, most of them for sale: Osdorp's renewal wanted other kinds of homes than the usual walk-up flats, and a neighbourhood with its own character.

      Look along the canal. The nine low white blocks stand at right angles to the water, so the view along it stays open, and each ends in a house with big windows onto the canal. White render, wooden shutters that residents open or close as they like, and railings designed for the project, some screening car parks with gardens on top, give the place what Arcam calls a Mediterranean air. Karres en Brands designed the public space, which runs on into their Botteskerkpark.
    nl: |
      Terug naar de eerste golf. Waar duplexwoningen stonden, bouwde Abbink X De Haas in 2008 69 woningen, de meeste te koop: bij de vernieuwing van Osdorp wilde men andere woonvormen dan de gebruikelijke portiekflats, en een buurt met een eigen gezicht.

      Kijk langs de gracht. De negen lage witte blokken staan haaks op het water, zodat het zicht erlangs vrij blijft, en elk blok eindigt in een woning met grote ramen op de gracht. Wit stucwerk, houten luiken die bewoners naar believen open- of dichtdoen, en speciaal ontworpen hekken, voor een deel voor parkeergarages met tuinen erop, geven de buurt wat Arcam een mediterrane sfeer noemt. De openbare ruimte is van Karres en Brands en loopt door in hun Botteskerkpark.
  - place: Brede School De Kikker
    narration: |
      Now a new school, and a colourful one. Finished in 2006, De Kikker is a brede school (community school): two primary schools, a day nursery and a post of the municipal health service under one roof. The bright green façade panels have glitter in them, over a plinth of purple-blue brick.

      Behind the colour the plan is strict, and it follows Van Eesteren's 1957 layout for Osdorp: a rectangular core and two separate blocks, linked by footbridges. Spot the bridges, and on the older pupils' playground the big stair that doubles as a grandstand. Inside, the structure, floors and much of the fitting-out are spruce, which Arcam notes was still rare in the Netherlands at the time. Timber returns at the next school, but reused.
    nl: |
      Nu een nieuwe school, en een kleurrijke. De Kikker, klaar in 2006, is een brede school: twee basisscholen, een crèche en een post van de GGD onder één dak. De felgroene gevelplaten hebben glitters, boven een plint van paarsblauwe baksteen.

      Achter de kleur zit een strenge opzet, die past in het plan dat Van Eesteren in 1957 voor Osdorp maakte: een rechthoekige kern en twee losse blokken, verbonden door luchtbruggen. Zoek de bruggen, en op de speelplaats van de oudere kinderen de brede trap die ook tribune is. Binnen zijn draagconstructie, vloeren en veel van de inrichting van vurenhout; volgens Arcam was zoveel hout in één gebouw toen nog ongewoon in Nederland. Bij de volgende school komt het hout terug, maar dan tweedehands.
  - place: Basisschool De Wereldburger
    narration: |
      Fifteen years after De Kikker, this 1965 school chose not to build anew. Moke Architecten kept the concrete frame and wrapped it in metal cladding, a lot of wood and big windows, finished in 2021.

      From the street, look for the large windows of the assembly hall. Inside it is a stepped wooden grandstand built from the thick façade timbers of Tripolis, Aldo and Hannie van Eyck's offices on the Zuidas, which MVRDV was converting at the time; the hall floor comes from an old gym. So Van Eyck, whose climbing frame stood at the start of the ride, turns up again here in reused wood. The wide new pavement in front ties the school to the street. It won the public prize of the Amsterdam Architecture Prize 2022.
    nl: |
      Vijftien jaar na De Kikker koos deze school uit 1965 bewust niet voor nieuwbouw. Moke Architecten liet het betonnen skelet staan en kleedde het in met metalen gevelplaten, veel hout en grote ramen, klaar in 2021.

      Zoek vanaf de straat de grote ramen van de aula. Daarbinnen staat een houten tribune, gemaakt van dikke gevelbalken van Tripolis, het kantorencomplex van Aldo en Hannie van Eyck op de Zuidas dat MVRDV toen aan het verbouwen was; de vloer van de aula komt uit een oude gymzaal. Van Eyck, van wie het klimrek bij de start stond, duikt hier dus weer op, in tweedehands hout. De brede nieuwe stoep verbindt de school met de straat. De school won de publieksprijs van de Amsterdamse Architectuur Prijs 2022.
  - place: Hartenlust town houses (Kempe Thill)
    narration: |
      Kempe Thill again, three years before De Hood. In 2008 they replaced a row of flats with 23 terraced houses, each 4.80 metres wide, the minimum the building rules allow, and very deep. A narrow front means less façade, the costliest part of a building, so the houses were cheaper to build. To get daylight that far in, the fronts are almost all glass, which is why they are sometimes called shop-window houses.

      Look down the row: kitchens right behind the glass, sliding front doors, everything sprayed the same pale colour. Then look at the back, where garages open onto a lane under the first-floor terraces. Glass to show what happens inside, at De Hood and here: the same idea, put to work for families instead of teenagers.
    nl: |
      Weer Kempe Thill, drie jaar voor De Hood. In 2008 vervingen ze een rij flats door 23 rijtjeshuizen van elk 4,80 meter breed, het minimum uit het Bouwbesluit, en heel diep. Een smalle voorkant betekent minder gevel, het duurste deel van een gebouw, dus de huizen waren goedkoper te bouwen. Om daglicht tot achterin te krijgen, zijn de voorgevels vrijwel helemaal van glas; daarom heten ze ook wel etalagewoningen.

      Kijk de rij langs: de woonkeuken pal achter het glas, schuivende voordeuren, alles in dezelfde lichte kleur gespoten. Kijk dan aan de achterkant, waar garages uitkomen op een straatje onder de terrassen van de eerste verdieping. Glas om te laten zien wat er binnen gebeurt, bij De Hood en hier: hetzelfde idee, maar nu voor gezinnen in plaats van jongeren.
  - place: Four Towers Osdorp (Aquamarijn)
    narration: |
      At the southern tip of Osdorp the renewal put low houses like Hartenlust in the middle and taller blocks along the edges. These are the tall ones: four white slabs of eleven storeys by Wiel Arets, with 390 flats, standing well apart like slabs in a park.

      Each tower is lifted at both ends, one end over a new waterway with small islands and bridges, the other over the road to the parking garages. The garage roofs are a public park with a walk along the water, so you can see the towers up close. Watch how the window bands and aluminium panels shift across the façades. Arcam sees an echo of J.F. Berghoef's post-war flats on the Cornelis Lelylaan in their rhythm, and that is where the ride ends.
    nl: |
      Aan de zuidpunt van Osdorp kwamen bij de vernieuwing rijtjeshuizen zoals Hartenlust in het midden en hogere gebouwen aan de randen. Dit zijn de hoge: vier witte schijven van elf verdiepingen van Wiel Arets, met 390 woningen, ver uit elkaar als schijven in een park.

      Elke toren is aan beide kanten opgetild: het ene eind boven een nieuwe watergang met eilandjes en bruggetjes, het andere boven de weg naar de parkeergarages. Op de garagedaken ligt een openbaar park met een pad langs het water, dus je komt er van dichtbij langs. Kijk hoe raamstroken en aluminium platen over de gevels verspringen. Arcam ziet in het ritme iets van de naoorlogse flats van J.F. Berghoef aan de Cornelis Lelylaan, en daar eindigt de tocht.
    next:
      directions: The longest leg. Ride east, about 3 km, back into Slotervaart, to the U.J. Klarenstraat.
      nl: De langste etappe. Fiets zo'n 3 kilometer naar het oosten, terug naar Slotervaart, naar de U.J. Klarenstraat.
  - place: Klussen op de Klarenstraat
    narration: |
      The Staalmanpleinbuurt was built to Van Eesteren's plan, and in this century much of it was demolished and rebuilt. This 1956 walk-up block by Ernest Groosman, one of the most productive architects of the reconstruction years, was not. Its owner, De Alliantie, sold it to 30 buyers, who became the client together, renewed the shell, and then each fitted out their own home.

      Look at the plinth: where storerooms and garages were, there are now homes with front doors on the street. Then the façade, with balconies hung on afterwards. Forty identical flats of about 75 m² became homes of 40 to 190 m², hardly two alike. The architects call it the first post-war walk-up block in the Netherlands renovated this way. It won the Amsterdam Architecture Prize 2015.
    nl: |
      De Staalmanpleinbuurt is gebouwd volgens het plan van Van Eesteren, en deze eeuw is er veel van gesloopt en opnieuw gebouwd. Dit portiekblok van Ernest Groosman uit 1956, een van de architecten die in de wederopbouw het meest bouwden, niet. Eigenaar De Alliantie verkocht het aan dertig kopers, die samen opdrachtgever werden, het casco lieten opknappen en daarna ieder hun eigen woning afmaakten.

      Kijk naar de plint: waar bergingen en garages zaten, zijn nu woningen met een voordeur aan de straat. Dan de gevel, met balkons die er later aan gehangen zijn. Van veertig gelijke flats van zo'n 75 m² werden woningen van 40 tot 190 m², bijna geen twee hetzelfde. Volgens de architecten is het de eerste naoorlogse portiekflat in Nederland die zo is verbouwd. Het blok won de Amsterdamse Architectuur Prijs 2015.
  - place: Tuinstede, Delflandpleinbuurt (Snitker/Borst)
    narration: |
      A few streets east, the Delflandpleinbuurt took a third path. In 2008 Snitker/Borst replaced the repeated open blocks typical of the garden cities with three closed urban blocks around large shared gardens. Theirs, Tuinstede, was finished in 2011.

      It is closed, but it keeps what the 1950s did well: big glass fronts and generous flats. Look through one of the two gates into the birch garden, where the trees grow in real soil because the car park is only half sunk. Note the black cladding on the two lower floors, houses with their own front doors and living rooms 4.25 metres high, and the white flats above. Compare it with Averroes: both answer the 1950s, one by standing free, this one by closing the block.
    nl: |
      Een paar straten oostelijker koos de Delflandpleinbuurt een derde weg. In 2008 verving Snitker/Borst de open stempels, zo typerend voor de tuinsteden, door drie gesloten bouwblokken met grote gemeenschappelijke tuinen. Hun eigen blok, Tuinstede, was in 2011 klaar.

      Het is gesloten, maar houdt vast aan wat de jaren vijftig goed deden: grote glazen puien en royale woningen. Kijk door een van de twee poorten naar de berkentuin, waar de bomen in de volle grond staan omdat de garage maar half verdiept ligt. Let op het zwart van de onderste twee lagen, woningen met een eigen voordeur en een woonkamer van 4,25 meter hoog, en het wit van de appartementen erboven. Vergelijk het met Averroes: allebei een antwoord op de jaren vijftig, het ene door vrij te staan, dit door het blok te sluiten.
  - place: Pondok
    narration: |
      In the same neighbourhood, a building made by its residents. Pondok's future occupants, a self-build group from Amsterdam's squatting scene, were its client, and it took almost ten years, through the crisis, before it was completed in 2018 with the architect Tom Jonker of CRUQ.

      The patchwork façade tells the story: each of the live-work units on the upper three floors was designed by its own resident. At the back run wide open galleries, meant for running into the neighbours. The ground floor is kept for uses that serve the neighbourhood, paid for partly by crowdfunding. Like the Klarenstraat, this is collective private commissioning, but here the group built from scratch rather than taking over an old block.
    nl: |
      In dezelfde buurt een gebouw dat de bewoners zelf maakten. De latere gebruikers van Pondok, een zelfbouwgroep uit de Amsterdamse krakerswereld, waren samen opdrachtgever, en het duurde bijna tien jaar, dwars door de crisis, voor het in 2018 klaar was, met architect Tom Jonker van CRUQ.

      De lappendeken van gevels vertelt het verhaal: elke woon-werkunit op de bovenste drie verdiepingen ontwierp de bewoner zelf. Aan de achterkant lopen brede, open galerijen waar je de buren tegenkomt. De begane grond is voor functies voor de buurt, deels betaald met crowdfunding. Net als aan de Klarenstraat is dit collectief particulier opdrachtgeverschap, maar hier bouwde de groep zelf nieuw in plaats van een oud blok over te nemen.
    next:
      directions: Ride north to station Lelylaan.
      nl: Fiets naar het noorden, naar station Lelylaan.
  - place: Westbeat and the dancers' Super Space (Lelylaan)
    narration: |
      By station Lelylaan the garden city gets denser. Studioninedots' Westbeat, completed in 2020, carries 150 flats for young city dwellers on 86 brick arches. Underneath is one public hall of 65 by 50 metres and 8.5 metres high, which the architects call a "wandervoid": room left open for uses nobody planned.

      Ride around it and look through the arches, widest at the corners. Since 2021 the dance company ICK Dans Amsterdam rehearses and performs here, so you may see dancers at work behind the glass; there are weekly open programmes and open rehearsals. Facing the Cornelis Lelylaan, the block doubles as a noise screen with green galleries. Like Station Wildeman's foyer and Pondok's ground floor, this hall gives the street level back to the neighbourhood.
    nl: |
      Bij station Lelylaan wordt de tuinstad dichter. Westbeat van Studioninedots, opgeleverd in 2020, draagt 150 woningen voor jonge stedelingen op 86 gemetselde bogen. Daaronder ligt één openbare hal van 65 bij 50 meter en 8,5 meter hoog, wat de architecten een "wandervoid" noemen: ruimte die openblijft voor gebruik dat niemand bedacht.

      Fiets eromheen en kijk door de bogen, op de hoeken het wijdst. Sinds 2021 repeteert en speelt dansgezelschap ICK Dans Amsterdam hier, dus misschien zie je dansers aan het werk achter het glas; er zijn wekelijks open programma's en open repetities. Aan de Cornelis Lelylaan werkt het blok als geluidsscherm, met groene galerijen. Net als de foyer van Station Wildeman en de begane grond van Pondok geeft deze hal het straatniveau terug aan de buurt.
  - place: Cornelis
    narration: |
      The last stop, just behind the Cornelis Lelylaan, is the newest, finished in 2025. The city's tender asked for a building that would keep young families in the city; FARO architecten and Van Bergen Architectura answered with 85 homes and a plan called Tikkertje Trap ("stair tag").

      On the Schielandplein side, look for the azobé timber galleries hung off the façade with no supports on the ground, and the stair garden with wooden slides beside the stairs, using the three-metre drop across the site. The architects say the routes recall the galleries of post-war slab blocks, where children played: so the ride ends where it began, with the garden city's ideas, reworked. Note the grey-green brick, developed for this building. Station Lelylaan is close by.
    nl: |
      De laatste stop, net achter de Cornelis Lelylaan, is de nieuwste, klaar in 2025. De gemeente zocht via een tender een gebouw dat jonge gezinnen in de stad houdt; FARO architecten en Van Bergen Architectura kwamen met 85 woningen en het plan Tikkertje Trap.

      Zoek aan de kant van het Schielandplein de galerijen van azobéhout die buiten de gevel hangen, zonder poten op de grond, en de traptuin met houten glijbanen naast de trappen, die de drie meter hoogteverschil op het terrein benut. De architecten zien er de galerijen van de naoorlogse strokenbouw in terug, waar kinderen speelden: zo eindigt de tocht waar hij begon, bij de ideeën van de tuinstad, opnieuw bewerkt. Let ook op de grijsgroene baksteen, speciaal voor dit gebouw ontwikkeld. Station Lelylaan ligt vlakbij.
