title: The Bijlmer rebuilt and reused
summary: >-
  A bike ride through the renewed Bijlmer, from Grimshaw's station to the steel lantern of
  Kraaiennest: a set workshop and a show house that were kept, a new square, aluminium houses,
  churches for migrant congregations and Kleiburg, the honeycomb slab saved for one euro.
body: |
  **Start:** Station Amsterdam Bijlmer ArenA (train and metro), on the boulevard under the tracks.
  **End:** Metro station Kraaiennest, where the metro takes you back into town.
  **Distance and time:** about 10.5 km, about an hour of cycling. Allow 2.5 to 3 hours with stops.

  You can go into a few of these buildings. The boulevard under the station and the hall of Kraaiennest are open to all, the Bijlmer Sportcentrum is open to the public (you pay to swim or work out), and the shops under De Kameleon are public. The Ziggo Dome and the Bijlmer Parktheater open for events, with a ticket. Wi Eegi Kerki holds its Sunday service at 11:00, and De Kandelaar's congregations meet on Sundays too. Everything else, including the shelter on the Anton de Komplein and all the homes, is seen from the street. Go on a Sunday morning for the churches, or late in the day, when the Ziggo Dome's LED skin, the Parktheater's coloured light and the steel pattern of Kraaiennest light up.

  Kleiburg, finished in 1971, belonged to the honeycomb plan that Siegfried Nassuth of the city planning department drew for the Bijlmermeer: long slabs of gallery flats with raised inner streets linked to parking garages, and homes, shops and parking kept apart. The renewal pulled many of those flats and garages down and put mostly low-rise homes with gardens in their place. This ride looks at what came next, in two halves. West of the railway, round the Arena, a rebuilt station, a concert hall and an office, and two buildings that were due to go and were kept instead. East of it, on the Anton de Komplein and around the Ganzenhoef and Kraaiennest metro stations, the renewal itself: a new square, a shelter, aluminium houses, churches for congregations driven out of the garages, a block of leftover bricks, and the last honeycomb slab in its original form, finished by its own buyers.
mode: bike
nl:
  title: De Bijlmer vernieuwd en hergebruikt
  summary: >-
    Fietstocht door de vernieuwde Bijlmer, van het station van Grimshaw naar de stalen lantaarn
    van Kraaiennest: een decoratelier en een toekomsthuis die bleven staan, een nieuw plein,
    aluminium huizen, migrantenkerken en Kleiburg, de honingraatflat die voor één euro werd gered.
  body: |
    **Start:** station Amsterdam Bijlmer ArenA (trein en metro), op de boulevard onder het spoor.
    **Eind:** metrostation Kraaiennest, vanwaar je met de metro terug de stad in gaat.
    **Afstand en duur:** ongeveer 10,5 kilometer, zo'n uur fietsen. Reken met de stops op 2,5 tot 3 uur.

    In een paar gebouwen kun je naar binnen. De boulevard onder het station en de hal van Kraaiennest zijn vrij toegankelijk, het Bijlmer Sportcentrum is openbaar (zwemmen en fitness zijn betaald) en de winkels onder De Kameleon zijn gewoon open. De Ziggo Dome en het Bijlmer Parktheater gaan open bij voorstellingen en evenementen, met een kaartje. In Wi Eegi Kerki is op zondag om 11.00 uur kerkdienst, en ook in De Kandelaar komen de gemeenten op zondag samen. De rest, ook de opvang aan het Anton de Komplein en alle woningen, bekijk je vanaf de straat. Ga op zondagochtend voor de kerken, of laat op de dag, als de ledgevel van de Ziggo Dome, het gekleurde licht van het Parktheater en het staalpatroon van Kraaiennest aangaan.

    Kleiburg, opgeleverd in 1971, hoorde bij het honingraatplan dat Siegfried Nassuth van de gemeentelijke stedenbouwdienst voor de Bijlmermeer tekende: lange galerijflats met een verhoogde binnenstraat naar de parkeergarage, en wonen, winkelen en parkeren netjes gescheiden. Bij de vernieuwing gingen veel van die flats en garages tegen de vlakte en kwamen er vooral laagbouwwoningen met een tuintje voor terug. Deze rit gaat over wat daarna kwam, in twee helften. Aan de Arenakant van het spoor een vernieuwd station, een concertzaal en een kantoor, en twee gebouwen die zouden verdwijnen en toch bleven. Aan de andere kant, bij het Anton de Komplein en rond de metrostations Ganzenhoef en Kraaiennest, de vernieuwing zelf: een nieuw plein, een opvang, aluminium huizen, kerken voor gemeenten die uit de garages moesten, een blok van restpartijen baksteen, en de laatste honingraatflat in originele staat, afgebouwd door de kopers zelf.
stops:
  - place: Station Amsterdam Bijlmer ArenA
    narration: |
      Start under the tracks, on the 70-metre-wide boulevard that replaced a narrow, dark underpass. Grimshaw and Arcadis rebuilt the 1970s station between 2001 and 2007 while trains and metros kept running. There is no station hall: the eight tracks run on a concrete viaduct about ten metres up.

      Look up at the long slots in the platforms that let daylight down onto the street, and at the raking steel A-frame columns. Then walk your bike to one end and see the roof of steel vaults, some 200 metres long, flying out beyond the last columns.

      The boulevard's real job was to join two sides of the railway, the Amsterdamse Poort shopping centre and the Arena area. The ride starts on the Arena side and comes back through here later, on its way to the other.
    nl: |
      Je begint onder het spoor, op de boulevard van 70 meter breed die een smalle, donkere doorgang verving. Grimshaw en Arcadis bouwden het station uit de jaren zeventig tussen 2001 en 2007 opnieuw op, terwijl trein en metro gewoon bleven rijden. Een echte stationshal is er niet: de acht sporen liggen op een betonnen viaduct, zo'n tien meter boven je hoofd.

      Kijk omhoog naar de lange sleuven in de perrons, waar het daglicht tot op straat valt, en naar de schuine stalen A-kolommen. Loop dan met de fiets aan de hand naar een van de uiteinden: daar steekt het dak van stalen gewelven, ongeveer 200 meter lang, ver voorbij de laatste kolommen uit.

      De eigenlijke opgave was de twee kanten van het spoor te verbinden, winkelcentrum Amsterdamse Poort en het Arenagebied. De rit begint aan de Arenakant en komt hier straks weer langs, op weg naar de overkant.
    next:
      directions: Leave the boulevard on the Arena side. The Ziggo Dome is the black box beside the Johan Cruijff ArenA.
      nl: Verlaat de boulevard aan de Arenakant. De Ziggo Dome is de zwarte doos naast de Johan Cruijff ArenA.
  - place: Ziggo Dome
    narration: |
      Past the stadium stands a building that is almost pure volume. Benthem Crouwel's hall of 2012 holds 17,000 people, built for touring acts that found the Arena or the GelreDome too big and the Heineken Music Hall or Ahoy too small. Stand back and compare its bulk with the Johan Cruijff ArenA next door.

      The black outer skin stands round the hall like a bell jar to keep the bass inside, and LEDs over the whole facade turn it into one big screen, best after dark. The architects call it "single purpose, multi use": it has already been a tennis court, under 80,000 kilos of gravel, and a pop-up restaurant when the pandemic stopped concerts. Keep that idea of a building taking on another life in mind; it comes back all through this ride. Inside only with an event ticket.
    nl: |
      Voorbij het stadion staat een gebouw dat bijna alleen volume is. De zaal van Benthem Crouwel uit 2012 biedt plaats aan 17.000 bezoekers, gebouwd voor tournees waarvoor de Arena of het GelreDome te groot was en de Heineken Music Hall of Ahoy te klein. Ga een eindje terug staan en vergelijk het blok met de Johan Cruijff ArenA ernaast.

      De zwarte buitenschil staat als een stolp om de zaal, zodat de bas binnen blijft, en leds over de hele gevel maken er één groot scherm van, 's avonds op zijn best. De architecten bedachten een gebouw met één doel en veel toepassingen: er lag al eens 80.000 kilo gravel in voor een tennisbaan, en toen de concerten in de pandemie stillagen werd het een pop-uprestaurant. Onthoud dat idee van een gebouw dat iets anders wordt; het komt op deze rit steeds terug. Naar binnen alleen met een kaartje.
    next:
      directions: Ride south-west to the Burgemeester Stramanweg, beside the A2.
      nl: Fiets naar het zuidwesten, naar de Burgemeester Stramanweg langs de A2.
  - place: Rijkswaterstaat office on the A2
    narration: |
      A short detour to the edge of the motorway, for an office that is all about where it stands. Rijkswaterstaat looks after the national roads between Schiphol, Amsterdam and 't Gooi, and its Amsterdam office sits right beside one of them, the A2.

      Atelier Z / Zavrel architecten designed it on a triangular plan for the Noord-Holland directorate, and it was finished in 2001. Find the sharpest corner of the triangle, aimed straight at the motorway, and look at the glass skin wrapped round it. It is still Rijkswaterstaat's Amsterdam office, so this is a look from the road only.

      From here the route turns from new buildings to old ones given a second life, beginning with a red box a few hundred metres east.
    nl: |
      Een kort uitstapje naar de rand van de snelweg, voor een kantoor dat precies op zijn plek staat. Rijkswaterstaat beheert vanuit Amsterdam de rijkswegen tussen Schiphol, Amsterdam en 't Gooi, en het kantoor ligt pal naast een daarvan, de A2.

      Atelier Z / Zavrel architecten ontwierp het voor de directie Noord-Holland op een driehoekige plattegrond; in 2001 was het klaar. Zoek de spitste hoek van de driehoek, die recht op de snelweg wijst, en kijk naar de glazen huid eromheen. Rijkswaterstaat zit er nog steeds, dus je bekijkt het alleen van buiten.

      Vanaf hier gaat de route van nieuwe gebouwen naar oude die een tweede leven kregen, te beginnen met een rood blok een paar honderd meter naar het oosten.
    next:
      directions: Ride east to the Kollenbergweg; you can't miss the red.
      nl: Fiets naar het oosten, naar de Kollenbergweg; het rood valt vanzelf op.
  - place: Decoratelier of Dutch National Opera & Ballet
    narration: |
      This red box is a workshop of 1962 that was kept and built on rather than replaced. The opera company has made its sets on the Kollenbergweg since 1985, the only department of Dutch National Opera & Ballet based outside the centre. VMX Architects finished the remodel in 2013, and low down you can still see the base of the original building.

      The tower rising out of the box is a fly tower of about twenty metres that works exactly like the one in the Muziektheater on the Amstel, so a set can be finished and tried out here in full before it goes into town. Much of the long north facade became glass: the people building, welding and painting get north light, and you can watch them from the street, as in the showrooms nearby. Red paint did the rest, turning a workshop shed into a landmark.
    nl: |
      Dit rode blok is een atelier uit 1962 dat niet werd vervangen, maar verbouwd en uitgebreid. Sinds 1985 maakt het operagezelschap hier zijn decors, als enige afdeling van Nationale Opera & Ballet buiten het centrum. VMX Architects was in 2013 klaar met de verbouwing, en onderaan zie je nog de plint van het eerste atelier.

      De toren die boven het blok uitsteekt is een toneeltoren van zo'n twintig meter, die precies zo werkt als de toren van het Muziektheater aan de Amstel. Zo kan elk decor hier helemaal worden afgebouwd en getest voordat het de stad in gaat. Een groot deel van de lange noordgevel werd glas: wie er bouwt, last en schildert krijgt noorderlicht, en jij kijkt vanaf de straat mee, net als bij de showrooms in de buurt. De felrode verf deed de rest en maakte van een werkplaats een herkenningspunt.
  - place: Living Tomorrow, the "kruimeldief"
    narration: |
      From a workshop that was kept to a building that was never meant to last. UNStudio designed this curving pavilion with Living Tomorrow's own architects as a five-year show house of future living. It opened in December 2003, and after five years it was to be demolished.

      Watch how the low wing bends up into the 32-metre tower in one continuous curve, and look at the ribbed aluminium cladding that earned it the nickname kruimeldief (a handheld vacuum cleaner). Inside, visitors once met a mirror that read out the news and traffic jams, and a fridge that ordered its own shopping.

      Living Tomorrow left in 2008. Instead of demolition, the city bought the building for about seven million euros to keep a grip on the area, and in 2009 the dance-event company ID&T said it would move its head office in. It is closed to the public, but still here.
    nl: |
      Van een atelier dat bleef naar een gebouw dat nooit bedoeld was om te blijven. UNStudio ontwierp dit golvende paviljoen samen met de eigen architecten van Living Tomorrow als Huis van de Toekomst, een tentoonstelling voor vijf jaar. In december 2003 ging het open, en daarna zou het gesloopt worden.

      Kijk hoe de lage vleugel in één doorgaande bocht overgaat in de toren van 32 meter, en naar de geribbelde aluminium gevelplaten, die het gebouw de bijnaam kruimeldief bezorgden. Binnen zagen bezoekers de domotica van toen: een spiegel die nieuws en files doorgaf, een koelkast die zelf boodschappen bestelde.

      In 2008 vertrok Living Tomorrow. In plaats van slopen kocht de gemeente het pand voor ongeveer zeven miljoen euro, om greep te houden op het gebied, en in 2009 maakte ID&T bekend er zijn hoofdkantoor te vestigen. Het is niet openbaar, maar het staat er nog.
    next:
      directions: Ride back to the station, through the boulevard under the tracks to the Bijlmerplein, and on to the Anton de Komplein.
      nl: Fiets terug naar het station, onder het spoor door naar het Bijlmerplein en verder naar het Anton de Komplein.
  - place: Bijlmer Sportcentrum
    narration: |
      Now you are on the other side of the railway, on the Anton de Komplein, where a market is held several times a week. This square is where the renewal of the Bijlmer centre and the F-buurt (F-neighbourhood) next door came together, and the next three stops all stand on it.

      Vera Yanovshtchinsky Architecten's sports centre of 2008 was meant to do social work as well as host sport, so its theme was "see and be seen". Look through the zigzag glass front: swimmers on the ground floor, the gym above them, bright green walls and blue mosaic on the pool floor. Notice the gentle slope up to the entrance, 80 centimetres above the square, and the two closed sides, left blank because housing was planned there from the start. It is open to all; you pay to swim or work out.
    nl: |
      Je staat nu aan de andere kant van het spoor, op het Anton de Komplein, waar een paar keer per week markt is. Hier kwam de vernieuwing van het Bijlmercentrum en de F-buurt ernaast samen, en de volgende drie stops liggen allemaal aan dit plein.

      Het sportcentrum van Vera Yanovshtchinsky Architecten uit 2008 moest ook een sociale rol in de wijk spelen, en daarom was het thema "zien en gezien worden". Kijk door de zigzaggende glazen gevel: beneden de zwemmers, daarboven de fitness, felgroene muren en blauw mozaïek op de bodem van het bad. Let op de flauwe helling naar de entree, tachtig centimeter boven het plein, en op de twee dichte kanten, waar vanaf het begin woningen gepland waren. Iedereen kan naar binnen; zwemmen en fitness zijn betaald.
  - place: "Anton de Komplein shelter (Kempe Thill's Drug Addicts Hotel)"
    narration: |
      Next door stands a kind of building that usually ends up out of sight. Shelters for heroin users tend to be containers on industrial or railway land at the edge of town. This one, commissioned by the housing association Rochdale from Atelier Kempe Thill and opened in 2012, stands between the square, the Nelson Mandelapark and the police station, and it had to fit in without bothering the neighbours. It replaced a night shelter that had caused trouble in the area.

      Look at the fixed windows up to six metres long in slim black frames, and the bands of small green glass mosaic, chosen to match the police station beside it. The lease ran ten years, so the frame was designed to take any other use. It is still a shelter, home to 46 people, and not open to visitors: look from the square.
    nl: |
      Hiernaast staat een soort gebouw dat meestal uit het zicht blijft. Opvang voor heroïnegebruikers belandt doorgaans in containers op een bedrijventerrein aan de rand van de stad. Deze niet: woningcorporatie Rochdale vroeg Atelier Kempe Thill om een gebouw tussen het plein, het Nelson Mandelapark en het politiebureau, dat in de omgeving moest passen en de buurt geen last mocht bezorgen. In 2012 ging het open, en daarmee verdween een nachtopvang waar de buurt over klaagde.

      Kijk naar de vaste ruiten tot zes meter lang in smalle zwarte profielen, en naar de banden klein groen glasmozaïek, gekozen om te kleuren bij het politiebureau ernaast. Het huurcontract liep tien jaar, dus is de draagstructuur zo neutraal dat er ook iets anders in kan. Het is nog altijd een opvang, voor 46 mensen, en niet open voor publiek: bekijk het vanaf het plein.
  - place: Bijlmer Parktheater
    narration: |
      Across the square, at the edge of the Nelson Mandelapark (formerly the Bijlmerpark), Paul de Ruiter Architects' theatre opened in 2009 for four users at once: Circus Elleboog, the Krater Theater, the youth theatre school and the theatre workshop of Zuidoost.

      The elliptical upper floors slide out over the ground floor to cover the entrance, and beside it steps run down to the water like a grandstand, a good place to sit for a minute. The corrugated metal with its timber ribs can be washed in any colour by LEDs at night. Inside, one hall works both as a circus ring with seven metres of clear height and as an ordinary theatre.

      In February 2026 the city decided the building had grown too small and set aside 25 million euros for a new, larger Parktheater on this square. This one is to stay in cultural use.
    nl: |
      Aan de overkant van het plein, aan de rand van het Nelson Mandelapark (vroeger het Bijlmerpark), ging in 2009 het theater van Paul de Ruiter Architects open, voor vier gebruikers tegelijk: Circus Elleboog, het Krater Theater, de Jeugdtheaterschool en de Theaterwerkplaats van Zuidoost.

      De ovale verdiepingen schuiven over de begane grond heen en maken zo de entree overdekt, en ernaast lopen treden als een tribune af naar het water: een mooie plek om even te zitten. De golfplaat met de houten ribben kan 's avonds met leds in elke kleur oplichten. Binnen is de zaal zowel een circuspiste met zeven meter vrije hoogte als een gewone schouwburgzaal.

      In februari 2026 besloot het college dat het gebouw te klein is geworden en trok het 25 miljoen euro uit voor een nieuw, groter Parktheater aan dit plein. Het huidige gebouw blijft een culturele plek.
    next:
      directions: Ride north into the F-buurt, to the Claus van Amsbergstraat.
      nl: Fiets naar het noorden de F-buurt in, naar de Claus van Amsbergstraat.
  - place: F-Side, the aluminium houses of the F-buurt
    narration: |
      The F-buurt shows the main recipe of the renewal: many 1970s gallery flats came down, and mostly low-rise homes with private gardens took their place. F-Side, two closed blocks of 53 social-rent houses finished in 2007, follows that recipe with a twist.

      ONL, the studio of Kas Oosterhuis and the artist Ilona Lénárd, turned a freehand sketch by Lénárd into data, and a shipbuilder cut and pressed the 6-millimetre aluminium panels under computer control, so every panel has its own shape and relief. Follow the lines over the facades and up onto the roofs. There are no front gardens: bell, letterbox and house number sit in bike stands set away from the wall, so nothing hides the drawing.

      Compare it with the kruimeldief by the Arena: the same metal, used for a very different idea.
    nl: |
      In de F-buurt zie je het basisrecept van de vernieuwing: veel galerijflats uit de jaren zeventig gingen tegen de vlakte, en er kwamen vooral laagbouwwoningen met een eigen tuintje voor terug. F-Side, twee gesloten blokken met 53 sociale huurwoningen uit 2007, volgt dat recept, maar met een eigen draai.

      ONL, het bureau van Kas Oosterhuis en beeldend kunstenaar Ilona Lénárd, zette een schets van Lénárd om in gegevens voor de productie. Een scheepsbouwer sneed en vormde de aluminium platen van 6 millimeter computergestuurd, zodat elk paneel een eigen vorm en reliëf heeft. Volg de lijnen over de gevels tot op het dak. Voortuinen zijn er niet: bel, brievenbus en huisnummer zitten in fietsenrekken een eindje voor de gevel, zodat niets de tekening verstopt.

      Vergelijk het met de kruimeldief bij de Arena: hetzelfde metaal, voor een heel ander idee.
    next:
      directions: Ride on north into the E-buurt, to Egoli.
      nl: Fiets verder naar het noorden, de E-buurt in, naar Egoli.
  - place: Nieuw Echtenstein (Egoli-toren)
    narration: |
      In the E-buurt the newest building on this ride stands beside the old Bijlmer: what is left of the honeycomb flat Echtenstein is right next door, so compare the two.

      LEVS architecten put this nine-storey block on a field nobody used, finished in 2023 for Rochdale, with 80 social-rent flats for residents who need different kinds of support. The checkerboard of differently coloured brick is made of leftover batches from other building jobs, which the architects reckon saved about 100 tonnes of CO2, and it is meant to echo the patchwork of cultures in Zuidoost. The grid of balconies and columns carries cables for climbing plants from the park, and shades the windows in summer, so the building needs no active cooling. After a reused workshop and a reused pavilion, here the reuse is down to the single brick.
    nl: |
      In de E-buurt staat het jongste gebouw van deze rit naast de oude Bijlmer: wat over is van de honingraatflat Echtenstein staat er pal naast. Vergelijk ze maar.

      LEVS architecten zette dit blok van negen lagen op een veld waar niemand iets mee deed. In 2023 was het klaar, voor Rochdale, met 80 sociale huurwoningen voor mensen met uiteenlopende ondersteuningsbehoeften. Het dambord van verschillend gekleurde baksteen bestaat uit restpartijen van andere bouwprojecten, wat volgens de architecten grofweg 100 ton CO2 scheelde, en het verwijst naar de culturele lappendeken van Zuidoost. Langs het raster van balkons en kolommen lopen kabels voor klimplanten uit het park, en de balkons houden 's zomers de zon buiten, zodat koeling niet nodig is. Na een hergebruikt atelier en een hergebruikt paviljoen gaat het hergebruik hier tot op de baksteen.
    next:
      directions: Ride east to the Bijlmerdreef. De Kandelaar stands opposite Ganzenhoef metro station.
      nl: Fiets naar het oosten, naar de Bijlmerdreef. De Kandelaar staat tegenover metrostation Ganzenhoef.
  - place: De Kandelaar
    narration: |
      The wavy roof tells you what is inside: each crest is a church hall, one for 400 people and four smaller ones. When the renewal demolished many of the old parking garages, the churches that had met in and under them had to find somewhere else.

      In 2004 the Protestant minister Hans Eschbach proposed one building shared by many migrant congregations. Rochdale built it, Ria Smit Architecten designed it with the pastors of the Ghanaian congregations, and it opened in 2007 as a new head on the Grubbehoeve flat. Extra soundproofing lets services with music and dance run side by side.

      It has not been easy: rent arrears, a write-off, and in 2017 a sale to the biggest tenant, the Pentecost Revival Church, which had itself once worshipped in a Bijlmer garage. On Sunday the music carries out onto the Bijlmerdreef.
    nl: |
      Het golvende dak verraadt wat erin zit: onder elke golf een kerkzaal, één voor 400 mensen en vier kleinere. Toen de vernieuwing veel oude parkeergarages sloopte, moesten de kerken die daarin en daaronder samenkwamen een ander onderkomen zoeken.

      In 2004 kwam de protestantse dominee Hans Eschbach met het idee van één gebouw voor meerdere migrantenkerken. Rochdale bouwde het, Ria Smit Architecten ontwierp het samen met de voorgangers van de Ghanese gemeenten, en in 2007 ging het open als nieuwe kop aan flat Grubbehoeve. De zalen zijn extra geluiddicht, zodat diensten met muziek en dans naast elkaar kunnen.

      Makkelijk ging het niet: huurachterstand, een kwijtschelding, en in 2017 de verkoop aan de grootste huurder, de Pentecost Revival Church, die zelf ooit in een Bijlmerse garage kerkte. Op zondag klinkt de muziek tot op de Bijlmerdreef.
    next:
      directions: Ride south to the Krommehoekstraat.
      nl: Fiets naar het zuiden, naar de Krommehoekstraat.
  - place: Wi Eegi Kerki
    narration: |
      Another church, built the opposite way. While empty churches elsewhere become flats and offices, the Evangelische Broedergemeente (Moravian Church) in Zuidoost, a Protestant congregation with Surinamese roots, wanted a new one, and its members raised the money themselves. The name is Sranan Tongo for "our own church".

      Where De Kandelaar shares five halls among many congregations, this is one congregation's house. 70F architecture (Bas ten Brinke and Carina Nilsson) made it a closed block of mottled yellowish-white brick on a low mound, in use since 2013. Light and white matter in the liturgy: the tower holds a skylight that lights a 13-metre white wall inside. Look for the bell in the tower, the metal letters "wi eegi kerki" by the door and the raised beds edged with stone you can sit on. The Sunday service is at 11:00.
    nl: |
      Weer een kerk, maar precies andersom. Terwijl lege kerken elders woningen of kantoren worden, wilde de Evangelische Broedergemeente in Zuidoost, een protestantse gemeente met Surinaamse signatuur, juist een nieuwe, en de leden brachten het geld zelf op. Wi Eegi Kerki is Sranantongo voor Onze Eigen Kerk.

      Waar in De Kandelaar veel gemeenten vijf zalen delen, is dit het huis van één gemeente. 70F architecture (Bas ten Brinke en Carina Nilsson) maakte er een massief blok van gemêleerde geelwitte steen op een terp van; sinds 2013 is het in gebruik. Licht en wit betekenen veel in de liturgie: via een lichtstraat in de toren valt het licht op een witte wand van dertien meter binnen. Kijk naar de klok in de toren, de metalen letters "wi eegi kerki" naast de ingang en de plantvakken met stenen randen om op te zitten. Op zondag om 11.00 uur is er dienst.
    next:
      directions: Ride north-east to Kleiburg, the long slab beside the metro line.
      nl: Fiets naar het noordoosten, naar Kleiburg, de lange flat langs de metrobaan.
  - place: Kleiburg ("De Flat")
    narration: |
      This is the old Bijlmer, and what it nearly lost. Kleiburg, finished in 1971, is a bent slab some 400 metres long and ten storeys high, part of Nassuth's honeycomb plan. On 4 October 1992 the El Al cargo plane came down on the neighbouring flats, and Kleiburg was evacuated.

      In 2009 Rochdale began moving residents out to demolish it. Local campaigners pushed back, and it was sold for one euro to the DeFlat consortium, which repaired the structure and sold the flats as bare shells that buyers finished themselves. NL Architects and XVW took off the lift shafts added in the 1980s and sandblasted the galleries back to bare concrete. Look along its length, and at the window frames owners picked from a catalogue. In 2017 it won the EU Mies van der Rohe Award, the first building in the Netherlands to do so.
    nl: |
      Dit is de oude Bijlmer, en wat er bijna van verdween. Kleiburg, opgeleverd in 1971, is een geknikte schijf van zo'n 400 meter lang en tien verdiepingen hoog, onderdeel van het honingraatplan van Nassuth. Op 4 oktober 1992 stortte het vrachtvliegtuig van El Al neer op de flats ernaast, en Kleiburg werd ontruimd.

      In 2009 begon Rochdale de bewoners te verhuizen om de flat te slopen. Actievoerders uit de buurt kwamen in verzet, en het gebouw ging voor één euro naar consortium DeFlat, dat de constructie opknapte en de woningen verkocht als kale casco's die de kopers zelf afbouwden. NL Architects en XVW haalden de liftschachten uit de jaren tachtig weg en zandstraalden de galerijen terug tot kaal beton. Kijk langs de hele lengte, en naar de kozijnen die de eigenaren zelf uit een catalogus kozen. In 2017 won de flat de Europese Mies van der Rohe-prijs, als eerste gebouw in Nederland.
    next:
      directions: Ride along the Karspeldreef to the shops under De Kameleon.
      nl: Fiets over de Karspeldreef naar de winkels onder De Kameleon.
  - place: De Kameleon
    narration: |
      The same architects, NL Architects, here answered an old criticism of the Bijlmer: that it kept its functions apart. Finished in 2012, De Kameleon stacks them instead. Shops face the street on the ground floor, two parking decks sit above them, and on top lies a new ground level: a shared garden at exactly the height of the elevated metro, ringed by four floors of flats with zigzag bays and balconies.

      Along the Karspeldreef the wall is closed against the traffic noise; the other side opens to the green. Where Kleiburg is one long, calm slab, this is a crumpled facade of more than 150 metres. The shops are open to all; the garden is for residents. Save the best view for the last stop, from the metro platform.
    nl: |
      Dezelfde architecten, NL Architects, gaven hier antwoord op een oude kritiek op de Bijlmer: dat de functies er gescheiden waren. In De Kameleon, klaar in 2012, liggen ze juist op elkaar. Aan de straat de winkels, daarboven twee parkeerlagen, en bovenop een nieuw maaiveld: een gemeenschappelijke tuin op precies de hoogte van de opgetilde metro, met daaromheen vier woonlagen met zigzaggende erkers en balkons.

      Langs de Karspeldreef is de gevel dicht tegen het verkeerslawaai; aan de andere kant gaat het blok open naar het groen. Waar Kleiburg één lange, rustige schijf is, is dit een gekreukte gevel van ruim 150 meter. De winkels zijn openbaar, de tuin is voor bewoners. Het mooiste uitzicht bewaar je voor de laatste stop, vanaf het metroperron.
  - place: Metro station Kraaiennest
    narration: |
      The ride ends as it began, at a rebuilt station, this time on the metro. Kraaiennest was one of the concrete 1970s stations of the eastern line, reached only by stairs. Maccreanor Lavington kept the platform and track eleven metres up and, by 2012, wrapped the base in stainless steel, its lowest four metres cut in a plant pattern. It lets light through, gives graffiti and fly-posters nothing to work with, and glows like a lantern after dark.

      Take the escalator up and look at the bright red underside of the canopy. From the platform, look through the four-storey hole in De Kameleon's tower into its garden, and along the old concrete viaduct running off on either side. The hall is open to all; the platform needs a ticket, and the metro takes you back into town.
    nl: |
      De rit eindigt zoals hij begon, bij een vernieuwd station, dit keer van de metro. Kraaiennest hoorde bij de betonnen stations van de Oostlijn uit de jaren zeventig, alleen met trappen bereikbaar. Maccreanor Lavington liet het perron en de metrobaan op elf meter hoogte staan en pakte de onderbouw in 2012 in met roestvast staal, waarvan de onderste vier meter is opengewerkt in een plantenmotief. Zo valt er licht door, krijgen graffiti en wildplakkers geen kans, en wordt het station in het donker een lantaarn.

      Ga met de roltrap omhoog en kijk naar de felrode onderkant van de kap. Kijk vanaf het perron door het gat van vier verdiepingen in de toren van De Kameleon naar de tuin, en langs het oude betonnen viaduct aan weerszijden. De hal is vrij toegankelijk; voor het perron heb je een kaartje nodig, en de metro brengt je terug de stad in.
