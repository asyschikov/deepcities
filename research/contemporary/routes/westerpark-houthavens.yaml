title: From the gasworks to the timber harbour
summary: >-
  A walk over old industrial ground in the west: a candle factory turned brick fortress, a poisoned
  gasworks turned park, a street brought back, then the timber docks, where housing stands on piles in
  the IJ, and a pale courthouse on its own peninsula.
body: |
  **Start:** De Meander on the Van der Palmkade, a few minutes' walk from the Frederik Hendrikplantsoen tram stop.
  **End:** the Paleis van Justitie on IJdock, about ten minutes' walk west of Centraal Station.
  **Distance and time:** about 4.5 km. Allow 2 to 2½ hours with stops.

  **What you can go into:** the Westergasfabriek park at any time, and its halls with a cinema, restaurants and event spaces when they are open; the public library in De Meander; the courtyard of Spaarndammerhart, through its two gates (people live there, so keep your voice down); the stair that cuts through the Silodam block to a terrace over the water; and the Paleis van Justitie on weekdays from 8:30 to 17:00, where most hearings are public (bring ID). Everything else is housing, seen from the street. The route is flat. From the Pontsteiger, ferries cross to the NDSM wharf and the Distelweg in Noord if you want to end on the water instead.

  Everything on this walk stands on land that used to work: a candle factory, a gasworks, a school site, a timber harbour, a railway yard. Over 25 years the city turned it into homes and a park, and the architects gave very different answers to the same question of how to build next to old Amsterdam. The first half is brick: Rob Krier's deliberately old-looking fortress, a new street that openly borrows from the Amsterdam School of the Spaarndammerbuurt, and a block for young starters that does the same on a harbour island. Then the walk reaches the IJ, where the buildings stop blending in: a tower that changes shape as you walk round it, a "chest of drawers" on piles, and finally a courthouse in white and grey that stands apart from the brick city on purpose.
mode: walk
nl:
  title: Van de gasfabriek naar de Houthavens
  summary: >-
    Een wandeling over oud bedrijfsterrein in West: van kaarsenfabriek tot bakstenen burcht, van
    vergiftigde gasfabriek tot park, een straat die terugkwam, en dan de Houthavens, met woningen op
    palen in het IJ en een licht gerechtshof op een eigen schiereiland.
  body: |
    **Start:** De Meander aan de Van der Palmkade, een paar minuten lopen van tramhalte Frederik Hendrikplantsoen.
    **Eind:** het Paleis van Justitie op IJdock, zo'n tien minuten lopen ten westen van het Centraal Station.
    **Afstand en duur:** ongeveer 4,5 kilometer, met stops 2 tot 2,5 uur.

    **Naar binnen:** het park van de Westergasfabriek altijd, de hallen met filmtheater, restaurants en zalen als ze open zijn; de openbare bibliotheek in De Meander; de hof van Spaarndammerhart, door de twee poorten (er wonen mensen, dus doe rustig); de trap dwars door het blok op de Silodam naar een terras boven het water; en het Paleis van Justitie, doordeweeks van 8.30 tot 17.00 uur, waar de meeste zittingen openbaar zijn (neem een legitimatiebewijs mee). De rest is woningbouw, te bekijken vanaf de straat. De route is vlak. Bij de Pontsteiger vertrekken ponten naar de NDSM-werf en de Distelweg in Noord, als je liever op het water eindigt.

    Alles op deze wandeling staat op grond waar vroeger gewerkt werd: een kaarsenfabriek, een gasfabriek, een schoolterrein, een houthaven, een rangeerterrein. In zo'n 25 jaar maakte de stad er woningen en een park van, en de architecten gaven heel verschillende antwoorden op dezelfde vraag: hoe bouw je naast het oude Amsterdam? De eerste helft is baksteen: de bewust ouderwetse burcht van Rob Krier, een nieuwe straat die openlijk leent van de Amsterdamse School in de Spaarndammerbuurt, en een blok voor jonge starters dat hetzelfde doet op een haveneiland. Dan kom je aan het IJ, en daar houden de gebouwen op met zich aanpassen: een toren die van vorm wisselt terwijl je eromheen loopt, een ladekast op palen en ten slotte een gerechtshof in wit en grijs dat bewust los staat van de bakstenen stad.
stops:
  - place: De Meander (Rob Krier)
    narration: |
      Start on the Van der Palmkade and look along the water. On a map this is just another closed block, but its fronts fold in and out like a meandering river and rise into towers, each part with a facing of its own. Rob Krier and Christoph Kohl planned it on the site of an 1864 candle factory, built here outside the city because of the fire risk, and it went up between 1998 and 2005: about 275 homes, a library, a school and a car park underneath.

      Krier wanted the "European city" back and called himself a lonely guard of traditional design. The magazine Archis was not convinced and asked whether this new traditionalism invented its tradition rather than continued one. Keep that question in mind: you will meet two more brick blocks on this walk that answer it differently.
    nl: |
      Begin aan de Van der Palmkade en kijk langs het water. Op de plattegrond is dit gewoon een gesloten bouwblok, maar de gevels slingeren in en uit als een rivier en lopen op tot torens, elk deel met een eigen gevelbekleding. Rob Krier en Christoph Kohl tekenden het op de plek van een kaarsenfabriek uit 1864, die hier buiten de stad stond omdat kaarsen maken brandgevaarlijk was. Tussen 1998 en 2005 kwamen er zo'n 275 woningen, een bibliotheek, een basisschool en een parkeergarage onder de grond.

      Krier wilde 'de Europese stad' terug en voelde zich een eenzame schildwacht van de traditionele stedenbouw. Archis vroeg zich af of dit nieuwe traditionalisme zijn tradities niet eerder verzon dan voortzette. Onthoud die vraag: verderop staan nog twee bakstenen blokken die er elk anders op antwoorden.
    next:
      directions: Follow the water north and cross the Haarlemmerweg into the Westergasfabriek.
      nl: Volg het water naar het noorden en steek de Haarlemmerweg over naar de Westergasfabriek.
  - place: Westergasfabriek
    narration: |
      Krier replaced his factory with a fortress. Here the factory stayed. Isaac Gosschalk dressed even the purifier halls of this gasworks of 1883 to 1885 in Dutch Renaissance brick, which is why it looks more like a small town than an industry. When the gas stopped in 1967 the soil was full of tar and cyanide.

      The park you walk through came out of a competition won in 1997 by Kathryn Gustafson with Francine Houben of Mecanoo. The polluted ground was not carted away but moved around the site to make a new relief, and capped. Two routes cross it: a straight axis and a winding "Path of Dreams", past a big events field with a slope to lie on. Park and restored halls opened in 2003. Then head for the railway that the planting softens on the north side.
    nl: |
      Krier verving zijn fabriek door een burcht. Hier bleef de fabriek staan. Isaac Gosschalk gaf zelfs de zuiveringshallen van deze gasfabriek uit 1883-1885 een Hollandse neorenaissance, en daarom lijkt het terrein meer op een stadje dan op een bedrijf. Toen de gasproductie in 1967 stopte, zat de bodem vol teer en cyanide.

      Het park waar je doorheen loopt komt uit een prijsvraag die Kathryn Gustafson in 1997 won met Francine Houben van Mecanoo. De vuile grond werd niet afgevoerd maar binnen het terrein verschoven tot een nieuw reliëf, en afgedekt. Er lopen twee routes doorheen, een rechte as en het slingerende Path of Dreams, langs een groot evenementenveld met een helling om op te liggen. In 2003 gingen park en hallen open. Loop dan naar het spoor, dat aan de noordkant achter water en groen verdwijnt.
    next:
      directions: Leave the park on its north side and cross the railway into the Spaarndammerbuurt, to the Krommeniestraat.
      nl: Verlaat het park aan de noordkant en steek het spoor over naar de Spaarndammerbuurt, naar de Krommeniestraat.
  - place: Spaarndammerhart
    narration: |
      Here the neighbours asked for the past back. In the 1970s most of the Krommeniestraat was pulled down for a school, which itself went around 2014. Residents went to court over the new plans and asked for their old street. They got it, finished in 2021: two closed street walls with a "normal street" between them.

      Compare it with De Meander. Krier invented his own old city; Korth Tielens and Marcel Lok borrowed from the one next door, with waves in the brick, mixed bonds and colours, and gates and lettering that nod to the Amsterdam School of Het Schip round the corner. Arcam called it "Amsterdam School, new style". Walk through a gate into the yellow block's courtyard of green glazed brick, and find Martijn Sandberg's words in the paving: "the old road to the new time; the new road to the old time".
    nl: |
      Hier vroegen de buren om het verleden. In de jaren zeventig verdween het grootste deel van de Krommeniestraat voor een school, die rond 2014 zelf weer werd gesloopt. Bewoners stapten naar de rechter en wilden hun oude straat terug. Die kwam er, in 2021 klaar: twee gesloten straatwanden met een 'normale straat' ertussen.

      Leg het naast De Meander. Krier verzon zijn eigen oude stad; Korth Tielens en Marcel Lok leenden van de stad ernaast, met golven in het metselwerk, wisselende verbanden en kleuren, en poorten en letters die knipogen naar de Amsterdamse School van Het Schip om de hoek. Arcam sprak van 'Amsterdamse School nieuwe stijl'. Loop door een poort de hof van groen geglazuurde steen in het gele blok in en zoek de tekst van Martijn Sandberg in de bestrating: De oude weg naar de nieuwe tijd; De nieuwe weg naar de oude tijd.
  - place: Air cells (Spaarndammertunnel ventilation towers)
    narration: |
      You are standing on a roof. Under the Houthavenpark runs the Spaarndammertunnel, 470 metres covered, opened in February 2018. It took the through traffic below ground so that the old dike could become a local street linking the old neighbourhood behind you with the new Houthavens ahead.

      A tunnel has to breathe, and plain grilles were planned. The city's design review panel wanted something friendlier, so Frank Tjepkema (Tjep.) made these four stainless-steel towers, six metres high, which he calls origami of filigree patterns. Step close: the perforations are microscopic images of leaf cells, a nod to the young trees around you. They were placed in July 2019 and in an emergency must let through up to six cubic metres of air a second. This is the hinge of the walk, from the old brick city to the harbour.
    nl: |
      Je staat op een dak. Onder het Houthavenpark loopt de Spaarndammertunnel, 470 meter overdekt, sinds februari 2018 open. Het doorgaande verkeer ging onder de grond, zodat de oude dijk een buurtstraat kon worden tussen de oude wijk achter je en de nieuwe Houthavens voor je.

      Zo'n tunnel moet kunnen ademen, en er waren gewone luchtroosters bedacht. De welstandscommissie wilde iets vriendelijkers, en dus maakte Frank Tjepkema (Tjep.) deze vier roestvrijstalen torens van zes meter, een origami van filigreinpatronen, zegt hij zelf. Kom dichtbij: de gaatjes vormen microscopische beelden van bladcellen, een knipoog naar de jonge bomen om je heen. In juli 2019 werden ze geplaatst; bij nood moeten ze tot zes kubieke meter lucht per seconde doorlaten. Hier draait de wandeling, van de bakstenen stad naar de haven.
  - place: Lariks
    narration: |
      The first block across the hinge, on the Revaleiland, and the brick is back. Ships once unloaded logs here, so the housing association Lieven de Key named its four buildings on this island after woods. This one is larch, for its light-coloured brick.

      M3H architecten finished it in 2023 as a present-day Amsterdam School, like Spaarndammerhart, but on a harbour island rather than in an old street. Walk round it if you have time: each of its four fronts has its own character, with brick motifs and planes of masonry that fold back. The block is built for young Amsterdammers. Most flats are shared by three starters, each with a room, shower and toilet of their own around a shared kitchen; Arcam gives the basic rent of a room as 253 euros a month. The Gouden Piramide jury praised that in 2024 but questioned the five-year contracts.
    nl: |
      Het eerste blok over de grens, op het Revaleiland, en de baksteen is terug. Hier losten schepen ooit boomstammen, en daarom gaf Lieven de Key haar vier gebouwen op dit eiland namen van houtsoorten. Dit is de lariks, om de lichte steen.

      M3H architecten maakte het in 2023 af als eigentijdse Amsterdamse School, net als Spaarndammerhart, maar dan op een haveneiland in plaats van in een oude straat. Loop er even omheen: elk van de vier voorgevels heeft een eigen karakter, met motieven in het metselwerk en vlakken die terugvouwen. Het blok is voor jonge Amsterdammers. De meeste woningen delen drie starters, ieder met een eigen kamer, douche en wc, samen met een keuken; volgens Arcam is de kale huur van een kamer 253 euro per maand. De jury van de Gouden Piramide prees dat in 2024, maar zette vraagtekens bij de huurcontracten van vijf jaar.
    next:
      directions: Head for the tall tower at the water's edge.
      nl: Loop naar de hoge toren aan het water.
  - place: Pontsteiger
    narration: |
      Now the buildings stop blending in. When the city turned the timber harbour into housing it wanted an icon on the water, and in 2007 Arons en Gelauff won with "Waterpoort" (water gate). The jury liked that it changes shape with where you stand: slim and floating from the Silodam, a gateway from the north bank of the IJ. The crisis stopped it; it was redesigned in 2014 and finished in 2018 and 2019, 92 metres high with 366 flats.

      The block is lifted seven metres above a public courtyard by the water, so walk underneath and look up at the V-shaped steel beams that carry the overhangs, and the bronze-green tiles between the floors. The 25th floor was once a single penthouse of 1,440 m², sold in 2016 for about 16 million euros. Hence its nickname, the "millions building".
    nl: |
      Nu houden de gebouwen op met zich aanpassen. Toen de stad de Houthavens tot woonwijk maakte, wilde ze een blikvanger aan het water, en in 2007 won Arons en Gelauff met Waterpoort. De jury vond het mooi dat het gebouw van vorm wisselt met waar je staat: vanaf de Silodam slank en zwevend, vanaf de noordoever van het IJ een poort. De crisis legde het stil; in 2014 kwam een nieuw ontwerp en in 2018-2019 stond het er, 92 meter hoog met 366 woningen.

      Het blok staat zeven meter boven een openbaar plein aan het water. Loop eronderdoor en kijk omhoog naar de V-vormige stalen balken die de overstekken dragen, en naar de bronsgroene tegels tussen de verdiepingen. De 25e verdieping was ooit één penthouse van 1440 m², in 2016 verkocht voor zo'n 16 miljoen euro. Vandaar de bijnaam Miljoenengebouw.
  - place: Silodam (MVRDV)
    narration: |
      Walk out along the dam on the boardwalk of recycled-plastic planks. This 300-metre breakwater from the late 19th century was the eastern edge of the timber harbour. Its two grain silos were squatted in the 1980s, saved and turned into flats around 2000. The new block at the head, by MVRDV (1998 to 2002), helped pay for all that.

      It stands on piles in the IJ, five metres off the quay: ten storeys, twenty metres deep, filled with stacked "drawers". Each drawer is one housing type for a group of four to eleven homes, with its own corridor, gallery or hall, and each shows on the outside in its own material and window pattern, like a container ship loaded to the brim. Climb the stair that cuts right through the building to the terrace over the water, then look back at the Pontsteiger.
    nl: |
      Loop de dam op, over de vlonder van gerecycled kunststof. Deze strekdam van zo'n driehonderd meter uit het eind van de negentiende eeuw was de oostrand van de Houthavens. De twee graansilo's erop werden in de jaren tachtig gekraakt, ontsnapten aan de sloop en kregen rond 2000 woningen. Het nieuwe blok op de kop, van MVRDV (1998-2002), hielp dat te betalen.

      Het staat op palen in het IJ, vijf meter los van de kade: tien lagen hoog, twintig meter diep, gevuld met gestapelde laden. Elke lade is een woningtype voor een groepje van vier tot elf woningen met een eigen gang, galerij of hal, en elk groepje heeft buiten een eigen gevelmateriaal en raampatroon, als een containerschip dat tot de rand vol is. Neem de trap dwars door het gebouw naar het terras Het Dienblad boven het water, en kijk dan om naar de Pontsteiger.
    next:
      directions: Walk back along the dam and follow the Westerdoksdijk south-east, towards Centraal Station.
      nl: Loop de dam weer af en volg de Westerdoksdijk naar het zuidoosten, richting Centraal Station.
  - place: Westerkaap
    narration: |
      Westerdokseiland was a railway yard until it became a dense new quarter, and Westerkaap (2008) is its second block from the north. After the patchwork of the Silodam this looks quiet: plain red brick outside. The surprise is inside the block, which is built over a car park. The plot is cut into strips running east to west, and the three widest each hold a court lined with low homes that double as workplaces.

      The courts were themed stone, wood and green by DS Landschapsarchitecten, the same landscape firm that laid out the courtyard at Spaarndammerhart. It is housing, so look from outside, at the entrances to the courts marked in bamboo, wood or stone, at DKV's fronts of alternating vertical and horizontal strips, and at the brick relief and double-height frames by Baneke van der Hoeven. The taller wings look out over the IJ and the Westerdok.
    nl: |
      Het Westerdokseiland was rangeerterrein van de spoorwegen voor er een dichtbebouwde wijk kwam, en Westerkaap (2008) is het op een na noordelijkste blok. Na de lappendeken van de Silodam oogt het rustig: buiten sober rood baksteen. De verrassing zit binnen het blok, dat boven een parkeergarage staat. De kavel is verdeeld in stroken van oost naar west, en in de drie breedste ligt telkens een hof met lage woningen waarin je ook kunt werken.

      DS Landschapsarchitecten gaf de hoven hun thema's, steen, hout en groen; hetzelfde bureau legde de hof van Spaarndammerhart aan. Het zijn woningen, dus kijk van buiten: naar de ingangen van de hoven, gemarkeerd met bamboe, hout of steen, naar de gevels van DKV met afwisselend staande en liggende stroken, en naar het baksteenreliëf en de dubbelhoge kaders van Baneke van der Hoeven. De hoge vleugels kijken uit over het IJ en het Westerdok.
  - place: Paleis van Justitie on IJdock
    narration: |
      The walk began in brick and ends in white. Since April 2013 Amsterdam's court of appeal has sat here on IJdock, a peninsula built out into the IJ from the Westerdoksdijk. Claus en Kaan made two buildings, for the public prosecutor and for the court, joined by a footbridge, and dressed them in five pale materials in horizontal bands: natural stone, ceramic, whitewashed concrete, glazed brick and coated steel.

      Arcam reads the pale building, standing apart from the brick city on its own peninsula, as an image of the judiciary's independence. On weekdays from 8:30 to 17:00 you can go in: most hearings are public, so bring ID, report to the ushers' desk and see the marble walls and walnut coffered ceilings. Outside, look for the big V-shaped cut in the neighbouring block, in line with the Keizersgracht.
    nl: |
      De wandeling begon in baksteen en eindigt in wit. Sinds april 2013 zit het gerechtshof Amsterdam hier op IJdock, een schiereiland dat vanaf de Westerdoksdijk het IJ in is gelegd. Claus en Kaan maakten twee gebouwen, voor het Openbaar Ministerie en voor het hof, met een loopbrug ertussen, en gaven ze vijf lichte materialen in horizontale banden: natuursteen, keramiek, gewit beton, geglazuurde baksteen en gecoat staal.

      Arcam ziet in het lichte gebouw, dat op zijn schiereiland los staat van de bakstenen stad, een beeld van de onafhankelijke rechtspraak. Doordeweeks van 8.30 tot 17.00 uur mag je naar binnen: de meeste zittingen zijn openbaar. Neem een legitimatiebewijs mee, meld je bij de bodebalie en zie het marmer en de cassetteplafonds van notenhout. Zoek buiten de grote V-vormige snede in het buurblok, in het verlengde van de Keizersgracht.
