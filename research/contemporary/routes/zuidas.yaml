title: 'The Zuidas: towers, hotels and a passage under the ring road'
summary: >-
  From station RAI to station Zuid along the A10: two stacked hotels, Foster's lattice, MVRDV's
  stone canyon, a courthouse you can walk into and the Mahler 4 towers, ending in the first finished
  piece of the Zuidasdok.
body: |
  **Start:** station RAI (train and metro), at Crossover on the Europaboulevard.
  **End:** station Amsterdam Zuid (train and metro), through the Brittenpassage.
  **Distance and time:** about 4.5 km. Allow about 2.5 hours with stops, longer if you sit in on a hearing or go up to a hotel bar.

  Most of the Zuidas is offices, seen from the street, but more than you might expect lets you in. At nhow Amsterdam RAI the lobby, the tiki bar on the first floor and the restaurant and cocktail bar on the 24th floor are open to anyone; at the Van der Valk hotel (now Hotel Amsterdam Zuidas) restaurant ZUID5 is on the fifth floor; Crossover has a restaurant on the ground floor. Valley's inner garden on the lower levels is open to everyone by design. The AkzoNobel Art Space is free, Monday to Friday 9:00 to 18:00, and the Rechtbank is open on weekdays from 8:00 to 17:00, after a bag check. The Brittenpassage is a public station passage. So come on a weekday afternoon. Giny Vos's White Noise on the telecom mast only shows after dark.

  The Zuidas is the city's business district, strung along the A10 ring road between the RAI and station Zuid. Its towers are capped at 105 metres because of the approach routes to Schiphol, and many of them answer to a masterplan. Walking from east to west you pass two hotels of 2020 on leftover triangles by the motorway, the corporate towers of the 2000s, and newer buildings that mix in homes or had to give the public a ground floor. The walk ends under the ring road, in the passage that is all that has so far been finished of the plan to bury the motorway.
mode: walk
nl:
  title: 'De Zuidas: torens, hotels en een passage onder de ring'
  summary: >-
    Van station RAI naar station Zuid langs de A10: twee gestapelde hotels, het zilveren raster van
    Foster, de stenen kloof van MVRDV, een rechtbank waar je binnenloopt en de torens van Mahler 4,
    tot in het eerste stuk Zuidasdok dat af is.
  body: |
    **Start:** station RAI (trein en metro), bij Crossover aan de Europaboulevard.
    **Eind:** station Amsterdam Zuid (trein en metro), via de Brittenpassage.
    **Afstand en duur:** ongeveer 4,5 kilometer, met stops zo'n tweeënhalf uur. Langer als je een zitting bijwoont of een hotelbar in gaat.

    De Zuidas is vooral kantoor en dus vooral iets voor van buiten, maar je komt op meer plekken binnen dan je zou denken. In nhow Amsterdam RAI zijn de lobby, de tikibar op de eerste verdieping en het restaurant en de cocktailbar op de 24e verdieping voor iedereen open; in het Van der Valk-hotel (nu Hotel Amsterdam Zuidas) zit restaurant ZUID5 op de vijfde verdieping; Crossover heeft een restaurant op de begane grond. De binnentuin van Valley is volgens het ontwerp voor iedereen. De AkzoNobel Art Space is gratis, maandag tot en met vrijdag van 9.00 tot 18.00 uur, en de rechtbank is op werkdagen open van 8.00 tot 17.00 uur, na een controle bij de ingang. De Brittenpassage is gewoon een stationspassage. Kom dus op een doordeweekse middag. White Noise van Giny Vos op de telecommast zie je alleen als het donker is.

    De Zuidas is het zakendistrict van de stad, langs de ringweg A10 tussen de RAI en station Zuid. Hoger dan 105 meter mag er niet gebouwd worden, vanwege de aanvliegroutes van Schiphol, en veel torens volgen een stedenbouwkundig plan. Van oost naar west loop je langs twee hotels uit 2020 op restkavels aan de snelweg, de kantoortorens van de jaren nul en nieuwere gebouwen met woningen erin, of met een begane grond die openbaar moest zijn. De wandeling eindigt onder de ring, in de passage die tot nu toe het enige is wat er af is van het plan om de snelweg onder de grond te leggen.
stops:
  - place: Crossover, offices and starter flats in one brick block
    narration: |
      The walk starts with a brick block, not a tower. Team V Architectuur finished Crossover in 2023 at the corner of the Europaboulevard and the A10 exit, and the city's brief asked for offices, homes and more in one building. Two halves meet at street level: nine office floors on the boulevard side, six floors of homes on the other. The 120 small social flats are a Startblok of De Key, for 60 students starting out and 60 refugees with residence permits.

      Look at the nougat-coloured brick grid, denser or more open depending on what lies behind it. The bricks are strips made from recycled building waste. Toward the motorway the front stays closed against the noise.

      Keep this block in mind. Most of what follows is glass, and most of it was built for offices.
    nl: |
      De wandeling begint met baksteen, niet met een toren. Team V Architectuur leverde Crossover in 2023 op, op de hoek van de Europaboulevard en de afslag van de A10, en de gemeente wilde er kantoren, woningen en meer in één gebouw. Op de begane grond komen twee delen samen: negen kantoorlagen aan de kant van de boulevard, zes woonlagen aan de andere kant. De 120 sociale huurstudio's vormen een Startblok van De Key, voor 60 startende studenten en 60 statushouders.

      Kijk naar het raster van nougatkleurige baksteen, dichter of opener naargelang wat erachter zit. De stenen zijn strips, gemaakt van bouwafval. Naar de snelweg toe blijft de gevel dicht, tegen het geluid.

      Onthoud dit blok. Wat hierna komt is vooral glas, en meestal gebouwd als kantoor.
    next:
      directions: Cross the Europaboulevard to the tower of stacked triangles.
      nl: Steek de Europaboulevard over naar de toren van gestapelde driehoeken.
  - place: nhow Amsterdam RAI, the hotel modelled on the RAI's signal column
    narration: |
      OMA's hotel, opened in January 2020, is three triangular blocks stacked to 91 metres, the middle one turned against the other two. Its model stands in front of the RAI: the Signaal, the triangular advertising column of 1961, which the designer Reinier de Graaf said was then the tallest thing around. The Zuidas towers you are about to walk past have long since overtaken it.

      OMA and the Zuidas office call its 650 rooms the largest hotel in the Benelux. Not everyone was convinced: in June 2020 a Volkskrant headline asked whether the city still needed such a megahotel.

      You can go in. The lobby, the tiki bar on the first floor and, on the 24th floor, a restaurant and a cocktail bar that look out in all directions are open to anyone.
    nl: |
      Het hotel van OMA, open sinds januari 2020, bestaat uit drie driehoekige blokken tot 91 meter hoog, het middelste gedraaid ten opzichte van de andere twee. Het voorbeeld staat voor de RAI: Het Signaal, de driehoekige reclamezuil uit 1961. Volgens ontwerper Reinier de Graaf was die toen het hoogste bouwwerk in de omtrek. De Zuidastorens waar je zo langs loopt, steken er inmiddels ver bovenuit.

      Met 650 kamers is het volgens OMA en Zuidas het grootste hotel van de Benelux. Of Amsterdam zo'n megahotel nog nodig had, vroeg de Volkskrant zich in juni 2020 hardop af.

      Binnenlopen mag. De lobby, de tikibar op de eerste verdieping en op de 24e het restaurant en de cocktailbar, met uitzicht rondom, zijn voor iedereen.
    next:
      directions: Pass under the A10 by the station to the south side, to the Tommaso Albinonistraat.
      nl: Loop bij het station onder de A10 door naar de zuidkant, naar de Tommaso Albinonistraat.
  - place: Van der Valk Hotel Zuidas, the hotel that starts on the fifth floor
    narration: |
      A second hotel of 2020 on a second leftover triangle beside the A10. Wiel Arets had strict rules to work with: nothing underground, nothing too tall because of the approach route to Schiphol, and all parking and loading on the plot. His answer was to stack. The first four floors, level with the motorway embankment, are a car park for 143 cars. The hotel begins on the fifth floor, where the lobby and restaurant ZUID5 look out over the city on every side, and three towers with about 240 rooms stand on top.

      Compare it with nhow: both on triangles, both stacked, one turning its blocks, the other cutting notches for terraces into its towers. Walk round it and watch the triangle change shape. Along the motorway side runs a green wall.
    nl: |
      Een tweede hotel uit 2020 op een tweede driehoekige restkavel aan de A10. Wiel Arets moest met strenge randvoorwaarden werken: niet de grond in, niet te hoog vanwege de aanvliegroute van Schiphol, en parkeren, laden en lossen op eigen terrein. Zijn antwoord was stapelen. De onderste vier lagen, even hoog als het talud van de ring, zijn een parkeergarage voor 143 auto's. Het hotel begint op de vijfde verdieping, waar lobby en restaurant ZUID5 naar alle kanten over de stad kijken, en daarop staan drie torens met zo'n 240 kamers.

      Vergelijk het met nhow: allebei op een driehoek, allebei gestapeld, het ene met gedraaide blokken, het andere met inkepingen voor terrassen. Loop eromheen en zie de driehoek van vorm veranderen. Aan de kant van de snelweg staat een groene wand.
    next:
      directions: The telecom mast stands right beside the hotel.
      nl: De telecommast staat vlak naast het hotel.
  - place: White Noise, a night sky on the telecom tower
    narration: |
      The highest point of the Zuidas is not an office. Nothing here may rise above 105 metres because of Schiphol's approach routes; the telecom mast of 1963 is the one exception. When the offices grew round it, it was raised to 146 metres, finished in 2008 by AGS Schwencke Rosbach Architects with five oval platforms, each a little offset from the next. By day, count the ovals.

      After dark, more than a thousand LEDs by Giny Vos light up at about 120 metres: stars, planets and meteors, with now and then a string of letters and digits, a sign of human communication.

      Heading west you pass the EMA building on the Domenico Scarlattilaan. When Brexit drove the European Medicines Agency out of London, the Dutch state built it this 19-storey office in 18 months, with Gijs Assmann's nine-metre knot of mirrored steel in front.
    nl: |
      Het hoogste punt van de Zuidas is geen kantoor. Hoger dan 105 meter mag hier niets, vanwege de aanvliegroutes van Schiphol; de telecommast uit 1963 is de enige uitzondering. Toen de kantoren eromheen groeiden, ging hij omhoog tot 146 meter, in 2008 klaar, met vijf ovale plateaus van AGS Schwencke Rosbach Architects, elk iets verschoven ten opzichte van het vorige. Overdag tel je de ovalen.

      Als het donker is, gaan op zo'n 120 meter hoogte ruim duizend leds van Giny Vos aan: sterren, planeten en meteoren, en af en toe reeksen letters en cijfers, een teken van menselijke communicatie.

      Op weg naar het westen loop je langs het EMA-gebouw aan de Domenico Scarlattilaan. Toen het Europees Geneesmiddelenbureau door de Brexit uit Londen moest, bouwde de Nederlandse staat er in 18 maanden dit kantoor van 19 verdiepingen voor, met een knoop van spiegelend staal van Gijs Assmann ervoor.
    next:
      directions: Walk west past the EMA building to the Antonio Vivaldistraat.
      nl: Loop westwaarts langs het EMA-gebouw naar de Antonio Vivaldistraat.
  - place: Cross Towers, Foster's silver lattice by the A10
    narration: |
      Where the EMA building was built for speed, this one was built to be noticed. Foster + Partners' first Amsterdam building was completed in 2008 as Drentestaete III, with Ernst & Young, now EY, as main tenant. Foster wanted it picked out on the drive into the city, so a silver-clad steel diagrid runs up the whole 87-metre front and blurs the floors behind it.

      Behind the lattice are two slim office blocks without columns, offset from each other for daylight and the view north, and joined by a glass core: look for the step between them. On the south side, a water court with reeds and water lilies holds back rainwater, as the rules for this polder require.

      This is the Zuidas of the early 2000s: a corporate tower meant to be read from the motorway.
    nl: |
      Het EMA-gebouw moest snel, dit gebouw moest opvallen. Het eerste Amsterdamse gebouw van Foster + Partners kwam in 2008 klaar als Drentestaete III, met Ernst & Young, nu EY, als belangrijkste huurder. Foster wilde dat je het herkende als je de stad binnenreed. Daarom loopt er over de hele gevel van 87 meter een raster van stalen diagonalen, met zilverkleurig aluminium bekleed, waarachter de verdiepingen bijna verdwijnen.

      Achter het raster staan twee smalle kantoorvleugels zonder kolommen, die ten opzichte van elkaar verspringen voor daglicht en uitzicht naar het noorden, verbonden door een glazen kern: let op de sprong ertussen. Aan de zuidkant houdt een waterhof met riet en waterlelies het regenwater vast.

      Dit is de Zuidas van de vroege jaren nul: een kantoortoren die je vanaf de snelweg moest kunnen lezen.
    next:
      directions: Continue west to the Beethovenstraat.
      nl: Loop verder naar het westen, naar de Beethovenstraat.
  - place: Valley, the monkey rock of the Zuidas
    narration: |
      From the Beethovenstraat, Valley looks as glassy as its neighbours. Walk round it and the glass breaks open into a canyon of sand-coloured stone ledges, with trees and shrubs growing many floors up. Winy Maas of MVRDV designed the three towers, of 100, 76 and 66 metres, built from 2017 to 2021: offices, shops and restaurants below, 198 flats from the eighth floor up. The 40,000 stone tiles come from Catalonia, and Piet Oudolf did the planting. Maas called it a cross between an office and a monkey rock.

      By design the inner garden on the lower levels is open to everyone, with stairs linking its heights. Look up for gardeners working on ropes.

      The EMA's architect said that something as complicated as Valley could never have been built in his 18 months.
    nl: |
      Vanaf de Beethovenstraat is Valley net zo glazig als de buren. Loop eromheen en het glas breekt open in een kloof van richels van zandkleurige steen, waar vele verdiepingen hoog bomen en struiken uit groeien. Winy Maas van MVRDV ontwierp de drie torens van 100, 76 en 66 meter, gebouwd tussen 2017 en 2021: onderin kantoren, winkels en horeca, vanaf de achtste verdieping 198 appartementen. De 40.000 natuurstenen tegels komen uit Catalonië, de beplanting is van Piet Oudolf. Maas noemde het een kruising tussen kantoor en apenrots.

      Volgens het ontwerp is de binnentuin op de onderste lagen voor iedereen, met trappen tussen de hoogteverschillen. Kijk omhoog: de hoveniers werken aan touwen.

      Volgens de architect van het EMA-gebouw was iets ingewikkelds als Valley in zijn 18 maanden nooit gelukt.
    next:
      directions: Walk north on the Beethovenstraat, under the ring road, to the Christian Neefestraat.
      nl: Loop over de Beethovenstraat naar het noorden, onder de ring door, naar de Christian Neefestraat.
  - place: "AkzoNobel Art Space: a paint maker's collection you can walk into"
    narration: |
      Zuidas head offices rarely let you past reception. This one has to: when AkzoNobel built here, the city made a public ground floor a firm condition, preferably with something cultural in it. The paint and coatings company put its art collection there. Its foundation, set up in 1996, held about 1,800 works of contemporary art by 2019.

      Before you go in, look at the glass front by GROUP A, completed in 2016. The structural timber in it is lacquered in colours that shift a little from piece to piece, a nod to the client's trade. Inside, the art fills a tall, light atrium, and the team that looks after the collection works in a room hung above the exhibition.

      The Art Space is free, Monday to Friday, 9:00 to 18:00.
    nl: |
      Bij een hoofdkantoor op de Zuidas kom je meestal niet verder dan de receptie. Hier moet het wel: toen AkzoNobel hier bouwde, eiste de gemeente een openbare begane grond, het liefst met iets cultureels erin. Het verf- en coatingsconcern zette er zijn kunstcollectie neer. De stichting, opgericht in 1996, had in 2019 zo'n 1.800 werken hedendaagse kunst.

      Kijk voor je naar binnen gaat naar de glazen gevel van GROUP A, in 2016 opgeleverd. Het dragende hout erin is gelakt in tinten die van stuk tot stuk een beetje verlopen, een knipoog naar wat de opdrachtgever maakt. Binnen hangt de kunst in een hoog, licht atrium, en het team van de collectie werkt in een kamer die boven de tentoonstelling zweeft.

      De Art Space is gratis open, maandag tot en met vrijdag, 9.00 tot 18.00 uur.
    next:
      directions: The courthouse is about ten minutes' walk west, on the Parnassusweg.
      nl: De rechtbank ligt zo'n tien minuten lopen naar het westen, aan de Parnassusweg.
  - place: Rechtbank Amsterdam, the courthouse built to be looked into
    narration: |
      At AkzoNobel the city asked for a public ground floor. Here openness is the point. KAAN Architecten worked from the idea that justice is public business, and you can see it from the square in front, almost half a football pitch with a square pond: through double-height windows you look straight into the public hall.

      The building is stacked in three layers. Cells are underground; the hall, the 50 courtrooms and the cafeteria are on the lower floors; judges' rooms and offices sit higher up around green courtyards, more private the higher you go. Opened in May 2021, with more than 1,000 staff, it is by far the largest of the country's eleven district courts.

      Go in on a weekday, 8:00 to 17:00, after a bag check. Most hearings are public: report at reception, no booking needed.
    nl: |
      Bij AkzoNobel eiste de gemeente een openbare begane grond. Hier is openbaarheid het doel. Rechtspraak is openbaar, vond KAAN Architecten, en dat moest je kunnen zien. Vanaf het voorplein, bijna een half voetbalveld groot met een vierkante vijver, kijk je door ramen van twee verdiepingen hoog zo de publiekshal in.

      Het gebouw is in drie lagen verdeeld. De cellen liggen ondergronds; de publiekshal, de 50 zittingszalen en het restaurant liggen onderin; raadkamers en kantoren zitten hogerop rond groene tuinen, hoe hoger hoe beslotener. Sinds mei 2021 in gebruik, met ruim 1.000 medewerkers, is het verreweg de grootste van de elf rechtbanken van het land.

      Binnenlopen kan op werkdagen van 8.00 tot 17.00 uur, na controle van tas en kleding. De meeste zittingen zijn openbaar: meld je bij de receptie, vooraf aanmelden hoeft niet.
    next:
      directions: Walk to the station entrance on the Eduard van Beinumstraat.
      nl: Loop naar de stationsingang aan de Eduard van Beinumstraat.
  - place: "Brittenpassage: the first finished piece of the Zuidasdok"
    narration: |
      Since the 1990s the plan has been to put the motorway, the railway and the metro under the ground here and build city on the lid. After 2008 only a tunnel for the A10 was left, agreed in 2012 at 1.385 billion euros. The estimate now stands at about 5.4 billion, and in October 2026 the cabinet said it had, for now, no money for the northern tunnel.

      This passage is the part that got done. Seven concrete roof decks were slid in under the A10, the trains and the metro between 2019 and 2024, and it opened on 1 November 2026. Walk through it to the south. Look at the patterned Portuguese stone floor, and at the glass roof over the ways up to the platforms: the clients chose glass on purpose, because people in a tunnel walk towards the light.
    nl: |
      Sinds de jaren negentig is het plan hier snelweg, spoor en metro onder de grond te leggen en op het dak een stuk stad te bouwen. Na 2008 bleef alleen een tunnel voor de A10 over, in 2012 afgesproken voor 1,385 miljard euro. De raming staat nu op ongeveer 5,4 miljard, en in oktober 2026 werd bekend dat het kabinet voorlopig geen geld heeft voor de noordelijke tunnel.

      Deze passage is het deel dat af is. Tussen 2019 en 2024 werden zeven betonnen dakdelen onder de A10, de treinen en de metro geschoven, en op 1 november 2026 ging hij open. Loop erdoorheen naar het zuiden. Let op het patroon in de vloer van Portugese natuursteen, en op het glazen dak boven de opgangen naar de perrons: de opdrachtgevers kozen bewust voor glas, want in een tunnel loopt iedereen vanzelf naar het licht.
    next:
      directions: From the south exit, the glass tower with the notch winding round it is straight ahead.
      nl: Bij de zuidelijke uitgang zie je recht voor je de glazen toren met de kerf die eromheen draait.
  - place: Viñoly, the tower with its fire stairs cut into the facade
    narration: |
      You are now in Mahler 4, the first part of the Zuidas to be developed, a block of office towers to an urban plan by Pi de Bruijn. The plan prescribed each tower's envelope, with the classic base, shaft and crown. The next four stops are four answers to it.

      Rafael Viñoly Architects, with Christina Seilern, wanted the three parts to read as one. Their tools were deep vertical aluminium fins from top to bottom, whose spacing seems to change as you walk round, and an outdoor stair carved into the facade, spiralling round the building. It was meant as an escape route and a way up to roof terraces open to the public. For safety reasons it was shut before the tower opened in 2005. Architectuur.org lists it as Viñoly's first completed design in Europe.
    nl: |
      Je staat nu in Mahler 4, het eerste deel van de Zuidas dat werd ontwikkeld: een groep kantoortorens naar een stedenbouwkundig plan van Pi de Bruijn. Dat plan schreef voor elke toren een plint, een middendeel en een top voor. De volgende vier stops zijn vier antwoorden daarop.

      Rafael Viñoly Architects en Christina Seilern wilden van de drie delen één geheel maken. Dat deden ze met diepe verticale aluminium profielen over de hele hoogte, die dichter of verder uit elkaar lijken te staan naarmate je om de toren loopt, en met een vluchttrap die als een spiraal in de gevel is uitgespaard. Die moest ook naar openbare dakterrassen leiden. Uit veiligheidsoverwegingen ging hij op slot voordat de toren in 2005 in gebruik kwam. Volgens Architectuur.org is het Viñoly's eerste uitgevoerde ontwerp in Europa.
    next:
      directions: Cross the Gustav Mahlerplein to the two orange towers.
      nl: Steek het Gustav Mahlerplein over naar de twee oranje torens.
  - place: Amsterdam Symphony, the orange towers of the property fraud
    narration: |
      The planner of the block designed these himself: two orange towers by Pi de Bruijn, finished in 2009, the taller of 105 metres with homes, the other of 97 metres with offices. The dark red brick block at their foot is a hotel, by other designers.

      Here the story is money. In 2007, while the towers were going up, a subsidiary of the developer Bouwfonds sold them to the Philips pension fund, which according to Het Parool paid far too much. The sale became part of the Klimop case, the property fraud in which, as NRC put it, both the pension fund and Bouwfonds were the victims. The fund then put the 82 flats up for sale in September 2009, in the middle of the financial crisis; the estate agent reported 19 sold in ten weeks.
    nl: |
      De ontwerper van het plan tekende deze zelf: twee oranje torens van Pi de Bruijn, klaar in 2009, de hoogste van 105 meter met woningen, de andere van 97 meter met kantoren. Het donkerrode bakstenen blok aan hun voet is een hotel, van andere ontwerpers.

      Hier draait het verhaal om geld. In 2007, toen de torens nog in aanbouw waren, verkocht een dochter van Bouwfonds ze aan het Philips Pensioenfonds, dat er volgens Het Parool veel te veel voor betaalde. Zo werd het complex onderdeel van de Klimop-zaak, de vastgoedfraude waarbij volgens NRC zowel het pensioenfonds als Bouwfonds werd benadeeld. In september 2009, midden in de crisis, bracht het fonds de 82 appartementen in de verkoop; na tien weken waren er volgens de makelaar negentien verkocht.
    next:
      directions: Toyo Ito's tower is on the west side of the square.
      nl: De toren van Toyo Ito staat aan de westkant van het plein.
  - place: Ito Tower, Toyo Ito on the Gustav Mahlerplein
    narration: |
      Toyo Ito, the Japanese architect who won the Pritzker Prize in 2013, designed this tower of about 100 metres, in work from 2000 to 2005 and among the first parts of Mahler 4 to be finished. The plan gave every architect strict rules, voids inside the buildings among them. Ito's answer is calm: a block with several voids inside, wrapped in horizontal ribbon windows alternating with aluminium panels. After Viñoly's vertical fins, look at how these bands run round the building.

      One of its tenants was the Dutch office of Icesave, the Icelandic bank that collapsed in 2008.

      On the pavement of the square, look for Tom Claassen's black dog, standing without a plinth. It has no official name; Claassen jokingly called it Hildo, after the city sculptor Hildo Krop, whose figures are just as angular.
    nl: |
      De Japanse architect Toyo Ito, die in 2013 de Pritzkerprijs kreeg, ontwierp deze toren van zo'n 100 meter. Het project liep van 2000 tot 2005, en de toren was een van de eerste onderdelen van Mahler 4 die klaar waren. Het plan legde elke architect strenge regels op, onder meer over vides in de gebouwen. Ito's antwoord is rustig: een blok met binnen meerdere vides, en een gevel van liggende stroken ramen met aluminium borstweringen ertussen. Na de verticale profielen van Viñoly zie je hier de banden om het gebouw heen lopen.

      Een van de huurders was de Nederlandse vestiging van Icesave, de IJslandse bank die in 2008 omviel.

      Zoek op de stoep van het plein de zwarte hond van Tom Claassen, zonder sokkel. Officieel heeft hij geen naam; Claassen noemde hem als grap Hildo, naar stadsbeeldhouwer Hildo Krop, wiens beelden net zo hoekig zijn.
    next:
      directions: The Rock stands a short walk west, on the Claude Debussylaan.
      nl: The Rock staat een paar minuten westelijker, aan de Claude Debussylaan.
  - place: The Rock, the top-heavy tower of the Zuidas
    narration: |
      Same rules, opposite answer. Ito kept his tower calm; Erick van Egeraat turned the plan's base, middle and crown into a pile of irregular, twisted blocks of glass, aluminium, stone and concrete, light at the bottom and heavy at the top. The 90-metre tower of 2009 was built for a single law firm.

      Opinions split. In a 2010 poll by the legal news site Advocatie it got 186 of 439 votes as the ugliest of four Zuidas law-firm offices, yet the curved stair in its entrance was voted Staircase of the Year in 2011.

      The firm left in early 2024, and the inside is being renovated for several tenants until the end of 2026, with few changes outside and a new entrance facing the Brittenpassage. That is your way back into the station.
    nl: |
      Dezelfde regels, het omgekeerde antwoord. Ito hield zijn toren rustig; Erick van Egeraat maakte van plint, middenstuk en kroon een stapel grillige, verdraaide blokken van glas, aluminium, steen en beton, onderin licht en bovenin zwaar. De toren van 90 meter uit 2009 werd gebouwd voor één advocatenkantoor.

      De meningen liepen uiteen. Bij een peiling van Advocatie.nl in 2010 kreeg The Rock 186 van de 439 stemmen voor het lelijkste van vier advocatenkantoren op de Zuidas, maar de gebogen trap in de entree won in 2011 de verkiezing Mooiste Trap van het Jaar.

      Begin 2024 vertrok het kantoor, en tot eind 2026 wordt het interieur verbouwd voor meerdere huurders. Buiten verandert weinig, al komt er een entree tegenover de Brittenpassage. Daarlangs ga je terug het station in.
