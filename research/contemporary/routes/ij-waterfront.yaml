title: 'Along the IJ: from Centraal Station to the Eastern Docks'
summary: >-
  From a bicycle garage under the harbour and a tiled tunnel under the station, east along the IJ: a
  library with a free view, a conservatory that bends the light, a concert hall that plays itself, a
  hotel tower that hides its floors and a timber hotel with a tropical garden.
body: |
  **Start:** the Prins Hendrikkade in front of Centraal Station, at the entrance to the bicycle garage under the water.
  **End:** Hotel Jakarta on the western tip of Java-eiland. Tram 26 runs along the Piet Heinkade back to Centraal Station, or walk back in about half an hour.
  **Distance and time:** about 3.5 km, some 50 minutes' walking. Allow about 2 hours with stops, longer if you go up to the library's top floor or sit in the hotel garden.

  Much of this walk is indoors and free. The bicycle garage, the metro hall, the tiled tunnel and the IJhal are open to everyone (the metro platforms need a ticket). The OBA library is open daily, on weekdays from 8:00 and at weekends from 10:00, and its seventh-floor terrace is open from April to October. The Conservatorium lets you in for its concerts. Booking.com's ground-floor restaurant, the Muziekgebouw's café, the Mövenpick's lobby bar and restaurant, and Hotel Jakarta's garden, café and skybar all take walk-ins. The cruise terminal opens only for passengers and events. The route is flat.

  When Centraal Station was finished in 1889, it cut the old city off from the IJ and the north. This walk follows the long effort to put that right. First the tunnels and halls through and behind the station, then the Oosterdokseiland, an island made in 1832 and long a railway yard and post depot, now a library, a music school and an office campus. Then the Oostelijke Handelskade, the old harbour quay, where the cruise terminal of 2000 was one of the first new buildings. The walk ends on Java-eiland, at a timber hotel on the quay where ships once left for Java.
mode: walk
nl:
  title: 'Langs het IJ: van het Centraal Station naar het Oostelijk Havengebied'
  summary: >-
    Van een fietsenstalling onder de haven en een tegeltunnel onder het station langs het IJ: een
    bibliotheek met gratis uitzicht, een conservatorium dat met het licht speelt, een concertzaal die
    zelf muziek maakt, een hoteltoren zonder zichtbare verdiepingen en een houten hotel.
  body: |
    **Start:** de Prins Hendrikkade voor het Centraal Station, bij de ingang van de fietsenstalling onder het water.
    **Eind:** Hotel Jakarta op de westpunt van het Java-eiland. Tram 26 rijdt over de Piet Heinkade terug naar het Centraal Station; teruglopen kost zo'n half uur.
    **Afstand en duur:** ongeveer 3,5 kilometer, zo'n vijftig minuten lopen. Met stops ben je ongeveer twee uur bezig, langer als je naar de bovenste verdieping van de bibliotheek gaat of in de hoteltuin gaat zitten.

    Een groot deel van deze wandeling is binnen en gratis. De fietsenstalling, de metrohal, de tegeltunnel en de IJhal zijn vrij toegankelijk; voor de perrons van de metro heb je een vervoerbewijs nodig. De OBA is elke dag open, doordeweeks vanaf 8.00 uur en in het weekend vanaf 10.00 uur, en het terras op de zevende verdieping van april tot en met oktober. In het Conservatorium kom je bij de concerten. Het restaurant op de begane grond van Booking.com, het café van het Muziekgebouw, de lobby en het restaurant van het Mövenpick en de tuin, het café en de skybar van Hotel Jakarta zijn ook voor voorbijgangers. De cruiseterminal gaat alleen open voor passagiers en evenementen. De route is vlak.

    Met de voltooiing van het Centraal Station in 1889 raakte de oude stad afgesneden van het IJ en van Noord. Deze wandeling volgt hoe dat de laatste decennia is rechtgezet. Eerst de tunnels en hallen door en achter het station, dan het Oosterdokseiland, in 1832 ontstaan en lang spoorwegemplacement en postterrein, nu bibliotheek, conservatorium en kantoorcampus. Daarna de Oostelijke Handelskade, de oude havenkade, waar de cruiseterminal van 2000 een van de eerste nieuwe gebouwen was. Je eindigt op het Java-eiland, bij een houten hotel aan de kade waar ooit de schepen naar Java vertrokken.
stops:
  - place: The bicycle garage under the water at Stationsplein
    narration: |
      Start on the Prins Hendrikkade, with the water in front of the station ahead of you. The tour boats moor on the roof of a bicycle garage. From 2018 the harbour basin was pumped dry, a garage for 7,000 bikes was built nine metres below street level, and the water was let back in. It has been in use since early 2023.

      Take the moving walkway down. The Rotterdam firm Wurck designed it as an oyster: rough and dark outside, smooth and light within, with round columns as the pearls and round lights in the ceiling. Look for Lex Horn's two sgraffito walls of 1965, scratched and coloured in wet concrete for a laboratory building and given a home here after years in storage.

      This is a walk about the city finding its way back to the IJ, and it starts under water.
    nl: |
      Je begint aan de Prins Hendrikkade, met het water voor het station voor je. De rondvaartboten liggen hier boven op een fietsenstalling. Vanaf 2018 werd het Open Havenfront drooggepompt, kwam er negen meter onder maaiveld plek voor 7000 fietsen, en ging het water er weer op. Sinds begin 2023 is de stalling in gebruik.

      Neem de rolpaden naar beneden. Het Rotterdamse bureau Wurck dacht aan een oester: ruw en donker van buiten, glad en licht van binnen, met ronde kolommen als parels en ronde lichtogen in het plafond. Zoek de twee sgraffito's van Lex Horn uit 1965, in nat beton gekrast en ingekleurd voor een laboratorium en na jaren in het depot hier opnieuw opgesteld.

      Een wandeling over de stad die haar weg naar het IJ terugvindt, en ze begint onder water.
    next:
      directions: Inside the garage, follow the covered passage to the metro hall.
      nl: Volg in de stalling de overdekte gang naar de metrohal.
  - place: Centraal Station metro station (Noord/Zuidlijn)
    narration: |
      The passage brings you into the metro hall under the Stationsplein, which Arcam calls the Cathedral: a high grey hall carried on heavy A-shaped columns that hide all the technical services. Benthem Crouwel were commissioned in 1996 to design the stations of the Noord/Zuidlijn, and the line opened in July 2018. Their idea was the shortest possible route from street to platform, with daylight as a guide and no underground maze.

      The hard part was here, under the 1889 station. The old building first got a new foundation, and in July 2011 a concrete tunnel section 136 metres long was floated in from the IJ and lowered into a pit beneath it. Above the tracks, a slot 23.5 metres long holds David Claerbout's artwork, whose weather follows the forecast. The hall is free; the platforms need a ticket.
    nl: |
      Via de gang kom je in de metrohal onder het Stationsplein. Arcam noemt hem de Kathedraal: een hoge grijze hal op zware staanders in de vorm van een A, waarin alle techniek is weggestopt. In 1996 kreeg Benthem Crouwel de opdracht voor de stations van de Noord/Zuidlijn; in juli 2018 reed de eerste metro. Het uitgangspunt: zo kort mogelijk van straat naar perron, met daglicht als wegwijzer en zonder ondergronds doolhof.

      Het lastigste stuk lag hier, onder het station uit 1889. Dat kreeg eerst een nieuwe fundering, en in juli 2011 werd een betonnen tunnelstuk van 136 meter vanaf het IJ ingevaren en in een bouwput onder het station neergelaten. In de sleuf van 23,5 meter boven de sporen zit een kunstwerk van David Claerbout, waarvan het weer de weersverwachting volgt. De hal is vrij toegankelijk, voor de perrons heb je een vervoerbewijs nodig.
    next:
      directions: Go back up to the Stationsplein and walk west along the station front to the Cuyperspassage, the tunnel at the west end of the station.
      nl: Ga terug naar boven, naar het Stationsplein, en loop langs de stationsgevel naar het westen, naar de Cuyperspassage aan de westkant van het station.
  - place: Een zeegezicht aan het IJ, the tiled cycle tunnel
    narration: |
      The Cuyperspassage, opened in November 2015 and named after the station's architect Pierre Cuypers, finally gave walkers and cyclists a direct way from the old city to the IJ. Benthem Crouwel raised the footpath clearly above the dark cycle path, so the two streams stay apart.

      On the walkers' side, about 70,000 hand-painted tiles made in Makkum form Irma Boom's blue-and-white sea, after an 18th-century tile tableau of the Dutch herring fleet by the Rotterdam tile painter Cornelis Boumeester. Walk it north: the scene starts out faithful at the city end and grows sketchier towards the IJ. Find the ship called De Rotterdam, where Boom swapped the Rotterdam arms for the three crosses of Amsterdam.
    nl: |
      De Cuyperspassage, in november 2015 geopend en genoemd naar Pierre Cuypers, de architect van het station, gaf voetgangers en fietsers eindelijk een rechtstreekse route van de oude stad naar het IJ. Benthem Crouwel legde het voetpad duidelijk hoger dan het donkere fietspad, zodat de stromen gescheiden blijven.

      Aan de voetgangerskant vormen ruim 70.000 handbeschilderde tegels uit Makkum de blauw-witte zee van Irma Boom, naar een achttiende-eeuws tableau van de Hollandse haringvloot door de Rotterdamse plateelschilder Cornelis Boumeester. Loop naar het noorden: aan de stadskant is het beeld nog getrouw, richting het IJ wordt het steeds schetsmatiger. Zoek het schip De Rotterdam, waarop Boom het Rotterdamse stadswapen verving door drie Andreaskruisen.
    next:
      directions: At the IJ end, turn right into the long hall along the back of the station.
      nl: Sla aan het eind, aan de IJ-kant, rechtsaf de lange hal achter het station in.
  - place: IJhal, the mirrored hall behind Centraal Station
    narration: |
      The IJhal, by Wiel Arets Architects (2017), runs along the water side of the station, squeezed between the raised bus station and the road tunnel, and links train, bus, ferry and metro. The architects saw it as a way to reconnect the city with the IJ and the north.

      After the hand-painted tiles, a very different surface. The pale yellow terrazzo floor and everyone crossing it are reflected in a ceiling of mirrors with rounded corners, and in mirror-clad columns along the middle; the gaps between the panels hide the services. Shops line the station side and restaurants the water side, their names and logos all in black and white, so there is no wall of advertising. Look up and find yourself. The public jury of the Amsterdamse Architectuur Prijs chose it in 2018.
    nl: |
      De IJhal van Wiel Arets Architects (2017) loopt langs de waterkant van het station, ingeklemd tussen het busstation erboven en de autotunnel, en verbindt trein, bus, pont en metro. De architecten zagen de hal als een manier om stad en IJ, en Noord, weer met elkaar te verbinden.

      Na de handbeschilderde tegels nu iets heel anders. De lichtgele terrazzovloer en iedereen die eroverheen loopt, worden weerkaatst door een plafond vol spiegels met afgeronde hoeken en door de spiegelende zuilen op de middenas; tussen de spiegels zitten de installaties. Aan de stationskant liggen winkels, aan het water restaurants, met namen en logo's allemaal in zwart-wit, zodat er geen bonte reclamemuur ontstond. Kijk omhoog en zoek jezelf. In 2018 koos de publieksjury van de Amsterdamse Architectuur Prijs deze hal.
    next:
      directions: Leave the hall at its east end and head east to the Oosterdokseiland, the long island just east of the station. The library is on the Oosterdokskade, facing the Oosterdok.
      nl: Verlaat de hal aan de oostkant en loop naar het Oosterdokseiland, het lange eiland vlak ten oosten van het station. De bibliotheek staat aan de Oosterdokskade, met de voorkant naar het Oosterdok.
  - place: OBA Oosterdok, the library with a free view
    narration: |
      The Oosterdokseiland was made in 1832, when a dam cut this stretch off from the IJ, and was long a railway yard. Jo Coenen's central library opened here on 7 July 2007.

      From outside it is a frame of pale natural stone filled with stacked windows in heavy timber frames, raised on a plinth with a broad stair; one stone column on the left stands several metres forward of the rest. Coenen said it looks like a closed box from outside, while inside a great Innenwelt unfolds. That is the reason to go in, and you need no card. The floors step up as terraces to the seventh, where restaurant Babel looks south over the Oosterdok to NEMO, the Scheepvaartmuseum and the old centre. Its terrace is open from April to October, the restaurant all year.
    nl: |
      Het Oosterdokseiland ontstond in 1832, toen de Oosterdoksdam dit stuk van het IJ afsneed, en was lang vooral spoorwegemplacement. Op 7 juli 2007 (7/7/7) ging hier de centrale bibliotheek van Jo Coenen open.

      Van buiten zie je een raamwerk van lichte natuursteen met rechthoekige ramen in zware houten kozijnen, op een verhoogde sokkel met een brede trap. Links springt één stenen kolom een paar meter naar voren. Coenen zelf sprak van een gesloten doos van buiten, met binnen een hele Innenwelt. Daarvoor ga je naar binnen, en een pasje heb je niet nodig. De vloeren lopen als terrassen op tot de zevende verdieping, waar restaurant Babel uitkijkt over het Oosterdok naar NEMO, het Scheepvaartmuseum en de binnenstad. Het terras is open van april tot en met oktober, het restaurant het hele jaar.
  - place: Conservatorium van Amsterdam
    narration: |
      Next door, glass instead of stone. The Conservatorium van Amsterdam moved here in April 2008: close to the station, which is handy for students, and right by the trains, which is bad for acoustics.

      Frits van Dongen of de Architekten Cie. borrowed the Japanese engawa, running the corridors and stairs round the outside behind the glass front so they buffer the noise, with the halls and practice rooms inside. Look at the sawtooth front at an angle as you walk past. Its glass scales are covered with prismatic film, so the calm façade shifts in colour with the light and with where you stand.

      To get inside, come for a concert: lunchtime concerts in the 400-seat Bernard Haitinkzaal, jazz nights in the Blue Dock.
    nl: |
      Naast de steen van de bibliotheek staat glas. Het Conservatorium van Amsterdam verhuisde in april 2008 hierheen: vlak bij het station, dus goed bereikbaar, maar ook vlak bij het spoor, en de treinen maken veel lawaai.

      Frits van Dongen van de Architekten Cie. zocht het in de Japanse engawa: gangen en trappen lopen rondom langs de glazen gevel en vangen het geluid op, met de zalen en lokalen daarbinnen. Kijk schuin langs de zaagtandgevel terwijl je doorloopt. De glazen schubben zijn beplakt met prismatische folie, zodat de rustige gevel van kleur en uitstraling verandert met het licht en met de plek waar je staat.

      Binnen kom je bij de concerten van de school, van lunchconcerten in de Bernard Haitinkzaal met zijn 400 stoelen tot jazzavonden in de Blue Dock.
  - place: Booking.com City Campus
    narration: |
      At the tip of the island stood the post office's building of 1968 by Merkelbach and Elling, where letters and parcels were sorted off the trains. Since June 2023 UNStudio's glass campus for Booking.com stands here, with the water of the Oosterdok in its façade.

      On the railway side it cantilevers 23 metres; Arcam points out that the planning envelope set that shape, not the architects. Inside, Ben van Berkel set out to keep people walking: a long stair, bridges, galleries, even glazed fire stairs. The rectangular tower beside it holds 41 flats.

      The offices are private, but on the ground floor facing the IJ the restaurant A Beautiful Mess, run by Refugee Company to train people from refugee backgrounds, is open to all.
    nl: |
      Op de kop van het eiland stond vanaf 1968 het Post CS-gebouw van Merkelbach en Elling, waar brieven en pakketten van en naar het spoor werden overgeladen. Sinds juni 2023 staat hier de glazen campus van Booking.com, ontworpen door UNStudio, met het water van het Oosterdok in de gevel.

      Aan de spoorkant kraagt het gebouw 23 meter uit. Volgens Arcam was dat geen gril van de architecten: het stedenbouwkundig plan schreef die vorm voor. Binnen moest iedereen volgens Ben van Berkel in beweging blijven, met een lange trap, bruggen, galerijen en zelfs glazen nooduitgangtrappen. In de rechthoekige toren liggen 41 woningen.

      De kantoren zijn dicht, maar restaurant A Beautiful Mess van Refugee Company, waar mensen met een vluchtelingenachtergrond werkervaring opdoen, zit op de begane grond aan het IJ en is voor iedereen open.
    next:
      directions: Cross to the Piet Heinkade; the Muziekgebouw stands on its pier a little to the east.
      nl: Steek over naar de Piet Heinkade; het Muziekgebouw staat iets verder naar het oosten op zijn pier.
  - place: Muziekgebouw aan 't IJ and the Bimhuis
    narration: |
      3XN of Denmark designed this glass hall for contemporary music, opened in 2005 on a pier above the IJ tunnel. The black box sticking out over the quay is the Bimhuis, the jazz club musicians started in 1974 in a former furniture shop on the Oudeschans. Stricter noise rules drove it here, where bands play against a glass wall onto the city.

      After the conservatory, another building for music, and this one plays along. Paulien Barbas's In Fis is five small interventions tuned to F sharp. Push the revolving door and its glass bowl sings, louder with every turn; run your hand along the stair rail and the rough steel hisses; lean on the bridge and listen. The café is open to anyone. On the 22nd of each month at 20:00, Martijn Padding's weather-driven Huil van de Wolff sounds under the big canopy.
    nl: |
      Het Deense bureau 3XN ontwierp deze glazen zaal voor hedendaagse muziek; hij ging in 2005 open op een pier boven de IJtunnel. De zwarte doos boven de kade is het Bimhuis, het jazzpodium dat musici in 1974 begonnen in een oude meubelzaak aan de Oudeschans. Strengere geluidseisen dreven het hierheen, waar de bands spelen met een glazen wand en de stad achter zich.

      Na het conservatorium weer een gebouw voor muziek, en dit speelt zelf mee. In Fis van Paulien Barbas bestaat uit vijf kleine ingrepen, alle in fis. Geef de draaideur een zet en de glazen klankschaal zingt, bij elke slag luider; laat je hand over de trapleuning gaan en het ruwe staal suist; ga op de brug staan en luister. Het café beneden is voor iedereen open. Op de 22e van elke maand om 20.00 uur klinkt onder de grote luifel Huil van de Wolff, het stuk van Martijn Padding dat op het weer reageert.
  - place: Mövenpick Hotel Amsterdam City Centre
    narration: |
      Look east along the quay. From the Muziekgebouw a long plinth runs under the hotel to the cruise terminal and an office tower, holding a coach terminal, a car park and conference rooms. On it Claus en Kaan (Felix Claus with Jaap Graber) set the tower of rooms, about 65 metres high, open since 2006.

      From the Piet Heinkade, try counting the floors. You can't. Horizontal bands of green granite, white marble, white concrete and glass wrap the tower so that, as Arcam notes, neither the height of the floors nor what happens behind them can be read from outside. A hotel that keeps its face closed, beside a concert hall that shows everything through glass. The lobby with its lounge bar and the restaurant DOCK 11 are open to non-guests.
    nl: |
      Kijk langs de kade naar het oosten. Vanaf het Muziekgebouw loopt een lange plint onder het hotel door tot de cruiseterminal en een kantoortoren, met daarin een touringcarterminal, een parkeergarage en congreszalen. Daarop zetten Claus en Kaan (Felix Claus en Jaap Graber) de toren met de kamers, zo'n 65 meter hoog en sinds 2006 open.

      Probeer vanaf de Piet Heinkade de verdiepingen te tellen. Dat lukt niet. Liggende stroken glas, wit beton, wit marmer en groen graniet sluiten de toren zo af dat je, zoals Arcam opmerkt, hoogte noch gebruik van de lagen van buiten kunt aflezen. Een hotel dat zich niet laat kennen, naast een concertzaal die alles door glas laat zien. De lobby met de lounge bar en restaurant DOCK 11 zijn ook open voor wie er niet logeert.
  - place: Passenger Terminal Amsterdam
    narration: |
      At the end of the plinth lies the cruise terminal, opened in 2000 as one of the first projects in the remaking of the Oostelijke Handelskade, the old harbour quay east of the station. Larry Malcic of HOK was asked for a hinge between land and water. The hall is 24 metres high and mostly glass, so from the quay you look straight through it to the ships, under a roof shaped like a wave.

      Then the city turned against the ships. In 2024 the terminal was cut to one berth for sea cruises, with a cap of 100 calls a year from 2026, about half the number before. In January 2026 the alderman responsible wrote that she wanted to stop sea cruises from 2035, and left the final decision to the next city government. The building opens only for passengers and events.
    nl: |
      Aan het eind van de plint ligt de cruiseterminal, in 2000 geopend als een van de eerste projecten bij de vernieuwing van de Oostelijke Handelskade, de oude havenkade ten oosten van het station. Larry Malcic van HOK moest er een knooppunt tussen land en water van maken. De hal is 24 meter hoog en grotendeels van glas: vanaf de kade kijk je er dwars doorheen naar de schepen, onder een golvend dak.

      Daarna keerde de stad zich tegen de schepen. In 2024 bracht het college de terminal terug tot één ligplaats voor zeecruise, met vanaf 2026 hoogstens 100 schepen per jaar, waar het er zo'n 190 waren. In januari 2026 schreef wethouder Hester van Buren dat ze vanaf 2035 wil stoppen met zeecruises; het definitieve besluit liet ze aan het volgende college. Het gebouw gaat alleen open voor passagiers en evenementen.
    next:
      directions: Follow the Piet Heinkade east and cross the Jan Schaeferbrug to Java-eiland, looking back from the bridge at the terminal's wave roof. The hotel stands on the island's western tip.
      nl: Loop over de Piet Heinkade naar het oosten en steek via de Jan Schaeferbrug over naar het Java-eiland; kijk vanaf de brug nog even om naar het golvende dak van de terminal. Het hotel staat op de westpunt van het eiland.
  - place: Hotel Jakarta
    narration: |
      The walk ends where ships once left for Java: the steamers of the Stoomvaart Maatschappij Nederland sailed from this tip of Java-eiland. The city's tender asked for something special in architecture, public use and sustainability. SeARCH won it with WestCord Hotels, and the hotel opened in 2018.

      After all the glass and stone along the IJ, this one is built largely of timber. Most of the 200 rooms arrived on lorries as finished wooden units, balcony and bathroom included, and solar panels are built into the balconies and the glass roof over the atrium. Under that roof grows a subtropical garden of palms, banana plants, ginger and turmeric, chosen with the Hortus Botanicus. Walk in: the garden, Café Jakarta in the glass prow and Skybar Malabar at the top are open to everyone.
    nl: |
      De wandeling eindigt waar ooit de schepen naar Java vertrokken: vanaf deze punt van het Java-eiland voeren de stoomschepen van de Stoomvaart Maatschappij Nederland uit. De gemeente vroeg in haar tender om een hotel dat eruit sprong, in ontwerp, in openbaarheid en in duurzaamheid. SeARCH won die met WestCord Hotels, en in 2018 ging het hotel open.

      Na al het glas en de steen langs het IJ is dit een gebouw dat grotendeels op hout draagt. De meeste van de 200 kamers kwamen als kant-en-klare houten units op een vrachtwagen aan, met badkamer en balkon erin, en in de balkons en het glazen dak boven het atrium zitten zonnepanelen. Onder dat dak groeit een subtropische tuin met palmen, bananenplanten, gember en kurkuma, samengesteld met de Hortus Botanicus. Loop gerust naar binnen: de tuin, Café Jakarta in de glazen punt en Skybar Malabar bovenin zijn voor iedereen.
