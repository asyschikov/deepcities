# Deep Amsterdam map settings (snapshot of the live map; categories and fields for drafts)
slug: sights
categories:
- key: religious
  label: Churches
  color: '#7c3aed'
- key: schools
  label: Schools
  color: '#2563eb'
- key: housing
  label: Housing
  color: '#b45309'
- key: civic
  label: Civic buildings
  color: '#0f766e'
- key: culture
  label: Culture & sport
  color: '#ca8a04'
- key: industrial
  label: Industrial heritage
  color: '#57534e'
- key: infrastructure
  label: Bridges & infrastructure
  color: '#0369a1'
- key: hidden-history
  label: Hidden history
  color: '#4338ca'
- key: curiosities
  label: Curiosities
  color: '#be185d'
- key: street-art
  label: Murals & street art
  color: '#ea580c'
- key: odd-museums
  label: Odd museums
  color: '#a21caf'
- key: food-drink
  label: Food & drink
  color: '#be123c'
- key: green
  label: Green escapes
  color: '#15803d'
fields:
- key: rank
  label: Rank
  type: select
  options:
  - Amazing
  - Nice
  - Okay
  help: 'How worth a detour it is: Amazing (go out of your way), Nice (worth a stop
    if you''re near), Okay (a footnote, for completists).'
  filter: true
- key: a_list
  label: A-list
  type: select
  options:
  - A-list
  help: 'Set for the famous sights every guidebook puts in its top tier (kept strict). A label only: these places are ranked like any other.'
  filter: true
- key: heritage_status
  label: Heritage status
  type: select
  options:
  - National monument
  - Municipal monument
  - National + municipal monument
  help: 'Official listing: rijksmonument (national) and/or gemeentelijk monument (municipal).'
- key: monument_number
  label: Monument number
  type: text
  help: Register number(s), comma-separated.
- key: built
  label: Built
  type: text
  help: Year or range, e.g. 1955–1956.
- key: architect
  label: Architect
  type: text
- key: listed
  label: Listed in
  type: number
  help: Year it was designated a monument.
- key: original_use
  label: Original use
  type: text
- key: artist
  label: Artist
  type: text
  help: Who made the mural or artwork.
- key: status
  label: Status
  type: select
  options:
  - Gone
  help: Set when the thing no longer exists; the pin marks where it was.
- key: check
  label: Needs checking
  type: select
  options:
  - Location
  - Still there?
  - Facts
  help: 'Something here is unconfirmed: the pin (Location), whether it still exists (Still there?), or a fact sources disagree on (Facts). Clear it once checked.'
  filter: true
- key: check_note
  label: What to check
  type: text
  help: One line on what is unsure, e.g. "OSM puts the bench 120 m east of this pin."
- key: outlook
  label: Outlook
  type: select
  options:
  - Leaving or closing
  - Demolition planned
  - Under threat
  - Major change ahead
  - Temporarily closed
  help: Known or likely to change or disappear. Set it so the place can be followed up; clear it once the change has happened (then update the place or mark it Gone).
  filter: true
- key: outlook_when
  label: Expected
  type: text
  help: When, as far as known, e.g. "early 2028" or "Nov 2026 to Mar 2027".
- key: outlook_note
  label: What is changing
  type: text
  help: 'One line: what is planned or feared, and by whom.'
