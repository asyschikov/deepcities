  nl:
    title: Rechtbank Amsterdam, het gerechtsgebouw waar je naar binnen kijkt
    summary: De grootste rechtbank van Nederland, sinds mei 2021 in gebruik, ontworpen door KAAN Architecten. Publieke ruimtes liggen achter hoge ramen aan een plein met vijver, rechters werken hogerop rond groene tuinen. Doordeweeks kan iedereen binnenlopen en een openbare zitting bijwonen.
    body: |
      De rechtbank was haar gebouwen aan de Parnassusweg, uit 1975 en de late jaren tachtig, ontgroeid. In 2010 viel het besluit: nieuwbouw op dezelfde plek. Het ontwerp kwam van KAAN Architecten, als lid van consortium NACH (New Amsterdam Court House), dat het gebouw in opdracht van het Rijksvastgoedbedrijf ontwierp, bouwde en financierde en het dertig jaar lang onderhoudt. Op 3 mei 2021 waren de eerste zittingen. Met 50 zittingszalen en ruim 1.000 medewerkers, onder wie 200 rechters, is het verreweg de grootste van de elf rechtbanken in Nederland.

      Rechtspraak is openbaar, en dat moest je volgens KAAN kunnen zien. Het gebouw is in drie lagen verdeeld: de cellen ondergronds, met eigen hellingbanen; daarboven de publiekshal, de zittingszalen en het restaurant achter ramen van twee verdiepingen hoog; en helemaal boven, via een ronde trap, de kantoren en raadkamers rond tuinen en patio's met planten. Het voorplein is bijna een half voetbalveld groot en heeft een vierkante vijver met banken langs het water. Het reuzenbeeld van Nicole Eisenman bij de ingang heeft een eigen plek, net als het kantongerecht uit 1975 ernaast.

      Bezoek: op werkdagen open, 8.00 tot 17.00 uur. Bij de ingang worden tas en kleding gecontroleerd. De meeste zittingen zijn openbaar; meld je bij de receptie, aanmelden vooraf hoeft niet (strafzaken vanaf 12 jaar).

      Let op:
      - de hoge ramen van de publiekshal, gezien vanaf het plein
      - de vierkante vijver op het voorplein
      - binnen: de ronde trap naar boven
    arch:
      recognition: BNA Beste Gebouw van het Jaar 2022, winnaar in de categorie Identiteit en Icoonwaarde
