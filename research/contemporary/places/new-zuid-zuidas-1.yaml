  nl:
    title: nhow Amsterdam RAI, het hotel naar het voorbeeld van Het Signaal
    summary: Hotel van OMA uit 2020, opgebouwd uit drie driehoekige blokken tot 91 meter hoog, het middelste gedraaid. Het voorbeeld is de driehoekige reclamezuil die de RAI in 1961 neerzette. 650 kamers; restaurant en cocktailbar op de 24e verdieping zijn voor iedereen open.
    body: |
      Het hotel is ontworpen door OMA, het Rotterdamse bureau van Rem Koolhaas, met partner Reinier de Graaf als ontwerper. Opdrachtgevers waren de ontwikkelaars COD en Being Development. De bouw begon in oktober 2016 op een driehoekig stuk grond, ingeklemd tussen de RAI, de ringweg A10 en de Europaboulevard; in januari 2020 gingen de deuren open.

      Het gebouw bestaat uit drie driehoekige volumes die op elkaar zijn gestapeld, waarbij het middelste is verdraaid. Het hoogste punt ligt op 91 meter. De vorm is afgekeken van de buurman: Het Signaal, de driehoekige reclamezuil die de RAI in 1961 voor de deur zette. Volgens De Graaf was de zuil toen het hoogste bouwwerk in de omtrek; inmiddels steken de kantoortorens van de Zuidas er ver bovenuit. Volgens De Graaf kijken de kamers zo naar drie kanten: de binnenstad, Schiphol en de nieuwe stad in het zuidoosten.

      Met 650 kamers is het volgens OMA en Zuidas het grootste hotel van de Benelux. Of Amsterdam zo'n megahotel nog nodig had, vroeg de Volkskrant zich in juni 2020 hardop af.

      Bezoek: de lobby, tikibar Moana op de eerste verdieping en restaurant Selva en cocktailbar Sonora op de 24e verdieping, met uitzicht rondom, zijn ook voor wie er niet slaapt. Het Signaal en de Europahal hebben een eigen plek.

      Let op:
      - het middelste blok, dat scheef staat ten opzichte van de andere twee
      - Het Signaal voor de RAI, het voorbeeld van het hotel
      - de ronde onderbouw van twee lagen waarop de driehoeken rusten
    sources:
      - https://zuidas.nl/project/nhow
      - https://nl.wikipedia.org/wiki/Nhow_Amsterdam_RAI
      - https://www.oma.com/projects/rai-nhow-hotel

- title: The Edge, the office that faces the ring road
  summary: Deloitte's Amsterdam headquarters, finished at the end of 2014 to a design by PLP Architecture. Its 15-storey glass atrium faces north to the A10; solar panels face south. The BREEAM assessors gave it 98.3 per cent, by PLP's account the highest score any office had then had.
  body: |
    PLP Architecture of London designed this office for the developer OVG, with OeverZaaijer as local architect. OVG handed it to its main tenant Deloitte at the end of 2014, and it was officially opened in May 2015. Deloitte wanted to bring staff from several offices together in one, and to use the move to try a new way of working: no fixed desks, an app to find a place, and light and temperature set from your phone.

    The building is shaped by the sun. The office floors are wrapped around a 15-storey atrium that faces north, towards the A10, for steady north light and a view out; the south front carries solar panels that also shade the desks. Two wells 129 metres deep store heat and cold in an aquifer, rainwater flushes the toilets and waters the planting in the atrium, and the LED lights, run over the computer network, carry sensors that measure use.

    BRE, the British body behind the BREEAM label, rated it Outstanding with 98.3 per cent; PLP says that was the highest score given to an office building at the time. Deloitte renewed its lease in 2024.

    There is no public access: you see it from outside.

    Look for:
    - the glass atrium on the north side, facing the motorway
    - the solar panels on the south front
