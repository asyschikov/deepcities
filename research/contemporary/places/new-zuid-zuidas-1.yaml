- title: Ito Tower, Toyo Ito on the Gustav Mahlerplein
  summary: A 100-metre office tower of 2005 by the Japanese architect Toyo Ito, who won the Pritzker Prize in 2013. One of the first parts of the Mahler 4 complex, it has bands of windows and aluminium and voids inside. Icesave once had its Dutch office here.
  body: |
    Toyo Ito, the Japanese architect who won the Pritzker Prize in 2013, designed this office tower for Mahler 4, a part of the Zuidas. His office lists it as Mahler 4 Block 5, in work from September 2000 to June 2005. It stands on the west side of the Gustav Mahlerplein and was among the first parts of the complex to be finished. The client was G&S Vastgoed.

    The masterplan for Mahler 4, by de Architekten Cie., gave each architect strict rules, including voids in the buildings. Ito's answer is a block about 100 metres high with several voids inside and a skin of horizontal ribbon windows alternating with aluminium panels. A short walk away stands Erick van Egeraat's The Rock, built under the same rules.

    Among its tenants was the Dutch office of Icesave, the Icelandic bank that collapsed in 2008. Offices only: you see it from the square.

    Look for:
    - the horizontal bands of glass and aluminium
    - The Rock nearby, from the same masterplan
