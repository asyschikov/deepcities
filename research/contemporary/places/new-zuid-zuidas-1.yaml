- title: nhow Amsterdam RAI, the hotel modelled on the RAI's signal column
  summary: OMA's hotel of 2020 is three triangular blocks stacked to 91 metres, the middle one turned, after the RAI's triangular advertising column of 1961. It has 650 rooms. The restaurant and cocktail bar on the 24th floor are open to anyone.
  body: |
    OMA, the Rotterdam office founded by Rem Koolhaas, designed this hotel with partner Reinier de Graaf for the developers COD and Being Development. It went up between 2016 and 2019 on a triangle of land between the RAI, the A10 and the Europaboulevard, and opened in January 2020.

    Three triangular blocks sit on top of one another, the middle one turned against the other two, up to 91 metres. The model stands next door: the Signaal, the triangular advertising column the RAI put up in 1961, which De Graaf told Dezeen was then the tallest thing in the area and has since been overtaken by the Zuidas towers. The triangles also aim the rooms at three views, he said: the old city to the north, Schiphol to the southwest and the newer city to the southeast.

    OMA and the Zuidas office bill its 650 rooms as the largest hotel in the Benelux. Not everyone was sure the city needed it: in June 2020 a Volkskrant headline asked whether there was still a need for this megahotel.

    You can go in: the lobby, the Moana tiki bar on the first floor and, on the 24th floor, Selva restaurant and Sonora cocktail bar, which look out in all directions. The Signaal and the Europahal have their own place.

    Look for:
    - the middle block, turned against the ones above and below
    - the Signaal column in front of the RAI, the building's model
    - the round two-storey base the triangles stand on
