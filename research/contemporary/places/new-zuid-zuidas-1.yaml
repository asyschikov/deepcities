- title: Rechtbank Amsterdam, the courthouse built to be looked into
  summary: The country's largest court, opened in May 2021 to a design by KAAN Architecten. The public floors sit behind double-height windows on a square with a pond; judges work higher up around planted courtyards. Anyone may walk in on weekdays and sit in on a public hearing.
  body: |
    The Amsterdam district court had outgrown its buildings of 1975 and the late 1980s on the Parnassusweg, and in 2010 it was decided to build anew on the same site. KAAN Architecten designed the new courthouse within NACH (New Amsterdam Court House), a consortium that designed, built and financed it and will run it for 30 years for the Rijksvastgoedbedrijf, the state property agency. The first hearings were held on 3 May 2021. With 50 courtrooms and more than 1,000 staff, 200 of them judges, it is by far the largest of the country's eleven district courts.

    KAAN worked from the idea that justice is public business. The building is stacked in three layers: cells under the ground with their own access ramps; the public hall, courtrooms and cafeteria on the lower floors behind tall double-height windows; and above, up a round staircase, offices and judges' rooms around green courtyards, more private the higher you go. In front lies a square almost half a football pitch in size, with a square pond and benches. Nicole Eisenman's giant figure at the entrance has its own place, and so does the 1975 cantonal court next door.

    Visiting: open Monday to Friday, 8:00 to 17:00. Bags and clothing are checked at the door. Most hearings are public; report at reception, no booking needed (criminal hearings from age 12).

    Look for:
    - the double-height windows into the public hall, seen from the square
    - the square pond in front
    - the round staircase, if you go in
