  nl:
    title: The Rock, de kantoortoren die bovenaan het zwaarst is
    summary: Kantoortoren van Erick van Egeraat uit 2009, 90 meter hoog, opgebouwd uit gedraaide blokken van glas, aluminium, steen en beton, die naar boven toe zwaarder ogen. Gebouwd voor één advocatenkantoor, dat in 2024 vertrok; tot eind 2026 wordt het interieur verbouwd.
    body: |
      Erick van Egeraat ontwierp deze kantoortoren van 90 meter in het deelgebied Mahler 4; hij was in 2009 klaar. Het plan van de Architekten Cie. schreef voor dat de gebouwen hier een plint, een middenstuk en een kroon moesten hebben. Van Egeraat stapelde daarvoor grillige, verdraaide volumes van glas, aluminium, natuursteen en beton, die in elkaar overlopen. Onderin oogt de toren licht, bovenin zwaar, en het geheel doet denken aan een rotsblok.

      Enige grote huurder was advocatenkantoor De Brauw Blackstone Westbroek; het interieur kreeg natuursteen, hout en messing. Over de buitenkant werd verschillend gedacht. Bij een peiling van Advocatie.nl in 2010 onder vier advocatenkantoren op de Zuidas kreeg The Rock 186 van de 439 stemmen voor het lelijkste pand. De gebogen trap in de entree, met treden van witte steen, won in 2011 juist de verkiezing Mooiste Trap van het Jaar van trappenmaker EeStairs.

      Begin 2024 vertrok De Brauw. Eigenaar Deka laat het interieur verbouwen voor meerdere huurders, naar een ontwerp van Cushman & Wakefield met interieurarchitect Claudio Varone. Buiten verandert weinig, al komt er een entree tegenover de nieuwe Brittenpassage, die een eigen plek heeft. De oplevering staat gepland voor eind 2026.

      Bezoek: kantoren, alleen van buiten te zien.

      Let op:
      - de zware bovenkant op een lichtere voet
      - de mengeling van blokken glas, steen en aluminium
