- title: The Rock, the top-heavy tower of the Zuidas
  summary: Erick van Egeraat's 90-metre office tower of 2009 is a pile of twisted blocks of glass, aluminium, stone and concrete that looks heavier at the top than at the bottom. Built for one law firm, which left in 2024; it is being renovated inside for new tenants until the end of 2026.
  body: |
    Erick van Egeraat designed this 90-metre office tower in the Mahler 4 complex; it was completed in 2009. The masterplan by de Architekten Cie. asked the towers here for a classic base, middle and crown. Van Egeraat made his out of irregular, turned blocks of glass, aluminium, stone and concrete that flow into each other, light at the bottom and heavy at the top, so that the whole looks like a rock.

    It was built for a single tenant, the law firm De Brauw Blackstone Westbroek, with an interior of natural stone, wood and brass. Opinions split: in a 2010 poll by the legal news site Advocatie, The Rock got 186 of 439 votes as the ugliest of four Zuidas law-firm offices. The curved stair in its entrance, with white stone treads, was voted Staircase of the Year in a contest run by the stair maker EeStairs in 2011.

    De Brauw moved out in early 2024. The owner, Deka, is renovating the inside for several tenants, to a design by Cushman & Wakefield with interior architect Claudio Varone, with only small changes outside and an entrance facing the new Brittenpassage (which has its own place). Completion is planned for the end of 2026. Offices only: you see it from outside.

    Look for:
    - the heavy upper half on its lighter base
    - the mix of glass, stone and aluminium blocks
