  nl:
    title: The Edge, het kantoor dat naar de ringweg kijkt
    summary: Hoofdkantoor van Deloitte, eind 2014 opgeleverd naar een ontwerp van PLP Architecture. Het glazen atrium van 15 lagen kijkt naar het noorden, naar de A10; de zuidkant draagt zonnepanelen. BREEAM gaf 98,3 procent, volgens PLP toen de hoogste score voor een kantoor.
    body: |
      Het Londense PLP Architecture ontwierp het gebouw voor ontwikkelaar OVG, met OeverZaaijer als Nederlandse architect. Eind 2014 kreeg hoofdhuurder Deloitte de sleutel, in mei 2015 volgde de officiële opening. Deloitte trok er medewerkers uit verschillende kantoren samen en werkte er meteen anders: geen vaste bureaus, en wie licht of temperatuur boven zijn plek wil aanpassen, doet dat met een app op de telefoon.

      De vorm volgt de zon. De kantoorvloeren liggen rond een atrium van vijftien lagen hoog dat naar het noorden kijkt, naar de A10, en daardoor gelijkmatig licht krijgt. De zuidgevel is bekleed met zonnepanelen, die ook schaduw geven. Twee bronnen van 129 meter diep slaan warmte en koude op in de bodem, regenwater wordt gebruikt om toiletten door te spoelen, en de ledverlichting hangt aan het computernetwerk en heeft sensoren.

      Het Britse BRE, dat het BREEAM-keurmerk beheert, beoordeelde The Edge als Outstanding met 98,3 procent. Volgens PLP had geen kantoorgebouw toen hoger gescoord. In 2024 verlengde Deloitte het huurcontract.

      Bezoek: alleen van buiten te zien.

      Let op:
      - het glazen atrium aan de noordkant, naar de snelweg toe
      - de zonnepanelen op de zuidgevel
    arch:
      recognition: BREEAM Outstanding (98,3%) en een BREEAM Award voor nieuwbouwkantoren; ULI Award for Excellence 2016
