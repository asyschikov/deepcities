  nl:
    title: Stepstone, sociale huur op 80 meter hoogte
    summary: Woontoren van 80 meter met 216 kleine sociale huurwoningen voor starters tot 28 jaar, die er hooguit vijf jaar mogen blijven. LEVS architecten ontwierp hem voor De Key; klaar in 2024, met balkons rondom, gevelpanelen met groen grind en marmer en een sportveld op het dak.
    body: |
      Woningcorporatie De Key liet deze toren bouwen met 216 sociale huurwoningen voor starters tot 28 jaar. Bewoners mogen er maximaal vijf jaar blijven en verhuizen daarna, is het idee, door naar iets anders. De bouw liep van april 2022 tot maart 2024. Volgens LEVS architecten is Stepstone de eerste sociale hoogbouw op de Zuidas, en Zuidas noemt het het grootste sociale woningbouwproject in het gebied tot nu toe.

      Omdat de huren vastliggen, lag ook het budget vast. LEVS werkte daarom met geprefabriceerde betonelementen: lichtgrijze kaders met vlakken van groen beton, waarin alpengroen grind en Noors marmer zijn verwerkt. Zo kreeg bijna elke woning een balkon, hoewel dat niet verplicht was. De woningen meten 25 tot 60 vierkante meter, in de kroon zitten maisonnettes, en de constructie laat toe dat er later grotere woningen van worden gemaakt. Beneden is een gezamenlijke huiskamer van twee lagen hoog, boven een dakterras met sportveld achter hoge glazen puien. De toren sluit de zuidkant af van een bouwblok rond een binnentuin, met aan de andere kant de twee torens van De Puls (VMX Architects en MVSA).

      Bezoek: woningen, alleen van buiten te zien.

      Let op:
      - de balkons aan alle kanten
      - de groene vlakken tussen de grijze kaders
      - de glazen kroon rond het sportdak
