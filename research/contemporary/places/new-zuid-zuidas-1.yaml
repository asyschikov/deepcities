- title: Cross Towers, Foster's silver lattice by the A10
  summary: Foster + Partners' first Amsterdam building, finished in 2008 as Drentestaete III for Ernst & Young, which as EY is still there. A silver steel diagrid hides the floors and turns the 87-metre front into one lattice, meant to be picked out on the drive into the city.
  body: |
    ING Real Estate commissioned the tower from Foster + Partners in 2002, with Ernst & Young (now EY) as main tenant. Building started in June 2005 and it was completed in 2008 as Drentestaete III; the firm called it its first building in Amsterdam. It now goes by Cross Towers.

    It stands on the eastern edge of the Zuidas, close beside the A10, and Foster wanted it to be picked out on the drive into the city. The answer is a structural steel diagrid clad in silver aluminium over dark panels, which blurs the individual floors and runs up the whole 87-metre front. Behind it are two slim office blocks, each 12.6 metres wide and free of columns, offset in plan to catch daylight and the views north, and joined by a glass core. The north face is fully glazed; the other sides are about 30 per cent glass, to keep the sun out. At the foot, a water court with a pond planted with reeds and water lilies holds back rainwater, as the rules for this polder require.

    In 2024 the developer Edge and two Dutch family offices bought it from the Chinese insurer Anbang, planning to cut its energy use; EY signed a new lease in 2026. Offices only: you see it from outside.

    Look for:
    - the silver crosses of the diagrid
    - the water court and pond on the south side
    - the step between the two blocks
