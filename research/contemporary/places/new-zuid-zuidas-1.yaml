- title: Stepstone, social rent 80 metres up
  summary: An 80-metre tower of 216 small social-rent flats for starters up to 28, who may stay five years. LEVS architecten built it for De Key in 2024 out of prefab panels with green gravel and marble, nearly every flat with a balcony and a sports pitch on the roof.
  body: |
    The housing association De Key (Lieven de Key) built this tower of 216 social-rent flats for starters aged 28 or younger, who may stay at most five years and are then meant to move on. LEVS architecten won the job in February 2020; building ran from April 2022 to March 2024. LEVS calls it the first social-housing high-rise on the Zuidas, a district known for expensive homes, and the Zuidas office calls it the largest social housing project there so far.

    The rents capped the budget, so LEVS built it from prefabricated concrete: light grey frames filled with panels of green concrete made with alpine green gravel and Norwegian marble, arranged so that nearly every flat has a balcony, though none was required. The flats range from 25 to 60 square metres, with maisonettes in the crown, and the structure allows them to be joined into larger homes later. Residents share a double-height lounge at street level and a roof terrace with a sports pitch behind tall glass screens. The tower closes the south side of a courtyard block whose other two towers form De Puls, by VMX Architects and MVSA.

    Homes only: you see it from the street.

    Look for:
    - the balconies on every side
    - the green panels between the grey frames
    - the glass crown around the roof pitch
