  nl:
    title: Cross Towers, het zilveren raster van Foster aan de A10
    summary: Het eerste Amsterdamse gebouw van Foster + Partners, in 2008 opgeleverd als Drentestaete III voor Ernst & Young, dat er als EY nog altijd zit. Een zilverkleurig stalen raster van diagonalen verbergt de verdiepingen en moest de toren herkenbaar maken voor wie de stad binnenrijdt.
    body: |
      ING Real Estate gaf Foster + Partners in 2002 de opdracht, met Ernst & Young (nu EY) als belangrijkste huurder. In juni 2005 ging de eerste paal de grond in, in 2008 was het kantoor klaar. Het heette toen Drentestaete III; nu heet het Cross Towers.

      De toren staat aan de oostkant van de Zuidas, vlak naast de A10. Foster wilde dat je hem zou herkennen wanneer je de stad binnenrijdt. Daarvoor kreeg de gevel van 87 meter hoog een draagstructuur van stalen diagonalen, bekleed met zilverkleurig aluminium, over donkere panelen, zodat je de afzonderlijke verdiepingen nauwelijks ziet. Erachter staan twee smalle kantoorvleugels zonder kolommen, die ten opzichte van elkaar verspringen en zo meer daglicht en uitzicht naar het noorden krijgen; een glazen kern verbindt ze. Aan de voet ligt een waterhof met een vijver met riet en waterlelies, die regenwater vasthoudt.

      In 2024 kochten ontwikkelaar Edge en twee vermogende Nederlandse families het pand van de Chinese verzekeraar Anbang, met het plan het flink zuiniger te maken. EY tekende in 2026 een nieuw huurcontract.

      Bezoek: kantoren, alleen van buiten te zien.

      Let op:
      - de zilveren kruisen van het diagonale raster
      - het waterhof met de vijver aan de zuidkant
      - de sprong tussen de twee vleugels
    sources:
      - https://nl.wikipedia.org/wiki/Cross_Towers
