  nl:
    title: Kantoor van Rijkswaterstaat aan de A2
    summary: Het kantoor uit 2001 van de beheerders van de snelwegen rond Amsterdam, ontworpen door Atelier Z (Zdenek Zavrel en Marcel Baake). De plattegrond is driehoekig en de scherpste hoek steekt door het talud van de A2 heen, richting het verkeer.
    body: |
      Rijkswaterstaat beheert vanuit Amsterdam de rijkswegen tussen Schiphol, Amsterdam en 't Gooi. Het kantoor hoort dus aan zo'n weg te liggen. Atelier Z ontwierp het voor de directie Noord-Holland, met Zdenek Zavrel en Marcel Baake als ontwerpers en BAM als aannemer; in 2001 was het af. Het gebouw moest zich laten zien aan wie over de A2 rijdt.

      De plattegrond is een driehoek. De spitste hoek prikt dwars door de dijk waarop de snelweg ligt, zodat het pand recht op het verkeer gericht staat. Om de keramische binnengevel zit een gevouwen glazen scherm, op 90 centimeter afstand. Die spouw wordt op natuurlijke wijze geventileerd, wat energie scheelt, en houdt het lawaai van de A2 buiten de kantoren. Binnen valt door een glazen dak boven de centrale hal daglicht tot in de kern en in de kantoren rond die hal.

      Rijkswaterstaat zit er nog steeds.

      Bezoek: een kantoor, niet open voor publiek. Automobilisten op de A2 krijgen het beeld waarvoor het ontworpen is.

      Kijk naar:
      - de punt van de driehoek die door het talud van de snelweg steekt
      - het glazen scherm dat los van de keramische gevel staat

- title: Wi Eegi Kerki
  summary: A new church in the Bijlmer, in use since 2013, built for the Evangelische Broedergemeente (Moravian Church) with money its members raised themselves. 70F architecture designed it around light and white, as a closed yellowish-white brick block with a 13-metre light tower.
  body: |
    At a time when empty churches are being turned into flats and offices, the Evangelische Broedergemeente in Zuidoost, a Protestant congregation with Surinamese roots, asked for a new one. It approached 70F architecture in 2006, and the members collected the budget themselves, a sum that was modest for a building of this size. Bas ten Brinke and Carina Nilsson designed it, and the church came into use in 2013. The name is Sranan Tongo for "our own church".

    Light and the colour white matter in the congregation's liturgy, so the design is built on them. Outside, the church is a monolithic block of mottled yellowish-white brick in a random bond, raised on a low mound. Inside, you walk in under the balcony and the church hall opens up to nine metres. Ahead is a white wall 13 metres high, lit indirectly through a skylight running the full width of the tower: to see where the light comes from, you have to turn round. The chairs are white too. On the street side, the glass above the main entrance is always lit, as a welcome to the neighbourhood.

    Visiting: Sunday services at 11:00; the halls can also be hired.

    Look for:
    - the light tower over the church hall, with its bell
    - "wi eegi kerki" in metal letters beside the entrance
    - the raised beds edged with stone bands that double as benches
