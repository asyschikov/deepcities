  nl:
    title: Decoratelier van Nationale Opera & Ballet
    summary: De werkplaats waar de decors van Nationale Opera & Ballet worden gebouwd, in 2013 door VMX Architects verbouwd en uitgebreid. Het pand werd knalrood, kreeg aan de noordkant een glazen gevel en een toneeltoren naar het voorbeeld van die in het Muziektheater.
    body: |
      Sinds 1985 maakt het operagezelschap zijn decors aan de Kollenbergweg. Het is de enige afdeling van Nationale Opera & Ballet die niet in het centrum zit. VMX Architects (projectarchitect Don Murphy) verbouwde en vergrootte het atelier in opdracht van De Nederlandse Opera; in 2013 was het klaar. De plint van het eerste atelier uit 1962 is nog te zien: het gebouw staat er bovenop.

      De belangrijkste toevoeging is een toneeltoren van zo'n twintig meter hoog. Functioneel is hij gelijk aan de toren van het Muziektheater aan de Amstel, waar het gezelschap speelt. Zo kan elk decor hier helemaal worden afgebouwd en getest voordat het de stad in gaat. Binnen maakte VMX plaats voor extra werkplaatsen, opslag en een laaddock voor vrachtwagens, en de gevels werden aan de binnenkant geïsoleerd.

      Twee ingrepen zijn voor de straat bedoeld. Een groot deel van de lange noordgevel is nu van glas: de timmerlieden, lassers en schilders krijgen noorderlicht en uitzicht, en wie langsloopt ziet hen aan het werk, net als in de showrooms in de buurt. En de hele buitenkant werd felrood geschilderd, waardoor een werkplaats een herkenningspunt in de omgeving werd.

      Bezoek: een werkplaats, niet open voor publiek.

      Kijk naar:
      - de toneeltoren die boven het rode blok uitsteekt
      - de glazen noordgevel met de werkplaatsen erachter
      - de naam van het gezelschap op de rode muur
    arch:
      recognition: Amsterdamse Architectuur Prijs 2014, genomineerd

- title: Rijkswaterstaat office on the A2
  summary: The 2001 office of the people who run the motorways around Amsterdam, by Atelier Z (Zdenek Zavrel and Marcel Baake). Its plan is a triangle, and the sharpest corner pushes through the A2's embankment towards the traffic.
  body: |
    Rijkswaterstaat's Amsterdam location looks after the national roads between Schiphol, Amsterdam and 't Gooi, so it made sense to put its office beside one of them. Atelier Z (Zdenek Zavrel and Marcel Baake) designed it for the Noord-Holland directorate, BAM built it, and it was finished in 2001. The building was meant to present itself to the people driving past on the A2.

    The plan is a triangle, and its sharpest point cuts straight through the dike that carries the motorway, so the building points at the traffic. Around a ceramic inner facade the architects folded a glass screen, 90 centimetres out. That cavity is naturally ventilated, which saves energy, and it shields the offices from the noise of the A2. Inside, a glass roof over the central hall brings daylight into the core of the building and into the offices around the hall.

    Rijkswaterstaat still uses it as its Amsterdam office.

    Visiting: an office, not open to the public. Drivers on the A2 get the view it was designed for.

    Look for:
    - the point of the triangle breaking through the motorway embankment
    - the glass screen standing off the ceramic facade
