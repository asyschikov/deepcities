  nl:
    title: Bijlmer Sportcentrum
    summary: Het sportcentrum van Zuidoost aan het Anton de Komplein, in 2008 geopend en ontworpen door Vera Yanovshtchinsky Architecten. Achter een zigzaggende glazen gevel liggen zwembaden, een verdiepte sporthal en fitness, bedoeld om te zien en gezien te worden.
    body: |
      Het sportcentrum hoorde bij de grote vernieuwing van het Bijlmercentrum en de F-buurt ernaast, en het moest ook een sociale rol spelen in de wijk. Daarom kwam het aan het Anton de Komplein, waar een paar keer per week markt is, op het punt waar de Amsterdamse Poort, het Nelson Mandelapark en de woonbuurten van Bijlmer-Oost samenkomen. Vera Yanovshtchinsky Architecten ontwierp het in opdracht van de gemeente en het stadsdeel; in 2008 ging het open.

      Het thema was "zien en gezien worden". De architect liet zich daarbij inspireren door culturen waar flaneren gewoner is dan in Nederland. Achter de veelhoekige plattegrond en de zigzagvormige glasgevel kijk je vanuit de centrale hal op de sporthal, de baden en de horeca, en vanaf het plein zie je de zwemmers beneden en de fitness erboven. Lamellen in het glas gaan dicht voor privacy of tegen de zon. Het tweede thema was feest: felgroene muren, blauw mozaïek op de bodem van het bad en goudoranje zitplekken. Betonnen kolommen van acht meter dragen grote houten balken, die overal in het zicht blijven.

      Aan twee kanten is het gebouw gesloten, omdat daar altijd woningen gepland waren. Die worden nu gebouwd.

      Bezoek: openbaar, beheerd door Optisport; zwemmen en fitness zijn betaald.

      Kijk naar:
      - de zigzaggende glazen gevel aan het plein
      - door het glas, de zwembaden op de begane grond
      - de flauwe helling naar de entree, die tachtig centimeter boven het plein ligt
    arch:
      recognition: Amsterdamse Architectuur Prijs, genomineerd (top zes)
