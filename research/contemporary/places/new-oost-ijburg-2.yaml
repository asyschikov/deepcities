  nl:
    title: 150 kV-station Science Park
    summary: Hoogspanningsstation uit 2008 aan het uiterste eind van het Science Park, omhuld met dunne schubben roestig cortenstaal die aan de voorkant golven en aan de andere kanten zigzaggen. De deuren gaan op in het patroon. Genomineerd voor de Amsterdamse Architectuur Prijs 2009.
    body: |
      Willem Schutter van Architectenbureau Schutter ETH ontwierp dit elektriciteitsstation voor netbeheerder Liander, op het uiterste oostpunt van het Science Park, vlak bij het Flevopark. Het was in 2008 klaar. Kabels met 150.000 volt komen hier uit de grond omhoog en worden omgezet naar de spanning voor huishoudens en bedrijven.

      Omdat er alleen transformatoren in hoefden, kon de architect er een beeldhouwwerk van maken. Het gebouw lijkt uit de grond op te komen, een verwijzing naar de kabels die eronder naar boven lopen. De hele huid bestaat uit dunne platen geroest cortenstaal, als schubben gelegd: golvend aan de voorkant, zigzaggend aan de andere zijden, met de deuren onzichtbaar in het patroon. De drie stroomverdelers staan om veiligheidsredenen in betonnen cellen die bovenaan open zijn, zodat de warmte weg kan. De rest van het dak ligt vol schubben van verzinkt staal, te zien vanaf de A10 en vanuit de hoogbouw in de buurt. Het station stond in 2009 op de lijst van genomineerden voor de Amsterdamse Architectuur Prijs.

      Het is een werkend station, niet open voor bezoekers: alleen van buiten te bekijken.

      Let op:
      - de golvende voorgevel van roestbruine stalen schubben
      - de deuren die in het patroon verdwijnen
      - vanaf de A10: de verzinkte schubben op het dak
    arch:
      recognition: Amsterdamse Architectuur Prijs 2009, genomineerd

- title: Woonhoeve Diemen (Homestead)
  summary: Twelve flats of 2017 on the site of a care organisation's old organic nursery in Diemen, built as one long barn-shaped volume whose walls, roof and two chimneys are clad in a single folded skin of French ceramic slates.
  body: |
    Marcel Lok_Architect designed this "residential homestead" where the care organisation Cordaan once ran an organic nursery, at the edge of a new housing area in Diemen bordered by sports fields, the railway, the Weespertrekvaart and the nature reserve along the river Diem. It was completed in 2017: twelve owner-occupied apartments on a shared yard.

    The starting point was a monumental barn next door. The architect drew one long volume with a clear family likeness to it and pushed the farm idea further: the roof is a closed cloak draped over the whole building, two chimneys underline the rural look, and the balconies sit at the two glazed ends, inside frames of dark prefab concrete. Walls, roof and chimneys form one continuous folded skin of French ceramic slates in earthy colours, a reference to the ceramics of the old nursery. Gutters and drainpipes are hidden, and the solar panels are set flush into the roof. In the yard stands a matching outbuilding with bike storage and a shared garden room next to a vegetable and herb garden, behind a red beech hedge.

    The flats are private; you see the building from the road.

    Look for:
    - the slate skin folding over walls, roof and chimneys
    - the glazed ends with balconies in dark concrete frames
    - the matching garden house on the yard
