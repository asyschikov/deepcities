  nl:
    title: Houtrak, Oostenburg
    summary: Twee aaneengesloten woongebouwen uit 2025 aan de kop van de Oostenburgervaart. Het hoogste is bekleed met azobé-planken die jarenlang als damwand in een kanaal bij Breda stonden, met diepe houten balkons boven het water.
    body: |
      Op een van de laatste kavels van Oostenburg, aan het eind van de Oostenburgervaart tussen het INIT-gebouw en het voormalige Rosa en Rita, bouwde VORM het ontwerp van Marcel Lok_Architect en Workshop Architecten. In 2025 was het klaar: 36 koopwoningen, van kleine studio's tot ruime lofts, in twee panden met daartussen een lichthof waar alle voordeuren aan liggen. De naam is volgens de ontwikkelaar een samentrekking van het hout van gevel en kolommen en 'rak', een recht stuk water.

      Het pand van zes lagen aan de vaart is bekleed met hergebruikt azobé, een hard tropisch hout. De planken stonden als damwand in het Markkanaal tussen Oosterhout en Breda, tot Rijkswaterstaat die oeverconstructie verving. Nu zitten ze op de gevel en in de massieve balkons die ver boven het water uitsteken. Het achterste pand telt vier lagen, heeft sheddaken en zwartbruine metalen gevelcassettes, met balkons die half in de gevel liggen. Beide staan op een prefab casco van houten kolommen en betonnen vloerplaten: snel gebouwd en later makkelijk anders in te delen. De gezamenlijke daktuin is van Flux landschapsarchitecten. Het zijn particuliere woningen; je ziet ze het best vanaf de overkant van de Oostenburgervaart.

      Let op:
      - de hergebruikte azobé-planken aan de waterkant
      - de diepe houten balkons boven de Oostenburgervaart
      - de sheddaken van het donkere metalen pand
    arch:
      recognition: Amsterdamse Architectuur Prijs 2026, genomineerd

- title: 150 kV station Science Park
  summary: A high-voltage substation of 2008 at the far end of the Science Park, wrapped in thin scales of rusted Cor-ten steel that wave on one side and zigzag on the others. The doors are hidden in the pattern. A nominee for the Amsterdam Architecture Prize 2009.
  body: |
    Architect Willem Schutter (Schutter ETH) designed this electricity substation for the grid operator Liander at the far eastern tip of the Science Park, near the Flevopark. It was completed in 2008. Here cables carrying 150,000 volts come up out of the ground and are transformed down for homes and businesses.

    Because the building only had to house transformers, the architect could treat it as a sculpture, and he made it look as if it were rising out of the ground, a nod to the cables coming up beneath it. The skin is made entirely of thin plates of rusted Cor-ten steel, laid like scales: wavy on the front and zigzag on the other sides, with the doors worked into the pattern. For safety the three power distribution units sit in concrete compartments that are open at the top to let the heat out; the rest of the roof is covered in scales of galvanised steel, visible from the A10 and from the taller buildings nearby. It was nominated for the Amsterdamse Architectuur Prijs 2009.

    It is a working substation, not open to visitors: outside only.

    Look for:
    - the waving front of rusted steel scales
    - the doors hidden in the pattern
    - from the A10, the galvanised scales on the roof
