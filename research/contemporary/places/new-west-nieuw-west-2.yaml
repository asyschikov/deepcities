  nl:
    title: Cornelis
    summary: "Woongebouw met 85 woningen, ontworpen vanuit het kind: galerijen, een traptuin, houten glijbanen naast de trappen en raampjes in de voordeur op kinderhoogte, zodat je ziet of een vriendje thuis is."
    body: |
      De gemeente zocht via een tender een gebouw dat jonge gezinnen in de stad houdt. FARO architecten en Van Bergen Architectura wonnen die in 2021 met het plan Tikkertje Trap. Opdrachtgevers BuildingforLife, Prosper Vitae en Heutink lieten het bouwen aan het Schielandplein, achter de Cornelis Lelylaan, en in 2025 was het klaar. Er zitten 85 koop- en vrijesectorhuurwoningen in van 60 tot 170 m², allemaal met een buitenruimte op het zuiden. De dubbelhoge plint biedt plek aan een kinderdagverblijf, buitenschoolse opvang, horeca en ateliers.

      Op het terrein zit drie meter hoogteverschil, en dat gebruikten de architecten voor een stelsel van hallen, trappen en een groene traptuin van Dijk & Co. Naast de trappen liggen houten glijbanen. Een deel van de woningen ligt aan galerijen van azobéhout die buiten de gevel hangen en alleen op het betonnen casco rusten, zonder poten op de grond. De rest ligt aan een brede, dubbelhoge gang met een houten vloer. De architecten zien er de galerijen van de naoorlogse strokenbouw in terug, waar kinderen speelden. De grijsgroene baksteen is speciaal voor dit gebouw ontwikkeld.

      Bij de Amsterdamse Architectuurprijs 2026 zetten alle drie de publieksjuryleden Cornelis in hun top drie ("echt een mensenarchitect"), maar zij wilden een winnaar met sociale huur, en die zit er niet in. De vakjury vond de kant naar het plein erachter kil en gesloten.

      Bezoek: woningen; bekijk het vanaf de straat.

      Let op:
      - het houten frame van de hangende galerijen aan de kant van het Schielandplein
      - de grijsgroene baksteen
      - de stoerdere stadsgevel aan de Cornelis Lelylaan
    arch:
      recognition: Amsterdamse Architectuurprijs 2026, genomineerd

- title: MO*town Track 8
  summary: "A black, stepped housing block by Sloterdijk station: three towers joined by steel footbridges between planted galleries, with shared gardens in the valley between them and shops and cafés at street level."
  body: |
    Sloterdijk is part of Haven-Stad, where the city is turning office and business land into mixed neighbourhoods with tens of thousands of homes. MO*town Track 8, designed by De Zwarte Hond for BPD and ERA Contour and completed in 2024, is one of the first housing schemes in the office district by the station. Future residents could help decide the layout and size of their homes.

    The architects shaped the block as a valley: three stepped towers form the walls, shared gardens lie at the bottom, and steel footbridges cross between galleries full of plants, so that from one bridge you look straight through the block. The dark, glossy brick answers the office towers around it. Solar cells sit in the glass balustrades, a 260 m³ basin in the basement holds rainwater for the planting, and the garage has room for bikes and 30 shared cars.

    The professional jury of the Amsterdamse Architectuur Prijs 2025 called it a "wow" on arrival and noted that the plants went in a year before completion, so the building was already in bloom; it found the courtyard side somewhat bleak. The public jury felt it was walking through a video game, and found the lower parts shady and cold.

    Visiting: homes; see it from the street, where the plinth has shops and cafés.

    Look for:
    - the steel footbridges between the three towers
    - the stepped, glossy black façade
    - the planted galleries
