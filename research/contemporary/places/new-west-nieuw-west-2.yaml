  nl:
    title: De Hood
    summary: "Klein jongerencentrum in een groenstrook in Osdorp: een glazen benedenverdieping waardoor de buurt kan zien wat er binnen gebeurt, onder een dichte, hobbelige witte bovenverdieping waar de jongeren een eigen ruimte hebben."
    body: |
      Toen er een jongerencentrum in de Reimerswaalbuurt moest komen, waren omwonenden bang voor onrust op straat. Atelier Kempe Thill (André Kempe en Oliver Thill, met David van Eck) won de besloten prijsvraag en stapelde twee tegengestelde lagen op een grondvlak van 15 bij 8,5 meter. De begane grond is rondom van glas, met ruiten van vijf meter lang en glazen deuren die structureel verlijmd zijn. Inloopruimte, keuken en kantoortje liggen zo open en bloot voor de buurt, en de boomkruinen buiten horen bij de ruimte. De verdieping erboven is dicht, tegen geluid geïsoleerd en alleen via daklichten verlicht: een domein van de jongeren zelf.

      Het glas slokte een flink deel van het krappe budget op. Boven werd daarom gekozen voor wat volgens Arcam de goedkoopste gevelafwerking van Nederland is: polyurethaan, op kalkzandsteen gespoten, wat de witte bovenbouw een hobbelige huid geeft. Opdrachtgever waren Ymere en Bouwfonds. Het gebouw ging in 2011 open en was in 2012 genomineerd voor de Amsterdamse Architectuurprijs. Het is nog altijd een jongerencentrum, waar ONE Jongerenwerk activiteiten organiseert voor 10- tot 23-jarigen.

      Bezoek: een centrum voor jongeren uit de buurt; anderen bekijken het vanaf het pad.

      Let op:
      - de helemaal glazen begane grond tussen de bomen
      - de hobbelige witte spuitlaag van de bovenverdieping
    arch:
      recognition: Amsterdamse Architectuurprijs 2012, genomineerd

- title: Zaans Medisch Centrum
  summary: "Zaandam's hospital, designed inside and out by Mecanoo and in use since January 2017: clinics, wards and a flexible layer stacked in one compact block, round a multi-storey lobby in wood with a spiral slide for children."
  body: |
    Mecanoo calls this the first lean hospital in the Netherlands: a compact building planned to avoid every form of waste. It was also the firm's first hospital, and it designed the lot: building, site plan, landscape and interior, for the Zaans Medisch Centrum and the developer Vitaal ZorgVast, with BAM as builder. The building was finished in 2016, and on 28 January 2017 the hospital moved in from its old buildings next door, taking about 130 patients across in their beds through a heated tunnel.

    The plan stacks two floors of outpatient clinics and two of wards, with a flexible floor of facilities between them; clinics and wards are standardised where possible so they can swap uses later. Visitors come into a lobby several storeys high, meant to feel like a public building rather than a hospital, with semicircular voids and rooflights, wood, bright colours and views out. Hand-drawn illustrations by SILO on the walls, glass and lifts recall the Zaan region's industrial past, and a spiral slide gives children their own way between floors. In 2018 it won the public vote for Healthcare Centre of the Year at the Frame Awards.

    Visiting: the lobby and other public areas are open to everyone.

    Look for:
    - the multi-storey lobby with its semicircular voids
    - the drawings of Zaan industry on walls and glass
    - the children's spiral slide
