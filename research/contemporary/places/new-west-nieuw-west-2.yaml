  nl:
    title: MO*town Track 8
    summary: "Zwart, getrapt woongebouw bij station Sloterdijk: drie torens die met stalen loopbruggen tussen groene galerijen aan elkaar vastzitten, met gedeelde tuinen in het dal ertussen en winkels en horeca aan de straat."
    body: |
      Sloterdijk hoort bij Haven-Stad, waar de gemeente kantoren- en bedrijfsterrein ombouwt tot gemengde wijken met tienduizenden woningen. MO*town Track 8 van De Zwarte Hond, gebouwd voor BPD en ERA Contour en klaar in 2024, is een van de eerste woonprojecten in het kantorengebied bij het station. Toekomstige bewoners mochten meepraten over indeling en grootte van hun woning.

      De architecten vatten het blok op als een dal. Drie getrapte torens vormen de hellingen, onderin liggen gemeenschappelijke tuinen, en stalen bruggen verbinden de begroeide galerijen van beide kanten, zodat je vanaf een brug dwars door het blok kijkt. De donkere, glanzende baksteen sluit aan bij de kantoortorens eromheen. In de glazen balustrades zitten zonnecellen, een kelderbassin van 260 m³ vangt regenwater op voor het groen, en in de garage staan fietsen en dertig deelauto's.

      De vakjury van de Amsterdamse Architectuurprijs 2025 sprak van een wow-effect bij aankomst. Omdat het groen een jaar voor de oplevering was geplant, stond alles al in bloei. De binnenkant van het blok vond de jury wat unheimisch. De publieksjury waande zich in een videogame en vond de diepere delen schaduwrijk en koud.

      Bezoek: woningen; bekijk het vanaf de straat, waar in de plint winkels en horeca zitten.

      Let op:
      - de stalen loopbruggen tussen de drie torens
      - de getrapte, glimmend zwarte gevel
      - de begroeide galerijen
    arch:
      recognition: Amsterdamse Architectuurprijs 2025, genomineerd

- title: De Houten Leeuw
  summary: "A timber block of 53 social-rent studios for young adults in the Kolenkitbuurt, built in cross-laminated timber in under a year. At the back, a timber gallery with a cascading stair and a bench for every flat."
  body: |
    Arcam calls De Houten Leeuw the first apartment building in Amsterdam's social-rent sector built entirely of timber. Housing association Stadgenoot commissioned it from Heren 5 architecten (now called SOME architects), with M.J. de Nijs en Zonen as developer and Hamlet as timber engineer, and it was completed in November 2024, just behind the Kolenkitkerk. Its 53 studios of about 35 m² are a first home for young people of 18 to 28.

    Floors and walls, the stairwell included, are cross-laminated timber, some 760 m³ of it from Austria; the builder says the whole frame went up in nine weeks. Every studio runs through from front to back, with a central pod for kitchen and bathroom. At the back a gallery of azobé leans against the building, braced by a 16-metre corner of timber panels, so no inner stair or lift core was needed. A broad stair climbs along it in steps, and every flat has its own bench and storage box on the gallery.

    The street front is rendered. The façade gave the city's design review committee some headaches, and the professional jury of the Amsterdamse Architectuur Prijs 2025 called the render a sensible compromise. The public jury loved the warm timber back but found the front closed, and both juries saw mostly drawn curtains.

    Visiting: homes; see it from the street.

    Look for:
    - the rendered front on De Leeuw van Vlaanderenstraat
    - the large windows of the through studios
