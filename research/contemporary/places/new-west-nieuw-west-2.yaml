- title: EDGE West
  summary: "A 1970s open-plan office built for the construction industry's social fund, its eight clover-shaped wings now ringed round a planted atrium under a glass dome. The 2022 remodel is by the successor firm of the original architects."
  body: |
    On 5 November 1970 minister Roolvink drove the first pile for a new office of the Stichting Sociaal Fonds Bouwnijverheid on the Basisweg. Its architect, A.N. Oyevaar of Oyevaar, Stolle en Van Gool, gave the fund an office garden: open floors meant to express equality between staff, something Dutch offices had not yet seen. The plan is built from octagons, eight clover-shaped wings on seven floors of about 7,000 m² each, around an empty core with little light.

    The developer EDGE bought the building and reopened it as offices in 2022, after a remodel by de Architekten Cie., the successor of Oyevaar's firm. They kept the frame and the open floors, gave the outer façade a new form and new materials, and covered the core with a glass dome that EDGE says spans 76 metres. Below it DS Landschapsarchitecten laid out a planted atrium that works as the meeting place, and four open staircases replaced the lift shafts to tempt people to walk. With about 6,000 m² of solar panels and thermal storage in the ground the building has no gas connection and, by Arcam's account, makes more energy than it uses. It holds BREEAM Outstanding and WELL Platinum certificates.

    Visiting: a working office building (the grid company Alliander is one tenant); see it from the street.

    Look for:
    - the stepped, many-cornered outline of the eight wings
    - the new façade wrapped round the 1970s frame
    - the large terraces on the first floor
