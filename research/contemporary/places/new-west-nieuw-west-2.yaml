  nl:
    title: Zaans Medisch Centrum
    summary: "Het ziekenhuis van Zaandam, van gevel tot interieur ontworpen door Mecanoo en in gebruik sinds januari 2017: poliklinieken, verpleegafdelingen en een flexibele laag in één compact blok, rond een hoge houten hal met een glijbaan voor kinderen."
    body: |
      Mecanoo noemt dit het eerste lean ziekenhuis van Nederland: een compact gebouw waarin elke vorm van verspilling is weggeorganiseerd. Het was ook het eerste ziekenhuis van het bureau, en Mecanoo deed alles zelf: gebouw, stedenbouwkundig plan, landschap en interieur. Opdrachtgevers waren het Zaans Medisch Centrum en ontwikkelaar Vitaal ZorgVast, BAM bouwde. Het gebouw was in 2016 klaar; op 28 januari 2017 verhuisde het ziekenhuis vanuit de oudbouw ernaast, met zo'n 130 patiënten in hun bed door een verwarmde tunnel.

      Twee lagen poliklinieken en twee lagen verpleegafdelingen liggen op elkaar, met daartussen een flexibele laag voor ondersteunende functies. Poli's en afdelingen zijn zoveel mogelijk gelijk gemaakt, zodat ze later van functie kunnen wisselen. Bezoekers komen binnen in een hal van een paar verdiepingen hoog die meer weg heeft van een openbaar gebouw dan van een ziekenhuis: halfronde vides en daklichten, hout, felle kleuren en uitzicht naar buiten. Handgetekende illustraties van SILO op wanden, glas en liften verwijzen naar de Zaanse industrie, en kinderen kunnen via een glijbaan naar beneden. In 2018 won het bij de Frame Awards de publieksprijs voor zorggebouw van het jaar.

      Bezoek: de hal en de andere openbare delen zijn voor iedereen toegankelijk.

      Let op:
      - de hoge hal met de halfronde vides
      - de tekeningen van Zaanse fabrieken op wanden en glas
      - de wenteltrapglijbaan voor kinderen
    arch:
      recognition: Frame Awards 2018, publieksprijs Healthcare Centre of the Year

- title: Pondok
  summary: "A four-storey live-work building whose future residents, a self-build group from the squatting scene, were its client and saw it through almost ten years. Each household drew its own unit, which shows in the patchwork façade; the ground floor is for the neighbourhood."
  body: |
    Pondok is a collective private commission (CPO): the future residents, a self-build group from Amsterdam's squatting scene, were together the client. Architect Tom Jonker of CRUQ had long been working on a vision for the group, which wanted a building that was sustainable, affordable and socially engaged; in the years of the financial crisis that proved hard. After almost ten years the building was completed in 2018 in the Delflandpleinbuurt in Slotervaart, on a site the city chose between Zuid and the Westlandgracht, as a step toward closing the gap between inside and outside the ring road.

    Of the four floors, the upper three hold live-work units of 180 or 90 m², each designed by its own resident, hence the varied façades. Wide, open galleries at the back are meant for running into the neighbours. The ground floor is kept for uses that serve the neighbourhood, made possible partly by crowdfunding; Arcam names a local dance school and a work-experience business as the tenants. Solar panels, a connection to a shared heat network, reuse of shower water, vegetable gardens and a fruit orchard are part of the plan. It was nominated for the Amsterdamse Architectuur Prijs in 2019.

    Visiting: homes and workplaces; see it from the street.

    Look for:
    - the patchwork of façades, one per household
    - the open galleries at the back
