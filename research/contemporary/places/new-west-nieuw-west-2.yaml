  nl:
    title: Opportuna
    summary: "Woontoren van twintig lagen met 174 kleine sociale huurwoningen voor 23- tot 28-jarigen, deels met voorrang voor jongeren uit Nieuw-West. De dragende gevel van prefab beton knipoogt naar de wederopbouwflats van de Westelijke Tuinsteden eromheen."
    body: |
      Lieven de Key liet deze toren van ongeveer 65 meter bouwen naast metrostation Postjesweg, als onderdeel van de verdichting van de Westelijke Tuinsteden. Het ontwerp is van Office Winhov met Office Haratori; in februari 2025 kwamen de eerste bewoners. De 174 sociale huurwoningen, elk met eigen voorzieningen en 32 tot 45 m² groot, zijn voor jongeren van 23 tot 28 jaar, met een huurcontract van hooguit vijf jaar. Een deel gaat met voorrang naar jongeren uit Nieuw-West. De naam kozen toekomstige bewoners zelf: Oportuna heette een jongerencentrum in de buurt, in 1998 geopend en gerund door jongeren uit de wijk.

      De architectuur grijpt terug op de wederopbouw van de jaren zestig in de omgeving. De gevel bestaat uit prefab betonelementen van twee of vier verdiepingen hoog. Omdat die gevel het gebouw draagt, kan de indeling binnen later nog veranderen. De woningen zijn breed en ondiep, zodat er veel zon binnenkomt, en hebben elk een eigen keuken, badkamer en Frans balkon. In de plint zitten een lounge en een studieruimte, bovenin ligt een gezamenlijk dakterras, en communitybuilders die er zelf wonen zetten activiteiten op touw.

      Opportuna was genomineerd voor de Amsterdamse Architectuurprijs 2026. De vakjury was te spreken over de architectuur en over de voorrang voor buurtjongeren, maar vond sommige ramen klein, een gevolg van de dragende gevel. De publieksjury was verdeeld over de tijdelijke contracten.

      Bezoek: woningen; bekijk het vanaf de straat.

      Let op:
      - de horizontale lijnen van de prefab gevel en de vele balkons
      - de gepolijste onderkant van de balkons, die de jury apart noemde
      - de bankjes in de plint aan de spoorkant
    arch:
      recognition: Amsterdamse Architectuurprijs 2026, genomineerd

- title: Cornelis
  summary: "A block of 85 homes built around children: galleries, a stair garden and wooden slides next to the stairs, and front-door windows at a child's eye height so kids can see whether a friend is home."
  body: |
    The city's tender asked for a building that would keep young families in the city. FARO architecten and Van Bergen Architectura won it in 2021 with a plan called Tikkertje Trap ("stair tag"), developed by BuildingforLife, Prosper Vitae and Heutink and completed in 2025 on the Schielandplein, behind the Cornelis Lelylaan. It holds 85 homes of 60 to 170 m², for sale and for free-sector rent, each with a south-facing outdoor space, over a double-height plinth with a day nursery, after-school care, a café and studios.

    The architects used the three-metre drop across the site for a network of halls, stairs and a planted stair garden by Dijk & Co, with wooden slides beside the stairs. Some homes open onto galleries hung off the façade in azobé timber, resting only on the concrete frame with no supports on the ground; others onto a wide, double-height corridor with a wooden floor. The routes recall the galleries of post-war slab blocks, where children played. The grey-green brick was developed for this building.

    At the Amsterdamse Architectuur Prijs 2026 all three public jurors had it in their top three ("a real people's architect"), but they wanted a winner with social housing, and Cornelis has none. The professional jury found its side to the square behind it cold and closed.

    Visiting: homes; see it from the street.

    Look for:
    - the timber frame of the hanging galleries on the Schielandplein side
    - the grey-green brick
    - the more robust city face toward the Cornelis Lelylaan
  category: housing
  lat: 52.357496
