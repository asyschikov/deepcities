  nl:
    title: EDGE West
    summary: "Kantoortuin uit de jaren zeventig, gebouwd voor het Sociaal Fonds Bouwnijverheid. De acht klaverbladvleugels staan nu rond een groen atrium onder een glazen koepel. De verbouwing van 2022 is van de opvolger van het oorspronkelijke architectenbureau."
    body: |
      Op 5 november 1970 sloeg minister Roolvink aan de Basisweg de eerste paal voor een nieuw kantoor van de Stichting Sociaal Fonds Bouwnijverheid. Architect A.N. Oyevaar (Oyevaar, Stolle en Van Gool) ontwierp een kantoortuin: grote open vloeren, bedoeld als uitdrukking van gelijkwaardigheid op de werkvloer, en in die tijd iets nieuws in Nederland. De plattegrond gaat uit van de achthoek: acht klavervormige vleugels, zeven lagen van elk zo'n 7.000 m², rond een lege kern waar weinig daglicht kwam.

      Ontwikkelaar EDGE kocht het pand en liet het verbouwen door de Architekten Cie., het bureau dat uit dat van Oyevaar voortkwam; in 2022 ging het weer open als kantoor. Het casco en de open vloeren bleven, de buitengevel kreeg een nieuwe vorm en nieuwe materialen, en over de kern kwam een glazen koepel met volgens EDGE een overspanning van 76 meter. Daaronder legde DS Landschapsarchitecten een beplant atrium aan, de plek waar iedereen elkaar treft. Vier open trappen namen de plaats in van de liftschachten, zodat mensen eerder lopen. Ruim 6.000 m² zonnepanelen en warmte-koudeopslag maken het gebouw gasloos; volgens Arcam wekt het meer energie op dan het verbruikt. Het heeft de certificaten BREEAM Outstanding en WELL Platinum.

      Bezoek: een kantoorgebouw in gebruik (netbeheerder Alliander is een van de huurders); bekijk het vanaf de straat.

      Let op:
      - de getrapte omtrek met al zijn hoeken, de acht vleugels
      - de nieuwe gevel om het casco uit de jaren zeventig
      - de grote terrassen op de eerste verdieping

- title: Opportuna
  summary: "A 20-storey tower of 174 small social-rent flats for 23 to 28 year olds, some kept for young people from Nieuw-West. Its load-bearing façade of prefab concrete takes its cue from the 1960s blocks of the Westelijke Tuinsteden around it."
  body: |
    Housing association Lieven de Key built this tower of about 65 metres next to metro station Postjesweg, as part of the plan to densify the Westelijke Tuinsteden. Office Winhov designed it together with Office Haratori, and the first residents moved in in February 2025. The 174 self-contained social-rent flats of 32 to 45 m² go to 23 to 28 year olds on contracts of at most five years, part of them with priority for young people from Nieuw-West. Future residents picked the name: Oportuna was a youth centre in the area, opened in 1998 and run by local young people themselves.

    The design refers to the post-war rebuilding architecture of the 1960s around it. The façade is made of prefab concrete elements that each span two or four storeys; because the façade carries the load, the floors inside can be laid out differently later. The flats are wide and shallow to catch the sun, each with its own kitchen, bathroom and French balcony. There is a lounge and a study room in the plinth and a shared roof terrace high up, and community builders who live in the building organise activities.

    It was nominated for the Amsterdamse Architectuur Prijs 2026. The professional jury praised the architecture and the priority for local young people but found some windows small, a side effect of the load-bearing façade; the public jury was divided over the five-year contracts.

    Visiting: homes; see it from the street.

    Look for:
    - the horizontal lines of the prefab façade and its many balconies
    - the polished undersides of the balconies, which the jury singled out
    - benches in the plinth facing the railway side
  category: housing
  lat: 52.363618
  lng: 4.835078
  address: Postjesweg, by the August Allebéplein and metro station Postjesweg, Amsterdam Nieuw-West
