  nl:
    title: Amsterdam Vertical
    summary: "De eerste woningen in dit deel van het kantorengebied Sloterdijk: 168 stuks in twee blokken van vijf ontwerpteams. Rond de oostelijke toren lopen plantenbakken; elke laag is beplant als een ander landschap uit de Brettenzone."
    body: |
      Kavel N was het eerste woonproject in dit stuk van Sloterdijk. Heijmans stelde er een team voor samen: NL Architects als coördinator, met Space Encounters, studio Donna van Milligen Bielke, Chris Collaris (i29) en VDNDP, en DS landschapsarchitecten voor het groen. De 168 woningen, opgeleverd in 2022 en 2023, lopen bewust sterk uiteen in grootte, zodat er een gemengde bewonersgroep komt.

      Het westelijke blok (N1) is een samenspel van verschillende handschriften. Space Encounters tekende dozen met aluminium schubben, NL Architects donkere volumes van betonsteen, Collaris een lichtere houten plint, en Van Milligen Bielke bovenop een toren met lofts die als een rotsblok oogt, met in de gevel gaten voor vogels, vleermuizen en insecten. Het oostelijke blok (N3) zet een met hout beklede toren van zeventien lagen, ook van NL Architects, op een sokkel van zes lagen. De verdiepingen steken uit en dragen doorlopende plantenbakken; elke laag staat voor een ander landschap uit de Brettenzone, van volkstuin en begraafplaats tot moeras en duin. Arcam telt meer dan tweehonderd nestkasten, naden en kieren. Regenwater onder de daktuinen gaat via sensoren naar de planten die het nodig hebben. De warmte-koudeopslag, zonnepanelen, windturbines en accu's zijn van de VvE.

      Bezoek: woningen; bekijk het vanaf de straat.

      Let op:
      - de gestapelde plantenbakken rond de oostelijke toren
      - de verschillende gevels van het westelijke blok, per architect
      - de nestopeningen in de westelijke toren

- title: De Hood
  summary: "A small youth centre in a green strip in Osdorp: a glass ground floor so the neighbours can see what goes on inside, under a closed, lumpy white upper storey where the young people have a room of their own."
  body: |
    When a youth centre was planned for the Reimerswaalbuurt, neighbours feared it would bring trouble to the street. Atelier Kempe Thill (André Kempe and Oliver Thill, with David van Eck) won the invited competition and answered with two opposite floors stacked on a footprint of 15 by 8.5 metres. The ground floor is glazed all round, with panes five metres long and structurally glued glass doors: a drop-in room, kitchen and small office that the neighbourhood can look straight into, the tree canopy outside becoming part of the room. The upper floor is closed, insulated against noise and lit only from above, a room the young people have to themselves.

    The glass ate much of the tight budget, so the upper walls got what Arcam calls the cheapest finish available in the Netherlands: polyurethane sprayed over sand-lime brick, which gives the white upper storey its lumpy skin. It was built for Ymere and Bouwfonds, opened in 2011 and was nominated for the Amsterdamse Architectuur Prijs in 2012. It is still a youth centre, with activities for 10 to 23 year olds run by ONE Jongerenwerk.

    Visiting: a centre for local young people; others see it from the path.

    Look for:
    - the fully glazed ground floor among the trees
    - the lumpy white sprayed skin of the upper storey
