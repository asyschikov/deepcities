  nl:
    title: Pondok
    summary: "Woon-werkgebouw van vier lagen, na bijna tien jaar gerealiseerd door een zelfbouwgroep uit de krakersbeweging die zelf opdrachtgever was. Elk huishouden ontwierp de eigen unit, en dat zie je aan de lappendeken van gevels. De begane grond is voor de buurt."
    body: |
      Pondok is een project in collectief particulier opdrachtgeverschap (CPO): de latere bewoners, een zelfbouwgroep uit de Amsterdamse krakerswereld, waren samen de opdrachtgever. Architect Tom Jonker van CRUQ werkte al lang aan een visie voor de groep, die duurzaam, betaalbaar en maatschappelijk betrokken wilde bouwen. In de crisisjaren viel dat niet mee. Na bijna tien jaar kwam het gebouw in 2018 gereed in de Delflandpleinbuurt in Slotervaart. De gemeente had de plek tussen Zuid en de Westlandgracht uitgekozen om het verschil tussen de buurten binnen en buiten de ring kleiner te maken.

      Van de vier verdiepingen bevatten de bovenste drie woon-werkunits van 180 of 90 m², die elke bewoner zelf ontwierp; vandaar de afwisselende gevels. Aan de achterkant lopen brede, open galerijen waar je de buren tegenkomt. De begane grond is voorbehouden aan functies voor de buurt, deels betaald met crowdfunding; volgens Arcam zitten er een dansschool uit de wijk en een werkervaringsbedrijf. Zonnepanelen, een aansluiting op een collectief warmtenet, hergebruik van douchewater, moestuinen en een boomgaard horen bij het plan. In 2019 was Pondok genomineerd voor de Amsterdamse Architectuurprijs.

      Bezoek: woningen en werkplekken; bekijk het vanaf de straat.

      Let op:
      - de lappendeken van gevels, één per huishouden
      - de open galerijen aan de achterkant
    arch:
      recognition: Amsterdamse Architectuurprijs 2019, genomineerd
