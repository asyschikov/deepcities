  nl:
    title: De Houten Leeuw
    summary: "Houten woongebouw met 53 sociale huurstudio's voor jongvolwassenen in de Kolenkitbuurt, in minder dan een jaar opgetrokken uit kruislaaghout. Aan de achterkant een houten galerij met een trap die omlaag golft en een bankje bij elke woning."
    body: |
      Volgens Arcam is De Houten Leeuw het eerste appartementengebouw in de Amsterdamse sociale sector dat helemaal van hout is. Stadgenoot gaf de opdracht aan Heren 5 architecten (inmiddels SOME architecten), met M.J. de Nijs en Zonen als ontwikkelaar en Hamlet voor de houtconstructie. In november 2024 was het af, vlak achter de Kolenkitkerk. De 53 studio's van ongeveer 35 m² zijn een eerste eigen plek voor jongeren van 18 tot 28 jaar.

      Vloeren en wanden zijn van cross laminated timber (CLT), het trappenhuis ook: zo'n 760 m³ hout uit Oostenrijk. Het hele skelet stond er volgens de bouwer in negen weken. Elke studio loopt van voor naar achter door, met in het midden een pod met keuken en badkamer. Achter het gebouw leunt een galerij van azobé ertegenaan, stijf gehouden door een hoek van CLT-platen van 16 meter hoog. Daardoor kon een trappenhuis of liftkern binnen achterwege blijven. Langs de galerij klimt een brede trap in treden omhoog, en bij elke woning staat een eigen bankje met opbergbak.

      De voorkant is gestuct. De gevel bezorgde de commissie ruimtelijke kwaliteit van de gemeente hoofdbrekens, en de vakjury van de Amsterdamse Architectuurprijs 2025 noemde het stucwerk een verstandig compromis. De publieksjury was weg van de warme houten achterkant maar vond de voorkant dicht. Beide jury's zagen vooral gesloten gordijnen.

      Bezoek: woningen; bekijk het vanaf de straat.

      Let op:
      - de gestucte voorgevel aan De Leeuw van Vlaanderenstraat
      - de grote ramen van de doorzonstudio's
    arch:
      recognition: Amsterdamse Architectuurprijs 2025, genomineerd

- title: Amsterdam Vertical
  summary: "The first homes in this corner of the Sloterdijk office district: 168 of them in two blocks by five design teams. The eastern tower is ringed with planters, each floor planted after a different landscape of the nearby Brettenzone."
  body: |
    Kavel N was the first housing in this part of Sloterdijk, and the builder-developer Heijmans put together a team for it: NL Architects as coordinator, with Space Encounters, studio Donna van Milligen Bielke, Chris Collaris (i29) and VDNDP, and DS landschapsarchitecten for the planting. The 168 homes, completed in 2022 and 2023, come in a deliberately wide range of sizes, to draw a mixed population.

    The western block (N1) is a collage by different hands: boxes clad in aluminium shingles by Space Encounters, dark concrete-brick volumes by NL Architects, a lighter timber plinth by Collaris, and on top a rock-like tower of lofts by Van Milligen Bielke, its façade full of openings for birds, bats and insects. The eastern block (N3) sets a 17-storey timber-clad tower by NL Architects on a six-storey base. Its floors jut out to carry continuous planters, each level planted after a different landscape of the Brettenzone, from allotment and cemetery to swamp and dunes. Arcam counts more than 200 nest boxes and crevices for insects and bats. Rainwater stored under the roof gardens is fed to the plants by a sensor-driven system, and the residents' association owns the building's own heat and cold storage, solar panels, small wind turbines and batteries.

    Visiting: homes; see it from the street.

    Look for:
    - the stacked planters round the eastern tower
    - the different façades of the western block, one per architect
    - nesting openings in the western tower
