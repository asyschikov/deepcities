  nl:
    title: Slingerapenverblijf, Artis
    summary: Klein paviljoen van hout en glas uit 2019, op palen in de noordelijke vijver van Artis, voor de zwarte slingerapen. Hun eiland is opgebouwd uit lagen wilgentenen, en het was het eerste dierenverblijf in Artis dat zonder fossiele brandstof wordt verwarmd.
    body: |
      Tot 1866 liep de Nieuwe Prinsengracht dwars door Artis en voeren bezoekers met een pontje over. Toen de gracht dicht ging, bleven er drie vijvers over. Aan de noordelijke legde de dierentuin in 1911 't Veentje aan, een moerasje naar het voorbeeld van het Naardermeer. In 2019 kregen de zwarte slingerapen hier een nieuw huis, ontworpen door Enzo Valerio.

      Het paviljoen staat op palen in het water, tussen hoge bomen, zodat de apen zo veel mogelijk leven zoals in de boomkruinen. Doordat het verblijf op palen staat, is ook de monumentale oeverlijn weer te zien. Het eiland van de apen bestaat uit gestapelde rasters van wilgentenen, aangevuld met baggerslib en aarde. In de houten constructie zit een op maat gemaakte warmte-koudeopslag; volgens Arcam is het het eerste verblijf in Artis dat fossielvrij wordt verwarmd. Door het glas rondom spiegelt het gebouwtje de bomen en lost het soms bijna op. Bezoekers kijken over het water naar de apen, niet door hoge hekken.

      Artis zegt er zelf eerlijk bij dat 't Veentje met dit eiland ophield een stukje Hollandse natuur te zijn, al komen reigers en aalscholvers er nog steeds. Toegang met een Artis-kaartje.

      Let op:
      - de weerspiegeling in de glazen wanden
      - het apeneiland naast het paviljoen
      - de gerestaureerde bruggen over de vijver
    arch:
      recognition: Amsterdamse Architectuur Prijs 2020, genomineerd

- title: Bijzondere Collecties (Allard Pierson)
  summary: The university's rare books moved in 2007 into three houses of 1642 by Philips Vingboons, an old hospital gateway and the front of a former institution, all listed. Behind them a glass wall shows off the jumbled old back walls as if in a display case.
  body: |
    In 1642 the regents of the Sint Pietersgasthuis had a row of nine houses built on the Oude Turfmarkt to Philips Vingboons's design, rented out for income. De Nederlandsche Bank later filled several of them, and in the 1860s six made way for its new head office, now the Allard Pierson museum. Three survived, their pointed gables swapped for a straight cornice in the nineteenth century.

    Between 2004 and 2007 Atelier PRO, with Merkx+Girod on the interiors, joined those three houses, the Gasthuispoort and the former Sint Bernardusgesticht of 1883 into one library for the university's Special Collections: twelve kilometres of manuscripts, early printed books, maps, globes and archives, moved from the Singel. The work was done under strict heritage rules, with archaeological digs. Of the gesticht only the front was kept, with a new structure behind it. The vaulted gateway became the way in, and a glass rear wall turns the untidy old back fronts on the inner court into exhibits. Queen Beatrix opened it on 11 May 2007; since 2019 it is part of the Allard Pierson.

    The reading room is open on weekdays for consulting the collections; the museum next door is open Tuesday to Sunday.

    Look for:
    - the straight cornice over the three Vingboons houses
    - the gateway with its brick barrel vault
    - the two window bays added on the left of the old gesticht
  category: civic
  lat: 52.368464
  lng: 4.893243
  address: Oude Turfmarkt 129
