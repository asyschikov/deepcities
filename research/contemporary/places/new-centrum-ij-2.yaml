  nl:
    title: Westerkaap
    summary: Woonblok uit 2008 op het voormalige rangeerterrein van het Westerdokseiland, gebouwd boven op een grote parkeergarage. De woningen liggen rond drie gedeelde hoven, elk met een eigen materiaal (steen, hout of groen); de hoge vleugels kijken uit over het IJ en het Westerdok.
    body: |
      Het Westerdokseiland, schuin achter het Centraal Station, was rangeerterrein van de spoorwegen voor er een dichtbebouwde wijk kwam. Westerkaap, opgeleverd in 2008, is het op een na noordelijkste bouwblok. Amvest ontwikkelde het met de corporaties Ymere en Lingotto; huur en koop staan er door elkaar.

      Het hele blok staat op een grote ondergrondse parkeergarage. Op het dak daarvan liggen drie binnenhoven, in het project cours genoemd, gescheiden door rijen eengezinswoningen met hun voor- en achterdeur aan de hoven. Een eigen tuin hebben die huizen niet; de hoven zijn gemeenschappelijk. DKV Architecten, Baneke van der Hoeven en AWG ontwierpen per hof steeds met z'n tweeën, en DS Landschapsarchitecten gaf elke hof een thema dat past bij de gevels: steen, hout of groen, met bamboe en rotan.

      Aan de buitenkant is het blok sober rood baksteen, behalve waar hout, bamboe en steen de poorten naar de hoven markeren. De appartementen en penthouses zitten in de hogere vleugels langs de lange zijden, met uitzicht op het IJ en het Westerdok. Het zijn woningen: alleen van buiten te bekijken.

      Let op:
      - de hoge poorten naar de hoven
      - de gevels van DKV met afwisselend staande en liggende stroken
      - het baksteenreliëf en de dubbelhoge kaders van Baneke van der Hoeven
    arch:
      recognition: Amsterdamse Architectuur Prijs 2009, genomineerd

- title: Kindercampus De Jordaan
  summary: A slim school building of 2013 in the narrow Elandsstraat, by Micha de Haas. White brick to lighten the dark street, a glass ground floor printed with a poem by Mies Bouhuys, split levels inside, a green wall at the back and a greenhouse on the roof.
  body: |
    Micha de Haas designed this building for the city, completed in 2013. It brings together a branch of the 14th Montessori school, a gym, after-school care and the neighbourhood association Ons Genoegen under one roof.

    The plot stands beside one of the Jordaan's old alleys, which once led to back houses and a playground behind. Because that alley is a way into a public space rather than just a gate, the architect put the entrance in the side wall. To bring light into the narrow, dark street he clad the front in traditional white brick and made the ground floor all glass. On the glass, designed by Roosje Klap, is a poem about play by the writer Mies Bouhuys, herself a former Jordaan resident. Above the door is a restored gable stone, De Vergulde Dolfijn, recalling the Dolfijnengang, the alley that once ran here.

    Inside, split levels fit two classrooms per floor with a raised shared space between them, in the Montessori way; you can read them in the staggered windows. The south wall at the back is a vertical garden that shades the classrooms in summer and lets the sun in once the leaves fall, and the children tend a greenhouse on the roof. It is a school: outside only.

    Look for:
    - the gable stone De Vergulde Dolfijn
    - Mies Bouhuys's poem on the glass
    - the staggered windows of the split levels
