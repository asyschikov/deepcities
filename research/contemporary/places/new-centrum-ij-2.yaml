  nl:
    title: Kindercampus De Jordaan
    summary: Smal schoolgebouw uit 2013 in de nauwe Elandsstraat, van Micha de Haas. Wit metselwerk voor licht in de donkere straat, een glazen plint met een gedicht van Mies Bouhuys, splitlevels binnen, een groene achtergevel en een kas op het dak.
    body: |
      Micha de Haas ontwierp dit gebouw in opdracht van de gemeente; in 2013 was het klaar. Onder één dak zitten een dependance van de 14e Montessorischool, een gymzaal, buitenschoolse opvang en buurtvereniging Ons Genoegen.

      De kavel ligt aan een van de oude Jordaanse stegen, die vroeger naar achterhuizen en een speeltuin leidde. Zo'n steeg is meer dan een poort, het is een toegang tot iets openbaars; daarom zit de ingang in de zijgevel. De straat is smal en donker, dus kreeg de voorgevel wit metselwerk en werd de begane grond helemaal van glas. Daarop staat, in een ontwerp van Roosje Klap, een gedicht over spelen van Mies Bouhuys, die zelf in de Jordaan heeft gewoond. Boven de deur hangt de opgeknapte gevelsteen De Vergulde Dolfijn, een verwijzing naar de verdwenen Dolfijnengang op deze plek.

      Binnen zorgen splitlevels voor twee klaslokalen per verdieping met een verhoogde gezamenlijke ruimte ertussen, zoals het Montessori-onderwijs vraagt. Aan de verspringende ramen in de gevel kun je ze aflezen. De zuidgevel achter is een verticale tuin: 's zomers schaduw, 's winters, als het blad eraf is, licht en warmte. Op het dak staat een kas waar de kinderen leren tuinieren. Het is een school, dus alleen van buiten.

      Let op:
      - de gevelsteen De Vergulde Dolfijn
      - het gedicht van Mies Bouhuys op het glas
      - de verspringende ramen van de splitlevels
    arch:
      recognition: Amsterdamse Architectuur Prijs 2014, genomineerd

- title: Centraal Station metro station (Noord/Zuidlijn)
  summary: The Noord/Zuidlijn's station under the square in front of Centraal Station, opened in 2018, a tall grey hall nicknamed the Cathedral. To get the tracks under the 1889 station, a 136-metre concrete tunnel was floated in from the IJ and sunk beneath it.
  body: |
    Benthem Crouwel were commissioned in 1996 to design the stations of the new north-south metro line; after 22 years of politics, engineering and building, it opened in July 2018. Their idea, the one that won over the selection committee, was the shortest possible route from street to platform, with daylight as a guide and no underground maze.

    At Centraal the station hall lies under the Stationsplein. Arcam calls it the "Kathedraal": a high hall under a striking ceiling, carried on heavy A-shaped columns that hide all the technical services, finished in calm shades of grey. Getting the line under the station itself was the hard part. The 1889 building was given a new foundation, and in July 2011 a concrete tunnel section 136 metres long was floated in from the IJ and lowered into a pit beneath it. The slot above the tracks, 23.5 metres long, was meant for a media screen; it now holds David Claerbout's artwork, whose weather follows the forecast.

    The line won the Amsterdamse Architectuur Prijs 2019, a unanimous choice by the expert jury, and the seven stations were BNA Best Building of the Year 2019. You need a metro ticket to reach the platforms.

    Look for:
    - the A-shaped columns along the platforms
    - the long artwork slot above the tracks
    - the BNA plaque at the Damrak entrance
