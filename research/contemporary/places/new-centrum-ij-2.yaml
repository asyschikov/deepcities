  nl:
    title: Metrostation Centraal Station (Noord/Zuidlijn)
    summary: Station van de Noord/Zuidlijn onder het Stationsplein, open sinds 2018. Een hoge grijze hal, de Kathedraal genoemd. Om de sporen onder het station uit 1889 te krijgen, werd vanaf het IJ een betonnen tunnelstuk van 136 meter naar binnen gevaren en afgezonken.
    body: |
      In 1996 kreeg Benthem Crouwel de opdracht voor de stations van de nieuwe metrolijn van Noord naar Zuid. Na 22 jaar politiek, rekenwerk en bouwen reed in juli 2018 de eerste metro. Het uitgangspunt van de architecten: zo kort mogelijk van straat naar perron, met daglicht als wegwijzer en zonder ondergronds doolhof.

      Bij Centraal ligt de stationshal onder het Stationsplein. Arcam noemt hem de Kathedraal: een hoge hal met een opvallend plafond, gedragen door zware staanders in de vorm van een A waarin alle techniek is weggestopt, afgewerkt in rustige grijstinten. Het lastigste was de doorgang onder het stationsgebouw zelf. Dat gebouw uit 1889 kreeg eerst een nieuwe fundering. In juli 2011 werd een betonnen tunnelstuk van 136 meter lang vanaf het IJ ingevaren en in een bouwput onder het station neergelaten. De sleuf van 23,5 meter boven de sporen was bedoeld voor een mediascherm; nu zit er een kunstwerk van David Claerbout in, waarvan het weer de weersverwachting volgt.

      De vakjury van de Amsterdamse Architectuur Prijs koos de Noord/Zuidlijn in 2019 unaniem als winnaar, en de zeven stations werden BNA Beste Gebouw van het Jaar 2019. Voor de perrons heb je een vervoerbewijs nodig.

      Let op:
      - de A-vormige staanders langs de perrons
      - de lange sleuf met het kunstwerk boven de sporen
      - het BNA-bordje bij de ingang aan het Damrak
    arch:
      recognition: Amsterdamse Architectuur Prijs 2019 (Gouden AAP, voor de Noord/Zuidlijn); BNA Beste Gebouw van het Jaar 2019 (de zeven stations); A.M. Schreudersprijs
