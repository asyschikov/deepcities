  nl:
    title: Bijzondere Collecties (Allard Pierson)
    summary: De zeldzame boeken van de universiteit verhuisden in 2007 naar drie Vingboons-huizen uit 1642, een oude gasthuispoort en de gevel van een voormalig gesticht, allemaal rijksmonument. Achterin zet een glazen wand de rommelige oude achtergevels als in een vitrine.
    body: |
      In 1642 lieten de regenten van het Sint Pietersgasthuis aan de Oude Turfmarkt een rij van negen huizen bouwen naar ontwerp van Philips Vingboons; de huur kwam het gasthuis ten goede. Later trok De Nederlandsche Bank in een aantal ervan, en in de jaren 1860 moesten er zes wijken voor het nieuwe bankgebouw, nu het museum Allard Pierson. Drie bleven staan. Hun puntgevels werden in de negentiende eeuw vervangen door een rechte kroonlijst.

      Tussen 2004 en 2007 voegde Atelier PRO, met Merkx+Girod voor het interieur, die drie huizen, de Gasthuispoort en het voormalige Sint Bernardusgesticht uit 1883 samen tot één bibliotheek voor de Bijzondere Collecties van de UvA. Twaalf kilometer handschriften, oude drukken, kaarten, globes en archieven verhuisde daarvoor van het Singel hierheen. Er golden strenge monumenteneisen en er werd archeologisch gegraven. Van het gesticht bleef alleen de voorgevel staan, met een nieuwe opbouw erachter. De poort met zijn gemetselde tongewelf werd de ingang, en aan de achterkant maakt een glazen gevel van de rommelige achterkanten rond het binnenterrein een soort vitrine. Koningin Beatrix opende het op 11 mei 2007; sinds 2019 hoort het bij het Allard Pierson.

      De studiezaal is op werkdagen open voor wie de collecties wil inzien; het museum ernaast is van dinsdag tot en met zondag open.

      Let op:
      - de rechte kroonlijst boven de drie Vingboons-huizen
      - de poort met het gemetselde tongewelf
      - de twee later toegevoegde vensterassen links aan het oude gesticht
    arch:
      recognition: Amsterdamse Architectuur Prijs 2008, genomineerd; BNA Gebouw van het Jaar 2008, genomineerd

- title: Verdana (Funen Blok K)
  summary: NL Architects' block of ten houses in the car-free Funenpark, finished in 2009. Every house got the same 633 cubic metres, then was stretched or squashed around a diagonal lane, which gave the block its wildly rolling green roof.
  body: |
    The Funen, on the site of Zeeburg, the city bastion that survived longest, was planned in 2000 by Frits van Dongen of Architecten Cie as sixteen separate blocks in a car-free park, each with its own design, by nine architects in all. NL Architects' Blok K, known as Verdana, was the last of them, completed in 2009.

    The rules said two and a half storeys, with half of the top floor a roof terrace. The architects read that as a block 7.5 metres high, then started pushing. They turned the central access lane slightly so it runs diagonally, which gave every house a different footprint and opened a shortcut through the block. To keep each of the ten houses at the same volume, 633 cubic metres, the short ones grew taller and the long ones lower, from one and a half to four storeys. The result is the rolling roof, covered in moss and sedum, with terraces poking out at seemingly random spots.

    Because front doors, meters and storage sit on that inner lane, the fronts facing the park could be largely glass. The houses are private; the park around them is open to all.

    Look for:
    - the rolling sedum roof
    - the gold-coloured window frames
    - the diagonal lane through the middle
