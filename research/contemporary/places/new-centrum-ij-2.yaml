  nl:
    title: Verdana (Funen Blok K)
    summary: Blok van tien woningen van NL Architects in het autovrije Funenpark, klaar in 2009. Elk huis kreeg dezelfde 633 kuub, die daarna rond een schuin steegje werd uitgerekt of samengedrukt. Zo ontstond het sterk golvende groene dak.
    body: |
      Het Funen ligt waar het bolwerk Zeeburg stond, het bolwerk dat het langst overeind bleef. Frits van Dongen van Architecten Cie maakte er in 2000 een plan voor: zestien losse woonblokken in een autovrij park, elk met een eigen ontwerp, van negen bureaus samen. Blok K van NL Architects, Verdana genoemd, kwam als laatste af, in 2009.

      Het plan schreef drie bouwlagen voor, waarvan de bovenste voor de helft daktuin moest zijn. De architecten maakten daar een blok van 7,5 meter hoog van en begonnen te schuiven. Het binnensteegje draaiden ze een stukje, zodat het diagonaal door het blok loopt; zo kreeg elke woning een andere plattegrond en ontstond er een doorsteek. Omdat alle tien de huizen even groot moesten blijven, 633 kubieke meter, werden de korte hoger en de lange lager, van anderhalve tot vier lagen. Dat leverde het golvende dak op, begroeid met mos en sedum, met dakterrassen die schijnbaar willekeurig naar buiten steken.

      Voordeuren, meters en bergingen liggen aan het binnensteegje, dus de gevels naar het park konden grotendeels van glas zijn. De huizen zijn privé; het park eromheen is voor iedereen.

      Let op:
      - het golvende sedumdak
      - de goudkleurige kozijnen
      - het schuine steegje door het midden
    arch:
      recognition: Amsterdamse Architectuur Prijs 2010, genomineerd

- title: Westerkaap
  summary: A 2008 housing block on the old railway yard of Westerdokseiland, built on top of a big car park. Its homes stand round three shared courts, each with its own material, stone, wood or green, and its taller wings look out over the IJ and the Westerdok.
  body: |
    Westerdokseiland, just north-west of Centraal Station, was a railway yard until it was rebuilt as a dense new quarter. Westerkaap, completed in 2008, is its second block from the north, developed by Amvest with the housing associations Ymere and Lingotto, with rented and owner-occupied homes side by side.

    The whole block sits on a large underground car park. On its roof are three inner courts, separated by rows of family houses whose front and back doors open onto them; the houses have no gardens of their own, and the courts are shared. DKV Architecten, Baneke van der Hoeven and AWG worked in pairs on each court, and DS Landschapsarchitecten gave each a theme matching the architects' materials: one stone, one wood, one green, with bamboo and rattan on the fronts.

    Outside, the block is plain red brick, except where wood, bamboo and stone mark the gates to the courts. The flats and penthouses are in the higher wings along the long sides, for the views over the IJ and the Westerdok. It is housing: outside only.

    Look for:
    - the tall gateways into the courts
    - DKV's facades of alternating vertical and horizontal strips
    - the brick relief and double-height frames by Baneke van der Hoeven
