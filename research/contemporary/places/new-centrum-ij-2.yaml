  nl:
    title: Het Duivenhuis, Artis
    summary: Tuinhuis dat ouder is dan Artis en later het duivenhuis van de dierentuin werd. Sinds 2025 een poffertjeskraam met boven een vergaderzaal. ATELIERFRONT zette er een houten veranda omheen die de verdwenen balkons en het houtsnijwerk in moderne vorm terugbrengt.
    body: |
      Het duivenhuis was er al voor de dierentuin. Het stond in een plezierhof die Artis in de jaren 1850 bij het terrein trok; volgens Artis is het rond 1730 gebouwd. Later in de negentiende eeuw werd het een verblijf voor sier- en postduiven, en daarna was het broedhuis, stal voor loopvogels en van 1928 tot 1943 het onderkomen van de eerste zeekoe van Artis. Het is een rijksmonument.

      Begin jaren twintig had het gebouwtje geen functie meer en liepen bezoekers er voorbij. ATELIERFRONT (Thomas Buijs en Marita Bijlsma) wilde samen met restauratiearchitect Cor Bouwstra terugbrengen wat in de loop der tijd was verdwenen: balkons met balusters, trappen, gesneden windveren. Het werd een houten veranda die deels dak en deels balkon is, met een groen dak erop. De Rijksdienst vond een eerdere versie met twee trappen aan de oostkant te overheersend; er bleef één trap aan de westkant over. Met de herstelde pui aan de zuidkant is de symmetrie terug. Het huisje is nu geïsoleerd en van het gas af.

      Beneden zit een poffertjeskraam met terras onder de veranda, boven een vergaderruimte. Je hebt een Artis-kaartje nodig.

      Let op:
      - de rand van de veranda die het licht zeeft als een bladerdak
      - de enkele trap aan de westzijde
      - de ruw gepleisterde muren van het oude huisje onder de veranda
    arch:
      recognition: Amsterdamse Architectuur Prijs 2026, genomineerd

- title: Spider monkey house, Artis
  summary: A small timber and glass pavilion of 2019 on stilts in Artis's northern pond, for the zoo's black spider monkeys. Their island is built up from layers of willow, and the house was the zoo's first animal home heated without fossil fuel.
  body: |
    Until 1866 the Nieuwe Prinsengracht ran through Artis, and visitors crossed it by ferry. When it was closed off, three ponds were left. On the edge of the northern one, the zoo laid out 't Veentje in 1911, a little marsh modelled on the Naardermeer. In 2019 the black spider monkeys moved here, into a house by the architect Enzo Valerio.

    The pavilion stands on posts in the water among tall trees, to come as close as possible to the treetop life of a spider monkey, and lifting it also put the listed old bank line back in view. The monkeys' island is built from stacked mats of woven willow filled with dredged mud and soil. A made-to-measure heat and cold storage system is built into the timber structure; Arcam calls it the first animal house at Artis heated without fossil fuels. With glass all round, the house mirrors the trees and sometimes almost disappears; visitors see the monkeys across the water instead of through high fences.

    Artis itself notes the cost: the island ended 't Veentje as a picture of Dutch nature, though herons and cormorants still come. You need an Artis ticket.

    Look for:
    - the reflections in the glass walls
    - the monkeys' island beside the pavilion
    - the restored bridges over the pond
  category: civic
  lat: 52.367075
  lng: 4.914784
  address: Artis, Plantage Kerklaan 38-40 (inside the zoo, by the northern pond)
  links:
