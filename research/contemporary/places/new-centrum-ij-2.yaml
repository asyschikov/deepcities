- title: Stadswerf Oostenburg
  summary: A new block of 2022 and 2023 on the old VOC shipyard island, where three firms drew one plan and then dealt out 32 separate buildings between them, house by house rather than plot by plot, so it would not look like one development.
  body: |
    From the seventeenth century the VOC built its ships on Oostenburg, and on this spot stood its East India warehouse, a building more than 200 metres long that collapsed in 1822. Then came the engine works of Werkspoor and later Stork. Stadswerf Oostenburg, finished in 2022 and 2023, is the new block opposite Werkspoor's Van Gendt halls.

    Paul de Ruiter Architects, Ronald Janssen Architecten and Bastiaan Jongerius Architecten made a joint sketch design first and then divided the buildings among themselves one by one, not plot by plot, to get more variety. Arcam counts 32 buildings on nine plots, with 551 homes from social rent to owner-occupied, plus offices, shops and studios. Brick, concrete, steel and wood hold the mix together. The buildings step down from 26 metres facing the Van Gendt halls to 19 metres on the far side.

    The streets are laid as one shipyard floor with no step between pavement and road, and parking is out of sight, so cars come as guests. The green inner garden is for residents; the streets, quays and ground-floor cafés are public.

    Look for:
    - the different hands in neighbouring fronts along the Oostenburgermiddenstraat
    - the kerbless "werfvloer" paving
    - the Van Gendt halls across the street
