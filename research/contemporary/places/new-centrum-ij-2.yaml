  nl:
    title: Stadswerf Oostenburg
    summary: Nieuw bouwblok uit 2022 en 2023 op het oude VOC-eiland. Drie bureaus maakten samen één schets en verdeelden daarna 32 panden onder elkaar, pand voor pand in plaats van per kavel, zodat het geen eenvormig complex zou worden.
    body: |
      Vanaf de zeventiende eeuw bouwde de VOC op Oostenburg haar schepen. Precies hier stond het Oost-Indisch Zeemagazijn, ruim 200 meter lang, dat in 1822 instortte. Daarna kwam de machinebouw, eerst van Werkspoor en later van Stork. Stadswerf Oostenburg, opgeleverd in 2022 en 2023, ligt recht tegenover de Van Gendthallen van Werkspoor.

      Paul de Ruiter Architects, Ronald Janssen Architecten en Bastiaan Jongerius Architecten tekenden eerst gezamenlijk een schetsontwerp. Daarna kreeg elk bureau losse panden toebedeeld, niet hele kavels, om meer afwisseling te krijgen. Volgens Arcam gaat het om 32 panden op negen kavels, met 551 woningen van sociale huur tot koop, plus kantoren, winkels en ateliers. Baksteen, beton, staal en hout houden het geheel bij elkaar. Tegenover de hallen is de bebouwing 26 meter hoog, aan de andere kant nog 19 meter.

      De openbare ruimte is één werfvloer, zonder hoogteverschil tussen stoep en rijbaan; auto's staan uit het zicht en zijn te gast. De groene binnentuin is voor de bewoners, de straten, kades en horeca in de plint zijn openbaar.

      Let op:
      - de verschillende handschriften naast elkaar langs de Oostenburgermiddenstraat
      - de werfvloer zonder stoepranden
      - de Van Gendthallen aan de overkant
    arch:
      recognition: Amsterdamse Architectuur Prijs 2023, genomineerd; Neprom-prijs 2024, shortlist

- title: Frederiksplein 1
  summary: Arthur Staal's 1967 office block on the Frederiksplein, a modernist building that still nods at the old houses it replaced. Office Winhov renewed it in 2022 without changing its character, and put the staff restaurant behind Staal's odd top-floor front.
  body: |
    Arthur Staal (1907 to 1993), a committed modernist, designed this office for an insurance bank; it went up in 1967, when the city was busy replacing old buildings with new ones. His task was to fit between two historic neighbours. He did it abstractly: the materials show that the plot once held two houses, and the top floor runs a continuous cornice line like the older fronts on the square.

    After years of neglect and ad hoc repairs, Office Winhov renovated it for the owner Egeria, which now has its office here; the work was finished in 2022. Rather than strip it, they kept the sixties character. The brick side and concrete side of the front were replaced in the same style to meet current energy standards, keeping the rhythm and depth of the frames. Inside, the low ceilings stayed, with a climate ceiling to keep it comfortable, and oak walls and cupboards were added. The top floor, behind Staal's eccentric front, is now the staff restaurant looking over the square.

    It is a working office: outside only.

    Look for:
    - the two halves of the front, one brick and one concrete
    - the top-floor band with its unusual frames
    - how its cornice line meets the older houses on the square
