  nl:
    title: Frederiksplein 1
    summary: Kantoor van Arthur Staal uit 1967 aan het Frederiksplein, modernistisch maar met een knipoog naar de oude panden die er stonden. Office Winhov knapte het in 2022 op zonder het karakter te veranderen; achter Staals eigenzinnige bovenste gevel zit nu het bedrijfsrestaurant.
    body: |
      Arthur Staal (1907-1993), een overtuigd modernist, ontwierp dit kantoor voor een verzekeringsbank. Het kwam er in 1967, midden in de jaren dat Amsterdam oude bebouwing volop verving. Staal moest aansluiten op twee historische buren en deed dat abstract: aan de materialen zie je dat op de kavel ooit twee panden stonden, en de bovenste verdieping volgt met een doorgaande lijn de oudere gevels rond het plein.

      Na jaren van achterstallig onderhoud en losse ingrepen renoveerde Office Winhov het pand voor eigenaar Egeria, dat er nu zelf kantoor houdt; in 2022 was het klaar. Er werd niets weggepoetst. De gevel, half baksteen en half beton, is vervangen in dezelfde stijl, zodat het pand weer aan de energie-eisen voldoet, met behoud van het ritme en de diepte van de kozijnen. Binnen bleven de lage plafonds, nu met een klimaatplafond, en kwamen er eikenhouten wanden en kasten bij. Op de bovenste etage, achter Staals bijzondere gevel, eet het personeel met uitzicht op het plein.

      Het is een kantoor: alleen van buiten te zien.

      Let op:
      - de twee helften van de gevel, baksteen en beton
      - de bovenste strook met de afwijkende kozijnen
      - hoe de lijn bovenin aansluit op de oudere buren
    arch:
      recognition: Amsterdamse Architectuur Prijs 2023, genomineerd

- title: Het Duivenhuis, Artis
  summary: A garden house older than the zoo, later Artis's pigeon house, turned in 2025 into a poffertjes stand with a meeting room upstairs. ATELIERFRONT gave it a new timber veranda that brings back the balconies and carved woodwork it had lost.
  body: |
    The pigeon house predates Artis. It stood in a pleasure garden that the zoo took over in the 1850s; Artis dates it to about 1730. Later in the nineteenth century it became a house for ornamental and homing pigeons, and it has since served as a hatchery, a stable for large flightless birds, and from 1928 to 1943 as home to the zoo's first manatee. It is a national monument.

    By the 2020s it had no use, and visitors walked past. ATELIERFRONT (Thomas Buijs and Marita Bijlsma), with the restoration architect Cor Bouwstra, wanted to bring back what it had lost over time: the balconies with balusters, the stairs and the carved bargeboards. Their answer is a wooden veranda that is partly roof and partly balcony, with a green roof. The heritage agency first found the design too dominant, with two stairs along the east side; it was reduced to a single stair on the west. Restoring the south front brought back the building's symmetry. It is now insulated and off gas.

    Downstairs is a poffertjes stand with a terrace under the veranda; the stair leads to a meeting room. You need an Artis ticket.

    Look for:
    - the timber veranda edge, filtering the light like leaves
    - the single stair on the west side
    - the rough plastered walls of the old house under the veranda
  category: civic
  lat: 52.365631
  lng: 4.916100
  address: Artis, Plantage Kerklaan 38-40 (inside the zoo)
