  nl:
    title: EMA-gebouw, het Brexit-kantoor dat in 18 maanden stond
    summary: Toen het Europees Geneesmiddelen Agentschap door de Brexit uit Londen moest vertrekken, bouwde de Nederlandse staat er een kantoor van 19 verdiepingen voor op de Zuidas. De bouw begon in mei 2018, in november 2019 ging de sleutel over. De haast bepaalde het ontwerp.
    body: |
      Door de Brexit moest het European Medicines Agency (EMA) in 2017 een nieuwe zetel buiten Londen zoeken. Het werd geen pitch tussen architecten maar tussen lidstaten, en die kozen voor Nederland: een nieuw gebouw op de Zuidas. Het Rijksvastgoedbedrijf begon direct met een schetsontwerp van zijn architect Fokke van Dijk, om iets te kunnen laten zien. MVSA Architects werkte het verder uit voor de bouwcombinatie van Dura Vermeer en Heijmans, die het pand ook twintig jaar onderhoudt.

      De bouwtijd mocht niet langer zijn dan 18 maanden, en dat lukte: in mei 2018 begon de bouw, op 15 november 2019 werd de toren opgeleverd. Volgens Van Dijk ga je daardoor anders schetsen. Er kwam een staalskelet rond een betonnen kern, met veel prefab; de gevelelementen werden vanaf de vloeren geplaatst, zonder steigers, en de installaties kregen een plek op de vierde verdieping in plaats van op het dak, zodat de afbouw eerder kon beginnen. Iets ingewikkelds als Valley was in die tijd volgens hem nooit gelukt.

      Binnen loopt een groene wand van zo'n 60 meter hoog langs de kantoorvloeren. Het is een werkend kantoor, dus je ziet het van buiten. Op het voorplein staat Pendullum, een negen meter hoog beeld van roestvrij staal van Gijs Assmann.

      Let op:
      - het rustige, regelmatige raster van de gevel
      - Pendullum op het voorplein
