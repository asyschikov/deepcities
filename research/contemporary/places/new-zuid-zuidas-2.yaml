  nl:
    title: Amsterdam Symphony, de oranje torens van de vastgoedfraude
    summary: Twee oranje torens van Pi de Bruijn uit 2009, een woontoren van 105 meter en een kantoortoren van 97 meter. In 2007 verkocht een dochter van Bouwfonds ze aan het Philips Pensioenfonds, voor een prijs die een hoofdrol kreeg in de Klimop-fraudezaak.
    body: |
      De twee torens zijn ontworpen door Pi de Bruijn van de Architekten Cie. In de hoogste, 105 meter en 29 verdiepingen, zitten woningen; de andere, 97 meter en 27 verdiepingen, is een kantoortoren. In september 2006 begon de bouw, in 2009 werd het complex in gebruik genomen. Het lagere blok van donkerrode baksteen ernaast is een hotel, van andere ontwerpers.

      In 2007 verkocht een dochterbedrijf van projectontwikkelaar Bouwfonds de torens aan het Philips Pensioenfonds, dat er volgens Het Parool veel te veel voor betaalde. Zo werd het complex onderdeel van de Klimop-zaak, de vastgoedfraude waarbij volgens NRC zowel het pensioenfonds als Bouwfonds werd benadeeld. Het fonds zag af van verhuur van de 82 appartementen en bracht ze in september 2009 in de verkoop. Het Parool noemde het de hoogste woontoren van Amsterdam; na tien weken waren er volgens de makelaar negentien verkocht, midden in de crisis. In december 2013 deed het pensioenfonds ook de kantoortoren van de hand.

      Er wordt gewoond en gewerkt, dus je bekijkt de torens van buiten.

      Let op:
      - de twee torens naast elkaar, de woontoren het hoogst
      - het donkerrode bakstenen hotel aan hun voet
