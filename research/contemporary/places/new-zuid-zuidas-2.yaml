  nl:
    title: Van der Valk Hotel Zuidas, het hotel dat op de vijfde verdieping begint
    summary: Hotel van Wiel Arets uit 2020, 55 meter hoog, op een driehoekige restkavel naast de A10. Onderin zitten vier lagen parkeergarage; lobby en restaurant liggen op de vijfde verdieping, met zicht rondom. Daarboven staan drie torens met zo'n 240 kamers.
    body: |
      Wiel Arets Architects ontwierp het hotel tussen 2014 en 2017; in 2020 was het klaar. De kavel is een driehoekig restje grond langs de Ring A10, en die driehoek bepaalde de vorm. Daarbij kwamen strenge randvoorwaarden: niet de grond in, niet te hoog vanwege de aanvliegroute van Schiphol, en parkeren, laden en lossen binnen de eigen grenzen. Volgens Arcam kreeg Arets de familie Van der Valk zover dat het een 'Van der Valk-special' werd, een gebouw dat architectonisch afwijkt van de rest van de keten.

      De oplossing was stapelen. De onderste vier lagen, even hoog als het talud van de ring, zijn een parkeergarage voor 143 auto's. Op de vijfde verdieping ligt de lobby, hoog genoeg om naar alle kanten over de stad te kijken, met terrassen die in de noord- en zuidgevel zijn uitgespaard. Daarop staan drie torens met ongeveer 240 kamers, en in een hoek van de bovenste laag een wellness met een driehoekig zwembad. Aan de kant van de snelweg staat een groene wand, met een nieuw gegraven vaart ervoor.

      Het hotel heet nu Hotel Amsterdam Zuidas. Binnenlopen kan: restaurant ZUID5 zit op de vijfde verdieping.

      Let op:
      - de driehoekige plattegrond, die er vanaf elke kant anders uitziet
      - de inkepingen in de torens, voor terrassen
      - de groene wand langs de A10
    arch:
      recognition: Amsterdamse Architectuurprijs 2021 (genomineerd)
