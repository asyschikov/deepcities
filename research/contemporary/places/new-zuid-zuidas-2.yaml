- title: Amsterdam Symphony, the orange towers of the property fraud
  summary: Two orange towers by Pi de Bruijn, finished in 2009, one of 105 metres with homes and one of 97 metres with offices. In 2007, while they were going up, a Bouwfonds subsidiary sold them to the Philips pension fund at a price at the heart of the Klimop fraud case.
  body: |
    Pi de Bruijn of de Architekten Cie. designed the two towers. The taller, 105 metres and 29 floors, holds apartments; the other, 97 metres and 27 floors, offices. Building began in September 2006 and the complex was in use in 2009. The lower block of dark red brick beside them is a hotel, designed by others.

    In 2007 a subsidiary of the developer Bouwfonds sold the towers to the Philips Pensioenfonds, which, Het Parool wrote, paid far too much for them. It became part of the Klimop case, the property fraud in which, as NRC put it, both the pension fund and Bouwfonds were the victims. The fund dropped its plan to rent out the 82 apartments and put them up for sale in September 2009. Het Parool called it Amsterdam's tallest residential tower, and the estate agent reported 19 sold in ten weeks, in the middle of the financial crisis. In December 2013 the pension fund sold the office tower too.

    The towers are homes and offices: you see them from outside.

    Look for:
    - the two towers side by side, the residential one taller
    - the dark red brick hotel at their foot
