- title: Crystal Court, stacked villas round a glass winter garden
  summary: Tangram's 36 apartments of 2008 on the edge of the Gijsbrecht van Aemstelpark, in four timber-clad volumes that stand on small feet and widen as they rise, with overhangs of up to seven metres. A glass hall between them holds the entrances, terraces and a water garden.
  body: |
    The site lay between the car park of the Gelderlandplein shopping centre and the Gijsbrecht van Aemstelpark, and one condition was that the neighbourhood keep its view into the park. Tangram Architekten (Bart Mispelblom Beyer and Charlotte ten Dijke) designed it for the developer Hillen & Roosen, and it was finished in 2008.

    Their answer was 36 large apartments stacked in four separate volumes that touch the ground as little as possible and grow wider toward the top, with overhangs of up to seven metres. The four are tied together for stability and clad in wood. Between them is a shared hall under glass, a kind of greenhouse, where the front doors, private terraces and a communal garden are, and the park's water runs into it. The architects say the open space between the blocks is what won over the neighbours.

    The stacking needed large prefabricated wall panels with hollow floors between them, which made the flats easy to change; Tangram says several were split or joined in the first ten years.

    It is private: look from the park.

    Look for:
    - the overhangs, widening upward
    - the glass hall between the blocks
    - the water running from the park toward the building
