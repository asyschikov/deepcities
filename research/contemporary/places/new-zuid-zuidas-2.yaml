  nl:
    title: Crossover, kantoren en startersstudio's in één bakstenen blok
    summary: Gebouw van Team V uit 2023 bij de afrit van de A10, met zo'n 12.000 vierkante meter kantoor naast 120 kleine sociale huurwoningen, waar jonge Amsterdammers en statushouders samenwonen. Het bakstenen raster is overal gelijk, de invulling verschilt per kant.
    body: |
      Ontwikkelaar AM won in november 2017 de gemeentelijke tender voor deze kavel op de hoek van Europaboulevard en de afslag van de A10, met Team V Architectuur als ontwerper. De gemeente wilde er kantoren, woningen (voor een deel sociale huur) en maatschappelijke en commerciële ruimte in één gebouw. In mei 2023 werden de kantoren opgeleverd, in juli kregen de bewoners hun sleutel.

      Het gebouw bestaat uit twee delen die op de begane grond samenkomen: negen kantoorlagen aan de kant van de Europaboulevard, zes woonlagen aan de andere kant. De 120 sociale huurstudio's van ongeveer 23 vierkante meter vormen een Startblok van woonstichting De Key, voor 60 startende studenten en 60 statushouders, met gezamenlijke ruimtes en dakterrassen. Op de begane grond liggen tien koopwoningen voor starters. Langs de snelweg is de gevel dicht tegen het geluid; de woningen hebben hun voordeur aan de noordkant, aan galerijen rond rustige groene hoven. Een raster van nougatkleurige baksteen bindt alles samen en wordt per kant anders ingevuld. De stenen zijn strips, gemaakt van bouwafval.

      De jury van de Amsterdamse Architectuurprijs 2024 was positief, maar merkte op dat bijna elk onderdeel een eigen voordeur heeft. Het gebouw bekijk je vanaf straat; het restaurant op de begane grond is voor iedereen.

      Let op:
      - het bakstenen raster, dichter aan de kant van de snelweg
      - de vooruitspringende gevel boven het restaurant aan het Hogelandplein
