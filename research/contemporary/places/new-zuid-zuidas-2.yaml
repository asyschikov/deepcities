- title: Crossover, offices and starter flats in one brick block
  summary: Team V's block of 2023 at the A10 exit puts about 12,000 square metres of offices next to 120 small social flats where young Amsterdammers and refugees with residence permits live together. The brick grid is the same on every side; what fills it is not.
  body: |
    Team V Architectuur designed Crossover for the developer AM, which won the city's tender for this corner of the A10 exit and the Europaboulevard in November 2017. The brief asked for offices, homes, part of them social housing, and public uses in one building. The offices were handed over in May 2023 and the residents got their keys that July.

    The building has two halves joined at street level: nine office floors on the Europaboulevard side, six floors of homes on the other. The 120 social flats of about 23 square metres are a Startblok, let by De Key to young people and refugees with residence permits, with shared rooms and roof terraces; ten small homes for first-time buyers sit on the ground floor. Toward the motorway the front is closed against noise, so the flats open onto galleries round quiet green courtyards. A grid of nougat-coloured brick holds it together, filled differently on each side; the bricks are strips made from recycled building waste.

    The Amsterdam Architecture Prize jury of 2024 liked it, but noted that almost every part has its own entrance. You can see it from the street; the ground-floor restaurant is open to all.

    Look for:
    - the brick grid, denser on the motorway side
    - the jutting front over the restaurant on the Hogelandplein side
