- title: Viñoly, the tower with its fire stairs cut into the facade
  summary: A 91-metre office tower of 2005 in the Mahler 4 block, Rafael Viñoly's first completed design in Europe. An outdoor fire stair winds round it in a groove cut into the facade, meant to lead up to public roof terraces. It was closed off before the building opened.
  body: |
    Mahler 4 was the first part of the Zuidas to be developed: a block of office towers by Toyo Ito, Michael Graves, de Architekten Cie. and Skidmore, Owings & Merrill, to an urban plan by Pi de Bruijn. The plan prescribed each tower's envelope, with the classic base, shaft and crown. Rafael Viñoly Architects, with Christina Seilern, designed this one between 2002 and 2005; Architectuur.org lists it as Viñoly's first completed design in Europe.

    The architects wanted the three stacked volumes to read as one. Their tools were vertical aluminium fins from top to bottom, whose spacing seems to change as you walk round, and an outdoor stair carved into the facade that spirals round the building. The stair was to be an escape route and a way up to roof terraces open to the public, and a place for office workers to step outside. For safety reasons it was shut before the tower opened.

    It is an office building: you see it from outside, from the Gustav Mahlerplein.

    Look for:
    - the stair notched into the facade, climbing round the tower
    - the deep vertical fins on the glass
