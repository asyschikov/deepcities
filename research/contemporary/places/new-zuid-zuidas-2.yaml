- title: EMA building, the Brexit office built in 18 months
  summary: When Brexit drove the European Medicines Agency out of London, the Dutch state put up a 19-storey office for it on the Zuidas. Building began in May 2018 and the keys were handed over in November 2019. Speed shaped the design, from the steel frame to where the plant room went.
  body: |
    In 2017 the European Medicines Agency had to leave London because of Brexit, and EU member states chose Amsterdam as its new home. The Rijksvastgoedbedrijf, the government's property agency, had already started a sketch design with its architect Fokke van Dijk before the decision, as something to show. MVSA Architects worked it out with the builders Dura Vermeer and Heijmans, who also maintain it for 20 years.

    The deadline was 18 months, and it was met: building started in May 2018 and the tower was handed over on 15 November 2019. Van Dijk told Zuidas that it changes how you sketch. The frame is steel, which the Rijksvastgoedbedrijf said could be put together "as quickly as Lego", around a concrete core; facade panels were fixed from the floors without scaffolding, and the plant room went on the fourth floor rather than the roof, so fitting out could start early. A complicated design like the Valley, he said, could never have been built in that time.

    Inside, a green wall about 60 metres high runs along the office floors. It is a working office: you see it from outside. In front stands Pendullum, a nine-metre stainless-steel sculpture by Gijs Assmann.

    Look for:
    - the plain, regular grid of the facade
    - Pendullum on the forecourt
