- title: Van der Valk Hotel Zuidas, the hotel that starts on the fifth floor
  summary: Wiel Arets's 55-metre hotel of 2020 on a leftover triangle beside the A10. The first four floors are a car park; the lobby and restaurant sit on the fifth, looking out in all directions. Three towers of about 240 rooms stand on top.
  body: |
    Wiel Arets Architects designed this hotel between 2014 and 2017 and it opened in 2020, on a triangular plot beside the A10 that had long been set aside for building. The plot dictated the shape, and so did the rules: nothing underground, nothing too tall because of the approach route to Schiphol, and all parking and loading on site. Arcam reports that Arets persuaded the Van der Valk family to make it a "Van der Valk-special", a building out of the ordinary for the chain.

    The answer was to stack. The first four floors, level with the motorway embankment, are a car park for 143 cars. The lobby is on the fifth floor, high enough to look over the city on every side, with terraces cut into the north and south fronts. Above it stand three towers with about 240 rooms, and in a corner of the top floor a spa with a triangular pool. A green wall with a new canal in front of it faces the motorway.

    The hotel now trades as Hotel Amsterdam Zuidas. You can go in: restaurant ZUID5 is on the fifth floor.

    Look for:
    - the triangular plan, which changes shape as you walk round it
    - the notches cut into the towers for terraces
    - the green wall along the A10
