  nl:
    title: Crystal Court, gestapelde villa's rond een glazen wintertuin
    summary: "Woongebouw van Tangram uit 2008 aan de rand van het Gijsbrecht van Aemstelpark: 36 appartementen in vier met hout beklede volumes die klein op de grond staan en naar boven breder worden, met overstekken tot zeven meter. Ertussen een glazen hal met water uit het park."
    body: |
      De bouwplek lag tussen het parkeerterrein van winkelcentrum Gelderlandplein en het Gijsbrecht van Aemstelpark. Een harde eis was dat de wijk zicht op het park hield. Tangram Architekten (Bart Mispelblom Beyer en Charlotte ten Dijke) ontwierp het complex voor ontwikkelaar Hillen & Roosen; in 2008 was het klaar.

      Het werden 36 royale appartementen, gestapeld in vier losse volumes die de grond zo weinig mogelijk raken en naar boven toe uitwaaieren, met overstekken tot zeven meter. Voor de stabiliteit zijn de vier aan elkaar gekoppeld; de gevels zijn van hout. Tussen de blokken ligt een gezamenlijke hal onder glas, een soort kas, met de voordeuren, privéterrassen en een gemeenschappelijke tuin, en het water uit het park loopt tot in het gebouw door. Volgens de architecten gaven de open ruimtes tussen de blokken voor de buurt de doorslag om de bouw te accepteren.

      Voor die stapeling waren grote prefab wanddelen nodig met holle vloeren ertussen. Daardoor zijn de woningen makkelijk aan te passen: in de eerste tien jaar zijn er volgens Tangram meerdere gesplitst of samengevoegd.

      Het is privéterrein; je kijkt vanuit het park.

      Let op:
      - de overstekken, steeds breder naar boven
      - de glazen hal tussen de blokken
      - het water dat vanuit het park naar het gebouw loopt
    arch:
      recognition: Amsterdamse Nieuwbouwprijs 2010; Amsterdamse Architectuurprijs 2009 (genomineerd)
    sources:
      - https://arcam.nl/architectuur-gids/crystal-court/
      - https://tangramarchitekten.nl/project/crystal-court/
      - https://nl.wikipedia.org/wiki/Crystal_Court
