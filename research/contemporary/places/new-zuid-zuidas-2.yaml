- title: Stadsdeelwerf Zuideramstel, the works yard that won the city's architecture prize
  summary: A borough depot for street cleaners, gardeners and their vehicles, built by Claus en Kaan in 2008 in the Gijsbrecht van Aemstelpark. White brick blocks round a farmyard-like court. It won the Amsterdam Architecture Prize 2009; the jury said it looks like anything but a depot.
  body: |
    Claus en Kaan Architecten (Felix Claus and Jaap Gräber) built this works yard for the borough of Zuideramstel, finished in 2008. It replaced an earlier yard on the same spot, one of the office's own first works, from 1992. Arcam describes it as the base for more than a hundred staff and eighty vehicles of the parks, neighbourhood, civil-engineering and street-cleaning services.

    From the park it looks like a large white bungalow. Timber gates on the east and west sides lead into a courtyard lined with linked blocks of different heights and depths: workshops, stores, vehicle sheds, offices, a canteen and a prayer room. The windows tell you what is inside, a stock of beams, a street sweeper, a piece of playground equipment, and some sit very low, which makes the heavy volume seem to float.

    In 2009 it won the Amsterdam Architecture Prize out of 29 nominees. The international jury wrote that anyone seeing it unprepared would wonder what it was: a bungalow, an office, a museum? Behind the white walls hides a kind of farmyard.

    It is a working yard, not open to visitors: walk round it on the park paths.

    Look for:
    - the low-set windows near the ground
    - the timber gates
