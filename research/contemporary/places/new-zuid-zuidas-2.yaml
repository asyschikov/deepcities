  nl:
    title: Stadsdeelwerf Zuideramstel, de werf die de Amsterdamse Architectuurprijs won
    summary: Stadsdeelwerf voor groenbeheer, straatreiniging en hun wagenpark, in 2008 gebouwd door Claus en Kaan in het Gijsbrecht van Aemstelpark. Witte bakstenen blokken rond een hof. Winnaar van de Amsterdamse Architectuurprijs 2009; volgens de jury zie je niet dat het een werf is.
    body: |
      De werf is ontworpen door Claus en Kaan Architecten (Felix Claus en Jaap Gräber) in opdracht van stadsdeel Zuideramstel en kwam in 2008 gereed. Er stond al een werf op deze plek, uit 1992 en een van de eerste ontwerpen van hetzelfde bureau; die is gesloopt. Volgens Arcam werken hier ruim honderd mensen van groenbeheer, buurtbeheer, civiele techniek en straatreiniging, met tachtig voertuigen.

      Vanuit het park lijkt het een grote witte bungalow. Twee houten poorten, aan de oost- en de westkant, geven toegang tot een binnenplaats met aaneengeschakelde blokken in verschillende hoogtes en diepten: werkplaatsen, opslag, stalling, kantoren, een kantine en een gebedsruimte. Door de ramen zie je wat er binnen gebeurt, een stapel balken, een veegwagen, een speeltoestel. Sommige ramen zitten vlak boven de grond, waardoor het zware gebouw lijkt te zweven.

      In 2009 won de werf de Amsterdamse Architectuurprijs, gekozen uit 29 genomineerden. De internationale jury schreef dat wie het gebouw onvoorbereid ziet, zich afvraagt wat het is: een bungalow, een kantoor, een museum? Achter het witte metselwerk blijkt een soort boerenerf te liggen.

      Het is een werkende werf, niet open voor bezoek; loop er via de parkpaden omheen.

      Let op:
      - de lage ramen vlak boven het maaiveld
      - de houten poorten
    arch:
      recognition: Amsterdamse Architectuurprijs 2009 (winnaar)
