  nl:
    title: Viñoly, de toren met de trap in de gevel gekerfd
    summary: Kantoortoren van 91 meter uit 2005 in het Mahler 4-blok, het eerste gebouwde ontwerp van Rafael Viñoly in Europa. Een buitentrap slingert in een gleuf in de gevel om de toren heen en moest naar openbare dakterrassen leiden. Nog voor de opening ging hij op slot.
    body: |
      Mahler 4 was het eerste deelgebied van de Zuidas dat werd ontwikkeld: een groep kantoortorens naar een stedenbouwkundig plan van Pi de Bruijn, met ontwerpen van onder anderen Toyo Ito, Michael Graves, Skidmore, Owings & Merrill en De Bruijns eigen bureau, de Architekten Cie. Dat plan schreef voor elke toren een plint, een middendeel en een top voor. Deze toren is ontworpen door Rafael Viñoly Architects met Christina Seilern en werd tussen 2002 en 2005 gebouwd. Volgens Architectuur.org is het het eerste ontwerp van Viñoly dat in Europa werd uitgevoerd.

      In plaats van drie lagen op elkaar wilden de ontwerpers één geheel. Dat doen ze met diepe verticale aluminium profielen over de hele hoogte, die dichter of verder uit elkaar lijken te staan naarmate je om de toren loopt, en met een vluchttrap die als een spiraal in de gevel is uitgespaard. De trap moest dienen als vluchtroute en als weg naar publiek toegankelijke dakterrassen. Uit veiligheidsoverwegingen is hij afgesloten voordat het gebouw in gebruik ging.

      Het is een kantoorgebouw; je bekijkt het van buiten, vanaf het Gustav Mahlerplein.

      Let op:
      - de trap die in de gevel is gekerfd en om de toren omhoog loopt
      - de ver uitstekende verticale profielen op het glas
