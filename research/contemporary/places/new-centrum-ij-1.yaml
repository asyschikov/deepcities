  nl:
    title: Passenger Terminal Amsterdam
    summary: De cruiseterminal aan het IJ, sinds 2000 in gebruik, ontworpen door Larry Malcic van HOK, een glazen hal van 24 meter hoog onder een golvend dak. De stad heeft het aantal zeecruiseschepen sindsdien gehalveerd en wil er in 2035 mee stoppen; het nieuwe college beslist.
    body: |
      De nieuwe cruiseterminal was een van de eerste projecten bij de vernieuwing van de Oostelijke Handelskade, de oude havenkade ten oosten van het Centraal Station, en ging in 2000 open. Het bureau HOK tekende hem, met Larry Malcic als architect, in opdracht van het Gemeentelijk Havenbedrijf en NS Stations. De terminal moest een knooppunt tussen land en water zijn. Het gebouw is 24 meter hoog en grotendeels van glas: vanaf de kade kijk je erdoorheen naar de schepen en het IJ, en vanuit de grote ontvangsthal zien de passagiers de stad. Het golvende dak verwijst naar het water. Buiten het cruiseseizoen worden er beurzen, tentoonstellingen en congressen gehouden.

      Daarna keerde de stad zich tegen de schepen. In 2024 bracht het college de terminal terug tot één ligplaats voor zeecruise en kondigde een maximum van 100 schepen per jaar vanaf 2026 aan (het waren er zo'n 190), plus verplichte walstroom vanaf 2027. In januari 2026 schreef wethouder Hester van Buren aan de raad dat ze vanaf 2035 wil stoppen met zeecruises; in dat jaar zou de terminal aan de Veemkade dichtgaan. Een nieuwe terminal in de Coenhaven was met 85 miljoen euro te duur, en grote cruiseschepen passen toch niet onder de geplande Westbrug over het IJ. Het definitieve besluit liet ze aan het volgende college.

      Bezoek: het gebouw gaat open voor cruisepassagiers en bij evenementen; de glazen gevel en een eventueel aangemeerd schip zie je vanaf de Piet Heinkade.

      Let op:
      - het golvende dak, het mooist vanaf het water of de Jan Schaeferbrug
      - het schip aan de kade, op de dagen dat er een ligt

- title: Rabozaal, the theatre on top of the Melkweg
  summary: The Stadsschouwburg needed a modern flat-floor hall and had no room; the Melkweg next door wanted space too. In 2009 Jim Klinkhamer designed a new hall across the boundary between them, a black box raised high above the street, partly over the Melkweg's concert hall.
  body: |
    The Stadsschouwburg on the Leidseplein, a national monument, and its resident company Toneelgroep Amsterdam spent years looking for a way to add a contemporary flat-floor hall, but the old building was full and protected. The answer came from next door: the Melkweg also wanted more room for big events. Jonkman Klinkhamer Architecten (Jim Klinkhamer, Maaike Westinga) designed a new building across the property line, used by the theatre, the Melkweg and the company. It opened in 2009, part of a rebuilding that also turned the theatre's neighbouring houses on the Marnixstraat into offices.

    The building gets wider as it rises. A slim glass base lets passers-by look into a rehearsal room. Higher up it cantilevers out over the Melkweg and the Lijnbaansgracht: eight metres up a glass corridor runs along the canal, and fifteen metres up is the new foyer, with a wide view over the Jordaan. Behind it is the hall, closed to the outside with orange corrugated aluminium under perforated dark grey steel. Inside, the steel structure is left bare and the wooden stage floor carries on beyond the hall. The hall sits high above the street and partly above the Melkweg's concert hall, and the glass wall behind its stage can be opened to daylight, looking onto the back of the old brick fly tower. The hall was nominated for the Amsterdamse Architectuur Prijs in 2010. Today the house is run by Internationaal Theater Amsterdam (ITA).

    Visiting: with a ticket for a show. The Melkweg and the Stadsschouwburg's rescued putti have their own places.

    Look for:
    - the orange and grey box rising above the Melkweg, from across the Lijnbaansgracht
    - the glass corridor along the canal
    - the foyer jutting out at the top
