  nl:
    title: Booking.com City Campus
    summary: Het hoofdkantoor van Booking.com, sinds juni 2023 op de kop van het Oosterdokseiland, waar lang de post werd gesorteerd. Het glazen gebouw van UNStudio kraagt aan de spoorkant 23 meter uit, heeft 41 woningen in de rechthoekige toren en een openbaar restaurant aan het IJ.
    body: |
      Vanaf 1968 hoorde dit terrein in de vorm van een kwart cirkel bij de post. In het Post CS-gebouw van Merkelbach en Elling werden brieven, kaarten en pakketten van en naar het spoor bij het Centraal Station overgeladen. Na het vertrek van de PTT zat er onder meer Club 11 in, tot het gebouw werd gesloopt voor de nieuwbouw op het eiland.

      UNStudio van Ben van Berkel won in 2015 een besloten prijsvraag voor een campus die de Amsterdamse kantoren van Booking.com bijeen moest brengen: volgens Arcam veertien adressen. Het gebouw is vrijwel geheel van glas, waarin het Oosterdok weerspiegelt, rond een atrium met daglicht van boven over de volle hoogte. Aan de spoorkant kraagt het 23 meter uit. Dat was volgens Arcam geen gril van de architecten: het stedenbouwkundig plan schreef die vorm voor. Gezondheid was voor Van Berkel het uitgangspunt. Vanaf de ingang voeren een lange trap en roltrappen naar de tweede verdieping, en trappen, bruggen en galerijen (zelfs de glazen nooduitgangtrappen) moeten werknemers in beweging houden. Een fitnesszaal of zwembad is er niet; daarvoor is er de stad. In de rechthoekige toren liggen 41 appartementen. Booking.com meldt een BREEAM-certificaat Excellent.

      Bezoek: de kantoren zijn niet open, maar restaurant A Beautiful Mess van Refugee Company, waar mensen met een vluchtelingenachtergrond werkervaring opdoen, zit voor iedereen open op de begane grond aan het IJ.

      Let op:
      - de uitkraging van 23 meter aan de spoorkant, vanaf de Oosterdoksstraat of uit de trein
      - het water van het Oosterdok in de glazen gevel
      - de woontoren naast het kantoor

- title: Paleis van Justitie on IJdock
  summary: Since April 2013 Amsterdam's court of appeal sits on IJdock, a new peninsula in the IJ west of Centraal Station. Claus en Kaan dressed it in horizontal bands of white and light grey stone, ceramic, concrete, glazed brick and steel. Most hearings are open to the public.
  body: |
    From 1836 the Gerechtshof Amsterdam, the court of appeal, sat in the Paleis van Justitie on the Prinsengracht, an old orphanage (it has its own place). In April 2013 it moved here, to IJdock, a peninsula built out into the IJ from the Westerdoksdijk. Dick van Gameren and Bjarne Mastenbroek drew the masterplan: a court, a hotel, an office building that houses the water police among others, luxury flats, and a marina between IJdock and the Westerdoksdijk, with gaps left so the city keeps its views of the water.

    The court is two buildings by Claus en Kaan Architecten (Felix Claus), one for the public prosecutor's offices and one with the court and its hearing rooms, joined by a footbridge. The architects wanted the outer walls to look abstract and light, yet strong and timeless. Five materials, all white or light grey, run in horizontal bands at different heights: natural stone, ceramic, whitewashed concrete, glazed brick and coated steel. Some of the cut-outs in the blocks are lined with plants. Arcam reads the pale building, standing apart from the brick city on its peninsula, as an image of the judiciary's independence. The palace carries on inside, with marble walls and floors and coffered ceilings of polished walnut in the public areas. It was nominated for the Amsterdamse Architectuur Prijs in 2013.

    Visiting: weekdays 8:30 to 17:00. Most hearings are public, so you can sit in the public gallery; bring ID and report to the ushers' desk.

    Look for:
    - the bands of white and grey, from the Westerdoksdijk or the water
    - the planted walls in the cut-outs
    - the big V-shaped cut in the neighbouring block, in line with the Keizersgracht
