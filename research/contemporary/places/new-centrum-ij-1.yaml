  nl:
    title: IJhal, de spiegelhal achter het Centraal Station
    summary: De voetgangershal aan de IJ-kant van het Centraal Station, van Wiel Arets Architects (2017). Terrazzo op de vloer, spiegels aan het plafond en restaurants met zicht op het water, tussen het hoge busstation en de autotunnel. De publieksjury van de AAP koos hem in 2018.
    body: |
      In 2010 won Wiel Arets Architects de prijsvraag, in 2014 begon de bouw en in 2017 leverde het bureau de hal op voor NS Stations, als deel van de jarenlange verbouwing van het Centraal Station. De IJhal is een passage voor voetgangers aan de noordkant, tussen het busstation erboven en de autotunnel, en verbindt trein, bus, pont en sinds 2018 ook de Noord/Zuidlijn eronder. De architecten zien de hal als een manier om stad en IJ weer met elkaar te verbinden; met de voltooiing van het station in 1889 raakte het noorden van de binnenstad afgesneden.

      Beweging is het thema. De lichtgele terrazzovloer en de mensen die eroverheen lopen, worden weerkaatst door een plafond vol spiegels met afgeronde hoeken, vierkant en langwerpig, en door de spiegelende zuilen op de middenas. Tussen de spiegels zitten de installaties verstopt. Aan de zuidkant liggen winkels, aan de noordkant restaurants met uitzicht op het IJ. Namen en logo's van de restaurants zijn allemaal zwart-wit, zodat er geen bonte reclamemuur ontstond. De trappen naar het busstation zijn met wintergroene planten aangekleed.

      In 2018 won de IJhal de publieksprijs van de Amsterdamse Architectuur Prijs. De publieksjury sprak van luxe en grandeur.

      Bezoek: vrij toegankelijk, zonder kaartje.

      Let op:
      - je eigen spiegelbeeld in het plafond
      - de zwart-witte namen van de restaurants
      - de begroeide trapgaten naar het busstation
    arch:
      recognition: Amsterdamse Architectuur Prijs 2018, publieksprijs

- title: Conservatorium van Amsterdam
  summary: The city's music academy moved here in April 2008. Against the noise of the trains next door, Frits van Dongen of de Architekten Cie. put the corridors and stairs along the glass front and the halls and practice rooms inside them, after the Japanese engawa.
  body: |
    The Conservatorium van Amsterdam, the music faculty of the Amsterdam University of the Arts, outgrew the old post office savings bank on the Van Baerlestraat (now a hotel, with its own place) and moved into this building on the Oosterdokseiland in April 2008. It stands wedged between the central library and the Booking.com campus, a few minutes from Centraal Station, which is handy for students and bad for acoustics: the trains are loud.

    Frits van Dongen of de Architekten Cie. answered with the engawa, the Japanese model in which the corridors and stairs run round the outside of the building and the rooms sit within. The circulation becomes a buffer against noise. The building is stacked in three layers. At the bottom are the public halls, among them the 400-seat Bernard Haitinkzaal for classical music, Amsterdam Blue Dock for jazz and pop and the Sweelinckzaal for recitals, each with its own acoustics, worked out with the acoustic firm Peutz. Above them are four floors of lesson and practice rooms, and at the top the library, a lecture hall and rooms for study.

    The sawtooth glass front holds a surprise: its scales are covered with prismatic film, so the calm façade shifts with the light and with where you stand. The building was nominated for the Amsterdamse Architectuur Prijs in 2009.

    Visiting: you can go in for the school's concerts, listed on its agenda, from lunchtime concerts in the Bernard Haitinkzaal to jazz nights in the Blue Dock.

    Look for:
    - the sawtooth glass front on the Oosterdokskade, seen at an angle as you walk past
    - the library (OBA) next door, which has its own place
