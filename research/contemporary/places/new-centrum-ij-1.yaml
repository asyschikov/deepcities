- title: IJhal, the mirrored hall behind Centraal Station
  summary: The passage on the IJ side of Centraal Station by Wiel Arets Architects (2017), with a terrazzo floor, a ceiling of rounded mirrors and restaurants facing the water, below the bus station. The public jury of the Amsterdam architecture prize chose it in 2018.
  body: |
    Wiel Arets Architects won the competition for this hall in 2010, building began in 2014 and it was finished in 2017 for NS Stations, one piece of the long rebuilding of Centraal Station. It is a pedestrian hall along the north, IJ side of the station, squeezed between the raised bus station above and the road tunnel, linking trains, buses, ferries and, since 2018, the Noord/Zuidlijn metro below. The architects present it as a way to reconnect the city with the water and the north, cut off when the station was finished in 1889.

    Everything is about people on the move. The pale yellow terrazzo floor and the crowd crossing it are reflected in a ceiling of rounded square and rectangular mirrors, and in mirror-clad columns along the axis; the gaps between the mirror panels hide the building services. Shops line the south side and restaurants the north side, facing the IJ. The restaurants' names and logos are all in black and white, which spares the hall a riot of advertising. The stairs up to the bus station are planted with evergreens.

    In 2018 the IJhal won the public prize of the Amsterdamse Architectuur Prijs; the public jury praised its luxury and grandeur.

    Visiting: open to everyone, no ticket needed.

    Look for:
    - your own reflection in the mirrored ceiling
    - the black-and-white names of the restaurants
    - the planted stairwells up to the bus station
