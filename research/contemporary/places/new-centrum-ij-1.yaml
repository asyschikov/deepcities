  nl:
    title: Zoku in het Metropoolgebouw
    summary: Het kantoorgebouw van Arthur Staal uit 1964 aan de Weesperstraat, lang van meubelfabrikant Gispen en later van gemeentediensten, werd in 2016 Zoku, met lofts voor wie te lang blijft voor een hotel. Via de uitstekende glazen erkers bovenin kom je in een huiskamer op het dak.
    body: |
      De Metropool is een ontwerp van Arthur Staal en kwam in 1964 gereed, als onderdeel van de wederopbouw. Lang zat meubelfirma Gispen erin, daarna verschillende diensten van de gemeente Amsterdam. Volgens Arcam dankt het gebouw zijn naam aan de metro onder de Weesperstraat, en redde de nieuwe bestemming het van leegstand en misschien van de sloop.

      In 2016 trok Zoku erin, een formule voor wat Arcam laptopnomaden noemt: mensen die te kort in een stad zijn om zich er te vestigen en te lang om in een hotel te wonen. Ontwerpbureau Concrete maakte samen met Mulderblauw architecten van de kantoren lofts van 24 tot 46 m², elk met een keuken en een grote werktafel. De buitenkant bleef grotendeels zoals Staal hem bedacht. Zijn overhangende glazen erkers op de zesde en bovenste verdieping werden een brede gang van de liften naar een gezamenlijke huiskamer met uitzicht over de binnenstad, waar ook de receptie is. In 2025 is het dak opnieuw ingericht, weer met Concrete. De verbouwing was in 2017 genomineerd voor de Amsterdamse Architectuur Prijs.

      Bezoek: de lofts zijn voor gasten, maar het restaurant, de bar, de terrassen en de werkplekken op het dak zijn ook voor Amsterdammers open.

      Let op:
      - de rij uitstekende glazen erkers langs de bovenste verdieping
      - de onderdoorgang midden onder het blok
    attributes:
      original_use: Kantoren (Gispen, later gemeentediensten)
