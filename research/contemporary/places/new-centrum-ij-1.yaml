  nl:
    title: Conservatorium van Amsterdam
    summary: Sinds april 2008 zit de Amsterdamse muziekopleiding op het Oosterdokseiland. Tegen het lawaai van het spoor legde Frits van Dongen (de Architekten Cie.) gangen en trappen langs de glazen gevel en de zalen en studieruimtes daarbinnen, naar Japans voorbeeld.
    body: |
      Het Conservatorium van Amsterdam, onderdeel van de Amsterdamse Hogeschool voor de Kunsten, paste niet meer in de oude Rijkspostspaarbank aan de Van Baerlestraat (nu een hotel, met een eigen plek) en verhuisde in april 2008 naar deze nieuwbouw op het Oosterdokseiland. Het gebouw staat ingeklemd tussen de OBA en de campus van Booking.com, vlak bij het Centraal Station. Goed bereikbaar dus, maar de treinen maken veel lawaai.

      Frits van Dongen van de Architekten Cie. loste dat op met de engawa: zoals in Japanse huizen lopen gangen en trappen rondom langs de buitenmuren, met de zalen en lokalen erbinnen. Zo vangt de verkeersruimte het geluid op. Het gebouw bestaat uit drie lagen. Onderin de zalen voor publiek, waaronder de Bernard Haitinkzaal (400 stoelen) voor klassiek, Amsterdam Blue Dock voor jazz en pop en de Sweelinckzaal voor recitals, elk met een eigen akoestiek, uitgewerkt met bureau Peutz. Daarboven vier verdiepingen met les- en studeerkamers, en bovenin de bibliotheek, een collegezaal en studieplekken.

      De glazen zaagtandgevel heeft een verrassing in petto. De schubben zijn beplakt met prismatische folie, waardoor de rustige gevel van kleur en uitstraling verandert met het licht en met de plek waar je staat. Het gebouw was in 2009 genomineerd voor de Amsterdamse Architectuur Prijs.

      Bezoek: binnen kom je bij de concerten van de school, te vinden in de agenda, van lunchconcerten in de Bernard Haitinkzaal tot jazzavonden in de Blue Dock.

      Let op:
      - de zaagtandgevel aan de Oosterdokskade, schuin bekeken terwijl je langsloopt
      - de OBA ernaast, die een eigen plek heeft
    arch:
      recognition: Amsterdamse Architectuur Prijs 2009, nominatie

- title: Booking.com City Campus
  summary: Booking.com's head office, opened in June 2023 on the tip of the Oosterdokseiland where the post office long sorted the mail. UNStudio's glass building cantilevers 23 metres on the railway side and has 41 flats in its rectangular tower and a public restaurant facing the IJ.
  body: |
    From 1968 this quarter-circle plot at the tip of the Oosterdokseiland belonged to the post: the Post CS building by Merkelbach and Elling sorted letters, postcards and parcels off the tracks of Centraal Station. After the PTT left, the building housed among other things the club Club 11, before it was demolished to make way for new building on the island.

    In 2015 UNStudio, led by Ben van Berkel, won an invited competition for a campus that would bring Booking.com's Amsterdam offices, 14 of them by Arcam's count, under one roof. The building is almost all glass, reflecting the Oosterdok, and wraps a full-height atrium with a skylight. Along the railway it cantilevers 23 metres; Arcam points out that this was no whim of the architects but the shape the planning envelope prescribed. Van Berkel made health the guiding idea: from the entrance a long stair and escalators lead to the second floor, and stairs, bridges and galleries, even glazed fire stairs, are there to get people walking. There is no gym or pool; staff are expected to use the city's. The rectangular tower holds 41 flats. Booking.com says the building was certified BREEAM Excellent.

    Visiting: the offices are private, but the restaurant A Beautiful Mess, run by Refugee Company to train people from refugee backgrounds, is open to all on the ground floor facing the IJ.

    Look for:
    - the 23-metre overhang on the railway side, from the Oosterdoksstraat or a passing train
    - the glass reflecting the water of the Oosterdok
    - the tower of flats rising beside the office
