- title: Artis elephant enclosure and its sunken bridge
  summary: Since 2017 the Asian elephants of Artis have a yard four times the size of the old one, partly on a former car park. Rocks hide hatches that open with hay at random times, and visitors cross a 55-metre bridge sunk below the water line, where a Corten rim holds back the pool.
  body: |
    Artis opened its new outdoor enclosure for the Asian elephants in 2017, four times the size of the old one. To make room the zoo pulled down its predators' gallery, one of its oldest parts, and took in part of the car park next door. Landscape architect Thijs de Zeeuw designed the yard after studying how Asian elephants behave: big rock outcrops, Asian plants, a mud wallow, a rubbing tree and a large pool connected to the Entrepotdok, where the water can suddenly start bubbling to get the animals playing. In the wild these elephants look for food all day, so hatches in the rocks open at unexpected times, run by a random automatic system, with hay or pellets behind them. IJbouw built it in a year and a half.

    Dingeman Deijs Architects designed the 55-metre bridge for visitors. Paved with clinker bricks and curving along the existing route, it drops below the water line, where a rim of Corten steel holds the water back; wind, rain or a swimming elephant can send it over the edge. A ridge under the water, out of sight, keeps the elephants three metres from the public. The enclosure was nominated for the Amsterdamse Architectuur Prijs in 2018.

    The herd is led by the matriarch Thong Thai, who gave birth to a bull calf on Christmas Eve 2025.

    Visiting: with an Artis ticket. Artis itself has its own place.

    Look for:
    - the water at eye level beside you on the sunken bridge
    - the feeding hatches in the rocks
    - the Corten rim where the water spills over
