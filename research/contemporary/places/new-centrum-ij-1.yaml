  nl:
    title: Mövenpick Hotel Amsterdam City Centre
    summary: Een hoteltoren van zo'n 65 meter van Claus en Kaan, sinds 2006 open tussen het Muziekgebouw en de cruiseterminal. De stroken glas, beton, wit marmer en groen graniet lopen zo strak om de toren dat je van buiten niet ziet waar een verdieping begint of ophoudt.
    body: |
      Claus en Kaan Architecten (Felix Claus en Jaap Graber) ontwierpen het hotel voor Amplan Vastgoed in twee delen. Onderin ligt een lange plint die vanaf het Muziekgebouw aan 't IJ, op het puntje van de Oostelijke Handelskade, onder het hotel door loopt tot de Passenger Terminal en een kantoortoren, met daarin een touringcarterminal, een parkeergarage en congreszalen. Daarop staat de toren met de kamers, 408 bij de opening in 2006. De hotellobby verbindt toren en plint.

      Het draait om de gevel. Liggende stroken glas, wit beton, wit marmer en groen graniet sluiten de toren zo af dat je, zoals Arcam opmerkt, aan de buitenkant hoogte noch gebruik van de verdiepingen kunt aflezen. Een hotel dat zich niet laat kennen. Een paar jaar later gebruikten Claus en Kaan opnieuw banden van steen en andere materialen voor het Paleis van Justitie op IJdock (met een eigen plek). In 2008 was het hotel genomineerd voor de Amsterdamse Architectuur Prijs.

      Bezoek: het is een gewoon hotel; de lobby met de lounge bar en restaurant DOCK 11 zijn ook open voor wie er niet logeert.

      Let op:
      - de groene en witte banden die de verdiepingen verbergen, vanaf de Piet Heinkade
      - de plint die doorloopt naar het Muziekgebouw en de cruiseterminal
    arch:
      recognition: Amsterdamse Architectuur Prijs 2008, nominatie

- title: Passenger Terminal Amsterdam
  summary: The cruise terminal on the IJ, opened in 2000 to a design by Larry Malcic of HOK, a 24-metre glass hall under a wave-shaped roof. The city has since halved the number of sea cruise calls and plans to end them here by 2035, a decision left to the next city government.
  body: |
    The new cruise terminal was one of the first projects in the remaking of the Oostelijke Handelskade, the old harbour quay east of Centraal Station, and it opened in 2000. The firm HOK designed it, with Larry Malcic as architect, for the port authority and NS Stations. The brief was a hinge between land and water. The 24-metre building is mostly glass, so from the quay you look through it to the ships and the IJ, and from the big central hall the passengers look back at the city. The wave of the roof refers to the water. Outside the cruise season the hall is hired out for fairs, exhibitions and conferences.

    Then the city turned against the ships. In 2024 the city government cut the terminal to one berth for sea cruises and announced a cap of 100 calls a year from 2026 (there had been about 190) and compulsory shore power for moored ships from 2027. In January 2026 the alderman responsible for shipping wrote that she wanted to stop sea cruises in Amsterdam from 2035, when the terminal on the Veemkade would close: a new terminal in the Coenhaven, at 85 million euros, was too expensive, and large cruise ships would not fit under the planned Westbrug over the IJ anyway. She left the final decision to the next city government.

    Visiting: the building opens for cruise passengers and for events held in it; the glass front and any ship at the quay can be seen from the Piet Heinkade.

    Look for:
    - the wave of the roof, best seen from the water or from the Jan Schaeferbrug
    - the ship at the quay, on the days one calls
