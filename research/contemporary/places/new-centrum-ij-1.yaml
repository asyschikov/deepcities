  nl:
    title: Rabozaal, het theater boven op de Melkweg
    summary: De Stadsschouwburg wilde een moderne vlakkevloerzaal maar had geen ruimte; de Melkweg ernaast zocht ook meer plek. In 2009 ontwierp Jim Klinkhamer over de erfgrens heen een nieuwe zaal, een zwarte doos hoog boven de straat, deels boven de Melkweg.
    body: |
      De Stadsschouwburg aan het Leidseplein, een rijksmonument, zocht samen met Toneelgroep Amsterdam jarenlang naar ruimte voor een eigentijdse zaal met een vlakke vloer. Het oude gebouw zat vol en mocht niet zomaar verbouwd worden. De oplossing lag bij de buren: ook de Melkweg wilde meer ruimte voor grote evenementen. Jonkman Klinkhamer Architecten (Jim Klinkhamer, Maaike Westinga) zette een nieuw gebouw over de grens tussen beide percelen, voor schouwburg, Melkweg en toneelgroep samen. Het ging in 2009 open, als deel van een verbouwing waarbij ook de aangrenzende panden aan de Marnixstraat kantoren werden.

      Hoe hoger, hoe breder. Onderin staat een smalle glazen voet waardoor voorbijgangers in een repetitieruimte kijken. Hogerop kraagt het gebouw uit boven de Melkweg en de Lijnbaansgracht: op acht meter loopt een glazen gang langs het water, op vijftien meter ligt de Nieuwe Foyer, met ver uitzicht over de Jordaan. Daarachter ligt de zaal, naar buiten dicht met oranje golfplaat van aluminium onder geperforeerd donkergrijs staal. Binnen is de staalconstructie zichtbaar gebleven en loopt de houten toneelvloer buiten de zaal door. De zaal ligt hoog boven de straat en deels boven de concertzaal van de Melkweg. De glazen wand achter het toneel kan open voor daglicht en kijkt uit op de achterkant van de oude bakstenen toneeltoren. In 2010 was de zaal genomineerd voor de Amsterdamse Architectuur Prijs. Tegenwoordig is Internationaal Theater Amsterdam (ITA) de baas in huis.

      Bezoek: met een kaartje voor een voorstelling. De Melkweg en de geredde putti van de oude schouwburg hebben een eigen plek.

      Let op:
      - de oranje en grijze doos boven de Melkweg, vanaf de overkant van de Lijnbaansgracht
      - de glazen gang langs de gracht
      - de uitkragende foyer bovenin
    arch:
      recognition: Amsterdamse Architectuur Prijs 2010, nominatie

- title: Zoku in the Metropool building
  summary: Arthur Staal's office block of 1964 on the Weesperstraat, long home to the furniture maker Gispen and later to city departments, became Zoku in 2016, lofts for people who stay too long for a hotel. Its overhanging glass bays on the top floor now lead to a rooftop living room.
  body: |
    Arthur Staal designed the Metropool, completed in 1964 as part of the city's post-war reconstruction. For a long time it housed the furniture maker Gispen, later various departments of the city of Amsterdam. Arcam says the name came from the metro line beneath the Weesperstraat, and that the new use saved the building from standing empty and perhaps from demolition.

    In 2016 Zoku moved in, a concept aimed at what Arcam calls laptop nomads: people who stay in a city too briefly to settle and too long to live in a hotel. The design studio Concrete, with Mulderblauw architecten, turned the offices into lofts of 24 to 46 m², each with a kitchen and a large table to work at, and left the outside largely as it was. The glass bays that overhang along the sixth and top floor, the mark of Staal's design, became a broad hall leading from the lifts to a shared living room with views over the centre, where reception also sits. The rooftop was renovated in 2025, again with Concrete. The conversion was nominated for the Amsterdamse Architectuur Prijs in 2017.

    Visiting: the lofts are for guests, but the rooftop restaurant, bar, terraces and coworking are open to locals as well.

    Look for:
    - the row of overhanging glass bays along the top floor
    - the passage under the middle of the block
