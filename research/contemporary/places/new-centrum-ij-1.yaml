  nl:
    title: Paleis van Justitie op IJdock
    summary: Sinds april 2013 zit het gerechtshof Amsterdam op IJdock, een nieuw schiereiland in het IJ ten westen van het Centraal Station. Claus en Kaan gaven het banden van witte en lichtgrijze natuursteen, keramiek, beton, geglazuurde baksteen en staal. De meeste zittingen zijn openbaar.
    body: |
      Vanaf 1836 zetelde het gerechtshof Amsterdam aan de Prinsengracht, in het oude weeshuis dat Paleis van Justitie heette (met een eigen plek). In april 2013 verhuisde het hof naar IJdock, een schiereiland dat vanaf de Westerdoksdijk het IJ in werd aangelegd. Het masterplan kwam van Dick van Gameren en Bjarne Mastenbroek: een gerechtshof, een hotel, een kantoor waarin onder meer de waterpolitie zit, dure appartementen en een jachthaven tussen IJdock en de Westerdoksdijk. Tussen de gebouwen bleven zichtlijnen open naar het water.

      Het hof zelf bestaat uit twee gebouwen van Claus en Kaan Architecten (Felix Claus): kantoren voor het Openbaar Ministerie en een deel met het gerechtshof en de zittingszalen, met een loopbrug ertussen. De architecten zochten gevels die abstract en licht zouden ogen en toch sterk en tijdloos. Vijf materialen, alle wit of lichtgrijs, liggen in horizontale banden op verschillende hoogtes: natuursteen, keramiek, gewit beton, geglazuurde baksteen en gecoat staalplaat. In een deel van de uitsparingen groeien planten tegen de gevel. Arcam ziet in het lichte gebouw, dat op zijn schiereiland los staat van de bakstenen stad, een beeld van de onafhankelijke rechtspraak. Ook binnen is het een paleis: marmer op wanden en vloeren en cassetteplafonds van gepolijst notenhout in de publieke ruimtes. In 2013 was het genomineerd voor de Amsterdamse Architectuur Prijs.

      Bezoek: doordeweeks van 8.30 tot 17.00 uur. De meeste zittingen zijn openbaar, dus je mag op de publieke tribune plaatsnemen; neem een legitimatiebewijs mee en meld je bij de bodebalie.

      Let op:
      - de witte en grijze banden, vanaf de Westerdoksdijk of het water
      - de begroeide gevels in de uitsparingen
      - de grote V-vormige snede in het buurblok, in het verlengde van de Keizersgracht
    arch:
      recognition: Amsterdamse Architectuur Prijs 2013, nominatie

- title: Mövenpick Hotel Amsterdam City Centre
  summary: A hotel tower of about 65 metres by Claus en Kaan, open since 2006 between the Muziekgebouw and the cruise terminal. Its bands of green granite, white marble, white concrete and glass hide from outside where one floor ends and the next begins.
  body: |
    Claus en Kaan Architecten (Felix Claus with Jaap Graber) designed the hotel for the developer Amplan Vastgoed in two parts. Below is a long plinth that runs from the Muziekgebouw aan 't IJ at the head of the Oostelijke Handelskade, under the hotel, to the Passenger Terminal and an office tower; it holds a coach terminal, a car park and conference rooms. On it stands the tower with the rooms, 408 of them when the hotel opened in 2006. The hotel lobby is the hinge between the two.

    The façade is the story. Horizontal bands of green granite, white marble, white concrete and glass wrap the tower so that, as Arcam notes, neither the height of the floors nor what goes on behind them can be read from outside: a hotel that keeps its face closed. Claus en Kaan returned to bands of stone and other materials a few years later for the Paleis van Justitie on IJdock (it has its own place). The hotel was nominated for the Amsterdamse Architectuur Prijs in 2008.

    Visiting: a working hotel; the lobby with its lounge bar and the restaurant DOCK 11 are open to non-guests.

    Look for:
    - the bands of green and white that hide the floors, from the Piet Heinkade
    - the plinth running on to the Muziekgebouw and the cruise terminal
