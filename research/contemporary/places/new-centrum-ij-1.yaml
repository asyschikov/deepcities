  nl:
    title: Het olifantenverblijf van Artis en de verdiepte brug
    summary: Sinds 2017 hebben de Aziatische olifanten van Artis een verblijf dat vier keer zo groot is als het oude, deels op een voormalige parkeerplaats. In de rotsen gaan op willekeurige momenten luikjes met hooi open, en bezoekers lopen over een brug van 55 meter onder de waterlijn.
    body: |
      In 2017 kregen de Aziatische olifanten van Artis een nieuw buitenverblijf, vier keer zo groot als het oude. Daarvoor ging de roofdierengalerij tegen de vlakte, een van de oudste delen van de dierentuin, en werd een stuk van het parkeerterrein ernaast bij het park getrokken. Landschapsarchitect Thijs de Zeeuw ontwierp het verblijf na bestudering van het gedrag van de dieren: grote rotspartijen, Aziatische beplanting, een modderpoel, een schuurboom en een groot bassin dat in verbinding staat met het Entrepotdok, waar het water af en toe ineens gaat borrelen om de olifanten tot spelen te verleiden. In het wild zijn ze de hele dag op zoek naar eten. Daarom gaan er op onverwachte momenten luikjes in de rotsen open, gestuurd door een automatisch systeem dat het toeval laat beslissen, met hooi of brokken erachter. IJbouw bouwde het geheel in anderhalf jaar.

      De brug voor bezoekers, 55 meter lang, is van Dingeman Deijs Architects. Het gebogen klinkerpad volgt de bestaande route door het park en zakt onder het waterpeil, waar een rand van cortenstaal het water tegenhoudt. Wind, regen of een zwemmende olifant kan het er zo overheen laten klotsen. Een onzichtbare verhoging onder water houdt de olifanten drie meter bij het publiek vandaan. In 2018 was het verblijf genomineerd voor de Amsterdamse Architectuur Prijs.

      Matriarch Thong Thai leidt de kudde; op kerstavond 2025 kreeg ze een zoon.

      Bezoek: met een toegangskaart voor Artis. Artis zelf heeft een eigen plek.

      Let op:
      - het water op ooghoogte naast je op de verdiepte brug
      - de voerluikjes in de rotsen
      - de cortenstalen rand waar het water overheen loopt
    arch:
      recognition: Amsterdamse Architectuur Prijs 2018, nominatie
