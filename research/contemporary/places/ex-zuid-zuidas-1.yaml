  nl:
    title: Fedlev-gebouw, Gerrit Rietveld Academie
    summary: Het jongste gebouw van de kunstacademie (2018), ontworpen door een oud-studente na een prijsvraag waaraan alleen eigen studenten, docenten en alumni mochten meedoen. Beneden glas, boven geweven staal, en een dak waarop vrij gebouwd en geëxposeerd kan worden.
    body: |
      Nog geen tien jaar na het Benthem Crouwel-gebouw van 2003 zat de Gerrit Rietveld Academie alweer krap. In 2012 volgde een besloten prijsvraag, Gerrit&Willem Do-It-Yourself, waarvoor alleen teams uit de eigen kring van studenten, docenten en oud-studenten konden inzenden. Winnaar werd het ontwerperscollectief Fedlev onder leiding van architect Paulien Bremmer, zelf afgestudeerd aan de academie; zij werkte het plan later uit met Hootsmans architectuurbureau. Sinds 2018 staat het er, in gebruik bij de academie en het Sandberg Instituut.

      Volgens Bremmer werkten de afdelingen te veel langs elkaar heen. Daarom zijn er geen gangen: de lokalen liggen aan de randen, rond een gedeelde ruimte in het midden. De glazen pui van de benedenverdieping kan bij mooi weer op veel plekken open. Daar zitten de houtwerkplaats, een montagehal, een verdiepte bibliotheek met een dubbelhoge kern en een eveneens verdiept auditorium. De bovenverdieping steekt uit, achter schermen van geweven staal die de zon tegenhouden en opzij kunnen voor meer licht. Op het dak zit stroom, zodat studenten er kunnen bouwen, werken en tentoonstellen. Binnen bleven vlakken leeg, om in te vullen door kunstenaars en ontwerpers van de academie.

      Het is een werkende school, niet open voor publiek; je bekijkt het gebouw vanaf de straat.

      Let op:
      - de geweven stalen schermen op de verdieping, die open kunnen klappen
      - de glazen benedenverdieping onder de uitkraging
    arch:
      recognition: Genomineerd voor de Amsterdamse Architectuur Prijs 2019
