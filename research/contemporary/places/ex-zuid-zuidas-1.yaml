- title: Fedlev building, Gerrit Rietveld Academie
  summary: The art school's newest building (2018), designed by one of its own graduates after a competition open only to its students, teachers and alumni. Glass below and woven steel above, it is built to make departments work together, with a roof left free for building and showing work.
  body: |
    Within ten years of adding the Benthem Crouwel tower in 2003, the Gerrit Rietveld Academie had outgrown its buildings again. In 2012 it held a closed competition, Gerrit&Willem Do-It-Yourself, for teams of its own students, teachers and alumni. The design collective Fedlev won it, led by the architect Paulien Bremmer, herself a graduate, who later worked the design out with Hootsmans architectuurbureau. The building was finished in 2018 and is shared with the Sandberg Instituut.

    Bremmer felt the departments kept too much to themselves, so the plan has no corridors: classrooms sit at the edges, round a shared central space. The glass ground floor can be opened in many places in good weather, and holds the wood workshop, an assembly hall, a sunken library with a double-height centre and a sunken auditorium. The upper floor juts out over it behind screens of woven steel that keep off the sun and fold back for more light. The roof has power points, so students can build, work and exhibit on it. Inside, blank areas were left for artists and designers from the academy to finish.

    It is a working school and not open to the public; the building is seen from the street.

    Look for:
    - the woven-steel screens on the upper floor, which can fold open
    - the glazed ground floor under the overhang
