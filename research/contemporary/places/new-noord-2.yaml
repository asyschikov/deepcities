- title: Xplore Agora
  summary: A secondary school for 600 pupils in Elzenhagen, open since August 2025 and built for Agora teaching, where pupils pick their own research topics. Studio Ard Hoksbergen and VDNDP designed it with pupils and teachers; movable walls let rooms join or split.
  body: |
    Agora is a school concept with no fixed classes: groups of 12 to 17 pupils of mixed ages and levels work on "challenges" whose subjects they choose themselves. Xplore Agora, run by the school board ZAAM, got a building made for it. Studio Ard Hoksbergen and VDNDP won the architect selection in the summer of 2021, and the school opened in August 2025 on the corner of Elzenhagen Zuid, with room for 600 pupils in 35 classrooms, six maker spaces and a grand café. The architects call it the first Dutch building designed for Agora.

    For half a year the designers met pupils, teachers and craftspeople every week. Movable partitions now join or close off almost every room, so the building can change with the school. A low, dark-red entrance opens into a high hall, the café, with views of the water and the athletics track; two wings of mostly open classrooms branch off it. The café is meant for parents and neighbours too.

    It was nominated for the Amsterdamse Architectuur Prijs 2026. The jury found building and concept fully fused, and praised a design that could later also serve an ordinary secondary school.

    Visiting: a working school; see it from outside.

    Look for:
    - the façade of concrete with red bricks laid at a slant in a rhythmic pattern
    - nest boxes built into the façade, and the planting along the walls and quay
