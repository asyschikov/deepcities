  nl:
    title: Basisschool Klein Amsterdam
    summary: Basisschool in De Bongerd van geprefabriceerde houten modules zonder fundering, die je kunt uitbreiden, demonteren en per vrachtwagen verplaatsen. SeARCH ontwierp het in 2019 zodat een school het tempo van een groeiende nieuwe wijk kan volgen.
    body: |
      In een nieuwe wijk komen de kinderen sneller dan de gemeente scholen kan bouwen. Stichting Leren in de Tussenruimte, winnaar van de gemeentelijke scholenwedstrijd voor onderwijsvernieuwing, vroeg SeARCH in 2017 om een gebouw dat dat tempo kon bijhouden. Het werd een school van louter houten prefab modules, in 2019 opgeleverd en gestapeld tot lokalen, werkplekken en een atrium. Een fundering is er niet. Elke module is 8,7 bij 3,3 meter, precies de maat van een gewone vrachtwagen, dus de school kan groeien met extra modules of "plug-ins", krimpen of verhuizen.

      De naam van de stichting gaat terug op de filosofe Hannah Arendt: de tussenruimte als de plek waar kinderen kennismaken met de wereld. Iedere module heeft de afwerking die bij zijn gebruik hoort, als lokaal, kantoor of toiletruimte.

      Tijdelijk was het altijd. De school noemt het houten gebouw aan de Tuinderijlaan zelf een tijdelijke locatie, en in november 2026 maakte de gemeente bekend dat een schoolgebouw aan de Schoenerstraat wordt opgeknapt zodat Klein Amsterdam daarheen kan. Wat er met de houten modules gebeurt, vermeldt het bericht niet.

      Bezoek: een basisschool in bedrijf, alleen van buiten te bekijken.

      Let op:
      - de gestapelde houten dozen, elk een vrachtwagenlading
    attributes:
      outlook_when: Nog niet bekend; de gemeente trekt er vanaf 2027 geld voor uit
      outlook_note: De school verhuist naar een op te knappen schoolgebouw aan de Schoenerstraat (plan van de gemeente, 17 nov. 2026); wat er met de houten modules gebeurt, staat er niet in.
    arch:
      recognition: Amsterdamse Architectuurprijs 2020, nominatie

- title: Theater Amsterdam
  summary: A theatre in the Houthaven built for one play, ANNE, about Anne Frank, which opened here in May 2014. Dedato kept the building plain, a glass box under a flat black roof. The Anne Frank House disliked the dinner-and-a-show setting. Now shows and events.
  body: |
    The producers Kees Abrahams and Robin de Levita of Imagine Nation built this theatre on the Danzigerkade with private money for a single production, ANNE, the play by Leon de Winter and Jessica Durlacher based on Anne Frank's writings. It opened in May 2014; the producers say it went up in nine months. Inside is a hall for 1,100 people where, as in the producers' earlier Soldaat van Oranje, the sets revolve around the audience, with huge curved screens wrapped round the seats.

    Dedato designed the building, and kept it restrained: a production like this, the architects reasoned, carries enough weight of its own. What you see is a glass box under a wide, flat roof on slender columns, which Dedato itself calls "the black theatre".

    Not everyone liked the idea. Before the opening the director of the Anne Frank House, Ronald Leopold, objected to packages with wine, snacks and dinner with a view: "Anne Frank should not be a nice evening out."

    Today the theatre hosts comedy, concerts and other shows on a stand of 926 seats (expandable to 1,100), and rents itself out for congresses and parties.

    Visiting: during performances and events.

    Look for:
    - the glass walls under the deep roof overhang
    - next door, Dedato's gold-clad Danzigerkade 4, designed as a contrast with the dark theatre
