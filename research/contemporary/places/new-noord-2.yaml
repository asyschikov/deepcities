  nl:
    title: De Ark, van kerkzaal tot sociale markt
    summary: "Protestantse kerk in Banne Buiksloot, sinds 2022 zonder zondagsdiensten, nu een Sociale Markt: gratis winkelen voor wie op de voedselbank leunt. Open Kaart bouwde supermarkt, drogist en kledingwinkel in één houten tribune, zodat de zaal ook voor uitvaarten en concerten blijft."
    body: |
      Sinds 2022 zijn er in De Ark geen zondagse diensten meer. Verkopen of sluiten wilden de Protestantse Kerk Amsterdam en de diaconie niet; ze maakten van de voedselbank een Sociale Markt. In plaats van in de rij te staan voor een kant-en-klaar pakket, doen bezoekers onder begeleiding boodschappen in een gratis supermarkt, drogisterij en kledingwinkel, en blijven ze voor koffie, een knipbeurt of een workshop. De markt is drie dagen per week open.

      Daarnaast moest de zaal geschikt blijven voor filmavonden, uitvaarten en concerten. Open Kaart bracht de drie winkels onder in één groot houten meubel in de vorm van een tribune, van blank gelakt hout dat goed samengaat met de natuurstenen vloer, het groen geschilderde houten plafond en de bakstenen muren van de oude kerkzaal. Zijn de winkeldeuren dicht, dan verraadt alleen het sleutelgat ze.

      De Ark was genomineerd voor de Amsterdamse Architectuurprijs 2025. De vakjury had oog voor de houtnerf die over de panelen doorloopt en de keurig ingepaste pashokjes. In 2025 won het de VKB-MercerMarsh Award. Er wordt onderzocht of er woningen op het dak kunnen.

      Bezoek: de markt is op openingsdagen voor haar bezoekers; in de zaal zijn ook activiteiten. Van buiten oogt het gebouw nog gesloten, geeft de directeur van de diaconie toe.

      Let op:
      - de eenvoudige bakstenen kerk met de naam op de muur
    attributes:
      original_use: Protestantse kerk
    arch:
      recognition: Amsterdamse Architectuurprijs 2025, nominatie; VKB-MercerMarsh Award 2025

- title: CPO Srefi Bow
  summary: Eight households on Centrumeiland, IJburg, commissioned their own block and helped design it (2023 to 2024). JoustraReid and lab03 designed it almost entirely in timber, with a front of dry-stacked, reusable bricks and a grid for climbing plants across the balconies.
  body: |
    Centrumeiland makes room for self-builders and collectives, and this is one of their blocks: eight homes (two ground-floor maisonettes, five flats and a penthouse) built in collective private commissioning (CPO), in which the future residents act as the client. JoustraReid Architecten and lab03 architecten, who work together as Maathuisprojecten, designed it with them from the first sketches.

    Apart from the basement and the lift shaft the building is timber. Rather than the usual cross-laminated timber walls, the architects used load-bearing timber-frame façades to save material, with columns and beams in between so every flat could be laid out freely. The CLT floors, beams and columns are left visible inside. The shell was handed over in November 2023 as "casco plus", and the residents finished their homes themselves.

    The street front is clad in bricks stacked dry, without mortar, so they can be taken down and reused. A balcony runs across the whole front, held without supports at the building line, and a metal grid in front of it is there for climbing plants. The back is clad in timber with balconies of different depths.

    It was nominated for the Amsterdamse Architectuur Prijs 2025.

    Visiting: private homes; see them from the square.

    Look for:
    - the mortarless brick front in mixed colours
    - the climbing grid across the balconies
  category: housing
  lat: 52.351974
  lng: 5.012831
