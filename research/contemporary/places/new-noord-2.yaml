  nl:
    title: Theater Amsterdam
    summary: "Theater in de Houthaven, gebouwd voor één stuk over Anne Frank, ANNE, dat hier in mei 2014 begon. Dedato hield het sober: een glazen doos onder een plat zwart dak. Het Anne Frank Huis had moeite met diner plus voorstelling. Nu shows en events."
    body: |
      Producenten Kees Abrahams en Robin de Levita van Imagine Nation lieten dit theater aan de Danzigerkade met eigen geld bouwen voor één productie: ANNE, het toneelstuk van Leon de Winter en Jessica Durlacher naar de geschriften van Anne Frank. In mei 2014 ging het open; volgens de producenten stond het gebouw er in negen maanden. Binnen is een zaal voor 1100 bezoekers waar, net als bij hun eerdere Soldaat van Oranje, de decors rond het publiek draaien, met grote gebogen schermen om de tribune heen.

      Het ontwerp is van Dedato, en dat koos voor terughoudendheid: zo'n voorstelling over Anne Frank zegt al genoeg, vonden de ontwerpers. Je ziet een glazen doos onder een breed plat dak op dunne kolommen. Dedato noemt het zelf "het zwarte theater".

      Niet iedereen was blij: voor de opening liet directeur Ronald Leopold van het Anne Frank Huis weten dat hij fronste bij arrangementen met wijn, hapjes en diner met uitzicht. Anne Frank hoorde volgens hem geen gezellig avondje uit te zijn.

      Tegenwoordig staan er cabaret, concerten en andere shows op het programma, voor een tribune van 926 plaatsen (uit te breiden tot 1100), en wordt het theater verhuurd voor congressen en feesten.

      Bezoek: tijdens voorstellingen en evenementen.

      Let op:
      - de glazen wanden onder het diep overstekende dak
      - ernaast Danzigerkade 4, ook van Dedato, met goudkleurige gevel als tegenhanger van het donkere theater

- title: The Doors
  summary: Twelve live-work flats on the Tolhuiskanaal in Buiksloterham (2023), each with a second front door to a workspace of its own. The developer got the idea from Dutch tax rules. Space Encounters stacked the flats as a 3D puzzle behind bands of concrete, glass and planters.
  body: |
    The developer Edwin Oostmeijer had long been annoyed by a tax rule: a self-employed person can only deduct the costs of a workspace at home if it has its own front door and could in principle be let to someone else. So in his project in Amsterdam-Noord every flat got two front doors, one for living and one for a workspace beside it. Sales started in June 2020; the building was finished in 2023.

    Space Encounters designed it. The architects point out that the second door also lets a grown-up child live semi-independently, or an elderly parent move in next door. The twelve flats, of different shapes and sizes, deep or wide or both, lock together as a 3D puzzle that you cannot read from outside.

    The façade is stacked in three layers: a more closed ground floor in white glazed tiles and Ceppo di Gré stone, a glazed middle, and a heavier-looking top that shades it, all crossed by horizontal bands of concrete and glass with vertical aluminium frames. The concrete has built-in pots for plants. At its core are a garden and a chocolate-brown spiral staircase.

    Visiting: private flats; see them from the quay.

    Look for:
    - the concrete bands with their built-in planters
    - the white glazed tiles and stone of the plinth
