  nl:
    title: Xplore Agora
    summary: Middelbare school voor 600 leerlingen in Elzenhagen (2025), gemaakt voor Agora-onderwijs, waarin leerlingen zelf hun onderwerpen kiezen. Studio Ard Hoksbergen en VDNDP ontwierpen het met leerlingen en docenten; schuifwanden maken lokalen groter of kleiner.
    body: |
      Agora-onderwijs kent geen vaste klassen. Leerlingen van verschillende leeftijden en niveaus werken in groepjes van 12 tot 17 aan "challenges", waarvan ze het onderwerp zelf bepalen. Xplore Agora, een school van stichting ZAAM, kreeg daar een eigen gebouw voor. Studio Ard Hoksbergen en VDNDP wonnen in de zomer van 2021 de architectenselectie. In augustus 2025 ging de school open op de hoek van Elzenhagen Zuid: plek voor 600 leerlingen, met 35 lokalen, zes makerspaces en een grand café. Volgens de architecten is het in Nederland het eerste gebouw dat speciaal voor Agora is ontworpen.

      Een halfjaar lang overlegden de ontwerpers wekelijks met leerlingen, coaches en vakmensen. Bijna elke ruimte is met verplaatsbare wanden te koppelen of af te sluiten, zodat het gebouw kan meebewegen met de school. Na een lage, donkerrode entree volgt een hoge aula, het café, met uitzicht op het water en de atletiekbaan. Daaruit lopen twee vleugels met veelal open lokalen. Ook ouders en buurtbewoners kunnen in het café terecht.

      De school was genomineerd voor de Amsterdamse Architectuurprijs 2026. De vakjury zag gebouw en concept volledig samenvallen en waardeerde dat het later ook een gewone middelbare school kan huisvesten.

      Bezoek: een school in bedrijf, alleen van buiten te bekijken.

      Let op:
      - de betonnen gevel met schuin gelegde rode bakstenen in een vast ritme
      - de nestkastjes in de gevel en het groen langs gevel en kade
    arch:
      recognition: Amsterdamse Architectuurprijs 2026, nominatie

- title: Klein Amsterdam school
  summary: A primary school in De Bongerd built from prefab timber modules that stand without foundations and can be added to, taken apart and moved by lorry. SeARCH designed it (2019) so a school could keep up with the growing families of a new district.
  body: |
    New districts fill with children faster than the city can build schools. The foundation Leren in de Tussenruimte, which won the municipality's competition for a new kind of school, asked SeARCH in 2017 for a building that could keep up. The answer, delivered in 2019, is made entirely of prefabricated timber modules, stacked into a layout of classrooms, workrooms and an atrium. The modules stand without foundations, and each measures 8.7 by 3.3 metres, the size that fits on a standard lorry, so the school can grow with extra modules or "plug-ins", shrink, or move.

    The name of the foundation comes from Hannah Arendt's idea of the in-between space, where the world is shown to children. Each module is finished according to its use, as classroom, office or washroom.

    The plan was always temporary. The school still calls the timber building on the Tuinderijlaan a temporary home, and in November 2026 the city said it would refurbish a school building on the Schoenerstraat so Klein Amsterdam can move in. The announcement does not say what happens to the timber modules.

    Visiting: a working primary school; see it from outside.

    Look for:
    - the stacked timber boxes, each one a lorry-load
