  nl:
    title: The Doors
    summary: Twaalf woon-werkappartementen aan het Tolhuiskanaal (2023), elk met een tweede voordeur naar een eigen werkruimte. Het idee kwam uit de belastingregels. Space Encounters legde de woningen als een 3D-puzzel achter banden van beton, glas en plantenbakken.
    body: |
      Projectontwikkelaar Edwin Oostmeijer ergerde zich al jaren aan de Belastingdienst. Een zelfstandige mag de kosten van een werkplek thuis alleen aftrekken als die ruimte een eigen voordeur heeft en in theorie aan een ander te verhuren is. Bij zijn project in Noord kreeg daarom elk appartement twee voordeuren: een voor het wonen en een voor de werkruimte ernaast. In juni 2020 begon de verkoop, in 2023 was het gebouw klaar.

      Het ontwerp is van Space Encounters. Die tweede deur kan later ook dienen om een volwassen kind half zelfstandig te laten wonen of een ouder vlakbij te verzorgen, merken de architecten op. De twaalf woningen verschillen in vorm en maat, diep, breed of allebei, en grijpen in elkaar als een driedimensionale puzzel die je aan de buitenkant niet terugziet.

      De gevel bestaat uit drie lagen: onderin een meer gesloten plint van wit geglazuurde tegels en Ceppo di Gré-natuursteen, daarboven een glazen middendeel, en bovenop een zwaarder ogende kop die schaduw geeft. Horizontale banden van beton en glas worden doorsneden door staande aluminium kozijnen. In het beton zitten plantenbakken. In de kern van het gebouw liggen een tuin en een chocoladebruine wenteltrap.

      Bezoek: particuliere woningen, te bekijken vanaf de kade.

      Let op:
      - de betonnen banden met ingebouwde plantenbakken
      - de wit geglazuurde tegels en het natuursteen van de plint

- title: De Ark, church hall turned social market
  summary: A Protestant church in Banne Buiksloot that stopped Sunday services in 2022 and became a Sociale Markt, a free shop for people on the food bank. Open Kaart fitted a food store, chemist and clothes shop into one wooden stand, so the hall still works for funerals and concerts.
  body: |
    Sunday services in De Ark stopped in 2022. Rather than sell or close it, the Protestant Church Amsterdam and its diaconate turned the food bank into a Sociale Markt. Instead of queuing for a ready-made parcel, visitors shop with a guide at a free supermarket, a chemist and a clothes shop, and can stay for coffee, a haircut or a workshop. The market is open three days a week.

    The hall still had to serve for film nights, funerals and concerts. The architects of Open Kaart put all three shops into one large wooden piece of furniture in the form of a stand, in clear-lacquered wood that sits with the stone floor, green-painted wooden ceiling and brick walls of the old hall. When the shop doors are closed, only their keyholes give them away.

    It was nominated for the Amsterdamse Architectuur Prijs 2025, where the jury admired the wood grain running on across the panels and the neatly fitted changing cubicles, and won the VKB-MercerMarsh Award 2025. Homes on the roof are being studied.

    Visiting: the market is for its visitors on its opening days; the hall also hosts events. From outside, as the diaconate's director admits, it still looks closed.

    Look for:
    - the plain brick church with its name on the wall
