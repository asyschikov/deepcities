  nl:
    title: CPO Srefi Bow
    summary: Acht huishoudens op Centrumeiland, IJburg, gaven zelf opdracht voor hun woongebouw en ontwierpen mee (2023-2024). JoustraReid en lab03 ontwierpen het bijna geheel in hout, met een voorgevel van droog gestapelde, herbruikbare bakstenen en een rek voor klimplanten langs de balkons.
    body: |
      Op Centrumeiland is plek voor zelfbouwers en collectieven, en dit is een van hun gebouwen: acht woningen (twee maisonnettes op de grond, vijf appartementen en een penthouse), gebouwd in collectief particulier opdrachtgeverschap. De toekomstige bewoners waren dus zelf de opdrachtgever. JoustraReid Architecten en lab03 architecten, die samen werken als Maathuisprojecten, ontwierpen het vanaf de eerste schetsen met hen.

      Behalve de kelder en de liftschacht is alles van hout. In plaats van de gangbare wanden van CLT kozen de architecten, zuinig met materiaal, voor dragende gevels in houtskeletbouw, met kolommen en balken ertussen. Zo kon elke woning naar eigen wens worden ingedeeld. Binnen blijven de CLT-vloeren, balken en kolommen in het zicht. In november 2023 werd het casco plus opgeleverd, waarna de bewoners hun woning zelf afbouwden.

      De voorgevel is bekleed met bakstenen die zonder mortel zijn gestapeld, zodat ze later weer los kunnen en opnieuw te gebruiken zijn. Over de volle breedte loopt een balkon dat in de rooilijn geen steun nodig heeft, met een metalen raster ervoor waar planten tegenop moeten groeien. De achterkant is met hout bekleed en heeft balkons van wisselende diepte.

      Het gebouw was genomineerd voor de Amsterdamse Architectuurprijs 2025.

      Bezoek: particuliere woningen, te zien vanaf het plein.

      Let op:
      - de voorgevel van losse bakstenen in wisselende kleuren
      - het klimrek langs de balkons
    arch:
      recognition: Amsterdamse Architectuurprijs 2025, nominatie
