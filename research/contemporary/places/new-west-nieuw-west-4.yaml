  nl:
    title: LommerRijk, Kolenkitbuurt
    summary: Zes bakstenen woonblokken rond een gezamenlijke tuin en een openbaar hof, in 2011 gebouwd in de vernieuwde Kolenkitbuurt. Korth Tielens maakte van de rand langs de straat een verblijfsplek; Wingender Hovenier tilde de woningen een halve laag op, met stoepen als aan de grachten.
    body: 'LommerRijk hoort bij de vernieuwing van het Zuidelijk Veld, de strook tussen Erasmusgracht en Bos en Lommerweg in de Kolenkitbuurt. De lange stroken van de buurt bleven het uitgangspunt. Far West en Stadgenoot lieten er zes blokken met huur- en koopwoningen bouwen, die samen een gemeenschappelijke tuin en een openbaar hof omsluiten. De twee noordelijke blokken zijn van Korth Tielens, de vier andere van Wingender Hovenier, en alles is in lichtbruine baksteen gemetseld.


      De nadruk lag op de zone tussen voordeur en stoep. Korth Tielens zag die als een kamer die zowel bij het huis als bij de straat hoort, afgebakend met gemetselde penanten, plantenbakken en stevige borstweringen. Aan de straat hebben de woningen balkons, aan de tuinkant een galerij. De onderkant van hun balkons bestaat uit platen met ronde gaten in allerlei maten.


      Wingender Hovenier zette de woningen op een half verdiepte parkeergarage. Zo ontstond een verhoogde plint met trappen naar de voordeur, zoals bij de grachtenhuizen: zichtbaar vanaf de straat en toch beschut. Vensterbanken, banden en lateien zijn van licht, gezuurd beton, en in de balkonhekken zit een arabesk van in elkaar grijpende letters, volgens de architecten een knipoog naar de oosterse motieven in Amsterdamse ornamenten uit de negentiende en vroege twintigste eeuw.


      Bezoek: woningen, alleen van buiten te zien.


      Let op:

      - de ronde gaten onder de balkons van Korth Tielens

      - de trappen naar de voordeuren bij de blokken van Wingender Hovenier

      - het letterpatroon in de balkonhekken

      '
    arch:
      recognition: Genomineerd voor de Amsterdamse Architectuur Prijs 2012
- title: Tuinstede, Delflandpleinbuurt (Snitker/Borst)
  summary: A block of 110 homes in Slotervaart that swaps the garden city's open layout for a closed block, yet keeps its big glass, wide flats and greenery. Two gates open onto a birch garden; the split-level homes on the ground have living rooms 4.25 metres high.
  body: 'In the Noordstrook of the Delflandpleinbuurt, Snitker/Borst drew a new plan in 2008: the open layout of repeated blocks typical of the Western Garden Cities gave way to three closed urban blocks with large shared gardens, one each by ANA, Dick van Gameren and Snitker/Borst themselves. Theirs, Tuinstede, was finished in 2011 for Far West and De Key, with 110 homes.


    The architects kept what the 1950s did well. The block has big glass fronts and generous flats on a structural width of 8.1 metres, so floor plans can change. The car park is half sunk and partly under the homes, which leaves room for birches to grow in real soil in the garden, and two gates in the street fronts let passers-by see in. The lower two floors are houses with their own front doors; because they sit over the car park, they are split-level, with living rooms 4.25 metres high. Three floors of flats sit on top. Arcam''s guide notes the contrast in the facade: black cladding on the two lower floors, white above.


    Visiting: homes; see them from the street.


    Look for:

    - the black base and the white upper floors

    - the birch garden, glimpsed through the two gates

    - the big glass fronts, a nod to the 1950s blocks around them

    '
  category: housing
  lat: 52.350784
  lng: 4.837798
  address: Loosduinenstraat, Maassluisstraat and Rijswijkstraat, Slotervaart
