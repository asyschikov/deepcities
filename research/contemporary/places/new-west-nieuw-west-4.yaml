  nl:
    title: Nieuw Reimerswaal, school en woningen (Mecanoo)
    summary: Het eerste blok van de nieuwe Reimerswaalbuurt in Osdorp zet 51 woningen op een school, sporthal, peuterspeelzalen, kinderopvang en zorgsteunpunt. Van zes lagen aan de Osdorper Ban zakt het naar drie aan de rustige kant, waar 21 eengezinswoningen aan een groene hof liggen.
    body: 'Aan de rand van Osdorp kreeg de Reimerswaalbuurt negen nieuwe woonblokken, naar een plan onder supervisie van Architecten Cie. Mecanoo ontwierp het eerste blok, in 2011 opgeleverd voor Ymere, Bouwfonds en het katholieke schoolbestuur ASKO.


      Alles wat publiek is, zit in een hoge plint langs de drukke Osdorper Ban: een basisschool, een sporthal, twee peuterspeelzalen, een kinderdagverblijf en een zorgsteunpunt, ieder met een eigen ingang. Daarboven liggen vier woonlagen met 51 appartementen, waarvan zestien voor rolstoelgebruikers. Aan de achterkant zakt het blok van zes naar drie lagen en opent het zich naar een groene binnenhof voor bewoners en leerlingen; aan de stille noordkant staan 21 eengezinswoningen. Na schooltijd mogen bewoners de schoolvoorzieningen en speelplaatsen gebruiken.


      Van buiten lijkt het vooral een woongebouw, met afwisselend metselwerk en balkons. Dat er een school in zit, verraadt een lint van glazen panelen rond het gebouw: kunstenaar Elspeth Pikaar drukte er teksten en tekeningen van de leerlingen op. De donkere hekken tussen hoven en straat zijn van Studio Makkink & Bey.


      Bezoek: woningen en een school, alleen van buiten te zien.


      Let op:

      - het lint van glazen panelen met kindertekeningen rond de plint

      - de donkere hekken van Makkink & Bey aan de hofkant

      - de trap van zes naar drie bouwlagen aan de achterzijde

      '
    arch:
      recognition: Genomineerd voor de Amsterdamse Architectuur Prijs 2012
- title: LommerRijk, Kolenkitbuurt
  summary: Six brick housing blocks around a shared garden and a public court, built in 2011 in the renewed Kolenkitbuurt. Korth Tielens made the street edge a place to linger; Wingender Hovenier lifted the homes half a storey with stoops, as on the canals.
  body: 'LommerRijk is part of the renewal of the Zuidelijk Veld, the strip between the Erasmusgracht and the Bos en Lommerweg in the Kolenkitbuurt. The plan kept the neighbourhood''s long rows, and the developers Far West and Stadgenoot had six blocks of rented and owner-occupied homes built along them, enclosing a shared garden and a public court. Korth Tielens designed the two northern blocks, Wingender Hovenier the other four; all are in light-brown brick.


    The renewal put its weight on the strip between the front door and the street. Korth Tielens treated it as a room belonging to both, marked by brick piers, planters and solid parapets, with balconies on the street side and galleries facing the garden. The undersides of their balconies are panels pierced with round holes of different sizes.


    Wingender Hovenier set their homes on a half-sunken car park, so a raised base with steps up to the doors gives the old canal-house relation to the street: in view, but private. Sills, bands and lintels are pale acid-treated concrete, and the balcony railings carry an "arabesque" of interlocking letters, a nod, the architects say, to the oriental motifs in Amsterdam ornament of the nineteenth and early twentieth centuries.


    Visiting: homes; see them from the street.


    Look for:

    - the round holes under the Korth Tielens balconies

    - the steps up to the front doors on the Wingender Hovenier blocks

    - the lettered pattern in the balcony railings

    '
  category: housing
  lat: 52.377676
  lng: 4.838859
  address: Leeuwendalersweg 629 and surrounding streets, Kolenkitbuurt, Bos en Lommer
