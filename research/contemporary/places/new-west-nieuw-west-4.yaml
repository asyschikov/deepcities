  nl:
    title: Averroes, Confuciusplein
    summary: Een stevig bakstenen woonblok, vrij op het vernieuwde Confuciusplein in Slotermeer, een van de twee die Van Sambeek & van Veen voor het plein ontwierp. Grote kaders markeren elke woning en vouwen naar binnen als loggia; liggende baksteenlijnen verwijzen naar de jaren vijftig.
    body: 'De omgeving van het Confuciusplein in Geuzenveld-Slotermeer ging op de schop bij de vernieuwing van de Westelijke Tuinsteden: groener, veiliger en levendiger, met eigentijdse woningen, terwijl het plein het hart van vier woonbuurten bleef. Van Sambeek & van Veen (projectarchitect Erna van Sambeek) ontwierp voor De Stadstuinen en Far West twee woongebouwen met bedrijfsruimte aan het plein, klaar in 2009. Averroes, genoemd naar de Andalusische filosoof uit de twaalfde eeuw, is het blok dat los op het plein staat; het andere, aan de overkant van de Socratesstraat, omvat Avicenna en een noordblok.


      De architecten wilden het groen terughalen waar de tuinsteden om bekend stonden. De woningen liggen rond een gezamenlijke binnentuin en een daktuin, en een vierkant van bomen, met enkele en dubbele rijen langs de looproutes, maakt het plein zelf groen. De gebouwen zijn eenvoudige, stevige volumes die vrij in de open ruimte staan; het plan loopt af van vijf lagen aan het plein tot twee in de straten erachter. De horizontale lijnen van de gemetselde gevels uit de jaren vijftig keren hier in moderne vorm terug: grote kaders lichten elke woning uit, en de loggia''s zijn er naar binnen in gevouwen, met zicht op het plein.


      Bezoek: woningen, te zien vanaf het plein.


      Let op:

      - de grote kaders in de bakstenen gevels, elk een woning

      - de loggia''s die in de kaders terugwijken

      - het vierkant van bomen ervoor

      '
    arch:
      recognition: Genomineerd voor de Amsterdamse Architectuur Prijs 2010
- title: Kalverpolder lookout tower
  summary: A 10-metre lookout of oak at the edge of the Zaanse Schans, made in 2013 the way the Zaan millwrights build. A millwright prefabricated it from a 1:20 oak model and pegged it together with mortise and tenon joints; it marks the start of a path into the Kalverpolder.
  body: 'At the edge of the Zaanse Schans, beside the Zaans Museum, stands a lookout tower built entirely of oak. DaF-architecten designed it for the Stichting Zaanse Schans, and it was completed in 2013. It marks the start of a rough footpath into the Kalverpolder, a nature area of wet peat and broad ditches, and looks out over the mixed nature and industry of the Zaan.


    The architects took their cue from the wooden industrial windmills along the river and from the thrift of farm building. Much of the timber was sawn locally by the windmill sawmill Het Jonge Schaap. The design was worked out on a 1:20 model, itself made of oak, and from it the millwright Bart Nieuwenhuijs and his team made the parts in the Zaan way, then assembled the tower on site. Traditional joints hold the open frame: mortise and tenon, wooden pegs, forged nails and bolts. Climbing up, you see the view from a new angle all the way. The tower is 10 metres tall.


    Visiting: open to the public.


    Look for:

    - the pegged oak joints in the open frame

    - from the top, the polder and the industry along the Zaan

    - the start of the footpath into the polder at its foot

    '
