  nl:
    title: Tuinstede, Delflandpleinbuurt (Snitker/Borst)
    summary: Een blok met 110 woningen in Slotervaart dat de open stempels van de tuinstad inruilt voor een gesloten blok, maar de grote ramen, ruime woningen en het groen houdt. Twee poorten geven zicht op een berkentuin; de grondgebonden woningen hebben een woonkamer van 4,25 meter hoog.
    body: 'Voor de Noordstrook in de Delflandpleinbuurt maakte Snitker/Borst in 2008 een nieuw stedenbouwkundig plan. De open stempels, zo typerend voor de Westelijke Tuinsteden, moesten plaatsmaken voor drie gesloten bouwblokken met grote gemeenschappelijke tuinen, ontworpen door Dick van Gameren, ANA en Snitker/Borst zelf. Hun eigen blok, Tuinstede, kwam in 2011 klaar voor Far West en De Key en telt 110 woningen.


      De architecten hielden vast aan wat de jaren vijftig goed deden. Het blok heeft grote glazen puien en royale woningen op een beukmaat van 8,1 meter, zodat de indeling kan meebewegen. De parkeergarage ligt half onder de grond en deels onder de woningen, waardoor de berken in de tuin in de volle grond konden; door twee poorten in de straatgevel kijk je naar binnen. De onderste twee lagen zijn woningen met een eigen voordeur. Omdat ze boven de garage liggen, hebben ze een split-level, met een woonkamer van 4,25 meter hoog. Daarop staan drie lagen appartementen. Arcam wijst op het contrast in de gevel: zwart bij de onderste twee lagen, wit erboven.


      Bezoek: woningen, alleen van buiten te zien.


      Let op:

      - de zwarte onderbouw en de witte bovenverdiepingen

      - de berkentuin, zichtbaar door de twee poorten

      - de grote glazen puien, een knipoog naar de jaren-vijftigblokken eromheen

      '
    arch:
      recognition: Genomineerd voor de Amsterdamse Architectuur Prijs 2012
- title: Scheepvaartkwartier housing (Geurst & Schulze)
  summary: Three of the seven parts of the first new block in Osdorp's centre, by Geurst & Schulze for Stadgenoot. A grid of white concrete bands and round columns holds red-brown or sand-coloured brick, bronze frames and French balconies with decorative railings.
  body: 'The renewal of Osdorp''s centre follows a plan by the urban design office Khandekar. The Scheepvaartkwartier, just south of the shopping centre, was the first block to be built: where the district''s typical rows once stood, it was split into seven parts by four firms, on purpose, so the block would not read as one building. Geurst & Schulze designed three of them, with 46 homes for Stadgenoot, completed in 2012.


    Their parts are the ones with a grid of white concrete in the facade: horizontal bands that run over corners and balconies, and round columns, some of them half sunk into the wall. Into this grid go the brickwork, red-brown on two parts and sandy bronze on the third, and bronze-coloured window frames, many of them French balconies with ornamental railings. Behind the front is a mix of flats, gallery flats, maisonettes and houses with their own door. The ground floor is extra high, with live-work homes and wide entrance halls to liven the street, while the cars go into a car park fully underground. Its roof is the shared inner garden, which four passages open to view from the street.


    Visiting: homes; see them from the street.


    Look for:

    - the round white columns in the brick facades

    - the ornamental railings of the French balconies

    - the views through the passages into the inner garden

    '
  category: housing
