  nl:
    title: Hartenlust, stadswoningen (Kempe Thill)
    summary: Een rij van 23 witte huizen in Osdorp, elk maar 4,80 meter breed, het wettelijk minimum, en heel diep. De voorgevels zijn bijna helemaal van glas, wat ze de bijnaam etalagewoningen opleverde; de auto's staan binnen, onder terrassen aan de achterkant.
    body: 'Bij de vernieuwing van Osdorp verving Atelier Kempe Thill een rij flats door 23 rijtjeshuizen, in 2008 opgeleverd voor opdrachtgever Delta Forte. Om zo veel mogelijk huizen op de kavel te krijgen, maakten ze elk huis 4,80 meter breed, het minimum uit het Bouwbesluit, en vervolgens zo diep dat het gevraagde vloeroppervlak er toch in paste. Dat bespaarde geld: de gevel, het duurste deel van een gebouw, werd klein in verhouding tot de vloer. Om daglicht tot achterin te krijgen, bestaan de voorgevels vrijwel helemaal uit raam, dus tussen keuken en straat zit weinig. Arcam vermeldt dat ze daarom ook wel etalagewoningen heten.


      De auto verdwijnt naar binnen: op de begane grond zitten garage en berging aan een straatje achter de huizen, overdekt door de terrassen van de eerste verdieping. De woonkeuken kijkt uit op de voortuin en staat via een vide in verbinding met de woonkamer erboven; op de tweede verdieping liggen de slaapkamers. Gangen zijn er niet, de voordeur is een schuifdeur, en goedkope materialen werden één geheel door alle onderdelen in dezelfde lichte kleur te spuiten.


      Bezoek: woningen, alleen van buiten te zien.


      Let op:

      - de glazen voorgevels, de hele rij lang

      - de schuivende voordeuren

      - aan de achterkant het straatje onder de opgetilde terrassen

      '
    arch:
      recognition: Genomineerd voor de Zuiderkerkprijs 2008 en de Amsterdamse Architectuur Prijs 2009
- title: Cadiz, Hoekenesgracht
  summary: Sixty-nine homes in nine white rendered blocks set across a canal in Osdorp, with wooden shutters, special railings and roof terraces. Arcam sees a Mediterranean air; the plan keeps the car-free little neighbourhood open to the water.
  body: 'On the Hoekenesgracht in Osdorp Midden-Noord, where duplex flats used to stand, Abbink X De Haas built 69 roomy homes, most of them for sale, finished in 2008 for Stadgenoot. The renewal of Osdorp wanted other kinds of homes than the usual walk-up flats, and a neighbourhood with a recognisable character.


    The nine low white blocks stand at right angles to the water, so the open view along the canal stays. Six are paired, each pair joined by a car park at street level with raised gardens on its roof; the houses either side are mirror images, and a rooflight makes the room against the car park usable. The three blocks on the water are taller and hold lower and upper homes: the lower ones are entered from the garden, the upper ones from a square, with a big roof terrace instead of a garden, so these blocks have no back. Every block ends in a house with big windows onto the canal.


    White render, wooden shutters that residents open or close to choose their privacy, aluminium frames and railings designed for the project give the place its look; Arcam calls it Mediterranean; the design also refers to modernism and to the many backgrounds of the residents. Karres en Brands designed the public space, which joins their Botteskerkpark.


    Visiting: homes; see them from the street.


    Look for:

    - the wooden shutters on the white render

    - the decorative railings that hide the car parks

    - the big windows of the end houses facing the canal

    '
  category: housing
  lat: 52.359191
  lng: 4.797529
  address: Wolbrantskerkweg, by the Hoekenesgracht, Osdorp
