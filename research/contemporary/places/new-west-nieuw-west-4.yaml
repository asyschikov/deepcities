- title: Nieuw Reimerswaal, school and homes (Mecanoo)
  summary: The first block of the Reimerswaalbuurt renewal in Osdorp stacks 51 flats on a school, sports hall, playgroups, day care and a care post, then steps down from six storeys on the Osdorper Ban to three on the quiet side, where 21 family houses face a green courtyard.
  body: 'The Reimerswaalbuurt, on the edge of Osdorp, was rebuilt as nine housing blocks under a plan supervised by Architecten Cie. Mecanoo designed the first, finished in 2011 for the developers Ymere and Bouwfonds and the Catholic school board ASKO.


    Everything public sits in a tall base along the busy Osdorper Ban: a primary school, a sports hall, two playgroups, a day nursery and a care post, each with its own door. On top are four floors with 51 flats, sixteen of them for wheelchair users. Behind, the block drops from six storeys to three and opens onto a green courtyard shared by residents and pupils, with 21 family houses on the quiet north side. After school hours, residents may use the school''s facilities and playgrounds.


    From the street it reads as housing, in varied brickwork with balconies. The school shows itself in a band of glass panels that runs around the building: the artist Elspeth Pikaar printed the pupils'' own texts and drawings on them. Studio Makkink & Bey designed the dark railings that separate the courtyards from the street.


    Visiting: homes and a school; see it from the street.


    Look for:

    - the band of glass panels with children''s drawings around the base

    - the dark railings by Makkink & Bey on the courtyard side

    - the step down from six storeys to three at the back

    '
  category: housing
  lat: 52.361236
  lng: 4.794652
  address: Osdorper Ban 134 and Steelvlietplein, Osdorp
