  nl:
    title: Woningen Scheepvaartkwartier (Geurst & Schulze)
    summary: Drie van de zeven delen van het eerste nieuwe bouwblok in het centrum van Osdorp, door Geurst & Schulze voor Stadgenoot. Een raster van witte betonbanden en ronde kolommen omlijst roodbruine of zandkleurige baksteen, bronskleurige kozijnen en Franse balkons met sierhekken.
    body: 'De vernieuwing van het centrum van Osdorp volgt een plan van stedenbouwkundig bureau Khandekar. Het Scheepvaartkwartier, net ten zuiden van het winkelcentrum, was het eerste blok dat werd gebouwd. Op de plek van de stroken en haken die hier stonden, verdeelden vier bureaus het in zeven delen, bewust, zodat het blok niet als één gebouw zou ogen. Geurst & Schulze tekende er drie, met samen 46 woningen voor Stadgenoot, opgeleverd in 2012.


      Hun delen herken je aan het witte betonraster in de gevel: horizontale banden die over hoeken en balkons doorlopen, en ronde kolommen, deels half in de muur. Binnen dat raster zitten het metselwerk, roodbruin bij twee delen en zandkleurig met een bronzen zweem bij het derde, en bronskleurige kozijnen, vaak als Frans balkon met een sierlijk hek. Achter de gevel zitten appartementen, galerijwoningen, maisonnettes en eengezinshuizen door elkaar. De begane grond is extra hoog, met woon-werkwoningen en ruime entrees die de straat levendig moeten maken; de auto''s staan in een garage die helemaal onder de grond ligt. Het dak daarvan is de gezamenlijke binnentuin, waar je vanaf de straat door vier doorgangen in kijkt.


      Bezoek: woningen, alleen van buiten te zien.


      Let op:

      - de ronde witte kolommen in de bakstenen gevels

      - de sierhekken van de Franse balkons

      - de doorkijkjes door de poorten naar de binnentuin

      '
    arch:
      recognition: Genomineerd voor de Amsterdamse Architectuur Prijs 2013
- title: Hartenlust town houses (Kempe Thill)
  summary: A row of 23 white houses in Osdorp, each only 4.8 metres wide, the legal minimum, and very deep. The fronts are nearly all glass, which earned them the nickname "shop-window houses"; the cars go inside, under terraces at the back.
  body: 'In Osdorp''s renewal, Atelier Kempe Thill replaced a row of flats with 23 terraced houses, finished in 2008 for the client Delta Forte. To fit as many houses as possible on the plot they made each one 4.80 metres wide, the minimum the building rules allow, and then deep enough to give the floor area asked for. The trick saved money: the facade, the costliest part of a building, became small in relation to the floor. To get daylight that far in, the street fronts are almost all window, so there is little between the kitchen and the street. Arcam''s guide notes that they are sometimes called "etalagewoningen", shop-window houses.


    The car disappears inside: on the ground floor a garage and storeroom open onto a lane at the back, roofed over by the terraces of the first floor. The kitchen-diner faces the front garden and is open through a void to the living room above; the bedrooms are on the second floor. There are no corridors, the front door slides, and cheap materials were made to look as one by spraying every part the same pale colour.


    Visiting: homes; see them from the street.


    Look for:

    - the glass fronts, all in a row

    - the sliding front doors

    - at the back, the lane under the raised terraces

    '
