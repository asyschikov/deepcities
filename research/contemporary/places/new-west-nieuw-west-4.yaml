  nl:
    title: Cadiz, Hoekenesgracht
    summary: Negenenzestig woningen in negen wit gestucte blokken dwars op een gracht in Osdorp, met houten luiken, eigen hekwerk en daktuinen. Arcam ziet er een mediterrane sfeer in; het plan houdt het autovrije buurtje open naar het water.
    body: 'Aan de Hoekenesgracht in Osdorp Midden-Noord, waar eerst duplexwoningen stonden, bouwde Abbink X De Haas 69 ruime woningen, de meeste te koop, in 2008 opgeleverd voor Stadgenoot. Bij de vernieuwing van Osdorp wilde men andere woonvormen dan de gebruikelijke portiekflats, en een buurt met een eigen gezicht.


      De negen lage witte blokken staan haaks op het water, zodat het zicht langs de gracht vrij blijft. Zes ervan zijn per twee gekoppeld door een parkeergarage op straatniveau, met verhoogde tuinen op het dak; de woningen aan weerszijden zijn elkaars spiegelbeeld, en dankzij een daklicht is ook de kamer naast de garage bruikbaar. Aan het water staan de drie hogere blokken, met beneden- en bovenwoningen. De benedenwoningen hebben hun voordeur aan de tuin, de bovenwoningen aan een plein, met een groot dakterras in plaats van een tuin, waardoor deze blokken geen achterkant hebben. Elk blok eindigt in een woning met grote ramen op de gracht.


      Wit stucwerk, houten luiken waarmee bewoners zelf hun privacy regelen, aluminium kozijnen en speciaal ontworpen hekken bepalen het beeld. Arcam noemt het mediterraan; het ontwerp verwijst ook naar het modernisme en naar de vele achtergronden van de bewoners. De openbare ruimte is van Karres en Brands en sluit aan op hun Botteskerkpark.


      Bezoek: woningen, alleen van buiten te zien.


      Let op:

      - de houten luiken op het witte stucwerk

      - de sierhekken voor de parkeergarages

      - de grote ramen van de kopwoningen aan de gracht

      '
    arch:
      recognition: Genomineerd voor de Amsterdamse Architectuur Prijs 2009
- title: Averroes, Confuciusplein
  summary: A sturdy brick housing block standing on its own on the renewed Confuciusplein in Slotermeer, one of two by Van Sambeek & van Veen for the square. Big frames in the facade mark each home and fold inwards as loggias; horizontal brick lines echo the 1950s blocks around it.
  body: 'The area around the Confuciusplein in Geuzenveld-Slotermeer was overhauled as part of the renewal of the Western Garden Cities: greener, safer and livelier, with newer kinds of homes, while the square stayed the centre of four neighbourhoods. Van Sambeek & van Veen (project architect Erna van Sambeek) designed two housing buildings with commercial space for the square, for De Stadstuinen and Far West, finished in 2009. Averroes, named after the twelfth-century Andalusian philosopher, is the one that stands on its own on the square; the other, across the Socratesstraat, holds Avicenna and a northern block.


    The architects set out to bring back the greenery the garden cities were known for. The homes are grouped around a shared inner garden and a roof garden, and a square of trees, with single and double rows along the routes, makes the square itself green. The buildings are simple, solid volumes standing free in the open space, and the plan steps down from five storeys on the square to two in the streets behind. The horizontal lines of the 1950s brick facades come back in a modern form: large frames pick out each home, and the loggias fold inwards from them, towards the square.


    Visiting: homes; see the building from the square.


    Look for:

    - the big frames in the brick facades, each one a home

    - the loggias folded back into the frames

    - the square of trees in front

    '
