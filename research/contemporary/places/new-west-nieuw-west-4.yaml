  nl:
    title: Uitkijktoren Kalverpolder
    summary: Een uitkijktoren van 10 meter, helemaal van eikenhout, aan de rand van de Zaanse Schans, in 2013 gebouwd op de manier van de Zaanse molenmakers. Een molenbouwer maakte hem na naar een eiken maquette op schaal 1:20; hij markeert het begin van een struinpad.
    body: 'Aan de rand van de Zaanse Schans, bij het Zaans Museum, staat een uitkijktoren die volledig van eikenhout is. DaF-architecten ontwierp hem voor de Stichting Zaanse Schans; hij werd in 2013 opgeleverd. De toren is het vertrekpunt van een struinpad door de Kalverpolder, een natuurgebied met trilveen en brede sloten, en kijkt uit over het Zaanse landschap van natuur en industrie.


      Het ontwerp haakt aan bij de houten industriemolens langs de Zaan en bij de zuinigheid van het boerenbedrijf. Een groot deel van het hout is in de buurt gezaagd, door de houtzaagmolen Het Jonge Schaap. Eerst kwam er een maquette op schaal 1:20, ook van eiken. Molenbouwer Bart Nieuwenhuijs en zijn mensen prefabriceerden de toren daarnaar op Zaanse wijze en zetten hem ter plekke in elkaar. Ouderwetse houtverbindingen houden het open geraamte bij elkaar: pen en gat, toognagels, gesmede nagels en bouten. Op weg naar boven zie je het uitzicht telkens vanuit een andere hoek. De toren is 10 meter hoog.


      Bezoek: openbaar toegankelijk.


      Let op:

      - de verbindingen met houten pennen in het open eiken geraamte

      - vanaf de top de polder en de industrie langs de Zaan

      - aan de voet het begin van het struinpad de polder in

      '
