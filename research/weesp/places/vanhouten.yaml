  nl:
    title: Laatste fabriekshal van Van Houten
    summary: "Van de cacaofabriek die Weesp groot maakte, staat alleen deze hal nog: vier bouwlagen uit de nieuwe fabriek van 1890-1897, met als dak één reusachtig betonnen tongewelf. In 1930 maakte men hier chocoladepastilles met vitamine D; nu hoort ze bij een farmaceutische fabriek."
    body: |
      Chocolade met vitamine D: daarmee kreeg deze hal een tweede leven. Philips had in 1927 een manier gevonden om vitamine D2 synthetisch te maken, en vanaf 1930 maakte de N.V. Philips-Van Houten hier chocoladepastilles waar die vitamine in zat. Daarna groeide de hal uit tot het hart van een chemische fabriek, die na 1980 bij Solvay hoorde. Nu zit Abbott Healthcare op het terrein.

      Het begon groot. Tussen 1890 en 1897 zette Casparus van Houten een splinternieuwe cacaofabriek neer op 40 hectare ten westen van de oude stad. Rond 1900 werkten er duizend mensen. In de jaren zestig kwam het bedrijf in Amerikaanse handen, de productie ging naar Duitsland en in 1971 ging de fabriek in Weesp dicht: 573 mensen stonden op straat. Bijna alles werd afgebroken.

      De hal heeft vier verdiepingen die naar boven toe steeds lager worden. De gevels zijn van grijsrode machinesteen, met lisenen die bovenaan met uitgemetselde friezen aan elkaar vastzitten, grote ijzeren rozetankers en getoogde ramen met veel roeden. Binnen dragen gietijzeren kolommen stalen balken, met daartussen tongewelfjes van gewapend beton. Het hele dak is één lang, licht gebogen betonnen gewelf. De galerijen kwamen er in 1936 bij. Dwars aan de kop staat los het ketelhuis, met dezelfde details en een dak van Lucas IJsbrandpannen, die je verder nergens in Weesp ziet. De schoorsteen is weg. Het geheel staat op een werkend industrieterrein aan de C.J. van Houtenlaan 36.

      Let op:
      - de flauwe topgevels, afgedekt met banden van hardsteen
      - de oorspronkelijke hijsbalk op de noordwesthoek
      - de vier verdiepingen, elk lager dan die eronder
    attributes:
      built: 1895, galerijen 1936
      original_use: Fabriekshal en ketelhuis van de cacaofabriek
    sources:
      - https://data.amsterdam.nl/monumenten/7453d238-684c-4807-a42b-0e4d81498c64
      - https://dbnl.org/tekst/sten009monu11_01/sten009monu11_01_0173.php
      - https://nl.wikipedia.org/wiki/Van_Houten_(chocoladefabriek)

- title: Villa Casparus and the Van Houten houses
  summary: 'A 99-room palace with a lift and central heating, built for a cocoa boss who died before he could move in, and around it the houses of the Van Houten men: a doctor''s coach house with Aesculapius anchors, an octagonal villa with a drawbridge and an Art Nouveau row for managers.'
  body: |
    Casparus van Houten (1844–1901), grandson of the firm's founder, oversaw a whole new factory in Weesp (1890–1897), and his new house went up in Weesp too. The Amsterdam architect Abraham Salm designed Villa Casparus in an eclectic style with Italian touches; it was finished in 1901, with 99 rooms, a central heating system and a lift from the start, a central hall with marble columns and a stained-glass dome by Adolf le Comte. Leonard Springer laid out the park. Casparus died in 1901 before it was furnished. His heir Douwinus van Houten lived there until his death in 1939; just before the war it housed mobilised soldiers, among them 87 mounted men with their horses, around 1950 the Magneet bicycle factory moved in, and in 2002 it became flats. The coach-house wing was demolished in 1994.

    A few steps away stand smaller traces of the Van Houten era. Korte Stammerdijk 6 was built in 1891 as the coach house of Dr Kortenhorst, the company doctor, and turned into a house in 1913; even its wall anchors carry the staff of Aesculapius. Korte Stammerdijk 15 is a one-storey villa on an octagonal plan under a tall mansard roof, with a narrow drawbridge and a pond around it. On the Singel, nos. 67–73 (about 1904) are four houses for Van Houten managers behind one front, a rare piece of Art Nouveau in Weesp.

    The villa and the houses are private homes; all can be seen from the street.

    Look for:
    - the villa's red glazed roof tiles, ceramic ornaments and painted natural stone around the windows
    - the Aesculapius rosette between two laurel wreaths in the gable of Korte Stammerdijk 6, and its weather vane
    - the drawbridge and the corner dormers of the octagonal villa
    - at Singel 71, the one loggia that was never filled in, with its round arch in purple-red brick
