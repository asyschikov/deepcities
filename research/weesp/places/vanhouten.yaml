    - { label: "Wikipedia (nl): Beelden in Weesp", url: "https://nl.wikipedia.org/wiki/Lijst_van_beelden_in_Weesp" }
  attributes:
    rank: Okay
    built: '1989'
    artist: Siemen Bolhuis
  photos:
    - commons:File:Weesp kunstwerk weespermoppenbakker.jpg
  sources:
    - https://weesp.kunstwacht.nl/kunstwerken/bekijk/18441-weesper-moppenbakker
    - https://www.nhnieuws.nl/nieuws/340945/supermarkt-waagt-zich-aan-lokaal-koekje-met-passievrucht-kom-niet-aan-de-weesper-mop
    - WeesperNieuws headline "Weespers bakken reusachtige '750' van Weespermoppen" (2025, listed on weespernieuws.nl)
  nl:
    title: Weesper Moppenbakker
    summary: "Een bronzen bakkertje in de brugleuning aan het Binnenveer herinnert aan 1988, toen de bakkers van Weesp samen een Weesper mop van 115 kilo bakten, het eigen amandelkoekje van de stad, en daarmee in het Guinness Book of Records kwamen."
    body: |
      Meer dan een vierkante meter koek, 115 kilo zwaar, en een plekje in het Guinness Book of Records: dat leverde het op toen de bakkers van Weesp in 1988 de handen ineensloegen voor de grootste Weesper mop ooit.

      De Weesper mop is het eigen koekje van de stad. Er gaat suiker, amandel en ei in, "meer zit er niet in", zoals een Weesper banketbakker het samenvat. Om de recordpoging niet te vergeten maakte beeldhouwer en medailleur Siemen Bolhuis dit kleine bronzen bakkertje. Het werd in 1989 in de reling aan het Binnenveer gezet, bij de Slijkstraatbrug. Bolhuis is vooral bekend van zijn beeld van Wim Kan en Corry Vonk voor het Kurhaus in Scheveningen.

      Met de mop wordt niet gesold. Naam en recept zijn niet beschermd, dus iedereen mag er een bakken. Maar toen een supermarktketen in 2024 met een Weesper mop met passievruchtsmaak kwam, was het oordeel op de markt snel klaar: "Dit is geen Weesper mop."

      Let op:
      - het bakkertje in de reling, makkelijk om voorbij te lopen
      - de bakkers in de oude stad die nog echte moppen verkopen
    sources:
      - https://weesp.kunstwacht.nl/kunstwerken/bekijk/18441-weesper-moppenbakker
      - https://www.nhnieuws.nl/nieuws/340945/supermarkt-waagt-zich-aan-lokaal-koekje-met-passievrucht-kom-niet-aan-de-weesper-mop

- title: WaterWeespers
  summary: "Walk through the railway underpass and you shrink to the size of the tiny creatures in Weesp's water: ten glowing, enlarged water creatures from the Vecht, designed with forty Weesp children, light up the darkest stretch of the tunnel. A gift for Amsterdam's 750th year."
  body: |
    The Mr. Bouhuijstunnel takes pedestrians and cyclists under the railway by Weesp station, linking the old and new parts of Weesp. Since 18 December 2025 it holds WaterWeespers, a light artwork by the artists' group TaartRovers, which makes film and art programmes for children.

    About forty children aged 6 to 12 from several Weesp schools designed the creatures. They are blown-up versions of the tiny animals that live in the water of the Vecht, with all their odd shapes and funny details, and they glow softly in the darkest part of the tunnel, so that passers-by feel they have dived below the surface of the town, Alice-in-Wonderland style. It is one of five light artworks Amsterdam gave its residents for the city's 750th anniversary, chosen with curator Isabel Nielen of the Amsterdam Light Festival. It was also meant to make the tunnel feel safer, and it is planned to stay for eight years.

    Look for:
    - the ten water creatures and the children's drawing style in them
    - best seen after dark
  category: curiosities
  lat: 52.311235
  lng: 5.04578
  address: Mr. Bouhuijstunnel, Stationsweg
  links:
