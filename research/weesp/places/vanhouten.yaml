    rank: Nice
    heritage_status: Municipal monument
    monument_number: '450127001'
    built: 1829–1830, extended 1924–1959
    architect: "Johannes Montsche (garden, 1798–1799); K. Breijer (lodge 1930, bridge 1948)"
