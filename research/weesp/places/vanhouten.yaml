  nl:
    title: Het Duivenprieel
    summary: "Zeventien vergulde duiven op een roestig stalen prieel aan het water van de Kom, één voor elk raadslid van 2005: het werk van Marte Röling dat de gemeente de stad schonk bij 650 jaar stadsrechten."
    body: |
      Tel de duiven en je telt de gemeenteraad. Op dit prieel van cortenstaal aan de kade van de Kom zitten 17 vogels met een laagje bladgoud, en elk staat voor een van de 17 raadsleden van Weesp, toen nog een eigen gemeente. In 2022 ging Weesp op in Amsterdam.

      In 2005 vierde Weesp met een groot stadsfeest dat het 650 jaar stadsrechten had. Als blijvend aandenken gaf het gemeentebestuur de inwoners dit beeld van Marte Röling (geboren 1939). Burgemeester C. Hofkamp onthulde het op 5 mei 2006. Een duivenprieel is precies wat het woord zegt: een prieel voor duiven.

      Röling, schilder en beeldhouwer uit een kunstenaarsfamilie, woonde jaren in Weesp en liet daar ook een ander soort spoor na. Op 14 augustus 1989 leende de Koninklijke Luchtmacht haar een Starfighter, een straaljager, als kunstwerk voor haar tuin. Toen ze naar Uithuizen in Groningen verhuisde, ging het toestel mee, en daar stond het tot 2012 in de tuin.

      Let op:
      - het goud van de duiven tegen het verweerde staal
      - tel de vogels: het zijn er zeventien
    sources:
      - https://weesp.kunstwacht.nl/kunstwerken/bekijk/18442-het-duivenprieel
      - https://nl.wikipedia.org/wiki/Marte_R%C3%B6ling

- title: Weesper Moppenbakker
  summary: 'A small bronze baker in the bridge railing on the Binnenveer remembers the day in 1988 when Weesp''s bakers made a 115 kg Weesper mop, the local almond biscuit, and got into the Guinness Book of Records.'
  body: |
    The *Weesper mop* is the town's own biscuit, made of sugar, almond and egg, "and nothing more", as a Weesp baker put it. In 1988 the town's bakers joined forces to bake the biggest one ever. The result measured over a square metre, weighed 115 kg and made it into the Guinness Book of Records.

    To mark the feat the sculptor and medallist Siemen Bolhuis made this small bronze baker, set in 1989 into the railing on the Binnenveer by the Slijkstraatbrug. Bolhuis is best known for his statue of the comedians Wim Kan and Corry Vonk in front of the Kurhaus in Scheveningen.

    The mop is still taken seriously. The name and recipe are not protected, so anyone may bake one, but when a supermarket chain launched a passion-fruit Weesper mop in 2024, locals at the market were not amused: "Dit is geen Weesper mop."

    Look for:
    - the baker's figure in the railing, easy to walk past
    - the bakeries in the old town that still sell real moppen
  category: curiosities
  lat: 52.308355
  lng: 5.039849
  address: Binnenveer 1, railing by the Slijkstraatbrug
  links:
    - { label: Kunst in Weesp (kunstwacht), url: "https://weesp.kunstwacht.nl/kunstwerken/bekijk/18441-weesper-moppenbakker" }
