  nl:
    title: Achtergracht
    summary: "De achtergracht van de stadsuitbreiding van 1613, gedempt in 1961. Het kadaster noemt boeren, veehouders en scheepstimmerlieden als eigenaars van de huizen, met tuitgevels, negenruitsschuiframen en een paneeldeur met amandelvormige motieven."
    body: |
      In 1613 werd Weesp aan de westzijde uitgebreid. Het nieuwe stuk stad liep maar langzaam vol: op een kaart van rond 1649 liggen aan de Achtergracht vooral tuinen en boomgaarden, en pas in 1651 besloot men de gracht te graven. In 1961 werd hij gedempt.

      Het kadaster vertelt wie hier woonde. Het hoekpand Singelstraat 2 / Achtergracht 48 was in elk geval vanaf 1832 van Jan Schep, boer, daarna van Jan en Hermanus Schep, scheepstimmerlieden, hier wonend, en later van veehouders en aannemer Van Kooten. Breedstraat 25 en Achtergracht 79–85 stonden vanaf 1832 op naam van Hendrik van Maanen, die in Weesp boer was, en gingen daarna over op veehouders: Cornelis van Maanen, zijn weduwe Gerritje Achterberg en Pieter Ridder. In Weesp gaat het verhaal dat hier een stadsboerderij was, maar het kadaster spreekt van huizen en een stalling, later van huis en erf, en het onderzoek concludeert dat er geen boerderij zat.

      Achtergracht 56 stamt uit de 17e eeuw; de trapgevel is later veranderd in een puntgevel met een rollaag. Achtergracht 78–82 staan samen onder één schilddak en zijn uit de eerste helft van de 19e eeuw. Om de hoek staan Groeneweg 2, 4 en 6: negentiende-eeuwse panden met kapverdieping onder mansardekap, met uitgezaagde of geschulpte windveren en makelaars.

      De voormalige schuilkerk op Achtergracht 13–15 heeft een eigen plek.

      De speld staat bij Achtergracht 56.

      Let op:
      - de gewijzigde trapgevel met toppilaster op natuurstenen console en twee sierankers, Achtergracht 56
      - de twaalfruits schuifvensters met luiken en de paneeldeur met amandelvormige en cirkelvormige paneelmotieven, Achtergracht 50
      - het getoogde gemetselde poortje naast Achtergracht 61
      - de pilasteromlijstingen en kussenpanelen onder de vensterbanken van Achtergracht 76
      - de bovenlichten met levensboom van Achtergracht 78–80 en Groeneweg 6
      - de geschulpte windveren en de gietijzeren oculus in de top van Groeneweg 4
    attributes:
      built: 17e tot 19e eeuw
      original_use: Woonhuizen van boeren, veehouders en ambachtslieden
    sources:
    - https://dbnl.org/tekst/sten009monu11_01/sten009monu11_01_0173.php
- title: Former Catholic hidden church, Achtergracht
  summary: "A 17th-century coach house turned into a hidden Catholic church, whose builders gave it three big round-arched windows on the street, against the rules. Later a literary society's hall, the community hall 'Eensgezindheid' and a Christian school."
  body: |
    After the Reformation, Catholics in Weesp worshipped in *schuilkerken* (hidden churches) set up in attics and back rooms, which the town turned a blind eye to. In 1662 the new bailiff, Geerard Bicker, investigated them for the States of Holland. One was in today's Achtergracht 15, where the priest Joannes Pijnacker lived: it had an altar and benches for at least 150 people.

    The building had been the coach house of a mansion built between 1649 and 1662. A legacy from Anna van Renesse paid for its conversion into a church. National rules said a hidden church could have no real windows in its front and had to be entered from the back. The design departed from them: the front got three large, deep round-arched windows and a round-arched entrance. The arches are still there, now blind. In 1758 the house next door, no. 13, was bought as a sacristy and joined to the church.

    In December 1793, after a new Catholic church had been built on the Herengracht in 1792 (where the Laurentiuskerk stands now), the church and presbytery were sold to the literary society *Voor het Menschdom* (For Mankind), founded in 1791. In 1893 the town bought nos. 13 and 15 for a public hall called *Eensgezindheid* (Unity), and from 1915 a Christian secondary school (MULO) used the former church.

    Look for:
    - the three blind round arches in the street front
    - the cornice on brackets and the iron tie anchors
    - the dormer and six-pane window of no. 13, the old sacristy
