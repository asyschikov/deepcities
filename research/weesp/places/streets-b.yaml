  nl:
    title: Oudegracht
    summary: "De grens van de stadsuitbreiding van 1401: kleine 18e-eeuwse huizen met hijsbalken, het poortje van 1710, een lutherse pastorie uit 1889, een hoekhuis uit 1912 in de geest van Berlage en een slagerij uit 1923 waarvan de winkel nog gaaf is."
    body: |
      Op nr. 51 kun je nog zien hoe een slagerij er in 1923 uitzag: facettegels tegen de wanden en een plafond van opaalglas. Het huis zelf is veel ouder. Het is een breed 17e-eeuws pand, dat in 1897 in vier woningen werd opgedeeld en in 1923 slagerij met woning werd.

      De Oudegracht volgt de lijn van de uitbreiding van 1401, toen graaf Albrecht van Beieren Weesp toestemming gaf om te groeien en nieuwe verdedigingswerken aan te leggen. Wat er nu staat, is in drie eeuwen gebouwd.

      Uit de 18e eeuw zijn de kleine bakstenen huizen met dakkapellen en hijsbalken: nrs. 37 en 39, nr. 41 achter een gevel uit het begin van de 19e eeuw, en nr. 43, een klein huis dat dwars op de straat staat. Naast nr. 39 zit het poortje van 1710 met de steen "Al voor een ander", de achteringang van de vroegere hervormde pastorie aan de Nieuwstraat. Nr. 47-47a verstopt een 17e-eeuws kernhuis achter een jongere gevel die volgens het register "de structuur van het huis ontkent".

      Naar het noorden toe werd het moderner. Nr. 13 is een symmetrische villa uit 1889, de pastorie van de lutherse kerk; de eerste steen legde dominee J. Bergman. Nrs. 5-11 (1907) vormen een gespiegeld dubbel huis met art-nouveau-trekjes, betegelde portieken en de oude deuren. Nr. 19, op de hoek van de Sleutelsteeg, kwam er in 1912, in een stijl die aan Berlage doet denken en in Weesp zeldzaam is.

      De speld staat op nr. 51, de oude slagerij.

      Let op:
      - de dakkapel met hijshaak en de klassieke kroonlijst van nr. 39
      - de oudere gevelsteen met een zwaan op nr. 13
      - de betegelde portieken en art-nouveaudeuren van nrs. 5-11
      - de kwartronde hoekramen, het balkon en de granitovloer in het portiek van nr. 19
      - de winkelpui van de slagerij, nr. 51, met glas-in-loodbovenlichten in een lijst van witgeglazuurde steen, en de dakkapel met pilasters, fronton en voluten
      - de getande kroonlijst van het grote hoekhuis nr. 1, aan de Slijkstraat
    attributes:
      built: 17e eeuw tot 1912
      original_use: Woonhuizen, een pastorie en winkels
    sources:
    - https://dbnl.org/tekst/sten009monu11_01/sten009monu11_01_0173.php
- title: Achtergracht
  summary: "The back canal of the 1613 expansion, filled in in 1961. Land registers name farmers, cattle keepers and ship's carpenters as owners of its houses, with spout gables, nine-pane sashes and a door with almond-shaped panels."
  body: |
    In 1613 Weesp was extended to the west, with the Achtergracht (Back Canal). Building went slowly: on the map of about 1649 there are mostly gardens and orchards along the Achtergracht, and the decision to dig the canal itself was only taken in 1651. In 1961 it was filled in.

    The land registers show who lived here. The corner house at Singelstraat 2 / Achtergracht 48 belonged from at least 1832 to the farmer Jan Schep, then to Jan and Hermanus Schep, ship's carpenters who lived there, and later to cattle keepers and a building contractor. At Breedstraat 25 and Achtergracht 79–85 local tradition speaks of a town farm; the registers show the plots in the hands of the farmer Hendrik van Maanen and then of cattle keepers (Cornelis van Maanen, his widow Gerritje Achterberg, Pieter Ridder), described as houses and a stable, later as house and yard, and the research concludes there was no farm here.

    The houses are simple, plastered or brick, with cornices or spout gables. No. 56 is 17th century, its stepped gable later cut back to a plain point. Nos. 78–82 share one hipped roof and date from the first half of the 19th century. Round the corner on the Groeneweg, nos. 2–6 are three 19th-century houses under mansard roofs with cut or scalloped bargeboards and finials.

    The former Catholic hidden church at nos. 13–15 has its own entry.

    Pinned on Achtergracht 56.

    Look for:
    - the cut-down stepped gable with a pilaster on a stone corbel and two decorative anchors, no. 56
    - the twelve-pane sashes with shutters and the door with almond and circle panels, corner house no. 50
    - the arched brick gateway beside no. 61
    - the pilaster window surrounds and the plaster cushion panels under the windows of no. 76
    - the tree-of-life fanlights of nos. 78–80 and Groeneweg 6
    - the scalloped bargeboards and cast-iron round window in the gable of Groeneweg 4
