  nl:
    title: Voormalige slagerij, Nieuwstraat 14
    summary: "Achttiende-eeuws huis dat een gift aan de lutheranen was, een kostschool, een pastorie en een drukkerij, tot een slager er rond 1930 een pui in liet zetten met oranje, gele en blauwe tegels en het woord 'Vleeschhouwerij'."
    body: |
      Oranje, geel en blauw, en in grote letters "Vleeschhouwerij": de winkelpui van Nieuwstraat 14 valt op. Daarachter zit een veel ouder huis.

      Achter de bakstenen gevel van Nieuwstraat 12a–14a schuilt een diep achttiende-eeuws dubbelhuis, met een kelder onder het achterste deel. De lijst van gebruikers leest als een doorsnede van Weesp. In 1793 kreeg de lutherse kerk het pand cadeau. Begin negentiende eeuw zat er een kostschool, van 1861 tot 1868 de lutherse pastorie en van 1889 tot 1927 een boekhandel met drukkerij.

      Drukker Jannis Capon liet het in 1918 verbouwen. In 1927–1931 gaf slager D. van den Heuvel architect Raadsheer opdracht voor een nieuwe gevel, met invloeden van de Amsterdamse School. Een brede pui met tegels in oranje, geel en blauw en het woord Vleeschhouwerij, de oude spelling. Gekleurd glas in lood in de bovenlichten en in de drielichtsramen op de verdieping, en onder de goot een fries van siermetselwerk.

      Wat het register het hoogst waardeert, zit binnen: een winkel met betegelde vloeren en wanden in art-decovormen en een plafond van opaalglas in metalen strips. Is de winkel dicht, dan zie je vanaf de straat alleen de tegelpui. Aan de Oudegracht 51 is nog een slagerswinkel bewaard, iets ouder, uit 1923.

      Let op:
      - het woord "Vleeschhouwerij" in de betegelde pui
      - het gekleurde glas in lood in de bovenlichten van de winkel en in de ramen erboven
      - de fries van siermetselwerk onder de goot
      - de tuitgevel van 1927 aan de achterkant en een achttiende-eeuws schuifraam in de linkerzijgevel
    attributes:
      built: 18e eeuw; pui 1927–1931
      architect: E.W. Raadsheer (pui)
      original_use: Woonhuis; later kostschool, pastorie, drukkerij en slagerij
    sources:
    - https://dbnl.org/tekst/sten009monu11_01/sten009monu11_01_0173.php
- title: Het Grote Plein and the south Nieuwstraat
  summary: The square laid out in front of the new town hall in 1772, framed by large 18th-century houses probably built for distillers, and the quieter south end of the Nieuwstraat with its lanes of small plastered houses.
  body: |
    Het Grote Plein (the Great Square) exists because of the town hall. When it was built in 1772–1776, the Grobbe, the canal in front of it, was vaulted over and a square appeared. Two pairs of large 18th-century houses, set sideways, frame it: nos. 1 and 3 share one white plastered front with block joints and two wooden door surrounds, and nos. 2 and 4 are stately houses with straight cornices. They were probably built as distillers' houses, in the century when some thirty distilleries made Weesp rich on brandy and genever. No. 5, on the corner, was made out of two older houses and got its present look in the later 19th century.

    South of the square the Nieuwstraat continues with older, smaller houses. No. 87 is the tallest of the old houses in this part of town and one of the few built with two full storeys from the start; the Gereformeerde (Reformed) church of Weesp has its origins in this house. Nos. 49–53 were three small 17th-century houses, raised later behind a carefully plastered front, and no. 71 is a pair of deep houses under one roof behind a brick spout gable.

    The lanes off the street keep the small scale of the old town: Kapelsteeg 1–3, Sint Antoniestraat 1, the shared white front of Achter 't Vosje 20–24, and the big whitewashed Wollenweversbuurt 18, which the map of 1632 already shows as a long building and which is said to have been a farm.

    Pinned on Het Grote Plein 4.

    Look for:
    - the carved door with its surround, Het Grote Plein 4
    - the two wooden door surrounds in the shared white front of Het Grote Plein 1–3
    - the cornice on blocks and decorated window frames of the corner house Het Grote Plein 5
    - the cordon moulding and basket arches over the ground-floor openings of Nieuwstraat 87
    - the brick spout gable of Nieuwstraat 71
    - the old panelled door with a cast-iron tree of life, Kapelsteeg 1, and the fine gutter brackets of Kapelsteeg 3
    - the original four- and six-pane windows under one long cornice, Achter 't Vosje 20–24
