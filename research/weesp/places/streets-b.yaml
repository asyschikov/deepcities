  nl:
    title: Kerkstraat en Kerksteeg
    summary: "Een kort straatje met gewone woon- en werkpanden bij de Grote Kerk: de kosterij, De Gouden Reaal uit 1697, het pand van een schildersbedrijf uit wiens familie een van de eerste fotografen van Weesp kwam, en een steeg met eenkamerwoninkjes."
    body: |
      In dit hoekje woonde een schildersfamilie met een fotograaf in de familie. Het hoekhuis Kerkstraat 17, op de hoek met de Middenstraat, en de werkplaats erachter waren van de firma M. van den Bergh, huisschilders en behangers. B. van den Bergh uit die familie wordt gerekend tot de vroegste fotografen van Weesp. Zijn foto's van het huis (1910) en de werkplaats (1913) liggen in het regionale archief.

      De Kerkstraat begint bij de Grote Kerk en is een straat van bescheiden woonhuizen en werkplaatsen, een aantal met een 19e-eeuwse gevel. Nr. 19 is de kosterij van de kerk: twee oudere diepe huizen die in de 18e eeuw achter één lijstgevel zijn samengevoegd. Nr. 13 heet De Gouden Reaal, naar een oude munt. Het is een gepleisterd huis dat dwars op de straat staat, tussen twee puntgevels, met het jaartal 1697. De nrs. 2-6 horen bij elkaar: een blokvormige bakstenen werkplaats uit de 19e eeuw onder een tentdak, met aan weerszijden lage vleugels om in te wonen.

      Net om de hoek staat iets wat je zelden nog ziet. Kerksteeg 8-10 is een rijtje piepkleine huisjes van elk één kamer met een zolder erboven, gebouwd voor arbeiders (of ouderen) nog vóór wat het register de "Van Houten-periode" noemt.

      De speld staat bij De Gouden Reaal, Kerkstraat 13.

      Let op:
      - De Gouden Reaal, het lage gepleisterde huis van 1697 op nr. 13
      - de deur tussen pilasters onder een hoofdgestel, de zesruitsschuiframen en de houten kroonlijst van hoekhuis nr. 17
      - de lange houten kroonlijst van de kosterij, nr. 19
      - de houten benedenpui van nr. 23, met links inrijdeuren en rechts de voordeur
      - de getande kroonlijst van nr. 29
      - de negenruitsschuiframen van de eenkamerwoninkjes in de Kerksteeg 8-10
    attributes:
      built: 1697 tot 19e eeuw
      original_use: Woonhuizen, kosterij en werkplaatsen
    sources:
    - https://dbnl.org/tekst/sten009monu11_01/sten009monu11_01_0173.php
- title: Nieuwstraat, the filled-in moat
  summary: 'Weesp''s 14th-century moat, the Grobbe, vaulted over and filled in between 1772 and 1827: now a street of old fronts around the Grote Kerk and the town hall, with the arms of Amsterdam on a gable, a ship gable stone and a parsonage behind a front garden.'
  body: |
    The Nieuwstraat (New Street) is not new at all. It began in the 14th century as the town moat, the *Grobbe*, in front of an earthen rampart. Between 1772 and 1827 the water was partly vaulted over and filled in: first in front of the new town hall, where Het Grote Plein appeared, then the rest. The houses that once looked onto a canal now line a street, with the Grote Kerk (no. 31) and the town hall (no. 41) at its heart.

    Many fronts were redone in the 19th century with plain cornices, but the houses behind are old. Nos. 7–11, on the corner of the Hanensteeg, still have timber frames with curved braces and oak roofs from about 1575–1625. No. 25, with its side wall free along the Dirk Marcussteeg, is in the register's words an extremely rare building of great age, with a well-preserved old roof and beams marked with hacked and gouged assembly marks. No. 39 was a bakery from at least the early 19th century; on the night of 22–23 September 1916 a fire destroyed its wood loft and flour store, but the house and bakehouse were saved.

    Opposite the church, no. 34 is the only house that stands back from the building line, behind a front garden. The town council gave a house here to the Reformed church around 1638; in 1721–22 it was rebuilt "entirely new" for 3,000 guilders, though traces in the front suggest an older part was kept, and it served as the parsonage into the 20th century. Its back gate on the Oudegracht carries the 1710 stone "Al voor een ander" (All for another).

    Pinned on no. 50, whose gable carries the arms of Amsterdam: a stone that became oddly prophetic when Weesp joined Amsterdam on 24 March 2022.

    Look for:
    - the 18th-century gable with the Amsterdam arms, no. 50
    - the double plastered gable of the 17th century with a gable stone showing a ship, no. 28
    - the white bell-shaped corner gable of nos. 7–11
    - the low, long front with toothed cornice, wooden door surround and Renaissance-style dormers of the old parsonage, no. 34
    - the neo-Renaissance shopfront and coloured brick frieze of no. 10–10a (about 1890)
    - the double shopfront with cast-iron Ionic half-columns, no. 62a–62b (front of 1904)
