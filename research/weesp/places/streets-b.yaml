  nl:
    title: Amsterdamse School-brug, Groeneweg
    summary: "Een bakstenen bruggetje met twee pylonen en smeedijzeren hekken, gebouwd als toegang tot het park erachter. Een zeldzaam stukje Amsterdamse School in Weesp, nu de weg naar park Zeerust en zorgcentrum Vivium Oversingel."
    body: |
      De Amsterdamse School, de beeldende baksteenstijl van Amsterdam tussen de wereldoorlogen, kwam in Weesp nauwelijks aan. Dit bruggetje aan de Groeneweg is een van de weinige plekken waar je hem toch tegenkomt.

      Onder de brug loopt het water door een tongewelf, dat je aan de zijkanten als rondboog ziet. De borstweringen van donkerrode baksteen lopen naar het midden op. Daar staan twee pylonen met gesmede hekken, sober versierd, en aan de buitenkant zitten nog stukken siersmeedwerk. Bovenop de pylonen en in de randen van de borstweringen zitten blokken en ornamenten van Muschelkalk, een kalksteen vol schelpjes. De ijzeren staaf die vroeger de toppen van de pylonen verbond, is weg.

      De brug was bedoeld als ingang van het park erachter, dat in 1989 flink is ingekrompen. Nu kom je via de brug bij park Zeerust en zorgcentrum Vivium Oversingel. Vlakbij, aan de Hugo de Grootlaan, staan het Van Houtenmonument uit 1928 en, op de hoek, de gedenkbank voor dokter S. Wartena.

      Let op:
      - de stenen ornamenten bovenop de pylonen
      - de hekken en het siersmeedwerk aan de buitenkant van de pylonen
      - de borstweringen die naar het midden oplopen
      - de rondboog van het gewelf in de zijmuren
    attributes:
      original_use: Toegangsbrug van een park
    sources:
    - https://zoek.officielebekendmakingen.nl/gmb-2021-335015.pdf
- title: Toll and bridge-keeper's house, Ossenmarkt
  summary: "The white house by the Lange Vechtbrug, built in 1732 to take tolls and work the bridge and enlarged around 1840, with a balustrade and stone Doric columns on its river side. For a time it also held a church."
  body: |
    The Lange Vechtbrug, a renewed double wooden drawbridge, crosses the Vecht at the Ossenmarkt (Ox Market). Beside it stands the former toll and bridge-keeper's house, built in 1732 and enlarged around 1840, when three of its sides were renewed.

    It is a white plastered brick building of one storey under a pantiled roof with hipped ends. On the river side it got a grander front: a large round-arched window, a projecting bay, a balustrade and attic, and bluestone Doric columns at the corners. A panelled door and sash windows with glazing bars complete it.

    For some time the house also held a church. On the Vecht island, at Ossenmarkt 44, stands the round tower fort of 1859–1861, Fort Ossenmarkt.

    Look for:
    - the bluestone Doric columns at the corners
    - the large round-arched window and the projecting bay on the river side
    - the balustrade and attic along the roof
    - the panelled door and the sashes with glazing bars
