  nl:
    title: Ora et Labora, houten boerderij aan de 's-Gravelandseweg
    summary: "Een houten boerderij in het schootsveld van Fort Uitermeer, waar de vestingwet steen verbood: een licht geschilderd woonhuis onder een mansardedak, geteerde schuren, drie forse kastanjes en een ijzeren hek met de geschilderde naam."
    body: |
      Steen mocht niet, dus werd het hout. Langs de 's-Gravelandseweg, ten noorden van Fort Uitermeer, bepaalde de Kringenwet hoe een boerderij eruitzag. In het schootsveld van het fort moest alles van hout zijn, en zo verrees in 1914 de boerderij Ora et Labora, Latijn voor bid en werk.

      Het woonhuis staat op een lage stenen plint, onder een mansardedak met gesmoorde tuiles du nord. De kopgevel aan de weg is bekleed met verticale kraaldelen, de lange zijkanten met liggende planken, en het geheel is licht geverfd. Het lagere bedrijfsgedeelte erachter, met een flauw dak, is geteerd, net als de losse schuur met zijn groene deuren. Voor de schuiframen hangen luiken, met bovenin jaloezieën. Rechts zie je kelderraampjes met tralies.

      Bij de ingang staat een mooi ijzeren damhek dat uit Hilversum zou komen, met de naam van de boerderij erop geschilderd. Drie grote kastanjebomen maken het plaatje af. In 2021 werd de boerderij rijksmonument, samen met een groep andere houten gebouwen bij Fort Uitermeer.

      Je ziet het vanaf de weg.

      Let op:
      - de geschilderde naam op het ijzeren hek
      - de staande kraaldelen van de voorgevel naast de liggende planken van de zijkanten
      - de luiken met jaloezieën
      - het lichte woonhuis tegenover de geteerde schuren
      - de drie kastanjebomen
    attributes:
      original_use: Boerderij
    sources:
    - https://monumentenregister.cultureelerfgoed.nl/complexen/532511
- title: Huize America and Vechtzicht
  summary: 'Two 18th-century houses on the ''s-Gravelandseweg along the Vecht, probably built as country retreats: white L-shaped America, raised over a souterrain with a carved stoop, and Vechtzicht with its broad, stately front.'
  body: |
    East of the town, the 's-Gravelandseweg follows the winding Vecht on its dike. Two of its houses were probably built in the 18th century as *buitenhuizen*, country retreats.

    Huize America, at no. 6, goes back to the 17th and 18th centuries. It is a white plastered L-shaped house whose main floor is raised above a souterrain, with a cellar below. A stoop with carved side pieces and iron railings leads to the door, and two dormers with cheek pieces sit in the roof. The farm at no. 7, with its working and living parts, was built against it around 1830; the register calls America its front house.

    Further along, at no. 22, Vechtzicht (Vecht View) is a long house of the late 18th century with a broad, stately front under a straight cornice.

    Both are private homes.

    Pinned on Huize America.

    Look for:
    - the stoop with carved side pieces and iron railings, no. 6
    - the dormers with cheek pieces, no. 6
    - the raised main floor over the souterrain windows, no. 6
    - the broad front and straight cornice of Vechtzicht, no. 22
