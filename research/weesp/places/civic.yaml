    title: Poortje 'Al voor een ander', Oudegracht
    summary: "Een poortje tussen twee grachtenhuizen met een gebeeldhouwde steen uit 1710: een voorstelling van gebouwtjes en het opschrift 'Al voor een ander'."
    body: |
      Tussen Oudegracht 39 en 41 zit een smal poortje met daarboven een gebeeldhouwde steen uit 1710. De steen is in drie vakken verdeeld: links 'ANNO', rechts '1710' en in het midden een reliëf van een groepje gebouwtjes. Daaronder staat het opschrift 'AL VOOR EEN ANDER'.

      Het poortje is als rijksmonument ingeschreven onder de erfscheidingen. Op de deur staat het huisnummer 39a. Het register zegt niet wat het opschrift betekent.

      Let op:
      - het reliëf met gebouwtjes tussen 'ANNO' en '1710'
      - de letters van het opschrift onder de vakken
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/38618
