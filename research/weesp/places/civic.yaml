  nl:
    title: Amsterdamse Huizen, Herensingel
    summary: "Twaalf woningen boven elkaar achter één deftige, symmetrische gevel uit 1876. Ze moesten het begin worden van een chique stationswijk na de komst van het spoor in 1874; daarna kwamen er alleen arbeidershuizen, waarvan veel rond 1980 weer verdween."
    body: |
      Dit was het begin van een wijk die nooit kwam. In 1874 ging de spoorlijn van Amsterdam naar Hilversum open en kreeg Weesp een station, net ten noorden van de oude stad. Het idee was om daar een royale stationswijk neer te zetten. In 1876 bouwde de exploitatiemaatschappij *de vereniging Amsterdam* dit blok aan de Herensingel, langs de singelsloot: zes panden, elk met een boven- en een benedenwoning, drie lagen hoog op een kelder en onder één schilddak. In Weesp heten ze de Amsterdamse Huizen. Van de deftige wijk kwam niets terecht. Al snel verrezen ernaast alleen nog arbeiderswoningen, gebouwd op speculatie, en veel daarvan ging tegen de vlakte toen de stationsbuurt vanaf 1980 werd gesaneerd. Dit blok bleef staan.

      De gevels zijn ontworpen als één symmetrisch geheel. De twee middelste huizen kregen de meeste aandacht: een gepleisterde ingangspartij met extra vensteromlijstingen, gepleisterde vakken op de bel-etage en frontons boven de portieken. Op oude foto's staat daar bovendien een balustrade boven de goot.

      Let op:
      - de doorlopende klassieke goot op rijke consoles
      - de drie gekoppelde dakkapellen met hijsbalken, de middelste met een gebogen fronton
      - de gepleisterde sluitstenen boven elke vensterboog
      - de lambrequins (geschulpte planken) onder de ramen van de eerste verdieping
    attributes:
      original_use: Gestapelde boven- en benedenwoningen
    sources:
      - https://data.amsterdam.nl/monumenten/830fa4c3-0085-4341-bb24-edd5fa965d53
      - https://020apps.nl/mip/beschrijvingen/Weesp.pdf

- title: Waagplein houses
  summary: Two double houses of 1936 by J.D. van Arkel, in yellow brick with mansard roofs and leaded glass, showing traces of the Amsterdam School. Their roofs run straight over the front without overhang.
  body: |
    These two blocks of two houses each went up in 1936, a few steps from the Grote Kerk. Each block is a mirrored double house: one storey under a mansard roof set at right angles to the front, in yellow-toned brick over a plinth of dark sintered brick. The two front doors share one canopy, and between them sit the small toilet windows. The architect was J.D. van Arkel, who later designed the church of the Apostolic Society in Weesp (1957).

    The city lists them as intact houses on a remarkable spot, with Amsterdam School traits. None is fully original outside, but every original form and detail is still there in the whole.

    Look for:
    - the shared canopy over each pair of doors, with the tiny toilet windows between
    - the leaded-glass transoms, also over the front doors
    - the roof tiles running over the gable without an overhang
    - the horizontal glazing bars still in the windows of nos. 6 and 8
