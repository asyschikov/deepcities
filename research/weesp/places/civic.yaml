  nl:
    title: Woningen Waagplein
    summary: "Twee dubbele woningen uit 1936 van J.D. van Arkel, in gele baksteen onder een mansardekap, met glas in lood en een vleugje Amsterdamse School. De dakpannen lopen zonder overstek over de gevel door."
    body: |
      Het dak houdt niet op bij de gevel. Met speciale gevelpannen loopt het er gewoon overheen, zonder overstek, alsof het huis een strakke muts op heeft.

      De twee blokken van elk twee woningen kwamen er in 1936, op een paar passen van de Grote Kerk. Elk blok is een dubbel huis waarvan de ene helft het spiegelbeeld van de andere is: één bouwlaag, daarboven een mansardekap die haaks op de voorgevel staat. De muren zijn van geelachtige baksteen, met onderaan een plint van donkere, gesinterde steen. De twee voordeuren delen één luifel, en daaronder zitten tussen de deuren de raampjes van de wc's. Architect was J.D. van Arkel, die later in Weesp ook de kerk van het Apostolisch Genootschap (1957) ontwierp.

      De gemeente noemt ze gaaf bewaard en opvallend gelegen, met trekken van de Amsterdamse School. Aan de buitenkant is geen enkel huis nog helemaal origineel, maar samen laten ze alle oorspronkelijke vormen en details nog zien.

      Let op:
      - de gedeelde luifel boven elk paar deuren, met de wc-raampjes ertussen
      - de bovenlichten met glas in lood, ook boven de voordeuren
      - de dakpannen die zonder overstek over de gevel doorlopen
      - de horizontale roeden die nog in de ramen van nummer 6 en 8 zitten
    attributes:
      original_use: Woningen
    sources:
      - https://data.amsterdam.nl/monumenten/31c27c21-e506-48aa-8c1a-5e67873e4a12
      - https://nl.wikipedia.org/wiki/Lijst_van_gemeentelijke_monumenten_in_Weesp

# ================================================================ Curiosities

- title: Gate "Al voor een ander", Oudegracht
  summary: "A plain door between two canal houses, crowned by a carved stone of 1710 with a little row of buildings and the motto \"Al voor een ander\" (All for another)."
  body: |
    Between Oudegracht 39 and 41 is a narrow doorway. Above it sits a stone lintel in three panels: *ANNO* on the left, *1710* on the right, and in the middle a small relief of a group of gabled buildings. Underneath runs the motto *AL VOOR EEN ANDER*, which can be read as "all for another" or "all for someone else".

    The register does not say what the motto means. The door is numbered 39a. The gate and its stone are listed as a national monument in their own right, filed in the register under property boundaries. It is a small find on a walk along the Oudegracht: easy to miss, easy to photograph.

    Look for:
    - the relief of buildings between ANNO and 1710
    - the lettering of the motto under the panels
