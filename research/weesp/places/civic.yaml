  nl:
    title: Maarten Lutherkerk (Weesp)
    summary: "Kleine lutherse zaalkerk uit 1818 met een gebogen fronton, slingers boven de deur en een houten klokkentorentje. Sinds 2010 zit er een tandarts, en dankzij glazen wanden voel je binnen nog de ruimte van de kerk."
    body: |
      Waar ooit gepreekt werd, wordt nu geboord. Sinds 2010 zit er een tandartspraktijk in de lutherse kerk van Weesp. Bij de verbouwing kwam er veel glas in de wanden, zodat de ruimte van de oude kerkzaal nog te ervaren is.

      De lutheranen hadden hier vanaf 1657 een kerk. In 1818 kwam er een nieuwe voor in de plaats: een bakstenen zaalkerk met hoge spitsboogramen, een voorgevel met gebogen fronton, slingers boven de ingang en een vierkant houten klokkentorentje met naaldspits. De inrichting is van rond 1820, maar er zitten stukken uit de vorige kerk tussen. Daaronder het orgel van de Amsterdamse orgelmaker Johannes Stephanus Strümphler, in 1769 ingewijd en in 1818 overgezet naar de nieuwe kerk.

      In 2006 vertrok de gemeente, die in Weesp samenging met andere protestantse groepen. Toen het gebouw in 2008 werd verkocht, leidde dat tot enige onenigheid. Na een verbouwing in 2010 trok de tandarts erin.

      Let op:
      - het gebogen fronton en de slinger boven de deur
      - het houten klokkentorentje op het dak
    attributes:
      original_use: Lutherse kerk
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/38580
      - https://nl.wikipedia.org/wiki/Maarten_Lutherkerk_(Weesp)

- title: Former synagogue, Nieuwstraat
  summary: "Weesp's synagogue of 1840, whose Jewish community, says the plaque, was gone by 29 April 1942. After the war it was a garage; since 1997 it is a synagogue again. Stolpersteine lie in the pavement by the plaque."
  body: |
    Jews lived in Weesp from at least the 1770s; in 1774 they opened a house synagogue on the Korte Middenstraat. By 1840 that building was near collapse and too small, and with help from the town, the province and the state the community built a new synagogue on the corner of the Nieuwstraat and the Hanensteeg, inaugurated on 30 October 1840. It served Jews from Muiden, Nederhorst den Berg and Weesperkarspel too. The building is a transverse two-part house: the plastered left half was probably the cantor's home, the brick right half with three pointed windows the synagogue. Four years after it opened, a mob broke its windows after a false rumour; some of the culprits were punished.

    In 1930 about fifty Jews lived in Weesp. During the occupation they were driven out of Weesp; the plaque gives 29 April 1942. Of some sixty-five Jewish men, women and children, seven came back. Only the Holy Ark survived the looting. After the war the synagogue was a garage. A plaque was placed in 1984, the entrance restored in 1986, and in 1997 the building was taken into use again as a synagogue and Jewish cultural centre, with the Council of Christians and Jews in the house next door.

    Look for:
    - the three pointed windows with plaster surrounds against the brick front
    - the 1984 plaque: *Dit was de plaats waar zij de Eeuwige en elkaar ontmoetten* (This was the place where they met the Eternal and each other)
    - the stolpersteine (memorial cobblestones) in the pavement in front
