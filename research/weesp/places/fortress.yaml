  nl:
    title: Molen 't Haantje
    summary: "Deze molen stond eerst in Amsterdam, rond 1663 aan de Boerenwetering waar nu de Ruysdaelkade loopt, en sleep er steen en maakte loodwit. In 1820 ging hij in stukken per schip naar Weesp. Een wipmolen met stelling, volgens het register een bijzonder type."
    body: |
      De kap is ouder dan de molen. Mogelijk komen er stukken uit een oliemolentje dat rond 1600 aan het Tuinpad in Amsterdam stond. In 1663 ging die molen naar de Boerenwetering, ongeveer waar de Ruysdaelkade nu de Saenredamstraat kruist. Daar sleep en zaagde hij steen, onder de naam De Stamper. Vanaf 1716 heette hij De Haan en maakte hij loodwit voor eigenaar Jan Rutgers, wiens naam in een opschrift op de kap stond (dat deel is in 2006 vervangen).

      In 1820 werd de molen uit elkaar gehaald en per schip naar Weesp gebracht. Aan de Korte Stammerdijk ging hij als oliemolen weer aan de slag, en rond 1830 als korenmolen. Het is een wipmolen, waarbij alleen het bovenste deel draait, met een stelling eromheen: volgens het register een bijzonder type. Cacaobaas C.J. van Houten kocht hem in 1896 om sloop te voorkomen. In 1918 maalde hij voor het laatst, en in 1943 kocht een kunstenaar hem en liet het binnenwerk eruit halen. De Weesper architect J.D. van Arkel restaureerde hem in 1951, waarbij het onderstuk een woning werd. Nu wonen er drie huishoudens in de molen en de twee vleugels met schilddak. De wieken draaien weer sinds 1977; in 2002 en 2006 volgden grote restauraties. Er wordt gewoond, maar op Nationale Molendag (tweede zaterdag van mei) en Open Monumentendag mag je naar binnen.

      Let op:
      - het vierkante onderstuk dat taps overgaat in het rieten achtkant en de kap
      - de stelling, precies waar het brede deel smal wordt
      - de gesneden makelaar (een replica uit 2006) waar de gebogen dakvlakken samenkomen
      - de driezijdige erker aan de rechtervleugel
    attributes:
      built: circa 1663 in Amsterdam; in Weesp herbouwd in 1820
      architect: J.D. van Arkel (verbouwing 1951)
      original_use: Steen- en loodwitmolen, later olie- en korenmolen
    sources:
      - https://data.amsterdam.nl/monumenten/e6d98f4f-6123-4cd4-8316-da7fe5ab9c62
      - https://nl.wikipedia.org/wiki/%27t_Haantje_(Weesp)

- title: Former miller's house and telegraph office, Korte Stammerdijk 5
  summary: "A small detached house on the Smal Weesp, probably once the miller's house of a neighbouring mill called Het Anker. For a while it was the telegraph office, and the counter is still there."
  body: |
    This mansard-roofed house of purple-red handmade brick stands on its own on the Korte Stammerdijk along the Smal Weesp. According to the city register it was probably the miller's house of a neighbouring mill called Het Anker. In 1938 its owner, the grain merchant R. Pfeiffer, who also owned the mill, had it remodelled by the architect J.D. van Arkel. Before that it had six-pane windows and a hipped roof. Van Arkel added a bay window with leaded glass and a dormer. For a time the house served as the telegraph office, and its counter window survives.

    The register values it as a characteristic detached house whose position matters to the townscape. Another monument guide calls it a gardener's house of around 1870, so its first use is not quite settled.

    Look for:
    - the mansard roof with smoked old Dutch tiles and a pretty dormer
    - the entrance on the east side with a fine door and a lobed fanlight
    - the leaded glass of 1938 in the bay and the shop window of the link building
    - the railing with cast-iron ornaments in front
