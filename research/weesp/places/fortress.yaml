  nl:
    title: Fort Uitermeer
    summary: "Al sinds 1589 een schans aan de Vecht, met een ronde bomvrije toren uit 1845 die het leger in 1954 probeerde op te blazen. Alleen de buitenmuren bleven staan. De holle ruïne staat in zijn gracht, als onderkomen voor vleermuizen en een kerkuil."
    body: |
      In 1915 werd Jac. P. Thijsse opgepakt door het leger. Hij zat de toren te tekenen. Die verrees volgens hem uit de rivier "als een groot wit kasteel". Zijn aquarel kwam toch in het Verkade-album over de Vecht.

      Waar de 's-Gravelandse Vaart, de vaart naar Hilversum, in de Vecht uitkomt, lag al in 1589 een aarden schans: Uitermeer. In 1673 werd het een echt gebastioneerd fort, gebouwd rond een nieuwe sluis. Die sluis verdedigen was de hoofdtaak. Er gingen boten door, maar je kon er ook het land richting Naarden mee onder water zetten. In september 1787 viel het fort zonder één schot in Pruisische handen. De zes soldaten en hun sergeant schuilden voor de regen, en de boerenknecht die op de brug moest letten, liet hem zakken toen de Pruisische luitenant tegen hem uitviel.

      Voor de Nieuwe Hollandse Waterlinie kwam er in 1845 een ronde, bomvrije toren, een van de eerste torenforten van Nederland. Lang deugde hij niet: beter geschut en later de brisantgranaat maakten van baksteen een schietschijf. In 1876 werd de gracht gedempt, de ophaalbrug weggehaald, de ingang dichtgemetseld en de toren aan de oostkant en op het dak onder aarde gezet. In 1878 kwam er een nieuwe sluis buiten het fort, en de vaart werd om het eiland heen gelegd.

      Na de Tweede Wereldoorlog werd het een munitiedepot. In 1954 groeven genisten de aarde weg en probeerden ze de toren op te blazen, maar alleen het binnenwerk ging tegen de grond. Eromheen kwamen plofhuisjes: kleine munitieopslagen met dikke muren en een heel licht dak. In 2003–2006 is het fort als ruïne hersteld. De gracht werd weer uitgegraven, zodat de toren in het water staat, en midden op het eiland kwam de zeventiende-eeuwse sluis weer boven. Van de tien bomvrije torens die Nederland nog heeft, is dit de enige ruïne. Vrijwilligers van stichting Uiteraard Uitermeer zorgen voor het eiland, dat vol nestkasten hangt. Je kunt om het fort heen lopen; de ingang van de ruïne is met een hek afgesloten.

      Let op:
      - de schietgaten op elke verdieping, en rechts naast de huidige ingang de dichtgemetselde oorspronkelijke toegang
      - de opgegraven sluiskolk van 1673 met stenen sponningen voor schotbalken
      - de kanonremise van 1885 aan de zuidoostkant van het eiland, nu een slaapplaats voor vleermuizen
      - het betonblok van een gietstalen koepelkazemat uit 1939–1940 op de oude wal bij de Kreugerlaan
      - het draaibruggetje over de noordelijke gracht, met draaischijf en kettingen
      - ten noorden van het fort de sluis van 1878 in de 's-Gravelandse Vaart, met sluiswachterswoning en een ijzeren ophaalbrug (1888) die in 1947 hierheen kwam van de Stolwijkersluis bij Gouda
    attributes:
      built: 1673 (fort en sluis); toren 1845; kanonremise 1885; sluis buiten het fort 1878
      original_use: Fort ter verdediging van een inundatiesluis
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/complexen/531341
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/531342
      - https://nl.wikipedia.org/wiki/Fort_bij_Uitermeer

- title: Koepelkazemat U 44 and the concrete works of Uitermeer
  summary: By the railway crossing on the Keverdijk stands one of the very few casemates in the country that still has its cast-steel machine-gun dome. Around it lie a 1934 casemate and the pyramid-roofed shelters of 1939–1940.
  body: |
    In the 20th century military tactics changed drastically, and the defence moved out into the fields between the forts. Around Fort Uitermeer and Fort Hinderdam the army built a whole landscape of concrete: casemates and group shelters lined up along the roads, dikes and the Amersfoort–Amsterdam railway, the shelters marked U or H for the Uitermeer or Hinderdam sector.

    The star is casemate U 44, by the level crossing on the Keverdijk north of the fort. It is a *koepelkazemat type G* (1939–1940): a low concrete block with a man-high cast-steel dome, 1.75 m across and 14 cm thick, with a protective "eyebrow" over the gun slit. About 700 such domes were cast, but during the war the Germans pulled almost all of them out to melt down for steel. Complete ones are now rare; this is one of the last with a dome 14 cm thick.

    Near the lock on the Kreugerlaan is casemate "Keverdijk" (1934), built to the army's *Voorschrift Inrichten Stellingen* (a 1928–1935 rulebook so that conscripts could build defences themselves). It flanked the new Hilversum–Weesp provincial road of 1927, with its gun slit reinforced by bristling rail sections. Scattered through the polder are group shelters type P, nicknamed "the pyramid" for their striking shape, each giving 10–12 men cover from shellfire. The front never reached them: the Netherlands surrendered in May 1940 before it got to Fort Uitermeer.

    Look for:
    - the steel dome and its armoured "eyebrow" on U 44, beside the railway
    - the chamfered front of the concrete block, meant to make shells glance off
    - the earth-covered roof of casemate Keverdijk and the rails set in its embrasure
    - the cone on top of each type P shelter, made for a periscope that was hardly ever fitted
    - the sector letter U or H on each shelter
  category: hidden-history
  lat: 52.296723
  lng: 5.084701
  address: Keverdijk, by the railway crossing, Weesp
