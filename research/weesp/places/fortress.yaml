  nl:
    title: Theetuin op de Bakkerschans
    summary: "De eerste theetuin van Nederland (1986), aangelegd door drie tuinontwerpers uit Weesp op een bastion van 1674. Bollen en vaste planten achter hoge hagen, een verstopte vijver, schapen op de wal en thee in een oude munitieloods."
    body: |
      Thee drinken in een munitieloods: op de Bakkerschans kan dat. In 1875 zette het leger een houten artillerieloods op dit bastion. Die staat er nog, zwart geverfd en net als de rest van de vestingwerken een rijksmonument, en is nu het theehuis.

      De Bakkerschans is een van de twee bastions die Weesp in 1674 aan de overkant van de Vecht aanlegde. In 1986 maakten drie tuinontwerpers uit Weesp er een tuin van: Jacqueline van der Kloet, Stan Gall en Niek Roozen. Zelf noemden ze het de eerste theetuin van Nederland.

      Achter hoge hagen ligt een bloementuin die bekendstaat om zijn plantcombinaties, vooral met voorjaarsbollen en vaste planten. In het midden zit een vijvertje met een fontein. Via een trap kom je op de wal, waar oude bomen omheen staan en Ouessantschapen het gras kort houden. Vanaf de punt van het bastion kijk je over de Vecht naar de stad.

      Het bastion is privéterrein. Wandelaars mogen overdag de tuin in, behalve op zondagen en feestdagen; van april tot oktober is hij op zijn mooist. Het theehuis is minder vaak open.

      Let op:
      - het kanon dat in 1812 in Vlissingen werd gegoten, bij het informatiebord bij de ingang
      - de vijver en fontein achter de hoge hagen
      - de Ouessantschapen op de wal
      - het uitzicht over de Vecht vanaf het eind van het bastion
    attributes:
      built: 1674 (bastion); tuin 1986
      original_use: Bastion met artillerieloods
    sources:
      - https://theetuin.nl
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/38662
      - https://www.ivn.nl/app/uploads/sites/94/2022/09/22_weesper_schans.pdf

- title: Weduwe met Kind
  summary: "Weesp's war memorial, a bronze widow holding her child and the empty coat of her dead husband, its sleeves still flapping as if he were running. Since 2018 a steel plate beside it names 79 Weesp war victims."
  body: |
    The sculptor Lidi Buma-van Mourik Broekman (1917–2015) explained the figure herself. A seated widow mourns and accepts the loss of the fallen; the great coat first takes all the attention, "the coat of him who is no more". Was he a soldier, or an ordinary man hunted to death by terror? The coat still seems to breathe the life of its owner: the empty sleeves still resist, the coat billows to one side as if the man had tried to flee, but the flight was broken and the coat kneels with her. Her fingers hesitantly touch the child, who looks up at her, worried and questioning.

    The bronze on its brick base first stood on the Prinses Irenelaan. When the schools there were extended in 2008 it went into storage at the municipal yard, and on 14 April 2009 it was placed here beside the tower fort. On 4 May 2018 relatives unveiled the name plate next to it, compiled by the local remembrance foundation with a few experts and the town. Of the 79 names, 59 are Jewish Weespers; their ages and places of death are listed too, often Auschwitz or Sobibor. Almost the whole Jewish community of Weesp was wiped out.

    Look for:
    - the empty sleeves of the coat, blowing sideways
    - the child's face turned up to its mother
    - the years 1940–1945 on the base
    - the steel name plate with ages and places of death
