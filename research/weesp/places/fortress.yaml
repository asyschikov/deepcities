  nl:
    title: Weduwe met Kind
    summary: "Het oorlogsmonument van Weesp: een bronzen weduwe met haar kind en de lege jas van haar gestorven man, waarvan de mouwen nog wapperen alsof hij wegrende. Sinds 2018 staan op een stalen plaat ernaast de namen van 79 Weesper oorlogsslachtoffers."
    body: |
      De jas is leeg, maar hij lijkt nog te leven. Beeldhouwster Lidi Buma-van Mourik Broekman (1917-2015) legde haar beeld zelf uit. Een weduwe zit neer en rouwt om de gevallenen, en legt zich erbij neer. Wie kijkt, ziet eerst die grote jas van de man die er niet meer is. Was hij soldaat, of een gewone man die door de terreur de dood in werd gejaagd? De lege mouwen verzetten zich nog. De jas waait opzij, alsof de man probeerde te vluchten, maar zijn vlucht werd gestuit en nu knielt de jas met haar mee. Haar vingers raken aarzelend het kind aan, dat ongerust en vragend naar haar opkijkt.

      Het brons op zijn bakstenen sokkel stond eerst aan de Prinses Irenelaan. Toen de scholen daar in 2008 groter werden, ging het beeld naar de gemeentewerf, en sinds 14 april 2009 staat het hier naast het Torenfort. Op 4 mei 2018 onthulden nabestaanden de naamplaat ernaast. De Stichting Nationale Herdenkingen Weesp stelde de lijst samen, met een paar deskundigen en de gemeente. Van de 79 namen zijn er 59 van Joodse Weespers. Bij elke naam staan de leeftijd en de plaats van overlijden, vaak Auschwitz of Sobibor. Van de Joodse gemeenschap van Weesp bleef in de oorlog bijna niemand over.

      Let op:
      - de lege mouwen van de jas, opzij gewaaid
      - het gezicht van het kind, opgeheven naar de moeder
      - de jaartallen 1940-1945 op de sokkel
      - de stalen naamplaat met leeftijden en plaatsen van overlijden
    attributes:
      original_use: Oorlogsmonument
    sources:
      - https://weesp.kunstwacht.nl/kunstwerken/bekijk/18455-weduwe-met-kind
      - https://www.nhnieuws.nl/nieuws/224147/Geschiedenis-Joodse-Weespers-vereeuwigd-met-naamplaat

- title: Lange Vechtbrug
  summary: "Two steep white wooden drawbridges facing each other across the Vecht, linking the Hoogstraat to the fortress island of the Ossenmarkt. Still operated on the spot at set times, next to the former tollhouse of 1732."
  body: |
    The *Lange Vechtbrug* ("long Vecht bridge", long by the standards of the other bridges over the river) is a double wooden drawbridge: two leaves that lift away from each other to let boats pass on the Vecht between Muiden and Nigtevecht. It carries the road from the Hoogstraat onto the Ossenmarkt, the island created when the 1674 fortress moat was dug, and on to the tower fort.

    A road across the Ossenmarkt was laid out in the early 18th century, and in 1732 a toll and bridge keeper's house was built beside the bridge: a low, white-plastered building with a balustrade and stone Doric columns on the corners, enlarged around 1840, that for a while also housed a church. The bridge itself has been renewed. It can only take light traffic, and it is operated on the spot at fixed times.

    Look for:
    - the two steep leaves rising towards each other
    - the white tollhouse at Ossenmarkt 1 with its corner columns
    - the view down the Vecht to the tower fort and the bastions
