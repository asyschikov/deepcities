  nl:
    title: Molen 't Haantje
    summary: Wipstellingmolen uit 1820, deels bestaand uit een molen die rond 1663 in Amsterdam werd gebouwd en in 1820 naar Weesp werd verplaatst. Vanuit typologisch oogpunt (wipmolen met stelling) is de molen bijzonder.
    body: |
      Mogelijk werd een rond 1600 door Cornelis Jacobsz. Smit aan het Tuinpad te Amsterdam opgerichte kleine oliemolen in 1663 verplaatst naar de oostzijde van de Boerenwetering (thans de Ruysdaelkade nabij de Saenredamstraat). De molen werd aangepast voor de functie van slijp- en steenzaagmolen en kreeg de naam 'De Stamper'. Tussen 1716 en 1722 werd deze molen, die dan als 'De Haan' bekend staat, aangepast voor het fabriceren van loodwit, blijkens een inscriptie van 'IAN RUTGERS' op de steenburrie.

      Na een kleine eeuw, in 1820, werd de molen gedemonteerd en verscheept naar Weesp. Na het assembleren werd hij in gebruik genomen als oliemolen; rond 1830 werd de functie gewijzigd naar korenmolen. In 1896 werd 't Haantje verkocht aan de cacaofabrikant C.J. van Houten, die de molen voor sloop wilde behoeden. In 1918 heeft de molen voor het laatst gemalen en in 1943 is hij verkocht aan een kunstenaar, die het gaande werk liet verwijderen. In 1951 werd het complex gerestaureerd naar ontwerp van de lokale architect J.D. van Arkel en in gebruik genomen als drie woonhuizen. Na ingrijpende restauraties in 2002 en 2006 is het wiekenkruis operationeel. Jaarlijks is de molen te bezichtigen op Nationale Molendag en Open Monumentendag.

      Let op:
      - het vierkant met taps toelopende, achtkantige bovenbouw en bovenhuis
      - de gaanderij op de overgang van het brede naar het smalle gedeelte van het achtkant
      - de gesneden makelaar, een replica uit 2006
      - de driezijdige erker van de rechter schuur
    attributes:
      built: circa 1663 in Amsterdam; in Weesp herbouwd in 1820
      architect: J.D. van Arkel (verbouwing 1951)
      original_use: Steen- en loodwitmolen, later olie- en korenmolen
    sources:
      - https://data.amsterdam.nl/monumenten/e6d98f4f-6123-4cd4-8316-da7fe5ab9c62
      - https://nl.wikipedia.org/wiki/%27t_Haantje_(Weesp)

- title: Former miller's house and telegraph office, Korte Stammerdijk 5
  summary: A small detached house on the Smal Weesp, probably once the miller's house of a vanished mill called Het Anker. For a while it was the telegraph office, and the counter is still there.
  body: |
    This mansard-roofed house of purple-red handmade brick stands on its own on the dike along the Smal Weesp. According to the city register it was probably the miller's house of a neighbouring mill called Het Anker, which no longer stands. In 1938 its owner, the grain merchant R. Pfeiffer, who also owned the mill, had it remodelled by the Weesp architect J.D. van Arkel. Before that it had six-pane windows and a hipped roof. Van Arkel added a bay window and dormers with leaded glass. For a time the house served as the telegraph office, and its counter window survives.

    The register values it as a characteristic detached house whose position on the dike matters to the townscape. Another monument guide calls it a gardener's house of around 1870, so its first use is not quite settled.

    Look for:
    - the mansard roof with old Dutch glazed tiles and a pretty dormer
    - the entrance on the east side with a fine door and a lobed fanlight
    - the leaded glass of 1938 in the bay and the shop window of the link building
    - the railing with cast-iron ornaments in front
