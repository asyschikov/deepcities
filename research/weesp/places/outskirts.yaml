  nl:
    title: Plek van de treinramp bij Weesp (1918)
    summary: "Op 13 september 1918 zakte de doorweekte spoordijk bij Weesp weg onder de sneltrein van Amersfoort naar Amsterdam, vlak voor de brug over het kanaal. Er vielen 41 doden: tot 1962 de zwaarste treinramp van Nederland."
    body: |
      De locomotief haalde de brug, de rijtuigen erachter niet. Sneltrein 102 vertrok op vrijdag 13 september 1918 om 9.46 uur uit Amersfoort: locomotief HSM 520 met elf rijtuigen. Om 10.25 uur, op de helling van station Weesp omhoog naar de spoorbrug over het Merwedekanaal (nu het Amsterdam-Rijnkanaal), gaf de dijk het over zo'n 90 meter op. De loc stond al op de brug en bleef in het ijzerwerk hangen. De drie rijtuigen erachter gleden het talud af en drukten zich in elkaar. Ze waren van hout en spatten uiteen; daar vielen de meeste van de 41 doden en 42 gewonden.

      Een chirurg die toevallig in de trein zat, begon met eerste hulp. Twee artsen uit Weesp, vier nonnen en soldaten uit de buurt schoten te hulp. Schepen die over het kanaal voeren, werden aangehouden om gewonden naar de Amsterdamse ziekenhuizen te varen. Onder de doden waren wielrenner en schaatsenmaker Henri Gorter en Firmin De Smet, de enige zoon van de Belgische schilder Gustave De Smet, twintig jaar oud.

      De onderzoekscommissie onder minister Lely kwam tot de slotsom dat lang aanhoudende regen het zand van de dijk had verzadigd. Kwelwater uit het kanaal had het water in de dijk zelfs tot boven het maaiveld opgestuwd. Door het trillen van de trein werd het zand week als pap. Naar aanleiding van de ramp kwam er een laboratorium voor grondmechanica aan de Technische Hogeschool in Delft. De speld staat ongeveer op de plek, aan de Weesper kant van de huidige spoorbrug.

      Let op:
      - hoe hoog de spoordijk oploopt naar de brug over het kanaal
      - het kanaal zelf, waarlangs de gewonden per boot werden afgevoerd
    sources:
      - https://nl.wikipedia.org/wiki/Treinramp_bij_Weesp
      - https://www.nhnieuws.nl/nieuws/231222/treinramp-weesp-vandaag-honderd-jaar-geleden

- title: De Hogeweyk dementia village
  summary: "Since 2009 some 150 people with severe dementia live here in ordinary houses on streets, squares and a lime-tree lane, with their own supermarket, café, restaurant and theatre. It draws international attention. It is people's home, not an attraction."
  body: |
    De Hogeweyk replaced the conventional Hogewey nursing home with something that looks like a small neighbourhood. On about 1.2 hectares, residents live in groups of six or seven in 23 to 27 houses, each with its own front door onto an inner street, a large living room and its own outdoor space. Each house follows a lifestyle (crafts, Christian, cultural, "Gooi" upper-middle-class, homely, urban or Indies) so people live with others who share their habits. Inside the walls there are squares, a park with a pond, a supermarket, a hairdresser, a café, a restaurant and a theatre, and residents can walk around freely; the only way out is one staffed entrance.

    The concept was developed within the care organisation itself (now Vivium Zorggroep), with Buro Kade of 's-Hertogenbosch designing the low-rise complex and the landscape architect Roozen the outdoor spaces. It was completed around 2009 and extended in 2018. It has drawn wide international attention and receives study visits, it has won prizes in both care and architecture, and American media compared it to the film *The Truman Show*.

    What a visitor can do: the restaurant and the theatre are open to people from outside, and the neighbourhood is encouraged to come to concerts and meals, but you enter through the reception and the houses and streets are the residents' private space. Professional study visits can be booked through the founders. Don't come to sightsee or photograph residents.

    Look for:
    - from Heemraadweg: the closed outer ring of houses, with all front doors facing inwards
    - the Hogewey Theater on the Theaterplein, used for concerts open to all
  category: housing
