- title: De Melkkoe gable stone, Dammerweg 10
  summary: "A 19th-century farm on the east side of the Vecht with a gable stone reused from its predecessor, inscribed \"de melkkoe 1747\" (the milk cow)."
  body: |
    The farm at Dammerweg 10 is a *dwarshuis* farm of around 1860; its house has a cellar under its full width, and there may be older parts inside. Set into it is a gable stone reused from the farm that stood here before, inscribed "de melkkoe 1747" (the milk cow).

    The farm lies on the Dammerweg, the road along the east side of the Vecht.

    Look for:
    - the gable stone "de melkkoe 1747"
