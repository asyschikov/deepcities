  nl:
    title: Gemeenschapsmolen (Gaaspermolen)
    summary: "Rietgedekte poldermolen van rond 1707 aan de Gaasp bij Driemond. Toen in 1926 een motorgemaal het werk overnam, ging de kop eraf. Sinds de herbouw in 2003 pompt hij weer water uit de Gemeenschapspolder."
    body: |
      In 1926 nam een dieselgemaal het pompen over, en van de molen werd het bovenste deel afgezaagd. Pas toen dat gemaal in 1993 versleten was, kreeg de molen een tweede leven.

      Het begon in 1707: acht kleine polders in Diemen, Weesperkarspel en Muiden werden één, de Gemeenschapspolder, en twee molens moesten die droog houden. Dit is de overgebleven molen. De eikenhouten romp is van rond 1707 en staat op gemetselde penanten met veldmuren ertussen, op een sleutelplek in het oude waterstelsel, vlak aan de Gaasp.

      Eerst schepte een scheprad het water omhoog. In 1892–1893 kwam er een vijzel voor in de plaats, met nieuwe gemetselde watergangen; hij hoorde bij de laatste molens die zo werden gemoderniseerd. Na 1993 besloot men de molen te herstellen. De Amsterdamse burgemeester Job Cohen nam hem op 25 april 2003 weer in gebruik. Eigenaar is het Hoogheemraadschap Amstel, Gooi en Vecht. De molen maalt nog, maar er wordt in gewoond en je kunt er niet naar binnen.

      Op dit deel van de oude Weespertrekvaart, de zeventiende-eeuwse vaart van Amsterdam naar Weesp, is de molen de blikvanger, met de provinciale weg aan de zuidkant. Landelijker dan hier wordt de route niet.

      Let op:
      - de rietgedekte achtkant op de stenen voet en de brede wieken
      - de gemetselde watergangen van 1893
    attributes:
      built: ca. 1707; vervijzeld 1893; herbouwd 2002–2003
      original_use: Poldermolen
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/504564
      - https://nl.wikipedia.org/wiki/Gemeenschapsmolen

- title: Farm with summer house, Lange Stammerdijk 12-14
  summary: "A dwarshuis farm on the dike by the Gaasp at Driemond, with a living wing set across the front (perhaps 18th century or older) and a separate summer house: a survivor of the farming municipality of Weesperkarspel, whose polders became the Bijlmermeer."
  body: |
    The Lange Stammerdijk runs along the Gaasp at Driemond, on the same dike as the Gemeenschapsmolen. This farm is a piece of the farming landscape of the former municipality of Weesperkarspel, whose polders Amsterdam won for the Bijlmermeer; the municipality was dissolved in 1966, and Driemond went to Amsterdam.

    The national register is brief: a farm with a *dwarsgeplaatst woongedeelte* (a living wing set crosswise in front of the cowshed), of the 18th century or older, with a question mark, and a *zomerhuis* (summer house).

    Look for:
    - the broad front of the crosswise house
    - the separate summer house beside it
