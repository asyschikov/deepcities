  nl:
    title: Boerderij met zomerhuis, Lange Stammerdijk 12-14
    summary: "Een boerderij met een dwars voorhuis en een los zomerhuis aan de Lange Stammerdijk bij Driemond. Het register zet een vraagteken bij de ouderdom: 18e eeuw of ouder? Een overblijfsel van Weesperkarspel, de gemeente waarvan de polders de Bijlmermeer werden."
    body: |
      Zelfs het Rijk weet het niet zeker. Het monumentenregister beschrijft deze boerderij in één regel en zet er een vraagteken achter: het woonhuis zou uit de 18e eeuw stammen, of van nog vroeger. Naast de boerderij staat een apart zomerhuis.

      Het woonhuis ligt dwars, als een brede kop voor de koeienstal. Dat heet een dwarshuis. De Lange Stammerdijk loopt langs de Gaasp bij Driemond, en aan diezelfde dijk staat ook de Gemeenschapsmolen.

      De boerderij lag in Weesperkarspel, een gemeente van boeren en polders. Amsterdam wilde die polders hebben voor de Bijlmermeer, en kreeg ze ook. In 1966 hield Weesperkarspel op te bestaan en ging Driemond naar Amsterdam. Deze boerderij aan de dijk is een stukje van dat verdwenen boerenland.

      Let op:
      - de brede voorkant van het dwarse woonhuis
      - het losse zomerhuis ernaast
    attributes:
      built: 18e eeuw of ouder
      original_use: Boerderij met zomerhuis
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/6617
      - https://nl.wikipedia.org/wiki/Driemond

- title: Former waterworks house, Provincialeweg 16
  summary: "A 1901 service house of Amsterdam's municipal waterworks at the Weesperkarspel pumping station, beside the plant that still turns seepage water from the Bethunepolder into drinking water for Amsterdam east of the Amstel. Being listed now."
  body: |
    On the Provincialeweg near Driemond, a house of 1901 stands beside the Weesperkarspel water plant. The city register calls it the former *dienstwoning* (service house, where a staff member lived on site) of the Gemeente Waterleidingen Amsterdam at the Weesperkarspel pumping station. Amsterdam started the procedure to make it a municipal monument; it is not yet listed.

    The plant next to it is still one of Amsterdam's two drinking-water works. Seepage water collected in the Bethunepolder near Maarssen flows to the Waterleidingplas at Loenderveen, cleans itself there for about 100 days, and is then piped to Weesperkarspel for final treatment. Amsterdam east of the Amstel gets its drinking water from here. The house is private.

    Look for:
    - the house of 1901 beside the Weesperkarspel water plant
