    summary: "Sinds 2009 wonen hier zo'n 150 mensen met zware dementie in gewone huizen aan straatjes, pleinen en een lindelaan, met een eigen supermarkt, café, restaurant en theater. Internationaal trekt het veel aandacht. Het is hun thuis, geen bezienswaardigheid."
    body: |
      Amerikaanse media vergeleken het met The Truman Show: een complete buurt waar de bewoners allemaal dementie hebben. In 2009 kwam De Hogeweyk in de plaats van het gewone verpleeghuis Hogewey. Op ruim een hectare staan 23 tot 27 huizen, elk met zes of zeven bewoners, een eigen voordeur aan een binnenstraat, een ruime woonkamer en een eigen stukje buiten.

      Wie bij wie woont, hangt af van de leefstijl. Er zijn er zeven, van christelijk en Indisch tot Goois, stads, cultureel, huiselijk en ambachtelijk. Zo zitten mensen met dezelfde gewoontes aan tafel. Binnen de buitenring liggen pleinen, een park met vijver, een supermarkt, een kapper, een café, een restaurant en een theater. Bewoners lopen vrij rond. Naar buiten kan alleen via één bemande ingang.

      Het idee ontstond binnen de zorgorganisatie zelf, nu Vivium Zorggroep. Buro Kade uit 's-Hertogenbosch ontwierp de laagbouw, landschapsarchitect Roozen de buitenruimte. Rond 2009 was het klaar, in 2018 volgde een uitbreiding. Het trok internationaal veel belangstelling, er komen studiebezoeken, en het won prijzen in de zorg en in de architectuur.

      Als bezoeker: het restaurant en het theater zijn er ook voor mensen van buiten, en de buurt is welkom bij concerten en maaltijden. Je komt binnen via de receptie, en de huizen en straten zijn van de bewoners. Studiebezoeken voor vakmensen lopen via de oprichters. Kom niet om rond te kijken of bewoners te fotograferen.

      Let op:
      - vanaf de Heemraadweg: de gesloten ring van huizen, met alle voordeuren naar binnen gekeerd
      - het Hogewey Theater aan het Theaterplein, waar concerten voor iedereen zijn
    attributes:
      built: ca. 2009; uitgebreid 2018
      original_use: Woonbuurt voor mensen met dementie
    sources:
      - https://nl.wikipedia.org/wiki/Hogeweyk
      - https://www.rivm.nl/duurzamezorg/aan-de-slag/praktijkvoorbeelden-architectuur/de-hogeweyk

- title: Aetsveldseweg and the lost village of Overaetwijs
  summary: A grass track across the Aetsveld polder that is really a natural creek ridge. People lived on it around 300–200 BC, and a medieval settlement called Overaetwijs stood here too. Nothing to see but the line itself, which is the point.
  body: |
    From Fort Hinderdam an old road runs through the meadows of the Aetsveldse Polder, though as a narrow grass path it is hard to recognise as a road. It is not a man-made dike: the *Aetsveldseweg* is a *kreekrug*, a natural creek ridge. That slightly higher ground was the base from which the surrounding land was reclaimed, and it is protected as an earth-science monument.

    People lived on the stream banks here in prehistory. A dig in 1966 found charcoal, burnt bone, iron ore and pottery dated to about 300–200 BC, the Late Iron Age; two stretches are national archaeological monuments. Historical documents also place the late-medieval settlement of Overaetwijs here, on the bank of a peat stream known as the Aetwisel. In 1873 three polders, among them the Overaetsveldse, were merged into the Aetsveldse Polder.

    The polder has a military twist: it is the only polder inside the main line of the Stelling van Amsterdam that could be flooded, so that the inundations of the Vecht and the old Merwedekanaal joined up. The Aetsveldroute walk (13.5 km, from Weesp station) uses this track just past Hinderdam, and the route leaflet says walking it feels like a finale.

    Look for:
    - the slight rise of the track above the wet meadows
    - the grass path towards Fort Hinderdam
    - the open view of a polder designed to disappear under water
