    - rce:38499; city:beabf68b (haystack description with cultural-historical context)
    - https://www.nhnieuws.nl/nieuws/299303/drone-onderzoek-naar-middeleeuwse-kasteelruine-onder-de-grond-in-weesp
  nl:
    title: Boerderij Huis ten Bosch en de plek van het kasteel
    summary: Lage 18e-eeuwse pachtboerderij in de bocht van de Vecht, naast het weiland waar kasteel Ten Bosch stond tot het in 1672 werd verwoest. Op dezelfde plek staat al sinds minstens 1732 een hooiberg.
    body: |
      De boerderij en de hooiberg zijn gesitueerd op het landgoed Huis ten Bosch, in de bocht van de Vecht ten zuidwesten van Fort Uitermeer. Op de gronden ten oosten van de boerderij, thans weiland, heeft naar alle waarschijnlijkheid het middeleeuwse kasteel Ten Bosch gestaan dat verwoest werd in 1672. Een deel van het grachtenstelsel is in het huidige landschap nog herkenbaar. In 2022 deden archeologen met een drone onderzoek naar de ruïne; opgraven staat niet op het programma.

      De boerderij dateert uit de late zeventiende of achttiende eeuw en werd gebouwd als pachtboerderij om de gronden te kunnen beheren. Delen van het metselwerk van het dwarsgeplaatste woonhuis stammen nog uit die periode. Tot in de late twintigste eeuw behield de boerderij haar functie. Rond 2000 is de voormalige stal verbouwd tot woonhuis en is de boerderij gesplitst.

      Ook de geschiedenis van de hooiberg op het erf gaat ver terug in de tijd. Op een gravure van Abraham de Haen uit 1732 is een boerderij met hooiberg getekend. Op het kadastraal minuutplan uit 1818 is op vrijwel exact dezelfde plek als waar de huidige hooiberg staat, ook een zeskantige kapberg ingetekend. De huidige hooiberg, een drieroeder met betonnen roeden en een zeskantige kap, is gebouwd in 1973 en verving een ouder exemplaar met houten roeden en een rietgedekte kap. Tot circa 2000 was de hooiberg middels een zogenaamde hooisluis met het stalgedeelte verbonden.

      Let op:
      - de grachtresten van het kasteelterrein in het weiland ten oosten van de boerderij
      - de zeskantige kap van de hooiberg pal ten zuiden van de boerderij
    attributes:
      built: late 17e of 18e eeuw; hooiberg 1973
      original_use: Pachtboerderij van het landgoed Huis ten Bosch
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/38499
      - https://www.nhnieuws.nl/nieuws/299303/drone-onderzoek-naar-middeleeuwse-kasteelruine-onder-de-grond-in-weesp

- title: Nelly's Hoeve and the stolp farm, Utrechtseweg
  summary: Two neighbours on the Utrechtseweg. A stolp farm of around 1900 under a tall pyramid roof, a type almost unknown south of the IJ, and Nelly's Hoeve (1877), whose foundation stone was "laid by Nelly Dyserinck".
  body: |
    The *stolpboerderij* is the classic farm of North Holland above the IJ: house, cowshed and hay store all under one tall pyramid roof. South of the IJ the type is extremely rare, which makes the Utrechtseweg odd: it had three, built around 1900. Of those, no. 92 is the only one still fairly intact, and it was built at the same time as its right-hand neighbour no. 90. The tent roof is covered entirely in smoked pantiles, with a tall chimney beside the short ridge; the front has a cornice, an intact front door with fanlight and heavy sash frames. Behind it stand a haystack with concrete poles and a farm garden with fruit trees and pleached limes.

    A few doors on, **Nelly's Hoeve** (nos. 86-86a) is a long-house farm with a symmetrical front: a central door with a cast-iron tree of life in the fanlight, six-pane sashes, a round-headed upper window with radiating glazing bars, and richly scalloped bargeboards. Beside the door a foundation stone reads "Gelegd door Nelly Dyserinck 14-4-1877", and the wrought-iron gate spells "Nelly's hoeve" in curly letters. The cowshed was converted into a home in 1988.

    Look for:
    - the steep pyramid roof of no. 92 seen from the road
    - the foundation stone of 1877 and the tree of life in the fanlight at no. 86
    - the scrolled name in the entrance gate of Nelly's Hoeve
