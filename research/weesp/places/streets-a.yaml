    - { label: Wikipedia (nl) Stolpersteine in Weesp, url: "https://nl.wikipedia.org/wiki/Lijst_van_Stolpersteine_in_Weesp" }
    - { label: Joods Monument (David Vleeschhouwer), url: "https://www.joodsmonument.nl/nl/page/120642/david-vleeschhouwer" }
