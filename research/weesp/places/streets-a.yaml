  nl:
    title: Laatmiddeleeuws huis, Slijkstraat 27
    summary: "Achter een winkelpui uit 1898 zit een huis dat volgens het register voor Weesp zeer oud is: van vóór de stadsbrand van 1509, met eiken spanten, ingehakte telmerken en laatgotische balksteunen."
    body: |
      Vanaf de straat zou je het nooit raden. Je ziet een neorenaissancepui uit 1898, met gecanneleerde pilasters en twee winkeldeuren (er zaten ooit twee winkels in), en daarboven baksteen met T-vormige ramen. Toch moet de kern van dit diepe huis ouder zijn dan 1509, het jaar van de grote stadsbrand. Dat leiden onderzoekers af uit sporen in de grond en uit de manier waarop het is gebouwd. Het was toen een stenen huis met een houtskelet dat niets droeg.

      In het voorhuis staan nog vier eiken spanten. De timmerlieden hakten er hun telmerken in: rechte streepjes aan de ene kant, halve maantjes aan de andere, en hoger op gegutste tekens. Rond 1550, al zet het register daar een vraagteken bij, werd het huis in de lengte gesplitst met een dunne muur. De houten stijlen maakten toen plaats voor consoles van zandsteen; daarvan is er één als kopie bewaard. Rond 1800 kwamen er nieuwe kozijnen, in 1898 de huidige voorgevel en het afgeknotte dak. Het register noemt het huis voor Weesp zeer oud, met laatgotische details, en van belang voor de hele streek.

      Let op:
      - de neorenaissancepui met in het midden twee deuren
      - de achterkant van het huis, met de gepleisterde, afgeknotte gevel
    attributes:
      built: vóór 1509; voorgevel 1898
      original_use: Woonhuis, later twee winkels
    sources:
      - https://data.amsterdam.nl/monumenten/7d314fef-b3b9-4b42-97b1-34298fc59170

- title: Middenstraat and its side streets
  summary: "The street laid out around 1550 between the Hoogstraat and the Nieuwstraat, with a 1894 carpenter's workshop, a socialist's art deco shopfront and on the Zandstraat a very early example of the deep timber-framed house."
  body: |
    The Middenstraat (middle street) was laid out around 1550 between the old dike street and the Nieuwstraat, near the Jonge Convent, a convent whose remains have their own place. Narrow lanes (steegjes) run off it to both sides. The ensemble is pinned on Middenstraat 12, a 17th-century gable with herringbone brickwork along its edges and stone caps at the corners and top.

    Middenstraat 22-24 and Sint Annastraat 1 form one double house whose inner structure survives complete, with the stair still in its original place. Middenstraat 49-51 was fitted out in 1894 as a carpenter's workshop, with two hoisting hatches flanked by round-arched cast-iron windows. At no. 56 the shopfront was commissioned by G.A. Vader, a leading local socialist; the register calls it a rare, intact art deco front for Weesp (the house behind was rebuilt after a fire in 1988). At the south end, Middenstraat 78 and Zandstraat 2 were once one corner house, and Zandstraat 3 is a deep timber-framed house from at least the early 17th century, perhaps older, a very early example of a type that later became common.

    The corner house at the Dirk Marcussteeg (also numbered Nieuwstraat 21) closes the ensemble at the north. In front of Middenstraat 93 lie six Stolpersteine for the Presser family.

    Look for:
    - Middenstraat 12: the 17th-century gable with herringbone brickwork
    - Middenstraat 49-51: hoisting hatches and cast-iron windows of 1894
    - Middenstraat 55-65: a row of five 19th-century houses under one roof
    - Middenstraat 56: the art deco shopfront
    - Middenstraat 60-62: a dormer with pediment and hoist beam on a 17th-century house
    - Middenstraat 64-66: a low double house along the Kapelsteeg
    - Middenstraat 78: a spout gable with a wooden cap
    - Zandstraat 3: the plastered gable with a finial and shoulder stones
    - Sint Annastraat 6-10: a double carriage door with an iron-barred fanlight
