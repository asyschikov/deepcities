  nl:
    title: Voormalig raadhuis van Weesperkarspel
    summary: "Weesperkarspel had zijn raadhuis niet in Weesperkarspel. Van 1924 tot 1966 bestuurde die uitgestrekte plattelandsgemeente zich vanuit dit herenhuis in Weesp, tot Amsterdam het grootste deel van haar grond opslokte voor de Bijlmer."
    body: |
      Weesperkarspel had een raadhuis, maar het stond niet in Weesperkarspel. De gemeente (1817–1966) besloeg een enorm gebied, in een wijde boog om de vestingstad Weesp heen, van Diemen tot het Gooi. Er woonden alleen weinig mensen, en ruim een eeuw had het bestuur geen eigen dak. De raad kwam op allerlei plekken bijeen, een tijd lang zelfs op de bovenste verdieping van het stadhuis van de buren.

      In 1922 overleed de laatste bewoonster van dit huis, de weduwe Van der Muelen. Haar man had in 1881 geld gegeven voor grond en gebouw van de eerste christelijke lagere school van Weesp. De gemeente kocht het pand en nam het in 1924 in gebruik als raadhuis. Zo kwam het bestuur in Weesp terecht, en niet in De Geinbrug (nu Driemond), het grootste dorp binnen de eigen grenzen.

      Het huis is ouder dan zijn gevel. De kern is mogelijk 18e-eeuws; in 1866 kwam er een nieuw voorhuis met kelder, een neoclassicistische voorgevel en een hoge stoep. In de laatste jaren telde het college nog maar twee mensen: de burgemeester en één wethouder. In 1966 kreeg Amsterdam na lange onderhandelingen het grootste deel van het grondgebied, om er de Bijlmermeer te bouwen; de rest ging vooral naar Weesp. Daarna zaten hier nog ambtenaren van Amsterdam en later de sociale dienst van Weesp, tot het pand werd verkocht en weer een gewoon woonhuis werd.

      Het is een particulier huis: kijk vanaf de straat.

      Let op:
      - de hoge stoep en het licht vooruitspringende middendeel
      - de sobere neoclassicistische gevel, die nog altijd iets van een klein raadhuis heeft
    attributes:
      built: 18e eeuw (kern), 1866 (voorhuis)
      original_use: Woonhuis; raadhuis 1924–1966
    sources:
      - https://nl.wikipedia.org/wiki/Raadhuis_van_Weesperkarspel
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/38524

- title: Former meat hall, Hoogstraat 11-12
  summary: "A long, deep house on the Hoogstraat that was once Weesp's public meat hall. A stone with a butcher's cleaver and the year 1623 survives in the back wall, and one of the town's burgomasters lived here."
  body: |
    From the street this looks like a tidy 18th-century house with a cornice and a plastered porch with a round arch. The archives say more: this is where Weesp had its *vleeshal*, the hall where meat was sold in public. Much of that building appears to survive inside the very long house, which goes back to the 17th century and was much altered in the 18th.

    The proof is at the back: a gable stone showing a *hakmes* (butcher's cleaver) and the year 1623. It probably sat in the front wall and was moved to the back during a rebuilding. One of the members of Weesp's college of burgomasters lived in the house. Inside, the remains of a hearth are lined with manganese-purple 18th-century tiles.

    The cleaver stone is in the back wall and can't be seen from the Hoogstraat.

    Look for:
    - the 18th-century brick front with its cornice
    - the later plastered porch with a round arch
  category: hidden-history
  lat: 52.308212
  lng: 5.042921
  address: Hoogstraat 11-12, Weesp
