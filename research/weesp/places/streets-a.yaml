    rank: Okay
    heritage_status: National monument
    monument_number: "38492"
    built: 17th century (core), about 1750 (front)
    original_use: House and workshop
  photos:
    - commons:File:Weesp - Binnenveer 11 RM38492.JPG
  sources:
    - rce:38492 (register description and ownership history)
    - https://nl.wikipedia.org/wiki/Lijst_van_Stolpersteine_in_Weesp
  nl:
    title: Binnenveer 11 en zijn bewoners
    summary: "Een klokgevel van rond 1750 aan de Smal Weesp, met een registertekst die leest als een straatgeschiedenis: van een vrouwelijke zadelmaker en een banketbakker tot koopman David Vleeschhouwer en zijn vrouw, in 1943 weggevoerd en vermoord."
    body: |
      Een zadelmaakster, een schipper, een aannemer, twee bakkers en een koopman: allemaal hadden ze dit huis in bezit. Wat Binnenveer 11 bijzonder maakt is niet de bescheiden klokgevel van rond 1750, met een gebogen bekroning en krullen op de hoeken boven een latere winkelpui, maar het verhaal dat uit het kadaster naar boven is gehaald. De kern van het huis is waarschijnlijk uit het tweede kwart van de 17e eeuw.

      Tot 1836 was het van de erfgenamen van de weduwe van Pieter Peelen. Rond 1836 begon Catharina Groewer hier een zadelmakerij. Ze zette de zaak voort van Jan Groewer en diens vader Andries, tot ze in 1858 failliet ging. Daarna kwamen een schipper en een aannemer, en vanaf 1868 banketbakker Gerhardus Koopmans, die het huis samenvoegde met Achtergracht 3 erachter. Na hem kwam broodbakker Geerlig Pieter van Asselt.

      In 1926 kocht koopman David Vleeschhouwer het pand. Op 1 juni 1943 werden hij en zijn vrouw Henriëtte Mietje Vleeschhouwer-Menko vanuit Westerbork weggevoerd. Drie dagen later werden ze in Sobibor vermoord. Nog in 1943 werd het huis verkocht aan een bedrijf uit Amsterdam, mogelijk onder dwang. Voor de deur liggen twee Stolpersteine.

      Let op:
      - de klokgevel met gebogen bekroning en voluten op de hoeken
      - de twee Stolpersteine voor David en Henriëtte Vleeschhouwer
    attributes:
      built: 17e eeuw (kern), midden 18e eeuw (voorgevel)
      original_use: Werk-woonhuis
    sources:
      - https://monumentenregister.cultureelerfgoed.nl/monumenten/38492
      - https://nl.wikipedia.org/wiki/Lijst_van_Stolpersteine_in_Weesp

- title: Bridge keepers' houses, Verlengd Buitenveer
  summary: A neo-Renaissance double house with stepped gables on the dike of the Amsterdam-Rijnkanaal, built around 1885 for the keeper of a canal bridge and his assistant. The bridge went in 1934; the houses and their pleached limes stayed.
  body: |
    When the Merwedekanaal (now the Amsterdam-Rijnkanaal) was dug in 1884–1893, a double service house was built here for the keepers of its bridge. This one, on the canal dike at the end of the Verlengd Buitenveer, was a double house: the bridge keeper lived at no. 25 and his assistant at no. 24. The bridge over the canal here was demolished in 1934, but the house remained and is now two private homes.

    It is a single storey under a roof sunk between two stepped gables, with a stepped centre bay crowned by a wrought-iron weathervane and three brick chimneys on the ridge. Red brick is enlivened with plastered bands, decorative anchors and patterned brick in the arches over the windows, which still have wooden shutters. The pleached limes along the front are part of the picture. The register values it for its style and its prominent place on the canal.

    Look for:
    - the stepped gables and the weathervane on the centre bay
    - the plastered bands at sill and lintel height
    - the pleached lime trees along the front
  category: infrastructure
  lat: 52.303926
  lng: 5.022164
  address: Verlengd Buitenveer 24-25, Weesp
