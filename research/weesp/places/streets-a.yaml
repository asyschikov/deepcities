  nl:
    title: Mouterij De Oranjeboom
    summary: "Een hoog, sober bakstenen gebouw van drie lagen aan de Nieuwstad, met helemaal bovenin de gevel een steen met het jaartal 1799. Mouterij en brouwerij in een stad die dreef op bier en jenever; volgens het register uniek voor Weesp."
    body: |
      Wie omhoog kijkt, ziet helemaal bovenin de voorgevel het jaartal 1799. In de achtergevel zit nog een steen, met 1798.

      Eeuwenlang werd in Weesp bier gebrouwen, en vanaf de zeventiende eeuw vooral brandewijn en jenever gestookt. De Oranjeboom was een mouterij en brouwerij: een diep, fors gebouw van drie lagen onder een hoog schilddak. De gemeente noemt het in zijn soort uniek voor Weesp.

      De paarsrode handvormsteen is aan de straatkant strakker en fijner gemetseld dan aan de andere kanten, en de kleine oorspronkelijke raamopeningen zijn grotendeels bewaard. Toen het mouten voorbij was, werd er speelgoed opgeslagen, zat er een lichtdrukkerij en een kantoor. In 2008–2009 is het pand gerenoveerd. De grote dakopbouwen aan de zijkanten zijn nieuw.

      Let op:
      - de jaartalsteen helemaal bovenin de voorgevel
      - de kleine oorspronkelijke raamopeningen
      - het fijnere metselwerk van de straatgevel
    attributes:
      original_use: Mouterij en bierbrouwerij
    sources:
      - https://data.amsterdam.nl/monumenten/5860b99c-79e2-4dd1-bf93-69edb010575f
      - https://nl.wikipedia.org/wiki/Weesp

- title: Former cantor's house, Sleutelsteeg
  summary: "A small house of 1878 in an alley off the Nieuwstraat, built by the synagogue council for the cantor of Weesp's Jewish community. Three Stolpersteine lie at its door for the cantor, his wife and their lodger, forced out in 1942."
  body: |
    Weesp's Jewish community was small and never had a rabbi of its own, so its *voorzanger* (cantor) led the services and in practice the community. In 1878 the synagogue council built a modest house for him here in the Sleutelsteeg, a lane named after the old De Sleutel brewery, close to the synagogue on the Nieuwstraat. A stone by the entrance carried both 1878 and the Jewish year 5638. The national register lists it as the former rabbi's house, of significance for the cultural history of the Jewish part of the population.

    From 1926 the cantor was Samuel van der Hal, who lived here with his wife Rieka van der Hal-Denneboom and their family; Hartog Goldstein, who had been a foreman at a rag factory, boarded with them. In April 1942 the family was forced to move to Amsterdam. Hartog Goldstein was murdered in Sobibor in March 1943; Samuel and Rieka van der Hal were deported from Westerbork on 31 August 1943 and murdered days later. Of the 65 members of the Weesp community, seven came back.

    The house is a private home.

    Look for:
    - the three Stolpersteine in front of no. 3
    - the wooden cornice and the plain two-storey front of 1878
